# artifacts/data/service-agreements.yaml (S-4; schema service-agreements; M-2 adds
# effectiveness). Written whole by S-4 (P-16 wrote the environments, C-1 the CSSP agreement
# SVA-001, kept here). One agreement per provider named in inherited_from in the family files,
# the CSSP first, with the same provider string (SVCA-001). The enterprise identity broker
# provides no inherited control; its onboarding approval is interconnection IC-3 in boundary.yaml.
# M-2 (2027-02-01): one effectiveness record per agreement, measured by the ISSM on the cycle's
# records (to 2026-11-15, ASM-026).
dodin_connected: true
system_environments: [cloud]
agreements:
  - id: SVA-001
    provider: PRV-04
    role: cssp
    integration: external
    instrument: support-agreement
    reference: "ECSSP-SA-ARSPO-01 (fictional)"
    environments: [cloud]
    scope: "24x7 security monitoring of the logs EFRAS forwards, incident response support, vulnerability alerts and a monthly external scan of the edge for the production cloud account; cybersecurity point of contact with the cloud service provider"
    parameters: "Near-real-time log forwarding over TLS to the ECSSP collector; ECSSP keeps forwarded logs one year and alerts on its use cases; EFRAS reports a suspected incident within one hour and acknowledges a vulnerability alert within one working day"
    approved_by: PER-AO
    evaluation:
      scheme: "DoD O-8530.01-M"
      authorized_by: USCYBERCOM
      date: "2025-09-15"
    validation:
      by: PER-ISSM
      date: "2026-04-01"
      covers: [roles, responsibilities, scope, applicability]
    services:
      - id: SRV-01
        name: "Security monitoring of forwarded logs"
        kind: monitoring
        responsibilities:
          - {party: service-provider, duty: "Monitor forwarded logs 24x7 against its use cases, keep them one year, alert the ISSO and on-call engineer and send a monthly summary"}
          - {party: subscriber, duty: "Forward edge, application, cluster, database and cloud account logs and node endpoint telemetry in near real time, and review its own logs weekly"}
        controls: [si-4, au-6]
      - id: SRV-02
        name: "Incident response support"
        kind: incident-response
        responsibilities:
          - {party: service-provider, duty: "Detect, declare, categorize and analyze incidents, advise on containment and report onward to DoD CERT and the AO's office"}
          - {party: subscriber, duty: "Report suspected incidents within one hour, contain, eradicate and recover inside the account, and act on the CSSP's direction"}
        controls: [ir-4, ir-6]
      - id: SRV-03
        name: "Vulnerability alerts and external scanning"
        kind: vulnerability-detection
        responsibilities:
          - {party: service-provider, duty: "Send vulnerability alerts and directed actions and scan the edge monthly from outside"}
          - {party: subscriber, duty: "Scan inside the account weekly, acknowledge alerts within one working day, remediate within the ra-5 response times and report status on the ticket"}
        controls: [ra-5]
    effectiveness:
      - date: "2027-02-01"
        service: SRV-01
        measured_by: PER-ISSM
        measure: "Monthly summary received and alerts triaged for the cycle's records (to 2026-11-15): summary of 2026-11-15 received, no incident, two export volume alerts resolved with the supervisor, no break-glass use"
        rating: effective
        issue: {status: none}
      - date: "2027-02-01"
        service: SRV-03
        measured_by: PER-ISSM
        measure: "Vulnerability alerts timely and acted on, and the monthly external scan received: the managed Kubernetes alert led to the provider's patch of 2026-11-09; no external scan report for the cycle is in the program's records"
        rating: degraded
        issue: {status: open, description: "The CSSP's monthly external scan report did not reach the program's monitoring records for the cycle; the ISSM asked the CSSP to send it with the next monthly summary."}
    sources: [INT-060.A2, INT-060.A3, INT-118.A1, INT-108.A1, INT-098.A1, INT-115.A1, ASM-016, product/architecture.md#leveraged, product/architecture.md#logging, INT-208.A3, INT-207.A1, INT-207.A2]
  - id: SVA-002
    provider: PRV-01
    role: cloud-service-provider
    integration: external
    instrument: contract
    reference: "Component enterprise cloud contract, EFRAS task order (fictional)"
    environments: [cloud]
    scope: "IL4 platform services for the program-owned production account: managed Kubernetes, managed PostgreSQL, object storage, key service, network and compute, with the physical, infrastructure and media protections of its DoD provisional authorization"
    parameters: "Contract under DFARS Subpart 239.76; customer responsibility matrix in eMASS; monthly continuous monitoring deliverables on the Component portal; managed service patching in announced windows"
    approved_by: PER-AODR
    validation:
      by: PER-ISSM
      date: "2026-11-18"
      covers: [roles, responsibilities, scope, applicability]
    services:
      - id: SRV-04
        name: "Data center physical protection and media sanitization"
        kind: other
        responsibilities:
          - {party: service-provider, duty: "Control physical access to its data centers and sanitize every storage device before it leaves its control"}
          - {party: subscriber, duty: "Keep privileged access workstations, which are outside the boundary, in controlled space and request no data center access"}
        controls: [pe-3, mp-6]
      - id: SRV-05
        name: "Managed service patching and storage durability"
        kind: other
        responsibilities:
          - {party: service-provider, duty: "Patch the hypervisor, control plane and database engine, publish the hardened node image monthly, and keep backups durable across availability zones"}
          - {party: subscriber, duty: "Roll worker nodes to the latest node image, patch containers, and configure and test database backups and point-in-time recovery"}
        controls: [si-2, cp-9]
    effectiveness:
      - date: "2027-02-01"
        service: SRV-05
        measured_by: PER-ISSM
        measure: "Managed service patches applied in announced windows and node scans clean: control plane patched on 2026-11-09 after the CSSP alert; node scan of 2026-11-14 with no high or critical finding"
        rating: effective
        issue: {status: none}
    sources: [INT-117.A2, INT-119.A1, INT-119.A2, INT-113.A2, INT-071.A1, INT-096.A1, product/architecture.md#leveraged, INT-208.A3, product/monitoring/cycle-2026-11.md#threat]
  - id: SVA-003
    provider: PRV-02
    role: common-control-provider
    integration: external
    instrument: sla
    reference: "Component enterprise cloud access point service-level agreement (fictional)"
    environments: [cloud]
    scope: "Boundary protection and traffic inspection between NIPRNet and the EFRAS load balancer"
    parameters: "Only the access point path reaches the load balancer on 443; the program gives notice before opening a new port; traffic logs go to the CSSP"
    approved_by: PER-AODR
    validation:
      by: PER-ISSM
      date: "2026-11-18"
      covers: [roles, responsibilities, scope, applicability]
    services:
      - id: SRV-06
        name: "Boundary protection and inspection"
        kind: detection
        responsibilities:
          - {party: service-provider, duty: "Inspect and filter every session to the EFRAS edge and keep the traffic logs for the CSSP"}
          - {party: subscriber, duty: "Keep its subnets, security groups, WAF rules and egress allow-list, and notify before opening a new port"}
        controls: [sc-7]
    effectiveness:
      - date: "2027-02-01"
        service: SRV-06
        measured_by: PER-ISSM
        measure: "Evidence of inspection and filtering of sessions to the EFRAS edge in the cycle's records"
        rating: degraded
        issue: {status: open, description: "No access point inspection report or traffic log evidence reached the program's monitoring records for the cycle; the ISSM asked the access point service for its report for 2026-11 to 2027-01."}
    sources: [INT-117.A2, INT-113.A1, INT-071.A2, product/architecture.md#network, INT-208.A3]
  - id: SVA-004
    provider: PRV-03
    role: common-control-provider
    integration: external
    instrument: sla
    reference: "Example Software Factory tenant service-level agreement (fictional)"
    environments: [cloud]
    scope: "Pipeline, security scanning, hardened and signed base images, artifact repository and supply chain vetting for every EFRAS image"
    parameters: "EFRAS pulls only through the factory's repository and verifies signatures at admission; the factory reports scan findings and its POA&M items to the program"
    approved_by: PER-AODR
    validation:
      by: PER-ISSM
      date: "2026-11-18"
      covers: [roles, responsibilities, scope, applicability]
    services:
      - id: SRV-07
        name: "Pipeline security scanning"
        kind: vulnerability-detection
        responsibilities:
          - {party: service-provider, duty: "Run static, dependency, image and dynamic scans on every build and keep the evidence"}
          - {party: subscriber, duty: "Own its code, tests and test plan, and fix what the scans find"}
        controls: [sa-11]
      - id: SRV-08
        name: "Signed hardened images and supply chain vetting"
        kind: other
        responsibilities:
          - {party: service-provider, duty: "Vet upstream sources, mirror approved packages, sign images, check ingested packages for counterfeits and report them"}
          - {party: subscriber, duty: "Pin dependencies by hash, pull only through the repository, refuse unsigned images at admission and stop a release on a failed check"}
        controls: [sr-3, sr-11]
    effectiveness:
      - date: "2027-02-01"
        service: SRV-07
        measured_by: PER-ISSM
        measure: "Scans run on every build and nightly, and findings reported to the program: the nightly rescan of 2026-11-14 reported the two open highs and a new medium (INV-016)"
        rating: effective
        issue: {status: none}
      - date: "2027-02-01"
        service: SRV-08
        measured_by: PER-ISSM
        measure: "Hardened, signed base image delivered when the program needs it: the hardened base image the report container fix waits on is about three months late with no committed date"
        rating: degraded
        issue: {status: open, description: "The factory's late hardened base image holds the efras-report fix (POAM-002, POAM-003, COND-02); the program requested the factory's patched intermediate image and works the issue with the factory before raising it further."}
    sources: [INT-117.A2, INT-116.A1, INT-071.A3, INT-111.A2, product/architecture.md#leveraged, INT-208.A3, product/monitoring/cycle-2026-11.md#vuln-scan]
  - id: SVA-005
    provider: PRV-05
    role: common-control-provider
    integration: internal
    instrument: dod-component-issuance
    reference: "Component privacy program issuance (fictional)"
    environments: [cloud]
    scope: "The Component SORN for aviation maintenance records, privacy awareness training, and review of PII processing and the PIA"
    parameters: "The privacy representative reviews every change that touches PII; the office keeps the SORN and approves the PIA"
    approved_by: PER-AODR
    validation:
      by: PER-ISSM
      date: "2026-11-18"
      covers: [roles, responsibilities, scope, applicability]
    services:
      - id: SRV-09
        name: "Privacy program services"
        kind: other
        responsibilities:
          - {party: service-provider, duty: "Keep the SORN and its authority and purposes, deliver privacy training and review PII processing changes and the PIA"}
          - {party: subscriber, duty: "Keep the PII inventory, restrict processing to the SORN's elements and purposes, and route PII changes to the privacy representative"}
        controls: [at-2, pt-2, pt-3]
    effectiveness:
      - date: "2027-02-01"
        service: SRV-09
        measured_by: PER-ISSM
        measure: "PII processing changes and the PIA reviewed: the office's review of 2026-11-13 and its review of release 1.6 against the PIA"
        rating: effective
        issue: {status: none}
    sources: [INT-117.A2, INT-106.A1, INT-106.A2, INT-080.A1, product/privacy.md#authority, INT-208.A3, product/monitoring/cycle-2026-11.md#privacy, INT-205.A1]
sources: [INT-047.A1, INT-048.A1, INT-060.A3, INT-117.A2]
