cryptography:
  fips_validated_compartment: false
  fips_validated_unclassified: true
  nsa_approved: false
  key_management: "Program-owned keys in the cloud key service (CMP-KMS), FIPS 140 validated: one key per data store (database, object storage, snapshots, logs), rotated yearly, replicated to the second region for recovery, destroyed after a 30-day wait; the key inventory (key ID, store, owner, rotation date) is in the CI-DATA template; TLS certificates for the edge come from the DoD PKI and are tracked by the ISSO."
  key_management_process: "The provider's FIPS 140-validated key service generates and holds the keys; key policies are code in CI-DATA; only the pipeline role and the key administrators named by the ISSM can use or change them; every key use is logged to CMP-LOGS."
  uses:
    - id: CRY-01
      function: "Data in transit: TLS at the edge and re-encryption inside the virtual network, mutual TLS for the EMIS extract"
      algorithm: "TLS 1.2 or 1.3 with DoD-approved cipher suites (AES-GCM, ECDHE)"
      policy_basis: "CNSSP 15"
      acquisition_basis: "CNSSP 15"
    - id: CRY-02
      function: "Data at rest: database, object storage, snapshots and logs"
      algorithm: "AES-256 in the provider's FIPS 140-validated key service"
      policy_basis: "CNSSP 15"
      acquisition_basis: "CNSSP 15"
    - id: CRY-03
      function: "Image and provenance signing in the software factory pipeline, verified at cluster admission"
      algorithm: "ECDSA P-256 with SHA-256"
      policy_basis: "CNSSP 15"
      acquisition_basis: "CNSSP 15"
  vulnerabilities: []
