  requirements: "The Privacy Act and DoDI 5400.11 duties for the maintainer PII: collection only under the existing Component SORN and only its five data elements; notice through the SORN and the sign-in banner; use limited to the SORN purposes; the PIA (draft 0.9, approval before production data); retention and disposal per the records schedule with the monthly purge; de-identified exports (salted pseudonyms in release 1.6); breach response through the Component privacy office; and the controls the Privacy Overlay adds (pt-2, pt-3, ra-8, si-12, at-2 and the privacy parts of ir-6, sc-28 and cm-2)."
  assessment_methods: "The SCA examines the SORN, the PIA and the data map, tests the ingest field filter and the purge job, and tests re-identification of a sample export. Metrics: PII elements outside the SORN found in the database (target zero), purge runs completed on time, exports re-identifiable in the sample (target zero after release 1.6), and breach reports made within one hour."
