# artifacts/data/system-description.yaml (C-1; M-1 updates it; schema system-description).
ownership: government-owned-contractor-operated
function: "Cloud-hosted, decision-support web application for naval aviation readiness. Every night it pulls maintenance actions, part removals and aircraft status from EMIS and supply status from the supply status service, loads them into its database, shows squadron, air wing and fleet readiness dashboards, and scores a part-failure forecast for the next 30 days so maintenance officers can order parts early. Officers export PDF and slide reports; fleet analysts export de-identified data sets; data scientists retrain the model in an isolated sandbox. It never writes back to EMIS, orders parts or changes aircraft status. It is networked, not stand-alone: users reach it over NIPRNet only, through the enterprise cloud access point, so it connects to the DODIN directly through that one DISN attachment."
physical_environment:
  building: "No program-owned building houses the system: every component runs in the Example GovCloud IL4 region's data centers (provider-designated sites, inherited from the provider's DoD provisional authorization). The only program-held equipment, the ERST privileged access workstations, are government-furnished and kept in the program's controlled office space."
  walls_and_ceilings: "Data center construction is the cloud provider's and is documented in its provisional authorization package (inherited PE controls); the program office space is ordinary government office construction, not a vault or secure room."
  physical_security: "Data center guards, cameras, badge and access controls are the cloud provider's, inherited from its IL4 provisional authorization; the program office space is in a badge-controlled government building."
  validation: none
