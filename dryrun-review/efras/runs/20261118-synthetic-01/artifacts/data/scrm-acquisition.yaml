    screening:
      - {list: sdn, result: clear, date: "2026-11-18"}
      - {list: ssi, result: clear, date: "2026-11-18"}
      - {list: fse, result: clear, date: "2026-11-18"}
      - {list: sam-exclusions, result: clear, date: "2026-11-18"}
      - {list: capta, result: clear, date: "2026-11-18"}
