subcontractors: false
requirements: [REQ-07, REQ-17]
terms:
  - term: qualifying-condition
    requirements: [REQ-07, REQ-17]
    statement: "The contractor develops only on the authorized software factory and delivers an SBOM and a secure development attestation with each release."
    sources: [INT-053.A1]
  - term: revalidation
    requirements: [REQ-17]
    statement: "The contractor's C-SCRM posture is revalidated yearly by self-attestation and the factory's third-party pipeline assessment."
    sources: [INT-053.A1]
  - term: reporting
    requirements: [REQ-17]
    statement: "The contractor reports any supply chain compromise or change of ownership to the ISSM within 72 hours."
    sources: [INT-053.A1]
  - term: response-roles
    requirements: [REQ-17]
    statement: "The contractor, the ISSM and the software factory each carry a defined role in a supply chain incident response."
    sources: [INT-053.A1]
  - term: termination
    requirements: [REQ-17]
    statement: "The government may terminate when a change to supply chain risk cannot be mitigated."
    sources: [INT-053.A1]
revalidation:
  methods: [self-attestation, third-party-assessment]
  interval: P1Y
  sources: [INT-053.A1]
charge_card_purchases: false
procurement_steps:
  - step: plan-procurement
    considerations: "The acquisition strategy names authorized providers and the software factory as the only build path."
    sources: [INT-053.A3]
  - step: define-requirements
    considerations: "REQ-07 and REQ-17 are written into the statement of work."
    sources: [INT-053.A3]
  - step: market-analysis
    considerations: "Vendor research of 2025-08-15 covered ownership and prior intrusions."
    sources: [INT-053.A3, INT-037.A5]
  - step: complete-procurement
    considerations: "Supplier screenings and C-SCRM clauses are completed before award or modification."
    sources: [INT-053.A3]
  - step: ensure-compliance
    considerations: "The COR checks SBOMs and attestations at each release."
    sources: [INT-053.A3]
  - step: monitor-performance
    considerations: "The ISSM reviews factory reports and supplier changes monthly."
    sources: [INT-053.A3]
selection:
