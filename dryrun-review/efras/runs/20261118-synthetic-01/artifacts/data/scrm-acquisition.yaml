      - {list: ndaa-889, result: clear, date: "2026-11-18"}
      - {list: other-federal-restriction, result: clear, date: "2026-11-18"}
    selected: true
    other_agency_requirements: "DFARS 252.204-7012 and NIST SP 800-171 requirements under other agencies' contracts."
    vendor:
