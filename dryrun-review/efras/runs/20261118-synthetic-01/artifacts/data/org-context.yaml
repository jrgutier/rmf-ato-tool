iscm:
  established: "2024-10-01"
  program_status: in-place
  governance:
  - "Component risk board approves the strategy and receives quarterly posture reports"
  - "CISO continuous monitoring working group runs the program day to day"
  policies:
  - subject: security-status-monitoring
    reference: "Component assessment and continuous monitoring procedure (POL-02)"
  - subject: security-status-reporting
    reference: "Component assessment and continuous monitoring procedure (POL-02)"
  - subject: monitoring-frequencies
    reference: "Component assessment and continuous monitoring procedure (POL-02)"
  - subject: tools
    reference: "Component assessment and continuous monitoring procedure (POL-02)"
  - subject: results-to-risk-assessment
    reference: "Component assessment and continuous monitoring procedure (POL-02)"
  processes:
  - name: "Vulnerability and configuration scanning"
    mode: automated
  - name: "Asset discovery"
    mode: automated
  - name: "Log correlation by the CSSP"
    mode: automated
  - name: "Control assessments"
    mode: manual
    verified: true
    verified_by: PER-CISO
  - name: "Account reviews"
    mode: manual
    verified: true
    verified_by: PER-CISO
  - name: "POA&M reviews"
    mode: manual
    verified: true
    verified_by: PER-CISO
  objectives:
  - id: OBJ-01
    objective: "Keep control effectiveness known for every system and common control provider"
  - id: OBJ-02
    objective: "Detect unauthorized change"
  - id: OBJ-03
    objective: "Keep threat and vulnerability awareness current"
  - id: OBJ-04
    objective: "Keep visibility of all organizational assets"
  activities:
  - name: "Annual control assessment of a third of each system's controls"
    objectives: [OBJ-01]
  - name: "Monthly configuration baseline checks"
    objectives: [OBJ-02]
  - name: "Weekly vulnerability scanning and CSSP alerts"
    objectives: [OBJ-03]
  - name: "Continuous asset discovery reconciled with inventories"
    objectives: [OBJ-04]
  monitors: [control-effectiveness, changes, organizational-state, threat-and-vulnerability-awareness, asset-visibility]
  not_applicable: []
  minimum_frequencies:
  - family: ra
    frequency: weekly
    applies_to: [systems, common-controls]
    basis: "Vulnerability scanning of cloud-hosted and internet-facing systems; shortened from monthly at the 2026-09-15 review"
  - family: cm
    frequency: monthly
    applies_to: [systems, common-controls]
    basis: "Configuration baseline checks"
  - family: au
    frequency: weekly
    applies_to: [systems, common-controls]
    basis: "Audit log review"
  - family: ac
    frequency: quarterly
    applies_to: [systems]
    basis: "Account reviews"
  - family: si
    frequency: monthly
    applies_to: [systems, common-controls]
    basis: "Flaw remediation status"
  - family: ir
    frequency: annually
    applies_to: [systems]
    basis: "Incident response plan test"
  - family: cp
    frequency: annually
    applies_to: [systems]
    basis: "Contingency plan test"
  - family: ca
    frequency: annually
    applies_to: [systems, common-controls]
    basis: "Assessment of at least a third of each system's controls each year, all within the authorization period"
  review_cycle:
    frequency: annually
  reviews:
  - date: "2025-09-30"
    by: PER-CISO
    considered: [threats, monitoring-results]
    strategy_adjusted: false
    outcome: "Strategy kept as it was"
  - date: "2026-09-15"
    by: PER-CISO
    considered: [threats, monitoring-results, requirements]
    strategy_adjusted: true
    outcome: "Vulnerability scanning minimum shortened from monthly to weekly for cloud-hosted and internet-facing systems"
  assessments:
  - date: "2026-03-16"
    by: "Component inspector general team (fictional)"
    method: SP 800-137A
    reported_to: [PER-CIO]
    findings:
    - id: IF-01
      response: "Retain manual control assessment evidence consistently in the Component repository"
      priority: moderate
      owner: PER-CISO
      due: "2026-12-31"
  ongoing_authorization:
    process: "The AO decides from monitoring data instead of a fixed reauthorization once a system qualifies"
    conditions: [initial-authorization, iscm-program]
    transition: "A system with an initial authorization whose monitoring meets the Component program may request it; none transitions at its initial decision"
    remain: ["Dashboard reports current", "Risk within tolerance", "No High finding past its remediation date"]
    reporting_tools: ["Component continuous monitoring dashboard"]
  sources: [INT-016.A1, INT-016.A2, INT-016.A3, INT-017.A1, INT-017.A2, ASM-007]
