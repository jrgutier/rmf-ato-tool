risk_frame:
  assumptions:
  - "Persistent nation-state interest in readiness and logistics data"
  - "Reliance on commercial cloud and shared DoD platforms"
  - "The DoD network boundary and CSSP services are in place for every system"
  constraints:
  - "Purchases go through shared contract vehicles"
  - "Platform controls are inherited and cannot be changed by programs"
  - "Fielding dates are fixed by operational need"
  priorities:
  - "Availability of readiness and logistics information to the mission"
  - "Integrity of that information"
  - "Privacy of personnel records"
  tradeoffs:
  - "Some schedule is traded for remediating High findings before fielding"
  tolerance:
  - loss_type: "mission operations"
    level: moderate
  - loss_type: "organizational assets"
    level: moderate
  - loss_type: "individuals (privacy)"
    level: low
  - loss_type: "other organizations"
    level: low
  - loss_type: "the Nation"
    level: low
  shaped_by: [governance, mission]
  sources: [INT-004.A2, INT-005.A1, ASM-004]
governance:
  model: hybrid
  reserved_decisions:
  - decision: "Concurrence before an ATO for a system whose overall risk is High or Very High"
    reserved_to: PER-CIO
  - decision: "Acceptance of Very High risk to individuals' privacy"
    reserved_to: PER-PRIV
  risk_executive:
    form: group
    led_by: saorm
    structured_by: saorm
    members: [PER-RE, PER-CIO, PER-CISO, PER-PRIV, PER-AO]
    forums:
    - name: "Quarterly enterprise risk forum of the Component risk board"
      considers: [all-types-and-sources, aggregated-risk]
    oversight: "Reviews every High and Very High risk decision and a sample of the others for consistency with the strategy"
    strategic_view: "Builds a broad-based view from the portfolio risk register across systems, shared platforms and mission threads"
    communication:
    - vehicle: "Quarterly risk posture report"
      audience: [authorizing-officials, senior-leaders, internal-stakeholders]
    - vehicle: "Briefings to mission partners and the DoD CIO"
      audience: [external-stakeholders, senior-leaders]
    subordinate_autonomy:
    - activity: frame
      autonomy: "Subordinate commands and PEOs may add their own assumptions to the Component frame"
    - activity: assess
      autonomy: "They may choose assessment methods within the Component guidance"
    - activity: respond
      autonomy: "They may respond to Moderate and lower risk on their own"
    - activity: monitor
      autonomy: "They may set monitoring frequencies at or above the Component minimum"
    shared_authorizations: "The board names a lead AO, and the AOs sharing an authorization sign a joint memorandum"
  tolerance_resolution: "Differing tolerances between AOs or mission areas are resolved by the risk board, applying the stricter tolerance until it decides"
  sources: [INT-005.A2, INT-004.A2, ASM-004]
risk_assessment_guidance:
  methods: "NIST SP 800-30 Rev. 1, semi-quantitative five-level scale, threat and vulnerability based"
  tools: "Component risk register template"
  roles: "ISSM with the ISSE performs; the SCA reviews; the AO receives"
  rigor: "Moderate for business systems, high for mission systems"
  results_form: "Risk register entries with risk statement, likelihood, impact and level"
  threat_sources: "Adversarial, accidental, structural and environmental, from Component threat briefings and CSSP reporting"
  threat_events: "SP 800-30 Appendix E threat events, tailored by the Component"
  vulnerabilities: "Scan results, assessment findings and open POA&M items"
  external_dependencies: "Cloud and platform providers are assessed as sources of risk"
  impacts: "Missions, assets, individuals, other organizations and the Nation"
  time_frames: "One-year horizon"
  likelihood: "Combination of likelihood of initiation and likelihood of adverse impact"
  uncertainty: "Stated with each rating"
  aggregation: "By shared platform and by mission thread"
  information_sources: ["CSSP alerts", "CISA and DoD advisories", "Scan data", "SCA reports"]
  sources: [INT-005.A3, ASM-004]
risk_response:
  types: [accept, avoid, mitigate, share, transfer]
  selection: "The AO compares the risk with the tolerance and the cost of each course of action"
  strategies:
    acceptance: "Only within the AO's limits; High or Very High needs CIO concurrence"
    avoidance: "Used for unacceptable connections or functions"
    sharing_transfer: "Through providers and agreements"
    mitigation: "Through controls and POA&M items with milestones"
  coa_tools: "Cost, effect and schedule comparison table"
  communication: "Recorded in the POA&M and decision document and briefed to the risk board"
  sources: [INT-005.A4, ASM-004]
