penetration_test:
  scope:
    environment: ["EFRAS pre-production account built from the production templates, with synthetic data", "pilot squadron test accounts for the five roles", "ARSPO operators and the CSSP as defenders"]
    attack_surface: ["web interface and API behind the access point", "report export service", "ingest endpoint for EMIS extracts", "sandbox notebook environment and its NAT egress"]
    threat_sources: ["nation-state actor on NIPRNet (TS-01)", "authorized officer misusing access (TS-03)"]
    objectives: ["read another squadron's or air wing's data", "export maintainer PII outside the system", "reach a public mirror or other destination from the sandbox"]
    level_of_effort: "Two red team testers for five working days, the SCA observing, the CSSP defending"
    rules_of_engagement: "Pre-production only; no denial of service or social engineering; the ISSO and the CSSP get source addresses and times beforehand; the ISSM may stop the test; critical findings reported within one working day"
  components: [CMP-EDGE, CMP-WEB, CMP-API, CMP-REPORT, CMP-INGEST, CMP-SANDBOX]
  assessor:
    party: internal
    qualified: true
    name: "Component red team (fictional), independent of ARSPO"
  guidance: NIST SP 800-115
  environments: [test]
privacy:
  assessors: [PER-SCA]
  controls: [pt-2, pt-3, ra-8, si-12, at-2, ac-1, ac-2, ac-3, ac-6, ac-17, at-3, au-2, au-6, au-9, au-11, ca-2, ca-3, ca-5, ca-7, cm-2, cm-3, cp-2, cp-9, ia-2, ia-5, ir-4, ir-6, ir-8, mp-6, pe-3, pl-2, pm-5, ps-3, ps-4, ra-3, sa-9, sa-11, sc-7, sc-8, sc-12, sc-28, si-4]
  methodology:
    identified_by: PER-PRIV
    methods: [examine, interview, test]
    metrics: "PII outside the SORN elements (zero); purges on time (every month); re-identifiable exports (zero after release 1.6); breach reports within one hour"
  sources: [INT-146.A1, INT-127.A1, INT-142.A2]
rules_of_engagement: "All testing in the pre-production account with synthetic data, built from the production templates; nothing against production, live data or networks beyond the access point path. Scans are authenticated with accounts the PM issues for the window. The ISSO and the CSSP are told source addresses and times before every scan and test; the ISSM can stop any test; a critical finding goes to the ISSM and the AODR within one working day. No denial of service, no social engineering, no data leaves the account."
sources: [INT-147.A1, INT-147.A2, INT-147.A3, INT-147.A4, INT-147.A5, INT-148.A1, INT-151.A1, INT-151.A2, INT-151.A3, INT-142.A1, INT-143.A1, INT-143.A2, INT-144.A1, INT-144.A3, ART-SSP, product/test-results.md#top]
