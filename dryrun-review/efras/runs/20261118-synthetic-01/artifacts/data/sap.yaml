optimization:
  reviewed_by: PER-SCA
  tailoring_guidance: "The Component's POL-02 asks for SP 800-53A procedures, reuse of results no older than 365 days at the required independence, and examination with re-performance of program self-tests; it adds no further tailoring."
  notes: "One interview round per role (PRC-001) serves all controls. Document examination runs first (sequence 1), interviews second, then technical tests grouped by component so each test account and scan window serves several controls (sequences 3 to 5), with the penetration test week (PRC-012, PRC-015) and the privacy tests last (sequence 6)."
additional_procedures:
  - id: APR-001
    requirement: "REQ-11: the protocols and standards EFRAS uses are selected from the DoD IT Standards Registry and suffice for its interfaces."
    statements:
      - "Each protocol and standard used on the ECAP, identity broker, EMIS and CSSP interfaces is listed in the DoD IT Standards Registry."
      - "The selected standards suffice for each interface's data exchange."
    methods: [examine, interview]
    objects: [specifications, individuals]
    rationale: "No SP 800-53 control states this requirement; S-3 traced it to sa-11, which no developer test verified."
  - id: APR-002
    requirement: "REQ-12: the web interface meets Section 508 accessibility standards and does not block assistive technology."
    statements:
      - "The web interface passes a Section 508 conformance check."
      - "Assistive technology can operate the five role workflows."
    methods: [examine, test]
    objects: [specifications, mechanisms]
    rationale: "Section 508 is outside SP 800-53; S-3 traced it to sa-11, which no developer test verified."
reuse_policy:
