# artifacts/data/sap.yaml (A-2; schema sap). Written whole. The selection, independence and
# consulted officials record A-1 (INT-142 to INT-146); everything else is A-2 (INT-147 to INT-151).
scope:
  include: baseline
  excluded_controls: []
assessment_subjects:
  - type: component
    include: all
  - type: inventory-item
    include: [INV-002, INV-003, INV-004, INV-005, INV-006, INV-008, INV-009, INV-010]
team:
  - persona: PER-SCA
    role: "Lead assessor of the business systems SCA team (Component independent assessment activity), with a cloud and container assessor and a privacy-trained assessor"
    independent: true
    qualification:
      basis: "Delegated SCA for business systems by the Component CISO; DoDM 8140.03 security control assessor qualification met (course completed 2025-08-22, RA-07); team members qualified for IL4 cloud tenants and Privacy Overlay controls"
      verified_by: PER-CISO
      verified: "2026-11-18"
selection:
  selected_by: PER-AODR
  date: "2026-11-18"
  assessment_type: security-and-privacy
  expertise: "Kubernetes on a DoD IL4 cloud region and its inheritance; the managed PostgreSQL service and its STIG; CI/CD in an authorized software factory with signed images and dependency scanning; CAC sign-in through a SAML identity broker; web and API testing of per-squadron data scoping; the Privacy Act, the PIA and the Privacy Overlay"
assessor_independence:
  consulted: [PER-CIO, PER-PRIV, PER-CISO, "Component Office of the Inspector General (audit liaison)"]
  required: independent
  determined_by: PER-AO
  rationale: "A moderate system with both Privacy Overlay variants, about 3,000 maintainers' PII and moderate risks of exfiltration and re-identification (one already demonstrated) must be assessed by people with no stake in the program; the CIO, the privacy officer for the SAOP and the CISO all advised an independent team."
  basis: [ART-CAT, ART-RA]
  sufficiency:
    determined_by: PER-AO
    sufficient: true
    date: "2026-11-18"
    rationale: "The team reports to the Component CISO outside the PEO and ARSPO, is neither funded nor rated by the program, has not designed, built or operated any EFRAS component, and its qualifications are verified."
  achieved_by: assessor
objectives: "Determine whether each of the 50 controls of the tailored baseline, including the privacy controls, is implemented correctly, operating as intended and producing the desired outcome, so that the AO can decide on authorization before the 2027-02-01 MVCR deployment, and give the program the findings it needs for the POA&M."
level_of_effort: "Three assessors over 17 working days (2026-11-19 to 2026-12-11), with ERST support hours and a five-day red team penetration test with two testers, funded from the FY27 assessment line ($180K)."
approval:
  reviewed_by: PER-SCA
  approved_by: PER-AODR
  date: "2026-11-18"
preparation:
  informed_by: PER-PM
  officials_notified:
    - {persona: PER-AO, date: "2026-11-18"}
    - {persona: PER-AODR, date: "2026-11-18"}
    - {persona: PER-ISSM, date: "2026-11-18"}
    - {persona: PER-IO, date: "2026-11-18"}
    - {persona: PER-PRIV, date: "2026-11-18"}
    - {persona: PER-CSSP, date: "2026-11-18"}
  resources:
    allocated_by: PER-PM
    allocated: "2026-11-18"
    description: "FY27 assessment line ($180K): ERST support hours, the red team week, test accounts for the five roles in pre-production"
  access:
    - {to: system, provided_by: PER-PM, provided: "2026-11-18"}
    - {to: environment, provided_by: PER-PM, provided: "2026-11-18"}
    - {to: documentation, provided_by: PER-PM, provided: "2026-11-18"}
    - {to: records, provided_by: PER-PM, provided: "2026-11-18"}
    - {to: artifacts, provided_by: PER-PM, provided: "2026-11-18"}
    - {to: test-results, provided_by: PER-PM, provided: "2026-11-18"}
  documentation_provided: [ART-SSP, ART-CAT, ART-RA, ART-BND, ART-INV, ART-REQ, ART-CMP, ART-CP, ART-IRP, ART-CONMON, ART-STIG, ART-PIA, ART-SVCA]
  elements:
    - {responsible_for: "The security plan, the plan set and the eMASS record", persona: PER-ISSM}
    - {responsible_for: "Account, log and incident records and the scan schedule", persona: PER-ISSO}
    - {responsible_for: "Security architecture, configuration baselines and pipeline gates", persona: PER-ISSE}
    - {responsible_for: "Source code, images, the pipeline records and the DT support", persona: PER-DEV}
    - {responsible_for: "The SORN, the PIA and the privacy plan", persona: PER-PRIV}
    - {responsible_for: "The providers' plans, assessment reports and responsibility matrices", persona: PER-CCP}
  channels:
    - {among: [PER-AO, PER-AODR, PER-ISSM], means: "Weekly ISSM brief to the AODR during the assessment, on top of the monthly brief; the AODR informs the AO"}
    - {among: [PER-ISSM, PER-CSSP], means: "Test window notices with source addresses and times before every scan and the penetration test"}
  points_of_contact:
    - {persona: PER-ISSM, for: "Access, accounts and scheduling"}
    - {persona: PER-ISSO, for: "Scans, test windows and log views"}
    - {persona: PER-DEV, for: "Developer interviews, the container checklist review and the DT-2 re-performance"}
    - {persona: PER-CSSP, for: "The CSSP side of the penetration test and the monitoring evidence"}
  ambiguity_mechanism:
    between: [PER-SCA, PER-ISSM]
    means: "Daily stand-up and a shared question log; what they cannot settle goes to the PM and the AODR the same week"
  understanding:
    summary: "The naval aviation PEO's readiness mission depends on EFRAS analytics of maintenance and supply data for about 3,000 users in three pilot squadrons and later the fleet; the Component frames risk through its risk executive, inherits enterprise cloud, boundary, identity, pipeline and CSSP services, and expects the SCA to work under POL-02."
    sources: [ART-ORG-CONTEXT, product/conops.md#mission]
rigor:
  categorization: ART-CAT
  privacy_risk_assessment: ART-RA
  plans: [ART-SSP, ART-CMP, ART-CP, ART-IRP, ART-CONMON]
  assurance_requirements:
    - id: AR-001
      requirement: "Every control is shown implemented correctly and operating as intended."
      specified_by: PER-AODR
      depth: focused
      coverage: focused
    - id: AR-002
      requirement: "The controls behind the moderate exfiltration and re-identification risks and every control the program records as partial are assessed in full, so the POA&M rests on what the assessors saw."
      specified_by: PER-AODR
      depth: comprehensive
      coverage: comprehensive
    - id: AR-003
      requirement: "Inherited controls are confirmed against the provider's authorization package."
      specified_by: PER-AODR
      depth: basic
      coverage: basic
  direction:
    by: PER-AODR
    conferred_with: [PER-SCA]
    factors:
      - "the three-week window before the report is due"
      - "the funded ERST support hours"
      - "first assessment of the system, before the MVCR deployment"
      - "each role interviewed at least once; at least two components per tier and every component holding PII"
procedures:
  - id: PRC-001
    controls: [ac-1, ac-2, ac-3, ac-6, ac-17, at-2, at-3, au-2, au-6, au-9, au-11, ca-2, ca-3, ca-5, ca-7, cm-2, cm-3, cm-6, cm-8, cp-2, cp-4, cp-9, ia-2, ia-5, ir-4, ir-6, ir-8, ma-4, mp-6, pe-3, pl-2, pm-5, ps-3, ps-4, pt-2, pt-3, ra-3, ra-5, ra-8, sa-9, sa-11, sc-7, sc-8, sc-12, sc-28, si-2, si-4, si-12, sr-3, sr-11]
    methods: [interview]
    objects: [individuals]
    depth: focused
    coverage: focused
    rationale: "One interview round per role covers every control at once: the people who write, run and provide the controls say how they work, and the answers steer the examination and the tests."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 2
    assurance_requirement: AR-001
    sampling:
      - method: interview
        types:
          - {type: PER-ISSM, number: 1}
          - {type: PER-ISSO, number: 1}
          - {type: PER-ISSE, number: 1}
          - {type: PER-PM, number: 1}
          - {type: PER-DEV, number: 1}
          - {type: PER-CSSP, number: 1}
          - {type: PER-PRIV, number: 1}
          - {type: PER-CCP, number: 1}
        specific: ["ARSPO ISSM", "EFRAS ISSO", "ERST security engineer", "ECSSP liaison", "Component privacy officer"]
        selection: targeted
        bias_control: "Every role that owns or provides a control is interviewed; answers are corroborated by examination or test, never taken alone"
  - id: PRC-002
    controls: [ac-1, at-2, at-3, ca-2, ca-5, ca-7, ir-8, pm-5, ps-3, ra-3, sa-9]
    methods: [examine]
    objects: [specifications, activities]
    depth: focused
    coverage: focused
    rationale: "Policy, plan and program controls with no mechanism to test: the policies, plans and agreements are examined with the records that show the activity happened (training records, screening records, the risk assessment, the eMASS inventory, provider deliverables)."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 1
    assurance_requirement: AR-001
    sampling:
      - method: examine
        types: [{type: specifications, number: 11}, {type: activities, number: 11}]
        specific: [ART-SSP, ART-CONMON, ART-SVCA, ART-RA]
        selection: random-and-targeted
        bias_control: "Records drawn at random from the full period, plus every record the SSP names"
  - id: PRC-003
    controls: [cp-2, pl-2, ra-8]
    methods: [examine]
    objects: [specifications, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Partial plan controls: the contingency plan and its approval, the plan set and its approvals, and the draft PIA are examined in full against the control text, with the approval and distribution records."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 1
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 3}, {type: activities, number: 3}]
        specific: [ART-CP, ART-SSP, ART-PIA]
        selection: targeted
        bias_control: "The whole population of the three documents is examined; no sampling within them"
  - id: PRC-004
    controls: [ac-2, ac-17, ps-4]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: focused
    coverage: focused
    rationale: "Account management, remote access and leavers: the DT-2 sign-in, timeout and 35-day disable results are examined and re-performed, and the leaver timing the 2026-10-06 account review leaves open is tested against out-processing records."
    risk_results: [ART-RA]
    adaptation: system-specific
    adaptation_note: "Adds a leaver-timing test: out-processing dates of departed squadron users against their disable times in the identity broker and EFRAS."
    sequence: 3
    assurance_requirement: AR-001
    sampling:
      - method: examine
        types: [{type: specifications, number: 3}, {type: mechanisms, number: 2}, {type: activities, number: 3}]
        specific: ["product/test-results.md#account-review", "product/test-results.md#dt-2"]
        selection: random-and-targeted
        bias_control: "Account records drawn at random across the five roles; the two leavers of the 2026-10-06 review are always included"
      - method: test
        types: [{type: mechanisms, number: 2}, {type: activities, number: 1}]
        specific: [CMP-API, CMP-IDB]
        selection: random-and-targeted
        bias_control: "Leavers drawn at random from three months of out-processing records, plus the two known ones"
        extent: [{measure: "leaver records checked", count: 10}, {measure: "DT-2 sign-in and timeout cases re-run", count: 6}]
  - id: PRC-005
    controls: [ac-3, ac-6, ia-2, ia-5]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Access enforcement behind TE-01 and the break-glass deviation: the API and report scoping checks, privileged roles, and the break-glass console and database accounts are examined and tested in full."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 3
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 4}, {type: mechanisms, number: 4}, {type: activities, number: 2}]
        specific: [CMP-API, CMP-REPORT, "break-glass console accounts", "break-glass database role"]
        selection: targeted
        bias_control: "Every privileged role and every break-glass credential is examined; no sampling"
      - method: test
        types: [{type: mechanisms, number: 4}, {type: activities, number: 1}]
        specific: [CMP-API, CMP-REPORT, CMP-WEB]
        selection: random-and-targeted
        bias_control: "Crafted cross-squadron requests across all five roles, plus the PT-1 export path"
        extent: [{measure: "crafted cross-squadron and cross-air-wing requests", count: 100}, {measure: "privileged roles checked", count: 4}]
  - id: PRC-006
    controls: [au-2, au-6, au-9, si-4, ir-6]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: focused
    coverage: focused
    rationale: "Logging, review, protection, monitoring and reporting: event configuration and forwarding to the CSSP are examined and the five-minute delivery of export events re-performed; the CSSP's correlation and reporting are watched during the penetration test."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 4
    assurance_requirement: AR-001
    sampling:
      - method: examine
        types: [{type: specifications, number: 3}, {type: mechanisms, number: 3}, {type: activities, number: 3}]
        specific: [CMP-LOGS, CMP-ECSSP]
        selection: random-and-targeted
        bias_control: "Review records drawn at random from the last three months, plus the CSSP's records of the penetration test window"
      - method: test
        types: [{type: mechanisms, number: 2}, {type: activities, number: 1}]
        specific: [CMP-LOGS, CMP-API]
        selection: targeted
        bias_control: "Test events cover every auditable event type the SSP lists"
        extent: [{measure: "auditable event types triggered and traced to the CSSP", count: 8}]
  - id: PRC-007
    controls: [au-11, ir-4]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Partial: the 90-day log retention against the one-year value and incident handling not yet tied to an approved plan; retention settings and the oldest retrievable record are examined and tested, and the handling steps are walked through with the ISSO and the CSSP."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 4
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 2}, {type: mechanisms, number: 2}, {type: activities, number: 2}]
        specific: [CMP-LOGS, ART-IRP]
        selection: targeted
        bias_control: "Every log store and the whole incident response plan are examined"
      - method: test
        types: [{type: mechanisms, number: 1}, {type: activities, number: 1}]
        specific: [CMP-LOGS]
        selection: targeted
        bias_control: "Retrieval is tried for the oldest day each store should hold"
        extent: [{measure: "log stores queried for their oldest record", count: 3}]
  - id: PRC-008
    controls: [cm-2, cm-3, cm-8, ma-4]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: focused
    coverage: focused
    rationale: "Baselines, change control, inventory and nonlocal maintenance: templates and CCB records are examined and the deployed state compared with the baseline and the inventory."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 3
    assurance_requirement: AR-001
    sampling:
      - method: examine
        types: [{type: specifications, number: 4}, {type: mechanisms, number: 2}, {type: activities, number: 4}]
        specific: [ART-CMP, ART-INV]
        selection: random-and-targeted
        bias_control: "Change records drawn at random from release 1.5.0 to 1.5.1, plus every emergency change"
      - method: test
        types: [{type: mechanisms, number: 2}, {type: activities, number: 1}]
        specific: [CMP-K8S, CMP-DB]
        selection: random
        extent: [{measure: "deployed resources compared with the baseline and the inventory", count: 20}]
  - id: PRC-009
    controls: [cm-6, ra-5, si-2]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Partial: the open STIG items, the two high vulnerabilities in CMP-REPORT and the missed 30-day install time; reuses the SCA-witnessed STIG scan (RR-001), adds the SCA's own scan of release 1.5.1 and the Application Security and Development STIG checklist review of the five containers (BM-04) the program never did."
    risk_results: [ART-RA]
    adaptation: system-specific
    adaptation_note: "Adds the ASD STIG checklist review of INV-002 to INV-006 with the developer, and verifies release 1.5.2 fixes only if they land before the out-brief."
    sequence: 4
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 3}, {type: mechanisms, number: 5}, {type: activities, number: 3}]
        specific: [ART-STIG, INV-002, INV-003, INV-004, INV-005, INV-006]
        selection: targeted
        bias_control: "Every open finding, every container and every remediation ticket since 2026-10-20 is examined"
      - method: test
        types: [{type: mechanisms, number: 8}, {type: activities, number: 1}]
        specific: [INV-008, INV-009, INV-010, INV-006]
        selection: targeted
        bias_control: "The scan covers every node, image and the database instance; no sampling"
        extent: [{measure: "hosts, images and database instances scanned", count: 12}]
  - id: PRC-010
    controls: [cp-4]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Partial: only the database restore was tested; the restore record is examined and the restore re-performed, and the absence of a failover test and of an exercise is recorded as observed."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 5
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 1}, {type: mechanisms, number: 1}, {type: activities, number: 2}]
        specific: [ART-CP, "product/test-results.md#dt-2"]
        selection: targeted
        bias_control: "The whole plan and every test record are examined"
      - method: test
        types: [{type: mechanisms, number: 1}, {type: activities, number: 1}]
        specific: [CMP-DB]
        selection: targeted
        bias_control: "The restore that DT-2 ran is the one re-performed, timed against the recovery objective"
        extent: [{measure: "point-in-time restores re-performed", count: 1}]
  - id: PRC-011
    controls: [cp-9, sc-8, sc-12, sc-28]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: focused
    coverage: focused
    rationale: "Backups and cryptographic protection: backup and key settings are examined and the TLS configuration, encryption at rest and key ownership tested."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 3
    assurance_requirement: AR-001
    sampling:
      - method: examine
        types: [{type: specifications, number: 4}, {type: mechanisms, number: 4}, {type: activities, number: 2}]
        specific: [CMP-KMS, CMP-DB, CMP-OBJ]
        selection: random-and-targeted
        bias_control: "Every store holding PII is included; other stores drawn at random"
      - method: test
        types: [{type: mechanisms, number: 4}, {type: activities, number: 1}]
        specific: [CMP-EDGE, CMP-DB, CMP-OBJ, CMP-KMS]
        selection: targeted
        bias_control: "Every external endpoint and every PII store is tested"
        extent: [{measure: "endpoints and stores tested", count: 8}]
  - id: PRC-012
    controls: [sc-7, ca-3]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Boundary and connections: the subnet tiers, the egress allow-list (PT-3) and the three exchanges are examined in full; the EFRAS end of each connection and the narrowed allow-list are tested in the penetration test (RR-002 supplemented)."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 5
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 4}, {type: mechanisms, number: 3}, {type: activities, number: 2}]
        specific: [CMP-EDGE, CMP-SANDBOX, CMP-INGEST, "EMIS interim approval", "supply status service agreement"]
        selection: targeted
        bias_control: "Every connection and every egress rule is examined"
      - method: test
        types: [{type: mechanisms, number: 3}, {type: activities, number: 1}]
        specific: [CMP-SANDBOX, CMP-EDGE, CMP-INGEST]
        selection: targeted
        bias_control: "Every egress path and every inbound connection is tried"
        extent: [{measure: "egress destinations and connection endpoints tried", count: 25}]
  - id: PRC-013
    controls: [pt-2, si-12]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: focused
    coverage: focused
    rationale: "Privacy authority and retention: the SORN and the data map are examined; the ingest field filter and the monthly purge are tested under the privacy office's methodology."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 6
    assurance_requirement: AR-001
    sampling:
      - method: examine
        types: [{type: specifications, number: 2}, {type: mechanisms, number: 2}, {type: activities, number: 2}]
        specific: [ART-PIA, CMP-INGEST]
        selection: targeted
        bias_control: "The SORN elements are compared one by one with every ingested field"
      - method: test
        types: [{type: mechanisms, number: 2}, {type: activities, number: 1}]
        specific: [CMP-INGEST, CMP-DB]
        selection: targeted
        bias_control: "The test extract carries every field outside the SORN"
        extent: [{measure: "extract fields and purge cases tested", count: 10}]
  - id: PRC-014
    controls: [pt-3]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Partial: exports keep an unsalted DoD ID hash (PT-2); the export pipeline is examined and the re-identification of a sample export re-performed against the privacy office's metric (zero re-identifiable exports)."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 6
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 2}, {type: mechanisms, number: 2}, {type: activities, number: 1}]
        specific: [CMP-REPORT, CMP-FORECAST, "training extract"]
        selection: targeted
        bias_control: "Every export path and the training extract are examined"
      - method: test
        types: [{type: mechanisms, number: 2}, {type: activities, number: 1}]
        specific: [CMP-REPORT, CMP-FORECAST]
        selection: random-and-targeted
        bias_control: "DoD ID numbers for the re-identification test drawn at random from the synthetic population"
        extent: [{measure: "DoD ID numbers tried against a sample export", count: 50}]
  - id: PRC-015
    controls: [sa-11]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: comprehensive
    coverage: comprehensive
    rationale: "Partial: developer testing leaves the CMP-REPORT highs and the PT-3 retest open and verifies neither REQ-11 nor REQ-12; the pipeline gates and DT-2 records are examined (not reused as results, POL-02), a sample re-performed, and APR-001 and APR-002 verify the two requirements."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 5
    assurance_requirement: AR-002
    sampling:
      - method: examine
        types: [{type: specifications, number: 2}, {type: mechanisms, number: 1}, {type: activities, number: 3}]
        specific: ["product/test-results.md#pipeline-1-5", "product/test-results.md#dt-2", ART-REQ]
        selection: targeted
        bias_control: "Every gate and every DT-2 test card is examined"
      - method: test
        types: [{type: mechanisms, number: 3}, {type: activities, number: 1}]
        specific: [CMP-API, CMP-INGEST, CMP-WEB]
        selection: random-and-targeted
        bias_control: "DT-2 cases re-performed drawn at random, plus the tampered extract and the API scoping cases"
        extent: [{measure: "DT-2 test cases re-performed", count: 12}]
  - id: PRC-016
    controls: [sr-3, sr-11]
    methods: [examine, test]
    objects: [specifications, mechanisms, activities]
    depth: focused
    coverage: focused
    rationale: "Supply chain controls and component authenticity: the factory's base image vetting and the hash-pinned dependencies are examined and the admission controller's refusal of an unsigned image tested; the factory's open POA&M item is taken into account."
    risk_results: [ART-RA]
    adaptation: none
    sequence: 5
    assurance_requirement: AR-001
    sampling:
      - method: examine
        types: [{type: specifications, number: 2}, {type: mechanisms, number: 2}, {type: activities, number: 2}]
        specific: [CMP-SWF, ART-SVCA]
        selection: random-and-targeted
        bias_control: "Dependency manifests drawn at random across the five services, plus the report service"
      - method: test
        types: [{type: mechanisms, number: 1}, {type: activities, number: 1}]
        specific: [CMP-K8S]
        selection: targeted
        bias_control: "Both an unsigned and a re-tagged image are tried"
        extent: [{measure: "admission attempts with unsigned or altered images", count: 2}]
  - id: PRC-017
    controls: [pe-3, mp-6]
    methods: [examine]
    objects: [specifications]
    depth: basic
    coverage: basic
