# artifacts/ssp/controls/pm.yaml (S-4; schema ssp-controls). Written whole.
family: pm
controls:
  - control_id: pm-5
    status: implemented
    statement: "Program management control; the Component keeps its inventory of systems in its eMASS instance and reconciles it annually and whenever a system is added or retired. EFRAS's part: it is registered as record EFRAS-0001 (ART-REG), updated at characterization and at categorization approval, and the ISSM updates the record whenever the characterization changes and at least annually. The pre-production environment is not a separate system in the inventory."
    responsible_roles: [PER-PM, PER-ISSM]
    components: [this-system]
    parameters:
      pm-05_odp: "annually, and when systems are added to or removed from the inventory"
    sources: [INT-104.A1, ART-REG]
