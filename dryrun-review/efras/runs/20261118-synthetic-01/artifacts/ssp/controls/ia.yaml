# artifacts/ssp/controls/ia.yaml (S-4; schema ssp-controls). Written whole.
family: ia
controls:
  - control_id: ia-2
    status: partial
    statement: "Partial. Every human user signs in with CAC at the enterprise identity broker. The broker's signed assertion carries the DoD ID number, which CMP-WEB and CMP-API bind to the session and to every audit event, so each action traces to one person; DT-2 passed CAC sign-in for all five roles. Cloud operations engineers reach CMP-K8S and the console through named console roles federated through the broker with CAC. Missing: the two break-glass console accounts authenticate with a FIDO2 hardware key instead of CAC, because the provider console cannot federate when the broker is down. They are sealed, unused to date, and every use alerts. Plan: no technical fix; the deviation goes to the AO for recording and acceptance."
    responsible_roles: [PER-ISSO, PER-ISSE]
    components: [CMP-WEB, CMP-API, CMP-K8S]
    sources: [INT-097.A1, product/architecture.md#identity, product/test-results.md#dt-2, product/conops.md#limitations]
  - control_id: ia-5
    status: partial
    statement: "Partial. CACs are issued, replaced and revoked by the DoD credentialing process outside EFRAS. Workloads on CMP-K8S use workload identity with short-lived tokens and no long-lived access keys. Secrets and keys are held in CMP-KMS under program-owned keys, protected from disclosure and rotated annually or on suspected compromise. The only passwords, those of the local break-glass database role, are changed at least every 180 days (the CNSSI 1253 value). The ISSO issues the two FIDO2 break-glass keys in person against identification, keeps them sealed and re-keys them when anyone who knew the sealing changes role. Missing: the local break-glass database role's password complexity falls short of the PostgreSQL STIG (scan of 2026-10-22). Plan: fixed in release 1.5.2, planned 2026-12-10. Update (M-1, CHG-003, plan change 1.3): release 1.5.2 did not ship; the password policy reached pre-production with release 1.6 on 2027-01-15 and the break-glass password was reset under it; the control stays partial until the SCA rescans (STG-002, COND-05)."
    responsible_roles: [PER-ISSO, PER-ISSE]
    components: [CMP-K8S, CMP-KMS]
    parameters:
      ia-05_odp.01: "passwords (the local break-glass database role) not to exceed 180 days; program keys and secrets annually; workload tokens per session; FIDO2 keys on change of custodian"
      ia-05_odp.02: "suspected compromise or a change of custodian"
    sources: [INT-097.A2, product/architecture.md#identity, product/test-results.md#stig-scan, INT-204.A1, INT-193.A1]
