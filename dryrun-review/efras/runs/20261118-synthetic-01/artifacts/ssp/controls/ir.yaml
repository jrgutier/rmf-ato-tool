# artifacts/ssp/controls/ir.yaml (S-4; schema ssp-controls). Written whole.
family: ir
controls:
  - control_id: ir-4
    status: partial
    statement: "Partial. Hybrid with the CSSP. In place: the CSSP performs detection and analysis, correlating the forwarded CMP-LOGS stream 24x7, declaring and categorizing incidents and opening a ticket to the ISSO and ISSM, under one handling playbook it applies to every Component system it serves, which keeps rigor and results comparable (d). Inside the boundary the ERST on-call engineer contains (isolates a workload with a network policy, revokes a workload identity or console role, blocks a source at CMP-EDGE) and eradicates and recovers through the pipeline (redeploy from signed images and version-controlled templates, database point-in-time restore, tested once in DT-2 at 3 h 10 min); the ISSO leads for the program and keeps the ticket. Missing: no incident response plan exists yet, so handling is not yet consistent with a plan (a), is not coordinated with contingency planning, whose plan is itself a draft (b, see cp-2), and has no lessons-learned step feeding procedures, training and tests (c); no incident and no exercise has happened. Plan: ART-IRP written in S-4 and approved by 2026-12-15 (ir-8); first incident response tabletop with the contingency tabletop in 2027-02."
    responsible_roles: [PER-ISSO, PER-CSSP, PER-ISSM]
    components: [this-system]
    inherited_from: "Example Cybersecurity Service Provider"
    inherited_risks: "The CSSP cannot act inside the EFRAS cloud account; if the on-call hand-off fails, containment waits on the program."
    sources: [INT-098.A1, INT-099.A1, INT-072.A1, product/conops.md#limitations, product/test-results.md#dt-2]
  - control_id: ir-6
    status: implemented
    statement: "Hybrid with the CSSP. Every user, administrator and ERST engineer reports a suspected incident to the CSSP operations center and the EFRAS ISSO within one hour of discovery; the contact is on the sign-in banner page and in the runbook, and annual awareness training covers it. The ISSO informs the AODR, and the Component privacy office within one hour for a suspected breach of maintainer PII. The CSSP reports incident information onward to the designated DoD central point of contact (DoD CERT) and to the AO's office within the DoD cyber incident handling timelines."
    responsible_roles: [PER-ISSO, PER-CSSP]
    components: [this-system]
    inherited_from: "Example Cybersecurity Service Provider"
    parameters:
      ir-06_odp.01: "1 hour"
      ir-06_odp.02: "the Example Cybersecurity Service Provider, which reports to the designated DoD central point of contact (DoD CERT); the AO through the AODR; and the Component privacy office for suspected PII breaches"
    sources: [INT-098.A2, INT-099.A2, INT-072.A1]
  - control_id: ir-8
    status: planned
    statement: "Planned. No incident response plan exists yet. The ISSM writes it in this task (ART-IRP and incident-response.yaml) with the CSSP: it gives the roadmap, structure and place of the program's capability within the Component and the CSSP's service, defines reportable incidents, the hand-off to the CSSP and the PII breach path, sets metrics (time to report, time to contain), names the resources the program funds and the sharing of incident information, and designates the ISSO as incident lead, the ERST on-call engineers for containment and recovery and the CSSP for detection and analysis. The product manager approves it, with the ISSM's review and the Component CISO office's concurrence, by 2026-12-15. The ISSM reviews it annually and after every incident or exercise, updates it for system and organizational changes and problems found in exercises, and sends the plan and each change to its holders. It is kept in the program document repository with access limited to those holders."
    responsible_roles: [PER-ISSM, PER-PM]
    components: [this-system]
    parameters:
      ir-08_odp.01: "the product manager (approval), with the ISSM's review and the Component CISO office's concurrence"
      ir-08_odp.02: "annually, and after every incident or exercise, incorporating lessons learned"
      ir-08_odp.03: "the EFRAS ISSO (incident lead), the ERST on-call engineers (containment and recovery) and the Example Cybersecurity Service Provider (detection and analysis)"
      ir-08_odp.04: "all personnel with a role in the plan: the ISSO, the ISSM, the ERST on-call engineers"
      ir-08_odp.05: "the Example Cybersecurity Service Provider and the Component privacy office"
      ir-08_odp.06: "all personnel with a role in the plan: the ISSO, the ISSM, the ERST on-call engineers"
      ir-08_odp.07: "the Example Cybersecurity Service Provider and the Component privacy office"
    artifact_locations:
      - "ART-IRP and artifacts/data/incident-response.yaml (to be written in S-4)"
      - "Program document repository, restricted to the plan's holders"
    sources: [INT-099.A3, INT-098.A1, product/stakeholders.md#roles]
