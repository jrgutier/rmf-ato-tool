family: pl
controls:
  - control_id: pl-2
    status: partial
    statement: "Partial. The security and privacy plans are written (the per-family statements, ART-SSP and the supporting plans) and were updated at I-2 to the as-implemented state (plan set version 1.1, 2026-11-18). They draw on the earlier tasks' artifacts for the enterprise architecture fit, components (ART-INV), mission context and operating environment (ART-SD), roles (ART-STAKE), information types (ART-INFOTYPES), categorization and its rationale (ART-CAT), threats (ART-RA), requirements (ART-REQ), the baseline, overlays and tailoring rationale (ART-BASELINE) and the dependencies and connections (ART-BND). Planning and coordination run with the Component privacy officer, the ISSO, the ISSE, the CSSP and the common control providers. The Component privacy officer approved the privacy plan and the AODR, for the AO, approved the plan set with changes on 2026-11-18 (a.15). Missing: the PM has not yet approved the contingency, incident response and configuration management plans (due 2026-12-15, a condition of the AODR's approval), and the privacy risk assessment result the plans give is a draft PIA still with the Component privacy office (a.8). The ISSM distributes the plans and each change, reviews them annually and with each major release, updates them after changes and assessment findings, and keeps them in the program document repository and the eMASS record with role-based access."
    responsible_roles: [PER-ISSM, PER-ISSE]
    components: [this-system]
    parameters:
      pl-02_odp.01: "the Component privacy officer, the ISSO, the ISSE, the CSSP and the common control providers"
      pl-02_odp.02: "the AO and AODR, the Component privacy officer, the ISSO, the ISSE, the SCA and the CSSP"
      pl-02_odp.03: "annually and with each major release"
    artifact_locations:
      - "artifacts/ssp/controls/*.yaml and ART-SSP"
      - "Program document repository and the Component eMASS record EFRAS-0001"
    assurance:
      addressed: "The ISSM keeps the plans under document control with their review and approval record; the assessor examines the approved plans and the distribution and review record."
      status: planned
    sources: [INT-103.A1, product/privacy.md#pia, product/stakeholders.md#roles, INT-133.A1, INT-134.A1, INT-138.A1, INT-138.A2]
