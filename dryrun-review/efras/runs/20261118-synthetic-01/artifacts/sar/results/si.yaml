findings:
  - id: FND-024
    control_id: si-2
    title: "Security-relevant updates for the report container are not installed within 30 days"
    description: "SI-2 as specified requires security-relevant software updates to be installed within 30 days of their release. The upstream fix for the two high vulnerabilities in example-imagelib 2.9.1 inside efras-report is released, but EFRAS may build only from the software factory's hardened base image, and the one carrying the fix is late; the SCA's scan of 2026-11-23 confirmed the vulnerable library in place, and release 1.5.2 (planned 2026-12-10) was not verified. Evidence: tickets, the SCA scan, the developer's interview, conops limitation 2. Same root cause as FND-019 (ra-5)."
    status: open
    severity: moderate
    recommendation: "Install the fix through release 1.5.2 as soon as the factory's base image is available and rescan; agree with the factory an interim path (such as a patched intermediate image) for when its base image is late, and track that dependency with its POA&M item."
    affected_statements: ["SI-02a.[03]", "SI-02c.[01]"]
    state_difference: "Expected: security-relevant updates installed within 30 days of release. Actual: a released fix for two high vulnerabilities not installed, waiting on the provider's base image."
    potential_compromise: [confidentiality, integrity]
    sources: [INT-172.A1, ASM-024, product/conops.md#limitations, product/test-results.md#pipeline-1-5]
    triage:
      action: poam
      decided_by: PER-PM
      significance: moderate
      risk_basis: [ART-RA, INT-177.A1, INT-178.A1]
      rationale: "VUL-02 of the risk assessment, past the 30-day flaw remediation time; the fix waits on the factory's base image and release 1.5.2. No new scan exists, so nothing can be reassessed; it goes to the POA&M."
