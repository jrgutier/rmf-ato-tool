findings:
  - id: FND-014
    control_id: ir-4
    title: "Incident handling is not tied to an approved plan, not coordinated with an approved contingency plan, and has no lessons-learned step in operation"
    description: "IR-4 requires an incident handling capability consistent with the incident response plan, coordinated with contingency planning, with lessons learned incorporated into procedures, training and testing. The CSSP's detection and analysis and the program's containment, eradication and recovery runbooks are in place, but the incident response plan is an unapproved draft nobody has been trained on, the contingency plan it coordinates with is also an unapproved draft, and no incident, exercise or after-action review has taken place. Evidence: ART-IRP, the runbook, the ISSO and CSSP interviews, conops limitation 4."
    status: open
    severity: low
    recommendation: "Approve ART-IRP and ART-CP by 2026-12-15, train the plan's holders on them, and hold the combined incident and contingency tabletop (planned 2027-02) with an after-action report that feeds the runbooks, training and the next exercise."
    affected_statements: ["IR-04a.[01]", "IR-04b.", "IR-04c.[01]", "IR-04c.[02]"]
    state_difference: "Expected: handling run to an approved, exercised plan coordinated with the contingency plan and improved from lessons learned. Actual: handling run from runbooks alone; both plans are drafts and nothing has been exercised."
    potential_compromise: [confidentiality, integrity, availability]
    sources: [INT-165.A1, ART-IRP, product/conops.md#limitations]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A1, INT-177.A2]
      rationale: "The plan approval comes on 2026-12-15 and the combined tabletop in 2027-02; neither falls in the remediation window, so it goes to the POA&M."
  - id: FND-015
    control_id: ir-8
    title: "The incident response plan is a draft: not approved, not distributed, no change communicated"
    description: "IR-8 as specified requires the plan to be reviewed and approved by the PM with the ISSM's review and the CISO office's concurrence, distributed to the ISSO, the ISSM, the on-call engineers, the CSSP and the privacy office, and its changes communicated to them. ART-IRP covers the content the control requires but has no review or approval and has reached nobody outside the program repository. Evidence: ART-IRP, incident-response.yaml, the ISSM interview; approval is due 2026-12-15."
    status: open
    severity: low
    recommendation: "Have the PM approve the plan by 2026-12-15 after the ISSM's review and the CISO office's concurrence, distribute it to the named personnel and organizations, and record the annual review date."
    affected_statements: ["IR-08a.09", "IR-08b.[01]", "IR-08b.[02]", "IR-08d.[01]", "IR-08d.[02]"]
    state_difference: "Expected: an approved plan in the hands of those who respond. Actual: a complete draft known only inside the program repository."
    potential_compromise: [confidentiality, integrity, availability]
    sources: [INT-167.A1, ART-IRP]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A1, INT-177.A2]
      rationale: "The PM approves the plan on 2026-12-15, after the reassessment window; until it is approved, distributed and communicated the weakness is open, so it goes to the POA&M."
