# artifacts/poam/items.yaml (A-6; schema poam-items). Written whole (INV-8). One item per open SAR
# finding (24); the open CAT II STIG items STG-001 and STG-002 share the items of the same control
# and weakness (POAM-006, POAM-007). Priority follows the risk level, then the risk assessment's
# order (ART-RA risk summary). ao_review is added at R-3 or R-4, once a decision is in the ledger.
# R-3 (2027-01-25): risk_level aligned with the RAR (POAM-009 low; POAM-010, -017, -021
# moderate), priorities re-ranked moderate first, and milestone progress to the decision
# recorded (INT-193.A1, INT-194.A1, ASM-025). No item is closed: the SCA has verified no fix yet.
# M-3 (2027-02-01): POAM-025 (FND-025, RSK-004, moderate) at priority 12 with the low items moved
# down one; POAM-026 and its analysis record VUL-001 for the cycle's medium vulnerability; the
# missed milestones of POAM-012 and POAM-021 recorded as changes (INT-210.A3, INT-211.A1, ASM-026).
items:
  - id: POAM-001
    finding_ref: FND-018
    control_id: pt-3
    weakness: "De-identified exports and the training extract are re-identifiable through an unsalted DoD ID hash"
    description: "The exports and the training extract keep a stable, unsalted hash of the DoD ID number as the join key; anyone with a list of ID numbers can re-identify maintainers, as the red team and the privacy-trained assessor showed with 50 numbers. The processing then exceeds the purposes the SORN and the PIA allow."
    source_of_weakness: sar
    recommended_completion: before-authorization
    severity: moderate
    residual_risk: low
    risk_level: moderate
    criticality: moderate
    mitigation_approach: "Salted, rotated pseudonyms in release 1.6, then a re-identification retest; until then exports are limited to the analysts and data scientists who need them and only synthetic data is loaded."
    priority: 1
    identified: {event: security-control-assessment, reviewing_organization: "Component independent assessment activity, business systems SCA team", date: "2026-12-07"}
    status: ongoing
    point_of_contact: PER-PM
    resources_required: "ERST development under the current contract (release 1.6); the SCA team's privacy-trained assessor for the retest"
    scheduled_completion: "2027-01-20"
    milestones:
      - description: "Release 1.6 with salted, rotated pseudonyms deployed to pre-production"
        due: "2027-01-15"
        completed: "2027-01-15"
      - description: "Privacy-trained assessor retests re-identification with a list of DoD ID numbers"
        due: "2027-01-20"
        completed: "2027-01-20"
    milestone_changes: []
    comments: "Carries PT-2 of the reused penetration test (RR-002). The PIA approval (POAM-010) waits on this item. R-3: both milestones met; the retest of 2027-01-20 re-identified no one; FND-018 stays open until the SCA verifies it in production configuration (ASM-025)."
    sources: [ART-SAR, INT-180.A2, INT-173.A2, INT-171.A2, INT-193.A1]
  - id: POAM-002
    finding_ref: FND-019
    control_id: ra-5
    weakness: "Two high vulnerabilities in example-imagelib 2.9.1 in efras-report remain past the 30-day remediation time"
    description: "The dependency and image scans of 2026-10-20 and the SCA's scan of 2026-11-23 show two high vulnerabilities in the image library of the report container; the fix waits on the software factory's hardened base image. An attacker who can reach the report renderer with crafted input could compromise it."
    source_of_weakness: sar
    recommended_completion: before-authorization
    severity: moderate
    residual_risk: moderate
    risk_level: moderate
    criticality: moderate
    mitigation_approach: "Ship the rebuilt report container in release 1.5.2, or with release 1.6 if the base image is still late, and rescan; meanwhile the renderer has no outbound access and only signed-in users reach it."
    priority: 2
    identified: {event: security-control-assessment, reviewing_organization: "Component independent assessment activity, business systems SCA team", date: "2026-11-23"}
    status: delayed
    point_of_contact: PER-PM
    resources_required: "The software factory's hardened base image; ERST and the operations team under the current contract"
    scheduled_completion: "2026-12-10"
    milestones:
      - description: "Release 1.5.2 with the rebuilt report container deployed and rescanned"
        due: "2026-12-10"
    milestone_changes:
      - milestone: "Release 1.5.2 with the rebuilt report container deployed and rescanned"
        new_date: "2027-01-15"
        reason: "The software factory has not published the hardened base image and gives no date; the fix ships with release 1.5.2 when the image arrives, or with release 1.6 at the latest."
      - milestone: "Release 1.5.2 with the rebuilt report container deployed and rescanned"
        new_date: "2027-02-15"
        reason: "R-3: release 1.6 shipped on 2027-01-15 without the rebuilt report container because the factory's hardened base image is still unpublished; the PM requested the factory's patched intermediate image."
    obstacles: [dependency]
    comments: "Delayed: release 1.5.2, planned for 2026-12-10, did not ship because the factory's hardened base image is late (an open item on the factory's own POA&M). The factory can supply a patched intermediate image on request. Same vulnerabilities as POAM-003. R-3: slipped again to 2027-02-15 on the intermediate image; condition COND-02 of the decision."
    sources: [ART-SAR, INT-180.A1, INT-178.A1, INT-182.A1, ASM-024, INT-193.A1]
  - id: POAM-003
