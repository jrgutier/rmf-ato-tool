      - milestone: "Fix installed through release 1.5.2 and verified by rescan"
        new_date: "2027-02-15"
        reason: "R-3: release 1.6 shipped without the rebuilt report container; the fix now waits on the factory's patched intermediate image."
    obstacles: [dependency]
    comments: "Delayed for the same reason as POAM-002, which tracks the same vulnerabilities under ra-5. R-3: slipped again to 2027-02-15."
