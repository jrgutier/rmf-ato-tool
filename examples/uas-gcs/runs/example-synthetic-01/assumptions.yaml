assumptions:
  - id: ASM-001
    statement: "The product directory holds no organizational policy (EXT-ORG-POLICY); the organization's role appointments, strategy and baseline direction are recorded as stated by the simulated organization-level personas."
    rationale: "The fictional product package contains only system material; P-1 to P-7 need an organizational position."
    task: P-1
    persona: PER-CIO
    tag: ASSUMPTION
    sources: [product/README.md#top]
  - id: ASM-002
    statement: "The organization's risk tolerance, three-year maximum authorization period and remediation periods (30/90/180/365 days by risk level) are fictional organizational policy for this example."
    rationale: "No organizational risk management policy is supplied; R-2 and R-4 need a concrete tolerance to compare against."
    task: P-2
    persona: PER-RE
    tag: ASSUMPTION
    sources: [product/README.md#top]
  - id: ASM-003
    statement: "The organization-level threat picture (data-link electronic warfare, equipment capture, removable-media malicious code, supply chain, disconnected operations) is a generic fictional summary; no threat product (EXT-THREAT) is supplied."
    rationale: "P-3 needs threat information and the product directory has none."
    task: P-3
    persona: PER-RE
    tag: ASSUMPTION
    sources: [product/conops.md#environment]
  - id: ASM-004
    statement: "The Component provides the pm family and the policy and procedure parts of each family's first control as organization-wide common controls."
    rationale: "The product names only the enclave as a leveraged provider; organization-wide program controls are usual but not documented."
    task: P-5
    persona: PER-CISO
    tag: ASSUMPTION
    sources: [product/architecture.md#leveraged]
  - id: ASM-005
    statement: "The organizational continuous monitoring frequencies, metrics and reporting cadence are fictional organizational policy for this example."
    rationale: "No organizational continuous monitoring strategy is supplied; S-5 needs one to follow."
    task: P-7
    persona: PER-RE
    tag: ASSUMPTION
    sources: [product/README.md#top]
  - id: ASM-006
    statement: "The supported brigade's operations staff is the information owner for ETGCS mission data, represented by the test platoon leader during EMD; the milestone decision authority and capability sponsor are informed through milestone reviews."
    rationale: "The stakeholder list names no information owner or milestone decision authority."
    task: P-9
    persona: PER-PM
    tag: ASSUMPTION
    sources: [product/stakeholders.md#roles]
  - id: ASM-007
    statement: "Mission information types map to SP 800-60 Vol. 2 D.1.3 (tactical defense) and security management data to C.3.5.5 and C.3.5.8; map data is an organization-defined type."
    rationale: "The product gives information categories but no SP 800-60 mapping; C-2 confirms or revises it."
    task: P-12
    persona: PER-IO
    tag: ASSUMPTION
    sources: [product/conops.md#information]
  - id: ASM-008
    statement: "No capability document (EXT-CAPDOC) or organizational policy is supplied; requirements rest on the CONOPS, the stakeholders' answers, the risk assessment and DoDI 8510.01."
    rationale: "P-15 lists EXT-CAPDOC and EXT-ORG-POLICY as inputs and the product directory has neither."
    task: P-15
    persona: PER-PM
    tag: ASSUMPTION
    sources: [product/README.md#top]
  - id: ASM-009
    statement: "The Component system registry (EXT-REGISTRY) is simulated; the registration record reference ETGCS-REG-SIM-0001 is fictional."
    rationale: "P-18 needs a registry record and none is supplied."
    task: P-18
    persona: PER-PM
    tag: ASSUMPTION
    sources: [product/README.md#top]
  - id: ASM-010
    statement: "The STIG and SRG release versions and the rule IDs in stig-summary.yaml (SV-9001xx) are fictional placeholders; the product material names the benchmarks and results but not their releases or rule numbers."
    rationale: "STIG-001 and the stig-summary schema need a version and a rule ID per record; the program's build records are not in the product material."
    task: I-1
    persona: PER-DEV
    tag: ASSUMPTION
    sources: [product/test-results.md#stig-scan, INT-060.A1]
