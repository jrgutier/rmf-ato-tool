family: mp
controls:
  - control_id: mp-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the media protection policy and the sanitization procedure; the station follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-046.A1]
  - control_id: mp-2
    status: implemented
    statement: "Only the platoon's crew and authorized maintainers handle the station's removable media (update bundles, map data, mission products); the platoon keeps them under its control."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A1, product/architecture.md#physical]
  - control_id: mp-3
    status: implemented
    statement: "Each removable medium is labeled with its handling marking for unclassified information."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A1, product/conops.md#information]
  - control_id: mp-4
    status: implemented
    statement: "Removable media are kept in the locked, tamper-sealed transport cases under platoon control; the workstation disk is encrypted."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A1, product/architecture.md#physical, product/architecture.md#components]
  - control_id: mp-5
    status: implemented
    statement: "Media move only inside the locked, sealed cases in platoon vehicles and stay under platoon control in transit; the encrypted disk protects data on a lost kit."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A1, product/architecture.md#physical]
  - control_id: mp-6
    status: implemented
    statement: "Media leaving the platoon and a station disk before turn-in or repair are sanitized under the Component procedure, and the ISSO records each sanitization."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A1]
  - control_id: mp-7
    status: implemented
    statement: "The workstation image accepts only removable media the ISSO has registered and scans each medium before use."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-OS, CMP-WS-HW]
    sources: [INT-046.A1, product/architecture.md#updates]
