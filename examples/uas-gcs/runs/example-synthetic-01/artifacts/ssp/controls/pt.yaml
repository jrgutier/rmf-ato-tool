family: pt
controls:
  - control_id: pt-1
    status: inherited
    statement: "The Component privacy program issues and reviews the PII processing and transparency policy and procedures; the program office follows them."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    inherited_from: "Component privacy program"
    sources: [INT-050.A1]
  - control_id: pt-2
    status: partial
    statement: "The station processes only its users' names and CAC-derived identifiers, under the Component's authority to manage access to its information systems. Missing: the authority is written in the privacy threshold analysis, which the SAOP's designee has not yet approved. Plan: the privacy officer obtains approval before the plan review in S-6."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A1, INT-015.A1]
  - control_id: pt-3
    status: partial
    statement: "The PII is used for two purposes only: granting access and attributing audit records. Missing: the purposes are written in the privacy threshold analysis, which is not yet approved. Plan: the privacy officer obtains approval before the plan review in S-6."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A1, INT-015.A1]
  - control_id: pt-4
    status: not-applicable
    statement: "Consent is not used for the station's PII."
    rationale: "The names and CAC identifiers are collected from DoD personnel as a condition of system access for official duty, so there is no consent to give or withdraw."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A1]
  - control_id: pt-5
    status: implemented
    statement: "The DoD consent banner at every sign-in states that activity is monitored and recorded, and the signed rules of behavior state that the user's identity is recorded in the account and audit records."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-050.A2, INT-047.A1]
  - control_id: pt-5.1
    status: implemented
    statement: "The DoD consent banner gives the notice at the point of collection, at every sign-in."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-050.A2]
  - control_id: pt-5.2
    status: not-applicable
    statement: "No Privacy Act statement is presented."
    rationale: "The station is not a system of records (privacy officer's determination), so no Privacy Act statement is required."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2, INT-015.A1]
  - control_id: pt-6
    status: not-applicable
    statement: "No system of records notice is published for the station."
    rationale: "Nothing is retrieved by a person's name or identifier as a system of records (INT-015.A1)."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2, INT-015.A1]
  - control_id: pt-6.1
    status: not-applicable
    statement: "No routine uses are defined."
    rationale: "The station is not a system of records, so there are no routine uses to review."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2]
  - control_id: pt-6.2
    status: not-applicable
    statement: "No Privacy Act exemption rules are defined."
    rationale: "The station is not a system of records, so there are no exemption rules to review."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2]
  - control_id: pt-7
    status: not-applicable
    statement: "The station holds no specific categories of PII."
    rationale: "It holds no Social Security numbers and no information on the exercise of First Amendment rights."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2]
  - control_id: pt-7.1
    status: not-applicable
    statement: "The station does not collect Social Security numbers."
    rationale: "Users are identified by name and CAC-derived identifier only; no Social Security number is held."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2]
  - control_id: pt-7.2
    status: not-applicable
    statement: "The station holds no information on First Amendment activity."
    rationale: "The PII is limited to user names and CAC identifiers in account and audit records."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2]
  - control_id: pt-8
    status: not-applicable
    statement: "The station takes part in no computer matching."
    rationale: "No PII is shared for matching programs; it is not a system of records."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2]
