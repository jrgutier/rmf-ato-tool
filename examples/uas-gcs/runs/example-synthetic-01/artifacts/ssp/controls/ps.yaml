family: ps
controls:
  - control_id: ps-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the personnel security policy and procedures; the program office follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-049.A1]
  - control_id: ps-2
    status: implemented
    statement: "Each station role (operator, mission commander, field maintainer, S6 administrator) carries a position designation in the unit's duty descriptions; the privileged maintainer and administrator roles carry the higher designation."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A1, product/conops.md#users]
  - control_id: ps-3
    status: implemented
    statement: "Before the ISSO approves a directory group or adds a person to the maintainer list, the unit security manager confirms the person's investigation and eligibility meet the position designation; re-screening follows the Component's continuous vetting."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A1]
  - control_id: ps-3.4
    status: implemented
    statement: "The unit security manager's check before access includes the citizenship requirement of the position designation."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A1]
  - control_id: ps-4
    status: implemented
    statement: "When a user leaves the unit, S6 disables the directory account and the ISSO removes the person from the maintainer list the same day; the platoon changes the shared gcsmaint password when a maintainer leaves, and the person turns in any station media."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A2, product/conops.md#limitations]
  - control_id: ps-4.1
    status: implemented
    statement: "The unit security manager's out-processing briefing tells departing users of their duty to protect mission information after leaving."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A2]
  - control_id: ps-5
    status: implemented
    statement: "On a transfer inside the brigade the old directory group is removed and a new one approved for the new role, the same day."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A2]
  - control_id: ps-6
    status: implemented
    statement: "Every user signs the station rules of behavior and the Component nondisclosure agreement before access is granted."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A2, INT-047.A1]
  - control_id: ps-6.3
    status: implemented
    statement: "The nondisclosure agreement and the out-processing briefing state the duty to protect mission information after access ends."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A2]
  - control_id: ps-7
    status: implemented
    statement: "The integrator's contract carries the station roles' screening requirements and requires notice to the program office within one working day when integrator staff with test-station access leave or change role; integrator staff work only on the pre-production test stations, and the program office checks compliance at each contract review."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-049.A3, product/conops.md#top]
  - control_id: ps-8
    status: implemented
    statement: "Violations of the rules of behavior go to the commander under the Component's sanctions process, and the ISSM is notified."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-049.A2]
  - control_id: ps-9
    status: implemented
    statement: "The unit's duty descriptions for operators, mission commanders, field maintainers and S6 administrators include their station security responsibilities."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-049.A1]
