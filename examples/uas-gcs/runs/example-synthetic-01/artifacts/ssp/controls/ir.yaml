family: ir
controls:
  - control_id: ir-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the incident response policy and procedures; the station plan follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-045.A1]
  - control_id: ir-2
    status: planned
    statement: "Role-based incident response training for operators, maintainers and the ISSO (recognize, report to the ISSO, isolate the station) is planned before fielding."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A1]
  - control_id: ir-2.3
    status: planned
    statement: "Training in breach handling for the user names held in account and audit records is planned with the full plan before fielding."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A1]
  - control_id: ir-3
    status: planned
    statement: "The incident response plan has not been tested; the first tabletop test with the brigade is planned before fielding."
    responsible_roles: [PER-ISSO, PER-ISSM]
    components: [this-system]
    sources: [INT-045.A1]
  - control_id: ir-3.2
    status: planned
    statement: "The first test is planned jointly with the brigade and the enclave CSSP so it is coordinated with their plans."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A1]
  - control_id: ir-4
    status: partial
    statement: "The Brigade Tactical Network Enclave CSSP provides incident handling, analysis and containment support. The station's part: the ISSO reports, preserves a disk image, the platoon isolates the station by pulling the uplink, swaps in a spare kit and reimages from the signed bundle. Missing: the full station plan behind this handling is not written. Plan: the ISSO completes ART-IRP before fielding."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    inherited_from: "Brigade Tactical Network Enclave"
    sources: [INT-045.A1, INT-045.A2, product/architecture.md#leveraged]
  - control_id: ir-4.1
    status: partial
    statement: "Workstation and router events reach the enclave collector, where the CSSP's automated tooling supports incident handling. Missing: mission planner and GDT logs are not forwarded, so those components are handled by hand; the ISSO checks their local logs during an incident."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2, product/test-results.md#dt-1]
  - control_id: ir-4.3
    status: implemented
    statement: "When an incident takes a station out of service, the platoon continues the mission on a spare kit from brigade stock within 4 hours."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A1, product/conops.md#availability]
  - control_id: ir-4.4
    status: partial
    statement: "The CSSP correlates workstation and router events with brigade incident information. Missing: planner and GDT events are not forwarded and cannot be correlated."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2, product/test-results.md#dt-1]
  - control_id: ir-4.6
    status: partial
    statement: "Insider concerns go to the brigade security manager with the station's audit records. Missing: actions under the shared gcsmaint account cannot be tied to a person. Plan: individual maintainer accounts in release 2.4 (2027-02)."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2, product/conops.md#limitations]
  - control_id: ir-4.7
    status: implemented
    statement: "The ISSO coordinates insider threat incidents with the brigade security manager and the CSSP."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2]
  - control_id: ir-4.8
    status: implemented
    statement: "The CSSP correlates station incident information with external reports and shares it with the brigade."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2]
  - control_id: ir-4.12
    status: implemented
    statement: "The ISSO preserves a disk image of an affected station for the CSSP's malicious code and forensic analysis before the reimage."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2]
  - control_id: ir-4.13
    status: implemented
    statement: "The CSSP analyzes forwarded station events and enclave intrusion detection data for anomalous behavior."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2]
  - control_id: ir-4.14
    status: implemented
    statement: "The enclave CSSP's security operations center serves the station; the ISSO is its station contact."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A2, product/architecture.md#leveraged]
