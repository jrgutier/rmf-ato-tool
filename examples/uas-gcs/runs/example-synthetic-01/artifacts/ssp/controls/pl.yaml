family: pl
controls:
  - control_id: pl-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the planning policy and procedures; the program office follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-047.A1]
  - control_id: pl-2
    status: implemented
    statement: "The security plan covers every baseline control, was approved with conditions by the AODR in S-6, and was updated to the as-implemented 2.3.0 state in I-2; the ISSM and ISSO keep it current after each change."
    responsible_roles: [PER-ISSM, PER-ISSO]
    components: [this-system]
    sources: [INT-047.A1, INT-059.A2, INT-063.A1]
  - control_id: pl-4
    status: implemented
    statement: "Every operator, commander, maintainer and S6 administrator signs the station rules of behavior before the ISSO approves their directory group or adds them to the maintainer list."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-047.A1, product/conops.md#users]
  - control_id: pl-4.1
    status: implemented
    statement: "The rules of behavior forbid posting mission information on social media or external sites."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-047.A1]
  - control_id: pl-7
    status: implemented
    statement: "The program's concept of operations describes the mission, users, environment and limitations and is updated with each release."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-047.A1, product/conops.md#top]
  - control_id: pl-8
    status: implemented
    statement: "The integrator's architecture description covers components, boundary, network, identity, logging and updates."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-047.A2, product/architecture.md#top]
  - control_id: pl-8.1
    status: implemented
    statement: "Protection is layered: enclave firewall and IDS, the station router that denies all but four flows, the isolated internal segment, CAC sign-in and the encrypted disk."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-047.A2, product/architecture.md#network, product/architecture.md#leveraged]
  - control_id: pl-8.2
    status: partial
    statement: "The protection layers are separate devices under separate administration (the enclave firewall run by the enclave, the station router run by the brigade S6). Missing: the supplier of each layer is not recorded, so supplier diversity is not shown. Plan: the integrator adds each layer's supplier to the architecture description before S-6."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-047.A2]
  - control_id: pl-9
    status: partial
    statement: "In place: accounts come from the brigade directory and every station runs the one baseline from the signed bundle under the configuration control board. Missing: planner and GDT logs stay on the device, so only workstation and router logs reach the enclave collector. Plan: forward planner and GDT logs to the enclave collector on the date set for S-6 condition 4."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-047.A2, INT-080.A3, product/architecture.md#configuration, product/architecture.md#updates]
  - control_id: pl-10
    status: implemented
    statement: "The control baseline was selected in S-1 and is recorded in ART-BASELINE."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-047.A2, ART-BASELINE]
  - control_id: pl-11
    status: implemented
    statement: "The baseline was tailored in S-2; the tailoring decisions are recorded with ART-BASELINE."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-047.A2, ART-BASELINE]
