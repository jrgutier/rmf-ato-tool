family: ma
controls:
  - control_id: ma-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the maintenance policy and procedures; the station follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-045.A3]
  - control_id: ma-2
    status: partial
    statement: "Field maintainers replace hardware, run diagnostics and install the signed quarterly bundle, and record each action in the station maintenance log. Missing: they sign in with the shared gcsmaint account, so records show the account, not the person. Plan: individual maintainer accounts in release 2.4 (2027-02)."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/conops.md#limitations]
  - control_id: ma-3
    status: implemented
    statement: "The diagnostic kit and its tools are part of the configuration baseline and are the only maintenance tools approved for the station."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3]
  - control_id: ma-3.1
    status: implemented
    statement: "Maintainers inspect the diagnostic kit with the case seals at each setup."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/architecture.md#physical]
  - control_id: ma-3.2
    status: implemented
    statement: "Removable media are scanned before use and the station checks the bundle signature before install."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/architecture.md#updates]
  - control_id: ma-3.3
    status: implemented
    statement: "Maintenance tools and media never leave platoon control."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/architecture.md#physical]
  - control_id: ma-3.4
    status: implemented
    statement: "Only the platoon's authorized maintainers on the ISSO's list use the maintenance tools."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3]
  - control_id: ma-3.5
    status: partial
    statement: "Privileged maintenance sessions are logged. Missing: under the shared gcsmaint account the use of privileged tools cannot be tied to a person. Plan: release 2.4 (2027-02)."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/conops.md#limitations]
  - control_id: ma-3.6
    status: implemented
    statement: "Maintenance tools are updated through the signed quarterly bundle."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/architecture.md#updates]
  - control_id: ma-4
    status: implemented
    statement: "Remote administration of the workstation and router comes only from the brigade S6 management subnet with CAC sign-in over encrypted sessions."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-OS, CMP-ROUTER]
    sources: [INT-045.A3, product/architecture.md#network]
  - control_id: ma-4.1
    status: implemented
    statement: "The router and workstation log each remote administration session; the logs go to the enclave collector and the brigade S6 reviews them."
    responsible_roles: [PER-ISSO]
    components: [CMP-WS-OS, CMP-ROUTER]
    sources: [INT-045.A3, product/architecture.md#logging]
  - control_id: ma-4.3
    status: implemented
    statement: "Remote administration originates only from S6 workstations inside the separately authorized brigade enclave."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/architecture.md#leveraged]
  - control_id: ma-4.4
    status: implemented
    statement: "The router admits administration sessions only from the S6 management subnet, separated from mission traffic, after CAC authentication."
    responsible_roles: [PER-ISSE]
    components: [CMP-ROUTER]
    sources: [INT-045.A3, product/architecture.md#network]
  - control_id: ma-4.6
    status: implemented
    statement: "Remote administration sessions to the router are encrypted."
    responsible_roles: [PER-ISSE]
    components: [CMP-ROUTER]
    sources: [INT-045.A3]
  - control_id: ma-4.7
    status: implemented
    statement: "Idle remote administration sessions are dropped and the router logs each session's end."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-OS, CMP-ROUTER]
    sources: [INT-045.A3]
  - control_id: ma-5
    status: implemented
    statement: "The ISSO keeps the list of the platoon's authorized maintainers; only they perform maintenance."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/test-results.md#account-review]
  - control_id: ma-6
    status: implemented
    statement: "A failed station is replaced from brigade spare stock within 4 hours."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/conops.md#availability]
  - control_id: ma-6.1
    status: implemented
    statement: "Preventive maintenance is the signed quarterly update bundle installed by the field maintainers."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-045.A3, product/architecture.md#updates]
