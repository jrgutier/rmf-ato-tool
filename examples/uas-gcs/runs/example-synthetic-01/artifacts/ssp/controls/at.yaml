    statement: "The Component cybersecurity program issues and reviews the awareness and training policy and procedures; the station's users follow them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-039.A1]
  - control_id: at-2
    status: implemented
    statement: "Every operator, commander, maintainer and administrator completes the DoD cyber awareness course before first access and every year; the ISSO adds a station brief at fielding."
    responsible_roles: [PER-ISSM, PER-ISSO]
    components: [this-system]
    sources: [INT-039.A1]
  - control_id: at-2.2
    status: implemented
    statement: "The annual awareness course covers recognizing and reporting insider threat indicators."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-039.A1]
  - control_id: at-2.3
    status: implemented
    statement: "The annual awareness course covers phishing and social engineering."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-039.A1]
  - control_id: at-2.4
    status: implemented
    statement: "The awareness course and the ISSO's station brief tell users how to report suspicious messages and system behavior to the ISSO and the CSSP."
    responsible_roles: [PER-ISSM, PER-ISSO]
    components: [this-system]
    sources: [INT-039.A1]
  - control_id: at-2.5
    status: implemented
    statement: "The annual awareness course covers advanced persistent threats."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-039.A1]
  - control_id: at-3
    status: implemented
    statement: "Operators and commanders take the program operator course, maintainers the maintainer course on update bundles and signature checks, and S6 administrators and the ISSO hold DoD cyber workforce qualifications, before access."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-039.A2]
  - control_id: at-3.1
    status: not-applicable
    statement: "No environmental control training is given for the station."
    rationale: "The station has no environmental control equipment of its own; it is a field kit on vehicle or generator power."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-039.A2, product/conops.md#environment]
  - control_id: at-3.2
    status: implemented
    statement: "The operator course trains the tamper-seal check on the transport cases at each setup and the handling of platoon-controlled removable media."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-039.A2, product/architecture.md#physical]
  - control_id: at-3.5
    status: implemented
