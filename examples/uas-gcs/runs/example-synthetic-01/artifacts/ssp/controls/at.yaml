    components: [this-system]
    sources: [INT-039.A2]
  - control_id: at-6
    status: implemented
    statement: "Course feedback goes to the program office after each new-equipment training event."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-039.A2]
