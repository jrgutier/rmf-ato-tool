family: cp
controls:
  - control_id: cp-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the contingency planning policy and procedures; the station's plan follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-043.A1]
  - control_id: cp-2
    status: partial
    statement: "The station contingency plan (ART-CP) states the strategy: when a station fails, the platoon draws a spare kit from brigade stock and restores mission planning and flight control within 4 hours; the workstation, GDT and router are the critical assets. The ISSM reviews the plan annually. Missing: only the plan summary exists; the full plan with roles, contacts and recovery procedures is not written. Plan: the ISSO completes it before fielding."
    responsible_roles: [PER-ISSO, PER-ISSM]
    components: [this-system]
    parameters:
      cp-02_odp.05: "annually"
    sources: [INT-043.A1, product/conops.md#availability]
  - control_id: cp-2.1
    status: implemented
    statement: "The ISSO coordinates the station plan with the brigade continuity plan and the enclave's incident response plan."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A1]
  - control_id: cp-2.3
    status: implemented
    statement: "The plan resumes mission planning and flight control, the essential functions, within 4 hours on a spare station; lost-link return protects the aircraft in the meantime."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A1, product/conops.md#availability, product/test-results.md#dt-1]
  - control_id: cp-2.8
    status: implemented
    statement: "The plan names the workstation, the GDT and the router as the critical assets that support the essential functions."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A1]
  - control_id: cp-3
    status: planned
    statement: "Role-based training in the station swap and restore for operators, maintainers and the ISSO is planned before fielding."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A1]
  - control_id: cp-4
    status: planned
    statement: "The plan has not been tested; the first tabletop test with the brigade is planned before fielding, then annually."
    responsible_roles: [PER-ISSO, PER-ISSM]
    components: [this-system]
    sources: [INT-043.A1]
  - control_id: cp-4.1
    status: planned
    statement: "The first plan test is planned jointly with the brigade continuity and enclave incident response exercises."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A1]
  - control_id: cp-6
    status: implemented
    statement: "A copy of each station backup is held with the spare kits in brigade stock, which serves as the alternate storage site."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A2]
  - control_id: cp-6.1
    status: implemented
    statement: "Brigade stock is held away from the platoons, so the backups do not share the station's field threats."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A2]
  - control_id: cp-6.3
    status: implemented
    statement: "Brigade stock is reachable by ground transport; the plan uses the platoon's own media copy when it is not."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A2]
  - control_id: cp-7
    status: implemented
    statement: "A spare station kit from brigade stock is the alternate processing site and takes over mission planning and flight control within 4 hours."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    parameters:
      cp-07_odp.01: "mission planning and flight control"
      cp-07_odp.02: "4 hours"
    sources: [INT-043.A2, product/conops.md#availability]
  - control_id: cp-7.1
    status: implemented
    statement: "Spare kits are held in brigade stock, separate from the platoon's station."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A2]
  - control_id: cp-7.2
    status: implemented
    statement: "Spare kits are reachable by ground transport and are self-contained field kits."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A2]
  - control_id: cp-7.3
    status: not-applicable
    statement: "No priority-of-service agreement is needed for alternate processing."
    rationale: "The spare stations are owned by the unit; no outside provider supplies alternate processing."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A2]
  - control_id: cp-8
    status: implemented
    statement: "When the uplink drops the station keeps flying and products queue for transfer; a failed GDT or router is covered by swapping in the spare kit."
    responsible_roles: [PER-ISSE, PER-ISSO]
    components: [CMP-GDT, CMP-ROUTER]
    sources: [INT-043.A2, product/architecture.md#network]
  - control_id: cp-8.1
    status: inherited
    statement: "The enclave carries the uplink under its telecom priority arrangements; the station has no service agreements of its own."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    inherited_from: "Brigade Tactical Network Enclave"
    sources: [INT-043.A2, product/architecture.md#leveraged]
  - control_id: cp-8.2
    status: implemented
    statement: "The aircraft link and the uplink are single paths per station; the plan covers a failed GDT or router by swapping in the spare kit, and loss of the uplink does not stop flight operations."
    responsible_roles: [PER-ISSE]
    components: [CMP-GDT, CMP-ROUTER]
    sources: [INT-043.A2, product/architecture.md#network]
  - control_id: cp-9
    status: implemented
    statement: "The maintainer backs up the workstation configuration and mission data to platoon-controlled media after each bundle install and weekly; system software is restored from the signed bundle."
    responsible_roles: [PER-ISSO]
    components: [CMP-WS-HW, CMP-WS-OS]
    sources: [INT-043.A2, product/architecture.md#updates]
  - control_id: cp-9.1
    status: implemented
    statement: "The maintainer test-restores a backup on one station each quarter."
    responsible_roles: [PER-ISSO]
    components: [CMP-WS-OS]
    sources: [INT-043.A2]
  - control_id: cp-9.5
    status: implemented
    statement: "A copy of each backup goes with the brigade spare stock."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-043.A2]
  - control_id: cp-9.8
    status: implemented
    statement: "Backups on removable media are encrypted."
    responsible_roles: [PER-ISSO]
    components: [CMP-WS-OS]
    sources: [INT-043.A2]
  - control_id: cp-10
    status: implemented
    statement: "A station is recovered by reimaging from the signed bundle and restoring the latest backup."
    responsible_roles: [PER-ISSO]
    components: [CMP-WS-OS]
    sources: [INT-043.A2]
  - control_id: cp-10.2
    status: implemented
    statement: "Queued mission products resume transfer to the brigade intelligence system when the link returns."
    responsible_roles: [PER-ISSO]
    components: [CMP-WS-OS]
    sources: [INT-043.A2, product/architecture.md#network]
