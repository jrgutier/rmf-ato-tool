family: sa
controls:
  - control_id: sa-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the system and services acquisition policy and procedures; the program office follows them."
    responsible_roles: [PER-PM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-052.A1]
  - control_id: sa-2
    status: implemented
    statement: "The program budget carries a cybersecurity line for the RMF work, scanning tools and the integrator's security tasks."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A1]
  - control_id: sa-3
    status: implemented
    statement: "The integrator follows the program's development life cycle under the acquisition pathway, with security reviews at each design review and release and the ISSE and ISSM named in it."
    responsible_roles: [PER-PM, PER-ISSE]
    components: [this-system]
    sources: [INT-052.A1, product/conops.md#program]
  - control_id: sa-3.1
    status: implemented
    statement: "The six pre-production stations at the test range are the preproduction environment; they carry the production baseline and connect only to a test instance of the brigade network."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A1, product/conops.md#program]
  - control_id: sa-3.2
    status: implemented
    statement: "Tests use synthetic routes, test keys and range imagery; operational mission data is never used in development or test."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A1]
  - control_id: sa-3.3
    status: partial
    statement: "In place: every component except the mission planner is vendor-supported, and the program plans refresh by software release. Missing: the vendor ends support for RouteCraft Planner 7 in 2027-06 and no replacement has been chosen. Plan: select the replacement for software release 3.0, before end of support."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A1, product/conops.md#limitations]
  - control_id: sa-4
    status: implemented
    statement: "The integrator's contract carries the security requirements allocated in P-17, including control functional properties, documentation, ports and services, approved products and data ownership."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A2]
  - control_id: sa-4.1
    status: implemented
    statement: "The contract requires the integrator to describe the functional properties of the controls it implements."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A2]
  - control_id: sa-4.2
    status: implemented
    statement: "The contract requires design and implementation documentation for the controls, delivered with each release."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A2]
  - control_id: sa-4.7
    status: implemented
    statement: "The contract requires products from the NIAP list wherever a protection profile exists for the product type."
    responsible_roles: [PER-PM, PER-ISSE]
    components: [this-system]
    sources: [INT-052.A2]
  - control_id: sa-4.9
    status: implemented
    statement: "The integrator delivers the list of functions, ports, protocols and services; the router rules enforce it and the DT-1 port scan found only documented ports."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A2, product/test-results.md#dt-1]
  - control_id: sa-4.10
    status: implemented
    statement: "The CAC readers are taken from the approved products list, as the contract requires."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A2]
  - control_id: sa-4.11
    status: not-applicable
    statement: "The station is not a system of records."
    rationale: "No records are retrieved by a person's name or identifier, so no Privacy Act system of records is designed, developed or operated."
    responsible_roles: [PER-PRIV]
    components: [this-system]
    sources: [INT-050.A2]
  - control_id: sa-4.12
    status: implemented
    statement: "The contract states government ownership of all mission and security data the station creates or holds."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A2]
  - control_id: sa-5
    status: partial
    statement: "In place: the integrator delivers administrator and user guides and the STIG summary for the workstation and router. Missing: the mission planner has no vendor security guide, and the integrator's hand-hardening settings are recorded but not assessed. Plan: assess the planner hardening during A-3 and carry the result into the planner replacement decision."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A2, product/conops.md#limitations]
  - control_id: sa-8
    status: implemented
    statement: "The ISSE applies SP 800-160 engineering principles at each design review."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3]
  - control_id: sa-8.14
    status: implemented
    statement: "Least privilege is designed in through the operator, commander and admin directory roles and separate privileged accounts."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3, product/architecture.md#identity]
  - control_id: sa-8.22
    status: partial
    statement: "In place: CAC users' actions are logged and tied to a person. Missing: maintenance actions under the shared gcsmaint account on the workstation and router cannot be tied to a person. Plan: per-maintainer local accounts with offline CAC sign-in in release 2.4 (planned 2027-02)."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3, product/conops.md#limitations]
  - control_id: sa-8.28
    status: implemented
    statement: "At each design review the ISSE judges whether the security achieved is acceptable against the system risk assessment."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3]
  - control_id: sa-8.33
    status: implemented
    statement: "The station holds only user names in account and audit records as personal data."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3, product/conops.md#information]
  - control_id: sa-9
    status: implemented
    statement: "The only external service is the Brigade Tactical Network Enclave, used under its own authorization and leveraged as recorded in the leveraged authorizations."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-052.A2, product/architecture.md#leveraged]
  - control_id: sa-9.1
    status: implemented
    statement: "Use of the enclave services rests on the enclave's ATO and the enclave connection approval process."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-052.A2, product/architecture.md#interconnections]
  - control_id: sa-9.2
    status: implemented
    statement: "The ports and protocols used with the enclave (syslog over TLS, LDAPS, remote administration from the S6 subnet) are documented in the router rules."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A2, product/architecture.md#network]
  - control_id: sa-9.3
    status: implemented
    statement: "The trust relationship with the enclave is kept through the enclave connection approval process and its ATO."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-052.A2, product/architecture.md#interconnections]
  - control_id: sa-9.6
    status: implemented
    statement: "The aircraft link keys are generated and loaded by the unit before each mission; no provider holds them."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-052.A2, product/architecture.md#network]
  - control_id: sa-9.8
    status: implemented
    statement: "The enclave is a DoD system in U.S. jurisdiction."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-052.A2]
  - control_id: sa-10
    status: implemented
    statement: "The integrator keeps source and baseline under its own configuration management; the ISSE sits on its change board, which feeds the program CCB."
    responsible_roles: [PER-ISSE, PER-DEV]
    components: [this-system]
    sources: [INT-052.A3, product/architecture.md#configuration]
  - control_id: sa-10.1
    status: implemented
    statement: "Update bundles are signed by the integrator and the station checks the signature before install."
    responsible_roles: [PER-DEV]
    components: [this-system]
    sources: [INT-052.A3, product/architecture.md#updates]
  - control_id: sa-10.3
    status: implemented
    statement: "Hardware arrives with tamper seals that are checked at receipt and at each setup."
    responsible_roles: [PER-DEV]
    components: [this-system]
    sources: [INT-052.A3, product/architecture.md#physical]
  - control_id: sa-10.7
    status: implemented
    statement: "The ISSE represents security on the integrator's change board."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3]
  - control_id: sa-11
    status: partial
    statement: "In place: developer testing and DT-1 cover sign-in, lockout, link keying, lost-link, router ports and audit forwarding. Missing: the mission planner's hardening has never been assessed. Plan: assess it in A-3."
    responsible_roles: [PER-DEV, PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3, product/test-results.md#dt-1, product/conops.md#limitations]
  - control_id: sa-11.1
    status: implemented
    statement: "The integrator runs static code analysis on the flight control and video applications at each build."
    responsible_roles: [PER-DEV]
    components: [this-system]
    sources: [INT-052.A3]
  - control_id: sa-15
    status: implemented
    statement: "The integrator's development process, standards and tools are defined in its life cycle and reviewed at each design review."
    responsible_roles: [PER-DEV]
    components: [this-system]
    sources: [INT-052.A1, INT-052.A3]
  - control_id: sa-15.3
    status: implemented
    statement: "A criticality analysis is part of each design review."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-052.A3]
  - control_id: sa-21
    status: implemented
    statement: "The contract requires integrator staff to be screened to the station roles' requirements."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A3, INT-049.A3]
  - control_id: sa-22
    status: implemented
    statement: "Every component is vendor-supported today; the mission planner's end of support in 2027-06 is tracked under sa-3.3."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-052.A1, product/conops.md#limitations]
