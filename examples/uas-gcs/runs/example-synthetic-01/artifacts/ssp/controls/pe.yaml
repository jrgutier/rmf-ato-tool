family: pe
controls:
  - control_id: pe-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the physical and environmental protection policy and procedures; the platoon follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-046.A2]
  - control_id: pe-2
    status: implemented
    statement: "The platoon leader keeps the roster of crew and maintainers allowed at the station; only people on it operate or service the kit."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-3
    status: implemented
    statement: "The station stays under the platoon's physical control at all times; the transport cases lock and carry tamper seals checked at each setup and move."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/architecture.md#physical]
  - control_id: pe-3.1
    status: implemented
    statement: "Access to the workstation, ground data terminal and router is limited to the rostered crew and maintainers who keep the kit under their control."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/architecture.md#physical]
  - control_id: pe-4
    status: implemented
    statement: "The station's cables run only inside the kit while the crew on shift watches it, and are packed in the sealed cases for moves."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-5
    status: implemented
    statement: "The station's only output devices are its screens, which the crew on shift watches while the kit is set up."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-6
    status: implemented
    statement: "The crew on shift monitors physical access to the set-up kit, and broken tamper seals found at setup are reported to the ISSO."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/architecture.md#physical]
  - control_id: pe-6.1
    status: not-applicable
    statement: "No intrusion alarms or surveillance equipment are used for the station."
    rationale: "The station is a field kit with no facility of its own; the crew's continuous physical control takes the place of alarms."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#environment]
  - control_id: pe-8
    status: not-applicable
    statement: "No visitor access records are kept for the station."
    rationale: "There is no facility with a visitor entrance; only rostered crew and maintainers work at the kit."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-8.3
    status: not-applicable
    statement: "No visitor records, and so no PII in them, exist for the station."
    rationale: "pe-8 does not apply; the station keeps no visitor access records."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-9
    status: implemented
    statement: "Vehicle or generator power reaches the kit through its own cables, which the crew sets up, watches and packs in the sealed cases."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#environment]
  - control_id: pe-10
    status: not-applicable
    statement: "The station has no facility emergency shutoff."
    rationale: "The kit has no facility or data center; the crew disconnects vehicle or generator power at the kit."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#environment]
  - control_id: pe-11
    status: not-applicable
    statement: "No facility emergency power is provided for the station."
    rationale: "The kit runs on vehicle or generator power in the field; loss of power is covered by the spare-station replacement within 4 hours and the aircraft's lost-link route."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#availability, product/conops.md#mission]
  - control_id: pe-12
    status: not-applicable
    statement: "No emergency lighting is provided for the station."
    rationale: "There is no facility with exits to light; the kit is operated from the field."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-13
    status: not-applicable
    statement: "No facility fire protection is provided for the station."
    rationale: "The kit has no facility of its own; a station lost to fire is replaced from brigade spare stock within 4 hours."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#availability]
  - control_id: pe-13.1
    status: not-applicable
    statement: "No fire detection system is installed for the station."
    rationale: "pe-13 does not apply; the kit has no facility of its own."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-13.2
    status: not-applicable
    statement: "No fire suppression system is installed for the station."
    rationale: "pe-13 does not apply; the kit has no facility of its own."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-14
    status: not-applicable
    statement: "No facility climate control is provided for the station."
    rationale: "The kit is used outdoors from a tactical vehicle with no facility of its own; a station lost to weather is replaced from spare stock within 4 hours."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#environment, product/conops.md#availability]
  - control_id: pe-15
    status: not-applicable
    statement: "No facility water-damage protection is provided for the station."
    rationale: "The kit has no facility plumbing or shutoff valves; it moves in its cases and a damaged station is replaced from spare stock."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#availability]
  - control_id: pe-16
    status: implemented
    statement: "Kits and their components enter and leave platoon control only in the sealed cases; seals are checked at each move and setup."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/architecture.md#physical]
  - control_id: pe-17
    status: not-applicable
    statement: "The station is not operated from alternate work sites."
    rationale: "Nobody runs the station from home or another work site; it operates only with the platoon."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2]
  - control_id: pe-22
    status: implemented
    statement: "Every case and component carries its configuration-item label (the CMP-* identifiers)."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/architecture.md#components]
  - control_id: pe-23
    status: not-applicable
    statement: "No facility site is selected for the station."
    rationale: "The station moves with the platoon and has no fixed facility to locate."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-046.A2, product/conops.md#environment]
