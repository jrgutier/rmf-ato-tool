family: cm
chunk: 2
controls:
  - control_id: cm-7
    status: implemented
    statement: "Each component runs only the functions its mission role needs; the router allows only the documented ports and denies everything else in both directions, as the DT-1 port scan confirmed."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-HW, CMP-WS-OS, CMP-C2, CMP-PLANNER, CMP-VIDEO, CMP-GDT, CMP-ROUTER]
    sources: [INT-042.A3, product/architecture.md#network, product/test-results.md#dt-1]
  - control_id: cm-7.1
    status: implemented
    statement: "The CCB reviews functions, ports and services on the workstation, router and GDT every quarter with the bundle and removes any not needed."
    responsible_roles: [PER-CCB, PER-ISSE]
    components: [CMP-WS-OS, CMP-ROUTER, CMP-GDT]
    sources: [INT-042.A3]
  - control_id: cm-7.2
    status: implemented
    statement: "The workstation blocks any program not on the integrator's allow-list."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-7.3
    status: implemented
    statement: "Ports, protocols and services on the workstation are registered in the integrator's design and reviewed by the CCB."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-7.5
    status: implemented
    statement: "The workstation runs only allow-listed signed executables from the integrator bundle; the CCB reviews the allow-list every quarter."
    responsible_roles: [PER-ISSE, PER-CCB]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-7.8
    status: implemented
    statement: "Binary code without source runs only when it is a signed item in the CCB-approved bundle, such as the licensed planner."
    responsible_roles: [PER-CCB]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-7.9
    status: implemented
    statement: "The workstation blocks unregistered USB devices except platoon-controlled media."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-HW]
    sources: [INT-042.A3, product/architecture.md#physical]
  - control_id: cm-8
    status: implemented
    statement: "The inventory lists every hardware and software item of the station by CMP and INV ID, with version and owner."
    responsible_roles: [PER-ISSE, PER-ISSO]
    components: [CMP-WS-HW, CMP-WS-OS, CMP-C2, CMP-PLANNER, CMP-VIDEO, CMP-GDT, CMP-ROUTER]
    sources: [INT-042.A3, product/hw-sw-inventory.md#items]
  - control_id: cm-8.1
    status: implemented
    statement: "The integrator updates the inventory with each bundle and at each installation or removal of a component."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-042.A3]
  - control_id: cm-8.2
    status: implemented
    statement: "The bundle installer records installed versions, and the start-up check keeps the inventory current against them."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-042.A3]
  - control_id: cm-8.3
    status: implemented
    statement: "The start-up check reports any component or USB device not in the inventory to the local log."
    responsible_roles: [PER-ISSE, PER-ISSO]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-9
    status: partial
    statement: "The configuration management plan (ART-CMP) is today a summary naming the CCB, the baselines, the change process and the drift checks. Missing: the full plan with roles, configuration items and procedures. Plan: the ISSE writes the full plan before the assessment in A-3."
    responsible_roles: [PER-ISSE, PER-CCB]
    components: [this-system]
    sources: [INT-042.A1]
  - control_id: cm-10
    status: implemented
    statement: "The program office tracks licenses for all workstation software, including the planner."
    responsible_roles: [PER-PM]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-10.1
    status: implemented
    statement: "Open-source libraries on the workstation are used only when the CCB approves them."
    responsible_roles: [PER-CCB]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-11
    status: implemented
    statement: "Users cannot install software; the allow-list blocks anything not in the bundle."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-11.2
    status: implemented
    statement: "Only the bundle installer, running as administrator, installs software on the workstation."
    responsible_roles: [PER-ISSE]
    components: [CMP-WS-OS]
    sources: [INT-042.A3]
  - control_id: cm-12
    status: implemented
    statement: "The design lists where mission data lives: the workstation's encrypted disk and the enclave product drop."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-042.A3]
  - control_id: cm-12.1
    status: implemented
    statement: "The start-up check reports any mission data file found outside the designated workstation folders."
    responsible_roles: [PER-ISSE]
    components: [this-system]
    sources: [INT-042.A3]
  - control_id: cm-14
    status: implemented
    statement: "The workstation installs only the signed integrator quarterly update bundle and the GDT accepts only signed firmware images; signatures are checked before install."
    responsible_roles: [PER-ISSE, PER-DEV]
    components: [CMP-WS-OS, CMP-GDT]
    parameters:
      cm-14_odp.01: "the integrator's quarterly update bundle"
      cm-14_odp.02: "GDT firmware images"
    sources: [INT-042.A3, product/architecture.md#updates]
