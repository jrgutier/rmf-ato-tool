family: ca
controls:
  - control_id: ca-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the assessment, authorization and monitoring policy and procedures; the station's RMF team follows them."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-041.A1]
  - control_id: ca-2
    status: planned
    statement: "Nothing is assessed yet. The Component SCA is selected in A-1, writes the assessment plan (controls, procedures, environment, team and roles) in A-2 for approval by the AO's representative before testing, assesses every baseline control in A-3 reusing the DT-1 and 2026-09-15 scan results, and delivers the assessment report to the AO, the PM and the ISSM, all before the authorization decision."
    responsible_roles: [PER-ISSM, PER-SCA]
    components: [this-system]
    sources: [INT-041.A1, product/test-results.md#top]
  - control_id: ca-2.1
    status: planned
    statement: "The planned assessor is the Component SCA, organizationally independent of the program office and the integrator; selection is confirmed in A-1."
    responsible_roles: [PER-ISSM, PER-SCA]
    components: [this-system]
    sources: [INT-041.A1]
  - control_id: ca-3
    status: partial
    statement: "IC-2 with the Brigade Tactical Network Enclave is approved through the enclave connection approval process. IC-1, mission products to the brigade intelligence system, has only a draft interconnection agreement that is not signed, so its interface characteristics, security requirements and responsibilities are not yet agreed. Plan: the ISSM gets IC-1 signed before fielding and reviews both agreements annually."
    responsible_roles: [PER-ISSM, PER-PM]
    components: [this-system]
    sources: [INT-041.A2, product/architecture.md#interconnections]
  - control_id: ca-3.6
    status: implemented
    statement: "The station accepts no data from the brigade intelligence system; the router admits inbound traffic only from the brigade S6 management subnet, and those sessions require CAC sign-in in the admin directory group before any data is accepted."
    responsible_roles: [PER-ISSE, PER-ISSO]
    components: [this-system]
    sources: [INT-041.A2, product/architecture.md#network]
  - control_id: ca-5
    status: planned
    statement: "The ISSM opens the POA&M in A-6 from the assessment report's findings and the disclosed limitations, and updates it monthly from then on with assessment, audit and continuous monitoring results."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-041.A1]
  - control_id: ca-6
    status: partial
    statement: "The AO for the station is assigned and the Component's AO authorizes the common controls. The station is not yet authorized: the decision, including acceptance of the inherited common controls, is planned in R-4 before fielding; the authorization is then reviewed at least every three years or on a significant change."
    responsible_roles: [PER-AO, PER-ISSM]
    components: [this-system]
    sources: [INT-041.A1]
  - control_id: ca-7
    status: partial
    statement: "The organization-level continuous monitoring strategy applies, and the start-up and pre-upload compliance check and the enclave's review of forwarded logs already run. Missing: the system-level strategy with its metrics, monitoring and assessment frequencies, correlation, response and reporting, which is written in S-5 and starts with the first monitoring cycle after authorization; the planner and GDT logs are not monitored because they are not forwarded."
    responsible_roles: [PER-ISSM, PER-ISSO]
    components: [this-system]
    sources: [INT-041.A3, product/architecture.md#configuration, product/architecture.md#logging]
  - control_id: ca-7.1
    status: planned
    statement: "Ongoing assessment by the independent Component SCA is defined in the S-5 strategy and starts with the first monitoring cycle after authorization."
    responsible_roles: [PER-ISSM, PER-SCA]
    components: [this-system]
    sources: [INT-041.A3]
  - control_id: ca-7.3
    status: planned
    statement: "Trend analysis of monitoring results is defined in the S-5 strategy and starts with the first monitoring cycle after authorization."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-041.A3]
  - control_id: ca-7.4
    status: planned
    statement: "Effectiveness, compliance and change monitoring are defined in the S-5 strategy; today only the configuration compliance check runs."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-041.A3]
  - control_id: ca-7.5
    status: planned
    statement: "The consistency actions are defined in the S-5 strategy and start with the first monitoring cycle after authorization."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-041.A3]
  - control_id: ca-7.6
    status: planned
    statement: "The automated dashboard that keeps monitoring results accurate, current and available is defined in the S-5 strategy and starts with the first monitoring cycle after authorization."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-041.A3]
  - control_id: ca-9
    status: implemented
    statement: "The workstation, the GDT management port and the router sit on one isolated station segment; the integrator's design documents each internal connection and the information on it, the router allows nothing else on the segment, the CCB reviews the list at each baseline change and at least annually, and a connection is removed with its component."
    responsible_roles: [PER-ISSE, PER-CCB]
    components: [CMP-ROUTER]
    sources: [INT-041.A2, product/architecture.md#network]
