family: sr
controls:
  - control_id: sr-1
    status: inherited
    statement: "The Component cybersecurity program issues and reviews the supply chain risk management policy and procedures; the program office applies them to the station."
    responsible_roles: [PER-CCP, PER-ISSM]
    components: [this-system]
    inherited_from: "Component cybersecurity program"
    sources: [INT-056.A1]
  - control_id: sr-2
    status: implemented
    statement: "The program office keeps a station supply chain risk management plan, reviewed yearly."
    responsible_roles: [PER-ISSM, PER-PM]
    components: [this-system]
    sources: [INT-056.A1]
  - control_id: sr-2.1
    status: implemented
    statement: "The plan is maintained by a team of the PM, ISSM, ISSE and the integrator."
    responsible_roles: [PER-PM, PER-ISSM]
    components: [this-system]
    sources: [INT-056.A1]
  - control_id: sr-3
    status: partial
    statement: "Hardware and firmware come only through the integrator's contract from approved suppliers, with signed deliveries. The mission planner's vendor ends support for version 7 in 2027-06 and no replacement is chosen; the program carries this as a supply chain risk and is evaluating a replacement for release 3.0."
    responsible_roles: [PER-ISSM, PER-PM]
    components: [this-system]
    sources: [INT-056.A1, product/conops.md#limitations]
  - control_id: sr-3.3
    status: implemented
    statement: "The integrator's contract requires secure development, flaw notification and signed deliveries from its suppliers."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-056.A1]
  - control_id: sr-4
    status: implemented
    statement: "The integrator records serial numbers and firmware versions of each kit's hardware in the configuration records at build."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-056.A2]
  - control_id: sr-5
    status: implemented
    statement: "Components are acquired only through the integrator's contract from original manufacturers or authorized resellers."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-056.A1, INT-056.A2]
  - control_id: sr-5.2
    status: implemented
    statement: "Kits are inspected and tamper seals checked at receipt, before the kit is put into service."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-056.A2]
  - control_id: sr-6
    status: implemented
    statement: "The program office reviews the integrator and the two component vendors yearly."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    sources: [INT-056.A1]
  - control_id: sr-8
    status: implemented
    statement: "Contract notification terms require the integrator and vendors to report compromises and flaws to the program office."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-056.A2]
  - control_id: sr-10
    status: implemented
    statement: "Kits are inspected and seals checked at receipt and at every setup."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-056.A2, product/architecture.md#physical]
  - control_id: sr-11
    status: implemented
    statement: "The integrator buys only from original manufacturers or authorized resellers and reports suspected counterfeits."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-056.A2]
  - control_id: sr-11.1
    status: implemented
    statement: "The integrator's staff are trained to detect counterfeit components."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-056.A2]
  - control_id: sr-11.2
    status: implemented
    statement: "Components go back for service and repair only through the integrator."
    responsible_roles: [PER-PM]
    components: [this-system]
    sources: [INT-056.A2]
  - control_id: sr-12
    status: implemented
    statement: "Retired kits are sanitized and disposed of under the Component procedure."
    responsible_roles: [PER-ISSO]
    components: [this-system]
    sources: [INT-056.A2]
