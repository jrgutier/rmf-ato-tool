decision: AD-ATOC
decided_by: PER-AO
date: "2026-10-29"
authorization_termination_date: "2027-06-30"
conditions:
  - id: COND-01
    description: "Interim accountability and logging measures: named custodian and new GDT administrator password, and log export and review at every reconnect from 2026-11-16 (POAM-001, POAM-002, POAM-005, POAM-007, POAM-032)."
    due: "2026-11-30"
  - id: COND-02
    description: "GDT firmware 5.2.1 fielded in the 2026-12 bundle and the stations rescanned (POAM-054, POAM-062, POAM-063)."
    due: "2027-01-15"
  - id: COND-03
    description: "Contingency, incident response and configuration management plans signed and the tabletops held (POAM-022 to POAM-026, POAM-036 to POAM-040, POAM-044 to POAM-046)."
    due: "2026-12-18"
  - id: COND-04
    description: "IC-1 interconnection agreement and privacy threshold analysis signed (POAM-010, POAM-051 to POAM-053, POAM-056)."
    due: "2026-12-15"
  - id: COND-05
    description: "For the whole authorization period the GDT management service and the mission planner stay on the isolated station segment and planner data is loaded only through signed bundles; the condition of the AO's acceptance of the planner library flaws without a vendor fix (POAM-054, POAM-063)."
    due: "2027-06-30"
risk_level: moderate
rar_ref: ART-RAR
rationale: "Overall risk moderate is within the AO's tolerance without Component CIO concurrence; the worst weaknesses are funded and scheduled, no CAT I finding is open and the assessment was independent. Conditions are imposed because response rests on draft plans and the GDT flaw is unpatched; the termination date matches the mission planner end of support."
sources: [ART-RAR, ART-POAM, ART-ORG-CONTEXT, INT-104.A1, INT-104.A2, INT-104.A3]
