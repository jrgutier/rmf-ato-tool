information_types:
  - id: INF-01
    title: "Command and control data"
    description: "Routes, aircraft commands, lost-link settings and telemetry exchanged with the aircraft."
    sp800_60_ids: [D.1.3]
    confidentiality:
      base: moderate
    integrity:
      base: moderate
    availability:
      base: moderate
    privacy: false
    life_cycle:
      - stage: creation
        description: "Commands and lost-link settings are created in flight control from the imported mission plan."
        components: [CMP-C2]
      - stage: dissemination
        description: "Commands go to the aircraft and telemetry returns over the encrypted aircraft link (DF-1, DF-2)."
        components: [CMP-GDT, CMP-AV]
      - stage: use
        description: "Telemetry is displayed to the operators and logged with the command session."
        components: [CMP-C2, CMP-WS-OS]
      - stage: disposition
        description: "Session data is deleted at kit reset between missions; mission keys are zeroized after each mission."
        components: [CMP-C2, CMP-GDT]
    sources: [INT-014.A1, INT-014.A2, INT-016.A1, INT-016.A2, product/data-flows.md#top]
  - id: INF-02
    title: "Sensor video and still images"
    description: "Sensor video, clips, still images and annotations of the area of operations, released as mission products."
    sp800_60_ids: [D.1.3]
    confidentiality:
      base: moderate
    integrity:
      base: moderate
    availability:
      base: low
    privacy: false
    life_cycle:
      - stage: collection
        description: "Video is received from the aircraft sensor over the aircraft link (DF-2)."
        components: [CMP-AV, CMP-GDT]
      - stage: processing
        description: "The video application records, clips and annotates the video."
        components: [CMP-VIDEO]
      - stage: storage
        description: "Recordings are held on the encrypted workstation disk; released products queue while the uplink is down."
        components: [CMP-WS-HW, CMP-VIDEO]
      - stage: dissemination
        description: "Products released by the commander go to the brigade intelligence system over TLS (DF-4)."
        components: [CMP-VIDEO, CMP-ROUTER]
      - stage: disposition
        description: "Recordings are deleted once transferred and verified, at the latest at kit reset; disks are sanitized before a kit leaves the program."
        components: [CMP-WS-HW]
    sources: [INT-014.A1, INT-014.A2, INT-016.A1, INT-016.A2, product/data-flows.md#mission]
  - id: INF-03
    title: "Mission plans and flight logs"
    description: "Planned and flown routes, times and altitudes."
    sp800_60_ids: [D.1.3]
    confidentiality:
      base: moderate
    integrity:
      base: moderate
    availability:
      base: low
    privacy: false
    life_cycle:
      - stage: creation
        description: "The crew plans the route in the mission planner and the commander approves it."
        components: [CMP-PLANNER]
      - stage: processing
        description: "The plan is imported into flight control as a local file with an integrity hash (DF-3); flown routes are logged."
        components: [CMP-PLANNER, CMP-C2]
      - stage: dissemination
        description: "Flight logs travel with the released mission products (DF-4)."
        components: [CMP-ROUTER]
      - stage: disposition
        description: "Plans and logs are deleted from the station once transferred, at the latest at kit reset."
        components: [CMP-WS-HW]
    sources: [INT-014.A1, INT-014.A2, INT-016.A1, INT-016.A2, product/data-flows.md#top]
  - id: INF-04
    title: "Map and terrain data"
    description: "Published map and terrain products loaded before a mission (organization-defined type)."
    sp800_60_ids: []
    confidentiality:
      base: low
    integrity:
      base: moderate
    availability:
      base: low
    privacy: false
    life_cycle:
      - stage: collection
        description: "The map package arrives on controlled removable media with a signature check (DF-8)."
        components: [CMP-WS-OS]
      - stage: use
        description: "The mission planner uses the maps for route planning."
        components: [CMP-PLANNER]
      - stage: disposition
        description: "Superseded map packages are deleted when the next package is loaded."
        components: [CMP-PLANNER]
    sources: [INT-014.A1, INT-014.A2, INT-016.A2, product/data-flows.md#management]
  - id: INF-05
    title: "Security management data"
    description: "User accounts and roles, configuration, cryptographic keys and audit records, including user names and CAC-derived identifiers."
    sp800_60_ids: [C.3.5.5, C.3.5.8]
    confidentiality:
      base: moderate
    integrity:
      base: moderate
    availability:
      base: low
    privacy: true
    life_cycle:
      - stage: creation
        description: "Accounts come from brigade directory groups; the station generates audit records and configuration."
        components: [CMP-WS-OS, CMP-ROUTER, CMP-C2, CMP-VIDEO]
      - stage: storage
        description: "Audit records are held on the station for 90 days."
        components: [CMP-WS-OS, CMP-ROUTER]
      - stage: dissemination
        description: "Audit records are forwarded to the enclave log collector over TLS when the uplink is up (DF-5)."
        components: [CMP-ROUTER]
      - stage: disposition
        description: "Local audit records age out after 90 days; mission keys are zeroized after each mission; disks are sanitized before a kit leaves the program."
        components: [CMP-WS-HW, CMP-GDT]
    sources: [INT-014.A1, INT-014.A3, INT-015.A1, INT-016.A2, product/architecture.md#logging]
