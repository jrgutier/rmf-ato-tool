risks:
  - id: RSK-001
    title: "Unattributable misuse of shared privileged accounts"
    description: "Threat TE-5 (insider misuse or error, or an outsider with a disclosed credential); weakness: one shared gcsmaint credential on every workstation and router and a never-changed GDT administrator password; effect: privileged changes to any station without an attributable record."
    likelihood: moderate
    impact: high
    level: moderate
    finding_refs: [FND-001, FND-003, FND-004, FND-006, FND-009, FND-019, FND-020, FND-027, FND-028, FND-029, FND-030, FND-031, FND-032, FND-033, FND-034, FND-035, FND-043, FND-047, FND-048, FND-060, STG-001, STG-002]
    poam_refs: [POAM-001, POAM-003, POAM-004, POAM-006, POAM-009, POAM-019, POAM-020, POAM-027, POAM-028, POAM-029, POAM-030, POAM-031, POAM-032, POAM-033, POAM-034, POAM-035, POAM-043, POAM-047, POAM-048, POAM-060]
    response: mitigate
    sources: [INT-100.A1, INT-101.A1, INT-101.A3]
  - id: RSK-002
    title: "Attacks go unnoticed in local-only and unreviewed logs"
    description: "Threat TE-8 (adversary activity while disconnected); weakness: planner and GDT logs stay on the devices, station logs are not reviewed while disconnected, events are not correlated; effect: intrusion or misuse undetected for days."
    likelihood: moderate
    impact: moderate
    level: moderate
    finding_refs: [FND-002, FND-005, FND-007, FND-008, FND-013, FND-041, FND-042, FND-050, FND-057, FND-064, FND-065, FND-066, FND-067]
    poam_refs: [POAM-002, POAM-005, POAM-007, POAM-008, POAM-013, POAM-041, POAM-042, POAM-050, POAM-057, POAM-064, POAM-065, POAM-066, POAM-067]
    response: mitigate
    sources: [INT-100.A3, INT-101.A1, INT-101.A3]
  - id: RSK-003
    title: "Exploitation of known GDT and mission planner vulnerabilities"
    description: "Threats TE-6 and TE-7 (adversary on the station segment or via removable media); weakness: GDT management web service crash flaw pending firmware 5.2.1 and planner library flaws without a vendor fix; effect: loss of the GDT management service or compromise of the planner."
    likelihood: moderate
    impact: moderate
    level: moderate
    finding_refs: [FND-054, FND-062, FND-063]
    poam_refs: [POAM-054, POAM-062, POAM-063]
    response: mitigate
    sources: [INT-100.A2, INT-101.A1, INT-101.A3]
  - id: RSK-004
    title: "Unassessed mission planner hardening and configuration"
    description: "Threat TE-7 (exploitation of a misconfigured planner); weakness: planner, flight control and video application settings unverified, planner hardening, documentation and input validation untested, STIG items STG-003 to STG-005 not reviewed; effect: an unknown configuration weakness is exploited."
    likelihood: low
    impact: moderate
    level: low
    finding_refs: [FND-021, FND-059, FND-061, FND-068, STG-003, STG-004, STG-005]
    poam_refs: [POAM-021, POAM-059, POAM-061, POAM-068]
    response: mitigate
    sources: [INT-100.A2, INT-101.A1]
  - id: RSK-005
    title: "Incidents and outages handled without written, tested plans"
    description: "Threats TE-1, TE-3 and TE-6 realized; weakness: contingency, incident response and configuration management plans are drafts, never tested, and no one is trained; effect: slow or wrong response that extends mission loss."
    likelihood: moderate
    impact: moderate
    level: moderate
    finding_refs: [FND-022, FND-023, FND-024, FND-025, FND-026, FND-036, FND-037, FND-038, FND-039, FND-040, FND-044, FND-045, FND-046]
    poam_refs: [POAM-022, POAM-023, POAM-024, POAM-025, POAM-026, POAM-036, POAM-037, POAM-038, POAM-039, POAM-040, POAM-044, POAM-045, POAM-046]
    response: mitigate
    sources: [INT-100.A3, INT-101.A1, INT-099.A1]
  - id: RSK-006
    title: "Mission planner end of support without a replacement"
    description: "Threats TE-4 and TE-7; weakness: vendor support ends 2027-06 with no replacement selected; effect: flaws found after that date stay unfixed."
    likelihood: low
    impact: high
    level: low
    finding_refs: [FND-058, FND-069]
    poam_refs: [POAM-058, POAM-069]
    response: mitigate
    sources: [INT-100.A3, INT-101.A1, INT-101.A3, INT-098.A3]
  - id: RSK-007
    title: "Continuous monitoring and governance not yet operating"
    description: "Threat TE-8 over time; weakness: ongoing assessment, trend, effectiveness and consistency analysis and the dashboard have not started, the POA&M and authorization did not exist at assessment, supplier diversity is undocumented; effect: control drift is not detected."
    likelihood: low
    impact: low
    level: low
    finding_refs: [FND-011, FND-012, FND-014, FND-015, FND-016, FND-017, FND-018, FND-049, FND-055]
    poam_refs: [POAM-011, POAM-012, POAM-014, POAM-015, POAM-016, POAM-017, POAM-018, POAM-049, POAM-055]
    response: mitigate
    sources: [INT-100.A3, INT-101.A1, INT-099.A2, INT-099.A3]
  - id: RSK-008
    title: "Interconnection operated without a signed agreement"
    description: "Weakness: the IC-1 interconnection agreement is out for signature; effect: security responsibilities at the enclave connection are not binding."
    likelihood: low
    impact: low
    level: low
    finding_refs: [FND-010]
    poam_refs: [POAM-010]
    response: mitigate
    sources: [INT-100.A3, INT-101.A1, INT-099.A2]
  - id: RSK-009
    title: "PII processed before privacy approvals"
    description: "Threat TE-2 (exposure of operator identifiers); weakness: privacy threshold analysis, authority and purposes not approved and the station is not in the PII inventory; effect: PII processing without documented authority."
    likelihood: low
    impact: low
    level: low
    finding_refs: [FND-051, FND-052, FND-053, FND-056]
    poam_refs: [POAM-051, POAM-052, POAM-053, POAM-056]
    response: mitigate
    sources: [INT-100.A3, INT-101.A1, INT-099.A2]
overall_risk: moderate
sources: [ART-SAR, ART-POAM, ART-RA, ART-ORG-CONTEXT, INT-100.A1, INT-101.A1, INT-101.A2]
