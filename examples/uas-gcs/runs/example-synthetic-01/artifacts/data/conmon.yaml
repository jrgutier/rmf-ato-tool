frequencies:
  - family: ac
    frequency: quarterly
    method: "Account and role-group review by the ISSO against the brigade directory; the shared gcsmaint and GDT administrator accounts are reviewed each quarter until release 2.4 removes them."
    responsible: PER-ISSO
  - family: at
    frequency: annually
    method: "Training record check of operators and maintainers; one third of controls assessed by the SCA each year."
    responsible: PER-ISSM
  - family: au
    frequency: weekly
    method: "ISSO review of the weekly station log report, including a manual check of the local mission planner and GDT logs; the enclave reviews forwarded workstation and router logs daily."
    responsible: PER-ISSO
  - family: ca
    frequency: quarterly
    method: "ISSM posture review of metrics and POA&M status, reported to the AO; independent SCA assessment of one third of the controls each year."
    responsible: PER-ISSM
  - family: cm
    frequency: continuous
    method: "Automated start-up and pre-upload compliance check on every station before each mission; STIG scan monthly when connected, on reconnection and with each signed bundle."
    responsible: PER-ISSO
  - family: cp
    frequency: annually
    method: "Contingency plan review and test, and after each exercise or real outage."
    responsible: PER-ISSM
  - family: ia
    frequency: quarterly
    method: "Authenticator and account review by the ISSO with the ac review, including the GDT vendor administrator password."
    responsible: PER-ISSO
  - family: ir
    frequency: annually
    method: "Incident response plan review and exercise with the CSSP, and after every incident."
    responsible: PER-ISSM
  - family: ma
    frequency: quarterly
    method: "Review of maintenance records and maintenance media handling at each station."
    responsible: PER-ISSO
  - family: mp
    frequency: quarterly
    method: "Review of removable media logs and the media scanning record."
    responsible: PER-ISSO
  - family: pe
    frequency: event-driven
    method: "Tamper seal and kit inventory check at receipt and at each setup; the ISSO records exceptions."
    responsible: PER-ISSO
  - family: pl
    frequency: annually
    method: "Security plan and rules of behavior review, and after each significant change."
    responsible: PER-ISSM
  - family: pm
    frequency: annually
    method: "Inherited from the Component cybersecurity program; the ISSM confirms the program controls remain in force."
    responsible: PER-ISSM
  - family: ps
    frequency: annually
    method: "Review of personnel screening and access agreements for operators and maintainers."
    responsible: PER-ISSM
  - family: pt
    frequency: annually
    method: "Privacy officer review of the PII held in audit records and the privacy threshold analysis."
    responsible: PER-PRIV
  - family: ra
    frequency: monthly
    method: "Vulnerability scan of every component monthly when connected and on every reconnection; risk assessment review yearly and after a threat change."
    responsible: PER-ISSO
  - family: sa
    frequency: annually
    method: "Review of integrator contract deliverables, developer testing and flaw reports with each release."
    responsible: PER-ISSM
  - family: sc
    frequency: monthly
    method: "Router and host firewall rule verification with the STIG scan; boundary monitoring inherited from the enclave runs continuously."
    responsible: PER-ISSO
  - family: si
    frequency: monthly
    method: "Bundle level and flaw remediation status per station from the start-up check, tracked against remediation periods; enclave intrusion detection on forwarded data."
    responsible: PER-ISSO
  - family: sr
    frequency: annually
    method: "Supply chain risk management plan review and supplier review of the integrator and component vendors, including mission planner end-of-support tracking."
    responsible: PER-ISSM
ongoing_authorization:
  time_trigger_days: 365
  event_triggers:
    - "Significant change to the boundary, components or bundle content"
    - "New critical vulnerability without a mitigation"
    - "Missed remediation date on a high-risk POA&M item"
    - "Confirmed incident on a station"
    - "Captured or lost station kit"
    - "Threat change that raises TE-1, TE-3, TE-5 or TE-6 to high"
    - "Change to or lapse of the Brigade Tactical Network Enclave ATO or its brigade services"
reporting:
  recipients: [PER-AO, PER-AODR, PER-CISO]
  frequency: quarterly
sources: [INT-057.A1, INT-057.A2, INT-057.A3, INT-058.A1, INT-058.A2, INT-007.A1, ART-ORG-CONTEXT, ART-RA, ART-SSP]
