scope:
  include: baseline
  excluded_controls: []
assessment_subjects:
  - type: component
    include: all
team:
  - persona: PER-SCA
    role: "Lead assessor and SCA of record (Aviation Systems SCA team)"
    independent: true
  - persona: PER-SCA
    role: "Technical assessor: scans and technical tests"
    independent: true
  - persona: PER-PRIV
    role: "Privacy analyst from the Component privacy officer's staff: pt controls and Privacy Overlay"
    independent: true
schedule:
  start: "2026-09-14"
  end: "2026-10-09"
  events:
    - date: "2026-09-14"
      description: "Assessment kickoff with the ISSM, ISSO and brigade S6"
      kind: kickoff
    - date: "2026-09-15"
      description: "Document examination and interviews (through 2026-09-18)"
      kind: interview
    - date: "2026-09-21"
      description: "Examine the cp-4 and ir-3 plans and tabletop schedule (the tabletops are scheduled for the week of 2026-11-16, after the window)"
      kind: other
    - date: "2026-09-22"
      description: "Spot STIG and vulnerability scans on two test stations (through 2026-09-23)"
      kind: scan
    - date: "2026-07-13"
      description: "Reuse of developmental test event DT-1 results (2026-07-13 to 2026-07-24)"
      kind: dt-e
    - date: "2026-10-01"
      description: "Assessment out-brief to the ISSM and PER-AODR"
      kind: out-brief
rules_of_engagement: "Scans and tests only on the six pre-production stations at the test range; never on the brigade enclave, a fielded station, a powered aircraft or a radiating GDT. Credentialed scans use an assessor account the ISSO creates and removes. The ISSM and brigade S6 get 48 hours notice before any scan; the ISSO may halt testing for safety. Findings go to the ISSM daily and no data leaves the test range."
sources: [INT-066.A1, INT-066.A2, INT-066.A3, INT-066.A4, INT-066.A5, INT-067.A2, product/test-results.md#dt-1]
