actions:
  - control_id: si-7.15
    action: add
    rationale: "Supplements the baseline for REQ-04 and the update and removable-media risks: only signed bundles install."
    sources: [INT-031.A3, ART-REQ, ART-RA]
  - control_id: si-7.15
    action: parameter
    parameter:
      param_id: si-07.15_odp
      value: "the integrator's quarterly update bundle and the GDT firmware images"
    rationale: "Components the ISSM named for code authentication."
    sources: [INT-031.A3]
  - control_id: cm-14
    action: parameter
    parameter:
      param_id: cm-14_odp.01
      value: "the integrator's quarterly update bundle"
    rationale: "Software installed only from the signed integrator bundle (REQ-04)."
    sources: [INT-031.A3]
  - control_id: cm-14
    action: parameter
    parameter:
      param_id: cm-14_odp.02
      value: "GDT firmware images"
    rationale: "Firmware installed only when signed (REQ-04)."
    sources: [INT-031.A3]
  - control_id: ac-2
    action: parameter
    parameter:
      param_id: ac-02_odp.10
      value: "quarterly"
    rationale: "Organizational continuous monitoring strategy sets quarterly account reviews."
    sources: [INT-031.A4, ART-ORG-CONTEXT]
  - control_id: ra-5
    action: parameter
    parameter:
      param_id: ra-05_odp.01
      value: "at least monthly when connected and on every reconnection"
    rationale: "Organizational monitoring frequency adjusted for disconnected operations."
    sources: [INT-031.A4, ART-ORG-CONTEXT]
  - control_id: cp-7
    action: parameter
    parameter:
      param_id: cp-07_odp.01
      value: "mission planning and flight control"
    rationale: "Essential functions a spare station takes over (REQ-10)."
    sources: [INT-031.A4, ART-REQ]
  - control_id: cp-7
    action: parameter
    parameter:
      param_id: cp-07_odp.02
      value: "4 hours"
    rationale: "Recovery time from REQ-10."
    sources: [INT-031.A4, ART-REQ]
  - control_id: cp-2
    action: parameter
    parameter:
      param_id: cp-02_odp.05
      value: "annually"
    rationale: "Contingency plan review frequency set by the ISSM."
    sources: [INT-031.A4]
  - control_id: au-6
    action: parameter
    parameter:
      param_id: au-06_odp.01
      value: "weekly on the station while disconnected; daily by the enclave for collected records"
    rationale: "Hybrid review split between the ISSO and the enclave provider."
    sources: [INT-031.A4, INT-032.A1]
