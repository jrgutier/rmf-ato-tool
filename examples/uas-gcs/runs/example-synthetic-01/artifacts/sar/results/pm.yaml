findings:
  - id: FND-051
    control_id: pm-5.1
    title: "Station not entered in the Component PII inventory"
    description: "pm-5.1 requires an inventory of systems that process PII. The Component inventory exists, but the station's entry is made from the approved privacy threshold analysis, which still lacks the SAOP designee's signature (open S-6 condition). Same root cause as FND-052 and FND-053."
    status: open
    severity: low
    recommendation: "Obtain the privacy threshold analysis approval and enter the station in the Component PII inventory."
    sources: [INT-086.A1]
