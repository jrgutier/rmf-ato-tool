findings:
  - id: FND-001
    control_id: ac-2
    title: "Shared maintenance and GDT administrator accounts are not individually assigned"
    description: "ac-2 requires accounts assigned to individuals. The shared gcsmaint account on each workstation and router is used by 5 maintainers, and the GDT has one vendor administrator account; the 2026-09-08 review recorded the gap."
    status: open
    severity: moderate
    recommendation: "Replace gcsmaint and the GDT vendor account with per-maintainer accounts and offline CAC sign-in (release 2.4); until then keep a signed maintenance log naming the user of each session."
    sources: [INT-068.A2, product/test-results.md#account-review]
  - id: FND-002
    control_id: ac-2.4
    title: "GDT administrator account events are not forwarded for audit"
    description: "ac-2.4 requires account actions audited and notified. The GDT keeps administrator account events only in a local log that is not forwarded to the enclave collector."
    status: open
    severity: low
    recommendation: "Forward GDT logs to the collector, or until then have the ISSO export and review the GDT log at each reconnect."
    sources: [INT-068.A2, product/test-results.md#dt-1]
  - id: FND-003
    control_id: ac-2.7
    title: "Privileged roles include shared accounts not tied to individual users"
    description: "ac-2.7 requires privileged accounts managed per role and user. gcsmaint and the GDT vendor administrator account are privileged and shared."
    status: open
    severity: moderate
    recommendation: "Per-maintainer privileged accounts in release 2.4; record who holds the GDT administrator credential."
    sources: [INT-068.A2]
  - id: FND-004
    control_id: ac-2.9
    title: "Use of shared accounts cannot be attributed to a person"
    description: "ac-2.9 allows shared accounts only under defined conditions. Logs show gcsmaint but not who used it, and the paper log covers scheduled work only."
    status: open
    severity: moderate
    recommendation: "Retire the shared accounts in release 2.4; meanwhile log every gcsmaint and GDT administrator session with the maintainer's name."
    sources: [INT-068.A2, product/test-results.md#account-review]
  - id: FND-005
    control_id: ac-2.12
    title: "Account use is not monitored while stations are disconnected"
    description: "ac-2.12 requires monitoring for atypical account use. S6 reviews logs only after reconnect, and the ISSO weekly station report is not in operational use."
    status: open
    severity: moderate
    recommendation: "Put the ISSO weekly station report into operational use and review station logs locally during disconnected periods."
    sources: [INT-068.A3]
  - id: FND-006
    control_id: ac-6.9
    title: "Privileged functions on the GDT and under gcsmaint are not attributably logged"
    description: "ac-6.9 requires logging the use of privileged functions. GDT administrator actions stay in the GDT's local log, and gcsmaint actions are logged without the person."
    status: open
    severity: moderate
    recommendation: "Forward GDT logs and replace gcsmaint with per-maintainer accounts (release 2.4)."
    sources: [INT-068.A2]
