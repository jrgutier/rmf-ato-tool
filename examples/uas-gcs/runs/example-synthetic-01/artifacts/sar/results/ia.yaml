findings:
  - id: FND-027
    control_id: ia-2
    title: "Maintainers and the GDT administrator are not uniquely identified and authenticated"
    description: "ia-2 requires unique identification and authentication of users. The 2026-09-08 review shows 5 maintainers sharing gcsmaint on each workstation and router, and the GDT has one vendor administrator account. Open STIG findings STG-001 (workstation) and STG-002 (router), CAT II, record the same gap."
    status: open
    severity: moderate
    recommendation: "Deliver per-maintainer accounts with offline CAC sign-in and a per-person GDT administrator account in release 2.4; until then log the named user of every session."
    sources: [INT-077.A1, product/test-results.md#account-review]
  - id: FND-028
    control_id: ia-2.1
    title: "Privileged maintenance access is single-factor"
    description: "ia-2.1 requires multifactor authentication to privileged accounts. gcsmaint and the GDT administrator account accept a password only."
    status: open
    severity: moderate
    recommendation: "Require CAC and PIN for maintainer access in release 2.4."
    sources: [INT-077.A1]
  - id: FND-029
    control_id: ia-2.5
    title: "Shared gcsmaint used without prior individual authentication"
    description: "ia-2.5 requires individual authentication before a shared account is used. Maintainers sign in to gcsmaint directly."
    status: open
    severity: moderate
    recommendation: "Retire gcsmaint, or gate it behind individual CAC sign-in, in release 2.4."
    sources: [INT-077.A1]
  - id: FND-030
    control_id: ia-2.6
    title: "Maintenance access uses no separate authentication device"
    description: "ia-2.6 requires one factor on a separate device for the defined access. gcsmaint and GDT administrator access use only a password."
    status: open
    severity: low
    recommendation: "Use the CAC as the separate device for maintainer access in release 2.4."
    sources: [INT-077.A1]
  - id: FND-031
    control_id: ia-4
    title: "Shared identifiers are not assigned to individuals"
    description: "ia-4 requires identifiers assigned to an individual, group, role or device under authorization. The gcsmaint and GDT vendor administrator identifiers are used by several people and assigned to none."
    status: open
    severity: moderate
    recommendation: "Issue per-maintainer identifiers in release 2.4 and record their assignment on signed requests."
    sources: [INT-077.A1, product/test-results.md#account-review]
  - id: FND-032
    control_id: ia-5
    title: "GDT administrator password never changed; gcsmaint password shared"
    description: "ia-5 requires authenticator management including change and protection. The GDT administrator password has not changed since installation, and the gcsmaint password is shared by 5 people."
    status: open
    severity: moderate
    recommendation: "Change the GDT administrator password now and on a 60-day cycle; replace shared passwords with per-person authenticators in release 2.4."
    sources: [INT-077.A1]
  - id: FND-033
    control_id: ia-5.1
    title: "Password-based authentication does not meet requirements for shared and GDT accounts"
    description: "ia-5.1 requires password composition, change and protection rules. The GDT administrator password has no change cycle and the gcsmaint password is shared."
    status: open
    severity: moderate
    recommendation: "Apply the 60-day change and composition rules to the GDT account now; retire shared passwords in release 2.4."
    sources: [INT-077.A1]
  - id: FND-034
    control_id: ia-5.6
    title: "gcsmaint authenticator is not protected from disclosure"
    description: "ia-5.6 requires authenticators protected commensurate with the access they permit. The privileged gcsmaint password is known to all 5 maintainers."
    status: open
    severity: moderate
    recommendation: "Replace the shared password with per-person authenticators in release 2.4."
    sources: [INT-077.A1, product/test-results.md#account-review]
  - id: FND-035
    control_id: ia-5.8
    title: "Same shared account across all workstations and routers"
    description: "ia-5.8 requires managing the risk of one account on multiple systems. gcsmaint has the same password on every workstation and router, so one disclosure exposes all stations."
    status: open
    severity: moderate
    recommendation: "Per-maintainer accounts in release 2.4; meanwhile set a distinct gcsmaint password per device."
    sources: [INT-077.A1, product/test-results.md#account-review]
