findings:
  - id: FND-047
    control_id: ma-2
    title: "Maintenance records do not identify the maintainer"
    description: "ma-2 requires maintenance records including who performed the work. Logs show the shared gcsmaint account; the maintainer is named only for scheduled work."
    status: open
    severity: low
    recommendation: "Name the maintainer for every logged action now; individual maintainer accounts in release 2.4."
    sources: [INT-077.A4, product/test-results.md#account-review]
  - id: FND-048
    control_id: ma-3.5
    title: "Privileged maintenance tool use not attributable"
    description: "ma-3.5 requires monitoring the use of maintenance tools with privileged access. Under gcsmaint the person using privileged tools is not recorded."
    status: open
    severity: moderate
    recommendation: "Individual maintainer accounts in release 2.4; meanwhile a signed log of each privileged session."
    sources: [INT-077.A4]
