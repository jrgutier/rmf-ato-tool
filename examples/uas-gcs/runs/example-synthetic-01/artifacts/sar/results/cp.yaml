findings:
  - id: FND-023
    control_id: cp-2
    title: "Full station contingency plan is not written"
    description: "cp-2 requires a contingency plan with roles, responsibilities, contacts and recovery procedures. Only the plan summary exists; it states the strategy, the 4-hour restore and critical assets but no roles, contacts or step-by-step recovery."
    status: open
    severity: moderate
    recommendation: "Complete ART-CP with roles, contacts and recovery procedures before fielding and have the ISSM approve it."
    sources: [INT-073.A4]
  - id: FND-024
    control_id: cp-3
    title: "No contingency training has been given"
    description: "cp-3 requires role-based contingency training. No operator, maintainer or ISSO has been trained on the swap and restore."
    status: open
    severity: low
    recommendation: "Train operators, maintainers and the ISSO on the swap and restore before fielding, then annually."
    sources: [INT-073.A4]
  - id: FND-025
    control_id: cp-4
    title: "Contingency plan has never been tested"
    description: "cp-4 requires the plan to be tested to determine its effectiveness. No test or exercise has run and none is scheduled; only a single restore by a maintainer has been done."
    status: open
    severity: moderate
    recommendation: "Run the tabletop test with the brigade before fielding, record lessons in the plan, then test annually."
    sources: [INT-073.A4, INT-073.A5]
  - id: FND-026
    control_id: cp-4.1
    title: "Plan test not coordinated with related plans"
    description: "cp-4.1 requires the plan test to be coordinated with related plans. No test has been coordinated with the brigade continuity or enclave incident response exercises."
    status: open
    severity: low
    recommendation: "Schedule the first tabletop jointly with the brigade continuity and enclave incident response exercises."
    sources: [INT-073.A4]
