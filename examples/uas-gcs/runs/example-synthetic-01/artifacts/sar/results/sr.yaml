findings:
  - id: FND-069
    control_id: sr-3
    title: "Mission planner end of support is an unmitigated supply chain risk"
    description: "sr-3 requires processes to identify and address supply chain weaknesses. Vendor support for mission planner version 7 ends 2027-06; after that, flaws such as the open library findings will get no fix. No replacement is selected and no selection date is set. Same root cause as FND-058."
    status: open
    severity: moderate
    recommendation: "Set a selection date for the release 3.0 planner replacement that leaves time to field it before 2027-06, and record the interim risk response in the POA&M."
    sources: [INT-093.A1, product/conops.md#limitations]
