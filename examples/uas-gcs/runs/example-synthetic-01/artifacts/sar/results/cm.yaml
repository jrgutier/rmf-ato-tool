findings:
  - id: FND-019
    control_id: cm-5.1
    title: "Configuration changes under the shared gcsmaint account are not attributable"
    description: "cm-5.1 requires enforcement and audit of change access. Change records for the workstation and router show only the shared gcsmaint account, used by five maintainers, so a change cannot be tied to a person."
    status: open
    severity: moderate
    recommendation: "Per-maintainer accounts with offline CAC sign-in in release 2.4 (2027-02); until then a signed maintenance log for every gcsmaint session. M-2 2026-10-29: recurred on 2026-10-14 (etgcs-p3-ws screen-lock change)."
    sources: [INT-073.A3, product/test-results.md#account-review, product/conops.md#limitations, INT-109.A1]
  - id: FND-020
    control_id: cm-5.5
    title: "Change privileges sit with shared accounts"
    description: "cm-5.5 requires privileges to change components to be limited and reviewed. Five maintainers share gcsmaint on the workstation and router, and the GDT has one vendor administrator account, so privileged holders cannot be individually limited or reviewed."
    status: open
    severity: moderate
    recommendation: "Named maintainer accounts in release 2.4; request named administrator accounts from the GDT vendor and keep the shared credential under ISSO control with a use log meanwhile."
    sources: [INT-073.A3, product/conops.md#limitations]
  - id: FND-021
    control_id: cm-6
    title: "Mission planner, flight control and video applications have unverified configuration settings"
    description: "cm-6 requires configuration settings established and documented from secure configuration guidance. The planner has no STIG and its hand-recorded SRG hardening has never been assessed; the flight control and video applications were never checked against the SRG; none was covered by the 2026-09-15 scan (STG-003, STG-004, STG-005 not reviewed). Planner vendor support ends 2027-06."
    status: open
    severity: moderate
    recommendation: "Have the SCA review the planner, flight control and video settings against the Application Security and Development SRG, record STG-003..005 results, and decide on the replacement planner for release 3.0."
    sources: [INT-074.A3, product/test-results.md#stig-scan, product/conops.md#limitations]
  - id: FND-022
    control_id: cm-9
    title: "Full configuration management plan not approved"
    description: "cm-9 requires a configuration management plan with roles, configuration items and procedures. Only a summary is in the package; the full plan is drafted and awaiting ISSM signature."
    status: open
    severity: low
    recommendation: "Sign the full plan and replace the ART-CMP summary before the authorization decision."
    sources: [INT-074.A3]
