family: pt
determinations:
  - control_id: pt-1
    result: satisfied
    methods: [examine]
    summary: "Inherited: the Component PII processing and transparency policy and procedures, reviewed within the last year, were examined."
    sources: [INT-086.A2]
  - control_id: pt-2
    result: other-than-satisfied
    methods: [examine, interview]
    summary: "The authority is named in the draft privacy threshold analysis, but the analysis is not approved, so the authority to process is not yet determined and documented."
    finding_refs: [FND-052]
    sources: [INT-086.A1]
  - control_id: pt-3
    result: other-than-satisfied
    methods: [examine, interview]
    summary: "The two purposes are written in the draft privacy threshold analysis, which is not approved."
    finding_refs: [FND-053]
    sources: [INT-086.A1]
  - control_id: pt-4
    result: not-applicable
    methods: [examine, interview]
    summary: "PII is collected as a condition of duty access; the privacy officer confirmed consent does not apply."
    sources: [INT-086.A3]
  - control_id: pt-5
    result: satisfied
    methods: [test, examine]
    summary: "A witnessed sign-in showed the DoD consent banner before the CAC prompt; the signed rules of behavior state that identity is recorded."
    sources: [INT-083.A4]
  - control_id: pt-5.1
    result: satisfied
    methods: [test]
    summary: "The banner is shown at the point of collection, before every CAC sign-in (witnessed)."
    sources: [INT-083.A4]
  - control_id: pt-5.2
    result: not-applicable
    methods: [examine, interview]
    summary: "Not a system of records; the privacy officer re-confirmed the record fields."
    sources: [INT-086.A3]
  - control_id: pt-6
    result: not-applicable
    methods: [examine, interview]
    summary: "Nothing is retrieved by a person's identifier as a system of records."
    sources: [INT-086.A3]
  - control_id: pt-6.1
    result: not-applicable
    methods: [examine]
    summary: "Not a system of records, so there are no routine uses."
    sources: [INT-086.A3]
  - control_id: pt-6.2
    result: not-applicable
    methods: [examine]
    summary: "Not a system of records, so there are no exemption rules."
    sources: [INT-086.A3]
  - control_id: pt-7
    result: not-applicable
    methods: [examine]
    summary: "Record fields hold only names and CAC-derived identifiers; no specific categories of PII."
    sources: [INT-086.A3]
  - control_id: pt-7.1
    result: not-applicable
    methods: [examine]
    summary: "No Social Security numbers in the account or audit record fields."
    sources: [INT-086.A3]
  - control_id: pt-7.2
    result: not-applicable
    methods: [examine]
    summary: "No First Amendment information in the account or audit record fields."
    sources: [INT-086.A3]
  - control_id: pt-8
    result: not-applicable
    methods: [examine, interview]
    summary: "The station takes part in no matching program."
    sources: [INT-086.A3]
findings:
  - id: FND-052
    control_id: pt-2
    title: "Authority to process PII not approved"
    description: "pt-2 requires determining and documenting the authority that permits the processing of PII. The authority is written in the privacy threshold analysis, which still lacks the SAOP designee's signature; this is the open S-6 condition the SSP planned to close before S-6."
    status: open
    severity: low
    recommendation: "Obtain the SAOP designee's approval of the privacy threshold analysis and update the pt-2 SSP statement in A-5."
    sources: [INT-086.A1]
  - id: FND-053
    control_id: pt-3
    title: "PII processing purposes not approved"
    description: "pt-3 requires identifying and documenting the purposes for processing PII. The two purposes (access, audit attribution) are written only in the unapproved privacy threshold analysis. Same root cause as FND-052."
    status: open
    severity: low
    recommendation: "Close with FND-052: obtain the approval and update the pt-3 SSP statement in A-5."
    sources: [INT-086.A1]
