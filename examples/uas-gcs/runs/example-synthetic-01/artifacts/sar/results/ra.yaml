findings:
  - id: FND-054
    control_id: ra-5
    title: "Known GDT and mission planner vulnerabilities remain open and the planner configuration is not scanned"
    description: "ra-5 requires vulnerabilities to be scanned and remediated within defined response times. The 2026-09-15 scan's GDT management web service vulnerability (vendor rating high) awaits firmware 5.2.1, the two medium planner library findings have no vendor fix date, and the planner has no STIG so its configuration is outside the compliance scan. The GDT service is reachable only from the station internal segment."
    status: open
    severity: moderate
    recommendation: "Install firmware 5.2.1 in the 2026-12 bundle and rescan; record a risk acceptance or compensating measure for the planner library findings until the release 3.0 replacement; add an SRG-based check of the planner to the monthly scan."
    sources: [INT-087.A1, INT-088.A3, product/test-results.md#vuln-scan, INT-109.A3, product/monitoring/cycle-2026-10.md#vuln-scan]
  - id: FND-055
    control_id: ra-7
    title: "Open findings are not tracked in a POA&M"
    description: "ra-7 requires responses to findings to be tracked. Responses are recorded only in the risk assessment; no POA&M with milestones exists."
    status: closed
    severity: low
    recommendation: "Open the POA&M in A-6 with every open finding of this assessment and review it monthly. M-2 2026-10-29: closed on evidence; the A-6 POA&M tracks every open finding and is reviewed monthly."
    sources: [INT-089.A1, INT-109.A3, ART-POAM]
  - id: FND-056
    control_id: ra-8
    title: "Privacy threshold analysis not approved"
    description: "ra-8 requires a privacy impact assessment where needed. The threshold analysis that decides whether one is needed still lacks the SAOP designee's signature; the SSP planned the decision before S-6. Same root cause as FND-051..053."
    status: open
    severity: low
    recommendation: "Obtain the SAOP designee's decision on the threshold analysis and, if required, complete the privacy impact assessment."
    sources: [INT-086.A1]
  - id: FND-057
    control_id: ra-10
    title: "Threat hunting cannot see mission planner and GDT logs"
    description: "ra-10 requires threat hunting across the system. The CSSP hunt runs on the enclave collector, which receives no planner or GDT logs. Same root cause as FND-007/008."
    status: open
    severity: low
    recommendation: "Forward planner and GDT logs to the enclave collector together with the FND-007/008 fix."
    sources: [INT-090.A3, product/test-results.md#dt-1]
