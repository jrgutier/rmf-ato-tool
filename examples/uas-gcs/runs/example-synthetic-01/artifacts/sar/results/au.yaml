findings:
  - id: FND-007
    control_id: au-6
    title: "Station logs are not reviewed while disconnected, and GDT and planner logs are never reviewed"
    description: "au-6 requires audit records reviewed and analyzed at a defined frequency. The ISSO weekly station review runs only during test events, and GDT and mission planner logs are not forwarded, so no one reviews them."
    status: open
    severity: moderate
    recommendation: "Run the ISSO weekly review on every station from first fielding, set a date for GDT and planner log forwarding, and until then export and review those logs at each reconnect. M-2 2026-10-29: the interim weekly hand review ran in the cycle on all test stations; the forwarding date is still missing."
    sources: [INT-071.A2, INT-072.A1, INT-109.A1]
  - id: FND-008
    control_id: au-6.3
    title: "GDT and mission planner records are not correlated with other records"
    description: "au-6.3 requires records analyzed and correlated across repositories. GDT and planner records stay local and never reach the enclave collector."
    status: open
    severity: moderate
    recommendation: "Forward GDT and planner logs to the enclave collector; set a target date in the POA&M."
    sources: [INT-071.A2, INT-072.A1]
  - id: FND-009
    control_id: au-10
    title: "Actions under the shared gcsmaint account are not attributable"
    description: "au-10 requires irrefutable evidence of who performed an action. Records of gcsmaint actions show only the shared account name."
    status: open
    severity: moderate
    recommendation: "Per-maintainer accounts with offline CAC sign-in in release 2.4; meanwhile a signed maintenance log for every gcsmaint session."
    sources: [INT-071.A3]
