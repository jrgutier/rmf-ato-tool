findings:
  - id: FND-058
    control_id: sa-3.3
    title: "No replacement selected for the mission planner before end of support"
    description: "sa-3.3 requires a plan for technology refresh. Vendor support for the mission planner ends 2027-06; the replacement is a release 3.0 decision, the market survey has not started and there is no selection date."
    status: open
    severity: moderate
    recommendation: "Start the market survey and set a selection date that leaves time to field release 3.0 before 2027-06."
    sources: [INT-089.A3, INT-088.A3]
  - id: FND-059
    control_id: sa-5
    title: "No security documentation for the mission planner"
    description: "sa-5 requires administrator documentation for secure configuration. The planner vendor publishes no security guide, and the integrator's hand-hardening list has never been verified."
    status: open
    severity: low
    recommendation: "Have the integrator turn the hand-hardening list into a verified configuration guide checked against the Application Security and Development SRG."
    sources: [INT-088.A3]
  - id: FND-060
    control_id: sa-8.22
    title: "Accountability not designed in for maintenance actions"
    description: "sa-8.22 requires accountability and traceability. Maintenance under the shared gcsmaint account cannot be tied to a person. Same root cause as FND-009, FND-019 and FND-027."
    status: open
    severity: moderate
    recommendation: "Deliver per-maintainer accounts with offline CAC sign-in in release 2.4 (2027-02)."
    sources: [INT-089.A3, product/test-results.md#account-review]
  - id: FND-061
    control_id: sa-11
    title: "Mission planner hardening untested"
    description: "sa-11 requires developer security testing. Neither developer testing nor DT-1 covered the planner's hardening, and no SRG check was run during this assessment (STG-003 not reviewed). Same gap as FND-021."
    status: open
    severity: low
    recommendation: "Run an SRG-based test of the planner hardening before the next release and record the result in the STIG summary."
    sources: [INT-088.A3, product/test-results.md#dt-1]
