findings:
  - id: FND-036
    control_id: ir-2
    title: "No incident response training"
    description: "ir-2 requires role-based incident response training. No operator, maintainer or ISSO has been trained."
    status: open
    severity: moderate
    recommendation: "Train operators, maintainers and the ISSO before fielding and record it."
    sources: [INT-077.A3]
  - id: FND-037
    control_id: ir-2.3
    title: "No breach-handling training"
    description: "ir-2.3 requires training on responding to breaches of personally identifiable information. None has been given."
    status: open
    severity: low
    recommendation: "Add breach handling to the incident response training before fielding."
    sources: [INT-077.A3]
  - id: FND-038
    control_id: ir-3
    title: "Incident response capability never tested"
    description: "ir-3 requires testing the incident response capability. No test or tabletop has been held (the tabletop is scheduled for the week of 2026-11-16, after the assessment window)."
    status: open
    severity: moderate
    recommendation: "Hold a tabletop with the brigade and the CSSP before fielding and record the lessons."
    sources: [INT-077.A3, INT-063.A2]
  - id: FND-039
    control_id: ir-3.2
    title: "Incident response test not coordinated with related plans"
    description: "ir-3.2 requires coordinating the test with related plans. No test has been coordinated with the brigade or the CSSP."
    status: open
    severity: low
    recommendation: "Run the first tabletop jointly with the brigade and the CSSP."
    sources: [INT-077.A3]
  - id: FND-040
    control_id: ir-4
    title: "Station incident handling procedure not written"
    description: "ir-4 requires an incident handling capability covering preparation, detection, containment, eradication and recovery. CSSP support works and isolation and reimage were walked through, but the station-level procedure exists only as the ART-IRP summary."
    status: open
    severity: moderate
    recommendation: "Write the station handling procedures in the full ART-IRP before fielding."
    sources: [INT-077.A3, INT-079.A1]
  - id: FND-041
    control_id: ir-4.1
    title: "Planner and GDT incidents handled without automated support"
    description: "ir-4.1 requires automated support for incident handling. DT-1 confirmed mission planner and GDT logs are not forwarded to the collector."
    status: open
    severity: moderate
    recommendation: "Forward planner and GDT logs to the enclave collector and set a delivery date (S-6 condition 4)."
    sources: [product/test-results.md#dt-1, INT-077.A3]
  - id: FND-042
    control_id: ir-4.4
    title: "Planner and GDT events not correlated"
    description: "ir-4.4 requires correlating incident information. Planner and GDT events never reach the CSSP."
    status: open
    severity: moderate
    recommendation: "Same fix as FND-041: forward planner and GDT logs."
    sources: [product/test-results.md#dt-1, INT-079.A1]
  - id: FND-043
    control_id: ir-4.6
    title: "Insider threat handling cannot attribute maintenance actions"
    description: "ir-4.6 requires an insider threat incident handling capability. Records show gcsmaint, not the maintainer, so maintenance actions cannot be tied to a person."
    status: open
    severity: moderate
    recommendation: "Individual maintainer accounts in release 2.4; meanwhile a signed log naming the user of every gcsmaint session."
    sources: [INT-077.A3, product/test-results.md#account-review]
  - id: FND-044
    control_id: ir-8
    title: "Full incident response plan not written"
    description: "ir-8 requires an approved incident response plan with roadmap, metrics and roles. Only the ART-IRP summary exists."
    status: open
    severity: moderate
    recommendation: "Complete ART-IRP before fielding and have the ISSM approve it."
    sources: [INT-077.A3]
  - id: FND-045
    control_id: ir-8.1
    title: "Incident response plan has no breach section"
    description: "ir-8.1 requires breach-handling content in the plan. The summary has none."
    status: open
    severity: low
    recommendation: "Add the breach section to the full ART-IRP."
    sources: [INT-077.A3]
  - id: FND-046
    control_id: ir-9.2
    title: "No spillage response training"
    description: "ir-9.2 requires spillage response training. None has been given."
    status: open
    severity: low
    recommendation: "Add spillage response to the incident response training before fielding."
    sources: [INT-077.A3]
