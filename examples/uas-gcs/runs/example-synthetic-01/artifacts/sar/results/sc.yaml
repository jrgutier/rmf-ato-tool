findings:
  - id: FND-062
    control_id: sc-5
    title: "GDT management web service can be crashed from an adjacent network"
    description: "sc-5 requires protection against denial-of-service events. The GDT management web service has a published vulnerability that lets an adjacent network crash it (2026-09-15 scan); firmware 5.2.1 is in regression testing. The service answers only on the station internal segment, which the assessor confirmed. Same root cause as FND-054."
    status: open
    severity: moderate
    recommendation: "Install firmware 5.2.1 in the 2026-12 bundle and rescan; keep the internal-segment restriction until then. M-2 2026-10-29: still open on all six stations in the 2026-10-24 scan."
    sources: [INT-087.A2, INT-088.A3, product/test-results.md#vuln-scan, INT-111.A1, product/monitoring/cycle-2026-10.md#vuln-scan]
