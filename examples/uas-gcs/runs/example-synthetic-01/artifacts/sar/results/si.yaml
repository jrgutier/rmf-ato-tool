findings:
  - id: FND-063
    control_id: si-2
    title: "Known GDT and mission planner flaws are not remediated"
    description: "si-2 requires flaws to be remediated within defined times. The 2026-09-15 scan's GDT management web service vulnerability (vendor rating high, reachable only from the station internal network) awaits firmware 5.2.1 in the 2026-12 bundle; the two medium planner library findings have no vendor fix date; the 2026-10 workstation and router fixes are installed but not confirmed by a rescan. Same root cause as FND-054."
    status: open
    severity: moderate
    recommendation: "Install firmware 5.2.1 in the 2026-12 bundle and rescan all six stations; record a compensating measure or risk acceptance for the planner library findings until the release 3.0 replacement. M-2 2026-10-29: the 2026-10-24 rescan confirmed the workstation and router fixes; the GDT and planner flaws remain open."
    sources: [INT-091.A1, product/test-results.md#vuln-scan, INT-111.A2, product/monitoring/cycle-2026-10.md#vuln-scan]
  - id: FND-064
    control_id: si-4
    title: "Mission planner and GDT are not monitored"
    description: "si-4 requires the system to be monitored for attacks and unauthorized activity. Planner and GDT logs are local only (DT-1), and station monitoring is reviewed only in test-event weeks. Same root cause as FND-007."
    status: open
    severity: moderate
    recommendation: "Forward planner and GDT logs to the enclave collector; until then export and review them at each reconnect and run the weekly station review on every fielded station. M-2 2026-10-29: weekly hand review ran on the six test-range stations; forwarding still has no date."
    sources: [INT-091.A2, product/test-results.md#dt-1, INT-111.A2, product/monitoring/cycle-2026-10.md#log-reviews]
  - id: FND-065
    control_id: si-4.14
    title: "Radio-link intrusion attempts are not seen"
    description: "si-4.14 requires wireless intrusion detection. The GDT rejects unkeyed terminals (DT-1) but records attempts only in its local log, which nobody reviews."
    status: open
    severity: low
    recommendation: "Include GDT rejected-command records in the log forwarding and the ISSO review."
    sources: [INT-092.A2, product/test-results.md#dt-1, INT-111.A2]
  - id: FND-066
    control_id: si-4.16
    title: "Planner and GDT events are not correlated"
    description: "si-4.16 requires correlation of monitoring information across the system. Planner and GDT events never reach the collector. Same root cause as FND-008."
    status: open
    severity: low
    recommendation: "Forward planner and GDT logs to the enclave collector; set a target date in the POA&M."
    sources: [INT-091.A2, product/test-results.md#dt-1, INT-110.A1]
  - id: FND-067
    control_id: si-4.19
    title: "Privileged and maintainer activity is not reviewed between test events"
    description: "si-4.19 requires additional monitoring of individuals posing increased risk. The weekly report covering maintainers and administrators exists only for test-event weeks, and gcsmaint actions cannot be attributed to a person. Related to FND-007 and FND-009."
    status: open
    severity: low
    recommendation: "Run the weekly privileged-activity review on every fielded station and replace the shared gcsmaint account with individual maintainer accounts. M-2 2026-10-29: weekly review now ran every week; attribution still fails until release 2.4 (planned 2027-02)."
    sources: [INT-091.A2, product/test-results.md#account-review, INT-111.A2, product/monitoring/cycle-2026-10.md#account-review]
  - id: FND-068
    control_id: si-10
    title: "Mission planner input validation not independently tested"
    description: "si-10 requires validity checks on information inputs. The planner's validation is the vendor's own and neither developer testing nor DT-1 covered it. Same gap as FND-021 and FND-061."
    status: open
    severity: low
    recommendation: "Include input validation in the SRG-based test of the planner before the next release, or in the release 3.0 replacement's acceptance tests."
    sources: [INT-092.A2, product/conops.md#limitations]
