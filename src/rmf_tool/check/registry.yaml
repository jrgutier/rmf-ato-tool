  - id: GEN-STALE-001
    scope: run
    severity: E
    ac: [AC-17, AC-18]
    phase: p35
    applies_after: null
    summary: generated output differs from a fresh rmf build, baseline resolve or package
    fixture: tests/fixtures/negative/GEN-STALE-001.yaml
    hint: Run `rmf build <run>` and never hand-edit generated files (INV-2).
  - id: SSP-COV-001
    scope: run
    severity: E
    ac: [AC-16, AC-18]
    phase: p35
    applies_after: S-4
