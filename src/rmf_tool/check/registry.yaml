# Rule registry (plan §6.5): 344 rules, 37 repo-scope and 307 run-scope. Authoritative;
# docs/CHECKS.md is generated from it (Phase 6). `phase` is the phase from which a rule is
# enforced (plan §5.0); `applies_after` gates non --final run checks (null: always).
# Validated by registry.schema.json. Never renumber or reuse a rule ID (INV-3).
schema_version: 1
rules:
  # --- repo scope: framework (rmf validate) --------------------------------------------
  - id: FW-SCHEMA-001
    scope: repo
    severity: E
    ac: [AC-6]
    phase: p3a
    applies_after: null
    summary: framework YAML unreadable or violates framework/schema/framework.schema.json
    fixture: tests/fixtures/framework_neg/FW-SCHEMA-001/
    hint: Fix the field named in the message; the schema lists every allowed key and type.
  - id: FW-ID-001
    scope: repo
    severity: E
    ac: [AC-5]
    phase: p3a
    applies_after: null
    summary: duplicate ID across the framework
    fixture: tests/fixtures/framework_neg/FW-ID-001/
    hint: IDs are global and stable (INV-3); give the new entity a new ID instead of reusing one.
  - id: FW-ID-002
    scope: repo
    severity: E
    ac: [AC-5]
    phase: p3a
    applies_after: null
    summary: ID does not match the pattern for its entity type
    fixture: tests/fixtures/framework_neg/FW-ID-002/
    hint: Patterns live in rmf_tool.framework.model.COLLECTIONS (e.g. PH-MSA, ART-SSP, PER-AO, C-2).
  - id: FW-REF-001
    scope: repo
    severity: E
    ac: [AC-7]
    phase: p3a
    applies_after: null
    summary: dangling reference to an ID (or fact) that does not exist
    fixture: tests/fixtures/framework_neg/FW-REF-001/
    hint: Define the target entity first, or correct the ID; writes_facts names come from facts.schema.json.
  - id: FW-ART-001
    scope: repo
    severity: E
    ac: [AC-7]
    phase: p3a
    applies_after: null
    summary: artifact without a producer (no task outputs it, or its producer does not)
    fixture: tests/fixtures/framework_neg/FW-ART-001/
    hint: List the artifact in its producer task's outputs, or fix artifacts.yaml producer.
  - id: FW-TPL-001
    scope: repo
    severity: E
    ac: [AC-7]
    phase: p11
    applies_after: null
    summary: a required section of an artifact is not a heading of its template
    fixture: tests/unit/test_template_sections.py::test_fw_tpl_001_fires_on_a_heading_the_template_lacks
    hint: Name in required_sections only H2 headings of the artifact's template, or restore the heading in the template.
  - id: FW-ORD-001
    scope: repo
    severity: E
    ac: [AC-7]
    phase: p3a
    applies_after: null
    summary: an artifact's producer is not a strict ancestor of every task that updates it
    fixture: tests/fixtures/framework_neg/FW-ORD-001/
    hint: Add a depends_on path from the updater back to the producer, or move the output.
  - id: FW-IO-001
    scope: repo
    severity: E
    ac: [AC-7]
    phase: p3a
    applies_after: null
    summary: task input neither external (EXT-*) nor produced by a strict ancestor
    fixture: tests/fixtures/framework_neg/FW-IO-001/
    hint: Make the producer an ancestor via depends_on, or model the input as an EXT-* entry.
  - id: FW-RACI-001
    scope: repo
    severity: E
    ac: [AC-7]
    phase: p3a
    applies_after: null
    summary: RACI does not have exactly one Accountable persona and at least one Responsible
    fixture: tests/fixtures/framework_neg/FW-RACI-001/
    hint: Exactly one persona is accountable (raci.A); move the others to R or C.
  - id: FW-DAG-001
    scope: repo
    severity: E
    ac: [AC-7]
    phase: p3a
    applies_after: null
    summary: depends_on cycle
    fixture: tests/fixtures/framework_neg/FW-DAG-001/
    hint: Break the cycle; a loop back to an earlier task belongs in feeds_back_to, which never orders tasks.
  - id: FW-CITE-001
    scope: repo
    severity: E
    ac: [AC-8]
    phase: p3a
    applies_after: null
    summary: task, artifact, persona or decision without a citation, or a citation to an unknown reference
    fixture: tests/fixtures/framework_neg/FW-CITE-001/
    hint: Cite at least one reference ID from references/index.yaml.
  - id: FW-CITE-002
    scope: repo
    severity: E
    ac: [AC-8, AC-4a]
    phase: p3a
    applies_after: null
    summary: citation section/page/anchor not resolvable in the text extraction, or a page without an anchor
    fixture: tests/fixtures/framework_neg/FW-CITE-002/
    hint: Check it with `rmf refs show ID --section S` or `--page N --anchor A`. Citations to pending-acquisition references are deferred until p2x; degraded references need a fallback.
  - id: FW-CITE-003
    scope: repo
    severity: E
    ac: [AC-25]
    phase: p9
    applies_after: null
    summary: the framework or a persona card cites a PDF reference marked required false
    fixture: tests/unit/test_refs_currency.py::test_fw_cite_003_fires_on_an_optional_pdf
    hint: Import the document, set required true in references/index.yaml and rmf_tool.refs.required, or drop the citation.
  - id: FW-TASK-001
    scope: repo
    severity: E
    ac: [AC-5]
    phase: p3a
    applies_after: null
    summary: the NIST SP 800-37r2 task set is not exact (IDs, names, steps, levels, optional flags, TASK citation)
    fixture: tests/fixtures/framework_neg/FW-TASK-001/
    hint: Task IDs and names are pinned in rmf_tool.framework.model.TASKS_80037; each task cites SP800-37R2 "TASK X-n".
  - id: FW-PB-001
    scope: repo
    severity: E
    ac: [AC-13]
    phase: p5
    applies_after: null
    summary: task without a playbook
    fixture: tests/fixtures/repo_neg/FW-PB-001/
    hint: Run `rmf playbooks sync` to create generated playbooks; P-1..P-7 share playbooks/P/P-org-context.md.
  - id: FW-PB-002
    scope: repo
    severity: E
    ac: [AC-13]
    phase: p5
    applies_after: null
    summary: playbook header or generated body stale, or authored sections missing
    fixture: tests/fixtures/repo_neg/FW-PB-002/
    hint: Run `rmf playbooks sync`; never edit inside the CLI-owned markers.
  - id: FW-TASK-002
    scope: repo
    severity: E
    ac: [AC-28]
    phase: p10
    applies_after: null
    summary: a task lacks an entity its SP 800-37r2 Chapter 3 block maps to (inputs and consults, outputs, RACI roles) or disagrees on the SDLC phase; waived gaps name an open work item or a task-scoped rationale, and an unneeded waiver is an error
    fixture: tests/unit/test_conformance_rules.py::test_fw_task_002_fires_when_a_task_loses_an_input
    hint: Add the entity to the task, or map the phrase in conformance/nist-vocabulary.yaml. A waiver in conformance/nist-waivers.yaml needs an open work item; delete it when the gap closes.
  - id: FW-REQ-001
    scope: repo
    severity: E
    ac: [AC-29]
    phase: p10
    applies_after: null
    summary: requirements register shape, IDs or sources wrong; a page of an imported document is in no scope and no exclusion, or in two; a citation does not resolve, or its statement is not in the cited passage
    fixture: tests/unit/test_conformance_rules.py::test_fw_req_001_fires_when_a_statement_is_not_in_its_passage
    hint: Regenerate with rmf conformance extract. Every PDF and web reference in references/index.yaml needs an entry in conformance/sources.yaml whose scopes and exclusions cover every page with a reason; a pending document has no requirements file.
  - id: FW-REQ-003
    scope: repo
    severity: E
    ac: [AC-30]
    phase: p10
    applies_after: null
    summary: evidence does not resolve or is denied (a rule, schema property or entity that does not list the entry in enforces or x-enforces, a pin on an identity or prose field, an asserts text that does not share vocabulary with the statement and with what its target is about, a sentence that is not one whole marked sentence of the statement, a rule item whose fixture does not list the rule in expect.errors or does not declare its expect, an expect of one content word that is not a whole declared message or that is in no failing message of the rule, a declared claim the judge classifies otherwise), a covered requirement has only evidence that cannot fail or has several marked sentences one of which no distinct strong item cites, an enforces or x-enforces link names an entry that does not cite it, a fan-out exception lacks approved_by user, or one target of any kind backs more requirements than its cap without such an exception
    fixture: tests/unit/test_conformance_rules.py::test_fw_req_003_rejects_each_vacuous_evidence_kind
    hint: covered needs a rule with a negative fixture that fails on that rule's own clause on a wrong value (a fixture that only deletes, or a clause that only tests absence, is presence and holds a table row only) and lists the entry in enforces, a schema field its parent requires that lists it in x-enforces, a pinned non-identity value or a required template heading on an entity that lists it in enforces, each with an asserts text in the words of the statement and of the target, and with sentence naming, whole, the one sentence it proves when the entry has several marked sentences. Otherwise use partial with a reason. A target over the fan-out cap needs an exception in conformance/policy.yaml with approved_by user.
  - id: FW-REQ-004
    scope: repo
    severity: E
    ac: [AC-31]
    phase: p10
    applies_after: null
    summary: a partial, deferred, not-applicable or not-a-requirement entry has no reason, a not-a-requirement reason ignores a duty word of its statement (the extractor's MODAL and SHOULD phrases), or a partial entry has no evidence item; a deferred tier 1 entry lacks approved_by user; a reviewed entry left its source without removal_reason; a triage pattern is on a tier 1 document, too broad, over the cap, a repeat of another pattern's regexes, or its sample does not match; more than a quarter of a document is retired (not-applicable, deferred, or partial on evidence that cannot fail), however the statuses were set, with no retirements record approved by the user in conformance/policy.yaml, or more than half of its live entries are not-a-requirement with no noise record there, or such a record is stale; a register work item binds no entry and no waiver, is open with every bound entry covered, is closed while a bound entry is not covered on evidence that judges strong, or is closed-partial with a tier 1 entry partial or a bound entry undecided; a binding in conformance/bindings.yaml names no entry, several, or one carrying another work item
    fixture: tests/unit/test_conformance_rules.py::test_fw_req_004_fires_on_a_tier_1_deferral_without_approval
    hint: Write the reason, through rmf conformance mark, and give partial at least a citation; a tier 1 deferral also needs approved_by user. Narrow a triage pattern to one document and the entries its reviewer read, and review the rest one by one; a document mostly not-applicable needs a retirements record, and one mostly noise a noise record, each with approved_by user. Bind a work item through conformance/bindings.yaml and rmf conformance bind, or through a FW-TASK-002 waiver, and close it only when its entries carry evidence that judges strong.
  - id: FW-REQ-005
    scope: repo
    severity: E
    ac: [AC-32]
    phase: p10
    applies_after: null
    summary: a source text differs from the hash reviewed in conformance/text-hashes.yaml, a fresh offline extraction differs from the register, nist-tasks.yaml or the DoDI 8510.01 reference list, a scope yields too little without saying why, or an entry awaits review
    fixture: tests/unit/test_conformance_rules.py::test_fw_req_005_fires_when_a_source_document_changes
    hint: Read the change, run rmf conformance extract, re-review each entry marked needs_review (rmf conformance mark --reviewed), then rmf conformance accept-text.
  - id: FW-PER-001
    scope: repo
    severity: E
    ac: [AC-14]
    phase: p5
    applies_after: null
    summary: persona without a card
    fixture: tests/fixtures/repo_neg/FW-PER-001/
    hint: Add personas/<PER-ID>.md for every persona in framework/personas.yaml.
  - id: FW-PER-002
    scope: repo
    severity: E
    ac: [AC-14]
    phase: p5
    applies_after: null
    summary: persona card missing required sections or a resolvable citation
    fixture: tests/fixtures/repo_neg/FW-PER-002/
    hint: Cards need Responsibilities, Decision authority, Typical concerns, What they know and don't know, Question bank by step, Artifacts owned-approved, Role-play guidance, Red lines and Citations (at least one resolvable uv run rmf refs show command).
  - id: FW-MAN-001
    scope: repo
    severity: E
    ac: [AC-11]
    phase: p4
    applies_after: null
    summary: MANUAL.md or docs/manual stale
    fixture: tests/fixtures/repo_neg/FW-MAN-001/
    hint: Run `rmf render` and commit the result; never hand-edit the manual (INV-2).
  # --- repo scope: references, lessons, docs, agent lane --------------------------------
  - id: REF-001
    scope: repo
    severity: profile
    severity_note: W for pending-acquisition before p2x, E from p2x on; W for degraded with approval.
    ac: [AC-1]
    phase: p2
    applies_after: null
    summary: required reference not ok
    fixture: tests/unit/test_refs_verify.py::test_pending_required_is_warning_before_p2x_error_at_p2x
    hint: Fetch or import the reference (playbooks/_ops/fetch-blocked-refs.md); see plan §7.6 for the degraded policy.
  - id: REF-002
    scope: repo
    severity: E
    ac: [AC-4]
    phase: p2
    applies_after: null
    summary: PDF SHA-256 (or LFS pointer oid) mismatch
    fixture: tests/unit/test_refs_verify.py::test_sha_mismatch_and_missing_file
    hint: Re-fetch, or accept the new upstream with `rmf refs fetch --accept-new --note`.
  - id: REF-003
    scope: repo
    severity: E
    ac: [AC-4a]
    phase: p2
    applies_after: null
    summary: text extraction missing, stale, tuple mismatch or bad page markers
    fixture: tests/unit/test_refs_extract.py::test_check_detects_text_sha_drift
    hint: Run `rmf refs extract --id ID` (needs the EXTRACT=1 bootstrap) and commit the text.
  - id: REF-004
    scope: repo
    severity: E
    ac: [AC-3]
    phase: p2
    applies_after: null
    summary: references/INDEX.md stale
    fixture: tests/unit/test_refs_index.py::test_cli_index_write_and_check
    hint: Run `rmf refs index` and commit INDEX.md.
  - id: REF-005
    scope: repo
    severity: E
    ac: [AC-2]
    phase: p2
    applies_after: null
    summary: OSCAL pins inconsistent
    fixture: tests/unit/test_refs_oscal.py::test_oscal_versions_consistent
    hint: Bump OSCAL_VERSION, the NIST schemas and trestle together (AGENTS.md, Bumping OSCAL).
  - id: REF-006
    scope: repo
    severity: E
    ac: [AC-1]
    phase: p2
    applies_after: null
    summary: URL or redirect hop outside the allowed domains
    fixture: tests/unit/test_refs_verify.py::test_disallowed_urls
