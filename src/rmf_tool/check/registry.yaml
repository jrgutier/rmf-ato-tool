  - id: AGENT-001
    scope: repo
    severity: profile
    severity_note: W under rmf ci, E under rmf ci --release; skipped under --profile fork.
    ac: [AC-13, AC-20]
    phase: p35
    applies_after: null
    summary: agent-lane result missing, errors > 0, or stale scenario upstream_hash
    fixture: tests/fixtures/repo_neg/AGENT-001/
    hint: Re-run scripts/agent-run.sh <scenario> locally and commit the self-attested results.
