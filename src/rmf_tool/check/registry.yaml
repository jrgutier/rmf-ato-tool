  - id: REF-007
    scope: repo
    severity: E
    ac: [AC-26, AC-33]
    phase: p9
    applies_after: null
    summary: a pinned PDF's revision is vague or undated, it has no revision_stamp (or revision_source exemption), the stamp does not resolve, does not contain the revision's latest full date (or year), or the text shows a higher Change N, its date, a later updates-as-of date or a later errata date than the revision names
