  - id: REF-007
    scope: repo
    severity: E
    ac: [AC-26, AC-33]
    phase: p9
    applies_after: null
    summary: a pinned PDF's revision is vague or undated, it has no revision_stamp (or revision_source exemption), the stamp does not resolve, does not contain the revision's latest full date (or year), or the text shows a higher Change N, its date, a later updates-as-of date or a later errata date than the revision names
    fixture: tests/unit/test_refs_currency.py::test_ref_007_requires_a_stamp_unless_revision_source_gives_a_reason
    hint: State the edition, date and change number the text shows; point revision_stamp at that passage (rmf refs show ID --page N --anchor A), or declare revision_source with the reason none exists.
  - id: REF-008
    scope: repo
    severity: W
    ac: [AC-27]
    phase: p9
    applies_after: null
    summary: OSCAL catalog controls absent from a PDF's text and not declared in oscal_only_controls
    fixture: tests/unit/test_refs_currency.py::test_ref_008_flags_undeclared_oscal_only_controls
    hint: List the control IDs in the entry's oscal_only_controls (normalised, as AC-2(1)) and explain them in revision_note.
  - id: LES-002
    scope: repo
    severity: E
    ac: [AC-22]
    phase: p1
    applies_after: null
    summary: docs/LESSONS.md malformed or not append-only versus resolve_base()
    fixture: tests/unit/test_lessons.py::test_append_only_vs_merge_base
    hint: Append new entries with the next ID; never edit or delete an existing entry.
  - id: LES-003
    scope: repo
    severity: E
    ac: [AC-22]
    phase: p1
    applies_after: null
    summary: "'Promotion: pending' present"
    fixture: tests/unit/test_lessons.py::test_pending_promotion_fails
    hint: Triage the lesson in the same change (check, LR-nn, INV-n, or none with a reason).
  - id: DOC-001
    scope: repo
    severity: E
    ac: [AC-21]
    phase: p1
    applies_after: null
    summary: AGENTS.md sections, length or CLI command list wrong
    fixture: tests/unit/test_agents_md.py::test_commands_registered_and_documented
    hint: Keep the eight fixed H2 sections, at most 250 lines, and list every registered command.
  - id: DOC-002
    scope: repo
    severity: E
    ac: [AC-24]
    phase: p8
    applies_after: null
    summary: a count stated in README.md, AGENTS.md or the registry.yaml header differs from the computed value
