name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # LFS objects are pulled after the cache restore below; with `lfs: true` checkout
      # would download them first and the cache would never save a transfer (L-0008).
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0  # rmf lessons check diffs against the merge-base with origin/main

      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: git lfs pull

      - name: Bootstrap
        run: EXTRACT=1 scripts/bootstrap.sh

      - name: rmf ci
        run: uv run rmf ci --slow

      - name: Show mandatory access denials
        if: failure()
        run: |
          sudo aa-status || true
          sudo journalctl -k | grep -i denied | tail -50 || true
          sudo dmesg | grep -i -E 'apparmor|denied' | tail -20 || true
          probe="$(mktemp -d)"
          for name in .probe.part probe.part .probe.pdf probe.pdf; do
            for mode in 600 644; do
              install -m "$mode" references/pdf/FIPS200.pdf "$probe/$name"
              qpdf --check "$probe/$name" > /dev/null 2>&1; echo "$name $mode: exit $?"
            done
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
