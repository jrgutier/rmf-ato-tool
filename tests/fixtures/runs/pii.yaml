- op: write_file
  file: artifacts/data/pia.yaml
  content: |
    form: DD-2930
    assessment:
      conformance: Operator account data is handled under DoD 5400.11-R and the published SORN.
      need: Accounts tie each console session to a CAC holder.
      risks: Exposure of operator identities to an intruder on the console host.
      effects: An exposed roster could let an adversary target operators.
      protections: Account data stays on the console host behind multi-factor logon.
      alternatives: Holding only the DoD ID number was examined and kept as the default.
    coordination:
      - {party: issm, by: PER-ISSM, date: '2026-09-01', sources: [INT-042.A1]}
