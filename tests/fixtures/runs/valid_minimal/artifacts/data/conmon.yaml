frequencies:
  - {family: ac, frequency: monthly, method: Account review and audit of privileged accounts, responsible: PER-ISSO}
  - {family: au, frequency: monthly, method: SIEM forwarding check, responsible: PER-ISSO}
  - {family: cm, frequency: continuous, method: Monthly STIG and vulnerability scans with drift alerts, responsible: PER-ISSE}
  - {family: ia, frequency: quarterly, method: Identity provider configuration review, responsible: PER-ISSM}
  - {family: sc, frequency: quarterly, method: Enclave firewall rule review (common control), responsible: PER-ISSM}
  - {family: si, frequency: monthly, method: Patch compliance report, responsible: PER-ISSO}
ongoing_authorization:
  time_trigger_days: 365
  event_triggers: ["A new CAT I finding", "A change to the authorization boundary"]
reporting:
  recipients: [PER-AO, PER-ISSM]
  frequency: quarterly
sources: [INT-030.A1, INT-018.A1]
