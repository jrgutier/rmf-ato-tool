  - {term: revalidation, requirements: [REQ-07], statement: The supplier's adherence is revalidated each year., sources: [INT-026.A1]}
  - {term: reporting, requirements: [REQ-07], statement: 'The supplier reports vulnerabilities, incidents and serious disruptions within 72 hours.', sources: [INT-026.A1]}
  - {term: response-roles, requirements: [REQ-07], statement: 'The Government, supplier and third parties each have named actions for responding to a supply chain risk.', sources: [INT-026.A1]}
  - {term: termination, requirements: [REQ-07], statement: The contract may be terminated when a change to supply chain risk cannot be mitigated to an acceptable level., sources: [INT-026.A1]}
