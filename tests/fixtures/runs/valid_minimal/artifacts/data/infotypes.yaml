information_types:
  - id: INF-01
    title: Sensor reports
    description: Signed reports from field units relayed to the analysis enclave.
    sp800_60_ids: [D.2.1]
    confidentiality: {base: moderate}
    integrity: {base: moderate}
    availability: {base: low}
    selection_basis: The relay exists to move these reports; DoD CUI guidance governs them.
    privacy: false
    handling: {classification: unclassified, cui: true, cti: false, software_artifacts: false}
    life_cycle:
      - {stage: collection, description: Field units sign and send their sensor reports to the relay.}
      - {stage: dissemination, description: The relay forwards each report to the analysis enclave.}
    sources: [product/architecture.md#data-flow]
  - id: INF-02
    title: Relay configuration
    description: Configuration and account data of the relay appliance.
    sp800_60_ids: [C.3.5.1]
    confidentiality: {base: low, selected: moderate, adjustment_justification: System information is protected at the level of the most sensitive user information (FIPS 199).}
    integrity: {base: moderate}
    availability: {base: low}
    selection_basis: Configuration and account data every system holds.
    privacy: false
    system_information: true
    handling: {classification: unclassified, cui: true, cti: false, software_artifacts: false}
    life_cycle:
      - {stage: creation, description: Administrators create the configuration and accounts on the appliance.}
      - {stage: storage, description: The appliance stores its configuration and account data.}
      - {stage: disposition, description: Configuration and accounts are wiped when the appliance is decommissioned.}
    sources: [product/security.md#configuration]
