  - {id: SUP-03, name: Program developer, kind: developer, items: [INV-003], supply_chain: SC-03, criticality: critical, functions: [CF-01], priority: 1, fourth_parties: [Code hosting service], sources: [product/inventory.md#items, INT-023.A1]}
  - {id: SUP-04, name: PostgreSQL Global Development Group, kind: open-source, items: [INV-004], supply_chain: SC-04, criticality: non-critical, priority: 3, sources: [product/inventory.md#items]}
