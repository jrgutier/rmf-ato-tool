  focal_point: {threat_analysis: received, guidance: The Component TSN focal point advised a developer site review for the relay service., sources: [INT-023.A1]}
  tsn: [criticality-analysis, all-source-threat-assessment, software-assurance, hardware-assurance, procurement-strategies, anti-counterfeit, scrm-countermeasures, cyber-test-and-evaluation]
  sources: [INT-023.A1]
