  informed_by:
    - {kind: capability-requirements, document: Draft capability development document v0.4, sources: [INT-024.A1]}
    - {kind: concept-of-operations, document: FDR concept of operations, sources: [INT-024.A1]}
    - {kind: operational-mode-summary, document: FDR operational mode summary and mission profile, sources: [INT-024.A1]}
    - {kind: mission-profiles, document: FDR operational mode summary and mission profile, sources: [INT-024.A1]}
  methods:
    - {method: misuse cases for the relay and console, addresses: [design, interfaces, access-points], requirements: [REQ-01, REQ-02], sources: [INT-024.A1]}
    - {method: vulnerability analysis of the hardened hosts, addresses: [implementation], requirements: [REQ-03, REQ-04], sources: [INT-024.A1]}
  key_performance:
    - {name: System survivability KPP, kind: kpp, establishes: [survivability], requirements: [REQ-04], sources: [INT-024.A1]}
    - {name: Sustainment KPP, kind: kpp, establishes: [sustainment], requirements: [REQ-03], sources: [INT-024.A1]}
    - {name: Report protection attribute, kind: kpp-attribute, establishes: [security], based_on: [confidentiality, integrity], measures: FIPS-validated TLS and signed reports, requirements: [REQ-02], sources: [INT-024.A1]}
  exportability: [REQ-05]
  sources: [INT-024.A1]
engineering:
  practices:
    - {area: cybersecurity, stages: [design, test, manufacture, sustainment], practice: STIG hardening and secure configuration in each build, principles: [least-functionality, protective-defaults], sources: [INT-024.A1]}
    - {area: cyber-resilience, stages: [design, test, manufacture, sustainment], practice: Relay failover and restart with audit, principles: [protective-recovery], sources: [INT-024.A1]}
    - {area: cyber-survivability, stages: [design, test, manufacture, sustainment], practice: Survivability attributes tested in cyber DT&E, principles: [defense-in-depth], sources: [INT-024.A1]}
    - {area: program-protection, stages: [design, sustainment], practice: Release review against the program protection plan, sources: [INT-024.A1]}
    - {area: privacy-engineering, stages: [design], practice: Reports hold no PII by design; the privacy threshold analysis is revisited each release, sources: [INT-024.A1]}
  assurance:
    level: Moderate assurance, from independent test of the relay and console
    commensurate_with: {technology: Commodity hardware and open protocols carry no critical technology., program: A small program with one release a quarter., system: Moderate confidentiality and integrity impact., mission: Reports drive targeting decisions.}
    requirements: [REQ-01, REQ-03]
  sources: [INT-024.A1]
