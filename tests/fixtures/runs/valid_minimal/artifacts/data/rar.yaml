risks:
  - id: RSK-001
    title: Stale accounts until the first quarterly review
    description: Without an account review, accounts of departed operators could remain enabled.
    likelihood: low
    impact: moderate
    level: low
    finding_refs: [FND-001]
    poam_refs: [POAM-001]
    response: mitigate
    sources: [INT-011.A1]
  - id: RSK-002
    title: Root compromise of the relay appliance over SSH
    description: Direct root SSH login lets a stolen administrator password give full control of the appliance.
    likelihood: moderate
    impact: high
    level: moderate
    finding_refs: [FND-002, STG-002]
    poam_refs: [POAM-002, POAM-003]
    response: mitigate
    sources: [INT-011.A1, INT-037.A1]
overall_risk: moderate
sources: [INT-011.A1, INT-037.A1]
