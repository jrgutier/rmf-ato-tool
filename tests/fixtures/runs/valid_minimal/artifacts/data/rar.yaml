risks:
- id: RSK-001
  title: Stale accounts until the first quarterly review
  description: Without an account review, accounts of departed operators could remain enabled.
  likelihood: low
  impact: moderate
  level: low
  finding_refs:
  - FND-001
  poam_refs:
  - POAM-001
  response: mitigate
  courses_of_action:
  - id: COA-01
    response: mitigate
    description: Close the weakness through the POA&M.
    effectiveness: Removes the exposure once done.
    feasibility: Within the sustainment team's capacity.
    cost: Staff hours in the current release.
    mission_impact: None on relay availability.
    privacy_impact: None; no PII in the relay.
    selected: true
    rationale: Reduces the risk at least cost.
  - id: COA-02
    response: accept
    description: Accept the residual risk until the next release.
    effectiveness: Removes the exposure once done.
    feasibility: Within the sustainment team's capacity.
    cost: Staff hours in the current release.
    mission_impact: None on relay availability.
    privacy_impact: None; no PII in the relay.
    selected: false
    rationale: Leaves the exposure in place.
