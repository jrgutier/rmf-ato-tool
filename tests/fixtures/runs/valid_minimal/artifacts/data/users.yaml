users:
  - id: USR-OPERATOR
    title: Operator
    type: internal
    category: organization-personnel
    privilege_level: non-privileged
    access_requirements: {clearance: none, citizenship: U.S. citizen}
    roles: [operator]
    authorized_privileges:
      - {title: Monitor relay, functions_performed: [view relay health, acknowledge alerts]}
    sources: [product/users.md#operators]
  - id: USR-ADMIN
    title: Administrator
    type: internal
    category: contractor
    privilege_level: privileged
    access_requirements: {clearance: secret, citizenship: U.S. citizen}
    privileged_access: {qualified: true, qualification: DoD 8140 privileged user qualification, statement_signed: true}
    roles: [administrator]
    authorized_privileges:
      - {title: Administer appliance, functions_performed: [manage accounts, change configuration, apply patches]}
    sources: [product/users.md#administrators]
