penetration_test:
  scope:
    environment:
    - The developmental test enclave and its operators
    attack_surface:
    - Relay service API
    - operator console
    - management VLAN
    threat_sources:
    - External targeted attacker
    - malicious insider operator
    objectives:
    - Gain administrator access on the relay appliance and alter stored reports
    level_of_effort: Two testers for three days, sized to the cost and time available.
    rules_of_engagement: No denial of service; test environment only; stop on any production data.
  components:
  - CMP-RELAY
  - CMP-CONSOLE
  assessor:
    party: third-party
    qualified: true
    name: Example Red Team
  guidance: NIST SP 800-115
  environments:
  - development
  - operational
  option: cora
