rigor:
  categorization: ART-CAT
  plans:
  - ART-SSP
  assurance_requirements:
  - id: AR-001
    requirement: Increased grounds for confidence that each scoped control is implemented correctly and operating as intended, for a moderate-impact system.
    specified_by: PER-AO
    depth: focused
    coverage: focused
  direction:
    by: PER-AO
    conferred_with:
    - PER-SCA
    factors:
    - available resources
    - importance of the assessment
    - the organization's assessment goals and objectives
procedures:
- id: PRC-001
  controls:
  - ac-2
  - au-2
  - ia-2
  - sc-7
  - si-2
  methods:
  - examine
  - interview
  - test
  objects:
  - specifications
  - mechanisms
  - activities
  - individuals
  rationale: The controls in the risk assessment need all three methods to reach the objectives.
  depth: focused
  coverage: focused
  risk_results: &id001
  - ART-RA
  adaptation: none
  sequence: 1
  assurance_requirement: AR-001
  sampling:
  - method: examine
    types:
    - type: specifications
      number: 2
    - type: mechanisms
      number: 2
    - type: activities
      number: 2
    specific:
    - ART-SSP
    selection: random-and-targeted
    bias_control: The representative sample is drawn by lot from the inventory before the specific objects are added.
  - method: interview
    types:
    - type: PER-ISSM
      number: 1
    - type: PER-PM
      number: 1
    specific:
    - the ISSM of record
    selection: random-and-targeted
    bias_control: Roles are drawn from the staffing list; the ISSM is added as the role that operates the controls.
  - method: test
    types:
    - type: mechanisms
      number: 2
    - type: activities
      number: 2
    specific:
    - CMP-RELAY
    selection: random-and-targeted
    bias_control: The representative sample is drawn by lot from the inventory before the specific objects are added.
    extent:
    - measure: test cases
      count: 12
    - measure: modules
      count: 2
- id: PRC-002
  controls:
  - cm-6
  - sc-15
  methods:
  - examine
  - test
  objects:
  - specifications
  - mechanisms
  rationale: Configuration settings are shown by scan and examination.
  depth: focused
  coverage: focused
  risk_results: *id001
  adaptation: none
  sequence: 2
  assurance_requirement: AR-001
  sampling:
  - method: examine
    types:
    - type: specifications
      number: 2
    - type: mechanisms
      number: 2
    specific:
    - ART-SSP
    selection: random-and-targeted
    bias_control: The representative sample is drawn by lot from the inventory before the specific objects are added.
  - method: test
    types:
    - type: mechanisms
      number: 2
    specific:
    - CMP-RELAY
    selection: random-and-targeted
    bias_control: The representative sample is drawn by lot from the inventory before the specific objects are added.
    extent:
    - measure: test cases
      count: 12
    - measure: modules
      count: 2
