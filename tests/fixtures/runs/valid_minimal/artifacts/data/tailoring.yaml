assumptions:
  - {id: AS-BL-1, holds: true, rationale: Field reports persist for days on the relay., sources: [INT-028.A2]}
  - {id: AS-BL-2, holds: true, rationale: Several analysts use the relay concurrently., sources: [INT-028.A2]}
  - {id: AS-BL-3, holds: true, rationale: Reports are shared on need to know., sources: [INT-028.A2]}
  - {id: AS-BL-4, holds: true, rationale: The relay is a networked general-purpose host., sources: [INT-028.A2]}
  - {id: AS-BL-5, holds: true, rationale: The program runs the controls with enclave support., sources: [INT-028.A2]}
  - {id: AS-NSS-1, holds: true, rationale: The insider threat is in the risk assessment., sources: [INT-028.A2, ART-RA]}
  - {id: AS-NSS-2, holds: true, rationale: APT targeting is in the risk assessment., sources: [INT-028.A2, ART-RA]}
  - {id: AS-NSS-3, holds: true, rationale: The NSS baseline additions apply., sources: [INT-028.A2]}
  - {id: AS-ADD-1, holds: false, rationale: The relay processes no classified information., sources: [INT-028.A2]}
  - {id: AS-ADD-2, holds: false, rationale: No information needs specialized legal protection., sources: [INT-028.A2]}
  - {id: AS-ADD-3, holds: false, rationale: The relay has no cross-domain connection., sources: [INT-028.A2]}
assurance:
  additional_needed: false
  rationale: The baseline's assurance-related controls meet the trustworthiness the relay needs.
  sources: [INT-028.A2, ART-RA]
trade_offs:
  - {factor: cost, controls: [sc-15], weighed: "No collaborative devices are bought, so sc-15 costs nothing to keep.", outcome: retained, sources: [INT-028.A3]}
  - {factor: schedule, controls: [cp-3.1], weighed: Simulated-event training would delay fielding for an availability-only benefit at low impact., outcome: removed, sources: [INT-028.A3]}
  - {factor: performance, controls: [sc-7], weighed: Boundary inspection adds latency the relay tolerates., outcome: retained, sources: [INT-028.A3]}
actions:
  - control_id: ac-2
    action: parameter
    parameter: {param_id: ac-02_odp.10, value: quarterly}
    rationale: The program reviews accounts quarterly.
    sources: [product/security.md#accounts]
  - control_id: ac-2
    action: specification
    specification: {text: Accounts are managed through the identity provider's FDR group., placement: addendum}
    rationale: The control statement does not say where accounts are managed.
    sources: [INT-028.A3]
  - control_id: cp-3.1
    action: remove
    basis: scoping
    scoping: {consideration: security-objective}
    downgrade: {objectives: [a], sources: [ART-RA, INT-028.A3], security_relevant_unaffected: true}
    law_policy:
      reviewed: [legislation, regulation, policy, omb-policy]
      requires_control: false
      sources: [INT-028.A3]
    rationale: Simulated-event training supports only availability, which is low.
    sources: [INT-028.A3]
privacy_implementation:
  - {control_id: cm-6, by: PER-PRIV, implications: [2], finding: Settings are designed so none logs user content., sources: [INT-080.A1]}
  - {control_id: ia-2, by: PER-PRIV, implications: [3], finding: Authentication collects only the CAC identity the enclave holds., sources: [INT-080.A1]}
  - {control_id: sc-7, by: PER-PRIV, implications: [4], finding: "The boundary admits no flow carrying PII into the relay, which is not authorized to process it.", sources: [INT-080.A1]}
