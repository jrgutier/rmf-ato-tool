users:
- id: USR-OPERATOR
  title: Operator
  type: internal
  privilege_level: non-privileged
  roles:
  - operator
  authorized_privileges:
  - title: Monitor relay
    functions_performed:
    - view relay health
    - acknowledge alerts
  sources:
  - product/users.md#operators
  access_decision:
    decided_by: PER-PM
    coordinated_with: PER-IO
  training:
    ensured_by: PER-PM
    requirement: Annual cybersecurity awareness and role-based training.
- id: USR-ADMIN
  title: Administrator
  type: internal
  privilege_level: privileged
  roles:
  - administrator
  authorized_privileges:
  - title: Administer appliance
    functions_performed:
    - manage accounts
    - change configuration
    - apply patches
  sources:
  - product/users.md#administrators
  access_decision:
    decided_by: PER-PM
    coordinated_with: PER-IO
  training:
    ensured_by: PER-PM
    requirement: Annual cybersecurity awareness and role-based training.
