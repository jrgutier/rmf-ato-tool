authorization_boundary:
  description: The boundary encloses the relay appliance (relay service and report store) and the operator console.
  sources: [INT-002.A1, product/architecture.md#boundary]
network_architecture:
  description: The appliance has a radio-side interface on the field network and an enclave-side interface behind the enclave firewall; the console is on the management VLAN.
  sources: [product/architecture.md#network]
data_flow:
  description: Field units send signed reports to the relay service, which stores them and forwards them over TLS to the analysis enclave.
  sources: [product/architecture.md#data-flow]
components:
  - {id: CMP-FDR, title: Field Data Relay, type: this-system, description: The Field Data Relay as a whole., status: under-development, sources: [product/architecture.md#components]}
  - {id: CMP-RELAY, title: Relay service, type: software, description: The fdr-relay service on the relay appliance., status: under-development, sources: [product/architecture.md#components]}
  - {id: CMP-STORE, title: Report store, type: software, description: The PostgreSQL report store., status: under-development, sources: [product/architecture.md#components]}
  - {id: CMP-CONSOLE, title: Operator console, type: hardware, description: The operator console workstation., status: under-development, sources: [product/architecture.md#components]}
  - {id: CMP-IDP, title: Enterprise identity provider, type: service, description: Enterprise sign-in with CAC multi-factor authentication., status: operational, external: true, leveraged_authorization: LA-01, sources: [product/architecture.md#components, INT-003.A1]}
