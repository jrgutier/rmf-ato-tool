# Hand-read pages: the requirements a compliance analyst lists on each page, as substrings of
# the source text (matched after refs.toc.compact, so line breaks and punctuation do not
# matter). Read before the extractor was changed; never edit a label to fit the extractor.
# A page's unlabelled extracted items are its noise. `mode` is the source's mode in
# conformance/sources.yaml, so recall is reported per mode.
pages:
  - ref: FIPS199
    page: 8
    requirements:
      - "must consider the security categories of all information types resident on the information system"
      - "shall be the highest values (i.e., high water mark)"
      - "acceptable values for potential impact are LOW, MODERATE, or HIGH"
      - "the value of not applicable cannot be assigned to any security objective"
