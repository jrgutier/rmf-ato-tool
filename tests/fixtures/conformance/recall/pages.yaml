  - ref: CNSSI1253
    page: 11
    requirements:
      - "will implement both the NSS Privacy Control Baseline and the appropriate Privacy Overlay"
      - "For systems that do not process PII, and do not have user accounts or associated logs, the NSS privacy control baseline will be sufficient"
      - "then a Privacy Overlay must be applied"
      - "The SAOP or designee must approve the determination as to whether a system does or does not process PII"
      - "the SAOP or designee must be consulted to determine if additional steps are required to protect privacy"
      - "decisions made regarding sufficiency of security and privacy controls cannot be made once and assumed to be unchangeable"
      - "Controls, regardless of source (baseline or overlays), may be tailored unless required to meet legislative, regulatory, or policy requirements"
      - "A control may be tailored out if there is no risk for which the control is designed to mitigate"
      - "compensating controls may be appropriate"
      - "All tailoring decisions must be defensible based on mission and business needs"
      - "All decisions, to include the justification for the decision, must be"
