  - ref: DODI8510.01
    page: 14
    note: Table 1 continued; every row is a task, its outcome and who is responsible.
    requirements:
      - "Task P-5 Common Control Identification | Common controls that are available for inheritance by organizational systems are identified, documented, and published"
      - "Task P-6 Impact – Level Prioritization (Optional) | A prioritization of organizational systems with the same impact level is conducted"
      - "Task P-7 Continuous Monitoring Strategy – Organization | An organization-wide strategy for monitoring control effectiveness is developed and implemented"
      - "Task P-8 Mission or Business Focus | Missions, business functions, and mission or business processes that the system is intended to support are identified"
      - "Task P-9 System Stakeholders | The stakeholders having an interest in the system are identified"
      - "Task P-10 Asset Identification | Stakeholder assets are identified and prioritized"
      - "Task P-11 Authorization Boundary | The authorization boundary (i.e., system) is determined"
      - "Task P-12 Information Types | The types of information processed, stored, and transmitted by the system are identified"
      - "Task P-13 Information Life Cycle | All stages of the information life cycle are identified and understood"
      - "Task P-14 Mission-Based Cyber Risk Assessment | A system-level risk assessment is completed or an existing risk assessment is updated"
      - "Task P-15 Requirements Definition | Security and privacy requirements are defined and prioritized"
      - "Task P-16 Enterprise Architecture | The placement of the system within the enterprise architecture is determined"
      - "Task P-17 Requirements Allocation | Security and privacy requirements are allocated to the system and to the environment"
      - "Task P-18 System Registration | The system is registered for purposes of management, accountability, coordination, and oversight"
