rule: CATO-001
bases:
- minimal
description: a use case outside the two of Appendix A
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: use_case
  value: pilot
expect:
  errors:
  - CATO-001
  messages:
  - a program applying for a cATO is already in one of the use case categories, not pilot
