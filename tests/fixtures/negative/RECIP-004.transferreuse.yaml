rule: RECIP-004
bases:
- minimal
description: a transfer leaving a core document of the provider neither reused nor explained
mutations:
- op: set_field
  file: artifacts/data/system-description.yaml
  path: origin
  value:
    kind: ownership-transfer
    organization: Fleet Systems Command
    authorization:
      ao: Fleet Systems Command AO
      decision: AD-ATO
      date: '2025-06-01'
    relinquished:
    - configuration
    - maintenance
    operating: null
    reuse:
    - document: ART-SSP
      reused: true
    - document: ART-SAR
      reused: true
    - document: ART-POAM
      reused: true
    - document: ART-AODM
      reused: true
    sources:
    - INT-003.A1
expect:
  errors:
  - RECIP-004
  messages:
  - the providing organization's ART-RAR is neither reused nor explained
