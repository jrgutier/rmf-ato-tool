rule: DPOL-001
bases:
- minimal
description: a compensating control stands for ia-2 with no AO or AODR approval
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: si-4\n    action: compensating\n    compensating_for: ia-2\n    source: catalog\n\
    \    cannot_implement: Said not to be implementable on the relay.\n    equivalence: Monitoring detects\
    \ unauthenticated use.\n    risk: {assessment: Low residual risk., accepted_by: PER-AO, sources: [ART-RA]}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:\
    \ false\n      sources: [INT-028.A3]\n    rationale: Monitoring stands in.\n    sources: [INT-028.A3]\n\
    \  - control_id: cp-3.1"
expect:
  errors:
  - DPOL-001
  messages:
  - 'PC-DOD-1: DoDI 8500.01 requires that identity assurance ensures strong identification and authentication
    and eliminates anonymity in DoD IS and PIT systems, and a compensating control stands for ia-2 without
    the approval of the AO or AODR'
  also:
  - TLR-001
