rule: PPROT-001
bases:
- minimal
description: an ACAT II major capability program's PPP approved by the USD(R&E)
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.approval.authority
  value: USD(R&E)
expect:
  errors:
  - PPROT-001
  messages:
  - the Component acquisition executive or a designee approves the PPP of an ACAT IB, IC, II or III 
    major capability program
