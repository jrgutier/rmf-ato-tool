rule: OCTX-005
bases:
- minimal
description: the ISSM approves the provider's assessment report
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: common_controls.0.sar.approved_by
  value: PER-ISSM
expect:
  errors:
  - OCTX-005
  messages:
  - 'Analysis enclave (PRV-01): the sar is approved by PER-ISSM, not the authorizing
    official accountable for the common controls'
