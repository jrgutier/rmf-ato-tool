rule: PPROT-006
bases:
- minimal
description: an NSS assessment made by the AO alone
mutations:
- op: set_field
  file: artifacts/data/nss-assessments.yaml
  path: assessments.0.assessed_by
  value:
  - PER-AO
expect:
  errors:
  - PPROT-006
  messages:
  - the assessment before MS-A is made by NSA in coordination with the cognizant AO
