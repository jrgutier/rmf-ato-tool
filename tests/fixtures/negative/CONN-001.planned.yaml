rule: CONN-001
bases:
- minimal
description: a DISN connection whose DISA approval is only planned
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.network
  value: disn
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.approvals
  value:
  - authority: DISA
    status: planned
    sources:
    - INT-025.A1
expect:
  errors:
  - CONN-001
  messages:
  - 'CONN-01: the DISA approval is planned, so it does not count as requested or granted'
