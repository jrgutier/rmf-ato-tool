rule: PPROT-004
bases:
- minimal
description: anti-tamper in the capability document and addressed by a requirement that does not 
  exist
mutations:
- op: set_field
  file: artifacts/data/protection-requirements.yaml
  path: capability_document.protection_content.2.addressed_by
  value:
  - PRQ-404
expect:
  errors:
  - PPROT-004
  messages:
  - is in the capability requirements and addressed by no protection requirement during capability 
    development
