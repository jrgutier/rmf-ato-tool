rule: PENT-001
bases:
- minimal
description: a penetration test that does not use NIST SP 800-115
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: penetration_test.guidance
  value: other
expect:
  errors:
  - PENT-001
  messages:
  - penetration testing uses the guidelines in NIST SP 800-115 as reference, not other
