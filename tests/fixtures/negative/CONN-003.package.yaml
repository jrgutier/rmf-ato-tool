rule: CONN-003
bases:
- minimal
description: the partner prepares its authorization package without the sponsor
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.network
  value: mission-partner
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.mission_partner
  value:
    partner: Allied ground station
    sponsor: Army
    interconnection: dmz
    dmz: REL DMZ
    requirement_approved_by:
    - sponsor
    - DOD-CIO
    fulfillment: in-progress
    partner_package: partner
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.approvals
  value:
  - authority: DISA
    status: requested
    sources: &id001
    - INT-025.A1
  - authority: DOD-CIO
    status: requested
    sources: *id001
  - authority: ISRMC
    status: requested
    sources: *id001
expect:
  errors:
  - CONN-003
  messages:
  - 'CONN-01: the sponsor neither completed nor assisted the mission partner''s authorization package'
  also:
  - RUN-FM-001
