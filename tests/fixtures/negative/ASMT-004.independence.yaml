rule: ASMT-004
bases:
- minimal
description: a provider assessor below the required independence
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: external_providers.0.provider_assessment.independence
  value: self-assessment
expect:
  errors:
  - ASMT-004
  messages:
  - the independence of the assessors it used, self-assessment, is below the required independent
