rule: MPOA-001
bases:
- minimal
description: an inspection finding that reaches no POA&M item
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: external_findings.0.poam_item
  value: POAM-999
expect:
  errors:
  - MPOA-001
  messages:
  - is not leveraged in a POA&M item or an accepted risk
