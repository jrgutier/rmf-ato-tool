rule: PPROT-002
bases:
- minimal
description: a PPP that leaves out cyber resilient engineering
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.sse_activities
  value:
  - software-assurance
  - scrm
expect:
  errors:
  - PPROT-002
  messages:
  - the PPP guides the systems security engineering activities, to include cyber resilient 
    engineering
