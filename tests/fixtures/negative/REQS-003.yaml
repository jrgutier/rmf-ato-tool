rule: REQS-003
bases:
- minimal
description: a protection need held by someone who is no persona
mutations:
- op: set_field
  file: artifacts/data/requirements.yaml
  path: needs.0.stakeholder
  value: PER-NOBODY
expect:
  errors:
  - REQS-003
  messages:
  - 'NEED-01: stakeholder PER-NOBODY is not a framework persona'
  - PER-NOBODY holds a protection need but has not agreed that the requirements address it
