rule: SRA-002
bases: [minimal]
description: a supply chain record names a vulnerability that is not listed
mutations:
- op: set_field
  file: artifacts/data/ra.yaml
  path: external.supply_chain.0.vulnerabilities
  value: [VUL-09]
expect:
  errors: [SRA-002]
  messages: ['supply chain record SC-01 names VUL-09, which is no vulnerability or predisposing condition in ra.yaml']
