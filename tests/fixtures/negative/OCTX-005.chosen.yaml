rule: OCTX-005
bases:
- minimal
description: the system owner arranges the common control assessment
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: common_controls.0.assessed_by.chosen_by
  value: system-owner
expect:
  errors:
  - OCTX-005
  messages:
  - 'Analysis enclave (PRV-01): the assessment of the common controls is arranged by
    the system owner, not the common control provider or the organization'
