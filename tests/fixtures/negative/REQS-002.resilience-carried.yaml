rule: REQS-002
bases:
- minimal
description: DP-RESILIENCE-AUDIT applies, carried only by a requirement the matrix lacks
mutations:
- op: set_field
  file: artifacts/data/requirements.yaml
  path: design_policy.0.requirements
  value: [REQ-09]
expect:
  errors:
  - REQS-002
  messages:
  - DP-RESILIENCE-AUDIT applies but no requirement of the matrix carries it
