rule: AODM-011
bases:
- minimal
description: an NSS interagency risk issue kept from the ISRMC
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: issues.0.kind
  value: interagency-risk
expect:
  errors:
  - AODM-011
  messages:
  - an NSS cybersecurity risk issue unresolved between departments and agencies is referred to the governing
    departmental ISRMC, not DSAWG
