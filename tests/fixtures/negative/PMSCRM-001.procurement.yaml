rule: PMSCRM-001
bases:
- minimal
description: an engineered procurement given moderate risk tolerance
mutations:
- op: set_field
  file: artifacts/data/pm-scrm.yaml
  path: risk_tolerance.procurement
  value: engineered
expect:
  errors:
  - PMSCRM-001
  messages:
  - Table 1 applies low risk tolerance to engineered procurements; moderate tolerates more risk than that
