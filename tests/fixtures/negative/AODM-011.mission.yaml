rule: AODM-011
bases:
- minimal
description: a mission area issue sent to the DSAWG
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: issues.0.kind
  value: mission-area
expect:
  errors:
  - AODM-011
  messages:
  - an authorization issue within a mission area is resolved by its PAO
