rule: CATO-011
bases:
- minimal
description: a tolerance set on program preference
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: tolerances.0.basis
  value: program-preference
expect:
  errors:
  - CATO-011
  messages:
  - "TOL-01: cATO risk tolerances are based on the Component's risk posture guidance, not program-preference"
