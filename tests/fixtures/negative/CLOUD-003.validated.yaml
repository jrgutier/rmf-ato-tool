rule: CLOUD-003
bases:
- cloud
description: the ISSM validates who performs each activity
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: checklist.validated_by
  value: PER-ISSM
expect:
  errors:
  - CLOUD-003
  messages:
  - who will be responsible for providing each cybersecurity activity is validated by the 
    authorizing official, not PER-ISSM
