rule: PRIV-004
bases:
- pii
description: a PIA sent to the DoD CIO before approval
mutations:
- op: set_field
  file: artifacts/data/pia.yaml
  path: submission.date
  value: '2026-09-01'
expect:
  errors:
  - PRIV-004
  messages:
  - the PIA was submitted to the DoD CIO on 2026-09-01, before the PIA approval date 2026-09-10
