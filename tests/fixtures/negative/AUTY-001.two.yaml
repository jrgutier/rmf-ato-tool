rule: AUTY-001
bases:
- joint
description: a joint authorization accepted by one official only
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: records.1.joint.acceptances.1.official
  value: PER-AO
expect:
  errors:
  - AUTY-001
  messages:
  - a joint authorization has at least two authorizing officials who each accept the risk
