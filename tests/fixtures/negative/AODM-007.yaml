rule: AODM-007
bases: [minimal]
description: a cATO written with no DoD CISO approval and no pathway, before M-6 has been reached
mutations:
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-003
        decision: AD-CATO
        subject: system
        basis: time-driven
        decided_by: PER-AO
        task: M-6
        date: '2026-12-15'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        underlying: AUTH-002
        review: {frequency_days: 30, events: [significant change]}
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
expect:
  errors: [AODM-007]
  also: [AODM-001, ASMT-010]
  messages:
    - a cATO needs a recorded dod_ciso_approval
