rule: WFQ-001
description: the AO's training and qualification are verified by the AO alone
bases:
- minimal
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.2.qualification.verified_by
  value: PER-AO
expect:
  errors:
  - WFQ-001
  messages:
  - "RA-03: the training and qualification of PER-AO are not verified by another official"
