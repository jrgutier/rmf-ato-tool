rule: PKG-003
bases:
- minimal
description: a SAR without its facts block
mutations:
- op: replace_text
  file: artifacts/ART-SAR.md
  old: '<!-- BEGIN rmf:facts -->

    '
  new: ''
- op: replace_text
  file: artifacts/ART-SAR.md
  old: '<!-- END rmf:facts -->

    '
  new: ''
expect:
  errors:
  - PKG-003
  also:
  - TRACE-001
  messages:
  - ART-SAR does not carry the CNSSI 1254 data element Data Classification Level and Handling Markings
  - ART-SAR does not carry the CNSSI 1254 data element Department/Agency/Organization Name
  - ART-SAR does not carry the CNSSI 1254 data element Information Technology (IT) Type
  - ART-SAR does not carry the CNSSI 1254 data element System Version or Release Number
  - ART-SAR does not carry the CNSSI 1254 data element Operational Environment
