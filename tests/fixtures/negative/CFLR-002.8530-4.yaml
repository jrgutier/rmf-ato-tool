rule: CFLR-002
bases:
- minimal
description: sc-8 is tailored out of a networked system although it carries CF-8530-4, a duty DoDI 
  8530.01 places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: sc-8\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-002
  messages:
  - 'CF-8530-4: DoDI 8530.01 requires that CUI and privacy information transmitted electronically is protected
    for confidentiality and integrity, by encryption or other protective measures, and sc-8 is tailored
    out of the baseline'
  also:
  - DPOL-001
