rule: BYP-001
bases:
- minimal
description: a bypass approved orally by the ISSM
mutations:
- {op: set_field, file: artifacts/data/cm-plan.yaml, path: bypasses.0.approval.form, value: oral}
expect:
  errors:
  - BYP-001
