rule: RCP-007
bases:
- minimal
description: a dispute taken first to the RMF TAG Chair
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.1.refusal.escalation.0.level
  value: rmf-tag-chair
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.1.refusal.escalation.0.notified
  value: rmf-tag-secretariat
expect:
  errors:
  - RCP-007
  messages:
  - 'RS-02: the dispute is not raised from the AO level to the RMF TAG Chair and then to the AO Council, in that order'
