rule: ASMT-002
bases:
- minimal
description: an additional procedure whose method has no object
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: additional_procedures
  value:
  - id: APR-001
    requirement: A mission-specific logging duty outside SP 800-53.
    statements:
    - Mission logs are retained.
    methods:
    - test
    objects:
    - individuals
    rationale: The requirement is in the mission order.
expect:
  also:
  - ASMT-005
  errors:
  - ASMT-002
  messages:
  - 'APR-001: the assessment method test has no selected assessment object'
