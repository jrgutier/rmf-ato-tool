rule: OCTX-001
bases:
- minimal
description: the RMF TAG Representative is appointed by the Component CIO, not the Component CISO
mutations:
- op: replace_text
  file: artifacts/data/org-context.yaml
  old: 'manpower_structure:'
  new: '  - {id: RA-14, role: PER-TAG, name: X (fixture), title: T, organization: DoD, contact: {email:
    x@example.mil}, appointed_by: PER-CIO, citizenship: us, affiliation: dod-civilian, sources: [INT-013.A1]}

    manpower_structure:'
expect:
  errors:
  - OCTX-001
  messages:
  - 'RA-14: the RMF TAG Representative is appointed by PER-CIO, not the DoD Component CISO'
  also:
  - WFQ-001
