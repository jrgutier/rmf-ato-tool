rule: RMR-001
bases:
- minimal
description: the authorizing official is also appointed the system owner
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.6.name
  value: Mission area AO (fixture)
expect:
  errors:
  - RMR-001
  messages:
  - 'Mission area AO (fixture) holds both the authorizing official and the system owner role: an authorizing official cannot occupy the role of system owner for a system it authorizes'
