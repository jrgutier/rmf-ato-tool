rule: DPOL-003
bases:
- minimal
description: a compensating control stands for cp-2, which carries PC-DOD-38, with its risk accepted
  by the ISSM, not the AO or AODR
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: si-4\n    action: compensating\n    compensating_for: cp-2\n    source: catalog\n\
    \    cannot_implement: Said not to be implementable on the relay.\n    equivalence: Monitoring stands
    in.\n    risk: {assessment: Low residual risk., accepted_by: PER-ISSM, sources: [ART-RA]}\n    law_policy:\n\
    \      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control: false\n  \
    \    sources: [INT-028.A3]\n    rationale: Monitoring stands in.\n    sources: [INT-028.A3]\n  - control_id:
    cp-3.1"
expect:
  errors:
  - DPOL-003
  messages:
  - 'PC-DOD-38: DoDI 8500.01 requires that information and services are available to authorized users
    whenever and wherever required according to mission needs, and a compensating control stands for cp-2
    without its risk accepted by the AO or AODR'
  also:
  - CFLR-001
  - CFLR-003
  - TLR-001
