rule: CATO-015
bases:
- minimal
description: a threshold row unmet under a decided cATO
mutations:
- op: append_text
  file: artifacts/data/authorizations.yaml
  text: "- id: AUTH-003\n  decision: AD-CATO\n  subject: system\n  basis: time-driven\n  decided_by: PER-AO\n  task: M-6\n  date: '2026-12-15'\n  risk_level: moderate\n  risk_acceptance: I accept the residual risk.\n  signature: pki\n  conveyed_to: [PER-PM]\n  underlying: AUTH-002\n  review: {frequency_days: 30, events: [significant change]}\n  dod_ciso_approval: {date: '2026-12-10', reference: DoD CISO memo}\n  component_ciso_notification: {date: '2026-12-01'}\n  rationale: Continuous monitoring is near real time.\n  sources: [INT-012.A1]\n"
- op: set_field
  file: artifacts/data/cato.yaml
  path: assessment.scores.36.result
  value: not-met
- op: set_field
  file: artifacts/data/cato.yaml
  path: assessment.recommendation.recommend
  value: do-not-authorize
expect:
  errors:
  - CATO-015
  also:
  - AODM-001
  - AODM-007
  - ASMT-010
  - SSPR-001
  - SVCA-001
  messages:
  - 'a threshold requirement must be met: TP07 unmet and a cATO is recommended or decided'
