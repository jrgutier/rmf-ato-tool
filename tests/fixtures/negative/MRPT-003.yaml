rule: MRPT-003
bases:
- minimal
description: a plan change made during the report period that the posture report does not summarize
mutations:
- {op: set_field, file: artifacts/data/plan-reviews.yaml, path: changes.0.date, value: '2026-12-20'}
expect:
  errors:
  - MRPT-003
  messages:
  - 'SPR-001 does not summarize the plan change 1.1 of 2026-12-20, made since the last report'
