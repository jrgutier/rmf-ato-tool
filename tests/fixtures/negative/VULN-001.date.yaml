rule: VULN-001
bases:
- minimal
description: a directed action implemented before it was received
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: directed_actions.0.implemented.date
  value: '2026-11-30'
expect:
  errors:
  - VULN-001
  messages:
  - is recorded implemented without a date on or after its receipt
