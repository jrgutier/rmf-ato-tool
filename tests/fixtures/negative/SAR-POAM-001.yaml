rule: SAR-POAM-001
bases: [minimal, example]
description: open SAR finding without a POA&M item
mutations:
  - op: delete_list_item
    file: artifacts/poam/items.yaml
    path: items
    where: {finding_ref: FND-001}
  - only: [minimal]
    op: delete_list_item
    file: artifacts/data/package-summary.yaml
    path: issues
    where: {id: XS-02}
expect: {errors: [SAR-POAM-001], also: [RAR-001]}
