rule: PPROT-002
bases:
- minimal
description: a contract award with no PPP update
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: contract_awards
  value:
  - id: K-001
    date: '2026-05-01'
expect:
  errors:
  - PPROT-002
  messages:
  - the PPP is not updated after contract award K-001 to reflect the contractor's approved technical
    approach
