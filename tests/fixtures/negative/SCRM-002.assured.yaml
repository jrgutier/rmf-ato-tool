rule: SCRM-002
bases:
- minimal
description: neither assured suppliers nor countermeasures
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: criticality.tsn
  value:
  - criticality-analysis
  - all-source-threat-assessment
  - software-assurance
  - hardware-assurance
  - procurement-strategies
  - anti-counterfeit
  - cyber-test-and-evaluation
expect:
  errors:
  - SCRM-002
  messages:
  - mission-critical function items use neither assured suppliers nor SCRM countermeasures
