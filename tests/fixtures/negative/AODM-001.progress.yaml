rule: AODM-001
bases: [minimal]
description: a complete cATO written at M-6 while M-5, in scope, has not written its output
mutations:
  - op: set_field
    file: run.yaml
    path: include_after_stop
    value: [M-5, M-6]
  - op: set_field
    file: run.yaml
    path: seeded
    value:
      - {artifact: ART-CHG, from_task: M-1, path: artifacts/data/changes.yaml}
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-003
        decision: AD-CATO
        subject: system
        basis: time-driven
        decided_by: PER-AO
        task: M-6
        date: '2026-12-15'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        underlying: AUTH-002
        review: {frequency_days: 30, events: [significant change]}
        dod_ciso_approval: {date: '2026-12-10', reference: DoD CISO memo}
        component_ciso_notification: {date: '2026-12-01'}
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
  - op: set_field
    file: facts.yaml
    path: acquisition.pathway
    value: PW-SWP
expect:
  errors: [AODM-001]
  also: [ASMT-010, SSPR-001, SVCA-001]
  messages:
    - have not written their outputs
