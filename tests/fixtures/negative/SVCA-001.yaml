rule: SVCA-001
bases:
- minimal
description: a provider acting under no recognized instrument
mutations:
- op: set_field
  file: artifacts/data/service-agreements.yaml
  path: agreements.0.instrument
  value: verbal-understanding
expect:
  errors:
  - SVCA-001
  messages:
  - cybersecurity services are implemented under policy, an MOA, a contract or a support agreement
