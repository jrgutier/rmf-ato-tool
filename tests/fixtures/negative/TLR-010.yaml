rule: TLR-010
bases:
- minimal
description: an inherited provider with no determination
mutations:
- op: set_field
  file: artifacts/data/allocation.yaml
  path: providers.0.provider
  value: Another enclave
expect:
  errors:
  - TLR-010
  messages:
  - controls are inherited from Analysis enclave, and no determination records that its common controls protect the system commensurate with risk
