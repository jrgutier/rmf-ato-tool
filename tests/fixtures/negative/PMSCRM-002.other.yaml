rule: PMSCRM-002
description: the mission-critical record names an item other than CI-001
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: pm_actions.mission_critical.0.item
  value: CI-999
expect:
  errors:
  - PMSCRM-002
  messages:
  - CI-001 performs a mission-critical function with neither an assured supplier nor an SCRM countermeasure
