rule: CATG-001
description: a system confidentiality impact of not applicable, a value only an information type may take
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.c
  value: not-applicable
expect:
  errors:
  - CATG-001
  also:
  - RUN-FM-001
  - GEN-STALE-001
  - CATG-002
  messages:
  - confidentiality is not-applicable, below the high-water mark
