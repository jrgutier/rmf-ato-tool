rule: IRPT-001
bases:
- minimal
description: spillage handled under the wrong issuance
mutations:
- op: set_field
  file: artifacts/data/incident-response.yaml
  path: reporting_paths.1.reference
  value: DoDM 5200.01 Volume 4
expect:
  errors:
  - IRPT-001
  messages:
  - spillage of classified information is handled under DoDM 5200.01 Volume 3
