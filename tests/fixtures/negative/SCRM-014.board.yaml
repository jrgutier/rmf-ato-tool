rule: SCRM-014
bases:
- minimal
description: C-SCRM metrics do not reach the risk executive function
mutations:
- op: set_field
  file: artifacts/data/scrm-plan.yaml
  path: reporting.1.content
  value:
  - extent
  - effectiveness
  - urgent-conditions
  - top-risks
expect:
  errors:
  - SCRM-014
  messages:
  - no supply chain report gives C-SCRM metrics to the risk executive function
