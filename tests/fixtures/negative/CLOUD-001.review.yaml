rule: CLOUD-001
bases:
- minimal
description: the review covers only the data types
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: offerings.0.package_review.covers
  value:
  - data-types
expect:
  errors:
  - CLOUD-001
  messages:
  - 'CSO-01: the mission owner has not come to understand impact-level, conditions: the type of data,
    the authorized impact level and the conditions of the provisional authorization'
