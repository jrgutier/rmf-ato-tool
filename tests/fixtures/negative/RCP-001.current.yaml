rule: RCP-001
bases:
- minimal
description: the latest POA&M delivered before its newest item
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: receiving_organizations.0.deliveries.9.date
  value: '2026-12-01'
expect:
  errors:
  - RCP-001
  messages:
  - 'RO-01: the latest POA&M delivered predates its newest item, so the receiving organization does not hold a current POA&M'
