rule: RCP-001
bases:
- minimal
description: a POA&M delivered before the latest decision
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: receiving_organizations.0.deliveries.3.date
  value: '2026-11-19'
expect:
  errors:
  - RCP-001
  messages:
  - 'RO-01: the POA&M delivered predates the latest authorization decision, so the receiving organization does not hold a current POA&M'
