rule: GEN-STALE-001
bases: [minimal]
description: the assessment report names a system other than the one C-1 recorded
build: false
mutations:
  - op: replace_text
    file: artifacts/ART-SAR.md
    old: "| System name | Field Data Relay | C-1 |"
    new: "| System name | Field Data Relay Gateway | C-1 |"
expect:
  errors: [GEN-STALE-001]
  messages:
    - marker block differs from a fresh assemble
