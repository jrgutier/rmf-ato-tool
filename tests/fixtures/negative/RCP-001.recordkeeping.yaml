rule: RCP-001
bases:
- minimal
description: record keeping neither compatible nor incompatible
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: receiving_organizations.0.visibility.record_keeping
  value: unknown
expect:
  errors:
  - RCP-001
  messages:
  - 'RO-01: the receiving organization''s record keeping is neither compatible nor incompatible with this organization''s RMF tool'
  also:
  - RUN-FM-001
