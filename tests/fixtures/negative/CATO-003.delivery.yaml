rule: CATO-003
bases:
- minimal
description: a DSOP embedded in the application
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: platform.delivery
  value: embedded
expect:
  errors:
  - CATO-003
  messages:
  - the DSOP is delivered and operated as its own system and provided as a service, not embedded
