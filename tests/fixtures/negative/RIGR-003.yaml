rule: RIGR-003
bases:
- minimal
description: the sampling direction given by an assessor
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: rigor.direction.by
  value: PER-SCA
expect:
  errors:
  - RIGR-003
  messages:
  - the organization provides direction on the type, number and specific objects to be assessed through a persona outside the assessment team, not PER-SCA
