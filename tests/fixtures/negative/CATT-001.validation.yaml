rule: CATT-001
bases:
- minimal
description: control compliance not validated continuously
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: practices.continuous_validation
  value:
  - secure-configurations
expect:
  errors:
  - CATT-001
  messages:
  - the DevSecOps team does not continuously validate control-compliance using security automation
