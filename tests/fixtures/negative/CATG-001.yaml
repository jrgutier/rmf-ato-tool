rule: CATG-001
bases:
- minimal
description: availability below the high-water mark
mutations:
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: information_types.0.availability
  value:
    base: high
expect:
  errors:
  - CATG-001
  also:
  - CATG-002
  messages:
  - availability is low, below the high-water mark high of the information types
