rule: SRA-004
bases: [minimal]
description: the RAR miscounts the controls with risks at a level
mutations:
- {op: set_field, file: artifacts/data/rar.yaml, path: controls_by_level.moderate, value: 3}
expect:
  errors: [SRA-004]
  messages: [controls_by_level gives 3 for moderate; the risks identify 1 controls at that level]
