rule: PRIV-008
bases:
- pii
description: a separate privacy plan the framework has no artifact for
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: plan_structure.consolidation
  value: separate
expect:
  errors:
  - PRIV-008
  messages:
  - the privacy plan is kept separate, and ART-SSP is the only plan the framework holds
