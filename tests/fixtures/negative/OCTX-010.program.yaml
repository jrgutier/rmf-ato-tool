rule: OCTX-010
bases:
- minimal
description: ongoing authorization with only a planned ISCM program
mutations:
- op: set_field
  file: run.yaml
  path: include_after_stop
  value:
  - M-6
- op: append_text
  file: artifacts/data/authorizations.yaml
  text: "- id: AUTH-003\n  decision: AD-CONT\n  subject: system\n  basis: time-driven\n  decided_by: PER-AO\n\
    \  task: M-6\n  date: '2026-12-15'\n  risk_level: moderate\n  risk_acceptance: I accept the residual
    risk.\n  signature: pki\n  conveyed_to: [PER-PM]\n  rationale: Continuous monitoring is near real
    time.\n  sources: [INT-012.A1]\n  underlying: AUTH-002\n  review: {frequency_days: 30, events: [significant
    change]}\n  ongoing_acknowledgment: I accept the ongoing authorization process.\n"
- op: set_field
  file: artifacts/data/org-context.yaml
  path: iscm.program_status
  value: planned
expect:
  errors:
  - OCTX-010
  also:
  - ASMT-010
  - SSPR-001
  messages:
  - the system is under ongoing authorization and no organizational continuous monitoring program is
    in place
