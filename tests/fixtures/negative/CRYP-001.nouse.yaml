rule: CRYP-001
bases:
- minimal
description: a classified system with no cryptography recorded
mutations:
- op: set_field
  file: facts.yaml
  path: classification.value
  value: secret
- op: set_field
  file: facts.yaml
  path: categorization.overlays
  value:
  - CNSSI1253E-ATT5-CLASSIFIED
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.uses
  value: []
expect:
  errors:
  - CRYP-001
  also:
  - GEN-STALE-001
  messages:
  - a system containing classified information records no use of cryptography
