rule: ASMT-010
bases:
- minimal
description: a missed milestone with no change recorded
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: items.0.milestones.0.due
  value: '2026-11-01'
expect:
  errors:
  - ASMT-010
  messages:
  - and no new date and reason are recorded in the changes to milestones
