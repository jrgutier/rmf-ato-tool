rule: CATO-001
bases:
- minimal
description: an organization not briefed on the evaluation criteria
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: assessment.plan.briefed_on
  value:
  - critical-practices
  - assessment-process
expect:
  errors:
  - CATO-001
  messages:
  - 'the assessed organization is not briefed on: evaluation-criteria'
