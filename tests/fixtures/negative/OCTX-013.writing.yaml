rule: OCTX-013
bases: [minimal]
description: the ISSO is appointed orally, so the cybersecurity position is not assigned in writing
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.8.appointment.instrument
  value: oral
expect:
  errors: [OCTX-013]
  messages:
  - "RA-09: the cybersecurity position is not assigned in writing; the appointment is oral"
