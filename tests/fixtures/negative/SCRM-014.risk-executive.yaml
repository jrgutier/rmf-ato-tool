rule: SCRM-014
bases:
- minimal
description: top risks do not reach the risk executive function
mutations:
- op: set_field
  file: artifacts/data/scrm-plan.yaml
  path: reporting.1.content
  value:
  - extent
  - effectiveness
  - urgent-conditions
  - metrics
expect:
  errors:
  - SCRM-014
  messages:
  - no supply chain report elevates top C-SCRM risks to the risk executive function
