rule: OCTX-002
bases:
- minimal
description: certificates are used and the operational need is left out
mutations:
- op: delete_field
  file: artifacts/data/org-context.yaml
  path: code_signing.operational_need
expect:
  errors:
  - OCTX-002
  also:
  - RUN-FM-001
  messages:
  - code-signing certificates are used and code_signing states no operational_need, the number of 
    holders operational requirements call for
