rule: TPL-001
bases: [minimal]
build: false
description: a contingency plan whose business impact analysis heading was renamed away
mutations:
  - op: replace_text
    file: artifacts/ART-CP.md
    old: "## Business impact analysis"
    new: "## Impact notes"
expect:
  errors: [TPL-001]
  also: [GEN-STALE-001]
  messages:
    - "ART-CP drops the required section 'Business impact analysis' of its template, or leaves it unwritten"
