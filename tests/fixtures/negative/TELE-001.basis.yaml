rule: TELE-001
bases:
- minimal
description: non-government equipment developed outside SP 800-114
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: telework
  value:
    non_gfe_remote_access: true
    basis: Vendor guide
    approval:
      by: DoD CIO
      reference: Memo 26-7
      date: '2026-08-01'
expect:
  errors:
  - TELE-001
  messages:
  - telework on non-government furnished equipment is developed from NIST SP 800-114
