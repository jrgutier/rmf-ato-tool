rule: CATO-007
bases:
- minimal
description: artifacts reassessed only on release
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: monitoring.artifact_reassessment
  value: on-release
expect:
  errors:
  - CATO-007
  messages:
  - artifacts in the artifact repository are not continuously reassessed for residual risk
