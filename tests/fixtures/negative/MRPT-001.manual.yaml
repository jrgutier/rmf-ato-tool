rule: MRPT-001
bases:
- minimal
description: manual reporting after the automated process exists
mutations:
- op: set_field
  file: artifacts/data/posture-reports.yaml
  path: reports.0.cmrs
  value:
    method: manual
    automated_process: developed
expect:
  errors:
  - MRPT-001
  messages:
  - manual reporting goes on after the automated process is developed
