rule: RCP-002
bases:
- minimal
description: requirements gathered after release
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: receiving_organizations.0.requirements.gathered
  value: '2026-10-01'
expect:
  errors:
  - RCP-002
  messages:
  - 'RO-01: requirements are not gathered from the receiving organization before the system is developed'
