rule: SSP-STAT-001
bases: [minimal, example]
description: an inherited control without inherited_from
mutations:
  - only: [minimal]
    op: delete_field
    file: artifacts/ssp/controls/sc.yaml
    path: controls.0.inherited_from
  - only: [example]
    op: delete_field
    file: artifacts/ssp/controls/ac.1.yaml
    path: controls.0.inherited_from
expect:
  errors: [SSP-STAT-001]
  messages:
    - "is inherited without inherited_from (the providing system)"
