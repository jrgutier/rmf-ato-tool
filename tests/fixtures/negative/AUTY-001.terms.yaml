rule: AUTY-001
bases:
- joint
description: terms and conditions set by one of the two officials
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: joint_authorization.terms.established_by
  value:
  - PER-AO
expect:
  errors:
  - AUTY-001
  messages:
  - 'the terms and conditions are not established by all participating authorizing officials: Partner
    Component AO'
