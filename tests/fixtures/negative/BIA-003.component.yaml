rule: BIA-003
bases:
- minimal
description: a critical component the authorization boundary does not list
mutations:
- {op: set_field, file: artifacts/data/bia.yaml, path: criticality.critical_items.1.item, value: CMP-HSM}
expect:
  errors:
  - BIA-003
  messages:
  - 'the criticality analysis names critical component CMP-HSM, which is not a component of the authorization boundary'
