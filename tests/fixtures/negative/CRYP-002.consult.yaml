rule: CRYP-002
bases:
- minimal
description: an acquisition started before consulting NSA
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: space_nss
  value: true
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.uses.0.nsa_consulted
  value: '2026-03-01'
expect:
  errors:
  - CRYP-002
  messages:
  - consult with NSA prior to initiating the acquisition
