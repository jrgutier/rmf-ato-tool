rule: OCTX-008
bases:
- minimal
description: a strategy review that ignores threats
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: iscm.reviews.0.considered
  value:
  - monitoring-results
expect:
  errors:
  - OCTX-008
  messages:
  - no ISCM strategy review looks for ways to improve the response to known and emerging threats
