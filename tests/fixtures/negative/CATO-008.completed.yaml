rule: CATO-008
bases:
- minimal
description: onboarding by new hires only
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: people.onboarding.completed_by
  value: new-hires
expect:
  errors:
  - CATO-008
  messages:
  - all personnel have gone through onboarding without regard to rank or position, not new-hires
