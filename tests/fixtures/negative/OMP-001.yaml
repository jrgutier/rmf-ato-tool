rule: OMP-001
bases: [hybrid]
description: an existing system entering at A-2 that has not confirmed implementation
mutations:
  - op: set_field
    file: run.yaml
    path: entry
    value:
      step: A
      task: A-2
      current_state: An existing system in operations and maintenance.
      completed: [P-1, P-2, P-3, P-4, P-5, P-6, P-7, P-8, P-9, P-10, P-11, P-12, P-13, P-14, P-15, P-16, P-17, P-18, C-2, S-1, S-2]
      gaps: The gap analysis compared the implemented controls with the baseline.
      decision: Enter at A-2.
      notified: [PER-ISSM, PER-PM]
      approved_by: PER-AO
expect:
  errors: [OMP-001]
  also: [ENTRY-001]
  messages:
    - has not confirmed I-1 completed
