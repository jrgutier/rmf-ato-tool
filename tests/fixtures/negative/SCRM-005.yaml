rule: SCRM-005
bases:
- minimal
description: a level 3 risk that is not adversarial
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.severity.level
  value: 3
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.escalation
  value:
    officials:
    - PER-ISSM
    - PER-AO
    legal_counsel: true
    fasc: mandatory
    considered:
    - law-enforcement
    - counter-intelligence
    - legal
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.review.senior_leadership
  value: true
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.review.legal_counsel
  value: true
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.findings.threat_type
  value: non-adversarial
expect:
  errors:
  - SCRM-005
  messages:
  - SA-01 has SCRSS level 3, which Table 29 gives only to adversarial-related risk
