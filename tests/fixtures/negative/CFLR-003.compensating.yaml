rule: CFLR-003
bases:
- minimal
description: a compensating control stands for ac-5, which carries CF-CATO-5, with its risk accepted
  by the ISSM, not the AO or AODR
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: si-4\n    action: compensating\n    compensating_for: ac-5\n    source: catalog\n\
    \    cannot_implement: Said not to be implementable on the relay.\n    equivalence: Monitoring stands
    in.\n    risk: {assessment: Low residual risk., accepted_by: PER-ISSM, sources: [ART-RA]}\n    law_policy:\n\
    \      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control: false\n  \
    \    sources: [INT-028.A3]\n    rationale: Monitoring stands in.\n    sources: [INT-028.A3]\n  - control_id:
    cp-3.1"
expect:
  errors:
  - CFLR-003
  also:
  - TLR-001
  messages:
  - 'CF-CATO-5: the DoD CIO cATO evaluation criteria requires that separation of duties and least privilege
    are applied to all personnel, and a compensating control stands for ac-5 without its risk accepted
    by the AO or AODR'
