rule: RARC-001
bases: [minimal]
description: a risk assessment with no decision rationales
mutations:
- op: delete_field
  file: artifacts/data/ra.yaml
  path: rationales
expect:
  errors: [RARC-001]
  messages: ['ra.yaml has no rationales: the risk assessment report lists the rationale for each risk-related decision, or an empty list']
