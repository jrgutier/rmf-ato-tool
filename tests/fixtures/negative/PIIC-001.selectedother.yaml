rule: PIIC-001
bases:
- pii
description: the SAOP approves the low Privacy Overlay, and the moderate one is selected
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.approved.privacy.overlays
  value: [CNSSI1253F-ATT6-PRIVACY-LOW]
expect:
  errors:
  - PIIC-001
  messages:
  - the Privacy Overlay CNSSI1253F-ATT6-PRIVACY-MODERATE is selected without the approval of the SAOP or designee
