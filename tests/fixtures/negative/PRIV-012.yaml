rule: PRIV-012
bases:
- pii
description: the privacy plan went to the AO without the SAOP approval
mutations:
- op: delete_field
  file: artifacts/data/ssp-records.yaml
  path: privacy_plan.approvals
expect:
  errors:
  - PRIV-012
  messages:
  - the privacy plan of a system processing PII went to the authorizing official without the review and approval of the senior agency official for privacy
