rule: CFLR-001
bases:
- minimal
description: ir-4 is tailored out of a networked system although it carries CF-FIPS-IR, a duty FIPS 
  200 places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: ir-4\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-001
  also:
  - CFLR-002
  - CFLR-003
  - DPOL-002
  - DPOL-003
  messages:
  - 'CF-FIPS-IR: FIPS 200 requires that an operational incident handling capability is established, and
    incidents are tracked, documented and reported, and ir-4 is tailored out of the baseline'
