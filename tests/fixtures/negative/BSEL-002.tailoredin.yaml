rule: BSEL-002
bases: [minimal]
description: the baseline leaves out si-7.15, a control S-2 supplemented the baseline with
build: false
mutations:
  - op: set_field
    file: run.yaml
    path: control_subset
    value: [ac-2, au-2, cm-6, ia-2, sc-7, sc-15, si-2, si-7.15]
  - op: replace_text
    file: artifacts/data/tailoring.yaml
    old: "privacy_implementation:\n"
    new: "  - {control_id: si-7.15, action: add, rationale: Supplements the baseline so only signed relay images install., sources: [product/security.md#accounts]}\nprivacy_implementation:\n"
  - op: set_field
    file: facts.yaml
    path: baseline_id.value
    value: CNSSI1253-M-M-L-SUBSET-8
  - op: resolve_baseline
    file: baseline.json
  - op: replace_text
    file: baseline.json
    old: "    },\n    {\n      \"control_id\": \"si-7.15\",\n      \"origin\": \"tailored-in\"\n    }\n"
    new: "    }\n"
expect:
  errors: [BSEL-002]
  also: [GEN-STALE-001]
  messages:
    - "the baseline's controls differ from those a fresh `rmf baseline resolve` selects: it leaves out si-7.15 (tailored-in)"
