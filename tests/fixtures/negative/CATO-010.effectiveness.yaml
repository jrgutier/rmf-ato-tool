rule: CATO-010
bases:
- minimal
description: control effectiveness without threat actor emulation
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: process.control_effectiveness
  value:
  - dynamic-vulnerability-tools
  - penetration-testing
  - operations-analysis
expect:
  errors:
  - CATO-010
  messages:
  - security control effectiveness is not determined with threat-actor-emulation
