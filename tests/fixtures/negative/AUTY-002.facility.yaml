rule: AUTY-002
bases:
- joint
description: a facility authorization recorded as an authorization to operate
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: records.1.facility
  value:
    environment: Component A relay enclave
    impact_level: moderate
    controls:
    - pe-3
    - pe-14
expect:
