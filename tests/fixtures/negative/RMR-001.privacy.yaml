rule: RMR-001
bases:
- minimal
description: the privacy officer record is appointed to another role, so no senior agency official for privacy is designated
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.5.role
  value: PER-SPONSOR
expect:
  errors:
  - RMR-001
  messages:
  - no senior agency official for privacy is designated for the organization
