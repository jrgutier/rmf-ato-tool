rule: PPROT-001
bases:
- minimal
description: a DAE-decided program's PPP approved by the CAE
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.mda
  value: DAE
expect:
  errors:
  - PPROT-001
  messages:
  - where the DAE is the milestone decision authority, the USD(R&E) is the PPP approval authority
