rule: OCTX-003
bases:
- minimal
description: risk management stands apart from strategic planning
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: program.integrated_with
  value:
  - mission-business-risk-management
  - operational-planning
expect:
  errors:
  - OCTX-003
  messages:
  - security and privacy risk management is not integrated with the strategic and operational 
    planning processes
