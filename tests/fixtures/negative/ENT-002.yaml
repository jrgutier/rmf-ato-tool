  content: "leveraged_authorizations:\n- id: LA-01\n  title: Enterprise identity provider ATO\n  provider:
    Enterprise IT Services\n  date_authorized: '2026-03-01'\n  sources:\n  - INT-003.A1\n  enterprise:\n\
    \    accepted_by: DoD ISRMC\n    accepted: '2026-02-01'\n    receiving_action: refuse\n    change_request:\n\
    \      id: CR-012\n      approved_on: isrmc-risk-acceptance\n- id: LA-02\n  title: Example Cloud IaaS
    DoD provisional authorization\n  provider: Example Cloud Provider\n  date_authorized: '2025-11-01'\n\
    \  decision: AD-ATO\n  arrangement: external-service\n  authorization_termination_date: '2028-11-01'\n\
    \  ao_aware:\n    official: PER-AO\n    date: '2026-03-15'\n  sources:\n  - INT-007.A1\n  service:\n\
    \    kind: external\n    agreement:\n      instrument: contract\n      reference: Contract W00000-26-C-0001\n\
    \      enterprise: false\n      security_requirements: true\n"
