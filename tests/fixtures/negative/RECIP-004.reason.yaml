rule: RECIP-004
bases:
- minimal
description: a core document not reused without a reason
mutations:
- op: set_field
  file: artifacts/data/system-description.yaml
  path: origin
  value:
    kind: separate-instance
    organization: Fleet Systems Command
    authorization:
      ao: Fleet Systems Command AO
      decision: AD-ATO
      date: '2025-06-01'
    relinquished: []
    operating: null
    reuse:
    - document: ART-SSP
      reused: true
    - document: ART-SAR
      reused: true
    - document: ART-RAR
      reused: true
    - document: ART-POAM
      reused: false
    - document: ART-AODM
      reused: true
    sources:
    - INT-003.A1
expect:
  errors:
  - RECIP-004
  messages:
  - the providing organization's ART-POAM is not reused and no reason is given
