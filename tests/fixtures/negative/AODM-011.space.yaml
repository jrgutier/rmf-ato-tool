rule: AODM-011
bases:
- minimal
description: a space system issue sent to the DSAWG
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: issues.0.kind
  value: space-system
expect:
  errors:
  - AODM-011
  messages:
  - an authorization issue for space systems is resolved by USSPACECOM
