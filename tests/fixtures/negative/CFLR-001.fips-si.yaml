rule: CFLR-001
bases:
- minimal
description: si-3 is tailored out of a networked system although it carries CF-FIPS-SI, a duty FIPS 
  200 places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: si-3\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-001
  messages:
  - 'CF-FIPS-SI: FIPS 200 requires that flaws are identified, reported and corrected in a timely manner,
    malicious code protection is provided, and security alerts and advisories are monitored and acted
    on, and si-3 is tailored out of the baseline'
  also:
  - CFLR-002
