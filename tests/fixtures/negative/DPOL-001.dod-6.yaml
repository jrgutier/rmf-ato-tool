rule: DPOL-001
bases:
- minimal
description: ia-2 is tailored out of a networked system although it carries PC-DOD-6, a duty DoDI 8500.01
  places on every DoD IS
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: ia-2\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:\
    \ false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n\
    \    sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - DPOL-001
  messages:
  - 'PC-DOD-6: DoDI 8500.01 requires that cyber defense personnel operating on or in a DoD IS are identified
    using identity authentication methods, and ia-2 is tailored out of the baseline'
  also:
  - ASMT-002
  - RECIP-002
  - CFLR-001
