rule: AUTY-001
bases:
- joint
description: the joint agreement documents progress only on a task that is no RMF task of the run
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: joint_authorization.progress
  value:
  - {task: P-99, status: done}
expect:
  errors:
  - AUTY-001
  messages:
  - the joint agreement documents no progress in implementing the RMF tasks
