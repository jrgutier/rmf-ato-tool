rule: HOST-001
bases:
- minimal
description: a major application that could be an enclave application
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: hosting.existing_enclave.status
  value: hosted
expect:
  errors:
  - HOST-001
  messages:
  - a major application needs a new and separate authorization; record why it cannot be developed as
    an application hosted in an existing authorized enclave
