rule: HOST-001
bases:
- minimal
description: a major application that could be an enclave application
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: hosting.enclave_application.status
  value: possible
expect:
  errors:
  - HOST-001
  messages:
  - a capability that can be developed as an application hosted in an existing authorized enclave is
    designated a major application requiring a new and separate authorization
