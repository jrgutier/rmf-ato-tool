rule: CATO-008
bases:
- minimal
description: onboarding not defined by role
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: people.onboarding.by_role
  value: false
expect:
  errors:
  - CATO-008
  messages:
  - no onboarding and offboarding process is defined for team members based on their role
