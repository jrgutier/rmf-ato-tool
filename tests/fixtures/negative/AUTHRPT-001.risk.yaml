rule: AUTHRPT-001
bases: [minimal]
description: the operational requirement names a risk the risk assessment report does not hold
mutations:
  - op: set_field
    file: artifacts/data/authorization-report.yaml
    path: operational_awareness.affected_requirements.0.risk
    value: RSK-099
expect:
  errors: [AUTHRPT-001]
  messages:
    - RSK-099 affects an operational requirement but is no risk of artifacts/data/rar.yaml
