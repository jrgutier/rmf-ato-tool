rule: RCP-002
bases:
- minimal
description: a plan notice acknowledged before it was sent
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: receiving_organizations.0.notices.7.acknowledged
  value: '2026-11-01'
expect:
  errors:
  - RCP-002
  messages:
  - 'RO-01: receipt of the plan notice is not acknowledged by the receiving organization'
