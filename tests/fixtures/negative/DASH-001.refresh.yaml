rule: DASH-001
bases: [minimal]
description: a weekly dashboard
mutations:
  - op: set_field
    file: artifacts/data/cato.yaml
    path: dashboard.refresh
    value: periodic
expect:
  errors: [DASH-001]
  messages:
    - "the dashboard is periodic, not near real time, and records no feasibility_limit saying why a nearer view is not feasible"
