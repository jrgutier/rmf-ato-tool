rule: RCUR-001
bases:
- minimal
description: a later edition of CNSSI 1254 found and not adopted
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: reference_currency.references.0.later_edition
  value: {edition: November 2026, published: '2026-10-01', adopted: false}
expect:
  errors:
  - RCUR-001
  messages:
  - 'CNSSI1254 has a later edition, November 2026, which applies to this policy, and the run does not adopt it'
