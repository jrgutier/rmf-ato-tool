rule: AODM-002
bases: [minimal]
description: a denial carrying a termination date
mutations:
  - op: set_field
    file: artifacts/data/authorizations.yaml
    path: records.1.decision
    value: AD-DATO
expect:
  errors: [AODM-002]
  also: [CATO-002, SSPR-001]
  messages:
    - carries no authorization_termination_date
