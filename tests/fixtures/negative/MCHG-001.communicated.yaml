rule: MCHG-001
bases:
- minimal
description: a decision kept from the requester
mutations:
- op: set_field
  file: artifacts/data/changes.yaml
  path: changes.0.decision.communicated_to
  value:
  - PER-PM
expect:
  errors:
  - MCHG-001
  messages:
  - the board's decision is not communicated to the requester
