rule: BYP-001
bases:
- minimal
description: a bypass procedure coordinated with the PM, not the ISSO
mutations:
- op: set_field
  file: artifacts/data/cm-plan.yaml
  path: bypasses
  value:
  - id: BYP-01
    mechanism: Enclave firewall rule for the relay's TLS inspection
    procedure: The ISSO opens a two-hour exception for the vendor's firmware download and closes it on completion.
    coordinated_with: [PER-PM]
    approval: {by: PER-ISSM, form: written, date: '2026-10-25'}
    sources: [INT-007.A1]
expect:
  errors:
  - BYP-001
  messages:
  - 'BYP-01: the bypass procedure is not coordinated with the ISSO'
