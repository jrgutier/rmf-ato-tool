rule: OSCAL-002
bases: [minimal, example]
description: a generated OSCAL file compliance-trestle 5.2.0 cannot load
build: false
mutations:
  - op: write_file
    file: oscal/extra.json
    content: '{"profile": {"uuid": "11111111-1111-4111-8111-111111111111", "metadata": {"title": "x", "last-modified": "2026-10-29T12:00:00Z", "version": "1", "oscal-version": "1.2.1"}, "imports": []}}'
expect: {errors: [OSCAL-002], also: [OSCAL-001, GEN-STALE-001]}
