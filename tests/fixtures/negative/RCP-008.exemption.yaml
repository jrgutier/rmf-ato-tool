rule: RCP-008
bases:
- minimal
description: deselected from reciprocity without a justification
mutations:
- op: set_field
  file: artifacts/data/registration.yaml
  path: registry.reciprocity
  value:
    listed: false
expect:
  errors:
  - RCP-008
  messages:
  - the system is deselected from reciprocity listing without an exemption justification
