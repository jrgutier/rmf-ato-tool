rule: PVAL-001
bases: [minimal]
description: a baseline control records no value for a parameter the CNSSI 1253 Parameter Value column sets
mutations:
  - op: delete_field
    file: artifacts/ssp/controls/si.yaml
    path: controls.0.parameters
expect:
  errors: [PVAL-001]
  messages:
    - "si-2 records no value for si-02_odp; CNSSI 1253 sets the NSS value '30 days'"
