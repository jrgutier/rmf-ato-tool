rule: SSE-001
bases:
- minimal
description: derivation informed by the CONOPS twice and never by the mission profiles
mutations:
- op: set_field
  file: artifacts/data/requirements.yaml
  path: derivation.informed_by.3.kind
  value: concept-of-operations
expect:
  errors:
  - SSE-001
  messages:
  - requirements derivation is not informed by the mission profiles
