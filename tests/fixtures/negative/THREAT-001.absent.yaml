rule: THREAT-001
description: the risk assessment designates no risk for the system
bases:
- minimal
mutations:
- op: delete_field
  file: artifacts/data/ra.yaml
  path: system_risk
expect:
  errors:
  - THREAT-001
  messages:
  - ra.yaml designates no risk for the system (system_risk) consistent with the most severe threat to any individual component or subcomponent
