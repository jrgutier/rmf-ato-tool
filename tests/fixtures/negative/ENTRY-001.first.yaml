rule: ENTRY-001
bases:
- hybrid
description: an entry at P-1 in a run scoped from P-10
mutations:
- op: set_field
  file: run.yaml
  path: entry
  value:
    step: P
    task: P-1
    current_state: Categorized and described under a prior effort; no baseline selected.
    completed:
    - P-1
    - C-1
    - C-2
    - C-3
    gaps: Prepare tasks P-8 to P-18 were never documented.
    decision: Enter at S-1 and backfill Prepare at the next annual review.
    notified:
    - PER-ISSM
    - PER-PM
    approved_by: PER-AO
expect:
  errors:
  - ENTRY-001
  messages:
  - the entry determination enters at P-1, but the run's first task in scope is P-10
