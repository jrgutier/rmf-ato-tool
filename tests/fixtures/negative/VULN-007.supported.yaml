rule: VULN-007
bases:
- minimal
description: asset management supported by an artifact the framework lacks
mutations:
- op: set_field
  file: artifacts/data/conmon.yaml
  path: vulnerability_management.supported_by.asset
  value: ART-NOPE
expect:
  errors:
  - VULN-007
  messages:
  - the strategy names no artifact whose asset management supports vulnerability management
