rule: DPOL-001
bases:
- minimal
description: a system declared stand-alone that keeps an indirect DODIN connection removes ia-2 with the
  AO's approval
mutations:
- op: set_field
  file: facts.yaml
  path: system_type.connectivity
  value: stand-alone
- op: set_field
  file: facts.yaml
  path: system_type.dodin_connection
  value: indirect
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: ia-2\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:\
    \ false\n      sources: [INT-028.A3]\n    approved_by: PER-AO\n    rationale: The relay is said to\
    \ need no such control.\n    sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - DPOL-001
  messages:
  - 'PC-DOD-1: DoDI 8500.01 requires that identity assurance ensures strong identification and authentication
    and eliminates anonymity in DoD IS and PIT systems, and ia-2 is tailored out of the baseline'
  also:
  - ASMT-002
  - RECIP-002
