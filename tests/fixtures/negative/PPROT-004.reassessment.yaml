rule: PPROT-004
bases:
- minimal
description: reassessment mitigations that reach no contract
mutations:
- op: set_field
  file: artifacts/data/protection-requirements.yaml
  path: reassessments
  value:
  - id: RA-001
    trigger: technology-refresh
    change: Radio module refresh
    date: '2026-05-01'
    mitigations:
    - Re-key the module at install
    incorporated_in:
    - K-9
expect:
  errors:
  - PPROT-004
  messages:
  - the technical and process mitigations of the reassessment are incorporated into no solicitation,
    contract or agreement
