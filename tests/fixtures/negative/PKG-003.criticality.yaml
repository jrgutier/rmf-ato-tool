rule: PKG-003
bases:
- minimal
description: no answer to whether mission critical functions are present
mutations:
- {op: delete_field, file: artifacts/data/bia.yaml, path: mission_critical}
expect:
  errors:
  - PKG-003
  also:
  - RUN-FM-001
  messages:
  - does not carry the CNSSI 1254 data element Mission Criticality and Mission Critical Functions
