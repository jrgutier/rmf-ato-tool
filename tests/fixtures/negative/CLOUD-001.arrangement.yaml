rule: CLOUD-001
bases:
- minimal
description: the offering leans on an organizational system's ATO
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: offerings.0.leveraged_authorization
  value: LA-01
expect:
  errors:
  - CLOUD-001
  messages:
  - 'CSO-01: LA-01 is not an IT service authorized by another organization (arrangement organizational-system)'
