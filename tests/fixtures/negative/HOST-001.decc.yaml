rule: HOST-001
bases:
- minimal
description: a new major application in a program facility, DECC feasible
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: hosting.environment
  value: program-facility
expect:
  errors:
  - HOST-001
  messages:
  - a new major application is hosted in a Defense Enterprise Computing Center when operationally 
    feasible
