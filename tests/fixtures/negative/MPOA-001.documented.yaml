rule: MPOA-001
bases:
- minimal
description: an item resting on no assessment report
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: items.0.finding_ref
  value: EXF-002
expect:
  errors:
  - MPOA-001
  also:
  - SAR-POAM-001
  - RAR-001
  messages:
  - is not documented in the assessment reports
