rule: OCTX-004
bases:
- minimal
description: the CIO sets the risk executive structure
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: governance.risk_executive.structured_by
  value: PER-CIO
expect:
  errors:
  - OCTX-004
  messages:
  - the structure and responsibilities of the risk executive (function) are determined by PER-CIO, 
    not the senior accountable official for risk management
