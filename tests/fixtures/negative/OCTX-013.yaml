rule: OCTX-013
bases:
- minimal
description: the ISSM position is outside the manpower structure
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.7.position.manpower_id
  value: MP-99
expect:
  errors:
  - OCTX-013
  messages:
  - "RA-08: the position MP-99 is not identified in the organization's manpower structure"
