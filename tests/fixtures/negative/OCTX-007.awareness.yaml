rule: OCTX-007
bases:
- minimal
description: a run at contract 0.3.0 whose organization-wide monitoring gives no awareness of threats and vulnerabilities
mutations:
- op: set_field
  file: run.yaml
  path: framework_version
  value: 0.3.0
- op: set_field
  file: artifacts/data/org-context.yaml
  path: iscm.monitors
  value:
  - control-effectiveness
  - changes
  - organizational-state
  - asset-visibility
expect:
  errors:
  - OCTX-007
  messages:
  - organization-wide continuous monitoring does not determine threat-and-vulnerability-awareness
