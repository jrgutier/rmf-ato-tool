rule: PPROT-001
bases:
- minimal
description: a decision point the pathway does not have
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.decision_points.1.id
  value: MS-ZZ
- op: set_field
  file: artifacts/data/nss-assessments.yaml
  path: assessments.0.decision_point
  value: MS-ZZ
expect:
  errors:
  - PPROT-001
  messages:
  - MS-ZZ is no decision point of the PW-MCA pathway
