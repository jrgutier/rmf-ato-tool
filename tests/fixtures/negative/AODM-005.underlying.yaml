rule: AODM-005
bases: [minimal]
description: a continuation that names nothing it rests on
mutations:
  - op: set_field
    file: run.yaml
    path: include_after_stop
    value: [M-6]
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-003
        decision: AD-CONT
        subject: system
        basis: time-driven
        decided_by: PER-AO
        task: M-6
        date: '2026-12-15'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
        review: {frequency_days: 30, events: [significant change]}
        ongoing_acknowledgment: I accept the ongoing process.
expect:
  errors: [AODM-005]
  messages:
    - names the authorization it rests on in underlying
