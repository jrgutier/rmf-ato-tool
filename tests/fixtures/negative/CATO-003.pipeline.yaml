rule: CATO-003
bases:
- minimal
description: a pipeline that collects no evidence
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: platform.pipelines.0.collects_evidence
  value: false
expect:
  errors:
  - CATO-003
  messages:
  - no DevSecOps pipeline has automated guardrails and control gates that collect evidence for continuous risk determinations
