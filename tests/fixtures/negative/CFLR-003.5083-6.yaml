rule: CFLR-003
bases:
- minimal
description: sc-7 is tailored out of a networked system although it carries CF-5083-6, a duty DoDI 
  5000.83 places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: sc-7\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-003
  also:
  - ASMT-002
  - CFLR-001
  - CFLR-002
  - ISCM-003
  - SVCA-001
  messages:
  - 'CF-5083-6: DoDI 5000.83 requires that the system architecture and design address how the system interfaces
    with the DoD Information Network or other external services, and sc-7 is tailored out of the baseline'
