rule: CLOUD-002
bases:
- minimal
description: unclassified NSS data at IL4
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: mission_impact_level
  value:
    level: IL4
    data:
    - cui
    - unclassified-nss
    disclosure_effect: serious
    determined_by: PER-AO
    date: '2026-03-01'
    sources:
    - INT-005.A1
expect:
  errors:
  - CLOUD-002
  messages:
  - nonpublic, unclassified National Security Systems data is hosted at Impact Level 5 or above, not
    IL4
