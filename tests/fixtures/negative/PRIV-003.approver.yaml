rule: PRIV-003
bases:
- pii
description: the CISO approves the PIA as CIO
mutations:
- op: set_field
  file: artifacts/data/pia.yaml
  path: approval.by
  value: PER-CISO
expect:
  errors:
  - PRIV-003
  messages:
  - the Component CIO approves the PIA as final review and approval official, not PER-CISO
