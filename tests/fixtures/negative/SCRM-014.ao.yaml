rule: SCRM-014
bases:
- minimal
description: urgent threats not notified to the authorizing official
mutations:
- op: set_field
  file: artifacts/data/scrm-plan.yaml
  path: urgent.notified
  value:
  - PER-MDA
  - dod-cio
expect:
  errors:
  - SCRM-014
  messages:
  - mission-critical supply chain threats that cannot be addressed are not notified to the 
    authorizing official
