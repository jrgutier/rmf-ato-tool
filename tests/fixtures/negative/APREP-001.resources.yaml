rule: APREP-001
bases:
- minimal
description: someone other than the system owner allocates
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: preparation.resources.allocated_by
  value: PER-ISSM
expect:
  errors:
  - APREP-001
  messages:
  - the system owner ensures that resources are available for the assessment, not PER-ISSM
