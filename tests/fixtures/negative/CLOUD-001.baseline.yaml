rule: CLOUD-001
bases:
- cloud
description: a FedRAMP Low offering used under reciprocity
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: mission_impact_level
  value:
    level: IL2
    data:
    - public
    disclosure_effect: limited
    determined_by: PER-AO
    date: '2026-03-01'
    sources:
    - INT-005.A1
- op: set_field
  file: artifacts/data/cloud.yaml
  path: offerings.0.authorization
  value:
    basis: fedramp
    fedramp_baseline: low
    impact_level: IL2
    issued_by: FedRAMP agency authorization
    conditions:
    - Public data only
    package_location: fedramp-repository
    package_access_request:
      submitted_by: PER-SPONSOR
      date: '2026-02-01'
expect:
  errors:
  - CLOUD-001
  messages:
  - 'CSO-01: a FedRAMP authorization at the low baseline is not eligible for use under reciprocity; it
    needs the moderate baseline'
