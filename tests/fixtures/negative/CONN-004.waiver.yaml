rule: CONN-004
bases:
- minimal
description: a DODIN waiver granted before the DoD CIO finished its review
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: dodin
  value:
    position: outside
    waiver:
      reviewed_by: DOD-CIO
      reviewed: '2026-03-20'
      granted: '2026-03-01'
      reference: DODIN waiver 26-07
