rule: REQS-001
bases:
- minimal
description: a requirement traces to a protection need the file does not record
mutations:
- op: set_field
  file: artifacts/data/requirements.yaml
  path: requirements.0.needs
  value:
  - NEED-02
  - NEED-09
expect:
  errors:
  - REQS-001
  messages:
  - REQ-01 traces to protection need NEED-09, which the requirements do not record
