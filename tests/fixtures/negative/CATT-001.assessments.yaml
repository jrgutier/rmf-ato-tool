rule: CATT-001
bases:
- minimal
description: no resiliency and survivability based risk assessment
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: practices.risk_assessments
  value:
  - mission-based
  - threat-based
expect:
  errors:
  - CATT-001
  messages:
  - the risk assessments performed leave out the resiliency-survivability-based one
