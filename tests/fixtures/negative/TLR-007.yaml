rule: TLR-007
bases:
- minimal
description: an enhancement selected without its base control
mutations:
- op: set_field
  file: run.yaml
  path: control_subset
  value:
  - ac-2
  - au-2
  - cm-6
  - ia-2
  - sc-7
  - sc-15
  - ac-17.1
  - si-2
- op: append_text
  file: artifacts/ssp/controls/ac.yaml
  text: "  - control_id: ac-17.1\n    status: implemented\n    statement: Fixture statement for ac-17.1.\n    responsible_roles: [PER-ISSE]\n    components: [CMP-RELAY]\n    sources: [product/security.md#authentication]\n"
- op: replace_text
  file: artifacts/sar/results/ac.yaml
  old: "determinations:\n"
  new: "determinations:\n- control_id: ac-17.1\n  result: satisfied\n  methods: [examine]\n  summary: Fixture determination.\n  sources: [INT-009.A1]\n  statements:\n  - {id: 'AC-17(01)[01]', result: satisfied}\n  - {id: 'AC-17(01)[02]', result: satisfied}\n"
- op: replace_text
  file: artifacts/data/sap.yaml
  old: "- id: PRC-001\n  controls:\n  - ac-2\n"
  new: "- id: PRC-001\n  controls:\n  - ac-17.1\n  - ac-2\n"
- op: replace_text
  file: facts.yaml
  old: CNSSI1253-M-M-L-SUBSET-7
  new: CNSSI1253-M-M-L-SUBSET-8
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - TLR-007
  messages:
  - the control enhancement ac-17.1 is selected without the selection of its base control ac-17
