rule: CFLR-003
bases:
- minimal
description: cm-3 is tailored out of a networked system although it carries CF-8531-7, a duty DoDI 
  8531.01 places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: cm-3\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-003
  also: []
  messages:
  - 'CF-8531-7: DoDI 8531.01 requires that configuration changes are recommended to ensure the correct application of remediation or mitigation actions, and cm-3 is tailored out of the baseline'
