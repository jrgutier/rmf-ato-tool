rule: MISCM-001
bases:
- minimal
description: a draft the executive sponsor never reviewed
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: iscm_assessments.0.draft.reviewed_by
  value:
  - PER-CIO
expect:
  errors:
  - MISCM-001
  messages:
  - the draft report is not reviewed by the executive sponsor
