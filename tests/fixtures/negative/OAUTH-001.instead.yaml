rule: OAUTH-001
bases: [minimal]
description: an event-driven review standing in for the time-driven review
mutations:
  - op: set_field
    file: run.yaml
    path: include_after_stop
    value: [M-6]
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-003
        decision: AD-CONT
        subject: system
        basis: time-driven
        decided_by: PER-AO
        task: M-6
        date: '2026-12-15'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
        underlying: AUTH-002
        review: {frequency_days: 30, events: [significant change]}
        ongoing_acknowledgment: I accept the ongoing process.
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-004
        decision: AD-CONT
        subject: system
        basis: event-driven
        decided_by: PER-AO
        task: M-6
        date: '2027-01-10'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
        underlying: AUTH-002
        review: {frequency_days: 30, events: [significant change]}
        ongoing_acknowledgment: I accept the ongoing process.
        trigger: {event: significant change, raised_by: PER-ISSM, date: '2027-01-09'}
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-005
        decision: AD-CONT
        subject: system
        basis: time-driven
        decided_by: PER-AO
        task: M-6
        date: '2027-02-01'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
        underlying: AUTH-002
        review: {frequency_days: 30, events: [significant change]}
        ongoing_acknowledgment: I accept the ongoing process.
expect:
  errors: [OAUTH-001]
  also: [ASMT-010, SSPR-001]
  messages:
    - an event-driven review is in addition to it, not instead
