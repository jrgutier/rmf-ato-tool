rule: AUTHRPT-001
bases: [minimal]
description: a risk that affects an operational requirement is coordinated with the program manager only, not the operational commanders
mutations:
  - op: set_field
    file: artifacts/data/authorization-report.yaml
    path: operational_awareness.affected_requirements.0.coordinated_with
    value: [PER-PM]
expect:
  errors: [AUTHRPT-001]
  messages:
    - RSK-001 affects an operational requirement and its coordination leaves out the cyberspace and functional operational commanders
