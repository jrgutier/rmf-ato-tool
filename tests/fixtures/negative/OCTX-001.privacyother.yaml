rule: OCTX-001
description: the CISO coordinates with the CIO, not the senior agency official for privacy
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.1.coordinates_with
  value: [PER-CIO]
expect:
  errors:
  - OCTX-001
  messages:
  - 'RA-02: the senior agency information security officer coordinates with the senior agency official
    for privacy'
