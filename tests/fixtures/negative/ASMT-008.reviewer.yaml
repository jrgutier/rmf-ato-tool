rule: ASMT-008
bases:
- minimal
description: reviewed by someone other than the CISO
mutations:
- op: set_field
  file: artifacts/data/sar-report.yaml
  path: quality_review.by
  value: PER-SCA
expect:
  errors:
  - ASMT-008
  messages:
  - the CISO is responsible for assessing the quality of security control assessments, not PER-SCA
