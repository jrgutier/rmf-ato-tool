rule: DPOL-002
bases:
- minimal
description: ir-4 is tailored out of a networked system although it carries PC-DOD-19, a duty DoDI 8500.01
  places on its users
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: ir-4\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:\
    \ false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n\
    \    sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - DPOL-002
  also:
  - CFLR-001
  - CFLR-002
  - CFLR-003
  - DPOL-003
  messages:
  - 'PC-DOD-19: DoDI 8500.01 requires that the ISSO initiates protective or corrective measures on an
    incident or vulnerability and users have a process to report events, threats and vulnerabilities to
    the ISSO, and ir-4 is tailored out of the baseline'
