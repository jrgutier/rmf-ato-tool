rule: RAPT-001
bases:
- minimal
description: the AODR is appointed by the Component CIO, not the AO (DoDI 8510.01 Table 8)
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.3.appointed_by
  value: PER-CIO
expect:
  errors:
  - RAPT-001
  messages:
  - 'RA-04: PER-AODR is appointed by PER-CIO, which DoDI 8510.01 Table 8 does not name as its appointing authority (PER-AO)'
