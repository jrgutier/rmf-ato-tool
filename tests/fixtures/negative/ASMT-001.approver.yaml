rule: ASMT-001
bases:
- minimal
description: approved by someone other than the AO or AODR
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: approval.approved_by
  value: PER-ISSM
expect:
  errors:
  - ASMT-001
  messages:
  - assessment plans are approved by the authorizing official or designated representative, not PER-ISSM
