rule: CONN-001
bases:
- minimal
description: a mission partner interconnection with no DISA approval
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.network
  value: mission-partner
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.mission_partner
  value:
    partner: Allied ground station
    sponsor: Army
    interconnection: dmz
    dmz: REL DMZ
    requirement_approved_by:
    - sponsor
    - DOD-CIO
    fulfillment: in-progress
    partner_package: partner-assisted
- op: set_field
  file: artifacts/data/boundary.yaml
  path: connections.0.approvals
  value:
  - authority: DOD-CIO
    status: requested
    sources: &id001
    - INT-025.A1
  - authority: ISRMC
    status: requested
    sources: *id001
expect:
  errors:
  - CONN-001
  messages:
  - 'CONN-01: the mission partner interconnection does not follow the DISN connection process'
