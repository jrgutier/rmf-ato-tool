rule: TLR-010
bases:
- minimal
description: a determination made without the authorizing official
mutations:
- op: set_field
  file: artifacts/data/allocation.yaml
  path: providers.0.determination.by
  value:
  - PER-PM
expect:
  errors:
  - TLR-010
  messages:
  - the determination for Analysis enclave (PRV-01) is not made by the system owner (PER-PM) and the authorizing official or designated representative (PER-AO, PER-AODR); system owners and authorizing officials determine if the common controls provide protection commensurate with risk
