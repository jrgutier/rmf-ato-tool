rule: XSUM-001
bases: [minimal]
description: a package submitted to the assessor instead of the AO or AODR
mutations:
  - op: set_field
    file: artifacts/data/package-summary.yaml
    path: submission.to
    value: PER-SCA
expect:
  errors: [XSUM-001]
  messages:
    - the package is submitted to the authorizing official or the designated representative
