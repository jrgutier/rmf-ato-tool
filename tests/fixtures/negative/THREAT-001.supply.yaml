rule: THREAT-001
description: the threat events are all low, and the program developer's supply chain risk to the relay software is moderate, above the low designation
bases:
- minimal
mutations:
- op: set_field
  file: artifacts/data/ra.yaml
  path: threat_events.0.risk
  value: low
- op: set_field
  file: artifacts/data/ra.yaml
  path: system_risk
  value: {level: low, set_by: TE-01, sources: [INT-023.A1]}
expect:
  errors:
  - THREAT-001
  messages:
  - "the system's risk is designated low, below the moderate risk of SC-03 to INV-003, the most severe threat to any individual component"
