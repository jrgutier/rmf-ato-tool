rule: PPSM-001
bases:
- minimal
description: an Enterprise system whose PPSM registration leaves out a connection
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: records.1.deployment
  value: {scope: enterprise, version: '1.0', boarding: BRD-002}
- op: set_field
  file: artifacts/data/registration.yaml
  path: ppsm.connections
  value: []
expect:
  errors:
  - PPSM-001
  messages:
  - the PPSM registration of the Enterprise system leaves out the ports, protocols and services of CONN-01
