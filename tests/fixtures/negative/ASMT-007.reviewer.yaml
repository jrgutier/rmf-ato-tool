rule: ASMT-007
bases:
- minimal
description: the independent review of the results done by a member of the assessment team
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: assessor_independence.achieved_by
  value: independent-review
- op: set_field
  file: artifacts/data/sap.yaml
  path: assessor_independence.review
  value:
    by:
    - PER-SCA
    situation: The assessors sit in the program office chain.
expect:
  errors:
  - ASMT-007
  messages:
  - who is on the assessment team or no framework persona
