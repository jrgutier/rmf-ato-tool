rule: MLEV-001
bases:
- minimal
description: inheriting from a system under a denial
mutations:
- op: set_field
  file: artifacts/data/leveraged-authorizations.yaml
  path: leveraged_authorizations.0.decision
  value: AD-DATO
expect:
  errors:
  - MLEV-001
  messages:
  - the system providing inherited controls holds a valid authorization to operate
