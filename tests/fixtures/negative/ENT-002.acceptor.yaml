  content: "leveraged_authorizations:\n- id: LA-01\n  title: Enterprise identity provider ATO\n  provider:\
    \ Enterprise IT Services\n  date_authorized: '2026-03-01'\n  sources:\n  - INT-003.A1\n  enterprise:\n\
    \    accepted_by: Component\n    accepted: '2026-02-01'\n    receiving_action: deploy\n    change_request:\n\
    \      id: CR-012\n      approved_on: isrmc-risk-acceptance\n"
expect:
