rule: UPD-001
bases:
- minimal
description: C-1 characterized the system and its update of the registration information carries something else
mutations:
- op: set_field
  file: artifacts/data/registration.yaml
  path: updates.0.content
  value: categorization
expect:
  errors:
  - UPD-001
  messages:
  - C-1 completed the characterization of the system, but the registration information is not updated with it (no characterization update by C-1)
