rule: ASSET-002
bases:
- minimal
description: two items sharing a unique item identifier
mutations:
- op: set_field
  file: artifacts/data/inventory.yaml
  path: items.1.uii
  value: UII-0001
expect:
  errors:
  - ASSET-002
  messages:
  - the unique item identifier UII-0001 is shared by more than one item
