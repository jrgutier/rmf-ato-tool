rule: CRYP-002
bases:
- minimal
description: a cryptographic bypass not coordinated with NSA
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: space_nss
  value: true
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.space.bypasses.0.coordinated_with
  value: PER-ISSM
expect:
  errors:
  - CRYP-002
  messages:
  - is coordinated with NSA and approved by the AO
