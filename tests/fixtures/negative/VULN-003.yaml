rule: VULN-003
bases:
- minimal
description: a VDP report validated before it was received
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: vdp_reports.0.validation.date
  value: '2026-12-01'
expect:
  errors:
  - VULN-003
  messages:
  - 'VDP-001: the reported vulnerability is not validated'
