rule: CATO-011
bases:
- minimal
description: a tolerance set from cost
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: tolerances.0.criticality
  value: cost
expect:
  errors:
  - CATO-011
  messages:
  - 'TOL-01: the tolerance is not set from the criticality of mission, systems, or key system parameters, but cost'
