rule: CATG-005
bases:
- minimal
description: impact levels of an information type traced to the capability sponsor, not its information owner
mutations:
- {op: set_field, file: artifacts/data/infotypes.yaml, path: information_types.0.sources, value: [INT-019.A1]}
expect:
  errors:
  - CATG-005
  messages:
  - 'the impact levels of INF-01 trace to no input of its information owner (PER-IO)'
