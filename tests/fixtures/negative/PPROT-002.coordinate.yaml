rule: PPROT-002
bases:
- minimal
description: required AT not coordinated with the AT office
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.anti_tamper
  value:
    outside_us_control: false
    required: true
    guidance: []
expect:
  errors:
  - PPROT-002
  messages:
  - AT is coordinated with the DoD Component office of primary responsibility for DoD AT
