rule: CLOUD-002
bases:
- cloud
description: the ISSM sets the mission impact level
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: mission_impact_level.determined_by
  value: PER-ISSM
expect:
  errors:
  - CLOUD-002
  messages:
  - the impact level for the mission and mission data is the responsibility of the mission AO, not 
    PER-ISSM
