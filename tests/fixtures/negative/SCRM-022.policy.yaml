rule: SCRM-022
bases:
- minimal
description: neither Level 1 nor Level 2 provides a policy
mutations:
- op: set_field
  file: artifacts/data/scrm-org.yaml
  path: levels.0.deliverables
  value:
  - strategy
  - implementation-plan
- op: set_field
  file: artifacts/data/scrm-org.yaml
  path: levels.1.deliverables
  value:
  - strategy
  - implementation-plan
expect:
  errors:
  - SCRM-022
  messages:
  - neither level-1 nor level-2 provides a C-SCRM policy
