rule: OCTX-004
bases:
- minimal
description: the ISSM accepts an external relationship's risk
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: external_entities.0.accepted_by
  value: PER-ISSM
expect:
  errors:
  - OCTX-004
  messages:
  - 'EXT-01: the risk of the relationship with Enterprise IT Services is accepted by PER-ISSM, not a senior
    leader'
