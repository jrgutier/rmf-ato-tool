rule: CATT-001
bases:
- minimal
description: threats identified to the network and data architecture only
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: practices.threats_identified_to
  value:
  - network-data-architecture
expect:
  errors:
  - CATT-001
  messages:
  - cyber threats are not identified to the mission-assets, cybersecurity-architecture
