rule: RCP-006
bases:
- minimal
description: a supporting artifact agreed as a core document
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: agreements.0.documents
  value:
  - ART-SSP
  - ART-STIG
expect:
  errors:
  - RCP-006
  messages:
  - 'AGR-01: ART-STIG, agreed as required, is not an RMF core document'
