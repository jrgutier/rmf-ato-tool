rule: OCTX-001
bases:
- minimal
description: the PAO for the enterprise information environment mission area is appointed by the CJCS,
  not the DoD CIO
mutations:
- op: replace_text
  file: artifacts/data/org-context.yaml
  old: 'manpower_structure:'
  new: '  - {id: RA-14, role: PER-PAO, name: X (fixture), title: T, organization: DoD, contact: {email:
    x@example.mil}, appointed_by: cjcs, citizenship: us, affiliation: dod-civilian, mission_area: eiema,
    sources: [INT-013.A1]}

    manpower_structure:'
expect:
  errors:
  - OCTX-001
  messages:
  - 'RA-14: the PAO for mission area eiema is appointed by cjcs, not the DoD MA owner of that mission
    area'
  also:
  - WFQ-001
