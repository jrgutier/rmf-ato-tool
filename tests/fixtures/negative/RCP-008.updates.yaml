rule: RCP-008
bases:
- minimal
description: the registry updated before the authorization to use
mutations:
- op: set_field
  file: artifacts/data/registration.yaml
  path: registry.updates.0.date
  value: '2026-12-01'
expect:
  errors:
  - RCP-008
  messages:
  - 'RS-01: the authorization tracking tool is not updated after the system is accepted'
