rule: SCRM-002
bases:
- minimal
description: technical mitigations without software-assurance
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: criticality.tsn
  value:
  - criticality-analysis
  - all-source-threat-assessment
  - hardware-assurance
  - procurement-strategies
  - anti-counterfeit
  - scrm-countermeasures
  - cyber-test-and-evaluation
expect:
  errors:
  - SCRM-002
  messages:
  - technical mitigations for mission-critical functions and critical components do not include 
    software-assurance
