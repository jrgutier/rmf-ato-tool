rule: SCRM-004
bases:
- minimal
description: a substantial risk not cleared by senior leadership
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.severity.level
  value: 3
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.escalation
  value:
    officials:
    - PER-ISSM
    - PER-AO
    legal_counsel: true
    fasc: mandatory
    considered:
    - law-enforcement
    - counter-intelligence
    - legal
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.review.senior_leadership
  value: true
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.review.legal_counsel
  value: true
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.review.senior_leadership
  value: false
expect:
  errors:
  - SCRM-004
  messages:
  - SA-01 assesses a substantial risk but senior leadership did not clear the assessment record
