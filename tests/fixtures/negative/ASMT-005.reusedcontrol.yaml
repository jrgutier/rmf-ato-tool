rule: ASMT-005
bases:
- minimal
description: a reused result the plan holds for another control
mutations:
- op: set_field
  file: artifacts/sar/results/ac.yaml
  path: determinations.0.reused
  value:
  - RR-001
expect:
  errors:
  - ASMT-005
  messages:
  - 'ac-2: the assessment plan does not reuse RR-001 for this control'
