rule: SSP-COV-001
bases:
- pii
description: the plan's au statement names au-3 instead of the baseline's privacy control au-2
mutations:
- op: set_field
  file: artifacts/ssp/controls/au.yaml
  path: controls.0.control_id
  value: au-3
expect:
  errors:
  - SSP-COV-001
  messages:
  - baseline control au-2 has no SSP statement in the security and privacy plan
