rule: UPD-001
bases:
- minimal
description: an alternate Component tool with no import of the system data into ERS
mutations:
- op: set_field
  file: artifacts/data/registration.yaml
  path: registry.ers_import
  value: null
expect:
  errors:
  - UPD-001
  messages:
  - the Component uses an alternate tool for system data but records no way, worked out with the DoD CIO, to import it into ERS (ers_import)
