rule: RCP-006
bases:
- minimal
description: an MOA with no termination factors
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: agreements.0.termination_factors
  value: []
expect:
  errors:
  - RCP-006
  messages:
  - 'AGR-01: the factors or conditions justifying termination of the MOU/MOA are not identified'
