rule: PASM-002
bases:
- pii
description: privacy results documented by someone who is no privacy assessor of the plan
mutations:
- op: set_field
  file: artifacts/data/sar-report.yaml
  path: privacy.assessed_by
  value:
  - PER-ISSM
expect:
  errors:
  - PASM-002
  messages:
  - the privacy assessment results are documented by PER-ISSM, not a privacy assessor of the assessment plan
