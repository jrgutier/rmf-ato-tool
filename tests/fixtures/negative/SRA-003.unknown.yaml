rule: SRA-003
bases: [minimal]
description: the priority order names a threat event that is not listed
mutations:
- op: set_field
  file: artifacts/data/ra.yaml
  path: prioritization.order
  value: [TE-01, TE-02, TE-09]
expect:
  errors: [SRA-003]
  messages: ['prioritization.order names TE-09, which ra.yaml does not list']
