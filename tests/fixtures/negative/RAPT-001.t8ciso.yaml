rule: RAPT-001
bases:
- minimal
description: the Component CISO is appointed by the Component head although a Component CIO exists (DoDI 8510.01 Table 8)
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.1.appointed_by
  value: dod-component-head
expect:
  errors:
  - RAPT-001
  also:
  - OCTX-001
  messages:
  - 'RA-02: PER-CISO is appointed by dod-component-head, which DoDI 8510.01 Table 8 does not name as its appointing authority (PER-CIO)'
