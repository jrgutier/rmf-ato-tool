rule: PIIC-001
bases:
- pii
description: the categorization of a PII system with no date of the AO's review
mutations:
- op: delete_field
  file: facts.yaml
  path: categorization.approved.date
expect:
  errors:
  - PIIC-001
  messages:
  - the categorization of a system processing PII records no date of the authorizing official's review, so the SAOP approval cannot be shown before it
