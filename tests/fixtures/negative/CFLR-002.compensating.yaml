rule: CFLR-002
bases:
- minimal
description: a compensating control stands for sc-8, which carries CF-8530-4, with its risk accepted
  by the ISSM, not the AO or AODR
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: si-4\n    action: compensating\n    compensating_for: sc-8\n    source: catalog\n\
    \    cannot_implement: Said not to be implementable on the relay.\n    equivalence: Monitoring stands
    in.\n    risk: {assessment: Low residual risk., accepted_by: PER-ISSM, sources: [ART-RA]}\n    law_policy:\n\
    \      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control: false\n  \
    \    sources: [INT-028.A3]\n    rationale: Monitoring stands in.\n    sources: [INT-028.A3]\n  - control_id:
    cp-3.1"
expect:
  errors:
  - CFLR-002
  also:
  - DPOL-001
  - TLR-001
  messages:
  - 'CF-8530-4: DoDI 8530.01 requires that CUI and privacy information transmitted electronically is protected
    for confidentiality and integrity, by encryption or other protective measures, and a compensating
    control stands for sc-8 without its risk accepted by the AO or AODR'
