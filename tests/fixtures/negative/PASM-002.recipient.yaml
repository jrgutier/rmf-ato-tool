rule: PASM-002
bases:
- pii
description: privacy results provided to the PM, not the AO or AODR
mutations:
- op: set_field
  file: artifacts/data/sar-report.yaml
  path: privacy.provided.to
  value: PER-PM
expect:
  errors:
  - PASM-002
  messages:
  - the privacy assessment results are provided to PER-PM, not the authorizing official or designated representative
