rule: RAR-002
bases:
- minimal
description: a system processing PII without the SAOP
mutations:
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: information_types.0.privacy
  value: true
- op: set_field
  file: artifacts/data/rar.yaml
  path: determination.collaborated_with
  value:
  - PER-CISO
expect:
  errors:
  - RAR-002
  messages:
  - in collaboration with the senior agency official for privacy
  also:
  - AODM-010
