rule: SYSD-005
bases:
- minimal
description: an internal service held by a contract
mutations:
- op: set_field
  file: artifacts/data/leveraged-authorizations.yaml
  path: leveraged_authorizations.0.service.agreement.instrument
  value: contract
expect:
  errors:
  - SYSD-005
  messages:
  - a service-level agreement is executed for an internal IT service, not contract
