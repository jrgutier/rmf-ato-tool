rule: RCP-010
bases:
- minimal
description: an inherited control validated by the ISSO
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.0.controls.2.validated_by
  value: PER-ISSO
expect:
  errors:
  - RCP-010
  messages:
  - 'RS-01: the inherited control sc-7 is not validated by the receiving system ISO'
