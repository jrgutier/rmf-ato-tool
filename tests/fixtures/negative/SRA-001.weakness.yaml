rule: SRA-001
bases: [minimal]
description: a threat event names a vulnerability that is not listed
mutations:
- op: set_field
  file: artifacts/data/ra.yaml
  path: threat_events.0.vulnerabilities
  value: [VUL-09]
expect:
  errors: [SRA-001]
  messages: ['TE-01 names VUL-09, which is no vulnerability or predisposing condition in ra.yaml']
