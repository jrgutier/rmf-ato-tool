rule: CSSTRAT-001
bases:
- minimal
description: an ACAT ID program's CSS approved only by the Component CIO
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.acat
  value: ID
expect:
  errors:
  - CSSTRAT-001
  messages:
  - an ACAT ID program obtains Component CIO and DoD CIO approval of the CSS before MS-A; no DoD-CIO approval
    precedes it
  also:
  - PPROT-001
  - PPROT-005
  - TSTRAT-001
