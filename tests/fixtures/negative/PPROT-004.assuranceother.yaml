rule: PPROT-004
description: the RFP translates hardware assurance, and the PPP's software assurance remediation reaches no RFP or contract
mutations:
- op: set_field
  file: artifacts/data/protection-requirements.yaml
  path: solicitations.0.assurance_remediation
  value: [hardware-assurance]
expect:
  errors:
  - PPROT-004
  messages:
  - remediation strategies of program protection into contract requirements
