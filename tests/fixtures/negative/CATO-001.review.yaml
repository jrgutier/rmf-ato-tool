rule: CATO-001
bases:
- minimal
description: an assessment plan the AO has not reviewed
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: assessment.plan.reviewed_with
  value:
  - PER-PM
expect:
  errors:
  - CATO-001
  messages:
  - the assessment plan is not reviewed with the AO for key practices and concerns
