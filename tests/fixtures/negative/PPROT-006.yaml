rule: PPROT-006
bases:
- minimal
description: an NSS past Milestone A with no NSA assessment
mutations:
- op: set_field
  file: artifacts/data/nss-assessments.yaml
  path: assessments
  value: []
expect:
  errors:
  - PPROT-006
  messages:
  - NSA and the cognizant AO assess the cybersecurity requirements and security architecture of a 
    National Security System before MS-A
