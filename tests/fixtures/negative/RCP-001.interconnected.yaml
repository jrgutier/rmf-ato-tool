rule: RCP-001
bases:
- minimal
description: the package withheld from an interconnected ISO
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: package_sharing.shared_with
  value:
  - PER-IO
expect:
  errors:
  - RCP-001
  messages:
  - the security authorization package is not shared with the ISO of the interconnected system behind CONN-01
