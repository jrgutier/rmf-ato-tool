rule: SCRM-009
bases:
- minimal
description: plan approval not coordinated with the PMO
mutations:
- op: set_field
  file: artifacts/data/scrm-plan.yaml
  path: plan.approval.pmo
  value: no-pmo
expect:
  errors:
  - SCRM-009
  messages:
  - the plan's approval was not coordinated with the C-SCRM PMO the organization has
