rule: SRA-002
bases: [minimal]
description: a connection introduces a vulnerability that is not listed
mutations:
- op: set_field
  file: artifacts/data/ra.yaml
  path: external.connections.0.introduces
  value: [VUL-09]
expect:
  errors: [SRA-002]
  messages: ['connection CMP-IDP introduces VUL-09, which is no vulnerability or predisposing condition in ra.yaml']
