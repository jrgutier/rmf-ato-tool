rule: AUTY-001
bases:
- joint
description: a joint authorization without collaboration on the POA&M and monitoring strategy
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: joint_authorization.collaboration
  value:
  - categorization
  - control-selection
  - assessment-plan
expect:
  errors:
  - AUTY-001
  messages:
  - the joint authorization does not collaborate on poam, monitoring-strategy
