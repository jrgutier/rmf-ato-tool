rule: SVCA-001
bases:
- minimal
description: an inherited provider with no agreement on a cATO system
mutations:
- op: set_field
  file: run.yaml
  path: include_after_stop
  value:
  - M-6
- op: set_field
  file: facts.yaml
  path: acquisition
  value:
    pathway: PW-SWP
    product_kind: software
    set_by_task: M-6
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: system_status
  value:
    status: ATO-with-conditions
    security_review_date: '2026-09-01'
- op: append_text
  file: artifacts/data/authorizations.yaml
  text: "- id: AUTH-003\n  decision: AD-CATO\n  subject: system\n  basis: time-driven\n  decided_by: PER-AO\n\
    \  task: M-6\n  date: '2026-12-15'\n  risk_level: moderate\n  risk_acceptance: I accept the residual\
    \ risk.\n  signature: pki\n  conveyed_to: [PER-PM]\n  rationale: Continuous monitoring is near real\
    \ time.\n  sources: [INT-012.A1]\n  underlying: AUTH-002\n  review: {frequency_days: 30, events: [significant\
    \ change]}\n  dod_ciso_approval: {date: '2026-12-10', reference: DoD CISO memo}\n  component_ciso_notification:\
    \ {date: '2026-12-01'}\n"
- op: set_field
  file: artifacts/data/service-agreements.yaml
  path: agreements.0.instrument
  value: sla
- op: set_field
  file: artifacts/ssp/controls/sc.yaml
  path: controls.0.inherited_from
  value: Enterprise boundary service
expect:
  errors:
  - SVCA-001
  also:
  - ASMT-010
  - OCTX-006
  messages:
  - inherited controls integrate with Enterprise boundary service and no agreement documents it
