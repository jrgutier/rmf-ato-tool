rule: RCP-004
bases:
- minimal
description: an Enterprise system's impact found locally
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.0.impact.via
  value: local
expect:
  errors:
  - RCP-004
  messages:
  - 'RS-01: issues that may preclude connecting the Enterprise system are not identified through the DSAWG representative'
