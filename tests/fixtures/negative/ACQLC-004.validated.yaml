rule: ACQLC-004
bases:
- minimal
description: a JCIDS document with no validation date once the program has passed CDD validation
mutations:
- op: delete_field
  file: artifacts/data/protection-requirements.yaml
  path: capability_document.validated
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.decision_points
  value:
  - {id: MS-MDD, date: '2025-10-01'}
  - {id: MS-A, date: '2026-03-15'}
  - {id: MS-CDDV, date: '2026-06-01'}
expect:
  errors:
  - ACQLC-004
  messages:
  - a JCIDS capability document records when it was validated
