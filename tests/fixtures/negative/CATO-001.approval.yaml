rule: CATO-001
bases:
- minimal
description: an assessment team approved by the ISSM
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: assessment.team.approved_by
  value: PER-ISSM
expect:
  errors:
  - CATO-001
  messages:
  - the AO approves the assessment team and their capabilities, not PER-ISSM
