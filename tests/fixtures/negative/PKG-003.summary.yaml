rule: PKG-003
bases:
- minimal
description: the SAR leaves its assessment summary, the SCA executive summary, unwritten
mutations:
- op: replace_text
  file: artifacts/ART-SAR.md
  old: 'The assessment covered the controls of the subset; the most significant finding is the root SSH

    login [[INT-009.A1]].'
  new: '<<FILL: executive summary>>'
expect:
  errors:
  - PKG-003
  messages:
  - ART-SAR does not carry the CNSSI 1254 data element SCA Executive Summary
  also:
  - RUN-PH-001
  - TRACE-001
