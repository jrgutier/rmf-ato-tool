rule: RAPT-001
bases:
- minimal
description: the Component CIO is appointed by the AO, not the Component head (DoDI 8510.01 Table 8)
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.0.appointed_by
  value: PER-AO
expect:
  errors:
  - RAPT-001
  messages:
  - 'RA-01: PER-CIO is appointed by PER-AO, which DoDI 8510.01 Table 8 does not name as its appointing authority (dod-component-head)'
