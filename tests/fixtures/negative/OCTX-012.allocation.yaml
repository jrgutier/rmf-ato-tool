rule: OCTX-012
bases:
- minimal
description: the CIO alone allocates protection resources
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: resources.allocation.determined_by
  value:
  - PER-CIO
expect:
  errors:
  - OCTX-012
  messages:
  - the allocation of resources protecting the systems is not determined by the chief information 
    officer and the authorizing officials
