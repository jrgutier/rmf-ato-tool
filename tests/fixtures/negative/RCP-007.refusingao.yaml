rule: RCP-007
bases:
- minimal
description: a refusal decided by the AODR
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.1.refusal.decided_by
  value: PER-AODR
expect:
  errors:
  - RCP-007
  messages:
  - 'RS-02: the refusal to participate in reciprocity is not documented by the refusing AO'
