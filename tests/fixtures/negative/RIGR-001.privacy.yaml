rule: RIGR-001
bases:
- pii
description: a PII system whose rigor does not rest on the privacy risk assessment
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: rigor.privacy_risk_assessment
  value: ART-CAT
expect:
  errors:
  - RIGR-001
  messages:
  - rest on the privacy risk assessment ART-RA, not ART-CAT
