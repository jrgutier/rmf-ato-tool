rule: ASMT-006
bases:
- minimal
description: immediate remediation decided by someone other than the AO
mutations:
- op: set_field
  file: artifacts/sar/results/ac.yaml
  path: findings.0.triage.action
  value: immediate-remediation
expect:
  errors:
  - ASMT-006
  messages:
  - the authorizing official or designated representative decides that a finding requires immediate remediation actions, not PER-PM
