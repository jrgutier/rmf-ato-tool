rule: ENTRY-001
bases:
- hybrid
description: an entry determination counting a task the framework does not have
mutations:
- op: set_field
  file: run.yaml
  path: entry
  value:
    step: P
    task: P-10
    current_state: Categorized and described under a prior effort; no baseline selected.
    completed:
    - P-1
    - P-19
    gaps: Prepare tasks P-8 to P-18 were never documented.
    decision: Enter at S-1 and backfill Prepare at the next annual review.
    notified:
    - PER-ISSM
    - PER-PM
    approved_by: PER-AO
expect:
  errors:
  - ENTRY-001
  messages:
  - the entry determination counts P-19 as completed, which is no RMF task
