rule: AODM-001
bases: [minimal, example]
description: a decision that does not rest on the RAR
mutations:
  - op: delete_field
    file: artifacts/data/authorizations.yaml
    path: records.1.rar_ref
    only: [minimal]
  - op: delete_field
    file: artifacts/data/decision.yaml
    path: rar_ref
    only: [example]
expect:
  errors: [AODM-001]
  messages:
    - the decision must rest on the risk assessment report
