rule: SCRM-006
bases:
- minimal
description: likelihood determination without peer-history
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: threat_analysis.likelihood_inputs
  value:
  - threat-assumptions
  - threat-information
  - expert-perspective
  - external-exposure
expect:
  errors:
  - SCRM-006
  messages:
  - the likelihood determination does not consider peer-history
