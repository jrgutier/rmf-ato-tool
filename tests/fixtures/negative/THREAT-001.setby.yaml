description: the designation equals the worst threat but names as its source TE-02, a threat rated low
bases:
- minimal
mutations:
- op: set_field
  file: artifacts/data/ra.yaml
  path: system_risk.set_by
  value: TE-02
expect:
  errors:
  - THREAT-001
  messages:
  - system_risk is set by TE-02, which is not a moderate threat ra.yaml rates against a component, the
    most severe
rule: THREAT-001
