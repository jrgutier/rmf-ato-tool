rule: VULN-002
bases:
- minimal
description: compliance reported only before the order was received
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: directed_actions.0.compliance_reports.0.date
  value: '2026-11-30'
expect:
  errors:
  - VULN-002
  messages:
  - compliance with the directed action is not reported on or after its receipt
