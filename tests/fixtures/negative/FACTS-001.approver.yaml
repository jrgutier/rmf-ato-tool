rule: FACTS-001
bases: [minimal]
description: the categorization is approved by the ISSM, not the AO or the AO's designated representative
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.approved.approved_by
  value: PER-ISSM
expect:
  errors: [FACTS-001]
  messages:
  - categorization is approved by PER-ISSM, not the AO or the AO's designated representative
  also:
  - PIIC-001
