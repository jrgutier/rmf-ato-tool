rule: MSN-001
bases:
- minimal
description: a mission supported by an information type infotypes.yaml does not declare
mutations:
- op: set_field
  file: facts.yaml
  path: missions.items.0.data
  value:
  - INF-99
expect:
  errors:
  - MSN-001
  messages:
  - MSN-01 is supported by INF-99, which the information types on record do not declare
