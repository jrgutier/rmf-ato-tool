rule: OCTX-009
bases:
- minimal
description: the ISSM reviews the minimums instead of the system owner
mutations:
- op: set_field
  file: artifacts/data/conmon.yaml
  path: minimum_review.by
  value: PER-ISSM
expect:
  errors:
  - OCTX-009
  messages:
  - the system owner does not review whether the organization's minimum monitoring frequencies 
    suffice for the system (reviewed by PER-ISSM)
