rule: CATO-003
bases:
- minimal
description: a platform with no ATO
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: platform.authorization.status
  value: pending
expect:
  errors:
  - CATO-003
  messages:
  - the DevSecOps platform is not already authorized to operate and in a state of continuous monitoring
