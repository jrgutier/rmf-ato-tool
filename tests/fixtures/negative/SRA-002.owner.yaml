rule: SRA-002
bases:
- minimal
description: under the space overlay, a non-NSS connection not considered by the mission owner and the
  AO or AODR
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.overlays
  value:
  - CNSSI1253F-ATT2-SPACE
- op: set_field
  file: artifacts/data/ra.yaml
  path: external.connections.0
  value:
    component: CMP-IDP
    information_exchange: Sign-in assertions for operators.
    nss: false
    introduces:
    - PC-01
    risk: low
    end_to_end_impact: A forged assertion reaches the relay.
    sources:
    - INT-003.A1
- op: set_field
  file: artifacts/data/ra.yaml
  path: external.end_to_end_analysis
  value:
    considered_by:
    - PER-PM
    - PER-AODR
    coordinated_with:
    - nsa
    sources:
    - INT-003.A1
- op: set_field
  file: artifacts/data/ra.yaml
  path: external.end_to_end_analysis.considered_by
  value:
  - PER-ISSM
expect:
  errors:
  - SRA-002
  messages:
  - the impact of non-NSS components (CMP-IDP) was not considered by both the mission owner and the AO
    or AODR
  also:
  - FACTS-001
  - GEN-STALE-001
  - RECIP-001
