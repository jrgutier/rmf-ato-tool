rule: SYSD-001
bases:
- minimal
description: a PIT system authorized by an AO not appointed for PIT
mutations:
- op: set_field
  file: facts.yaml
  path: system_type.value
  value: pit-system
- op: set_field
  file: facts.yaml
  path: system_type.designated_by
  value: dod-component-head
- op: set_field
  file: facts.yaml
  path: system_type.registered_in
  value: Component PIT register
- op: set_field
  file: facts.yaml
  path: system_type.pit_ao_appointed
  value: false
expect:
  errors:
  - SYSD-001
  messages:
  - the PIT system's AO is not one specifically appointed to authorize PIT systems
