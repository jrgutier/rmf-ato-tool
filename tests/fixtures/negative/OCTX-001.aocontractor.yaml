rule: OCTX-001
bases:
- minimal
description: the AO is contractor personnel (DoDI 8510.01 2.7.m(1))
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.2.affiliation
  value: contractor
expect:
  errors:
  - OCTX-001
  also:
  - OCTX-013
  messages:
  - 'RA-03: the AO must be a U.S. citizen and a DoD official, not us contractor'
  - 'RA-03: the authorizing official is an inherent U.S. Government function and is assigned to government personnel only, not contractor'
