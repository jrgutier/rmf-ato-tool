rule: PRIV-012
bases:
- pii
description: the SAOP approves the privacy plan after the first authorization decision
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: privacy_plan.approvals.0.date
  value: '2026-11-21'
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: approvals.0.date
  value: '2026-11-22'
expect:
  errors:
  - PRIV-012
  messages:
  - the senior agency official for privacy approved the privacy plan on 2026-11-21, after the authorization decision of 2026-11-20
