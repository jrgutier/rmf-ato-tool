rule: CATO-005
bases:
- minimal
description: application tolerances set by the application team
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: tolerances.1.set_by
  value: application-team
expect:
  errors:
  - CATO-005
  messages:
  - 'TOL-02: the DSOP team establishes the risk tolerances required for applications traversing the pipeline, not application-team'
