rule: CATO-008
bases:
- minimal
description: an insider threat threshold that is an external trigger
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: people.insider_threat.thresholds
  value:
  - TRG-01
expect:
  errors:
  - CATO-008
  messages:
  - "TRG-01: the insider threat working group's threshold for analysis is no insider threat trigger of the strategy"
