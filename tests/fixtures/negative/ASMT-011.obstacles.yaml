rule: ASMT-011
bases:
- minimal
description: Delayed with no obstacles
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: items.0.status
  value: delayed
- op: set_field
  file: artifacts/poam/items.yaml
  path: items.0.comments
  value: The review slipped.
expect:
  errors:
  - ASMT-011
  messages:
  - POAM-001 is Delayed and identifies no obstacles or challenges
