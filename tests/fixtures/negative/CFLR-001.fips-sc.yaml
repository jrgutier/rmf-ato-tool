rule: CFLR-001
bases:
- minimal
description: pl-8 is tailored out of a networked system although it carries CF-FIPS-SC, a duty FIPS 
  200 places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: pl-8\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-001
  messages:
  - 'CF-FIPS-SC: FIPS 200 requires that communications are monitored, controlled and protected at the
    external and key internal boundaries, under architectural designs, development techniques and engineering
    principles that promote security, and pl-8 is tailored out of the baseline'
