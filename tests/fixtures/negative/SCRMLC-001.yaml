rule: SCRMLC-001
bases:
- minimal
description: the market analysis step of procurement takes no C-SCRM considerations
mutations:
- {op: set_field, file: artifacts/data/scrm-acquisition.yaml, path: procurement_steps.2.step, value: plan-procurement}
expect:
  errors:
  - SCRMLC-001
  messages:
  - 'C-SCRM considerations are not incorporated into the market-analysis step of the procurement and contract management life cycle'
