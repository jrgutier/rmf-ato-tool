rule: CFLR-001
bases:
- minimal
description: at-2 is tailored out of a networked system although it carries CF-FIPS-AT, a duty FIPS 
  200 places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: at-2\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-001
  also:
  - CFLR-002
  - DPOL-001
  - DPOL-002
  messages:
  - 'CF-FIPS-AT: FIPS 200 requires that managers and users are made aware of the security risks of their
    activities and of the applicable policies, and personnel are trained for their security duties, and
    at-2 is tailored out of the baseline'
