rule: CONN-004
bases:
- minimal
description: a DODIN waiver that rests on a review by DISA, not the DoD CIO
mutations:
- op: set_field
  file: artifacts/data/boundary.yaml
  path: dodin
  value:
    position: outside
    waiver:
      reviewed_by: DISA
      reviewed: '2026-03-01'
      granted: '2026-03-20'
      reference: DODIN waiver 26-07
    sources:
    - INT-025.A1
expect:
  errors:
  - CONN-004
  messages:
  - the DODIN waiver names no DoD CIO as having reviewed the system's cybersecurity posture
  also:
  - RUN-FM-001
