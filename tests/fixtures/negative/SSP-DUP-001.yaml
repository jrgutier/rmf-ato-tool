rule: SSP-DUP-001
bases: [minimal, example]
description: a second family chunk restates the ac-2 statement
mutations:
- only: [minimal]
  op: write_file
  file: artifacts/ssp/controls/ac.2.yaml
  content: |
    family: ac
    chunk: 2
    controls:
      - control_id: ac-2
        status: implemented
        statement: Accounts are provisioned through the enterprise identity provider.
        responsible_roles: [PER-ISSO]
        components: [CMP-RELAY]
        sources: [product/security.md#accounts]
- only: [example]
  op: write_file
  file: artifacts/ssp/controls/ac.3.yaml
  content: |
    family: ac
    chunk: 3
    controls:
      - control_id: ac-2
        status: implemented
        statement: Accounts are provisioned through the enterprise directory.
        responsible_roles: [PER-ISSO]
        components: [CMP-WS-OS]
        sources: [INT-038.A1]
expect: {errors: [SSP-DUP-001]}
