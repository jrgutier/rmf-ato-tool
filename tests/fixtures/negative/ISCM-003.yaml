rule: ISCM-003
bases:
- minimal
description: a frequency criterion established by the ISSM
mutations:
- op: set_field
  file: artifacts/data/conmon.yaml
  path: frequency_criteria.0.established_by
  value: PER-ISSM
expect:
  errors:
  - ISCM-003
  messages:
  - frequency criteria are established by PER-PM, the system owner, or PER-CCP
