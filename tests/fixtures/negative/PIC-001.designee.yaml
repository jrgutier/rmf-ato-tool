rule: PIC-001
description: the coordination before implementing cm-6 is with the ISSM, who is neither the SAOP nor a designee of the SAOP
bases:
- minimal
mutations:
- op: set_field
  file: artifacts/data/tailoring.yaml
  path: privacy_implementation.0.by
  value: PER-ISSM
expect:
  errors:
  - PIC-001
  messages:
  - "cm-6: the privacy implementation coordination is with PER-ISSM, not the SAOP or designee (PER-PRIV)"
