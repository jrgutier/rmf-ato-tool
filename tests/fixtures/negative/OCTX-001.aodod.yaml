rule: OCTX-001
bases:
- minimal
description: the AO is from another government agency
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.2.affiliation
  value: other-government
expect:
  errors:
  - OCTX-001
  also:
  - OCTX-013
  messages:
  - 'RA-03: the AO must be a U.S. citizen and a DoD official, not us other-government'
