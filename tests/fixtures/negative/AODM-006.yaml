rule: AODM-006
bases: [minimal]
description: a live test event after the IATT expired
mutations:
  - op: set_field
    file: artifacts/data/sap.yaml
    path: schedule.events.0.live
    value: true
  - op: set_field
    file: artifacts/data/authorizations.yaml
    path: records.0.authorization_termination_date
    value: '2026-11-01'
expect:
  errors: [AODM-006]
  messages:
    - falls under no IATT or authorization in force
