rule: METR-002
bases: [minimal]
description: a metric read from a control outside the baseline
mutations:
- op: set_field
  file: artifacts/data/conmon.yaml
  path: metrics.0.controls
  value: [sr-11]
expect:
  errors: [METR-002]
  messages: ['metric MET-01 reads sr-11, which is not in the baseline, so it is not calculated from the security architecture''s controls']
