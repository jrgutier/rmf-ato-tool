rule: CATO-005
bases:
- minimal
description: a control gate on no risk tolerance
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: platform.control_gates.0.tolerance
  value: TOL-99
expect:
  errors:
  - CATO-005
  messages:
  - 'CG-01: agreed-to risk tolerances are implemented in the pipeline control gates, and TOL-99 is no tolerance'
