rule: ACQLC-002
bases:
- minimal
description: the Development RFP release decision point is passed with no CDD validation
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.decision_points
  value:
  - id: MS-MDD
    date: '2025-10-01'
  - id: MS-A
    date: '2026-03-15'
  - id: MS-DRFPRD
    date: '2026-06-01'
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.submissions
  value:
  - decision_point: MS-A
    date: '2026-03-10'
  - decision_point: MS-DRFPRD
    date: '2026-05-20'
expect:
  errors:
  - ACQLC-002
  messages:
  - validation does not precede the Development RFP release decision point
