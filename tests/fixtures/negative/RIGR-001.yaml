rule: RIGR-001
bases:
- minimal
description: the rigor rests on the risk assessment, not the categorization
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: rigor.categorization
  value: ART-RA
expect:
  errors:
  - RIGR-001
  messages:
  - the rigor and scope of the assessment rest on the security categorization ART-CAT, not ART-RA
