rule: ASMT-010
bases:
- minimal
description: a change that keeps the original date
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: items.0.milestone_changes
  value:
  - milestone: Run and record the first account review
    new_date: '2027-01-29'
    reason: Staff moved.
expect:
  errors:
  - ASMT-010
  messages:
  - equals its original date
