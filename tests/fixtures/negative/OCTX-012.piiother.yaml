rule: OCTX-012
bases:
- pii
description: the allocation of resources protecting PII is coordinated with the CISO, not the SAOP
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: resources.allocation.coordinated_with
  value: [PER-CISO]
expect:
  errors:
  - OCTX-012
  messages:
  - the system processes PII and the allocation of resources protecting it is not coordinated with
    the senior agency official for privacy
