rule: PMSCRM-001
bases:
- minimal
description: SCRM practices begun after the first contract award
mutations:
- op: set_field
  file: artifacts/data/pm-scrm.yaml
  path: started
  value: '2026-06-01'
- op: set_field
  file: artifacts/data/protection.yaml
  path: contract_awards
  value:
  - id: K-001
    date: '2026-05-01'
    no_update_reason: Award for spares only.
expect:
  errors:
  - PMSCRM-001
  messages:
  - supply chain risk management practices begin before the acquisition; the first contract award (2026-05-01)
    precedes them
  also:
  - CSSTRAT-002
