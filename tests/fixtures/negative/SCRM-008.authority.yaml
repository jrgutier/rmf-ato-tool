rule: SCRM-008
bases:
- minimal
description: an excluded source without the legal authority exercised
mutations:
- op: set_field
  file: artifacts/data/scrm-acquisition.yaml
  path: selection.4.selected
  value: false
- op: set_field
  file: artifacts/data/scrm-acquisition.yaml
  path: selection.4.exclusion
  value:
    approved_by:
    - contracting-officer
    - counsel
expect:
  errors:
  - SCRM-008
  messages:
  - SUP-05 is excluded on SCRM grounds without the legal authority exercised
