rule: SCRM-013
bases:
- minimal
description: a decision below the reach of the impact
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: response.0.reach
  value: mission
expect:
  errors:
  - SCRM-013
  messages:
  - the response to SA-01 is decided at system level for an impact that reaches the mission
