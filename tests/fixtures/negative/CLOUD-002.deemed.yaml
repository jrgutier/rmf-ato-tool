rule: CLOUD-002
bases:
- cloud
description: CUI the information owner deems above IL4, at IL4
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: mission_impact_level
  value:
    level: IL4
    data:
    - cui-above-il4
    disclosure_effect: serious
    determined_by: PER-AO
    date: '2026-03-01'
    sources:
    - INT-005.A1
expect:
  errors:
  - CLOUD-002
  messages:
  - CUI the information owner deems to need more protection than Impact Level 4 is hosted at Impact 
    Level 5, not IL4
