rule: OCTX-012
bases:
- minimal
description: staff made available to no one in a role
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: resources.staffing.made_available_to
  value:
  - PER-DEV
expect:
  errors:
  - OCTX-012
  messages:
  - the staffing for the risk management tasks is made available to PER-DEV, who holds no role in 
    roles
