rule: CLOUD-005
bases:
- cloud
description: the CSSP holds no malware notification
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: cssp.duties
  value:
  - correlate-threat-data
  - aggregate-csp-information
  - dodin-status
  - incident-handling-support
  - community-awareness
  - risk-decision-support
  - anti-malware-vendor-contact
  - detection-processes
  - cpcon-compliance-monitoring
  - incident-analysis
  - adequacy-determination
expect:
  errors:
  - CLOUD-005
  messages:
  - the CSSP does not hold malware-notification for the CSO
