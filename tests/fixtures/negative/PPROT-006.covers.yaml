rule: PPROT-006
bases:
- minimal
description: an NSS assessment that leaves out the requirements
mutations:
- op: set_field
  file: artifacts/data/nss-assessments.yaml
  path: assessments.0.covers
  value:
  - security-architecture
expect:
  errors:
  - PPROT-006
  messages:
  - the assessment before MS-A does not cover the cybersecurity-requirements
