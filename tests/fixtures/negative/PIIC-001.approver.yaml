rule: PIIC-001
bases:
- minimal
description: the PII determination approved by the ISSM, neither the SAOP nor a designee
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.approved.privacy.by
  value: PER-ISSM
expect:
  errors:
  - PIIC-001
  messages:
  - the PII determination is approved by PER-ISSM, not the SAOP or designee
