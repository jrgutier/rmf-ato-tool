rule: SSE-002
bases:
- minimal
description: a system with PII and no privacy engineering practice
mutations:
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: information_types.0.privacy
  value: true
- op: set_field
  file: artifacts/data/requirements.yaml
  path: engineering.practices.4.area
  value: cybersecurity
expect:
  errors:
  - SSE-002
  also:
  - AODM-010
  messages:
  - the system processes PII and employs no privacy engineering practice
