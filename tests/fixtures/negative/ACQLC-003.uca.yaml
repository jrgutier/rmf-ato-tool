rule: ACQLC-003
bases:
- minimal
description: an urgent capability is deployed and the run says it is still in production and deployment
mutations:
- op: set_field
  file: facts.yaml
  path: acquisition.pathway
  value: PW-UCA
- op: set_field
  file: facts.yaml
  path: lifecycle_phase.value
  value: PH-PD
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.tailoring.pathway
  value: PW-UCA
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.decision_points
  value:
  - id: DP-UCA-DEPLOYMENT
    date: '2026-10-15'
- op: set_field
  file: artifacts/data/protection-requirements.yaml
  path: capability_document.kind
  value: juon
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: document.pathway
  value: PW-UCA
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: approvals.0.decision_point
  value: DP-UCA-PRODUCTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.0.decision_point
  value: DP-UCA-PRODUCTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.1.decision_point
  value: DP-UCA-PRODUCTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.2.decision_point
  value: DP-UCA-PRODUCTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.3.decision_point
  value: DP-UCA-PRODUCTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.4.decision_point
  value: DP-UCA-PRODUCTION
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.pss
  value:
    approved_by: PER-MDA
    date: '2026-05-01'
expect:
  errors:
  - ACQLC-003
  messages:
  - upon DP-UCA-DEPLOYMENT the capability enters O&S
