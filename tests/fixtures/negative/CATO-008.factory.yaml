rule: CATO-008
bases:
- minimal
description: a factory group without the platform team
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: people.risk_governance_group.members
  value:
  - application-development-team
  - ao-risk-assessment-team
  - dsop-security-team
  - mission-owner
expect:
  errors:
  - CATO-008
  messages:
  - with production in the factory the group managing the risk includes the platform-team
