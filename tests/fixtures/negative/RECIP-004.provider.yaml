rule: RECIP-004
bases:
- minimal
description: the system own organization named as the provider
mutations:
- op: set_field
  file: artifacts/data/system-description.yaml
  path: origin
  value:
    kind: separate-instance
    organization: Example Program Office
    authorization:
      ao: Fleet Systems Command AO
      decision: AD-ATO
      date: '2025-06-01'
    relinquished: []
    operating: null
    reuse:
    - document: ART-SSP
      reused: true
    - document: ART-SAR
      reused: true
    - document: ART-RAR
      reused: true
    - document: ART-POAM
      reused: true
    - document: ART-AODM
      reused: true
    sources:
    - INT-003.A1
expect:
  errors:
  - RECIP-004
  messages:
  - the providing organization Example Program Office is this system's own organization, so no receiving
    organization took over ownership of the separate-instance
