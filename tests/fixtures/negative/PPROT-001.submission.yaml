rule: PPROT-001
bases:
- minimal
description: the PPP submitted after the milestone it supports
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.submissions.0.date
  value: '2026-04-01'
expect:
  errors:
  - PPROT-001
  messages:
  - the PPP is submitted for approval at each acquisition pathway decision point, and no submission 
    precedes MS-A
