rule: VULN-006
bases:
- minimal
description: a not publicly known vulnerability submitted before it was discovered
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: vulnerabilities.0.vep_submission.date
  value: '2026-12-02'
expect:
  errors:
  - VULN-006
  messages:
  - a vulnerability that is not publicly known is not submitted to USCYBERCOM for the VEP
