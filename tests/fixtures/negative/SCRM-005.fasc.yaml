rule: SCRM-005
bases:
- minimal
description: a substantial risk not shared with the FASC as mandatory
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.severity.level
  value: 3
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.escalation
  value:
    officials:
    - PER-ISSM
    - PER-AO
    legal_counsel: true
    fasc: mandatory
    considered:
    - law-enforcement
    - counter-intelligence
    - legal
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.review.senior_leadership
  value: true
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.review.legal_counsel
  value: true
- op: set_field
  file: artifacts/data/scrm.yaml
  path: assessments.0.escalation.fasc
  value: voluntary
expect:
  errors:
  - SCRM-005
  messages:
  - SA-01 has a substantial risk at SCRSS level 3, yet it is not shared with the FASC through the 
    Information Sharing Agency as mandatory
