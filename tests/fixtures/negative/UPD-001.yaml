rule: UPD-001
bases:
- minimal
description: C-3 approved the categorization and its update of the registration information carries something else
mutations:
- op: set_field
  file: artifacts/data/registration.yaml
  path: updates.1.content
  value: characterization
expect:
  errors:
  - UPD-001
  messages:
  - C-3 completed the categorization of the system, but the registration information is not updated with it (no categorization update by C-3)
