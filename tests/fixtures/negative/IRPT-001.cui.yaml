rule: IRPT-001
bases:
- minimal
description: CUI disclosure reported under the wrong issuance
mutations:
- op: set_field
  file: artifacts/data/incident-response.yaml
  path: reporting_paths.2.reference
  value: DoDM 5200.01 Volume 3
expect:
  errors:
  - IRPT-001
  messages:
  - an unauthorized disclosure of CUI is reported under DoDM 5200.01 Volume 4
