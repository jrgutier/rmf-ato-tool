rule: PRIV-006
bases:
- pii
description: guidance on privacy monitoring from the ISSM
mutations:
- op: set_field
  file: artifacts/data/conmon.yaml
  path: privacy.guidance_by
  value: PER-ISSM
expect:
  errors:
  - PRIV-006
  messages:
  - the senior agency official for privacy gives guidance on the ongoing monitoring of privacy controls,
    not PER-ISSM
