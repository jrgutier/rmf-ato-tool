rule: BIA-003
bases:
- minimal
description: mission critical functions present and no defensive component named critical
mutations:
- {op: set_field, file: artifacts/data/bia.yaml, path: mission_critical, value: true}
- op: set_field
  file: artifacts/data/bia.yaml
  path: functions
  value: [{id: MCF-01, function: Relay urgent field reports, processes: [BP-01], sources: [INT-019.A1]}]
- {op: set_field, file: artifacts/data/bia.yaml, path: criticality.critical_items.1.role, value: infrastructure}
expect:
  errors:
  - BIA-003
  messages:
  - 'the criticality analysis names no component delivering a defensive, commonly shared process (access control, identity management, crypto) as critical'
