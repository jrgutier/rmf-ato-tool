rule: SCRM-002
bases:
- minimal
description: no cyber T&E
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: criticality.tsn
  value:
  - criticality-analysis
  - all-source-threat-assessment
  - software-assurance
  - hardware-assurance
  - procurement-strategies
  - anti-counterfeit
  - scrm-countermeasures
expect:
  errors:
  - SCRM-002
  messages:
  - the system has mission-critical functions but applies no TSN practice cyber-test-and-evaluation
