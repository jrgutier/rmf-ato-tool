rule: AODM-009
bases: [minimal]
description: a decision that does not reach the system owner
mutations:
  - op: set_field
    file: artifacts/data/authorizations.yaml
    path: records.1.conveyed_to
    value: [PER-ISSM]
expect:
  errors: [AODM-009]
  messages:
    - the decision is not conveyed to
