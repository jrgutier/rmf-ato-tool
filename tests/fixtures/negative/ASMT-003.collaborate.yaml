rule: ASMT-003
bases:
- minimal
description: no authorizing official in the collaboration
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: reused_results.0.coordinated_with
  value:
  - PER-PM
  - PER-ISSM
expect:
  errors:
  - ASMT-003
  messages:
  - system owners or common control providers collaborate with authorizing officials on the acceptability of previous assessment
    results
