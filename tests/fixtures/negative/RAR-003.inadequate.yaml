rule: RAR-003
bases:
- minimal
description: a lone course of action found inadequate
mutations:
- op: set_field
  file: artifacts/data/rar.yaml
  path: risks.0.courses_of_action
  value:
  - id: COA-01
    response: mitigate
    description: Fix it.
    effectiveness: High.
    feasibility: Easy.
    cost: Low.
    mission_impact: None.
    privacy_impact: None.
    selected: true
    rationale: Only option considered.
    adequacy: inadequate
expect:
  errors:
  - RAR-003
  messages:
  - has a single course of action found inadequate
