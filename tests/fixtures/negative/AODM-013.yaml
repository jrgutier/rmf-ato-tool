rule: AODM-013
bases: [minimal]
description: a denial while the IATT stands, halting nothing and revising no POA&M
mutations:
  - {op: set_field, file: artifacts/data/authorizations.yaml, path: records.1.decision, value: AD-DATO}
  - {op: delete_field, file: artifacts/data/authorizations.yaml, path: records.1.authorization_termination_date}
expect:
  errors: [AODM-013]
  also: [SSPR-001]
  messages:
    - "in force on 2026-11-20: AUTH-001; if the subject is in operation, all activity is halted, so list it in halts"
    - records poam_revision
