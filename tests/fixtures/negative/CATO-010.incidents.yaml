rule: CATO-010
bases:
- minimal
description: incidents reviewed by the CSSP alone
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: process.feedback.incident_reviews_with
  value: cssp
expect:
  errors:
  - CATO-010
  messages:
  - application cybersecurity incidents are reviewed in collaboration with the DevSecOps team, not cssp
