rule: INFL-001
bases: [minimal]
description: the sensor reports' life cycle stops at dissemination, with no disposition stage
mutations:
  - op: set_field
    file: artifacts/data/infotypes.yaml
    path: information_types.0.life_cycle
    value:
      - {stage: collection, description: Field units sign and send their sensor reports to the relay.}
      - {stage: dissemination, description: The relay forwards each report to the analysis enclave.}
expect:
  errors: [INFL-001]
  messages:
    - "INF-01: the information life cycle identifies no disposition stage"
