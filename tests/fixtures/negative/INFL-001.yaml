rule: INFL-001
bases: [minimal]
description: the relay configuration is stored, and its life cycle names no disposition stage
mutations:
  - op: set_field
    file: artifacts/data/infotypes.yaml
    path: information_types.1.life_cycle
    value:
      - {stage: creation, description: Administrators create the configuration and accounts on the appliance.}
      - {stage: storage, description: The appliance stores its configuration and account data.}
expect:
  errors: [INFL-001]
  messages:
    - "INF-02: the information life cycle stores the information and identifies no disposition stage"
