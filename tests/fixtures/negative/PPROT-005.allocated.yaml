rule: PPROT-005
bases:
- minimal
description: security requirements not allocated to the architecture and design
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: design_assessment.requirements_allocated
  value: false
expect:
  errors:
  - PPROT-005
  messages:
  - cybersecurity and related system security requirements are allocated to the system architecture 
    and design
