rule: IRPT-001
bases:
- minimal
description: incident reporting that ignores CNSSI 1010
mutations:
- op: set_field
  file: artifacts/data/incident-response.yaml
  path: reporting_paths.5.reference
  value: CJCSM 6510.01
expect:
  errors:
  - IRPT-001
  messages:
  - cyber incident response and reporting complies with CNSSI 1010
