rule: RCP-007
bases:
- minimal
description: a request beyond the package endorsed by the ISSM
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.1.body_of_evidence.requests.0.endorsed_by
  value: PER-ISSM
expect:
  errors:
  - RCP-007
  messages:
  - 'RS-02: the request for Penetration test report beyond the package is not endorsed by the requesting Component CISO before it is forwarded'
