rule: CATO-002
bases:
- minimal
description: issues investigated by the CSSP alone
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: strategy.issue_investigation
  value:
  - PER-CSSP
expect:
  errors:
  - CATO-002
  messages:
  - an issue or anomaly is investigated and mitigated by the CSSP along with the SCA; PER-SCA is missing
