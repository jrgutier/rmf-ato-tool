rule: CATO-001
bases:
- minimal
description: an assessment that does not judge implementation-level
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: assessment.criteria
  value:
  - criterion: defined-documented
    result: met
  - criterion: evidence-of-use
    result: met
  - criterion: workforce-knowledge
    result: met
expect:
  errors:
  - CATO-001
  messages:
  - the assessment does not judge the high level criterion implementation-level
