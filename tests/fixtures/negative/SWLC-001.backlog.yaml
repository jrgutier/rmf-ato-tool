rule: SWLC-001
bases:
- minimal
description: backlogs that do not capture threats
mutations:
- op: set_field
  file: facts.yaml
  path: acquisition.pathway
  value: PW-SWP
- op: set_field
  file: artifacts/data/conmon.yaml
  path: lifecycle_approach.backlog_captures
  value:
  - issues
  - errors
  - defects
  - supplier-updates
expect:
  errors:
  - SWLC-001
  also:
  - PPROT-001
  - PPROT-002
  - TSTRAT-001
  - TSTRAT-002
  - CSSTRAT-001
  - CSSTRAT-003
  messages:
  - the program backlogs do not capture threats found in development and operations
