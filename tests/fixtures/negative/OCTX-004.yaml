rule: OCTX-004
bases:
- minimal
description: the CIO leads the risk executive (function)
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: governance.risk_executive.led_by
  value: PER-CIO
expect:
  errors:
  - OCTX-004
  messages:
  - the risk executive (function) is led by PER-CIO, not the senior accountable official for risk 
    management or the official or group it delegated the function to
