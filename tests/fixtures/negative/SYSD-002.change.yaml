rule: SYSD-002
bases:
- minimal
description: a CSSP change on a GENSER system reported to DIA only
mutations:
- op: set_field
  file: artifacts/data/system-description.yaml
  path: service_alignment.changes
  value:
  - date: '2026-07-01'
    from: Old CSSP
    to: Component CSSP
    reported_to:
    - DIA
expect:
  errors:
  - SYSD-002
  messages:
  - on a GENSER system is reported to CDRUSSTRATCOM and the Director, DISA
