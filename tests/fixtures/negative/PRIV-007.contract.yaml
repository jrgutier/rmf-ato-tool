rule: PRIV-007
bases:
- pii
description: a contractor-operated system of records whose requirements leave out the Privacy Act contract
  provisions
mutations:
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: privacy.sorn.contractor_operated
  value: true
expect:
  errors:
  - PRIV-007
  messages:
  - the system keeps a system of records, and ART-REQ does not address the Privacy Act rule contract-provisions
