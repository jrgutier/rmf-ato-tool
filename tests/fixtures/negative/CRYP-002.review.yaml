rule: CRYP-002
bases:
- minimal
description: a space cryptography NSA did not review
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: space_nss
  value: true
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.uses.0.nsa_approval.by
  value: PER-AO
expect:
  errors:
  - CRYP-002
  messages:
  - NSA reviews and approves all cryptographies on a space NSS
