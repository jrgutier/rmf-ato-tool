rule: AODM-004
bases: [minimal]
description: a threat assessment issued more than 12 months before the ATO
mutations:
  - op: set_field
    file: artifacts/data/authorizations.yaml
    path: records.1.threat_assessment.issued
    value: '2025-11-19'
expect:
  errors: [AODM-004]
  messages:
    - was not issued within the 12 months
