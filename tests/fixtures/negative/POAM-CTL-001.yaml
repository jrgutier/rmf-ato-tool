rule: POAM-CTL-001
bases: [minimal]  # example: mutation targets valid_minimal text (Phase 7 handoff)
description: a POA&M item names a control outside the baseline (ac-3)
mutations:
  - op: set_field
    file: artifacts/poam/items.yaml
    path: items.0.control_id
    value: ac-3
expect: {errors: [POAM-CTL-001]}
