rule: RCP-006
bases:
- minimal
description: no technical POC of the receiving side
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: agreements.0.pocs.technical
  value:
  - party: granting
    poc: PER-ISSO
expect:
  errors:
  - RCP-006
  messages:
  - 'AGR-01: the agreement identifies no technical POC of the receiving organization'
