rule: ACQLC-003
bases:
- minimal
description: the first system is fielded and the run says it is still in EMD
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.decision_points
  value:
  - id: MS-MDD
    date: '2025-10-01'
  - id: MS-A
    date: '2026-03-15'
  - id: MS-FIELD
    date: '2026-09-01'
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.pss
  value:
    approved_by: PER-MDA
    date: '2026-05-01'
expect:
  errors:
  - ACQLC-003
  messages:
  - upon MS-FIELD the capability enters O&S
