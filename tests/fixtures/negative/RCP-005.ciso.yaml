rule: RCP-005
bases:
- minimal
description: an Enterprise program coordinated by the ISSM
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.0.coordination_point
  value: PER-ISSM
expect:
  errors:
  - RCP-005
  messages:
  - 'RS-01: the Component CISO is not the single cybersecurity coordination point for the DoD-wide program deploying the system'
