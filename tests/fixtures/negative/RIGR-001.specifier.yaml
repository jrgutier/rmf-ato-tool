rule: RIGR-001
bases:
- minimal
description: an assurance requirement specified by an assessor
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: rigor.assurance_requirements.0.specified_by
  value: PER-SCA
expect:
  errors:
  - RIGR-001
  messages:
  - is specified by the organization through a persona outside the assessment team, not PER-SCA
