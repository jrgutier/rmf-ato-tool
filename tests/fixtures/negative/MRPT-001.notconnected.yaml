rule: MRPT-001
bases:
- minimal
description: a system calling itself apart from the DODIN with an interconnection
mutations:
- op: set_field
  file: artifacts/data/conmon.yaml
  path: reporting.dodin.designation
  value: not-connected
- op: replace_text
  file: artifacts/data/boundary.yaml
  old: 'components:

    '
  new: "components:\n  - {id: CMP-LINK, title: Analysis enclave link, type: interconnection, description:\
    \ Link to the analysis enclave., status: operational, sources: [product/architecture.md#components]}\n"
expect:
  errors:
  - MRPT-001
  also:
  - MCON-001
  - SRA-002
  messages:
  - but its boundary holds
