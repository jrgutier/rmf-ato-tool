rule: DPOL-001
bases:
- minimal
description: pe-1 is tailored out of a networked system although it carries PC-DOD-3, a duty DoDI 8500.01
  places on every DoD IS
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: pe-1\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:\
    \ false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n\
    \    sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - DPOL-001
  also:
  - CFLR-001
  messages:
  - 'PC-DOD-3: DoDI 8500.01 requires that a physical security program protects DoD IT from damage, loss,
    theft, or unauthorized physical access, and pe-1 is tailored out of the baseline'
