rule: SCRM-006
bases:
- minimal
description: likelihood determination without external-exposure
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: threat_analysis.likelihood_inputs
  value:
  - threat-assumptions
  - threat-information
  - peer-history
  - expert-perspective
expect:
  errors:
  - SCRM-006
  messages:
  - the likelihood determination does not consider external-exposure
