rule: CATO-007
bases:
- minimal
description: vulnerabilities tracked on production assets only
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: monitoring.vulnerability_tracking
  value: production-only
expect:
  errors:
  - CATO-007
  messages:
  - the strategy plans to assess and track vulnerabilities on all the system assets, not production-only
