rule: CATO-003
description: the cATO inherits a DSOP practice that is not continuous monitoring
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: platform.authorization.inherited
  value: [vulnerability-scanning]
expect:
  errors:
  - CATO-003
  messages:
  - the cATO does not inherit the DSOP's applicable continuous monitoring practices
