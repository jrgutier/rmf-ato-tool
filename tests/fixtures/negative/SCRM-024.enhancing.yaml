rule: SCRM-024
bases:
- minimal
description: an enhancing practice under way before a sustaining one
mutations:
- op: set_field
  file: artifacts/data/scrm-org.yaml
  path: maturity.practices.1.status
  value: not-started
- op: set_field
  file: artifacts/data/scrm-org.yaml
  path: maturity.practices.2.status
  value: in-progress
expect:
  errors:
  - SCRM-024
  messages:
  - 'a practice is under way before the tier below it is started: enhancing practice Automated C-SCRM
    processes while sustaining practice Formal supplier monitoring intervals is not started'
