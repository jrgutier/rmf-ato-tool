rule: CRYP-002
bases:
- minimal
description: an SKMP the AO approved instead of NSA
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.space_segments
  value:
  - ground
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: space_nss
  value: true
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.space.skmp.approved_by
  value: PER-AO
expect:
  errors:
  - CRYP-002
  messages:
  - the system key management plan or cryptographic security plan FDR SKMP is approved by NSA
