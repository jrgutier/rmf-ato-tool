rule: PPROT-006
bases:
- minimal
description: a space NSS architecture first coordinated after inception
mutations:
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: space_nss
  value: true
- op: set_field
  file: artifacts/data/nss-assessments.yaml
  path: architecture_coordination
  value:
  - date: '2026-04-01'
    with:
    - NSA
    - PER-AO
- op: set_field
  file: artifacts/data/nss-assessments.yaml
  path: compliance_reports
  value:
  - date: '2026-03-20'
    to:
    - NSA
    - PER-AO
expect:
  errors:
  - PPROT-006
  messages:
  - the space NSS security architecture is coordinated with the cognizant AO and NSA from program 
    inception
