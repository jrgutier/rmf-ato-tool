rule: MSN-001
bases:
- minimal
description: the missions identified by the program manager, not the mission or business owner
mutations:
- op: set_field
  file: facts.yaml
  path: missions.identified_by
  value: PER-PM
expect:
  errors:
  - MSN-001
  messages:
  - the mission or business owner identifies the missions the system supports, not PER-PM
