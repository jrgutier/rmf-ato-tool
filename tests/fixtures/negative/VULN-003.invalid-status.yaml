rule: VULN-003
bases:
- minimal
description: a report found not valid, reported within VRMN as still open
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: vdp_reports.0.validation.result
  value: not-valid
- op: set_field
  file: artifacts/poam/items.yaml
  path: vdp_reports.0.vrmn_reports
  value:
  - date: '2026-12-04'
    status: open
expect:
  errors:
  - VULN-003
  messages:
  - the report found not valid is not reported within VRMN as not-valid
