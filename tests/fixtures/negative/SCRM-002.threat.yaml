rule: SCRM-002
bases:
- minimal
description: no all-source threat assessment
mutations:
- op: set_field
  file: artifacts/data/scrm.yaml
  path: criticality.tsn
  value:
  - criticality-analysis
  - software-assurance
  - hardware-assurance
  - procurement-strategies
  - anti-counterfeit
  - scrm-countermeasures
  - cyber-test-and-evaluation
expect:
  errors:
  - SCRM-002
  messages:
  - the system has mission-critical functions but applies no TSN practice 
    all-source-threat-assessment
