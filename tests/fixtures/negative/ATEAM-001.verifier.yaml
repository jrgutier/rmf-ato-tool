rule: ATEAM-001
bases:
- minimal
description: qualification verified by someone other than the CISO
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: team.0.qualification.verified_by
  value: PER-PM
expect:
  errors:
  - ATEAM-001
  messages:
  - the CISO establishes the team of qualified assessors; PER-SCA was verified by PER-PM
