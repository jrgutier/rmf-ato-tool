rule: PASM-001
bases:
- pii
description: privacy assessment methodologies and metrics identified by the ISSM, not the senior agency official for privacy
mutations:
- {op: set_field, file: artifacts/data/sap.yaml, path: privacy.methodology.identified_by, value: PER-ISSM}
expect:
  errors:
  - PASM-001
  messages:
  - 'the privacy assessment methodologies and metrics are identified by PER-ISSM, not the senior agency official for privacy'
