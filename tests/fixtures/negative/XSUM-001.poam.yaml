rule: XSUM-001
bases: [minimal]
description: an executive summary issue resting on a POA&M item the package does not hold
mutations:
  - op: set_field
    file: artifacts/data/package-summary.yaml
    path: issues.0.poam_items
    value: [POAM-999]
expect:
  errors: [XSUM-001]
  messages:
    - which the package's POA&M does not hold
