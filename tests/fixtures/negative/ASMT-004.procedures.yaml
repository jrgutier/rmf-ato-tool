rule: ASMT-004
bases:
- minimal
description: the provider procedures reviewed by no assessor
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: external_providers.0.provider_assessment.procedures_reviewed_by
  value: PER-PM
expect:
  errors:
  - ASMT-004
  messages:
  - the assessment procedures it employed are reviewed by assessors, not PER-PM
