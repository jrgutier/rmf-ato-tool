rule: DASH-001
bases: [minimal]
description: only the ISSM can reach the dashboard
mutations:
  - op: set_field
    file: artifacts/data/cato.yaml
    path: dashboard.access
    value: [PER-ISSM]
expect:
  errors: [DASH-001]
  messages:
    - "the AO and designated cybersecurity personnel have real-time access to the dashboard, and its access names PER-ISSM"
