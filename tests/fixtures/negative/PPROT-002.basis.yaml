rule: PPROT-002
bases:
- minimal
description: AT for technology outside U.S. control from guidance never read
mutations:
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.anti_tamper
  value:
    outside_us_control: true
    required: true
    guidance:
    - HPG-9999
    coordinated_with: Army AT OPR
expect:
  errors:
  - PPROT-002
  messages:
  - AT and exportability requirements for technology outside U.S. control are determined by applying
    DoD horizontal protection guidance the run read
