rule: SRA-002
bases: [minimal]
description: an external service whose risk is not acceptable, with no response
mutations:
- {op: set_field, file: artifacts/data/ra.yaml, path: external.providers.0.risk_acceptable, value: false}
expect:
  errors: [SRA-002]
  messages: ['EXP-01: the risk arising from use of the external services is not acceptable and no response is recorded']
