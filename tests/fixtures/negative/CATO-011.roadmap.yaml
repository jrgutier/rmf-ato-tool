rule: CATO-011
bases:
- minimal
description: an unimplemented activity with no roadmap item
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: activities_mapping.activities.1.roadmap
  value: NONE
expect:
  errors:
  - CATO-011
  messages:
  - 'Container image signing: an activity not implemented has no item on the activities and tools roadmap'
