rule: ACQLC-001
bases:
- minimal
description: a program combining the major capability and software pathways defines no transition point
mutations:
- op: set_field
  file: facts.yaml
  path: acquisition.pathways
  value:
  - PW-MCA
  - PW-SWP
expect:
  errors:
  - ACQLC-001
  messages:
  - no transition point is defined from another pathway to PW-SWP
