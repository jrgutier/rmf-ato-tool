rule: IRPT-001
bases:
- minimal
description: a compromise of classified information reported under the wrong issuance
mutations:
- op: set_field
  file: artifacts/data/incident-response.yaml
  path: reporting_paths.0.reference
  value: DoDM 5200.01 Volume 1
expect:
  errors:
  - IRPT-001
  messages:
  - an actual or potential compromise of classified information is reported under DoDM 5200.01 Volume
    3
