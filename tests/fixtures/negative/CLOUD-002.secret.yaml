rule: CLOUD-002
bases:
- cloud
description: SECRET data at IL5
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: mission_impact_level
  value:
    level: IL5
    data:
    - classified-secret
    disclosure_effect: serious
    determined_by: PER-AO
    date: '2026-03-01'
    sources:
    - INT-005.A1
- op: set_field
  file: artifacts/data/cloud.yaml
  path: offerings.0.authorization.impact_level
  value: IL5
expect:
  errors:
  - CLOUD-002
  messages:
  - classified National Security Information is hosted at Impact Level 6, not IL5
