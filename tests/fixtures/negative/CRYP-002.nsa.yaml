rule: CRYP-002
bases:
- minimal
description: a space NSS without NSA-approved cryptography
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.space_segments
  value:
  - ground
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: space_nss
  value: true
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.nsa_approved
  value: false
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.key_management_process
  value: Enterprise PKI.
expect:
  errors:
  - CRYP-002
  messages:
  - a space NSS uses NSA-approved cryptography
