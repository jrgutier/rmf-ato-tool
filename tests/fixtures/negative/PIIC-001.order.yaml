rule: PIIC-001
bases:
- pii
description: the SAOP approves the categorization of a PII system after the AO reviewed it
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.approved.privacy.date
  value: '2026-10-30'
expect:
  errors:
  - PIIC-001
  messages:
  - the SAOP approved the categorization of a system processing PII on 2026-10-30, after the authorizing official's review of 2026-10-29
