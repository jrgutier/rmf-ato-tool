rule: CATO-004
bases:
- minimal
description: vulnerabilities documented at the next review
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: monitoring.vulnerability_management.documented_on
  value: quarterly-review
expect:
  errors:
  - CATO-004
  messages:
  - critical and moderate vulnerabilities are documented upon discovery, not quarterly-review
