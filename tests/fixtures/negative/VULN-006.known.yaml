rule: VULN-006
bases:
- minimal
description: a not publicly known vulnerability called not new, with no submission
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: vulnerabilities.0.newly_discovered
  value: false
- op: delete_field
  file: artifacts/poam/items.yaml
  path: vulnerabilities.0.vep_submission
expect:
  errors:
  - VULN-006
  messages:
  - a vulnerability that is not publicly known is not submitted to USCYBERCOM for the VEP
