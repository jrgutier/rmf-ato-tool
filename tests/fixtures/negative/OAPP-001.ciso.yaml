rule: OAPP-001
bases:
- minimal
description: the AO designates the CISO
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: roles.1.appointed_by
  value: PER-AO
expect:
  errors:
  - OAPP-001
  messages:
  - 'RA-02: the senior agency information security officer is designated by PER-AO, not the chief information
    officer'
