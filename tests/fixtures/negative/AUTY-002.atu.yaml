rule: AUTY-002
bases:
- joint
description: a site accepting a type-authorized system with an ATO instead of an authorization to use
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: records.1.provider
  value:
    organization: Relay program office
    decision: AD-ATO
    date: '2026-06-01'
    package: Relay archetype package
    type_authorization: true
    facility_package: LA-01
expect:
  errors:
  - AUTY-002
  messages:
  - the site authorizing official accepts the risk of a type-authorized system with an authorization to use, not AD-ATOC
