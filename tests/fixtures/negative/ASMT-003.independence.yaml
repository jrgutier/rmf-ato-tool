rule: ASMT-003
bases:
- minimal
description: a self-assessment reused where independence is required
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: reused_results.0.independence
  value: self-assessment
expect:
  errors:
  - ASMT-003
  messages:
  - 'RR-001: a previous assessment of independence self-assessment cannot be reused'
