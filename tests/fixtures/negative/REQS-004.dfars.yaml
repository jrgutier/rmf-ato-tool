rule: REQS-004
bases:
- minimal
description: a contract for cyberspace work roles without DFARS 239.71
mutations:
- op: set_field
  file: artifacts/data/requirements.yaml
  path: requirements.3.allocated_to
  value:
  - CMP-RELAY
  - contract
- op: set_field
  file: artifacts/data/requirements.yaml
  path: workforce
  value:
    contracted_work_roles:
    - Cyber Defense Analyst
    qualification_requirement: REQ-04
    dfars_239_71: not-applied
    qualifications_documented: true
    sources:
    - INT-026.A1
expect:
  errors:
  - REQS-004
  messages:
  - the contract for cyberspace work roles does not apply the DFARS Subpart 239.71 qualification standards
