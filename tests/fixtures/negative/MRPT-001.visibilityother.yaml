rule: MRPT-001
description: the posture report shares a finding other than the external finding EXF-001
mutations:
- op: set_field
  file: artifacts/data/posture-reports.yaml
  path: reports.0.findings_shared
  value: [EXF-999]
expect:
  errors:
  - MRPT-001
  messages:
  - the CDRUSSTRATCOM has no visibility into the readiness-inspection finding EXF-001
