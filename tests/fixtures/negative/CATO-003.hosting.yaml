rule: CATO-003
bases:
- minimal
description: an application hosting environment on premises
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: platform.hosting.kind
  value: on-premises
expect:
  errors:
  - CATO-003
  messages:
  - the application hosting environment is a hyperscale cloud or another DoD approved environment, not on-premises
