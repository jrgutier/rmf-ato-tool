rule: RUN-FM-001
bases:
- pii
description: no PIA because privacy issues are unchanged, naming no earlier assessment
mutations:
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: privacy.pia.determination
  value: not-required
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: privacy.pia.basis
  value: unchanged
expect:
  errors:
  - RUN-FM-001
  messages:
  - '''previous_assessment'' is a required property'
  also:
  - PRIV-005
