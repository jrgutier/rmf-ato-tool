rule: SSPI-001
bases: [minimal]
description: a common control of the Analysis enclave that the security plan records as implemented by the system
mutations:
  - op: set_field
    file: artifacts/ssp/controls/sc.yaml
    path: controls.0.status
    value: implemented
expect:
  errors: [SSPI-001]
  messages:
    - "sc-7 is allocated as a common control of Analysis enclave (PRV-01), and the security plan does not reference it as inherited (status implemented)"
