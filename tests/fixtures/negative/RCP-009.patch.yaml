rule: RCP-009
bases:
- minimal
description: a patch applied after the PM's date
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: received_systems.0.patches.0.applied
  value: '2027-01-20'
expect:
  errors:
  - RCP-009
  messages:
  - 'RS-01: the patch RP-01 is not implemented in accordance with PM guidance'
