rule: RCP-001
bases:
- minimal
description: eMASS for an incompatible record keeping system
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: receiving_organizations.0.visibility.record_keeping
  value: incompatible
expect:
  errors:
  - RCP-001
  messages:
  - 'RO-01: the manual inheritance capability is not used for a receiving organization whose record keeping system is incompatible'
