rule: CATG-002
bases:
- minimal
description: secret information on an unclassified system
mutations:
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: information_types.0.handling.classification
  value: secret
expect:
  errors:
  - CATG-002
  messages:
  - INF-01 is secret information processed on a system approved for unclassified
