rule: PRIV-001
bases:
- pii
description: no PIA for PII about federal personnel, on a basis that requires one
mutations:
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: privacy.pia.determination
  value: not-required
- op: set_field
  file: artifacts/data/infotypes.yaml
  path: privacy.pia.basis
  value: new-system
expect:
  errors:
  - PRIV-001
  messages:
  - a PIA is required for a DoD IS that collects PII about members of the public, federal personnel, contractors
    or foreign nationals employed at U.S. military facilities internationally
  also:
  - PRIV-005
