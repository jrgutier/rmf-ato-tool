rule: ACQLC-001
bases:
- minimal
description: a program combining a major capability part with the software pathway records no ACAT
mutations:
- op: set_field
  file: facts.yaml
  path: acquisition.pathways
  value:
  - PW-MCA
  - PW-SWP
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.transitions
  value:
  - from: PW-MCA
    to: PW-SWP
    at: MS-B
    entry: DP-SWP-PATHWAY
    date: '2026-06-01'
    information_requirements:
    - id: EXT-CAPDOC
      coordinated_with:
      - PER-PM
      - PER-MDA
    approach:
      identified_by:
      - PER-PM
      - PER-ISSM
      approved_by: PER-MDA
      date: '2026-05-01'
      tailors:
      - processes
      - reviews
      - documentation
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.acat
  value: none
expect:
  errors:
  - ACQLC-001
  messages:
  - the use of multiple pathways does not affect the statutory thresholds applicable to the program as
    a whole
