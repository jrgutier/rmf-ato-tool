rule: ASMT-001
bases:
- minimal
description: reviewed by someone other than the SCA
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: approval.reviewed_by
  value: PER-ISSM
expect:
  errors:
  - ASMT-001
  messages:
  - the assessment plan is reviewed by the security control assessor, not PER-ISSM
