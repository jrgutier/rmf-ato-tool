rule: AODM-004
bases: [minimal]
description: a threat assessment not reviewed by the PM
mutations:
  - op: set_field
    file: artifacts/data/authorizations.yaml
    path: records.1.threat_assessment.reviewed_by
    value: PER-ISSM
expect:
  errors: [AODM-004]
  messages:
    - the PM reviews the threat assessment
