rule: PMSCRM-001
bases:
- minimal
description: a TAC report rated high and not flagged
mutations:
- op: set_field
  file: artifacts/data/pm-scrm.yaml
  path: tac_requests
  value:
  - id: TR-1
    subjects:
    - Relay appliance vendor
    to: DIA-SCRM-TAC
    date: '2026-02-10'
- op: set_field
  file: artifacts/data/pm-scrm.yaml
  path: reports
  value:
  - id: RPT-1
    request: TR-1
    rating: high
    flagged: false
expect:
  errors:
  - PMSCRM-001
  messages:
  - report RPT-1 came back high and is not flagged
