rule: CSSTRAT-003
bases:
- minimal
description: a CSS developed without Intelligence Community threat information
mutations:
- op: set_field
  file: artifacts/data/cybersecurity-strategy.yaml
  path: strategy.threat_information.0.from
  value: other
expect:
  errors:
  - CSSTRAT-003
  messages:
  - the PM uses cyber threat information produced by the Intelligence Community in developing the CSS
