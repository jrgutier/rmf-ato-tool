rule: CLOUD-002
bases:
- cloud
description: data classified above SECRET
mutations:
- op: set_field
  file: artifacts/data/cloud.yaml
  path: mission_impact_level
  value:
    level: IL4
    data:
    - cui
    - classified-above-secret
    disclosure_effect: serious
    determined_by: PER-AO
    date: '2026-03-01'
    sources:
    - INT-005.A1
expect:
  errors:
  - CLOUD-002
  messages:
  - only information classified as SECRET or below is permitted to be hosted at Impact Level 6
