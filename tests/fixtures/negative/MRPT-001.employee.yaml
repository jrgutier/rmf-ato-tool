rule: MRPT-001
bases:
- minimal
description: ISCM that does not support monitoring of employee use
mutations:
- op: set_field
  file: artifacts/data/conmon.yaml
  path: reporting.dodin.awareness
  value:
  - threats
  - traffic
  - fault
  - performance
  - bandwidth
  - route
  - network-management
expect:
  errors:
  - MRPT-001
  messages:
  - does not support monitoring of employee use of the DODIN to detect anomalous activity
