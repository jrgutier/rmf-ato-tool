rule: ENTRY-001
bases:
- minimal
description: an entry determination the ISSM approved
mutations:
- op: set_field
  file: run.yaml
  path: entry
  value:
    step: P
    task: P-10
    current_state: Categorized and described under a prior effort; no baseline selected.
    completed:
    - P-1
    - C-1
    - C-2
    - C-3
    gaps: Prepare tasks P-8 to P-18 were never documented.
    decision: Enter at S-1 and backfill Prepare at the next annual review.
    notified:
    - PER-ISSM
    - PER-PM
    approved_by: PER-ISSM
expect:
  errors:
  - ENTRY-001
  messages:
  - the entry determination is approved by the AO or AODR, not PER-ISSM
