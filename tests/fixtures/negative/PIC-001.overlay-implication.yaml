rule: PIC-001
description: the relay applies the Classified System Overlay, and the coordination on au-6 addresses design choices but not the implication the overlay's checkmark carries, to coordinate an approach between security and privacy
bases:
- minimal
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.overlays
  value:
  - CNSSI1253E-ATT5-CLASSIFIED
- op: set_field
  file: run.yaml
  path: control_subset
  value: [ac-2, au-2, au-6, cm-6, ia-2, sc-7, sc-15, si-2]
- op: append_text
  file: artifacts/data/tailoring.yaml
  text: "  - {control_id: au-6, by: PER-PRIV, implications: [2], finding: Audit review reads no user content., sources: [INT-080.A1]}\n"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - PIC-001
  also:
  - RECIP-001
  - ASMT-002
  - FACTS-001
  - SAR-COV-001
  - SSP-COV-001
  - SYSD-001
  - TLR-003
  - TLR-005
  messages:
  - "au-6: the coordination does not address implication 1 of its checkmark (Coordinate an approach between security and privacy to manage privacy risk)"
