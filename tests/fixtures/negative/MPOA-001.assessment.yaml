rule: MPOA-001
bases:
- minimal
description: a penetration assessment finding left out of the POA&M
mutations:
- op: set_field
  file: artifacts/poam/items.yaml
  path: external_findings.0.event
  value: penetration-assessment
- op: set_field
  file: artifacts/poam/items.yaml
  path: external_findings.0.poam_item
  value: POAM-999
expect:
  errors:
  - MPOA-001
  messages:
  - is not leveraged in a POA&M item or an accepted risk
