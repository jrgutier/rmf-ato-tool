rule: CRYP-001
bases:
- minimal
description: classified cryptography approved by someone other than NSA
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.overlays
  value:
  - CNSSI1253E-ATT5-CLASSIFIED
- op: set_field
  file: artifacts/data/ssp-records.yaml
  path: cryptography.uses.0.nsa_approval.by
  value: PER-AO
expect:
  errors:
  - CRYP-001
  also:
  - GEN-STALE-001
  messages:
  - NSA approves cryptography protecting classified information
