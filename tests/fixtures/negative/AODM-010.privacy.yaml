rule: AODM-010
bases:
- pii
description: a system processing PII whose decision is coordinated with someone other than the privacy
  official
mutations:
- op: set_field
  file: artifacts/data/authorizations.yaml
  path: records.1.privacy_coordination.by
  value: PER-ISSM
expect:
  errors:
  - AODM-010
  messages:
  - coordinates the authorization decision with the privacy official
