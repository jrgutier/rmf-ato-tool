rule: RCP-002
bases:
- minimal
description: a requested control neither assessed nor selected
mutations:
- op: set_field
  file: artifacts/data/reciprocity.yaml
  path: receiving_organizations.0.requirements.additional_controls
  value:
  - ra-5
expect:
  errors:
  - RCP-002
  messages:
  - 'RO-01: the additional control ra-5 requested by the receiving organization is not addressed by the security control assessment'
  - 'RO-01: the protection needs of the receiving organization are not considered in control selection; ra-5 is not in the baseline'
