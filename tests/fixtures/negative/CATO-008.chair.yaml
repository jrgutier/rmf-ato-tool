rule: CATO-008
bases:
- minimal
description: an insider threat working group chaired by the ISSO
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: people.insider_threat.working_group.chair
  value: isso
expect:
  errors:
  - CATO-008
  messages:
  - no insider threat working group is established, active, and chaired by senior leadership
