rule: XSUM-001
bases: [minimal]
description: a package submitted by the ISSM instead of the system owner
mutations:
  - op: set_field
    file: artifacts/data/package-summary.yaml
    path: submission.by
    value: PER-ISSM
expect:
  errors: [XSUM-001]
  messages:
    - the package is compiled and submitted by PER-PM, the system owner or common control provider, not PER-ISSM
