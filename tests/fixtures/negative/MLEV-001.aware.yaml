rule: MLEV-001
bases:
- minimal
description: someone other than the AO told
mutations:
- op: set_field
  file: artifacts/data/leveraged-authorizations.yaml
  path: leveraged_authorizations.0.ao_aware.official
  value: PER-ISSM
expect:
  errors:
  - MLEV-001
  messages:
  - the authorizing official of the system inheriting the controls is not made aware of the inheritance
