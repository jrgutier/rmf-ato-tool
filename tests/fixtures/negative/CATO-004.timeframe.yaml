rule: CATO-004
bases:
- minimal
description: a remediation timeframe the ISSM accepted
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: monitoring.vulnerability_management.timeframe_accepted_by
  value: PER-ISSM
expect:
  errors:
  - CATO-004
  messages:
  - critical and moderate vulnerabilities are mitigated within a timeframe acceptable to the AO, not PER-ISSM
