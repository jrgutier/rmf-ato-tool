rule: PENT-001
bases:
- minimal
description: a cATO penetration test by an internal team
mutations:
- op: append_text
  file: artifacts/data/authorizations.yaml
  text: "- id: AUTH-003\n  decision: AD-CATO\n  subject: system\n  basis: time-driven\n  decided_by: PER-AO\n  task: M-6\n  date: '2026-12-15'\n  risk_level: moderate\n  risk_acceptance: I accept the residual risk.\n  signature: pki\n  conveyed_to: [PER-PM]\n  underlying: AUTH-002\n  review: {frequency_days: 30, events: [significant change]}\n  dod_ciso_approval: {date: '2026-12-10', reference: DoD CISO memo}\n  component_ciso_notification: {date: '2026-12-01'}\n  rationale: Continuous monitoring is near real time.\n  sources: [INT-012.A1]\n"
- op: set_field
  file: artifacts/data/sap.yaml
  path: penetration_test.environments
  value:
  - development
  - operational
- op: set_field
  file: artifacts/data/sap.yaml
  path: penetration_test.option
  value: cora
- op: set_field
  file: artifacts/data/sar-summary.yaml
  path: penetration_test.provided_to_ao
  value: '2026-11-14'
- op: set_field
  file: artifacts/data/sar-summary.yaml
  path: penetration_test.lessons_learned
  value:
  - Rotate tester credentials sooner.
- op: set_field
  file: artifacts/data/sap.yaml
  path: penetration_test.assessor.party
  value: internal
expect:
  errors:
  - PENT-001
  also:
  - AODM-001
  - AODM-007
  - SSPR-001
  - SVCA-001
  messages:
  - a cATO penetration test is completed by a qualified third party
