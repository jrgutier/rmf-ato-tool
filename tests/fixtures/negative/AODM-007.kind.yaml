rule: AODM-007
bases:
- minimal
description: a cATO on software-enabled hardware
mutations:
- op: set_field
  file: run.yaml
  path: include_after_stop
  value:
  - M-6
- op: set_field
  file: facts.yaml
  path: acquisition
  value:
    pathway: PW-SWP
    product_kind: software-enabled-hardware
    set_by_task: M-6
    covered_dbs: false
- op: set_field
  file: artifacts/data/protection-requirements.yaml
  path: capability_document.kind
  value: cns
- op: append_text
  file: artifacts/data/authorizations.yaml
  text: "- id: AUTH-003\n  decision: AD-CATO\n  subject: system\n  basis: time-driven\n  decided_by: PER-AO\n\
    \  task: M-6\n  date: '2026-12-15'\n  risk_level: moderate\n  risk_acceptance: I accept the residual\
    \ risk.\n  signature: pki\n  conveyed_to: [PER-PM]\n  rationale: Continuous monitoring is near real\
    \ time.\n  sources: [INT-012.A1]\n  underlying: AUTH-002\n  review: {frequency_days: 30, events: [significant\
    \ change]}\n  dod_ciso_approval: {date: '2026-12-10', reference: DoD CISO memo}\n  component_ciso_notification:\
    \ {date: '2026-12-01'}\n"
- op: set_field
  file: artifacts/data/protection.yaml
  path: program.decision_points
  value:
  - id: DP-SWP-PATHWAY
    date: '2026-03-15'
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.submissions
  value:
  - decision_point: DP-SWP-PATHWAY
    date: '2026-03-10'
- op: set_field
  file: artifacts/data/protection.yaml
  path: ppp.tailoring.pathway
  value: PW-SWP
- op: set_field
  file: artifacts/data/nss-assessments.yaml
  path: assessments.0.decision_point
  value: DP-SWP-PATHWAY
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: document
  value:
    id: TS-1
    kind: test-strategy
    pathway: PW-SWP
    date: '2026-04-01'
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.0.decision_point
  value: DP-SWP-EXECUTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.1.decision_point
  value: DP-SWP-EXECUTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.2.decision_point
  value: DP-SWP-EXECUTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.3.decision_point
  value: DP-SWP-EXECUTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: events.4.decision_point
  value: DP-SWP-EXECUTION
- op: set_field
  file: artifacts/data/test-strategy.yaml
  path: approvals.0.decision_point
  value: DP-SWP-EXECUTION
expect:
  errors:
  - AODM-007
  also:
  - ASMT-010
  - SSPR-001
  - SVCA-001
  - CSSTRAT-001
  - CSSTRAT-003
  messages:
  - programs cannot hold a cATO
