rule: PIIC-001
bases:
- minimal
description: the categorization reviewed by the ISSO, neither the AO nor a designated representative
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.approved.approved_by
  value: PER-ISSO
expect:
  errors:
  - PIIC-001
  messages:
  - the security categorization is reviewed by the authorizing official or designated representative, not PER-ISSO
  also:
  - FACTS-001
