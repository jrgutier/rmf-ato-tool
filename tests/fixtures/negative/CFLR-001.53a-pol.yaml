rule: CFLR-001
bases:
- minimal
description: ca-1 is tailored out of a networked system although it carries CF-53A-POL, a duty NIST 
  SP 800-53A places on the system
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: ca-1\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - CFLR-001
  messages:
  - 'CF-53A-POL: NIST SP 800-53A requires that policies covering control assessments are in place before
    an assessment, and ca-1 is tailored out of the baseline'
