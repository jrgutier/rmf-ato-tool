rule: CATO-012
bases:
- minimal
description: a briefing without the cATO's conditions
mutations:
- op: append_text
  file: artifacts/data/authorizations.yaml
  text: "- id: AUTH-003\n  decision: AD-CATO\n  subject: system\n  basis: time-driven\n  decided_by: PER-AO\n  task: M-6\n  date: '2026-12-15'\n  risk_level: moderate\n  risk_acceptance: I accept the residual risk.\n  signature: pki\n  conveyed_to: [PER-PM]\n  underlying: AUTH-002\n  review: {frequency_days: 30, events: [significant change]}\n  dod_ciso_approval: {date: '2026-12-10', reference: DoD CISO memo}\n  component_ciso_notification: {date: '2026-12-01'}\n  rationale: Continuous monitoring is near real time.\n  sources: [INT-012.A1]\n  conditions:\n  - {id: COND-03, description: Keep the dashboard live., due: '2027-06-01'}\n"
expect:
  errors:
  - CATO-012
  also:
  - AODM-001
  - AODM-007
  - ASMT-010
  - SSPR-001
  - SVCA-001
  messages:
  - 'the decision briefing leaves out conditions of the authorization: Keep the dashboard live.'
