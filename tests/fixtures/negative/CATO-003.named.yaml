rule: CATO-003
bases:
- minimal
description: a reference design that is not a DoD one
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: platform.reference_design.name
  value: Vendor pipeline blueprint
expect:
  errors:
  - CATO-003
  messages:
  - the DSOP adheres to Vendor pipeline blueprint, which is not identified as a DoD Enterprise DevSecOps Reference Design
