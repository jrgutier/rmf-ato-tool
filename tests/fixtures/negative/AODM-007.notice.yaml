rule: AODM-007
bases: [minimal]
description: a cATO with no notice to the Component CISO
mutations:
  - op: set_field
    file: run.yaml
    path: include_after_stop
    value: [M-6]
  - op: set_field
    file: facts.yaml
    path: acquisition
    value: {pathway: PW-SWP, product_kind: software, set_by_task: M-6}
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-003
        decision: AD-CATO
        subject: system
        basis: time-driven
        decided_by: PER-AO
        task: M-6
        date: '2026-12-15'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
        underlying: AUTH-002
        review: {frequency_days: 30, events: [significant change]}
        dod_ciso_approval: {date: '2026-12-10', reference: DoD CISO memo}
  - op: set_field
    file: artifacts/data/protection.yaml
    path: program.decision_points
    value: [{id: DP-SWP-PATHWAY, date: "2026-03-15"}]
  - op: set_field
    file: artifacts/data/protection.yaml
    path: ppp.submissions
    value: [{decision_point: DP-SWP-PATHWAY, date: "2026-03-10"}]
  - op: set_field
    file: artifacts/data/protection.yaml
    path: ppp.tailoring.pathway
    value: PW-SWP
  - op: set_field
    file: artifacts/data/nss-assessments.yaml
    path: assessments.0.decision_point
    value: DP-SWP-PATHWAY
  - op: set_field
    file: artifacts/data/test-strategy.yaml
    path: document
    value: {id: TS-1, kind: test-strategy, pathway: PW-SWP, date: "2026-04-01"}
  - op: set_field
    file: artifacts/data/test-strategy.yaml
    path: events.0.decision_point
    value: DP-SWP-EXECUTION
  - op: set_field
    file: artifacts/data/test-strategy.yaml
    path: events.1.decision_point
    value: DP-SWP-EXECUTION
  - op: set_field
    file: artifacts/data/test-strategy.yaml
    path: events.2.decision_point
    value: DP-SWP-EXECUTION
  - op: set_field
    file: artifacts/data/test-strategy.yaml
    path: events.3.decision_point
    value: DP-SWP-EXECUTION
  - op: set_field
    file: artifacts/data/test-strategy.yaml
    path: events.4.decision_point
    value: DP-SWP-EXECUTION
  - op: set_field
    file: artifacts/data/test-strategy.yaml
    path: approvals.0.decision_point
    value: DP-SWP-EXECUTION
expect:
  errors: [AODM-007]
  also: [ASMT-010, SSPR-001, SVCA-001, CSSTRAT-001, CSSTRAT-003]
  messages:
    - "the AO notifies the Component CISO first: component_ciso_notification"
