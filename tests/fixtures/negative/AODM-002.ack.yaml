rule: AODM-002
bases: [minimal]
description: ongoing authorization the AO did not acknowledge
mutations:
  - op: set_field
    file: run.yaml
    path: include_after_stop
    value: [M-6]
  - op: append_text
    file: artifacts/data/authorizations.yaml
    text: |
      - id: AUTH-003
        decision: AD-CONT
        subject: system
        basis: time-driven
        decided_by: PER-AO
        task: M-6
        date: '2026-12-15'
        risk_level: moderate
        risk_acceptance: I accept the residual risk.
        signature: pki
        conveyed_to: [PER-PM]
        rationale: Continuous monitoring is near real time.
        sources: [INT-012.A1]
        underlying: AUTH-002
        review: {frequency_days: 30, events: [significant change]}
expect:
  errors: [AODM-002]
  messages:
    - needs ongoing_acknowledgment
