rule: BSEL-001
bases: [minimal]
description: the categorization names an overlay no CNSSI 1253 table lists, a system's own overlay
build: false
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.overlays
  value: [FDR-OWN-OVERLAY]
expect:
  errors: [BSEL-001]
  also: [FACTS-001, RECIP-001, GEN-STALE-001]
  messages:
    - "the baseline exists but `rmf baseline resolve` fails: unknown overlay 'FDR-OWN-OVERLAY'"
