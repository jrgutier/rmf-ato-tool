rule: PIIC-001
bases:
- pii
description: a Privacy Overlay selected that the SAOP did not approve
mutations:
- op: set_field
  file: facts.yaml
  path: categorization.approved.privacy.overlays
  value: []
expect:
  errors:
  - PIIC-001
  messages:
  - the Privacy Overlay CNSSI1253F-ATT6-PRIVACY-MODERATE is selected without the approval of the SAOP or designee
