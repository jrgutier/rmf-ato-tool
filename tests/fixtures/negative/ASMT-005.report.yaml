rule: ASMT-005
bases:
- minimal
description: a reused result the report leaves out
mutations:
- op: set_field
  file: artifacts/data/sap.yaml
  path: reused_results.0.id
  value: RR-002
- op: set_field
  file: artifacts/sar/results/si.yaml
  path: determinations.0.reused
  value:
  - RR-002
expect:
  errors:
  - ASMT-005
  messages:
  - the assessment report does not document the reused result RR-002
