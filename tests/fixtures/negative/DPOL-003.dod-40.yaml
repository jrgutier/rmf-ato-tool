rule: DPOL-003
bases:
- minimal
description: ir-4 is tailored out of a networked system although it carries PC-DOD-40, a duty DoDI 
  8500.01 places on DoD IT through the DoD Component cybersecurity program
mutations:
- op: replace_text
  file: artifacts/data/tailoring.yaml
  old: '  - control_id: cp-3.1'
  new: "  - control_id: ir-4\n    action: remove\n    basis: scoping\n    scoping: {consideration: technology}\n\
    \    law_policy:\n      reviewed: [legislation, regulation, policy, omb-policy]\n      requires_control:
    false\n      sources: [INT-028.A3]\n    rationale: The relay is said to need no such control.\n  \
    \  sources: [INT-028.A3]\n  - control_id: cp-3.1"
- op: resolve_baseline
  file: baseline.json
expect:
  errors:
  - DPOL-003
  also:
  - CFLR-001
  - CFLR-002
  - CFLR-003
  - DPOL-002
  messages:
  - 'PC-DOD-40: DoDI 8500.01 requires that incident response limits damage and restores effective service
    following an incident, and ir-4 is tailored out of the baseline'
