rule: UPD-001
bases:
- minimal
description: the characterization update is dated before the system was registered
mutations:
- op: set_field
  file: artifacts/data/registration.yaml
  path: updates.0.date
  value: '2026-02-01'
expect:
  errors:
  - UPD-001
  messages:
  - the characterization update of the registration information is dated 2026-02-01, before the system was registered on 2026-03-02
