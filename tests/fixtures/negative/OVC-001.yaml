rule: OVC-001
bases:
- minimal
description: an overlay conflict resolved by the AO alone, without the SAOP
mutations:
- op: set_field
  file: artifacts/data/tailoring.yaml
  path: overlay_conflicts
  value:
  - {overlays: [CNSSI1253F-ATT6-PRIVACY-ACCT, CNSSI1253F-ATT5-CLASSIFIED], controls: [au-11], resolution: The longer retention applies., resolved_by: [PER-AO], coordinated_with: [PER-IO, PER-PM, PER-RE], sources: [INT-028.A3]}
expect:
  errors:
  - OVC-001
  messages:
  - 'the overlay conflict over au-11 is not resolved by the AO (or designee) and the SAOP (or designee)'
