rule: CATO-011
bases:
- minimal
description: a tolerance developed without the mission owner
mutations:
- op: set_field
  file: artifacts/data/cato.yaml
  path: tolerances.0.developed_by
  value:
  - PER-PM
  - PER-SCA
  - PER-AO
- op: set_field
  file: artifacts/data/cato.yaml
  path: tolerances.1.developed_by
  value:
  - PER-PM
  - PER-SCA
  - PER-AO
expect:
  errors:
  - CATO-011
  messages:
  - the risk tolerances are not developed collaboratively with mission-owner
