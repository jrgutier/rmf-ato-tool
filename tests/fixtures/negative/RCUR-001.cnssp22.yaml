rule: RCUR-001
bases:
- minimal
description: a later edition of CNSSP 22, a document CNSSI 1254 Annex A lists, found and not adopted
mutations:
- op: set_field
  file: artifacts/data/org-context.yaml
  path: reference_currency.references.1.later_edition
  value: {edition: March 2026, published: '2026-03-01', adopted: false}
expect:
  errors:
  - RCUR-001
  messages:
  - 'CNSSP22 has a later edition, March 2026, which applies to this policy, and the run does not adopt it'
