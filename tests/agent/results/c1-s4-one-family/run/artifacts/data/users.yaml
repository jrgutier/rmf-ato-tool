users:
  - id: USR-SOC-OPS
    title: "SOC operators"
    description: "About 25 security operations center operators who read the system's alarms in IODS and never sign in to the system"
    type: internal
    privilege_level: no-logical-access
    roles: ["alarm consumer"]
    authorized_privileges:
      - title: "none"
        functions_performed: ["view forwarded alarms in IODS"]
    sources: [INT-002.A1, product/conops.md#users]
  - id: USR-ADMIN
    title: "System administrators"
    description: "Three remote administrators who sign in through the identity service with DoD PKI"
    type: internal
    privilege_level: privileged
    roles: ["admin"]
    authorized_privileges:
      - title: "console administration"
        functions_performed: ["manage configuration", "manage accounts", "upload software updates", "review logs"]
    sources: [INT-002.A2, product/conops.md#users, product/architecture.md#identity]
  - id: USR-FIELDTECH
    title: "Field technicians"
    description: "About ten technicians who use the console on site through the maintenance port with the shared local fieldtech account"
    type: internal
    privilege_level: privileged
    roles: ["fieldtech"]
    authorized_privileges:
      - title: "on-site maintenance"
        functions_performed: ["replace sensors", "re-pair radios", "run diagnostics"]
    sources: [INT-002.A2, product/conops.md#users, product/conops.md#limitations]
  - id: USR-AUDITOR
    title: "Auditors (ISSO staff)"
    description: "Two ISSO staff members with remote read-only access through the identity service"
    type: internal
    privilege_level: non-privileged
    roles: ["auditor"]
    authorized_privileges:
      - title: "read-only review"
        functions_performed: ["review audit logs", "review configuration reports"]
    sources: [INT-002.A2, product/conops.md#users, product/architecture.md#identity]
