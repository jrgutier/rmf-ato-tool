family: si
determinations:
  - control_id: si-2
    result: other-than-satisfied
    methods: [examine, interview, test]
    summary: "Flaws are identified and reported through developer tracking and vulnerability scans, corrected in a signed monthly bundle tested on reference units before release, and each bundle passes the configuration control board (SI-02a, SI-02b, SI-02d met, per the developer interview and the update architecture). SI-02c is not met: the 2026-09-30 vulnerability scan showed esg-north-01 and esg-ridge-01 running the 2026-07 bundle, 63 days old against the 30-day period, with 4 high and 9 medium vulnerabilities fixed in later bundles, and STIG finding STG-001 (BM-01, CAT II) is open; 10 of 12 units were current with no vulnerabilities."
    finding_refs: [FND-003]
    sources: [INT-021.A3, product/test-results.md#vuln-scan, product/architecture.md#updates]
findings:
  - id: FND-003
    control_id: si-2
    title: "Security-relevant updates are not installed within 30 days on fielded units"
    description: "SI-2 c. requires security-relevant software and firmware updates to be installed within 30 days of release of the update bundle. Fielded units receive bundles only at quarterly site visits; at the 2026-09-30 scan 2 of 12 units (esg-north-01, esg-ridge-01) ran a 63-day-old bundle with 4 high and 9 medium vulnerabilities that later bundles fix, and STIG finding STG-001 is open. Release 2.2 (planned 2026-12) adds remote update over the uplink."
    status: open
    severity: high
    recommendation: "Deliver remote update over the uplink in release 2.2 and close STG-001; until then, schedule out-of-cycle site visits so no unit runs a bundle older than 30 days, prioritizing esg-north-01 and esg-ridge-01, and have the ISSO track bundle age per unit after each scan."
    sources: [INT-021.A3, product/test-results.md#vuln-scan, product/conops.md#limitations]
