family: si
controls:
  - control_id: si-2
    status: partial
    statement: "In place: a. the developer tracks flaws in CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI and CMP-STORE and corrects them in a signed monthly update bundle; vulnerability scans report flaws on fielded units to the ISSO. b. Each bundle is built by the hardened-image pipeline and tested on the developer's reference units before release, and units verify the bundle signature before installing it. d. Each bundle changes the approved baseline and goes through the RSSPO configuration control board. Missing: c. fielded units receive bundles only at the quarterly site visit, so security-relevant updates are not installed within 30 days from release of the update bundle; at the 2026-09-30 scan two of 12 units (esg-north-01, esg-ridge-01) ran a 63-day-old bundle with 4 high and 9 medium vulnerabilities fixed in later bundles. Plan: release 2.2 (planned 2026-12) adds remote update over the uplink so bundles are installed within the 30-day period."
    responsible_roles: [PER-DEV, PER-ISSO, PER-CCB]
    components: [CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI, CMP-STORE]
    parameters:
      si-02_odp: "30 days from release of the update bundle"
    sources: [INT-016.A1, INT-016.A2, product/architecture.md#updates, product/conops.md#limitations, product/test-results.md#vuln-scan]
