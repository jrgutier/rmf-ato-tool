family: au
controls:
  - control_id: au-2
    status: implemented
    statement: "CMP-GW-OS (audit daemon), CMP-COLLECTOR and CMP-WEBUI log sign-in success and failure, account changes, privilege use, configuration changes, update installation, service start and stop, and radio pairing events. The event list was coordinated and agreed with the Installation CSSP on 2026-05-20 as the set an incident investigation needs, and the ISSO and the CSSP review and update it annually. Events are forwarded over TLS to the CSSP SIEM within one minute and held locally for 30 days; the CSSP correlates them and the ISSO reviews the ESG report weekly. Shared responsibility: the CSSP provides collection and correlation, ESG generates and forwards the events. Events from the shared fieldtech account are logged but name the account, not a person (tracked under ac-2)."
    responsible_roles: [PER-ISSO, PER-CSSP]
    components: [CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI]
    inherited_from: "Installation Cybersecurity Service Provider"
    parameters:
      au-02_odp.04: "annually"
    sources: [INT-013.A3, INT-012.A1, product/architecture.md#logging, product/test-results.md#dt-2]
