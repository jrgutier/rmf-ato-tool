family: cm
controls:
  - control_id: cm-6
    status: implemented
    statement: "Configuration settings for CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI and CMP-STORE are established from the DISA SRGs and STIGs applicable to each component (General Purpose OS SRG and the application and web server guidance) and implemented in one signed OS image that the developer's build pipeline hardens for every unit. The pipeline records each deviation; the RSSPO configuration control board approves deviations, which are listed in the STIG summary. A nightly configuration check on every unit reports drift from the approved baseline to the SIEM, and every baseline change goes through the configuration control board. The 2026-09-30 scan found the approved baseline on all 12 units with only the approved deviations."
    responsible_roles: [PER-ISSE, PER-DEV, PER-CCB]
    components: [CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI, CMP-STORE]
    parameters:
      cm-06_odp.01: "DISA SRGs and STIGs applicable to each component"
    sources: [INT-014.A1, product/architecture.md#configuration, product/test-results.md#config-scan]
