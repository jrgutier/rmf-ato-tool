items:
  - id: POAM-001
    finding_ref: FND-001
    control_id: ac-2
    weakness: "Shared field-technician account fieldtech is not attributable and not managed on team departure"
    description: "The shared local account fieldtech is used by 10 field technicians; its sign-ins cannot be attributed to a person and its password changes every 90 days instead of when a technician leaves the team, so privileged on-site actions lack individual accountability."
    source_of_weakness: sar
    severity: moderate
    residual_risk: moderate
    status: open
    point_of_contact: PER-PM
    resources_required: "Release 2.3 (about two developer-months) and smart-card readers for 10 field-technician laptops, funded in the FY27 budget line; ISSM time for the interim site-visit sign-in log."
    scheduled_completion: "2027-03-31"
    milestones:
      - description: "Site-visit sign-in log and password change on technician departure in effect"
        due: "2026-11-15"
      - description: "Smart-card readers delivered to field technicians"
        due: "2027-01-31"
      - description: "Release 2.3 with per-technician accounts fielded on all units"
        due: "2027-03-15"
      - description: "fieldtech account removed and account review confirms closure"
        due: "2027-03-31"
    comments: "Same root cause as POAM-002 (FND-002, STG-004); both close with release 2.3."
    sources: [ART-SAR, INT-023.A2, INT-024.A2]
  - id: POAM-002
    finding_ref: FND-002
    control_id: ia-2
    weakness: "Field technicians share the local account fieldtech and are not uniquely identified"
    description: "Technicians on the maintenance port sign in as the shared account fieldtech, so the system cannot uniquely identify and authenticate them; actions taken on site cannot be tied to an individual."
    source_of_weakness: sar
    severity: moderate
    residual_risk: moderate
    status: open
    point_of_contact: PER-PM
    resources_required: "Release 2.3 (about two developer-months) and smart-card readers for 10 field-technician laptops, funded in the FY27 budget line."
    scheduled_completion: "2027-03-31"
    milestones:
      - description: "Site-visit sign-in log ties each fieldtech session to a named technician"
        due: "2026-11-15"
      - description: "Smart-card readers delivered to field technicians"
        due: "2027-01-31"
      - description: "Release 2.3 with smart-card login on the maintenance port fielded on all units"
        due: "2027-03-15"
      - description: "Rescan shows STG-004 closed"
        due: "2027-03-31"
    comments: "Also covers open CAT II STIG finding STG-004 (BM-03, INV-004, shared accounts for privileged access). Same root cause as POAM-001."
    sources: [ART-SAR, ART-STIG, INT-023.A2, INT-024.A2]
  - id: POAM-003
    finding_ref: FND-003
    control_id: si-2
    weakness: "Security-relevant updates are not installed within 30 days on fielded units"
    description: "Fielded units receive update bundles only at quarterly site visits; at the 2026-09-30 scan 2 of 12 units ran a 63-day-old bundle with 4 high and 9 medium vulnerabilities that later bundles fix, exposing them to exploitation of known flaws."
    source_of_weakness: sar
    severity: high
    residual_risk: moderate
    status: open
    point_of_contact: PER-PM
    resources_required: "Release 2.2 remote update over the uplink, funded in the current development contract; out-of-cycle site visits by the field team until release 2.2 is fielded."
    scheduled_completion: "2026-12-31"
    milestones:
      - description: "esg-north-01 and esg-ridge-01 updated by out-of-cycle site visit"
        due: "2026-11-14"
      - description: "November vulnerability scan rerun shows no unit past 30 days"
        due: "2026-11-30"
      - description: "Release 2.2 remote update fielded"
        due: "2026-12-15"
      - description: "All units on release 2.2 and rescan shows STG-001 closed"
        due: "2026-12-31"
    comments: "Also covers open CAT II STIG finding STG-001 (BM-01, INV-002, updates not installed within the organization-defined period)."
    sources: [ART-SAR, ART-STIG, INT-023.A1, INT-024.A1]
