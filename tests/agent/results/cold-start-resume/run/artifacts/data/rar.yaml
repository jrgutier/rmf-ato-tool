risks:
  - id: RSK-001
    title: "Exploitation of known vulnerabilities on fielded units behind on updates"
    description: "An outsider with a foothold on the installation network (TE-2) exploits one of the 4 high or 9 medium vulnerabilities on units running a 63-day-old update bundle, because updates reach fielded units only at quarterly site visits; a compromised gateway could falsify or suppress intrusion alarms."
    likelihood: moderate
    impact: high
    level: moderate
    finding_refs: [FND-003, STG-001]
    poam_refs: [POAM-003]
    response: mitigate
    sources: [INT-025.A1, INT-026.A1, ART-RA]
  - id: RSK-002
    title: "Unattributable privileged on-site actions through the shared fieldtech account"
    description: "An insider or contractor (TE-1) misuses the shared local account fieldtech on the maintenance port; because ten technicians share it and its password is not changed on departure, privileged actions on a gateway cannot be tied to a person, weakening accountability and deterrence."
    likelihood: moderate
    impact: moderate
    level: moderate
    finding_refs: [FND-001, FND-002, STG-004]
    poam_refs: [POAM-001, POAM-002]
    response: mitigate
    sources: [INT-025.A2, INT-026.A2, ART-RA]
overall_risk: moderate
sources: [ART-SAR, ART-POAM, ART-STIG, ART-RA, ART-ORG-CONTEXT, INT-026.A3]
