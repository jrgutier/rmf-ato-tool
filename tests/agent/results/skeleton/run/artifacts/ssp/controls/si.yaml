family: si
controls:
  - control_id: si-2
    status: partial
    statement: "Implemented today: (a) the developer identifies flaws in the OS, collector, console and database (CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI, CMP-STORE) from vendor advisories and its own scans and corrects them in a signed monthly update bundle; monthly vulnerability scans and the bundle level of each unit are reported by the ISSO to the ISSM, and units past the remediation period are reported to the program office. (b) Each bundle is built by the baseline pipeline and regression-tested on the pre-production units before release, and each unit verifies the bundle signature before installing it. (d) Each bundle is a baseline change approved by the RSSPO configuration control board, and the nightly configuration check confirms the installed level. Missing: (c) security-relevant updates are not installed within 30 days from release of the update bundle on fielded units, because bundles are installed only during quarterly site visits while remote update over the installation network is not approved. At the 2026-09-30 scan, esg-north-01 and esg-ridge-01 ran the 2026-07 bundle, 63 days old, with 4 high and 9 medium vulnerabilities fixed in later bundles; the other 10 units were current with no findings. Plan: remote update over the uplink in software release 2.2, planned for 2026-12; until then each unit past 30 days is tracked in a POA&M item as the organizational rule requires."
    responsible_roles: [PER-ISSO, PER-DEV, PER-ISSM, PER-PM]
    components: [CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI, CMP-STORE]
    parameters:
      si-02_odp: "30 days from release of the update bundle"
    sources: [INT-017.A2, INT-017.A3, INT-019.A1, INT-019.A2, product/architecture.md#updates, product/conops.md#limitations, product/test-results.md#vuln-scan, ART-ORG-CONTEXT]
