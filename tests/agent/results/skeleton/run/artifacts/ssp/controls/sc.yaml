family: sc
controls:
  - control_id: sc-7
    status: implemented
    statement: "(a) The external managed interface is the uplink port of CMP-GW-HW to the site switch. The host firewall on CMP-GW-OS denies all traffic by default and permits by exception only outbound TLS 1.3 to IODS on one port, outbound syslog over TLS to the CSSP collector, and inbound HTTPS to the console from the installation management VLAN. The key internal managed interfaces are the maintenance port, which is disabled until a technician enables it with the shelter key switch, serves only the console on a link-local address and has no routing to the uplink, and the field radio, a paired encrypted link over which sensor nodes have no IP path to the uplink. Firewall rule changes are logged and approved by the configuration control board with the baseline. DT-2 port scans from the installation network and the maintenance port found only the documented ports and no routing between ports. (b) ESG has no publicly accessible components, so no separate subnetwork is needed. (c) Each unit connects to other systems only through the site switch on its own enclave VLAN, behind the enclave firewall, intrusion detection and network access control of the Installation Network Enclave, which permits at the enclave edge only the registered flows; that part is inherited under the enclave ATO of 2025-11-20. The system's own part is the host firewall and port design on its two components, and notifying the enclave before any new flow."
    responsible_roles: [PER-ISSE, PER-ISSO, PER-CCP]
    components: [CMP-GW-OS, CMP-GW-HW]
    inherited_from: "Installation Network Enclave"
    sources: [INT-016.A3, INT-016.A4, INT-018.A2, product/architecture.md#network, product/architecture.md#leveraged, product/test-results.md#dt-2]
