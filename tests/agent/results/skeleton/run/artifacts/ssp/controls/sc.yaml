family: sc
controls:
  - control_id: sc-7
    status: implemented
    statement: "a. The host firewall in CMP-GW-OS on each CMP-GW-HW appliance monitors and controls traffic at the uplink and maintenance ports, denying by default and permitting only outbound TLS 1.3 to IODS, outbound syslog over TLS to the CSSP, and inbound HTTPS to the console from the installation management VLAN; the maintenance port is disabled until the shelter key switch enables it, serves only a link-local console and never routes to the uplink, and sensor nodes have no IP path. b. ESG has no publicly accessible components. c. ESG connects to external systems only through the site switch behind the Installation Network Enclave, whose firewall, intrusion detection and network access control enforce the same permitted flows at the enclave edge. Shared responsibility: the enclave provides edge boundary protection; ESG provides the host firewall and port separation. DT-2 port scans from both ports found only the documented ports and no routing between them."
    responsible_roles: [PER-ISSE, PER-ISSO, PER-CCP]
    components: [CMP-GW-OS, CMP-GW-HW]
    inherited_from: "Installation Network Enclave"
    sources: [INT-015.A3, INT-012.A1, product/architecture.md#network, product/test-results.md#dt-2]
