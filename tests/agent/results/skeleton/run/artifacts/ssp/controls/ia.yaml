family: ia
controls:
  - control_id: ia-2
    status: partial
    statement: "Implemented today: remote administrators and auditors are uniquely identified and authenticated by the Installation ICAM Service with their DoD PKI smart card; the ICAM service issues the identities, validates the credential and asserts the identity and group claim, and that part is inherited. On CMP-WEBUI the system configures the federation, maps the group claim to the admin or auditor role, refuses any user without an approved claim (DT-2 passed), and runs every console session and action under the asserted identity, so audit events name the person. The break-glass account esgadmin is a single named account, sealed in the program office safe, with each use logged and reported. Local sign-ins lock for 30 minutes after five failures and sessions lock after 15 minutes idle (both passed in DT-2). Missing: about 10 field technicians sign in on the maintenance port with the shared local fieldtech account and a shared password, so they are not uniquely identified and processes started in those sessions are associated with the shared account, not a person. The ICAM service covers no local accounts. Plan: per-technician local accounts with smart-card login that works without the identity service, in software release 2.3, planned for 2027-03."
    responsible_roles: [PER-ISSE, PER-ISSO, PER-DEV, PER-CCP]
    components: [CMP-WEBUI]
    inherited_from: "Installation ICAM Service"
    sources: [INT-016.A1, INT-016.A2, INT-017.A1, INT-018.A1, product/architecture.md#identity, product/conops.md#limitations, product/test-results.md#dt-2]
