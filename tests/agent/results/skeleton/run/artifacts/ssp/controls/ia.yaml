family: ia
controls:
  - control_id: ia-2
    status: partial
    statement: "In place: remote administrators and auditors authenticate to CMP-WEBUI with their DoD PKI smart card at the Installation ICAM Service; the console federates to the service and maps the approved group claim to the admin or auditor role, so each remote session and the processes acting in it are associated with one named person. Users without an approved claim are refused (DT-2). The sealed break-glass account esgadmin is used by one named person per use, and each use is logged and reported to the ISSO. The console locks local accounts for 30 minutes after five failed sign-ins and locks sessions after 15 minutes idle. Shared responsibility: the Installation ICAM Service provides PKI authentication; ESG provides the federation, role mapping and session handling. Missing: on the maintenance port the ten field technicians sign in with the shared local fieldtech password account, so their sessions are not uniquely identified and cannot be associated with an individual. Plan: release 2.3 (planned 2027-03) replaces fieldtech with per-technician local accounts with smart-card login that work without a path to the identity service."
    responsible_roles: [PER-ISSE, PER-ISSO, PER-DEV]
    components: [CMP-WEBUI]
    inherited_from: "Installation ICAM Service"
    sources: [INT-015.A1, INT-015.A2, INT-016.A3, INT-012.A1, product/architecture.md#identity, product/conops.md#limitations, product/test-results.md#dt-2]
