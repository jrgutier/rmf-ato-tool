family: cm
controls:
  - control_id: cm-6
    status: implemented
    statement: "(a) The configuration settings for CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI and CMP-STORE are the DISA SRGs and STIGs applicable to each component: the developer builds one signed OS image from the General Purpose Operating System SRG and the applicable application and web server guidance, in the most restrictive mode consistent with the mission. (b) The build pipeline applies the hardening settings, and every unit runs the same signed image. (c) The pipeline records each deviation from the guidance, and the RSSPO configuration control board approves deviations and any change to the baseline; the approved deviations are listed in the program's STIG summary. (d) A configuration check runs nightly on each unit and reports drift from the approved baseline to the CSSP SIEM; the 2026-09-30 witnessed SRG/STIG scan found the approved baseline on all 12 units and no drift in August or September 2026."
    responsible_roles: [PER-ISSE, PER-DEV, PER-CCB, PER-ISSO]
    components: [CMP-GW-OS, CMP-COLLECTOR, CMP-WEBUI, CMP-STORE]
    parameters:
      cm-06_odp.01: "DISA SRGs and STIGs applicable to each component"
    sources: [INT-014.A1, INT-014.A2, product/architecture.md#configuration, product/test-results.md#config-scan]
