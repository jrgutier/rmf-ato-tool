family: sc
determinations:
  - control_id: sc-7
    result: satisfied
    methods: [examine, interview, test]
    summary: "Reused DT-2 port scans from the installation network and the maintenance port on 12 of 12 units (only the documented ports answered, no routing between ports); team re-test on a sample of two pre-production units (simulated) with the same result. Examined the host firewall rules in the approved baseline (deny by default, three permit rules) and the nightly configuration check (no drift in August or September 2026), and the console's maintenance-port events, which appear only on site-visit dates. Interviewed the developer on interface design and the enclave provider for the inherited part: enclave firewall, intrusion detection and network access control at the edge permit only the registered ESG flows and monitor them, under the enclave ATO of 2025-11-20. SC-07a[01]-[04] met (control by the host firewall and port design, monitoring by the enclave edge and the drift check), SC-07b not applicable in substance (no publicly accessible components), SC-07c met. Evidence: reused DT-2 results, team-produced re-test, examination and interviews."
    sources: [INT-026.A2, INT-027.A2, INT-028.A2, ART-SSP, product/test-results.md#dt-2, product/test-results.md#config-scan, product/architecture.md#network]
