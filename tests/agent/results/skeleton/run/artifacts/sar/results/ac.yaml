family: ac
determinations:
  - control_id: ac-2
    result: other-than-satisfied
    methods: [examine, interview, test]
    summary: "Examined the 2026-09-12 quarterly account review record and interviewed the ISSO: the 3 administrator and 2 auditor identity-service accounts match approved access requests, the break-glass account esgadmin is sealed and unused since 2026-06, and DT-2 showed users without an approved group claim were refused. However, the shared local account fieldtech is used by 10 field technicians, its use cannot be attributed to an individual, and its password is changed every 90 days rather than when a technician leaves the team, so account management does not meet the control's intent for that account."
    finding_refs: [FND-001]
    sources: [INT-020.A1, product/test-results.md#account-review, product/test-results.md#dt-2]
findings:
  - id: FND-001
    control_id: ac-2
    title: "Shared field-technician account fieldtech is not attributable and not managed on team departure"
    description: "AC-2 requires accounts to be managed so that use is authorized and monitored and authenticators change when group membership changes. The 2026-09-12 account review and the ISSO interview show that the shared local account fieldtech is used by 10 field technicians, its sign-ins cannot be attributed to a person, and its password changes every 90 days instead of when a technician leaves the team. The program plans per-technician accounts with smart-card login in release 2.3 (2027-03)."
    status: open
    severity: moderate
    recommendation: "Deliver per-technician local accounts with smart-card login (release 2.3); until then, change the fieldtech password whenever a technician leaves the team and keep a site-visit sign-in log that ties each fieldtech session to a named technician."
    sources: [INT-020.A1, product/test-results.md#account-review, product/conops.md#limitations]
