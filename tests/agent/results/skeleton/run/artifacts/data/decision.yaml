decision: AD-ATOC
decided_by: PER-AO
date: "2026-10-29"
authorization_termination_date: "2027-10-29"
conditions:
  - id: COND-01
    description: "Update esg-north-01 and esg-ridge-01 to the current bundle and confirm with a credentialed rescan (POAM-005, POAM-006); from the decision date no unit may run past 30 days without its own POA&M item."
    due: "2026-11-20"
  - id: COND-02
    description: "Remote update over the uplink in use on all units and STG-001 closed (POAM-004); the new update flow is approved by the AO before it is enabled."
    due: "2027-01-31"
  - id: COND-03
    description: "Interim controls for the shared fieldtech account in place: site-visit log reconciled monthly with the audit records (POAM-001 interim milestone) and the password changed whenever a technician leaves the group (POAM-002)."
    due: "2026-11-30"
  - id: COND-04
    description: "Per-technician local accounts with smart-card login (release 2.3) installed on all units, fieldtech disabled and STG-004 closed (POAM-001, POAM-003)."
    due: "2027-03-31"
risk_level: moderate
rar_ref: ART-RAR
rationale: "The AODR's overall risk determination is moderate, within the Component's tolerance without CIO concurrence, after an independent assessment; the mission needs the alarm feed. The risk is acceptable only because every open weakness is funded and scheduled in the POA&M, so the ATO is conditioned on those dates, with a one-year term because the system is in development with three partially implemented controls."
sources: [ART-RAR, ART-POAM, ART-ORG-CONTEXT, INT-033.A1, INT-033.A2, INT-033.A3, INT-033.A4]
