users:
  - id: USR-ADMIN
    title: "ESG system administrators"
    description: "Three administrators who sign in remotely to the admin web console with DoD PKI through the installation identity service; the break-glass local account esgadmin is held sealed in the program office safe for their emergency use"
    type: internal
    privilege_level: privileged
    roles: ["admin"]
    authorized_privileges:
      - title: "Console administration"
        functions_performed: ["manage configuration", "manage accounts", "upload and install software updates", "review logs"]
    sources: [INT-006.A2, product/conops.md#users, product/architecture.md#identity]
  - id: USR-FIELDTECH
    title: "Field technicians"
    description: "About ten technicians who sign in on site to the admin web console through the maintenance port with the shared local account fieldtech during quarterly site visits"
    type: internal
    privilege_level: privileged
    roles: ["fieldtech"]
    authorized_privileges:
      - title: "On-site maintenance"
        functions_performed: ["replace sensors", "re-pair sensor radios", "run diagnostics"]
    sources: [INT-006.A2, product/conops.md#users, product/conops.md#limitations]
  - id: USR-AUDITOR
    title: "Auditors (ISSO staff)"
    description: "Two ISSO staff who sign in remotely with DoD PKI through the identity service with read-only access"
    type: internal
    privilege_level: non-privileged
    roles: ["auditor"]
    authorized_privileges:
      - title: "Read-only review"
        functions_performed: ["review audit logs", "review configuration reports"]
    sources: [INT-006.A2, product/conops.md#users, product/architecture.md#identity]
  - id: USR-SOC
    title: "SOC operators"
    description: "About 25 security operations center operators who read ESG alarms in IODS and never sign in to the system"
    type: internal
    privilege_level: no-logical-access
    authorized_privileges: []
    sources: [INT-006.A1, product/conops.md#users]
