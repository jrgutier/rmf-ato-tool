actions:
  - control_id: ac-2
    action: parameter
    parameter: {param_id: ac-02_odp.10, value: quarterly}
    rationale: Account reviews follow the ISSO's quarterly review cycle, aligned with the quarterly site visits.
    sources: [product/architecture.md#identity, product/test-results.md#account-review]
  - control_id: au-2
    action: parameter
    parameter: {param_id: au-02_odp.04, value: annually}
    rationale: The event list agreed with the CSSP is reviewed every year.
    sources: [product/architecture.md#logging]
  - control_id: si-2
    action: parameter
    parameter: {param_id: si-02_odp, value: 30 days from release of the update bundle}
    rationale: Organizational flaw remediation period from the Component's risk management strategy.
    sources: [ART-ORG-CONTEXT]
  - control_id: cm-6
    action: parameter
    parameter: {param_id: cm-06_odp.01, value: DISA SRGs and STIGs applicable to each component}
    rationale: DoD components configure systems to the applicable SRGs and STIGs.
    sources: [product/architecture.md#configuration, ART-ORG-CONTEXT]
