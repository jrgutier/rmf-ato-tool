scope:
  include: baseline
  excluded_controls: []
assessment_subjects:
  - type: component
    include: all
team:
  - persona: PER-SCA
    role: "Lead assessor, Component assessment team under the CISO's delegation of the SCA role; plans the assessment, examines evidence, runs interviews and writes the determinations"
    independent: true
schedule:
  start: "2026-11-02"
  end: "2026-11-20"
  events:
    - date: "2026-11-02"
      description: "Kickoff with the ISSM, ISSO, developer and providers; confirm evidence list and rules of engagement"
      kind: kickoff
    - date: "2026-11-03"
      description: "Document examination and interviews (ISSO, ISSE, developer, CSSP) through 2026-11-06; review of reused DT-2 results and the 2026-09-30 configuration scan"
      kind: interview
    - date: "2026-11-09"
      description: "Assessor scans and manual tests on the pre-production units through 2026-11-12: credentialed vulnerability scan, SRG/STIG spot check, port scan, PKI and maintenance-port sign-in"
      kind: scan
    - date: "2026-11-20"
      description: "Out-brief to the ISSM and the AODR and delivery of the draft SAR"
      kind: out-brief
rules_of_engagement: "Testing only on the pre-production units at the test sites, which feed the test instance of IODS; no testing on live networks or operational traffic without the AO's prior approval. Scans run from the assessor laptop on the enclave-assigned site switch port, and from the maintenance port only with a field technician present. No denial-of-service or exploit testing. The ISSO and the enclave operations desk are notified 48 hours before each scan, and the ISSO may stop any test that affects a unit. Findings go to the ISSM and the AODR and are not fixed during the assessment."
sources: [INT-020.A1, INT-020.A2, INT-020.A3, INT-020.A4, INT-020.A5, INT-020.A6, INT-021.A2, INT-022.A1, INT-022.A2, ART-SSP, product/test-results.md#dt-2]
