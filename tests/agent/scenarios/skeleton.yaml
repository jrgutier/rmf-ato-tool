# Agent-lane scenario (plan §4.4, Phase 3.5): the 12-task walking skeleton on the Example
# Sensor Gateway with the 6-control profile. Validated by framework/schema/scenario.schema.json;
# `rmf run init --scenario` copies the seeds (paths relative to seeds_dir) into the run.
name: skeleton
description: >-
  P-10, P-11, C-1, C-2, C-3, S-1, S-4, A-2, A-3, A-6, R-2 and R-4 on the Example Sensor
  Gateway (6 controls). Out-of-scope producers are replaced by the §7.3 seed set plus ART-REQ
  (an input of C-1 and S-1); ART-PKG is generated by rmf package.
product: tests/agent/products/esg
scope:
  tasks: [P-10, P-11, C-1, C-2, C-3, S-1, S-4, A-2, A-3, A-6, R-2, R-4]
seeds_dir: tests/agent/seeds/esg-skeleton
seeded:
  - {artifact: ART-ORG-CONTEXT, from_task: P-1, path: artifacts/ART-ORG-CONTEXT.md}
  - {artifact: ART-STAKE, from_task: P-9, path: artifacts/ART-STAKE.md}
  - {artifact: ART-INFOTYPES, from_task: P-12, path: artifacts/ART-INFOTYPES.md}
  - {artifact: ART-INFOTYPES, from_task: P-12, path: artifacts/data/infotypes.yaml}
  - {artifact: ART-REQ, from_task: P-15, path: artifacts/ART-REQ.md}
  - {artifact: ART-RA, from_task: P-14, path: artifacts/ART-RA.md}
  - {artifact: ART-BASELINE, from_task: S-2, path: artifacts/data/tailoring.yaml}
  - {artifact: ART-BASELINE, from_task: S-3, path: artifacts/data/allocation.yaml}
  - {artifact: ART-STIG, from_task: I-1, path: artifacts/ART-STIG.md}
  - {artifact: ART-STIG, from_task: I-1, path: artifacts/data/stig-summary.yaml}
  - {artifact: ART-BIA, from_task: P-8, path: artifacts/ART-BIA.md}
  - {artifact: ART-BIA, from_task: P-8, path: artifacts/data/bia.yaml}
  - {artifact: ART-REG, from_task: P-18, path: artifacts/ART-REG.md}
  - {artifact: ART-REG, from_task: P-18, path: artifacts/data/registration.yaml}
entry:
  step: P
  task: P-10
  current_state: RSSPO's organization-level risk context, stakeholders and business impact analysis are given; the system's own Prepare tasks start at asset identification.
  completed: [P-1, P-8, P-9]
  gaps: The system-level Prepare, Categorize, Select, Assess and Authorize tasks in scope are not yet done.
  decision: Enter at P-10 with the organization's context seeded; the tasks outside scope are covered elsewhere.
  notified: [PER-ISSM, PER-PM]
  approved_by: PER-AO
  date: '2026-02-02'
  deficiencies: []
control_subset: [ac-2, au-2, cm-6, ia-2, sc-7, si-2]
hash_globs:
  - AGENTS.md
  - src/**/*.py
  - src/**/*.yaml
  - src/**/*.json
  - src/**/*.j2
  - framework/**/*.yaml
  - framework/schema/*.json
  - playbooks/00-run-protocol.md
  - playbooks/_shared/*.md
  - playbooks/P/P-10.md
  - playbooks/P/P-11.md
  - playbooks/C/C-1.md
  - playbooks/C/C-2.md
  - playbooks/C/C-3.md
  - playbooks/S/S-1.md
  - playbooks/S/S-4.md
  - playbooks/A/A-2.md
  - playbooks/A/A-3.md
  - playbooks/A/A-6.md
  - playbooks/R/R-2.md
  - playbooks/R/R-4.md
  - personas/PER-PM.md
  - personas/PER-ISSM.md
  - personas/PER-ISSO.md
  - personas/PER-ISSE.md
  - personas/PER-IO.md
  - personas/PER-SCA.md
  - personas/PER-AO.md
  - personas/PER-AODR.md
  - personas/PER-DEV.md
  - personas/PER-CCP.md
  - templates/**
  - tests/agent/products/esg/**
  - tests/agent/seeds/esg-skeleton/**
  - tests/agent/prompts/skeleton.md
  - tests/agent/scenarios/skeleton.yaml
