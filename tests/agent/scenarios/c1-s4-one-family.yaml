# Agent-lane scenario (plan §4.4, Phase 8): Categorize and Select (C-1 to S-4) on the Example
# Sensor Gateway for the full AC family. The Prepare outputs it reads are seeded; ART-INV and
# ART-BND are the skeleton run's P-10/P-11 outputs with interview tokens replaced by the
# product anchors those answers were based on (tests/agent/README.md).
name: c1-s4-one-family
description: >-
  C-1, C-2, C-3, S-1, S-2, S-3 and S-4 on the Example Sensor Gateway, baseline restricted to
  the AC family at M/M/L (55 controls): one S-4 family session with real statements.
product: tests/agent/products/esg
scope:
  tasks: [C-1, C-2, C-3, S-1, S-2, S-3, S-4]
seeds_dir: tests/agent/seeds/esg-c1-s4
seeded:
  - {artifact: ART-ORG-CONTEXT, from_task: P-1, path: artifacts/ART-ORG-CONTEXT.md}
  - {artifact: ART-STAKE, from_task: P-9, path: artifacts/ART-STAKE.md}
  - {artifact: ART-INV, from_task: P-10, path: artifacts/ART-INV.md}
  - {artifact: ART-INV, from_task: P-10, path: artifacts/data/inventory.yaml}
  - {artifact: ART-BND, from_task: P-11, path: artifacts/ART-BND.md}
  - {artifact: ART-BND, from_task: P-11, path: artifacts/data/boundary.yaml}
  - {artifact: ART-INFOTYPES, from_task: P-12, path: artifacts/ART-INFOTYPES.md}
  - {artifact: ART-INFOTYPES, from_task: P-12, path: artifacts/data/infotypes.yaml}
  - {artifact: ART-RA, from_task: P-14, path: artifacts/ART-RA.md}
  - {artifact: ART-REQ, from_task: P-15, path: artifacts/ART-REQ.md}
control_subset: [ac-1, ac-2, ac-2.1, ac-2.2, ac-2.3, ac-2.4, ac-2.5, ac-2.7, ac-2.9, ac-2.12,
                 ac-2.13, ac-3, ac-3.4, ac-4, ac-5, ac-6, ac-6.1, ac-6.2, ac-6.5, ac-6.7,
                 ac-6.8, ac-6.9, ac-6.10, ac-7, ac-8, ac-10, ac-11, ac-11.1, ac-12, ac-12.1,
                 ac-12.2, ac-14, ac-16, ac-16.6, ac-16.7, ac-17, ac-17.1, ac-17.2, ac-17.3,
                 ac-17.4, ac-17.6, ac-17.9, ac-18, ac-18.1, ac-18.3, ac-18.4, ac-19, ac-19.5,
                 ac-20, ac-20.1, ac-20.2, ac-20.3, ac-21, ac-22, ac-23]
hash_globs:
  - AGENTS.md
  - framework/**/*.yaml
  - framework/schema/*.json
  - playbooks/00-run-protocol.md
  - playbooks/_shared/*.md
  - playbooks/C/C-1.md
  - playbooks/C/C-2.md
  - playbooks/C/C-3.md
  - playbooks/S/S-1.md
  - playbooks/S/S-2.md
  - playbooks/S/S-3.md
  - playbooks/S/S-4.md
  - personas/*.md
  - templates/**
  - tests/agent/products/esg/**
  - tests/agent/seeds/esg-c1-s4/**
  - tests/agent/prompts/c1-s4-one-family.md
  - tests/agent/scenarios/c1-s4-one-family.yaml
