assumptions:
  - id: ASM-001
    statement: "The fictional naval aviation Component has a Component CIO, a Component CISO, a risk executive function led by the senior accountable official for risk management, and a Component privacy officer serving as senior component official for privacy, each appointed in writing; their holders are recorded by role label only."
    rationale: "The product package names the system-level role holders (stakeholders.md) but supplies no organizational policy, organization chart or appointment letters (EXT-ORG-POLICY) for the Component-level roles that P-1 records."
    task: P-1
    persona: PER-CIO
    tag: ASSUMPTION
    sources: [product/stakeholders.md#roles]
  - id: ASM-002
    statement: "Each appointment, position designation, DCPDS or military personnel record, manpower position, DCWF work role code, written duty statement and qualification status recorded in org-context.yaml is as stated there; none is evidenced by a document in the product package."
    rationale: "stakeholders.md gives holders and organizations but no appointment instruments, position designations, DCWF codes or training records, which OCTX-013 and WFQ-001 require for each cybersecurity position."
    task: P-1
    persona: PER-CIO
    tag: ASSUMPTION
    sources: [product/stakeholders.md#roles]
  - id: ASM-003
    statement: "The Component runs a C-SCRM program led from the Component CISO's office, with a matrixed program office, a chartered council meeting monthly and supply chain risk ownership delegated to each system's AO, as the CIO states in INT-001.A6."
    rationale: "The product package describes the program's suppliers (cloud provider, software factory, CSSP) but no organizational C-SCRM policy or governance, which scrm-org.yaml governance (SCRM-021) records."
    task: P-1
    persona: PER-CIO
    tag: ASSUMPTION
    sources: [product/architecture.md#leveraged]
  - id: ASM-007
    statement: "The Component's continuous monitoring program (established 2024-10-01), its minimum frequencies, reviews, the 2026-03-16 program assessment and its vulnerability management program are as the risk executive and the CISO state them in INT-016 and INT-017."
    rationale: "P-7 reads EXT-ORG-POLICY for the organization-wide ISCM strategy, which the product package does not hold; product/monitoring/ describes only this system's first monitoring cycle."
    task: P-7
    persona: PER-RE
    tag: ASSUMPTION
    sources: [product/README.md#top]
  - id: ASM-004
    statement: "The Component's risk management strategy, risk tolerance and authorization limits, its policies and resources, its privacy program and its check of governing references for later editions are as the CIO, the risk executive and the privacy officer state them in INT-004 to INT-006; the agent did not itself consult any publisher for later editions."
    rationale: "The product package holds no organizational risk management policy (EXT-ORG-POLICY); P-2 must record a concrete strategy, and RCUR-001 asks for a reference-currency check that an offline agent cannot perform."
    task: P-2
    persona: PER-CIO
    tag: ASSUMPTION
    sources: [product/stakeholders.md#governance]
  - id: ASM-005
    statement: "The Component's organization-level risk assessment (last updated 2026-09-30), its five enterprise risks and their ratings, and the threat sources and common vulnerabilities behind them are as the risk executive and the CISO state them in INT-007 and INT-008."
    rationale: "P-3 lists EXT-THREAT as an input, but the product package holds no organization-level threat information for the Prepare step; product/monitoring/ holds only the first monitoring cycle's records, which M-2 reads."
    task: P-3
    persona: PER-RE
    tag: ASSUMPTION
    sources: [product/README.md#top]
  - id: ASM-006
    statement: "Each common control package (plan, assessment report, POA&M) was approved by the AO accountable for those controls on the provider's authorization date and made available to ARSPO on 2026-05-01, at onboarding; each provider's assessor was qualified and chosen by the provider; the CISO designated each provider as a common control provider. In org-context.yaml the persona PER-AO stands for the provider's own accountable AO, and the cloud region's DoD provisional authorization is recorded as AD-ATO."
    rationale: "architecture.md#leveraged gives each provider's decision and date but no package approval, availability date or assessor; the org-context schema has one PER-AO persona and no decision value for a DoD provisional authorization."
    task: P-5
    persona: PER-CISO
    tag: ASSUMPTION
    sources: [product/architecture.md#leveraged]
  - id: ASM-008
    statement: "The boundary, network architecture and data flow diagrams in artifacts/diagrams/ are text drawings the agent made from the product's component, network and flow tables; they show nothing the tables do not state, and the ISSE accepted diagrams drawn that way."
    rationale: "The product package holds no drawn diagrams, which PKG-003 and SUBS-002 require; the session may not add files to the product directory, so the drawings live in the run."
    task: P-11
    persona: PER-ISSE
    tag: ASSUMPTION
    sources: [product/architecture.md#components, product/architecture.md#network, product/data-flows.md#top, INT-025.A4]
  - id: ASM-009
    statement: "Extract files in the landing zone are deleted 7 days after a successful load, report exports and the report cache expire after 30 days, the training extract is replaced and the previous one deleted at each retraining, and supply status history follows the 5-year window, as the PM states in INT-032."
    rationale: "product/privacy.md#minimization gives only the 5-year purge of maintainer PII; the product names no retention for landing files, exports, the report cache or the training extract, which the P-13 life cycle needs for each disposition stage."
    task: P-13
    persona: PER-PM
    tag: ASSUMPTION
    sources: [product/privacy.md#minimization, product/data-flows.md#main]
  - id: ASM-010
    statement: "The program protection plan EFRAS-PPP v1.1, the cybersecurity strategy v1.1 and its approvals and reviews, the acquisition strategy approval, the ERST task order award, the decision point dates and the PM's SCRM actions are as the PM states them in INT-037; the dates of the pathway decision (2025-09-15) and execution entry (2026-03-02) come from the PM and conops.md#program."
    rationale: "P-14 reads EXT-PPP, EXT-CSS and EXT-SEP from the product directory, which holds none of them; protection.yaml, cybersecurity-strategy.yaml and scrm.yaml pm_actions need their content."
    task: P-14
    persona: PER-PM
    tag: ASSUMPTION
    sources: [product/conops.md#program, product/README.md#top]
  - id: ASM-011
    statement: "The PIA review, approval, submission and publication dates in pia.yaml (2027-01-20 to 2027-01-29) are planned dates the privacy officer gave, not events: as of 2026-11-18 the PIA is a draft (v0.9) that neither PER-CISO nor PER-PRIV has reviewed and PER-CIO has not approved."
    rationale: "pia.schema.json requires reviews, an approval with a date, a submission and a publication, and has no way to record a draft PIA; product/conops.md#limitations item 7 discloses that the PIA is not approved."
    task: P-14
    persona: PER-PRIV
    tag: ASSUMPTION
    sources: [product/privacy.md#pia, product/conops.md#limitations, INT-036.A3]
