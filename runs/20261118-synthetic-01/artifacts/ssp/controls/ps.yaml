# artifacts/ssp/controls/ps.yaml (S-4; schema ssp-controls). Written whole.
family: ps
controls:
  - control_id: ps-3
    status: implemented
    statement: "Every user holds a CAC, issued only after a favorable background investigation, and the ISSO provisions no role until the access request shows it. Privileged roles (app-admin, auditor, ERST cloud console roles) need the higher investigation the Component sets for privileged IT access, confirmed by the Component security office before provisioning. All users see maintainer PII, so screening precedes any PII access, as the Privacy Overlay asks. Personnel are enrolled in continuous vetting and are screened again before any move into a privileged role and on adverse information. Screening records stay with the security office and ERST, not in EFRAS."
    responsible_roles: [PER-ISSO, PER-ISSM]
    components: [this-system]
    parameters:
      ps-03_odp.01: "enrolment in continuous vetting; assignment to a privileged role; adverse information reported by the security office"
      ps-03_odp.02: "continuously through continuous vetting, and before each assignment to a privileged role"
    sources: [INT-105.A1, product/architecture.md#identity, INT-075.A2]
  - control_id: ps-4
    status: implemented
    statement: "The out-processing checklist notifies the ISSO and the account managers within 24 hours. The ISSO removes the person's group, which disables the EFRAS account, within one working day for a voluntary and the same day for an involuntary departure, and removes any cloud console role the same day; the security office revokes the CAC and its certificates, and a break-glass key a leaver held is re-registered and resealed. The supervisor's exit briefing covers protecting CUI and maintainer PII after leaving, returning equipment and keeping no export or extract. ERST retrieves the privileged access workstation and any FIDO2 key. The leaver's exports and reports stay in CMP-OBJ, readable by the ISSO and the information owner. Backstops: accounts unused for 35 days are disabled automatically, and the ISSO's quarterly review removes what remains (the 2026-10-06 review removed two accounts of users who had left a pilot squadron; the assessor should test the notice timing)."
    responsible_roles: [PER-ISSO, PER-ISSM]
    components: [this-system]
    parameters:
      ps-04_odp.01: "if voluntary, within 1 working day; if involuntary, the same day as termination"
      ps-04_odp.02: "protecting CUI and maintainer PII after departure, returning equipment and FIDO2 keys, and keeping no export or extract"
    sources: [INT-105.A2, INT-086.A1, product/architecture.md#identity, product/test-results.md#account-review]
