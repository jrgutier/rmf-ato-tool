# artifacts/ssp/controls/at.yaml (S-4; schema ssp-controls). Written whole.
family: at
controls:
  - control_id: at-2
    status: implemented
    statement: "Hybrid. The Component privacy office provides the annual privacy training, updates its content annually and after a Component breach, and keeps the completion records; the Component provides the annual DoD cyber awareness course. Every EFRAS user completes both before an account is created and annually after (ac-2 disables accounts whose privacy training lapses). EFRAS adds its own awareness: a sign-in banner on CUI and PII handling, a notice in each release note when a change affects export handling, and a quarterly export-handling reminder to officers and analysts. The ISSM adds lessons from any EFRAS incident to these notices."
    responsible_roles: [PER-ISSM, PER-PRIV]
    components: [this-system]
    inherited_from: "Component privacy office"
    parameters:
      at-02_odp.01: "annually"
      at-02_odp.02: "annually"
      at-02_odp.03: "a system change that affects how users handle CUI, PII or exports"
      at-02_odp.04: "a system change that affects how users handle CUI, PII or exports"
      at-02_odp.05: "sign-in banner, release-note notices and a quarterly export-handling reminder"
      at-02_odp.06: "annually"
      at-02_odp.07: "a security or privacy incident or breach"
    assurance:
      addressed: "Completion records from the Component training system and the privacy office, and the banner and reminders on file, are the evidence; the assessor samples them against the account list."
      status: satisfied
    sources: [INT-088.A1, INT-089.A1, INT-080.A2, ART-ORG-CONTEXT]
  - control_id: at-3
    status: implemented
    statement: "Role-based training goes to the six cloud operations engineers, the four application administrators, the ISSO and the three data scientists (for the sandbox). Each takes the Component's privileged user training and the EFRAS runbook walk-through before receiving privileges, annually after that, and again when a release changes their duties. Cybersecurity workforce members keep the qualification of their DCWF work role. The ISSM updates the walk-through annually and after an incident or a major release."
    responsible_roles: [PER-ISSM]
    components: [this-system]
    parameters:
      at-03_odp.01: "cloud operations engineers, application administrators, the ISSO and data scientists"
      at-03_odp.02: "cloud operations engineers, application administrators, the ISSO and data scientists"
      at-03_odp.03: "annually"
      at-03_odp.04: "annually"
      at-03_odp.05: "an incident or a major release"
    assurance:
      addressed: "Training completion records and the walk-through attendance list are kept by the ISSM; the assessor compares them with the privileged account list."
      status: satisfied
    sources: [INT-088.A2, ART-ORG-CONTEXT]
