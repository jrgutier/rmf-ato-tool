engineering:
  practices:
    - {area: cybersecurity, stages: [design, test, manufacture, sustainment], practice: "Threat modeling at design; SAST, dependency, image scans and DAST in the pipeline; signed, SBOM-tagged image builds; monthly node rolls and patching", principles: [least-privilege, defense-in-depth], sources: [INT-046.A3]}
    - {area: cyber-resilience, stages: [design, test, manufacture, sustainment], practice: "Three-tier segmentation and database standby; restore tests; immutable images rebuilt from source; backup and point-in-time restore", principles: [domain-separation, protective-recovery], sources: [INT-046.A3]}
    - {area: cyber-survivability, stages: [design, test, manufacture, sustainment], practice: "ECAP-only ingress and egress allow-list; developmental test event and penetration test; reproducible builds; CSSP monitoring", principles: [protective-defaults, defense-in-depth], sources: [INT-046.A3]}
    - {area: program-protection, stages: [design, sustainment], practice: "PPP countermeasures CM-001 (factory gates, signed images, SBOMs) and CM-002 (boundary hardening)", sources: [INT-046.A3, ART-RA]}
    - {area: privacy-engineering, stages: [design, test, sustainment], practice: "Pseudonymization and minimization of exports and the training extract, with re-identification tests", principles: [least-sharing], sources: [INT-046.A3, INT-043.A1]}
  assurance:
    level: "Moderate: automated evidence from the software factory gates on each release, not formal methods"
    commensurate_with:
      technology: "Mature managed cloud services and containers"
      program: "Software pathway program with three-week releases"
      system: "Moderate-impact system holding CUI and PII"
      mission: "Decision support with a 72-hour outage tolerance and no mission-critical function in the BIA"
    requirements: [REQ-07, REQ-13]
  sources: [INT-046.A3]
privacy_act:
  - rule: direct-collection
    applies: false
    reason: "EFRAS collects nothing from individuals; all PII arrives in the EMIS extract and EMIS is the collecting system."
    sources: [INT-043.A2, product/privacy.md#pii]
  - rule: disclosure-bar
    applies: true
    requirements: [REQ-15]
    sources: [INT-043.A2]
  - rule: first-amendment
    applies: true
    requirements: [REQ-15]
    sources: [INT-043.A2]
  - rule: access-appeals
    applies: true
    requirements: [REQ-15]
    sources: [INT-043.A2]
  - rule: rules-of-conduct
    applies: true
    requirements: [REQ-15]
    sources: [INT-043.A2]
  - rule: contract-provisions
    applies: true
    requirements: [REQ-15]
    sources: [INT-043.A2]
