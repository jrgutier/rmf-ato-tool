form: DD-2930
assessment:
  conformance: "Handling follows DoD 5400.11-R, DoDI 5400.16 and DoDI 5015.02; the records are covered by published Component SORNs; no Privacy Act statement is needed because nothing is collected from individuals."
  need: "Maintainer identity, rate or rank, qualifications and work center are needed to show qualification coverage per work center and to join maintenance actions to people; electronic form follows from the EMIS source."
  risks: "Re-identification of pseudonymized exports and the training extract (demonstrated in PT-2), exposure of maintainer records in a breach, and alteration showing a maintainer unqualified."
  effects: "Phishing and identity misuse, embarrassment over qualification gaps, and wrong work-center decisions about individuals."
  protections: "CAC sign-in, squadron scoping, encryption at rest with program keys, audit of exports, 5-year purge; salted rotated pseudonyms and export retention planned for release 1.6 (open item from the privacy office)."
  alternatives: "Dropping the DoD ID number from exports, aggregating qualification coverage before export, and keeping the training extract inside the database were examined; salted rotated pseudonyms were chosen."
