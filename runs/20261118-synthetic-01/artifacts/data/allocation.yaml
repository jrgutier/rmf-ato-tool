# artifacts/data/allocation.yaml (S-3; schema framework/schema/allocation.schema.json).
# Written whole, one record per baseline control (50). Provider names are exactly the
# org-context.yaml common_controls provided_by strings (MLEV-001), plus the Component privacy
# office (program-level privacy controls, ART-ORG-CONTEXT). REQ-11 and REQ-12 are traced to
# sa-11: no control in the set (and, for REQ-12, none in the catalog) implements them, and the
# trace means "verified through developer test and evaluation, outside the control set"
# (INT-084.A4; TLR-009 has no other way to say so). REQ-17 to REQ-19 are traced in ART-BASELINE prose only: ART-REQ lists them in
# one table row "REQ-17 to REQ-19", which TLR-009 does not read as requirement IDs.
