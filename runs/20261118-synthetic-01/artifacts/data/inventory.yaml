asset_management_system:
  name: "Component IT asset management repository (fictional)"
  record: "EFRAS-PROD, updated by the pipeline from the infrastructure templates at each release"
hva:
  designated: false
  basis: "Decision support only: an outage grounds no aircraft, squadrons fall back to EMIS reports within the 72-hour tolerance, and the Component has not listed EFRAS as a high-value asset (INT-024.A4)."
asset_scope:
  - class: physical-environmental
    considered: true
    rationale: "No program-owned hardware; data center protection is inherited from the cloud provider's IL4 provisional authorization, and the privileged access workstations sit in ARSPO controlled space on the Component workstation inventory (INT-023.A3)."
  - class: human
    considered: true
    rationale: "Application administrators, cloud operations engineers and data scientists hold privileged or sandbox access whose loss or misuse affects the service (INT-024.A4)."
  - class: technology
    considered: true
    rationale: "The cloud services, cluster and database the program configures are the technology base of the service (INT-023.A1)."
  - class: mission-business-processes
    considered: true
    rationale: "Daily readiness reporting, part failure forecasting and fleet analysis (BP-01 to BP-03) are the processes the system supports (INT-024.A4)."
  - class: information-data
    considered: true
    rationale: "Maintenance and readiness data, supply status, maintainer PII, forecasts and audit records are the information the system holds (INT-024.A1)."
  - class: firmware
    considered: false
    rationale: "The program owns no hardware and so no firmware; server and storage firmware are the provider's and inherited from its IL4 provisional authorization (INT-023.A3)."
  - class: software
    considered: true
    rationale: "Five program-built containers, the factory base image and two tracked open-source libraries (INT-023.A1, INT-023.A2)."
  - class: services
    considered: true
    rationale: "Managed load balancer, Kubernetes, database, storage, keys, logging and notebook services configured by the program (INT-023.A1)."
  - class: reputation
    considered: true
    rationale: "Commanders' trust in the readiness figures and the program's standing with the fleet (INT-024.A4)."
  - class: privacy-interests
    considered: true
    rationale: "About 30,000 maintainers whose records arrive in the EMIS extract (INT-024.A4)."
assets:
  - id: AST-001
    class: mission-business-processes
    description: "Daily readiness reporting for squadron, air wing and fleet (BP-01)"
    priority: high
    basis: "Primary mission use; a 72-hour outage tolerance before fleet reporting falls back to manual EMIS reports; CUI."
    sources: [INT-024.A1, INT-024.A4, ART-BIA]
  - id: AST-002
    class: mission-business-processes
    description: "Part failure forecasting and fleet readiness analysis (BP-02, BP-03)"
    priority: moderate
    basis: "Supports early part orders and analysis; losing it delays decisions but grounds no aircraft."
    sources: [INT-024.A1, ART-BIA]
  - id: AST-003
    class: information-data
    description: "Maintenance and readiness data, supply status, forecasts and reports (CUI)"
    priority: high
    basis: "CUI whose aggregation reveals fleet readiness trends and whose tampering misleads the fleet; integrity first."
    sources: [INT-024.A1, product/conops.md#information]
  - id: AST-004
    class: privacy-interests
    description: "Maintainer PII (name, DoD ID number, rate or rank, qualifications, work center) for about 30,000 people"
    priority: high
    basis: "Disclosure enables phishing and identity misuse; the de-identified exports are re-identifiable until release 1.6."
    sources: [INT-024.A4, product/privacy.md#pii, product/conops.md#limitations]
  - id: AST-005
    class: information-data
    description: "Audit records of users and administrators"
    priority: moderate
    basis: "Needed for accountability and incident response; held 90 days in the log store and one year at ECSSP."
    sources: [INT-024.A1, product/architecture.md#logging]
  - id: AST-006
    class: human
    description: "Privileged staff: application administrators (4), cloud operations engineers (6), data scientists (3)"
    priority: moderate
    basis: "Few people with broad access; misuse or loss of their credentials reaches the data path."
    sources: [INT-024.A4, product/conops.md#users]
  - id: AST-007
    class: reputation
    description: "Commanders' trust in the readiness figures and the program's standing with the fleet"
    priority: moderate
    basis: "A privacy breach or wrong readiness figures would cost more standing than an outage."
    sources: [INT-024.A4]
