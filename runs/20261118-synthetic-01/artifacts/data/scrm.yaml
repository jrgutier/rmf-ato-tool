assessments:
  - id: SA-01
    supplier: SUP-01
    conducted_by:
      points_of_contact: [PER-ISSM, PER-PM]
      non_federal_support: []
    date: "2026-11-18"
    temporal_findings:
      - "No change of ownership of ERST as of 2026-11-18; re-checked at each annual review."
      - "The software factory ERST builds on carries an open POA&M of its own provider authorization."
    source_profile:
      legal_name: "Example Readiness Software Team (fictional)"
      domicile: "Domestic; fictional address on the shared contract vehicle record"
      identifiers:
        - "Fictional unique entity identifier on the shared development vehicle"
      family_tree: "No parent or subsidiary companies"
    covered_articles:
      - item: INV-004
        name: "efras-ingest"
        identifier: "1.5.0"
        description: "Nightly ingest worker container; pulls EMIS and supply extracts, validates and loads the database"
      - item: INV-003
        name: "efras-api"
        identifier: "1.5.0"
        description: "Readiness API container serving the data the ingest loads"
    purpose:
      life_cycle_phase: "Software pathway execution phase, before the first production authorization"
      context: "Supplier of CF-01, the function scrm.yaml records because its schema requires an entry (ASM-012); assessed as a critical supplier for that reason."
    methodology:
      reference: "Component C-SCRM program office SCRA methodology, mapped to SP 800-161 Rev. 1 Appendix E Table 28 and the SCRSS of Table 29"
      deviations: []
    factors:
      - factor: purpose
        status: assessed
        finding: "Develops and maintains the five EFRAS containers under the ERST task order."
        agency_factor: "Purpose of the procurement"
        sources: [INT-040.A1, INT-037.A4]
      - factor: criticality
        status: assessed
        finding: "Supplies INV-004, which performs CF-01; rated critical for the record (ASM-012)."
        agency_factor: "Criticality to the system"
        sources: [INT-039.A1, ASM-012]
      - factor: information-and-data
        status: assessed
        finding: "ERST staff reach CUI readiness data and maintainer PII through the administration path and the sandbox extract."
        agency_factor: "Access to agency information"
        sources: [INT-040.A1, product/hw-sw-inventory.md#items]
      - factor: reliance
        status: assessed
        finding: "High dependence: a single development team with no second source."
        agency_factor: "Dependence on the source"
        sources: [INT-040.A1]
      - factor: operational-environment
        status: assessed
        finding: "Builds only on the authorized software factory; deploys through the factory pipeline to the EFRAS cluster."
        agency_factor: "Operating environment"
        sources: [INT-040.A1]
      - factor: external-interdependencies
        status: assessed
        finding: "Depends on the software factory and on open-source components (INV-015, INV-016)."
        agency_factor: "External dependencies"
        sources: [INT-040.A1, INT-038.A2]
      - factor: functionality
        status: assessed
        finding: "The containers do what the ConOps describes; no undocumented functions found in factory scans."
        agency_factor: "Functionality of the article"
        sources: [INT-040.A1, INT-038.A2]
      - factor: company-information
        status: assessed
        finding: "Domestic firm, no parent company, prime on the shared development vehicle."
        agency_factor: "Company profile"
        sources: [INT-040.A1]
      - factor: quality-past-performance
        status: assessed
        finding: "No reported performance problems or intrusions."
        agency_factor: "Past performance"
        sources: [INT-040.A1]
      - factor: personnel
        status: assessed
        finding: "Staff hold favorable background investigations."
        agency_factor: "Personnel security"
        sources: [INT-040.A1]
      - factor: physical
        status: assessed
        finding: "No program hardware; development happens in the software factory, which is separately authorized."
        agency_factor: "Physical security"
        sources: [INT-040.A1]
      - factor: geopolitical
        status: assessed
        finding: "Domestic operations only; no foreign locations found."
        agency_factor: "Geopolitical exposure"
        sources: [INT-040.A1]
      - factor: foci
        status: assessed
        finding: "Searches of public FOCI information found no foreign ownership, control or influence."
        agency_factor: "Foreign ownership, control or influence"
        sources: [INT-040.A1]
      - factor: compliance-legal
        status: assessed
        finding: "No exclusion, debarment or legal action found."
        agency_factor: "Compliance and legal"
        sources: [INT-040.A1]
      - factor: fraud-corruption-sanctions
        status: assessed
        finding: "Exclusion and sanctions list searches found nothing."
        agency_factor: "Fraud, corruption and sanctions"
        sources: [INT-040.A1]
      - factor: cybersecurity
        status: assessed
        finding: "Secure development attestation signed at release 1.5.0; no reported intrusions."
        agency_factor: "Cybersecurity posture"
        sources: [INT-040.A1, INT-023.A5]
      - factor: counterfeit-nonconforming
        status: assessed
        finding: "Signed images and SBOMs make substituted or tampered builds detectable at admission."
        agency_factor: "Counterfeit and non-conforming products"
        sources: [INT-039.A2]
      - factor: supply-chain-relationships
        status: assessed
        finding: "Relies on the software factory and two open-source projects; no subcontractors."
        agency_factor: "Supply chain relationships"
        sources: [INT-040.A1, INT-038.A2]
    findings:
      summary: "Domestic sole developer with a clean record, building on the authorized factory; the main concern is reliance on one source."
      analysis: "No adversarial indicator in ownership, sanctions, intrusions or personnel; the dependence on a single team is a continuity concern, not a threat."
      rationale: "Low risk: no adversarial indicator, and the reliance is offset by the factory pipeline and code held in the program's repository."
      threat_type: non-adversarial
      assumptions:
        - "Public and Component sources searched are complete as of 2026-11-18."
        - "CF-01 is recorded for the schema, not because the BIA rates it mission-critical (ASM-012)."
      confidence: moderate
    impact: "Loss of ERST would delay releases and fixes; it would not stop the running service, which squadrons can do without for 72 hours."
    tolerance: within-tolerance
    severity:
      level: 1
      agency_score: "Low"
      explanation: "Agency low or moderate risk: nothing adversarial and not high, so it is managed within the program's C-SCRM process."
    escalation:
      legal_counsel: false
      fasc: none
    response: accept
    review:
      reviewed_by: [PER-ISSM, PER-PM]
      senior_leadership: false
      legal_counsel: false
    handling:
      marking: "CUI"
      retention: "Six years in the C-SCRM program office repository"
      dissemination: "AO, AODR and the C-SCRM program office only"
    sources: [INT-040.A1, INT-040.A2, ASM-012]
