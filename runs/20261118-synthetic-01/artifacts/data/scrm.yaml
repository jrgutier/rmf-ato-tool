criticality:
  method: "Criticality analysis in the PPP (EFRAS-PPP v1.1) against the business impact analysis: a function is mission critical when its loss would degrade a mission-essential function, and EFRAS has none, since every business process tolerates at least 72 hours and squadrons fall back to EMIS. Because this record must name at least one function, it names the program's most important function, CF-01, and treats the suppliers of its items as critical (ASM-012)."
  functions:
    - id: CF-01
      function: "Nightly ingest of the EMIS and supply extracts and the integrity of the readiness data it loads; the program's most important function, recorded because the schema requires an entry, not because the BIA rates it mission-critical (ASM-012)"
      items: [INV-004, INV-008, INV-010]
      assurance: "Software assurance through the authorized software factory pipeline: static and dependency scans, SBOM, signed images verified at admission and the ERST secure development attestation; platform assurance inherited from the cloud provider's IL4 provisional authorization."
      sources: [INT-039.A1, INT-039.A2, ASM-012]
  focal_point:
    threat_analysis: requested
    guidance: "Interim guidance of the Component TSN focal point: keep the factory gates and signed images, rely on the cloud provider's authorization for its hardware and data center supply chain, and flag any change of ownership of ERST or the cloud provider; the DIA SCRM TAC report has not come back."
    sources: [INT-039.A2, ASM-012]
  tsn:
    - criticality-analysis
    - all-source-threat-assessment
    - software-assurance
    - hardware-assurance
    - procurement-strategies
    - anti-counterfeit
    - scrm-countermeasures
    - cyber-test-and-evaluation
  sources: [INT-037.A3, INT-037.A5, INT-039.A1, INT-039.A2, ART-BIA, ASM-012]
