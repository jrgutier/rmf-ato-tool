purpose:
  statement: "Initial system-level security and privacy risk assessment of the EFRAS production environment, producing the threats, vulnerabilities, likelihood, impact and resulting risks that categorization, control selection and tailoring, the POA&M and the authorization decision before MVCR deployment rely on."
  decisions: ["security categorization (C-2)", "control selection and tailoring (S-1, S-2)", "POA&M priorities (A-6)", "authorization decision (R-2 to R-4)"]
  kind: initial
date: "2026-11-18"
team:
  - name: "ARSPO ISSM"
    persona: PER-ISSM
    role: "assessment lead"
    contact: "issm.arspo@example.mil (fictional)"
  - name: "ERST security engineer"
    persona: PER-ISSE
    role: "architecture and threat event analysis"
    contact: "issm.arspo@example.mil (fictional)"
  - name: "EFRAS ISSO"
    persona: PER-ISSO
    role: "operational weaknesses and workarounds"
    contact: "issm.arspo@example.mil (fictional)"
  - name: "Component privacy officer"
    persona: PER-PRIV
    role: "privacy risk assessment"
    contact: "issm.arspo@example.mil (fictional)"
rationales:
  - decision: "PT-1 (cross-air-wing export) is not carried as a current vulnerability"
    rationale: "Fixed in release 1.5.1 on 2026-11-07 and retested pass on 2026-11-10 (INT-034.A3)."
  - decision: "Borderline ratings rounded up when the event touches personal data, down otherwise"
    rationale: "The Component tolerance for harm to individuals is low, lower than for operations (INT-034.A5)."
tailoring: []
point_of_contact:
  persona: PER-ISSM
  name: "ARSPO ISSM"
  phone: "555-0100 (fictional)"
  email: issm.arspo@example.mil
scope:
  applicability: "Tier 3: the EFRAS production boundary EFRAS-BND-1 and its connections; organization-level risks come from ART-ORG-CONTEXT."
  time_frame: "One year, or until a major release or a change in threat, whichever comes first."
  architecture: "Containerized application in a program-owned account of a commercial IL4 cloud region, reached only over NIPRNet through the ECAP, deployed by a separately authorized software factory."
assumptions:
  - "The cloud region, access point, identity broker, software factory and CSSP keep their authorizations or agreements in force."
  - "The ECAP and ECSSP keep providing boundary protection and monitoring."
  - "The Component naval aviation cyber threat assessment describes the adversaries relevant to readiness data."
constraints:
  - "No program-specific intelligence threat product exists; only the Component assessment."
  - "Tests ran in pre-production with synthetic data built from the production templates."
information_sources:
  - id: SRC-01
    kind: threat
    title: "Component naval aviation cyber threat assessment (Intelligence Community product, fictional)"
    provider: "Component intelligence office"
    date: "2026-07-15"
    sources: [INT-034.A2]
  - id: SRC-02
    kind: threat
    title: "ECSSP threat alerts"
    provider: "Example Cybersecurity Service Provider"
    date: "2026-11-01"
    sources: [INT-034.A2]
  - id: SRC-03
    kind: vulnerability
    title: "Pipeline security gates of release 1.5.0, STIG scan and penetration test"
    provider: "Example Software Factory, SCA, Component red team"
    date: "2026-10-31"
    sources: [INT-034.A2, product/test-results.md#pipeline-1-5, product/test-results.md#stig-scan, product/test-results.md#pentest]
  - id: SRC-04
    kind: vulnerability
    title: "Known limitations list"
    provider: "ARSPO"
    date: "2026-11-18"
    sources: [product/conops.md#limitations]
  - id: SRC-05
    kind: impact
    title: "Business impact analysis and information owners' impact levels"
    provider: "ARSPO, fleet maintenance data steward, supply status owner"
    date: "2026-11-18"
    sources: [ART-BIA, ART-INFOTYPES]
consultations:
  - professional: "Cyber threat analyst"
    organization: "Component intelligence office"
    date: "2026-08-04"
    sources: [INT-034.A2]
  - professional: "Program security officer (counterintelligence)"
    organization: "ARSPO"
    date: "2026-08-04"
    sources: [INT-034.A2]
risk_model:
  defined_in: risk-management-strategy
  factors: [threat, vulnerability, impact, likelihood, predisposing-condition]
  scales:
    likelihood: "SP 800-30 Table G-5 (five levels)"
    impact: "SP 800-30 Table H-3 (five levels)"
    risk: "SP 800-30 Table I-2 (five levels)"
  assessment_approach: semi-quantitative
  analysis_approach: threat-oriented
  combination: "Likelihood of initiation or occurrence and likelihood of adverse impact combine by Table G-5; overall likelihood and impact combine into risk by Table I-2."
  time_period: "One year"
  rationale: "The Component risk assessment guidance prescribes SP 800-30 semi-quantitative, threat-oriented assessment with a one-year horizon (ART-ORG-CONTEXT)."
risk_tolerance:
  statement: "The AO accepts risk up to moderate to mission operations and organizational assets and low to individuals; high or very high needs the Component CIO's concurrence."
  consequences: ["loss of confidentiality of aggregated readiness data", "harm to maintainers from exposure of their records", "misleading readiness figures", "delayed fleet readiness reporting"]
  tiers:
    - tier: 1
      tolerance: "Moderate for mission operations and organizational assets; low for individuals, other organizations and the Nation."
      sources: [ART-ORG-CONTEXT]
  operational: "No USCYBERCOM or NSA/CSS cyber operational risk tolerance specific to EFRAS was issued; the Component tolerance applies (ASM-004)."
