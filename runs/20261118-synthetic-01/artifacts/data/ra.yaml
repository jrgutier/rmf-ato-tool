system_risk:
  level: moderate
  set_by: TE-01
  rationale: "The most severe threat to any component is nation-state exfiltration from the database through the API (TE-01, moderate); no event, connection or supply chain record is rated above moderate."
  sources: [INT-035.A2, INT-034.A4]
prioritization:
  method: "Among risks of the same level, those that harm individuals or the fleet's trust immediately come first, then integrity of readiness figures, then risks whose harm is in the future (retention, failover)."
  factors: [immediate-impact, future-impact, coupling]
  borderline: "Borderline values rounded up when the event touches personal data, down otherwise; uncertainty stated per event."
  order: [TE-02, TE-01, TE-04, TE-08, TE-05, TE-03, TE-07, TE-06]
  couplings:
    - events: [TE-01, TE-02]
      effect: increases
      note: "Exfiltrated pseudonymized records become named records."
communication:
  recipients: [PER-AO, PER-AODR, PER-PM]
  method: risk-assessment-report
  shared: [source-information, intermediate-results, supporting-evidence]
  policy: "Shared inside the Component under CUI marking; to the CIO and risk board on request."
ai_capabilities:
  - name: "Part-failure forecast model v3 (CMP-FORECAST)"
    use_case_risks: "A wrong forecast orders parts for nothing or misses a failure; mitigated by advisory-only use, officers decide in EMIS."
    benchmarks:
      - metric: "precision and recall on a held-out year of data"
        standard: "program model test plan acceptance thresholds, with the DoD responsible AI toolkit checklist"
    verified_before_deployment: "Measured against the acceptance thresholds before v3 entered pre-production."
    monitoring: "Weekly precision against actual removals; a drop below threshold opens a retraining ticket."
    bias:
      minimization: "Training covers every aircraft type with at least one year of data."
      detection: "Performance checked per aircraft type at each retrain."
      notification: "Weak forecasts per type are named in the release notes to maintenance officers."
components:
  - name: "example-imagelib 2.9.1"
    kind: open-source
    factors:
      support: "Active maintainer group with a public security policy"
      distribution_integrity: "Maintainer-signed releases pulled through the factory mirror with checksums"
      sub_components: "Bundles two codec sub-libraries"
      developer_practices: "Fixed both high findings upstream promptly"
      integrity_mechanisms: "Signature and checksum verification in the pipeline"
      adversarial_control: "No foreign adversary control found by the factory's provenance checks"
    open_source: {governance: "Maintainer group with documented release process", community: "Widely used, active contributors", license: "Permissive; reviewed by ARSPO counsel"}
    validation: {outcome: none-available}
    suitable: true
  - name: "example web framework 4.2"
    kind: open-source
    factors:
      support: "Long-term support to 2028"
      distribution_integrity: "Signed releases"
      sub_components: "Standard dependency set listed in the SBOM"
      developer_practices: "Published security process"
      integrity_mechanisms: "Signature verification in the pipeline"
      adversarial_control: "Foundation-governed; no adversary control found"
    open_source: {governance: "Foundation governance", community: "Large active community", license: "Permissive; reviewed by ARSPO counsel"}
    validation: {outcome: none-available}
    suitable: true
  - name: "sf-base-minimal 2026.09"
    kind: gots
    factors:
      support: "Software factory, monthly rebuilds"
      distribution_integrity: "Signed by the factory"
      sub_components: "Minimal OS packages listed in the factory SBOM"
      developer_practices: "Factory hardening under its own ATO"
      integrity_mechanisms: "Signature verified at admission"
      adversarial_control: "Government-controlled build"
    validation: {outcome: none-available}
    suitable: true
executive_summary: "EFRAS carries moderate system risk, within the AO's tolerance for operations but at the edge of the low tolerance for individuals. The two moderate risks are re-identification of maintainers from exports (demonstrated, fix in release 1.6) and nation-state exfiltration of aggregated readiness data. Recommendations: deliver salted pseudonyms and an export retention rule in 1.6, pick up the imagelib fix in 1.5.2, sign the EMIS agreement, exercise failover, extend audit retention and approve the PIA before MVCR deployment."
privacy:
  processing: "Bulk ingest of about 30,000 maintainers' records from EMIS, kept five years, used to show qualifications and join actions to people, shared pseudonymized with analysts and data scientists; user identifiers in audit records."
  impact_on_individuals: "Exposure of an export exposes named people (re-identification demonstrated): phishing, identity misuse, embarrassment over qualification gaps; altered records could show a maintainer unqualified. Rated moderate until salted pseudonyms ship."
  legal_requirements:
    - authority: OMB-A-130
      applies: true
      reason: "EFRAS is a federal information system processing PII."
      beyond_baseline: ["Effective de-identification before data is treated as non-PII (Appendix II): salted, rotated pseudonyms in release 1.6", "Minimization review of analyst exports with the privacy office before release 1.6"]
      requirements: [REQ-14]
      sources: [INT-036.A2]
    - authority: PRIVACY-ACT
      applies: true
