        asset: "INF-05 audit records"
    impact: low
    risk: low
    uncertainty: "Low."
    sources: [INT-035.A1, product/architecture.md#logging]
  - id: TE-08
    description: "Data scientist or malicious package moves the training extract out through the sandbox's outbound path."
    threat_sources: [TS-03]
