threat_events:
  - id: TE-01
    description: "Nation-state actor exploits the web application or API to reach the database and exfiltrate aggregated readiness data and maintainer records."
    threat_sources: [TS-01]
    relevance: expected
    vulnerabilities: [VUL-02]
    conditions: [PC-02]
    likelihood_initiation: moderate
    likelihood_impact: moderate
    likelihood: moderate
    likelihood_rationale: "Capable, intent-driven adversary; pipeline gates and the penetration test found no unauthenticated path, but the user population is large."
    impacts:
      - harm: operations
        asset: "INF-01 maintenance and readiness data (CMP-DB, CMP-API)"
      - harm: individuals
        asset: "INF-03 maintainer PII"
    impact: moderate
    risk: moderate
    uncertainty: "Moderate: no program-specific threat product."
    sources: [INT-034.A1, INT-035.A2, product/test-results.md#pentest]
  - id: TE-02
    description: "Re-identification of maintainers from pseudonymized exports or the training extract by anyone holding a list of DoD ID numbers."
    threat_sources: [TS-02, TS-03]
    relevance: confirmed
    vulnerabilities: [VUL-01, VUL-07]
    conditions: []
    likelihood_initiation: moderate
    likelihood_impact: high
    likelihood: moderate
    likelihood_rationale: "Demonstrated by the red team with 50 DoD ID numbers (PT-2); exports leave the system as files."
    impacts:
      - harm: individuals
        asset: "INF-03 maintainer PII in exports and the training extract"
    impact: moderate
    risk: moderate
    uncertainty: "Low: demonstrated."
    sources: [INT-034.A3, INT-036.A1, product/test-results.md#pentest]
  - id: TE-03
    description: "Exploitation of the two high-severity vulnerabilities in example-imagelib through a crafted report rendering request."
    threat_sources: [TS-01]
    relevance: anticipated
    vulnerabilities: [VUL-02]
    conditions: []
    likelihood_initiation: low
    likelihood_impact: moderate
    likelihood: low
    likelihood_rationale: "Reachable only by authenticated users through the report service; fix waits on release 1.5.2."
    impacts:
      - harm: operations
        asset: "CMP-REPORT and INF-04 reports"
    impact: moderate
    risk: low
    uncertainty: "Moderate."
    sources: [INT-034.A3, product/test-results.md#pipeline-1-5]
  - id: TE-04
    description: "Tampered or spoofed maintenance extract over the EMIS interconnection corrupts readiness figures."
    threat_sources: [TS-01]
    relevance: possible
    vulnerabilities: [VUL-03]
    conditions: []
    likelihood_initiation: low
    likelihood_impact: low
    likelihood: low
    likelihood_rationale: "Mutual TLS and the signed, checksummed extract stop tampering in DT-2; the unsigned agreement weakens the governance, not the channel."
    impacts:
      - harm: operations
        asset: "INF-01 integrity"
    impact: moderate
    risk: low
    uncertainty: "Low."
    sources: [INT-034.A3, INT-034.A4, product/test-results.md#dt-2]
  - id: TE-05
    description: "Privileged insider error or misuse of a break-glass or local database account changes configuration or data."
    threat_sources: [TS-03]
    relevance: possible
    vulnerabilities: [VUL-04, VUL-09]
    conditions: []
    likelihood_initiation: low
    likelihood_impact: moderate
    likelihood: low
    likelihood_rationale: "Few privileged staff, sealed and alerted break-glass accounts, hourly drift scan."
    impacts:
      - harm: assets
        asset: "CMP-K8S, CMP-DB configuration"
    impact: moderate
    risk: low
    uncertainty: "Moderate: break-glass opening never rehearsed."
    sources: [INT-035.A1, INT-034.A3, product/test-results.md#stig-scan]
  - id: TE-06
    description: "Outage of the cloud region or a managed service makes EFRAS unavailable beyond the recovery objectives."
    threat_sources: [TS-04]
    relevance: anticipated
    vulnerabilities: [VUL-05]
    conditions: [PC-01]
    likelihood_initiation: low
    likelihood_impact: moderate
    likelihood: low
    likelihood_rationale: "Regional outages are rare; failover is untested."
    impacts:
