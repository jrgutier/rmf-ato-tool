        asset: "BP-01 daily readiness reporting"
    impact: low
    risk: low
    uncertainty: "Moderate."
    sources: [INT-034.A3, product/conops.md#availability]
  - id: TE-07
    description: "An incident older than 90 days cannot be reconstructed from the program's own audit records."
    threat_sources: [TS-01, TS-03]
    relevance: possible
    vulnerabilities: [VUL-06]
    conditions: []
    likelihood_initiation: low
    likelihood_impact: low
    likelihood: low
    likelihood_rationale: "ECSSP keeps a one-year copy; the program depends on retrieving it."
    impacts:
