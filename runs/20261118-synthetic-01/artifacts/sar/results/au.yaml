findings:
  - id: FND-002
    control_id: au-11
    title: "Audit records are retained 90 days, not the one year the tailored control requires"
    description: "AU-11 as tailored requires audit records retained for one year to support after-the-fact investigations and Component retention requirements. The three log stores hold 90 days; the oldest record each returned on query was 90 days old. The CSSP keeps a one-year copy for its own analysis, retrievable by ticket and under a schedule the program does not control. Evidence: log store retention settings and lifecycle rules, the retrieval test, the ISSO and CSSP interviews, the known limitation (conops item 6)."
    status: open
    severity: low
    recommendation: "Add the archive tier (release 1.6) holding one year of records under the program's control; until then record in the CSSP agreement that the CSSP keeps EFRAS records one year and returns them on request within a set time."
    affected_statements: ["AU-11"]
    state_difference: "Expected: one year of audit records under the program's control. Actual: 90 days in the program's stores; days 91 to 365 only in the CSSP's copy."
    potential_compromise: [confidentiality, integrity, privacy]
    sources: [INT-156.A3, INT-157.A1, product/conops.md#limitations]
