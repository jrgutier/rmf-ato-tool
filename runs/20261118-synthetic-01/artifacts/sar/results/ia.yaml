    result: other-than-satisfied
    methods: [examine, interview, test]
    depth: comprehensive
    coverage: comprehensive
    summary: "Tested CAC sign-in through the broker for all five roles and the six console roles (re-performing DT-2), and traced the DoD ID number from the assertion to the session and to every audit event of the test (uniquely tied); refused a sign-in without an approved group. Examined the two break-glass console accounts: they authenticate with FIDO2 keys, not CAC, and a use is tied to a person only by the two-person seal log and the alert; neither has been used. The deviation from the DoD CAC requirement has not been put to the AO. Interviewed the ISSO. The SSP records ia-2 as partial for this reason."
    finding_refs: [FND-012]
    statements:
      - {id: "IA-02[01]", result: other-than-satisfied}
