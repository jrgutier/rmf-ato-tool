    result: other-than-satisfied
    methods: [examine, interview, test]
    depth: comprehensive
    coverage: comprehensive
    summary: "Examined the FIDO2 key issue record (in person against ID, defaults changed at issue), the key service inventory (no long-lived access keys; program keys rotated 2026-03-02), the break-glass database password change record (2026-07-01, inside 180 days) and the seal log; tested that a workload token expires with its session. The local break-glass database role's password complexity falls short of the PostgreSQL STIG rule on both the 2026-10-22 scan and the SCA's 2026-11-23 scan (STG-002, CAT II, fix in release 1.5.2). Interviewed the ISSO."
    finding_refs: [FND-013]
