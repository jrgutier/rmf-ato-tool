      - {id: "CM-02a.[02]", result: satisfied}
      - {id: "CM-02b.01", result: satisfied}
      - {id: "CM-02b.02", result: satisfied}
      - {id: "CM-02b.03", result: satisfied}
    reused: [RR-001]
    sources: [INT-160.A1, product/architecture.md#configuration, product/test-results.md#stig-scan]
  - control_id: cm-3
    result: satisfied
    methods: [examine, interview, test]
    depth: focused
    coverage: focused
