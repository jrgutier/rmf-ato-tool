# artifacts/sar/results/cm.yaml (A-3; schema sar-results). Written whole. Assessor: PER-SCA,
# simulated. RR-001 (SCA-witnessed STIG scan, 2026-10-22) is reused for cm-2 and cm-6 and
# supplemented by the SCA's own scan of release 1.5.1 on 2026-11-23, in pre-production.
# M-2 (2027-02-01): cm-2, cm-3, cm-6 and cm-8 due (cm monthly, cm-2 daily; POAM-006, -007, -008,
# -021 milestones due). Monitoring data only to 2026-11-15 (ASM-026). cm-3 reassessed on the
# 2026-11-04 console change (FND-025, new); the others keep their results.
family: cm
determinations:
  - control_id: cm-2
    result: satisfied
    methods: [examine, interview, test]
    depth: focused
    coverage: focused
    summary: "Examined the version-controlled templates and the 1.5.0 and 1.5.1 manifests of image digests (both releases updated them) and 90 days of hourly drift reports (one manual node label change, reverted the same day); compared 20 deployed resources on CMP-K8S and CMP-DB with the baseline (all matched); reused RR-001 for the node and database settings; interviewed the ISSE. The deployed state assessed is pre-production, built from the same templates as production (F-11-9). M-2 2027-02-01 (data to 2026-11-15): still satisfied. The drift records of 2026-11-01 to 2026-11-15 (360 hourly scans) show the baseline monitored and enforced: the one difference, a console security group change on 2026-11-04, was flagged within the hour and reverted to the baseline by the pipeline. Release 1.6 updated the templates and manifests (CHG-003). No drift record after 2026-11-15 reached the assessor, so the result rests on that fortnight."
    statements:
      - {id: "CM-02a.[01]", result: satisfied}
      - {id: "CM-02a.[02]", result: satisfied}
      - {id: "CM-02b.01", result: satisfied}
      - {id: "CM-02b.02", result: satisfied}
      - {id: "CM-02b.03", result: satisfied}
    reused: [RR-001]
    sources: [INT-160.A1, product/architecture.md#configuration, product/test-results.md#stig-scan, product/monitoring/cycle-2026-11.md#drift, INT-206.A1]
  - control_id: cm-3
    result: other-than-satisfied
    methods: [examine, interview, test]
    depth: focused
    coverage: focused
    summary: "A-3: examined a random sample of 8 of the 23 pull requests merged between releases 1.5.0 and 1.5.1 (each with a second reviewer, a security and privacy impact note, green gates and an ISSE or ISSO sign-off; no emergency change), the CCB minutes of 2026-09 to 2026-11, and the retention of repository and pipeline records; tested that a direct change to the cluster outside the pipeline is reported by the drift scan within the hour; interviewed the ISSE; satisfied. M-2 2027-02-01 (data to 2026-11-15): other-than-satisfied. The drift record shows a configuration-controlled change made on 2026-11-04 from the provider console, outside the pull request, gate and board path, with no emergency change raised: a security group was widened during troubleshooting and was neither reviewed nor approved before it was made. The engineers' console role can still write security groups in both accounts (ISSO). Monitoring of change activity (CM-03f) worked, since the drift scan flagged and the pipeline reverted the change within the hour. Release 1.6 (CHG-003) went through review, test and board approval with its impact analysis. Examined the cycle's drift record and the change log; interviewed the ISSO."
    finding_refs: [FND-025]
    statements:
      - {id: "CM-03a.", result: satisfied}
      - {id: "CM-03b.[01]", result: other-than-satisfied}
      - {id: "CM-03b.[02]", result: other-than-satisfied}
      - {id: "CM-03c.", result: satisfied}
      - {id: "CM-03d.", result: satisfied}
      - {id: "CM-03e.", result: satisfied}
      - {id: "CM-03f.[01]", result: satisfied}
      - {id: "CM-03f.[02]", result: satisfied}
      - {id: "CM-03g.[01]", result: satisfied}
      - {id: "CM-03g.[02]", result: satisfied}
    reused: []
    sources: [INT-160.A1, product/architecture.md#configuration, product/monitoring/cycle-2026-11.md#drift, INT-206.A1, INT-203.A2, ART-CHG]
  - control_id: cm-6
    result: other-than-satisfied
    methods: [examine, interview, test]
    depth: comprehensive
    coverage: comprehensive
    summary: "Reused RR-001 and ran the SCA's authenticated scan of release 1.5.1 on 2026-11-23 over the nodes, the images and the database instance: same result as 2026-10-22, nodes 94% with only provider-managed control plane checks open, database with STG-001 and STG-002 open (program-fixable, release 1.5.2 not yet in pre-production) and STG-003 to STG-006 recorded as the provider's settings under LA-01; no CAT I. Examined ART-STIG and stig-summary.yaml, the drift reports and the change records. The Application Security and Development STIG review of INV-002 to INV-006 (BM-04, 2026-11-24) found no documented secure configuration for the five containers to review against (ASM-021). Interviewed the ISSE and the developer. M-2 2027-02-01 (data to 2026-11-15): not reassessed, result kept. No SCAP STIG scan after 2026-11-23 and no container checklist result reached the assessor; release 1.6 (CHG-003) is said to carry the STG-001 setting and the container baseline check, but nothing the assessor can examine or rescan shows them in place, so FND-007 and FND-008 stay open for the verification COND-05 requires by 2027-03-31."
    finding_refs: [FND-007, FND-008]
    statements:
      - {id: "CM-06a.", result: other-than-satisfied}
      - {id: "CM-06b.", result: other-than-satisfied}
      - {id: "CM-06c.[01]", result: satisfied}
      - {id: "CM-06c.[02]", result: satisfied}
      - {id: "CM-06d.[01]", result: satisfied}
      - {id: "CM-06d.[02]", result: satisfied}
    reused: [RR-001]
    sources: [INT-160.A2, INT-161.A1, ASM-021, ART-STIG, product/test-results.md#stig-scan, INT-206.A2, ASM-026]
  - control_id: cm-8
    result: other-than-satisfied
    methods: [examine, interview, test]
    depth: focused
    coverage: focused
    summary: "Compared 20 deployed resources (nodes, images, database, buckets, keys) with the INV list: every one is listed, none twice, none belonging to another system, with the fields the SSP names. The inventory still records the five containers at 1.5.0 while release 1.5.1 has run in the assessed environment since 2026-11-07, and no review at that release is recorded, although the SSP sets review at every release. Interviewed the ISSE. M-2 2027-02-01: result kept. The inventory now records release 1.6 and which environment runs what, but the record was updated on 2027-02-01, seventeen days after the release of 2027-01-15, with no review dated at the release, and no production deployment is recorded to confirm it against; FND-009 stays open."
    finding_refs: [FND-009]
    statements:
      - {id: "CM-08a.01", result: satisfied}
      - {id: "CM-08a.02", result: satisfied}
      - {id: "CM-08a.03", result: satisfied}
      - {id: "CM-08a.04", result: satisfied}
      - {id: "CM-08a.05", result: satisfied}
      - {id: "CM-08b.", result: other-than-satisfied}
    reused: []
    sources: [INT-160.A3, product/hw-sw-inventory.md#items, ART-INV, INT-206.A2]
findings:
  - id: FND-007
    control_id: cm-6
    title: "Database connection logging verbosity is below the PostgreSQL STIG value (STG-001, CAT II)"
    description: "CM-6 requires the established configuration settings to be implemented. The SCA-witnessed scan of 2026-10-22 and the SCA's scan of release 1.5.1 on 2026-11-23 both show the connection logging verbosity on INV-010 below the PostgreSQL STIG value (STG-001, CAT II). The fix is in release 1.5.2 (2026-12-10), which had not reached pre-production by the scan. Evidence: RR-001, the 2026-11-23 scan, stig-summary.yaml, the ISSE and developer interviews."
    status: open
    severity: moderate
    recommendation: "Deploy release 1.5.2 with the corrected setting, rescan the database and close STG-001 on the scan result."
    affected_statements: ["CM-06b."]
    state_difference: "Expected: the database logs connections at the STIG verbosity. Actual: a lower verbosity, so connection details an investigation needs are not recorded."
    potential_compromise: [confidentiality, integrity]
    sources: [INT-160.A2, INT-161.A1, product/test-results.md#stig-scan, ART-STIG]
    triage:
      action: poam
      decided_by: PER-PM
      significance: moderate
      risk_basis: [ART-RA, INT-177.A1, INT-178.A1]
      rationale: "VUL-09 of the risk assessment (STG-001); the fix is in release 1.5.2, which ships as one with the rebuilt report container and waits on the factory's base image. No new scan exists, so nothing can be reassessed; it goes to the POA&M."
  - id: FND-008
    control_id: cm-6
    title: "No secure configuration is established for the five application containers (Application Security and Development STIG not applied)"
    description: "CM-6 requires configuration settings reflecting the most restrictive mode consistent with operations to be established and documented for the components, using the common secure configurations the SSP names. The five application containers (INV-002 to INV-006), which hold and serve the PII and CUI, have no documented settings against the Application Security and Development STIG; the program never completed the checklist (ASM-019), and the assessor's review on 2026-11-24 had nothing to compare the containers against (ASM-021). The pipeline scans and the factory base image cover vulnerabilities and the base layer, not the application settings. Evidence: stig-summary.yaml BM-04, the developer and ISSE interviews."
    status: open
    severity: moderate
    recommendation: "Complete the Application Security and Development STIG checklist for each of the five containers, document the resulting settings in the baseline, record open items in stig-summary.yaml, and add a pipeline check for the settings that can be automated."
    affected_statements: ["CM-06a."]
    state_difference: "Expected: documented STIG-based settings for every component. Actual: documented for the nodes and the database only; none for the application containers."
    potential_compromise: [confidentiality, integrity, availability, privacy]
    sources: [INT-161.A1, INT-160.A2, ASM-019, ASM-021]
    triage:
      action: poam
      decided_by: PER-PM
      significance: moderate
      risk_basis: [ART-RA, INT-177.A2]
      rationale: "Not in the risk assessment before A-3; five containers need a checklist review and a documented baseline, more than existing resources do in days. Undocumented settings on every container that handles CUI and PII are substantive, so it goes to the POA&M and the risk assessment takes it at R-2."
  - id: FND-009
    control_id: cm-8
    title: "The inventory was not reviewed or updated at release 1.5.1"
    description: "CM-8 as tailored requires the inventory to be reviewed and updated monthly and at every release. Release 1.5.1 reached the assessed environment on 2026-11-07; the inventory still lists the five containers at 1.5.0 and no review at that release is recorded. The monthly review of 2026-11-02 is on file and the inventory is otherwise complete and accurate. Evidence: the INV list, the review records, the ISSE interview."
    status: open
    severity: low
    recommendation: "Review and update the inventory at each release as the SSP states, and record which release each environment runs, so the inventory matches the release deployed to production."
    affected_statements: ["CM-08b."]
    state_difference: "Expected: inventory reviewed and updated at every release. Actual: monthly review only; release 1.5.1 not reflected."
    potential_compromise: [integrity]
    sources: [INT-160.A3, product/hw-sw-inventory.md#items, ART-INV]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A2]
      rationale: "The inventory is otherwise accurate, but the update at each release is a procedure the program must show working at its next release; the system owner does not call it inconsequential, since the CM process rests on the inventory."
  - id: FND-025
    control_id: cm-3
    title: "A configuration-controlled change can be made from the provider console without review or approval"
    description: "CM-3 requires proposed configuration-controlled changes to be reviewed and approved or disapproved with explicit consideration of security and privacy impact analyses. On 2026-11-04 a cloud operations engineer widened a security group from the provider console while troubleshooting, outside the pull request, gate and board path and without raising an emergency change; it was neither reviewed nor approved before it was made. The drift scan flagged it within the hour and the pipeline reverted it, so the monitoring part of CM-3 worked, but the engineers' console role can still write security groups in both accounts, and counseling the team does not remove that path. Found in the first ongoing assessment (M-2, 2027-02-01) on the cycle's drift record, which covers pre-production to 2026-11-15. Evidence: product/monitoring/cycle-2026-11.md#drift, CHG-001, the ISSO interview."
    status: open
    severity: low
    recommendation: "Make the engineers' console role read-only for network and security group settings in both accounts, keep a break-glass path that raises an emergency change and pages the ISSO, and show the change on the next drift record and access review."
    affected_statements: ["CM-03b.[01]", "CM-03b.[02]"]
    state_difference: "Expected: every configuration-controlled change is reviewed and approved before it is made, or raised as an emergency change. Actual: a console change reached the account with neither, and the permission that allowed it remains."
    potential_compromise: [confidentiality, integrity]
    sources: [product/monitoring/cycle-2026-11.md#drift, INT-206.A1, INT-203.A2, ART-CHG]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-209.A1]
      rationale: "Caught and reverted within the hour in an environment holding synthetic data, but the same console permission exists in the production account and the weakness is RSK-004's (configuration outside the baseline); a role change and a break-glass path need a release, so it goes to the POA&M at M-3."
