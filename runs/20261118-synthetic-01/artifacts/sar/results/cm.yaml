    depth: focused
    coverage: focused
    summary: "Examined the version-controlled templates and the 1.5.0 and 1.5.1 manifests of image digests (both releases updated them) and 90 days of hourly drift reports (one manual node label change, reverted the same day); compared 20 deployed resources on CMP-K8S and CMP-DB with the baseline (all matched); reused RR-001 for the node and database settings; interviewed the ISSE. The deployed state assessed is pre-production, built from the same templates as production (F-11-9)."
    statements:
