findings:
  - id: FND-019
    control_id: ra-5
    title: "Two high vulnerabilities in the report container are past the 30-day remediation time"
    description: "RA-5 as specified requires critical and high vulnerabilities to be remediated within 30 days of discovery. The dependency and image scans of 2026-10-20 found two high vulnerabilities in example-imagelib 2.9.1 inside efras-report (CMP-REPORT); the due date of 2026-11-19 passed and the SCA's scan of 2026-11-23 confirmed both. The fix waits on the software factory's hardened base image; release 1.5.2 (planned 2026-12-10) was not verified during the assessment. Evidence: pipeline records, the SCA scan, remediation tickets, the developer's interview, conops limitation 2."
    status: open
    severity: moderate
    recommendation: "Deploy release 1.5.2 with the hardened base image as soon as the factory delivers it and rescan; if the base image slips again, ask the factory for an interim image or isolate the report renderer further, and record the risk decision."
    affected_statements: ["RA-05d."]
    state_difference: "Expected: high vulnerabilities remediated within 30 days. Actual: two highs open since 2026-10-20, past the 2026-11-19 due date."
    potential_compromise: [confidentiality, integrity]
    sources: [INT-172.A1, ASM-024, product/test-results.md#pipeline-1-5, product/conops.md#limitations]
  - id: FND-020
    control_id: ra-8
    title: "No approved privacy impact assessment; development began before the PIA was drafted"
    description: "RA-8 requires a privacy impact assessment before developing information technology that processes PII. EFRAS was developed before the PIA was drafted, and the PIA is still the 0.9 draft with the privacy office, with an open item on the de-identified exports (FND-018). Approval is planned for 2027-01-25, before production data flows. Evidence: ART-PIA, the coordination record, the privacy officer's interview."
    status: open
    severity: low
    recommendation: "Resolve the export item (release 1.6), complete the privacy office review on 2027-01-20 and obtain the CIO's approval before any production data flows; hold production ingest until then."
    affected_statements: ["RA-08a."]
    state_difference: "Expected: an approved PIA before development and before PII is processed. Actual: a draft PIA, after development, approval planned before production."
    potential_compromise: [privacy]
    sources: [INT-171.A3, ART-PIA, product/privacy.md#pia]
