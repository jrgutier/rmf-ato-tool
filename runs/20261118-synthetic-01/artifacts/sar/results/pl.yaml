findings:
  - id: FND-016
    control_id: pl-2
    title: "The plan set's approval condition is open and its privacy risk assessment result is a draft PIA"
    description: "PL-2 requires security and privacy plans that give the results of a privacy risk assessment and are reviewed and approved by the AO or designated representative before implementation. The AODR approved the plan set on 2026-11-18 on the condition that the PM approves the contingency, incident response and configuration management plans by 2026-12-15; none is approved yet (see FND-010 and FND-015). The privacy risk assessment the plans rely on is the 0.9 draft PIA, still with the Component privacy office (see FND-020). Evidence: the approval record, ART-SSP, ART-PIA, the ISSM interview."
    status: open
    severity: low
    recommendation: "Have the PM approve the three plans by 2026-12-15 and record that the AODR's condition is met; replace the draft PIA reference with the approved PIA when the CIO approves it (planned 2027-01-25)."
    affected_statements: ["PL-02a.08[01]", "PL-02a.08[02]", "PL-02a.15[01]"]
    state_difference: "Expected: an approved plan set whose conditions are met, giving an approved privacy risk assessment. Actual: a conditionally approved set with three supporting plans unapproved and a draft PIA."
    potential_compromise: [confidentiality, integrity, availability, privacy]
    sources: [INT-167.A2, ART-SSP, product/privacy.md#pia]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A1, INT-177.A2]
      rationale: "The AODR's condition is met only when the PM approves the three plans on 2026-12-15, and the plan's privacy reference waits on the PIA approval (VUL-07); it goes to the POA&M."
