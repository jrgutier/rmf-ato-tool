findings:
  - id: FND-001
    control_id: ac-2
    title: "Departures do not reach the account manager within 24 hours; leaver accounts stay active until the quarterly review"
    description: "AC-2 as tailored requires account managers to be notified within 24 hours when users are terminated or transferred, accounts to be disabled per that policy, and account management aligned with termination and transfer. The 2026-10-06 review found two accounts of users who had left a pilot squadron still active; they were removed at the review, not on departure. The leaver-timing test of ten leavers (2026-12-01) found no notification time for any of them: the out-processing step relies on an e-mail from the squadron office that was not sent for the two known leavers and is not recorded for the others. Evidence: the account review record, the ISSO interview, the out-processing checklists (ASM-020)."
    status: open
    severity: moderate
    recommendation: "Feed departures and transfers from the squadrons' out-processing into the account manager's queue automatically (or a recorded hand-off with a timestamp), disable the EFRAS account and remove the broker group within 24 hours, and check leaver timing in each quarterly review until production."
    affected_statements: ["AC-02f.[04]", "AC-02h.02", "AC-02l.[01]", "AC-02l.[02]"]
    state_difference: "Expected: a leaver's account is disabled within 24 hours of departure. Actual: leavers keep access until the 35-day inactivity disable or the next quarterly review, whichever comes first."
    potential_compromise: [confidentiality, privacy]
    sources: [INT-152.A3, ASM-020, product/test-results.md#account-review]
    triage:
      action: poam
      decided_by: PER-PM
      significance: moderate
      risk_basis: [ART-RA, INT-177.A2]
      rationale: "Not fixed during the assessment; the leaver step needs the squadrons' agreement, which existing resources cannot settle in days. Leavers keep access to maintainer PII, the confidentiality and privacy harm the risk assessment weighs first, so it is substantive and goes to the POA&M."
