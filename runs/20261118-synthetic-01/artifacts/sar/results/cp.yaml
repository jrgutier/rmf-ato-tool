findings:
  - id: FND-010
    control_id: cp-2
    title: "The contingency plan is a draft: not reviewed or approved by the PM, not distributed, not under review"
    description: "CP-2 as tailored requires the contingency plan to be reviewed and approved by the PM, distributed to the on-call engineers, the ISSO, the ISSM, EMIS and the CSSP, reviewed annually and its changes communicated to them. The version 1.0 draft covers the content the control requires, but has no review or approval, has gone to nobody outside the program repository, and no review or change communication has happened. Evidence: ART-CP, the repository, the ISSE interview; the S-6 approval sets a PM approval date of 2026-12-15."
    status: open
    severity: low
    recommendation: "Have the PM review and approve the plan by 2026-12-15, distribute it to the named personnel and to EMIS and the CSSP, and record the annual review date."
    affected_statements: ["CP-02a.07[01]", "CP-02a.07[02]", "CP-02b.[01]", "CP-02b.[02]", "CP-02d.", "CP-02f.[01]", "CP-02f.[02]"]
    state_difference: "Expected: an approved plan in the hands of those who execute it. Actual: a complete draft known only inside the program repository."
    potential_compromise: [availability]
    sources: [INT-162.A1, ART-CP]
  - id: FND-011
    control_id: cp-4
    title: "Regional failover has never been tested and no tabletop exercise has been held"
    description: "CP-4 as tailored requires the contingency plan to be tested annually with a tabletop exercise, a database restore test and a regional failover test. Only the database restore has been tested (DT-2, re-performed by the assessor on 2026-12-02, within objective). The regional failover of the cluster, on which recovery from a regional outage depends, and the tabletop exercise have never been held; both are planned for 2027-02, after the planned deployment of 2027-02-01. Evidence: test records, the restore re-performance, the ISSE interview, conops limitation 4."
    status: open
    severity: moderate
    recommendation: "Hold the tabletop and the regional failover test before production use if the schedule allows, otherwise as early in 2027-02 as possible, review the results and record corrective actions in the plan and the POA&M."
    affected_statements: ["CP-04a.[01]", "CP-04a.[02]", "CP-04a.[03]"]
    state_difference: "Expected: tabletop, restore and failover tests completed. Actual: restore only; failover and tabletop untested, so recovery from a regional outage is unproven."
    potential_compromise: [availability]
    sources: [INT-162.A2, product/test-results.md#dt-2, product/conops.md#limitations]
