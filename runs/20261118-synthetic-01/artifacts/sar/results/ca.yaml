findings:
  - id: FND-003
    control_id: ca-2
    title: "No control assessment has yet been completed and reported, and the recurring assessment is not scheduled"
    description: "CA-2 requires controls to be assessed annually (a third each year), an assessment report produced and the results provided to the AO, the PM and the ISSM. The assessor selection and the approved plan are in place (2026-11-18). This first assessment is in progress; no report has yet been produced or delivered, and the annual assessment set is not chosen or scheduled. Evidence: sap.yaml, ART-SAP, ART-CONMON, the ISSM interview. A-5 reassessment: examined sar-report.yaml and ART-SAR on 2026-12-14; the report is produced and was delivered to the PM, the ISSM, the AODR and the AO on 2026-12-11, which meets CA-02e. and CA-02f. for this assessment, but the recurring annual assessment of a third of the controls is still not chosen or scheduled (CA-02d.), so the finding stays open."
    status: open
    severity: low
    recommendation: "Deliver this assessment's report (A-4) to the AO, the PM and the ISSM, then choose and schedule the first annual third of the controls in the continuous monitoring plan, and update the ca-2 SSP statement to the as-assessed state."
    affected_statements: ["CA-02d.[01]", "CA-02d.[02]", "CA-02e.", "CA-02f."]
    state_difference: "Expected: controls assessed at the defined frequency with reports delivered. Actual: the first assessment is under way; no report delivered and no recurring schedule."
    potential_compromise: [confidentiality, integrity, availability, privacy]
    sources: [INT-158.A1, ART-SAP, ART-CONMON]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A2, INT-177.A4]
      rationale: "Partly remedied by the report's delivery at A-4 (reassessed above); the annual assessment schedule is set in the first monitoring cycle after the decision, so the rest goes to the POA&M."
  - id: FND-004
    control_id: ca-3
    title: "The EMIS exchange runs on an interim e-mail approval with no signed agreement"
    description: "CA-3 requires each information exchange to be approved and managed through an agreement documenting interface characteristics, security and privacy requirements, controls, responsibilities and the impact level. The nightly EMIS extract, which carries maintainer PII and CUI, runs on the EMIS ISSM's interim e-mail approval of 2026-09-15, which names only the interface; the memorandum of agreement is drafted and under legal review (target 2026-12-31). The two other exchanges have signed agreements. The EFRAS end's mutual TLS and signature check were tested and work. Evidence: the agreements, the interim e-mail, the PM interview, conops limitation 3."
    status: open
    severity: low
    recommendation: "Sign the EFRAS-EMIS memorandum of agreement with the security and privacy requirements, breach notification, responsibilities of each side and the impact level, before production data flows; record it in boundary.yaml and the SSP."
    affected_statements: ["CA-03a.", "CA-03b.[01]", "CA-03b.[02]", "CA-03b.[03]", "CA-03b.[04]", "CA-03b.[05]", "CA-03b.[06]"]
    state_difference: "Expected: a signed agreement for each exchange. Actual: two signed; the EMIS exchange has only an interim e-mail approval without security, privacy or responsibility terms."
    potential_compromise: [confidentiality, integrity, privacy]
    sources: [INT-159.A1, ASM-016, product/conops.md#limitations]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A2]
      rationale: "VUL-03 of the risk assessment, on the riskiest connection; the agreement is under legal review with a signature target of 2026-12-31, outside the program's own resources, so it goes to the POA&M."
  - id: FND-005
    control_id: ca-5
    title: "No plan of action and milestones exists for the system"
    description: "CA-5 requires a POA&M documenting planned remediation of weaknesses and known vulnerabilities, updated monthly. The eMASS POA&M module is empty; the seven known limitations are tracked only as backlog tickets with fix releases. Evidence: eMASS, the backlog, the ISSM and PM interviews."
    status: open
    severity: low
    recommendation: "Create the POA&M at A-6 from this assessment's findings, the open STIG items and the known limitations, with milestones and dates, and update it monthly."
    affected_statements: ["CA-05a.", "CA-05b."]
    state_difference: "Expected: a POA&M updated monthly. Actual: none; remediation is tracked only in the development backlog."
    potential_compromise: [confidentiality, integrity, availability, privacy]
    sources: [INT-158.A2, INT-159.A2, product/conops.md#limitations]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A2]
      rationale: "The POA&M is A-6's output and its monthly update starts after it; the item lets the assessor verify both at the first ongoing assessment."
  - id: FND-006
    control_id: ca-7
    title: "Continuous monitoring has not yet run under the approved strategy: no ongoing assessment and no status reporting"
    description: "CA-7 requires system-level continuous monitoring under the strategy, including ongoing control assessments and reporting of the security and privacy status to the AO through the AODR, the PM and the ISSM. The strategy was approved on 2026-11-18 and scanning, log review, drift checks and account reviews run in pre-production, but no ongoing control assessment has run and neither the monthly roll-up nor the quarterly posture report has been produced. Evidence: ART-CONMON, the monitoring records, the ISSM and PM interviews."
    status: open
    severity: low
    recommendation: "Run the first monitoring cycle after the decision as ART-CONMON sets out, produce the first monthly roll-up and quarterly posture report, and start the annual third of control assessments."
    affected_statements: ["CA-07[02]", "CA-07c.", "CA-07g.[01]", "CA-07g.[02]"]
    state_difference: "Expected: monitoring under the strategy with ongoing assessment and status reports. Actual: monitoring activities run, but no ongoing assessment and no status reports yet."
    potential_compromise: [confidentiality, integrity, availability, privacy]
    sources: [INT-158.A3, INT-159.A2, ART-CONMON]
    triage:
      action: poam
      decided_by: PER-PM
      significance: low
      risk_basis: [ART-RA, INT-177.A2]
      rationale: "Monitoring under the approved strategy starts after the authorization decision; the first roll-up and posture report cannot come sooner, so it goes to the POA&M."
