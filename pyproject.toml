[project]
name = "rmf-tool"
version = "0.1.0"
description = "DoD RMF inception-to-fielded manual and agent simulation tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27",
    "ruamel.yaml>=0.19",
    "jsonschema[format]>=4.26",
    "referencing>=0.37",
    "regex>=2026.9.29",
    "jinja2>=3.1.6",
    "httpx>=0.28",
    "python-frontmatter>=1.3",
    "compliance-trestle==5.2.0",
    "rich>=15",
]

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0; it is installed only with EXTRACT=1 (see NOTICE).
extract = [
    "pymupdf==2.0",
    "pdfplumber==0.11.10",
]

[project.scripts]
rmf = "rmf_tool.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-httpserver>=1.2",
    "pytest-xdist>=3.8",
    "hypothesis>=6.170",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmf_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not slow and not network and not agent and not release'"
markers = [
    "slow: long-running tests (run by rmf ci --slow)",
    "release: repeats the whole suite in a fork clone (run by rmf ci --release only)",
    "network: touches the network (never in CI)",
    "agent: drives a local claude -p session (local only)",
]

[tool.coverage.run]
source = ["rmf_tool"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["tests/unit"]
