# CNSSI1253E-ATT1-TEMPLATE triage. Pages 1 to 11 read whole. 0081 is promoted from page 2, which
# sources.yaml excludes as references only though it opens with Section 2's instruction.
# 76 live entries plus 1 promoted, 77 decided. 0011, 0053, 0054 and 0066 are `removed: true`.
# The template is what a fork writes when it defines an overlay of its own at P-4. Its instruction text
# (Guidance boxes) is live; its examples, sample tables and sample definitions are noise.
# Home: slug overlay-justification (P-4, from SP800-53B), extended here. P-4 only says an org may
# publish tailored baselines and overlays; nothing says what an overlay must contain.

