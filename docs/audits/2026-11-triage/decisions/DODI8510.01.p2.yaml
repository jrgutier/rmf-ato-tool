# DODI8510.01 part 2 triage: page 31, Section 5, read whole against the source.
# Items of 5.2.a describe a website under the rejected lead-in 'a. The RMF KS:'. Part 1 made the same
# kind of item noise (0178 to 0180), with the operative claim, that the KS is authoritative, live at 0010.

REQ-DODI8510.01-0269:
  x_new_work_item: ref-edition-currency
  x_home: "New REF rule run by rmf ci, which records that a referenced document was checked for a later edition; EXT-ORG-POLICY at P-2 for current DoD direction."
  x_gap: "'most up-to-date DoD intent' reaches past the library into KS content a fork supplies as EXT-ORG-POLICY, which nothing dates."
  x_note: "Subject and verb: 'RMF implementation must reflect the most up-to-date DoD intent on evolving security objectives and risk conditions'. The first sentence, practitioners 'need access to' the KS, is background to it, and 0010 holds that access as inputs."
REQ-DODI8510.01-0270:
  status: not-a-requirement
  reason: "Description of the website: the KS 'Serves as the authoritative source'. It repeats 0010, which is live and held by EXT-ORG-POLICY and EXT-ASSESSMENT-PROCEDURES; nobody is told to act here."
REQ-DODI8510.01-0271:
  status: not-a-requirement
  reason: "Description of who reaches the site: 'Is available to all individuals with information technology risk management responsibilities'. Those responsibilities only name the audience, so the word binds no one."
  x_note: "Subject and verb: 'The RMF KS: ... Is available to all individuals'."
REQ-DODI8510.01-0272:
  status: not-a-requirement
  reason: "Description of what the site offers: 'Provides convenient access to security controls baselines, overlays'. A feature; the use of that content is required at 0045."
REQ-DODI8510.01-0273:
  status: not-a-requirement
  reason: "Description of the site's purpose: 'Supports automated and non-automated implementation'. A feature of a website, with no act on a reader."
REQ-DODI8510.01-0274:
  status: not-a-requirement
  reason: "Description of the site's content: 'Provides cybersecurity accountability information'. It names a kind of page and asks nothing, so that accountability binds no one here."
  x_note: "Subject and verb: 'The RMF KS: ... Provides cybersecurity accountability information'."
REQ-DODI8510.01-0275:
  status: not-a-requirement
  reason: "Description of the site's content: 'Provides reciprocity guidance'. Where the guidance sits, while the duty to use reciprocity is 0007 and WI-29."
REQ-DODI8510.01-0276:
  status: not-a-requirement
  reason: "Description of access to the site: 'Is accessible by individuals with a DoD public key infrastructure certificate'. It explains how to log in; this is also why INV-7 keeps the KS out of references/."
REQ-DODI8510.01-0277:
  status: not-a-requirement
  reason: "Description of the site's library: 'Hosts a library of tools, diagrams, process maps, documents'. A list of what is posted."
REQ-DODI8510.01-0278:
  status: not-a-requirement
  reason: "Description of a site feature: 'Serves as a collaborative workspace' to 'develop, share, and post lessons learned'. An option for the user community, not a duty; lessons in a fork go to docs/LESSONS.md."
REQ-DODI8510.01-0279:
  status: not-applicable
  reason: "Binds the RMF TAG, responsible for the 'functional configuration and content management of the RMF KS'. How the TAG runs a website is its own work. Checked PER-CISO and WI-27's TAG representative: a run reads the content (0010), as with part 1's TAG authoring entry."
  x_note: "Subject and verb: 'The RMF TAG is responsible for the functional configuration and content management of the RMF KS and provides detailed analysis and authoring support'."
