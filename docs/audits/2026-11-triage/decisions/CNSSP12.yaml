  x_gap: "'as part of a holistic systems engineering approach', the practices of SP 800-160: sse-practices, home I-1 exit criterion with P-15 ART-REQ."
  x_note: "Subject and verb: 'AOs, acquisition managers, program managers, architects ... and end users of applicable systems must ensure cybersecurity requirements are integrated and applied throughout the life cycle'. The second sentence, 'NIST SP 800-160 ... provides a guide', is advisory. Substance is every fork's; 'space NSS' only names the subject."
REQ-CNSSP12-0016:
  x_existing: "framework/baselines/cnssi-1253.yaml si-4, au-2, au-6 (monitoring, auditing), cp-10 (recovery, availability) and ir-6 (reporting), selected at every level of their objective; ART-IRP '## Response and reporting' for events to the CSSP and the chain of command."
  x_gap: "'to the cognizant AO and operations organizations' as named recipients: ART-IRP names the CSSP and the chain of command only; irp-reporting-paths, home S-4 step and ART-IRP '## Response and reporting'."
  x_note: "Subject and verb: 'Space NSS and services must incorporate cybersecurity monitoring, auditing, and recovery measures to report related events'. The measures are in every NSS baseline, so this is not a space-only duty in substance."
