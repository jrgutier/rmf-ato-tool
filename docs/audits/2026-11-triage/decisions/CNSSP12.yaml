# CNSSP12 decisions, whole document, PDF pages 5 to 11 (printed 1 to 7). Tier 1, so no status: deferred.
# Written by hand, entry by entry, from the rendered scan: the text layer is damaged OCR (I-1, WI-50).
# Statements are not edited; x_note gives the page's reading where the damage changes a word.
# Space is a class this repository already reaches: C-2 step 6 names the Space Platform Overlay and WI-21
# transcribes it, and the overlay's section 4 takes its applicability from CNSSP 12. So a space-only duty
# that an overlay control carries binds WI-21, and only one no open item carries is not-applicable.

# Page 5, Sections I to III
REQ-CNSSP12-0001:
  status: not-a-requirement
  reason: "Purpose paragraph: the document says it 'assigns responsibilities' for space NSS. The word responsibilities names what later sections do; this sentence gives no one a task, so it binds no one. The assignments are REQ-0038 and REQ-0046 and their items."
  x_note: "Subject and verb: 'This document establishes national cybersecurity policy, provides minimum cybersecurity criteria, and assigns responsibilities'."
REQ-CNSSP12-0002:
  status: not-a-requirement
  reason: "Authority clause: 'The authority to issue this policy derives from' NSD-42. 'Responsibilities' sits in the relative clause on what NSD-42 outlines, so it reports another document's content and binds no one here."
  x_note: "Subject and verb: 'The authority to issue this policy derives from National Security Directive 42'. Cut by the extractor: the sentence ends in the rejected line 'Security Systems (NSS), consistent with applicable law...'. Neither piece holds a duty."
REQ-CNSSP12-0003:
  status: not-a-requirement
  reason: "Savings clause on the Director of National Intelligence: 'Nothing in this policy alters or supersedes' limits what the policy reaches and names no act."
  x_note: "The page reads 'Director of National Intelligence'; the statement's 'ational' is OCR."
REQ-CNSSP12-0004:
  status: not-a-requirement
  reason: "Scope lead-in, 'This policy applies to space NSS and services, which includes:', opening the list of what is in scope, with no act asked of anyone."
REQ-CNSSP12-0005:
  status: not-a-requirement
  reason: "Scope item 4.a: defines 'space NSS' as the systems used by Departments and Agencies across acquisition, operation and support of space systems. A definition of reach, not a task."
REQ-CNSSP12-0006:
  status: not-a-requirement
  reason: "Scope item 4.b: says which services count, those owned or leased by the USG or for its benefit by commercial or foreign entities. It sets reach and leads into sub-items (1) to (4); no act."
REQ-CNSSP12-0007:
  status: not-a-requirement
  reason: "Scope sub-item 4.b(1): systems handling National Security Information. A class of systems named by use, with no verb directed at anyone."
REQ-CNSSP12-0008:
  status: not-a-requirement
  reason: "Scope sub-item 4.b(2). 'requires' describes the information, 'information that requires safeguarding or dissemination controls', to mark which systems are in scope; it binds no one to provide those controls here."
  x_note: "Subject and verb: 'unclassified information that requires safeguarding or dissemination controls pursuant to ... applicable law'."
REQ-CNSSP12-0009:
  status: not-a-requirement
  reason: "Scope sub-item 4.b(3): systems that host or support applicable payloads. It identifies a class of system and asks for nothing."
REQ-CNSSP12-0010:
  status: not-a-requirement
  reason: "Scope sub-item 4.b(4): systems used to experiment, test or demonstrate for space NSS. Reach only, and the last line of the sentence runs to page 6."
  x_note: "Cited page holds the item up to 'capabilities for'; 'current and future space NSS.' is the first line of page 6. The statement's 'CNSSP 12' is the running head of page 6 caught in the join."

# Page 6, Section III continued
REQ-CNSSP12-0011:
  status: not-a-requirement
  reason: "Scope item 4.c: brings in information systems directly supporting or interfacing with space NSS. It extends the reach of the policy and gives nobody a task."
REQ-CNSSP12-0012:
  x_new_work_item: "ra-external-risk: ART-RA and P-14 state the risk from connections, information exchange, external providers and the supply chain. The template has no such section and the P-14 playbook does not ask."
  x_home: "Task P-14, a new section of templates/artifacts/ART-RA.md"
  x_note: "Bound by para 5 on the page, not by a scope item: 'the mission owner and cognizant Authorizing Official (AO) ... in coordination with the National Security Agency (NSA), must consider the impact of non-NSS components in their end-to-end analysis of risks'. Mission owner is PER-PM or PER-SPONSOR. Second sentence, 'the AO may bring non-NSS or components under the scope of this policy', is a permission. Overlay section 4 (CNSSI1253F-ATT2-SPACE p. 7) repeats both. NSA's part is the input in nsa-nss-assessment."
REQ-CNSSP12-0013:
  x_existing: "R-4 and ART-AODM '## Residual risk accepted': the cognizant AO's risk acceptance, on a system whose boundary and inventory hold the component (ART-BND, ART-INV)."
  x_gap: "'after performing a thorough review and comparison of alternatives, in coordination with NSA': no task compares alternatives for a component not built to the requirements; ra-external-risk, home Task P-14, read at R-2."
  x_note: "Subject and verb: 'Use of systems, or components, not originally planned, designed, or built to fully meet the requirements of this policy ... will be contingent upon the cognizant AO's risk acceptance decision'. Pairs with REQ-0056, the check before such a component enters the architecture. The rule is general in substance, a component not built to requirement, so it is not retired as space-only."
REQ-CNSSP12-0014:
  status: not-a-requirement
  reason: "Exclusion from scope: 'This policy does not apply to' ballistic missile weapons systems, munitions and platforms below 100 km. It limits reach and directs no act."
  x_note: "Cut by the extractor: the sentence ends in the rejected line '100 kilometers (km) in altitude.' Neither piece holds a duty."

