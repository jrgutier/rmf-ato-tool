  x_note: "'must be designed to adapt to evolving cybersecurity threats and operate through related attacks'. Inside WI-21 by CP-12 Safe Mode (overlay p. 30), SI-13 (p. 64) and SI-17 Fail-Safe Procedures (p. 66), all +G and none selected in framework/baselines/cnssi-1253.yaml today. Cyber resilience as a design practice is also in sse-practices. Label reads 10 on the page; 'I 0.' is OCR."
REQ-CNSSP12-0018:
  x_new_work_item: "foreign-access: users.yaml marks foreign exchange personnel and foreign representatives; C-1 records the Component head's authorization and the releasability limit that bounds their access. users.schema.json has internal, external or general-public only."
  x_home: "C-1 step 5 and framework/schema/users.schema.json, shown in ART-SD '## Users'."
  x_note: "Passive, no subject given: 'Foreign access to U.S. space capabilities and release of communications security (COMSEC) and other cybersecurity products to foreign governments must be controlled'. The first clause is this slug. The second, release of COMSEC to foreign governments under CNSSP 8, is another body's procedure, read here only where a foreign partner is a user. Cut: the title of CNSSP 8 runs to page 7 as a rejected line with no duty; this piece holds the duty. Cited page holds the sentence to 'Committee on National Security Systems'."

