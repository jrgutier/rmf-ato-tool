# DODCIO-CATO, the cATO memorandum of 2 February 2022, pages 1 to 3, read whole. Written by hand, entry by entry.
# AD-CATO in framework/decisions.yaml restates much of this memo in its description, which is prose; WI-24 says so ('Prose only; no data').
REQ-DODCIO-CATO-0001:
  status: not-a-requirement
  reason: "Opening background of the memo: analytics 'is essential' and 'required to' combat threats is the case for cATO, then a statement of purpose. It names no actor and no act, so it binds no one."
  x_note: "Subject and verb: 'Real-time or near real-time data analytics ... is essential to achieve the level of cybersecurity required to combat today's cyber threats'."
REQ-DODCIO-CATO-0002:
  work_item: WI-24
  x_note: "Subject and verb: 'the Authorizing Official (AO) must be able to demonstrate three main competencies'. The M-6 entry criterion names all three in prose; WI-24's title is active cyber defense and the reference design with no data behind them, and the visibility competency is the dashboard."
REQ-DODCIO-CATO-0003:
  x_existing: "Task S-5 and ART-CONMON with CONMON-001 for a strategy covering every baseline family and method; ART-CONMON '## Roles and tools' for the CSSP and common control providers; the S-5 exit criterion 'Where AD-CATO is a goal, automated monitoring is as near real time as feasible and manual controls have defined timelines'."
  x_gap: "'It is critical that System Owners ... demonstrate the ability to effectively integrate the automation and monitoring of all security controls prior to entering into a cATO status': cato-entry-conditions."
  x_note: "Subject and verb: 'the System Owner, in coordination with Service Providers, will continuously monitor and assess all of the security controls'; 'Automated monitoring should be as near real time as feasible'; 'Manual controls ... must be included'. System Owner is PER-PM, Service Providers PER-CCP and PER-CSSP."
REQ-DODCIO-CATO-0004:
  x_existing: "Task S-6: 'Have the AO (or AODR) review and approve the security plan and monitoring strategy', with ART-CONMON as its input."
  x_gap: "'the AO have the ability to monitor the cumulative set of security controls that span the AO's area of responsibility', a view across the AO's systems: WI-24, dashboard. 'support and manage' after approval has no step of its own: M-6 reads the results but nothing else follows."
  x_note: "Subject and verb: 'CONMON requires the AO have the ability to monitor'; 'The AO must approve, support and manage an organization's CONMON plan for all applications'. The first two sentences are description. 'responsibility' sits in 'area of responsibility'."
REQ-DODCIO-CATO-0005:
  work_item: WI-24
  x_note: "Already bound. Subject and verb: 'all security controls will need to be fed into a system level dashboard view'. 'will be better positioned' and 'will also enable' are its benefits. Spans pages 1 and 2."
REQ-DODCIO-CATO-0006:
  work_item: WI-24
  x_note: "Subject and verb: 'The focus should be on using threat driven dashboards and metrics'; 'so too must our cyber defenses' is rhetoric. The definition of active cyber defense opens the entry."
REQ-DODCIO-CATO-0007:
  work_item: WI-24
  x_gap: "'AO's/AODR's must be in constant communications with the various cyber operational components', CSSP, component cyber operations forces, JFHQ-DoDIN and United States Cyber Command, with threat intelligence ingested and indicators shared: cato-conmon-content."
  x_note: "Already bound on 'Systems must be able to show a real, or near real time ability to deploy appropriate countermeasures'. The second duty's subject is PER-AO and PER-AODR, so it stays in the register as a gap, not a neighbour's. The channels 'are essential' is why."
REQ-DODCIO-CATO-0008:
  work_item: WI-24
  x_note: "Already bound on the SBOM. Subject and verb: 'we must ensure that this software is created in a secure, protected, and controlled environment'; 'the adoption of an approved software platform and development pipeline(s) are critical'. 'required to build' and 'will perform' are description."
REQ-DODCIO-CATO-0009:
  work_item: WI-24
  x_note: "Subject and verb: 'To achieve a cATO, a system must embrace the DoD Enterprise DevSecOps Strategy, aligning to an approved DevSecOps Reference Design'. 'new architectures can be submitted for evaluation' is a permission."
REQ-DODCIO-CATO-0010:
  work_item: WI-24
  x_gap: "The DoD CISO as the body the request goes to, who has no persona and no field in decision.yaml: WI-27."
  x_note: "Subject and verb: 'the AO will notify the component CISO of the intention'; 'Together the AO and component CISO will present this request and the supporting body of evidence to the DoD CISO'; 'Systems ... must demonstrate'. M-6's purpose and the AD-CATO description hold the path in prose; 'evidence to DoD CISO' is WI-24's title. Spans pages 2 and 3. ADR-0005 records the conflict with DoDI 5000.90 and AODM-007."
REQ-DODCIO-CATO-0011:
  work_item: WI-26
  x_note: "Already bound. Subject and verb: 'The cATO determination does not affect the underlying system ATO'; 'DoD CISO approved cATOs do not have an expiration date and will remain in effect'. AD-CATO has atd_required: false for the first half. 'privilege' and 'gold standard' are description."
REQ-DODCIO-CATO-0012:
  x_existing: "references/index.yaml holds the guidance this promises, DODCIO-CATO-IG and DODCIO-CATO-EVAL, and M-6 reads the memo's competencies through them."
  x_gap: "'cATO evaluation criteria will also be updated': a run does not record that it checked for a later edition: ref-edition-currency."
  x_note: "Subject and verb: 'DoD CIO-CS will coordinate and publish guidance'; 'DoD CIO will iterate with the community'. DoD CIO is outside the run and is not PER-CIO; kept because a run consumes the output. How the office iterates is its own procedure."
REQ-DODCIO-CATO-0013:
  x_new_work_item: cato-revocation
  x_home: "M-6, framework/tasks/M.yaml and decision.yaml: revocation of a cATO and what triggers it. Extends the slug from DODCIO-CATO-EVAL 0028."
  x_gap: "'A system can temporarily lose its cATO privilege without any loss of existing ATO': WI-26."
  x_note: "Subject and verb: 'systems that have been granted permission to operate under a cATO may have this revoked for several reasons'. The AD-CATO description states it; no record or step does. The reasons are 'not limited to' the three named. 'will stay' is in 'does not guarantee a system will stay in that state'."
REQ-DODCIO-CATO-0014:
  status: not-a-requirement
  reason: "Closing notice: 'will be published' says where later guidance appears, on the RMF Knowledge Service, and the rest is two points of contact. It binds no one in a run."
  x_note: "Subject and verb: 'Evolving guidance and related resources will be published on the RMF Knowledge Service'."
