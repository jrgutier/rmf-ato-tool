  reason: "Applicability clause: 'This issuance applies to the OSD, the Military Departments' and the rest, ending in the defined term DoD Components. It says who is reached and asks for no act."
REQ-DODI5000.82-0002:
  status: not-a-requirement
  reason: "Applicability clause: the issuance's requirements 'are applicable to acquisition programs containing IT' regardless of dollar value or pathway. A statement of reach; the duties are in Section 3."
REQ-DODI5000.82-0003:
  status: not-a-requirement
  reason: "Description of what digital acquisition does: it 'supports the National Defense Strategy', 'aligns with' DoD policies, and 'This alignment results in' delivery. No actor and no act."
REQ-DODI5000.82-0004:
  status: deferred
  reason: "Procurements 'must be authorized by the contracting officer': a contracting authority rule for buys this issuance does not name. It governs procurement, no persona holds a contracting officer, and no RMF run touches it."
