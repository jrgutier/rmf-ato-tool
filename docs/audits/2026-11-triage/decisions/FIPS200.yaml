# FIPS200 triage. Tier 1, so no status: deferred here; nothing in this document needed x_defer.
# x_existing on a control means: selected in framework/baselines/cnssi-1253.yaml (cell quoted, read
# in the order low, moderate, high), a statement at S-4 (SSP-COV-001), a determination at A-3
# (SAR-COV-001). 0005 says the standard is met "through the use of the security controls", so the
# family entries 0018 to 0034 are held by the controls of their family; each catalog statement was
# opened with `rmf catalog show`. Every cited cell selects at every level unless the entry says so.
#
# --- Page 2: Foreword ---
REQ-FIPS200-0001:
  status: not-a-requirement
  reason: "Foreword: says what the FIPS series is, then that comments 'should be addressed to the Director' of the Information Technology Laboratory. That 'should' gives a mailing address to anyone who chooses to comment, so it binds no one."
  x_note: "Subject and verb: 'Comments concerning FIPS publications are welcomed and should be addressed to the Director'."
# --- Page 3: Authority ---
REQ-FIPS200-0002:
  status: not-a-requirement
  reason: "Authority page: FIPS PUBS 'are issued by' NIST 'after approval by the Secretary of Commerce' under Section 5131 of the Information Technology Management Reform Act and FISMA. Says how the series comes out; no reader acts on it."
# --- Page 4: Announcement, items 1 to 6 ---
REQ-FIPS200-0003:
  status: not-a-requirement
  reason: "First line of the announcement: repeats the issuing authority of the series, citing FISMA alone this time. Publication history that page 3 already gave, with nothing to do."
REQ-FIPS200-0004:
  status: not-a-requirement
  reason: "Item 6, Applicability: 'This standard is applicable to' all federal information and systems except classified information and national security systems. It says who the standard reaches and names no act. 'to require protection' describes the excluded classified information, and 'encouraged' invites state, local, tribal and private bodies to consider the standard; neither binds anyone."
  x_note: "Subject and verb: 'This standard is applicable to'; 'information that has been determined ... to require protection'; 'state, local, and tribal governments, and private sector organizations ... are encouraged to consider the use of this standard'. The national security systems carve-out matters to 0015 and 0035: see source conflicts in the report."
# --- Page 5: Announcement, items 8 to 11 ---
REQ-FIPS200-0005:
  x_existing: "Task S-1 steps 4 and 7 and rmf baseline resolve: baseline.json takes its controls from the SP 800-53 catalog through framework/baselines/cnssi-1253.yaml, or the SP 800-53B profile under the degraded fallback (src/rmf_tool/baseline.py resolve); S-4 writes a statement for each control (SSP-COV-001) and A-3 assesses it (SAR-COV-001)."
  x_note: "Subject and verb: 'Federal agencies must meet the minimum security requirements as defined herein through the use of the security controls'. The first sentence only says what the standard specifies."
REQ-FIPS200-0006:
  status: not-applicable
  reason: "Binds federal agencies: they 'must be in compliance' one year after the standard took effect on March 9, 2006, a date that ran out in March 2007, before any run. Checked PER-CIO: a spent deadline has no artifact, decision or check to hold it. The standing duty is 0005."
  x_note: "Subject and verb: 'Federal agencies must be in compliance with this standard not later than one year from its effective date'. Page 4 gives the date, March 9, 2006, and this item says 'effective immediately'."
REQ-FIPS200-0007:
  x_new_work_item: "ref-edition-currency"
  x_home: "New REF rule run by rmf refs verify, on the new references/index.yaml field recording when each entry was last checked for a newer edition; for SP 800-53 the record adds the date of final publication, which starts the year."
  x_note: "Two duties, decided by the stronger for a run: 'Federal agencies will have up to one year from the date of final publication to fully comply with the changes', which nothing tracks. The other, 'The security controls will be reviewed by NIST at least annually' and the public review of changes, is NIST's own procedure; a fork only consumes its output. 'are encouraged to initiate compliance activities immediately' is a permission on top of the year. Promotion not used: the sentence is inside this live entry."
REQ-FIPS200-0008:
  x_new_work_item: "tailoring-legal-floor"
  x_home: "tailoring-legal-floor: Task S-2 step 4 and a new exit criterion in framework/tasks/S.yaml."
  x_note: "'No provision is provided under FISMA for waivers to FIPS made mandatory by the Secretary of Commerce.' No duty word, yet a real limit: tailoring under the guidance of SP 800-53 is allowed (0039), a waiver of the standard is not. S-2's exit criterion bars removal because a control is hard to implement, and says nothing of a remove that amounts to a waiver of a legal minimum."
# --- Page 7: Section 1 Purpose and Section 2 Impact Levels ---
REQ-FIPS200-0044:
  status: not-a-requirement
  reason: "Background: recounts that FISMA 'tasked NIST with the responsibility of developing' standards. A completed act of Congress on NIST, and the 'responsibility' binds no reader; what it produced is FIPS 199, SP 800-60 and this standard, which are pinned in references/. It stops at a colon over three noun items, 0009 to 0011."
  x_note: "Subject and verb: 'Title III of the E-Government Act ... tasked NIST with the responsibility of developing security standards and guidelines'."
REQ-FIPS200-0009:
  status: not-a-requirement
  reason: "Bare noun item under 0044: 'Standards for categorizing information and information systems', the thing FISMA asked of NIST, which is FIPS 199. No verb on any reader."
REQ-FIPS200-0010:
  status: not-a-requirement
  reason: "Bare noun item under 0044: 'Guidelines' on which information types go in each category, a publication NIST was to write (SP 800-60). It tells no reader to act."
REQ-FIPS200-0011:
  status: not-a-requirement
  reason: "Last noun item under 0044: 'Minimum information security requirements', which is this standard itself. What the minimum is sits in 0018 to 0034."
REQ-FIPS200-0012:
  status: not-a-requirement
  reason: "Background: places FIPS 199 and FIPS 200 as the two mandatory standards and says what this one specifies. 'This standard will promote' more secure systems is a hoped-for effect, so 'will' binds no one; the duties are 0005 and 0035."
  x_note: "Subject and verb: 'This standard will promote the development, implementation, and operation of more secure information systems'."
REQ-FIPS200-0013:
  x_existing: "Task C-2 steps 4, 5 and 7: a value per information type and objective, the highest over all types for each of C, I and A; facts.schema.json categorization c, i, a with the impact enum low, moderate, high; ART-CAT '## Impact per information type' and '## System categorization'."
  x_note: "Subject and verb: 'FIPS Publication 199 requires agencies to categorize their information systems'; 'The potential impact values ... are the highest values'. Cut pair with 0014: this piece ends in a colon before the formula. A run keeps the format as three fields, not the printed string."
REQ-FIPS200-0014:
  status: not-a-requirement
  reason: "Formula after the colon of 0013: 'SC information system = {(confidentiality, impact), (integrity, impact), (availability, impact)}'. Notation for the security category, and its three 'acceptable values' repeat the levels 0013 names. 0013 is the live piece of this cut pair."
# --- Page 8: Section 2 end, Section 3 ---
