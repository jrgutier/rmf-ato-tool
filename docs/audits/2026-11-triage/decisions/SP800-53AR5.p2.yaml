  status: not-a-requirement
  reason: "Definition and description, cut with 0315: 'Ongoing security and privacy assessment is the continuous evaluation'. 'in accordance with organization-defined frequencies' says when the ISCM step begins and binds no one by itself; the duty on how the information is produced sits in live 0315, and the frequencies are S-5."
  x_note: "Subject and verb: 'Ongoing assessment encompasses ISCM Steps 3 and 4 and is initiated as part of ISCM Step 3, Implement, when the collection of security-related information begins in accordance with organization-defined frequencies'."
REQ-SP800-53AR5-0315:
