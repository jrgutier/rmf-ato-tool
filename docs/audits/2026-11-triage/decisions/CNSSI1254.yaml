# CNSSI1254 decisions, whole document, pages 4 to 28. Written by hand, entry by entry, against the page text.
# Who a duty binds is taken from the page: the context field reads REFERENCES on all of Annexes C and D.
# 0146, 0147 and 0148 are this job's promotions.

# Sections I to VII, pages 4 to 6
REQ-CNSSI1254-0001:
  status: not-a-requirement
  reason: "Section I purpose: 'This Instruction creates a standard', saying what the document is for, with no actor given anything to do."
REQ-CNSSI1254-0002:
  status: not-a-requirement
  reason: "Says where the document's list came from. 'required' only describes 'the required RMF documents' in a sentence about derivation from NIST publications, so it binds no one; the duty that the documents exist is in REQ-0006."
  x_note: "'This Instruction derives the required RMF documents and standard data elements'."
REQ-CNSSI1254-0003:
  x_new_work_item: "data-element-crosswalk: a map of each CNSSI 1254 Annex C element to its field or heading in each core document, with this Instruction taking precedence over the NIST publications where they differ, and a rule that the package carries them; no rule reads a core document for its elements"
  x_home: "R-1 step and a new rule beside PKG-001 on ART-PKG, the map held under framework/"
  x_note: "First sentence is authority and binds nothing. The rule is the last: 'For NSS, where differences between the NIST publications and this Instruction occur, this Instruction takes precedence.' No framework file, playbook or template states an order among sources."
REQ-CNSSI1254-0004:
  status: not-a-requirement
  reason: "Savings clause: 'shall' here limits what the Instruction itself can do to the DNI's authorities, so it sets no task for anyone a run models."
  x_note: "'Nothing in this Instruction shall alter or supersede the authorities of the Director of National Intelligence.'"
REQ-CNSSI1254-0005:
  x_new_work_item: "reciprocity-agreement: a documented MOU, MOA, SLA or ISA between Granting and Receiving organizations, with minimum content, pre-agreement tasks, POCs, notification terms and termination factors"
  x_home: "new artifact from C-1 step on interconnections, named under ART-SD '## Interconnections and leveraged authorizations'"
  x_note: "Mostly applicability (departments, contractors, SAP materials). The duty is the last sentence, on applying the documents and elements to components under Annex D: 'Organizations must, however, agree on which RMF core documents and which data elements are required.' Nothing records that agreement."
REQ-CNSSI1254-0006:
  x_existing: "framework/artifacts.yaml `package: core` on ART-SSP, ART-SAR, ART-RAR, ART-POAM and ART-AODM, with RUN-ART-001 and PKG-001: the five core documents exist in a run and its package."
  x_gap: "'and associated data elements are required': data-element-crosswalk, home R-1 step and a new rule beside PKG-001; each element is judged in its own row, 0028 to 0111."
  x_note: "'A standard set of documents and associated data elements are required for RMF core documents'. RUN-ART-001 and PKG-001 test presence only, so they hold the documents and not their content."
REQ-CNSSI1254-0007:
  x_existing: "ART-SD '## Mission and purpose' and '## Operating environment' (mission, operational context); ART-BND '## Network architecture', '## Data flows', '## External components' (architecture, data flow, interfaces, services); ART-INV (hardware, software); ART-RA '## Risk summary' (known risks)."
  x_note: "'the focus of the information should be on mission'; 'This information should include operational context, architecture, data flow, interfaces, hardware, software, services, and any known risks'. Opening 'There may be artifacts' is advisory. Repeated at Annex C para 2, REQ-0019."
REQ-CNSSI1254-0008:
  status: not-a-requirement
  reason: "Advisory, not a minimum set: 'does not dictate' disclaims a format, and 'are encouraged' to use SCAP is a recommendation the page never makes mandatory, so it binds no one."
  x_note: "'Organizations are encouraged to apply Security Content Automation Protocol (SCAP) standards'; 'This Instruction does not dictate the format/templates'."
REQ-CNSSI1254-0009:
  status: not-a-requirement
  reason: "Lead-in labelling a list of five definitions, 'The following list ... consists of:'. Its items say what each document is; the duty to have them is in REQ-0006."
REQ-CNSSI1254-0010:
  status: not-a-requirement
  reason: "Item 4 of the definitions: what a POA&M is. 'need to be accomplished' and 'resources required' describe what a POA&M lists and bind no one. The POA&M's content duties are rows 0093 to 0102."
  x_note: "'Plan of Action and Milestones (POA&M) identifies tasks that need to be accomplished'."
REQ-CNSSI1254-0011:
  status: not-a-requirement
  reason: "Item 5 of the definitions: 'Authorization Decision Document conveys the final security authorization decision', a description of the document, not an instruction to the AO; its content duties are rows 0104 to 0111."
REQ-CNSSI1254-0012:
  x_new_work_item: "data-element-crosswalk: a map of each CNSSI 1254 Annex C element to its field or heading in each core document, with this Instruction taking precedence over the NIST publications where they differ, and a rule that the package carries them; no rule reads a core document for its elements"
  x_home: "R-1 step and a new rule beside PKG-001 on ART-PKG, the map held under framework/"
  x_note: "Definition first; the duty is 'data elements ... that must be captured within the RMF documentation'. 'may be mapped to other security documentation' is the permission the crosswalk uses. Cited p. 5, runs to p. 6: read both. Annex C para 2 (0019) calls the same elements 'guidance'; see the report."
REQ-CNSSI1254-0013:
  status: not-a-requirement
  reason: "Footnote 1 on the POA&M: says the elements here agree with OMB M-02-01, a statement about the text's sources."
REQ-CNSSI1254-0014:
  status: not-a-requirement
  reason: "Definition of reciprocity and how it 'is achieved'; the closing sentences point to Annex D and describe what the RMF facilitates. The sharing duty is REQ-0015 and the process is Annex D."
REQ-CNSSI1254-0015:
  x_new_work_item: "granting-package-sharing: the Granting side gives Receiving organizations the package, BoE and deployment documents, with a record of who received what"
  x_home: "R-1 step and ART-PKG manifest (a release list)"
  x_note: "'the national security community will make documentation regarding the security posture of systems available'; a run's package is that documentation, and no output releases it."
REQ-CNSSI1254-0016:
  x_new_work_item: "ref-edition-currency: nothing records that a referenced document was checked for a later edition, though later editions apply to this policy; rmf refs fetch compares bytes at a pinned URL for auto references only, and CNSS documents are browser-assisted with urls: []."
  x_home: "New REF rule run by rmf refs verify, on a new references/index.yaml field recording when each entry was last checked for a newer edition"
  x_note: "'Future updates to referenced documents shall be applicable to this policy.' First sentence is a pointer. Same rule as the entry behind this slug. Annex A dates SP 800-37 February 2010, so the library's SP800-37R2 is such an update."
REQ-CNSSI1254-0017:
  status: not-a-requirement
  reason: "Pointer to the glossary: terms 'are defined in CNSSI 4009', which fixes meanings and asks nothing of anyone."

# Annex C introduction, page 11
REQ-CNSSI1254-0018:
  status: not-a-requirement
  reason: "Advisory, not a minimum set: Table C-1's elements 'may be mapped' to other documents, and artifacts 'could inform' the core documents. Both are permissions; the table's duty is stated at REQ-0012."
REQ-CNSSI1254-0019:
  x_existing: "Same holders as REQ-0007: ART-SD '## Mission and purpose' and '## Operating environment'; ART-BND '## Network architecture', '## Data flows', '## External components'; ART-INV; ART-RA '## Risk summary'."
  x_note: "'the focus of the information should be on mission'; 'This information should include operational context, architecture, data flow'. Its opening says the elements 'provide guidance on documenting RMF artifacts', against 'must be captured' in 0012; see the report."
REQ-CNSSI1254-0020:
  status: not-a-requirement
  reason: "Lead-in to the column key: 'are listed in alphabetical order. Columns from left to right are as follows:'. It describes how the table is laid out."
REQ-CNSSI1254-0021:
  status: not-a-requirement
  reason: "Column key for the number. 'are not required to' lifts a duty rather than sets one: a D/A is free to leave the numbers out of its templates, so it binds no one."
  x_note: "'Departments/Agencies (D/A) are not required to use these numbers within organization-specific templates.'"
REQ-CNSSI1254-0022:
  status: not-a-requirement
  reason: "Noun list of the five document names under the rejected label 'b. RMF Core Document(s):', with the extractor's footnote digit on POA&M; the core set is held at REQ-0006."
REQ-CNSSI1254-0023:
  status: not-a-requirement
  reason: "Column key: 'RMF Data Element – Name of data element to be used within document(s)' says what the column holds, so 'to be used' describes the name and sets no duty apart from the rows."
  x_note: "'Name of data element to be used within document(s)'; a label with no subject acting."
REQ-CNSSI1254-0024:
  status: not-a-requirement
  reason: "Column key: the description column 'Provides description of data element'."
REQ-CNSSI1254-0025:
  status: not-a-requirement
  reason: "Column key cut by the line break, finishing in the rejected fragment 'RMF data element'. 'requiring' describes what the Source column cites, so it binds no one in itself."
  x_note: "'Source – Indicates the source requiring the RMF core document and/or the' RMF data element."
REQ-CNSSI1254-0026:
  status: not-a-requirement
  reason: "Footnote 2 on the POA&M column: the same remark as footnote 1, here citing OMB M-02-01 in shortened form under Annex C. No actor."

