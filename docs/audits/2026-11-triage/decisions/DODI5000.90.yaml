# DODI5000.90 triage, not tier 1, pages 3 to 18, read against references/text/DODI5000.90.md and
# PDF pp. 9 and 13. x_ keys are notes. The DoD CIO is treated as outside PER-CIO (the Component CIO),
# as in DODI8500.01, DODI5000.75 and DODI5000.83. Slugs reused from slugs.txt carry x_new_work_item
# with x_home, as the sibling files do.

# --- Page 3: applicability and policy ---
REQ-DODI5000.90-0001:
  status: not-a-requirement
  reason: "Applicability clause: 'This issuance applies to OSD, the Military Departments' and the rest names who is reached, and no act."
REQ-DODI5000.90-0002:
  x_existing: "framework/pathways.yaml header and PW-MCA rmf_notes (the RMF applies regardless of the pathway), with PER-PM accountable at P-10, P-14, S-1, S-4 and A-6 (personas/PER-PM.md '## Decision authority')."
  x_note: "'Cybersecurity: a. Is foundational to the Defense Acquisition System (DAS) and an intrinsic program manager (PM) responsibility'. The lead-in 'Cybersecurity:' is rejected; the subject comes from it."
REQ-DODI5000.90-0003:
  x_existing: "P-14 ART-RA '## Threat sources and events' and S-2 with input ART-RA ('available to inform tailoring'): controls answer the threats the run assessed."
  x_gap: "The VOLT or equivalent as the assessment the controls answer: no framework, persona or playbook file names it; WI-30."
  x_note: "'Controls are a targeted response to specific cybersecurity threats identified in the program's Validated Online Lifecycle Threat (VOLT), or equivalent threat assessment.' Policy sentence, kept because 0073 and 0081 turn on it."
REQ-DODI5000.90-0004:
  status: not-a-requirement
  reason: "Policy framing: planning and implementation 'requires specific changes' to engineering and SCRM processes. This requires names no change and no body, so it binds no one; the duties are 0093 for engineering and 0108 for SCRM."
  x_note: "Subject and verb: 'Planning and implementation requires specific changes'."
REQ-DODI5000.90-0005:
  x_existing: "M-3 entry criterion (a new or previously unaddressed threat) and ART-RA '## Update (M-3)': the response when a threat advances."
  x_gap: "Looking ahead at how technology and threats advance before one arrives: threat-environment-watch."
  x_home: "S-5, ART-CONMON, a new section: threat-environment-watch: the system strategy names who watches threat actor activity, new protective techniques and the deployed threat environment, from which sources and how often; EXT-THREAT becomes an input of S-5 and M-3, and a major change feeds M-1 and M-3."
  x_note: "'Leaders and experts must address how cybersecurity will evolve'. The source names no role; the PM's form of it is 0082 and 0106."

