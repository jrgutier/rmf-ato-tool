# DODI8530.01 part 1, pages 1 to 37, read whole against the source, entry by entry.
# Role map from personas.txt: DoD Component heads = PER-CIO (Head of Agency); DoD CIO and Component
# CIOs = PER-CIO (Chief Information Officer role); system owners = PER-PM; authorizing officials =
# PER-AO; cybersecurity service providers (CSSPs) = PER-CSSP; information system security managers and
# officers = PER-ISSM, PER-ISSO; DoD risk executive = PER-RE. No persona: DISA, NSA/CSS, DIA, DSS,
# USD(P), USD(I), USD(AT&L), ASD(R&E), DOT&E, GC DoD, IG DoD, CJCS, CDRUSSTRATCOM, NOSCs.
# A control named as a home was read in `rmf catalog show` and its cells in
# framework/baselines/cnssi-1253.yaml; the run writes a statement for it (SSP-COV-001) and A-3 assesses it.

# --- Page 1: purpose and applicability ---
REQ-DODI8530.01-0001:
  status: not-a-requirement
  reason: "Lead-in to the purpose clause. 'In accordance with the authority in DoDD 5144.02' only names the authority for issuing the instruction, so it binds no one; what follows are the purposes."
  x_note: "Subject 'this instruction', no verb before the colon; 'in accordance with' modifies the authority cited."
REQ-DODI8530.01-0002:
  status: not-a-requirement
  reason: "Purpose: the instruction reissues DoDD O-8530.1. 'Assign responsibilities' announces that Enclosure 2 does so and binds no one here; the responsibilities are the entries of that enclosure."
  x_note: "Subject 'this instruction', verb 'Reissues'."
REQ-DODI8530.01-0003:
