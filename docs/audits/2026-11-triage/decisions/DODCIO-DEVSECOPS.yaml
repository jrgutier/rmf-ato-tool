# DODCIO-DEVSECOPS decisions. Written by hand, entry by entry, against pages 7 to 37 and the PDF figures.
# 0152 to 0154 are promoted misses (pp. 19, 20, 25). A fourth miss, p. 22, could not be promoted: see 0064.
# The document calls itself 'an educational compendium' (0151): what stays live is what says must, should or expected
# of a role, a factory or a platform and has a home in a run.
# x_existing on a control means: selected in framework/baselines/cnssi-1253.yaml (cell quoted), statement at S-4, assessed at A-3.
REQ-DODCIO-DEVSECOPS-0001:
  status: not-applicable
  reason: "Binds each DoD organization, as an institution, to tailor its culture, prefer DoD Enterprise resources and make what it builds re-usable. Checked PER-CIO and PER-PM: no artifact, decision, task or check in a run records an organization's culture or the re-use of its solutions, and hosting-choice covers only where one system sits."
  x_note: "'Each DoD organization is expected to tailor its culture and align DevSecOps practices'; 'Embracing DevSecOps requires organizations to shift their culture'."
REQ-DODCIO-DEVSECOPS-0002:
  status: not-a-requirement
  reason: "Names who the document is for. 'Need to understand' is why managers would read it and 'will impact' is what the change does to their mission; neither binds a reader, and 'may find value' is a courtesy to experts."
  x_note: "'DoD managers and leadership who need to understand the software transformation underway and how it will impact their mission'."
REQ-DODCIO-DEVSECOPS-0003:
  status: not-a-requirement
  reason: "First assumption of the document: that Agile practices are already in place, so what follows is the next step. A premise about the reader's state, with no actor told to do anything."
