  reason: "Holds only for one class of fork, weapons systems: the development environment adds on-premises capability for hardware-in-the-loop testing. Checked PER-PM and PER-DEV: this is the build environment of that class, no run artifact asks for it, and a business system never meets it."
  x_note: "'For weapons systems, the environment will leverage cloud along with on-premises capabilities'. Tail of the 0004 bullet, cut by the page; the sentence is whole."
