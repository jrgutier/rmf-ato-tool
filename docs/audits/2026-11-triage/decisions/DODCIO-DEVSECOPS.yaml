  x_new_work_item: hosting-choice
  x_home: "P-16 and ART-BND, extended: the record of where the system is hosted names an approved or provisionally authorized cloud environment as the preferred solution, as DODI5000.87 0009 does for enterprise services."
  x_note: "'Organizations deploying new business solutions or modernizing existing software systems will use an approved or provisionally authorized (PA) cloud environment as their preferred solution.' Printed under 'makes the following assumptions', but it has a subject and a will, and 0005 is the tail of the same bullet, cut by the page. Kept live on the hosting preference; the PA record itself is cloud-cso."
REQ-DODCIO-DEVSECOPS-0005:
