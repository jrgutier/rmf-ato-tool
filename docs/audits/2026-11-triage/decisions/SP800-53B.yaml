# SP800-53B triage: pages 15 to 28 and 81 to 85 read whole against the source. Pages 29 to 80 are
# excluded in conformance/sources.yaml and hold no entry. 0130, 0131 and 0132 are promoted here.
# SP 800-53B is the federal source; CNSSI 1253 Section 3.2 governs a run and adopts the tailoring
# activities of Section 2.4 by name (Section 3.2.2 item 3, footnote 18 at Section 2.6). So a duty in
# Section 2.4 reaches a run through S-2. The high-water mark in Section 2.2 does not: CNSSI 1253
# Section 1.2 rejects it for NSS and baseline.py keeps it only as the degraded fallback.
# Role map from personas.txt: SAOP = PER-PRIV; senior agency information security officer =
# PER-CISO; system owner = PER-PM; common control provider = PER-CCP.

# --- Page 15: Chapter 1, need and purpose ---
REQ-SP800-53B-0001:
  status: not-a-requirement
  reason: "Definitions of security and privacy controls and why selecting them matters. 'mission needs to ensure' is the noun 'needs' and a purpose clause, so it binds no one."
  x_note: "Subject and verb: 'The requirements are derived from applicable laws, ... and mission needs to ensure the confidentiality, integrity, and availability'."
REQ-SP800-53B-0002:
  status: not-a-requirement
  reason: "Background: SP 800-37 'defines two approaches' to selection, and says what a baseline is. It names the approaches; the choice between them is the duty in 0012."
REQ-SP800-53B-0003:
  x_existing: "playbooks/S/S-1.md step 4 and baseline.json from rmf baseline resolve (the minimum set), SSP-COV-001 (a statement for every baseline control), framework/tasks/I.yaml I-1 exit criterion (controls in the plans are implemented)."
  x_note: "The statement runs from page 15 to page 16; page 15 holds it up to 'Whereas use of'. Subject and verb: 'Implementation of a minimum set of controls ... is mandatory'. The privacy clause says the privacy baseline 'is not mandated'; a run applies the NSS privacy baseline regardless, CNSSI 1253 Section 3.2.1 making it a default."
REQ-SP800-53B-0004:
  status: not-a-requirement
  reason: "Applicability footnote 4: NSS 'are not subject to the requirements in [FISMA]', and the controls 'may be selected' where 'otherwise required' by another authority. That points elsewhere and permits; 'required' here binds no one in this document, and the run already takes the CNSSI 1253 route it names."
  x_note: "Subject and verb: 'the controls established in this publication may be selected for national security systems as otherwise required'."

