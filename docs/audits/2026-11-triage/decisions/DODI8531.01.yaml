# DODI8531.01, pages 4 to 20 of 24, read whole against the source, entry by entry.
# Role map from personas.txt: DoD Component heads = PER-CIO (Head of Agency); the DoD Components in
# Section 3, when a system does the work = PER-PM (system owner), PER-ISSM, PER-ISSO, PER-CSSP;
# authorizing officials = PER-AO. No persona: DoD SISO (the DoD CISO of WI-27), DISA, USD(A&S), USD(R&E),
# USD(I&S), DIRNSA/CHCSS, Director DHA, USD(P), USD(C)/CFO, Secretary of the Air Force and DC3, CJCS,
# Commander USCYBERCOM and JFHQ-DODIN, researchers.
# A control named as a home was read in `rmf catalog show` and its cells in
# framework/baselines/cnssi-1253.yaml; the run writes a statement for it (SSP-COV-001) and A-3 assesses it.
# Cells checked: ra-5, ra-5.2, ra-5.11 and sa-22 XXX on C, I and A; si-2, cm-2, cm-6, cm-8 XXX on I; si-2.2,
# cm-3, cm-8.3 +XX on I; mp-6 XXX on C; ca-7 XXX. ca-8 is High only and ra-5.6 is not selected, which is why
# neither holds a duty here.

# --- Page 4: applicability and policy ---
REQ-DODI8531.01-0001:
  status: not-a-requirement
  reason: "Applicability clause: 'This issuance applies to' lists the DoD Components and defines that term. 'Applies to' sets the document's scope and binds no one to do anything."
  x_note: "Subject 'This issuance', verb 'applies to'."
REQ-DODI8531.01-0002:
  x_new_work_item: "vuln-process-strategy: no task names the DoD vulnerability management process. ra-5 and si-2 are control statements and EXT-MONITORING carries scan data, but nothing lays the five steps (identification, analysis, analysis reporting, remediation and mitigation, verification and monitoring) across a run or integrates them with RMF as DoDI 8510.01 asks."
  x_home: "S-5, a new ART-CONMON section '## Vulnerability management' naming the five steps and who does each, read at M-2 and M-3."
  x_note: "Subject from the rejected lead-in 'The DoD will:', verb 'Use'. Read with 3.1, which defines the five steps; DoDI 8510.01 p. 11 'Integrate the vulnerability management process into the RMF process'."
REQ-DODI8531.01-0003:
  x_new_work_item: vuln-process-strategy
  x_home: "S-5, the same ART-CONMON section: how ART-CMP, ART-INV and ART-POAM feed the vulnerability management steps. Each exists, and none says it supports them."
  x_note: "Subject 'The DoD will', verb 'Ensure ... supports ... in accordance with DoDI 8510.01'."
REQ-DODI8531.01-0004:
  x_existing: "framework/tasks/P.yaml P-17 exit criterion 'The cybersecurity requirements that contracts must carry are identified' and sa-4: holds the sentence on enforcement in contract language for a leased system."
  x_gap: "First sentence, 'efficient vulnerability assessment techniques, procedures, and capabilities' for every system: vuln-process-strategy."
  x_note: "Subject 'The DoD will', verb 'Support'; second sentence, subject 'enforcement', verb 'is included in contract language'."
REQ-DODI8531.01-0005:
  x_new_work_item: "vep-submission: nothing in a run sends a newly discovered, not publicly known vulnerability toward the Vulnerabilities Equities Process. VEP appears nowhere in framework, templates, playbooks or personas."
  x_home: "M-3, a step and exit criterion: a vulnerability that is new and not publicly known is submitted through the Component to USCYBERCOM, as soon as practicable, and the submission is recorded in ART-POAM."
  x_note: "Subject 'The DoD will', verbs 'Maintain' and 'ensure ... submit'. The run's duty is the second verb; 'as soon as practicable' is the timing."
REQ-DODI8531.01-0006:
  x_existing: "ra-5.11 Public Disclosure Program, XXX on C, I and A: a run writes a statement for 'a public reporting channel for receiving reports of vulnerabilities', and A-3 assesses it. The coordinated VDP is that channel at DoD level."
  x_note: "Subject 'The DoD will', verb 'Develop and maintain'. Responding to what the channel brings in is vdp-response."

