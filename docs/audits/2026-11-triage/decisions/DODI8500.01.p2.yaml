# DODI8500.01 part 2, pages 38 to 51 (page 52 starts the excluded glossary), read whole against the
# source, entry by entry. Locators restart at each section here (0370 to 0446 read ENCLOSURE 3.a, .b),
# so every subject below comes from the section heading on the page: section 9 IT to p. 43, section 10
# workforce, 11 mission partners, 12 DoD SISO (p. 45), 13 Component CIOs (p. 46), 14 risk executive,
# 15 PAO, 16 AO (p. 47), 17 ISOs, 18 ISSM (p. 48), 19 ISSO (p. 49), 20 privileged users, 21 authorized
# users (p. 50). Role map from personas.txt as in part 1: Component CIO = PER-CIO; Component SISO =
# PER-CISO; DoD ISRMC = PER-RE; ISO = PER-PM; ISSM, ISSO, AO as named; privileged users and system
# administrators = PER-ISSO; authorized users = PER-UR. PAO and DoD SISO have no persona (WI-27).

