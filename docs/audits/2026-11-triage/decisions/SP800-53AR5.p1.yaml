# SP800-53AR5 part 1 triage: pages 12 to 47 and 718 to 728, read whole against the source.
# REQ-SP800-53AR5-0120 is `removed: true` (0329 replaced it), so it has no key here.
# Role map from personas.txt: SAOP/CPO = PER-PRIV; senior information security officer = PER-CISO;
# system owner = PER-PM; common control provider = PER-CCP; control assessor = PER-SCA;
# system security officer = PER-ISSM/PER-ISSO; information owner = PER-IO.
# Where a live entry says "security and privacy" and x_existing is set, the home holds the security
# half; the privacy half rests on WI-02 and WI-03 and the x_note says so where the entry names a
# privacy plan or report.

