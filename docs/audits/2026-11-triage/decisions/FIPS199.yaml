# FIPS199 triage, pages 1 to 10, read whole against the source. Page 1 is the cover and page 4 the
# contents: no entries. 0031 and 0032 are promoted here.
# FIPS 199 excludes national security systems (0008); DoD runs categorize under CNSSI 1253, which
# keeps its three levels and a high water mark per objective, so x_existing here points at C-2.
# Definitions of the three levels are noise; the duty to apply them is 0010.

# --- Page 2: Foreword ---
REQ-FIPS199-0001:
  status: not-a-requirement
  reason: "Foreword: what the FIPS series is, and that the mandates 'have given the Secretary of Commerce and NIST important responsibilities'. Those responsibilities are a history of NIST's mandate and bind no reader."
  x_note: "Subject and verb: 'These mandates have given the Secretary of Commerce and NIST important responsibilities'."
REQ-FIPS199-0002:
  status: not-a-requirement
  reason: "Foreword: comments 'are welcomed and should be addressed to the Director'. That should is a mailing address for anyone who chooses to comment, so it binds no one."
  x_note: "Subject and verb: 'Comments concerning Federal Information Processing Standards Publications are welcomed and should be addressed to the Director'."

# --- Page 3: Authority ---
REQ-FIPS199-0003:
  status: not-a-requirement
  reason: "Authority page: FIPS PUBS 'are issued by' NIST after the Secretary's approval. It says how the series comes out; no reader acts on it."

# --- Page 5: Sections 1 and 2, opening of Section 3 ---
REQ-FIPS199-0030:
  status: not-a-requirement
  reason: "Background and lead-in to 0004 to 0006: FISMA 'tasked NIST with responsibilities for standards and guidelines'. A completed act of Congress; those responsibilities are NIST's, and this standard discharges the first."
  x_note: "Subject and verb: 'Title III of the E-Government Act ... tasked NIST with responsibilities for standards and guidelines'."
REQ-FIPS199-0004:
  status: not-a-requirement
  reason: "First item of what FISMA tasked NIST to develop: 'Standards to be used by all federal agencies to categorize'. A noun phrase naming this standard, under background 0030; the duty on agencies is 0008."
REQ-FIPS199-0005:
  status: not-a-requirement
  reason: "Second item of NIST's task: 'Guidelines recommending the types of information'. Names SP 800-60 in effect, no duty on a reader."
REQ-FIPS199-0006:
  status: not-a-requirement
  reason: "Third item of NIST's task: 'Minimum information security requirements'. Names what became FIPS 200, a noun phrase with no actor."
REQ-FIPS199-0007:
  status: not-a-requirement
  reason: "Purpose: this standard 'addresses the first task cited', and 'Subsequent NIST standards and guidelines will address the second and third tasks'. That will is a forecast of NIST's publishing, and binds no one in a run."
  x_note: "Subject and verb: 'Subsequent NIST standards and guidelines will address the second and third tasks cited'."
REQ-FIPS199-0008:
  x_existing: "framework/tasks/C.yaml C-2, playbooks/C/C-2.md steps 4 to 7, facts.yaml `categorization` and ART-CAT, in the FIPS 199 form of a value per objective; FIPS199 p. 10 in C-2's citations; method `high-water-mark` where CNSSI 1253 is degraded."
  x_note: "Subject and verb: 'These standards shall apply to'; 'Agency officials shall use the security categorizations described in FIPS Publication 199 whenever there is a federal requirement to provide such a categorization'. The standard leaves out national security systems; a run uses CNSSI 1253 for all, whose form is the same, as DoDI 8510.01 p. 29 directs. 'Additional security designators may be developed' is a permission."
REQ-FIPS199-0009:
  x_existing: "framework/tasks/P.yaml P-14 inputs (ART-INFOTYPES with its impact levels, EXT-THREAT) and ART-RA '## Threat sources and events' and '## Vulnerabilities and predisposing conditions'; C-2 takes ART-RA as an input."
  x_note: "Subject and verb: 'Security categories are to be used in conjunction with vulnerability and threat information in assessing the risk to an organization'. 'should certain events occur' is conditional. The first two sentences describe the publication."
REQ-FIPS199-0032:
  x_existing: "infotypes.schema.json `information_types` (P-12), playbooks/C/C-2.md step 4, a value per INF-* record and objective; ART-CAT '## Impact per information type'."
  x_note: "Promoted, footnote 1, first sentence. 'Information is categorized according to its information type'. The second sentence is a definition."

# --- Page 6: objectives and impact definitions ---
REQ-FIPS199-0010:
  x_existing: "framework/tasks/C.yaml C-2 exit criterion 1 (consistent with the organization's risk management strategy), playbooks/C/C-2.md steps 3 and 4 and personas/PER-IO.md (mission consequences, by the FIPS 199 definitions)."
  x_gap: "'and the overall national interest': no step asks it of the owner. system-categorization-adjustment, extended: C-2 step 4, the owner's reason weighs harm beyond the organization."
  x_note: "Subject and verb: 'The application of these definitions must take place within the context of each organization and the overall national interest'."
REQ-FIPS199-0011:
  status: not-a-requirement
  reason: "Definition of LOW, read with the rejected line above it, 'The potential impact is LOW if—'. 'could be expected to have a limited adverse effect' states a level's meaning, so that expected to binds no one; applying it is 0010, and C-2 and PER-IO read it."
  x_note: "Subject and verb: 'The loss of confidentiality, integrity, or availability could be expected to have a limited adverse effect'."
REQ-FIPS199-0012:
  status: not-a-requirement
  reason: "Definition of MODERATE, read with the rejected line above it, 'The potential impact is MODERATE if—'. 'could be expected to have a serious adverse effect' fixes the middle level's meaning; that expected to names a likely harm, not a duty."
  x_note: "Subject and verb: 'The loss of confidentiality, integrity, or availability could be expected to have a serious adverse effect'."

# --- Page 7: information types ---
REQ-FIPS199-0013:
  status: not-a-requirement
  reason: "Definition of HIGH, read with the rejected line above it, 'The potential impact is HIGH if—', on this page. 'expected to have a severe or catastrophic adverse effect' marks the top of the scale and tells no one to act."
  x_note: "Subject and verb: 'The loss of confidentiality, integrity, or availability could be expected to have a severe or catastrophic adverse effect'."
REQ-FIPS199-0014:
  x_existing: "infotypes.schema.json `confidentiality`, `integrity`, `availability` per type; playbooks/C/C-2.md steps 3 and 4; ART-CAT '## Impact per information type'."
  x_note: "Subject and verb: 'Establishing an appropriate security category of an information type essentially requires determining the potential impact for each security objective'. The rest describes what a category can be used for."
REQ-FIPS199-0015:
  x_existing: "infotypes.schema.json: a `base`, and an optional `selected`, for each of confidentiality, integrity and availability; the C, I, A table of ART-CAT."
  x_note: "Cut pair with promoted 0031, both live: this piece has the form of the category, 0031 the values it may take. The lead-in 'The generalized format ... is:' is a rejection on this page."
REQ-FIPS199-0031:
  work_item: WI-13
  x_note: "Promoted. 'the acceptable values for potential impact are LOW, MODERATE, HIGH, or NOT APPLICABLE'. WI-13 names NA confidentiality; the infotypes `impact` enum has low, moderate, high only."
REQ-FIPS199-0016:
  x_new_work_item: "system-information-type: footnote 3 of FIPS 199, system information such as routing tables, password files and key management information is protected at the level of the most critical or sensitive user information; ART-INFOTYPES records it as a type or says it follows that level. C-2 only asks PER-ISSE whether keys and configurations are typed."
  x_home: "Task P-12, ART-INFOTYPES '## Information types'"
  x_note: "Subject and verb: 'System information (e.g., network routing tables, password files, and cryptographic key management information) must be protected at a level commensurate with the most critical or sensitive user information'."
REQ-FIPS199-0017:
  work_item: WI-13
  x_note: "Footnote 4. 'The potential impact value of not applicable only applies to the security objective of confidentiality'. When WI-13 adds NA it must allow it on confidentiality alone."

# --- Page 8: information systems ---
REQ-FIPS199-0018:
  work_item: WI-13
  x_note: "Subject and verb: 'Determining the security category of an information system ... must consider the security categories of all information types'; 'the potential impact values ... shall be the highest values (i.e., high water mark)'. C-2 step 5 says so in prose, but no rule reads infotypes.yaml, as with CNSSI1253 0050."
REQ-FIPS199-0019:
  x_existing: "facts.schema.json $defs `impact`, enum low, moderate, high, on `categorization` c, i and a."
  x_note: "'SC information system = ... where the acceptable values for potential impact are LOW, MODERATE, or HIGH'."
REQ-FIPS199-0020:
  x_existing: "facts.schema.json $defs `impact` has no NA, so facts `categorization` c, i and a cannot take it."
  x_note: "Subject and verb: 'the value of not applicable cannot be assigned to any security objective in the context of establishing a security category for an information system'. When WI-13 adds NA to infotypes.schema.json, facts.schema.json must stay without it."
REQ-FIPS199-0021:
  status: not-a-requirement
  reason: "Result of Example 4: 'SC acquisition system = {(confidentiality, MODERATE), ...}'. The worked value for a fictional contracting system."
REQ-FIPS199-0022:
  status: not-a-requirement
  reason: "Footnote 5, a simplifying assumption: 'These system processing functions also require protection and could be subject to security categorization', but it 'is assumed' the information types give the worst case, 'obviating the need'. That require is withdrawn in the same note, so it binds no one."
  x_note: "Subject and verb: 'These system processing functions also require protection'; 'it is assumed that the security categorization of all information types ... provide an appropriate worst case'."

# --- Page 9: Example 5 ---
REQ-FIPS199-0023:
  status: not-a-requirement
  reason: "Interim result of Example 5: 'SC SCADA system = {(confidentiality, LOW), (integrity, HIGH), (availability, HIGH)}', for a fictional power plant."
REQ-FIPS199-0024:
  status: not-a-requirement
  reason: "Prose of Example 5: 'The management at the power plant chooses to increase the potential impact'. 'should there be a security breach' is conditional in a story about one plant, so that should binds no one."
  x_note: "Subject and verb: 'The management at the power plant chooses to increase the potential impact from a loss of confidentiality from low to moderate'."
REQ-FIPS199-0025:
  status: not-a-requirement
  reason: "Final result of Example 5, 'SC SCADA system = {(confidentiality, MODERATE), (integrity, HIGH), (availability, HIGH)}', the last line of the worked example."

# --- Page 10: Table 1, summary of the definitions; one row set, noise ---
REQ-FIPS199-0026:
  status: not-a-requirement
  reason: "Column header of Table 1: 'Security Objective | LOW | MODERATE | HIGH'."
REQ-FIPS199-0027:
  status: not-a-requirement
  reason: "Table 1 row for Confidentiality: summarizes the definitions of 0011 to 0013 for unauthorized disclosure. Each 'could be expected to' cell defines a level, so that expected to binds no one; C-2 cites this table as the scale it applies."
  x_note: "Subject and verb: 'The unauthorized disclosure of information could be expected to have a limited adverse effect'."
REQ-FIPS199-0028:
  status: not-a-requirement
  reason: "Table 1 row for Integrity: the same three levels for unauthorized modification or destruction. 'could be expected to have' a given effect is the meaning of a cell, and expected to here sets no task."
  x_note: "Subject and verb: 'The unauthorized modification or destruction of information could be expected to have a limited adverse effect'."
REQ-FIPS199-0029:
  status: not-a-requirement
  reason: "Table 1 row for Availability: the three levels for disruption of access. The cells are definitions; expected to measures harm and asks nothing of anyone."
  x_note: "Subject and verb: 'The disruption of access to or use of information or an information system could be expected to have a limited adverse effect'."
