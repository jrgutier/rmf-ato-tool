# DODI5000.87 triage, not tier 1, whole document, pages 3 to 18, read against
# references/text/DODI5000.87.md and PDF page 8 (Figure 1). Acquisition is modelled at its RMF
# touchpoints only. DA reads as PER-MDA, sponsor as PER-SPONSOR, a Component head as PER-CIO's Head
# of Agency, program office as PER-PM. x_ keys are notes.

# --- Page 3: applicability, policy a to e ---
REQ-DODI5000.87-0001:
  status: not-a-requirement
  reason: "Applicability clause: the issuance reaches OSD, the Military Departments and the other organizational entities, collected as 'DoD Components'. It names no act to perform."
REQ-DODI5000.87-0002:
  status: not-a-requirement
  reason: "Background on the DAS: 'DoD will employ an adaptive acquisition framework' uses will to describe how the Department organizes acquisition, with no addressee and no act, so it binds no one. The rest points to DoDD 5000.01 and states an objective."
  x_note: "Subject and verb: 'DoD will employ'. The framework already lists the AAF pathways in framework/pathways.yaml."
REQ-DODI5000.87-0003:
  work_item: WI-34
  x_note: "'Software programs that meet the definition of a covered Defense Business System (DBS) should use the DBS pathway ... but may elect to incorporate this pathway for custom developed software'. A combined pathway case, inside WI-34's title: a run names one pathway and no code reads it. The sentence on what the pathway is for is description."
REQ-DODI5000.87-0004:
  x_new_work_item: "uca-need-documents"
  x_home: "framework/external-inputs.yaml EXT-CAPDOC, extended: admit a capability needs statement, since 'Programs executing the software acquisition pathway are not subject to' JCIDS and EXT-CAPDOC names JCIDS documents only. Stays apart from WI-33, which replaces JCIDS generally."
  x_note: "'will be handled as specifically provided for by the Vice Chairman of the Joint Chiefs of Staff': that handling is the department's. What reaches a run is that no JCIDS document exists for P-15 and C-2 to read."
REQ-DODI5000.87-0005:
  status: deferred
  reason: "Governs program category: pathway programs 'will not be treated as major defense acquisition programs even if exceeding thresholds' in 10 U.S.C. 2430. Statutory treatment of cost thresholds, which no RMF run reads or produces."
REQ-DODI5000.87-0006:
  status: deferred
  reason: "Governs delivery cadence: programs 'will demonstrate the viability and effectiveness of capabilities for operational use not later than 1 year' after first obligation, then deliver at least annually. A schedule tied to funds obligated, not an authorization input; no RMF run tests it."
  x_note: "That a release is authorized before it reaches operations is PW-SWP's 'authorize per release' and swp-gate-map at 0111; the clock itself is acquisition."

