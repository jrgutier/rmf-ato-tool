# SP800-53R5 triage: pages 28 to 42 read whole against the source. Pages 43 to 400 are the control
# catalog, an ID set pinned by REF-008, and hold no entry. 0081 is promoted by this job.
# Footnote 11 keeps NSS outside FISMA; CNSSI 1253 carries this catalog into a run, so a duty here
# reaches a run through S-1 and S-2. Role map from personas.txt: authorizing official = PER-AO;
# designated representative = PER-AODR; system owner = PER-PM; common control provider = PER-CCP;
# information security program = PER-CISO; privacy program = PER-PRIV.

