  status: not-a-requirement
  reason: "Definitions of security and privacy controls and of where requirements come from. In 'mission needs to ensure', 'needs' is a noun followed by a purpose clause, so 'needs to' binds no one. The duty to select and implement is 0031."
  x_note: "Subject and verb: 'Security and privacy requirements are derived from applicable laws ... and mission needs to ensure the confidentiality'; 'controls are selected and implemented to satisfy security and privacy requirements'."
