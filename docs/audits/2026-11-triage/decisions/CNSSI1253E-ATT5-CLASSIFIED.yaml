# --- Page 4 ---
REQ-CNSSI1253E-ATT5-CLASSIFIED-0041:
  x_new_work_item: "CLASSIFICATION-HANDLING"
  x_note: "Cut pair with 0011. Subject and verb: 'Proper marking is also essential for appropriate handling of classified information'. The slug holds the handling marking on the package. 'requiring personnel clearances, signed non-disclosure agreements' lists methods, which the assumptions 0014 to 0016 restate. The sentence ending the statement is a lead-in to those assumptions."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0012:
  status: not-a-requirement
  reason: "First assumption, 'The system stores, processes, or transmits classified information', which only restates the applicability question in 0017."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0013:
  x_new_work_item: "baseline-assumptions"
  x_gap: "A system holding SAP or SCI takes the Intelligence Overlay instead: WI-22."
  x_note: "Assumption: 'The system does not store, process, or transmit classified information that requires protection within any Special Access Program'. Live because a system outside it must tailor, which S-2 does not test."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0014:
  x_new_work_item: "baseline-assumptions"
  x_note: "Assumption: 'All persons authorized for access to the system have been granted a security clearance for the highest classification'. users.yaml records no clearance. Only a classified fork has it; the controls that hold it are ps-3.1 and ps-6.2 in the add list."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0015:
  x_new_work_item: "baseline-assumptions"
  x_gap: "users.yaml has no citizenship or foreign marking: foreign-access."
  x_note: "Assumption: 'All persons authorized for access to the system are U.S. citizens'. A system with non-US users fails it, which 0043 sends to an overlay the library lacks."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0016:
  x_new_work_item: "baseline-assumptions"
  x_note: "Assumption: 'The organization provides facility and personnel security to ensure only personnel with security clearances ... are allowed unescorted access'. Control pe-2.3 and pe-3.2 sit in the add list; S-2 does not test that the facility meets the assumption."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0042:
  status: not-a-requirement
  reason: "Lead-in, 'Use the following question to determine the applicability', over the single question in 0017, where the test is."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0017:
  x_existing: "playbooks/C/C-2.md step 6, 'Classified information overlay ... applies when it processes classified information', with a reason for a ruled-out overlay in ART-CAT '## Overlays'."
  x_gap: "'by intent and design': C-2 does not separate a spill from a designed use, CLASSIFICATION-HANDLING."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0018:
  status: not-a-requirement
  reason: "Footnote 9 explains that classified safeguards and information-type safeguards are separate concepts. 'safeguarding needs to address' is a noun phrase, so needs to binds no one, and 'may be needed' only says other safeguards can apply."
  x_note: "Subject and verb: 'safeguarding needs to address the risks'; 'safeguards ... may be needed'."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0019:
  work_item: WI-22
  x_note: "Footnote 10. Subject and verb: 'the specification in the Intelligence Overlay apply'; 'consult that authority for appropriate specifications'. Unknown overlay IDs fail, and a SAP under another authority has no ID at all, so closure needs both cases."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0020:
  status: not-a-requirement
  reason: "Footnote 11 limits the question in 0017: a system holding classified data only because of a spill is outside. It names no actor and no act; the point is carried as 0017's gap."

