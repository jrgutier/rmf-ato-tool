# CNSSI1253E-ATT5-CLASSIFIED triage. Pages 1-9 and 41-43 read whole, page 10 for the lead of Section 6.
# 0043 is promoted from page 2, which sources.yaml excludes though it ends Section 1.
# Transcribed: Table 1's + cells, as the add list in framework/baselines/cnssi-1253.yaml. Not transcribed:
# G, R, V marks, Table 1's Privacy Implementation Considerations column, Table 2 and Section 6's text.
# The overlay is picked at playbooks/C/C-2.md step 6 and FACTS-001 accepts its ID.

# --- Page 1 ---
REQ-CNSSI1253E-ATT5-CLASSIFIED-0001:
  x_new_work_item: "tailoring-legal-floor"
  x_note: "Subject and verb: 'Organizations must effectively manage security and privacy risks related to safeguarding classified information'; 'Controls identified in this overlay generally have a legal/regulatory requirement ... and should not be tailored out without significant justification'. The first is held by the add list once the overlay is picked; the second is not: tailoring.yaml can remove an overlay control on a reason like any other. AT-2 is the page's example. Only a classified fork has it."
REQ-CNSSI1253E-ATT5-CLASSIFIED-0040:
  x_existing: "playbooks/C/C-2.md step 6 checks each overlay in turn, so Privacy and Classified are recorded together; baseline.py overlay_ids applies both."
  x_gap: "'and document them (e.g., in the privacy plan)': WI-02, there is no privacy plan."
  x_note: "Subject and verb: 'Organizations must ensure appropriate privacy control specifications are applied to classified systems that process PII'. The opening sentences finish the AT-2 example of 0001. 'must address system-specific privacy risks' is a condition on NSS, not a duty."

# --- Page 2: Section 1 ends here, though the page is excluded ---
REQ-CNSSI1253E-ATT5-CLASSIFIED-0043:
  work_item: WI-22
  x_note: "Promoted. Subject and verb: 'This overlay does not include control specifications for cross domain solutions (CDS), intelligence systems ... or networks on which non-US persons have or may have access'; 'refer to the appropriate overlay'. WI-22 holds CDS and Intelligence. The third class names no overlay in the library; see 0015."

