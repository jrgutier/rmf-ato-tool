# SP800-137A part 2, pages 52 to 59. Written by hand, entry by entry, against the source pages.
REQ-SP800-137A-0280:
  status: not-applicable
  reason: "Binds the ISCM program assessor: 'assessors use the associated assessment procedure to obtain and review evidence'. Checked PER-SCA and M-2: PER-SCA gathers evidence on controls under ART-SAP, and no task carries a program element or its procedure. The first and last sentences only define the element and its levels."
REQ-SP800-137A-0359:
  status: not-applicable
  reason: "Binds whoever tailors a program assessment: 'the corresponding assessment procedure information is created or modified' when an element is added or modified. Checked PER-SCA and ART-SAP: ART-SAP plans control assessment, and no run artifact holds program elements, so there is no procedure to update."
REQ-SP800-137A-0281:
  status: not-a-requirement
  reason: "Catalog field definition: 'Identifier. A string that uniquely identifies the assessment element'. No actor."
REQ-SP800-137A-0282:
  status: not-a-requirement
  reason: "Catalog field definition: 'Assessment Element Text. Defines the evaluation criteria'; 'with which the assessor determines' says what the text is for and asks nothing of the assessor."
REQ-SP800-137A-0283:
  status: not-a-requirement
  reason: "Catalog field definition: 'Level. The applicable organizational risk management level(s)'; a label with a pointer to section 2.1.3."
REQ-SP800-137A-0284:
  status: not-a-requirement
  reason: "Catalog field definition: 'Source. Authoritative publications or practices' behind each element; names a column."
REQ-SP800-137A-0285:
  status: not-a-requirement
  reason: "Catalog field definition: 'The assessment procedure is a multi-part attribute' made of objective, methods and objects. 'to be carried out on evidence' describes what the attribute specifies; the assessor's use of it is 0280."
REQ-SP800-137A-0286:
  status: not-a-requirement
  reason: "Defines a part of the procedure attribute: 'contains a specification of the suggested assessment methods' and 'The assessment method defines the nature and extent'. Methods are suggested, and the sentence leads into their definitions 0287 and 0288."
REQ-SP800-137A-0287:
  status: not-a-requirement
  reason: "Definition of a method: 'Examine: The process of reviewing, inspecting, observing, studying, or analyzing'."
REQ-SP800-137A-0288:
  status: not-a-requirement
  reason: "Definition of a method: 'Interview: The process of holding discussions with individuals or groups'."
REQ-SP800-137A-0289:
  status: not-applicable
  reason: "Binds the organization and the ISCM program assessor: they 'coordinate with respect to the evidence needed to provide the level of assurance' the organization desires. Checked PER-SCA and PER-CISO: A-2 settles evidence for controls in ART-SAP, and no task negotiates assurance for a program assessment."
  x_note: "Source conflict: 'In all three assessment methods', but page 53 and Table 5 name only Examine and Interview."
REQ-SP800-137A-0290:
  status: not-a-requirement
  reason: "'Assessment objects are the potential items (evidence)' and 'can include' define a term, and 'Specifications are document-based artifacts, such as:' leads into examples."
REQ-SP800-137A-0338:
  status: not-a-requirement
  reason: "Example noun under 'Specifications are document-based artifacts, such as:', 'ISCM strategies'; what an assessor might examine, with no verb."
REQ-SP800-137A-0291:
  status: not-a-requirement
  reason: "Example noun under the same 'such as:' list, 'ISCM program policies and procedures'; no one is told to produce it here."
REQ-SP800-137A-0292:
  status: not-a-requirement
  reason: "Example noun under the same list, 'System security plans'; names an object of examination, and ART-SSP's duty comes from elsewhere."
REQ-SP800-137A-0339:
  status: not-a-requirement
  reason: "Example noun under the same list, 'Security requirements'; a possible object, no verb."
REQ-SP800-137A-0293:
  status: not-a-requirement
  reason: "Example noun under the same list, 'ISCM automation functional specifications'; a possible object, no verb."
REQ-SP800-137A-0294:
  status: not-a-requirement
  reason: "Example noun under the same list, 'ISCM technical architecture designs'; a possible object, no verb. Noted as unheld at 0052."
REQ-SP800-137A-0295:
  status: not-a-requirement
  reason: "Example noun under the rejected definition 'Mechanism outputs are reports or notifications ... such as:', 'Security dashboard reports'; an example of an assessment object."
REQ-SP800-137A-0296:
  status: not-a-requirement
  reason: "Example noun under the mechanism outputs definition, 'SIEM reports'; an example of an assessment object."
REQ-SP800-137A-0297:
  status: not-a-requirement
  reason: "Example noun under the mechanism outputs definition, 'Network firewall reports'; an example of an assessment object."
REQ-SP800-137A-0298:
  status: not-a-requirement
  reason: "Example under the rejected definition 'Activities are the monitoring-related actions ... such as:', 'Performing manual monitoring operations'; illustrates a term, and does not direct anyone to perform them."
REQ-SP800-137A-0299:
  status: not-a-requirement
  reason: "Example under the Activities definition, 'Reviewing ISCM reports'; names a thing an assessor could observe."
REQ-SP800-137A-0300:
  status: not-a-requirement
  reason: "Example under the Activities definition, 'Following procedures'; names a thing an assessor could observe."
REQ-SP800-137A-0301:
  status: not-a-requirement
  reason: "Example under the Activities definition, 'Making risk-based decisions'; names a thing an assessor could observe, and says nothing about how decisions are made."
REQ-SP800-137A-0302:
  status: not-a-requirement
  reason: "Catalog field definition: 'The Discussion attribute provides supplemental guidance'. 'may need to consider' says what the text may flag, so need to puts no duty on the assessor and binds no one."
  x_note: "Subject and verb: 'the assessor may need to consider'."
REQ-SP800-137A-0303:
  status: not-a-requirement
  reason: "Catalog field definition: 'Rationale for Level', why an element sits at a level; names a column."
REQ-SP800-137A-0304:
  status: not-a-requirement
  reason: "Catalog field definition: 'Parent is the linkage to the previous process step assessment element'."
REQ-SP800-137A-0305:
  status: not-a-requirement
  reason: "Defines the column 'Critical Element in NISTIR 8212'. 'Organizations are encouraged to review the Criticality designation' in accordance with organizational risk repeats footnote 18 (0178): encouraged, on a column feeding optional scoring, binds no one, and in accordance with only qualifies that advice."
  x_note: "Subject and verb: 'Organizations are encouraged to review the Criticality designation and revise the value'."
REQ-SP800-137A-0306:
  status: not-a-requirement
  reason: "Catalog field definition: 'Chain Label', with 'may be linked together'; a short name for a group of elements."
REQ-SP800-137A-0307:
  status: not-a-requirement
  reason: "Catalog field definition: 'Chain Sort. A key for sorting assessment elements'."
REQ-SP800-137A-0308:
  status: not-a-requirement
  reason: "Advisory permission, not a minimum set: 'Organizations are not expected to employ all assessment methods' and 'have the flexibility to choose'. Not expected to lifts a duty rather than states one, so it binds no one."
  x_note: "Subject and verb: 'Organizations are not expected to employ all assessment methods and objects'."
REQ-SP800-137A-0309:
  status: not-applicable
  reason: "Binds the ISCM program assessor: each applicable element 'is acted upon (executed) by the assessor', who 'makes a judgment of the degree' it is satisfied. Checked PER-SCA and PER-CISO: A-3 and M-2 judge controls, and no task executes a program element, as with 0134 and 0136."
REQ-SP800-137A-0310:
  status: not-applicable
  reason: "Binds the ISCM program assessor: each determination statement 'produces ... one of the following judgments' and 'the assessment provides for annotated reasons'. Checked PER-SCA and sar-results: those result values govern controls, and no run field holds a program finding. What the report must tell the organization is live at 0311."
  x_note: "Subject and verb: 'The reasons inform the organization of shortfalls in the ISCM program that may need to be addressed'; need to sits in that description of the annotations."
REQ-SP800-137A-0311:
  x_new_work_item: "iscm-assessment-input: the ISCM program assessment report is an external input a run reads for ongoing authorization"
  x_home: "new EXT entry in framework/external-inputs.yaml, listed in M-6 inputs"
  x_note: "Live sentence: 'assessment results include sufficient information about shortfalls to indicate what further actions are required'; it shapes the report a run would read. 'organizations may choose to define subcategories' is an option. ART-SAR holds shortfalls for control findings only."
REQ-SP800-137A-0312:
  status: not-a-requirement
  reason: "Header row of Table 5, 'Assessment Element Format': column names only."
REQ-SP800-137A-0313:
  status: not-a-requirement
  reason: "Second line of the Table 5 header, 'Element | NISTIR 8212 /'; a split header cell."
REQ-SP800-137A-0314:
  status: not-a-requirement
  reason: "Third line of the Table 5 header, 'Text | ISCMAx Tool'; a split header cell."
REQ-SP800-137A-0315:
  status: not-a-requirement
  reason: "Template row of Table 5: 'Identifier', 'Applicable risk management level', 'Y or N'; each cell says what a column holds."
  x_note: "Extraction ran the caption 'Table 6 – Example Assessment Element' into the first cell; the PDF shows it as a caption between the tables."
REQ-SP800-137A-0316:
  status: not-a-requirement
  reason: "Header row of Table 6, 'Example Assessment Element': column names only."
REQ-SP800-137A-0317:
  status: not-a-requirement
  reason: "The one row of Table 6, an example repeating element 1-002. 'Level 1 is responsible for defining the ISCM program' fills that example's Rationale cell, so responsible for assigns nothing new and binds no one here; the element's duty is live at REQ-SP800-137A-0088."
  x_note: "Subject and verb: 'Level 1 is responsible for defining the ISCM program'; 'There is an ISCM program derived from the organization-wide ISCM strategy'."
REQ-SP800-137A-0318:
  status: not-a-requirement
  reason: "Figure 8, a worked example: 'Steps 1 through 4 explain how the information fields of the example assessment element in Table 6 are used'. 'Make a judgement' and 'Annotate reasons' walk through element 1-002 only; the general rule is 0309 and 0310."
REQ-SP800-137A-0319:
  status: not-applicable
  reason: "Binds the ISCM program assessor: 'Each assessment element is applied in a similar manner' and 'Results (judgments) ... are combined across multiple organizational levels'. Checked PER-SCA and PER-RE: no task applies elements or combines judgments across levels, as with 0146 and 0148."
  x_note: "Subject and verb: 'The assessment procedures lead the assessor to the judgment decision point in accordance with the assessment objective'; that clause describes the procedure."
REQ-SP800-137A-0320:
  status: not-a-requirement
  reason: "Advisory permission, not a minimum set: 'the organization ... may add assessment elements' and 'assessment elements may be deleted or bypassed'. 'includes the minimum set' describes the [Catalog], as 0095 does; the permissions themselves bind no one."
REQ-SP800-137A-0321:
  status: not-a-requirement
  reason: "Scope statement repeating 0202: 'does not repeat or augment control assessments' but 'verifies that the control assessments are conducted according to each assessment element's conditions'. 'conducted in accordance with [SP800-53A]' only names how those assessments run and binds no one; the frequency duty is REQ-SP800-137A-0074."
  x_note: "Subject and verb: 'The ISCM program assessment does not repeat or augment control assessments (conducted in accordance with [SP800-53A]) but verifies'."
REQ-SP800-137A-0322:
  status: not-a-requirement
  reason: "Advisory permission, not a minimum set: 'Tailoring is a cooperative process' describes it, 'the assessment itself may be tailored' permits it, and 'helps adapt' and 'helps facilitate' give reasons."
REQ-SP800-137A-0323:
  status: not-applicable
  reason: "Binds those tailoring the assessment: tailoring 'is coordinated with the assessment organization' and 'All tailoring decisions are documented in the ISCM Program Assessment Plan'. Checked PER-CISO and PER-SCA: S-2 tailors controls, and no run artifact is that plan, as with 0347."
REQ-SP800-137A-0324:
  status: not-applicable
  reason: "Binds organizational leadership: 'The scope of the assessment is determined by the organization's leadership'. Checked PER-CIO and PER-RE: no task scopes a program assessment, and scoping is the planning of that body's own work, as with 0188 and 0232; 'may also be limited' is an option."
REQ-SP800-137A-0325:
  status: not-a-requirement
  reason: "Advisory permission, not a minimum set: 'Tailoring could result in modifications', 'may be reworded' and 'may be tailored by creating additional elements'."
REQ-SP800-137A-0360:
  x_new_work_item: "iscm-assessment-input: the ISCM program assessment report is an external input a run reads for ongoing authorization"
  x_home: "new EXT entry in framework/external-inputs.yaml, listed in M-6 inputs"
  x_note: "'the assessors present a draft report' and 'a final report that resolves any differences of opinion ... is presented to the organization'. Same delivery as 0278; kept because it adds that the final report settles differences, which shapes what a run would read."
REQ-SP800-137A-0326:
  status: not-a-requirement
  reason: "Advisory: 'may be intense and short-lived', 'Organizational personnel may meet with the assessment team' and 'may also involve meetings'. Describes how long the engagement runs and permits follow-up, with no minimum set."
REQ-SP800-137A-0327:
  status: not-a-requirement
  reason: "Advisory permission, not a minimum set: 'may be repeated at predetermined intervals' and 'may be expanded in scope'. The periodic review itself is the live REQ-SP800-137A-0014."
