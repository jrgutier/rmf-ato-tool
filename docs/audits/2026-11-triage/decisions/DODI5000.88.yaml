# DODI5000.88: decisions by page, written by hand against the source pages.
# --- Page 4: applicability and policy ---
REQ-DODI5000.88-0001:
  status: not-a-requirement
  reason: "Applicability sentence: 'This issuance applies to OSD' and the other named bodies. It says who the instruction covers and asks no act."
REQ-DODI5000.88-0002:
  status: deferred
  reason: "'The DoD will conduct a comprehensive engineering program for defense systems' governs engineering management across the Department; no RMF run consumes or produces that program."
REQ-DODI5000.88-0003:
  status: not-a-requirement
  reason: "Describing lead-in to the live duty 0002: 'The engineering management activities include' a list and asks nothing of its own."
REQ-DODI5000.88-0004:
  status: not-a-requirement
  reason: "Bare noun 'Mission engineering (ME)', one item of the activities list; the duty is 0002."
REQ-DODI5000.88-0005:
  status: not-a-requirement
  reason: "Bare noun 'Systems engineering', one item of the activities list; the duty is 0002."
REQ-DODI5000.88-0006:
  status: not-a-requirement
  reason: "Bare noun 'Technical risk assessments', one item of the activities list; the duty is 0002."
REQ-DODI5000.88-0007:
  status: deferred
  reason: "'A systems engineering plan (SEP) ... is required' for MDAPs and ACAT II and III programs governs engineering planning. The SEP's existence and waiver feed no authorization, categorization or assessment in a run."
REQ-DODI5000.88-0008:
  status: not-a-requirement
  reason: "Advisory permission, not a minimum set: 'SEP content ... can be tailored with approval' allows a change and obliges no one to make it."
REQ-DODI5000.88-0009:
  status: not-a-requirement
  reason: "Advisory: 'SEPs are a recommended best practice' for other developments, so recommended here binds no one, and 'This issuance can be tailored' is a permission."
  x_note: "Subject 'SEPs', verb 'are a recommended best practice'; 'This issuance can be tailored'."
