# SP800-60V2R1, catalog mode, executive summary page 6, read whole. The catalog itself is pinned, and page 7 has no entry.
REQ-SP800-60V2R1-0001:
  status: not-a-requirement
  reason: "Item of 'FISMA tasked NIST to develop': history of the standard, FIPS 199. A tasking of NIST long since met, cited to explain where the guideline came from."
REQ-SP800-60V2R1-0002:
  status: not-a-requirement
  reason: "Second item of the same FISMA tasking: guidelines on information types, which the next paragraph says is this guideline. History, not a duty on a reader."
REQ-SP800-60V2R1-0003:
  status: not-a-requirement
  reason: "Third item of the same tasking: minimum requirements, FIPS 200's subject. History."
REQ-SP800-60V2R1-0004:
  status: not-a-requirement
  reason: "Item of 'The guideline and its appendices:': says what the document does, reviewing FIPS 199 terms. A contents description, no actor but the document."
REQ-SP800-60V2R1-0005:
  status: not-a-requirement
  reason: "Same contents list: 'Recommend a security categorization process' is what Volume I does. The process itself is at P-12 from SP800-60V1R1."
REQ-SP800-60V2R1-0006:
  status: not-a-requirement
  reason: "Same contents list: the document describes a methodology for identifying types."
REQ-SP800-60V2R1-0007:
  status: not-a-requirement
  reason: "Same contents list: the document suggests provisional levels, the appendices excluded from scope and pinned as a catalog."
REQ-SP800-60V2R1-0008:
  status: not-a-requirement
  reason: "Same contents list: the document discusses attributes that vary an impact level. 'may result in variances' is its topic."
REQ-SP800-60V2R1-0009:
  status: not-a-requirement
  reason: "Same contents list: the document describes how to reach a system categorization, which Volume I section 4 does."
REQ-SP800-60V2R1-0010:
  status: not-a-requirement
  reason: "How to read the volumes: 'should review' Volume I and 'will be relevant' are reading advice to the document's user, and bind no one to an act in a process."
  x_note: "Subject and verb: 'Users should review the guidelines provided in Volume I'; 'Not all of the material will be relevant to all agencies'."
REQ-SP800-60V2R1-0011:
  x_existing: "ART-INFOTYPES '## Information types' column 'adjustment and its reason' with infotypes.yaml, written at P-12, then P-13 categorization and C-2 review; the catalog values enter as provisional."
  x_note: "Promoted from a rejected paragraph. Subject and verb: 'The provisional security impact level assignments ... are only the first step'. Its second sentence, 'not intended to be used by auditors as a definitive checklist', limits how the catalog may be read, and the column above is what a reviewer sees instead."
