# DODI8500.01 part 1, pages 1 to 5 and 14 to 37 (pages 6 to 13 are excluded), read whole against the
# source, entry by entry. Locators repeat in this old format, so every subject below comes from the
# section heading on the page, never from locator or context.
# Role map from personas.txt: DoD CIO and DoD Component heads = PER-CIO (Head of Agency, CIO); USD(AT&L)
# = PER-MDA (Chief Acquisition Officer); DoD ISRMC and DSAWG = PER-RE; PM and system owner = PER-PM;
# system administrators = PER-ISSO; cybersecurity service providers = PER-CSSP. PAO and DoD SISO have no
# persona (WI-27).

# --- Base instruction, page 1: purpose and applicability ---
REQ-DODI8500.01-0001:
  status: not-a-requirement
  reason: "Purpose clause under '1. PURPOSE. This instruction:'. The subject is the instruction, 'Reissues and renames' DoDD 8500.01E, an act finished at signature that leaves nobody anything to do."
REQ-DODI8500.01-0002:
  status: not-a-requirement
  reason: "Purpose clause listing what the instruction 'Incorporates and cancels'; the cancelled issuances are a record of its own lineage, not an action on any role."
REQ-DODI8500.01-0003:
  status: not-a-requirement
  reason: "Purpose clause: 'Establishes the positions' of PAO and SISO and 'continues' the ISRMC. It announces offices; their appointments and duties are the Enclosure 2 entries 0048, 0059, 0115, 0138, 0186 and 0190."
REQ-DODI8500.01-0004:
  status: not-a-requirement
  reason: "Purpose clause that 'Adopts the term' cybersecurity in place of information assurance. A terminology choice by the issuance; it gives no role a task, and the tool's vocabulary already says cybersecurity."
REQ-DODI8500.01-0005:
  status: not-a-requirement
  reason: "Applicability item under 'This instruction applies to:'. It defines the phrase 'DoD Components' as a list of organizations; a scope, with no verb on any of them."

