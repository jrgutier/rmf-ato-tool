# DRAFT, not policy: the two FW-REQ-003 fan-out exceptions the I-8 overlay entries need. Copy
# into conformance/policy.yaml fan_out_exceptions only with approved_by: user, then run
# `uv run python docs/audits/2026-11-triage/ovs-fanout-marks.py`.
fan_out_exceptions:
  - kind: rule
    target: OVS-001
    limit: 288
    reason: "One clause holds every Section 6 control the Classified System and Privacy Overlays select: removing it must name each authority its Reference(s) cite. The per-control data is framework/baselines/overlay-specs.yaml, generated from the text and checked against each overlay's summary table, so one fixture proves the clause and the generator check proves each control's row. 288 items on 262 entries across WI-57 to WI-79."
  - kind: rule
    target: OVS-003
    limit: 91
    reason: "One clause holds every Section 6 parameter value of both overlays: the SSP or a tailoring parameter action records a value for each ODP the value assigns, mapped to ODPs through the catalog's statement items. Same data and checks as OVS-001. 91 items across WI-57 to WI-79."
