    statement: "The overall approach for this overlay’s tailoring is to specifically remove and add controls in relation to the Committee for National Security Systems (CNSS) Instruction (CNSSI) No. 1253 High-High-High (H/H/H) baseline that tailors National Institute of Standards and Technology (NIST) Special Publication (SP) 800-53B baselines created from NIST SP 800-53 Revision 5 controls. Therefore, this overlay is not baseline independent. This overlay also does not specifically need to be applied with another overlay. However, other overlays should be considered as applicable to the space system’s design and mission needs (e.g., classified processing that requires the Classified System Overlay). The tailoring in this overlay defines a maximum control baseline for the space platform based on assumptions and threats defined in Section 3."
