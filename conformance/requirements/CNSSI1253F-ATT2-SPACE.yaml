  - id: "REQ-CNSSI1253F-ATT2-SPACE-0004"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 3, "anchor": "As described in Section 1, this overlay is specific to a space"}
    kind: "indicative"
    locator: "3"
    context: ""
    statement: "As described in Section 1, this overlay is specific to a space platform and tailors the CNSSI No. 1253 (H/H/H) control baseline. This overlay tailors controls based on two primary factors of vulnerability and threat analysis that were developed in The Aerospace Corporation’s TOR-2023- 02161 Revision A, “Space Segment Cybersecurity Profile for National Security Systems”, analysis report sponsored by the Department of Defense Chief Information Officer. This vulnerability and threat analysis provides assumptions and guidance that remove or add controls for Space Platform Overlay tailoring."
    status: "not-a-requirement"
    reason: "Says how the overlay was built: from the vulnerability and threat analysis of Aerospace TOR-2023-02161. An author's method, not a step for anyone applying it; what it means for a run is in 0006 and 0022."
  - id: "REQ-CNSSI1253F-ATT2-SPACE-0005"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 3, "anchor": "The space platform vulnerability analysis approach examines system weaknesses that a threat"}
    kind: "indicative"
    locator: "3"
    context: ""
    statement: "The space platform vulnerability analysis approach examines system weaknesses that a threat can exploit. If vulnerability-associated conditions do not apply to the space platform, then there is no direct system weakness that a threat can likely exploit. This approach for vulnerability analysis provides justification for low risk associated with the weakness. Therefore, no associated countermeasure controls are necessary for the overlay protections. Space platform vulnerability assumptions relate to system design, operations, and the space environment used to tailor out controls considered not applicable. The vulnerability assumptions in Table 1 are used for tailoring actions as described in Section 6."
    status: "not-a-requirement"
    reason: "Explains the reasoning of the vulnerability approach: a weakness whose conditions do not apply justifies low risk. Rationale for the removals; the duty that goes with it, when an assumption fails, is the note in 0006."
