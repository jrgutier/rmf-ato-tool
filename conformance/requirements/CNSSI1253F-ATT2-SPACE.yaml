  - {"page": 6, "locator": "3", "reason": "no-marker", "text": "The Space Platform Overlay leveraged TTP and other information from the SPARTA website to guide control tailoring and selection justification. To ensure that the Space Platform Overlay’s core content is self-contained and not dependent on the SPARTA website, key guidance was copied from the website into Section 6 for all selected controls. However, Section 6 also leverages SPARTA website links to provide additional knowledge related to the controls, such as applicable threats, implementation guidance, countermeasures/mitigations, sample specification requirements, and other helpful knowledge. Utilizing SPARTA website links avoids a large amount of knowledge being captured in a document-centric, static format. This additional knowledge is instead represented in the data-centric SPARTA TTP framework that provides linked-content navigation. One additional rationale for having the separate SPARTA TTP framework is that the website provides evolving TTP information that can be kept up to date with current threat knowledge and other information updates that occur outside of the less frequent updates to this Space Platform Overlay."}
