    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 6, "anchor": "The Space Platform Overlay applies under the space NSS scope defined in"}
    kind: "indicative"
    locator: "4"
    context: ""
    statement: "The Space Platform Overlay applies under the space NSS scope defined in CNSSP 12 and CNSSI 1200 for all United States Government Departments and Agencies involved in the acquisition, development, lease, procurement, use, control, operation, or direct support of space systems and/or their components (e.g., launch systems, test ranges, space platforms, buses, payloads, operations centers, mission equipment, and user modems, terminals, and equipment) used to support National Security Missions (NSM). This policy is also applicable to all space NSS that are developed, owned, operated, controlled, or leased either by the USG or for the benefit of the USG by commercial entities (domestic and foreign) or foreign governments under bilateral or multilateral agreements that includes systems:"
    status: "partial"
    reason: "A space platform must apply the overlay (SPCOV-001). Which departments and agencies are involved, and CNSSI 1200's scope (not in the library), are not testable from a run."
