  - id: "REQ-CNSSI1253F-ATT2-SPACE-0007"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 6, "anchor": "Space platform threat assumptions are the second factor utilized to tailor in"}
    kind: "indicative"
    locator: "3"
    context: ""
    statement: "Space platform threat assumptions are the second factor utilized to tailor in and retain controls in the CNSSI No. 1253 H/H/H baseline. Threat analysis is leveraged to provide specific attack and defense context for all controls in the baseline. A threat is any circumstance or event with the potential to adversely impact the space NSS mission, assets, individuals, other organizations, or the Nation through unauthorized access, destruction, disclosure, modification of information, and/or denial of service. Specific to this threat analysis, threat events are used to identify situations with the potential for causing undesirable consequences or impact and this can be represented in the concept of tactics, techniques, and procedures (TTP). Tactics represent the categorization of why a threat event uses a technique, techniques and sub-techniques are how the threat event occurs, and procedures are the detailed implementation of a technique or sub-technique. The characterization of threat events through TTP provides detailed threat information that can be helpful for risk assessment, choice of countermeasures, and selection of controls. A full set of space platform associated TTP are on the Aerospace SPARTA website at https://sparta.aerospace.org. All SPARTA techniques have associated countermeasures with NIST SP 800-53 controls selected to assist system security engineering and implementation."
    status: "not-a-requirement"
    reason: "Describes threat analysis and the TTP vocabulary, ending that SPARTA techniques carry countermeasures. Definitions and background; 'can be helpful for risk assessment' is no direction."
