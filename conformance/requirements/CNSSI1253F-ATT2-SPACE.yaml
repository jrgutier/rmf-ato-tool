  - id: "REQ-CNSSI1253F-ATT2-SPACE-0001"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 1, "anchor": "Space national security system (NSS) maturity has developed to a point where"}
    kind: "indicative"
    locator: "1"
    context: ""
    statement: "Space national security system (NSS) maturity has developed to a point where numerous threats are now understood to pose risks for concerns such as unauthorized access, data integrity compromise, operational asset availability, and secure communications. This Space Platform Overlay identifies security control tailoring to protect portions of an overall space NSS. As notionally shown in Figure 1, a space NSS is characterized by space, ground, user, and link segments. This Space Platform Overlay’s scope is specific to the space platform and link segment capabilities that interface with the space platform. The space platform includes satellite payload(s) (e.g., imaging, communication, positioning navigation and timing), and onboard computing systems. This overlay’s scope also includes on-orbit communication relays. The link segment includes wireless communication within space and between space and the ground segment through components that utilize radio frequency communication (e.g., antennas, transceivers), data encryption, decryption, and transmission security components. It should be noted that this overlay does not address portions of the link segment interfacing with the ground and user segments. Hereafter, the term “space platform” is used to mean both the defined space platform and the related portions of the link segment interfacing with the space platform."
    status: "partial"
    reason: "The scope is held: SPCOV-001 fails the overlay on a ground or user segment. The first sentence says what the overlay is and the third defines a term; neither can fail."
    evidence: [{"kind": "rule", "target": "SPCOV-001", "fixture": "tests/fixtures/negative/SPCOV-001.yaml", "expect": "scope is the space platform and the link segment", "claim": "constraint", "asserts": "The overlay does not address the ground and user segments; a ground segment applying it fails: scope is the space platform and the link segment", "sentence": "It should be noted that this overlay does not address portions of the link segment interfacing with the ground and user segments."}]
