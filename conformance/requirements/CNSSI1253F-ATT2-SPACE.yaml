    context: "The following reference is informational:"
    statement: "Where space NSS form a part of a system-of-systems, which includes non-NSS or components, the mission owner and cognizant Authorizing Official for such a system-of-systems, in coordination with the National Manager for NSS, must consider the impact of non-NSS components in their end-to-end risk analysis. When practical and necessary, the AO may apply CNSSP 12 policy requirements to the non-NSS components."
