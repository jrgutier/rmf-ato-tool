  - id: "REQ-CNSSI1253F-ATT2-SPACE-0013"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 7, "anchor": "Where space NSS form a part of a system-of-systems, which includes non-NSS"}
