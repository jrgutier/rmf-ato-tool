  - id: "REQ-CNSSI1253F-ATT2-SPACE-0004"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 3, "anchor": "As described in Section 1, this overlay is specific to a space"}
    kind: "indicative"
    locator: "3"
    context: "The following reference is informational:"
    statement: "As described in Section 1, this overlay is specific to a space platform and tailors the CNSSI No. 1253 (H/H/H) control baseline. This overlay tailors controls based on two primary factors of vulnerability and threat analysis that were developed in The Aerospace Corporation’s TOR-2023- 02161 Revision A, “Space Segment Cybersecurity Profile for National Security Systems”, analysis report sponsored by the Department of Defense Chief Information Officer. This vulnerability and threat analysis provides assumptions and guidance that remove or add controls for Space Platform Overlay tailoring."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT2-SPACE-0005"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 3, "anchor": "The space platform vulnerability analysis approach examines system weaknesses that a threat"}
    kind: "indicative"
    locator: "3"
    context: "The following reference is informational:"
    statement: "The space platform vulnerability analysis approach examines system weaknesses that a threat can exploit. If vulnerability-associated conditions do not apply to the space platform, then there is no direct system weakness that a threat can likely exploit. This approach for vulnerability analysis provides justification for low risk associated with the weakness. Therefore, no associated countermeasure controls are necessary for the overlay protections. Space platform vulnerability assumptions relate to system design, operations, and the space environment used to tailor out controls considered not applicable. The vulnerability assumptions in Table 1 are used for tailoring actions as described in Section 6."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT2-SPACE-0006"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 3, "anchor": "Note: if any vulnerability assumption is not valid for a system or"}
    kind: "should"
    locator: "3"
    context: "The following reference is informational:"
    statement: "Note: if any vulnerability assumption is not valid for a system or mission, then the controls associated with that assumption should be revisited and considered for inclusion in the control baseline."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT2-SPACE-0007"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 6, "anchor": "Space platform threat assumptions are the second factor utilized to tailor in"}
    kind: "indicative"
    locator: "3"
    context: "The following reference is informational:"
    statement: "Space platform threat assumptions are the second factor utilized to tailor in and retain controls in the CNSSI No. 1253 H/H/H baseline. Threat analysis is leveraged to provide specific attack and defense context for all controls in the baseline. A threat is any circumstance or event with the potential to adversely impact the space NSS mission, assets, individuals, other organizations, or the Nation through unauthorized access, destruction, disclosure, modification of information, and/or denial of service. Specific to this threat analysis, threat events are used to identify situations with the potential for causing undesirable consequences or impact and this can be represented in the concept of tactics, techniques, and procedures (TTP). Tactics represent the categorization of why a threat event uses a technique, techniques and sub-techniques are how the threat event occurs, and procedures are the detailed implementation of a technique or sub-technique. The characterization of threat events through TTP provides detailed threat information that can be helpful for risk assessment, choice of countermeasures, and selection of controls. A full set of space platform associated TTP are on the Aerospace SPARTA website at https://sparta.aerospace.org. All SPARTA techniques have associated countermeasures with NIST SP 800-53 controls selected to assist system security engineering and implementation."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT2-SPACE-0008"
    citation: {"ref": "CNSSI1253F-ATT2-SPACE", "page": 6, "anchor": "The Space Platform Overlay applies under the space NSS scope defined in"}
    kind: "indicative"
    locator: "4"
    context: "The following reference is informational:"
    statement: "The Space Platform Overlay applies under the space NSS scope defined in CNSSP 12 and CNSSI 1200 for all United States Government Departments and Agencies involved in the acquisition, development, lease, procurement, use, control, operation, or direct support of space systems and/or their components (e.g., launch systems, test ranges, space platforms, buses, payloads, operations centers, mission equipment, and user modems, terminals, and equipment) used to support National Security Missions (NSM). This policy is also applicable to all space NSS that are developed, owned, operated, controlled, or leased either by the USG or for the benefit of the USG by commercial entities (domestic and foreign) or foreign governments under bilateral or multilateral agreements that includes systems:"
    status: "candidate"
