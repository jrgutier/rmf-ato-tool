  - id: "REQ-SP800-53AR5-0040"
    citation: {"ref": "SP800-53AR5", "page": 18, "anchor": "Organizations are encouraged to develop a broad-based, organization-wide strategy for conducting security"}
    kind: "should"
    locator: "2.2"
    context: "CONTROL STRUCTURE AND ORGANIZATION"
    statement: "Organizations are encouraged to develop a broad-based, organization-wide strategy for conducting security and privacy assessments to facilitate more cost-effective and consistent assessments across the inventory of systems. Maximizing the number of common controls employed within an organization significantly reduces the costs of development, implementation, and assessment of security and privacy controls; allows organizations to centralize and automate control assessments and amortize the cost of those assessments across all systems in the organization; and increases the consistency of security and privacy control implementations."
    status: "not-applicable"
    reason: "Binds the organization: 'Organizations are encouraged to develop a broad-based, organization-wide strategy for conducting security and privacy assessments'. Checked PER-CISO and task P-7: P-7 is the monitoring strategy, and no task or artifact holds an organization-wide assessment strategy, nor does a run consume one."
