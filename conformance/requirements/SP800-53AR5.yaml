    context: "ASSESSMENT METHODS"
    statement: "• The examine method is the process of reviewing, inspecting, observing, studying, or analyzing one or more assessment objects (i.e., specifications, mechanisms, or activities) to facilitate assessor understanding, achieve clarification, or obtain evidence."
    status: "not-a-requirement"
    reason: "Definition: 'The examine method is the process of reviewing, inspecting, observing'. sar-results `methods` holds the term."
  - id: "REQ-SP800-53AR5-0057"
