  - id: "REQ-SP800-53AR5-0290"
    citation: {"ref": "SP800-53AR5", "page": 729, "anchor": "The primary purpose of the security and privacy assessment reports is to"}
    kind: "indicative"
    locator: "ASSESSMENT REPORTS"
    context: "DOCUMENTING THE FINDINGS FROM SECURITY AND PRIVACY CONTROL ASSESSMENTS"
    statement: "The primary purpose of the security and privacy assessment reports is to convey the results of the security and privacy control assessments to appropriate organizational officials. The security assessment report and privacy assessment report are included in the system authorization package along with the system security plan and privacy plan (or equivalent for common controls), plan of action and milestones, and an executive summary to provide authorizing officials with the information necessary to make risk-based decisions on whether to authorize a system to begin operating or continue its operation. As the assessment and authorization process becomes more dynamic in nature, relying to a greater degree on the continuous monitoring aspects of the process as an integrated and tightly coupled part of the system development life cycle, the ability to update the security and privacy assessment reports frequently becomes a critical aspect of information security and privacy programs."
    status: "partial"
    reason: "PASM-002 fails privacy information reaching the AO from anyone but the senior agency official for privacy; the package content and frequent updates are prose."
    evidence: [{"kind": "rule", "target": "PASM-002", "fixture": "tests/fixtures/negative/PASM-002.recipient.yaml", "expect": "not the authorizing official or designated representative", "claim": "constraint", "asserts": "The privacy assessment reports convey the results of the privacy control assessments to the authorizing official or designated representative", "sentence": "The primary purpose of the security and privacy assessment reports is to convey the results of the security and privacy control assessments to appropriate organizational officials."}]
