requirements:
  - id: "REQ-SP800-53AR5-0001"
    citation: {"ref": "SP800-53AR5", "page": 12, "anchor": "Today’s systems2 are complex assemblages of technology (i.e., hardware, software, and firmware),"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED TO ASSESS SECURITY AND PRIVACY CONTROL EFFECTIVENESS"
    statement: "Today’s systems2 are complex assemblages of technology (i.e., hardware, software, and firmware), processes, and people working together to provide organizations with the capabilities to process, store, and transmit information in a timely manner in support of various mission and business functions. The degree to which organizations have come to depend upon systems to conduct routine, important, and critical mission and business functions means that the protection of the underlying systems and environments of operation is paramount to the success of the organization. The selection of appropriate security and privacy controls for a system is an important task that can have significant implications on the operations and assets of an organization as well as the welfare of individuals. Security controls are the safeguards or countermeasures prescribed for a system or an organization to protect the confidentiality, integrity, and availability of its system and information and to manage information security risk. Privacy controls are the administrative, technical, and physical safeguards employed within a system or an organization to manage privacy risks and ensure compliance with applicable privacy requirements.3"
    status: "not-a-requirement"
    reason: "Background: 'Today's systems are complex assemblages' and the definitions of security and privacy controls. It explains why assessment matters and tells no one to act."
  - id: "REQ-SP800-53AR5-0002"
    citation: {"ref": "SP800-53AR5", "page": 12, "anchor": "Once employed within a system, security and privacy controls are assessed to"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED TO ASSESS SECURITY AND PRIVACY CONTROL EFFECTIVENESS"
    statement: "Once employed within a system, security and privacy controls are assessed to determine their overall effectiveness (i.e., the extent to which the controls are implemented correctly, operating as intended, and producing the desired outcome with respect to meeting the security and privacy requirements for the system and the organization). Understanding the overall effectiveness of implemented security and privacy controls is essential in determining the risk to the organization’s operations and assets, individuals, other organizations, and the Nation resulting from the use of the system."
    status: "not-a-requirement"
    reason: "Background to the chapter. 'Understanding the overall effectiveness ... is essential in determining the risk' says why effectiveness matters; 'is essential' qualifies an understanding, so it binds no one. The duty to assess sits in 0039."
  - id: "REQ-SP800-53AR5-0003"
    citation: {"ref": "SP800-53AR5", "page": 12, "anchor": "The purpose of this publication is to provide guidelines for building effective"}
    kind: "indicative"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "The purpose of this publication is to provide guidelines for building effective security and privacy assessment plans, as well as a comprehensive set of procedures for assessing the effectiveness of security and privacy controls employed in systems and organizations. The guidelines apply to the security and privacy controls defined in [SP 800-53] (as amended), Security and Privacy Controls for Information Systems and Organizations. The guidelines have been developed to help achieve more secure systems by:"
    status: "not-a-requirement"
    reason: "Purpose clause: 'The purpose of this publication is to provide guidelines'. It describes the document and ends in the lead-in to goals 0004 to 0007."
  - id: "REQ-SP800-53AR5-0004"
    citation: {"ref": "SP800-53AR5", "page": 12, "anchor": "Enabling more consistent, efficient, comparable, and repeatable assessments of security and privacy"}
    kind: "lettered"
    locator: "1.1.•"
    context: "PURPOSE AND APPLICABILITY The guidelines have been developed to help achieve more secure systems by:"
    statement: "• Enabling more consistent, efficient, comparable, and repeatable assessments of security and privacy controls with reproducible results;"
    status: "not-a-requirement"
    reason: "First of the four goals under 'The guidelines have been developed to help achieve': 'Enabling more consistent' assessments. A hoped-for benefit of the document, no actor."
  - id: "REQ-SP800-53AR5-0005"
    citation: {"ref": "SP800-53AR5", "page": 12, "anchor": "Promoting a better understanding of the risks to organizational operations, organizational assets,"}
    kind: "lettered"
    locator: "1.1.•"
    context: "PURPOSE AND APPLICABILITY The guidelines have been developed to help achieve more secure systems by:"
    statement: "• Promoting a better understanding of the risks to organizational operations, organizational assets, individuals, other organizations, and the Nation resulting from the operation and use of systems;"
    status: "not-a-requirement"
    reason: "Second goal under the same lead-in: 'Promoting a better understanding of the risks'. A benefit, no actor."
  - id: "REQ-SP800-53AR5-0006"
    citation: {"ref": "SP800-53AR5", "page": 12, "anchor": "Facilitating more cost-effective assessments of security and privacy controls; and"}
    kind: "lettered"
    locator: "1.1.•"
    context: "PURPOSE AND APPLICABILITY The guidelines have been developed to help achieve more secure systems by:"
    statement: "• Facilitating more cost-effective assessments of security and privacy controls; and"
    status: "not-a-requirement"
    reason: "Third goal under the same lead-in: 'Facilitating more cost-effective assessments'. A benefit, no actor."
  - id: "REQ-SP800-53AR5-0007"
    citation: {"ref": "SP800-53AR5", "page": 13, "anchor": "Creating more complete, reliable, and trustworthy information for organizational officials to support"}
    kind: "lettered"
    locator: "1.1.•"
    context: "PURPOSE AND APPLICABILITY"
    statement: "• Creating more complete, reliable, and trustworthy information for organizational officials to support risk management decisions, reciprocity of assessment results, information sharing, and compliance with federal laws, Executive Orders, directives, regulations, and policies."
    status: "not-a-requirement"
    reason: "Fourth goal under the same lead-in: 'Creating more complete, reliable, and trustworthy information for organizational officials'. A benefit, no actor."
  - id: "REQ-SP800-53AR5-0008"
    citation: {"ref": "SP800-53AR5", "page": 13, "anchor": "This publication satisfies the requirements of Office of Management and Budget (OMB)"}
    kind: "indicative"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "This publication satisfies the requirements of Office of Management and Budget (OMB) Circular A-130 [OMB A-130] and the provisions of the Federal Information Security Modernization Act [FISMA]. The security and privacy guidelines in this publication are applicable to federal systems other than those systems designated as national security systems, as defined in 44 U.S.C., Section 3542. The guidelines have been broadly developed from a technical perspective to complement similar guidelines for national security systems and may be used for such systems with the approval of appropriate federal officials exercising policy authority over such systems. 4"
    status: "not-a-requirement"
    reason: "Applicability clause: 'The security and privacy guidelines ... are applicable to federal systems other than ... national security systems' and 'may be used for such systems with the approval of' policy officials. It fixes the document's reach and asks nothing of a run: DoDI 8510.01 p. 7 and its reference list name SP 800-53A for DoD systems, and EXT-ASSESSMENT-PROCEDURES consumes it."
  - id: "REQ-SP800-53AR5-0009"
    citation: {"ref": "SP800-53AR5", "page": 13, "anchor": "Organizations use this publication in conjunction with approved information security program plans,"}
    kind: "indicative"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "Organizations use this publication in conjunction with approved information security program plans, privacy program plans, system security plans, and privacy plans in developing assessment plans for producing and compiling the information necessary to determine the effectiveness of the security and privacy controls employed in the system and organization. The guidance in this publication has been developed with the intention of enabling organizations to tailor the basic assessment procedures provided. The assessment procedures are used as a starting point for and as input to the assessment plan. In developing effective security and privacy assessment plans, organizations take into consideration existing information about the controls to be assessed (e.g., results from assessments of risk; platform-specific dependencies in the hardware, software, or firmware; and any assessment procedures needed as a result of organization-specific controls not included in [SP 800-53]). 5"
    status: "partial"
    reason: "Selecting a procedure for every control is held; using SP 800-53A as a starting point cannot fail"
    evidence: [{"kind": "rule", "asserts": "Organizations develop assessment plans with methods and objects selected for every scoped control", "target": "ASMT-002", "fixture": "tests/fixtures/negative/ASMT-002.missing.yaml", "expect": "has no assessment methods and objects selected", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded", "sentence": "Organizations use this publication in conjunction with approved information security program plans, privacy program plans, system security plans, and privacy plans in developing assessment plans for producing and compiling the information necessary to determine the effectiveness of the security and privacy controls employed in the system and organization."}]
    work_item: "WI-269"
  - id: "REQ-SP800-53AR5-0010"
    citation: {"ref": "SP800-53AR5", "page": 13, "anchor": "The security categorization of the system; 6"}
    kind: "lettered"
    locator: "1.1.•"
    context: "PURPOSE AND APPLICABILITY The selection of appropriate assessment procedures and the rigor, intensity, and scope of the assessment depend on the following factors:"
    statement: "• The security categorization of the system; 6"
    status: "partial"
    reason: "RIGR-001 fails a plan whose rigor record omits this factor, but the field holds a pointer with one accepted value (ART-CAT, ART-RA, the plans), so a run that copies it passes whether or not the depth and coverage rest on it; SP 800-53A states no level of rigor per categorization or privacy risk that a rule could hold the procedures to"
    evidence: [{"kind": "rule", "asserts": "The rigor and scope of the assessment rest on the security categorization of the system, ART-CAT; another source fails", "target": "RIGR-001", "fixture": "tests/fixtures/negative/RIGR-001.yaml", "expect": "the rigor and scope of the assessment rest on the security categorization", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded"}]
    work_item: "WI-14"
  - id: "REQ-SP800-53AR5-0011"
    citation: {"ref": "SP800-53AR5", "page": 13, "anchor": "The privacy risk assessment for the system;"}
    kind: "lettered"
    locator: "1.1.•"
    context: "PURPOSE AND APPLICABILITY The selection of appropriate assessment procedures and the rigor, intensity, and scope of the assessment depend on the following factors:"
    statement: "• The privacy risk assessment for the system;"
    status: "partial"
    reason: "RIGR-001 fails a plan whose rigor record omits this factor, but the field holds a pointer with one accepted value (ART-CAT, ART-RA, the plans), so a run that copies it passes whether or not the depth and coverage rest on it; SP 800-53A states no level of rigor per categorization or privacy risk that a rule could hold the procedures to"
    evidence: [{"kind": "rule", "asserts": "When the system processes PII the rigor and scope of the assessment rest on the privacy risk assessment ART-RA; another source fails", "target": "RIGR-001", "fixture": "tests/fixtures/negative/RIGR-001.privacy.yaml", "expect": "rest on the privacy risk assessment", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded and the system processes PII"}]
    work_item: "WI-14"
  - id: "REQ-SP800-53AR5-0012"
    citation: {"ref": "SP800-53AR5", "page": 13, "anchor": "In accordance with the provisions of [FISMA] and OMB policy, whenever the"}
    kind: "modal"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY The selection of appropriate assessment procedures and the rigor, intensity, and scope of the assessment depend on the following factors:"
    statement: "In accordance with the provisions of [FISMA] and OMB policy, whenever the interconnection of federal systems to systems operated by state/local/tribal governments, contractors, or grantees involves the processing, storage, or transmission of federal information, the information security standards and guidelines described in this publication apply. Specific information security requirements and the terms and conditions of the system interconnections are expressed in Memoranda of Understanding (MOU) and Interconnection Security Agreements (ISAs) established by participating organizations. For additional guidance on managing the security of information exchanges, see NIST [SP 800-47], Revision 1, Managing the Security of Information Exchanges."
    status: "candidate"
  - id: "REQ-SP800-53AR5-0013"
    citation: {"ref": "SP800-53AR5", "page": 13, "anchor": "For national security systems, security categorization is accomplished in accordance with CNSS"}
    kind: "modal"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "For national security systems, security categorization is accomplished in accordance with CNSS Instruction 1253 [CNSSI 1253]. For other than national security systems, security categorization is accomplished in accordance with Federal Information Processing Standard (FIPS) 199 [FIPS 199], NIST [SP 800-37], NIST [SP 800-60 Vol 1], NIST [SP 800-"
    status: "candidate"
    work_item: "WI-461"
