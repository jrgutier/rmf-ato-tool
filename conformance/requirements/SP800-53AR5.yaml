 or designated representative determines the required level of independence for assessors based on the results of the security categorization process for the system (in the case of security control assessments) and the risk to organizational operations and assets, individuals, other organizations, and the Nation."}, {"kind": "rule", "asserts": "The authorizing official or designated representative determines whether the level of assessor independence is sufficient, not another persona", "target": "ASMT-007", "fixture": "tests/fixtures/negative/ASMT-007.sufficiencyby.yaml", "expect": "determines whether the level of assessor independence is sufficient, not", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded", "sentence": "The authorizing official determines whether the level of assessor independence is sufficient to provide confidence that the assessment results produced are sound and can be used to make a risk-based decision on whether to place the system or common control into operation or continue its operation."}, {"kind": "rule", "asserts": "Independence determined insufficient to provide confidence that the assessment results are sound fails", "target": "ASMT-007", "fixture": "tests/fixtures/negative/ASMT-007.insufficient.yaml", "expect": "insufficient to provide confidence that the assessment results are sound", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded", "sentence": "The authorizing official determines whether the level of assessor independence is sufficient to provide confidence that the assessment results produced are sound and can be used to make a risk-based decision on whether to place the system or common control into operation or continue its operation."}]
    work_item: "WI-19"
  - id: "REQ-SP800-53AR5-0160"
    citation: {"ref": "SP800-53AR5", "page": 33, "anchor": "Independent security and privacy control assessment services can be obtained from other"}
    kind: "modal"
    locator: "3.1"
    context: "TABLE 1. PREPARE FOR SECURITY AND PRIVACY CONTROL ASSESSMENTS SUMMARY"
    statement: "Independent security and privacy control assessment services can be obtained from other elements within the organization or be contracted to a public or private sector entity outside of the organization. In special situations (e.g., when the organization that owns the system or common control is small or the organizational structure requires that the security or privacy control assessment be accomplished by individuals who are in the developmental, operational, and/or management chain of the system owner), independence in the assessment process can be achieved by ensuring that the assessment results are carefully reviewed and analyzed by an independent team of experts to validate the completeness, consistency, and veracity of the results.35"
    status: "partial"
    reason: "S1 is a permission (services can be obtained from other elements or contracted) with no duty to fail; ruling sought. S2 is held: independence achieved by an independent team of experts reviewing the results is accepted in place of the assessors' own, and fails when no reviewing team is named or a reviewer is on the assessment team."
    evidence: [{"kind": "rule", "asserts": "Independence in the assessment process achieved by an independent team of experts reviewing the results: no reviewing team named fails", "target": "ASMT-007", "fixture": "tests/fixtures/negative/ASMT-007.noreview.yaml", "expect": "names no reviewing team of experts", "claim": "presence", "holds_when": "ART-SAP is produced or seeded", "sentence": "In special situations (e.g., when the organization that owns the system or common control is small or the organizational structure requires that the security or privacy control assessment be accomplished by individuals who are in the developmental, operational, and/or management chain of the system owner), independence in the assessment process can be achieved by ensuring that the assessment results are carefully reviewed and analyzed by an independent team of experts to validate the completeness, consistency, and veracity of the results.35"}, {"kind": "rule", "asserts": "The independent team of experts that reviews the assessment results includes a member of the assessment team fails", "target": "ASMT-007", "fixture": "tests/fixtures/negative/ASMT-007.reviewer.yaml", "expect": "who is on the assessment team or no framework persona", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded", "sentence": "In special situations (e.g., when the organization that owns the system or common control is small or the organizational structure requires that the security or privacy control assessment be accomplished by individuals who are in the developmental, operational, and/or management chain of the system owner), independence in the assessment process can be achieved by ensuring that the assessment results are carefully reviewed and analyzed by an independent team of experts to validate the completeness, consistency, and veracity of the results.35"}]
    work_item: "WI-19"
    ruling_sought: [{"sentence": "Independent security and privacy control assessment services can be obtained from other elements within the organization or be contracted to a public or private sector entity outside of the organization.", "reason": "A permission: assessment services can be obtained from other elements of the organization or contracted outside it; neither choice can fail a run."}]
