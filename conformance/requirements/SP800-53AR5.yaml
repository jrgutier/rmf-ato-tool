  - id: "REQ-SP800-53AR5-0060"
    citation: {"ref": "SP800-53AR5", "page": 23, "anchor": "Assessment methods have a set of associated attributes – depth and coverage"}
    kind: "should"
    locator: "2.4.2"
    context: "ASSESSMENT METHODS"
    statement: "Assessment methods have a set of associated attributes – depth and coverage – which help define the level of effort for the assessment. The attributes are hierarchical in nature, providing the means to define the rigor and scope of the assessment for the increased assurances that may be needed for some systems."
    status: "not-a-requirement"
