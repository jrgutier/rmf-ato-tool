    locator: "2.4.3"
    context: "SELECTION OPERATION WITH EMBEDDED ASSIGNMENT OPERATION"
    statement: "If the control has any enhancements as designated by sequential parenthetical numbers (for example, AC-17(01) for the first enhancement for AC-17), assessment objectives are developed for each enhancement using the same process used for the base control. The resulting assessment objectives are numbered sequentially in the same way as the assessment procedure for the base control – first in accordance with the numbering scheme in [SP 800-53] and, subsequently, using bracketed sequential numbers to further apportion control enhancement requirements to facilitate assessments (e.g., AC-17(01), AC-17(02), AC-17(03))."
    status: "not-a-requirement"
    reason: "Describes how Chapter 4 was built: 'assessment objectives are developed for each enhancement' and numbered 'first in accordance with the numbering scheme in [SP 800-53]'. 'In accordance with' states a numbering choice by NIST, so it binds no one."
