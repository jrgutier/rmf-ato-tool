  - id: "REQ-SP800-53AR5-0135"
    citation: {"ref": "SP800-53AR5", "page": 31, "anchor": "Conducting security and privacy control assessments can be difficult, challenging, and resource"}
    kind: "modal"
    locator: "3.1"
    context: "TABLE 1. PREPARE FOR SECURITY AND PRIVACY CONTROL ASSESSMENTS SUMMARY"
    statement: "Conducting security and privacy control assessments can be difficult, challenging, and resource intensive. Security and privacy control assessments may be conducted by different organizational entities with distinct oversight responsibilities. However, success requires the cooperation and collaboration of all parties with a vested interest in the organization’s information security or privacy posture, including control assessors, system security and privacy officers, system owners, common control providers, authorizing officials, chief information officers, senior information security officers, senior agency officials for privacy/chief privacy officers, chief executive officers/heads of agencies, security and privacy staffs, Inspectors General, and OMB. Establishing an appropriate set of expectations before, during, and after an assessment is paramount to achieving an acceptable outcome (i.e., producing information necessary to help the authorizing official make a credible, risk-based decision on whether to place the system into operation or continue its operation)."
    status: "not-a-requirement"
    reason: "Scene-setting: 'success requires the cooperation and collaboration of all parties' states a condition for success with no addressee, and 'oversight responsibilities' describes entities, so neither binds anyone. The named acts are 0136 to 0146."
