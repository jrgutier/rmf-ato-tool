  - id: "REQ-SP800-53AR5-0348"
    citation: {"ref": "SP800-53AR5", "page": 49, "anchor": "Whereas a set of potential assessment methods are included in the following"}
    kind: "indicative"
    locator: "SECURITY AND PRIVACY ASSESSMENT PROCEDURES"
    context: "CAUTIONARY NOTE"
    statement: "Whereas a set of potential assessment methods are included in the following catalog of assessment procedures, the potential assessment methods are not intended to be mandatory or exclusive. Depending on the particular circumstances of the system or organization to be assessed, not all methods may be required, or other assessment methods may also be used. In addition, the set of potential assessment objects listed in the catalog are not intended to be mandatory but rather a set from which the necessary and sufficient set of objects for a given assessment can be selected to make the appropriate determinations. Organizational assurance requirements and other risk management-related factors (e.g., system categorization, organizational risk tolerance) are primary drivers for determining the appropriate assessment methods and objects for a given assessment."
    status: "not-a-requirement"
    reason: "Cautionary note: methods and objects 'are not intended to be mandatory or exclusive' and 'not all methods may be required'. It says what does not bind."
