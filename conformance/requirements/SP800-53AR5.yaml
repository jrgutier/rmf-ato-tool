  - id: "REQ-SP800-53AR5-0048"
    citation: {"ref": "SP800-53AR5", "page": 20, "anchor": "During the assessment process, assessors obtain the evidence needed to allow the"}
    kind: "indicative"
    locator: "2.3"
    context: "BUILDING AN EFFECTIVE ASSURANCE CASE"
    statement: "During the assessment process, assessors obtain the evidence needed to allow the appropriate organizational officials to make objective determinations about the effectiveness of the security and privacy controls and the overall security and privacy state of the system. The assessment evidence needed to make such determinations can be obtained from a variety of sources, including information technology product and system assessments and – in the case of privacy assessments – documentation such as privacy impact assessments and Privacy Act system of record notices. Product assessments (also known as product testing, evaluation, and validation) are typically conducted by independent, third-party testing organizations. Assessments examine the security and privacy functions of products and established configuration settings. Assessments can be conducted to demonstrate compliance with industry, national, or international information security and privacy standards and developer/vendor claims. Since many information technology products are assessed by commercial testing organizations and then subsequently deployed in millions of systems, product assessments can be carried out at a greater level of depth and provide deeper insights into the security and privacy capabilities of the particular products."
    status: "candidate"
    work_item: "WI-463"
  - id: "REQ-SP800-53AR5-0049"
    citation: {"ref": "SP800-53AR5", "page": 20, "anchor": "System and common control assessments are typically conducted by system developers, system"}
    kind: "modal"
    locator: "2.3"
    context: "BUILDING AN EFFECTIVE ASSURANCE CASE"
    statement: "System and common control assessments are typically conducted by system developers, system integrators, system owners, common control providers, assessors, auditors, Inspectors General, and organizational information security and privacy personnel. The assessors or assessment teams bring together available information about the system or common control, such as the results from individual component product assessments, information in the system security and privacy plans, other system/common control documentation, or previous assessment results, and conduct additional system-level or common control assessments using a variety of methods and techniques. System and common control assessments are used to compile and evaluate the evidence needed by organizational officials to determine how effectively the security and privacy controls employed in systems mitigate risks to organizational operations and assets, individuals, other organizations, and the Nation. The results of assessments conducted using system-specific and organization-specific assessment procedures derived from the guidelines in this publication contribute to compiling the necessary evidence to determine security and privacy control effectiveness in accordance with the assurance requirements documented in security and privacy plans."
    status: "candidate"
    work_item: "WI-463"
  - id: "REQ-SP800-53AR5-0050"
    citation: {"ref": "SP800-53AR5", "page": 20, "anchor": "Organizations obtain security and privacy assurance by the actions taken by system"}
    kind: "indicative"
    locator: "2.3"
    context: "BUILDING AN EFFECTIVE ASSURANCE CASE"
    statement: "Organizations obtain security and privacy assurance by the actions taken by system developers, implementers, operators, maintainers, and assessors. Actions by individuals and/or groups during the development/operation of systems produce security and privacy evidence that contributes to the assurance, or measures of confidence, in the security and privacy functionality needed to deliver the security and privacy capability. The depth and coverage of these actions (as described in Appendix C) also contribute to the efficacy of the evidence and measures of confidence. The evidence produced by developers, implementers, operators, assessors, and maintainers during the system development life cycle (e.g., design/development artifacts and assessment results) contributes to the understanding of the effectiveness of security and privacy controls implemented by organizations."
    status: "not-a-requirement"
    reason: "Description of assurance: 'Organizations obtain security and privacy assurance by the actions taken by system developers'. It says where assurance comes from and gives no one an action. Runs to p. 21."
  - id: "REQ-SP800-53AR5-0051"
    citation: {"ref": "SP800-53AR5", "page": 21, "anchor": "The strength of the security and privacy functionality19 plays an important part"}
    kind: "should"
    locator: "2.3"
    context: "BUILDING AN EFFECTIVE ASSURANCE CASE"
    statement: "The strength of the security and privacy functionality19 plays an important part in achieving the desired capabilities and subsequently satisfying the security and privacy requirements of organizations. System developers can increase the strength of security and privacy functionality by employing well-defined security and privacy policies and procedures, structured and rigorous design and development techniques, and sound system, security, and privacy engineering techniques as part of the system development process. The artifacts generated by development activities (e.g., functional specifications, system design documentation, and the results of testing and code analysis) can provide important evidence that systems and their components are more reliable and trustworthy. Security and privacy evidence can also be generated from testing conducted by independent, third-party assessment organizations and other assessment activities conducted by government and private sector organizations.20"
    status: "not-a-requirement"
    reason: "Description: 'System developers can increase the strength of security and privacy functionality' and artifacts 'can provide important evidence'. Says what helps, with no duty."
  - id: "REQ-SP800-53AR5-0052"
    citation: {"ref": "SP800-53AR5", "page": 21, "anchor": "In addition to the evidence produced in the development environment, organizations can"}
    kind: "indicative"
    locator: "2.3"
    context: "BUILDING AN EFFECTIVE ASSURANCE CASE"
    statement: "In addition to the evidence produced in the development environment, organizations can produce evidence from the operational environment that contributes to the assurance of functionality and security and privacy capabilities. Operational evidence includes records of remediation actions, the results of security incident reporting (including breaches involving personally identifiable information), and the results of organizational continuous monitoring activities. Such evidence helps determine the effectiveness of deployed security and privacy controls, changes to systems and environments of operation, and compliance with legislation, policies, directives, regulations, and standards. Security and privacy evidence – whether obtained from development or operational activities – helps organizations determine the extent to which their systems are implemented correctly, operating as intended, and producing the desired outcome with respect to meeting stated security and privacy requirements, thus providing greater assurance in the system’s security and privacy capabilities."
    status: "not-a-requirement"
    reason: "Description of evidence: 'organizations can produce evidence from the operational environment' and 'Operational evidence includes records of remediation actions'. M-2 step 4 uses such evidence; this paragraph says only what it is."
  - id: "REQ-SP800-53AR5-0053"
    citation: {"ref": "SP800-53AR5", "page": 21, "anchor": "The security or privacy strength of a system component (i.e., hardware, software,"}
    kind: "indicative"
    locator: "2.3"
    context: "BUILDING AN EFFECTIVE ASSURANCE CASE"
    statement: "The security or privacy strength of a system component (i.e., hardware, software, or firmware) is determined by the degree to which the security or privacy functionality implemented within that component is correct, complete, resistant to direct attacks (strength of mechanism), and resistant to bypass or tampering."
    status: "not-a-requirement"
    reason: "Definition, footnote 19: 'The security or privacy strength of a system component ... is determined by the degree to which' it is correct and resistant."
  - id: "REQ-SP800-53AR5-0054"
    citation: {"ref": "SP800-53AR5", "page": 22, "anchor": "An assessment procedure consists of a set of assessment objectives, each with"}
    kind: "indicative"
    locator: "2.4"
    context: "ASSESSMENT PROCEDURES: ASSESSMENT OBJECTS, METHODS AND OBJECTIVES"
    statement: "An assessment procedure consists of a set of assessment objectives, each with an associated set of potential assessment methods and assessment objects. An assessment objective includes one or more determination statements related to the [SP 800-53] control under review. The determination statements are linked to the content of the control (i.e., the security and privacy control functionality) to ensure the traceability of assessment results back to the fundamental control requirements. The application of an assessment procedure to a control produces assessment findings.22 Assessment findings reflect or are subsequently used to help determine the overall effectiveness of the control and help the authorizing official make an informed, risk-based decision on whether to place the system into operation or continue its operation."
    status: "not-a-requirement"
    reason: "Definition: 'An assessment procedure consists of a set of assessment objectives'. Describes the structure of Chapter 4, which is the pinned ID set."
  - id: "REQ-SP800-53AR5-0055"
    citation: {"ref": "SP800-53AR5", "page": 22, "anchor": "Assessment objects identify the specific items being assessed as part of a"}
    kind: "indicative"
    locator: "2.4.1"
    context: "ASSESSMENT OBJECTS"
    statement: "Assessment objects identify the specific items being assessed as part of a given control and include specifications, mechanisms, activities, and individuals. Specifications are the document-based artifacts (e.g., policies, procedures, plans, system security and privacy requirements, functional specifications, architectural designs) associated with a system or common control. Mechanisms are the specific hardware, software, or firmware safeguards and countermeasures employed within a system or common control.23 Activities are the specific protection-related actions supporting a system or common control that involve people (e.g., conducting system backup operations, monitoring network traffic, exercising a contingency plan). Individuals or groups of individuals are people applying the specifications, mechanisms, or activities described above."
    status: "not-a-requirement"
    reason: "Definition: 'Assessment objects identify the specific items being assessed' and the four object types."
