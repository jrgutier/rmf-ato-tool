  - {"page": 732, "locator": "ONGOING ASSESSMENT AND AUTOMATION.4", "reason": "no-marker", "text": "[SP 800-137] provides guidance on Information Security Continuous Monitoring (ISCM). [SP 800-137A] provides guidance on conducting assessments of ISCM Programs."}
  - {"page": 732, "locator": "ONGOING ASSESSMENT AND AUTOMATION.4", "reason": "no-marker", "text": "Continuous monitoring can be effectively applied to privacy controls consistent with the concepts, techniques, and principles described in [SP 800-137]. Senior Agency Officials for Privacy (SAOPs)/Chief Privacy Officers (CPOs) provide guidance on the ongoing monitoring of privacy controls."}
  - {"page": 733, "locator": "ONGOING ASSESSMENT AND AUTOMATION.4", "reason": "lead-in", "text": "In order to effectively automate security and privacy control assessments using the desired state specification strategy, it is important to meet the following prerequisites:"}
  - {"page": 733, "locator": "ONGOING ASSESSMENT AND AUTOMATION.4", "reason": "no-marker", "text": "When the prerequisites are met, the assessment system can automatically compute where differences between the desired state and actual state (defects) occur, use that information to create security and privacy assessment reports, and deliver those reports to designated personnel via a security and privacy management console (dashboard)."}
