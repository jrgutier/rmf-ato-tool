  - {"page": 48, "locator": "SECURITY AND PRIVACY ASSESSMENT PROCEDURES", "reason": "no-marker", "text": "SP 800-53A REVISION 5, ASSESSMENT PROCEDURE SCHEMA Section 2.4 provides an overview of the assessment procedures, including the naming and numbering convention, assessment objectives, determination statements, potential assessment methods, and objects. Appendix C provides definitions of the assessment methods, applicable objects, and additional information on assessment attributes of depth and coverage."}
  - {"page": 48, "locator": "SECURITY AND PRIVACY ASSESSMENT PROCEDURES", "reason": "no-marker", "text": "[SP 800-53] remains the definitive expression of the control or enhancement in the event of any differences between the assessment objectives identified for assessing the security and privacy controls and the underlying intent expressed by the security and privacy control statements defined in the most recent version of SP 800-53."}
  - {"page": 49, "locator": "SECURITY AND PRIVACY ASSESSMENT PROCEDURES", "reason": "no-marker", "text": "The assessment procedures are published in multiple data formats, including comma-separated values (CSV), plain text, and Open Security Controls Assessment (OSCAL). The available data formats are accessible from on the NIST SP 800-53A Revision 5, publication details page at https://csrc.nist.gov/publications/detail/sp/800-53A/rev-5. The OSCAL Content Git Repository is available at https://github.com/usnistgov/oscal-content."}
  - {"page": 49, "locator": "SECURITY AND PRIVACY ASSESSMENT PROCEDURES", "reason": "no-marker", "text": "For additional information on optimizing assessment procedures, refer to Section 3.2.5."}
  - {"page": 50, "locator": "SECURITY AND PRIVACY ASSESSMENT PROCEDURES", "reason": "no-marker", "text": "TIP #1: Select only those assessment procedures from Chapter 4 that correspond to the controls and control enhancements in the approved system security plan and privacy plan to be included in the assessment."}
  - {"page": 50, "locator": "SECURITY AND PRIVACY ASSESSMENT PROCEDURES", "reason": "no-marker", "text": "TIP #3: With respect to the assessment procedures in Chapter 4, assessors need only apply those procedures, methods, and objects necessary for making a final determination that a particular security control requirement is “satisfied” or “not satisfied” (see Section 3.3)."}
  - {"page": 718, "locator": "ASSESSMENT METHOD DESCRIPTIONS", "reason": "lead-in", "text": "This appendix defines the three assessment methods that can be used by assessors during security and privacy control assessments:"}
  - {"page": 718, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "Included in the definition of each assessment method are types of objects to which the method can be applied. The application of each method is described in terms of the attributes of depth and coverage, progressing from basic to focused to comprehensive. The attribute values correlate to the assurance requirements specified by the organization."}
  - {"page": 718, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "The depth attribute addresses the rigor and level of detail of the assessment. For the depth attribute, the focused attribute value includes and builds upon the assessment rigor and level of detail defined for the basic attribute value. The comprehensive attribute value includes and builds upon the assessment rigor and level of detail defined for the focused attribute value."}
  - {"page": 718, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "The coverage attribute addresses the scope or breadth of the assessment. For the coverage attribute, the focused attribute value includes and builds upon the number and type of assessment objects defined for the basic attribute value. The comprehensive attribute value includes and builds upon the number and type of assessment objects defined for the focused attribute value."}
  - {"page": 718, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "The use of bolded text in the assessment method description indicates content that was added and appears for the first time, signifying greater rigor and level of detail for the attribute value."}
  - {"page": 719, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "short", "text": "Assessment Method Examine"}
  - {"page": 719, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "Assessment Objects: Specifications (e.g., policies, plans, procedures, system requirements, designs)"}
  - {"page": 719, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "Mechanisms (e.g., functionality implemented in hardware, software, firmware)"}
  - {"page": 719, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "Activities (e.g., system operations, administration, management, exercises)"}
  - {"page": 719, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "short", "text": "Attributes: Depth, Coverage"}
  - {"page": 720, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "While additional documentation is likely needed for mechanisms when moving from basic to focused to comprehensive examinations, the documentation associated with specifications and activities may be the same or similar for focused and comprehensive examinations, with the rigor of the examinations of these documents being increased at the comprehensive level."}
