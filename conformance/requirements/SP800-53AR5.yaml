  - id: "REQ-SP800-53AR5-0270"
    citation: {"ref": "SP800-53AR5", "page": 726, "anchor": "Organizations may consider adding controlled penetration testing to their arsenal of tools"}
    kind: "should"
    locator: "PENETRATION TESTING"
    context: "ASSESSMENT TOOLS AND TECHNIQUES TO IDENTIFY SYSTEM WEAKNESSES"
    statement: "Organizations may consider adding controlled penetration testing to their arsenal of tools and techniques used to assess the security and privacy controls in organizational systems. Penetration testing is a specific type of assessment in which assessors simulate the actions of a given class of attacker by using a defined set of documentation (i.e., documentation representative of what that class of attacker is likely to possess) and working under other specific constraints to attempt to circumvent the security or privacy features of a system."
    status: "partial"
    reason: "The sentence is a permission awaiting the user's ruling; a run that adds a test records it in sap.yaml."
    evidence: [{"kind": "prose", "target": "playbooks/A/A-2.md", "asserts": "Organizations adding controlled penetration testing record it in the penetration_test block of the plan", "claim": "presence"}]
    work_item: "WI-191"
    ruling_sought: [{"sentence": "Organizations may consider adding controlled penetration testing to their arsenal of tools and techniques used to assess the security and privacy controls in organizational systems.", "reason": "A permission: organizations may consider adding penetration testing; not adding it is allowed, so no run can fail it."}]
  - id: "REQ-SP800-53AR5-0271"
    citation: {"ref": "SP800-53AR5", "page": 726, "anchor": "Penetration testing is conducted as a controlled attempt to breach the security"}
    kind: "indicative"
    locator: "PENETRATION TESTING"
    context: "ASSESSMENT TOOLS AND TECHNIQUES TO IDENTIFY SYSTEM WEAKNESSES"
    statement: "Penetration testing is conducted as a controlled attempt to breach the security and privacy controls employed within the system using the attacker’s techniques and appropriate hardware and software tools. Penetration testing represents the results of a specific assessor or group of assessors at a specific point in time using agreed-upon rules of engagement. Considering the complexity of the information technologies commonly employed by organizations today, penetration testing can be viewed not as a means to verify the security and privacy features of a system but rather as a means to enhance the organization’s understanding of the system, uncover weaknesses or deficiencies in the system, and indicate the level of effort required on the part of adversaries to breach the system’s safeguards."
    status: "not-a-requirement"
    reason: "Description of the method: 'Penetration testing is conducted as a controlled attempt to breach' and 'can be viewed ... as a means to enhance the organization's understanding'. 0284 holds the rules of engagement."
