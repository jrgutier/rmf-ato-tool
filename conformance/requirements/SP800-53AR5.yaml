  - id: "REQ-SP800-53AR5-0239"
    citation: {"ref": "SP800-53AR5", "page": 719, "anchor": "Basic examination: Examination that consists of high-level reviews, checks, observations, or inspections"}
    kind: "indicative"
    locator: "ASSESSMENT METHOD DESCRIPTIONS.3"
    context: "ASSESSMENT METHOD DEFINITIONS, APPLICABLE OBJECTS, AND ATTRIBUTES This appendix defines the three assessment methods that can be used by assessors during security and privacy control assessments:"
    statement: "Basic examination: Examination that consists of high-level reviews, checks, observations, or inspections of the assessment object. The basic examination is conducted using a limited body of evidence or documentation (e.g., functional-level descriptions for mechanisms; high-level process descriptions for activities; actual documents for specifications). Basic examinations provide a level of understanding of the security and privacy controls necessary for determining whether the controls are implemented and free of obvious errors."
    status: "not-a-requirement"
    reason: "Definition of the depth value basic examination: 'high-level reviews, checks, observations, or inspections'."
  - id: "REQ-SP800-53AR5-0240"
    citation: {"ref": "SP800-53AR5", "page": 719, "anchor": "Focused examination: Examination that consists of high-level reviews, checks, observations, or inspections"}
    kind: "indicative"
    locator: "ASSESSMENT METHOD DESCRIPTIONS.3"
    context: "ASSESSMENT METHOD DEFINITIONS, APPLICABLE OBJECTS, AND ATTRIBUTES This appendix defines the three assessment methods that can be used by assessors during security and privacy control assessments:"
    statement: "Focused examination: Examination that consists of high-level reviews, checks, observations, or inspections and more in-depth studies/analyses of the assessment object. The focused examination is conducted using a substantial body of evidence or documentation (e.g., functional-level descriptions and, where appropriate and available, high-level design information for mechanisms; high-level process descriptions and implementation procedures for activities; the actual documents and related documents for specifications). Focused examinations provide a level of understanding of the security and privacy controls necessary for determining whether the controls are implemented and free of obvious errors and whether there are increased grounds for confidence that the controls are implemented correctly and operating as intended."
    status: "not-a-requirement"
    reason: "Definition of the depth value focused examination: adds 'more in-depth studies/analyses'. Runs to p. 720."
