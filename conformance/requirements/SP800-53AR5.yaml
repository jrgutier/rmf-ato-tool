  - id: "REQ-SP800-53AR5-0314"
    citation: {"ref": "SP800-53AR5", "page": 732, "anchor": "Ongoing security and privacy assessment is the continuous evaluation of the effectiveness"}
    kind: "modal"
    locator: "ONGOING ASSESSMENT AND AUTOMATION"
    context: "USING AUTOMATED TECHNIQUES TO ACHIEVE MORE EFFICIENT ASSESSMENTS"
    statement: "Ongoing security and privacy assessment is the continuous evaluation of the effectiveness of security and privacy control implementation. Ongoing assessment is an essential subset of Information Security Continuous Monitoring (ISCM) activities.62 Ongoing assessment encompasses ISCM Steps 3 and 4 and is initiated as part of ISCM Step 3, Implement, when the collection of security-related information begins in accordance with organization-defined frequencies. Ongoing assessment continues as the security-related information generated as part of ISCM Step 3 is correlated, analyzed, and reported to senior leaders as part of ISCM Step"
    status: "not-a-requirement"
    reason: "Definition and description, cut with 0315: 'Ongoing security and privacy assessment is the continuous evaluation'. 'in accordance with organization-defined frequencies' says when the ISCM step begins and binds no one by itself; the duty on how the information is produced sits in live 0315, and the frequencies are S-5."
  - id: "REQ-SP800-53AR5-0315"
    citation: {"ref": "SP800-53AR5", "page": 732, "anchor": "As noted in [SP 800-137], security-related information is generated, correlated, analyzed, and"}
    kind: "lettered"
    locator: "ONGOING ASSESSMENT AND AUTOMATION.4"
    context: "USING AUTOMATED TECHNIQUES TO ACHIEVE MORE EFFICIENT ASSESSMENTS"
    statement: "4. As noted in [SP 800-137], security-related information is generated, correlated, analyzed, and reported using automated tools to the extent that it is possible and practical to do so. When it is not possible and practical to use automated tools, security-related information is generated, correlated, analyzed, and reported using manual or procedural methods. In this way, senior leaders are provided with the security-related information necessary to make credible, risk-based decisions regarding information security risk to the mission and business.63"
    status: "covered"
    evidence: [{"kind": "rule", "asserts": "Monitoring results generated and reported by automated tools or manual methods are provided to the authorizing official, the senior leader making risk-based decisions; reports that skip the AO fail", "target": "ISCM-005", "fixture": "tests/fixtures/negative/ISCM-005.yaml", "expect": "monitoring results do not reach the authorizing official", "claim": "constraint", "holds_when": "ART-CONMON is produced or seeded"}]
    work_item: "WI-254"
  - id: "REQ-SP800-53AR5-0316"
    citation: {"ref": "SP800-53AR5", "page": 732, "anchor": "Automating assessments is a fundamental element in helping organizations manage information security"}
    kind: "indicative"
    locator: "ONGOING ASSESSMENT AND AUTOMATION.4"
    context: "USING AUTOMATED TECHNIQUES TO ACHIEVE MORE EFFICIENT ASSESSMENTS"
    statement: "Automating assessments is a fundamental element in helping organizations manage information security and privacy risks. Evolving threats and changes in PII processing create a challenge for organizations that design, implement, and operate complex systems compromised of many hardware, firmware, and software components. The ability to assess all implemented security and privacy controls as frequently as needed using manual or procedural methods has become impractical for most organizations due to the size, complexity, and scope of their information technology infrastructures."
    status: "not-a-requirement"
    reason: "Background: 'Automating assessments is a fundamental element in helping organizations manage' risk, and why manual assessment 'has become impractical'. It explains the appendix and tells no one to act."
  - id: "REQ-SP800-53AR5-0317"
    citation: {"ref": "SP800-53AR5", "page": 732, "anchor": "One strategy to increase the number of security and privacy controls for"}
    kind: "indicative"
    locator: "ONGOING ASSESSMENT AND AUTOMATION.4"
    context: "USING AUTOMATED TECHNIQUES TO ACHIEVE MORE EFFICIENT ASSESSMENTS"
    statement: "One strategy to increase the number of security and privacy controls for which assessment and monitoring can be automated depends on defining a desired state specification and expressing the desired state in a form that can be compared automatically (i.e., in data) with the actual state. The desired state is a defined value or specification to which the actual state value can be compared. A mismatch of the two values indicates that a defect is present in the effectiveness of one or more controls. For example, an organizational policy may state that user accounts will be locked after three unsuccessful logon attempts. The desired state specification would be that applicable devices are configured to lock accounts after three unsuccessful logon attempts. If, during automated assessment, the security-related information collected indicates that a specific device is configured such that accounts are locked only after five unsuccessful logon attempts, a mismatch between the desired state (three attempts allowed before lockout) and the actual state (five attempts allowed before lockout) is identified. The mismatch may reflect a problem with the effectiveness of SP 800-53 control AC-7, Unsuccessful Logon Attempts; AC-2, Account Management; and/or CM-2, Baseline Configuration. When a desired state specification strategy is employed, security-related information generated from ISCM activities is equivalent to security control assessment results."
    status: "not-a-requirement"
    reason: "Advisory, not a minimum set: 'One strategy ... depends on defining a desired state specification', with a worked lockout example. 'user accounts will be locked' is what the example's policy 'may state', so that will binds no one. The closing sentence, runs to p. 733, says what the results count as when the strategy is chosen."
  - id: "REQ-SP800-53AR5-0318"
