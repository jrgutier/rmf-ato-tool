  - id: "REQ-SP800-53AR5-0203"
    citation: {"ref": "SP800-53AR5", "page": 40, "anchor": "Assessors have flexibility in organizing assessment plans that meet the needs of"}
    kind: "indicative"
    locator: "3.2.5"
    context: "OPTIMIZE SELECTED ASSESSMENT PROCEDURES TO ENSURE MAXIMUM EFFICIENCY"
    statement: "Assessors have flexibility in organizing assessment plans that meet the needs of the organization and that provide the best opportunity for obtaining the necessary evidence to determine security or privacy control effectiveness while reducing overall assessment costs. Combining and consolidating assessment procedures is one area where flexibility can be applied. During the assessment of a system, assessment methods are applied numerous times to a variety of assessment objects within a particular family of controls. To save time, reduce assessment costs, and maximize the usefulness of assessment results, assessors review the selected assessment procedures for the control families and combine or consolidate the procedures (or parts of procedures) whenever possible or practicable. For example, assessors may consolidate interviews with key organizational officials who deal with a variety of security- or privacy-related topics. Assessors may have other opportunities for significant consolidation and cost savings by examining all policies and procedures from the families of security controls and privacy controls at the same time or by organizing groups of related policies and procedures that could be examined as a unified entity. Obtaining and examining configuration settings from similar hardware and software components within the system is another example that can provide significant assessment efficiencies."
    status: "partial"
    reason: "The review is held; the rest explains or permits and waits on rulings"
    evidence: [{"kind": "rule", "asserts": "Assessors review the selected assessment procedures and combine or consolidate them; anyone else fails", "target": "ASMT-002", "fixture": "tests/fixtures/negative/ASMT-002.review.yaml", "expect": "assessors review the selected assessment procedures to combine or consolidate them, not", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded", "sentence": "To save time, reduce assessment costs, and maximize the usefulness of assessment results, assessors review the selected assessment procedures for the control families and combine or consolidate the procedures (or parts of procedures) whenever possible or practicable."}]
    work_item: "WI-269"
    ruling_sought: [{"sentence": "During the assessment of a system, assessment methods are applied numerous times to a variety of assessment objects within a particular family of controls.", "reason": "States how methods get applied; it binds no one."}, {"sentence": "Assessors may have other opportunities for significant consolidation and cost savings by examining all policies and procedures from the families of security controls and privacy controls at the same time or by organizing groups of related policies and procedures that could be examined as a unified entity.", "reason": "A permission: assessors may have other opportunities."}]
  - id: "REQ-SP800-53AR5-0204"
    citation: {"ref": "SP800-53AR5", "page": 40, "anchor": "An additional area for consideration in optimizing the assessment process is the"}
    kind: "indicative"
    locator: "3.2.5"
    context: "OPTIMIZE SELECTED ASSESSMENT PROCEDURES TO ENSURE MAXIMUM EFFICIENCY"
    statement: "An additional area for consideration in optimizing the assessment process is the sequence in which controls are assessed. The assessment of some controls before others may provide useful information that facilitates understanding and more efficient assessments of other controls. For example, controls such as CM-2 (Baseline Configuration), CM-8 (System Component Inventory), PL-2 (System Security and Privacy Plans), RA-2 (Security Categorization), and RA-3 (Risk Assessment) produce general descriptions of the system. Assessing related controls early in the assessment process may provide a basic understanding of the system that can aid in assessing other controls. In SP 800-53, the discussion section for each control identifies related controls that can provide useful information for organizing the assessment procedures. For example, AC- 19 (Access Control for Mobile Devices) lists controls MP-4 (Media Storage) and MP-5 (Media Transport) as being related to AC-19. Since AC-19 is related to MP-4 and MP-5, the sequence in which assessments are conducted for AC-19, MP-4, and MP-5 may facilitate the reuse of assessment information from one control in assessing other related controls."
    status: "not-a-requirement"
    reason: "Advice with no duty: 'An additional area for consideration ... is the sequence in which controls are assessed' and assessing related controls early 'may provide a basic understanding'. Every verb is 'may'; 0175 holds the sequencing duty. Runs to p. 41."
