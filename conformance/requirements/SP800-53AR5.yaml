  - id: "REQ-SP800-53AR5-0198"
    citation: {"ref": "SP800-53AR5", "page": 39, "anchor": "Changing conditions associated with security controls and privacy controls over time. Security"}
    kind: "lettered"
    locator: "3.2.3.5.•"
    context: "REUSE OF ASSESSMENT EVIDENCE-RELATED CONSIDERATIONS The following items are considered when validating previous assessment results for reuse:"
    statement: "• Changing conditions associated with security controls and privacy controls over time. Security and privacy controls that were deemed effective during previous assessments may have become ineffective due to changing conditions within the system or its environment of operation, including emergent threat information. Assessment results that were found to be previously acceptable may no longer provide credible evidence for the determination of security or privacy control effectiveness, and therefore, a reassessment may be required. Applying previous assessment results to a current assessment necessitates the identification of any changes that have occurred since the previous assessment and the impact of these changes on the previous results. For example, reusing previous assessment results from examining an organization’s security or privacy policies and procedures may be acceptable if it is determined that there have not been any significant changes to the identified policies and procedures. Reusing assessment results produced during the previous authorization of a system is a cost-effective method for supporting continuous monitoring activities and annual FISMA reporting requirements when the related controls have not changed and there are adequate reasons for confidence in their continued application."
    status: "covered"
    evidence: [{"kind": "rule", "asserts": "Assessment results that no longer provide credible evidence are not reused: found not acceptable fails", "target": "ASMT-003", "fixture": "tests/fixtures/negative/ASMT-003.verdict.yaml", "expect": "was found not acceptable", "claim": "constraint", "holds_when": "ART-SAP is produced or seeded and the plan reuses a result", "sentence": "Assessment results that were found to be previously acceptable may no longer provide credible evidence for the determination of security or privacy control effectiveness, and therefore, a reassessment may be required."}]
    work_item: "WI-264"
