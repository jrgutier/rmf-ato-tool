  - id: "REQ-SP800-53AR5-0045"
    citation: {"ref": "SP800-53AR5", "page": 19, "anchor": "The roles responsible for conducting control assessments may include system owners, common"}
    kind: "modal"
    locator: "2.2"
    context: "ASSESSMENT RESULTS"
    statement: "The roles responsible for conducting control assessments may include system owners, common control providers, system security and privacy officers, independent assessors, auditors, and Inspectors General with oversight by the authorizing official(s).17 There is also significant involvement in the assessment process of other parties within the organization who have a vested interest in the outcome of assessments. Other interested parties include mission and business owners and information owners/stewards (when those roles are filled by someone other than the system owner). It is imperative that system owners and common control providers identify and coordinate with other parties in the organization that have an interest in control assessments to help ensure that the organization’s core missions and business functions are adequately addressed in the assessment of security and privacy controls."
    status: "partial"
    reason: "The second sentence is held: APREP-001 fails a preparation whose notified officials leave out the AO, and a channel naming an official not notified, so interested parties are identified and coordinated with. The first sentence is an open list of roles that 'may include', awaiting the user's ruling."
