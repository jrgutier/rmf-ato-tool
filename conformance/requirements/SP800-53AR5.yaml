  - {"page": 724, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "no-marker", "text": "Assessment Objects: Mechanisms (e.g., hardware, software, firmware) Activities (e.g., system operations, administration, management, exercises)"}
  - {"page": 724, "locator": "ASSESSMENT METHOD DESCRIPTIONS.3", "reason": "short", "text": "Attributes: Depth, Coverage"}
  - {"page": 727, "locator": "PENETRATION TESTING", "reason": "no-marker", "text": "The information obtained from the penetration testing process can be shared with appropriate personnel throughout the organization to help prioritize the vulnerabilities in the system that are demonstrably subject to compromise by attackers of a profile equivalent to the ones used in the penetration testing exercises. The prioritization helps to determine effective strategies for eliminating the identified vulnerabilities and mitigating associated risks to the organization’s operations and assets, individuals, other organizations, and the Nation resulting from the operation and use of the system. Penetration testing can be integrated into the network security testing process and the patch and vulnerability management process.59"}
  - {"page": 727, "locator": "PENETRATION TESTING", "reason": "short", "text": "Penetration Testing Considerations"}
  - {"page": 727, "locator": "PENETRATION TESTING", "reason": "no-marker", "text": "[SP 800-40] provides guidance on patch and vulnerability management. [SP 800-115] provides guidance on information and network security testing."}
  - {"page": 729, "locator": "ASSESSMENT REPORTS", "reason": "no-marker", "text": "Key Elements for Assessment Reporting"}
  - {"page": 729, "locator": "ASSESSMENT REPORTS", "reason": "no-marker", "text": "Information available in other key organizational documents (e.g., security or privacy plans, risk assessments, plans of action and milestones, or security or privacy assessment plans) need not be duplicated in the security and privacy assessment reports."}
  - {"page": 730, "locator": "ASSESSMENT REPORTS", "reason": "no-marker", "text": "Each determination statement executed by an assessor results in one of the following findings: satisfied (S) or other than satisfied (O). Figure 9 provides an example of an assessment finding for CP-03."}
