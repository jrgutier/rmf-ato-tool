  - id: "REQ-SP800-53AR5-0178"
    citation: {"ref": "SP800-53AR5", "page": 35, "anchor": "For partial assessments, system owners and common control providers collaborate with organizational"}
    kind: "indicative"
    locator: "3.2.1"
    context: "DETERMINE WHICH SECURITY AND PRIVACY CONTROLS ARE TO BE ASSESSED"
    statement: "For partial assessments, system owners and common control providers collaborate with organizational officials with an interest in the assessment (e.g., senior information security officers, senior agency officials for privacy/chief privacy officers, mission/information owners, Inspectors General, and authorizing officials) to determine which controls are to be assessed. The determination of the controls to be assessed depends on the purpose of the assessment. For example, during the initial phases of the system development life cycle, specific controls may be selected for assessment to promote the early detection of weakness and deficiencies and a more cost-effective approach to risk response. After the initial authorization to operate has been granted, targeted assessments may be necessary when changes are made to the system, specific security or privacy controls, common controls, or the environment of operation. In such cases, the focus of the assessment is on the controls that may have been affected by the change."
    status: "candidate"
    work_item: "WI-463"
