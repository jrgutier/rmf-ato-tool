  - id: "REQ-SP800-53AR5-0345"
    citation: {"ref": "SP800-53AR5", "page": 48, "anchor": "The same assessment object may appear in multiple assessment object lists in"}
    kind: "indicative"
    locator: "SECURITY AND PRIVACY ASSESSMENT PROCEDURES"
    context: "OBJECTIVES, METHODS, AND OBJECTS FOR ASSESSING SECURITY AND PRIVACY CONTROLS"
    statement: "The same assessment object may appear in multiple assessment object lists in a variety of assessment procedures. The same object may be used in multiple contexts to obtain needed information or evidence for a particular aspect of an assessment. Assessors use the general references as appropriate to obtain the necessary information to make the specified determinations required by the assessment objective. For example, a reference to access control policy appears in the assessment procedures for AC-02 and AC-07. For assessment procedure AC-02, assessors use the access control policy to find information about that portion of the policy that addresses account management for the system. For assessment procedure AC- 07, assessors use the access control policy to find information about that portion of the policy that addresses unsuccessful login attempts for the system."
