  - id: "REQ-SP800-53AR5-0322"
    citation: {"ref": "SP800-53AR5", "page": 733, "anchor": "To help automate ongoing assessment, NIST and the Department of Homeland Security"}
    kind: "indicative"
    locator: "ONGOING ASSESSMENT AND AUTOMATION.4"
    context: "USING AUTOMATED TECHNIQUES TO ACHIEVE MORE EFFICIENT ASSESSMENTS"
    statement: "To help automate ongoing assessment, NIST and the Department of Homeland Security Cybersecurity Infrastructure Security Agency (CISA) collaborated on the development of a process that leverages the test assessment method and is consistent with the Risk Management Framework, as described in SP 800-37 and the ISCM guidance in SP 800-137. The automation process is described in NIST Interagency/Internal Report (NISTIR) 8011, Automation Support for Security Control Assessments: Volume 1: Overview [IR 8011-1] which defines specific security capabilities and describes the overall automated assessment process. Specific methods to automate the assessment of each defined security capability is provided in subsequent NISTIR 8011 volumes. Automation of the test method for security assessments is facilitated by the CISA Continuous Diagnostics and Mitigation (CDM) program."
    status: "not-a-requirement"
    reason: "Background: NIST and CISA 'collaborated on the development of a process', and NISTIR 8011 and the CDM program are named. It describes outside work and binds no one."
