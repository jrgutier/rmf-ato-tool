  - id: "REQ-SP800-53AR5-0046"
    citation: {"ref": "SP800-53AR5", "page": 19, "anchor": "Organizations may also provide security and privacy control assessment plans, including tailored"}
    kind: "should"
    locator: "2.3"
    context: "BUILDING AN EFFECTIVE ASSURANCE CASE"
    statement: "Organizations may also provide security and privacy control assessment plans, including tailored assessment procedures, to external service providers who are operating systems on behalf of those organizations. In addition, tailored control and privacy assessment plans can recommend supporting templates, tools, and techniques and also be further tailored to the contract with the service provider, helping to make assessments more consistent and to maximize the reuse of assessment-related artifacts. The reuse of artifacts can improve security and privacy through uniformity and reduce/eliminate contracting ambiguity, resulting in reduced costs and risk to the organization."
    status: "not-applicable"
    reason: "An option for the organization: 'Organizations may also provide security and privacy control assessment plans ... to external service providers'. Checked PER-CCP and task A-2: no step hands plans to a service provider; assessing external systems is 0201."
