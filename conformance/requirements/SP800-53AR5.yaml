  - id: "REQ-SP800-53AR5-0227"
    citation: {"ref": "SP800-53AR5", "page": 45, "anchor": "In accordance with [SP 800-53], organizations may define a set of security"}
    kind: "modal"
    locator: "3.5"
    context: "ASSESS SECURITY AND PRIVACY CAPABILITIES"
    statement: "In accordance with [SP 800-53], organizations may define a set of security and privacy capabilities as a precursor to the security and privacy control selection process. The concept of capability48 recognizes that the protection of individuals’ privacy and information being processed by systems seldom derives from a single security or privacy safeguard or countermeasure. In most cases, such protection results from the selection and implementation of a set of mutually reinforcing security and privacy controls. Each control contributes to the overall organization-defined capability with some controls potentially contributing to a greater degree and other controls contributing to a lesser degree. For example, organizations may wish to define a capability for secure remote authentication. A secure remote authentication capability can be achieved by the implementation of a set of security controls from SP 800-53 (i.e., IA-02(01), IA-02(02), IA-02(08)], and SC-08(01))."
    status: "not-applicable"
    reason: "An option: 'In accordance with [SP 800-53], organizations may define a set of security and privacy capabilities'. Checked PER-ISSE and S-3, where 'capability' means a function of a component: no artifact or task defines capability sets, and a run needs none. 0228 and 0230 hang on this option."
  - id: "REQ-SP800-53AR5-0228"
    citation: {"ref": "SP800-53AR5", "page": 45, "anchor": "Security and privacy capabilities can address a variety of areas, including technical"}
    kind: "indicative"
    locator: "3.5"
    context: "ASSESS SECURITY AND PRIVACY CAPABILITIES"
    statement: "Security and privacy capabilities can address a variety of areas, including technical means, physical means, procedural means, or any combination thereof. By employing the capability concept, organizations can obtain greater visibility into and a better understanding of the relationships (i.e., dependencies) among controls, the effects of specific control failures on organization-defined capabilities, and the potential severity of control weaknesses or deficiencies. However, when specific capabilities are affected by the failure of particular security and privacy controls, the capability approach may add complexity to assessments and necessitate root cause failure analysis to determine which control or controls are contributing to the failure. The greater the number of controls included in an organization-defined capability, the more difficult it may be to ascertain the root cause of failures. There may also be interactions among defined capabilities, which may contribute to the complexity of assessments. If it is found that a control is neither contributing to a defined capability nor to the overall security and privacy of the system, the organization revisits the RMF Select step, tailors the control set, and documents the rationale in the system security plan or privacy plan."
    status: "not-applicable"
    reason: "Binds only an organization that took the option in 0227: 'the organization revisits the RMF Select step, tailors the control set, and documents the rationale' when a control serves no defined capability. Checked PER-ISSE and S-2: tailoring is held, but no run defines a capability for the trigger to read."
  - id: "REQ-SP800-53AR5-0229"
    citation: {"ref": "SP800-53AR5", "page": 45, "anchor": "Traditionally, assessments have been conducted on a control-by-control basis and produce results"}
    kind: "modal"
    locator: "3.5"
    context: "ASSESS SECURITY AND PRIVACY CAPABILITIES"
    statement: "Traditionally, assessments have been conducted on a control-by-control basis and produce results that are characterized as pass (i.e., control satisfied) or fail (i.e., control not satisfied). However, the failure of a single control or, in some cases, the failure of multiple controls may not affect the overall security and privacy capability required by an organization. This is not to say that such controls do not contribute to the security or privacy of the system and/or organization (as defined by the security requirements and privacy requirements during the initiation phase of the system development life cycle) but rather that such controls may not support the particular security or privacy capability. Furthermore, every implemented security and privacy control may not necessarily support or need to support an organization-defined capability."
    status: "not-a-requirement"
    reason: "Discussion: 'the failure of multiple controls may not affect the overall ... capability' and a control 'may not necessarily support or need to support' one. 'May not' and 'need to' describe what can be true of a control, so they bind no one."
  - id: "REQ-SP800-53AR5-0230"
    citation: {"ref": "SP800-53AR5", "page": 45, "anchor": "When organizations employ the concept of capabilities, automated and manual assessments account"}
    kind: "modal"
    locator: "3.5"
    context: "ASSESS SECURITY AND PRIVACY CAPABILITIES"
    statement: "When organizations employ the concept of capabilities, automated and manual assessments account for all security and privacy controls that comprise the security and privacy capabilities. Assessors are aware of how the controls work together to provide such capabilities. In this way, when assessments identify a failure in a capability, a root cause analysis can be conducted to determine the specific control or controls that are responsible for the failure based on the established relationships among controls. Moreover, employing the broader capability construct allows organizations to assess the severity of vulnerabilities discovered in their systems and organizations and determine if the failure of a particular security control or privacy control (associated with a vulnerability) or the decision not to deploy a certain control during the initial tailoring process (RMF Select step) affects the overall capability needed for mission and business protection. For example, the failure of a security control deemed critical for a particular security capability may be assigned a higher severity rating than a failed control of lesser importance to the capability."
    status: "not-applicable"
    reason: "Conditional on the option: 'When organizations employ the concept of capabilities, automated and manual assessments account for all ... controls that comprise' them. Checked PER-SCA and A-3: nothing names a capability to account for."
  - id: "REQ-SP800-53AR5-0231"
    citation: {"ref": "SP800-53AR5", "page": 46, "anchor": "The grouping of controls into security and privacy capabilities necessitates root cause"}
    kind: "indicative"
    locator: "3.5"
    context: "CAPABILITY-BASED ASSESSMENTS"
    statement: "The grouping of controls into security and privacy capabilities necessitates root cause analyses to determine if the failure of a particular security or privacy capability can be traced to the failure of one or more security or privacy controls based on the established relationships among controls. The structure of the assessment procedures in this publication with the token-level decomposition and labelling of assessment objectives linked to the specific content of security and privacy controls supports such root cause analysis. Thus, assessments of security and privacy controls (defined as part of capabilities) can be tailored based on the guidance in Section 3.2.3 and [SP 800-137] to define the resource expenditures (e.g., frequency and level of effort) associated with such assessments. This additional precision in assessments is essential to supporting the continuous monitoring strategies developed by organizations and the ongoing authorization decisions of senior leaders."
    status: "not-a-requirement"
    reason: "Box of discussion: grouping controls 'necessitates root cause analyses', and 'This additional precision ... is essential to supporting the continuous monitoring strategies'. 'Is essential' praises the structure of the procedures, so it binds no one."
