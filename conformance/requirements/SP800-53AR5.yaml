  - id: "REQ-SP800-53AR5-0061"
    citation: {"ref": "SP800-53AR5", "page": 23, "anchor": "The depth attribute addresses the rigor and level of detail in the"}
    kind: "lettered"
    locator: "2.4.2.•"
    context: "ASSESSMENT METHODS"
    statement: "• The depth attribute addresses the rigor and level of detail in the examination, interview, and testing processes. Values for the depth attribute include basic, focused, and comprehensive."
