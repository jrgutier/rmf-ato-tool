rejected:
  - {"page": 12, "locator": "1.1", "reason": "no-marker", "text": "A system is a discrete set of information resources organized expressly for the collection, processing, maintenance, use, sharing, dissemination, or disposition of information."}
  - {"page": 12, "locator": "1.1", "reason": "no-marker", "text": "OMB Circular A-130 [OMB A-130] defines security and privacy controls."}
  - {"page": 13, "locator": "1.1", "reason": "lead-in", "text": "The selection of appropriate assessment procedures and the rigor, intensity, and scope of the assessment depend on the following factors:"}
  - {"page": 13, "locator": "1.1", "reason": "not-normative", "text": "For example, detailed test scripts may need to be developed for the specific operating system, network component, middleware, or application employed within the system to adequately assess certain characteristics of a particular security or privacy control. Such test scripts are at a lower level of detail than provided by the assessment procedures contained in this guidance and are, therefore, beyond the scope of this publication."}
  - {"page": 13, "locator": "1.1", "reason": "no-marker", "text": "Vol 2], and the Controlled Unclassified Information (CUI) Registry [NARA CUI] as managed by the National Archives and Records Administration."}
  - {"page": 14, "locator": "1.1", "reason": "no-marker", "text": "[SP 800-39] provides additional information about the types of risk response."}
  - {"page": 14, "locator": "1.1", "reason": "not-normative", "text": "Types of authorization decisions are described in [SP 800-37], Appendix F."}
  - {"page": 15, "locator": "1.2", "reason": "lead-in", "text": "This publication is intended to serve a diverse group of system and information security and privacy professionals, including:"}
  - {"page": 15, "locator": "1.3", "reason": "no-marker", "text": "SP 800-53A is designed to support [SP 800-37], Risk Management Framework for Information Systems and Organizations: A System Life Cycle Approach for Security and Privacy. In particular, the assessment procedures contained in this publication and the guidelines provided for developing security and privacy assessment plans for organizational systems directly support the assessment and monitoring activities that are integral to the risk management process. The integral activities include providing near real-time security- and privacy-related information to organizational officials regarding the ongoing security and privacy state of their systems and organizations."}
  - {"page": 15, "locator": "1.3", "reason": "no-marker", "text": "Assessment results can be obtained from many activities that occur routinely during the system development life cycle. For example, assessment results are produced during the testing and evaluation of new system components"}
  - {"page": 16, "locator": "1.4", "reason": "lead-in", "text": "The remainder of this publication is organized as follows:"}
  - {"page": 17, "locator": "THE FUNDAMENTALS", "reason": "not-normative", "text": "This chapter describes the basic concepts associated with assessing the security and privacy controls in organizational systems and the environments in which those systems operate, including the integration of assessments into the system development life cycle, the importance of an organization-wide strategy for conducting assessments, the development of effective assurance cases to help increase grounds for confidence in the effectiveness of security and privacy controls, and the format and content of assessment procedures. A fundamental design objective for SP 800-53A is to provide a flexible assessment framework and a starting point for assessment procedures to be used by different organizations and systems while providing a repeatable approach to facilitate consistency in conducting control assessments."}
  - {"page": 17, "locator": "2.1", "reason": "no-marker", "text": "Security and privacy assessments can be carried out throughout system development life cycle phases14 to increase grounds for confidence that the security and privacy controls employed within or inherited by a system are effective in their application. The guidance in this publication provides a comprehensive set of assessment procedures to support security and privacy assessment activities throughout the system development life cycle. For example, security and privacy assessments are routinely conducted during the development/acquisition and implementation phases of the life cycle. Conducting assessments during the development/acquisition and implementation phases helps ensure that the required controls for the system are designed and developed consistent with risk management goals, correctly implemented, and consistent with the established organizational information security and privacy architecture before the system enters the operations and maintenance phase. Security and privacy assessments conducted in pre-operational system development life cycle phases include design and code reviews, application scanning, regression testing, and ensuring that applicable privacy laws and policies are adhered to and that privacy protections are embedded in the design of the system."}
  - {"page": 17, "locator": "2.1", "reason": "no-marker", "text": "Security- and privacy-related weaknesses and deficiencies identified early in the system development life cycle can be resolved more quickly and cost-effectively than deficiencies identified in subsequent phases of the life cycle. Early identification of security- and privacy-related weaknesses and deficiencies in the selected security and privacy controls facilitates determination and implementation of appropriate risk responses and allows for effectiveness of control implementations to be validated during system design and testing."}
  - {"page": 17, "locator": "2.1", "reason": "no-marker", "text": "There are typically five phases in a generic system development life cycle: (i) initiation, (ii) development/acquisition, (iii) implementation, (iv) operations and maintenance, and (v) disposition (disposal)."}
  - {"page": 18, "locator": "2.2", "reason": "no-marker", "text": "An organization-wide approach to identifying common controls early in the application of the RMF facilitates a more global strategy for assessing those common controls and sharing assessment results with system owners and authorizing officials. The sharing of assessment results among key organizational officials across system boundaries has many important benefits, including:"}
  - {"page": 18, "locator": "2.2", "reason": "no-marker", "text": "[SP 800-137] provides guidance on the continuous monitoring of security controls as part of an ISCM Program. Continuous monitoring can be applied effectively to privacy controls consistent with the concepts, techniques, and principles described in SP 800-137. Senior Agency Officials for Privacy (SAOPs)/Chief Privacy Officers (CPOs) provide guidance on the ongoing monitoring of privacy controls. NIST Interagency Report 8011 [NISTIR 8011], Automation Support for Security Control Assessments, provides guidance on methods to automate the assessment process."}
  - {"page": 19, "locator": "2.3", "reason": "no-marker", "text": "Building an effective assurance case18 for security and privacy control effectiveness is a process that involves compiling evidence from a variety of activities conducted during the system development life cycle that the controls employed in the system are implemented correctly, operating as intended, and producing the desired outcome with respect to meeting the security and privacy requirements of the system and the organization and presenting the evidence in a manner that decision makers are able to use effectively in making risk-based decisions about the operation or use of the system (i.e., to manage risk). The evidence described above comes from the implementation of the security and privacy controls in the system and inherited by the system (i.e., common controls) and from the assessments of that implementation. Ideally, the assessor builds on previously developed materials that started with the specification of the organization’s information security and privacy needs and was further developed during the design, development, and implementation of the system. The materials developed while implementing security and privacy throughout the life cycle of the system provide the initial evidence for an assurance case."}
  - {"page": 19, "locator": "2.3", "reason": "no-marker", "text": "An assurance case is a body of evidence organized into an argument demonstrating that some claim about a system holds (i.e., is assured). An assurance case is needed when it is important to show that a system exhibits some complex property, such as safety, security, privacy, or reliability."}
  - {"page": 20, "locator": "2.3", "reason": "no-marker", "text": "Assurance Evidence from Developmental and Operational Activities"}
  - {"page": 21, "locator": "2.3", "reason": "no-marker", "text": "The depth and coverage of security and privacy evidence can affect the level of assurance in the functionality implemented. Depth and coverage are attributes associated with assessment methods and the generation of security and privacy evidence.21 Assessment methods can be applied to support developmental and operational assurance. For developmental assurance, depth is associated with the rigor, level of detail, and formality of the artifacts produced during system design and development. The level of detail available in development artifacts can affect the type of testing, evaluation, and analysis conducted during the system development life cycle (e.g., basic testing, comprehensive testing, and focused testing, static/dynamic analysis). For operational assurance, the depth attribute addresses the rigor and level of detail for the assessment. In contrast, the coverage attribute is associated with the assessment methods employed during development and operations, addressing the scope and breadth of assessment objects included in the assessments (e.g., number and types of tests conducted on source code)."}
  - {"page": 21, "locator": "2.3", "reason": "not-normative", "text": "For example, third-party assessment organizations assess cloud services and service providers in support of the Federal Risk and Authorization Management Program [FedRAMP]. Common Criteria Testing Laboratories test and evaluate information technology products using [ISO 15408]. Cryptographic/Security Testing Laboratories test cryptographic modules using the [FIPS 140-3] standard."}
  - {"page": 21, "locator": "2.3", "reason": "no-marker", "text": "For additional information about depth and coverage, see Section 2.4 and Appendix C."}
  - {"page": 22, "locator": "2.4.2", "reason": "no-marker", "text": "Assessment methods define the nature of the assessor actions and include examine, interview, and test."}
  - {"page": 22, "locator": "2.4.2", "reason": "no-marker", "text": "For more information about control assessment findings, see Section 3.3."}
  - {"page": 22, "locator": "2.4.2", "reason": "no-marker", "text": "Mechanisms also include physical protection devices associated with a system or common control (e.g., locks, keypads, security cameras, fire protection devices, fireproof safes, etc.)."}
  - {"page": 24, "locator": "2.4.3", "reason": "not-a-statement", "text": "Figure 1 illustrates an example assessment procedure developed to assess the effectiveness of control AC-17. The assessment objective for AC-17 is derived from the base control statement described in [SP 800-53]. AC-17a.[01] is an example of a determination statement for a control item that is further granularized from SP 800-53. AC-17b. is an example of a determination statement for a control item that corresponds directly with the SP 800-53 control. Potential assessment methods and objects are added to each assessment procedure. Not all assessment procedures include all three potential assessment methods (i.e., examine, interview, test). The organization determines the assessment methods needed to provide the level of assurance required by the organization."}
  - {"page": 24, "locator": "2.4.3", "reason": "fragment", "text": "directly 800-53"}
  - {"page": 25, "locator": "2.4.3", "reason": "no-marker", "text": "Additionally, determination statements for organization-defined parameters (ODPs) are listed first and separately from the determination statements for each control item within each control or control enhancement to enable the assessor to quickly determine whether the ODPs are defined or selected by the organization. ODPs appear first in the determination statements, and each include a unique identifier associated with the control to facilitate a more efficient and streamlined assessment. ODPs include:"}
  - {"page": 25, "locator": "2.4.3", "reason": "no-marker", "text": "The ODP numbering convention is “XX-nn_ODP”, where XX is the two-character control family abbreviation, and nn is the control number (with a leading zero for single digits) followed by “_ODP”. If there is more than one ODP for the assessment procedure, “_ODP” is followed by square-bracketed sequential numbers starting from “01”. The ODP value is referenced in subsequent determination statements using the ODP unique identifier and a short phrase describing the ODP surrounded by < >. Similar to declaring a variable in computer programming, the ODP serves as a symbolic name to reference a stored value. In this scenario, the ODP unique identifier serves as the symbolic name, and the value assigned or selected by the organization is the stored value."}
  - {"page": 26, "locator": "2.4.3", "reason": "not-a-statement", "text": "Figure 3 provides an example of an assessment procedure for control CM-02 that includes two assignment operations: CM-02_ODP[01] and CM-02_ODP[02]."}
  - {"page": 27, "locator": "2.4.3", "reason": "not-a-statement", "text": "Figure 4 provides an example of an assessment procedure for a control, MP-07, that includes assignment operations and a selection operation. Selection operations include a list of potential parameter values that the organization chooses from and instructions to select one or more parameters. The list of parameter values is identified using braces { }, with each potential parameter value separated with a semicolon. When the ODP for a selection operation is referenced in a subsequent determination statement, the ODP unique identifier and phrase “SELECTED PARAMETER VALUE(S)” is surrounded by < >."}
  - {"page": 28, "locator": "2.4.3", "reason": "not-a-statement", "text": "Figure 5 provides an example of an assessment procedure for a control, CA-03, that includes an ODP that consists of a selection operation with an embedded assignment operation. The selection operation, CA-03(01)_ODP[01], identifies a list of parameters to choose from, including another ODP. The assignment operation for CA-03(01)_ODP[02] is only defined if the organization selects the ODP from the list of parameters. When the ODP for a selection operation is referenced in a subsequent determination statement, the ODP unique identifier and phrase “SELECTED PARAMETER VALUE(S)” is surrounded by < >. In this scenario, if the embedded assignment operation is selected, it becomes the “SELECTED PARAMETER VALUE(S)”."}
  - {"page": 28, "locator": "2.4.3", "reason": "fragment", "text": "(ODP)"}
  - {"page": 28, "locator": "2.4.3", "reason": "fragment", "text": "Embedded Statement,"}
  - {"page": 29, "locator": "2.4.3", "reason": "not-a-statement", "text": "Figure 6 illustrates an example of an assessment procedure developed to assess the effectiveness of the first enhancement to security control AC-17, AC-17(01)."}
  - {"page": 29, "locator": "2.4.3", "reason": "no-marker", "text": "Attribute values of depth and coverage are described in Appendix C."}
  - {"page": 30, "locator": "THE PROCESS", "reason": "no-marker", "text": "Additionally, this chapter describes assessing security and privacy capabilities.27"}
  - {"page": 30, "locator": "3.1", "reason": "not-a-statement", "text": "Table 1 provides a summary of the purpose, roles, and expected outcomes of the Prepare for Security and Privacy Control Assessments Step."}
  - {"page": 30, "locator": "3.1", "reason": "no-marker", "text": "A security and privacy capability is a combination of mutually reinforcing security and privacy controls (i.e., safeguards and countermeasures) implemented by technical means (i.e., functionality in hardware, software, and firmware), physical means (i.e., physical devices and protective measures), and procedural means (i.e., procedures performed by individuals)."}
  - {"page": 31, "locator": "3.1", "reason": "no-marker", "text": "Thorough preparation by the organization and assessors is an important aspect of conducting effective security and privacy control assessments. Preparatory activities address a range of issues relating to the cost, schedule, and performance of the assessment. From an organizational perspective, preparing for a security and privacy control assessment includes the following key activities:"}
  - {"page": 31, "locator": "3.1", "reason": "no-marker", "text": "Conducting security and privacy control assessments in parallel with the development/acquisition and implementation phases of the life cycle allows for the early identification of weaknesses and deficiencies and provides the most cost-effective method for initiating corrective actions. Issues found during development assessments can be referred to authorizing officials for early resolution, as appropriate. The results of security and privacy control assessments carried out during system development and implementation can also be used (consistent with reuse criteria) during the authorization process to avoid system fielding delays or the costly repetition of assessments."}
  - {"page": 33, "locator": "3.1", "reason": "no-marker", "text": "The availability of essential documentation as well as access to key organizational personnel and the system or common control being assessed are paramount to a successful assessment."}
  - {"page": 34, "locator": "3.2", "reason": "not-a-statement", "text": "Table 2 provides a summary of the purpose, roles, and expected outcomes of the Develop Security and Privacy Assessment Plans Step."}
  - {"page": 36, "locator": "3.2.3.1", "reason": "no-marker", "text": "The selection of assessment methods and objects (including the number and type of assessment objects, i.e., coverage) can be a significant factor in cost-effectively managing risk while still meeting the assessment objectives."}
  - {"page": 39, "locator": "3.2.3.5", "reason": "lead-in", "text": "The following items are considered when validating previous assessment results for reuse:"}
  - {"page": 39, "locator": "3.2.3.6", "reason": "no-marker", "text": "An external system is a system or component of a system that is outside of the authorization boundary established by the organization and for which the organization typically has no direct control over the application of required security and privacy controls or the assessment of control effectiveness. [SP 800-37] and [SP 800-53] provide additional guidance on external systems and the effect of employing security and privacy controls in external environments."}
  - {"page": 41, "locator": "3.3", "reason": "not-a-statement", "text": "Table 3 provides a summary of the purpose, roles, and expected outcomes of the Conduct Security and Privacy Control Assessments Step."}
  - {"page": 42, "locator": "3.3", "reason": "no-marker", "text": "A finding of “satisfied” indicates that – for the portion of the control addressed by the determination statement – the assessment objective for the control has been met and produces a fully acceptable result."}
  - {"page": 42, "locator": "3.3", "reason": "no-marker", "text": "See Section 3.2.3 for additional information about assessing common controls and portions of hybrid controls inherited from a common control provider."}
  - {"page": 42, "locator": "3.3", "reason": "no-marker", "text": "For additional information on determination statements and assessment findings, see Appendix E."}
  - {"page": 43, "locator": "3.4", "reason": "not-a-statement", "text": "Table 4 provides a summary of the purpose, roles, and expected outcomes of the Analyze Assessment Report Results Step."}
  - {"page": 44, "locator": "3.4", "reason": "no-marker", "text": "Potential risk response actions include risk acceptance, risk mitigation, risk rejection, and risk transfer/sharing. [SP 800-39] provides guidance on risk response actions from a risk management perspective."}
  - {"page": 45, "locator": "3.5", "reason": "no-marker", "text": "A security capability or privacy capability is a combination of mutually reinforcing security controls or privacy controls (i.e., safeguards and countermeasures) implemented by technical means (i.e., functionality in hardware, software, and firmware), physical means (i.e., physical devices and protective measures), and procedural means (i.e., procedures performed by individuals)."}
  - {"page": 46, "locator": "3.5", "reason": "no-marker", "text": "Ultimately, authorization decisions (i.e., risk acceptance decisions) are made based on the degree to which the desired security and privacy capabilities have been effectively achieved and are meeting the security and privacy requirements defined by an organization. Risk-based decisions are directly related to organizational risk tolerance that is defined as part of an organization’s risk management strategy."}
