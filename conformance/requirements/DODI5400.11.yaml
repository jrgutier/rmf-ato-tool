    statement: "g. Purpose Specification and Use Limitation. Specify the purpose for which PII is collected and only use, process, store, maintain, disseminate, or disclose PII for a purpose that is explained in the public notice and is compatible with the purpose for which the PII was collected, or that is otherwise legally authorized."
    status: "candidate"
