    statement: "a. This issuance applies to OSD, the Military Departments, the Office of the Chairman of the Joint Chiefs of Staff, and the Joint Staff, the Combatant Commands, the Office of Inspector General of the Department of Defense (OIG DoD), the Defense Agencies, the DoD Field Activities, and all other organizational entities within the DoD, including the DoD Intelligence Components (referred to collectively in this issuance as the “DoD Components”)."
