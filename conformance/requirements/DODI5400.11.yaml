  - id: "REQ-DODI5400.11-0160"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "5.1. GENERAL. The DO&C establishes rules of conduct for DoD personnel involved"}
    kind: "modal"
    locator: "SECTION 5: DOD RULES OF CONDUCT"
    context: ""
    statement: "5.1. GENERAL. The DO&C establishes rules of conduct for DoD personnel involved in designing, developing, operating, or maintaining any system of records, or in maintaining any record in accordance with Subsection (e)(9) of the Privacy Act of 1974. DoD personnel must be trained, and must ensure that contractors are trained, with respect to such rules, the requirements of this section, and any other rules or procedures adopted pursuant to this section, including the penalties for noncompliance. More detailed training provisions are outlined in DoD 5400.11-R."
    status: "candidate"
  - id: "REQ-DODI5400.11-0161"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "Consistent with applicable law, information about an individual that is collected, used,"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.a"
    context: ""
    statement: "a. Consistent with applicable law, information about an individual that is collected, used, maintained, or disseminated by the OSD and DoD Components will be:"
