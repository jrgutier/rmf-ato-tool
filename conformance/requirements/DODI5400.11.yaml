    statement: "b. Nothing in this issuance will infringe on the OIG DoD’s statutory independence and authority as articulated in the Inspector General Act of 1978, as amended, in the Appendix of Title 5, United States Code (U.S.C.). In the event of any conflict between this issuance and the OIG DoD’s statutory independence and authority, the Inspector General Act of 1978 takes precedence."
