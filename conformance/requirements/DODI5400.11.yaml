    context: "Consistent with applicable law, information about an individual that is collected, used, maintained, or disseminated by the OSD and DoD Components will be: Collected directly from the individual to th"
    statement: "(a) The specific purpose or purposes for which the information is intended to be used."
    status: "candidate"
  - id: "REQ-DODI5400.11-0166"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "The authority for collection."}
    kind: "lettered"
