    statement: "(3) Collected directly from the individual to the greatest extent practicable when the information may result in adverse determinations about the individual’s rights, benefits, and privileges. The individual will be informed of:"
    status: "candidate"
  - id: "REQ-DODI5400.11-0165"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "The specific purpose or purposes for which the information is intended to"}
