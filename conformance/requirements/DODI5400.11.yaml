    context: "Consistent with applicable law, information about an individual that is collected, used, maintained, or disseminated by the OSD and DoD Components will be: Collected directly from the individual to th"
    statement: "(d) Whether disclosing of such information is mandatory or voluntary."
    status: "candidate"
  - id: "REQ-DODI5400.11-0169"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "The consequences to the individual of not providing that information."}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.a.(3).(e)"
    context: "Consistent with applicable law, information about an individual that is collected, used, maintained, or disseminated by the OSD and DoD Components will be: Collected directly from the individual to th"
    statement: "(e) The consequences to the individual of not providing that information."
    status: "candidate"
  - id: "REQ-DODI5400.11-0170"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "The records used in any determination about any individual will be maintained"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.b"
    context: ""
    statement: "b. The records used in any determination about any individual will be maintained with such accuracy, relevancy, timeliness, and completeness as is reasonably necessary to assure fairness to the individual in the determination."
    status: "candidate"
  - id: "REQ-DODI5400.11-0171"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "OSD and DoD Components will establish appropriate administrative, technical, and physical safeguards"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.c"
    context: ""
    statement: "c. OSD and DoD Components will establish appropriate administrative, technical, and physical safeguards to ensure the security and confidentiality of records and to protect against any anticipated threats or hazards to their security or integrity that could result in substantial harm, embarrassment, inconvenience, or unfairness to any individual on whom information is maintained."
    status: "candidate"
  - id: "REQ-DODI5400.11-0172"
    citation: {"ref": "DODI5400.11", "page": 17, "anchor": "OSD and DoD Components will make reasonable efforts to ensure records are"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.d"
    context: ""
    statement: "d. OSD and DoD Components will make reasonable efforts to ensure records are accurate, timely, and relevant for DoD’s purposes before disseminating any record about an individual to any person or to another federal or non-federal agency. This requirement does not apply if the record is being released pursuant to Section 552 of Title 5, U.S.C., also known and referred to in this issuance as the “Freedom of Information Act.”"
    status: "candidate"
  - id: "REQ-DODI5400.11-0173"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Disclosing records pertaining to an individual from a system of records is"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.e"
    context: ""
    statement: "e. Disclosing records pertaining to an individual from a system of records is prohibited in the absence of the individual’s consent except as authorized by the Privacy Act of 1974 and the Freedom of Information Act."
    status: "candidate"
  - id: "REQ-DODI5400.11-0174"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Pursuant to the Privacy Act of 1974, no record will be maintained"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.f"
    context: ""
    statement: "f. Pursuant to the Privacy Act of 1974, no record will be maintained on how an individual exercises rights guaranteed by the First Amendment to the United States Constitution, except:"
    status: "candidate"
  - id: "REQ-DODI5400.11-0175"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "When expressly authorized by statute."}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.f.(1)"
    context: "Pursuant to the Privacy Act of 1974, no record will be maintained on how an individual exercises rights guaranteed by the First Amendment to the United States Constitution, except:"
    statement: "(1) When expressly authorized by statute."
    status: "candidate"
  - id: "REQ-DODI5400.11-0176"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "When expressly authorized by the individual who is the subject of the"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.f.(2)"
    context: "Pursuant to the Privacy Act of 1974, no record will be maintained on how an individual exercises rights guaranteed by the First Amendment to the United States Constitution, except:"
    statement: "(2) When expressly authorized by the individual who is the subject of the record."
    status: "candidate"
  - id: "REQ-DODI5400.11-0177"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "When the record is pertinent to and within the scope of an"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.f.(3)"
    context: "Pursuant to the Privacy Act of 1974, no record will be maintained on how an individual exercises rights guaranteed by the First Amendment to the United States Constitution, except:"
    statement: "(3) When the record is pertinent to and within the scope of an authorized law enforcement activity."
    status: "candidate"
  - id: "REQ-DODI5400.11-0178"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Protected health information will be disclosed in accordance with DoD Manual 6025.18"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.g"
    context: ""
    statement: "g. Protected health information will be disclosed in accordance with DoD Manual 6025.18 or its successor issuance. Questions regarding the disclosure of protected health information should be referred to the Defense Health Agency Privacy and Civil Liberties Office."
    status: "candidate"
  - id: "REQ-DODI5400.11-0179"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "OSD and DoD Components will report any unauthorized disclosures of PII from"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.h"
    context: ""
    statement: "h. OSD and DoD Components will report any unauthorized disclosures of PII from a system of records to the applicable SCOP or PCLO."
    status: "candidate"
  - id: "REQ-DODI5400.11-0180"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "5.2. FAIR INFORMATION PRACTICE PRINCIPLES (FIPPs). OSD and DoD Components are expected"}
    kind: "modal"
    locator: "SECTION 5: DOD RULES OF CONDUCT.h"
    context: ""
    statement: "5.2. FAIR INFORMATION PRACTICE PRINCIPLES (FIPPs). OSD and DoD Components are expected to consider the FIPPs when evaluating information systems, processes, programs, and activities that affect individual privacy consistent with the DoD mission and privacy program requirements. To the extent a particular principle cannot be implemented, other principles should be used to compensate for the privacy and civil liberties risks identified. For the purposes of this issuance, the FIPPs are:"
    status: "candidate"
  - id: "REQ-DODI5400.11-0181"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Access and Amendment. Provide individuals with appropriate access to PII and appropriate"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.a"
    context: ""
    statement: "a. Access and Amendment. Provide individuals with appropriate access to PII and appropriate opportunity to correct or amend PII."
    status: "candidate"
  - id: "REQ-DODI5400.11-0182"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Accountability. Hold personnel accountable for complying with measures that implement the FIPPs"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.b"
    context: ""
    statement: "b. Accountability. Hold personnel accountable for complying with measures that implement the FIPPs and applicable privacy requirements, and appropriately monitor, audit, and document compliance. Clearly define the roles and responsibilities with respect to PII for all employees and contractors, and provide appropriate training to all employees and contractors who have access to PII."
    status: "candidate"
  - id: "REQ-DODI5400.11-0183"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Authority. Create, collect, use, process, store, maintain, disseminate, or disclose PII only"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.c"
    context: ""
    statement: "c. Authority. Create, collect, use, process, store, maintain, disseminate, or disclose PII only with the proper authority to do so and identify this authority in the appropriate notice."
    status: "candidate"
  - id: "REQ-DODI5400.11-0184"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Minimization. Create, collect, use, process, store, maintain, disseminate, or disclose PII only"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.d"
    context: ""
    statement: "d. Minimization. Create, collect, use, process, store, maintain, disseminate, or disclose PII only when it is directly relevant and necessary to accomplish a legally authorized purpose, and only maintain PII for as long as is necessary to accomplish the purpose."
    status: "candidate"
  - id: "REQ-DODI5400.11-0185"
    citation: {"ref": "DODI5400.11", "page": 18, "anchor": "Quality and Integrity. Create, collect, use, process, store, maintain, disseminate, or disclose"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.e"
    context: ""
    statement: "e. Quality and Integrity. Create, collect, use, process, store, maintain, disseminate, or disclose PII with such accuracy, relevance, timeliness, and completeness as is reasonably necessary to ensure fairness to the individual."
    status: "candidate"
  - id: "REQ-DODI5400.11-0186"
    citation: {"ref": "DODI5400.11", "page": 19, "anchor": "Individual Participation. Involve the individual in the process of using PII and,"}
    kind: "lettered"
    locator: "SECTION 5: DOD RULES OF CONDUCT.f"
    context: ""
    statement: "f. Individual Participation. Involve the individual in the process of using PII and, to the extent practicable, seek individual consent for creating, collecting, using, processing, storing, maintaining, disseminating, or disclosing PII. Establish procedures to receive and address individuals’ privacy-related complaints and inquiries."
