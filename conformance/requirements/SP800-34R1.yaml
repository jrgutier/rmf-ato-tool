  - id: "REQ-SP800-34R1-0392"
    citation: {"ref": "SP800-34R1", "page": 73, "anchor": "Sample templates are provided to address NIST SP 800-53 security controls for"}
    kind: "indicative"
    locator: "Appendix A—Sample Information System Contingency Plan Templates"
    context: ""
    statement: "Sample templates are provided to address NIST SP 800-53 security controls for each of the three different FIPS 199 impact levels. The templates provided are guides and may be customized and adapted as necessary to best fit the system or organizational requirements for contingency planning. Appendix A.1 can be used for low-impact systems, Appendix A.2 for moderate- impact systems, and Appendix A.3 for high-impact systems."
    status: "candidate"
  - id: "REQ-SP800-34R1-0393"
