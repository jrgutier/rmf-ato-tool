  - id: "REQ-SP800-34R1-0108"
    citation: {"ref": "SP800-34R1", "page": 28, "anchor": "Sample information system contingency policy statement All organizations must develop contingency plans"}
    kind: "modal"
    locator: "3.1"
    context: "Develop the Contingency Planning Policy Statement"
    statement: "Sample information system contingency policy statement All organizations must develop contingency plans for each information system to meet the needs of critical system operations in the event of a disruption. The procedures for execution of such a capability shall be documented in a formal contingency plan by the Information Systems Contingency Plan (ISCP) Coordinator and must be reviewed annually and updated as necessary by the ISCP Coordinator. The plan must account for the FIPS 199 security categorization (low, moderate, high) and comply with the appropriate security controls. The plan must assign specific responsibilities to designated staff or positions to facilitate the recovery and/or continuity of essential system functions. Resources necessary to ensure viability of the procedures must be acquired and maintained. Personnel responsible for target systems must be trained to execute contingency procedures. The plan recovery capabilities and personnel shall be tested annually to identify weaknesses of the capability."
    status: "not-a-requirement"
    reason: "Boxed 'Sample information system contingency policy statement', Sample Text. Its must, shall and responsible for bind no one because the box is an example of wording for a policy; the responsibilities it mentions are illustrative, and 0105 holds what a policy needs."
  - id: "REQ-SP800-34R1-0109"
    citation: {"ref": "SP800-34R1", "page": 28, "anchor": "As information system contingency plans are developed during the Initiation phase of"}
    kind: "modal"
    locator: "3.1"
    context: "Develop the Contingency Planning Policy Statement"
    statement: "As information system contingency plans are developed during the Initiation phase of the SDLC,13 they should be coordinated with related organization-wide policies and programs, including information system security, physical security, human resources, system operations, and emergency preparedness functions. Information system contingency activities should be compatible with program requirements for these areas, and recovery personnel should coordinate with representatives from each area to remain aware of new or evolving policies, programs, or capabilities. The ISCPs must be written in coordination with other plans associated with each target system as part of organization-wide resilience strategy. Such plans include the following:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0110"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "Information system security plans;"}
    kind: "indicative"
    locator: "3.1"
    context: "Develop the Contingency Planning Policy Statement"
    statement: "Information system security plans;"
    status: "not-a-requirement"
    reason: "Noun item under 'Such plans include the following:'; the verb is at 0109."
  - id: "REQ-SP800-34R1-0111"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "The BIA is a key step in implementing the CP controls in"}
    kind: "modal"
    locator: "3.2"
    context: "Conduct the Business Impact Analysis (BIA)"
    statement: "The BIA is a key step in implementing the CP controls in NIST SP 800-53 and in the contingency planning process overall. The BIA enables the ISCP Coordinator to characterize the system components, supported mission/business processes, and interdependencies. The BIA purpose is to correlate the system with the critical mission/business processes and services provided, and based on that information, characterize the consequences of a disruption. The ISCP Coordinator can use the BIA results to determine contingency planning requirements and priorities. Results from the BIA should be appropriately incorporated into the analysis and strategy development efforts for the organization’s COOP, BCPs, and DRP. The BIA should be performed during the Initiation phase of the SDLC. As the system design evolves and components change, the BIA may need to be conducted again during the Development/Acquisition phase of the SDLC. Incorporating the RMF Step 1 (FIPS 199 categorization) and Step 2 (select security controls) helps to ensure that the BIA accounts appropriately for the level of risk to the organization."
    status: "candidate"
    work_item: "WI-09"
  - id: "REQ-SP800-34R1-0112"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "COOP functions are subject to a process-focused BIA; federal information systems are"}
    kind: "indicative"
    locator: "3.2"
    context: "BUSINESS IMPACT ANALYSIS (BIA)"
    statement: "COOP functions are subject to a process-focused BIA; federal information systems are subject to a system-focused BIA."
    status: "not-a-requirement"
    reason: "Box 'COOP vs. ISCP': contrasts a process-focused and a system-focused BIA; a comparison, and the system BIA's duty is at 0111."
  - id: "REQ-SP800-34R1-0113"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "Information systems that support COOP functions will be identified in the process-based"}
    kind: "lettered"
