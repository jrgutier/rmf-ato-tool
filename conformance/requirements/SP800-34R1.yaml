  - {"page": 52, "locator": "4.2.2", "reason": "no-marker", "text": "Any known outage estimates;"}
  - {"page": 52, "locator": "4.2.2", "reason": "no-marker", "text": "Response and recovery details;"}
  - {"page": 52, "locator": "4.2.2", "reason": "no-marker", "text": "Where and when to convene for briefing or further response instructions;"}
  - {"page": 52, "locator": "4.2.2", "reason": "no-marker", "text": "Instructions to prepare for relocation for estimated time period (if applicable); and"}
  - {"page": 52, "locator": "4.2.2", "reason": "no-marker", "text": "Instructions to complete notifications using the call tree (if applicable)."}
  - {"page": 52, "locator": "4.2.3", "reason": "no-marker", "text": "Potential for additional disruptions or damage;"}
  - {"page": 52, "locator": "4.2.3", "reason": "no-marker", "text": "Status of physical infrastructure (e.g., structural integrity of computer room, condition of electric power, telecommunications, and heating, ventilation and air-conditioning [HVAC]);"}
  - {"page": 52, "locator": "4.2.3", "reason": "no-marker", "text": "Inventory and functional status of system equipment (e.g., fully functional, partially functional, nonfunctional);"}
  - {"page": 52, "locator": "4.2.3", "reason": "no-marker", "text": "Type of damage to system equipment or data (e.g., water, fire and heat, physical impact, electrical surge);"}
  - {"page": 52, "locator": "4.2.3", "reason": "no-marker", "text": "Items to be replaced (e.g., hardware, software, firmware, supporting materials); and"}
  - {"page": 52, "locator": "4.2.3", "reason": "no-marker", "text": "Estimated time to restore normal services."}
  - {"page": 53, "locator": "4.3.1", "reason": "no-marker", "text": "A key step has been completed;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Notifying internal and external business partners associated with the system;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Obtaining necessary office supplies and work space;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Obtaining and installing necessary hardware components;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Obtaining and loading backup media;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Restoring critical operating system and application software;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Restoring system data to a known state;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Testing system functionality including security controls;"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Connecting system to network or other external systems; and"}
  - {"page": 54, "locator": "4.3.2", "reason": "no-marker", "text": "Operating alternate equipment successfully."}
  - {"page": 55, "locator": "4.4", "reason": "no-marker", "text": "Validation Data Testing. Data testing is the process of testing and validating recovered data to ensure that data files or databases have been recovered completely and are current to the last available backup."}
  - {"page": 55, "locator": "4.4", "reason": "no-marker", "text": "Validation Functionality Testing. Functionality testing is a process for verifying that all system functionality has been tested, and the system is ready to return to normal operations."}
  - {"page": 55, "locator": "4.4", "reason": "no-marker", "text": "Cleanup. Cleanup is the process of cleaning up work space or dismantling any temporary recovery locations, restocking supplies, returning manuals or other documentation to their original locations, and readying the system for another contingency event."}
  - {"page": 55, "locator": "4.4", "reason": "not-a-statement", "text": "Examples of significant changes that would possibly apply in a contingency situation are: 1) new or upgraded hardware platform, and 2) moving to a new facility."}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "Contingency plan appendices provide key details not contained in the main body of the plan. Common contingency plan appendices include the following:"}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "Vendor contact information, including offsite storage and alternate site POCs;"}
  - {"page": 56, "locator": "4.5", "reason": "short", "text": "BIA;"}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "Detailed recovery procedures and checklists;"}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "Detailed validation testing procedures and checklists;"}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "Alternate mission/business processing procedures that may occur while recovery efforts are being done to the system;"}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "ISCP testing and maintenance procedures;"}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "System interconnections (systems that directly interconnect or exchange information); and"}
  - {"page": 56, "locator": "4.5", "reason": "no-marker", "text": "Vendor SLAs, reciprocal agreements with other organizations, and other vital records."}
  - {"page": 57, "locator": "Chapter 5. Technical Contingency Planning Considerations", "reason": "short", "text": "Client/server systems;"}
  - {"page": 57, "locator": "Chapter 5. Technical Contingency Planning Considerations", "reason": "short", "text": "Telecommunications systems; and"}
  - {"page": 57, "locator": "Chapter 5. Technical Contingency Planning Considerations", "reason": "short", "text": "Mainframe systems."}
  - {"page": 57, "locator": "5.1", "reason": "no-marker", "text": "Development of data security, integrity, and backup policies and procedures;"}
  - {"page": 57, "locator": "5.1", "reason": "no-marker", "text": "Protection of equipment and system resources;"}
  - {"page": 57, "locator": "5.1", "reason": "no-marker", "text": "Adherence and compliance with security controls in NIST SP 800-53;"}
  - {"page": 57, "locator": "5.1", "reason": "no-marker", "text": "Development of primary and alternate sites with appropriately sized and configured power management systems and environmental controls; and"}
  - {"page": 57, "locator": "5.1", "reason": "no-marker", "text": "An overview of contingency planning and the SDLC is presented in Appendix F."}
  - {"page": 58, "locator": "5.1.1", "reason": "no-marker", "text": "The BIA is the first source for determining resiliency and contingency planning strategies. BIA results determine how critical the system is to the supported mission/business processes, what impact the loss of the system could have on the organization, and the system RTO. The BIA results can help determine the type and frequency of backup, the need for redundancy or mirroring of data, and the type of alternate site needed to meet system recovery objectives. Each of these strategy decisions have cost versus availability or recovery implications. Availability and recovery implications are discussed throughout the rest of this chapter."}
  - {"page": 58, "locator": "5.1.2", "reason": "no-marker", "text": "Keeping backups of data in a secure offsite location allows for a ready access to backups during a contingency event. An effective data backup process is crucial to an ISCP Coordinator’s overall recovery strategy. Data backups are done primarily for recovery purposes. Backups can be done through many different methods and techniques. MTD determinations and security requirements from the BIA help dictate the best method for backing up a particular system for recovery."}
  - {"page": 58, "locator": "5.1.2", "reason": "no-marker", "text": "For further information on encryption, see NIST SP 800-21, Guideline for Implementing Cryptography in the Federal Government, December 2005."}
  - {"page": 58, "locator": "5.1.2", "reason": "no-marker", "text": "For further information on key management, see NIST SP 800-57, Recommendation for Key Management, March 2007."}
  - {"page": 59, "locator": "5.1.2", "reason": "no-marker", "text": "How quickly are the backups to be retrieved in the event of an emergency?"}
  - {"page": 59, "locator": "5.1.2", "reason": "no-marker", "text": "What is the media-labeling scheme?"}
  - {"page": 60, "locator": "5.1.4", "reason": "no-marker", "text": "The security controls established in NIST SP 800-53 provide a solid foundation for establishing information system security, integrity, and contingency policies. Adherence to these controls for contingency planning purposes helps protect an information system against threats that can disrupt operations."}
  - {"page": 61, "locator": "5.1.5", "reason": "no-marker", "text": "Alternate processing facilities provide a location for an organization to resume system operations in the event of a catastrophic event that disables or destroys the systems primary facility. There are three primary types of alternate processing facilities, corresponding to the level of readiness to function as a system’s operations facility."}
  - {"page": 62, "locator": "5.1.6", "reason": "no-marker", "text": "HA is a process where redundancy and failover processes are built into a system to maximize its uptime and availability. The concept of HA is to achieve an uptime of 99.999 percent or higher, which equates to just a few minutes per year of downtime. Several vendors offer HA products and services designed to minimize downtime by building redundancy and resiliency into the architecture."}
  - {"page": 62, "locator": "5.2", "reason": "no-marker", "text": "Wireless and smart phone technology advances have allowed users access to key server functionality and services such as email from their mobile phones. This is normally done by using proprietary third-party software that establishes the communications and data transfer to and from the phone via the network provided by mobile cell carriers."}
  - {"page": 62, "locator": "5.2", "reason": "no-marker", "text": "Servers support file sharing and storage, data processing, central application hosting (such as email or a central database), printing, access control, user authentication, remote access connectivity, and other shared system services. Local users log into the server through networked client machines to access resources that the server provides."}
  - {"page": 63, "locator": "5.2.1", "reason": "lead-in", "text": "CLIENT/SERVER AND PORTABLE SYSTEM CONTINGENCY STRATEGIES:"}
  - {"page": 63, "locator": "5.2.1", "reason": "no-marker", "text": "AND PERIPHERALS. DOCUMENT SYSTEM CONFIGURATIONS"}
  - {"page": 63, "locator": "5.2.1", "reason": "no-marker", "text": "AND VENDOR INFORMATION. COORDINATE WITH SECURITY POLICIES"}
  - {"page": 63, "locator": "5.2.1", "reason": "no-marker", "text": "AND CONTROLS. USE RESULTS OF BIA. MINIMIZE DATA ON CLIENT SYSTEMS. AUTOMATE BACKUP OF DATA. DEVELOP AND PROVIDE GUIDANCE ON BACKING UP DATA. STORE BACKUP INFORMATION AT AN ALTERNATE SITE. COORDINATE CONTINGENCY SOLUTIONS WITH CYBER INCIDENT RESPONSE PROCEDURES."}
  - {"page": 63, "locator": "5.2.1", "reason": "lead-in", "text": "Additional considerations for client computers include:"}
  - {"page": 65, "locator": "5.2.2", "reason": "no-marker", "text": "Wide ranges of technical contingency solutions are available for client/server systems; several efficient practices are discussed in this section."}
  - {"page": 65, "locator": "5.2.2", "reason": "no-marker", "text": "Client/server system data backups can be accomplished in various ways, including those listed below:40"}
  - {"page": 65, "locator": "5.2.2", "reason": "no-marker", "text": "For more information on encryption for desktops and portable devices, refer to NIST SP 800-111, Guide to Storage Encryption Technologies for End User Devices, November 2007."}
  - {"page": 65, "locator": "5.2.2", "reason": "no-marker", "text": "Section 5.1.2 discusses various backup methods that can be used: full, incremental, and differential."}
  - {"page": 66, "locator": "5.3", "reason": "no-marker", "text": "There are two primary classes of telecommunications systems: LANs and WANs. Wireless connectivity, prevalent for use with portable devices, can be used in either LAN or WAN environments."}
  - {"page": 66, "locator": "5.3", "reason": "no-marker", "text": "A LAN is located within an office or campus environment. It can be as small as two PCs attached to a single network switch, or it may support hundreds of users and multiple servers. LANs can be developed using any of several topologies. Each connection on a LAN is considered a node."}
  - {"page": 66, "locator": "5.3", "reason": "no-marker", "text": "A WAN is a data communications network that consists of connecting two or more systems that are dispersed over a wide geographical area. Communications links, usually provided by a public carrier, provide the connection to enable one system to interact with other systems."}
  - {"page": 66, "locator": "5.3", "reason": "no-marker", "text": "WANs can connect LANs together, connect to mainframe systems, and connect client computers to servers. WANs provide much of the communications requirements of geographically dispersed environments. Types of WAN communications links include the following methods:"}
  - {"page": 67, "locator": "5.3", "reason": "no-marker", "text": "T-3. T-3 is a dedicated phone connection supporting data rates of about 45 Mbps. A T-3 line consists of 672 individual channels, each of which supports 64 kbps. T-3 is also referred to as a Digital Signal (DS) 3."}
  - {"page": 67, "locator": "5.3", "reason": "no-marker", "text": "Frame Relay. Frame relay is a packet-switching protocol for connecting devices on a WAN. In frame relay, data is routed over virtual circuits. Frame relay networks support data transfer rates at T-1 and T-3 speeds."}
  - {"page": 67, "locator": "5.3", "reason": "no-marker", "text": "Asynchronous Transfer Mode (ATM). ATM is a network technology that transfers data at high speeds using packets of fixed size. Implementations of ATM support data transfer rates of from 25 to 622 Mbps and provide guaranteed throughput."}
  - {"page": 67, "locator": "5.3", "reason": "no-marker", "text": "Synchronous Optical Network (SONET). SONET is the standard for synchronous data transmission on optical media. SONET supports gigabit transmission rates."}
  - {"page": 67, "locator": "5.3.1", "reason": "lead-in", "text": "STRATEGIES:"}
  - {"page": 67, "locator": "5.3.1", "reason": "no-marker", "text": "NETWORKS. COORDINATE WITH VENDORS. COORDINATE WITH SECURITY POLICIES AND CONTROLS. IDENTIFY SINGLE POINTS OF FAILURE. IMPLEMENT REDUNDANCY IN CRITICAL COMPONENTS. MONITOR TELECOMMUNICATIONS"}
  - {"page": 67, "locator": "5.3.1", "reason": "no-marker", "text": "NETWORKS. INTEGRATE REMOTE ACCESS"}
  - {"page": 69, "locator": "5.3.2", "reason": "no-marker", "text": "Wireless routers commonly provide password authentication and transmission encryption as standard features.41"}
  - {"page": 69, "locator": "5.3.2", "reason": "no-marker", "text": "Redundant network-connecting devices. Duplicate network-connecting devices, such as routers, switches, and firewalls, can create high availability at the LAN interfaces and provide redundancy if one device fails. Duplicate devices also provide load balancing in routing traffic."}
  - {"page": 69, "locator": "5.3.2", "reason": "no-marker", "text": "See NIST SP 800-97, Establishing Wireless Robust Security Networks: A Guide to IEEE 802.11i, for information on establishing and maintaining a robust security wireless network."}
  - {"page": 69, "locator": "5.3.2", "reason": "no-marker", "text": "NIST SP 800-63 is supported by OMB M-04-04, E-Authentication Guidance for Federal Agencies (December, 16, 2003), which establishes rules and regulations regarding e-authentication in federal systems."}
  - {"page": 70, "locator": "5.4", "reason": "no-marker", "text": "Unlike the client/server architecture, the mainframe architecture is centralized. The clients that access the mainframe are terminals with no processing or data storage capabilities. All the processing power for the system is within the mainframe itself. The terminals accept output only from the mainframe. Early on, these terminals were primarily monitors and keyboards without processors. Now, however, mainframes normally do not have traditional terminals. Instead, desktops and portable computers access mainframes through the use of terminal emulation software."}
  - {"page": 70, "locator": "5.4", "reason": "no-marker", "text": "A mainframe is a multiuser computer designed to meet the computing needs of a large organization. The term (mainframe) was created to describe the large central computers developed in the late 1950s and 1960s to perform bulk accounting and information management functions. Mainframe systems store all data in a central location rather than dispersing data among multiple machines."}
  - {"page": 71, "locator": "5.4.2", "reason": "no-marker", "text": "Disk redundancy can be provided for the direct access storage devices (DASDs) by implementing a RAID solution."}
  - {"page": 71, "locator": "5.5", "reason": "not-a-statement", "text": "Table 5-1 provides a summary of contingency considerations and solutions."}
  - {"page": 71, "locator": "5.5", "reason": "no-marker", "text": "The GSA’s Federal Technology Service Federal Computer Acquisition Center has a governmentwide acquisition contract on behalf of the federal government. The program has been in place since 1993 and provides disaster recovery services to more than forty federal organizations."}
