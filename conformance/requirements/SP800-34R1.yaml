  - id: "REQ-SP800-34R1-0010"
    citation: {"ref": "SP800-34R1", "page": 15, "anchor": "Information systems are vital elements in most mission/business processes. Because information system"}
    kind: "should"
    locator: "Chapter 1. Introduction"
    context: ""
    statement: "Information systems are vital elements in most mission/business processes. Because information system resources are so essential to an organization’s success, it is critical that identified services provided by these systems are able to operate effectively without excessive interruption. Contingency planning supports this requirement by establishing thorough plans, procedures, and technical measures that can enable a system to be recovered as quickly and effectively as possible following a service disruption. Contingency planning is unique to each system, providing preventive measures, recovery strategies, and technical considerations appropriate to the system’s information confidentiality, integrity, and availability requirements and the system impact level."
    status: "not-a-requirement"
    reason: "Chapter 1 background: 'it is critical that identified services ... are able to operate' argues why contingency planning matters, so is critical binds no one and names no act."
