    citation: {"ref": "SP800-34R1", "page": 79, "anchor": "Recover system from backup and system installation media."}
    kind: "lettered"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "5. Recover system from backup and system installation media."
    status: "candidate"
  - id: "REQ-SP800-34R1-0424"
    citation: {"ref": "SP800-34R1", "page": 80, "anchor": "The following procedures are provided for recovery of {system name} at the"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "The following procedures are provided for recovery of {system name} at the original location. Recovery procedures are outlined per team and should be executed in the sequence presented to maintain an efficient recovery effort. Provide general procedures for the recovery of the system from backup media. If an alternate location is part of the recovery strategy, include procedures for recovery to that site. Specific keystroke level procedures may be provided in an appendix. If specific procedures are provided in an appendix, a reference to that appendix should be included in this section. Teams or persons responsible for each procedure should be identified. 4.3 Recovery Escalation Notices/Awareness"
    status: "candidate"
  - id: "REQ-SP800-34R1-0425"
    citation: {"ref": "SP800-34R1", "page": 80, "anchor": "Provide appropriate procedures for escalation notices during recovery efforts. Notifications during recovery"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Provide appropriate procedures for escalation notices during recovery efforts. Notifications during recovery include problem escalation to leadership and status awareness to system owners and users. Teams or persons responsible for each escalation/awareness procedure should be identified."
    status: "candidate"
  - id: "REQ-SP800-34R1-0426"
    citation: {"ref": "SP800-34R1", "page": 80, "anchor": "Reconstitution is the process by which recovery activities are completed and normal"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Reconstitution is the process by which recovery activities are completed and normal system operations are resumed. If the original facility is unrecoverable, the activities in this phase can also be applied to preparing a new permanent location to support system processing requirements. A determination must be made on whether the system has undergone significant change and will require reassessment and reauthorization. The phase consists of two major activities: validating successful reconstitution and deactivation of the plan. 5.1 Validation Data Testing"
    status: "candidate"
  - id: "REQ-SP800-34R1-0427"
    citation: {"ref": "SP800-34R1", "page": 80, "anchor": "Validation data testing is the process of testing and validating data to"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Validation data testing is the process of testing and validating data to ensure that data files or databases have been recovered completely at the permanent location. The following procedures will be used to determine that the data is complete and current to the last available backup: Provide procedures for testing and validation of data to ensure that data is correct and up to date. This section may be combined with the Functionality Testing section if procedures test both the functionality and data validity. Teams or persons responsible for each procedure should be identified. An example of a validation data test for a low-impact system would be to see if the last known complete transaction was updated in the database. Detailed data test procedures may be provided in Appendix E, System Validation Test Plan. 5.2 Validation Functionality Testing"
    status: "candidate"
  - id: "REQ-SP800-34R1-0428"
    citation: {"ref": "SP800-34R1", "page": 80, "anchor": "Validation functionality testing is the process of verifying that {system name} functionality"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Validation functionality testing is the process of verifying that {system name} functionality has been tested, and the system is ready to return to normal operations. Provide system functionality testing and/or validation procedures to ensure that the system is operating correctly. This section may be combined with the Data Testing section if procedures test both the functionality and data validity. Teams or persons responsible for each procedure should be identified. An example of a functional test for a low-impact system may be logging into the system and running a report or performing a transaction to see if the system is operating correctly. Detailed functionality test procedures may be provided in Appendix E, System Validation Test Plan."
    status: "candidate"
  - id: "REQ-SP800-34R1-0429"
    citation: {"ref": "SP800-34R1", "page": 81, "anchor": "Upon successfully completing testing and validation, the {system owner} will formally declare"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Upon successfully completing testing and validation, the {system owner} will formally declare recovery efforts complete, and that {system name} is in normal operations. {System name} business and technical POCs will be notified of the declaration by the ISCP Coordinator. 5.4 Notifications (users)"
    status: "candidate"
  - id: "REQ-SP800-34R1-0430"
    citation: {"ref": "SP800-34R1", "page": 81, "anchor": "Upon return to normal system operations, {system name} users will be notified"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Upon return to normal system operations, {system name} users will be notified by {role} using predetermined notification procedures (e.g., email, broadcast message, phone calls, etc.). 5.5 Cleanup"
    status: "candidate"
  - id: "REQ-SP800-34R1-0431"
    citation: {"ref": "SP800-34R1", "page": 81, "anchor": "Cleanup is the process of cleaning up or dismantling any temporary recovery"}
    kind: "imperative"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Cleanup is the process of cleaning up or dismantling any temporary recovery locations, restocking supplies used, returning manuals or other documentation to their original locations, and readying the system for a possible future contingency event. Provide any specific cleanup procedures for the system including preferred locations for manuals and documents and returning backup or installation media to its original location. 5.6 Data Backup"
    status: "candidate"
  - id: "REQ-SP800-34R1-0432"
    citation: {"ref": "SP800-34R1", "page": 81, "anchor": "As soon as reasonable following recovery, the system should be fully backed"}
    kind: "indicative"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "As soon as reasonable following recovery, the system should be fully backed up and a new copy of the current operational system stored for future recovery efforts. This full backup is then kept with other system backups. The procedures for conducting a full system backup are: Provide appropriate procedures for ensuring that a full system backup is conducted within a reasonable time frame, ideally at the next scheduled backup period. 5.7 Event Documentation"
    status: "candidate"
  - id: "REQ-SP800-34R1-0433"
    citation: {"ref": "SP800-34R1", "page": 81, "anchor": "It is important that all recovery events be well-documented, including actions taken"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "It is important that all recovery events be well-documented, including actions taken and problems encountered during the recovery and reconstitution effort, and lessons learned for inclusion and update to this ISCP. It is the responsibility of each ISCP team or person to document their actions during the recovery and reconstitution effort, and to provide that documentation to the ISCP Coordinator. Provide details about the types of information each ISCP team member is required to provide or collect for updating the ISCP with lessons learned. Types of documentation that should be generated and collected after a contingency activation include:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0434"
    citation: {"ref": "SP800-34R1", "page": 81, "anchor": "Activity logs (including recovery steps performed and by whom, the time the"}
    kind: "indicative"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Activity logs (including recovery steps performed and by whom, the time the steps were initiated and completed, and any problems or concerns encountered while executing activities);"
    status: "candidate"
  - id: "REQ-SP800-34R1-0435"
    citation: {"ref": "SP800-34R1", "page": 81, "anchor": "After Action Report. Event documentation procedures should detail responsibilities for development, collection,"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "After Action Report. Event documentation procedures should detail responsibilities for development, collection, approval, and maintenance."
    status: "candidate"
  - id: "REQ-SP800-34R1-0436"
    citation: {"ref": "SP800-34R1", "page": 82, "anchor": "Once all activities have been completed and documentation has been updated, the"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.5"
    context: "TABLE OF CONTENTS"
    statement: "Once all activities have been completed and documentation has been updated, the {system owner} will formally deactivate the ISCP recovery and reconstitution effort. Notification of this declaration will be provided to all business and technical POCs."
    status: "candidate"
  - id: "REQ-SP800-34R1-0437"
    citation: {"ref": "SP800-34R1", "page": 19, "anchor": "This chapter discusses the ways in which federal information system contingency planning"}
    kind: "indicative"
    locator: "Chapter 2. Background"
    context: ""
    statement: "This chapter discusses the ways in which federal information system contingency planning fits into an organization’s larger risk management, security, and emergency preparedness programs (each of which is a key component in developing a resiliency program). Other types of emergency preparedness-related plans and their relationships to information system contingency planning are also described. Finally, the section discusses how integrating contingency planning principles throughout the SDLC promotes system compatibility and a cost-effective means to increase an organization’s ability to respond quickly and effectively to a disruptive event."
    status: "candidate"
    removed: true
  - id: "REQ-SP800-34R1-0438"
    citation: {"ref": "SP800-34R1", "page": 19, "anchor": "Effective contingency planning begins with the development of an organization contingency planning"}
    kind: "indicative"
    locator: "2.1"
    context: "Contingency Planning and Resilience"
    statement: "Effective contingency planning begins with the development of an organization contingency planning policy and subjection of each information system to a business impact analysis (BIA). This facilitates prioritizing the systems and processes based on the FIPS 199 impact level and develops priority recovery strategies for minimizing loss. FIPS 199 provides guidelines on determining information and information system impact to organizational operations and assets, individuals, other organizations and the nation through a formula that examines three security objectives: confidentiality, integrity, and availability.8"
    status: "candidate"
    removed: true
