    context: "Document Structure"
    statement: "Chapter 4, Information System Contingency Plan Development, breaks down the activities necessary to document the contingency strategy and develop the ISCP. Maintaining, testing, training, and exercising the contingency plan are also discussed in this section."
    status: "not-a-requirement"
    reason: "Roadmap line for Chapter 4: 'breaks down the activities necessary to document the contingency strategy'; a chapter summary."
  - id: "REQ-SP800-34R1-0033"
    citation: {"ref": "SP800-34R1", "page": 19, "anchor": "Information systems are vulnerable to a variety of disruptions, ranging from mild"}
    kind: "should"
    locator: "Chapter 2. Background"
    context: ""
    statement: "Information systems are vulnerable to a variety of disruptions, ranging from mild (e.g., short-term power outage, disk drive failure) to severe (e.g., equipment destruction, fire). Much vulnerability may be minimized or eliminated through management, operational, or technical controls as part of the organization’s resiliency effort; however, it is virtually impossible to completely eliminate all risks.6 Contingency planning is designed to mitigate the risk of system and service unavailability by providing effective and efficient solutions to enhance system availability."
    status: "not-a-requirement"
    reason: "Chapter 2 opening: systems 'are vulnerable', risk cannot be eliminated, and contingency planning 'is designed to mitigate'; background with no actor or act."
  - id: "REQ-SP800-34R1-0034"
    citation: {"ref": "SP800-34R1", "page": 19, "anchor": "An organization must have the ability to withstand all hazards and sustain"}
    kind: "modal"
    locator: "2.1"
    context: "Contingency Planning and Resilience"
    statement: "An organization must have the ability to withstand all hazards and sustain its mission through environmental changes. These changes can be gradual, such as economic or mission changes, or sudden, as in a disaster event. Rather than just working to identify and mitigate threats, vulnerabilities, and risks, organizations can work toward building a resilient infrastructure, minimizing the impact of any disruption on mission essential functions."
    status: "not-applicable"
    reason: "Binds the organization as a whole to withstand all hazards and sustain its mission. PER-CIO and PER-RE were checked: neither carries organizational resilience, ART-CP is scoped to one system, and p16 puts mission continuity outside this guide, so no artifact or task holds it."
  - id: "REQ-SP800-34R1-0035"
    citation: {"ref": "SP800-34R1", "page": 20, "anchor": "The impact for each security objective is determined to be high, moderate,"}
    kind: "indicative"
    locator: "2.1"
    context: "Contingency Planning and Resilience"
    statement: "The impact for each security objective is determined to be high, moderate, or low, based on definitions provided in FIPS 199. The highest of the individual security objective impact levels are used to determine the overall information system security impact level."
    status: "not-a-requirement"
    reason: "Explains how FIPS 199 works, the high-water mark for the overall impact level; description of another document. A run categorizes per objective under CNSSI 1253, see the report's source conflicts."
  - id: "REQ-SP800-34R1-0036"
    citation: {"ref": "SP800-34R1", "page": 20, "anchor": "Contingency planning considerations and strategies address the impact level of the availability"}
    kind: "should"
    locator: "2.1"
    context: "Contingency Planning and Resilience"
    statement: "Contingency planning considerations and strategies address the impact level of the availability security objective of information systems. Strategies for high-impact information systems should consider high-availability and redundancy options in their design. Options may include fully redundant load balanced systems at alternate sites, data mirroring, and offsite database replication. High-availability options are normally expensive to set up, operate, and maintain and should be considered only for those high-impact information systems categorized with a high-availability security objective. Lower-impact information systems may be able to use less expensive contingency options and tolerate longer downtimes for recovery or restoration of data."
    status: "candidate"
  - id: "REQ-SP800-34R1-0037"
    citation: {"ref": "SP800-34R1", "page": 20, "anchor": "Effective contingency planning includes incorporating security controls early in the development of"}
    kind: "indicative"
    locator: "2.1"
    context: "Contingency Planning and Resilience"
    statement: "Effective contingency planning includes incorporating security controls early in the development of an information system, and maintaining these controls on an ongoing basis. NIST SP 800-53, Rev. 3, identifies nine Contingency Planning (CP) security controls for information systems. Not all controls are applicable to all systems. The FIPS 199 security categorization determines which controls apply to a particular system. For example, information systems that have availability as a security objective categorized as low-impact do not require alternate processing or storage sites, and information systems that have an availability security objective categorized as moderate-impact require compliance with only the first system backup control enhancements. Using the FIPS 199 security categorization allows for tailoring of the CP security controls in NIST SP 800-53 to those applicable to the appropriate security control baselines. Table 2-1 provides a summary of the CP controls from NIST SP 800-53 and their applicability to the security control baselines. Further details and descriptions of the contingency planning controls are provided in Appendix E."
    status: "candidate"
  - id: "REQ-SP800-34R1-0038"
    citation: {"ref": "SP800-34R1", "page": 20, "anchor": "There are options available to organizations to facilitate compliance with the CP"}
    kind: "indicative"
    locator: "2.1"
    context: "Contingency Planning and Resilience"
    statement: "There are options available to organizations to facilitate compliance with the CP controls. NIST SP 800- 53 allows for compensating security controls to provide comparable protection for an information system to comply with the intent of a CP control. An organization may use a compensating security control in lieu of a CP control as long as there is justification for the use of the compensating control and willingness to accept the risk of the compensating control implementation. Further explanation of compensating security controls is available in Section 3.3 of NIST SP 800-53."
    status: "candidate"
  - id: "REQ-SP800-34R1-0039"
    citation: {"ref": "SP800-34R1", "page": 21, "anchor": "Low | Moderate | High"}
    kind: "table"
    locator: "2.1"
    context: "Table 2-1: Summary of NIST SP 800-53 Contingency Planning Controls for Low-, Moderate-, and High-Impact"
    statement: "Low | Moderate | High"
