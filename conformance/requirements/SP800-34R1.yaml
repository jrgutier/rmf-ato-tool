  - id: "REQ-SP800-34R1-0019"
    citation: {"ref": "SP800-34R1", "page": 17, "anchor": "Information System: An information system is a discrete set of information resources"}
    kind: "indicative"
    locator: "1.2"
    context: "Scope"
    statement: "Information System: An information system is a discrete set of information resources organized for the collection, processing, maintenance, use, sharing, dissemination, or disposition of information.* Information system components include, but are not limited to, mainframes, servers, workstations, network components, operating systems, middleware, and applications. Network components can include, for example, such devices as firewalls, sensors (local or remote), switches, guards, routers, gateways, wireless access points, and network appliances. Servers can include, for example, database servers, authentication servers, electronic mail and Web servers, proxy servers, domain name servers, and network time servers. Information system components are either purchased commercially off-the-shelf or are custom-developed and can be deployed in land-based, sea-based, airborne, and/or space-based information systems.** * As defined by 44 U.S.C., Sec 3502. ** As defined in NIST Special Publication 800-53, Recommended Security Controls for Federal Information Systems and Organizations."
    status: "not-a-requirement"
    reason: "Boxed definition of 'information system' and its components from 44 U.S.C. and SP 800-53. Recommended occurs only in the SP 800-53 title in the box footnote, so recommended binds no one."
