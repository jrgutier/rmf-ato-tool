  - id: "REQ-SP800-34R1-0442"
    citation: {"ref": "SP800-34R1", "page": 61, "anchor": "Another example is available equipment at an alternate facility that is running"}
    kind: "indicative"
    locator: "5.1.5"
    context: "Identification of Alternate Storage and Processing Facilities"
    statement: "Another example is available equipment at an alternate facility that is running noncritical systems and that could be transitioned to run a critical system during a contingency event. A warm site is more expensive than a cold site, as equipment is purchased and maintained at the warm site, with telecommunications in place. Some costs may be offset by using equipment for noncritical functions or for testing. Recovery to a warm site can take several hours to several days, depending on system complexity and the amount of data to be restored. Hot Sites. Hot sites are locations with fully operational equipment and capacity to quickly take over system operations after loss of the primary system facility. A hot site has sufficient equipment and the most current version of production software installed, and adequate storage for the production system data. Hot sites should have the most recent version of backed-up data loaded, requiring only updating with data since the last backup. In many cases, hot site data and databases are updated concurrently with or soon after the primary data and databases are updated. Hot sites also need a way to quickly move system users’ connectivity from the primary site. One example of a hot site is two identical systems at alternate locations that are in production, serving different geographical locations or load balancing production workload. Each location is built to handle the full workload, and data is continuously synchronized between the systems. This is the most expensive option, requiring full operation of a system at an alternate location and all telecommunications capacity, with the ability to maintain or quickly update the operational data and databases."
    status: "candidate"
  - id: "REQ-SP800-34R1-0443"
    citation: {"ref": "SP800-34R1", "page": 61, "anchor": "Hot sites also require having operational support nearly equal to the production"}
    kind: "modal"
    locator: "5.1.5"
    context: "Identification of Alternate Storage and Processing Facilities"
    statement: "Hot sites also require having operational support nearly equal to the production The ISCP Coordinator should look at information provided in the BIA to determine what critical mission/business processes a system supports, the MTD, and the impact loss of the system would have on the business to establish what type of recovery site is needed. An information system recovery strategy may incorporate one or more of these types of alternate processing facilities. For example, some functionality of a system may be highly critical and require a hot site to minimize the downtime and impact on mission/business processes. However, other functionality of the same system, such as a reporting or batch printing process, may be able to be down for several days with little impact and would just need extra space in the alternate facility to place additional equipment after it is purchased."
    status: "candidate"
  - id: "REQ-SP800-34R1-0444"
    citation: {"ref": "SP800-34R1", "page": 49, "anchor": "Plans should be formatted to provide quick and clear directions in the"}
    kind: "should"
    locator: "Chapter 4. Information System Contingency Plan Development"
    context: "Figure 4-1: Contingency Plan Structure"
    statement: "Plans should be formatted to provide quick and clear directions in the event that personnel unfamiliar with the plan or the systems are called on to perform recovery operations. Plans should be clear, concise, and easy to implement in an emergency. Where possible, checklists and step-by-step procedures should be used. A concise and well-formatted plan reduces the likelihood of creating an overly complex or confusing plan."
    status: "candidate"
