    reason: "First of four bullets under 'Contingency planning generally includes one or more of the following approaches': a description of an option, not an instruction."
  - id: "REQ-SP800-34R1-0012"
    citation: {"ref": "SP800-34R1", "page": 15, "anchor": "This publication assists organizations in understanding the purpose, process, and format of"}
    kind: "indicative"
    locator: "1.1"
    context: "Purpose"
    statement: "This publication assists organizations in understanding the purpose, process, and format of ISCP development through practical, real-world guidelines. While the principles establish a baseline to meet most organizational needs, it is recognized that each organization may have additional requirements specific to its own operating environment. This guidance document provides background information on interrelationships between information system contingency planning and other types of security and emergency management-related contingency plans, organizational resiliency, and the system development life cycle (SDLC). The document provides guidance to help personnel evaluate information systems and operations to determine contingency planning requirements and priorities. Requirements from FIPS 199, Standards for Security Categorization of Federal Information and Information Systems, security impact levels, and NIST Special Publication 800-53, Recommended Security Controls for Federal Information Systems and Organizations contingency planning controls are integrated throughout the guideline. Considerations for impact levels and associated security controls for contingency planning are presented to assist planners in developing the appropriate contingency planning strategy. Although the information presented in this document is largely independent of particular hardware platforms, operating systems, and applications, technical considerations specific to common information system platforms are addressed."
    status: "not-a-requirement"
    reason: "Section 1.1 Purpose: 'This publication assists organizations'. Recommended occurs only in the title of SP 800-53, so recommended here binds no one."
  - id: "REQ-SP800-34R1-0013"
    citation: {"ref": "SP800-34R1", "page": 16, "anchor": "This document is published by NIST as recommended guidelines for federal organizations."}
    kind: "modal"
    locator: "1.2"
    context: "Scope"
    statement: "This document is published by NIST as recommended guidelines for federal organizations. To assist personnel responsible for developing contingency plans, this document discusses common technologies that may be used to support contingency capabilities. Given the broad range of information system designs and configurations, as well as the rapid development and obsolescence of products and capabilities, the scope of the discussion is not intended to be comprehensive. Rather, the document describes technology practices to enhance an organization’s information system contingency planning capabilities. These guidelines present contingency planning principles for the following common platform types:"
    status: "not-a-requirement"
    reason: "Section 1.2 Scope: labels the document as recommended guidelines and names personnel responsible for plans as its readers. Recommended and responsible for describe the audience and the status of the text, and bind no one."
  - id: "REQ-SP800-34R1-0014"
    citation: {"ref": "SP800-34R1", "page": 16, "anchor": "The document outlines planning principles for a wide variety of incidents that"}
    kind: "indicative"
    locator: "1.2"
    context: "Scope"
    statement: "The document outlines planning principles for a wide variety of incidents that can affect information system operations. These range from minor incidents causing short-term disruptions to disasters that affect normal operations for an extended period. Because information systems vary in design and purpose, specific incident types and associated contingency measures are not addressed in this guide. Instead, a defined process is provided for identifying planning requirements needed to develop an effective contingency plan for any information system."
    status: "not-a-requirement"
    reason: "Scope statement: 'The document outlines planning principles'; says what the guide covers and leaves out."
  - id: "REQ-SP800-34R1-0015"
    citation: {"ref": "SP800-34R1", "page": 16, "anchor": "This document does not address facility-level information system planning (commonly referred to"}
    kind: "modal"
    locator: "1.2"
    context: "Scope"
    statement: "This document does not address facility-level information system planning (commonly referred to as a disaster recovery plan) or organizational mission continuity (commonly referred to as a continuity of operations [COOP] plan) except where it is required to restore information systems and their processing capabilities. Nor does this document address continuity of mission/business processes. Although information systems typically support mission/business processes, the processes also depend on a variety of other resources and capabilities not associated with information systems. Recovery of mission essential functions is addressed by COOP plans or business continuity plans. These plans are part of a suite of security and emergency management-related plans further described in Section 2.2. The ISCP may be prepared in coordination with disaster recovery planning, COOP planning, or business continuity planning to the degree that a particular system is necessary to provide a capability that is required during any of these events/efforts."
    status: "not-a-requirement"
    reason: "Scope exclusion: the document 'does not address' facility planning or COOP 'except where it is required to restore' systems. Is required here limits the guide's subject and binds no one; 'may be prepared in coordination' is a permission, and the coordination duty is 0109."
