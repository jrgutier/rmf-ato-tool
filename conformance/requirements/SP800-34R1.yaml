    statement: "o COOP functions may be supported by information systems."
    status: "not-a-requirement"
    reason: "Same box: 'COOP functions may be supported by information systems'; an observation, with may as possibility."
  - id: "REQ-SP800-34R1-0063"
    citation: {"ref": "SP800-34R1", "page": 23, "anchor": "Information systems support government mission/business processes, but not all government mission/business processes"}
    kind: "lettered"
