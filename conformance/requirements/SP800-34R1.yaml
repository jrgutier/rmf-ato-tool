  - id: "REQ-SP800-34R1-0060"
    citation: {"ref": "SP800-34R1", "page": 22, "anchor": "COOP plans are mandated for organizations by HSPD-20/NSPD-51, National Continuity Policy and"}
    kind: "indicative"
    locator: "2.2.2"
    context: "Continuity of Operations (COOP) Plan Standard elements of a COOP plan include:"
    statement: "COOP plans are mandated for organizations by HSPD-20/NSPD-51, National Continuity Policy and FCD 1, Federal Executive Branch National Continuity Program and Requirements. Federal directives distinguish COOP plans as a specific type of plan that should not be confused with Information System Contingency Plans, Disaster Recovery Plans or BCPs. Nongovernment organizations typically use BCPs rather than COOP plans to address mission/business processes."
    status: "not-applicable"
    reason: "Binds federal organizations: 'COOP plans are mandated' by HSPD-20/NSPD-51 and FCD 1. COOP is an organization plan, and PER-CIO was checked and has no COOP task or artifact; ART-CP is the system plan, and 'should not be confused' is what keeps them apart."
  - id: "REQ-SP800-34R1-0061"
    citation: {"ref": "SP800-34R1", "page": 23, "anchor": "COOP functions have specific criteria; not all government mission/business processes meet COOP"}
    kind: "lettered"
    locator: "2.2.2.o"
    context: "FUNCTIONS"
    statement: "o COOP functions have specific criteria; not all government mission/business processes meet COOP criteria."
    status: "not-a-requirement"
