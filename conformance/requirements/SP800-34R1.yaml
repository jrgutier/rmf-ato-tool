  - id: "REQ-SP800-34R1-0050"
    citation: {"ref": "SP800-34R1", "page": 21, "anchor": "Information system contingency planning represents a broad scope of activities designed to"}
    kind: "modal"
    locator: "2.2"
    context: "Types of Plans"
    statement: "Information system contingency planning represents a broad scope of activities designed to sustain and recover critical system services following an emergency event. Information system contingency planning fits into a much broader security and emergency management effort that includes organizational and business process continuity, disaster recovery planning, and incident management. Ultimately, an organization would use a suite of plans to properly prepare response, recovery, and continuity activities for disruptions affecting the organization’s information systems, mission/business processes, personnel, and the facility. Because there is an inherent relationship between an information system and the mission/business process it supports, there must be coordination between each plan during development and updates to ensure that recovery strategies and supporting resources neither negate each other nor duplicate efforts."
    status: "candidate"
  - id: "REQ-SP800-34R1-0051"
    citation: {"ref": "SP800-34R1", "page": 21, "anchor": "Continuity and contingency planning are critical components of emergency management and organizational"}
    kind: "indicative"
    locator: "2.2"
    context: "Types of Plans"
    statement: "Continuity and contingency planning are critical components of emergency management and organizational resilience but are often confused in their use. Continuity planning normally applies to the mission/business itself; it concerns the ability to continue critical functions and processes during and after an emergency event. Contingency planning normally applies to information systems, and provides the steps needed to recover the operation of all or part of designated information systems at an existing or new location in an emergency. Cyber Incident Response Planning is a type of plan that normally focuses on detection, response, and recovery to a computer security incident or event."
    status: "not-a-requirement"
    reason: "Definitions separating continuity, contingency and incident response planning: 'are critical components' describes their standing, so are critical binds no one."
  - id: "REQ-SP800-34R1-0052"
    citation: {"ref": "SP800-34R1", "page": 21, "anchor": "In general, universally accepted definitions for information system contingency planning and the"}
    kind: "should"
    locator: "2.2"
    context: "Types of Plans"
    statement: "In general, universally accepted definitions for information system contingency planning and the related planning areas have not been available. Occasionally, this leads to confusion regarding the actual scope and purpose of various types of plans. To provide a common basis of understanding regarding information system contingency planning, this section identifies several other types of plans and describes their purpose and scope relative to information system contingency planning. Because of the lack of standard definitions for these types of plans, the scope of actual plans developed by organizations may vary from the descriptions below. This guide applies the descriptions and references in sections below to security and emergency management-related plans. The plans listed are in alphabetical order, and do not imply any order of importance."
    status: "not-a-requirement"
    reason: "Note that no universal definitions exist and how this section orders the plan types; about the guide's own terminology."
  - id: "REQ-SP800-34R1-0053"
    citation: {"ref": "SP800-34R1", "page": 22, "anchor": "The BCP focuses on sustaining an organization’s mission/business processes during and after"}
    kind: "modal"
    locator: "2.2.1"
    context: "Business Continuity Plan (BCP)"
    statement: "The BCP focuses on sustaining an organization’s mission/business processes during and after a disruption. An example of a mission/business process may be an organization’s payroll process or customer service process. A BCP may be written for mission/business processes within a single business unit or may address the entire organization’s processes. The BCP may also be scoped to address only the functions deemed to be priorities. A BCP may be used for long-term recovery in conjunction with the COOP plan, allowing for additional functions to come online as resources or time allow. Because mission/business processes use information systems (ISs), the business continuity planner must coordinate with information system owners to ensure that the BCP expectations and IS capabilities are matched."
    status: "candidate"
  - id: "REQ-SP800-34R1-0054"
    citation: {"ref": "SP800-34R1", "page": 22, "anchor": "COOP focuses on restoring an organization’s mission essential functions (MEF) at an"}
    kind: "modal"
    locator: "2.2.2"
    context: "Continuity of Operations (COOP) Plan"
    statement: "COOP focuses on restoring an organization’s mission essential functions (MEF) at an alternate site and performing those functions for up to 30 days before returning to normal operations. Additional functions, or those at a field office level, may be addressed by a BCP. Minor threats or disruptions that do not require relocation to an alternate site are typically not addressed in a COOP plan."
    status: "not-a-requirement"
    reason: "Describes COOP: it 'focuses on restoring' mission essential functions; 'do not require relocation' classifies threats, so require binds no one. The list that follows is 0055 to 0059."
