  - id: "REQ-SP800-34R1-0236"
    citation: {"ref": "SP800-34R1", "page": 49, "anchor": "The concept of operations section provides additional details about the information system,"}
    kind: "modal"
    locator: "4.1"
    context: "Supporting Information"
    statement: "The concept of operations section provides additional details about the information system, the three phases of the contingency plan (Activation and Notification, Recovery, and Reconstitution), and a description of the information system contingency plan roles and responsibilities. This section may include the following elements:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0237"
    citation: {"ref": "SP800-34R1", "page": 49, "anchor": "System description. It is necessary to include a general description of the"}
    kind: "should"
    locator: "4.1"
    context: "Supporting Information This section may include the following elements:"
    statement: "System description. It is necessary to include a general description of the information system addressed by the contingency plan. The description should include the information system architecture, location(s), and any other important technical considerations. An input/output (I/O) diagram and system architecture diagram, including security devices (e.g., firewalls, internal and external connections) are useful. The content for the system description can usually be taken from the System Security Plan.30"
    status: "candidate"
  - id: "REQ-SP800-34R1-0238"
    citation: {"ref": "SP800-34R1", "page": 49, "anchor": "Roles and responsibilities. The roles and responsibilities section presents the overall structure"}
    kind: "modal"
    locator: "4.1"
    context: "Supporting Information"
    statement: "Roles and responsibilities. The roles and responsibilities section presents the overall structure of contingency teams, including the hierarchy and coordination mechanisms and requirements among the teams. The section also provides an overview of team member roles and responsibilities in a contingency situation. Teams and team members should be designated for specific response and recovery roles during contingency plan activation."
    status: "candidate"
  - id: "REQ-SP800-34R1-0239"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "The Activation and Notification Phase defines initial actions taken once a system"}
    kind: "modal"
    locator: "4.2"
    context: "Activation and Notification Phase"
    statement: "The Activation and Notification Phase defines initial actions taken once a system disruption or outage has been detected or appears to be imminent. This phase includes activities to notify recovery personnel, conduct an outage assessment, and activate the plan. At the completion of the Activation and Notification Phase, ISCP staff will be prepared to perform recovery measures to restore system functions."
    status: "not-a-requirement"
    reason: "Describes the Activation and Notification Phase; 'ISCP staff will be prepared' states the outcome of the phase, so will binds no one. The duties are at 0240 and after."
  - id: "REQ-SP800-34R1-0240"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "The ISCP should be activated if one or more of the activation"}
    kind: "should"
    locator: "4.2.1"
    context: "Activation Criteria and Procedure"
    statement: "The ISCP should be activated if one or more of the activation criteria for that system are met. If an activation criterion is met, the designated authority should activate the plan.31 Activation criteria for system outages or disruptions are unique for each organization and should be stated in the contingency planning policy. Criteria may be based on:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0241"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "Extent of any damage to the system (e.g., physical, operational, or cost);"}
    kind: "indicative"
    locator: "4.2.1"
    context: "Activation Criteria and Procedure Criteria may be based on:"
    statement: "Extent of any damage to the system (e.g., physical, operational, or cost);"
    status: "not-a-requirement"
    reason: "Advisory item under 'Criteria may be based on:' at 0240; a permission on what to use."
  - id: "REQ-SP800-34R1-0242"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "Expected duration of the outage lasting longer than the RTO. The appropriate"}
    kind: "should"
    locator: "4.2.1"
    context: "Activation Criteria and Procedure"
    statement: "Expected duration of the outage lasting longer than the RTO. The appropriate recovery teams may be notified once the system outage or disruption has been identified and the ISCP Coordinator has determined that activation criteria have been met. Notification procedures should follow the procedures outlined in Section 4.2.2 below."
    status: "candidate"
  - id: "REQ-SP800-34R1-0243"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "An outage or disruption may occur with or without prior notice. For"}
    kind: "should"
    locator: "4.2.2"
    context: "Notification Procedures"
    statement: "An outage or disruption may occur with or without prior notice. For example, advance notice is often given that a hurricane is predicted to affect an area or that a computer virus is expected on a certain date. However, there may be no notice of equipment failure or a criminal act. Notification procedures should be documented in the plan for both types of situation. The procedures should describe the methods used to notify recovery personnel during business and non business hours. Prompt notification is important for reducing the effects of a disruption on the system; in some cases, it may provide enough time to allow system personnel to shut down the system gracefully to avoid a hard crash. Following the outage or disruption, notification should be sent to the Outage Assessment Team32 so that it may determine the status of the situation and appropriate next steps. Outage assessment procedures are described in Section 4.2.3. When outage assessment is complete, the appropriate recovery and system support personnel should be notified."
    status: "candidate"
  - id: "REQ-SP800-34R1-0244"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "Notifications can be accomplished through a variety of methods, either automated or"}
    kind: "modal"
    locator: "4.2.2"
    context: "Notification Procedures"
    statement: "Notifications can be accomplished through a variety of methods, either automated or manual and include telephone, pager, electronic mail (email), cell phone, and messaging. Automated notification systems follow established protocols and criteria and can include rapid authentication and acceptance and secure messaging. Automated notification systems require up-front investment and learning curve, but may be an effective way for some organizations to ensure prompt and accurate delivery."
    status: "not-a-requirement"
    reason: "Describes notification methods; 'Automated notification systems require up-front investment' states a cost, so require binds no one."
  - id: "REQ-SP800-34R1-0245"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "The designated authority (typically a senior manager or CIO) has the authority"}
    kind: "modal"
    locator: "4.2.2"
    context: "Notification Procedures"
    statement: "The designated authority (typically a senior manager or CIO) has the authority to activate the contingency plan. That authority may vary based on the organization or system, but the individual with this authority should be designated clearly in the plan. Only one individual should have this authority, and a successor should be clearly identified to assume that responsibility if necessary."
    status: "candidate"
  - id: "REQ-SP800-34R1-0246"
    citation: {"ref": "SP800-34R1", "page": 50, "anchor": "The Outage Assessment Team is a representative title. Depending on how the"}
    kind: "modal"
    locator: "4.2.2"
    context: "Notification Procedures"
    statement: "The Outage Assessment Team is a representative title. Depending on how the organization establishes their roles and responsibilities, other names and titles may be used."
    status: "not-a-requirement"
    reason: "Footnote 32: 'Outage Assessment Team is a representative title'; 'roles and responsibilities' is how an organization names teams, so responsibilities binds no one."
  - id: "REQ-SP800-34R1-0247"
    citation: {"ref": "SP800-34R1", "page": 51, "anchor": "Notifications sent via email should be done with caution because there is"}
    kind: "modal"
    locator: "4.2.2"
    context: "Notification Procedures"
    statement: "Notifications sent via email should be done with caution because there is no way to ensure receipt and acknowledgement. Although email has potential as an effective method of disseminating notifications to work or personal accounts, there is no way to guarantee that the message will be read. If using an email notification method, recovery personnel should be informed of the necessity to frequently and regularly check their accounts. Notifications sent during business hours should be sent to the work address, whereas personal email messaging may be useful in the event that the local area network (LAN) is down."
    status: "candidate"
  - id: "REQ-SP800-34R1-0248"
    citation: {"ref": "SP800-34R1", "page": 51, "anchor": "The notification strategy should define procedures to be followed in the event"}
    kind: "modal"
    locator: "4.2.2"
    context: "Notification Procedures"
    statement: "The notification strategy should define procedures to be followed in the event that specific personnel cannot be contacted. Notification procedures should be documented clearly in the contingency plan. Copies of the procedures can be made and located securely at alternate locations. A common manual notification method is a call tree. This technique involves assigning notification duties to specific individuals, who in turn are responsible for notifying other recovery personnel. The call tree should account for primary and alternate contact methods and should discuss procedures to be followed if an individual cannot be contacted. Figure 4-2 presents a sample call tree."
    status: "candidate"
  - id: "REQ-SP800-34R1-0249"
    citation: {"ref": "SP800-34R1", "page": 51, "anchor": "Personnel to be notified should be clearly identified in the contact lists"}
    kind: "should"
    locator: "4.2.2"
    context: "Figure 4-2: Sample Call Tree"
    statement: "Personnel to be notified should be clearly identified in the contact lists appended to the plan. This list should identify personnel by their team position, name, and contact information (e.g., home, work, cell phone, email addresses, and home addresses). An entry may resemble the following format:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0250"
    citation: {"ref": "SP800-34R1", "page": 52, "anchor": "Systems Software Team Team Leader—Primary Jane Jones 1234 Any Street Town, State,"}
    kind: "modal"
    locator: "4.2.2"
    context: "Figure 4-2: Sample Call Tree An entry may resemble the following format:"
    statement: "Systems Software Team Team Leader—Primary Jane Jones 1234 Any Street Town, State, Zip Code Home: (123) 456-7890 Work: (123) 567-8901 Cell: (123) 678-9012 Email: jones@organization.ext; jones@home.ext Notifications also should be sent to POCs of external organizations or interconnected system partners that may be adversely affected if they are unaware of the situation. Depending on the type of outage or disruption, the POC may have recovery responsibilities. For each system interconnection with an external organization, a POC should be identified. These POCs should be listed in an appendix to the plan."
    status: "candidate"
  - id: "REQ-SP800-34R1-0251"
    citation: {"ref": "SP800-34R1", "page": 52, "anchor": "The type of information to be relayed to those being notified should"}
    kind: "should"
    locator: "4.2.2"
    context: "Figure 4-2: Sample Call Tree"
    statement: "The type of information to be relayed to those being notified should be documented in the plan. The amount and detail of information relayed may depend on the specific team being notified. As necessary, notification information may include the following:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0252"
    citation: {"ref": "SP800-34R1", "page": 52, "anchor": "Nature of the outage or disruption that has occurred or is impending;"}
    kind: "indicative"
    locator: "4.2.2"
    context: "Figure 4-2: Sample Call Tree As necessary, notification information may include the following:"
    statement: "Nature of the outage or disruption that has occurred or is impending;"
    status: "not-a-requirement"
    reason: "Advisory item under 'notification information may include the following:' at 0251."
  - id: "REQ-SP800-34R1-0253"
    citation: {"ref": "SP800-34R1", "page": 52, "anchor": "To determine how the ISCP will be implemented following a system disruption"}
    kind: "modal"
    locator: "4.2.3"
    context: "Outage Assessment"
    statement: "To determine how the ISCP will be implemented following a system disruption or outage, it is essential to assess the nature and extent of the disruption. The outage assessment should be completed as quickly as the given conditions permit, with personnel safety remaining the highest priority. When possible, the Outage Assessment Team is the first team notified of the disruption. Outage assessment procedures may be unique for the particular system, but the following minimum areas should be addressed:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0254"
    citation: {"ref": "SP800-34R1", "page": 52, "anchor": "Cause of the outage or disruption;"}
    kind: "indicative"
    locator: "4.2.3"
    context: "Outage Assessment Outage assessment procedures may be unique for the particular system, but the following minimum areas should be addressed:"
    statement: "Cause of the outage or disruption;"
    status: "not-a-requirement"
    reason: "Noun item under the minimum areas lead-in at 0253, which carries it."
  - id: "REQ-SP800-34R1-0255"
    citation: {"ref": "SP800-34R1", "page": 53, "anchor": "Personnel with outage assessment responsibilities should understand and be able to perform"}
    kind: "modal"
    locator: "4.2.3"
    context: "Outage Assessment"
    statement: "Personnel with outage assessment responsibilities should understand and be able to perform these procedures in the event the plan is inaccessible during the situation. Once impact to the system has been determined, the appropriate teams should be notified of updated information and the planned response to the situation. Based upon the results of the outage assessment, ISCP notifications may be revisited and expanded using the procedures described in Section 4.2.2."
    status: "candidate"
  - id: "REQ-SP800-34R1-0256"
    citation: {"ref": "SP800-34R1", "page": 53, "anchor": "Formal recovery operations begin after the ISCP has been activated, outage assessments"}
    kind: "modal"
    locator: "4.3"
    context: "Recovery Phase"
    statement: "Formal recovery operations begin after the ISCP has been activated, outage assessments have been completed (if possible), personnel have been notified, and appropriate teams have been mobilized. Recovery Phase activities focus on implementing recovery strategies to restore system capabilities, repair damage, and resume operational capabilities at the original or new alternate location. At the completion of the Recovery Phase, the information system will be functional and capable of performing the functions identified in the plan. Depending on the recovery strategies defined in the plan, these functions could include temporary manual processing, recovery and operation at an alternate system, or relocation and recovery at an alternate site. It is feasible that only system resources identified as high priority in the BIA will be recovered at this stage."
    status: "not-a-requirement"
    reason: "Describes the Recovery Phase; 'the information system will be functional' and 'will be recovered' state outcomes, so will binds no one. The duties are 0257 to 0273."
  - id: "REQ-SP800-34R1-0257"
    citation: {"ref": "SP800-34R1", "page": 53, "anchor": "When recovering a complex system, such as a wide area network (WAN)"}
    kind: "should"
    locator: "4.3.1"
    context: "Sequence of Recovery Activities"
    statement: "When recovering a complex system, such as a wide area network (WAN) or virtual local area network (VLAN) involving multiple independent components, recovery procedures should reflect system priorities identified in the BIA. The sequence of activities should reflect the system’s MTD to avoid significant impacts to related systems. Procedures should be written in a stepwise, sequential format so system components may be restored in a logical manner. For example, if a LAN is being recovered after a disruption, then the most critical servers should be recovered before other, less critical devices, such as printers. Similarly, to recover an application server, procedures first should address operating system restoration and verification before the application and its data are recovered. The procedures should also include escalation steps and instructions to coordinate with other teams where relevant when certain situations occur, such as:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0258"
    citation: {"ref": "SP800-34R1", "page": 53, "anchor": "An action is not completed within the expected time frame;"}
    kind: "indicative"
    locator: "4.3.1"
    context: "Sequence of Recovery Activities The procedures should also include escalation steps and instructions to coordinate with other teams where relevant when certain situations occur, such as:"
    statement: "An action is not completed within the expected time frame;"
    status: "not-a-requirement"
    reason: "Example item under 'when certain situations occur, such as:' at 0257."
  - id: "REQ-SP800-34R1-0259"
    citation: {"ref": "SP800-34R1", "page": 53, "anchor": "Item(s) must be procured; and"}
    kind: "modal"
    locator: "4.3.1"
    context: "Sequence of Recovery Activities"
    statement: "Item(s) must be procured; and"
    status: "not-a-requirement"
    reason: "Example item 'Item(s) must be procured' under the same 'such as' at 0257: must describes a situation that prompts escalation, and binds no one."
  - id: "REQ-SP800-34R1-0260"
    citation: {"ref": "SP800-34R1", "page": 53, "anchor": "Other system-specific concerns exist. If conditions require the system to be recovered"}
    kind: "modal"
    locator: "4.3.1"
    context: "Sequence of Recovery Activities"
    statement: "Other system-specific concerns exist. If conditions require the system to be recovered at an alternate site, certain materials will need to be transferred or procured. These items may include shipment of data backup media from offsite storage, hardware, copies of the recovery plan, and software programs. Procedures should designate the appropriate team or team members to coordinate shipment of equipment, data, and vital records. References to applicable appendices, such as equipment lists or vendor contact information, should be made in the plan where necessary. Procedures should clearly describe requirements to package, transport, and purchase materials required to recover the system."
    status: "candidate"
  - id: "REQ-SP800-34R1-0261"
    citation: {"ref": "SP800-34R1", "page": 53, "anchor": "To facilitate Recovery Phase operations, the ISCP should provide detailed procedures to"}
    kind: "should"
    locator: "4.3.2"
    context: "Recovery Procedures"
    statement: "To facilitate Recovery Phase operations, the ISCP should provide detailed procedures to restore the information system or components to a known state. Given the extensive variety of system types, configurations, and applications, this planning guide does not provide specific recovery procedures. Recovery considerations are detailed for each of the platform types in Chapter 5."
    status: "candidate"
  - id: "REQ-SP800-34R1-0262"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "Obtaining authorization to access damaged facilities and/or geographic area;"}
    kind: "indicative"
    locator: "4.3.2"
    context: "Recovery Procedures Procedures should be assigned to the appropriate recovery team and typically address the following actions:"
    statement: "Obtaining authorization to access damaged facilities and/or geographic area;"
    status: "not-a-requirement"
    reason: "Action item under the lead-in at 0445, which has the verb; 'typically address' lists usual actions."
  - id: "REQ-SP800-34R1-0263"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "Recovery procedures should be written in a straightforward, step-by-step style. To prevent"}
    kind: "modal"
    locator: "4.3.2"
    context: "Recovery Procedures"
    statement: "Recovery procedures should be written in a straightforward, step-by-step style. To prevent difficulty or confusion in an emergency, no procedural steps should be assumed or omitted. A checklist format is useful for documenting the sequential recovery procedures and for troubleshooting problems if the system cannot be recovered properly. Figure 4-3 provides a partial example of a procedural checklist for a LAN Recovery Team."
    status: "candidate"
  - id: "REQ-SP800-34R1-0264"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "SAMPLE Recovery Process for the LAN Recovery Team: These procedures are used"}
    kind: "indicative"
    locator: "4.3.2"
    context: "Recovery Procedures"
    statement: "SAMPLE Recovery Process for the LAN Recovery Team: These procedures are used for recovering a file from backup tapes. The LAN Recovery"
    status: "not-a-requirement"
    reason: "'SAMPLE Recovery Process for the LAN Recovery Team', Figure 4-3; Sample Text. Cut from 0265 by a line break."
  - id: "REQ-SP800-34R1-0265"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "Team is responsible for reloading all critical files necessary to continue production."}
    kind: "modal"
    locator: "4.3.2"
    context: "Recovery Procedures"
    statement: "Team is responsible for reloading all critical files necessary to continue production."
    status: "not-a-requirement"
    reason: "Continuation of the sample at 0264; 'Team is responsible for reloading' belongs to the fictional LAN team of Figure 4-3, so responsible for binds no one."
  - id: "REQ-SP800-34R1-0266"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "Identify file and date from which file is to be recovered."}
    kind: "lettered"
    locator: "4.3.2.1"
    context: "Recovery Procedures"
    statement: "1. Identify file and date from which file is to be recovered."
    status: "not-a-requirement"
    reason: "Step 1 of the Figure 4-3 sample, tape recovery; Sample Text."
  - id: "REQ-SP800-34R1-0267"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "Identify tape number using tape log book."}
    kind: "lettered"
    locator: "4.3.2.2"
    context: "Recovery Procedures"
    statement: "2. Identify tape number using tape log book."
    status: "not-a-requirement"
    reason: "Step 2 of the Figure 4-3 sample, tape log book; Sample Text."
  - id: "REQ-SP800-34R1-0268"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "If tape is not in tape library, request tape from recovery facility;"}
    kind: "lettered"
    locator: "4.3.2.3"
    context: "Recovery Procedures"
    statement: "3. If tape is not in tape library, request tape from recovery facility; fill out with appropriate authorizing signature."
    status: "not-a-requirement"
    reason: "Step 3 of the Figure 4-3 sample, requesting a tape; Sample Text."
  - id: "REQ-SP800-34R1-0269"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "When tape is received, log date and time."}
    kind: "lettered"
    locator: "4.3.2.4"
    context: "Recovery Procedures"
    statement: "4. When tape is received, log date and time."
    status: "not-a-requirement"
    reason: "Step 4 of the Figure 4-3 sample, logging receipt; Sample Text."
  - id: "REQ-SP800-34R1-0270"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "Place tape into drive and begin recovery process."}
    kind: "lettered"
    locator: "4.3.2.5"
    context: "Recovery Procedures"
    statement: "5. Place tape into drive and begin recovery process."
    status: "not-a-requirement"
    reason: "Step 5 of the Figure 4-3 sample, loading the tape; Sample Text."
  - id: "REQ-SP800-34R1-0271"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "When file is recovered, notify LAN Recovery Team Leader."}
    kind: "lettered"
    locator: "4.3.2.6"
    context: "Recovery Procedures"
    statement: "6. When file is recovered, notify LAN Recovery Team Leader."
    status: "not-a-requirement"
    reason: "Step 6 of the Figure 4-3 sample, notifying the leader; Sample Text."
  - id: "REQ-SP800-34R1-0272"
    citation: {"ref": "SP800-34R1", "page": 54, "anchor": "As identified as part of the BIA, system components, infrastructure, and associated"}
    kind: "indicative"
    locator: "4.3.3"
    context: "Recovery Escalation and Notification"
    statement: "As identified as part of the BIA, system components, infrastructure, and associated facilities are critical components supporting daily mission/business processes. The systems, applications, and infrastructure that connect users to these are subject to events causing service interruptions and outages. Including an escalation and notification component within the Recovery Phase helps to ensure that overall, a repeatable, structured, consistent, and measurable recovery process is followed."
    status: "not-a-requirement"
    reason: "Opens 4.3.3 by explaining why escalation helps: components 'are critical components', so are critical describes them and binds no one. The duty is 0273."
  - id: "REQ-SP800-34R1-0273"
    citation: {"ref": "SP800-34R1", "page": 55, "anchor": "Effective escalation and notification procedures should define and describe the events, thresholds,"}
    kind: "should"
    locator: "4.3.3"
    context: "Recovery Escalation and Notification"
    statement: "Effective escalation and notification procedures should define and describe the events, thresholds, or other types of triggers that are necessary for additional action. Actions would include additional notifications for more recovery staff, messages and status updates to leadership, and notices for additional resources. Procedures should be included to establish a clear set of events, actions and results, and should be documented for teams or individuals as appropriate."
    status: "candidate"
  - id: "REQ-SP800-34R1-0274"
    citation: {"ref": "SP800-34R1", "page": 55, "anchor": "The Reconstitution Phase is the third and final phase of ISCP implementation"}
    kind: "indicative"
    locator: "4.4"
    context: "Reconstitution Phase"
    statement: "The Reconstitution Phase is the third and final phase of ISCP implementation and defines the actions taken to test and validate system capability and functionality. During Reconstitution, recovery activities are completed and normal system operations are resumed. If the original facility is unrecoverable, the activities in this phase can also be applied to preparing a new permanent location to support system processing requirements. This phase consists of two major activities: validating successful recovery and deactivation of the plan. Validation of recovery typically includes these steps:"
    status: "not-a-requirement"
    reason: "Describes the Reconstitution Phase and leads to its validation steps ('typically includes'); no duty word, and the validation and deactivation content is in '## Reconstitution' with the duties at 0276 and 0282."
  - id: "REQ-SP800-34R1-0275"
    citation: {"ref": "SP800-34R1", "page": 55, "anchor": "Concurrent Processing.33 Concurrent processing is the process of running a system at"}
    kind: "indicative"
    locator: "4.4"
    context: "Reconstitution Phase Validation of recovery typically includes these steps:"
    statement: "Concurrent Processing.33 Concurrent processing is the process of running a system at two separate locations concurrently until there is a level of assurance that the recovered system is operating correctly and securely."
    status: "not-a-requirement"
    reason: "Defines concurrent processing; 0278 says no control requires it."
  - id: "REQ-SP800-34R1-0276"
    citation: {"ref": "SP800-34R1", "page": 55, "anchor": "At the successful completion of the validation testing, ISCP personnel will be"}
    kind: "modal"
    locator: "4.4"
    context: "Reconstitution Phase"
    statement: "At the successful completion of the validation testing, ISCP personnel will be prepared to declare that reconstitution efforts are complete and that the system is operating normally. This declaration may be made in a recovery/reconstitution log or other documentation of reconstitution activities. The ISCP Coordinator, in coordination with the Information System Owner, ISSO, SAISO and with the concurrence of the Authorizing Official, must determine if the system has undergone significant change and will require reassessment and reauthorization.34 The utilization of a continuous monitoring strategy/program can guide the scope of the reauthorization to focus on those environment/facility controls and any other controls which would be impacted by the reconstitution efforts. Assessment and authorization guidance is available in NIST SP 800-37, Rev. 1 Guide for Applying the Risk Management Framework to Federal Information Systems: A Security Life Cycle Approach. Deactivation of the plan is the process of returning the system to normal operations and finalizing reconstitution activities to prepare the system against another outage or disruption. These activities include:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0277"
    citation: {"ref": "SP800-34R1", "page": 55, "anchor": "Notifications. Upon return to normal operations, users should be notified by the"}
    kind: "should"
    locator: "4.4"
    context: "Reconstitution Phase These activities include:"
    statement: "Notifications. Upon return to normal operations, users should be notified by the ISCP Coordinator (or designee) using predefined notification procedures."
    status: "candidate"
  - id: "REQ-SP800-34R1-0278"
    citation: {"ref": "SP800-34R1", "page": 55, "anchor": "According to NIST SP 800-53 Contingency Plan security controls, information systems are"}
    kind: "modal"
    locator: "4.4"
    context: "Reconstitution Phase"
    statement: "According to NIST SP 800-53 Contingency Plan security controls, information systems are not required to have concurrent processing capabilities."
    status: "not-a-requirement"
    reason: "Footnote 33: systems 'are not required to have concurrent processing'; an exemption, so required to binds no one."
  - id: "REQ-SP800-34R1-0279"
    citation: {"ref": "SP800-34R1", "page": 56, "anchor": "Offsite Data Storage.35 If offsite data storage is used, procedures should be"}
    kind: "indicative"
    locator: "4.4"
    context: "Reconstitution Phase"
    statement: "Offsite Data Storage.35 If offsite data storage is used, procedures should be documented for returning retrieved backup or installation media to its offsite data storage location."
    status: "candidate"
  - id: "REQ-SP800-34R1-0280"
    citation: {"ref": "SP800-34R1", "page": 56, "anchor": "Data Backup. As soon as reasonable following reconstitution, the system should be"}
    kind: "should"
    locator: "4.4"
    context: "Reconstitution Phase"
    statement: "Data Backup. As soon as reasonable following reconstitution, the system should be fully backed up and a new copy of the current operational system stored for future recovery efforts. This full backup should be stored with other system backups and comply with applicable security controls."
    status: "candidate"
  - id: "REQ-SP800-34R1-0281"
    citation: {"ref": "SP800-34R1", "page": 56, "anchor": "Event Documentation. All recovery and reconstitution events should be well documented, including"}
    kind: "should"
    locator: "4.4"
    context: "Reconstitution Phase"
    statement: "Event Documentation. All recovery and reconstitution events should be well documented, including actions taken and problems encountered during the recovery and reconstitution efforts. An after-action report with lessons learned should be documented and included for updating the ISCP."
    status: "candidate"
  - id: "REQ-SP800-34R1-0282"
    citation: {"ref": "SP800-34R1", "page": 56, "anchor": "Once all activities and steps have been completed and documentation has been"}
    kind: "should"
    locator: "4.4"
    context: "Reconstitution Phase"
    statement: "Once all activities and steps have been completed and documentation has been updated, the ISCP can be formally deactivated. An announcement with the declaration should be sent to all business and technical contacts."
    status: "candidate"
  - id: "REQ-SP800-34R1-0283"
    citation: {"ref": "SP800-34R1", "page": 56, "anchor": "Contact information for contingency planning team personnel;"}
    kind: "indicative"
    locator: "4.5"
    context: "Plan Appendices Common contingency plan appendices include the following:"
    statement: "Contact information for contingency planning team personnel;"
    status: "not-a-requirement"
    reason: "Item under 'Common contingency plan appendices include the following:', advisory: a list of common appendices, not a minimum set. Contact information is held at 0249."
  - id: "REQ-SP800-34R1-0284"
    citation: {"ref": "SP800-34R1", "page": 56, "anchor": "Equipment and system requirements lists of the hardware, software, firmware, and other"}
    kind: "modal"
    locator: "4.5"
    context: "Plan Appendices"
    statement: "Equipment and system requirements lists of the hardware, software, firmware, and other resources required to support system operations. Details should be provided for each entry, including model or version number, specifications, and quantity;"
    status: "candidate"
  - id: "REQ-SP800-34R1-0285"
    citation: {"ref": "SP800-34R1", "page": 56, "anchor": "According to NIST SP 800-53 Contingency Plan security controls, a low-impact system"}
    kind: "modal"
    locator: "4.5"
    context: "Plan Appendices"
    statement: "According to NIST SP 800-53 Contingency Plan security controls, a low-impact system is not required to have offsite data storage capabilities."
    status: "not-a-requirement"
    reason: "Footnote 35: a low-impact system 'is not required to have offsite data storage'; an exemption, so required to binds no one, and CNSSI 1253 decides it through cp-6."
  - id: "REQ-SP800-34R1-0286"
    citation: {"ref": "SP800-34R1", "page": 57, "anchor": "This chapter complements the process and framework guidelines presented in earlier sections"}
    kind: "modal"
    locator: "Chapter 5. Technical Contingency Planning Considerations"
    context: ""
    statement: "This chapter complements the process and framework guidelines presented in earlier sections by discussing technical contingency planning considerations for specific types of information systems. The information presented in this section will assist the reader in selecting, developing, and implementing specific technical contingency strategies based on the type of information system. Because each system is unique, considerations are provided at a level that may be used by the widest audience. The list of platforms is not comprehensive, but is representative of commonly found systems in production or development. Not all of the information presented may apply to a specific information system; the ISCP Coordinator should draw on the considerations as appropriate and customize them to meet a system’s particular contingency requirements. The following representative platform types are addressed in this section:"
    status: "not-a-requirement"
    reason: "Introduces Chapter 5: 'will assist the reader' describes the chapter, and 'should draw on the considerations as appropriate' leaves everything to judgment, so will and should bind no one to a checkable act."
  - id: "REQ-SP800-34R1-0287"
    citation: {"ref": "SP800-34R1", "page": 57, "anchor": "For each system type, contingency measures are considered from two perspectives. First,"}
    kind: "should"
    locator: "Chapter 5. Technical Contingency Planning Considerations"
    context: ""
    statement: "For each system type, contingency measures are considered from two perspectives. First, the document discusses technical requirements or factors that the ISCP Coordinator should consider when planning a system recovery strategy during the Development/Acquisition Phase of the SDLC.36 Second, the document provides technology-based solutions for each type of system."
    status: "not-a-requirement"
    reason: "Says how the chapter is organized: 'the document discusses technical requirements or factors that the ISCP Coordinator should consider'. Should is inside a description of the text, and binds no one."
  - id: "REQ-SP800-34R1-0288"
    citation: {"ref": "SP800-34R1", "page": 57, "anchor": "The technical considerations and solutions addressed in this section include preventive measures"}
    kind: "should"
    locator: "5.1"
    context: "Common Considerations"
    statement: "The technical considerations and solutions addressed in this section include preventive measures discussed in Section 3.3 and recovery measures described in Section 3.4. When developing solutions for technical contingency plans, there are several areas that should be considered regardless of the platform or type of system. These considerations provide a common foundation for any type of contingency planning effort. Several of these contingency measures are common to all information systems. Common considerations include the following:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0289"
    citation: {"ref": "SP800-34R1", "page": 57, "anchor": "Use of information gathered from the BIA process;"}
    kind: "indicative"
    locator: "5.1"
    context: "Common Considerations Common considerations include the following:"
    statement: "Use of information gathered from the BIA process;"
    status: "not-a-requirement"
    reason: "Noun item 'Use of information gathered from the BIA process' under the lead-in at 0288."
  - id: "REQ-SP800-34R1-0290"
    citation: {"ref": "SP800-34R1", "page": 57, "anchor": "Use of high availability (HA) processes to provide for online real-time resilient"}
    kind: "should"
    locator: "5.1"
    context: "Common Considerations"
    statement: "Use of high availability (HA) processes to provide for online real-time resilient access to alternate system resources. HA denotes systems that can achieve an uptime of 99.999 percent or better. Note that HA is a process for achieving high availability and should not be confused with FIPS 199 high-impact category systems."
    status: "not-a-requirement"
    reason: "Last item of the 0288 list, with a definition: HA 'should not be confused with FIPS 199 high-impact category systems' is a caution on a term, so should binds no one to an act."
  - id: "REQ-SP800-34R1-0291"
    citation: {"ref": "SP800-34R1", "page": 58, "anchor": "Maintaining the integrity and security of system data and software is a"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Maintaining the integrity and security of system data and software is a key component in contingency planning. Data integrity involves keeping data safe and accurate on the system’s primary storage devices. There are several methods available to maintain the integrity of stored data. These methods use redundancy and fault tolerance processes to store data on more than one drive and eliminate loss of data from single drive failures. Data security involves protecting data both onsite and offsite from unauthorized access or use. Encryption is a common method for securing stored system data. Encryption is most effective when applied to both the primary data storage device and on backup media going to an offsite location.37 If using encryption for offsite data storage, it is important that media readers (e.g., tape drives, CD or DVD readers) are available at the alternate site location to correctly read the encrypted data during recovery efforts. A solid key management process must be established so encrypted data is available as needed. Keying material, which is the data used to establish and maintain the keys, needs to be managed, ideally at a central location in the organization. These keys should be stored separate from, but accessible to, the primary encrypted backup data.38"
    status: "candidate"
  - id: "REQ-SP800-34R1-0292"
    citation: {"ref": "SP800-34R1", "page": 58, "anchor": "Data backups should be conducted on all systems on a regular basis."}
    kind: "should"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Data backups should be conducted on all systems on a regular basis. Systems can be backed up for individual computers or on a centralized storage device, such as network attached storage (NAS) or storage area network (SAN). There are three common methods for performing system backups:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0293"
    citation: {"ref": "SP800-34R1", "page": 58, "anchor": "Full. A full backup captures all files on the disk or within"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup There are three common methods for performing system backups:"
    statement: "Full. A full backup captures all files on the disk or within the folder selected for backup. Because all backed-up files are recorded to a single media or media set, locating a particular file or group of files is simple. However, the time required to perform a full backup can be lengthy. In addition, maintaining multiple iterations of full backups of files that do not change frequently (such as system files) could lead to excessive, unnecessary media storage requirements."
    status: "not-a-requirement"
    reason: "Defines a full backup and its trade-offs; 'the time required to perform' is no duty, so required to binds no one."
  - id: "REQ-SP800-34R1-0294"
    citation: {"ref": "SP800-34R1", "page": 58, "anchor": "Incremental. An incremental backup captures files that were created or changed since"}
    kind: "should"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Incremental. An incremental backup captures files that were created or changed since the last backup, regardless of backup type. Incremental backups afford more efficient use of storage media, and backup times are reduced. However, to recover a system from an incremental backup, media from different backup operations may be required. For example, consider a case in which a directory needs to be recovered. If the last full backup was performed three days prior and one file had changed each day, then the media for the full backup and for each day’s incremental backups would be needed to restore the entire directory."
    status: "not-a-requirement"
    reason: "Defines an incremental backup with a worked example; 'a directory needs to be recovered' is the example, so needs to binds no one."
  - id: "REQ-SP800-34R1-0295"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Differential. A differential backup stores files that were created or modified since"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Differential. A differential backup stores files that were created or modified since the last full backup. Therefore, if a file is changed after the previous full backup, a differential backup will save the file each time until the next full backup is completed. A differential backup takes less time to complete than a full backup. Restoring from a differential backup may require fewer media than an incremental backup because only the full backup media and the last differential media would be needed. As a disadvantage, differential backups take longer to complete than incremental backups because the amount of data since the last full backup increases each day until the next full backup is executed. A combination of backup operations can be used depending on system configuration and recovery requirements. For example, a full backup can be conducted on the weekend with differential backups conducted each evening. In developing a system backup policy, the following questions should be considered:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0296"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Where and how will media be stored?"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup In developing a system backup policy, the following questions should be considered:"
    statement: "Where and how will media be stored?"
    status: "candidate"
  - id: "REQ-SP800-34R1-0297"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "What data should be backed up and how often should it be"}
    kind: "should"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "What data should be backed up and how often should it be backed up?"
    status: "candidate"
  - id: "REQ-SP800-34R1-0298"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Who is authorized to retrieve the media?"}
    kind: "indicative"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Who is authorized to retrieve the media?"
    status: "candidate"
  - id: "REQ-SP800-34R1-0299"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Where will the media be delivered and what is the rotation schedule"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Where will the media be delivered and what is the rotation schedule of backup media?"
    status: "candidate"
  - id: "REQ-SP800-34R1-0300"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Who will restore the data from the media?"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Who will restore the data from the media?"
    status: "candidate"
  - id: "REQ-SP800-34R1-0301"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "How long will the backup media be retained?"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "How long will the backup media be retained?"
    status: "candidate"
  - id: "REQ-SP800-34R1-0302"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "When the media are stored onsite, what environmental controls are provided to"}
    kind: "indicative"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "When the media are stored onsite, what environmental controls are provided to preserve the media?"
    status: "candidate"
  - id: "REQ-SP800-34R1-0303"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Equipment interoperability. To facilitate recovery, the backup device must be compatible with"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup Certain factors should be considered when choosing the appropriate backup solution:"
    statement: "Equipment interoperability. To facilitate recovery, the backup device must be compatible with the platform operating system and applications and should be easy to install onto different models or types of systems."
    status: "candidate"
  - id: "REQ-SP800-34R1-0304"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Storage volume. To ensure adequate storage, the amount of data to be"}
    kind: "should"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Storage volume. To ensure adequate storage, the amount of data to be backed up should determine the appropriate backup solution."
    status: "candidate"
  - id: "REQ-SP800-34R1-0305"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Media life. Each type of medium has a different use and storage"}
    kind: "modal"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Media life. Each type of medium has a different use and storage life beyond which the media cannot be relied on for effective data recovery."
    status: "candidate"
  - id: "REQ-SP800-34R1-0306"
    citation: {"ref": "SP800-34R1", "page": 59, "anchor": "Backup Software. When choosing the appropriate backup solution, the software or method"}
    kind: "should"
    locator: "5.1.2"
    context: "Maintenance of Data Security, Integrity, and Backup"
    statement: "Backup Software. When choosing the appropriate backup solution, the software or method used to back up data should be considered. In some cases, the backup solution can be as simple as a file copy using the operating system file manager; in cases involving larger data transfers, a third-party application may be needed to automate and schedule the file backup."
    status: "candidate"
  - id: "REQ-SP800-34R1-0307"
    citation: {"ref": "SP800-34R1", "page": 60, "anchor": "Part of a successful contingency planning policy is making a system resilient"}
    kind: "modal"
    locator: "5.1.3"
    context: "Protection of Resources"
    statement: "Part of a successful contingency planning policy is making a system resilient to environmental and component-level failures that would otherwise cause system disruptions. There are several methods for making valuable hardware and software resilient. Determination of the appropriate methods should be based on risk-informed decisions. Depending on results of the risk management process, these methods may or may not be applicable for a particular system."
    status: "candidate"
  - id: "REQ-SP800-34R1-0308"
    citation: {"ref": "SP800-34R1", "page": 60, "anchor": "The system and its data can become corrupt as a result of"}
    kind: "modal"
    locator: "5.1.3"
    context: "Protection of Resources"
    statement: "The system and its data can become corrupt as a result of a power failure. Critical hardware, such as servers, can be configured with dual power supplies to prevent corruption. The two power supplies should be used simultaneously so that if the main power supply becomes overheated or unusable, the second unit will become the main power source, resulting in no system disruption."
    status: "candidate"
  - id: "REQ-SP800-34R1-0309"
    citation: {"ref": "SP800-34R1", "page": 60, "anchor": "The second power supply will protect against hardware failure, but not power"}
    kind: "modal"
    locator: "5.1.3"
    context: "Protection of Resources"
    statement: "The second power supply will protect against hardware failure, but not power failure. However, a UPS can protect the system if power is lost. A UPS usually provides 30 to 60 minutes of temporary backup power to permit a graceful shutdown. A UPS can also protect against power fluctuations by filtering incoming power and providing a steady power source. If high availability is required, a gas- or diesel-powered generator may be needed. The generator can be wired directly into the site’s power system and configured to start automatically when a power interruption is detected. A combination UPS/generator system can provide clean, secure power for a system as long as fuel is available for the generator. Fuel availability should be considered for those who opt for a UPS/generator to support their system environment."
    status: "candidate"
  - id: "REQ-SP800-34R1-0310"
    citation: {"ref": "SP800-34R1", "page": 60, "anchor": "In addition to backing up data, organizations should also back up system"}
    kind: "should"
    locator: "5.1.3"
    context: "Protection of Resources"
    statement: "In addition to backing up data, organizations should also back up system software and drivers. Organizations should store software and software licenses in an alternate location. This includes original installation media, license terms and conditions, and license keys, if required. Image loads for client systems (such as desktops and portable systems) should also be backed up and stored at an alternate location, along with complete documentation of the software included in the image load, any configuration information for the type of computer for which the image is intended, and installation instructions."
    status: "candidate"
  - id: "REQ-SP800-34R1-0311"
    citation: {"ref": "SP800-34R1", "page": 60, "anchor": "Organizations may use third-party vendors to recover data from failed storage devices."}
    kind: "indicative"
    locator: "5.1.3"
    context: "Protection of Resources"
    statement: "Organizations may use third-party vendors to recover data from failed storage devices. Organizations should consider the security risk of having their data handled by an outside company and ensure that proper security vetting of the service provider is conducted before turning over equipment. The service provider and employees should sign non disclosure agreements, be properly bonded, and adhere to organization-specific security policies."
    status: "candidate"
  - id: "REQ-SP800-34R1-0312"
    citation: {"ref": "SP800-34R1", "page": 60, "anchor": "Backup media should be stored offsite in a secure, environmentally controlled location."}
    kind: "modal"
    locator: "5.1.5"
    context: "Identification of Alternate Storage and Processing Facilities"
    statement: "Backup media should be stored offsite in a secure, environmentally controlled location. When selecting the offsite location, hours of the location, ease of accessibility to backup media, physical storage limitations, and the contract terms should be taken into account. The ISCP Coordinator should reference the organization’s resilience policy and the BIA to assist in determining how often backup media should be tested. Each backup tape, cartridge, or disk should be uniquely labeled to ensure that the required data can be identified quickly in an emergency. This requires that the organization develop an effective media marking and tracking strategy."
    status: "candidate"
  - id: "REQ-SP800-34R1-0313"
    citation: {"ref": "SP800-34R1", "page": 61, "anchor": "Cold Sites. Cold sites are locations that have the basic infrastructure and"}
    kind: "modal"
    locator: "5.1.5"
    context: "Identification of Alternate Storage and Processing Facilities"
    statement: "Cold Sites. Cold sites are locations that have the basic infrastructure and environmental controls available (such as electrical and HVAC), but no equipment or telecommunications established or in place. There is sufficient room to house needed equipment to sustain a system’s critical functions. Examples of cold sites include unused areas of a data center and unused office space (if specialized data center environments are not required). Cold sites are normally the least expensive alternate processing site solution, as the primary costs are only the lease or maintenance of the required square footage for recovery purposes. However, the recovery time is the longest, as all system equipment (including telecommunications) will need to be acquired or purchased, installed, tested, and have backup software and data loaded and tested before the system can be operational. Depending on the size and complexity of a system, recovery could take several days to weeks to complete. Warm Sites. Warm sites are locations that have the basic infrastructure of cold sites, but also have sufficient computer and telecommunications equipment installed and available to operate the system at the site. However, the equipment is not loaded with the software or data required to operate the system. Warm sites should have backup media readers that are compatible with the system’s backup strategy. Warm sites may not have equipment to run all systems or all components of a system, but rather only enough to operate critical mission/business processes. An example of a warm site is a test or development site that is geographically separate from the production system. Equipment may be in place to operate the system, but would require reverting to the current production level of the software, loading the data from backup media, and establishing communications to users."
    status: "candidate"
  - id: "REQ-SP800-34R1-0314"
    citation: {"ref": "SP800-34R1", "page": 62, "anchor": "HA can be an expensive option for systems, with duplicate hardware and"}
    kind: "modal"
    locator: "5.1.6"
    context: "Use of High Availability (HA) Processes"
    statement: "HA can be an expensive option for systems, with duplicate hardware and special failover software to eliminate any single point of failure. Normally, there are higher cost maintenance and support requirements associated with HA systems. Therefore, HA is not a viable option for many systems and should be considered only for those systems that cannot tolerate downtime. Examples of this may be air traffic systems and financial systems. Also, HA systems cannot be a replacement for a solid backup strategy, as a corruption of data on a system may propagate through an HA system, making the system unusable. Without a backup of the system separate from the system itself, recovery may not be possible."
    status: "candidate"
  - id: "REQ-SP800-34R1-0315"
    citation: {"ref": "SP800-34R1", "page": 62, "anchor": "HA can be implemented at a single site, with all system redundancy"}
    kind: "modal"
    locator: "5.1.6"
    context: "Use of High Availability (HA) Processes"
    statement: "HA can be implemented at a single site, with all system redundancy resident at that site. This will keep the system running at an HA level as long as there is no interruption of the facility housing the system. However, when implementing HA products or services in a system, the ISCP Coordinator should have HA processes extended to an alternate location. Mechanisms such as block mirroring to an alternate site should be considered to provide redundancy and backup of system data outside of the system facility. Whenever a write is made to a block on a primary storage device, the same write is made to an alternate storage device, either within the same storage system, or between separate storage systems, at different locations."
    status: "candidate"
  - id: "REQ-SP800-34R1-0316"
    citation: {"ref": "SP800-34R1", "page": 62, "anchor": "Client/server systems can have processing and data at both the server and"}
    kind: "should"
    locator: "5.2"
    context: "Client/Server Systems"
    statement: "Client/server systems can have processing and data at both the server and client workstation levels. Client workstations are normally desktop computers, although portable devices may be connected to servers as clients. Portable devices include laptops, notebook computers, and handheld devices (e.g., smart phones and specialized equipment such as inventory collection bar code readers)."
    status: "candidate"
  - id: "REQ-SP800-34R1-0317"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "Contingency considerations for client/server systems should emphasize data availability, confidentiality, and integrity"}
    kind: "should"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Contingency considerations for client/server systems should emphasize data availability, confidentiality, and integrity at both the server system level and the client level. To address these requirements, regular and frequent backups of data should be stored offsite. Specifically, the system manager should consider each of the following practices for client/server systems:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0318"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "Store backups offsite or at an alternate site. As mentioned in Section"}
    kind: "should"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations Specifically, the system manager should consider each of the following practices for client/server systems:"
    statement: "Store backups offsite or at an alternate site. As mentioned in Section 3.4.2, backup media should be stored offsite or at an alternate site in a secure, environmentally controlled facility."
    status: "candidate"
  - id: "REQ-SP800-34R1-0319"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "STORE BACKUPS OFFSITE/ALTERNATE SITE. STANDARDIZE HARDWARE, SOFTWARE,"}
    kind: "indicative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations CLIENT/SERVER AND PORTABLE SYSTEM CONTINGENCY STRATEGIES:"
    statement: "STORE BACKUPS OFFSITE/ALTERNATE SITE. STANDARDIZE HARDWARE, SOFTWARE,"
    status: "candidate"
  - id: "REQ-SP800-34R1-0320"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "Standardize hardware, software, and peripherals. System recovery is faster if hardware, software,"}
    kind: "modal"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Standardize hardware, software, and peripherals. System recovery is faster if hardware, software, and peripherals are standardized throughout the organization. Additionally, critical hardware components that need to be recovered immediately in the event of a disaster should be compatible with off-the-shelf computer components. This compatibility will avoid delays in ordering custom-built equipment from a vendor."
    status: "candidate"
  - id: "REQ-SP800-34R1-0321"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "Document system configurations and vendor information. Well-documented system configurations ease recovery. Similarly,"}
    kind: "imperative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Document system configurations and vendor information. Well-documented system configurations ease recovery. Similarly, vendor names and emergency contact information for vendors that supply essential hardware, software, and other components should be listed in the contingency plan so that replacement components may be purchased quickly."
    status: "candidate"
  - id: "REQ-SP800-34R1-0322"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "Coordinate with security policies and system security controls. Client/server contingency solutions should"}
    kind: "imperative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Coordinate with security policies and system security controls. Client/server contingency solutions should be coordinated with security policies and system security controls. In choosing the appropriate technical contingency solution, similar security controls and security-related activities (e.g., risk assessment, vulnerability scanning) applied in the production system should be implemented in the contingency solution to ensure that executing the system contingency solution does not compromise or disclose sensitive data during a system disruption or emergency."
    status: "candidate"
  - id: "REQ-SP800-34R1-0323"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "Use results from the BIA. Impacts and priorities of associated information systems"}
    kind: "imperative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Use results from the BIA. Impacts and priorities of associated information systems discovered through the BIA should be reviewed to determine related requirements."
    status: "candidate"
  - id: "REQ-SP800-34R1-0324"
    citation: {"ref": "SP800-34R1", "page": 63, "anchor": "Minimize the amount of data stored on a client computer. Critical user"}
    kind: "should"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations Additional considerations for client computers include:"
    statement: "Minimize the amount of data stored on a client computer. Critical user data should be stored on central servers that are backed up as part of an organization’s enterprise backup strategy, rather than on the client computer hard drive."
    status: "candidate"
  - id: "REQ-SP800-34R1-0325"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Automate backup of data. Client/server systems should have software installed that automatically"}
    kind: "should"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Automate backup of data. Client/server systems should have software installed that automatically schedules data backups to a central data backup location. Data for backup should be stored at a common directory name (such as \\My Documents) to ease in automated backup and to make sure that only pertinent data is backed up. If the client system backup process is not automated from the network, users should be encouraged to back up data on a regular basis. Automated backup schedulers should be set up for stand-alone desktops and portable devices whenever possible."
    status: "candidate"
  - id: "REQ-SP800-34R1-0326"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Provide guidance on saving data on client computers. Instructing users to save"}
    kind: "modal"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Provide guidance on saving data on client computers. Instructing users to save data to a particular folder on the computer eases the IT department’s client support requirements. If a machine must be rebuilt, the technician will know which folders to copy and preserve during recovery."
    status: "candidate"
  - id: "REQ-SP800-34R1-0327"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Store backup information at an alternate site. If users back up data"}
    kind: "modal"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Store backup information at an alternate site. If users back up data on a stand-alone system rather than saving data to the network, a means should be provided for storing the media at an alternate site. Software licenses and original system software, vendor SLAs and contracts, and other important documents relevant to the stand-alone should be stored with the backup media. The storage facility should be located far enough away from the original site to reduce the likelihood that both sites would be affected by the same contingency event. Contingency considerations for servers in a client/server system rely extensively on LAN and WAN connectivity to communicate with their clients. Because of this, server components must consider system contingency measures similar to those for LANs and WANs."
    status: "candidate"
  - id: "REQ-SP800-34R1-0328"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Standardize hardware, software, and peripherals. System recovery may be expedited if hardware,"}
    kind: "should"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Standardize hardware, software, and peripherals. System recovery may be expedited if hardware, software, and peripherals are standardized throughout the client/server system. Recovery costs may be reduced because standard configurations may be designated and resources may be shared. Standardized components also reduce system maintenance across the organization."
    status: "candidate"
  - id: "REQ-SP800-34R1-0329"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Document systems configurations and vendors. Document the server architecture and the configurations"}
    kind: "imperative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Document systems configurations and vendors. Document the server architecture and the configurations of its various components. In addition, the contingency plan should identify vendors and model specifications to facilitate rapid equipment replacement after a disruption."
    status: "candidate"
  - id: "REQ-SP800-34R1-0330"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Coordinate with security policies and security controls. Server contingency solution(s) should be"}
    kind: "imperative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Coordinate with security policies and security controls. Server contingency solution(s) should be coordinated with network security policies where similar security controls and security-related activities (e.g., risk assessment, vulnerability scanning) in the production environment should be implemented in the contingency solution(s) to ensure that, during a system disruption, executing the technical contingency solution(s) does not compromise or disclose sensitive data. Security of data within a client/server system is key as most systems are multi-tenancy, having multiple users and applications residing on the same system, with different security requirements and controls."
    status: "candidate"
  - id: "REQ-SP800-34R1-0331"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Coordinate contingency solutions with cyber incident response procedures. Because many application servers"}
    kind: "imperative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Coordinate contingency solutions with cyber incident response procedures. Because many application servers use Web services to provide an image of the organization to the public, the organization’s public image could be damaged if the application server were defaced or taken down by a cyber attack. To reduce the consequences of such an attack, contingency solutions should be coordinated closely with cyber incident response procedures designed to limit the impacts of a cyber attack."
    status: "candidate"
  - id: "REQ-SP800-34R1-0332"
    citation: {"ref": "SP800-34R1", "page": 64, "anchor": "Use results from the BIA. Impacts and priorities discovered through the BIA of associated LANs and/or"}
    kind: "imperative"
    locator: "5.2.1"
    context: "Client/Server Systems Contingency Considerations"
    statement: "Use results from the BIA. Impacts and priorities discovered through the BIA of associated LANs and/or WANs should be reviewed to determine recovery requirements and priorities."
    status: "candidate"
  - id: "REQ-SP800-34R1-0333"
    citation: {"ref": "SP800-34R1", "page": 65, "anchor": "Encryption is a popular security tool used on client devices. With increased"}
    kind: "should"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "Encryption is a popular security tool used on client devices. With increased use of digital signatures for non-repudiation and the use of encryption for confidentiality and/or integrity, organizations should consider including encryption in their backup strategy. Encryption should also be considered for backup media that goes offsite for storage, to secure data should it be lost or stolen en route or at the alternate site."
    status: "candidate"
  - id: "REQ-SP800-34R1-0334"
    citation: {"ref": "SP800-34R1", "page": 65, "anchor": "If encrypted data is sent offsite for storage, there should be a"}
    kind: "modal"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "If encrypted data is sent offsite for storage, there should be a cryptographic key management system in place to make sure the data is readable if it needs to be recovered onto a new or replaced system. The cryptographic key and the encryption software both need to be on the new system, along with the keying material. Keying material is the data, such as the keys and initialization points for encryption, used to establish and maintain the encryption parameters. The keying material can be stored at a central location (such as an enterprise key management and encryption system) or on removable media separate from the backup media itself.39"
    status: "candidate"
  - id: "REQ-SP800-34R1-0335"
    citation: {"ref": "SP800-34R1", "page": 65, "anchor": "Digital video disc (DVD). DVD-read only memory (DVD-ROM) drives come standard in"}
    kind: "modal"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "Digital video disc (DVD). DVD-read only memory (DVD-ROM) drives come standard in most desktop computers; however, not all computers are equipped with writable DVD-ROM drives. DVDs are low-cost storage media and have a higher storage capacity of around 4.7 gigabytes (GB). To read from a DVD-ROM, the operating system’s file manager is sufficient; to write to a DVD-ROM, a rewritable DVD (DVD-RW) drive and the appropriate software are required."
    status: "candidate"
  - id: "REQ-SP800-34R1-0336"
    citation: {"ref": "SP800-34R1", "page": 65, "anchor": "Network Storage. Data stored on networked client/server systems can be backed up"}
    kind: "indicative"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "Network Storage. Data stored on networked client/server systems can be backed up to a networked disk. The amount of data that can be backed up from a client/server system is limited by the network disk storage capacity or disk allocation to the particular user. If users are instructed to save files to a networked disk, the networked disk itself should be backed up through the network or server backup program. Common types of network storage architecture include network attached storage (NAS) and storage area network (SAN). These storage systems incorporate resiliency and redundancy within their design and can be configured to maintain redundancy across several locations."
    status: "candidate"
  - id: "REQ-SP800-34R1-0337"
    citation: {"ref": "SP800-34R1", "page": 65, "anchor": "External Hard Drives. Data replication or synchronization to an external hard drive"}
    kind: "should"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "External Hard Drives. Data replication or synchronization to an external hard drive is a common backup method for portable computers and stand-alone devices. Handheld devices or laptops may be connected to an external hard drive and replicate the desired data from the portable device to the external hard drive. Many external hard drives have backup software included for use in backing up primary drives."
    status: "candidate"
  - id: "REQ-SP800-34R1-0338"
    citation: {"ref": "SP800-34R1", "page": 65, "anchor": "Internet Backup. Internet Backup, or Online Backup, is a commercial service that"}
    kind: "modal"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "Internet Backup. Internet Backup, or Online Backup, is a commercial service that allows desktop and portable device users to back up data to a remote location over the Internet for a fee. A utility is installed onto the desktop or portable device that allows the user to schedule backups, select files and folders to be backed up, and establish an archiving scheme to prevent files from being overwritten. Data can be encrypted for transmission; however, this will impede the data transfer. The advantage of Internet Backup is that the user is not required to purchase data backup hardware or media and that the data is readily available to be downloaded for recovery in a contingency situation. Servers normally have much larger amounts of data that need to be maintained and secured. It is recommended in environments with multiple servers, that storage not be dedicated to each server but rather centralized for use by multiple servers. SAN and NAS are common multi-server storage systems. Centralizing the data of multiple servers allows for a common backup of data for offsite storage. Given the large amount of data that must be backed up, it is recommended that a separate and dedicated network be used just for the data transfers required for backing up data. This will enable the primary network to be dedicated to production traffic, and not impact the backup process."
    status: "candidate"
  - id: "REQ-SP800-34R1-0339"
    citation: {"ref": "SP800-34R1", "page": 66, "anchor": "Contingency solutions may be built into the client/server system during design and"}
    kind: "should"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "Contingency solutions may be built into the client/server system during design and implementation. A client/server system, for example, may be constructed so that all data resides in one location (such as the organization’s headquarters) and is replicated to the local sites. Changes at local sites could be replicated back to headquarters. If data is replicated to the local sites as read-only, the data in the client/server system is backed up at each local site. This means that if the headquarters server were to fail, data could still be accessed at the local sites over the WAN. Conversely, if data were uploaded hourly from local sites to the headquarters’ site, then the headquarters’ server would act as a backup for the local servers."
    status: "candidate"
  - id: "REQ-SP800-34R1-0340"
    citation: {"ref": "SP800-34R1", "page": 66, "anchor": "As the example above illustrates, the client/server system typically provides some inherent"}
    kind: "modal"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "As the example above illustrates, the client/server system typically provides some inherent level of redundancy that can be incorporated in the contingency strategy. For example, consider a critical system that is distributed between an organization’s headquarters and a small office. Assuming data is replicated at both sites, a cost-effective recovery strategy may be to establish a reciprocal agreement between the two sites. Under this agreement, in the event of a disruption at one office, essential personnel would relocate to the other office to continue to process system functions. This strategy could save significant contingency costs by avoiding the need to procure and equip alternate sites."
    status: "candidate"
  - id: "REQ-SP800-34R1-0341"
    citation: {"ref": "SP800-34R1", "page": 66, "anchor": "If considering the use of remote sites for system backups, or the"}
    kind: "should"
    locator: "5.2.2"
    context: "Client/Server Systems Contingency Solutions"
    statement: "If considering the use of remote sites for system backups, or the use of Internet or other means of backup, the ISCP Coordinator should ensure that the remotely hosted storage services can provide the same level of protection of data as the original site. This can be done through SLAs and periodic reviews and assessments of the remote storage facility and processes."
    status: "candidate"
  - id: "REQ-SP800-34R1-0342"
    citation: {"ref": "SP800-34R1", "page": 66, "anchor": "T-1. T-1 is a dedicated phone connection supporting data rates of 1.544"}
    kind: "modal"
    locator: "5.3"
    context: "Telecommunications Systems Types of WAN communications links include the following methods:"
    statement: "T-1. T-1 is a dedicated phone connection supporting data rates of 1.544 Megabits per second (Mbps). A T-1 line consists of 24 individual 64-kbps channels, and each channel can be configured to carry voice or data signals. Fractional T-1 communications links also can be provided when multiples of 64-kbps lines are required."
    status: "candidate"
  - id: "REQ-SP800-34R1-0343"
    citation: {"ref": "SP800-34R1", "page": 67, "anchor": "When developing the telecommunications recovery strategy, the ISCP Coordinator should apply considerations"}
    kind: "should"
    locator: "5.3.1"
    context: "Telecommunications Contingency Considerations"
    statement: "When developing the telecommunications recovery strategy, the ISCP Coordinator should apply considerations that were provided in Section 5.2.1 regarding client/server systems. In addition, the following practices should be considered:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0344"
    citation: {"ref": "SP800-34R1", "page": 67, "anchor": "Telecommunications documentation. Physical and logical telecommunications diagrams should be up to date."}
    kind: "should"
    locator: "5.3.1"
    context: "Telecommunications Contingency Considerations In addition, the following practices should be considered:"
    statement: "Telecommunications documentation. Physical and logical telecommunications diagrams should be up to date. The physical diagram should display the physical layout of the facility that houses the LAN and/or WAN, and cable jack numbers should be documented on the physical diagram. Diagrams should also identify network-connecting devices, IP addresses, Domain Name System (DNS) names, and types of communications links and vendors. The logical diagram should present the telecommunications infrastructure and its nodes. Network discovery software can provide an accurate picture of the telecommunications environment. Both diagrams help recovery personnel to identify where problems have occurred and to restore telecommunications services more quickly."
    status: "candidate"
  - id: "REQ-SP800-34R1-0345"
    citation: {"ref": "SP800-34R1", "page": 67, "anchor": "System configuration and vendor information documentation. Document configurations of network connective devices"}
    kind: "imperative"
    locator: "5.3.1"
    context: "DOCUMENT TELECOMMUNICATIONS"
    statement: "System configuration and vendor information documentation. Document configurations of network connective devices that facilitate telecommunication (e.g., circuits, switches, bridges, and hubs) to ease recovery. Vendors and their contact information should be documented in the contingency plan to provide for prompt hardware and software repair or replacement. The plan also should document the communications providers, including POC and contractual or SLA information."
    status: "candidate"
  - id: "REQ-SP800-34R1-0346"
    citation: {"ref": "SP800-34R1", "page": 67, "anchor": "Coordinate with security policies and security controls. Telecommunications contingency solution(s) should be"}
    kind: "imperative"
    locator: "5.3.1"
    context: "AND WIRELESS LOCAL AREA NETWORK TECHNOLOGY."
    statement: "Coordinate with security policies and security controls. Telecommunications contingency solution(s) should be coordinated with network security policies to protect against threats that could disrupt the network. Therefore, in choosing the appropriate technical telecommunications contingency solution(s), similar security controls and security-related activities (e.g., risk assessment, vulnerability scanning) in the production systems should be implemented in the contingency solution(s) to ensure that, during a network disruption, executing the technical contingency solution(s) does not compromise or disclose sensitive data."
    status: "candidate"
  - id: "REQ-SP800-34R1-0347"
    citation: {"ref": "SP800-34R1", "page": 68, "anchor": "Use results from the BIA. Impacts and priorities discovered through the BIA of associated systems should"}
    kind: "imperative"
    locator: "5.3.1"
    context: "AND WIRELESS LOCAL AREA NETWORK TECHNOLOGY."
    statement: "Use results from the BIA. Impacts and priorities discovered through the BIA of associated systems should be reviewed to determine telecommunications recovery priorities. The BIA should identify the high-availability FIPS 199 impact levels for any data networks and email that support COOP Mission, Primary, or National Essential Functions."
    status: "candidate"
  - id: "REQ-SP800-34R1-0348"
    citation: {"ref": "SP800-34R1", "page": 68, "anchor": "While similar contingencies exist for both LAN and WAN telecommunications systems, there"}
    kind: "should"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "While similar contingencies exist for both LAN and WAN telecommunications systems, there are different strategies and solutions the ISCP Coordinator should consider when determining an overall telecommunications recovery strategy. Differences in solutions primarily exist due to geographic and connectivity ownership. While LANs are typically in small areas (offices or campuses) and the routing and wiring is owned or managed by the organization, WANs typically rely on network service providers (NSPs) for both routing and wiring."
    status: "candidate"
  - id: "REQ-SP800-34R1-0349"
    citation: {"ref": "SP800-34R1", "page": 68, "anchor": "When developing an ISCP for a LAN, the ISCP Coordinator should identify"}
    kind: "should"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "When developing an ISCP for a LAN, the ISCP Coordinator should identify single points of failure that affect critical systems or processes outlined in the BIA. This analysis could include threats to the cabling system, such as cable cuts, electromagnetic and radio frequency interference, and damage resulting from fire, water, and other hazards. As a solution, redundant cables may be installed when appropriate. For example, it might not be cost-effective to install duplicate cables to desktops. However, it might be cost-effective to install a gigabit cable between floors so that hosts on both floors could be reconnected if the primary cable were cut."
    status: "candidate"
  - id: "REQ-SP800-34R1-0350"
    citation: {"ref": "SP800-34R1", "page": 68, "anchor": "Contingency planning also should consider network-connecting devices, such as hubs, switches, routers,"}
    kind: "should"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "Contingency planning also should consider network-connecting devices, such as hubs, switches, routers, and bridges. The BIA should characterize the roles that each device serves in the network, and a contingency solution should be developed for each device based on its BIA criticality. As an example of a contingency strategy for network-connecting devices, redundant intelligent network routers may be installed in a network, enabling a router to assume the full traffic workload if the other router failed."
    status: "candidate"
  - id: "REQ-SP800-34R1-0351"
    citation: {"ref": "SP800-34R1", "page": 68, "anchor": "Remote access is a service provided by servers and devices on the"}
    kind: "modal"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "Remote access is a service provided by servers and devices on the LAN. Remote access provides a convenience for users working offsite or allows for a means for servers and devices to communicate between sites. Remote access can be conducted through various methods, primarily through a virtual private network (VPN). If an emergency or serious system disruption occurs, remote access may serve as an important contingency capability by providing access to organization-wide data for recovery teams or users from another location. If remote access is established as a contingency strategy, data bandwidth requirements should be identified and used to scale the remote access solution. Additionally, security controls such as multifactor authentication and data encryption should be implemented if the communications contain FIPS 199 moderate- or high-impact information. Remote access will work only if the remote access server and the network are both functioning at either the primary or the alternate location."
    status: "candidate"
  - id: "REQ-SP800-34R1-0352"
    citation: {"ref": "SP800-34R1", "page": 68, "anchor": "Wireless (or WiFi) local area networks can serve as an effective contingency"}
    kind: "modal"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "Wireless (or WiFi) local area networks can serve as an effective contingency solution to restore network services following a wired LAN disruption. Wireless networks do not require the cabling infrastructure of conventional LANs; therefore, they may be installed quickly as an interim or permanent solution. However, wireless networks broadcast data over a radio signal, enabling the data to be intercepted. When implementing a wireless network, security controls, such as data encryption, should be employed if the communications traffic contains FIPS 199 moderate- or high-impact information. Wireless LANs allow for quick temporary access of portable devices, which typically have wireless antennae built into them."
    status: "candidate"
  - id: "REQ-SP800-34R1-0353"
    citation: {"ref": "SP800-34R1", "page": 69, "anchor": "For organizations considering remote connectivity, several security requirements and guidelines must be"}
    kind: "modal"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "For organizations considering remote connectivity, several security requirements and guidelines must be implemented. This includes verification of a user’s identity through electronic authentication, or e-authentication. E-authentication guidelines provide four basic levels of protection, from minimal identity verification (Level 1) to cryptographic two-factor authentication keys (Level 4). NIST SP 800-63, Electronic Authentication Guideline,42 provides more information on the four levels and implementing e-authentication into a system.43"
    status: "candidate"
  - id: "REQ-SP800-34R1-0354"
    citation: {"ref": "SP800-34R1", "page": 69, "anchor": "WAN contingency solutions include all of the measures discussed for client/server systems"}
    kind: "modal"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "WAN contingency solutions include all of the measures discussed for client/server systems and LANs. In addition, WAN contingency planning must consider the communications links that connect the disparate systems. WAN contingency strategies are influenced by the type of data routed on the network. A WAN that hosts a mission-critical system (see Section 5.4) may require a more robust recovery strategy than a WAN that connects multiple LANs for simple resource-sharing purposes. Organizations should consider the following contingency solutions for ensuring WAN availability:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0355"
    citation: {"ref": "SP800-34R1", "page": 69, "anchor": "Redundant communications links. Redundant communications links usually are necessary when the network"}
    kind: "indicative"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions Organizations should consider the following contingency solutions for ensuring WAN availability:"
    statement: "Redundant communications links. Redundant communications links usually are necessary when the network processes critical data. The redundant links could be the same type, such as two T-1 connections, or the backup link could provide reduced bandwidth to accommodate only critical transmissions in a contingency situation. For example, an Integrated Services Digital Network (ISDN) line with a bandwidth of 128Kbps could be used as a contingency communications link for a primary T-1 connection. If redundant links are used, the ISCP Coordinator should ensure that the links have physical separation and do not follow the same path; otherwise, a single incident, such as a cable cut, could disrupt both links."
    status: "candidate"
  - id: "REQ-SP800-34R1-0356"
    citation: {"ref": "SP800-34R1", "page": 69, "anchor": "Redundant network service providers. If near 100 percent connectivity is required, redundant"}
    kind: "modal"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "Redundant network service providers. If near 100 percent connectivity is required, redundant communications links can be provided through multiple NSPs. If this solution is chosen, the ISCP Coordinator should ensure that the NSPs do not share common facilities at any point, including building entries or demarcations (places where the WAN connection ends within a facility)."
    status: "candidate"
  - id: "REQ-SP800-34R1-0357"
    citation: {"ref": "SP800-34R1", "page": 69, "anchor": "Redundancy from NSP or Internet Service Provider (ISP). The ISCP Coordinator should"}
    kind: "should"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "Redundancy from NSP or Internet Service Provider (ISP). The ISCP Coordinator should consult with the selected NSP or ISP to assess the robustness and reliability within their core networks (e.g., redundant network-connecting devices and power protection). To reduce the effects of a telecommunications disruption through prompt detection, monitoring software can be installed. The monitoring software issues an alert if a node or connection begins to fail or is not responding. The monitoring software can facilitate troubleshooting and often provides the administrator with a warning before users and other nodes notice problems. Many types of monitoring software may be configured to send an electronic page or email to a designated individual(s) automatically when a system parameter falls out of its specification range."
    status: "candidate"
  - id: "REQ-SP800-34R1-0358"
    citation: {"ref": "SP800-34R1", "page": 69, "anchor": "NIST SP 800-53 control IA-2 (Identification and Authentication [Organizational Users]) also provides"}
    kind: "modal"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "NIST SP 800-53 control IA-2 (Identification and Authentication [Organizational Users]) also provides guidance and reference to remote access of systems. Depending on the impact level of the system, certain control enhancements in IA-2 must be incorporated as part of remote and WiFi user identification and authentication."
    status: "candidate"
  - id: "REQ-SP800-34R1-0359"
    citation: {"ref": "SP800-34R1", "page": 70, "anchor": "SLAs can facilitate prompt recovery following software or hardware problems associated with"}
    kind: "should"
    locator: "5.3.2"
    context: "Telecommunications Contingency Solutions"
    statement: "SLAs can facilitate prompt recovery following software or hardware problems associated with the telecommunications. An SLA also may be developed with the NSP or ISP to guarantee the desired network availability and establish tariffs if the vendor’s network is unavailable. If the NSP or ISP is contracted to provide network-connecting devices, such as routers, the availability of these devices should be included in the SLA."
    status: "candidate"
  - id: "REQ-SP800-34R1-0360"
    citation: {"ref": "SP800-34R1", "page": 70, "anchor": "Although processing on a mainframe computer is more powerful and centralized than"}
    kind: "should"
    locator: "5.4.1"
    context: "Mainframe Contingency Considerations"
    statement: "Although processing on a mainframe computer is more powerful and centralized than on other types of platforms, it shares many of the same contingency requirements. Because a mainframe uses a centralized architecture, the mainframe does not have the inherent redundancy that a distributed system or network provides. As a result, mainframe availability and data backups are critical. The following measures should be considered when determining mainframe contingency requirements:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0361"
    citation: {"ref": "SP800-34R1", "page": 70, "anchor": "Store backup media offsite. Backup media should be labeled, logged, and stored"}
    kind: "should"
    locator: "5.4.1"
    context: "Mainframe Contingency Considerations The following measures should be considered when determining mainframe contingency requirements:"
    statement: "Store backup media offsite. Backup media should be labeled, logged, and stored offsite in a secure, environmentally controlled facility. The storage facility should be located far enough away from the original site to reduce the likelihood that both sites would be affected by the same event. Additionally, depending on the FIPS 199 impact level, data encryption may be required for protecting system backup information while in transit and at rest to minimize the risk if backup media is lost or stolen."
    status: "candidate"
  - id: "REQ-SP800-34R1-0362"
    citation: {"ref": "SP800-34R1", "page": 70, "anchor": "Document system configurations and vendors. Maintaining detailed records of system configurations enhances"}
    kind: "imperative"
    locator: "5.4.1"
    context: "Mainframe Contingency Considerations"
    statement: "Document system configurations and vendors. Maintaining detailed records of system configurations enhances system recovery capabilities. In addition, vendors that supply essential hardware, software, and other components should be identified in the contingency plan."
    status: "candidate"
  - id: "REQ-SP800-34R1-0363"
    citation: {"ref": "SP800-34R1", "page": 70, "anchor": "Coordinate with network security policy and system security controls. Mainframe contingency solutions"}
    kind: "imperative"
    locator: "5.4.1"
    context: "Mainframe Contingency Considerations"
    statement: "Coordinate with network security policy and system security controls. Mainframe contingency solutions should include duplicating interfaces and telecommunications infrastructure as well as coordinating with network security policies, such as stringent access controls."
    status: "candidate"
  - id: "REQ-SP800-34R1-0364"
    citation: {"ref": "SP800-34R1", "page": 70, "anchor": "Utilize results from the BIA. Impacts and priorities identified through the BIA"}
    kind: "should"
    locator: "5.4.1"
    context: "Mainframe Contingency Considerations"
    statement: "Utilize results from the BIA. Impacts and priorities identified through the BIA of associated systems supporting organizational critical mission/business processes should be reviewed to determine recovery requirements and priorities."
    status: "candidate"
  - id: "REQ-SP800-34R1-0365"
    citation: {"ref": "SP800-34R1", "page": 70, "anchor": "Mainframes require different contingency strategies from distributed systems because data is stored"}
    kind: "modal"
    locator: "5.4.2"
    context: "Mainframe Contingency Solutions"
    statement: "Mainframes require different contingency strategies from distributed systems because data is stored in a single location. Contingency strategies should emphasize the mainframe’s data storage capabilities and underlying architecture. Redundant system components are critical to ensure that a failure of a system component, such as a power supply, does not cause a system failure. UPS and power monitoring and management systems also should be used to ensure that power fluctuation will not affect the mainframe. Because mainframes typically process large critical applications, a long-term backup power solution may be needed. A gas or diesel generator can ensure that mainframe processing is not interrupted by a power outage."
    status: "candidate"
  - id: "REQ-SP800-34R1-0366"
    citation: {"ref": "SP800-34R1", "page": 71, "anchor": "Because each mainframe architecture is unique and centralized, a contingency strategy is"}
    kind: "modal"
    locator: "5.4.2"
    context: "Mainframe Contingency Solutions"
    statement: "Because each mainframe architecture is unique and centralized, a contingency strategy is to have a replacement system available at an alternate warm or hot site. Since backup mainframe platforms are very costly to purchase and maintain, many agencies share commercial systems.44 Agencies also typically maintain vendor-support contracts to repair damaged units. However, vendor support alone may not restore system functions within the allowable outage time. In all cases, vendor SLAs should be kept up to date and reviewed to ensure that the vendor provides adequate support to meet system availability requirements."
    status: "candidate"
  - id: "REQ-SP800-34R1-0367"
    citation: {"ref": "SP800-34R1", "page": 71, "anchor": "Mainframes should be backed up regularly, and backup media should be stored"}
    kind: "should"
    locator: "5.4.2"
    context: "Mainframe Contingency Solutions"
    statement: "Mainframes should be backed up regularly, and backup media should be stored offsite. Backup and retention schedules should be based on the criticality of the data being processed and the frequency that the data is modified. (See Section 5.2.2 for backup solutions.) As with servers, remote journaling or electronic vaulting to the alternate site could be an effective technical contingency solution. In addition, disk replication, virtualization, or NAS or SAN technologies that replicate various platforms to one replicating server could be used in some cases."
    status: "candidate"
  - id: "REQ-SP800-34R1-0368"
    citation: {"ref": "SP800-34R1", "page": 71, "anchor": "Contingency considerations discuss technical requirements or factors to complement the contingency solution."}
    kind: "indicative"
    locator: "5.5"
    context: "System Contingency Planning Considerations Summary For information system contingency planning, the ISCP Coordinator should consider technical measures from two perspectives when planning a system rec"
    statement: "Contingency considerations discuss technical requirements or factors to complement the contingency solution."
    status: "candidate"
