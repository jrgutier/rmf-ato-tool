    kind: "lettered"
    locator: "A.1 Sample Template for Low-Impact Systems.1"
    context: "TABLE OF CONTENTS"
    statement: "1. Introduction Information systems are vital to {Organization’s} mission/business processes; therefore, it is critical that services provided by {system name} are able to operate effectively without excessive interruption. This Information System Contingency Plan (ISCP) establishes comprehensive procedures to recover {system name} quickly and effectively following a service disruption. 1.1 Background"
