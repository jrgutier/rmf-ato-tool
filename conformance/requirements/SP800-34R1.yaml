  - {"page": 49, "locator": "4.1", "reason": "no-marker", "text": "The supporting information component includes an introduction and concept of operations section providing essential background or contextual information that makes the contingency plan easier to understand, implement, and maintain. These details aid in understanding the applicability of the guidance, in making decisions on how to use the plan, and in providing information on where associated plans and information outside the scope of the plan may be found."}
  - {"page": 49, "locator": "4.1", "reason": "no-marker", "text": "The introduction section orients the reader to the type and location of information contained in the plan. Generally, the section includes the background, scope, and assumptions.29 These subsections are described below."}
  - {"page": 49, "locator": "4.1", "reason": "no-marker", "text": "Overview of three phases. The ISCP recovery is implemented in three phases: (1) Activation and Notification, (2) Recovery, and (3) Reconstitution."}
  - {"page": 49, "locator": "4.1", "reason": "no-marker", "text": "This plan format is meant to guide the contingency plan developer. Individuals may choose to add, delete, or modify this format as required, to best fit the system and organization’s contingency planning requirements."}
  - {"page": 49, "locator": "4.1", "reason": "no-marker", "text": "NIST SP 800-18, Rev. 1, Guide for Developing Security Plans for Federal Information Systems, can be referenced for further details concerning information system documentation."}
