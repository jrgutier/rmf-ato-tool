  - id: "REQ-SP800-34R1-0221"
    citation: {"ref": "SP800-34R1", "page": 45, "anchor": "To be effective, the plan must be maintained in a ready state"}
    kind: "modal"
    locator: "3.6"
    context: "Plan Maintenance"
    statement: "To be effective, the plan must be maintained in a ready state that accurately reflects system requirements, procedures, organizational structure, and policies. During the Operation/Maintenance phase of the SDLC, information systems undergo frequent changes because of shifting business needs, technology upgrades, or new internal or external policies. Therefore, it is essential that the ISCP be reviewed and updated regularly as part of the organization’s change management process to ensure that new information is documented and contingency measures are revised if required. As identified as part of RMF Step 6 (Continuous Monitoring), a continuous monitoring process can provide organizations with an effective tool for plan maintenance, producing ongoing updates to security plans, security assessment reports, and plans of action and milestone documents."
    status: "candidate"
  - id: "REQ-SP800-34R1-0222"
    citation: {"ref": "SP800-34R1", "page": 45, "anchor": "As a general rule, the plan should be reviewed for accuracy and"}
    kind: "modal"
    locator: "3.6"
    context: "Plan Maintenance"
    statement: "As a general rule, the plan should be reviewed for accuracy and completeness at an organization-defined frequency or whenever significant changes occur to any element of the plan. Certain elements, such as contact lists, will require more frequent reviews. The plans for moderate- or high-impact systems should be reviewed more often. At a minimum, plan reviews should focus on the following elements:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0223"
    citation: {"ref": "SP800-34R1", "page": 46, "anchor": "Vital records (electronic and hardcopy). Because the ISCP contains potentially sensitive operational"}
    kind: "modal"
    locator: "3.6"
    context: "Plan Maintenance"
    statement: "Vital records (electronic and hardcopy). Because the ISCP contains potentially sensitive operational and personnel information, its distribution should be marked accordingly and controlled. Typically, copies of the plan are provided to recovery personnel for storage. A copy should also be stored at the alternate site and with the backup media. Storing a copy of the plan at the alternate site ensures its availability and good condition in the event local plan copies cannot be accessed because of disaster. The ISCP Coordinator should maintain a record of copies of the plan and to whom they were distributed. Other information that should be stored with the plan includes contracts with vendors (SLAs and other contracts), software licenses, system user manuals, security manuals, and operating procedures."
    status: "candidate"
  - id: "REQ-SP800-34R1-0224"
    citation: {"ref": "SP800-34R1", "page": 46, "anchor": "Changes made to the plan, strategies, and policies should be coordinated through"}
    kind: "should"
    locator: "3.6"
    context: "Plan Maintenance"
    statement: "Changes made to the plan, strategies, and policies should be coordinated through the ISCP Coordinator, who should communicate changes to the representatives of associated plans or programs, as necessary. The ISCP Coordinator should record plan modifications using a record of changes, which lists the page number, change comment, and date of change. The record of changes, depicted in Table , should be integrated into the plan as discussed in Section 4.1."
    status: "candidate"
  - id: "REQ-SP800-34R1-0225"
    citation: {"ref": "SP800-34R1", "page": 46, "anchor": "Page # | Change Comment | Date of Change | Signature"}
    kind: "table"
    locator: "3.6"
    context: "Table 3-7: Sample Record of Changes"
    statement: "Page # | Change Comment | Date of Change | Signature"
    status: "not-a-requirement"
    reason: "Header row of Table 3-7, a sample record of changes; a form. The duty is 0224."
  - id: "REQ-SP800-34R1-0226"
    citation: {"ref": "SP800-34R1", "page": 46, "anchor": "The ISCP Coordinator should coordinate frequently with associated internal and external organizations"}
    kind: "modal"
    locator: "3.6"
    context: "Table 3-7: Sample Record of Changes"
    statement: "The ISCP Coordinator should coordinate frequently with associated internal and external organizations and system POCs to ensure that impacts caused by changes within any organization will be reflected in the contingency plan. Strict version control must be maintained by requesting old plans or plan pages to be returned to the ISCP Coordinator in exchange for the new plan or plan pages. The ISCP Coordinator also should evaluate supporting information to ensure that the information is current and continues to meet system requirements adequately. This information includes the following:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0227"
    citation: {"ref": "SP800-34R1", "page": 46, "anchor": "Alternate site contract, including testing times;"}
    kind: "indicative"
    locator: "3.6"
    context: "Table 3-7: Sample Record of Changes This information includes the following:"
    statement: "Alternate site contract, including testing times;"
    status: "not-a-requirement"
    reason: "Noun item under 'This information includes the following:' at 0226."
  - id: "REQ-SP800-34R1-0228"
    citation: {"ref": "SP800-34R1", "page": 47, "anchor": "Other plans, e.g., COOP, BCP. Although some changes may be quite visible,"}
    kind: "modal"
    locator: "3.6"
    context: "Table 3-7: Sample Record of Changes"
    statement: "Other plans, e.g., COOP, BCP. Although some changes may be quite visible, others will require additional analysis. When a significant change occurs, the BIA should be updated with the new information to identify new contingency requirements or priorities. As new technologies become available, preventive controls may be enhanced and recovery strategies may be modified. Finally, plan maintenance should be continued as the information system passes through the Disposal phase of its life cycle to ensure that the plan accurately reflects recovery priorities and concurrent processing changes."
    status: "candidate"
  - id: "REQ-SP800-34R1-0229"
    citation: {"ref": "SP800-34R1", "page": 48, "anchor": "This chapter discusses the key elements that compose the ISCP. As described"}
    kind: "modal"
    locator: "Chapter 4. Information System Contingency Plan Development"
    context: ""
    statement: "This chapter discusses the key elements that compose the ISCP. As described in Chapter 3, ISCP development is a critical step in the process of implementing a comprehensive contingency planning program. The plan contains detailed roles, responsibilities, teams, and procedures associated with restoring an information system following a disruption. The ISCP should document technical capabilities designed to support contingency operations and should be tailored to the organization and its requirements. Plans need to balance detail with flexibility; usually, the more detailed the plan, the less scalable and versatile the approach. The information presented here is meant to be a guide; nevertheless, the plan format in this document may be modified as needed to better meet the user’s specific system, operational, and organization requirements. Appendix A provides templates that organizations may use to develop ISCPs for their information systems at the appropriate FIPS 199 impact level. The information and templates provided are guides and may be modified, customized, and/or adapted as necessary to best meet the specific system, operational, and organizational requirements for contingency planning. Appendix D discusses planning considerations regarding personnel which should be coordinated with the ISCP development."
    status: "candidate"
  - id: "REQ-SP800-34R1-0230"
    citation: {"ref": "SP800-34R1", "page": 48, "anchor": "As shown in Figure 4-1, this guide identifies five main components of"}
    kind: "should"
    locator: "Chapter 4. Information System Contingency Plan Development"
    context: ""
    statement: "As shown in Figure 4-1, this guide identifies five main components of the contingency plan. The supporting information and plan appendices provide essential information to ensure a comprehensive plan. The Activation and Notification, Recovery, and Reconstitution Phases address specific actions that the organization should take following a system disruption or emergency. Each plan component is discussed later in this section."
    status: "not-a-requirement"
    reason: "Introduces Figure 4-1 and the five components; 'specific actions that the organization should take' only describes what the phases hold, so should binds no one here. The actions are at 0240 onward."
