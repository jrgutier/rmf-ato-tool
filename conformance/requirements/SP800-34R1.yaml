    reason: "Same box: not all processes 'fall within the scope of COOP'; scope description."
  - id: "REQ-SP800-34R1-0064"
    citation: {"ref": "SP800-34R1", "page": 23, "anchor": "COOP planning applies to mission essential functions of federal government departments and"}
    kind: "indicative"
    locator: "2.2.2"
    context: "FUNCTIONS"
    statement: "COOP planning applies to mission essential functions of federal government departments and agencies."
    status: "not-a-requirement"
    reason: "Same box, under SCOPE: says where COOP planning applies; that is COOP's reach, no act of a run."
  - id: "REQ-SP800-34R1-0065"
    citation: {"ref": "SP800-34R1", "page": 23, "anchor": "ISCPs apply to all information systems in federal organizations."}
    kind: "indicative"
    locator: "2.2.2"
    context: "FUNCTIONS"
    statement: "ISCPs apply to all information systems in federal organizations."
    status: "candidate"
  - id: "REQ-SP800-34R1-0066"
    citation: {"ref": "SP800-34R1", "page": 23, "anchor": "Organizations should document standard procedures for internal and external communications in the"}
    kind: "modal"
    locator: "2.2.3"
    context: "Crisis Communications Plan"
    statement: "Organizations should document standard procedures for internal and external communications in the event of a disruption using a crisis communications plan. A crisis communications plan is often developed by the organization responsible for public outreach. The plan provides various formats for communications appropriate to the incident. The crisis communications plan typically designates specific individuals as the only authority for answering questions from or providing information to the public regarding emergency response. It may also include procedures for disseminating reports to personnel on the status of the incident and templates for public press releases. The crisis communication plan procedures should be communicated to the organization’s COOP and BCP planners to ensure that the plans include clear direction that only approved statements are released to the public by authorized officials. Appendix D provides further discussion of topics addressed by the crisis communications plan and informational resources."
    status: "not-applicable"
    reason: "Binds organizations and the office responsible for public outreach, whose crisis communications plan goes to COOP and BCP planners. No persona carries public affairs: PER-CIO and PER-PM were checked, and no artifact holds a crisis communications plan. The ISCP's coordination with other plans is 0050."
  - id: "REQ-SP800-34R1-0067"
    citation: {"ref": "SP800-34R1", "page": 23, "anchor": "Critical infrastructure and key resources (CIKR) are those components of the national"}
    kind: "modal"
    locator: "2.2.4"
    context: "Critical Infrastructure Protection (CIP) Plan"
    statement: "Critical infrastructure and key resources (CIKR) are those components of the national infrastructure that are deemed so vital that their loss would have a debilitating effect of the safety, security, economy, and/or health of the United States.10 A CIP plan is a set of policies and procedures that serve to protect and recover these national assets and mitigate risks and vulnerabilities. CIP plans define the roles and responsibilities for protection, develop partnerships and information sharing relationships, implement the risk management framework defined in the National Infrastructure Protection Plan (NIPP) and Homeland Security Presidential Directive (HSPD) - 7 for CIKR assets, and integrate federal, state and local emergency preparedness, protection, and resiliency of critical infrastructure."
    status: "not-a-requirement"
    reason: "Defines CIKR and describes what CIP plans do; 'roles and responsibilities for protection' lists plan content, so responsibilities assigns nothing."
  - id: "REQ-SP800-34R1-0068"
    citation: {"ref": "SP800-34R1", "page": 24, "anchor": "The cyber incident response plan11 establishes procedures to address cyber attacks against"}
    kind: "indicative"
    locator: "2.2.5"
    context: "Cyber Incident Response Plan"
    statement: "The cyber incident response plan11 establishes procedures to address cyber attacks against an organization’s information system(s).12 These procedures are designed to enable security personnel to identify, mitigate, and recover from malicious computer incidents, such as unauthorized access to a system or data, denial of service, or unauthorized changes to system hardware, software, or data (e.g., malicious logic, such as a virus, worm, or Trojan horse). This plan may be included as an appendix of the BCP."
    status: "not-a-requirement"
    reason: "Defines the cyber incident response plan; 'establishes procedures'. A description of a plan type. ART-IRP is the run's plan and takes its content from SP 800-61."
  - id: "REQ-SP800-34R1-0069"
    citation: {"ref": "SP800-34R1", "page": 24, "anchor": "The DRP applies to major, usually physical disruptions to service that deny"}
    kind: "modal"
    locator: "2.2.6"
    context: "Disaster Recovery Plan (DRP)"
    statement: "The DRP applies to major, usually physical disruptions to service that deny access to the primary facility infrastructure for an extended period. A DRP is an information system-focused plan designed to restore operability of the target system, application, or computer facility infrastructure at an alternate site after an emergency. The DRP may be supported by multiple information system contingency plans to address recovery of impacted individual systems once the alternate facility has been established. A DRP may support a BCP or COOP plan by recovering supporting systems for mission/business processes or mission essential functions at an alternate location. The DRP only addresses information system disruptions that require relocation."
    status: "not-a-requirement"
    reason: "Defines the DRP and its scope; 'disruptions that require relocation' classifies events, so require binds no one."
  - id: "REQ-SP800-34R1-0070"
    citation: {"ref": "SP800-34R1", "page": 24, "anchor": "An ISCP provides established procedures for the assessment and recovery of a"}
    kind: "modal"
    locator: "2.2.7"
    context: "Information System Contingency Plan (ISCP)"
    statement: "An ISCP provides established procedures for the assessment and recovery of a system following a system disruption. The ISCP provides key information needed for system recovery, including roles and responsibilities, inventory information, assessment procedures, detailed recovery procedures, and testing of a system."
    status: "not-a-requirement"
    reason: "Defines an ISCP: 'provides established procedures', 'including roles and responsibilities'. A definition in the survey of plan types; responsibilities here is a content label, and the content duties are in Chapter 4."
  - id: "REQ-SP800-34R1-0071"
    citation: {"ref": "SP800-34R1", "page": 24, "anchor": "The ISCP differs from a DRP primarily in that the information system"}
    kind: "indicative"
    locator: "2.2.7"
    context: "Information System Contingency Plan (ISCP)"
    statement: "The ISCP differs from a DRP primarily in that the information system contingency plan procedures are developed for recovery of the system regardless of site or location. An ISCP can be activated at the system’s current location or at an alternate site. In contrast, a DRP is primarily a site-specific plan developed with procedures to move operations of one or more information systems from a damaged or uninhabitable location to a temporary alternate location. Once the DRP has successfully transferred an information system site to an alternate site, each affected system would then use its respective ISCP to restore, recover, and test systems, and put them into operation."
    status: "not-a-requirement"
    reason: "Distinguishes the ISCP from the DRP by site; a comparison with no duty."
  - id: "REQ-SP800-34R1-0072"
    citation: {"ref": "SP800-34R1", "page": 24, "anchor": "The OEP outlines first-response procedures for occupants of a facility in the"}
    kind: "indicative"
    locator: "2.2.8"
    context: "Occupant Emergency Plan (OEP)"
    statement: "The OEP outlines first-response procedures for occupants of a facility in the event of a threat or incident to the health and safety of personnel, the environment, or property. Such events include a fire, bomb threat, chemical release, domestic violence in the workplace, or a medical emergency. Shelter-in-place procedures for events requiring personnel to stay inside the building rather than evacuate are also addressed in an OEP. OEPs are developed at the facility level, specific to the geographic location and structural design of the building. General Services Administration (GSA)-owned facilities maintain plans based on the GSA OEP template. The facility OEP may be appended to the COOP or BCP, but is executed separately and as a first response to the incident. Aspects of planning for personnel safety and evacuation are discussed in Appendix D."
    status: "not-a-requirement"
    reason: "Defines the Occupant Emergency Plan, a facility plan; a description."
  - id: "REQ-SP800-34R1-0073"
    citation: {"ref": "SP800-34R1", "page": 24, "anchor": "A cyber incident response plan is different from the Cyber Incident Annex"}
    kind: "indicative"
    locator: "2.2.8"
    context: "Occupant Emergency Plan (OEP)"
    statement: "A cyber incident response plan is different from the Cyber Incident Annex of the National Response Framework (NRF). The Cyber Incident Annex is for incidents “capable of causing extensive damage to critical infrastructure or key assets” and is more applicable to CIP plans."
    status: "not-a-requirement"
    reason: "Footnote 11, a note on how the Cyber Incident Annex differs from a response plan; terminology."
  - id: "REQ-SP800-34R1-0074"
    citation: {"ref": "SP800-34R1", "page": 25, "anchor": "Business Continuity Plan (BCP) | Provides procedures for sustaining mission/business operations while"}
    kind: "table"
    locator: "2.2.8"
    context: "Table 2-2: Type of Plans"
    statement: "Business Continuity Plan (BCP) | Provides procedures for sustaining mission/business operations while recovering from a significant disruption. | Addresses mission/business processes at a lower or expanded level from COOP MEFs. | Mission/business process focused plan that may be activated in coordination with a COOP plan to sustain non-MEFs."
    status: "not-a-requirement"
    reason: "Table 2-2 row, BCP: purpose, scope and relationship of a plan type; summarizes 2.2.1."
  - id: "REQ-SP800-34R1-0075"
    citation: {"ref": "SP800-34R1", "page": 25, "anchor": "Continuity of Operations (COOP) Plan | Provides procedures and guidance to sustain"}
    kind: "table"
    locator: "2.2.8"
    context: "Table 2-2: Type of Plans"
    statement: "Continuity of Operations (COOP) Plan | Provides procedures and guidance to sustain an organization’s MEFs at an alternate site for up to 30 days; mandated by federal directives. | Addresses MEFs at a facility; information systems are addressed based only on their support of the mission essential functions. | MEF focused plan that may also activate several business unit-level BCPs, ISCPs, or DRPs, as appropriate."
    status: "not-a-requirement"
    reason: "Table 2-2 row, COOP: restates 2.2.2; the mandate in it is decided at 0060."
  - id: "REQ-SP800-34R1-0076"
    citation: {"ref": "SP800-34R1", "page": 25, "anchor": "Crisis Communica-tions Plan | Provides procedures for disseminating internal and external communications;"}
    kind: "table"
    locator: "2.2.8"
    context: "Table 2-2: Type of Plans"
    statement: "Crisis Communica-tions Plan | Provides procedures for disseminating internal and external communications; means to provide critical status information and control rumors. | Addresses communications with personnel and the public; not information system-focused. | Incident-based plan often activated with a COOP or BCP, but may be used alone during a public exposure event."
    status: "not-a-requirement"
    reason: "Table 2-2 row, Crisis Communications Plan: restates 2.2.3."
  - id: "REQ-SP800-34R1-0077"
    citation: {"ref": "SP800-34R1", "page": 25, "anchor": "Critical Infrastructure Protection (CIP) Plan | Provides policies and procedures for protection"}
    kind: "table"
    locator: "2.2.8"
    context: "Table 2-2: Type of Plans"
    statement: "Critical Infrastructure Protection (CIP) Plan | Provides policies and procedures for protection of national critical infrastructure components, as defined in the National Infrastructure Protection Plan. | Addresses critical infrastructure components that are supported or operated by an agency or organization. | Risk management plan that supports COOP plans for organizations with critical infrastructure and key resource assets."
