  - {"page": 18, "locator": "1.4", "reason": "no-marker", "text": "Chapter 5, Technical Contingency Planning Considerations, describes contingency planning concerns specific to the three common platform types listed in Section 1.3, Scope. This section helps contingency planners identify, select, and implement the appropriate technical contingency measures for their given systems."}
  - {"page": 18, "locator": "1.4", "reason": "no-marker", "text": "This document includes nine appendices. Appendix A provides three sample ISCP templates, based on the FIPS 199 impact levels. Appendix B presents a sample BIA template. Appendix C contains a list of Frequently Asked Questions about information system contingency planning. Problems relevant to planning for personnel considerations are discussed in Appendix D. Appendix E provides a summary of NIST SP 800-53 contingency planning controls and control enhancements. Appendix F explains the integration of contingency planning into an organization’s SDLC. Appendices G and H contain a glossary of terms and acronyms, respectively. Appendix I provides suggested resources and references."}
  - {"page": 18, "locator": "1.4", "reason": "no-marker", "text": "The Risk Management Framework is described in draft NIST SP 800-39, Managing Risk from Information Systems: An Organizational Perspective."}
  - {"page": 19, "locator": "Chapter 2. Background", "reason": "no-marker", "text": "This chapter discusses the ways in which federal information system contingency planning fits into an organization’s larger risk management, security, and emergency preparedness programs (each of which is a key component in developing a resiliency program). Other types of emergency preparedness-related plans and their relationships to information system contingency planning are also described. Finally, the section discusses how integrating contingency planning principles throughout the SDLC promotes system compatibility and a cost-effective means to increase an organization’s ability to respond quickly and effectively to a disruptive event."}
  - {"page": 19, "locator": "2.1", "reason": "no-marker", "text": "Resilience7 is the ability to quickly adapt and recover from any known or unknown changes to the environment. Resiliency is not a process, but rather an end-state for organizations. The goal of a resilient organization is to continue mission essential functions at all times during any type of disruption. Resilient organizations continually work to adapt to changes and risks that can affect their ability to continue critical functions. Risk management, contingency, and continuity planning are individual security and emergency management activities that can also be implemented in a holistic manner across an organization as components of a resiliency program."}
  - {"page": 19, "locator": "2.1", "reason": "no-marker", "text": "Effective contingency planning begins with the development of an organization contingency planning policy and subjection of each information system to a business impact analysis (BIA). This facilitates prioritizing the systems and processes based on the FIPS 199 impact level and develops priority recovery strategies for minimizing loss. FIPS 199 provides guidelines on determining information and information system impact to organizational operations and assets, individuals, other organizations and the nation through a formula that examines three security objectives: confidentiality, integrity, and availability.8"}
  - {"page": 19, "locator": "2.1", "reason": "no-marker", "text": "Confidentiality preserves authorized restrictions on information access and disclosure, including means for protecting personal privacy and proprietary information."}
  - {"page": 19, "locator": "2.1", "reason": "no-marker", "text": "Integrity guards against improper information modification or destruction, and includes ensuring information non-repudiation and authenticity."}
  - {"page": 19, "locator": "2.1", "reason": "not-normative", "text": "For example, in many cases, critical resources (such as electric power or telecommunications) may reside outside the organization’s control, and the organization may be unable to ensure their availability."}
  - {"page": 19, "locator": "2.1", "reason": "no-marker", "text": "The Department of Homeland Security (DHS) Risk Lexicon (September 2008) defines resilience as the “ability to resist, absorb, recover from or successfully adapt to adversity or a change in conditions.” The DHS Risk Lexicon can be found at www.dhs.gov/xlibrary/assets/dhs_risk_lexicon.pdf."}
  - {"page": 19, "locator": "2.1", "reason": "no-marker", "text": "As defined in 44 U.S. Code 35 Section 3542 (January 8, 2008)."}
  - {"page": 20, "locator": "2.1", "reason": "no-marker", "text": "Availability ensures timely and reliable access to and use of information."}
  - {"page": 20, "locator": "2.1", "reason": "no-marker", "text": "Several CP controls reference environmental controls, which are part of the NIST SP 800-53 Physical and Environmental Protection (PE) control family. Environmental controls considerations are only for the location or building that houses the information system. The environment includes the hardware and technology assets that support the information system. Section 3.3 of NIST SP 800-53 provides more information on environmental controls and their relationship to information systems."}
  - {"page": 21, "locator": "2.1", "reason": "no-marker", "text": "Systems of Contingency-Related Plans9"}
  - {"page": 21, "locator": "2.2", "reason": "no-marker", "text": "Numbers in parentheses in this table refer to control enhancements defined for that control in NIST SP 800-53. A control enhancement either adds related functionality or strengthens a basic control."}
  - {"page": 22, "locator": "2.2.2", "reason": "lead-in", "text": "Standard elements of a COOP plan include:"}
  - {"page": 23, "locator": "2.2.2", "reason": "no-marker", "text": "COOP vs. ISCP – The Basic Facts"}
  - {"page": 23, "locator": "2.2.2", "reason": "no-marker", "text": "COOP plans address national, primary, or mission essential functions; ISCPs address federal information systems."}
  - {"page": 23, "locator": "2.2.2", "reason": "short", "text": "SCOPE"}
  - {"page": 23, "locator": "2.2.2", "reason": "no-marker", "text": "COOP is mandated for federal organizations by HSPD-20/NSPD-51, FCDs 1 and 2, and the National Continuity Policy Implementation Plan (NCPIP); ISCPs are mandated for federal organizations by FISMA."}
  - {"page": 23, "locator": "2.2.4", "reason": "no-marker", "text": "For more information on Critical Infrastructure and Key Resources (CIKR), refer to the Department of Homeland Security’s National Infrastructure Protection Plan 2009, available at www.dhs.gov/xlibrary/assets/NIPP_Plan.pdf."}
  - {"page": 24, "locator": "2.2.8", "reason": "no-marker", "text": "NIST SP 800-61 Rev. 1, Computer Security Incident Handling Guide, provides guidance on establishing a cyber incident response capability and plan."}
  - {"page": 25, "locator": "2.2.8", "reason": "no-marker", "text": "Error! Reference source not found. summarizes the types of plans. The plan types identified are implemented individually or in coordination with one another as appropriate to respond to a disruptive event."}
