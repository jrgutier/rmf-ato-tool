  - id: "REQ-SP800-34R1-0105"
    citation: {"ref": "SP800-34R1", "page": 28, "anchor": "To be effective and to ensure that personnel fully understand the organization’s"}
    kind: "modal"
    locator: "3.1"
    context: "Develop the Contingency Planning Policy Statement"
    statement: "To be effective and to ensure that personnel fully understand the organization’s contingency planning requirements, the contingency plan must be based on a clearly defined policy. The contingency planning policy statement should define the organization’s overall contingency objectives and establish the organizational framework and responsibilities for system contingency planning. To be successful, senior management, most likely the CIO, must support a contingency program and be included in the process to develop the program policy. The policy must reflect the FIPS 199 impact levels and the contingency controls that each impact level establishes. Key policy elements are as follows:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0106"
    citation: {"ref": "SP800-34R1", "page": 28, "anchor": "Scope as applies to common platform types and organization functions (i.e., telecommunications,"}
    kind: "indicative"
    locator: "3.1"
