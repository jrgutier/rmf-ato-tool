    context: "BUSINESS IMPACT ANALYSIS (BIA)"
    statement: "o Information systems that support COOP functions will be identified in the process-based BIA."
    status: "not-applicable"
    reason: "Binds whoever runs the organization's COOP planning: systems supporting COOP 'will be identified' in the process-based BIA. That is the COOP planners' procedure, not a run's; PER-CIO was checked and has no COOP task."
  - id: "REQ-SP800-34R1-0114"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "FCD-2 provides a required template for a process-based BIA; NIST 800-34 provides"}
    kind: "lettered"
    locator: "3.2.o"
    context: "BUSINESS IMPACT ANALYSIS (BIA)"
    statement: "o FCD-2 provides a required template for a process-based BIA; NIST 800-34 provides a recommended template for a system-based BIA."
    status: "not-a-requirement"
    reason: "Says FCD-2 has a required template and this guide a recommended one. Recommended here labels a template, excluded from scope as Appendix B, and binds no one."
  - id: "REQ-SP800-34R1-0115"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "Determine mission/business processes and recovery criticality. Mission/Business processes supported by the system"}
    kind: "lettered"
    locator: "3.2.1"
    context: "BUSINESS IMPACT ANALYSIS (BIA) Three steps are typically involved in accomplishing the BIA:"
    statement: "1. Determine mission/business processes and recovery criticality. Mission/Business processes supported by the system are identified and the impact of a system disruption to those processes is determined along with outage impacts and estimated downtime. The downtime should reflect the maximum time that an organization can tolerate while still maintaining the mission."
    status: "candidate"
  - id: "REQ-SP800-34R1-0116"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "Identify resource requirements. Realistic recovery efforts require a thorough evaluation of the"}
    kind: "lettered"
    locator: "3.2.2"
    context: "BUSINESS IMPACT ANALYSIS (BIA) Three steps are typically involved in accomplishing the BIA:"
    statement: "2. Identify resource requirements. Realistic recovery efforts require a thorough evaluation of the resources required to resume mission/business processes and related interdependencies as quickly as possible. Examples of resources that should be identified include facilities, personnel, equipment, software, data files, system components, and vital records."
    status: "candidate"
  - id: "REQ-SP800-34R1-0117"
    citation: {"ref": "SP800-34R1", "page": 29, "anchor": "NIST SP 800-37 further describes the RMF and provides guidance on organization-wide"}
    kind: "indicative"
    locator: "3.2.2"
    context: "BUSINESS IMPACT ANALYSIS (BIA) Three steps are typically involved in accomplishing the BIA:"
    statement: "NIST SP 800-37 further describes the RMF and provides guidance on organization-wide risk management including the development of risk management strategies, risk-related governance issues, defining protection requirements and associated risks for organizational mission/business processes, integration of security and privacy requirements into enterprise architectures, and managing risk within the system development life cycle."
    status: "not-a-requirement"
    reason: "Footnote 14 says what SP 800-37 describes; a pointer."
  - id: "REQ-SP800-34R1-0118"
    citation: {"ref": "SP800-34R1", "page": 30, "anchor": "Identify recovery priorities for system resources. Based upon the results from the"}
    kind: "lettered"
    locator: "3.2.3"
    context: "BUSINESS IMPACT ANALYSIS (BIA) Three steps are typically involved in accomplishing the BIA:"
    statement: "3. Identify recovery priorities for system resources. Based upon the results from the previous activities, system resources can be linked more clearly to critical mission/business processes and functions. Priority levels can be established for sequencing recovery activities and resources. The sample BIA process and data collection activities, outlined in this section and illustrated in Figure 3-2, consisting of a representative information system with multiple components (servers), are designed to help the ISCP Coordinator streamline and focus contingency plan development activities to achieve a more effective plan.15 An example of the BIA process and a BIA template are provided in Appendix B."
    status: "candidate"
