  - id: "REQ-SP800-34R1-0029"
    citation: {"ref": "SP800-34R1", "page": 18, "anchor": "This document is designed to logically lead the reader through the contingency"}
    kind: "indicative"
    locator: "1.4"
    context: "Document Structure"
    statement: "This document is designed to logically lead the reader through the contingency plan development process. The process includes designing a contingency planning program, evaluating the organization’s needs against contingency strategy options based on the system impact levels, security controls, and technical considerations, and documenting the contingency strategy into a contingency plan, testing the plan, and maintaining it. The resulting contingency plan serves as a “user’s manual” for executing the strategy in the event of a disruption. Where possible, examples or hypothetical situations are included to provide greater understanding. The remaining chapters of this document address the following areas of contingency planning:"
    status: "not-a-requirement"
    reason: "Section 1.4: 'This document is designed to logically lead the reader'; a map of the guide."
  - id: "REQ-SP800-34R1-0030"
    citation: {"ref": "SP800-34R1", "page": 18, "anchor": "Chapter 2, Background, provides background information about contingency planning, including the purpose"}
    kind: "modal"
    locator: "1.4"
    context: "Document Structure The remaining chapters of this document address the following areas of contingency planning:"
    statement: "Chapter 2, Background, provides background information about contingency planning, including the purpose of various security and emergency management-related plans, their relationships to ISCPs, and how the plans are integrated into an organization’s overall resilience strategy by implementing the six steps of the Risk Management Framework (RMF).5 In addition, the way in which the FIPS 199 impact levels and NIST SP 800-53 contingency planning controls must be considered during the contingency planning process is also explained."
    status: "not-a-requirement"
    reason: "Roadmap line for Chapter 2: 'must be considered' sits inside what the chapter 'explains', so must binds no one here. The chapter's own text is read at pages 19 to 26."
  - id: "REQ-SP800-34R1-0031"
    citation: {"ref": "SP800-34R1", "page": 18, "anchor": "Chapter 3, Information System Contingency Planning Process, details the fundamental planning principles"}
    kind: "modal"
    locator: "1.4"
    context: "Document Structure"
    statement: "Chapter 3, Information System Contingency Planning Process, details the fundamental planning principles necessary for developing an effective contingency capability. The principles outlined in this section are applicable to all information systems. The section presents contingency planning guidelines for all elements of the planning cycle, including business impact analysis, alternate site selection, and recovery strategies. The section also discusses the development of contingency plan teams and the roles and responsibilities commonly assigned to personnel during plan activation."
    status: "not-a-requirement"
    reason: "Roadmap line for Chapter 3: says what the chapter 'details' and 'discusses', including 'roles and responsibilities commonly assigned'. Responsibilities names a topic and assigns none."
  - id: "REQ-SP800-34R1-0032"
    citation: {"ref": "SP800-34R1", "page": 18, "anchor": "Chapter 4, Information System Contingency Plan Development, breaks down the activities necessary"}
    kind: "indicative"
