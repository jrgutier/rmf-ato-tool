  - id: "REQ-SP800-34R1-0406"
    citation: {"ref": "SP800-34R1", "page": 77, "anchor": "The Concept of Operations section provides details about {system name}, an overview"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.2"
    context: "TABLE OF CONTENTS"
    statement: "The Concept of Operations section provides details about {system name}, an overview of the three phases of the ISCP (Activation and Notification, Recovery, and Reconstitution), and a description of roles and responsibilities of {Organization’s} personnel during a contingency activation."
    status: "candidate"
  - id: "REQ-SP800-34R1-0407"
    citation: {"ref": "SP800-34R1", "page": 77, "anchor": "NOTE: Information for this section should be available from the system’s System"}
    kind: "imperative"
    locator: "A.1 Sample Template for Low-Impact Systems.2"
    context: "TABLE OF CONTENTS"
    statement: "NOTE: Information for this section should be available from the system’s System Security Plan (SSP) and can be copied from the SSP or reference the applicable section in the SSP and attach the latest version of the SSP to this contingency plan. Provide a general description of system architecture and functionality. Indicate the operating environment, physical location, general location of users, and partnerships with external organizations/systems. Include information regarding any other technical considerations that are important for recovery purposes, such as backup procedures."
    status: "candidate"
  - id: "REQ-SP800-34R1-0408"
    citation: {"ref": "SP800-34R1", "page": 77, "anchor": "This ISCP has been developed to recover and reconstitute the {system name}"}
    kind: "indicative"
    locator: "A.1 Sample Template for Low-Impact Systems.2"
    context: "TABLE OF CONTENTS"
    statement: "This ISCP has been developed to recover and reconstitute the {system name} using a three-phased approach. This approach ensures that system recovery and reconstitution efforts are performed in a methodical sequence to maximize the effectiveness of the recovery and reconstitution efforts and minimize system outage time due to errors and omissions. The three system recovery phases are: Activation and Notification Phase – Activation of the ISCP occurs after a disruption or outage that may reasonably extend beyond the RTO established for a system. The outage event may result in severe damage to the facility that houses the system, severe damage or loss of equipment, or other damage that typically results in long-term loss. Once the ISCP is activated, system owners and users are notified of a possible long-term outage, and a thorough outage assessment is performed for the system. Information from the outage assessment is presented to system owners and may be used to modify recovery procedures specific to the cause of the outage. Recovery Phase – The Recovery phase details the activities and procedures for recovery of the affected system. Activities and procedures are written at a level that an appropriately skilled technician can recover the system without intimate system knowledge. This phase includes notification and awareness escalation procedures for communication of recovery status to system owners and users."
    status: "candidate"
  - id: "REQ-SP800-34R1-0409"
    citation: {"ref": "SP800-34R1", "page": 78, "anchor": "Reconstitution –The Reconstitution phase defines the actions taken to test and validate"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.2"
    context: "TABLE OF CONTENTS"
    statement: "Reconstitution –The Reconstitution phase defines the actions taken to test and validate system capability and functionality at the original or new permanent location. This phase consists of two major activities: validating successful reconstitution and deactivation of the plan. During validation, the system is tested and validated as operational prior to returning operation to its normal state. Validation procedures may include functionality or regression testing, concurrent processing, and/or data validation. The system is declared recovered and operational by system owners upon successful completion of validation testing. Deactivation includes activities to notify users of system operational status. This phase also addresses recovery effort documentation, activity log finalization, incorporation of lessons learned into plan updates, and readying resources for any future events. 2.3 Roles and Responsibilities"
    status: "candidate"
  - id: "REQ-SP800-34R1-0410"
    citation: {"ref": "SP800-34R1", "page": 78, "anchor": "The ISCP establishes several roles for {system name} recovery and reconstitution support."}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.2"
    context: "TABLE OF CONTENTS"
    statement: "The ISCP establishes several roles for {system name} recovery and reconstitution support. Persons or teams assigned ISCP roles have been trained to respond to a contingency event affecting {system name}. Describe each team and role responsible for executing or supporting system recovery and reconstitution. Include responsibilities for each team/role, leadership roles, and coordination with other recovery and reconstitution teams, as applicable. At a minimum, a role should be established for a system owner or business unit point of contact, a recovery coordinator, and a technical recovery point of contact. Leadership roles should include an ISCP Director, who has overall management responsibility for the plan, and an ISCP Coordinator, who is responsible to oversee recovery and reconstitution progress, initiate any needed escalations or awareness communications, and establish coordination with other recovery and reconstitution teams as appropriate."
    status: "candidate"
  - id: "REQ-SP800-34R1-0411"
    citation: {"ref": "SP800-34R1", "page": 78, "anchor": "The Activation and Notification Phase defines initial actions taken once a {system"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.3"
    context: "TABLE OF CONTENTS"
    statement: "The Activation and Notification Phase defines initial actions taken once a {system name} disruption has been detected or appears to be imminent. This phase includes activities to notify recovery personnel, conduct an outage assessment, and activate the ISCP. At the completion of the Activation and Notification Phase, {system name} ISCP staff will be prepared to perform recovery measures. 3.1 Activation Criteria and Procedure"
    status: "candidate"
  - id: "REQ-SP800-34R1-0412"
    citation: {"ref": "SP800-34R1", "page": 78, "anchor": "The type of outage indicates {system name} will be down for more"}
    kind: "lettered"
    locator: "A.1 Sample Template for Low-Impact Systems.1"
    context: "TABLE OF CONTENTS"
    statement: "1. The type of outage indicates {system name} will be down for more than {RTO hours};"
    status: "candidate"
  - id: "REQ-SP800-34R1-0413"
    citation: {"ref": "SP800-34R1", "page": 78, "anchor": "The facility housing {system name} is damaged and may not be available"}
    kind: "lettered"
    locator: "A.1 Sample Template for Low-Impact Systems.2"
    context: "TABLE OF CONTENTS"
    statement: "2. The facility housing {system name} is damaged and may not be available within {RTO hours}; and"
    status: "candidate"
  - id: "REQ-SP800-34R1-0414"
    citation: {"ref": "SP800-34R1", "page": 78, "anchor": "Other criteria, as appropriate."}
    kind: "lettered"
    locator: "A.1 Sample Template for Low-Impact Systems.3"
    context: "TABLE OF CONTENTS"
    statement: "3. Other criteria, as appropriate."
    status: "candidate"
  - id: "REQ-SP800-34R1-0415"
    citation: {"ref": "SP800-34R1", "page": 79, "anchor": "The first step upon activation of the {system name} ISCP is notification"}
    kind: "indicative"
    locator: "A.1 Sample Template for Low-Impact Systems.3"
    context: "TABLE OF CONTENTS"
    statement: "The first step upon activation of the {system name} ISCP is notification of appropriate mission/business and system support personnel. Contact information for appropriate POCs is included in {Contact List Appendix name}. For {system name}, the following method and procedure for notifications are used: Describe established notification procedures. Notification procedures should include who makes the initial notifications, the sequence in which personnel are notified (e.g., system owner, technical POC, ISCP Coordinator, business unit or user unit POC, and recovery team POC), and the method of notification (e.g., email blast, call tree, automated notification system, etc.). 3.3 Outage Assessment"
    status: "candidate"
  - id: "REQ-SP800-34R1-0416"
    citation: {"ref": "SP800-34R1", "page": 79, "anchor": "Following notification, a thorough outage assessment is necessary to determine the extent"}
    kind: "indicative"
    locator: "A.1 Sample Template for Low-Impact Systems.3"
    context: "TABLE OF CONTENTS"
    statement: "Following notification, a thorough outage assessment is necessary to determine the extent of the disruption, any damage, and expected recovery time. This outage assessment is conducted by {name of recovery team}. Assessment results are provided to the ISCP Coordinator to assist in the coordination of the recovery of {system name}."
    status: "candidate"
  - id: "REQ-SP800-34R1-0417"
    citation: {"ref": "SP800-34R1", "page": 79, "anchor": "Outline detailed procedures to include how to determine the cause of the"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.3"
    context: "TABLE OF CONTENTS"
    statement: "Outline detailed procedures to include how to determine the cause of the outage; identification of potential for additional disruption or damage; assessment of affected physical area(s); and determination of the physical infrastructure status, IS equipment functionality, and inventory. Procedures should include notation of items that will need to be replaced and estimated time to restore service to normal operations."
    status: "candidate"
  - id: "REQ-SP800-34R1-0418"
    citation: {"ref": "SP800-34R1", "page": 79, "anchor": "The Recovery Phase provides formal recovery operations that begin after the ISCP"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.4"
    context: "TABLE OF CONTENTS"
    statement: "The Recovery Phase provides formal recovery operations that begin after the ISCP has been activated, outage assessments have been completed (if possible), personnel have been notified, and appropriate teams have been mobilized. Recovery Phase activities focus on implementing recovery strategies to restore system capabilities, repair damage, and resume operational capabilities at the original or an alternate location. At the completion of the Recovery Phase, {system name} will be functional and capable of performing the functions identified in Section 2.1 of this plan."
    status: "candidate"
  - id: "REQ-SP800-34R1-0419"
    citation: {"ref": "SP800-34R1", "page": 79, "anchor": "Identify recovery location (if not at original location);"}
    kind: "lettered"
    locator: "A.1 Sample Template for Low-Impact Systems.1"
    context: "TABLE OF CONTENTS"
    statement: "1. Identify recovery location (if not at original location);"
    status: "candidate"
  - id: "REQ-SP800-34R1-0420"
    citation: {"ref": "SP800-34R1", "page": 79, "anchor": "Identify required resources to perform recovery procedures;"}
    kind: "lettered"
    locator: "A.1 Sample Template for Low-Impact Systems.2"
    context: "TABLE OF CONTENTS"
    statement: "2. Identify required resources to perform recovery procedures;"
    status: "candidate"
