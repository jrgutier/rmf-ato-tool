  - {"page": 28, "locator": "3.1", "reason": "not-normative", "text": "The SDLC refers to the scope of activities associated with a system, encompassing the system’s initiation, development and acquisition, implementation, operation, and maintenance, and ultimately its disposal that instigates another system initiation. The SDLC approach is discussed in depth in NIST SP 800-64, Security Considerations in the Information System Development Life Cycle. An overview of contingency planning and the SDLC is provided in Appendix F."}
  - {"page": 29, "locator": "3.1", "reason": "no-marker", "text": "Facility-level plans, such as the OEP and DRP;"}
  - {"page": 29, "locator": "3.1", "reason": "no-marker", "text": "MEF support such as the COOP plan; and"}
  - {"page": 29, "locator": "3.1", "reason": "no-marker", "text": "Organization-level plans, such as CIP plans. Similarly, the six-step RMF14 brings together the supporting security standards and guidelines necessary for managing risk related to information systems. Implementing the RMF on an information system encompasses a broad range of activities to identify, control, and mitigate risks. From the information system contingency planning perspective, the six steps in the RMF actively support the development, implementation, testing, and maintenance of an information system’s contingency plan as it supports the mission of the organization."}
