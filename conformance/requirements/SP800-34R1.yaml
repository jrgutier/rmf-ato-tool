    context: "TABLE OF CONTENTS"
    statement: "Ensure coordination with other personnel responsible for {organization name} contingency planning strategies. Ensure coordination with external points of contact and vendors associated with {system name} and execution of this plan. 1.2 Scope"
    status: "candidate"
  - id: "REQ-SP800-34R1-0401"
    citation: {"ref": "SP800-34R1", "page": 76, "anchor": "This ISCP has been developed for {system name}, which is classified as"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.1"
    context: "TABLE OF CONTENTS"
    statement: "This ISCP has been developed for {system name}, which is classified as a low-impact system, in accordance with Federal Information Processing Standards (FIPS) 199 – Standards for Security Categorization of Federal Information and Information Systems. Procedures in this ISCP are for Low- Impact systems and designed to recover {system name} within {RTO hours}. This plan does not address replacement or purchase of new equipment, short-term disruptions lasting less than {RTO hours}; or loss of data at the onsite facility or at the user-desktop levels. As {system name} is a low-impact system, alternate data storage and alternate site processing are not required. 1.3 Assumptions"
    status: "candidate"
  - id: "REQ-SP800-34R1-0402"
    citation: {"ref": "SP800-34R1", "page": 76, "anchor": "{System name} has been established as a low-impact system, in accordance with"}
    kind: "modal"
    locator: "A.1 Sample Template for Low-Impact Systems.1"
    context: "TABLE OF CONTENTS"
    statement: "{System name} has been established as a low-impact system, in accordance with FIPS 199."
