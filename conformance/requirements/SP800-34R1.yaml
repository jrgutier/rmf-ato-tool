  - id: "REQ-SP800-34R1-0122"
    citation: {"ref": "SP800-34R1", "page": 30, "anchor": "An information system can be very complex and often supports multiple mission/business"}
    kind: "should"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "An information system can be very complex and often supports multiple mission/business processes, resulting in different perspectives on the importance of system services or capabilities. To accomplish the BIA and better understand the impacts a system outage or disruption can have on the organization, the ISCP Coordinator should work with management and internal and external points of contact (POC)16 to identify and validate mission/business processes and processes that depend on or support the information system. The identified processes’ impacts are then further analyzed in terms of availability, integrity, confidentiality, and the established FIPS 199 impact level for the information system."
    status: "candidate"
  - id: "REQ-SP800-34R1-0123"
    citation: {"ref": "SP800-34R1", "page": 30, "anchor": "FIPS 199 requires organizations to categorize their information systems as low impact,"}
    kind: "modal"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "FIPS 199 requires organizations to categorize their information systems as low impact, moderate impact, or high impact for the security objectives of confidentiality, integrity, and availability (RMF Step 1). The FIPS 199 category for the availability security objective serves as a basis of the BIA. Further identification of additional mission/business processes and impacts captures the unique purpose of the system. Organizational and system uniqueness are important considerations for contingency planning and business impact. Adding information types to address this uniqueness will enhance the prioritization of system component impacts."
    status: "candidate"
  - id: "REQ-SP800-34R1-0124"
    citation: {"ref": "SP800-34R1", "page": 30, "anchor": "For completeness and to assist ISCP Coordinators who may be new to"}
    kind: "modal"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "For completeness and to assist ISCP Coordinators who may be new to or unfamiliar with the information system, the sample BIA process presented includes basic steps. In many cases, the ISCP Coordinator will be very familiar with specific system components and the ways in which they support business processes and may modify the approach to fit the respective system and contingency needs."
    status: "not-a-requirement"
    reason: "Footnote 15: the sample BIA 'includes basic steps' and the coordinator 'will be very familiar' and 'may modify the approach'. Will predicts, and binds no one."
  - id: "REQ-SP800-34R1-0125"
    citation: {"ref": "SP800-34R1", "page": 30, "anchor": "When identifying POCs, it is important to include organizations that provide or"}
    kind: "should"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "When identifying POCs, it is important to include organizations that provide or receive data from the system as well as POCs of any interconnected systems. Coordination should enable the system manager to characterize the full range of support provided by the system, including security, managerial, technical, and operational requirements."
    status: "candidate"
  - id: "REQ-SP800-34R1-0126"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "Unique processes and impacts can be expressed in values or units of"}
    kind: "should"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "Unique processes and impacts can be expressed in values or units of measurement that are meaningful to the organization. Values can be identified using a scale and should be characterized as an indication of impact severity to the organization if the process could not be performed.17 For example, an impact category such as “Costs” can be created with impact values expressed in terms of staffing, overtime, or fee-related costs."
    status: "candidate"
  - id: "REQ-SP800-34R1-0127"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "The ISCP Coordinator should next analyze the supported mission/business processes and with"}
    kind: "should"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "The ISCP Coordinator should next analyze the supported mission/business processes and with the process owners, leadership and business managers determine the acceptable downtime if a given process or specific system data were disrupted or otherwise unavailable. Downtime can be identified in several ways.18"
    status: "candidate"
  - id: "REQ-SP800-34R1-0128"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "Maximum Tolerable Downtime (MTD). The MTD represents the total amount of time"}
    kind: "modal"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "Maximum Tolerable Downtime (MTD). The MTD represents the total amount of time the system owner/authorizing official is willing to accept for a mission/business process outage or disruption and includes all impact considerations. Determining MTD is important because it could leave contingency planners with imprecise direction on (1) selection of an appropriate recovery method, and (2) the depth of detail which will be required when developing recovery procedures, including their scope and content.19"
    status: "not-a-requirement"
    reason: "Defines MTD and why it matters; 'the depth of detail which will be required' is part of the explanation, so will binds no one. The value itself is held at 0115."
  - id: "REQ-SP800-34R1-0129"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "Recovery Time Objective (RTO). RTO defines the maximum amount of time that"}
    kind: "should"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "Recovery Time Objective (RTO). RTO defines the maximum amount of time that a system resource can remain unavailable before there is an unacceptable impact on other system resources, supported mission/business processes, and the MTD. Determining the information system resource RTO is important for selecting appropriate technologies that are best suited for meeting the MTD.20 When it is not feasible to immediately meet the RTO and the MTD is inflexible, a Plan of Action and Milestone should be initiated to document the situation and plan for its mitigation."
    status: "candidate"
  - id: "REQ-SP800-34R1-0130"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "Because the RTO must ensure that the MTD is not exceeded, the"}
    kind: "modal"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "Because the RTO must ensure that the MTD is not exceeded, the RTO must normally be shorter than the MTD. For example, a system outage may prevent a particular process from being completed, and because it takes time to reprocess the data, that additional processing time must be added to the RTO to stay within the time limit established by the MTD."
    status: "candidate"
  - id: "REQ-SP800-34R1-0131"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "The first version of NIST SP 800-34 used the term Maximum Allowable"}
    kind: "indicative"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "The first version of NIST SP 800-34 used the term Maximum Allowable Outage (MAO) to describe the downtime threshold. To further delineate business process and information system downtime, Maximum Tolerable Downtime (MTD) and Recovery Time Objective (RTO) terms are used."
    status: "not-a-requirement"
    reason: "Footnote 18, the history of the term Maximum Allowable Outage."
  - id: "REQ-SP800-34R1-0132"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "Any information system that supports continuity of operations Mission Essential Functions (MEF),"}
    kind: "modal"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "Any information system that supports continuity of operations Mission Essential Functions (MEF), Primary Mission Essential Functions (PMEF), or National Essential Functions (NEF) must be able to meet the function’s MTD of 12 hours or less per FCD-1."
    status: "not-applicable"
    reason: "Holds only for a system that supports a continuity MEF, PMEF or NEF: such a fork must meet the 12-hour MTD of FCD-1. No other run has the condition, and no fact records that a system supports a MEF, so nothing holds it; PER-PM and PER-CIO were checked."
  - id: "REQ-SP800-34R1-0133"
    citation: {"ref": "SP800-34R1", "page": 31, "anchor": "RTOs for telecommunications systems that support continuity of operation MEFs, PMEFs, or"}
    kind: "modal"
    locator: "3.2.1"
    context: "Determine Business Processes and Recovery Criticality"
    statement: "RTOs for telecommunications systems that support continuity of operation MEFs, PMEFs, or NEFs must support the function’s COOP requirements including those put forth by National Communications Systems (NCS) Directive 3-10."
    status: "not-applicable"
    reason: "Holds only for a telecommunications system supporting a continuity function under NCS Directive 3-10; condition on one class of fork, and no persona or fact carries it (PER-PM and PER-CSSP checked)."
  - id: "REQ-SP800-34R1-0134"
    citation: {"ref": "SP800-34R1", "page": 32, "anchor": "COOP functions must be sustained within 12 hours and for up to"}
    kind: "modal"
    locator: "3.2.1"
    context: "RECOVERY TIMES"
    statement: "COOP functions must be sustained within 12 hours and for up to 30 days from an alternate site; ISCP recovery time objectives are determined by the system-based BIA."
    status: "candidate"
  - id: "REQ-SP800-34R1-0135"
    citation: {"ref": "SP800-34R1", "page": 32, "anchor": "Information systems that support COOP functions must have an RTO that meets"}
    kind: "lettered"
    locator: "3.2.1.o"
    context: "RECOVERY TIMES"
    statement: "o Information systems that support COOP functions must have an RTO that meets COOP requirements."
    status: "not-applicable"
    reason: "Holds only for a system supporting a COOP function, the same condition as 0132: the RTO must meet COOP requirements. One class of fork, with no fact recording the condition; PER-PM checked."
  - id: "REQ-SP800-34R1-0136"
    citation: {"ref": "SP800-34R1", "page": 32, "anchor": "Information systems that do not support COOP functions do not require alternate"}
    kind: "lettered"
    locator: "3.2.1.o"
    context: "RECOVERY TIMES"
    statement: "o Information systems that do not support COOP functions do not require alternate sites as part of the ISCP recovery strategy, but may have an alternate site security control requirement."
    status: "not-a-requirement"
    reason: "An exemption: such systems 'do not require alternate sites'. It lifts a duty, so require binds no one here, and the alternate site comes from cp-6 and cp-7 where the baseline selects them, held at 0159."
  - id: "REQ-SP800-34R1-0137"
    citation: {"ref": "SP800-34R1", "page": 32, "anchor": "The ISCP Coordinator, working with management, should determine the optimum point to"}
    kind: "should"
    locator: "3.2.1"
    context: "RECOVERY TIMES"
    statement: "The ISCP Coordinator, working with management, should determine the optimum point to recover the information system by addressing the factors mentioned above while balancing the cost of system inoperability against the cost of resources required for restoring the system and its overall support for critical mission/business processes. This can be depicted using a simple chart, such as the example in Figure 3-3."
    status: "candidate"
  - id: "REQ-SP800-34R1-0138"
    citation: {"ref": "SP800-34R1", "page": 32, "anchor": "Length of Disruption Time"}
    kind: "table"
    locator: "3.2.1"
    context: "RECOVERY TIMES"
    statement: "Length of Disruption Time"
    status: "not-a-requirement"
    reason: "Axis label of Figure 3-3, 'Length of Disruption Time'."
  - id: "REQ-SP800-34R1-0139"
    citation: {"ref": "SP800-34R1", "page": 32, "anchor": "The longer a disruption is allowed to continue, the more costly it"}
    kind: "modal"
    locator: "3.2.1"
    context: "Figure 3-3: Cost Balancing"
    statement: "The longer a disruption is allowed to continue, the more costly it can become to the organization and its operations. Conversely, the shorter the RTO, the more expensive the recovery solutions cost to implement. For example, if the system must be recovered immediately, zero downtime solutions and alternate processing site costs will be much higher, whereas a low-impact system with a longer RTO would be able to implement a less costly simple tape backup system. Plotting the cost balance points will show an optimal point between disruption and recovery costs. The intersecting point (Cost Balance Point in Figure 3-3: Cost Balancing) will be different for every organization and system based on the financial constraints and operating requirements."
    status: "not-a-requirement"
    reason: "Explains Figure 3-3: longer outages cost more and shorter RTOs cost more. 'if the system must be recovered immediately' is a hypothetical and 'will be much higher' a prediction, so must and will bind no one; the duty is at 0137."
  - id: "REQ-SP800-34R1-0140"
    citation: {"ref": "SP800-34R1", "page": 33, "anchor": "Realistic recovery efforts require a thorough evaluation of the resources required to"}
    kind: "modal"
    locator: "3.2.2"
    context: "Identify Resource Requirements"
    statement: "Realistic recovery efforts require a thorough evaluation of the resources required to resume mission/business processes as quickly as possible. Working with management and internal and external POCs associated with the system, the ISCP Coordinator should ensure that the complete information system resources are identified.21 A simple table such as the one shown in Table 3-1 can be used to capture relevant information system resources."
    status: "candidate"
  - id: "REQ-SP800-34R1-0141"
    citation: {"ref": "SP800-34R1", "page": 33, "anchor": "Application Server | Sun V245/ Solaris / v10.0 | Serves as the"}
    kind: "table"
    locator: "3.2.2"
    context: "Table 3-1: Information System Resource/Component Table"
    statement: "Application Server | Sun V245/ Solaris / v10.0 | Serves as the main application server"
    status: "not-a-requirement"
    reason: "Sample row of Table 3-1, a Sun application server; a sample table."
  - id: "REQ-SP800-34R1-0142"
    citation: {"ref": "SP800-34R1", "page": 33, "anchor": "Developing recovery priorities is the last step of the BIA process. Recovery"}
    kind: "should"
    locator: "3.2.3"
    context: "Identify System Resource Recovery Priorities"
    statement: "Developing recovery priorities is the last step of the BIA process. Recovery priorities can be effectively established taking into consideration mission/business process criticality, outage impacts, tolerable downtime, and system resources. The result is an information system recovery priority hierarchy. The ISCP Coordinator should consider system recovery measures and technologies to meet the recovery priorities."
    status: "candidate"
  - id: "REQ-SP800-34R1-0143"
    citation: {"ref": "SP800-34R1", "page": 33, "anchor": "In some cases, the outage impacts identified in the BIA may be"}
    kind: "indicative"
    locator: "3.3"
    context: "Identify Preventive Controls"
    statement: "In some cases, the outage impacts identified in the BIA may be mitigated or eliminated through preventive measures that deter, detect, and/or reduce impacts to the system. Where feasible and cost-effective, preventive methods are preferable to actions that may be necessary to recover the system after a disruption. Step 2 of the RMF includes the identification of effective contingency planning preventive controls and maintaining these controls on an ongoing basis. A variety of preventive controls are identified in NIST SP 800-53, depending on system type and configuration; some common measures are listed below:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0144"
    citation: {"ref": "SP800-34R1", "page": 33, "anchor": "Appropriately sized uninterruptible power supplies (UPS) to provide short-term backup power to"}
    kind: "indicative"
    locator: "3.3"
    context: "Identify Preventive Controls A variety of preventive controls are identified in NIST SP 800-53, depending on system type and configuration; some common measures are listed below:"
    statement: "Appropriately sized uninterruptible power supplies (UPS) to provide short-term backup power to all system components (including environmental and safety controls);"
    status: "not-a-requirement"
    reason: "Advisory: the first of the 'common measures' given as examples (UPS), not a minimum set. '## Preventive controls' asks for measures and cites power protection."
  - id: "REQ-SP800-34R1-0145"
    citation: {"ref": "SP800-34R1", "page": 33, "anchor": "To avoid duplication of effort, this information may be obtained from the"}
    kind: "should"
    locator: "3.3"
    context: "Identify Preventive Controls"
    statement: "To avoid duplication of effort, this information may be obtained from the system component inventory and the system software inventory."
    status: "not-a-requirement"
    reason: "Footnote 21, advisory: the information 'may be obtained' from the inventories; a shortcut, a permission."
  - id: "REQ-SP800-34R1-0146"
    citation: {"ref": "SP800-34R1", "page": 34, "anchor": "Organizations are required to adequately mitigate the risk arising from use of"}
    kind: "modal"
    locator: "3.4"
    context: "Create Contingency Strategies"
    statement: "Organizations are required to adequately mitigate the risk arising from use of information and information systems in the execution of mission/business processes. The challenge for organizations is in implementing the right set of security controls. Guided by the RMF and in accordance with FIPS 199 and NIST SP 800-53, security controls are selected and implemented. Contingency strategies are created to mitigate the risks for the contingency planning family of controls and cover the full range of backup, recovery, contingency planning, testing, and ongoing maintenance."
    status: "candidate"
  - id: "REQ-SP800-34R1-0147"
    citation: {"ref": "SP800-34R1", "page": 34, "anchor": "Backup and recovery methods and strategies are a means to restore system"}
    kind: "should"
    locator: "3.4.1"
    context: "Backup and Recovery"
    statement: "Backup and recovery methods and strategies are a means to restore system operations quickly and effectively following a service disruption. The methods and strategies should address disruption impacts and allowable downtimes identified in the BIA and should be integrated into the system architecture during the Development/Acquisition phase of the SDLC. A wide variety of recovery approaches may be considered, with the appropriate choice being highly dependent upon the incident, type of system, BIA/FIPS 199 impact level, and the system’s operational requirements.22 Specific recovery methods further described in Section 3.4.2 should be considered and may include commercial contracts with alternate site vendors, reciprocal agreements with internal or external organizations, and service-level agreements (SLAs) with equipment vendors. In addition, technologies such as redundant arrays of independent disks (RAID), automatic failover, UPS, server clustering, and mirrored systems should be considered when developing a system recovery strategy."
    status: "candidate"
  - id: "REQ-SP800-34R1-0148"
    citation: {"ref": "SP800-34R1", "page": 34, "anchor": "Several alternative approaches should be considered when developing and comparing strategies, including"}
    kind: "should"
    locator: "3.4.1"
    context: "Backup and Recovery"
    statement: "Several alternative approaches should be considered when developing and comparing strategies, including cost, maximum downtimes, security, recovery priorities, and integration with larger, organization-level contingency plans. Table is an example that can assist in identifying the linkage of FIPS 199 impact level for the availability security objective, recovery priority, backup, and recovery strategy."
    status: "candidate"
  - id: "REQ-SP800-34R1-0149"
    citation: {"ref": "SP800-34R1", "page": 34, "anchor": "Availability Impact Level"}
    kind: "table"
    locator: "3.4.1"
    context: "Table 3-2: FIPS 199 Category Backup & Strategy Examples"
    statement: "Availability Impact Level"
    status: "not-a-requirement"
    reason: "Table 3-2 header, split across cells; a label of an example table."
  - id: "REQ-SP800-34R1-0150"
    citation: {"ref": "SP800-34R1", "page": 34, "anchor": "Low | Low priority - any outage with little impact, damage, or"}
    kind: "table"
    locator: "3.4.1"
    context: "Table 3-2: FIPS 199 Category Backup & Strategy Examples"
    statement: "Low | Low priority - any outage with little impact, damage, or disruption to the organization. | Backup: Tape backup Strategy: Relocate or Cold site"
    status: "not-a-requirement"
    reason: "Table 3-2 'Examples', low row: tape backup, relocate or cold site. A sample table, not a floor."
  - id: "REQ-SP800-34R1-0151"
    citation: {"ref": "SP800-34R1", "page": 34, "anchor": "Moderate | Important or moderate priority - any system that, if disrupted,"}
    kind: "table"
    locator: "3.4.1"
    context: "Table 3-2: FIPS 199 Category Backup & Strategy Examples"
    statement: "Moderate | Important or moderate priority - any system that, if disrupted, would cause a moderate problem to the organization and possibly other networks or systems. | Backup: Optical backup, WAN/VLAN replication Strategy: Cold or Warm site"
    status: "not-a-requirement"
    reason: "Table 3-2 'Examples', moderate row: optical backup, replication, cold or warm site; example."
  - id: "REQ-SP800-34R1-0152"
    citation: {"ref": "SP800-34R1", "page": 34, "anchor": "Chapter 5, Technical Contingency Planning Considerations, provides detailed discussion of recovery methods"}
    kind: "indicative"
    locator: "3.4.1"
    context: "Table 3-2: FIPS 199 Category Backup & Strategy Examples"
    statement: "Chapter 5, Technical Contingency Planning Considerations, provides detailed discussion of recovery methods applicable to specific types of information systems."
    status: "not-a-requirement"
    reason: "Footnote 22, a pointer to Chapter 5."
  - id: "REQ-SP800-34R1-0153"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "Availability Impact Level"}
    kind: "table"
    locator: "3.4.1"
    context: "Table 3-2: FIPS 199 Category Backup & Strategy Examples"
    statement: "Availability Impact Level"
    occurrence: 2
    status: "not-a-requirement"
    reason: "Table 3-2 header repeated on the continuation page; the same label as 0149."
  - id: "REQ-SP800-34R1-0154"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "High | Mission-critical or high priority - the damage or disruption to"}
    kind: "table"
    locator: "3.4.1"
    context: "Table 3-2: FIPS 199 Category Backup & Strategy Examples"
    statement: "High | Mission-critical or high priority - the damage or disruption to these systems would cause the most impact on the organization, mission, and other networks and systems. | Backup: Mirrored systems and disc replication Strategy: Hot site"
    status: "not-a-requirement"
    reason: "Table 3-2 'Examples', high row: mirrored systems, hot site; example."
  - id: "REQ-SP800-34R1-0155"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "System data should be backed up regularly. Policies should specify the minimum"}
    kind: "should"
    locator: "3.4.2"
    context: "Backup Methods and Offsite Storage"
    statement: "System data should be backed up regularly. Policies should specify the minimum frequency and scope of backups (e.g., daily or weekly, incremental or full) based on data criticality and the frequency that new information is introduced. Data backup policies should designate the location of stored data, file-naming conventions, media rotation frequency, and method for transporting data offsite. Data may be backed up on magnetic disk, tape, or optical disks, such as compact disks (CDs). The specific method chosen for conducting backups should be based on system and data availability and integrity requirements. These methods may include electronic vaulting, network storage, and tape library systems.24"
    status: "candidate"
  - id: "REQ-SP800-34R1-0156"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "It is good business practice to store backed-up data offsite. Commercial data"}
    kind: "modal"
    locator: "3.4.2"
    context: "Backup Methods and Offsite Storage"
    statement: "It is good business practice to store backed-up data offsite. Commercial data storage facilities are specially designed to archive media and protect data from threatening elements. If using offsite storage, data is backed up at the organization’s facility and then labeled, packed, and transported to the storage facility. If the data is required for recovery or testing purposes, the organization contacts the storage facility requesting specific data to be transported to the organization or to an alternate facility.25 Commercial storage facilities often offer media transportation and response and recovery services. When selecting an offsite storage facility and vendor, the following criteria should be considered:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0157"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "Geographic area: distance from the organization and the probability of the storage"}
    kind: "indicative"
    locator: "3.4.2"
    context: "Backup Methods and Offsite Storage When selecting an offsite storage facility and vendor, the following criteria should be considered:"
    statement: "Geographic area: distance from the organization and the probability of the storage site being affected by the same disaster as the organization’s primary site;"
    status: "not-a-requirement"
    reason: "Noun item 'Geographic area' under the criteria lead-in at 0156."
  - id: "REQ-SP800-34R1-0158"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "Security: security capabilities of the shipping method, storage facility, and personnel; all"}
    kind: "modal"
    locator: "3.4.2"
    context: "Backup Methods and Offsite Storage"
    statement: "Security: security capabilities of the shipping method, storage facility, and personnel; all must meet the data’s security requirements;"
    status: "candidate"
  - id: "REQ-SP800-34R1-0159"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "As stated in Section 2.1, NIST SP 800-53 identifies the CP controls"}
    kind: "indicative"
    locator: "3.4.3"
    context: "Alternate Sites"
    statement: "As stated in Section 2.1, NIST SP 800-53 identifies the CP controls for information systems. The FIPS 199 security categorization for the availability security objective determines which controls apply to a particular system. For example, an information system categorized with a low-availability security objective does not require alternate storage or a processing site (CP-6 and CP-7, respectively), and an information system with a moderate-availability security objective requires the system backup and testing the backup (CP-9 [1]). Further details and descriptions of the contingency planning controls are provided in Appendix E."
    status: "candidate"
  - id: "REQ-SP800-34R1-0160"
    citation: {"ref": "SP800-34R1", "page": 35, "anchor": "Backup tapes should be tested regularly to ensure that data are being"}
    kind: "should"
    locator: "3.4.3"
    context: "Alternate Sites"
    statement: "Backup tapes should be tested regularly to ensure that data are being stored correctly and that the files may be retrieved without errors or lost data. Also, the ISCP Coordinator should test the backup tapes at the alternate site, if applicable, to ensure that the site supports the same backup configuration that the organization has implemented."
    status: "candidate"
  - id: "REQ-SP800-34R1-0161"
    citation: {"ref": "SP800-34R1", "page": 36, "anchor": "Although major disruptions with long-term effects may be rare, they should be"}
    kind: "should"
    locator: "3.4.3"
    context: "Alternate Sites"
    statement: "Although major disruptions with long-term effects may be rare, they should be accounted for in the contingency plan. Thus, for all FIPS 199 moderate- or high-impact systems, the plan should include a strategy to recover and perform system operations at an alternate facility for an extended period. Organizations may consider FIPS 199 low-impact systems for alternate site processing, but that is an organizational decision and not required. In general, three types of alternate sites are available:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0162"
    citation: {"ref": "SP800-34R1", "page": 36, "anchor": "Dedicated site owned or operated by the organization;"}
    kind: "indicative"
    locator: "3.4.3"
    context: "Alternate Sites In general, three types of alternate sites are available:"
    statement: "Dedicated site owned or operated by the organization;"
    status: "not-a-requirement"
    reason: "First noun item of the three alternate site types; a description."
  - id: "REQ-SP800-34R1-0163"
    citation: {"ref": "SP800-34R1", "page": 36, "anchor": "Commercially leased facility. Regardless of the type of alternate site chosen, the"}
    kind: "modal"
    locator: "3.4.3"
    context: "Alternate Sites"
    statement: "Commercially leased facility. Regardless of the type of alternate site chosen, the facility must be able to support system operations as defined in the contingency plan. The three alternate site types commonly categorized in terms of their operational readiness are cold sites, warm sites, or hot sites.26 Other variations or combinations of these can be found, but generally all variations retain similar core features found in one of these three site types. Progressing from basic to advanced, the sites are described below."
    status: "candidate"
  - id: "REQ-SP800-34R1-0164"
    citation: {"ref": "SP800-34R1", "page": 36, "anchor": "As discussed above, these three alternate site types are the most common."}
    kind: "should"
    locator: "3.4.3"
    context: "Alternate Sites"
    statement: "As discussed above, these three alternate site types are the most common. There are also variations, and hybrid mixtures of features from any one of the three. Each organization should evaluate its core requirements in order to establish the most effective solution. Two examples of variations to the site types are:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0165"
    citation: {"ref": "SP800-34R1", "page": 36, "anchor": "Mobile Sites are self-contained, transportable shells custom-fitted with specific telecommunications and system"}
    kind: "indicative"
    locator: "3.4.3"
    context: "Alternate Sites Two examples of variations to the site types are:"
    statement: "Mobile Sites are self-contained, transportable shells custom-fitted with specific telecommunications and system equipment necessary to meet system requirements."
    status: "not-a-requirement"
    reason: "Defines mobile sites; a definition of a site type given as an example."
  - id: "REQ-SP800-34R1-0166"
    citation: {"ref": "SP800-34R1", "page": 36, "anchor": "Mirrored Sites are fully redundant facilities with automated real-time information mirroring. Mirrored"}
    kind: "modal"
    locator: "3.4.3"
    context: "Alternate Sites"
    statement: "Mirrored Sites are fully redundant facilities with automated real-time information mirroring. Mirrored sites are identical to the primary site in all technical respects. There are obvious cost and ready-time differences among the options. In these examples, the mirrored site is the most expensive choice, but it ensures virtually 100 percent availability. Cold sites are the least expensive to maintain, although they may require substantial time to acquire and install necessary equipment. Partially equipped sites, such as warm sites, fall in the middle of the spectrum. In many cases, mobile sites may be delivered to the desired location within 24 hours, but the time necessary for equipment installation and setup can increase this response time. The selection of fixed-site locations should account for the time and mode of transportation necessary to move personnel and/or equipment there. In addition, the fixed site should be in a geographic area that is unlikely to be negatively affected by the same hazard as the organization’s primary site."
    status: "candidate"
  - id: "REQ-SP800-34R1-0167"
    citation: {"ref": "SP800-34R1", "page": 37, "anchor": "Table summarizes the criteria that can be employed to determine which type"}
    kind: "indicative"
    locator: "3.4.3"
    context: "Alternate Sites"
    statement: "Table summarizes the criteria that can be employed to determine which type of alternate site meets the organization’s requirements. Sites should be analyzed further by the organization, including considerations given to business impacts and downtime defined in the BIA. As sites are evaluated, the ISCP Coordinator should ensure that the system’s security, management, operational, and technical controls are compatible with the prospective site. Such controls may include firewalls, physical access controls, and personnel security requirements of the staff supporting the site."
    status: "candidate"
  - id: "REQ-SP800-34R1-0168"
    citation: {"ref": "SP800-34R1", "page": 37, "anchor": "Cold Site | Low | None | None | Long | Fixed"}
    kind: "table"
    locator: "3.4.3"
    context: "Table 3-34: Sample Alternate Site Criteria"
    statement: "Cold Site | Low | None | None | Long | Fixed"
    status: "not-a-requirement"
    reason: "Table 3-3 'Sample Alternate Site Criteria', cold site row; a sample table."
  - id: "REQ-SP800-34R1-0169"
    citation: {"ref": "SP800-34R1", "page": 37, "anchor": "Warm Site | Medium | Partial | Partial/Full | Medium | Fixed"}
    kind: "table"
    locator: "3.4.3"
    context: "Table 3-34: Sample Alternate Site Criteria"
    statement: "Warm Site | Medium | Partial | Partial/Full | Medium | Fixed"
    status: "not-a-requirement"
    reason: "Table 3-3 sample, warm site row."
  - id: "REQ-SP800-34R1-0170"
    citation: {"ref": "SP800-34R1", "page": 37, "anchor": "Hot Site | Medium/High | Full | Full | Short | Fixed"}
    kind: "table"
    locator: "3.4.3"
    context: "Table 3-34: Sample Alternate Site Criteria"
    statement: "Hot Site | Medium/High | Full | Full | Short | Fixed"
    status: "not-a-requirement"
    reason: "Table 3-3 sample, hot site row."
  - id: "REQ-SP800-34R1-0171"
    citation: {"ref": "SP800-34R1", "page": 37, "anchor": "Alternate sites may be owned and operated by the organization (internal recovery),"}
    kind: "modal"
    locator: "3.4.3"
    context: "Table 3-34: Sample Alternate Site Criteria"
    statement: "Alternate sites may be owned and operated by the organization (internal recovery), or commercial sites may be available under contract. If contracting for the site with a commercial vendor, adequate testing time, work space, security requirements, hardware requirements, telecommunications requirements, support services, and recovery days (how long the organization can occupy the space during the recovery period) must be negotiated and clearly stated in the contract. Customers should be aware that multiple organizations may contract with a vendor for the same alternate site; as a result, the site may be unable to accommodate all of the customers if a disaster affects enough of those customers simultaneously. The vendor’s policy on how this situation should be addressed and how priority status is determined should be negotiated."
    status: "candidate"
  - id: "REQ-SP800-34R1-0172"
    citation: {"ref": "SP800-34R1", "page": 37, "anchor": "Two or more organizations with similar or identical system configurations and backup"}
    kind: "modal"
    locator: "3.4.3"
    context: "Table 3-34: Sample Alternate Site Criteria"
    statement: "Two or more organizations with similar or identical system configurations and backup technologies may enter into a formal agreement to serve as alternate sites for each other or enter into a joint contract for an alternate site. This type of site is set up via a reciprocal agreement or memorandum of understanding (MOU). A reciprocal agreement should be entered into carefully because each site must be able to support the other, in addition to its own workload, in the event of a disaster. This type of agreement requires the recovery sequence for the systems from both organizations to be prioritized from a joint perspective, favorable to both parties. Testing should be conducted at the partnering sites to evaluate the extra processing thresholds, compatible system and backup configurations, sufficient telecommunications connections, compatible security measures, and the sensitivity of data that might be accessible by other privileged users, in addition to functionality of the recovery strategy. Consideration should also be given to system interconnections and possible interconnection security agreements (ISAs). NIST SP 800-47, Security Guide for Interconnecting Information Technology Systems, provides guidance for planning, establishing, maintaining, and terminating interconnections between information systems that are owned and operated by different organizations."
    status: "candidate"
  - id: "REQ-SP800-34R1-0173"
    citation: {"ref": "SP800-34R1", "page": 37, "anchor": "An MOU or an SLA for an alternate site should be developed"}
    kind: "modal"
    locator: "3.4.3"
    context: "Table 3-34: Sample Alternate Site Criteria"
    statement: "An MOU or an SLA for an alternate site should be developed specific to the organization’s needs and the partner organization’s capabilities. The legal department of each party must review and approve the agreement. In general, the agreement should address at a minimum, each of the following elements:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0174"
    citation: {"ref": "SP800-34R1", "page": 38, "anchor": "If the information system is damaged or destroyed or the primary site"}
    kind: "modal"
    locator: "3.4.4"
    context: "Equipment Replacement"
    statement: "If the information system is damaged or destroyed or the primary site is unavailable, necessary hardware and software will need to be activated or procured quickly and delivered to the alternate location. Three basic strategies exist to prepare for equipment replacement."
    status: "candidate"
  - id: "REQ-SP800-34R1-0175"
    citation: {"ref": "SP800-34R1", "page": 38, "anchor": "Vendor Agreements. As the contingency plan is being developed, SLAs with hardware,"}
    kind: "modal"
    locator: "3.4.4"
    context: "Equipment Replacement"
    statement: "Vendor Agreements. As the contingency plan is being developed, SLAs with hardware, software, and support vendors may be made for emergency maintenance service. The SLA should specify how quickly the vendor must respond after being notified. The agreement should also give the organization priority status for the shipment of replacement equipment over equipment being purchased for normal operations. SLAs should further discuss what priority status the organization will receive in the event of a catastrophic disaster involving multiple vendor clients. In such cases, organizations with health- and safety-dependent processes will often receive the highest priority for shipment. The details of these negotiations should be documented in the SLA, which should be maintained with the contingency plan."
    status: "candidate"
  - id: "REQ-SP800-34R1-0176"
    citation: {"ref": "SP800-34R1", "page": 39, "anchor": "Equipment Inventory. Required equipment may be purchased in advance and stored at"}
    kind: "modal"
    locator: "3.4.4"
    context: "Equipment Replacement"
    statement: "Equipment Inventory. Required equipment may be purchased in advance and stored at a secure offsite location, such as an alternate site where recovery operations will take place (warm or mobile site) or at another location where they will be stored and then shipped to the alternate site. This solution has certain drawbacks. An organization must commit financial resources to purchase this equipment in advance, and the equipment could become obsolete or unsuitable for use over time because system technologies and requirements change."
    status: "not-a-requirement"
    reason: "Describes the Equipment Inventory option and its drawback: 'An organization must commit financial resources' is the cost of the option, so must binds no one, and 'will take place' is description."
  - id: "REQ-SP800-34R1-0177"
    citation: {"ref": "SP800-34R1", "page": 39, "anchor": "Existing Compatible Equipment. Equipment currently housed and used by the contracted hot"}
    kind: "modal"
    locator: "3.4.4"
    context: "Equipment Replacement"
    statement: "Existing Compatible Equipment. Equipment currently housed and used by the contracted hot site or by another organization within the organization may be used. Agreements made with hot sites and reciprocal internal sites stipulate that similar and compatible equipment will be available for contingency use by the organization."
    status: "not-a-requirement"
    reason: "Describes the Existing Compatible Equipment option: such agreements 'stipulate that similar and compatible equipment will be available'. Will reports what the agreement says, and binds no one by itself; the agreement duty is 0175."
  - id: "REQ-SP800-34R1-0178"
    citation: {"ref": "SP800-34R1", "page": 39, "anchor": "When evaluating the choices, the ISCP Coordinator should consider that purchasing equipment"}
    kind: "should"
    locator: "3.4.4"
    context: "Equipment Replacement"
    statement: "When evaluating the choices, the ISCP Coordinator should consider that purchasing equipment when needed is cost-effective but can add significant overhead time to recovery while waiting for shipment and setup; conversely, storing unused equipment is costly, but allows recovery operations to begin more quickly. When selecting the most appropriate strategy, note that the availability of transportation may be limited or temporarily halted in the event of a catastrophic disaster. Based on impacts discovered through the BIA, consideration should be given to the possibility of a widespread disaster entailing mass equipment replacement and transportation delays that would extend the recovery period. Regardless of the strategy selected, detailed lists of equipment needs and specifications should be maintained within the contingency plan. Documentation of equipment lists is discussed further in Section 4.1."
    status: "candidate"
  - id: "REQ-SP800-34R1-0179"
    citation: {"ref": "SP800-34R1", "page": 39, "anchor": "The ISCP Coordinator should ensure that the strategy chosen can be implemented"}
    kind: "modal"
    locator: "3.4.5"
    context: "Cost Considerations"
    statement: "The ISCP Coordinator should ensure that the strategy chosen can be implemented effectively with available personnel and financial resources. The cost of each type of alternate site, equipment replacement, and storage option under consideration should be weighed against budget limitations. The coordinator should determine known contingency planning expenses, such as alternate site contract fees, and those that are less obvious, such as the cost of implementing an agency-wide contingency awareness program and contractor support. The budget must be sufficient to encompass software, hardware, travel and shipping, testing, plan training programs, awareness programs, labor hours, other contracted services, and any other applicable resources (e.g., desks, telephones, fax machines, pens, and paper). The organization should perform a cost-benefit analysis to identify the optimum contingency strategy. Table provides a template for evaluating cost considerations."
    status: "candidate"
  - id: "REQ-SP800-34R1-0180"
    citation: {"ref": "SP800-34R1", "page": 39, "anchor": "Alternate Site | Cold Site Warm Site Hot Site"}
    kind: "table"
    locator: "3.4.5"
    context: "Table 3-5: Contingency Strategy Budget Planning Template"
    statement: "Alternate Site | Cold Site Warm Site Hot Site"
    status: "not-a-requirement"
    reason: "Table 3-5, a blank budget template, alternate site row; a form."
  - id: "REQ-SP800-34R1-0181"
    citation: {"ref": "SP800-34R1", "page": 39, "anchor": "Offsite Storage | Commercial Internal"}
    kind: "table"
    locator: "3.4.5"
    context: "Table 3-5: Contingency Strategy Budget Planning Template"
    statement: "Offsite Storage | Commercial Internal"
    status: "not-a-requirement"
    reason: "Table 3-5 blank template, offsite storage row; a form."
  - id: "REQ-SP800-34R1-0182"
    citation: {"ref": "SP800-34R1", "page": 39, "anchor": "Equipment Replace-ment | SLA Storage Existing Use"}
    kind: "table"
    locator: "3.4.5"
    context: "Table 3-5: Contingency Strategy Budget Planning Template"
    statement: "Equipment Replace-ment | SLA Storage Existing Use"
    status: "not-a-requirement"
    reason: "Table 3-5 blank template, equipment replacement row; a form."
  - id: "REQ-SP800-34R1-0183"
    citation: {"ref": "SP800-34R1", "page": 40, "anchor": "Having selected and implemented the backup and system recovery strategies, the ISCP"}
    kind: "modal"
    locator: "3.4.6"
    context: "Roles and Responsibilities"
    statement: "Having selected and implemented the backup and system recovery strategies, the ISCP Coordinator must designate appropriate teams to implement the strategy. Each team should be trained and ready to respond in the event of a disruptive situation requiring plan activation. Recovery personnel should be assigned to one of several specific teams that will respond to the event, recover capabilities, and return the system to normal operations. To do so, recovery team members need to clearly understand the team’s recovery effort goal, individual procedures the team will execute, and how interdependencies between recovery teams may affect overall strategies."
    status: "candidate"
  - id: "REQ-SP800-34R1-0184"
    citation: {"ref": "SP800-34R1", "page": 40, "anchor": "The types of teams required are based on the information system affected"}
    kind: "modal"
    locator: "3.4.6"
    context: "Roles and Responsibilities"
    statement: "The types of teams required are based on the information system affected and could be tailored according to FIPS 199 impact levels to reflect specific differences in requirements and backup procedures. The size of each team, team titles, and hierarchy designs depend on the organization. In addition to a single authoritative role for overall decision-making responsibility, including plan activation, a capable strategy will require some or all of the following groups:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0185"
    citation: {"ref": "SP800-34R1", "page": 40, "anchor": "Management team (including the ISCP Coordinator);"}
    kind: "indicative"
    locator: "3.4.6"
    context: "Roles and Responsibilities In addition to a single authoritative role for overall decision-making responsibility, including plan activation, a capable strategy will require some or all of the followin"
    statement: "Management team (including the ISCP Coordinator);"
    status: "not-a-requirement"
    reason: "Noun item 'Management team' under the lead-in at 0184."
  - id: "REQ-SP800-34R1-0186"
    citation: {"ref": "SP800-34R1", "page": 40, "anchor": "Procurement team (equipment and supplies). Personnel should be chosen to staff these"}
    kind: "modal"
    locator: "3.4.6"
    context: "Roles and Responsibilities"
    statement: "Procurement team (equipment and supplies). Personnel should be chosen to staff these teams based on their skills and knowledge. Ideally, teams are staffed with personnel responsible for the same or similar functions under normal conditions. For example, server recovery team members should include the server administrators. Team members must understand not only the contingency plan purpose, but also the procedures necessary for executing the recovery strategy. Teams should be sufficient in size to remain viable if some members are unavailable to respond or alternate team members may be designated. Similarly, team members should be familiar with the goals and procedures of other teams to facilitate cross-team coordination. The ISCP Coordinator should also consider that a disruption could render some personnel unavailable to respond. In this situation, executing the plan may be possible only by using personnel from another geographic area of the organization or by hiring contractors or vendors. Such personnel may be coordinated and trained as an alternate team."
    status: "candidate"
  - id: "REQ-SP800-34R1-0187"
    citation: {"ref": "SP800-34R1", "page": 40, "anchor": "Each team is led by a team leader who directs overall team"}
    kind: "modal"
    locator: "3.4.6"
    context: "Roles and Responsibilities"
    statement: "Each team is led by a team leader who directs overall team operations, acts as the team’s representative to management, and liaises with other team leaders. The team leader disseminates information to team members and approves any decisions that must be made within the team. Team leaders should have a designated alternate to act as the leader if the primary leader is unavailable."
    status: "candidate"
  - id: "REQ-SP800-34R1-0188"
    citation: {"ref": "SP800-34R1", "page": 40, "anchor": "For most systems, a management team is necessary for providing overall guidance"}
    kind: "modal"
    locator: "3.4.6"
    context: "Roles and Responsibilities"
    statement: "For most systems, a management team is necessary for providing overall guidance following a major system disruption or emergency. The team is responsible for activating the contingency plan and supervising the execution of contingency operations. The management team also facilitates communications among other teams and supervises information system contingency plan tests and exercises. Some or all of the management team may lead specialized recovery teams. A senior management official, such as the CIO, has the ultimate authority to activate the plan and to make decisions regarding spending levels, acceptable risk, and interagency coordination. The senior management official typically leads the management team."
    status: "candidate"
  - id: "REQ-SP800-34R1-0189"
    citation: {"ref": "SP800-34R1", "page": 41, "anchor": "An ISCP should be maintained in a state of readiness, which includes"}
    kind: "modal"
    locator: "3.5"
    context: "Plan Testing, Training, and Exercises (TT&E)"
    statement: "An ISCP should be maintained in a state of readiness, which includes having personnel trained to fulfill their roles and responsibilities within the plan, having plans exercised to validate their content, and having systems and system components tested to ensure their operability in the environment specified in the ISCP. In addition, as indicated in Step 4 (Assess Security Controls) of the RMF, the effectiveness of the information system controls should be assessed by using the procedures documented in NIST SP 800- 53A, Guide for Assessing the Security Controls in Federal Information Systems. NIST SP 800-84, Guide to Test, Training and Exercise Programs for Information Technology Plans and Capabilities, provides guidelines on designing, developing, conducting, and evaluating test, training, and exercise (TT&E) events so that organizations can improve their ability to prepare for, respond to, manage, and recover from adverse events. While the majority of TT&E activities occur during the Operations/Maintenance phase, initial TT&E events should be conducted during the Implementation/Assessment phase of the SDLC to validate ISCP recovery procedures."
    status: "candidate"
  - id: "REQ-SP800-34R1-0190"
    citation: {"ref": "SP800-34R1", "page": 41, "anchor": "Organizations should conduct TT&E events periodically, following organizational or system changes, or"}
    kind: "should"
    locator: "3.5"
    context: "Plan Testing, Training, and Exercises (TT&E)"
    statement: "Organizations should conduct TT&E events periodically, following organizational or system changes, or the issuance of new TT&E guidance, or as otherwise needed. Execution of TT&E events assists organizations in determining the plan’s effectiveness, and that all personnel know what their roles are in the conduct of each information system plan. TT&E event schedules are often dictated in part by organizational requirements. For example, NIST SP 800-53 includes a control (CP-4) for federal organizations to conduct exercises or tests for their systems’ contingency plans around an organization-defined frequency. Section 3.5.4 provides guidance on the type of TT&E identified for each FIPS 199 impact level."
    status: "candidate"
  - id: "REQ-SP800-34R1-0191"
    citation: {"ref": "SP800-34R1", "page": 41, "anchor": "For each TT&E activity conducted, results are documented in an after-action report,"}
    kind: "indicative"
    locator: "3.5"
    context: "Plan Testing, Training, and Exercises (TT&E)"
    statement: "For each TT&E activity conducted, results are documented in an after-action report, and Lessons Learned corrective actions are captured for updating information in the ISCP. While NIST SP 800-84 provides detailed information on how to plan and conduct TT&E activities for information systems, the following sections provide summarized details."
    status: "candidate"
  - id: "REQ-SP800-34R1-0192"
    citation: {"ref": "SP800-34R1", "page": 41, "anchor": "ISCP testing is a critical element of a viable contingency capability. Testing"}
    kind: "should"
    locator: "3.5.1"
    context: "Testing"
    statement: "ISCP testing is a critical element of a viable contingency capability. Testing enables plan deficiencies to be identified and addressed by validating one or more of the system components and the operability of the plan. Testing can take on several forms and accomplish several objectives but should be conducted in as close to an operating environment as possible. Each information system component should be tested to confirm the accuracy of individual recovery procedures. The following areas should be addressed in a contingency plan test, as applicable:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0193"
    citation: {"ref": "SP800-34R1", "page": 41, "anchor": "Restoration of normal operations; and"}
    kind: "indicative"
    locator: "3.5.1"
    context: "Testing"
    statement: "Restoration of normal operations; and Other plan testing (where coordination is identified, i.e., COOP, BCP)."
    status: "not-a-requirement"
    reason: "Two noun items of the test areas, glued across the page: 'Restoration of normal operations', 'Other plan testing'. The verb is at 0192."
  - id: "REQ-SP800-34R1-0194"
    citation: {"ref": "SP800-34R1", "page": 42, "anchor": "To derive the most value from the test, the ISCP Coordinator should"}
    kind: "should"
    locator: "3.5.1"
    context: "Testing"
    statement: "To derive the most value from the test, the ISCP Coordinator should develop a test plan designed to examine the selected element(s) against explicit test objectives and success criteria. The use of test objectives and success criteria enable the effectiveness of each system element and the overall plan to be assessed. The test plan should include a schedule detailing the time frames for each test and test participants. The test plan should also clearly delineate scope, scenario, and logistics. The scenario chosen may be a worst-case incident or an incident most likely to occur. It should mimic reality as closely as possible."
    status: "candidate"
  - id: "REQ-SP800-34R1-0195"
    citation: {"ref": "SP800-34R1", "page": 42, "anchor": "Testing Tests are evaluation tools that use quantifiable metrics to validate the"}
    kind: "indicative"
    locator: "3.5.1"
    context: "Testing"
    statement: "Testing Tests are evaluation tools that use quantifiable metrics to validate the operability of an information system or system component in an operational environment. For example, an organization could test call tree lists to determine if calling can be executed within prescribed time limits; another test may be removing power from a system or system component. A test is conducted in as close to an operational environment as possible; if feasible, an actual test of the components or systems used to conduct daily operations for the organization should be used.27 The scope of testing can range from individual system components or systems to comprehensive tests of all systems and components that support an ISCP. Tests often focus on recovery and backup operations; however, testing varies depending on the FIPS 199 impact level, the goal of the test, and its relation to a specific ISCP."
    status: "not-a-requirement"
    reason: "Boxed definition of 'Testing'; 'should be used' repeats the close-to-operational point at 0192, so should adds nothing and binds no new party."
  - id: "REQ-SP800-34R1-0196"
    citation: {"ref": "SP800-34R1", "page": 42, "anchor": "Training for personnel with contingency plan responsibilities should focus on familiarizing them"}
    kind: "modal"
    locator: "3.5.2"
    context: "Training"
    statement: "Training for personnel with contingency plan responsibilities should focus on familiarizing them with ISCP roles and teaching skills necessary to accomplish those roles. This approach helps ensure that staff is prepared to participate in tests and exercises as well as actual outage events. Training should be provided at least annually. Personnel newly appointed to ISCP roles should receive training shortly thereafter. Ultimately, ISCP personnel should be trained to the extent that that they are able to execute their respective recovery roles and responsibilities without aid of the actual ISCP document. This is an important goal in the event that paper or electronic versions of the plan are unavailable for the first few hours, as a result of the disruption. Recovery personnel should be trained on the following plan elements:"
    status: "candidate"
  - id: "REQ-SP800-34R1-0197"
    citation: {"ref": "SP800-34R1", "page": 42, "anchor": "Purpose of the plan;"}
    kind: "indicative"
    locator: "3.5.2"
    context: "Training Recovery personnel should be trained on the following plan elements:"
    statement: "Purpose of the plan;"
    status: "not-a-requirement"
    reason: "Noun item 'Purpose of the plan' under the training lead-in at 0196."
  - id: "REQ-SP800-34R1-0198"
    citation: {"ref": "SP800-34R1", "page": 42, "anchor": "Individual responsibilities (Activation and Notification, Recovery, and Reconstitution Phases)."}
    kind: "modal"
    locator: "3.5.2"
    context: "Training"
    statement: "Individual responsibilities (Activation and Notification, Recovery, and Reconstitution Phases)."
    status: "not-a-requirement"
    reason: "Noun item 'Individual responsibilities' under the same lead-in at 0196; responsibilities here names a training topic and binds no one."
  - id: "REQ-SP800-34R1-0199"
    citation: {"ref": "SP800-34R1", "page": 42, "anchor": "Special consideration should be given to Industrial Control Systems (ICS) where systems"}
    kind: "modal"
    locator: "3.5.2"
    context: "Training"
    statement: "Special consideration should be given to Industrial Control Systems (ICS) where systems typically have a need for real-time response and extremely high availability, predictability, and reliability. Thorough testing of these systems may not be possible during a single testing event. NIST SP 800-53, Appendix I, includes supplemental guidance for ICSs."
    status: "not-applicable"
    reason: "Holds only for an Industrial Control System, one class of fork. No fact records one and no CP item holds it; PER-LSE and PER-ISSE were checked. Footnote 27 points to SP 800-53 Appendix I, a Rev. 3 appendix with no match in the run's catalog."
  - id: "REQ-SP800-34R1-0200"
    citation: {"ref": "SP800-34R1", "page": 43, "anchor": "Training For the purposes of this publication and as documented in NIST"}
    kind: "modal"
    locator: "3.5.2"
    context: "Training"
    statement: "Training For the purposes of this publication and as documented in NIST SP 800-84, training refers only to informing personnel of their roles and responsibilities within a particular information system plan and teaching them skills related to those roles and responsibilities, thereby preparing them for participation in exercises, tests, and actual emergency situations related to the ISCP. Training personnel on their roles and responsibilities before an exercise or test event is typically split between a presentation on their roles and responsibilities and activities that allow personnel to demonstrate their understanding of the subject matter."
    status: "not-a-requirement"
    reason: "Boxed definition of 'training' from SP 800-84: 'informing personnel of their roles and responsibilities'. Responsibilities is the term defined, and binds no one."
  - id: "REQ-SP800-34R1-0201"
    citation: {"ref": "SP800-34R1", "page": 43, "anchor": "Tabletop Exercises. Tabletop exercises are discussion-based exercises where personnel meet in a"}
    kind: "modal"
    locator: "3.5.3"
    context: "Exercises NIST SP 800-84 identifies the following types of exercises widely used in information system TT&E programs by single organizations:"
    statement: "Tabletop Exercises. Tabletop exercises are discussion-based exercises where personnel meet in a classroom setting or in breakout groups to discuss their roles during an emergency and their responses to a particular emergency situation. A facilitator presents a scenario and asks the exercise participants questions related to the scenario, which initiates a discussion among the participants of roles, responsibilities, coordination, and decision making. A tabletop exercise is discussion-based only and does not involve deploying equipment or other resources."
    status: "not-a-requirement"
    reason: "Defines tabletop exercises; 'roles, responsibilities, coordination' is what is discussed, so responsibilities assigns nothing. The duty by impact level is 0206."
  - id: "REQ-SP800-34R1-0202"
    citation: {"ref": "SP800-34R1", "page": 43, "anchor": "Functional Exercises. Functional exercises allow personnel to validate their operational readiness for"}
    kind: "modal"
    locator: "3.5.3"
    context: "Exercises"
    statement: "Functional Exercises. Functional exercises allow personnel to validate their operational readiness for emergencies by performing their duties in a simulated operational environment. Functional exercises are designed to exercise the roles and responsibilities of specific team members, procedures, and assets involved in one or more functional aspects of a plan (e.g., communications, emergency notifications, system equipment setup). Functional exercises vary in complexity and scope, from validating specific aspects of a plan to full-scale exercises that address all plan elements.28 Functional exercises allow staff to execute their roles and responsibilities as they would in an actual emergency situation, but in a simulated manner."
    status: "not-a-requirement"
    reason: "Defines functional exercises; responsibilities is what such an exercise exercises and assigns nothing. The duty is 0207."
  - id: "REQ-SP800-34R1-0203"
    citation: {"ref": "SP800-34R1", "page": 43, "anchor": "Exercises An exercise is a simulation of an emergency designed to validate"}
    kind: "modal"
    locator: "3.5.3"
    context: "Exercises"
    statement: "Exercises An exercise is a simulation of an emergency designed to validate the viability of one or more aspects of an ISCP. In an exercise, personnel with roles and responsibilities in a particular ISCP meet to validate the content of a plan through discussion of their roles and their responses to emergency situations, execution of responses in a simulated operational environment, or other means of validating responses that do not involve using the actual operational environment. Exercises are scenario-driven, such as a power failure in one of the organization’s data centers or a fire causing certain systems to be damaged, with additional situations often being presented during the course of an exercise."
    status: "not-a-requirement"
    reason: "Boxed definition of 'exercise'; 'personnel with roles and responsibilities' describes participants, so responsibilities binds no one."
  - id: "REQ-SP800-34R1-0204"
    citation: {"ref": "SP800-34R1", "page": 43, "anchor": "A TT&E program provides an overall framework for determining, scheduling, and setting"}
    kind: "indicative"
    locator: "3.5.4"
    context: "TT&E Program Summary"
    statement: "A TT&E program provides an overall framework for determining, scheduling, and setting objectives for TT&E activities. Guidance on establishing an effective ISCP TT&E program and the various methods and approaches for conducting TT&E activities is provided in NIST SP 800-84. The depth and rigor of ISCP TT&E activities increases with the FIPS 199 availability security objective. All tests and exercises should include some kind of determination of the effects on the organization’s operations and provide for a mechanism to update and improve the plan as a result."
    status: "candidate"
  - id: "REQ-SP800-34R1-0205"
    citation: {"ref": "SP800-34R1", "page": 43, "anchor": "Planned and unplanned maintenance activities may also present opportunities to execute and"}
    kind: "indicative"
    locator: "3.5.4"
    context: "TT&E Program Summary"
    statement: "Planned and unplanned maintenance activities may also present opportunities to execute and document a Functional Exercise. This is often applicable to operational systems (such as ICS) where it may be otherwise disruptive to test certain aspects of the system or contingency plan. NIST SP 800-53, Appendix I, contains supplemental guidance."
    status: "not-a-requirement"
    reason: "Footnote 28, advisory: maintenance 'may also present opportunities' for an exercise; a tip."
  - id: "REQ-SP800-34R1-0206"
    citation: {"ref": "SP800-34R1", "page": 44, "anchor": "For low-impact systems, a tabletop exercise at an organization-defined frequency is sufficient."}
    kind: "should"
    locator: "3.5.4"
    context: "TT&E Program Summary"
    statement: "For low-impact systems, a tabletop exercise at an organization-defined frequency is sufficient. The tabletop should simulate a disruption, include all main ISCP points of contact, and be conducted by the system owner or responsible authority."
    status: "candidate"
  - id: "REQ-SP800-34R1-0207"
    citation: {"ref": "SP800-34R1", "page": 44, "anchor": "For moderate-impact systems, a functional exercise at an organization-defined frequency should be"}
    kind: "should"
    locator: "3.5.4"
    context: "TT&E Program Summary"
    statement: "For moderate-impact systems, a functional exercise at an organization-defined frequency should be conducted. The functional exercise should include all ISCP points of contact and be facilitated by the system owner or responsible authority. Exercise procedures should be developed to include an element of system recovery from backup media."
    status: "candidate"
  - id: "REQ-SP800-34R1-0208"
    citation: {"ref": "SP800-34R1", "page": 44, "anchor": "For high-impact systems, a full-scale functional exercise at an organization-defined frequency should"}
    kind: "should"
    locator: "3.5.4"
    context: "TT&E Program Summary"
    statement: "For high-impact systems, a full-scale functional exercise at an organization-defined frequency should be conducted. The full-scale functional exercise should include a system failover to the alternate location. This could include additional activities such as full notification and response of key personnel to the recovery location, recovery of a server or database from backup media or setup, and processing from a server at an alternate location. The test should also include a full recovery and reconstitution of the information system to a known state."
    status: "candidate"
