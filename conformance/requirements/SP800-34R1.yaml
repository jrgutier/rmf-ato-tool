requirements:
  - id: "REQ-SP800-34R1-0001"
    citation: {"ref": "SP800-34R1", "page": 13, "anchor": "NIST Special Publication 800-34, Rev. 1, Contingency Planning Guide for Federal Information"}
    kind: "indicative"
    locator: "Executive Summary"
    context: ""
    statement: "NIST Special Publication 800-34, Rev. 1, Contingency Planning Guide for Federal Information Systems, provides instructions, recommendations, and considerations for federal information system contingency planning. Contingency planning refers to interim measures to recover information system services after a disruption. Interim measures may include relocation of information systems and operations to an alternate site, recovery of information system functions using alternate equipment, or performance of information system functions using manual methods. This guide addresses specific contingency planning recommendations for three platform types and provides strategies and techniques common to all systems."
    status: "not-a-requirement"
    reason: "Opening of the executive summary: says what the guide 'provides', defines contingency planning, and 'interim measures may include' lists options. It describes the topic and asks nothing."
  - id: "REQ-SP800-34R1-0002"
    citation: {"ref": "SP800-34R1", "page": 13, "anchor": "This guide defines the following seven-step contingency planning process that an organization"}
    kind: "indicative"
    locator: "Executive Summary"
    context: ""
    statement: "This guide defines the following seven-step contingency planning process that an organization may apply to develop and maintain a viable contingency planning program for their information systems. These seven progressive steps are designed to be integrated into each stage of the system development life cycle."
    status: "not-a-requirement"
    reason: "Lead-in to the seven steps: 'an organization may apply' offers a process, and the duties sit in the steps themselves, 0003 to 0009."
