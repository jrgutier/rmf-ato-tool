    statement: "(2) The analysis will also consider the continuation of non-materiel initiatives, the extension of science and technology developments related to the fielded capability, and the completion of MDA-approved and funded materiel improvements."
    status: "deferred"
    reason: "'The analysis will also consider the continuation of non-materiel initiatives', S&T extension and funded improvements: further analysis content, none of it an RMF input or output."
  - id: "REQ-DODI5000.81-0108"
    citation: {"ref": "DODI5000.81", "page": 17, "anchor": "The disposition official will recommend one of the following options:"}
