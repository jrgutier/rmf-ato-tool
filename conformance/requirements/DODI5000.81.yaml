  - id: "REQ-DODI5000.81-0065"
    citation: {"ref": "DODI5000.81", "page": 13, "anchor": "ASSESSMENT APPROACH"}
    kind: "table"
    locator: "4.2"
    context: "Table 1. Information Requirements Unique to Urgent Capability Acquisition Process"
    statement: "ASSESSMENT APPROACH STATUTORY; only required for programs responding to urgent capability acquisitions. - For programs under DOT&E oversight, operational and live fire test plans will be submitted to DOT&E for approval at the Development Milestone; post-deployment assessment plans will be submitted to DOT&E for approval at the Production and Deployment Milestone. DOT&E will ensure that testing is rigorous enough to rapidly evaluate critical operational issues. Test Plans submitted for DOT&E approval are required to be delivered 60 days before the start of testing. - Programs not under DOT&E oversight are approved at the Service level; the program may require a rapid and focused operational assessment and live fire testing (if applicable) prior to deploying an urgent need solution. The Acquisition Approach will identify any requirements to evaluate health, safety, operational effectiveness, suitability, environmental factors, supportability and survivability. | ● | ● | Section 2366 of Title 10, U.S.C. (see DoDI 5000.02) Section 2399 of Title 10 U.S.C. (see DoDI 5000.02)"
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.81-0066"
    citation: {"ref": "DODI5000.81", "page": 13, "anchor": "COURSE OF ACTION ANALYSIS"}
    kind: "table"
    locator: "4.2"
    context: "Table 1. Information Requirements Unique to Urgent Capability Acquisition Process"
    statement: "COURSE OF ACTION ANALYSIS STATUTORY; replaces and serves as the Analysis of Alternatives. Approved by the MDA. For JUONs, JEONs, critical warfighter issues identified by the Warfighter SIG, and SecDef or DepSecDef RAA determinations, a copy is due to the Executive Director, JRAC, within 3 business days of MDA approval. RAA RECOMMENDATION STATUTORY. Optional request to the SecDef or DepSecDef for RAA. Considered as part of the development of the Acquisition Strategy. MDA approves the decision to request RAA at the Development Milestone. REGULATORY REQUIREMENT | ● | Meets the assessment requirements of Subtitle III of Title 40, U.S.C."
    status: "deferred"
    reason: "Table 1 rows: 'COURSE OF ACTION ANALYSIS ... Approved by the MDA', 'a copy is due to the Executive Director, JRAC, within 3 business days', and 'MDA approves the decision to request RAA'. COA and RAA paperwork at the Development decision; no RMF run consumes or produces either."
  - id: "REQ-DODI5000.81-0067"
    citation: {"ref": "DODI5000.81", "page": 13, "anchor": "Disposition Authority’s Report to"}
    kind: "table"
    locator: "4.2"
    context: "Table 1. Information Requirements Unique to Urgent Capability Acquisition Process"
    statement: "Disposition Authority’s Report to the DoD Component Head Regulatory. Based on the disposition official’s recommendation in the Disposition Analysis, the Component Head will determine and document the disposition of the initiative and process it in accordance with applicable Component and requirements authority procedures Table Notes: 1. A dot (●) in a cell indicates the specific applicability of the requirement to the life-cycle event 2. Documentation required for the identified events will be submitted no later than 45 calendar days before the planned review. 3. While these requirements are specific to programs responding to urgent operational needs, they are additive to the requirements identified in Tables 2 and 6 DoDI 5000.02. (See https://www.dau.edu/mdid/Pages/Default.aspx ) | Para. 4.5.e. of this issuance"
    status: "candidate"
