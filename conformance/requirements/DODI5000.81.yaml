    context: "O&S"
    statement: "(1) The disposition analysis will consider the performance of the fielded capability, mishap data, long term operational needs, and the relationship of the capability to the component’s current and planned inventory of equipment."
    status: "deferred"
    reason: "'The disposition analysis will consider the performance of the fielded capability, mishap data, long term operational needs' and inventory fit: the content of an acquisition analysis, which no RMF run reads."
  - id: "REQ-DODI5000.81-0107"
    citation: {"ref": "DODI5000.81", "page": 17, "anchor": "The analysis will also consider the continuation of non-materiel initiatives, the extension"}
    kind: "lettered"
