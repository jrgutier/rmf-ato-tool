requirements:
  - id: "REQ-DODI5000.81-0001"
    citation: {"ref": "DODI5000.81", "page": 3, "anchor": "1.1. APPLICABILITY. This issuance applies to OSD, the Military Departments, the Office"}
    kind: "indicative"
    locator: "SECTION 1: GENERAL ISSUANCE INFORMATION"
    context: ""
    statement: "1.1. APPLICABILITY. This issuance applies to OSD, the Military Departments, the Office of the Chairman of the Joint Chiefs of Staff (CJCS) and the Joint Staff, the Combatant Commands, the Office of the Inspector General of the Department of Defense, the Defense Agencies, the DoD Field Activities, and all other organizational entities within the DoD (referred to collectively in this issuance as the “DoD Components”)."
    status: "not-a-requirement"
    reason: "Applicability clause: 'This issuance applies to' the DoD Components says who the issuance reaches and names no act to perform."
  - id: "REQ-DODI5000.81-0002"
    citation: {"ref": "DODI5000.81", "page": 3, "anchor": "It is DoD’s highest priority to provide warfighters involved in conflict or"}
    kind: "lettered"
    locator: "1.2.a"
    context: "POLICY"
    statement: "a. It is DoD’s highest priority to provide warfighters involved in conflict or preparing for imminent contingency operations with the capabilities needed to overcome unforeseen threats, achieve mission success, and reduce risk of casualties, as described in DoDD 5000.71."
    status: "not-a-requirement"
    reason: "Policy declaration: 'It is DoD's highest priority' states an aim for warfighters and points to DoDD 5000.71; it has no actor and no act."
  - id: "REQ-DODI5000.81-0003"
    citation: {"ref": "DODI5000.81", "page": 3, "anchor": "The estimated cost for acquisition programs that provide capabilities to fulfill urgent"}
    kind: "lettered"
    locator: "1.2.b"
    context: "POLICY"
    statement: "b. The estimated cost for acquisition programs that provide capabilities to fulfill urgent operational needs and other quick reaction capabilities that can be fielded in less than 2 years must not exceed $525 million in research, development, and test and evaluation, or $3.065 billion for procurements in Fiscal Year 2020 constant dollars."
    status: "deferred"
    reason: "Cost ceiling: 'The estimated cost ... must not exceed' $525 million RDT&E or $3.065 billion procurement sets who may use the pathway. It is acquisition cost substance; no RMF run reads a program's estimated cost or produces anything for this test."
  - id: "REQ-DODI5000.81-0004"
    citation: {"ref": "DODI5000.81", "page": 3, "anchor": "1.3. INFORMATION COLLECTIONS. The urgent capability acquisition process information requirements, referred to"}
    kind: "modal"
    locator: "1.2.b"
    context: "POLICY"
    statement: "1.3. INFORMATION COLLECTIONS. The urgent capability acquisition process information requirements, referred to in Section 4, do not require licensing with a report control symbol in accordance with Paragraph 1.a.(10) in Enclosure 3 of Volume 1 of DoD Manual 8910.01."
    status: "not-a-requirement"
    reason: "Exemption note: the information requirements 'do not require licensing' with a report control symbol. It lifts a licensing step and asks nothing of anyone."
  - id: "REQ-DODI5000.81-0005"
    citation: {"ref": "DODI5000.81", "page": 3, "anchor": "1.4. DEFENSE ACQUISITION SYSTEM REALIGNMENT PLAN. The overarching management principles that guide"}
    kind: "modal"
    locator: "1.2.b"
    context: "POLICY"
    statement: "1.4. DEFENSE ACQUISITION SYSTEM REALIGNMENT PLAN. The overarching management principles that guide the defense acquisition system are described in DoDD 5000.01 and DoD Instruction (DoDI) 5000.02. The defense acquisition system supports the National Defense Strategy through the development of a lethal and effective force based on U.S. technological innovation and a culture of performance that yields decisive and sustained U.S. military advantage. To achieve that objective, the DoD will employ an adaptive acquisition framework comprised of acquisition pathways, each tailored for the unique characteristics of the capability being acquired. This issuance describes the responsibilities of principal acquisition officials and the purpose and key characteristics of the Urgent Capability Acquisition process pathway."
    status: "not-a-requirement"
    reason: "Background on the defense acquisition system: in 'the DoD will employ an adaptive acquisition framework' the word will describes the Department's approach, with no addressee and no act anyone could perform, so it binds no one; the last sentence says what this issuance describes."
  - id: "REQ-DODI5000.81-0006"
    citation: {"ref": "DODI5000.81", "page": 5, "anchor": "Is the Defense Acquisition Executive (DAE), and develops processes and procedures to"}
    kind: "lettered"
    locator: "2.1.a"
    context: "UNDER SECRETARY OF DEFENSE FOR ACQUISITION AND SUSTAINMENT The USD(A&S):"
    statement: "a. Is the Defense Acquisition Executive (DAE), and develops processes and procedures to enable urgent capability acquisitions and communicates updates to procedures to the acquisition workforce, as appropriate."
    status: "deferred"
    reason: "'The USD(A&S) ... develops processes and procedures to enable urgent capability acquisitions' is the DAE's department-level acquisition process duty. No RMF run consumes those procedures or feeds them."
