    context: "DEVELOPMENT Entry The MDA will:"
    statement: "1. TEMPs are usually not appropriate for efforts using urgent capability acquisition procedures when there is minimal development work and minimal test and evaluation to execute. Some test planning is usually required, however, in collaboration with the supporting developmental or operational test organization. The MDA may require a highly-tailored and abbreviated test plan. The abbreviated test plan will describe a performance assessment approach that will include schedule, test types and environment, and assets required."
