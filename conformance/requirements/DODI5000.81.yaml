    statement: "2. A TEMP is also not normally required if the urgent capability acquisition effort is under DOT&E oversight. The PM, in collaboration with the supporting operational test organization, should prepare operational and live fire test plans for DOT&E approval, however. An operational test plan for the required pre-deployment performance assessment is generally adequate."
