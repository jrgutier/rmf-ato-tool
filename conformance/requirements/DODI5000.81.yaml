    statement: "(b) Sustainment for Current Contingency. Operation and sustainment of the capability will continue for the current contingency. Multiple sustainment decisions may be made should the capability require operations and support longer than two years; however, such sustainment decisions will be made and re-documented at least every two years. The sustained capability will continue to receive the same priority of action as the original acquisition program. This recommendation will be coordinated with the requirements validation authority."
    status: "deferred"
    reason: "'sustainment decisions will be made and re-documented at least every two years' with coordination by the validation authority: a recurring acquisition sustainment decision. It is independent of the ATO period, and no RMF run consumes it."
