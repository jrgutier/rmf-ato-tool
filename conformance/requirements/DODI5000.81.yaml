    statement: "(a) Termination: Demilitarization or Disposal. The capability will be demilitarized and disposed of in accordance with all legal and regulatory requirements and policy related to safety (including explosive safety) and the environment. The recommendation will be coordinated with the DoD Component or, for JUONs and JEONs, the Combatant Commands."
    status: "candidate"
  - id: "REQ-DODI5000.81-0110"
    citation: {"ref": "DODI5000.81", "page": 17, "anchor": "Sustainment for Current Contingency. Operation and sustainment of the capability will continue"}
