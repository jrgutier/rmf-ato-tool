    reason: "'The disposition official will recommend one of the following options': a recommendation to the Component head. A run acts on the determination that follows (REQ-DODI5000.81-0115), not on this recommendation."
  - id: "REQ-DODI5000.81-0109"
    citation: {"ref": "DODI5000.81", "page": 17, "anchor": "Termination: Demilitarization or Disposal. The capability will be demilitarized and disposed of"}
