    reason: "'The PM or the user community may propose urgently needed improvements': which acquisition route and requirement document an improvement takes. The change itself would come to M-1 as EXT-CHANGE-REQUESTS whatever the route, so the route has no RMF input or output."
  - id: "REQ-DODI5000.81-0104"
    citation: {"ref": "DODI5000.81", "page": 17, "anchor": "In collaboration with the original requesting DoD Component, a post-deployment assessment will"}
    kind: "lettered"
    locator: "4.5.d"
    context: "O&S"
    statement: "d. In collaboration with the original requesting DoD Component, a post-deployment assessment will be conducted after deployment. If practical, the PM will conduct the assessment in the field by the supporting operational test organization. If not practical, the PM may use alternate means for this assessment to include PM or operational test agency assessment of user feedback or other DoD Component feedback. Post-deployment assessment approaches for all programs under DOT&E oversight will be independently reviewed and approved by DOT&E."
    status: "deferred"
    reason: "'a post-deployment assessment will be conducted after deployment' by the PM with the test organization: an operational performance assessment. It is test substance with no cybersecurity content stated, and no M task takes test results as input, so no RMF run consumes it."
  - id: "REQ-DODI5000.81-0105"
    citation: {"ref": "DODI5000.81", "page": 17, "anchor": "No later than 1 year after the program enters O&S (or earlier"}
    kind: "lettered"
    locator: "4.5.e"
    context: "O&S"
    statement: "e. No later than 1 year after the program enters O&S (or earlier if directed by the DoD Component), the DoD Component will appoint an official to conduct a disposition analysis. The DoD Component will notify the Executive Director, JRAC and the Deputy Director for Requirements and Capability Development in the Joint Staff J-8, when the disposition analyses for JUONs, JEONs, critical warfighter issues identified by the Warfighter SIG, or SecDef or DepSecDef RAA determinations are to be completed."
    status: "deferred"
    reason: "'No later than 1 year after the program enters O&S ... the DoD Component will appoint an official to conduct a disposition analysis' and notify JRAC and J-8: a timed acquisition step. A run consumes the final determination, not this appointment or notice."
