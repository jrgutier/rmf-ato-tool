  - {"page": 4, "locator": "", "reason": "leader", "text": "APPENDIX A TERMS AND DEFINITIONS...............................................................................7"}
  - {"page": 4, "locator": "", "reason": "leader", "text": "APPENDIX B REFERENCES ...............................................................................................9"}
  - {"page": 5, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "Information is categorized according to its information type. An information type is a specific category of information (e.g., privacy, medical, proprietary, financial, investigative, contractor sensitive, security management) defined by an organization or, in some instances, by a specific law, Executive Order, directive, policy, or regulation."}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "short", "text": "Security Objectives"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "lead-in", "text": "The FISMA defines three security objectives for information and information systems:"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "“Preserving authorized restrictions on information access and disclosure, including means for protecting personal privacy and proprietary information...” [44 U.S.C., Sec. 3542]"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "A loss of confidentiality is the unauthorized disclosure of information."}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "“Guarding against improper information modification or destruction, and includes ensuring information non-repudiation and authenticity...” [44 U.S.C., Sec. 3542]"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "A loss of integrity is the unauthorized modification or destruction of information."}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "“Ensuring timely and reliable access to and use of information...” [44 U.S.C., SEC. 3542]"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "A loss of availability is the disruption of access to or use of information or an information system."}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "Potential Impact on Organizations and Individuals"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "The potential impact is LOW if—"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "AMPLIFICATION: A limited adverse effect means that, for example, the loss of confidentiality, integrity, or availability might: (i) cause a degradation in mission capability to an extent and duration that the organization is able to perform its primary functions, but the effectiveness of the functions is noticeably reduced; (ii) result in minor damage to organizational assets; (iii) result in minor financial loss; or (iv) result in minor harm to individuals."}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "The potential impact is MODERATE if—"}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "AMPLIFICATION: A serious adverse effect means that, for example, the loss of confidentiality, integrity, or availability might: (i) cause a significant degradation in mission capability to an extent and duration that the organization is able to perform its primary functions, but the effectiveness of the functions is significantly reduced; (ii) result in significant damage to organizational assets; (iii) result in significant financial loss; or (iv) result in significant harm to individuals that does not involve loss of life or serious life threatening injuries."}
  - {"page": 6, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "Adverse effects on individuals may include, but are not limited to, loss of the privacy to which individuals are entitled under law."}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "The potential impact is HIGH if—"}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "AMPLIFICATION: A severe or catastrophic adverse effect means that, for example, the loss of confidentiality, integrity, or availability might: (i) cause a severe degradation in or loss of mission capability to an extent and duration that the organization is not able to perform one or more of its primary functions; (ii) result in major damage to organizational assets; (iii) result in major financial loss; or (iv) result in severe or catastrophic harm to individuals involving loss of life or serious life threatening injuries."}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "Security Categorization Applied to Information Types"}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "lead-in", "text": "The generalized format for expressing the security category, SC, of an information type is:"}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "not-a-statement", "text": "EXAMPLE 1: An organization managing public information on its web server determines that there is no potential impact from a loss of confidentiality (i.e., confidentiality requirements are not applicable), a moderate potential impact from a loss of integrity, and a moderate potential impact from a loss of availability. The resulting security category, SC, of this information type is expressed as:"}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "SC public information = {(confidentiality, NA), (integrity, MODERATE), (availability, MODERATE)}."}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "not-a-statement", "text": "EXAMPLE 2: A law enforcement organization managing extremely sensitive investigative information determines that the potential impact from a loss of confidentiality is high, the potential impact from a loss of integrity is moderate, and the potential impact from a loss of availability is moderate. The resulting security category, SC, of this information type is expressed as:"}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "SC investigative information = {(confidentiality, HIGH), (integrity, MODERATE), (availability, MODERATE)}."}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "not-a-statement", "text": "EXAMPLE 3: A financial organization managing routine administrative information (not privacy-related information) determines that the potential impact from a loss of confidentiality is low, the potential impact from a loss of integrity is low, and the potential impact from a loss of availability is low. The resulting security category, SC, of this information type is expressed as:"}
  - {"page": 7, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "SC administrative information = {(confidentiality, LOW), (integrity, LOW), (availability, LOW)}."}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "Security Categorization Applied to Information Systems"}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "lead-in", "text": "The generalized format for expressing the security category, SC, of an information system is:"}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "not-a-statement", "text": "EXAMPLE 4: An information system used for large acquisitions in a contracting organization contains both sensitive, pre-solicitation phase contract information and routine administrative information. The management within the contracting organization determines that: (i) for the sensitive contract information, the potential impact from a loss of confidentiality is moderate, the potential impact from a loss of integrity is moderate, and the potential impact from a loss of availability is low; and (ii) for the routine administrative information (non-privacy-related information), the potential impact from a loss of confidentiality is low, the potential impact from a loss of integrity is low, and the potential impact from a loss of availability is low. The resulting security categories, SC, of these information types are expressed as:"}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "SC contract information = {(confidentiality, MODERATE), (integrity, MODERATE), (availability, LOW)},"}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "short", "text": "and"}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "SC administrative information = {(confidentiality, LOW), (integrity, LOW), (availability, LOW)}."}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "lead-in", "text": "The resulting security category of the information system is expressed as:"}
  - {"page": 8, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "representing the high water mark or maximum potential impact values for each security objective from the information types resident on the acquisition system."}
  - {"page": 9, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "not-a-statement", "text": "EXAMPLE 5: A power plant contains a SCADA (supervisory control and data acquisition) system controlling the distribution of electric power for a large military installation. The SCADA system contains both real-time sensor data and routine administrative information. The management at the power plant determines that: (i) for the sensor data being acquired by the SCADA system, there is no potential impact from a loss of confidentiality, a high potential impact from a loss of integrity, and a high potential impact from a loss of availability; and (ii) for the administrative information being processed by the system, there is a low potential impact from a loss of confidentiality, a low potential impact from a loss of integrity, and a low potential impact from a loss of availability. The resulting security categories, SC, of these information types are expressed as:"}
  - {"page": 9, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "SC sensor data = {(confidentiality, NA), (integrity, HIGH), (availability, HIGH)},"}
  - {"page": 9, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "short", "text": "and"}
  - {"page": 9, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "no-marker", "text": "SC administrative information = {(confidentiality, LOW), (integrity, LOW), (availability, LOW)}."}
  - {"page": 9, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "lead-in", "text": "The resulting security category of the information system is initially expressed as:"}
  - {"page": 10, "locator": "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS", "reason": "not-a-statement", "text": "Table 1 summarizes the potential impact definitions for each security objective—confidentiality, integrity, and availability."}
