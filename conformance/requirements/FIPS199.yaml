    locator: ""
    context: "FOREWORD"
    statement: "The Federal Information Processing Standards Publication Series of the National Institute of Standards and Technology (NIST) is the official series of publications relating to standards and guidelines adopted and promulgated under the provisions of Section 5131 of the Information Technology Management Reform Act of 1996 (Public Law 104-106) and the Federal Information Security Management Act of 2002 (Public Law 107-347). These mandates have given the Secretary of Commerce and NIST important responsibilities for improving the utilization and management of computer and related telecommunications systems in the federal government. The NIST, through its Information Technology Laboratory, provides leadership, technical guidance, and coordination of government efforts in the development of standards and guidelines in these areas."
    status: "not-a-requirement"
    reason: "Foreword: what the FIPS series is, and that the mandates 'have given the Secretary of Commerce and NIST important responsibilities'. Those responsibilities are a history of NIST's mandate and bind no reader."
