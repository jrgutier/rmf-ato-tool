  - id: "REQ-FIPS199-0022"
    citation: {"ref": "FIPS199", "page": 8, "anchor": "It is recognized that information systems are composed of both programs and"}
    kind: "modal"
    locator: "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS"
    context: "AVAILABILITY"
    statement: "It is recognized that information systems are composed of both programs and information. Programs in execution within an information system (i.e., system processes) facilitate the processing, storage, and transmission of information and are necessary for the organization to conduct its essential mission-related functions and operations. These system processing functions also require protection and could be subject to security categorization as well. However, in the interest of simplification, it is assumed that the security categorization of all information types associated with the information system provide an appropriate worst case potential impact for the overall information system—thereby obviating the need to consider the system processes in the security categorization of the information system."
    status: "not-a-requirement"
    reason: "Footnote 5, a simplifying assumption: 'These system processing functions also require protection and could be subject to security categorization', but it 'is assumed' the information types give the worst case, 'obviating the need'. That require is withdrawn in the same note, so it binds no one."
