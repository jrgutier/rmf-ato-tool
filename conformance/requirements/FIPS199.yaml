  - id: "REQ-FIPS199-0007"
    citation: {"ref": "FIPS199", "page": 5, "anchor": "FIPS Publication 199 addresses the first task cited—to develop standards for categorizing"}
    kind: "modal"
    locator: "1 PURPOSE"
    context: "Title III of the E-Government Act, entitled the Federal Information Security Management Act of 2002 (FISMA), tasked NIST with responsibilities for standards and guidelines, including the development o"
    statement: "FIPS Publication 199 addresses the first task cited—to develop standards for categorizing information and information systems. Security categorization standards for information and information systems provide a common framework and understanding for expressing security that, for the federal government, promotes: (i) effective management and oversight of information security programs, including the coordination of information security efforts throughout the civilian, national security, emergency preparedness, homeland security, and law enforcement communities; and (ii) consistent reporting to the Office of Management and Budget (OMB) and Congress on the adequacy and effectiveness of information security policies, procedures, and practices. Subsequent NIST standards and guidelines will address the second and third tasks cited."
    status: "not-a-requirement"
    reason: "Purpose: this standard 'addresses the first task cited', and 'Subsequent NIST standards and guidelines will address the second and third tasks'. That will is a forecast of NIST's publishing, and binds no one in a run."
  - id: "REQ-FIPS199-0008"
    citation: {"ref": "FIPS199", "page": 5, "anchor": "These standards shall apply to: (i) all information within the federal government"}
    kind: "modal"
    locator: "2 APPLICABILITY"
    context: ""
    statement: "These standards shall apply to: (i) all information within the federal government other than that information that has been determined pursuant to Executive Order 12958, as amended by Executive Order 13292, or any predecessor order, or by the Atomic Energy Act of 1954, as amended, to require protection against unauthorized disclosure and is marked to indicate its classified status; and (ii) all federal information systems other than those information systems designated as national security systems as defined in 44 United States Code Section 3542(b)(2). Agency officials shall use the security categorizations described in FIPS Publication 199 whenever there is a federal requirement to provide such a categorization of information or information systems. Additional security designators may be developed and used at agency discretion. State, local, and tribal governments as well as private sector organizations comprising the critical infrastructure of the United States may consider the use of these standards as appropriate. These standards are effective upon approval by the Secretary of Commerce."
    status: "candidate"
  - id: "REQ-FIPS199-0009"
    citation: {"ref": "FIPS199", "page": 5, "anchor": "This publication establishes security categories for both information1 and information systems. The"}
    kind: "modal"
    locator: "3 CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS"
    context: ""
    statement: "This publication establishes security categories for both information1 and information systems. The security categories are based on the potential impact on an organization should certain events occur which jeopardize the information and information systems needed by the organization to accomplish its assigned mission, protect its assets, fulfill its legal responsibilities, maintain its day-to-day functions, and protect individuals. Security categories are to be used in conjunction with vulnerability and threat information in assessing the risk to an organization."
    status: "candidate"
