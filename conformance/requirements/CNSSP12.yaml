  - id: "REQ-CNSSP12-0015"
    citation: {"ref": "CNSSP12", "page": 6, "anchor": "AOs, acquisition managers, program managers, architects, designers, system engineers, developers, integrators, planners,"}
    kind: "lettered"
    locator: "8"
    context: "SECTION IV- POLICY"
    statement: "8. AOs, acquisition managers, program managers, architects, designers, system engineers, developers, integrators, planners, operators, maintainers, trainers, cybersecurity subject matter experts, and end users of applicable systems must ensure cybersecurity requirements are integrated and applied throughout the life cycle of space NSS and services as part of a holistic systems engineering approach. National Institute of Standards and Technology Special Publication 800-160 (NIST SP 800-160), Systems Security Engineering (Reference k), provides a guide for effectively integrating systems security engineering principles, concepts, and activities in to established systems engineering processes."
    status: "candidate"
  - id: "REQ-CNSSP12-0016"
    citation: {"ref": "CNSSP12", "page": 6, "anchor": "Space NSS and services must incorporate cybersecurity monitoring, auditing, and recovery measures"}
    kind: "lettered"
    locator: "9"
    context: "SECTION IV- POLICY"
    statement: "9. Space NSS and services must incorporate cybersecurity monitoring, auditing, and recovery measures to report related events to the cognizant AO and operations organizations."
    status: "candidate"
  - id: "REQ-CNSSP12-0017"
    citation: {"ref": "CNSSP12", "page": 6, "anchor": "I 0. Space NSS and services (singularly or as a system-of-systems) and"}
    kind: "modal"
    locator: "9"
    context: "SECTION IV- POLICY"
    statement: "I 0. Space NSS and services (singularly or as a system-of-systems) and their supporting infrastructure must be designed to adapt to evolving cybersecurity threats and operate through related attacks to the extent necessary to successfully execute national security missions. This capability must be periodically verified by initial/ongoing assessments, realistic tests, exercises, and/or modeling/simulation by the cognizant Departments and Agencies to ensure these systems have the requisite cybersecurity capabilities to successfully support operations as needed."
    status: "candidate"
  - id: "REQ-CNSSP12-0018"
    citation: {"ref": "CNSSP12", "page": 6, "anchor": "Foreign access to U.S. space capabilities and release of communications security (COMSEC)"}
    kind: "lettered"
    locator: "11"
    context: "SECTION IV- POLICY"
    statement: "11. Foreign access to U.S. space capabilities and release of communications security (COMSEC) and other cybersecurity products to foreign governments must be controlled in accordance with PL 107-296 (Reference e) and Committee on National Security Systems"
    status: "candidate"
  - id: "REQ-CNSSP12-0019"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "All acquisitions, contracts, agreements, and leases; bilateral and multilateral foreign government agreements;"}
    kind: "lettered"
    locator: "12"
    context: "CNSSP 12"
    statement: "12. All acquisitions, contracts, agreements, and leases; bilateral and multilateral foreign government agreements; and USG interagency agreements involving applicable systems must contain clauses that enforce the requirements contained in this policy."
    status: "candidate"
  - id: "REQ-CNSSP12-0020"
