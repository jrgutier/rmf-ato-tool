  - id: "REQ-CNSSP12-0012"
    citation: {"ref": "CNSSP12", "page": 6, "anchor": "Where space NSS and services form a part of a system-of-systems which"}
    kind: "lettered"
    locator: "c.5"
    context: "SECTION III-SCOPE"
    statement: "5. Where space NSS and services form a part of a system-of-systems which includes non- NSS or components, the mission owner and cognizant Authorizing Official (AO) for such system-of- systems, in coordination with the National Security Agency (NSA), must consider the impact of non-NSS components in their end-to-end analysis of risks. When practical and necessary, the AO may bring non-NSS or components under the scope of this policy."
    status: "candidate"
  - id: "REQ-CNSSP12-0013"
    citation: {"ref": "CNSSP12", "page": 6, "anchor": "Use of systems, or components, not originally planned, designed, or built to"}
    kind: "lettered"
    locator: "c.6"
    context: "SECTION III-SCOPE"
    statement: "6. Use of systems, or components, not originally planned, designed, or built to fully meet the requirements of this policy, and later designated or, by inter-governmental agreement or contractual action (e.g., lease), included within an NSS, will be contingent upon the cognizant AO's risk acceptance decision after performing a thorough review and comparison of alternatives, in coordination with NSA, to determine the solution that offers the best capability versus risk to meet mission needs."
    status: "candidate"
  - id: "REQ-CNSSP12-0014"
