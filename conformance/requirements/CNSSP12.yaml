    context: "CNSSP 12"
    statement: "14. The following cryptographic requirements must be addressed and satisfied:"
    status: "candidate"
  - id: "REQ-CNSSP12-0034"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "Authenticate and encrypt all system commands and data in Space NSS and"}
    kind: "lettered"
    locator: "a"
    context: "CNSSP 12"
    statement: "a. Authenticate and encrypt all system commands and data in Space NSS and services from end to end, in accordance with requirements and exceptions in CNSSI 1200. The system will use NSA-approved cryptography, in accordance with CNSSP 11 and CNSSP 15. The system must have a system key management plan (SKMP) and relevant cryptographic security plans (CSP) approved by NSA."
    status: "candidate"
  - id: "REQ-CNSSP12-0035"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "Any capability for unencrypted emergency backup links must be approved by NSA."}
    kind: "lettered"
    locator: "b"
    context: "CNSSP 12"
    statement: "b. Any capability for unencrypted emergency backup links must be approved by NSA. Any other capability for cryptographic bypass must be coordinated with NSA and approved by the AO. See CNSSI 1200 for requirements."
    status: "candidate"
  - id: "REQ-CNSSP12-0036"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "Space NSS and services must implement TRANSEC measures in accordance with CNSSP"}
    kind: "lettered"
    locator: "c"
    context: "CNSSP 12"
    statement: "c. Space NSS and services must implement TRANSEC measures in accordance with CNSSP 3 (Reference u) and a System TRANSEC Plan (STP) (Reference v) approved by the cognizant AO."
    status: "candidate"
  - id: "REQ-CNSSP12-0037"
    citation: {"ref": "CNSSP12", "page": 9, "anchor": "USG-owned and U.S. commercial-owned launch vehicles used to place in orbit space"}
    kind: "lettered"
    locator: "d"
    context: "CNSSP 12"
    statement: "d. USG-owned and U.S. commercial-owned launch vehicles used to place in orbit space platforms falling within the scope of this policy must be equipped with a secure flight termination system (FTS). See CNSSI 1200 (Reference q) for more information on FTS."
    status: "candidate"
  - id: "REQ-CNSSP12-0038"
