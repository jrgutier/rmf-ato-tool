    context: "SECTION V- RESPONSIBILITIES"
    statement: "f. In accordance with NSD-42 (Reference i), assist with the assessment of the overall security posture of applicable systems and identify cybersecurity related vulnerabilities."
    status: "candidate"
  - id: "REQ-CNSSP12-0045"
