    kind: "lettered"
    locator: "15"
    context: "SECTION V- RESPONSIBILITIES"
    statement: "15. The Director, NSA, as National Manager for NSS, shall, in accordance with CNSSD 502, National Directive on Security of National Security Systems (Reference w):"
    status: "candidate"
  - id: "REQ-CNSSP12-0039"
    citation: {"ref": "CNSSP12", "page": 9, "anchor": "Review and approve all cryptographies, cryptographic techniques, commanded or automatically invoked cryptographic"}
    kind: "lettered"
    locator: "a"
    context: "SECTION V- RESPONSIBILITIES"
    statement: "a. Review and approve all cryptographies, cryptographic techniques, commanded or automatically invoked cryptographic bypasses, as well as implementations of cryptographies, CSPs, and SKMPs intended to satisfy requirements associated with this policy."
    status: "candidate"
  - id: "REQ-CNSSP12-0040"
    citation: {"ref": "CNSSP12", "page": 9, "anchor": "Provide cybersecurity guidance and assistance to USG Departments and Agencies throughout their"}
    kind: "lettered"
    locator: "b"
    context: "SECTION V- RESPONSIBILITIES"
    statement: "b. Provide cybersecurity guidance and assistance to USG Departments and Agencies throughout their contracting processes for the design, development, manufacture, acquisition, launch, operation, and decommissioning of any applicable system requiring the use of NSA-approved cryptographies and cryptographic techniques."
    status: "candidate"
  - id: "REQ-CNSSP12-0041"
    citation: {"ref": "CNSSP12", "page": 9, "anchor": "Prescribe and issue additional security measures to protect classified and U.S. Controlled"}
    kind: "lettered"
    locator: "c"
    context: "SECTION V- RESPONSIBILITIES"
    statement: "c. Prescribe and issue additional security measures to protect classified and U.S. Controlled Cryptographic Items (CCI), cryptographic equipment, components, and keying material. These additional security measures must address, at a minimum, the recovery and/or destruction of any cryptographic- related material that is part of a failed launch or de-orbited space platform."
    status: "candidate"
  - id: "REQ-CNSSP12-0042"
    citation: {"ref": "CNSSP12", "page": 9, "anchor": "Issue, as requested, specific instructions and authorizations necessary for generating, protecting, and"}
    kind: "lettered"
    locator: "d"
    context: "SECTION V- RESPONSIBILITIES"
    statement: "d. Issue, as requested, specific instructions and authorizations necessary for generating, protecting, and managing all cryptographic material for cryptographies that are neither classified nor U.S. CCI used in support of space NSS and services, and perform or direct random inspections of control facilities to verify the adherence to these instructions."
    status: "candidate"
  - id: "REQ-CNSSP12-0043"
    citation: {"ref": "CNSSP12", "page": 9, "anchor": "Establish and maintain a database of all applicable systems listing the NSA-approved"}
    kind: "lettered"
    locator: "e"
    context: "SECTION V- RESPONSIBILITIES"
    statement: "e. Establish and maintain a database of all applicable systems listing the NSA-approved cryptographies, their associated functions in each system's space platforms, and the com pliancy status of each of these platforms to the requirements of this policy (based upon information provided to NSA by the cognizant USG Departments and Agencies)."
    status: "candidate"
  - id: "REQ-CNSSP12-0044"
