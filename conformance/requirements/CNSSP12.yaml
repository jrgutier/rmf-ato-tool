    statement: "13. The following cybersecurity requirements must be addressed and satisfied:"
    status: "candidate"
  - id: "REQ-CNSSP12-0021"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "Space NSS and services, and their supporting infrastructure, contain information technology, information"}
    kind: "lettered"
    locator: "a"
    context: "CNSSP 12"
    statement: "a. Space NSS and services, and their supporting infrastructure, contain information technology, information processing capabilities, and/or network technologies and must apply the Risk Management Framework (RMF) as part of an organization-wide Cybersecurity Risk Management Program (CRMP), established by a cognizant Department or Agency, in accordance with CNS SP 22, Cybersecurity Risk Management (Reference m)."
    status: "candidate"
  - id: "REQ-CNSSP12-0022"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "b. NIST SP 800-37, Guide for Applying the Risk Management Framework to"}
    kind: "lettered"
    locator: "a.-"
    context: "CNSSP 12"
    statement: "- b. NIST SP 800-37, Guide for Applying the Risk Management Framework to Federal Information Systems: A Security Life Cycle Approach (Reference n), provides a guide for the implementation of RMF and prescribes the roles and responsibilities of designated officials. There is no limitation to the designation of CRMP officials however, at a minimum, applicable systems must have a formally designated AO, Information System Security Officer (ISSO), and Security Control Assessor (SCA)."
    status: "candidate"
  - id: "REQ-CNSSP12-0023"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "Commercial or foreign government systems not falling under existing USG authorities for"}
    kind: "lettered"
    locator: "c"
    context: "CNSSP 12"
    statement: "c. Commercial or foreign government systems not falling under existing USG authorities for authorization decisions must use a third party assessment organization acceptable to the cognizant AO and Department/Agency."
    status: "candidate"
  - id: "REQ-CNSSP12-0024"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "At a minimum, a cognizant AO's risk acceptance decision must be documented"}
    kind: "lettered"
    locator: "d"
    context: "CNSSP 12"
    statement: "d. At a minimum, a cognizant AO's risk acceptance decision must be documented using the RMF core documents described in Committee on National Security Systems Instruction 1254 (CNS SI 1254 ), Risk Management Framework Documentation, Data Element Standards, and Reciprocity Process for National Security Systems (Reference o )."
    status: "candidate"
  - id: "REQ-CNSSP12-0025"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "Space NSS and services must identify and manage supply chain risk early"}
    kind: "lettered"
    locator: "e"
    context: "CNSSP 12"
    statement: "e. Space NSS and services must identify and manage supply chain risk early and throughout the space NSS and services system life cycle through the use of acquisition and engineering mitigations informed by all-source supply chain threat information in accordance with Committee on National Security Systems Directive 505 (CNSSD 505), Supply Chain Risk Management (Reference p )."
    status: "candidate"
  - id: "REQ-CNSSP12-0026"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "In accordance with C SSI 1200, National Information Assurance Instruction for Space"}
    kind: "lettered"
    locator: "f"
    context: "CNSSP 12"
    statement: "f. In accordance with C SSI 1200, National Information Assurance Instruction for Space Systems used to support National Security Missions (Reference q), cybersecurity requirements and information systems security architectures for space NSS and services must be assessed by the cognizant AO, in coordination with SA, prior to program initiation for new systems and prior to all major acquisition milestones."
    status: "candidate"
  - id: "REQ-CNSSP12-0027"
    citation: {"ref": "CNSSP12", "page": 7, "anchor": "Space NSS and services must meet the requirements of PL 113-283, Federal"}
    kind: "lettered"
    locator: "g"
    context: "CNSSP 12"
    statement: "g. Space NSS and services must meet the requirements of PL 113-283, Federal Information Security Modernization Act of 2014 (Reference r), as a baseline, implement Executive Order direction, and be consistent with cybersecurity guidelines, standards, and"
    status: "candidate"
  - id: "REQ-CNSSP12-0028"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "The security controls selected for space NSS and services must be derived"}
    kind: "lettered"
    locator: "h"
    context: "CNSSP 12"
    statement: "h. The security controls selected for space NSS and services must be derived from appropriate system security requirements, architectures, system designs, and risk assessments over the lifecycle of the system. Security controls are to be selected, tailored, implemented, assessed, and continuously monitored in accordance with CNSSP 22, Cybersecurity Risk Management, and CNSSI 1253, Security Categorization and Control Selection for National Security Systems (References). Furthermore, the controls selected by the organization and the AO subsequently lead to both specification requirements and statement of work requirements in the systems engineering context. This leads to an iterative, cumulative, and recursive process of development. See CNSSI 1200 for additional guidance on selecting security controls using the CNSSI 1253 Appendices, as well as CNSSI 1253 Appendix-F Attachment-2 (CNSSI 1253F2), (Reference t) Space Platform Overlay."
    status: "candidate"
  - id: "REQ-CNSSP12-0029"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "Continued advancement of adversarial threats may require revisiting risk tolerance thresholds and"}
    kind: "lettered"
    locator: "h.(1)"
    context: "CNSSP 12"
    statement: "(1) Continued advancement of adversarial threats may require revisiting risk tolerance thresholds and accordingly selecting and tailoring security controls over the lifecycle of a system. CNS SP 22 requires A Os to assess and continuously monitor security controls, based on risk assessments."
    status: "candidate"
  - id: "REQ-CNSSP12-0030"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "Space NSS and services must implement cyber defense services, including on-board intrusion"}
    kind: "lettered"
    locator: "h.(2)"
    context: "CNSSP 12"
    statement: "(2) Space NSS and services must implement cyber defense services, including on-board intrusion detection systems (IDS) and intrusion prevention systems (IPS), capable of real-time monitoring, detecting anomalous activities, and responding to cyber threats."
    status: "candidate"
  - id: "REQ-CNSSP12-0031"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "Space NSS and services must implement a secure boot process using a"}
    kind: "lettered"
    locator: "h.(3)"
    context: "CNSSP 12"
    statement: "(3) Space NSS and services must implement a secure boot process using a hardware root of trust that enables an operator to restore or promote a space vehicle to a known trusted state of operation."
    status: "candidate"
  - id: "REQ-CNSSP12-0032"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "Space NSS and services must implement a process to securely develop and"}
    kind: "lettered"
    locator: "h.(4)"
    context: "CNSSP 12"
    statement: "(4) Space NSS and services must implement a process to securely develop and deploy software and firmware patches and updates."
    status: "candidate"
  - id: "REQ-CNSSP12-0033"
    citation: {"ref": "CNSSP12", "page": 8, "anchor": "The following cryptographic requirements must be addressed and satisfied:"}
    kind: "lettered"
