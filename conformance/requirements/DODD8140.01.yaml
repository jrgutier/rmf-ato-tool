requirements:
  - id: "REQ-DODD8140.01-0001"
    citation: {"ref": "DODD8140.01", "page": 3, "anchor": "This issuance applies to the OSD, the Military Departments (including the Coast"}
    kind: "indicative"
    locator: "1.1"
    context: "APPLICABILITY"
    statement: "This issuance applies to the OSD, the Military Departments (including the Coast Guard at all times, including when it is a Service in the Department of Homeland Security by agreement with that Department), the Office of the Chairman of the Joint Chiefs of Staff (CJCS) and the Joint Staff, the Combatant Commands, the Office of the Inspector General of the Department of Defense, the Defense Agencies, the DoD Field Activities, and all other organizational entities within the DoD (referred to collectively in this issuance as the “DoD Components”)."
    status: "candidate"
  - id: "REQ-DODD8140.01-0002"
    citation: {"ref": "DODD8140.01", "page": 3, "anchor": "The DoD maintains a total force management perspective to provide qualified cyberspace"}
    kind: "lettered"
    locator: "1.2.a"
    context: "POLICY"
    statement: "a. The DoD maintains a total force management perspective to provide qualified cyberspace government civilian and military personnel to identified and authorized positions, augmented where appropriate by contracted services support. These personnel function as an integrated workforce with complementary skill sets to provide an agile, flexible response to DoD requirements."
    status: "candidate"
  - id: "REQ-DODD8140.01-0003"
    citation: {"ref": "DODD8140.01", "page": 3, "anchor": "The appropriate mix of military and government civilian positions and contracted support"}
    kind: "lettered"
    locator: "1.2.b"
    context: "POLICY"
    statement: "b. The appropriate mix of military and government civilian positions and contracted support designated to perform cyberspace work roles is determined in accordance with DoD Instruction (DoDI) 1100.22."
    status: "candidate"
  - id: "REQ-DODD8140.01-0004"
    citation: {"ref": "DODD8140.01", "page": 3, "anchor": "Civilian and military personnel performing cyberspace work roles must meet qualification standards"}
    kind: "lettered"
    locator: "1.2.c"
    context: "POLICY"
    statement: "c. Civilian and military personnel performing cyberspace work roles must meet qualification standards established in DoD cyberspace workforce policy, in addition to other applicable workforce qualification and training requirements (e.g., acquisition, intelligence, communications). These requirements should not be construed to modify, replace, or conflict with General Schedule occupational qualification requirements established by the Office of Personnel Management."
    status: "candidate"
  - id: "REQ-DODD8140.01-0005"
    citation: {"ref": "DODD8140.01", "page": 3, "anchor": "DoD Component compliance with this issuance is monitored via authoritative manpower and"}
    kind: "lettered"
    locator: "1.2.d"
    context: "POLICY"
    statement: "d. DoD Component compliance with this issuance is monitored via authoritative manpower and personnel systems as an element of mission readiness; as appropriate and as a management review item."
    status: "candidate"
  - id: "REQ-DODD8140.01-0006"
    citation: {"ref": "DODD8140.01", "page": 3, "anchor": "Replaces or infringes on the responsibilities, functions, or authorities of the OSD"}
    kind: "lettered"
    locator: "1.2.e.(1)"
    context: "POLICY Nothing in this issuance:"
    statement: "(1) Replaces or infringes on the responsibilities, functions, or authorities of the OSD or DoD Component heads, as prescribed by law or Executive order, assigned in chartering DoD directives (DoDDs), detailed in other DoD issuances or, as applicable, in Director of National Intelligence policy issuances."
    status: "candidate"
  - id: "REQ-DODD8140.01-0007"
    citation: {"ref": "DODD8140.01", "page": 3, "anchor": "Infringes on the DoD Office of the Inspector General’s statutory independence and"}
    kind: "lettered"
    locator: "1.2.e.(2)"
    context: "POLICY Nothing in this issuance:"
    statement: "(2) Infringes on the DoD Office of the Inspector General’s statutory independence and authority as articulated in Public Law 95-452, as amended. In the event of any conflict between this issuance and the DoD Office of the Inspector General’s statutory independence and authority, Public Law 95-452 takes precedence."
    status: "candidate"
