  - id: "REQ-SP800-128-0248"
    citation: {"ref": "SP800-128", "page": 56, "anchor": "A delay between introducing the change and updating the inventory and baseline"}
    kind: "lettered"
    locator: "3.4.1.•"
    context: "ASSESSMENT AND REPORTING Examples of possible actions include:"
    statement: "• A delay between introducing the change and updating the inventory and baseline configuration for the affected systems; Analyzing unauthorized changes identified through monitoring can not only identify vulnerabilities, but can also give organizations insight into any potential systemic problems with how the configuration change control process is managed. Once organizations are aware of any such problems, actions can be taken such as reengineering processes, implementing improved access restrictions for change, and providing training on SecCM processes. Finally, monitoring may support the generation of metrics related to SecCM activities. Analysis and consolidation of monitoring reports can generate metrics such as the percentage of systems that are implemented in accordance with their approved baselines, the percentage of IT products that are configured in accordance with the organizationally defined common secure configurations, or percentage of system changes that have been subjected to security impact analyses. Thus, SecCM monitoring may also be a source of information that supports metrics requirements associated with the organization’s overall continuous monitoring process. Results of SecCM monitoring are reported to management as defined by organizational policy and the SecCM strategy. Various types of reporting may be needed to support compliance with applicable federal laws, Executive Orders, directives, policies, regulations, standards and guidelines. The SecCM monitoring strategy and procedures are reviewed and revised to ensure that organizational security requirements continue to be met. SDLC Phase: Operations and Maintenance phase Primary Roles: SAISO (for implementing organization-wide monitoring tools and overseeing monitoring activities potentially including engaging independent assessment teams); System Owner (for ensuring that configuration monitoring is implemented at the system level as defined in the strategy) Supporting Roles: SSO; SA; System/Software Developer Expected Input: SecCM monitoring strategy; automated tools; system component inventory; current baseline configuration(s); audit records; System Security Plan/system security requirements Expected Output: SecCM monitoring reports, including security assessment reports and output from automated tools, as defined in the strategy and schedule"
    status: "candidate"
  - id: "REQ-SP800-128-0249"
    citation: {"ref": "SP800-128", "page": 57, "anchor": "Before implementing automated monitoring tools, organizations conduct a security impact analysis to"}
    kind: "modal"
    locator: "3.4.2"
    context: "IMPLEMENT AND MANAGE TOOLS FOR SECCM MONITORING"
    statement: "Before implementing automated monitoring tools, organizations conduct a security impact analysis to ensure that the tools do not have a negative effect on the existing enterprise architecture as a whole or on individual systems/components. It is important to note that automated tools may not support or be able to function with all organizational systems or all components within a system. Organizations document the systems and/or components that are not monitored via automated tools and a manual process is developed and implemented for those systems/components. SDLC Phase: Implementation phase Primary Roles: SecCM Program Manager; System Owner Supporting Roles: SAISO (if s/he is not the SecCM Program Manager); CIO; AO; SSO; SA; System/Software Developer Expected Input: Configuration monitoring strategy; enterprise architecture information and/or system architecture information; tools identified during the planning phase, information about other IT products with which monitoring tools will interface Expected Output: Implemented configuration monitoring tools"
    status: "candidate"
    work_item: "WI-251"
  - id: "REQ-SP800-128-0250"
    citation: {"ref": "SP800-128", "page": 57, "anchor": "Security Content Automation Protocol (SCAP) is a suite of specifications26 that standardize"}
    kind: "indicative"
    locator: "3.5"
    context: "USING SECURITY CONTENT AUTOMATION PROTOCOL"
    statement: "Security Content Automation Protocol (SCAP) is a suite of specifications26 that standardize the format and nomenclature by which information about software flaws and secure configurations can be communicated. SCAP-enabled tools can be used for maintaining the security of enterprise systems, such as automatically verifying the installation of patches, checking system security configuration settings against an expected baseline, and examining systems for signs of compromise. To automate configuration management and produce assessment evidence for many NIST [SP 800-53] controls, federal agencies use SCAP-enabled tools along with SCAP-expressed checklists. SCAP-expressed checklists are customized as appropriate to meet specific organizational requirements. SCAP-expressed checklists can map individual system configuration settings to their corresponding security requirements. Mappings between settings and requirements can help demonstrate that the implemented settings adhere to these requirements. The mappings are embedded in SCAP-expressed checklists which allow SCAP-enabled tools to automatically generate standardized assessment and compliance evidence. The embedded mappings in SCAP-enabled tools can provide a substantial savings in effort and cost. NIST encourages security software vendors to incorporate support for Common Vulnerabilities and Exposures (CVE), Common Configuration Enumeration (CCE), and Software Identification (SWID) Tags into their products, as well as encourage all software vendors to include CVE and CCE identifiers and software identifiers provided by the Common Platform Enumeration (CPE) and SWID in their vulnerability and patch advisories."
    status: "candidate"
    work_item: "WI-251"
