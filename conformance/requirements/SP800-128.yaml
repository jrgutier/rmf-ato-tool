    status: "not-a-requirement"
    reason: "Advisory criterion under 0392: risk assessments 'can be used' to target."
  - id: "REQ-SP800-128-0197"
    citation: {"ref": "SP800-128", "page": 46, "anchor": "Vulnerability scanning – Vulnerability scans can be used to target systems, IT"}
    kind: "lettered"
    locator: "3.2.2.i.•"
    context: "IMPLEMENT SECURE CONFIGURATIONS Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the se"
    statement: "• Vulnerability scanning – Vulnerability scans can be used to target systems, IT products, or CIs that are most vulnerable. For example, the Common Vulnerability Scoring System (CVSS) is a specification within SCAP that provides an open framework for communicating the characteristics of software flaw vulnerabilities and in calculating their relative severity. CVSS scores can be used to help prioritize configuration and patching activities."
    status: "not-a-requirement"
    reason: "Advisory criterion under 0392: scans and CVSS 'can be used' to help prioritize."
  - id: "REQ-SP800-128-0198"
    citation: {"ref": "SP800-128", "page": 46, "anchor": "Degree of penetration – The degree of penetration represents the extent to"}
    kind: "lettered"
    locator: "3.2.2.i.•"
    context: "IMPLEMENT SECURE CONFIGURATIONS Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the se"
    statement: "• Degree of penetration – The degree of penetration represents the extent to which the same product is deployed within an information technology environment. For example, if an organization uses a specific operating system on 95 percent of its workstations, it may obtain the most immediate value by planning and deploying secure configurations for that operating system. Other IT products or CIs can be targeted afterwards."
    status: "not-a-requirement"
    reason: "Advisory criterion under 0392: degree of penetration, with an example of 95 percent of workstations."
  - id: "REQ-SP800-128-0199"
    citation: {"ref": "SP800-128", "page": 46, "anchor": "Organizations fully test secure configurations prior to implementation in the production environment."}
    kind: "indicative"
    locator: "3.2.2.ii"
    context: "IMPLEMENT SECURE CONFIGURATIONS Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the se"
    statement: "Organizations fully test secure configurations prior to implementation in the production environment. There are a number of issues that may be encountered when implementing configurations including software compatibility and hardware device driver issues. For example, there may be legacy applications with special operating requirements that do not function correctly after a common secure configuration has been applied. Additionally, configuration errors could occur if Operating System (OS) and multiple application configurations are applied to the same component. For example, a setting for an application configuration parameter may conflict with a similar setting for an OS configuration parameter. Virtual environments are recommended for testing secure configurations as they allow organizations to examine the functional impact on applications without having to configure actual machines. iii. Resolve Issues and Document Deviations"
    status: "candidate"
    work_item: "WI-227"
  - id: "REQ-SP800-128-0200"
    citation: {"ref": "SP800-128", "page": 46, "anchor": "Testing secure configuration implementations may introduce functional problems within the system or"}
    kind: "modal"
    locator: "3.2.2.ii"
    context: "IMPLEMENT SECURE CONFIGURATIONS Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the se"
    statement: "Testing secure configuration implementations may introduce functional problems within the system or applications. For example, the new secure configuration may close a port or stop a service that is needed for OS or application functionality. These problems are examined individually and either resolved or documented as a deviation from, or exception to, the established common secure configurations. In some cases, changing one configuration setting may require changes to another setting, another CI, or another system. For instance, a common secure configuration may specify strengthened password requirements which may require a change to existing single sign-on applications. Or there may be a requirement that the OS-provided firewall be enabled by default. To ensure that applications function as expected, the firewall policy may need to be revised to allow specific ports, services, IP addresses, etc. When conflicts between applications and secure configurations cannot be resolved, deviations are documented and approved through the configuration change control process as appropriate. iv. Record and Approve the Baseline Configuration"
    status: "candidate"
  - id: "REQ-SP800-128-0201"
    citation: {"ref": "SP800-128", "page": 47, "anchor": "The established and tested secure configuration, including any necessary deviations, represents the"}
    kind: "modal"
    locator: "3.2.2.ii"
    context: "IMPLEMENT SECURE CONFIGURATIONS Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the se"
    statement: "The established and tested secure configuration, including any necessary deviations, represents the preliminary baseline configuration and is recorded in order to support configuration change control/security impact analysis, incident resolution, problem solving, and monitoring activities. Once recorded, the preliminary baseline configuration is approved in accordance with organizationally defined policy. Once approved, the preliminary baseline configuration becomes the initial baseline configuration for the system and its constituent CIs. The baseline configuration of a system includes the sum total of the secure configurations of its constituent CIs and represents the system-specific configuration against which all changes are controlled. The baseline configuration may include, as applicable, information regarding the system architecture, the interconnection of hardware components, secure configuration settings of software components, the software load, supporting documentation, and the elements in a release package. There could be a different baseline configuration for each life cycle stage (development, test, staging, production) of the system. When possible, organizations employ automated tools to support the management of baseline configurations and to keep the configuration information as up to date and near real time as possible. There are a number of solutions which maintain baseline configurations for a wide variety of hardware and software products. Some comprehensive SecCM solutions integrate the maintenance of baseline configurations with component inventory and monitoring tools."
    status: "candidate"
  - id: "REQ-SP800-128-0202"
    citation: {"ref": "SP800-128", "page": 47, "anchor": "Organizations are encouraged to implement baseline configurations in a centralized and automated"}
    kind: "should"
    locator: "3.2.2.v"
    context: "IMPLEMENT SECURE CONFIGURATIONS Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the se"
    statement: "Organizations are encouraged to implement baseline configurations in a centralized and automated manner using automated configuration management tools, automated scripts, vendor-provided mechanisms, etc. Media libraries may be used to store, protect, and control the master copies of approved versions of baseline configurations. Media may be the means to store information (paper, tapes, CD/DVDs, USB drives, etc.) or the information itself (e.g., files, software code). The media library may also include commercially licensed software, custom-developed software, and other artifacts and documents generated throughout the SDLC. SDLC Phase: Implementation/Assessment phase Primary Roles: System Owner; SSO Supporting Roles: SA; System/Software Developer Expected Input: Organizational and/or system-level policies and procedures including mandated or suggested common secure configurations; System Security Plan/system security requirements; system/component technical documentation Expected Output: Approved, recorded, and deployed secure baseline configuration(s) for system CI(s), including recorded deviations from common secure configurations"
    status: "not-a-requirement"
    reason: "Advisory: 'Organizations are encouraged to implement baseline configurations in a centralized and automated manner', and media libraries 'may be used'. 'encouraged' binds no one, and the role and output lines that follow set nothing new; deployment is I-1."
  - id: "REQ-SP800-128-0203"
    citation: {"ref": "SP800-128", "page": 48, "anchor": "If organizations are to maintain secure configurations for systems in an environment"}
    kind: "modal"
    locator: "3.3"
    context: "CONTROLLING CONFIGURATION CHANGE"
    statement: "If organizations are to maintain secure configurations for systems in an environment where technology is continually evolving and the number and seriousness of threats is expanding, changes to system configurations need to be managed and controlled. The following subsections describe the Controlling Configuration Changes phase activities. In this phase, the activities are normally implemented at the system level following policy and procedures. The following subsections are listed in the order in which the configuration activities typically occur. As always, organizations have flexibility in determining which activities are performed at what level and in what order. Completion of the Controlling Configuration Changes phase results in implementation of access restrictions for change, and documented configuration change control and security impact analysis processes."
    status: "not-a-requirement"
    reason: "Section 3.3 introduction and roadmap. 'need to be managed and controlled' is the reason for the section; its duties are stated from 3.3.1 on."
  - id: "REQ-SP800-128-0204"
    citation: {"ref": "SP800-128", "page": 48, "anchor": "Access restrictions for change represent the enforcement side of SecCM. Configuration change"}
    kind: "indicative"
    locator: "3.3.1"
    context: "IMPLEMENT ACCESS RESTRICTIONS FOR CHANGE"
    statement: "Access restrictions for change represent the enforcement side of SecCM. Configuration change control is a process for funneling changes for a system through a managed process; however, without access restrictions, there is nothing preventing someone from implementing changes outside of the process. Access restrictions are a mechanism to enforce configuration control processes by controlling who has access to the system and/or its constituent CIs to make changes. Access restrictions for change may also include controlling access to additional change-related information such as change requests, records, correspondence, change test plans and results, etc. To implement access restrictions for change:"
    status: "not-a-requirement"
    reason: "Explains what access restrictions are, ending in 'To implement access restrictions for change:'. A lead-in whose steps, 0205 and 0206, hold the duties."
  - id: "REQ-SP800-128-0205"
    citation: {"ref": "SP800-128", "page": 48, "anchor": "Determine the possible types of configuration changes that can be made in"}
    kind: "lettered"
    locator: "3.3.1.i"
    context: "IMPLEMENT ACCESS RESTRICTIONS FOR CHANGE Access restrictions for change may also include controlling access to additional change-related information such as change requests, records, correspondence, c"
    statement: "i. Determine the possible types of configuration changes that can be made in the system including network, operating system, and application layers;"
    status: "candidate"
  - id: "REQ-SP800-128-0206"
    citation: {"ref": "SP800-128", "page": 48, "anchor": "Determine which individuals have privileged access and which of those privileged individuals"}
    kind: "lettered"
    locator: "3.3.1.ii"
    context: "IMPLEMENT ACCESS RESTRICTIONS FOR CHANGE Access restrictions for change may also include controlling access to additional change-related information such as change requests, records, correspondence, c"
    statement: "ii. Determine which individuals have privileged access and which of those privileged individuals are authorized to make what types of changes; and iii. Implement technical mechanisms (e.g., role-based access, file/group permissions, etc.) to ensure that only authorized individuals are able to make the appropriate changes. SDLC Phase: Implementation/Assessment phase Primary Roles: System Owner; SSO Supporting Roles: SA Expected Input: System Security Plan/system security requirements; organizational and/or system-level policies and procedures Expected Output: Appropriate access restrictions for change implemented for the system"
    status: "candidate"
  - id: "REQ-SP800-128-0207"
    citation: {"ref": "SP800-128", "page": 49, "anchor": "A well-defined configuration change control process is fundamental to any SecCM program."}
    kind: "indicative"
    locator: "3.3.2"
    context: "IMPLEMENT THE CONFIGURATION CHANGE CONTROL PROCESS"
    statement: "A well-defined configuration change control process is fundamental to any SecCM program. Configuration change control is the process for ensuring that configuration changes to a system are formally requested, evaluated for their security impact, tested for effectiveness, and approved before the changes are implemented. Although the process may have different steps and levels of rigor depending on organizational risk tolerance and/or system-impact level, configuration change control generally consists of the following steps:"
    status: "candidate"
  - id: "REQ-SP800-128-0208"
    citation: {"ref": "SP800-128", "page": 49, "anchor": "Request the change. A request for change may originate from any number"}
    kind: "lettered"
    locator: "3.3.2.i"
    context: "IMPLEMENT THE CONFIGURATION CHANGE CONTROL PROCESS Although the process may have different steps and levels of rigor depending on organizational risk tolerance and/or system-impact level, configuratio"
    statement: "i. Request the change. A request for change may originate from any number of sources including the end user of the system, a help desk, or from management. Proposed changes may also originate from vendor-supplied patches, application updates, security alerts, system scans, etc. See Appendix E for a Sample Change Request Template."
    status: "candidate"
  - id: "REQ-SP800-128-0209"
    citation: {"ref": "SP800-128", "page": 49, "anchor": "Record the request for the proposed change. A change request is formally"}
    kind: "lettered"
    locator: "3.3.2.ii"
    context: "IMPLEMENT THE CONFIGURATION CHANGE CONTROL PROCESS Although the process may have different steps and levels of rigor depending on organizational risk tolerance and/or system-impact level, configuratio"
    statement: "ii. Record the request for the proposed change. A change request is formally entered into the configuration change control process when it is recorded in accordance with organizational procedures. Organizations may use paper-based requests, emails, a help desk, and/or automated tools to track change requests, route them based on workflow processes, and allow for electronic acknowledgements/approvals."
    status: "candidate"
  - id: "REQ-SP800-128-0210"
    citation: {"ref": "SP800-128", "page": 49, "anchor": "iii. Determine if the proposed change requires configuration control. Some types of"}
    kind: "modal"
    locator: "3.3.2.ii"
    context: "IMPLEMENT THE CONFIGURATION CHANGE CONTROL PROCESS Although the process may have different steps and levels of rigor depending on organizational risk tolerance and/or system-impact level, configuratio"
    statement: "iii. Determine if the proposed change requires configuration control. Some types of changes may be exempt from configuration change control or pre-approved as defined in the SecCM plan and/or procedures. If the change is exempt or pre-approved, note this on the change request and allow the change to be made without further analysis or approval; however, system documentation may still require updating (e.g., the System Security Plan, the baseline configuration, system component inventory, etc.). iv. Analyze the proposed change for its security impact on the system (see Section 3.3.3)."
    status: "partial"
    reason: "The mark and the impact result are held; the documentation update on an exempt change is not"
    evidence: [{"kind": "schema", "asserts": "The change request records whether the proposed change requires configuration control, or is exempt or pre-approved", "target": "framework/schema/changes.schema.json#/properties/changes/items/properties/control", "claim": "constraint", "sentence": "Determine if the proposed change requires configuration control."}, {"kind": "schema", "asserts": "The security impact analysis of the proposed change records its result", "target": "framework/schema/changes.schema.json#/properties/changes/items/properties/security_impact/properties/result", "claim": "constraint", "sentence": "Analyze the proposed change for its security impact on the system (see Section 3.3.3)."}]
