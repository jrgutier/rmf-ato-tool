  - id: "REQ-SP800-128-0131"
    citation: {"ref": "SP800-128", "page": 37, "anchor": "Handling of exceptions to the SecCM plan (e.g., location of SecCM artifacts,"}
    kind: "lettered"
    locator: "3.1.2.•"
    context: "PLANNING AT THE SYSTEM LEVEL"
    statement: "• Handling of exceptions to the SecCM plan (e.g., location of SecCM artifacts, configuration change control procedures, etc.). The SecCM Plan may have various representations; it could be an actual document, a collection of data stored within a SecCM tool, or a variety of other representations. SecCM procedures may be covered separately or the SecCM plan may incorporate SecCM procedures. The SecCM Plan may also be instantiated at the system level from organizational templates. The level of detail for the SecCM plan is commensurate with the impact level of the subject system. SDLC Phase: Begin in Initiation phase, fine tune in Development/Acquisition phase, finalize in Implementation/Assessment phase Primary Roles: System Owner Supporting Roles: SSO; SA; System/Software Developer; System User Expected Input: Organizational SecCM policies, procedures, and templates Expected Output: System-level SecCM plan, including system-level procedures Create or Update System Component Inventory"
    status: "candidate"
  - id: "REQ-SP800-128-0132"
    citation: {"ref": "SP800-128", "page": 37, "anchor": "A system component is a discrete identifiable IT asset that represents a"}
    kind: "modal"
    locator: "3.1.2"
    context: "PLANNING AT THE SYSTEM LEVEL"
    statement: "A system component is a discrete identifiable IT asset that represents a building block of a system. An accurate component inventory is essential to record the components that compose the system. The component inventory helps to improve the security of the system by providing a comprehensive view of the components that need to be managed and secured. All system components are tracked from acquisition to retirement as part of the organization’s SDLC process."
    status: "candidate"
  - id: "REQ-SP800-128-0133"
    citation: {"ref": "SP800-128", "page": 37, "anchor": "The system component inventory can be represented as: System Component Inventory ="}
    kind: "modal"
    locator: "3.1.2"
    context: "PLANNING AT THE SYSTEM LEVEL"
    statement: "The system component inventory can be represented as: System Component Inventory = {SC1, SC2, ... SCn}, where n is greater than or equal to one, and SC represents a system component within the organization. Every organizational component is included within the authorization boundary of one, and only one, system and is documented and tracked in an inventory which reflects the association with the system under which it is managed (i.e., an component associated with a system is included in that system component inventory). A component may support systems that are not within the same authorization boundary (i.e., such as a server that supports several Web applications or virtual machines); however, the owners of the supported systems have neither authority over, nor responsibility for, the supporting component, and thus the component would not be included in the component inventories of the supported systems. The component inventory is populated through a process of discovery. Discovery, which may be manual or automated, is the process of obtaining information on system components that compose the systems within the organization. The organization typically determines the types and granularity of the components (peripherals versus workstations, routers, etc.) that are to be identified within the inventory. In most organizations, it is impractical to manually collect this information for inclusion in the inventory or for analysis against the authorized inventory. The use of automated tools for discovery, analysis, and management of component inventories is generally a more effective and efficient means of maintaining component inventories. Still, it is important to note that even with automated inventory management tools, it may still be necessary to enter some component inventory data elements manually."
    status: "candidate"
