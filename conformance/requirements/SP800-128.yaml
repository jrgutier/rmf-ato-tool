    kind: "indicative"
    locator: "3.3.3.ii"
    context: "CONDUCT SECURITY IMPACT ANALYSIS Security impact analyses are conducted by individuals or teams with technical knowledge of the system throughout the SDLC such that the impact of changes on security i"
    statement: "iii. Assess Risks - Once a vulnerability has been identified, a risk assessment is needed to identify the likelihood of a threat exercising the vulnerability and the impact of such an event. Although vulnerabilities may be identified in changes as they are proposed, built, and tested, the assessed risk may be low enough that the risk can be accepted without remediation (i.e., risk acceptance). In other cases, the risk may be high enough that the change is not approved (i.e., risk avoidance), or that safeguards and countermeasures are implemented to reduce the risk (i.e., risk mitigation).22"
    status: "candidate"
  - id: "REQ-SP800-128-0221"
    citation: {"ref": "SP800-128", "page": 52, "anchor": "iv. Assess Impact on Existing Security Controls - In addition to assessing"}
    kind: "modal"
    locator: "3.3.3.ii"
    context: "CONDUCT SECURITY IMPACT ANALYSIS Security impact analyses are conducted by individuals or teams with technical knowledge of the system throughout the SDLC such that the impact of changes on security i"
    statement: "iv. Assess Impact on Existing Security Controls - In addition to assessing the risk from the change, organizations analyze whether and how a change will impact existing security controls. For example, the change may involve installation of software that alters the existing baseline configuration, or the change itself may cause or require changes to the existing baseline configuration. The change may also affect other systems or system components that depend on the function or component being changed, either temporarily or permanently. For example, if a database that is used to support auditing controls is being upgraded to the latest version, auditing functionality within the system may be halted while the upgrade is being implemented."
    status: "candidate"
  - id: "REQ-SP800-128-0222"
    citation: {"ref": "SP800-128", "page": 52, "anchor": "Plan Safeguards and Countermeasures - In cases where risks have been identified"}
    kind: "lettered"
    locator: "3.3.3.v"
    context: "CONDUCT SECURITY IMPACT ANALYSIS Security impact analyses are conducted by individuals or teams with technical knowledge of the system throughout the SDLC such that the impact of changes on security i"
    statement: "v. Plan Safeguards and Countermeasures - In cases where risks have been identified and are unacceptable, organizations use the security impact analysis to revise the change or to plan safeguards and countermeasures to reduce the risk. For instance, if the security impact analysis reveals that the proposed change causes a modification to a common secure configuration setting, plans to rework the change to function within the existing setting are initiated. If a change involves new elevated privileges for users, plans to mitigate the additional risk are made (e.g., submission of requests for higher clearance levels for those users or implementation of stronger access controls)."
    status: "candidate"
  - id: "REQ-SP800-128-0223"
    citation: {"ref": "SP800-128", "page": 53, "anchor": "Once the change has been analyzed, approved, tested, implemented, and verified, the"}
    kind: "indicative"
    locator: "3.3.4"
    context: "RECORD AND ARCHIVE"
    statement: "Once the change has been analyzed, approved, tested, implemented, and verified, the organization ensures that updates have been made to supporting documents such as technical designs and baseline configurations, in addition to security-related documentation such as System Security Plans, Risk Assessments, Assessment Reports, and Plans of Action & Milestones. In cases where there is high risk or where significant changes have been made, a system reauthorization may be required."
    status: "candidate"
  - id: "REQ-SP800-128-0224"
    citation: {"ref": "SP800-128", "page": 53, "anchor": "As changes are made to baseline configurations, the new baseline becomes the"}
    kind: "modal"
    locator: "3.3.4"
    context: "RECORD AND ARCHIVE"
    statement: "As changes are made to baseline configurations, the new baseline becomes the current version, and the previous baseline is no longer valid but is retained for historical purposes. If there are issues with a production release, retention of previous versions allows for a rollback or restoration to a previous secure and functional version of the baseline configuration. Additionally, archiving previous baseline configurations is useful for incident response and traceability support during formal audits.23 SDLC Phase: Operations and Maintenance phase Primary Roles: SSO Supporting Roles: System Owner; SA; System/Software Developer Expected Input: Identified vulnerabilities; risk assessment of identified vulnerabilities including any potential countermeasures; analysis of the security impact of the change Expected Output: Updated technical and system security-related documentation; decision on whether or not a system reauthorization is required; new baseline configuration"
    status: "candidate"
  - id: "REQ-SP800-128-0225"
    citation: {"ref": "SP800-128", "page": 53, "anchor": "If a system is inconsistent with approved configurations as defined by the"}
    kind: "indicative"
    locator: "3.4"
    context: "SECCM MONITORING"
    statement: "If a system is inconsistent with approved configurations as defined by the organization’s baseline configurations of system CIs, the System Security Plan, etc., or if an organization’s component inventory is inaccurate, the organization may be unaware of potential vulnerabilities and not take actions that would otherwise limit those vulnerabilities and protect it from attacks (i.e., reduce risk). Monitoring activities offer the organization better visibility into the actual state of security for its systems and also support adherence to SecCM policies and procedures. SecCM monitoring also provides input to the organization’s overall continuous monitoring strategy.24 Organizations implement the configuration monitoring strategy developed during the SecCM planning phase. SecCM monitoring activities confirm that the existing configuration is identical to the current approved baseline configuration, that all items in the component inventory can be identified and are associated with the appropriate system, and, if possible, whether there are any unapproved (i.e., not recorded in the component inventory) components. Unapproved components often create a major security risk; unapproved components rarely have updated patches, are not configured using the approved baseline configurations, and are not assessed or included in the authorization to operate. For example, if a technician uses a router for testing and then forgets to remove it, or if an employee sets up a wireless access point in a remote office without management consent, the organization may be vulnerable without being aware of it."
    status: "partial"
    reason: "MCHG-002 holds the reconciliation against baseline and inventory; the rest is explanation"
    evidence: [{"kind": "rule", "asserts": "Monitoring activities confirm the configuration against baseline configurations and the component inventory", "target": "MCHG-002", "fixture": "tests/fixtures/negative/MCHG-002.reconcile.yaml", "expect": "changes detected by monitoring are not reconciled with", "claim": "constraint", "holds_when": "ART-CHG is produced or seeded", "sentence": "Organizations implement the configuration monitoring strategy developed during the SecCM planning phase."}]
    work_item: "WI-285"
