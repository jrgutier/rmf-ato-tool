    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "The organization is typically responsible for defining documented policies for the SecCM program. The SecCM program manager develops, disseminates, and periodically reviews and updates the SecCM policies for the organization. The policies are included as a part of the overall organization-wide security policy. The SecCM policy normally includes the following:"
