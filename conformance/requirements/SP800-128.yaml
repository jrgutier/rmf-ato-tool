    locator: "3.1.1.•"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "• Requirements for retroactive analysis, testing, and approval of changes that are implemented outside of the change control process. Help Desk Procedures – Describes how change requests originating through the help desk are recorded, submitted, tracked, and integrated into the configuration change control process. SDLC Procedures – Describes how SecCM is used to manage and control system configurations and changes within the organizationally defined SDLC process and throughout the life cycle of a system."
