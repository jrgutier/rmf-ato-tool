  - id: "REQ-SP800-128-0155"
    citation: {"ref": "SP800-128", "page": 39, "anchor": "When implementing configuration management, the system owner determines how to best decompose"}
    kind: "modal"
    locator: "3.1.2"
    context: "PLANNING AT THE SYSTEM LEVEL"
    statement: "When implementing configuration management, the system owner determines how to best decompose the system into one or more configuration items (CIs). CIs may be one or a group of system components, documents, network diagrams, scripts, custom code, and various other elements that compose the system and which require configuration management. A system can be represented as a set of one or more CIs as follows: and including them in the CM process is important in managing overall organizational risk and system-level security."
    status: "candidate"
  - id: "REQ-SP800-128-0156"
    citation: {"ref": "SP800-128", "page": 40, "anchor": "System = {CI1, CI2, ...CIn} where n is greater than or equal"}
    kind: "indicative"
    locator: "3.1.2"
    context: "PLANNING AT THE SYSTEM LEVEL"
    statement: "System = {CI1, CI2, ...CIn} where n is greater than or equal to 1. There is a one-to-many relationship between systems and CIs. Thus, each system is composed of one or more CIs and each CI is part of one, and only one, system. In cases where an organization establishes and maintains a common configuration baseline for a given platform (e.g., Windows version X, Linux version Y) or component type (e.g., workstation, server, router) each individual system inherits the common configuration baseline as a CI, or part of a CI, for that system. The CI is managed for use in that system to include any deviations as justified and recorded (See Section 3.2.2.iii). The point is that a CI is owned and managed as part of only one system regardless of the common configuration baseline source. A CI may be composed of one or more system components (SCs) (e.g., server, workstation, router, application), one or more non-component (NC) system objects (e.g., documentation, diagrams, firmware), or some combination thereof as indicated in the following representations:"
    status: "candidate"
