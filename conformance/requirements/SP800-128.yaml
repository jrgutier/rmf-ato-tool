    context: ""
    statement: "The following is a sample template for a CCB charter that can be used within a SecCM program. Organizations are encouraged to adapt it to suit their needs."
    status: "not-a-requirement"
    reason: "Introduction to the sample charter: 'Organizations are encouraged to adapt it'. 'encouraged' is a permission. The instruction text is live at 0337 to 0342."
  - id: "REQ-SP800-128-0337"
    citation: {"ref": "SP800-128", "page": 93, "anchor": "PURPOSE <Describe the objectives of the CCB. It might say something like:“The"}
    kind: "modal"
    locator: "APPENDIX H CCB CHARTER SAMPLE"
    context: ""
    statement: "PURPOSE <Describe the objectives of the CCB. It might say something like:“The Configuration Control Board (CCB) represents the interests of program and project management by ensuring that a structured process is used to consider proposed changes and incorporate them into a specified release of a product. The CCB shall request that impact analysis of proposed changes be performed, review change requests, make decisions, and communicate decisions made to affected groups and individuals.” Define the relationship of this CCB to any other CCBs in the organization or other decision-making bodies, such as a project steering committee.>"
    status: "candidate"
    work_item: "WI-227"
  - id: "REQ-SP800-128-0338"
    citation: {"ref": "SP800-128", "page": 93, "anchor": "SCOPE OF AUTHORITY <Indicate the scope of decisions that the CCB makes."}
    kind: "modal"
    locator: "APPENDIX H CCB CHARTER SAMPLE"
    context: ""
    statement: "SCOPE OF AUTHORITY <Indicate the scope of decisions that the CCB makes. This scope could be over a specific organizational range; a project, group of projects (program), or subproject; a maximum budget or schedule impact. This scope boundary separates decisions that this CCB can make from those that it must escalate to a higher-level CCB or manager for resolution.>"
    status: "candidate"
  - id: "REQ-SP800-128-0339"
    citation: {"ref": "SP800-128", "page": 93, "anchor": "MEMBERSHIP <List the members of this CCB. The CCB typically includes representatives"}
    kind: "indicative"
    locator: "APPENDIX H CCB CHARTER SAMPLE"
    context: ""
    statement: "MEMBERSHIP <List the members of this CCB. The CCB typically includes representatives from program management, project management, software engineering, hardware engineering, testing, documentation, customer support, and marketing. One individual is designated as the CCB Chair. Keep the CCB as small as possible, to facilitate its ability to make rapid decisions, but make sure that the critical perspectives are represented.>"
    status: "candidate"
  - id: "REQ-SP800-128-0340"
    citation: {"ref": "SP800-128", "page": 93, "anchor": "OPERATING PROCEDURES <State the frequency of regularly scheduled CCB meetings and the"}
    kind: "modal"
    locator: "APPENDIX H CCB CHARTER SAMPLE"
    context: ""
    statement: "OPERATING PROCEDURES <State the frequency of regularly scheduled CCB meetings and the conditions that will trigger a special meeting. Describe how meetings will be conducted, the number of CCB members who constitute a quorum to make decisions at a meeting, and the roles that must be represented for the meeting to proceed. Identify whether guest participants may attend, such as the individuals who proposed the change requests being considered at a specific meeting.>"
    status: "candidate"
    work_item: "WI-227"
