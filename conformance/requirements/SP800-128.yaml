  - id: "REQ-SP800-128-0386"
    citation: {"ref": "SP800-128", "page": 26, "anchor": "The SecCM Program Manager may be the SAISO (or someone designated by"}
    kind: "modal"
    locator: "2.4"
    context: "SECCM ROLES AND RESPONSIBILITIES"
    statement: "The SecCM Program Manager may be the SAISO (or someone designated by the SAISO or the CIO) at the organizational level or the system owner (or someone designated by the system owner) at the system level. System Security Officer (SSO) The SSO assists the system owner with implementation of SecCM for the system, conducts configuration monitoring activities (reporting and analysis), and may serve on the CCB. System Administrator (SA) The SA implements agreed-upon secure baseline configurations, incorporates secure configuration settings for IT products, and assists with security impact analyses and configuration monitoring activities as needed. In addition, the SA may be included in the process for determining the appropriate baseline configuration for each CI and may serve on the CCB. SAs are also responsible for complying with SecCM policies and implementing/following SecCM procedures. System/Software Developer The developer ensures that secure configuration settings are built into applications in accordance with security requirements and assists with security impact analyses and configuration monitoring activities as needed. In addition, the developer may be included in the process for determining the appropriate baseline configuration for relevant CIs and may serve on the CCB. Developers are also responsible for complying with SecCM policies and implementing/following SecCM procedures. System User (SU) The SU initiates change requests, assists with functional testing, and complies with SecCM requirements."
    status: "candidate"
  - id: "REQ-SP800-128-0387"
    citation: {"ref": "SP800-128", "page": 30, "anchor": "Common Secure Configurations – Identifies commonly recognized and standardized secure configurations to"}
    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "Common Secure Configurations – Identifies commonly recognized and standardized secure configurations to be applied to configuration items. The common secure configurations specified in the procedure are derived from established federal, organizational, or industry specifications (the National Checklist Program contains references to common secure configurations such as the United States Government Configuration Baseline (USGCB), Defense Information System Agency (DISA) Security Technical Implementation Guides (STIGs), Center for Internet Security (CIS) Benchmarks, etc.). Where possible, common secure configurations use SCAP-expressed content. Deviations from the common secure configurations are also addressed (e.g., identification of acceptable methods for assessing, approving, documenting, and justifying deviations to common secure configurations, along with identification of controls implemented to mitigate risk from the deviations), in the event that the configuration for a given system must diverge from the defined configuration due to mission requirements or other constraints. Patch Management – Defines how an organization’s patch management process is integrated into SecCM, how patches are prioritized and approved through the configuration change control process, and how patches are tested for their impact on existing secure configurations. Also defines how patches are integrated into updates to approved baseline configurations and how patch implementation is controlled (access controls, etc.). Configuration Change Control – Identifies the steps to move a configuration change from its initial request to eventual release into the operational environment. The procedure includes, but is not limited to:"
    status: "candidate"
    work_item: "WI-227"
  - id: "REQ-SP800-128-0388"
    citation: {"ref": "SP800-128", "page": 34, "anchor": "To the greatest extent possible, select automated tools that can scan different"}
    kind: "indicative"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "To the greatest extent possible, select automated tools that can scan different system components (e.g., Web server, database server, network devices, etc.) running different operating systems, identify the current configuration settings, and indicate where the current settings are noncompliant with policy. Automated configuration management tools import settings from one or more common secure configurations and then allow for tailoring the configurations to the organization’s security and mission/functional requirements. Tools that implement and/or assess configuration settings are evaluated to determine whether they include requirements such as:"
    status: "candidate"
    work_item: "WI-251"
  - id: "REQ-SP800-128-0389"
    citation: {"ref": "SP800-128", "page": 38, "anchor": "Examples include, but are not limited to, organizational unique identifiers, system association"}
    kind: "indicative"
    locator: "3.1.2"
    context: "PLANNING AT THE SYSTEM LEVEL"
    statement: "Examples include, but are not limited to, organizational unique identifiers, system association (depending on network configuration, whether the inventory management tool installation is at the organizational level or system level, etc.), system/component owner, administrator, or user, configuration item association, or type of component. Tools that support inventory management are usually database-driven applications to track and manage system components within a given environment. Once an inventory is established, automated tools are often used to detect the removal or addition of components. Some inventory management tools allow for expanded monitoring of components through the use of built-in hooks in the OS, installation of agents on each component, or Application Programming Interfaces. With this functionality, the inventory management system can monitor changes in the component’s configuration and report the results to specified staff. Inventory management tools are SCAP-validated, to the extent such tools are available. When purchasing a commercial off-the-shelf (COTS) or customized inventory management application, organizations are well advised to include SCAP requirements in requests for proposals, purchase agreements, contracts, etc. Specifying components by a commonly recognized identifier such as the Common Platform Enumeration (CPE) can facilitate interchange of data among SCAP-compliant tools.17 Use of commonly recognized identifiers from the start of the acquisition process provides a common taxonomy for the component inventory to track components throughout the entire SDLC (i.e., from acquisition to retirement). A system component inventory adds real value to SecCM when each item in the inventory is associated with information that can be leveraged for determination of approved configuration baselines, configuration change control/security impact analysis, and monitoring/reporting. Some data elements18 typically stored for each component in the system component inventory include:"
    status: "candidate"
    work_item: "WI-251"
  - id: "REQ-SP800-128-0390"
    citation: {"ref": "SP800-128", "page": 43, "anchor": "For example, vendor participation may be valuable for insight into product-specific functions,"}
    kind: "modal"
