  - id: "REQ-SP800-128-0274"
    citation: {"ref": "SP800-128", "page": 82, "anchor": "Use Common Secure Configurations for Settings Organizations consider available common secure configurations"}
    kind: "lettered"
    locator: "APPENDIX F.1"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "1. Use Common Secure Configurations for Settings Organizations consider available common secure configurations as the basis for establishing secure configuration settings. A comprehensive source for information on configuration settings is the National Checklist Program (https://checklists.nist.gov). The checklists cover a wide range of commercial products and are written in a standardized format to facilitate automatic assessment through SCAP-enabled tools. Associated NIST [SP 800-53] Control: CM-6. References: NIST [SP 800-70]: National Checklist Program for IT Products-Guidelines for Checklist Users and Developers; and https://nvd.nist.gov."
    status: "candidate"
  - id: "REQ-SP800-128-0275"
    citation: {"ref": "SP800-128", "page": 82, "anchor": "Centralize Policy and Common Secure Configurations for Configuration Settings Where possible and"}
    kind: "lettered"
    locator: "APPENDIX F.2"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "2. Centralize Policy and Common Secure Configurations for Configuration Settings Where possible and appropriate, secure configurations are developed and implemented in a top-down approach to ensure consistency across the organization. An example is the implementation of the group policy functionality, which can be used to distribute secure configuration policy in a centralized manner throughout established domains. Exceptions to the organization’s policy may be needed to tailor configurations for a particular system to support local constraints or requirements. Such exceptions are documented and approved as a part of the baseline configuration for that information system. Associated NIST [SP 800-53] Controls: CM-1; CM-6. References: None."
    status: "candidate"
  - id: "REQ-SP800-128-0276"
    citation: {"ref": "SP800-128", "page": 82, "anchor": "Tailor Secure Configurations According to System/Component Function and Role Secure configuration settings"}
    kind: "lettered"
    locator: "APPENDIX F.3"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "3. Tailor Secure Configurations According to System/Component Function and Role Secure configuration settings are tailored to the system component’s function. For example, a server acting as a Windows domain controller may require stricter auditing requirements (e.g., auditing successful and unsuccessful account logons) than a file server. A public access Web server in a DMZ may require that fewer services are running than in a Web server behind an organization’s firewall supporting an intranet. Associated NIST [SP 800-53] Controls: CM-6; RA-3. References: NIST [SP 800-41]: Guidelines on Firewalls and Firewall Policy; NIST [SP 800-44]: Guidelines on Securing Public Web Servers; NIST [SP 800-45]: Guidelines on Electronic Mail Security; NIST [SP 800-46]: Guide to Enterprise Telework, Remote Access, and Bring Your Own Device (BYOD) Security;"
    status: "candidate"
  - id: "REQ-SP800-128-0277"
    citation: {"ref": "SP800-128", "page": 83, "anchor": "Eliminate Unnecessary Ports, Services, and Protocols (Least Functionality) Devices are configured to"}
    kind: "lettered"
    locator: "APPENDIX F.4"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "4. Eliminate Unnecessary Ports, Services, and Protocols (Least Functionality) Devices are configured to allow only the necessary ports, protocols, and services in accordance with functional needs and the risk tolerance in the organization. Open ports and available protocols and services are an inviting target for attackers, especially if there are known vulnerabilities associated with a given port, protocol, or service. Sources such as the NIST National Vulnerability Database (NVD) are available for highlighting vulnerabilities in various system components. Associated NIST [SP 800-53] Control: CM-7. References: https://nvd.nist.gov/."
    status: "candidate"
  - id: "REQ-SP800-128-0278"
    citation: {"ref": "SP800-128", "page": 83, "anchor": "Limit the Use of Remote Connections While connecting remotely to systems allows"}
    kind: "lettered"
    locator: "APPENDIX F.5"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "5. Limit the Use of Remote Connections While connecting remotely to systems allows more flexibility in how users and system administrators accomplish their work, it also opens an avenue of attack popular with hackers. Use of remote connections is limited to only those absolutely necessary for mission accomplishment. Associated NIST [SP 800-53] Control: AC-17. References: NIST [SP 800-41]: Guidelines on Firewalls and Firewall Policy; NIST [SP 800-46]: Guide to Enterprise Telework, Remote Access, and Bring Your Own Device (BYOD) Security; NIST [SP 800-47]: Security Guide for Interconnecting Information Technology Systems; NIST [SP 800-52]: Guidelines for the Selection, Configuration, and Use of Transport Layer Security (TLS) Implementations; NIST [SP 800-54]: Border Gateway Protocol Security; NIST [SP 800-77]: Guide to IPsec VPNs; NIST [SP 800-81-2]: Secure Domain Name System (DNS) Deployment Guide; NIST [SP 800-95]: Guide to Secure Web Services; and NIST [SP 800-113]: Guide to SSL VPNs."
    status: "candidate"
  - id: "REQ-SP800-128-0279"
    citation: {"ref": "SP800-128", "page": 84, "anchor": "Develop Strong Password Policies Passwords remain a common mechanism for authenticating the"}
    kind: "lettered"
    locator: "APPENDIX F.6"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "6. Develop Strong Password Policies Passwords remain a common mechanism for authenticating the identity of users and if they are poorly implemented or used, an attacker can undermine the best secure configuration. Organizations stipulate password policies and related requirements with the strength appropriate for protecting access to the organization’s assets. Associated NIST [SP 800-53] Control: IA-2, IA-5. References: NIST [SP 800-63B]: Digital Identity Guidelines, Authentication and Lifecycle Management; NIST [SP 800-132]: Recommendation for Password-Based Key Derivation Part 1: Storage Applications; and NIST [SP 800-135]: Recommendation for Existing Application-Specific Key Derivation Functions."
    status: "candidate"
  - id: "REQ-SP800-128-0280"
    citation: {"ref": "SP800-128", "page": 84, "anchor": "Implement Endpoint Protection Platforms (EPPs) Endpoints (e.g., laptops, desktops, mobile devices) are"}
    kind: "lettered"
    locator: "APPENDIX F.7"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "7. Implement Endpoint Protection Platforms (EPPs) Endpoints (e.g., laptops, desktops, mobile devices) are a fundamental part of any organizational system. Endpoints are an important source of connecting end users to networks and systems, and are also a major source of vulnerabilities and a frequent target of attackers looking to penetrate a network. User behavior is difficult to control and hard to predict, and user actions, whether it is clicking on a link that executes malware or changing a security setting to improve the usability of the endpoint, frequently allow exploitation of vulnerabilities. Commercial vendors offer a variety of products to improve security at the “endpoints” of a network. These EPPs include:"
    status: "candidate"
  - id: "REQ-SP800-128-0281"
    citation: {"ref": "SP800-128", "page": 84, "anchor": "Anti-malware applications are part of the common secure configurations for system components."}
    kind: "indicative"
    locator: "APPENDIX F.a"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "Anti-malware applications are part of the common secure configurations for system components. Anti-malware software employs a wide range of signatures and detection schemes, automatically updates signatures, disallows modification by users, run scans on a frequently scheduled basis, has an auto-protect feature set to scan automatically when a user action is performed (e.g., opening or copying a file), and may provide protection from zero-day attacks. For platforms for which anti-malware software is not available, other forms of anti-malware such as rootkit detectors may be employed."
    status: "candidate"
  - id: "REQ-SP800-128-0282"
    citation: {"ref": "SP800-128", "page": 84, "anchor": "Personal Firewalls Personal firewalls provide a wide range of protection for host"}
    kind: "lettered"
    locator: "APPENDIX F.b"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "b. Personal Firewalls Personal firewalls provide a wide range of protection for host machines including restriction on ports and services, control against malicious programs executing on the host, control of removable devices such as USB devices, and auditing and logging capability."
    status: "not-a-requirement"
    reason: "Item b of 'These EPPs include:': describes what personal firewalls provide. A product description; sc-7.12 (+++) carries host-based protection."
  - id: "REQ-SP800-128-0283"
    citation: {"ref": "SP800-128", "page": 84, "anchor": "Host-based Intrusion Detection and Prevention System (IDPS)"}
    kind: "lettered"
    locator: "APPENDIX F.c"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "c. Host-based Intrusion Detection and Prevention System (IDPS)"
    status: "not-a-requirement"
    reason: "Label of item c; its description was rejected. Host monitoring is si-4."
  - id: "REQ-SP800-128-0284"
    citation: {"ref": "SP800-128", "page": 85, "anchor": "Restrict the use of mobile code Organizations exercise caution in allowing the"}
    kind: "lettered"
    locator: "APPENDIX F.d"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "d. Restrict the use of mobile code Organizations exercise caution in allowing the use of \"mobile code\" such as ActiveX, Java, and JavaScript. An attacker can easily attach a script to a URL in a Web page or email that, when clicked, will execute malicious code within the computer’s browser. Associated NIST [SP 800-53] Controls: SC-7, SC-18, SI-3, SI-4"
    status: "candidate"
  - id: "REQ-SP800-128-0285"
    citation: {"ref": "SP800-128", "page": 85, "anchor": "Use Cryptography In many systems, especially those processing, storing, or transmitting information"}
    kind: "lettered"
    locator: "APPENDIX F.d.8"
    context: "BEST PRACTICES FOR ESTABLISHING SECURE CONFIGURATIONS Although there is no one-size-fits-all approach to SecCM, there are practices that organizations consider when developing and deploying secure con"
    statement: "8. Use Cryptography In many systems, especially those processing, storing, or transmitting information that is moderate impact or higher for confidentiality, cryptography is considered to be part of the secure configuration of the system. There are a variety of places to implement cryptography to protect data including individual file encryption, full disk encryption, Virtual Private Network connections, etc. Associated NIST [SP 800-53] Control: SC-13 References: [FIPS 140-3]: Security Requirements for Cryptography Modules; NIST [SP 800-25]: Federal Agency Use of Public Key Technology for Digital Signatures and Authentication; NIST [SP 800-32]: Introduction to Public Key Technology and the Federal PKI Infrastructure; NIST [SP 800-57]: Recommendation for Key Management, Part 1: General; NIST [SP 800-57]: Recommendation for Key Management, Part 2: Best Practices for Key Management Organization; NIST [SP 800-57]: Recommendation for Key Management, Part 3: Application-Specific Key Management Guidance; NIST [SP 800-107]: Recommendation for Applications Using Approved Hash Algorithms; NIST [SP 800-111]: Guide to Storage Encryption Technologies for End User Devices; NIST [SP 800-130]: A Framework for Designing Cryptographic Key Management Systems; NIST [SP 800-131A]: Transitions: Recommendation for Transitioning the Use of Cryptographic Algorithms and Key Lengths; and NIST [SP 800-175B]: Guideline for Using Cryptographic Standards in the Federal Government: Cryptographic Mechanisms."
    status: "candidate"
  - id: "REQ-SP800-128-0286"
    citation: {"ref": "SP800-128", "page": 85, "anchor": "Develop a Patch Management Process A robust patch management process is important"}
    kind: "lettered"
