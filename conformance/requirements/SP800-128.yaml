  - id: "REQ-SP800-128-0009"
    citation: {"ref": "SP800-128", "page": 15, "anchor": "Configuration management concepts and principles described in this publication provide supporting information"}
    kind: "indicative"
    locator: "1.3"
    context: "RELATIONSHIP TO OTHER SECURITY PUBLICATIONS"
    statement: "Configuration management concepts and principles described in this publication provide supporting information for NIST [SP 800-53], Security and Privacy Controls for Federal Information Systems and Organizations, as amended. This publication also provides important supporting information for the Implement Step, Assess Step , and the Monitor Step of the Risk Management Framework (RMF) that is discussed in NIST [SP 800-37], Risk Management Framework for Information Systems and Organizations: A System Life Cycle Approach for Security and Privacy, as amended. More specific guidelines on the implementation of the Monitor step of the RMF is provided in NIST [SP 800-137], Information Security Continuous Monitoring for Federal Information Systems and Organizations. The purpose of the Monitor step in the Risk Management Framework is to continuously monitor the effectiveness of all controls selected, implemented, and authorized for protecting organizational information and systems, which includes the Configuration Management controls identified in NIST [SP 800-53]. The monitoring phase identified in the security-focused configuration management (SecCM) process defined later in this document supports the RMF Monitoring phase by providing specific activities associated with the monitoring of the system structural architecture and the configuration settings of the software and hardware that operate in that system architecture."
    status: "not-a-requirement"
    reason: "Section 1.3, how this publication relates to SP 800-53, SP 800-37 and SP 800-137. Its one activity sentence, 'continuously monitor', paraphrases the Monitor step of another document."
  - id: "REQ-SP800-128-0010"
    citation: {"ref": "SP800-128", "page": 16, "anchor": "This publication often refers to information from NIST [SP 800-70], National Checklist"}
    kind: "indicative"
    locator: "1.3"
    context: "RELATIONSHIP TO OTHER SECURITY PUBLICATIONS"
    statement: "This publication often refers to information from NIST [SP 800-70], National Checklist Program for IT Products--Guidelines for Checklist Users and Developers, as amended; and NIST [SP 800- 126], The Technical Specification for the Security Content Automation Protocol (SCAP), Version 1.3, as a potential means of automated support in conducting many configuration management activities. Additionally, this publication refers to numerous NIST Special Publications that provide guidelines on use and configuration of specific technologies for securing systems. Many of these publications are identified in Appendix F, Best Practices for Establishing Secure Configurations."
    status: "not-a-requirement"
    reason: "Section 1.3 pointer: the publication refers to SP 800-70 and SP 800-126 'as a potential means of automated support' and lists more in Appendix F. A reference note."
