    statement: "• Operations and Maintenance Phase (After a Change is Deployed) Security impact analysis in the operations and maintenance phase confirms that the original security impact analysis was correct, and that unexpected vulnerabilities or impacts to security controls not identified in the testing environment have not been introduced in the operational environment. Additionally, the security impact of unscheduled and unauthorized changes is analyzed during the operations and maintenance phase. The process for a security impact analysis consists of the following steps:"
    status: "partial"
    reason: "The impact of each change is held; that the post-deployment analysis confirms the first is not"
