    context: "PLANNING AT THE SYSTEM LEVEL"
    statement: "A single system component may support additional information systems. For example, a server in a server farm may host several virtual machines, and each virtual machine in turn may support a Web application. When such a server suffers a service interruption or compromise, the information stored in the component inventory about the uses of that server can assist in the quick identification of the applications that are impacted so that appropriate actions can be taken. Additionally, virtual machines are included as separate items in system component inventories and are under configuration control. Identifying virtual machines"
