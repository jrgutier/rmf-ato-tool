  - {"page": 14, "locator": "INTRODUCTION", "reason": "short", "text": "A"}
  - {"page": 14, "locator": "INTRODUCTION", "reason": "no-marker", "text": "A system is typically in a constant state of change in response to new, enhanced, corrected, or updated hardware and software capabilities, patches for correcting software flaws and other errors to existing components, new security threats, changing business functions, etc. Implementing system changes almost always results in some adjustment to the system configuration. To ensure that the required adjustments to the system configuration do not adversely affect the security of the system or the organization from operation of the system, a well-defined configuration management process that integrates information security is needed."}
  - {"page": 14, "locator": "1.1", "reason": "no-marker", "text": "Refer to [FISMA] for additional information."}
  - {"page": 14, "locator": "1.1", "reason": "no-marker", "text": "Refer to NIST [FIPS 200] for additional information."}
  - {"page": 14, "locator": "1.1", "reason": "no-marker", "text": "Refer to NIST [SP 800-53] for additional information."}
  - {"page": 15, "locator": "1.2", "reason": "lead-in", "text": "This publication is intended to serve a diverse audience of system and information security professionals including:"}
  - {"page": 15, "locator": "1.2", "reason": "no-marker", "text": "Commercial companies producing information technology products and systems, creating information security-related technologies, and providing information security services can also benefit from the information in this publication."}
  - {"page": 16, "locator": "1.3", "reason": "no-marker", "text": "Many of the SecCM concepts and principles described in this publication draw upon the underlying principles established for managing information security risk in NIST [SP 800-39], Managing Information Security Risk: Organization, Mission, and Information System View."}
  - {"page": 16, "locator": "1.4", "reason": "lead-in", "text": "The remainder of this special publication is organized as follows:"}
  - {"page": 17, "locator": "THE FUNDAMENTALS", "reason": "short", "text": "T"}
  - {"page": 17, "locator": "2.1", "reason": "no-marker", "text": "This section provides an overview of SecCM including its importance in managing organizational risks from systems, the basic terms associated with configuration management, and characterization of SecCM within the configuration management discipline."}
  - {"page": 18, "locator": "2.1.2", "reason": "no-marker", "text": "It is incumbent upon the organization to implement its directives in a manner that provides adequate security6 for protecting information and systems. As threats continue to evolve in an environment where organizations have finite resources with which to protect themselves, security has become a risk-based activity where the operational and economic costs of ensuring that a particular threat does not exploit a vulnerability are balanced against the needs of the organization’s mission and business processes. In a world of limited resources, the practice of risk management is fundamental to an information security program."}
  - {"page": 18, "locator": "2.1.2", "reason": "no-marker", "text": "Adequate security is security commensurate with the risk and the magnitude of harm resulting from the loss, misuse, or unauthorized access to or modification of information"}
  - {"page": 19, "locator": "2.1.2", "reason": "no-marker", "text": "The management of configurations has traditionally been viewed as an IT management best practice.7 Using SecCM to gain greater control over and ensure the integrity of IT resources facilitates asset management, improves incident response, help desk, disaster recovery and problem solving, aids in software development and release management, enables greater automation of processes, and supports compliance with policies and preparation for audits."}
  - {"page": 19, "locator": "2.1.3", "reason": "no-marker", "text": "Security-Focused Configuration Management (SecCM) is the management and control of secure configurations for a system to enable security and facilitate the management of risk. SecCM builds on the general concepts, processes, and activities of configuration management by attention on the implementation and maintenance of the established security requirements of the organization and systems."}
  - {"page": 19, "locator": "2.1.3", "reason": "no-marker", "text": "Information security configuration management requirements are integrated into (or complement) existing organizational configuration management processes (e.g., business functions, applications, products) and information systems. SecCM activities include:"}
  - {"page": 19, "locator": "2.1.3", "reason": "no-marker", "text": "Best practices are often considered to be proven practices or processes that have been successfully used by multiple organizations. IT management best practices, as referred to in this publication, are viewed from an organization-wide perspective as practices that best support the mission and business functions or services of the organization."}
  - {"page": 19, "locator": "2.1.3", "reason": "no-marker", "text": "There are a number of organizations that have documented best practice standards and guidelines for configuration management which precede this Special Publication and influence its direction including [ISO 10007]; [IEEE 828-2012]; the Capability Maturity Model Integration [CMMI] with their focus on configuration management for software development documents; the Information Technology Infrastructure Library [ITIL] for its influence on the integration of configuration within information technology management; and the International Organization for Standardization (ISO) for its attention to configuration management within quality management systems."}
  - {"page": 20, "locator": "2.2", "reason": "no-marker", "text": "Security-focused configuration management of systems involves a set of activities that can be organized into four major phases: Planning; Identifying and Implementing Configurations; Controlling Configuration Changes; and Monitoring. It is through these phases that SecCM not only supports security for a system and its components, but also supports the management of organizational risk. Chapter 3 presents the detailed processes and considerations in implementing the necessary activities in each of these phases."}
  - {"page": 20, "locator": "2.2", "reason": "no-marker", "text": "The four phases of SecCM are illustrated in Figure 2-1 and described below."}
  - {"page": 20, "locator": "2.2", "reason": "short", "text": "Identifying and"}
  - {"page": 20, "locator": "2.2", "reason": "short", "text": "Controlling Configuration"}
  - {"page": 20, "locator": "2.2", "reason": "short", "text": "Planning"}
  - {"page": 20, "locator": "2.2", "reason": "short", "text": "Implementing Configurations"}
  - {"page": 20, "locator": "2.2", "reason": "short", "text": "Monitoring"}
  - {"page": 20, "locator": "2.2", "reason": "short", "text": "Changes"}
  - {"page": 20, "locator": "2.2", "reason": "not-a-statement", "text": "Figure 2-1 – Security-focused Configuration Management Phases"}
  - {"page": 20, "locator": "2.2.1", "reason": "no-marker", "text": "Planning includes developing policy and procedures to incorporate SecCM into existing information technology and security programs, and then disseminating the policy throughout the organization. Policy addresses areas such as the implementation of SecCM plans, integration into existing security program plans, Configuration Control Boards (CCBs), configuration change control processes, tools and technology, the use of common secure configurations9 and baseline configurations, monitoring, and metrics for compliance with established SecCM policy and procedures. It is typically more cost-effective to develop and implement a SecCM plan, policies, procedures, and associated SecCM tools at the organizational or mission/business process risk management level.10"}
  - {"page": 20, "locator": "2.2.1", "reason": "no-marker", "text": "A common secure configuration is a recognized, standardized, and established benchmark (e.g., National Checklist Program, DISA STIGs, etc.) that stipulates specific secure configuration settings for a given IT platform. See https://www.nist.gov/programs-projects/national-checklist-program"}
  - {"page": 21, "locator": "2.2.3", "reason": "no-marker", "text": "Given the continually evolving nature of a system and the mission it supports, the challenge for organizations is not only to establish an initial baseline configuration that represents a secure state (which is also cost-effective, functional, and supportive of mission and business processes), but also to maintain a secure configuration in the face of the significant waves of change that ripple through organizations."}
  - {"page": 21, "locator": "2.2.4", "reason": "no-marker", "text": "See NIST [SP 800-39] for information on risk management levels."}
  - {"page": 22, "locator": "2.3", "reason": "no-marker", "text": "This section describes the fundamental concepts relevant to the practice of SecCM within an organization. Recognizing that organizations have widely varying missions and organizational structures, there may be differences in the way that SecCM is implemented and managed."}
  - {"page": 22, "locator": "2.3.2", "reason": "no-marker", "text": "The SecCM Plan is produced during the Planning phase and supports the implementation of NIST [SP 800-53] controls CM-1 Configuration Management Policy and Procedures and CM-9 Configuration Management Plan."}
  - {"page": 22, "locator": "2.3.3", "reason": "no-marker", "text": "See NIST [SP 800-137] for more information on information security continuous monitoring."}
  - {"page": 23, "locator": "2.3.3", "reason": "no-marker", "text": "The CCB establishment is part of the Planning phase of SecCM and supports the implementation of NIST [SP 800-53] control CM-3 Configuration Change Control."}
  - {"page": 23, "locator": "2.3.4", "reason": "no-marker", "text": "Creating an inventory of system components is part of the Planning phase of SecCM and supports the implementation of the NIST [SP 800-53] control CM-8 System Component Inventory."}
  - {"page": 23, "locator": "2.3.5", "reason": "no-marker", "text": "The purpose of breaking up a system into CIs is to allow more granularity and control in managing the secure configuration of the system. The level of granularity varies among organizations and systems and is balanced against the associated management overhead for each CI. In one organization, it may be appropriate to create a single CI to track all of the laptops within a system, while in another organization, each laptop may represent an individual CI."}
  - {"page": 23, "locator": "2.3.5", "reason": "no-marker", "text": "Identification of the configuration items that compose a system is part of the Planning phase of SecCM and supports the implementation of NIST [SP 800-53] control CM-3 Configuration Change Control."}
  - {"page": 24, "locator": "2.3.6", "reason": "no-marker", "text": "Implementing secure configurations is part of the Identifying and Implementing Configurations phase of SecCM and supports the implementation of NIST [SP 800-53] controls CM-6 Configuration Settings and CM-7 Least Functionality."}
  - {"page": 24, "locator": "2.3.7", "reason": "no-marker", "text": "Developing and documenting the baseline configuration for a system is part of the Identifying and Implementing Configurations phase of SecCM and supports the implementation of NIST [SP 800-53] control CM-2 Baseline Configuration."}
  - {"page": 25, "locator": "2.3.8", "reason": "no-marker", "text": "Configuration change control falls under the Controlling Configuration Changes phase of SecCM and supports the implementation of NIST [SP 800-53] control CM-3 Configuration Change Control and CM-5 Access Restrictions for Change."}
  - {"page": 25, "locator": "2.3.10", "reason": "no-marker", "text": "Configuration monitoring is part of the Monitoring phase of SecCM and supports the implementation of all NIST [SP 800-53] controls in the CM Family."}
  - {"page": 25, "locator": "2.3.10", "reason": "no-marker", "text": "See NIST [SP 800-37] for more information on the RMF."}
  - {"page": 25, "locator": "2.3.10", "reason": "no-marker", "text": "See NIST [SP 800-137] for more information on continuous monitoring (Monitor Step in the RMF)."}
  - {"page": 28, "locator": "THE PROCESS", "reason": "short", "text": "T"}
  - {"page": 28, "locator": "THE PROCESS", "reason": "no-marker", "text": "his chapter describes the process of applying security-focused configuration management to systems within an organization. The goal of SecCM activities is to manage and monitor the configurations of systems to achieve adequate security and minimize organizational risk while supporting the desired business functionality and services."}
  - {"page": 28, "locator": "3.1", "reason": "no-marker", "text": "This section describes various SecCM planning activities at the organizational and system level."}
  - {"page": 28, "locator": "3.1.1", "reason": "no-marker", "text": "Primary Roles: SecCM Program Manager Supporting Roles: SAISO (if s/he is not the SecCM Program Manager); CIO; AO Expected Input: Organizational risk tolerance; organizational security requirements; applicable laws, regulations, policies, etc. from higher authorities Expected Output: Functional organization-wide SecCM program"}
  - {"page": 30, "locator": "3.1.1", "reason": "no-marker", "text": "Primary Roles: SecCM Program Manager Supporting Roles: SAISO (if s/he is not the SecCM Program Manager); CIO; AO Expected Input: Organizational risk tolerance; organizational security requirements; applicable laws, regulations, policies, etc. from higher authorities Expected Output: Documented SecCM policies Develop Organizational SecCM Procedures"}
  - {"page": 32, "locator": "3.1.1", "reason": "no-marker", "text": "See Section 3.4 for more information on SecCM monitoring."}
  - {"page": 38, "locator": "3.1.2", "reason": "no-marker", "text": "See Section 3.5 for more information on SCAP."}
  - {"page": 38, "locator": "3.1.2", "reason": "no-marker", "text": "See [NISTIR 7693] for information on specifications for data elements."}
