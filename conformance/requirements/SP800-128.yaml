  - id: "REQ-SP800-128-0002"
    citation: {"ref": "SP800-128", "page": 14, "anchor": "Organizations apply configuration management (CM) for establishing baselines and for tracking, controlling,"}
    kind: "modal"
    locator: "INTRODUCTION"
    context: "THE NEED FOR CONFIGURATION MANAGEMENT TO PROTECT INFORMATION AND SYSTEMS"
    statement: "Organizations apply configuration management (CM) for establishing baselines and for tracking, controlling, and managing many aspects of business development and operation (e.g., products, services, manufacturing, business processes, and information technology). Organizations with a robust and effective CM process need to consider information security implications with respect to the development and operation of systems including hardware, software, applications, and documentation. Effective CM of systems requires the integration of the management of secure configurations into the organizational CM process or processes. For this reason, this document assumes that information security is an integral part of an organization’s overall CM process; however, the focus of this document is on implementation of the information security aspects of CM, and as such the term security-focused configuration management (SecCM) is used to emphasize the concentration on information security. Though both IT business application functions and security-focused practices are expected to be integrated as a single process, SecCM in this context is defined as the management and control of configurations for systems to enable security and facilitate the management of information security risk."
    status: "not-a-requirement"
    reason: "Chapter 1 introduction ending in the definition of SecCM. 'need to consider' and 'requires the integration' argue for the discipline in general terms, and 'expected to be integrated' states what the document assumes; the duties they point at are stated as steps in Chapter 3."
  - id: "REQ-SP800-128-0003"
    citation: {"ref": "SP800-128", "page": 14, "anchor": "Federal agencies are responsible for “including policies and procedures that ensure compliance"}
    kind: "modal"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "Federal agencies are responsible for “including policies and procedures that ensure compliance with minimally acceptable system configuration requirements, as determined by the agency” within their information security program.2 Managing system configurations is also a minimum security requirement identified in [FIPS 200],3 and NIST [SP 800-53]4 defines controls that support this requirement. In addition to general guidelines for ensuring that security considerations are integrated into the CM process, this publication provides guidelines for implementation of the Configuration Management family of controls defined in NIST [SP 800-53] (CM-1 through CM-9). This publication also includes guidelines for NIST [SP 800-53] controls related to managing the configuration of the system architecture and associated components for secure processing, storing, and transmitting of information. Configuration management is an important process for establishing and maintaining secure system configurations, and provides important support for managing security risks in systems. The guidelines in this publication are applicable to all federal information systems other than those systems designated as national security systems as defined in [44 USC 3542]. The guidelines have been broadly developed from a technical perspective to complement similar guidelines for national security systems and may be used for such systems with the approval of appropriate federal officials exercising policy authority over such systems. State, local, and tribal governments, as well as private sector organizations are encouraged to consider using these guidelines, as appropriate. This publication is intended to provide guidelines for organizations responsible for managing and administrating the security of federal information systems and associated environments of operation. For organizations responsible for the security of information processed, stored, and transmitted by external or service-oriented environments (e.g., cloud service providers), the configuration management concepts and principles presented here can aid organizations in establishing assurance requirements for suppliers providing external information technology services."
    status: "candidate"
