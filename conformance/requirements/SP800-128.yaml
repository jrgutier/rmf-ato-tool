  - id: "REQ-SP800-128-0391"
    citation: {"ref": "SP800-128", "page": 50, "anchor": "Unscheduled or Unauthorized Changes Unfortunately, it is not uncommon to see activities"}
    kind: "modal"
    locator: "3.3.2.v"
    context: "IMPLEMENT THE CONFIGURATION CHANGE CONTROL PROCESS Although the process may have different steps and levels of rigor depending on organizational risk tolerance and/or system-impact level, configuratio"
    statement: "Unscheduled or Unauthorized Changes Unfortunately, it is not uncommon to see activities such as deploying or disposing of hardware, making changes to configurations, and installing patches occurring outside the configuration change control process even though such activities can have a significant impact on the security of a system. Additionally, situations may arise that necessitate an unscheduled (emergency) change. It is incumbent upon system owners to identify all sources of change to make certain that changes requiring configuration control go through the configuration change control process, even if it is after the fact. When unscheduled changes must be made and time does not allow for following the established configuration change control process, unscheduled changes are still managed and controlled. Organizations include instructions for handling unscheduled changes within the configuration change control procedures as well as instructions for handling unauthorized changes that are subsequently discovered. Configuration change control procedures also address flaw remediation to allow rapid but controlled change to fix software errors. Unscheduled changes are reviewed/resolved by the CCB as soon as is practical after unscheduled changes are made. SDLC Phase: Implementation/Assessment phase, ongoing during the Operations and Maintenance phase Primary Roles: System Owner; CCB; SSO Supporting Roles: SA; System User Expected Input: Organizational and/or system-level SecCM policies and procedures; System Security Plan/system security requirements Expected Output: Documented and implemented configuration change control process"
    status: "partial"
    reason: "After-the-fact control is held; the procedures are ART-CMP prose, and the board review of unscheduled changes is not dated against the change"
    evidence: [{"kind": "rule", "asserts": "Changes outside the process go through configuration change control even after the fact", "target": "MCHG-002", "fixture": "tests/fixtures/negative/MCHG-002.control.yaml", "expect": "a change outside the process goes through configuration change control even after the fact", "claim": "constraint", "holds_when": "ART-CHG is produced or seeded", "sentence": "When unscheduled changes must be made and time does not allow for following the established configuration change control process, unscheduled changes are still managed and controlled."}]
    work_item: "WI-285"
