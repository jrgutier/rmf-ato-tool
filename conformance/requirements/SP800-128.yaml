  - id: "REQ-SP800-128-0227"
    citation: {"ref": "SP800-128", "page": 54, "anchor": "SecCM monitoring is accomplished through assessment and reporting activities. For organizations with"}
    kind: "indicative"
    locator: "3.4.1"
