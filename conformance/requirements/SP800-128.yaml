  - id: "REQ-SP800-128-0015"
    citation: {"ref": "SP800-128", "page": 17, "anchor": "Configuration management has been applied to a broad range of products and"}
    kind: "modal"
    locator: "2.1.1"
    context: "BASIC CONFIGURATION MANAGEMENT"
    statement: "Configuration management has been applied to a broad range of products and systems in subject areas such as automobiles, pharmaceuticals, and information technology. Some basic terms associated with the configuration management discipline are briefly explained below. Configuration Management (CM) comprises a collection of activities focused on establishing and maintaining the integrity of products and systems, through control of the processes for initializing, changing, and monitoring the configurations of those products and systems. A Configuration Item (CI) is an identifiable part of a system (e.g., hardware, software, firmware, documentation, or a combination thereof) that is a discrete target of configuration control processes. A Baseline Configuration is a set of specifications for a system, or CI within a system, that has been formally reviewed and agreed on at a given point in time, and which can be changed only through change control procedures. The baseline configuration is used as a basis for future builds, releases, and/or changes. A Configuration Management Plan (CM Plan) is a comprehensive description of the roles, responsibilities, policies, and procedures that apply when managing the configuration of products and systems. The basic parts of a CM Plan include:"
    status: "not-a-requirement"
    reason: "Glossary-style terms 'briefly explained below': CM, CI, baseline configuration, CM Plan. 'responsibilities' sits inside the definition of a CM Plan. The rule that a baseline changes only through change control is live at 0044, and the plan's parts are in ART-CMP through 0115."
  - id: "REQ-SP800-128-0016"
    citation: {"ref": "SP800-128", "page": 17, "anchor": "− Configuration Control Board (CCB) – Establishment of and charter for a"}
    kind: "modal"
    locator: "2.1.1"
    context: "BASIC CONFIGURATION MANAGEMENT The basic parts of a CM Plan include:"
    statement: "− Configuration Control Board (CCB) – Establishment of and charter for a group of qualified people with responsibility for the process of controlling and approving changes throughout the development and operational lifecycle of products and systems; may also be referred to as a change control board; − Configuration Item Identification – methodology for selecting and naming configuration items that need to be placed under CM;"
    status: "not-a-requirement"
    reason: "Two definitions from the same term list, CCB and Configuration Item Identification. 'responsibility' describes what a CCB is and 'need to be placed under CM' describes what the methodology selects; neither sets a task. The CCB duty is live at 0038 and 0172."
  - id: "REQ-SP800-128-0017"
    citation: {"ref": "SP800-128", "page": 17, "anchor": "− Configuration Change Control – process for managing updates to the baseline"}
    kind: "indicative"
    locator: "2.1.1"
    context: "BASIC CONFIGURATION MANAGEMENT"
    statement: "− Configuration Change Control – process for managing updates to the baseline configurations for the configuration items; and − Configuration Monitoring – process for assessing or testing the level of compliance with the established baseline configuration and mechanisms for reporting on the configuration status of items placed under CM. This guideline is associated with the application of security-focused configuration management practices as they apply to systems. The configuration of a system is a representation of the system’s components, how each component is configured, and how the components are connected or arranged to implement the system. The possible conditions in which a system or system component can be arranged affect the security posture of the system. The activities involved in managing the configuration of a system include development of a configuration management plan, establishment of a configuration control board, development of a methodology for configuration item identification, establishment of the baseline configuration, development of a configuration change control process, and development of a process for configuration monitoring and reporting."
    status: "not-a-requirement"
    reason: "End of the term list, then a statement of what a system's configuration is and a summary of CM activities. Describes; the activities are set as steps from 3.1.2 on."
  - id: "REQ-SP800-128-0018"
    citation: {"ref": "SP800-128", "page": 18, "anchor": "As the ubiquity of information technology increases the dependence on systems, organizations"}
    kind: "modal"
    locator: "2.1.2"
    context: "THE CHALLENGE OF PROTECTING INFORMATION AND MANAGING RISK"
    statement: "As the ubiquity of information technology increases the dependence on systems, organizations are faced with an increase in the number and severity of threats that can have adverse impacts on operations, assets, and individuals. Given the potential for harm that can arise from environmental disruptions, human errors, and purposeful attacks by hostile entities and other threats, an organization must place greater emphasis on the management of risk associated with systems as it attempts to carry out its mission and business processes. The cornerstone of any effort to manage organizational risk related to systems is an effective security5 program."
    status: "not-a-requirement"
    reason: "Background in 2.1.2. 'must place greater emphasis' is an exhortation: no act, measure or holder, and the risk program it urges is the subject of SP 800-39, not of this publication."
  - id: "REQ-SP800-128-0019"
    citation: {"ref": "SP800-128", "page": 18, "anchor": "In risk-based mission protection strategies, organizations explicitly identify and respond to risks"}
    kind: "modal"
    locator: "2.1.2"
    context: "THE CHALLENGE OF PROTECTING INFORMATION AND MANAGING RISK"
    statement: "In risk-based mission protection strategies, organizations explicitly identify and respond to risks associated with the use of systems in carrying out missions and business processes. Careful consideration is given to how a range of diverse threats can expose existing vulnerabilities and cause harm to the organization. In the management of risk, organizations often have very little control over threats. Organizations cannot control earthquakes, floods, disgruntled employees, hackers, and other threats; however, organizations can control vulnerabilities and reduce threats via implementation of a robust SecCM process that is part of the overall risk management process. Vulnerabilities represent the various types of weaknesses that can be exploited by a threat. While an analysis of system vulnerabilities reveals a variety of potential causes, many vulnerabilities can be traced to software flaws and misconfigurations of system components."
    status: "not-a-requirement"
    reason: "Background on risk in 2.1.2. 'Organizations cannot control earthquakes' is a statement of fact about threats, which is the reason SecCM addresses vulnerabilities; nothing here is a task."
  - id: "REQ-SP800-128-0020"
    citation: {"ref": "SP800-128", "page": 18, "anchor": "Information security is the protection of information and systems from unauthorized access,"}
    kind: "indicative"
    locator: "2.1.2"
    context: "THE CHALLENGE OF PROTECTING INFORMATION AND MANAGING RISK"
    statement: "Information security is the protection of information and systems from unauthorized access, use, disclosure, disruption, modification, or destruction in order to provide confidentiality, integrity, and availability. For the purposes of this publication, “security” is used synonymously with “information security,” and “system” is used synonymously with “information system.”"
    status: "not-a-requirement"
    reason: "Footnote 5: the definition of information security and a note on how the words 'security' and 'system' are used."
  - id: "REQ-SP800-128-0021"
    citation: {"ref": "SP800-128", "page": 19, "anchor": "The configuration of a system and its components has a direct impact"}
    kind: "modal"
    locator: "2.1.3"
    context: "ROLE OF SECURITY-FOCUSED CONFIGURATION MANAGEMENT"
    statement: "The configuration of a system and its components has a direct impact on the security posture of the system. How the configurations are established and maintained requires a disciplined approach for providing adequate security. Changes to the configuration of a system are often needed to stay up to date with changing business functions and services, and information security needs. However, changes can adversely impact the previously established security posture; therefore, effective configuration management is vital to the establishment and maintenance of security of information and systems. The security-focused configuration management process is critical to maintaining a secure state under normal operations, contingency recovery operations, and reconstitution to normal operations."
    status: "not-a-requirement"
    reason: "Argument for SecCM in 2.1.3. 'requires a disciplined approach' and 'is critical to maintaining a secure state' say why it matters and name no one who acts."
