  - id: "REQ-SP800-128-0086"
    citation: {"ref": "SP800-128", "page": 32, "anchor": "Monitoring – Describes how monitoring activities and related reports are applied to"}
    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "Monitoring – Describes how monitoring activities and related reports are applied to assess the secure state of the system, and how to identify when the actual configuration becomes different in some way from the approved baseline configuration (i.e., unauthorized change) within a system through analysis of monitoring and reporting activities. Media Library Procedures – Describes management of the media library and includes naming conventions for media, labeling procedures (name/version, date created, retention period, owner, date for destruction, impact or classification level), tracking media, access controls, protections for media integrity (e.g., checksums), inventory checks, capacity planning, and archiving of media. Primary Roles: SecCM Program Manager; System Owners. Note: SecCM Program Managers and System Owners both have responsibility in determining which procedures are needed at their respective levels and how they are documented (e.g., as several separate procedures, as a single procedure, as part of the SecCM plan) Supporting Roles: SAISO or equivalent (if s/he is not the SecCM Program Manager); SSO; SA; System User Expected Input: Organizational policies organizational risk tolerance; organizational security requirements; applicable laws, regulations, policies, etc. from higher authorities Expected Output: Documented SecCM procedures Develop the SecCM Monitoring Strategy"
    status: "candidate"
    work_item: "WI-227"
  - id: "REQ-SP800-128-0087"
    citation: {"ref": "SP800-128", "page": 32, "anchor": "SecCM monitoring verifies that the SecCM process is effective with respect to"}
    kind: "indicative"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "SecCM monitoring verifies that the SecCM process is effective with respect to maintaining the security posture of the organization and adherence to baseline configurations and SecCM policy. The SecCM monitoring strategy is based on the risk tolerance of, and security requirements for, the organization. The SecCM monitoring strategy is consistent with, and provides input to, the organization’s overall continuous monitoring strategy. The organization typically develops the SecCM monitoring strategy; however, organizations have the flexibility to develop some or all of the SecCM monitoring strategy at the mission/business process or system level."
    status: "candidate"
  - id: "REQ-SP800-128-0088"
    citation: {"ref": "SP800-128", "page": 32, "anchor": "A schedule for SecCM monitoring and associated reporting is established as part"}
    kind: "indicative"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "A schedule for SecCM monitoring and associated reporting is established as part of the strategy. Scheduled and ad hoc assessments are included within the strategy. The monitoring schedule may coincide with scheduled releases such that assessments are performed before and after deployments. Ad hoc assessments may also be conducted so that staff does not become lax in between scheduled assessments. Additionally, the schedule includes provisions for reviewing and revising the SecCM monitoring strategy to ensure that the strategy continues to meet organizational security requirements."
    status: "candidate"
  - id: "REQ-SP800-128-0089"
    citation: {"ref": "SP800-128", "page": 32, "anchor": "Primary Roles: SecCM Program Manager Supporting Roles: SAISO or equivalent (if s/he"}
    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "Primary Roles: SecCM Program Manager Supporting Roles: SAISO or equivalent (if s/he is not the SecCM Program Manager); System Owner; SSO Expected Input: SecCM policy and procedures, overall organizational continuous monitoring policy and procedures; organizational risk tolerance; organizational security requirements Expected Output: Strategy and schedule for configuration monitoring and reporting Define the Types of Changes That Do Not Require Configuration Change Control"
    status: "not-a-requirement"
    reason: "Role, input and output lines of the monitoring strategy activity with the next heading; 'Require' is a word of that heading, 'Define the Types of Changes That Do Not Require Configuration Change Control'. The strategy is live at 0087 and 0088."
  - id: "REQ-SP800-128-0090"
    citation: {"ref": "SP800-128", "page": 33, "anchor": "In the interest of resource management, the organization may wish to designate"}
    kind: "should"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "In the interest of resource management, the organization may wish to designate the types of changes that are preapproved (i.e., changes that are not sent to the CCB for approval)15 and changes that are typically not included under configuration control (i.e., changes that are completely exempt from SecCM). Vendor-provided security patches, updated antivirus signatures, and replacement of defective peripherals or internal hardware are examples of changes that may be preapproved. Database content updates, creating/removing/updating accounts, and creation or deletion of user files are examples of changes that are typically exempt from configuration change control. Primary Roles: SecCM Program Manager; System Owner Supporting Roles: SAISO (if s/he is not the SecCM Program Manager); AO; SSO; SA; System/Software Developers Expected Input: SecCM policies and procedures; types of changes that typically occur within the organization and/or system Expected Output: Record of the types of changes that are exempt from configuration control; record of the types of changes that are configuration controlled Develop SecCM Training"
    status: "not-a-requirement"
    reason: "Advisory: 'the organization may wish to designate' pre-approved and exempt changes, with examples. A permission; the criteria in a plan are live at 0074."
  - id: "REQ-SP800-128-0091"
    citation: {"ref": "SP800-128", "page": 33, "anchor": "SecCM is a fundamental part of an organizational security program, but often"}
    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "SecCM is a fundamental part of an organizational security program, but often requires a change in organizational culture. Staff is provided training to ensure their understanding of SecCM policies and procedures. Training also provides a venue for management to communicate the reasons why SecCM is important. SecCM training material is developed covering organizational policies, procedures, tools, artifacts, and monitoring requirements. The training may be mandatory or optional as appropriate and is targeted to relevant staff (e.g., system administrators, system/software developers, system security officers, system owners, etc.) as necessary to ensure that staff has the skills to manage the baseline configurations in accordance with organizational policy. Primary Roles: SecCM Program Manager; System Owner Supporting Roles: SAISO (if s/he is not the SecCM Program Manager); CIO; AO; SSO Expected Input: SecCM policies and procedures Expected Output: Training materials and/or courses scheduled as necessary Identify Approved IT Products"
    status: "candidate"
  - id: "REQ-SP800-128-0092"
    citation: {"ref": "SP800-128", "page": 33, "anchor": "Many organizations establish a list of approved hardware and software products (e.g.,"}
    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "Many organizations establish a list of approved hardware and software products (e.g., a software whitelist) for use across the organization.). System owners select and use products from the approved list without the need for explicit approval. Depending upon organizational policy, additional products required for a particular system may need to be approved by the CCB for that system; alternatively, a product used may need to be added to the organizationally controlled and approved IT products list. Some organizations may also provide a buying service or similar purchasing/contracting vehicle from which preapproved products may be purchased or are required to be purchased. Primary Roles: SecCM Program Manager and/or the Configuration Control Board; System Owner Supporting Roles: SAISO (if s/he is not the SecCM Program Manager); AO; SSO Expected Input: SecCM policies and procedures; organizational security requirements; acquisition/buying service information Expected Output: List of approved IT Products for the organization Identify Tools"
    status: "candidate"
    work_item: "WI-227"
  - id: "REQ-SP800-128-0093"
    citation: {"ref": "SP800-128", "page": 34, "anchor": "Managing the myriad configurations found within system components has become an almost"}
    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "Managing the myriad configurations found within system components has become an almost impossible task using manual methods like spreadsheets. When possible, organizations look for automated solutions which, in the long run, can lower costs, enhance efficiency, and improve the reliability of SecCM efforts. In most cases, tools to support activities in SecCM phases two, three, and four are selected for use across the organization by SecCM program management, and system owners are responsible for applying the tools to the SecCM activities performed on each system. Similarly, tools and mechanisms for inventory reporting and management may be provided to system owners by the organization. In accordance with federal government and organizational policy, if automated tools are used, the tools are Security Content Automation Protocol (SCAP)-validated to the extent that such tools are available. SCAP is described in more detail in Section 3.5. If not provided by the organization, tools are identified and deployed to support SecCM at the system level. When possible, existing SecCM tools from within the organization are leveraged to support consistent organization-wide SecCM practices, centralized reporting, and cost efficiency. Leveraging existing tools may require them to be installed and configured to function on individual systems. Tool installation and configuration usually requires that accounts be set up, administrators identified, schedules determined, the appropriate baseline configurations set up, and possibly installation of a client on each component to be configuration-controlled. If the tool has already been deployed within the organization, instructions for installation, configuration, and deployment are available or easy to produce if needed. There are a wide variety of configuration management tools available to support an organization’s SecCM program. At a minimum, the organization considers tools that can automatically assess configuration settings of system components."
    status: "candidate"
    work_item: "WI-251"
