  - id: "REQ-SP800-128-0158"
    citation: {"ref": "SP800-128", "page": 40, "anchor": "CIB = {NC1, NC2, ...NCn} where n is greater than or equal"}
    kind: "lettered"
    locator: "3.1.2.ii"
    context: "PLANNING AT THE SYSTEM LEVEL A CI may be composed of one or more system components (SCs) (e.g., server, workstation, router, application), one or more non-component (NC) system objects (e.g., document"
    statement: "ii. CIB = {NC1, NC2, ...NCn} where n is greater than or equal to one; and/or iii. CIC = {SC1, SC2, ...SCn + NC1, NC2, ...NCn} where n is greater than or equal to one. For example, a system with a number of servers using similar technology may be taken together as one CI (as in representation i). System applications (e.g., software applications) may be represented as one or more CIs (also as in representation i). All documentation for the system may be included in one CI or each document may be treated as a separate CI (as in representation ii). Conversely, the system owner may find that it is more expedient to include the servers, applications running on the servers, and supporting documentation in a single CI (as in representation iii). When applying representations i or ii, it is important to note that the rigor of the review and approval of change proposals for one CI (e.g., a CI composed of servers) may be higher than that applied to another CI (e.g., a CI composed of documentation). Furthermore, CIs within the same system may be tracked using different tools. Every item within the system component inventory is associated with one and only one CI, and hence, is included within the authorization boundary of a single system."
    status: "candidate"
    work_item: "WI-226"
