    statement: "For example, vendor participation may be valuable for insight into product-specific functions, features, or configurations but the vendor is not given a vote on approval of the change. SDLC Phase: Begin in Development/Acquisition phase, finalize in Implementation/Assessment phase Primary Roles: SecCM Program Manager (if established at the organizational level); system owner (if established at the system level). Note: If a single CCB serves a number of systems but is not at the organizational level, the set of system owners for all of the participating systems are responsible for implementing the CCB Supporting Roles: SAISO (if s/he is not the SecCM Program Manager); SSO Expected Input: Organizational and/or system-level policies and procedures Expected Output: Established Configuration Control Board and charter"
