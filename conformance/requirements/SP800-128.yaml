  - id: "REQ-SP800-128-0026"
    citation: {"ref": "SP800-128", "page": 19, "anchor": "Initial implementation of a SecCM program may require considerable effort. If there"}
    kind: "modal"
    locator: "2.1.3"
    context: "ROLE OF SECURITY-FOCUSED CONFIGURATION MANAGEMENT SecCM activities include:"
    statement: "Initial implementation of a SecCM program may require considerable effort. If there is no existing SecCM process within the organization, there is an initial investment in developing and implementing a program that is comprehensive enough to span multiple technologies, the organizational structure, and disparate processes, and that can deliver consistent results while supporting the organization’s missions and business processes. In addition, tools are procured and implemented, system components inventoried and recorded, and processes modified to account for new ways of managing technology in the context of SecCM."
    status: "not-a-requirement"
    reason: "Forecast of cost in 2.1.3: 'may require considerable effort', and the passive list after it says what the initial investment buys. 'require' here estimates effort and sets no task."
  - id: "REQ-SP800-128-0027"
    citation: {"ref": "SP800-128", "page": 20, "anchor": "Once in place, SecCM requires an ongoing investment in time and resources."}
    kind: "modal"
    locator: "2.1.3"
    context: "ROLE OF SECURITY-FOCUSED CONFIGURATION MANAGEMENT"
    statement: "Once in place, SecCM requires an ongoing investment in time and resources. Product patches, fixes, and updates require time for security impact analysis even as threats and vulnerabilities continue to exist. As changes to systems are made, baseline configurations are updated, specific configuration settings confirmed, and configuration items tracked, verified, and reported. SecCM is a continuous activity that, once incorporated into IT management processes, touches all stages of the system development life cycle (SDLC). Organizations that implement SecCM throughout the SDLC and make its tenets a part of the IT management culture are most likely to reap benefits in terms of improvement of security and functionality, and more effective management of organizational risk."
    status: "candidate"
  - id: "REQ-SP800-128-0028"
    citation: {"ref": "SP800-128", "page": 20, "anchor": "As with many security activities, planning can greatly impact the success or"}
    kind: "indicative"
    locator: "2.2.1"
    context: "PLANNING"
    statement: "As with many security activities, planning can greatly impact the success or failure of the effort. As a part of planning, the scope or applicability of SecCM processes are identified."
    status: "candidate"
  - id: "REQ-SP800-128-0029"
    citation: {"ref": "SP800-128", "page": 21, "anchor": "After the planning and preparation activities are completed, a secure baseline configuration"}
    kind: "indicative"
    locator: "2.2.2"
    context: "IDENTIFYING AND IMPLEMENTING CONFIGURATIONS"
    statement: "After the planning and preparation activities are completed, a secure baseline configuration for the system is developed, reviewed, approved, and implemented. The approved baseline configuration for a system and associated components represents the most secure state consistent with operational requirements and constraints. For a typical system, the secure baseline may address configuration settings, software loads, patch levels, how the information system is physically or logically arranged, how various security controls are implemented, and documentation. Where possible, automation is used to enable interoperability of tools and uniformity of baseline configurations across the system."
    status: "candidate"
  - id: "REQ-SP800-128-0030"
    citation: {"ref": "SP800-128", "page": 21, "anchor": "In this phase of SecCM, the emphasis is put on the management"}
    kind: "indicative"
    locator: "2.2.3"
    context: "CONTROLLING CONFIGURATION CHANGES"
    statement: "In this phase of SecCM, the emphasis is put on the management of change to maintain the secure, approved baseline of the system. Through the use of SecCM practices, organizations ensure that changes are formally identified, proposed, reviewed, analyzed for security impact, tested, and approved prior to implementation. As part of the configuration change control effort, organizations can employ a variety of access restrictions for change including access controls, process automation, abstract layers, change windows, and verification and audit activities to limit unauthorized and/or undocumented changes to the system."
    status: "candidate"
  - id: "REQ-SP800-128-0031"
    citation: {"ref": "SP800-128", "page": 21, "anchor": "Monitoring activities are used as the mechanism within SecCM to validate that"}
    kind: "modal"
    locator: "2.2.4"
    context: "MONITORING"
    statement: "Monitoring activities are used as the mechanism within SecCM to validate that the system is adhering to organizational policies, procedures, and the approved secure baseline configuration. Planning and implementing secure configurations and then controlling configuration change is usually not sufficient to ensure that a system which was once secure will remain secure. Monitoring identifies undiscovered/undocumented system components, misconfigurations, vulnerabilities, and unauthorized changes, all of which, if not addressed, can expose organizations to increased risk. Using automated tools helps organizations to efficiently identify when the system is not consistent with the approved baseline configuration and when remediation actions are necessary. In addition, the use of automated tools often facilitates situational awareness and the documentation of deviations from the baseline configuration."
    status: "partial"
    reason: "MCHG-002 holds the reconciliation; finding undocumented components is INV-BND-001, and automated tools are not held"
    evidence: [{"kind": "rule", "asserts": "Monitoring validates the system against the approved baseline configuration through reconciliation", "target": "MCHG-002", "fixture": "tests/fixtures/negative/MCHG-002.reconcile.yaml", "expect": "changes detected by monitoring are not reconciled with", "claim": "constraint", "holds_when": "ART-CHG is produced or seeded", "sentence": "Monitoring activities are used as the mechanism within SecCM to validate that the system is adhering to organizational policies, procedures, and the approved secure baseline configuration."}]
    work_item: "WI-285"
  - id: "REQ-SP800-128-0032"
    citation: {"ref": "SP800-128", "page": 21, "anchor": "Processes and requirements within all four SecCM phases do not remain static"}
    kind: "indicative"
    locator: "2.2.4"
    context: "MONITORING"
    statement: "Processes and requirements within all four SecCM phases do not remain static thus all processes in all four phases are reviewed and revised as needed to support organizational risk management. SecCM monitoring activities may loop back to any of the previous phases (as noted in Figure 2-1) and precipitate changes."
    status: "candidate"
  - id: "REQ-SP800-128-0033"
    citation: {"ref": "SP800-128", "page": 21, "anchor": "SecCM monitoring is done through assessment and reporting activities. Reports address the"}
    kind: "indicative"
    locator: "2.2.4"
    context: "MONITORING"
    statement: "SecCM monitoring is done through assessment and reporting activities. Reports address the secure state of individual system configurations and are used as input to Risk Management Framework information security continuous monitoring requirements.11 SecCM monitoring can also support gathering of information for metrics that can be used to provide quantitative evidence that the SecCM program is meeting its stated goals, and can be used to improve SecCM processes in general."
    status: "candidate"
  - id: "REQ-SP800-128-0034"
    citation: {"ref": "SP800-128", "page": 22, "anchor": "The development of documented SecCM policy communicates senior management’s expectations for SecCM"}
    kind: "modal"
    locator: "2.3.1"
    context: "CONFIGURATION MANAGEMENT POLICY AND PROCEDURES"
    statement: "The development of documented SecCM policy communicates senior management’s expectations for SecCM to members of the organization through specific, measurable, and confirmable objectives. It is a top-down approach which defines what is required and what is not permitted with respect to using SecCM to manage and control information resources."
    status: "not-a-requirement"
    reason: "Description of what a policy is, in 2.3.1. 'what is required and what is not permitted' names the policy's content in general and sets neither; the duty to have one is live at 0035 and 0058."
  - id: "REQ-SP800-128-0035"
    citation: {"ref": "SP800-128", "page": 22, "anchor": "While policy defines the objectives for what must be done, procedures describe"}
    kind: "modal"
    locator: "2.3.1"
    context: "CONFIGURATION MANAGEMENT POLICY AND PROCEDURES"
    statement: "While policy defines the objectives for what must be done, procedures describe how the policy objectives are met through specific actions and results. SecCM procedures are developed to describe the methodology and tasks for each activity that supports implementation of the SecCM policy."
    status: "candidate"
  - id: "REQ-SP800-128-0036"
    citation: {"ref": "SP800-128", "page": 22, "anchor": "Documenting configuration management policy and procedures is performed during the Planning phase"}
    kind: "indicative"
    locator: "2.3.1"
    context: "CONFIGURATION MANAGEMENT POLICY AND PROCEDURES"
    statement: "Documenting configuration management policy and procedures is performed during the Planning phase and supports the implementation of NIST [SP 800-53] control CM-1 Configuration Management Policy and Procedures."
    status: "not-a-requirement"
    reason: "Phase and control mapping: documenting policy 'is performed during the Planning phase and supports' CM-1. The same mapping sentences for other topics were rejected; the duty is at 0035."
  - id: "REQ-SP800-128-0037"
    citation: {"ref": "SP800-128", "page": 22, "anchor": "The Configuration Management Plan serves to describe how SecCM policy is to"}
    kind: "indicative"
    locator: "2.3.2"
    context: "CONFIGURATION MANAGEMENT PLAN"
    statement: "The Configuration Management Plan serves to describe how SecCM policy is to be implemented. The SecCM Plan may be written to apply to an entire organization, or it may be localized and tailored to a system or a group of systems supporting a mission/business process within the organization. The SecCM Plan may take the form of an all-inclusive, stand-alone document that describes all aspects of SecCM or may be contained within more broadly defined CM procedures. A SecCM Plan may also take the form of a set of documents and appendices that taken together describe all aspects of SecCM. Finally, the SecCM Plan may take the form of a set of predefined data elements in a repository."
    status: "not-a-requirement"
    reason: "Advisory: every sentence after the first says what form a SecCM Plan 'may' take. 'organizations may' style permissions, not a minimum set. The plan's contents are live at 0115."
  - id: "REQ-SP800-128-0038"
    citation: {"ref": "SP800-128", "page": 22, "anchor": "The Configuration Control Board (CCB) is a group typically consisting of two"}
    kind: "modal"
    locator: "2.3.3"
    context: "CONFIGURATION CONTROL BOARD"
    statement: "The Configuration Control Board (CCB) is a group typically consisting of two or more individuals that have the collective responsibility and authority to review and approve changes to an information system. The group, which represents various perspectives from within the organization, is chosen to evaluate and approve changes to the system. The CCB is a check and balance on configuration change activity, assuring that changes are held to organizationally defined criteria (e.g., scope, cost, impact on security) before being implemented."
    status: "candidate"
  - id: "REQ-SP800-128-0039"
    citation: {"ref": "SP800-128", "page": 23, "anchor": "The CCB may be less formal for systems which have limited size,"}
    kind: "indicative"
    locator: "2.3.3"
    context: "CONFIGURATION CONTROL BOARD"
    statement: "The CCB may be less formal for systems which have limited size, scope, and criticality in the context of the mission of the organization. The organization determines the size and formality of the CCB that is appropriate for a given system (or systems) within the organization."
    status: "candidate"
  - id: "REQ-SP800-128-0040"
    citation: {"ref": "SP800-128", "page": 23, "anchor": "The component inventory is a descriptive record of the components within an"}
    kind: "indicative"
    locator: "2.3.4"
    context: "COMPONENT INVENTORY"
    statement: "The component inventory is a descriptive record of the components within an organization down to the system level. A consolidated representation of the components within all of the systems within an organization allows the organization to have greater visibility into and control over its systems, facilitating the implementation, operation, and management of a security program. The organization determines the level of granularity required for tracking the components for SecCM. For example, one organization may track a workstation (with all peripherals) as a single component while another may document each peripheral as a separate component in the inventory."
    status: "candidate"
  - id: "REQ-SP800-128-0041"
    citation: {"ref": "SP800-128", "page": 23, "anchor": "Each component is associated with only one system and the authority over"}
    kind: "modal"
    locator: "2.3.4"
    context: "COMPONENT INVENTORY"
    statement: "Each component is associated with only one system and the authority over and responsibility for each component is with only one system owner (i.e., every item in the component inventory falls within the authorization boundary of a single system)."
    status: "candidate"
  - id: "REQ-SP800-128-0042"
    citation: {"ref": "SP800-128", "page": 23, "anchor": "In the context of SecCM of systems, a configuration item (CI) is"}
    kind: "indicative"
    locator: "2.3.5"
    context: "CONFIGURATION ITEMS"
    statement: "In the context of SecCM of systems, a configuration item (CI) is an aggregation of system components that is designated for configuration management and treated as a single entity throughout the SecCM process. The CI is identified, labeled, and tracked during its life cycle – the CI is the target of many of the activities within SecCM, such as configuration change control and monitoring activities. A CI may be a specific system component (e.g., server, workstation, router, application), a group of system components (e.g., group of servers with like operating systems, group of network components such as routers and switches, an application or suite of applications), a non-component object (e.g., firmware, documentation), or a system as a whole. CIs give organizations a way to decompose the system into manageable parts whose configurations can be actively managed."
    status: "candidate"
    work_item: "WI-226"
  - id: "REQ-SP800-128-0043"
    citation: {"ref": "SP800-128", "page": 24, "anchor": "Configurations represent the possible states in which a system and its components"}
    kind: "should"
    locator: "2.3.6"
    context: "SECURE CONFIGURATIONS OF INFORMATION SYSTEMS"
    statement: "Configurations represent the possible states in which a system and its components can be arranged. Secure configurations are designed to reduce the organizational security risk from operation of a system, and may involve using trusted or approved software loads, maintaining up-to-date patch levels, applying secure configuration settings of the IT products used, and implementation of endpoint protection platforms. Secure configurations for a system are most often achieved through the application of secure configuration settings to the IT products (e.g., operating systems, databases, etc.) used to build the system. For example, a secure configuration for selected IT products used within the system or organization could incorporate the principle of least functionality. Least functionality helps to minimize the potential for introduction of security vulnerabilities and includes, but is not limited to, disabling or uninstalling unused/unnecessary operating system (OS) functionality, protocols, ports, and services, and limiting the software that can be installed and the functionality of that software."
    status: "not-a-requirement"
    reason: "Definition and example in 2.3.6: what secure configurations are, what they 'may involve', and that one 'could incorporate' least functionality. Advisory; cm-6 and cm-7 are the requirements."
  - id: "REQ-SP800-128-0044"
    citation: {"ref": "SP800-128", "page": 24, "anchor": "A baseline configuration is a set of specifications for a system, or"}
    kind: "indicative"
    locator: "2.3.7"
    context: "BASELINE CONFIGURATION"
    statement: "A baseline configuration is a set of specifications for a system, or Configuration Item (CI) within a system, that has been formally reviewed and agreed on at a given point in time, and which can be changed only through change control procedures. The baseline configuration is used as a basis for future builds, releases, and/or changes."
    status: "candidate"
  - id: "REQ-SP800-128-0045"
    citation: {"ref": "SP800-128", "page": 24, "anchor": "The baseline configuration of a system may evolve over time depending on"}
    kind: "indicative"
    locator: "2.3.7"
    context: "BASELINE CONFIGURATION"
    statement: "The baseline configuration of a system may evolve over time depending on the stage of the system development life cycle (SDLC). Early in the SDLC when a system is being initiated and acquired, the baseline may be a set of functional requirements. As the system is developed and implemented, the baseline may expand to include additional configuration items such as the technical design, the software load, the architecture, and configurations of the system and its individual components. A baseline configuration may also represent different information computing environments such as development, test, and production."
    status: "not-a-requirement"
    reason: "Description: what a baseline 'may' be at each life-cycle stage and that it 'may also represent' different environments. No one is told to do any of it."
  - id: "REQ-SP800-128-0046"
    citation: {"ref": "SP800-128", "page": 24, "anchor": "When a new baseline configuration is established, the implication is that all"}
    kind: "indicative"
    locator: "2.3.7"
    context: "BASELINE CONFIGURATION"
    statement: "When a new baseline configuration is established, the implication is that all of the changes from the last baseline have been approved. Older versions of approved baseline configurations are maintained and made available for review or rollback as needed."
    status: "candidate"
  - id: "REQ-SP800-128-0047"
    citation: {"ref": "SP800-128", "page": 24, "anchor": "Configuration change control is the documented process for managing and controlling changes"}
    kind: "modal"
    locator: "2.3.8"
    context: "CONFIGURATION CHANGE CONTROL"
    statement: "Configuration change control is the documented process for managing and controlling changes to the configuration of a system or its constituent CIs. Configuration change control for the system involves the systematic proposal, justification, implementation, test/evaluation, review, and disposition of changes to the system, including upgrades and modifications. Configuration change control is applied to include changes to components of the system, changes to the configuration settings for information technology products, emergency/unscheduled changes, and changes to remediate flaws. Changes are controlled from the time the change is proposed to the implementation and testing of the change. Each step in the change process is clearly articulated along with the responsibilities and authorities of the roles involved."
    status: "candidate"
  - id: "REQ-SP800-128-0048"
    citation: {"ref": "SP800-128", "page": 25, "anchor": "The analysis of the security impact of a change occurs when changes"}
    kind: "indicative"
    locator: "2.3.9"
    context: "SECURITY IMPACT ANALYSIS"
    statement: "The analysis of the security impact of a change occurs when changes are analyzed and evaluated for adverse impact on security, preferably before they are approved and implemented, but also in the case of emergency/unscheduled changes. Once the changes are implemented and tested, a security impact analysis (and/or assessment) is performed to ensure that the changes have been implemented as approved, and to determine if there are any unanticipated effects of the change on existing security controls."
    status: "candidate"
  - id: "REQ-SP800-128-0049"
    citation: {"ref": "SP800-128", "page": 25, "anchor": "Security impact analysis is performed as a part of the Controlling Configuration"}
    kind: "indicative"
    locator: "2.3.9"
    context: "SECURITY IMPACT ANALYSIS"
    statement: "Security impact analysis is performed as a part of the Controlling Configuration Changes phase of SecCM and supports the implementation of NIST [SP 800-53] control CM-4 Security Impact Analysis."
    status: "not-a-requirement"
    reason: "Phase and control mapping: the analysis 'is performed as a part of' a phase 'and supports' CM-4. The duty to analyze is live at 0048 and 0395."
  - id: "REQ-SP800-128-0050"
    citation: {"ref": "SP800-128", "page": 25, "anchor": "Configuration monitoring involves activities to determine whether systems are configured in accordance"}
    kind: "modal"
    locator: "2.3.10"
    context: "CONFIGURATION MONITORING"
    statement: "Configuration monitoring involves activities to determine whether systems are configured in accordance with the organization’s agreed-upon baseline configurations, and whether the components identified within the system are consistent with the component inventory being maintained by the organization."
    status: "candidate"
  - id: "REQ-SP800-128-0051"
    citation: {"ref": "SP800-128", "page": 25, "anchor": "Configuration monitoring helps to ensure that SecCM controls are operating as intended"}
    kind: "modal"
    locator: "2.3.10"
    context: "CONFIGURATION MONITORING"
    statement: "Configuration monitoring helps to ensure that SecCM controls are operating as intended and are providing effective security while supporting adherence to SecCM policies and procedures. Configuration monitoring may also help to motivate staff members to perform SecCM activities in accordance with policies and procedures. Additionally, configuration monitoring supports organizations in their efforts to conform to the Risk Management Framework.12 Information gathered during configuration monitoring can be used to support overall continuous monitoring activities13 including ongoing assessments of specific controls and updates to documentation such as System Security Plans, Security Assessment Reports, and Security Status Reports. Automation capabilities, such as those defined by SCAP, can be used to automate assessment activities."
    status: "not-a-requirement"
    reason: "Benefits of monitoring: 'helps to ensure', 'may also help', 'can be used'. 'in accordance with' only describes the staff conduct it may motivate."
  - id: "REQ-SP800-128-0052"
    citation: {"ref": "SP800-128", "page": 26, "anchor": "The set of roles (at the organization, mission/business process, and system level)"}
    kind: "modal"
    locator: "2.4"
    context: "SECCM ROLES AND RESPONSIBILITIES"
    statement: "The set of roles (at the organization, mission/business process, and system level) that are relevant to the SecCM program are defined along with the responsibilities. The responsibilities are in the context of SecCM only and are not inclusive of other non-SecCM responsibilities the roles may also have. Typically, SecCM roles and responsibilities include: Chief Information Officer (CIO) The CIO designates and/or provides a SecCM Program Manager for the organization and approves the organizational SecCM plan and policies. Senior Agency Information Security Officer (SAISO) The SAISO may act as the SecCM Program Manager for the organization. The SAISO may also provide staff with security expertise to serve on the CCB and/or to conduct security impact analyses. Organizations may also refer to this position as the Chief Information Security Officer (CISO). Authorizing Official (AO) The AO manages or participates in the CCB for systems s/he authorizes and may provide technical staff to conduct and/or review security impact analyses. The AO coordinates with the Risk Executive (Function) on SecCM issues and makes the final determination whether or not a given change or set of changes continues to be an acceptable security risk. System Owner The system owner identifies, defines, and ensures implementation of the aspects of SecCM for the information system that have not been defined by the organization of which the system is a part. The system owner also ensures implementation of organizational-level SecCM requirements for the system. SecCM Program Manager The SecCM Program Manager develops SecCM policies and procedures, provides direction, and oversees the implementation of the SecCM program for the organization and/or system level SecCM program."
    status: "candidate"
    work_item: "WI-162"
  - id: "REQ-SP800-128-0053"
    citation: {"ref": "SP800-128", "page": 28, "anchor": "The following sections discuss activities that occur within each of the four"}
    kind: "modal"
    locator: "THE PROCESS"
    context: "IMPLEMENTATION AND APPLICATION OF SECURITY-FOCUSED CONFIGURATION MANAGEMENT"
    statement: "The following sections discuss activities that occur within each of the four phases of SecCM. Some of the activities may be more efficiently performed at the organizational or mission/business process level (i.e., applying to more than one information system), while other activities may be more efficiently performed at the system level (i.e., applying to a single system). Each organization determines what activities are conducted at the organizational or mission/business process level and what activities are conducted at the system level in accordance with organizational management requirements. Appendix G provides flow charts of the SecCM activities described here. The flow charts are intended to serve as tools for organizations to draw upon for developing their own SecCM processes."
    status: "candidate"
  - id: "REQ-SP800-128-0054"
    citation: {"ref": "SP800-128", "page": 28, "anchor": "The following subsections describe the planning phase activities that are normally conducted"}
    kind: "indicative"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "The following subsections describe the planning phase activities that are normally conducted at the organizational level (or the mission/business process level). The subsections are listed in the order in which the planning activities typically occur. As always, organizations have flexibility in determining which activities are performed at what level and in what order. Planning at the organizational level includes SecCM program documented policies and procedures that provide direction and support for managing configurations of individual systems within the organization."
    status: "not-a-requirement"
    reason: "Section 3.1.1 roadmap: what the subsections describe and that 'organizations have flexibility' over order and level."
  - id: "REQ-SP800-128-0055"
    citation: {"ref": "SP800-128", "page": 28, "anchor": "Establish Organization-wide SecCM Program"}
    kind: "imperative"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "Establish Organization-wide SecCM Program"
    status: "not-a-requirement"
    reason: "Run-in heading of the first organizational activity. The text is 0056."
  - id: "REQ-SP800-128-0056"
    citation: {"ref": "SP800-128", "page": 28, "anchor": "The practice of SecCM for ensuring adequate security and facilitating the management"}
    kind: "modal"
    locator: "3.1.1"
    context: "PLANNING AT THE ORGANIZATIONAL LEVEL"
    statement: "The practice of SecCM for ensuring adequate security and facilitating the management of risk is most effectively realized if it is implemented in a consistent manner across the organization. Some SecCM activities are more effective when performed at the organizational level, with responsibility assigned to the organization-wide SecCM program. For organizations with varied and complex enterprise architecture, implementing SecCM in a consistent and uniform manner across the organization requires organization-wide coordination of resources. A senior management-level program manager designated to lead and oversee the organization-wide SecCM program can provide this type of coordination. For many large organizations, dedicated staff may be needed. For smaller organizations, or those with funding or resource constraints, the organization-wide SecCM program may be implemented by senior management-level staff that meet as a group to determine the SecCM-related activities for the organization. The SecCM program manager provides knowledge and direction in the form of policies and procedures, communications, training, defined roles and responsibilities, support, oversight of program activities, and coordination with stakeholders. An organization-wide SecCM program also demonstrates management commitment for the effort. This commitment from the top of the organization is communicated throughout the organization down to the individual system owners. The SecCM program manager facilitates communications regarding SecCM policies, procedures, issues, etc., within the organization. Consideration is given to implementation of a security information management console or “dashboard” to communicate basic project and operational information to stakeholders in language they understand. The SecCM program manager also considers other vehicles for communication such as Web site updates, emails, and newsletters to share milestones, measures of value, and other SecCM-related news with stakeholders."
    status: "not-applicable"
    reason: "Binds the organization and its SecCM program manager: how the organization-wide program is staffed and run, its 'dedicated staff', 'senior management-level staff that meet as a group', dashboard and newsletters. The 'responsibility' and 'responsibilities' it assigns, and the coordination it says consistency 'requires', sit inside an outside program that the run does not perform. Persona checked: PER-CISO, who 'may act as' that manager without holding the duty, and PER-PM. The program's output a run consumes, its policy and procedures, stays live at 0058 and 0071, so what remains is the producer's internal organization and nothing in a run holds it."
  - id: "REQ-SP800-128-0057"
    citation: {"ref": "SP800-128", "page": 29, "anchor": "Develop Organizational SecCM Policy"}
    kind: "imperative"
    locator: "3.1.1"
