    statement: "9. Develop a Patch Management Process A robust patch management process is important in reducing vulnerabilities in a system. As patches greatly impact the secure configuration of a system, the patch management process is integrated into SecCM at a number of points within the four SecCM phases including:"
    status: "candidate"
