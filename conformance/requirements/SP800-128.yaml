  - id: "REQ-SP800-128-0219"
    citation: {"ref": "SP800-128", "page": 52, "anchor": "Identify Vulnerabilities - If the change involves a COTS hardware or software"}
    kind: "lettered"
    locator: "3.3.3.ii"
    context: "CONDUCT SECURITY IMPACT ANALYSIS Security impact analyses are conducted by individuals or teams with technical knowledge of the system throughout the SDLC such that the impact of changes on security i"
    statement: "ii. Identify Vulnerabilities - If the change involves a COTS hardware or software product, identifying vulnerabilities may include, but is not limited to, a search of the National Vulnerability Database (NVD)21 which enumerates vulnerabilities, user experience, etc. Organizations can leverage NVD information to address known issues and remove or mitigate them before they become a concern. Other public databases of vulnerabilities, weaknesses, and threats may also be searched (e.g., US-CERT). Some automated vulnerability scanning tools (SCAP-validated tools where possible) are able to search various public vulnerability databases that apply to IT products/CPE names of IT products. If the change involves custom development, a more in-depth analysis of the security impact is conducted. Although application security is beyond the scope of this publication, there are many best practices and useful sources of information for how to ensure the security of software code."
    status: "candidate"
