  - id: "REQ-SP800-128-0212"
    citation: {"ref": "SP800-128", "page": 49, "anchor": "vi. Approve the change. This step is usually performed by the CCB."}
    kind: "modal"
    locator: "3.3.2.v"
    context: "IMPLEMENT THE CONFIGURATION CHANGE CONTROL PROCESS Although the process may have different steps and levels of rigor depending on organizational risk tolerance and/or system-impact level, configuratio"
    statement: "vi. Approve the change. This step is usually performed by the CCB. The CCB may require the implementation of additional controls if the change is necessary for mission accomplishment but has a negative impact on the security of the system and organization. Implementation of additional controls is coordinated with the AO and System Owner. vii. Implement the approved change. Once approved, authorized staff makes the change."
    status: "candidate"
  - id: "REQ-SP800-128-0213"
    citation: {"ref": "SP800-128", "page": 49, "anchor": "Depending upon the scope of the change, it may be helpful to"}
    kind: "modal"
    locator: "3.3.2.v"
    context: "IMPLEMENT THE CONFIGURATION CHANGE CONTROL PROCESS Although the process may have different steps and levels of rigor depending on organizational risk tolerance and/or system-impact level, configuratio"
    statement: "Depending upon the scope of the change, it may be helpful to develop an implementation plan. Change implementation includes changes to applicable/related configuration parameters as well as updating system documentation to reflect the change(s). Stakeholders (e.g., users, management, help desk, etc.) are notified about the change, especially if the change implementation requires a service interruption or alters the functionality of the system. In the case of the latter situation, user and help desk training may be required. viii. Verify that the change was implemented correctly (e.g., vulnerability scans, post-implementation security and functionality analysis, reassessment of affected security controls, etc.). Configuration change control is not complete and a change request not closed until it has been confirmed that the change was deployed without issues. Although the initial security impact analysis and testing may have found no impact from the change, an improperly implemented change can cause its own security issues. ix. Close out the change request. With completion of the above steps, the change request is closed out in accordance with organizational procedures. Changes are also evaluated for consistency with organizational enterprise architecture. If configuration change control procedures have been defined by the organization, the system owner interprets the procedures in the context of the target system, and refines the process to make it practical to perform. Changes to the process may need to be approved by the organizational CCB in accordance with SecCM policy. It is important that IT operations and maintenance staff who support the system are active participants in the configuration change control process and are aware of their responsibility for following it. If significant business process reengineering is needed, for example, updating help desk activities or a patch management process, training may be required."
    status: "partial"
    reason: "Close-out and verification are held; notice is a free list, and training is a judgment"
