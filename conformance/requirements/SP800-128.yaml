  - id: "REQ-SP800-128-0192"
    citation: {"ref": "SP800-128", "page": 44, "anchor": "Maintaining and updating technical specification and design documentation, system security documentation, system"}
    kind: "lettered"
    locator: "3.2.1.•"
    context: "ESTABLISH SECURE CONFIGURATIONS"
    statement: "• Maintaining and updating technical specification and design documentation, system security documentation, system procedures, etc. In many cases, organizational policies, in accordance with federal laws, standards, directives, and orders, establish generally accepted common secure configurations (e.g., National Checklist Program, DISA STIGs, CIS benchmarks). Configurations identified in the National Checklist Program Repository20 as well as SCAP-expressed checklists are a source for establishing common secure configurations. Commercial product developers are also a potential source for common secure configurations. Deviations from common secure configurations are justified and recorded (see Section 3.2.2.iii). In establishing and maintaining secure configurations, organizations consider potential interoperability conflicts with interconnected systems. Coordination of secure configuration baselines between system staff and/or the relevant CCB(s) helps ensure synchronization of secure configurations between interconnected systems to meet desired security and operational functionality. If not identified in organizational policies and procedures, the system owner, in coordination with the SSO, has the responsibility of establishing secure configurations (based on appropriate common secure configurations, if available) for a system and its constituent CIs. Regardless of the responsible party, the secure configurations comply with all applicable federal requirements and are approved in accordance with organizational policy. SDLC Phase: Begin in Development/Acquisition phase, finalize in Implementation/Assessment phase Primary Roles: System Owner; SSO Supporting Roles: SA; System/Software Developer Expected Input: Organizational and/or system-level policies and procedures including mandated or suggested common secure configurations; System Security Plan/ system security requirements; system/component technical documentation Expected Output: Initial secure baseline configuration(s) for the system and its CI(s)"
    status: "candidate"
    work_item: "WI-227"
