    statement: "Implementing secure configurations for IT products is no simple task. There are many IT products, and each has a myriad of possible parameters that can be configured. In addition, organizations have mission and business process needs which may require that IT products be configured in a particular manner. To further complicate matters, for some products, the configuration settings of the underlying platform may need to be modified to allow for the functionality required for mission accomplishment such that they deviate from the approved common secure configurations. Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the secure configuration:"
    status: "not-a-requirement"
    reason: "Lead-in to steps i to v, which each hold their own verb and are live. 'is recommended' introduces them; 'may require' and 'may need to be modified' explain why the task is hard."
  - id: "REQ-SP800-128-0194"
    citation: {"ref": "SP800-128", "page": 45, "anchor": "In the ideal environment, all IT products within an organization would be"}
    kind: "should"
    locator: "3.2.2.i"
    context: "IMPLEMENT SECURE CONFIGURATIONS Using the secure configuration previously established (see Section 3.2.1) as a starting point, the following structured approach is recommended when implementing the se"
    statement: "In the ideal environment, all IT products within an organization would be configured to the most secure state that still provided the functionality required by the organization. However, due to limited resources and other constraints, many organizations may find it"
    status: "not-a-requirement"
    reason: "First piece of a sentence cut across pages 45 and 46: 'many organizations may find it' / 'necessary to prioritize'. The rest is 0392, which holds what duty there is; this piece is an ideal and a concession."
