  - id: "REQ-DODI5000.02-0059"
    citation: {"ref": "DODI5000.02", "page": 12, "anchor": "The DoW’s highest priority is to provide warfighters with the capabilities urgently"}
    kind: "modal"
    locator: "4.2.a.(2)"
    context: "AAF PATHWAYS There are six pathways:"
    statement: "The DoW’s highest priority is to provide warfighters with the capabilities urgently needed to overcome unforeseen threats, achieve mission success, and reduce risk of casualties. Urgent operational needs and other quick reaction capabilities are identified and approved for resolution by designated authorities. The estimated cost of any single solution must not exceed $525 million in research, development, and test and evaluation; or $3.065 billion procurement in Fiscal Year 2020 constant dollars. The acquisition; product support and sustainment processes; reviews; and documents are aggressively streamlined due to operational urgency. The goal is to plan for the capability in a few weeks, with development and production measured in months. The imperative is to quickly deliver useful capability to the warfighter in a timely fashion. Figure 2 illustrates the urgent capability acquisition pathway."
    status: "deferred"
    reason: "Governs the UCA cost ceiling, 'must not exceed $525 million', and how fast the pathway runs. A dollar limit no RMF run reads."
  - id: "REQ-DODI5000.02-0060"
    citation: {"ref": "DODI5000.02", "page": 13, "anchor": "To rapidly develop fieldable prototypes within an acquisition program to demonstrate new"}
    kind: "modal"
