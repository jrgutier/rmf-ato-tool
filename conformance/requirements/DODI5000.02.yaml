rejected:
  - {"page": 4, "locator": "1.3", "reason": "no-marker", "text": "The AAF supports the DAS with the objective of delivering effective, suitable, survivable, sustainable, and affordable solutions to the end user in a timely manner. To achieve those objectives, Milestone Decision Authorities (MDAs), other Decision Authorities (DAs), and Program Managers (PMs) have broad authority to plan and manage their programs consistent with sound business practice. The AAF acquisition pathways provide opportunities for MDAs/DAs and PMs to develop acquisition strategies and employ acquisition processes that match the characteristics of the capability being acquired."}
  - {"page": 4, "locator": "1.4", "reason": "no-marker", "text": "This issuance lays the groundwork for operation of the AAF, which is part of the DAS described in DoDD 5000.01. Change 1 to this issuance cancelled the January 7, 2015 version of DoD Instruction (DoDI) 5000.02; that version was renumbered DoDI 5000.02T (Transition) during the transition period to establish a distinction between the two issuances."}
  - {"page": 6, "locator": "1.5", "reason": "lead-in", "text": "Change 2 to this issuance is administrative and:"}
  - {"page": 7, "locator": "2.1", "reason": "short", "text": "(USW(A&S))."}
  - {"page": 7, "locator": "2.1", "reason": "lead-in", "text": "The USW(A&S):"}
  - {"page": 7, "locator": "2.2", "reason": "short", "text": "(USW(R&E))."}
  - {"page": 7, "locator": "2.2", "reason": "lead-in", "text": "The USW(R&E):"}
  - {"page": 8, "locator": "2.4", "reason": "lead-in", "text": "Under the authority, direction, and control of the appropriate DoW Component head, a CAE:"}
  - {"page": 9, "locator": "3.3", "reason": "lead-in", "text": "Under the supervision of PEOs and CAEs, PMs:"}
  - {"page": 11, "locator": "4.1.b", "reason": "lead-in", "text": "b. In addition, PMs will:"}
  - {"page": 12, "locator": "4.2", "reason": "no-marker", "text": "The following pathways describe multiple acquisition approaches that provide capability to the user while capitalizing on advanced acquisition methods and improving the DoW’s ability to benefit from commercial innovation. There are six pathways:"}
  - {"page": 12, "locator": "4.2.a.(1)", "reason": "label-only", "text": "(1) Purpose."}
  - {"page": 12, "locator": "4.2.a.(1)", "reason": "no-marker", "text": "To field capabilities to fulfill urgent existing or emerging operational needs or quick reactions in less than 2 years."}
  - {"page": 12, "locator": "4.2.a.(2)", "reason": "label-only", "text": "(2) Characteristics."}
  - {"page": 12, "locator": "4.2.a.(3)", "reason": "label-only", "text": "(3) References."}
  - {"page": 12, "locator": "4.2.a.(3)", "reason": "no-marker", "text": "DoDD 5000.71 and DoDI 5000.81 establish policies and provide procedures for urgent operational needs and other quick reaction capabilities acquisition."}
  - {"page": 13, "locator": "4.2.b", "reason": "label-only", "text": "b. MTA."}
  - {"page": 13, "locator": "4.2.b.(1)", "reason": "label-only", "text": "(1) Purpose."}
  - {"page": 13, "locator": "4.2.b.(2)", "reason": "label-only", "text": "(2) Characteristics."}
  - {"page": 13, "locator": "4.2.b.(3)", "reason": "label-only", "text": "(3) References."}
  - {"page": 13, "locator": "4.2.c", "reason": "label-only", "text": "c. Major Capability Acquisition."}
  - {"page": 13, "locator": "4.2.c.(1)", "reason": "label-only", "text": "(1) Purpose."}
  - {"page": 13, "locator": "4.2.c.(1)", "reason": "no-marker", "text": "To acquire and modernize military unique programs that provide enduring capability."}
  - {"page": 13, "locator": "4.2.c.(2)", "reason": "label-only", "text": "(2) Characteristics."}
  - {"page": 14, "locator": "4.2.c.(3)", "reason": "label-only", "text": "(3) References."}
  - {"page": 14, "locator": "4.2.d", "reason": "label-only", "text": "d. Software Acquisition."}
  - {"page": 14, "locator": "4.2.d.(1)", "reason": "label-only", "text": "(1) Purpose."}
  - {"page": 14, "locator": "4.2.d.(1)", "reason": "no-marker", "text": "To facilitate rapid and iterative delivery of software capability (e.g., software-intensive systems or software-intensive components or sub-systems) to the user."}
  - {"page": 14, "locator": "4.2.d.(2)", "reason": "label-only", "text": "(2) Characteristics."}
  - {"page": 14, "locator": "4.2.d.(2)", "reason": "no-marker", "text": "This pathway integrates modern software development practice such as Agile Software Development, Development, Security, and Operations, and Lean Practices. Small cross-functional teams that include operational users, developmental and operational testers, software developers, and cybersecurity experts leverage enterprise services to deliver software rapidly and iteratively to meet the highest priority user needs. These mission-focused, government-industry teams leverage automated tools for iterative development, builds, integration, testing, production, certification, and deployment of capabilities to the operational environment."}
  - {"page": 14, "locator": "4.2.d.(3)", "reason": "label-only", "text": "(3) References."}
  - {"page": 15, "locator": "4.2.e.(1)", "reason": "label-only", "text": "(1) Purpose."}
  - {"page": 15, "locator": "4.2.e.(1)", "reason": "no-marker", "text": "To acquire information systems that support DoW business operations. This pathway:"}
  - {"page": 15, "locator": "4.2.e.(2)", "reason": "label-only", "text": "(2) Characteristics."}
  - {"page": 15, "locator": "4.2.e.(2)", "reason": "no-marker", "text": "This pathway assesses the business environment and identifies existing commercial or government solutions that could be adopted to satisfy DoW needs. The DoW reviews its business processes and revises them to align more closely with commercial or government information technology best practices. Customization of a selected information technology solution is minimal. The DoW reduces risk and maximizes benefits by using commercial-off-the-shelf software that has been successfully demonstrated in the commercial marketplace."}
  - {"page": 15, "locator": "4.2.e.(3)", "reason": "label-only", "text": "(3) Reference."}
  - {"page": 15, "locator": "4.2.e.(3)", "reason": "no-marker", "text": "DoDI 5000.75 establishes policies and provides procedures for the DBS acquisition pathway, illustrated in Figure 6."}
  - {"page": 16, "locator": "4.2.f", "reason": "label-only", "text": "f. Defense Acquisition of Services."}
  - {"page": 16, "locator": "4.2.f.(1)", "reason": "label-only", "text": "(1) Purpose."}
  - {"page": 16, "locator": "4.2.f.(1)", "reason": "no-marker", "text": "To acquire services from the private sector including knowledge-based, construction, electronics and communications, equipment, facilities, product support, logistics, medical, research and development, and transportation services."}
  - {"page": 16, "locator": "4.2.f.(2)", "reason": "label-only", "text": "(2) Characteristics."}
  - {"page": 16, "locator": "4.2.f.(2)", "reason": "no-marker", "text": "This pathway is intended to identify the required services, research the potential contractors, contract for the services, and manage performance. The seven steps of the pathway are grouped into three phases: Plan, Develop, and Execute."}
  - {"page": 16, "locator": "4.2.f.(3)", "reason": "label-only", "text": "(3) Reference."}
  - {"page": 16, "locator": "4.2.f.(3)", "reason": "no-marker", "text": "DoDI 5000.74 and the online Service Acquisition Mall establish policies and provide procedures for the defense acquisition of services pathway, illustrated in Figure 7."}
