    statement: "To rapidly develop fieldable prototypes within an acquisition program to demonstrate new capabilities or rapidly field production quantities of systems with proven technologies that require minimal development."
    status: "not-a-requirement"
    reason: "Purpose of the MTA pathway. 'require' describes technologies, 'that require minimal development', and binds no one."
  - id: "REQ-DODI5000.02-0061"
    citation: {"ref": "DODI5000.02", "page": 13, "anchor": "The MTA pathway includes rapid prototyping and rapid fielding activities. The objective"}
    kind: "modal"
    locator: "4.2.b.(2)"
    context: "Figure 2. Urgent Capability Acquisition Pathway MTA"
    statement: "The MTA pathway includes rapid prototyping and rapid fielding activities. The objective of rapid prototyping is to field a prototype meeting defined requirements that can be demonstrated in an operational environment and provide for residual operational capability within 5 years of the MTA program start date. The objective of rapid fielding is to begin production within 6 months and complete fielding within 5 years of the MTA program start date. These activities will not be subject to the procedures outlined in DoDD 5000.01, except to the extent specifically provided in the guidance. PMs will “tailor-in” reviews, assessments, and relevant documentation that results in an acquisition strategy customized to the unique characteristics and risks of their program. PMs will ensure operational, technical, and security risks are identified and reduced so that fielded systems are capable, effective, and resilient. PMs will comply with statutory requirements unless waived in accordance with a relevant provision."
    status: "candidate"
