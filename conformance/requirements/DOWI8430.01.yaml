    kind: "lettered"
    locator: "3.6.b.(2)"
    context: "AI IN SOFTWARE DEVELOPMENT Protection of Government Data"
    statement: "(2) When approved AI applications or services process information about individuals, DoW Components will comply with applicable law and policy, including the Privacy Act of 1974, DoDI 5400.11, DoD 5400.11-R, Volume 2 of DoDM 5400.11, DoDD 3115.18, and where applicable, Intelligence Community Policy Memorandum 504 (01). This includes applying appropriate data minimization and access controls."
    status: "candidate"
