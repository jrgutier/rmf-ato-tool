    locator: "3.6.c.(1)"
    context: "AI IN SOFTWARE DEVELOPMENT"
    statement: "(1) All code suggested or generated by AI, including software code, scripts, and automated tests, will be subject to the same or similar rigorous code review and security testing processes as manually written code, in accordance with Paragraph 3.5."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0213"
