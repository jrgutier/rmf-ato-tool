    statement: "This includes an understanding of legal obligations, license compatibility issues, copyleft requirements, and usage scenarios that may trigger undesirable conditions (e.g., disclosure of source code). License risk must be evaluated alongside security and operational risk and documented as part of the software risk assessment process to ensure that the inclusion or use of open source components does not violate the terms of their licenses and to enable the management of overall risk."
