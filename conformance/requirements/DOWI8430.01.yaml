  - id: "REQ-DOWI8430.01-0231"
    citation: {"ref": "DOWI8430.01", "page": 25, "anchor": "DoW Components will report custom-developed code (i.e., GOTS) unless security requirements dictate"}
    kind: "modal"
    locator: "3.7.a"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "DoW Components will report custom-developed code (i.e., GOTS) unless security requirements dictate otherwise, in accordance with DoDI 8115.02 and Public Law 118-187."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0232"
    citation: {"ref": "DOWI8430.01", "page": 25, "anchor": "DoW Components will report unclassified systems in the DoW IT Portfolio Repository"}
    kind: "lettered"
    locator: "3.7.a.(1)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "(1) DoW Components will report unclassified systems in the DoW IT Portfolio Repository and classified systems, up to SECRET//NOFORN, in the SIPRNet IT Registry to enable portfolio management and rationalization."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0233"
    citation: {"ref": "DOWI8430.01", "page": 25, "anchor": "DoW Components will share custom-developed code in a publicly or privately available"}
    kind: "lettered"
    locator: "3.7.a.(2)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "(2) DoW Components will share custom-developed code in a publicly or privately available repository to enable DoW enterprise-wide reuse. Before any release, DoW Components will remove personally identifiable information and other sensitive data from code, documentation, issues, and commit history, and mark shared artifacts in accordance with DoDI 5200.48 where applicable."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0234"
    citation: {"ref": "DOWI8430.01", "page": 25, "anchor": "Custom-developed code for which the existence of the code is classified, the"}
    kind: "lettered"
    locator: "3.7.a.(2).(a)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "(a) Custom-developed code for which the existence of the code is classified, the source code developed is primarily for use in national security systems, or the source code developed is used by an agency, or part of an agency, that is an element of the intelligence community are exempt from the requirements of Public Law 118-187."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0235"
    citation: {"ref": "DOWI8430.01", "page": 26, "anchor": "Custom-developed code with military or space application, along with its associated documentation"}
    kind: "lettered"
    locator: "3.7.a.(2).(b)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "(b) Custom-developed code with military or space application, along with its associated documentation and binaries, is designated as CTI at its inception. Pursuant to Public Law 118-187, this code will be shared for discovery and reuse across the DoW using an InnerSource model."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0236"
    citation: {"ref": "DOWI8430.01", "page": 26, "anchor": "The public release of GOTS as open-source software is encouraged to drive"}
    kind: "lettered"
    locator: "3.7.a.(2).(c)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "(c) The public release of GOTS as open-source software is encouraged to drive innovation and maximize value. As determined by the program manager or authorizing official, software without specific military or space application, or other sensitivities (e.g., intellectual property, export controls, sensitive operational capabilities (tactics, techniques, procedures)) will be developed using an open source, collaborative approach that maximizes value through reuse and minimizes maintenance and integration costs. DoW Components will use MOSA to separate CTI components from potentially releasable components."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0237"
    citation: {"ref": "DOWI8430.01", "page": 26, "anchor": "Custom-developed code released as open-source software will use permissive, widely recognized licenses"}
    kind: "lettered"
    locator: "3.7.a.(2).(d)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "(d) Custom-developed code released as open-source software will use permissive, widely recognized licenses that allow unrestricted use, modification, and distribution. These licenses must ensure compatibility and ease of reuse and be approved by the Military Departments or the DoW CIO. Software development and deployment efforts will not develop custom or unique licenses unless explicitly approved by the appropriate Military Department or the DoW CIO."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0238"
    citation: {"ref": "DOWI8430.01", "page": 26, "anchor": "Proprietary Licenses and SaaS Subscriptions."}
    kind: "lettered"
    locator: "3.7.b"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "b. Proprietary Licenses and SaaS Subscriptions."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0239"
    citation: {"ref": "DOWI8430.01", "page": 26, "anchor": "DoW Components will manage commercial software licenses and SaaS subscriptions to minimize"}
    kind: "modal"
    locator: "3.7.b"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "DoW Components will manage commercial software licenses and SaaS subscriptions to minimize cost, reduce risk, and ensure compliance with DoW policy, and will track them in accordance with the January 28, 2021, DoD CIO Memorandum and associated guidance."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0240"
    citation: {"ref": "DOWI8430.01", "page": 26, "anchor": "DoW Components will maintain an authoritative, automated inventory of all commercial software"}
    kind: "modal"
    locator: "3.7.b.(1)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "DoW Components will maintain an authoritative, automated inventory of all commercial software entitlements and SaaS subscriptions, including license data, entitlements, deployments/usage, versions, end-of-support dates, costs, and contract identifiers in accordance with DoDI 5000.76 and DoWI 8000.02. Inventories will integrate with Comply-to-Connect and Information Security Continuous Monitoring tools to detect and remediate unauthorized software and shadow IT."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0241"
    citation: {"ref": "DOWI8430.01", "page": 26, "anchor": "DoW Components will first consider DoW Enterprise Software Initiative agreements and other"}
    kind: "modal"
    locator: "3.7.b.(2)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "DoW Components will first consider DoW Enterprise Software Initiative agreements and other enterprise vehicles, and comply with Subpart 208.74 of the Defense Federal Acquisition Regulation Supplement when acquiring software or SaaS. DoW Components will coordinate with Military Departments or the DoW CIO to avoid duplicative buys and enable portfolio rationalization. DoW Enterprise Software Initiative agreements and other enterprise vehicles are available at https://www.esi.mil."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0242"
    citation: {"ref": "DOWI8430.01", "page": 27, "anchor": "DoW Components will meter usage, reconcile entitlements to deployments, remediate over- and"}
    kind: "modal"
    locator: "3.7.b.(3)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "DoW Components will meter usage, reconcile entitlements to deployments, remediate over- and under-licensing, plan and fund true-ups, reharvest unused licenses, and rationalize duplicative products to optimize total cost of ownership."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0243"
    citation: {"ref": "DOWI8430.01", "page": 27, "anchor": "SaaS Security, Authorization, and Data Safeguards."}
    kind: "lettered"
    locator: "3.7.b.(4)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "(4) SaaS Security, Authorization, and Data Safeguards."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0244"
    citation: {"ref": "DOWI8430.01", "page": 27, "anchor": "SaaS offerings must meet Federal Risk and Authorization Management Program, also known"}
    kind: "modal"
    locator: "3.7.b.(4)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "SaaS offerings must meet Federal Risk and Authorization Management Program, also known as FedRAMP, authorization appropriate to the information IL and comply with the Cloud Service Provider Security Requirements Guide. Authorizing officials will issue and maintain an Authorization to Operate in accordance with risk management processes. In accordance with applicable policy, SaaS contracts should include government data rights, data portability/export in non-proprietary formats, incident reporting, continuous monitoring, and termination/exit assistance, including timely return and destruction of data. Additional guidance will be provided on the Cybersecurity Knowledge Service at https://cybersecurityks.osd.mil."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0245"
    citation: {"ref": "DOWI8430.01", "page": 27, "anchor": "DoW Components will ensure license and subscription terms comply with Section 1653"}
    kind: "modal"
    locator: "3.7.b.(5)"
    context: "SOFTWARE ASSET MANAGEMENT"
    statement: "DoW Components will ensure license and subscription terms comply with Section 1653 of Public Law 114-328 and DoW CIO guidance prohibiting unapproved click-through, end-user license agreements; and address audit rights, usage metrics, privacy, records management, and Section 508 of Public Law 93–112, also known as “the Rehabilitation Act of 1973,” as amended, accessibility requirements."
