    statement: "(2) DoW Components will ensure that AI is designed and deployed to minimize unintended bias across relevant statistical, computational, human, and systemic contexts in alignment with DoW standards."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0224"
    citation: {"ref": "DOWI8430.01", "page": 24, "anchor": "Software using AI will implement techniques to detect and monitor for unintended"}
