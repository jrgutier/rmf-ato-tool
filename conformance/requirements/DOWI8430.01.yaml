  - id: "REQ-DOWI8430.01-0208"
    citation: {"ref": "DOWI8430.01", "page": 23, "anchor": "DoW Components will implement a risk-based review that, at a minimum, requires"}
    kind: "lettered"
    locator: "3.6.a.(2)"
    context: "AI IN SOFTWARE DEVELOPMENT"
    statement: "(2) DoW Components will implement a risk-based review that, at a minimum, requires human review and approval for AI-generated changes to security- or safety-critical functionality. AI-generated code will be considered unverified input, and its use does not absolve the developer or the government of responsibility for the resulting work product."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0209"
