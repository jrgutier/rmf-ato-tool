    context: "AI IN SOFTWARE DEVELOPMENT Protection of Government Data"
    statement: "(1) Non-public DoW information, including code, configuration scripts, infrastructure definitions, schematics, or documentation, may not be entered into or processed by generative AI applications or services unless those applications or services reside on DoW information systems and are approved for use by DoW personnel in accordance with DoDI 8500.01 and DoDI 8582.01."
