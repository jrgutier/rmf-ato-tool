    statement: "The DoW recognizes that AI-assisted software development is a significant force multiplier for the delivery of speed and quality. The requirements in this paragraph establish the security, accountability, and transparency baseline that enables teams to confidently adopt AI in mission-critical software development contexts while managing associated risks."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0206"
