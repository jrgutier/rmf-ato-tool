    locator: "3.6.e.(3)"
    context: "AI IN SOFTWARE DEVELOPMENT Reliable AI"
    statement: "(3) Software using AI will implement techniques to detect and monitor for unintended bias and will notify appropriate stakeholders of any detected model bias. Bias considerations will be addressed as part of existing risk management processes."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0225"
    citation: {"ref": "DOWI8430.01", "page": 25, "anchor": "To ensure transparency when using AI, software efforts will maintain a record"}
    kind: "modal"
    locator: "3.6.f"
    context: "AI IN SOFTWARE DEVELOPMENT"
    statement: "To ensure transparency when using AI, software efforts will maintain a record of models, versions, and significant datasets used to generate or test software. This information will be included as part of the comprehensive software evidence package, analogous to the SBOM, to enable risk assessment and traceability of AI-driven components."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0226"
    citation: {"ref": "DOWI8430.01", "page": 25, "anchor": "DoW Components will ensure that appropriate members of development teams receive training"}
    kind: "modal"
    locator: "3.6.g"
    context: "AI IN SOFTWARE DEVELOPMENT"
    statement: "DoW Components will ensure that appropriate members of development teams receive training on the principles outlined in Paragraph 3.6. This includes awareness of common AI-generated vulnerability patterns, best practices for prompt engineering to elicit secure code, and understanding the risks of intellectual property and license contamination."
    status: "candidate"
  - id: "REQ-DOWI8430.01-0227"
    citation: {"ref": "DOWI8430.01", "page": 25, "anchor": "Design and Implementation with AI."}
