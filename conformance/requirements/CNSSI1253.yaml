  - id: "REQ-CNSSI1253-0035"
    citation: {"ref": "CNSSI1253", "page": 10, "anchor": "NSS baselines are a combination of NIST SP 800-53B baselines and the"}
    kind: "indicative"
    locator: "2.5"
    context: "Relationship Between Baselines and Overlays"
    statement: "NSS baselines are a combination of NIST SP 800-53B baselines and the NIST SP 800-53 controls appropriate for NSS. The NSS baselines constitute a starting point in the process of determining the controls needed for a particular system prior to system-specific tailoring. NSS security control baselines represent the controls necessary to address the impact should there be a loss of confidentiality, integrity, or availability, as reflected by the system’s security categorization. The NSS privacy control baseline represents the privacy controls necessary for an agency to manage enterprise privacy risks."
    status: "not-a-requirement"
    reason: "Definition of the NSS baselines as a combination of SP 800-53B and NSS controls, and a starting point. Its 'should' is conditional, 'should there be a loss', and binds no one; selection is 0057, and the last sentence repeats 0011."
  - id: "REQ-CNSSI1253-0036"
    citation: {"ref": "CNSSI1253", "page": 10, "anchor": "Overlays are a set of controls and a form of bulk tailoring"}
    kind: "modal"
    locator: "2.5"
    context: "Relationship Between Baselines and Overlays"
    statement: "Overlays are a set of controls and a form of bulk tailoring agreed to by subject matter experts. Overlays are applied to address divergence from the assumptions used to create the NSS baselines (see Section 2.4), when specific controls are needed to protect a particular technology, or to address particular threats or additional requirements when processing certain types of information. The need to apply an overlay is determined by answering the applicability questions in each overlay. Overlays may or may not be baseline independent. Baseline independent overlays can be applied to any NSS baseline. As a result, there may be overlap of controls between an NSS baseline and controls identified in an overlay(s).16"
    status: "partial"
    reason: "The applicability test is held for overlays obtained from their owner (OVLX-001). The library's overlays are decided per overlay in ART-CAT '## Overlays' (C-2 step 6), prose. The other sentences define overlays and state that they may be baseline independent; nothing can fail on them."
    evidence: [{"kind": "rule", "target": "OVLX-001", "fixture": "tests/fixtures/negative/OVLX-001.yaml", "expect": "none of its applicability questions is answered yes", "claim": "constraint", "asserts": "The need to apply an overlay is determined by answering the applicability questions in each overlay: one applied with none of its applicability questions answered yes fails", "sentence": "The need to apply an overlay is determined by answering the applicability questions in each overlay."}]
    work_item: "WI-22"
  - id: "REQ-CNSSI1253-0037"
    citation: {"ref": "CNSSI1253", "page": 10, "anchor": "Privacy is the only focus area for which there is a control"}
