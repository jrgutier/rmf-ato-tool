  - id: "REQ-CNSSI1253-0104"
    citation: {"ref": "CNSSI1253", "page": 12, "anchor": "The NSS control baselines in Appendix D Tables D-1 through D-20 provide"}
    kind: "modal"
    locator: "2.6"
    context: "Tailoring Guidance"
    statement: "The NSS control baselines in Appendix D Tables D-1 through D-20 provide additional factors to consider during tailoring. These factors are presented in the Tailoring Considerations columns and include Assurance, Resiliency, and ATT&CK. Assurance is the measure of confidence in the security or privacy capability provided by the controls; it is the grounds for justified confidence that a security or privacy claim has been or will be achieved. Resiliency is the ability to prepare for and adapt to changing conditions and withstand and recover rapidly from disruption. Resiliency includes the ability to withstand and recover from deliberate attacks, accidents, or naturally occurring threats or incidents. MITRE ATT&CK®20 is a globally accessible curated knowledge base of adversary tactics and techniques based on real-world observations. A checkmark in the column indicates the factor applies to the corresponding control. If more assurance and/or resiliency is desired but those assurance- or resiliency-related controls are not in the baseline, organizations may consider tailoring them in. Conversely, before tailoring out assurance- or resiliency-related controls or controls mapped to ATT&CK, organizations may consider how doing so will impact assurance, resiliency, or the ability to respond to adversary tactics and techniques."
    status: "not-a-requirement"
    reason: "Advisory: defines Assurance, Resiliency and ATT&CK, and says organizations 'may consider' tailoring them in or weighing the effect before tailoring them out. A permission and not a minimum set; 'will impact' only names the effect to weigh. The firm assurance duty is 0074."
