  - id: "REQ-CNSSI1253-0101"
    citation: {"ref": "CNSSI1253", "page": 161, "anchor": "GUIDANCE FOR SPECIAL CONDITIONS AND COMMUNITY-WIDE USE Overlays are a specification of"}
    kind: "modal"
    locator: "Appendix E Overlays"
    context: ""
    statement: "GUIDANCE FOR SPECIAL CONDITIONS AND COMMUNITY-WIDE USE Overlays are a specification of security or privacy controls, control enhancements, guidance, and other supporting information employed during the tailoring process, that are intended to complement (and further refine) control baselines.31 An overlay specification may be more stringent or less stringent than the original control baseline specification and can be applied to multiple systems. Overlays can be used to build consensus across communities of interest and identify relevant controls that have broad-based support for very specific circumstances, situations, and/or conditions that differ from the assumptions in Section 2.4. Each overlay provides guidance to determine when it is applicable. An overlay provides control specifications and supporting risk-based justifications that are directly applicable to its subject matter for the tailoring process. Overlays may or may not be baseline independent and can be applied to any NSS baseline. As a result, there may be overlap of controls between an NSS baseline and controls identified in an overlay(s).32 Governance and Publication of CNSS Overlays The CNSS Safeguarding Working Group (SWG) manages the CNSS overlay initiation, development, approval, publication, and maintenance processes. CNSS provides downloadable copies of the approved and published CNSS overlays, as well as the template to be used in overlay development and overlay development guidance33. Overlays marked “Unclassified//For Official Use Only” (UNCLASSIFIED//FOUO) are available on the restricted CNSS website. Community or Organization Overlays Independent of the CNSS, communities and organizations may develop, publish, and manage overlays for topics not applicable to all CNSS members or organizations. Any overlay developed by communities other than CNSS are not managed or published by the CNSS but may be available on the CNSS website. To support consistency in the look and feel of all overlays, the CNSS overlay template is published and available for use."
    status: "not-a-requirement"
    reason: "Appendix E overview: what an overlay is, that overlays 'may or may not be baseline independent', that the CNSS SWG manages CNSS overlays, and that communities 'may develop' their own. 'may not' here describes overlays and forbids nothing. Definition, CNSS's own governance and a permission; the overlay duties are 0034 and 0061, and 0106 is the instruction on this page."
