    context: "RMF Step: Categorize For NSS, the Security Categorization task (Task C-2) is to:"
    statement: "When determining impact levels, each organization must be consistent with the impact levels established by the information owner. Information owners may not reside in the organization that owns and/or operates the system, and there may be multiple information owners associated with a system. All information owners must be identified to provide inputs to this activity. Each information owner sets the impact level for their information type. See Section 2.2 for a discussion about privacy risk in NSS. Sections 3.1.1 and 3.1.2 provide the activities to complete system categorization."
