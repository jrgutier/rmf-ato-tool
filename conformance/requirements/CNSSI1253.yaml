    statement: "Privacy is the only focus area for which there is a control baseline as well as a set of overlays available for organizations to use. Like the NSS security control baselines, the NSS privacy control baseline is applicable to all NSS to manage organizational PII risks. Unlike the privacy control baseline, the Privacy Overlays address system-specific privacy risks and are applicable only to systems that process PII (e.g., PII is identified during the Categorize step [see Section 3.1.1])."
