    locator: "1.1"
    context: "Purpose and Scope"
    statement: "The CNSS collaborates with NIST to ensure NIST SP 800-37, NIST SP 800-53, and NIST SP 800-53B address security and privacy safeguards to meet the requirements of NSS2 to the extent possible and provide a common foundation for information security and privacy across the United States (U.S.) Federal Government. CNSSI No. 1253 is a companion document to the NIST publications relevant to the RMF Steps, Categorize and Select (i.e., NIST SP 800-37; NIST SP 800-533; NIST SP 800-53B; NIST SP 800-60, Volume I, Guide for Mapping Types of Information and Information Systems to Security Categories; NIST SP 800-60, Volume II, Appendices to Guide for Mapping Types of Information and Information Systems to Security Categories; and Federal Information Processing Standards Publication [FIPS] 199, Standards for Security Categorization of Federal Information and Information Systems). CNSSI No. 1253 provides the security and privacy control baselines for NSS4. This Instruction also provides NSS-specific information on tailoring, developing, and applying overlays for the national security community, and parameter values for NIST SP 800-53 controls that are applicable to all NSS. CNSSI No. 1253 applies to all NSS. For NSS, where differences between the NIST documentation and this Instruction occur, this Instruction takes precedence."
    status: "partial"
    reason: "Parameter values applicable to all NSS are held by PVAL-001. 'CNSSI No. 1253 applies to all NSS' is held by rmf baseline resolve, which refuses high-water-mark unless the CNSSI1253 reference is degraded; that is a resolver error, not a rule with a negative fixture, so it cannot be cited."
