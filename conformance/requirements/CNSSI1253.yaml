  - id: "REQ-CNSSI1253-0014"
    citation: {"ref": "CNSSI1253", "page": 7, "anchor": "The CNSS adopts NIST SP 800-376, as documented in this Instruction, for"}
    kind: "modal"
    locator: "1.2.2"
    context: "Differences Between CNSSI No. 1253 and NIST Publications"
    statement: "The CNSS adopts NIST SP 800-376, as documented in this Instruction, for the national security community. The focus of this Instruction is on the RMF Categorize and Select steps. 7 These steps are informed by activities conducted during the Prepare step. The Prepare step identifies tasks at the organization level8 that produce artifacts (e.g., organization risk management strategy, organizationally tailored control baselines, common controls that may be inherited by organizational systems, an organization-wide strategy for monitoring control effectiveness) and decisions that could impact Categorize and Select activities and decisions. Similarly, the Prepare step identifies tasks at the system level9 that will impact Categorize and Select activities and decisions (e.g., identifying information types, including any information types with PII). As a result, those individuals with the responsibilities of categorizing a system or selecting controls must be aware of and incorporate the decisions made during the Prepare step. Decisions and actions at the system level should be shared with organizational stakeholders as those decisions and actions may impact organizational risk management decisions. The CNSS adopts NIST SP 800-5310 and NIST SP 800-53B, as documented in this Instruction, for the national security community. The CNSS adopts FIPS 199, establishing the security category for NSS with three discrete components: one impact level (low, moderate, or high) for each of the three security objectives (confidentiality, integrity, and availability). Preserving the three discrete components, rather than using the FIPS 200 HWM, provides specificity in allocating controls to baselines and reduces the need for subsequent tailoring (see Appendix D Tables D-1 through D-20."
    status: "partial"
    reason: "Categorizing and selecting rest on the Prepare decisions: TIN-001 fails when ART-CAT or ART-BASELINE does not list ART-ORG-CONTEXT (and ART-CAT ART-INFOTYPES) among its sources, and C-2 and S-1 list them as inputs. Unheld: 'Decisions and actions at the system level should be shared with organizational stakeholders' rests on the RACI consults of C-2, C-3 and S-6, which no rule reads."
    evidence: [{"kind": "rule", "asserts": "Those categorizing a system must incorporate the decisions made during the Prepare step", "target": "TIN-001", "fixture": "tests/fixtures/negative/TIN-001.yaml", "expect": "does not incorporate the decisions made during the Prepare step", "claim": "constraint", "sentence": "As a result, those individuals with the responsibilities of categorizing a system or selecting controls must be aware of and incorporate the decisions made during the Prepare step.", "holds_when": "ART-ORG-CONTEXT is produced or seeded"}]
    work_item: "WI-05"
  - id: "REQ-CNSSI1253-0015"
    citation: {"ref": "CNSSI1253", "page": 7, "anchor": "Personally identifiable information (PII) processed in systems (such as in mission or"}
    kind: "modal"
    locator: "2.2"
    context: "Privacy Risk in NSS"
    statement: "Personally identifiable information (PII) processed in systems (such as in mission or administrative systems or resident in audit logs) creates privacy risk. All organizations have some systems that create, collect, use, process, store, maintain, disseminate, disclose, or dispose of (collectively referred to as “process”) PII; therefore, privacy risk must be addressed at both the organizational and system levels. Failure to address privacy risk can cause individuals and organizations to experience other types of risk (e.g., psychological, reputational, financial, legal, compliance, operational security, and mission) as well as loss of trust and impact to information sharing and missions. Increasingly, failure to properly protect or manage PII may result in misuse of PII data sets (e.g., leveraging credentials of a legitimate user for adversarial purposes causing harm to national security interests, the organization, or individuals)."
    status: "partial"
    reason: "PRIV-007 fails, for a system processing PII, a privacy risk assessment that finds OMB A-130 not to apply to a federal information system, so privacy risk is addressed at the system level. Unheld: privacy risk at the organizational level (P-3), and the other types of risk a failure causes, which are descriptive."
