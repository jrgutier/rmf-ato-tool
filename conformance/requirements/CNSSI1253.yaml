    citation: {"ref": "CNSSI1253", "page": 8, "anchor": "It is possible for organizations to introduce unintended privacy risk when implementing"}
    kind: "modal"
    locator: "2.3.1"
    context: "Privacy Implementation Considerations"
    statement: "It is possible for organizations to introduce unintended privacy risk when implementing security controls. Coordination between the cybersecurity and privacy officials is an effective means to identify and address any such unintended risks at the earliest opportunity and improve cybersecurity and privacy decision making. The new Privacy Implementation Considerations column in Appendix D (Tables D-1 through D-20) is intended to manage this risk. This column identifies controls that are not included in the privacy control baseline but may introduce privacy risk if selected to meet security objectives.11 If a control is selected that includes a checkmark in the Privacy Implementation Considerations column, the system owner must confer with the SAOP, or designee, to address any privacy risks and mitigation considerations that may arise from implementing controls listed under privacy implementation considerations. Controls with checkmarks are a starting point for discussions between the AO and SAOP or their designees."
