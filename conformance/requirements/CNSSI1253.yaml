    statement: "Controls that are designated as “Withdrawn” indicate they are no longer in the NIST SP 800-53 control catalog.30 Withdrawn controls are indicated by italicized font as well as either light gray shading (control withdrawn in NIST SP 800-53 Revision 4) or dark gray shading (control withdrawn in NIST SP 800-53 Revision 5). Association of NIST Controls to Confidentiality, Integrity, and Availability: The security objectives of confidentiality, integrity, and availability are defined in 44 United States Code (U.S.C.), Section 3552. The NIST SP 800-53B baselines do not characterize controls as having relationships with security objectives. Tables D-1 through D-20 associate the controls from NIST SP 800-53, Revision 5, with the three security objectives for only those controls included in NSS baselines which can be used to inform tailoring decisions. Parameter values specified for NSS: The parameter values are defined to flow within the control text, and their placement/position within the control is noted since the entirety of the control text is not included. For example, 2nd PV indicates the value being provided is for the second parameter value within the control text. Where controls contain multiple paragraphs (e.g., a., b., c.) and possibly subparagraphs within those paragraphs (e.g., a.1., a.2, a.3), then the paragraph/subparagraph to which the value applies is provided. If a control has a parameter value in paragraph a. and paragraph c. for which values are being provided, but no parameter value to define for paragraph b., then the notation will only identify paragraph a. and c. and will not contain a reference to paragraph b. Where multiple values may be defined within a paragraph or subparagraph, their position will be noted using 1st PV or 2nd PV as appropriate."
    status: "not-a-requirement"
    reason: "Reading notes for the tables: what Withdrawn and its shading mean, where the objectives are defined, and the notation for placing a value in a control. They explain the layout: 'the notation will only identify paragraph a. and c.' tells a reader what to expect and binds no one. 0089 holds the parameter duty, and the notation is what a WI-20 transcription must parse."
