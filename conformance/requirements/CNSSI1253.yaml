  - id: "REQ-CNSSI1253-0016"
    citation: {"ref": "CNSSI1253", "page": 8, "anchor": "While security and privacy are independent and separate disciplines, they are closely"}
    kind: "indicative"
    locator: "2.2"
    context: "Privacy Risk in NSS"
    statement: "While security and privacy are independent and separate disciplines, they are closely related. It is essential for organizations to take a coordinated approach to identifying and managing security and privacy risks and complying with applicable requirements. Security controls are the safeguards or countermeasures employed within a system or an organization to protect the confidentiality, integrity, and availability of the system and its information and to manage information security risk. Privacy controls are the administrative, technical, and physical safeguards employed within a system or an organization to manage privacy risks and to ensure compliance with applicable privacy requirements."
    status: "not-a-requirement"
    reason: "Section 2 explanation and definitions: security and privacy are related, 'It is essential for organizations to take a coordinated approach', then what security and privacy controls are. The is essential restates the firmer duty at 0017, held there; the rest defines terms and binds no one."
    work_item: "WI-481"
  - id: "REQ-CNSSI1253-0017"
    citation: {"ref": "CNSSI1253", "page": 8, "anchor": "For organizations to effectively manage security and privacy risks, the security and"}
    kind: "modal"
    locator: "2.3"
    context: "Relationship Between Security and Privacy Control Baselines"
    statement: "For organizations to effectively manage security and privacy risks, the security and privacy control baselines are implemented together. Security and privacy programs must collaborate throughout the organization’s RMF implementation, especially where their objectives overlap. This collaboration will help ensure organizations have the information they need to make informed security and privacy decisions. The security and privacy control baselines, documented in Appendix D Tables D-1 through D- 20, include controls and control enhancements that address risks that arise from the loss of confidentiality, integrity, and availability for systems and information (including PII) as well as controls and control enhancements that manage privacy responsibilities under Federal Information Security Modernization Act (FISMA), Office of Management and Budget (OMB) Circular A-130, and designated Federal Information Processing Standards (FIPS) as well as privacy risks to individuals. The security and privacy control baselines are not mutually exclusive. Some controls address both privacy risks and security risks. Similarly, within the security control baselines, a control may address a confidentiality risk, an integrity risk, an availability risk, or any combination of the three."
    status: "partial"
    reason: "A baseline leaving out a privacy-baseline control differs from a fresh resolve (BSEL-002; the break itself is an erasure); the collaboration sentences are held by the RACI of every step and the rest describe the baselines"
    evidence: [{"kind": "rule", "target": "BSEL-002", "fixture": "tests/fixtures/negative/BSEL-002.privacy.yaml", "expect": "the baseline's controls differ from those a fresh `rmf baseline resolve` selects: it", "claim": "constraint", "asserts": "The security and privacy control baselines are implemented together: a baseline leaving out a privacy baseline control differs from a fresh baseline resolve", "sentence": "For organizations to effectively manage security and privacy risks, the security and privacy control baselines are implemented together."}]
