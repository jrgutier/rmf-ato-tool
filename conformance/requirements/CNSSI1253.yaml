  - id: "REQ-CNSSI1253-0040"
    citation: {"ref": "CNSSI1253", "page": 11, "anchor": "While some systems may be designed specifically to process PII, in other"}
    kind: "modal"
    locator: "2.5.1"
    context: "Relationship between Privacy Control Baseline and Privacy Overlays"
    statement: "While some systems may be designed specifically to process PII, in other systems PII may appear in unexpected ways, such as the administration of user accounts or logs of how individuals utilized the system. For systems that do not process PII, and do not have user accounts or associated logs, the NSS privacy control baseline will be sufficient. In instances in which the system processes PII, is designed to process PII, or the organization determines it must utilize the user account and associated logs for accountability, security, and/or counterintelligence purposes, then a Privacy Overlay must be applied. The SAOP or designee must approve the determination as to whether a system does or does not process PII. Similarly, if the organization determines it must employ one of the controls designated as having a privacy implementation consideration, the SAOP or designee must be consulted to determine if additional steps are required to protect privacy. It is important to note that decisions made regarding sufficiency of security and privacy controls cannot be made once and assumed to be unchangeable for the entire system life cycle. As a system’s usage evolves over time, additional data collection, data aggregation, changes in use, or other factors may necessitate the implementation of additional security and privacy controls. This may also include the application of a more stringent privacy overlay. Maintaining communications between security and privacy experts is essential to ensuring privacy information is appropriately protected over the life of the system and its information."
    status: "partial"
    reason: "Built: framework/baselines/privacy-considerations.yaml transcribes the Privacy Implementation Considerations column of Appendix D (114 rows, read from the PDF's geometry and checked against the text) and of the Classified System Overlay Table 1 (21 rows); S-2 records tailoring.yaml privacy_implementation. Held: a control designated as having a privacy implementation consideration is employed only after the SAOP or designee is consulted (PIC-001). Unheld: applying a Privacy Overlay to a system with PII or user accounts and logs, the SAOP's approval of the PII determination (WI-17), the recheck of control sufficiency over the life cycle (control-sufficiency-recheck), and the descriptive sentences."
    evidence: [{"kind": "rule", "target": "PIC-001", "fixture": "tests/fixtures/negative/PIC-001.designee.yaml", "expect": "not the SAOP or designee", "claim": "constraint", "asserts": "If the organization employs a control designated as having a privacy implementation consideration, the SAOP or designee is consulted, and a coordination with another official fails", "sentence": "Similarly, if the organization determines it must employ one of the controls designated as having a privacy implementation consideration, the SAOP or designee must be consulted to determine if additional steps are required to protect privacy.", "holds_when": "S-2 is active"}]
    work_item: "WI-32"
  - id: "REQ-CNSSI1253-0041"
    citation: {"ref": "CNSSI1253", "page": 11, "anchor": "NSS are exposed to different threats than non-NSS influenced by such factors"}
    kind: "modal"
    locator: "2.6"
    context: "Tailoring Guidance"
    statement: "NSS are exposed to different threats than non-NSS influenced by such factors as the nature of the missions they support, areas where NSS are deployed, and users who have access. As a result, tailoring is a critical activity to ensure informed risk management decisions reflect safeguards needed to support an organization’s ability to execute its mission. The baselines are a starting point designed to address a typical system, as described in the assumptions (see Section 2.4). Few systems completely align with those assumptions; therefore, tailoring is necessary to address differences specific to those systems or technologies and to ensure risks specific to the mission, system, information, and environment are appropriately identified and mitigated. Controls, regardless of source (baseline or overlays), may be tailored unless required to meet legislative, regulatory, or policy requirements. A control may be tailored out if there is no risk for which the control is designed to mitigate. For situations where there is risk and the baseline control cannot be implemented, compensating controls may be appropriate.18 All tailoring decisions must be defensible based on mission and business needs, a sound rationale, and explicit risk-based determinations. All decisions, to include the justification for the decision, must be documented in the system security and privacy plan(s) and/or the plan of action and milestones to ensure senior officials are able to make risk-informed decisions. Controls may not be tailored out due to inability to satisfy a control (e.g., resource constraints). These controls are still applicable and need to be documented for risk management decisions. Tailoring decisions may be influenced by inputs such as an organization’s risk management strategy, organizational risk assessments, current threat information, environment of operation, business impact analysis or criticality analysis.19"
    status: "partial"
    reason: "Tailoring out a control a requirement requires fails, and every removal names its basis; documentation in the plans, the defensibility of a rationale and inability as a reason are judged in prose"
    evidence: [{"kind": "rule", "asserts": "Controls may be tailored unless required to meet legislative, regulatory, or policy requirements", "target": "TLR-002", "fixture": "tests/fixtures/negative/TLR-002.required.yaml", "expect": "so it is not tailored out of the baseline", "claim": "constraint", "holds_when": "S-2 is active", "sentence": "Controls, regardless of source (baseline or overlays), may be tailored unless required to meet legislative, regulatory, or policy requirements."}, {"kind": "rule", "asserts": "All tailoring decisions name a basis that is a risk-based determination", "target": "TLR-002", "fixture": "tests/fixtures/negative/TLR-002.yaml", "expect": "is removed with no basis", "claim": "presence", "holds_when": "S-2 is active", "sentence": "All tailoring decisions must be defensible based on mission and business needs, a sound rationale, and explicit risk-based determinations."}, {"kind": "schema", "asserts": "Controls may not be tailored out due to inability; the basis for removing a control has no inability value", "target": "framework/schema/tailoring.schema.json#/properties/actions/items/properties/basis", "claim": "constraint", "sentence": "Controls may not be tailored out due to inability to satisfy a control (e.g., resource constraints)."}, {"kind": "prose", "asserts": "Tailoring decisions are documented in the system security plan", "target": "playbooks/S/S-2.md", "claim": "presence", "sentence": "All decisions, to include the justification for the decision, must be documented in the system security and privacy plan(s) and/or the plan of action and milestones to ensure senior officials are able to make risk-informed decisions."}]
    work_item: "WI-224"
    ruling_sought: [{"sentence": "A control may be tailored out if there is no risk for which the control is designed to mitigate.", "reason": "A control may be tailored out if there is no risk: a permission, which basis no-risk allows", "approved_by": "user"}, {"sentence": "For situations where there is risk and the baseline control cannot be implemented, compensating controls may be appropriate.18", "reason": "Compensating controls may be appropriate: a permission, which the compensating action allows", "approved_by": "user"}, {"sentence": "Tailoring decisions may be influenced by inputs such as an organization’s risk management strategy, organizational risk assessments, current threat information, environment of operation, business impact analysis or criticality analysis.19", "reason": "Tailoring decisions may be influenced by inputs such as: an open list of examples", "approved_by": "user"}]
