  - id: "REQ-SP800-30R1-0139"
    citation: {"ref": "SP800-30R1", "page": 38, "anchor": "The specific tasks are presented in a sequential manner for clarity. However,"}
    kind: "modal"
    locator: "3.2"
    context: "CONDUCTING THE RISK ASSESSMENT Conducting risk assessments includes the following specific tasks:"
    statement: "The specific tasks are presented in a sequential manner for clarity. However, in practice, some iteration among the tasks is both necessary and expected.45 Depending on the purpose of the risk assessment, organizations may find reordering the tasks advantageous.46 Whatever adjustments organizations make to the tasks described below, risk assessments should meet the stated purpose, scope, assumptions, and constraints established by the organizations initiating the assessments. To assist organizations in executing the individual tasks in the risk assessment process, a set of templates is provided in Appendices D through I. These appendices provide useful information for organizations in assessing risk and can also be used to record assessment results produced during essential calculations and analyses. The templates are exemplary and can be tailored by organizations in accordance with specific organizational mission/business requirements. The use of the templates is not required in order to conduct risk assessments."
    status: "partial"
    reason: "The purpose, scope, assumptions and constraints are required fields; whether the assessment meets them is judgment"
    evidence: [{"kind": "schema", "asserts": "Risk assessments meet the stated purpose established by the organizations", "target": "framework/schema/ra.schema.json#/properties/purpose/properties/statement", "claim": "presence"}]
    work_item: "WI-202"
