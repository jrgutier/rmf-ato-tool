  - id: "REQ-SP800-30R1-0233"
    citation: {"ref": "SP800-30R1", "page": 69, "anchor": "his appendix provides: (i) a description of potentially useful inputs to the"}
    kind: "should"
    locator: "THREAT EVENTS"
    context: "REPRESENTATIVE THREAT EVENTS INITIATED BY THREAT SOURCES"
    statement: "his appendix provides: (i) a description of potentially useful inputs to the threat event identification task; (ii) representative examples of adversarial threat events expressed as tactics, techniques, and procedures (TTPs) and non-adversarial threat events; (iii) an exemplary assessment scale for the relevance of those threat events; and (iv) templates for summarizing and documenting the results of the threat identification Task 2-2. Organizations can eliminate certain threat events from further consideration if no adversary with the necessary capability has been identified.51 Organizations can also modify the threat events provided to describe specific TTPs with sufficient detail52 and at the appropriate classification level.53 Organizations can use the representative threat events and predicated/expected values for the relevance of those events as a starting point with tailoring to adjust for any organization-specific conditions. Table E-5, an output from Task 2-2, provides relevant inputs to the risk tables in Appendix I."
    status: "not-a-requirement"
    reason: "Appendix E opening: what the appendix provides, and what organizations 'can eliminate', 'can modify' and 'can use'; a permission over exemplary tables."
  - id: "REQ-SP800-30R1-0234"
    citation: {"ref": "SP800-30R1", "page": 69, "anchor": "The level of detail of TTPs is established as part of the"}
    kind: "indicative"
    locator: "THREAT EVENTS"
    context: "TABLE E-1: INPUTS – THREAT EVENT IDENTIFICATION"
    statement: "The level of detail of TTPs is established as part of the organizational risk frame. The level of detail in Table E-2 is intended to support risk assessments at all three tiers, and to be tailorable to include additional details, as necessary. More detailed descriptions of threat events that exploit software, for example, can be found in the Common Attack Pattern Enumeration and Classification (CAPEC) site at http://capec.mitre.org."
    status: "not-a-requirement"
    reason: "Footnote 52 on the detail of Table E-2 and CAPEC; description. That the frame sets the level of detail is the duty in REQ-SP800-30R1-0117."
  - id: "REQ-SP800-30R1-0235"
