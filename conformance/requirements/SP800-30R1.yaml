  - id: "REQ-SP800-30R1-0236"
    citation: {"ref": "SP800-30R1", "page": 81, "anchor": "The term likelihood, as discussed in this guideline, is not likelihood in"}
    kind: "indicative"
    locator: "LIKELIHOOD OF OCCURRENCE"
    context: "TABLE G-1: INPUTS – DETERMINATION OF LIKELIHOOD"
    statement: "The term likelihood, as discussed in this guideline, is not likelihood in the strict sense of the term; rather, it is a likelihood score. Risk assessors do not define a likelihood function in the statistical sense. Instead, risk assessors assign a score (or likelihood assessment) based on available evidence, experience, and expert judgment. Combinations of factors such as targeting, intent, and capability thus can be used to produce a score representing the likelihood of threat initiation; combinations of factors such as capability and vulnerability severity can be used to produce a score representing the likelihood of adverse impacts; and combinations of these scores can be used to produce an overall likelihood score."
    status: "not-a-requirement"
    reason: "Footnote 55 explaining that likelihood here is a score; definition."
  - id: "REQ-SP800-30R1-0237"
