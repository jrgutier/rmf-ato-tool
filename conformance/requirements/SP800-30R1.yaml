  - id: "REQ-SP800-30R1-0155"
    citation: {"ref": "SP800-30R1", "page": 40, "anchor": "Supplemental Guidance: Threat events are characterized by the threat sources that could"}
    kind: "modal"
    locator: "3.2"
    context: "IDENTIFY THREAT EVENTS"
    statement: "Supplemental Guidance: Threat events are characterized by the threat sources that could initiate the events, and for adversarial events, the TTPs used to carry out attacks. Organizations define these threat events with sufficient detail to accomplish the purpose of the risk assessment. At Tier 1, threat events that could affect the organizational level are of particular interest. At Tier 2, threat events that cross or span information system boundaries, exploit functional dependencies or connectivity among systems, or affect mission/business owners, are of particular interest. At Tier 3, threat events that can be described in terms of specific information systems, technologies, or environments of operation are of particular interest. Multiple threat sources can initiate a single threat event. Conversely, a single threat source can potentially initiate any of multiple threat events. Therefore, there can be a many-to-many relationship among threat events and threat sources that can potentially increase the complexity of the risk assessment. To enable effective use and communication of risk assessment results, organizations tailor the general descriptions of threat events in Tables E- 2 and E-3 to identify how each event could potentially harm organizational operations (including mission, functions, image, or reputation) and assets, individuals, other organizations, or the Nation. For each threat event identified, organizations determine the relevance of the event. Table E-4 provides a range of values for relevance of threat events. The values selected by organizations have a direct linkage to organizational risk tolerance. The more risk averse, the greater the range of values considered. Organizations accepting greater risk or having a greater risk tolerance are more likely to require substantive evidence before giving serious consideration to threat events. If a threat event is deemed to be irrelevant, no further consideration is given."
    status: "partial"
    reason: "Threat events name the threat sources that could initiate them (SRA-001); the level of detail and the TTPs are prose"
    evidence: [{"kind": "schema", "asserts": "Threat events are characterized by the threat sources that could initiate the events", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/threat_sources", "claim": "constraint"}, {"kind": "schema", "asserts": "Organizations define threat events with sufficient detail, as events or scenarios", "target": "framework/schema/ra.schema.json#/properties/level_of_detail", "claim": "presence"}]
    work_item: "WI-205"
