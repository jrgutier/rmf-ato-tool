  - id: "REQ-SP800-30R1-0238"
    citation: {"ref": "SP800-30R1", "page": 90, "anchor": "risk assessment may identify a number of risks that have similar scores"}
    kind: "modal"
    locator: "INFORMING RISK RESPONSE"
    context: "APPROACHES TO REFINING RISK ASSESSMENT RESULTS"
    statement: "risk assessment may identify a number of risks that have similar scores (e.g., 78, 82, 83) or levels (e.g., moderate, high). When too many risks are clustered at or about the same value, organizations need a method to refine the presentation of risk assessment results, prioritizing within sets of risks with similar values, to better inform the risk response component of the risk management process.56 Such a method should be associated with the mission/business requirements of the organization, consistent with the organizational risk tolerance, and maximize the use of available resources. Prioritization is a key component of risk-based protection and becomes necessary when requirements cannot be fully satisfied or when resources do not allow all risks to be mitigated within a reasonable time frame. To facilitate informed risk response decisions by senior leaders/executives (e.g., why certain risks were or were not mitigated), the risk assessment results are annotated to enable those decision makers to know or obtain the answers to the following questions about each risk in a set with similar scores:"
    status: "partial"
    reason: "The priority order and the method for risks of similar level are recorded, and the order never puts a lower risk first (SRA-003); that the method fits the mission and risk tolerance is prose"
    evidence: [{"kind": "rule", "asserts": "Risks are prioritized: the order never ranks a lower risk above a higher one", "target": "SRA-003", "fixture": "tests/fixtures/negative/SRA-003.rank.yaml", "expect": "ranks a lower risk above a higher one", "holds_when": "ART-RA is produced or seeded on a 0.2.0 contract", "claim": "constraint"}, {"kind": "schema", "asserts": "A method to refine the presentation of risks with similar values, associated with mission requirements and risk tolerance", "target": "framework/schema/ra.schema.json#/properties/prioritization/properties/method", "claim": "presence"}]
    work_item: "WI-204"
