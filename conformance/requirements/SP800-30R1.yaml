  - id: "REQ-SP800-30R1-0225"
    citation: {"ref": "SP800-30R1", "page": 47, "anchor": "Supplemental Guidance: Organizations monitor risk factors of importance on an ongoing basis"}
    kind: "indicative"
    locator: "3.4"
    context: "MONITOR RISK FACTORS"
    statement: "Supplemental Guidance: Organizations monitor risk factors of importance on an ongoing basis to ensure that the information needed to make credible, risk-based decisions continues to be available over time. Monitoring risk factors (e.g., threat sources and threat events, vulnerabilities and predisposing conditions, capabilities and intent of adversaries, targeting of organizational operations, assets, or individuals) can provide critical information on changing conditions that could potentially affect the ability of organizations to conduct core missions and business functions. Information derived from the ongoing monitoring of risk factors can be used to refresh risk assessments at whatever frequency deemed appropriate. Organizations can also attempt to capture changes in the effectiveness of risk response measures in order to maintain the currency of risk assessments. The objective is to maintain an ongoing situational awareness of the organizational governance structures and activities, mission/business processes, information systems, and environments of operation, and thereby all of the risk factors that may affect the risk being incurred by organizations. Therefore, in applying the risk assessment context or risk frame (i.e., scope, purpose, assumptions, constraints, risk tolerances, priorities, and trade-offs), organizations consider the part risk factors play in the risk response plan executed. For example, it is expected to be quite common for the security posture of information systems (that is, the risk factors measured within those systems) to reflect only a part of the organizational risk response, with response actions at the organization level or mission/business process level providing a significant portion of that response. In such situations, monitoring only the security posture of information systems would likely not provide sufficient information to determine the overall risk being incurred by organizations. Highly capable, well-resourced, and purpose-driven threat sources can be expected to defeat commonly available protection mechanisms (e.g., by bypassing or tampering with such mechanisms)."
    status: "partial"
    reason: "Built: P-2 states in ART-ORG-CONTEXT how risk assessments are maintained, S-5 records it in conmon.yaml risk_assessment (ISCM-001 requires it), M-4 applies it, and ART-RA has a Maintenance section. Unheld: that monitoring of risk factors happens."
    evidence: [{"kind": "schema", "asserts": "Changes in monitored risk factors such as threat sources and vulnerabilities are circumstances under which the risk assessment is updated", "target": "framework/schema/conmon.schema.json#/properties/risk_assessment/properties/triggers", "claim": "constraint"}]
    work_item: "WI-260"
  - id: "REQ-SP800-30R1-0226"
    citation: {"ref": "SP800-30R1", "page": 47, "anchor": "Risk monitoring, the fourth step in the risk management process, is described"}
    kind: "indicative"
    locator: "3.4"
    context: "MONITOR RISK FACTORS"
    statement: "Risk monitoring, the fourth step in the risk management process, is described in NIST Special Publication 800-39. The step in the risk assessment process to maintain the assessment results over time overlaps to some degree with the risk monitoring step in the risk management process and the continuous monitoring step in the RMF. This overlap reinforces the important concept that many of the activities in the risk management process are complementary and mutually reinforcing. For example, the continuous monitoring step in the RMF can be used to monitor the ongoing effectiveness of deployed security controls with the results used to inform and guide a more extensive organizational risk monitoring process. At the organization level, risk monitoring may include monitoring key risk factors that are necessary to conduct subsequent risk assessments. Organizations use the risk management strategy to convey key requirements for maintaining risk assessments including, for example, risk factors to monitor and the frequency of such monitoring."
    status: "partial"
    reason: "Built: P-2 states in ART-ORG-CONTEXT how risk assessments are maintained, S-5 records it in conmon.yaml risk_assessment (ISCM-001 requires it), M-4 applies it, and ART-RA has a Maintenance section. Unheld: that the two are coordinated in a run."
    evidence: [{"kind": "schema", "asserts": "The continuous monitoring strategy carries how the risk assessment is maintained, so maintaining assessment results overlaps the RMF continuous monitoring step", "target": "framework/schema/conmon.schema.json#/properties/risk_assessment", "claim": "presence"}]
    work_item: "WI-260"
  - id: "REQ-SP800-30R1-0227"
    citation: {"ref": "SP800-30R1", "page": 48, "anchor": "Supplemental Guidance: Organizations determine the frequency and the circumstances under which risk"}
    kind: "modal"
    locator: "3.4"
    context: "UPDATE RISK ASSESSMENT"
    statement: "Supplemental Guidance: Organizations determine the frequency and the circumstances under which risk assessments are updated. Such determinations can include, for example, the current level of risk to and/or the importance of, core organizational missions/business functions. If significant changes (as defined by organizational policies, direction, or guidance) have occurred since the risk assessment was conducted, organizations can revisit the purpose, scope, assumptions, and constraints of the assessment to determine whether all tasks in the risk assessment process need to be repeated. Otherwise, the updates constitute subsequent risk assessments, identifying and assessing only how selected risk factors have changed, for example: (i) the identification of new threat events, vulnerabilities, predisposing conditions, undesirable consequences and/or affected assets; and (ii) the assessments of threat source characteristics (e.g., capability, intent, targeting, range of effects), likelihoods, and impacts. Organizations communicate the results of subsequent risk assessments to entities across all risk management tiers to ensure that responsible organizational officials have access to critical information needed to make ongoing risk-based decisions."
    status: "partial"
    reason: "Built: P-2 states in ART-ORG-CONTEXT how risk assessments are maintained, S-5 records it in conmon.yaml risk_assessment (ISCM-001 requires it), M-4 applies it, and ART-RA has a Maintenance section. Unheld: that updates happen at that frequency."
    evidence: [{"kind": "schema", "asserts": "The strategy determines how often the risk assessment is updated, with the circumstances in its triggers", "target": "framework/schema/conmon.schema.json#/properties/risk_assessment/properties/frequency", "claim": "constraint"}]
    work_item: "WI-260"
