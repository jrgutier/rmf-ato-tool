  - {"page": 10, "locator": "INTRODUCTION", "reason": "short", "text": "O"}
  - {"page": 10, "locator": "INTRODUCTION", "reason": "no-marker", "text": "An information system is a discrete set of information resources organized for the collection, processing, maintenance, use, sharing, dissemination, or disposition of information."}
  - {"page": 10, "locator": "INTRODUCTION", "reason": "no-marker", "text": "The Risk Management Framework is described in NIST Special Publication 800-37."}
  - {"page": 11, "locator": "1.2", "reason": "lead-in", "text": "This publication is intended to serve a diverse group of risk management professionals including:"}
  - {"page": 11, "locator": "1.2", "reason": "no-marker", "text": "An executive agency is: (i) an executive department specified in 5 U.S.C., Section 101; (ii) a military department specified in 5 U.S.C., Section 102; (iii) an independent establishment as defined in 5 U.S.C., Section 104(1); and (iv) a wholly owned government corporation fully subject to the provisions of 31 U.S.C., Chapter 91. In this publication, the term executive agency is synonymous with the term federal agency."}
  - {"page": 12, "locator": "1.3", "reason": "no-marker", "text": "The risk assessment approach described in this publication is supported by a series of security standards and guidelines necessary for managing information security risk. In addition to this publication, the Special Publications developed by the Joint Task Force Transformation Initiative supporting the unified information security framework for the federal government include:"}
  - {"page": 12, "locator": "1.4", "reason": "lead-in", "text": "The remainder of this special publication is organized as follows:"}
  - {"page": 12, "locator": "1.4", "reason": "no-marker", "text": "Special Publication 800-39 supersedes Special Publication 800-30 as the primary source for guidance on information security risk management."}
  - {"page": 13, "locator": "THE FUNDAMENTALS", "reason": "short", "text": "T"}
  - {"page": 13, "locator": "2.1", "reason": "short", "text": "ASSESS"}
  - {"page": 13, "locator": "2.1", "reason": "no-marker", "text": "Information and Communications Flows Information and Communications Flows"}
  - {"page": 13, "locator": "2.1", "reason": "short", "text": "FRAME"}
  - {"page": 13, "locator": "2.1", "reason": "no-marker", "text": "NIST Special Publication 800-39 provides guidance on the three tiers in the risk management hierarchy including Tier 1 (organization), Tier 2 (mission/business process), and Tier 3 (information system)."}
  - {"page": 13, "locator": "2.1", "reason": "no-marker", "text": "Many of the outputs from the risk framing step provide essential inputs to the risk assessment step and the associated risk assessment process. These include, for example, the risk management strategy, organizational risk tolerance, risk assessment methodology, assumptions, constraints, and mission/business priorities."}
  - {"page": 14, "locator": "2.2", "reason": "no-marker", "text": "Environments of operation include, but are not limited to: the threat space; vulnerabilities; missions/business functions; mission/business processes; enterprise and information security architectures; information technologies; personnel; facilities; supply chain relationships; organizational governance/culture; procurement/acquisition processes; organizational policies/procedures; organizational assumptions, constraints, risk tolerance, and priorities/trade-offs)."}
