  - {"page": 30, "locator": "2.4.3", "reason": "no-marker", "text": "NIST Special Publication 800-137 provides guidance on information security continuous monitoring for information systems and organizations."}
  - {"page": 31, "locator": "2.4.3", "reason": "no-marker", "text": "2.4.4 Risk Communications and Information Sharing"}
  - {"page": 31, "locator": "2.4.3", "reason": "no-marker", "text": "With respect to all three tiers in the risk management hierarchy, there are no specific requirements with regard to: (i) the formality, rigor, or level of detail that characterizes any particular risk assessment;"}
  - {"page": 31, "locator": "2.4.3.(ii)", "reason": "no-marker", "text": "NIST Special Publications 800-117 and 800-126 provide guidance on the Security Content Automation Protocol (SCAP) program. The SCAP program provides a standard, consistent way to communicate threat and vulnerability information."}
