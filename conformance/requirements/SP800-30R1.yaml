  - id: "REQ-SP800-30R1-0023"
    citation: {"ref": "SP800-30R1", "page": 13, "anchor": "Risk assessment is a key component of a holistic, organization-wide risk management"}
    kind: "indicative"
    locator: "2.1"
    context: "RISK MANAGEMENT PROCESS"
    statement: "Risk assessment is a key component of a holistic, organization-wide risk management process as defined in NIST Special Publication 800-39, Managing Information Security Risk: Organization, Mission, and Information System View. Risk management processes include: (i) framing risk; (ii) assessing risk; (iii) responding to risk; and (iv) monitoring risk. Figure 1 illustrates the four steps in the risk management process—including the risk assessment step and the information and communications flows necessary to make the process work effectively.13"
    status: "not-a-requirement"
    reason: "Places risk assessment among the four risk management steps and introduces Figure 1; background."
  - id: "REQ-SP800-30R1-0024"
    citation: {"ref": "SP800-30R1", "page": 13, "anchor": "The first component of risk management addresses how organizations frame risk or"}
    kind: "indicative"
    locator: "2.1"
    context: "FIGURE 1: RISK ASSESSMENT WITHIN THE RISK MANAGEMENT PROCESS"
    statement: "The first component of risk management addresses how organizations frame risk or establish a risk context—that is, describing the environment in which risk-based decisions are made. The purpose of the risk framing component is to produce a risk management strategy that addresses how organizations intend to assess risk, respond to risk, and monitor risk—making explicit and transparent the risk perceptions that organizations routinely use in making both investment and operational decisions. The risk management strategy establishes a foundation for managing risk and delineates the boundaries for risk-based decisions within organizations.14"
    status: "not-a-requirement"
    reason: "Describes the risk framing component and what a risk management strategy is; the producing duty is P-2 and the sentence is explanatory."
  - id: "REQ-SP800-30R1-0025"
    citation: {"ref": "SP800-30R1", "page": 14, "anchor": "The second component of risk management addresses how organizations assess risk within"}
    kind: "modal"
    locator: "2.1"
    context: "FIGURE 1: RISK ASSESSMENT WITHIN THE RISK MANAGEMENT PROCESS"
    statement: "The second component of risk management addresses how organizations assess risk within the context of the organizational risk frame. The purpose of the risk assessment component is to identify: (i) threats to organizations (i.e., operations, assets, or individuals) or threats directed through organizations against other organizations or the Nation; (ii) vulnerabilities internal and external to organizations;15 (iii) the harm (i.e., adverse impact) that may occur given the potential for threats exploiting vulnerabilities; and (iv) the likelihood that harm will occur. The end result is a determination of risk (i.e., typically a function of the degree of harm and likelihood of harm occurring)."
    status: "not-a-requirement"
    reason: "Describes the assess component; 'will' is inside 'the likelihood that harm will occur', a definition of a factor binding no one."
  - id: "REQ-SP800-30R1-0026"
    citation: {"ref": "SP800-30R1", "page": 14, "anchor": "The third component of risk management addresses how organizations respond to risk"}
    kind: "modal"
