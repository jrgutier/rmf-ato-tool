  - {"page": 27, "locator": "2.4", "reason": "no-marker", "text": "2.4.1 Risk Assessments at the Organizational Tier"}
  - {"page": 27, "locator": "2.4", "reason": "no-marker", "text": "Risk assessment results at Tier 1 are communicated to organizational entities at Tier 2 and Tier 3."}
  - {"page": 27, "locator": "2.4", "reason": "no-marker", "text": "In particular, risk assessment results support investment risk management. NIST Special Publication 800-65 provides guidance on integrating information security into the Capital Planning and Investment Control (CPIC) process."}
  - {"page": 28, "locator": "2.4", "reason": "no-marker", "text": "2.4.2 Risk Assessments at the Mission/Business Process Tier"}
  - {"page": 28, "locator": "2.4.3", "reason": "no-marker", "text": "NIST Special Publication 800-34 provides guidance on Information System Contingency Planning (ISCP)."}
  - {"page": 28, "locator": "2.4.3", "reason": "no-marker", "text": "NIST Special Publication 800-64 provides guidance for security considerations in the system development life cycle."}
