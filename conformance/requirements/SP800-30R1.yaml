  - id: "REQ-SP800-30R1-0301"
    citation: {"ref": "SP800-30R1", "page": 28, "anchor": "At Tier 1,"}
    kind: "promoted"
    locator: ""
    context: ""
    statement: "At Tier 1, risk assessments support organizational strategies, policies, guidance, and processes for managing risk. Risk assessments conducted at Tier 1 focus on organizational operations, assets, and individuals—comprehensive assessments across mission/business lines. For example, Tier 1 risk assessments may address: (i) the specific types of threats directed at organizations that may be different from other organizations and how those threats affect policy decisions; (ii) systemic weaknesses or deficiencies discovered in multiple organizational information systems capable of being exploited by adversaries; (iii) the potential adverse impact on organizations from the loss or compromise of organizational information (either intentionally or unintentionally); and (iv) the use of new information and computing technologies such as mobile and cloud and the potential effect on the ability of organizations to successfully carry out their missions/business operations while using those technologies. Organization-wide assessments of risk can be based solely on the assumptions, constraints, risk tolerances, priorities, and trade-offs established in the risk framing step (i.e., derived primarily from Tier 1 activities). However, more realistic and meaningful risk assessments are based on assessments conducted across multiple mission/business lines (i.e., derived primarily from Tier 2 activities). The ability of organizations to effectively use Tier 2 risk assessments as inputs to Tier 1 risk assessments is shaped by such considerations as: (i) the similarity of organizational missions/business functions and mission/business processes; and (ii) the degree of autonomy that organizational entities or subcomponents have with respect to parent organizations. In decentralized organizations or organizations with varied missions/business functions and/or environments of operation, expert analysis may be needed to normalize the results from Tier 2 risk assessments. Finally, risk assessments at Tier 1 take into consideration the identification of mission-essential functions from Continuity of Operations Plans (COOP)36 prepared by organizations when determining the contribution of Tier 2 risks. Risk assessment results at Tier 1 are communicated to organizational entities at Tier 2 and Tier 3."
    status: "partial"
    reason: "Recipients, method and what is shared are recorded, and P-14 feeds back to P-3 so a system's results reach the organization-level assessment; no rule checks that P-3 reads them, or that P-3 reads Tier 2 results and mission-essential functions"
    evidence: [{"kind": "prose", "asserts": "Tier 1 risk assessments support organizational strategies and processes for managing risk", "target": "templates/artifacts/ART-RA.md", "claim": "presence"}]
    work_item: "WI-198"
    promoted: {"reason": "Tier 1 results go down to Tiers 2 and 3; rejected as no-marker though Tiers 2 and 3 carry the same duty in live entries"}
