  - id: "REQ-SP800-30R1-0100"
    citation: {"ref": "SP800-30R1", "page": 32, "anchor": "The intent of the process description in Chapter Three is to provide"}
    kind: "indicative"
    locator: "THE PROCESS"
    context: "FIGURE 5: RISK ASSESSMENT PROCESS"
    statement: "The intent of the process description in Chapter Three is to provide a common expression of the essential elements of an effective risk assessment. It is not intended to limit organizational flexibility in conducting those assessments. Other procedures can be implemented if organizations choose to do so, consistent with the intent of the process description."
    status: "not-a-requirement"
    reason: "Footnote 43 stating the process is not meant to limit flexibility; an explicit statement of latitude."
  - id: "REQ-SP800-30R1-0101"
    citation: {"ref": "SP800-30R1", "page": 32, "anchor": "The four-step risk assessment process described in this publication is consistent with"}
    kind: "modal"
    locator: "THE PROCESS"
    context: "FIGURE 5: RISK ASSESSMENT PROCESS"
    statement: "The four-step risk assessment process described in this publication is consistent with the general risk assessment process described in NIST Special Publication 800-39. The additional steps and tasks result from the need to provide more detailed guidance to effectively carry out the specific activities associated with risk assessments."
    status: "not-a-requirement"
    reason: "Footnote 44 relating the steps to SP 800-39; 'need to' is the authors' reason for extra detail and binds no one."
  - id: "REQ-SP800-30R1-0102"
    citation: {"ref": "SP800-30R1", "page": 33, "anchor": "The first step in the risk assessment process is to prepare for"}
    kind: "indicative"
    locator: "3.1"
    context: "PREPARING FOR THE RISK ASSESSMENT"
    statement: "The first step in the risk assessment process is to prepare for the assessment. The objective of this step is to establish a context for the risk assessment. This context is established and informed by the results from the risk framing step of the risk management process. Risk framing identifies, for example, organizational information regarding policies and requirements for conducting risk assessments, specific assessment methodologies to be employed, procedures for selecting risk factors to be considered, scope of the assessments, rigor of analyses, degree of formality, and requirements that facilitate consistent and repeatable risk determinations across the organization. Organizations use the risk management strategy to the extent practicable to obtain information to prepare for the risk assessment. Preparing for a risk assessment includes the following tasks:"
    status: "candidate"
