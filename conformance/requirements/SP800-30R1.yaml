  - id: "REQ-SP800-30R1-0028"
    citation: {"ref": "SP800-30R1", "page": 14, "anchor": "The fourth component of risk management addresses how organizations monitor risk over"}
    kind: "indicative"
    locator: "2.1.(ii)"
    context: "FIGURE 1: RISK ASSESSMENT WITHIN THE RISK MANAGEMENT PROCESS"
    statement: "The fourth component of risk management addresses how organizations monitor risk over time. The purpose of the risk monitoring component is to: (i) determine the ongoing effectiveness of risk responses (consistent with the organizational risk frame); (ii) identify risk-impacting changes to organizational information systems and the environments in which the systems operate;16 and (iii) verify that planned risk responses are implemented and information security requirements derived from and traceable to organizational missions/business functions, federal legislation, directives, regulations, policies, standards, and guidelines are satisfied."
    status: "not-a-requirement"
    reason: "Describes the monitor component and its purpose; explanatory background to the steps of SP 800-39."
  - id: "REQ-SP800-30R1-0029"
    citation: {"ref": "SP800-30R1", "page": 14, "anchor": "This publication focuses on the risk assessment component of risk management—providing a"}
    kind: "indicative"
    locator: "2.2"
    context: "RISK ASSESSMENT"
    statement: "This publication focuses on the risk assessment component of risk management—providing a step-by-step process for organizations on: (i) how to prepare for risk assessments; (ii) how to conduct risk assessments; (iii) how to communicate risk assessment results to key organizational personnel; and (iv) how to maintain the risk assessments over time. Risk assessments are not simply one-time activities that provide permanent and definitive information for decision makers to guide and inform responses to information security risks. Rather, organizations employ risk assessments on an ongoing basis throughout the system development life cycle and across all of the tiers in the risk management hierarchy—with the frequency of the risk assessments and the resources applied during the assessments, commensurate with the expressly defined purpose and scope of the assessments."
    status: "partial"
    reason: "Built: P-2 states in ART-ORG-CONTEXT how risk assessments are maintained, S-5 records it in conmon.yaml risk_assessment (ISCM-001 requires it), M-4 applies it, and ART-RA has a Maintenance section. Unheld: that the assessment is in fact maintained; no rule reads update dates."
    evidence: [{"kind": "schema", "asserts": "The system risk assessment is maintained over time, not a one-time activity: conmon.yaml states how", "target": "framework/schema/conmon.schema.json#/properties/risk_assessment", "claim": "presence"}]
    work_item: "WI-260"
