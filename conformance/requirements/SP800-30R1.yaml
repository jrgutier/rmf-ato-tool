  - id: "REQ-SP800-30R1-0222"
    citation: {"ref": "SP800-30R1", "page": 47, "anchor": "The fourth step in the risk assessment process is to maintain the"}
    kind: "indicative"
    locator: "3.4"
    context: "MAINTAINING THE RISK ASSESSMENT"
    statement: "The fourth step in the risk assessment process is to maintain the assessment. The objective of this step is to keep current, the specific knowledge of the risk organizations incur. The results of risk assessments inform risk management decisions and guide risk responses. To support the ongoing review of risk management decisions (e.g., acquisition decisions, authorization decisions for information systems and common controls, connection decisions), organizations maintain risk assessments to incorporate any changes detected through risk monitoring.48 Risk monitoring provides organizations with the means to, on an ongoing basis: (i) determine the effectiveness of risk responses; (ii) identify risk-impacting changes to organizational information systems and the environments in which those systems operate;49 and (iii) verify compliance.50 Maintaining risk assessments includes the following specific tasks:"
    status: "candidate"
