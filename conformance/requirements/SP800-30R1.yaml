  - {"page": 46, "locator": "3.3", "reason": "no-marker", "text": "The third step in the risk assessment process is to communicate the assessment results and share risk-related information.47 The objective of this step is to ensure that decision makers across the organization have the appropriate risk-related information needed to inform and guide risk decisions. Communicating and sharing information consists of the following specific tasks:"}
  - {"page": 46, "locator": "3.3", "reason": "no-marker", "text": "STEP 3: COMMUNICATE AND SHARE RISK ASSESSMENT RESULTS"}
  - {"page": 46, "locator": "3.3", "reason": "no-marker", "text": "Summary of Key Activities – Communicating and Sharing Information"}
  - {"page": 47, "locator": "3.4", "reason": "no-marker", "text": "STEP 4: MAINTAIN THE ASSESSMENT"}
  - {"page": 47, "locator": "3.4", "reason": "no-marker", "text": "Thus, process-level risk response measures such as reengineering mission/business processes, wise use of information technology, or the use of alternate execution processes, in the event of compromised information systems, can be major elements of organizational risk response plans."}
  - {"page": 47, "locator": "3.4", "reason": "no-marker", "text": "NIST Special Publication 800-137 provides guidance on the ongoing monitoring of organizational information systems and environments of operation."}
  - {"page": 47, "locator": "3.4", "reason": "no-marker", "text": "Compliance verification ensures that organizations have implemented required risk response measures and that information security requirements derived from and traceable to organizational missions/business functions, federal legislation, directives, regulations, policies, and standards/guidelines are satisfied."}
  - {"page": 48, "locator": "3.4", "reason": "no-marker", "text": "Summary of Key Activities – Maintaining Risk Assessments"}
  - {"page": 65, "locator": "THREAT SOURCES", "reason": "short", "text": "T"}
  - {"page": 65, "locator": "THREAT SOURCES", "reason": "no-marker", "text": "his appendix provides: (i) a description of potentially useful inputs to the threat source identification task; (ii) an exemplary taxonomy of threat sources by type, description, and risk factors (i.e., characteristics) used to assess the likelihood and/or impact of such threat sources initiating threat events; (iii) an exemplary set of tailorable assessment scales for assessing those risk factors; and (iv) templates for summarizing and documenting the results of the threat source identification Task 2-1. The taxonomy and assessment scales in this appendix can be used by organizations as a starting point with appropriate tailoring to adjust for organization-specific conditions. Tables D-7 and D-8, outputs from Task 2-1, provide relevant inputs to the risk tables in Appendix I."}
  - {"page": 69, "locator": "THREAT EVENTS", "reason": "short", "text": "T"}
  - {"page": 69, "locator": "THREAT EVENTS", "reason": "no-marker", "text": "Each entry in Table E-2 implicitly assumes a level of adversary capability, intent, and targeting. Depending on the results of threat source identification, some entries could be determined to be irrelevant, while other entries could be combined. In addition, some entries could be rewritten in terms of an organization’s enterprise architecture."}
  - {"page": 70, "locator": "THREAT EVENTS", "reason": "no-marker", "text": "While not restricted to the APT as a threat source, the threat events in Table E-2 generally follow the flow of an APT campaign. Within each stage in a campaign, similar events are listed in order of adversary capability."}
  - {"page": 77, "locator": "VULNERABILITIES AND PREDISPOSING CONDITIONS", "reason": "short", "text": "T"}
  - {"page": 77, "locator": "VULNERABILITIES AND PREDISPOSING CONDITIONS", "reason": "no-marker", "text": "his appendix provides: (i) a description of potentially useful inputs to the vulnerability and predisposing condition identification task; (ii) an exemplary taxonomy of predisposing conditions; (iii) exemplary assessment scales for assessing the severity of vulnerabilities and the pervasiveness of predisposing conditions; and (iv) a set of templates for summarizing and documenting the results of the vulnerability and predisposing condition identification task. The taxonomy and assessment scales in this appendix can be used by organizations as a starting point with appropriate tailoring to adjust for any organization-specific conditions. Tables F-3 and F-6, outputs from Task 2-3, provide relevant inputs to the risk tables in Appendix I."}
  - {"page": 81, "locator": "LIKELIHOOD OF OCCURRENCE", "reason": "short", "text": "T"}
  - {"page": 81, "locator": "LIKELIHOOD OF OCCURRENCE", "reason": "no-marker", "text": "his appendix provides: (i) a description of potentially useful inputs to the likelihood55 determination task; and (ii) exemplary assessment scales for assessing the likelihood of threat event initiation/occurrence, the likelihood of threat events resulting in adverse impacts, and the overall likelihood of threat events being initiated or occurring and doing damage to organizational operations, assets, or individuals. The assessment scales in this appendix can be used by organizations as a starting point with appropriate tailoring to adjust for any organization-specific conditions. Tables G-2, G-3, G-4, and G-5, outputs from Task 2-4, provide relevant inputs to the risk tables in Appendix I."}
  - {"page": 83, "locator": "IMPACT", "reason": "short", "text": "T"}
  - {"page": 83, "locator": "IMPACT", "reason": "no-marker", "text": "his appendix provides: (i) a description of useful inputs to the impact determination task;"}
  - {"page": 86, "locator": "RISK DETERMINATION", "reason": "short", "text": "T"}
  - {"page": 86, "locator": "RISK DETERMINATION", "reason": "no-marker", "text": "his appendix provides: (i) a description of potentially useful inputs to the risk determination task including considerations for uncertainty of determinations; (ii) exemplary assessment scales for assessing the levels of risk; (iii) tables for describing content (i.e., data inputs) for adversarial and non-adversarial risk determinations; and (iv) templates for summarizing and documenting the results of the risk determination Task 2-6. The assessment scales in this appendix can be used as a starting point with appropriate tailoring to adjust for any organization-specific conditions. Table I-5 (adversarial risk) and Table I-7 (non-adversarial risk) are outputs from Task 2-6."}
