  - id: "REQ-SP800-30R1-0108"
    citation: {"ref": "SP800-30R1", "page": 33, "anchor": "Supplemental Guidance: The purpose of the risk assessment is explicitly stated in"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY PURPOSE"
    statement: "Supplemental Guidance: The purpose of the risk assessment is explicitly stated in sufficient detail to ensure that the assessment produces the appropriate information and supports the intended decisions. Organizations can provide guidance on how to capture and present information produced during the risk assessment (e.g., using a defined organizational template). Appendix K provides an exemplary template for a risk assessment report or the preferred vehicle for risk communication. At Tier 3, risk assessments support: (i) authorization-related decisions throughout the system development life cycle; (ii) reciprocity, particularly for reuse of assessment information; (iii) risk management activities at Tier 2; and (iv) programmatic risk management activities throughout the system development life cycle. At Tier 2, risk assessments enable organizations to: (i) understand dependencies and ways in which risks are accepted, rejected, shared, transferred, or mitigated among information systems that support organizational mission/business processes; (ii) support architectural and operational decisions for organizational risk responses (e.g., reducing dependencies, limiting connectivity, enhancing or focusing monitoring, and enhancing information/system resiliency); (iii) identify trends, so that proactive risk response strategies and courses of action for mission/business processes can be defined; and (iv) support reciprocity, particularly to enable information sharing. At Tier 1, risk assessments: (i) support the risk executive (function); and (ii) serve as a key input to the risk management strategy. In addition to these common purposes, risk assessments may have a very specific purpose, to answer a specific question (e.g., What are the risk implications of a newly discovered vulnerability or class of vulnerabilities, allowing new connectivity, outsourcing a specific function, or adopting a new technology?). Risk assessment results from all tiers can be used by organizations to inform the acquisition process by helping to ensure information security requirements are clearly specified."
    status: "partial"
    reason: "The purpose statement and at least one supported decision are required; whether the purpose is stated in sufficient detail is prose; whether it is initial or subsequent is recorded"
    evidence: [{"kind": "schema", "asserts": "The purpose of the risk assessment is explicitly stated", "target": "framework/schema/ra.schema.json#/properties/purpose/properties/statement", "claim": "presence"}, {"kind": "schema", "asserts": "The purpose of the risk assessment states whether it is an initial or subsequent assessment", "target": "framework/schema/ra.schema.json#/properties/purpose/properties/kind", "claim": "constraint"}]
    work_item: "WI-202"
  - id: "REQ-SP800-30R1-0109"
    citation: {"ref": "SP800-30R1", "page": 33, "anchor": "The purpose of the risk assessment is influenced by whether the assessment"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY PURPOSE"
    statement: "The purpose of the risk assessment is influenced by whether the assessment is: (i) an initial assessment; or (ii) a subsequent assessment initiated from the risk response or monitoring steps in the risk management process. For initial assessments, the purpose can include, for example: (i) establishing a baseline assessment of risk; or (ii) identifying threats and vulnerabilities, impacts to organizational operations and assets, individuals, other organizations, and the Nation, and other risk factors to be tracked over time as part of risk monitoring. For a reassessment initiated from the risk response step, the purpose can include, for example, providing a comparative analysis of alternative risk responses or answering a specific question (see discussion of targeted risk assessments above). Alternatively, for a reassessment initiated from the risk monitoring step, the purpose can include, for example, updating the risk assessment based on: (i) ongoing determinations of the effectiveness of security controls in organizational information systems or environments of operation; (ii) changes to information systems or environments of operation (e.g., changes to hardware, firmware, software; changes to system-specific, hybrid, or common controls; changes to mission/business processes, common infrastructure and support services, threats, vulnerabilities, or facilities); and (iii) results from compliance verification activities. Reassessments can also be initiated by organizations due to incidents that have occurred (e.g., cyber attacks compromising organizational information or information systems)."
    status: "not-a-requirement"
    reason: "Explains that a purpose differs for initial and later assessments, with examples of what it 'can include'; the entry says nothing an assessor must do beyond REQ-SP800-30R1-0108."
  - id: "REQ-SP800-30R1-0110"
    citation: {"ref": "SP800-30R1", "page": 34, "anchor": "Supplemental Guidance: The scope of the risk assessment determines what will be"}
    kind: "modal"
    locator: "3.1"
    context: "IDENTIFY SCOPE"
    statement: "Supplemental Guidance: The scope of the risk assessment determines what will be considered in the assessment. Risk assessment scope affects the range of information available to make risk-based decisions and is determined by the organizational official requesting the assessment and the risk management strategy. Establishing the scope of the risk assessment helps organizations to determine: (i) what tiers are addressed in the assessment; (ii) what parts of organizations are affected by the assessment and how they are affected; (iii) what decisions the assessment results support; (iv) how long assessment results are relevant; and (v) what influences the need to update the assessment. Establishing the scope of the risk assessment helps to determine the form and content of the risk assessment report, as well as the information to be shared as a result of conducting the assessment. At Tier 3, the scope of a risk assessment can depend on the authorization boundary for the information system. Appendix K provides an example of the type of information that may be included in a risk assessment report or the preferred vehicle for risk communication."
    status: "candidate"
    work_item: "WI-18"
  - id: "REQ-SP800-30R1-0111"
    citation: {"ref": "SP800-30R1", "page": 34, "anchor": "Organizational Applicability Organizational applicability describes which parts of the organization or suborganizations"}
    kind: "modal"
    locator: "3.1"
    context: "IDENTIFY SCOPE"
    statement: "Organizational Applicability Organizational applicability describes which parts of the organization or suborganizations are affected by the risk assessment and the risk-based decisions resulting from the assessment (including the parts of the organization or suborganizations responsible for implementing the activities and tasks related to the decisions). For example, the risk assessment can inform decisions regarding information systems supporting a particular organizational mission/business function or mission/business process. This can include decisions regarding the selection, tailoring, or supplementation of security controls for specific information systems or the selection of common controls. Alternatively, the risk assessment can inform decisions regarding a set of closely related missions/business functions or mission/business processes. The scope of the risk assessment can include not only the missions/business functions, mission/business processes, common infrastructure, or shared services on which the organization currently depends, but also those which the organization might use under specific operational conditions."
    status: "not-a-requirement"
    reason: "Defines organizational applicability with examples; 'responsible for' names parts of an organization that carry out decisions, inside a definition, and assigns nothing."
  - id: "REQ-SP800-30R1-0112"
    citation: {"ref": "SP800-30R1", "page": 34, "anchor": "Effectiveness Time Frame Organizations determine how long the results of particular risk"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY SCOPE"
    statement: "Effectiveness Time Frame Organizations determine how long the results of particular risk assessments can be used to legitimately inform risk-based decisions. The time frame is usually related to the purpose of the assessment. For example, a risk assessment to inform Tier 1 policy-related decisions needs to be relevant for an extended period of time since the governance process for policy changes can be time-consuming in many organizations. A risk assessment conducted to inform a Tier 3 decision on the use of a compensating security control for an information system may be relevant only until the next release of the information technology product providing the required security capability. Organizations determine the useful life of risk assessment results and under what conditions the current assessment results become ineffective or irrelevant. Risk monitoring can be used to help determine the effectiveness of time frames for risk assessments. In addition to risk assessment results, organizations also consider the currency/timeliness (i.e., latency or age) of all types of information/data used in assessing risk. This is of particular concern in information reuse and evaluating the validity of assessment results."
    status: "partial"
    reason: "The effectiveness time frame is a required field; how long results stay legitimate is prose"
    evidence: [{"kind": "schema", "asserts": "Organizations determine the effectiveness time frame: how long the results can inform risk-based decisions", "target": "framework/schema/ra.schema.json#/properties/scope/properties/time_frame", "claim": "presence"}]
    work_item: "WI-201"
  - id: "REQ-SP800-30R1-0113"
    citation: {"ref": "SP800-30R1", "page": 34, "anchor": "Architectural/Technology Considerations Organizations use architectural and technology considerations to clarify the scope"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY SCOPE"
    statement: "Architectural/Technology Considerations Organizations use architectural and technology considerations to clarify the scope of the risk assessment. For example, at Tier 3, the scope of the risk assessment can be an organizational information system in its environment of operations. This entails placing the information system in its architectural context, so that vulnerabilities in inherited controls can be taken into consideration. Alternately, the scope of the assessment can be limited solely to the information system, without consideration of inherited vulnerabilities. At Tier 2, the scope of the risk assessment can be defined in terms of the mission/business segment architecture (e.g., including all systems, services, and infrastructures that support a specific mission/function). For a targeted risk assessment at any tier, the specific question to be answered can restrict the scope to a specific technology."
    status: "candidate"
  - id: "REQ-SP800-30R1-0114"
    citation: {"ref": "SP800-30R1", "page": 34, "anchor": "TASK 1-3: Identify the specific assumptions and constraints under which the risk"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "TASK 1-3: Identify the specific assumptions and constraints under which the risk assessment is conducted."
    status: "covered"
    evidence: [{"kind": "schema", "asserts": "Identify the specific assumptions under which the risk assessment is conducted", "target": "framework/schema/ra.schema.json#/properties/assumptions", "claim": "constraint"}, {"kind": "schema", "asserts": "Identify the specific constraints under which the risk assessment is conducted", "target": "framework/schema/ra.schema.json#/properties/constraints", "claim": "constraint"}]
    work_item: "WI-202"
  - id: "REQ-SP800-30R1-0115"
    citation: {"ref": "SP800-30R1", "page": 34, "anchor": "Supplemental Guidance: As part of the risk framing step in the risk"}
    kind: "modal"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Supplemental Guidance: As part of the risk framing step in the risk management process, organizations make explicit the specific assumptions, constraints, risk tolerance, and priorities/trade-offs used within organizations to make investment and operational decisions. This information guides and informs organizational risk assessments. When an organizational risk management strategy cannot be cited, risk assessments identify and document assumptions and constraints. Assumptions and constraints identified by organizations during the risk framing step and included as part of the organizational risk management strategy need not be repeated in each individual risk assessment. By making assumptions and constraints explicit, there is greater clarity in the risk model selected for the risk assessment, increased reproducibility/repeatability of assessment results, and an increased opportunity for reciprocity among organizations. Organizations identify assumptions in key areas relevant to the risk assessment including, for example: (i) threat sources; (ii) threat events; (iii) vulnerabilities and predisposing conditions; (iv) potential impacts; (v) assessment and analysis approaches; and (vi) which missions/business functions are primary. Organizations also identify constraints in key areas relevant to the risk assessment including, for example: (i) resources available for the assessment; (ii) skills and expertise required for the assessment; and (iii) operational considerations related to mission/business activities. For example, organizational assumptions about how threats and impacts should be assessed can range from using worst-case projections to using best-case projections or anything in between those endpoints. Finally, organizations consider the uncertainty with regard to assumptions made or other information used in the risk assessment. Uncertainty in assumptions can affect organizational risk tolerance. For example, assumptions based on a lack of specific or credible information may reduce an organization’s risk tolerance because of the uncertainty influencing the assumptions. The following sections provide some representative examples of areas where assumptions/constraints for risk assessments may be identified."
    status: "candidate"
    work_item: "WI-167"
  - id: "REQ-SP800-30R1-0116"
    citation: {"ref": "SP800-30R1", "page": 35, "anchor": "Threat Sources Organizations determine which types of threat sources are to be"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Threat Sources Organizations determine which types of threat sources are to be considered during risk assessments. Organizations make explicit the process used to identify threats and any assumptions related to the threat identification process. If such information is identified during the risk framing step and included as part of the organizational risk management strategy, the information need not be repeated in each individual risk assessment. Risk assessments can address all types of threat sources, a single broad threat source (e.g., adversarial), or a specific threat source (e.g., trusted insider). Table D-2 provides a sample taxonomy of threat sources that can be considered by organizations in identifying assumptions for risk assessments. Organizational assumptions about threat sources to consider inform Task 2-1."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0117"
    citation: {"ref": "SP800-30R1", "page": 35, "anchor": "Threat Events Organizations determine which type of threat events are to be"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Threat Events Organizations determine which type of threat events are to be considered during risk assessments and the level of detail needed to describe such events. Descriptions of threat events can be expressed in highly general terms (e.g., phishing, distributed denial-of-service), in more descriptive terms using tactics, techniques, and procedures, or in highly specific terms (e.g., the names of specific information systems, technologies, organizations, roles, or locations). In addition, organizations consider: (i) what representative set of threat events can serve as a starting point for the identification of the specific threat events in the risk assessment; and (ii) what degree of confirmation is needed for threat events to be considered relevant for purposes of the risk assessment. For example, organizations may consider only those threat events that have been observed (either internally or by organizations that are peers/partners) or all possible threat events. Table E-2 and Table E-3 provide representative examples of adversarial and non-adversarial threat events at a level of detail that can be used for risk assessments at all tiers. Greater detail can be found in multiple sources (e.g., Common Attack Pattern Enumeration and Classification [CAPEC]). Organizational assumptions about threat events to consider and level of detail, inform Task 2-2."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0118"
    citation: {"ref": "SP800-30R1", "page": 35, "anchor": "Vulnerabilities and Predisposing Conditions Organizations determine the types of vulnerabilities that are"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Vulnerabilities and Predisposing Conditions Organizations determine the types of vulnerabilities that are to be considered during risk assessments and the level of detail provided in the vulnerability descriptions. Organizations make explicit the process used to identify vulnerabilities and any assumptions related to the vulnerability identification process. If such information is identified during the risk framing step and included as part of the organizational risk management strategy, the information need not be repeated in each individual risk assessment. Vulnerabilities can be associated with organizational information systems (e.g., hardware, software, firmware, internal controls, and security procedures) or the environments in which those systems operate (e.g., organizational governance, external relationships, mission/business processes, enterprise architectures, information security architectures). Organizations also determine the types of predisposing conditions that are to be considered during risk assessments including, for example, architectures and technologies employed, environments of operation, and personnel. Table F-4 provides representative examples of such predisposing conditions. Organizational assumptions about vulnerabilities and predisposing conditions to consider and level of detail, inform Task 2-3."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0119"
    citation: {"ref": "SP800-30R1", "page": 35, "anchor": "Likelihood Organizations make explicit the process used to conduct likelihood determinations and"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Likelihood Organizations make explicit the process used to conduct likelihood determinations and any assumptions related to the likelihood determination process. If such information is identified during the risk framing step and included as part of the organizational risk management strategy, the information need not be repeated in each individual risk assessment. Organizational assumptions about how to determine likelihood inform Task 2-4."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0120"
    citation: {"ref": "SP800-30R1", "page": 35, "anchor": "Impacts Organizations determine potential adverse impacts in terms of organizational operations (i.e.,"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Impacts Organizations determine potential adverse impacts in terms of organizational operations (i.e., missions, functions, image, and reputation), organizational assets, individuals, other organizations, and the Nation. Organizations make explicit the process used to conduct impact determinations and any assumptions related to the impact determination process. If such information is identified during the risk framing step and included as part of the organizational risk management strategy, the information need not be repeated in each individual risk assessment. Organizations address impacts at a level of detail that includes, for example, specific mission/business processes or information resources (e.g., information, personnel, equipment, funds, and information technology). Organizations may include information from Business Impact Analyses with regard to providing impact information for risk assessments. Table H-2 provides representative examples of types of impacts (i.e., harm) that can be considered by organizations. Organizational assumptions about how to determine impacts and at what level of detail, inform Task 2-5."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0121"
    citation: {"ref": "SP800-30R1", "page": 36, "anchor": "Risk Tolerance and Uncertainty Organizations determine the levels and types of risk"}
    kind: "modal"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Risk Tolerance and Uncertainty Organizations determine the levels and types of risk that are acceptable. Risk tolerance is determined as part of the organizational risk management strategy to ensure consistency across the organization. Organizations also provide guidance on how to identify reasons for uncertainty when risk factors are assessed, since uncertainty in one or more factors will propagate to the resulting evaluation of level of risk, and how to compensate for incomplete, imperfect, or assumption-dependent estimates. Consideration of uncertainty is especially important when organizations consider advanced persistent threats (APT) since assessments of the likelihood of threat event occurrence can have a great degree of uncertainty. To compensate, organizations can take a variety of approaches to determine likelihood, ranging from assuming the worst-case likelihood (certain to happen sometime in the foreseeable future) to assuming that if an event has not been observed, it is unlikely to happen. Organizations also determine what levels of risk (combination of likelihood and impact) indicate that no further analysis of any risk factors is needed."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0122"
    citation: {"ref": "SP800-30R1", "page": 36, "anchor": "Analytic Approach Risk assessments include both assessment approaches (i.e., quantitative, qualitative, semi-quantitative)"}
    kind: "modal"
    locator: "3.1"
    context: "IDENTIFY ASSUMPTIONS AND CONSTRAINTS"
    statement: "Analytic Approach Risk assessments include both assessment approaches (i.e., quantitative, qualitative, semi-quantitative) and analysis approaches (i.e., threat-oriented, asset/impact-oriented, vulnerability-oriented). Together, the assessment and analysis approaches form the analytic approach for the risk assessment. Organizations determine the level of detail and in what form, threats are analyzed including the level of granularity to describe threat events or threat scenarios. Different analysis approaches can lead to different levels of detail in characterizing adverse events for which likelihoods are determined. For example, an adverse event could be characterized in several ways (with increasing levels of detail): (i) a threat event (for which the likelihood is determined by taking the maximum overall threat sources); (ii) a pairing of a threat event and a threat source; or (iii) a detailed threat scenario/attack tree. In general, organizations can be expected to require more detail for highly critical missions/business functions, common infrastructures, or shared services on which multiple missions or business functions depend (as common points of failure), and information systems with high criticality or sensitivity. Mission/business owners may amplify this guidance for risk hot spots (information systems, services, or critical infrastructure components of particular concern) in mission/business segments."
    status: "partial"
    reason: "The assessment and analysis approaches and the level of detail are recorded; the granularity is prose"
    evidence: [{"kind": "schema", "asserts": "The analytic approach identifies the assessment approach: quantitative, qualitative or semi-quantitative", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/assessment_approach", "claim": "constraint"}, {"kind": "schema", "asserts": "The analytic approach identifies the analysis approach: threat-oriented, asset/impact-oriented or vulnerability-oriented", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/analysis_approach", "claim": "constraint"}, {"kind": "schema", "asserts": "Organizations determine the level of detail in which threats are analyzed, as threat events or threat scenarios", "target": "framework/schema/ra.schema.json#/properties/level_of_detail", "claim": "presence"}]
    work_item: "WI-203"
  - id: "REQ-SP800-30R1-0123"
    citation: {"ref": "SP800-30R1", "page": 36, "anchor": "Supplemental Guidance: Descriptive information enables organizations to be able to determine the"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY INFORMATION SOURCES"
    statement: "Supplemental Guidance: Descriptive information enables organizations to be able to determine the relevance of threat and vulnerability information. At Tier 1, descriptive information can include, for example, the type of risk management and information security governance structures in place within organizations and how the organization identifies and prioritizes critical missions/business functions. At Tier 2, descriptive information can include, for example, information about: (i) organizational mission/business processes, functional management processes, and information flows; (ii) enterprise architecture, information security architecture, and the technical/process flow architectures of the systems, common infrastructures, and shared services that fall within the scope of the risk assessment; and (iii) the external environments in which organizations operate including, for example, the relationships and dependencies with external providers. Such information is typically found in architectural documentation (particularly documentation of high-level operational views), business continuity plans, and risk assessment reports for organizational information systems, common infrastructures, and shared services that fall within the scope of the risk assessment. At Tier 3, descriptive information can include, for example, information about: (i) the design of and technologies used in organizational information systems; (ii) the environment in which the systems operate; (iii) connectivity to and dependency on other information systems; and (iv) dependencies on common infrastructures or shared services. Such information is found in system documentation, contingency plans, and risk assessment reports for other information systems, infrastructures, and services."
    status: "not-a-requirement"
    reason: "Examples of descriptive information that 'can include' at each tier and where it is found; the duty to identify sources is REQ-SP800-30R1-0287."
  - id: "REQ-SP800-30R1-0124"
    citation: {"ref": "SP800-30R1", "page": 36, "anchor": "Sources of information as described in Tables D-1, E-1, F-1, H-1, and"}
    kind: "should"
    locator: "3.1"
    context: "IDENTIFY INFORMATION SOURCES"
    statement: "Sources of information as described in Tables D-1, E-1, F-1, H-1, and I-1 can be either internal or external to organizations. Internal sources of information that can provide insights into both threats and vulnerabilities can include, for example, risk assessment reports, incident reports, security logs, trouble tickets, and monitoring results. Note that internally, information from risk assessment reports at one tier can serve as input to risk assessments at other tiers. Mission/business owners are encouraged to identify not only common infrastructure and/or support services they depend on, but also those they might use under specific operational circumstances. External sources of threat information can include cross-community organizations (e.g., US Computer Emergency Readiness Team [US-CERT], sector partners (e.g., Defense Industrial Base [DIB] using the DoD-Defense Industrial Base Collaborative Information Sharing Environment [DCISE], Information Sharing and Analysis Centers [ISACs] for critical infrastructure sectors), research and nongovernmental organizations (e.g. Carnegie Mellon University, Software Engineering Institute-CERT), and security service providers). Organizations using external sources, consider the timeliness, specificity, and relevance of threat information. Similar to sources of threat information, sources of vulnerability information can also be either internal or external to organizations (see Table F-1). Internal sources can include, for example, vulnerability assessment reports. External sources of vulnerability information are similar to the sources identified above for threat information. As described in Table F-1, information about predisposing conditions can be found in a variety of sources including, for example, descriptions of information systems, environments of operation, shared services, common infrastructures, and enterprise architecture. As described in Table H-1, sources of impact information can include, for example, mission/business impact analyses, information system component inventories, and security categorizations."
    status: "partial"
    reason: "Each information source records its provider and date; whether sources are internal or external is prose"
    evidence: [{"kind": "schema", "asserts": "Sources of information record the provider that produced them, internal or external to organizations", "target": "framework/schema/ra.schema.json#/properties/information_sources/items/properties/provider", "claim": "presence"}]
    work_item: "WI-202"
  - id: "REQ-SP800-30R1-0125"
    citation: {"ref": "SP800-30R1", "page": 37, "anchor": "Supplemental Guidance: Organizations define one or more risk models for use in"}
    kind: "indicative"
    locator: "3.1"
    context: "IDENTIFY RISK MODEL AND ANALYTIC APPROACH"
    statement: "Supplemental Guidance: Organizations define one or more risk models for use in conducting risk assessments (see Section 2.3.1) and identify which model is to be used for the risk assessment. To facilitate reciprocity of assessment results, organization-specific risk models include, or can be translated into, the risk factors (i.e., threat, vulnerability, impact, likelihood, and predisposing condition) defined in the appendices. Organizations also identify the specific analytic approach to be used for the risk assessment including the assessment approach (i.e., quantitative, qualitative, semi-quantitative) and the analysis approach (i.e., threat-oriented, asset/impact-oriented, vulnerability-oriented). For each assessable risk factor, the appendices include three assessment scales (one qualitative and two semi-quantitative scales) with correspondingly different representations. Organizations typically define (or select and tailor from the appendices) the assessment scales to be used in their risk assessments, annotating with organizationally-meaningful examples for specific values and defining break points between bins for semi-quantitative approaches. In addition, mission/business owners can provide further annotations with mission/business-specific examples. Organizations can identify different assessment scales to be used in different circumstances. For example, for low-impact information systems, organizations could use qualitative values, while for moderate- and high-impact systems, the most granular semi-quantitative values (0-100) could be used. As discussed in Special Publication 800-39, Task 1-1, Risk Assumptions, organizations vary in the relative weights applied to risk factors. Therefore, this guideline does not specify algorithms for combining semi-quantitative values. Organization-specific risk models include algorithms (e.g., formulas, tables, rules) for combining risk factors. If an organization-specific risk model is not provided in the risk management strategy as part of the risk framing step, then part of this task is to specify the algorithms for combining values. Algorithms for combining risk factors reflect organizational risk tolerance (see the supplemental guidance to Task 2-4 for examples)."
    status: "partial"
    reason: "The model, its factors and approaches are recorded; translation into the SP 800-30 factors for reciprocity is prose"
    evidence: [{"kind": "schema", "asserts": "The risk model identifies its risk factors: threat, vulnerability, impact, likelihood and predisposing condition", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/factors", "claim": "constraint"}, {"kind": "schema", "asserts": "The analytic approach identifies the assessment approach: quantitative, qualitative or semi-quantitative", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/assessment_approach", "claim": "constraint"}, {"kind": "schema", "asserts": "The analytic approach identifies the analysis approach: threat-oriented, asset/impact-oriented or vulnerability-oriented", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/analysis_approach", "claim": "constraint"}]
    work_item: "WI-203"
