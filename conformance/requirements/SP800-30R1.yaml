  - {"page": 16, "locator": "2.3", "reason": "no-marker", "text": "NIST Special Publication 800-60 discusses the concepts of criticality and sensitivity of information with respect to security categorization."}
  - {"page": 17, "locator": "2.3", "reason": "short", "text": "2.3.1 Risk Models"}
  - {"page": 17, "locator": "2.3", "reason": "short", "text": "Threats"}
  - {"page": 17, "locator": "2.3", "reason": "no-marker", "text": "A threat is any circumstance or event with the potential to adversely impact organizational operations and assets, individuals, other organizations, or the Nation through an information system via unauthorized access, destruction, disclosure, or modification of information, and/or denial of service.22 Threat events are caused by threat sources. A threat source is characterized as:"}
  - {"page": 17, "locator": "2.3.(ii)", "reason": "no-marker", "text": "Appendix D provides an exemplary taxonomy of threat sources and associated threat characteristics."}
  - {"page": 17, "locator": "2.3.(ii)", "reason": "no-marker", "text": "A threat scenario is a set of discrete threat events, attributed to a specific threat source or multiple threat sources, ordered in time, that result in adverse effects."}
  - {"page": 18, "locator": "2.3.(ii)", "reason": "no-marker", "text": "the intent and targeting aspects of a potential attack helps organizations narrow the set of threat events that are most relevant to consider."}
  - {"page": 18, "locator": "2.3.(ii)", "reason": "no-marker", "text": "Threat shifting is the response of adversaries to perceived safeguards and/or countermeasures (i.e., security controls), in which adversaries change some characteristic of their intent/targeting in order to avoid and/or overcome those safeguards/countermeasures. Threat shifting can occur in one or more domains including: (i) the time domain (e.g., a delay in an attack or illegal entry to conduct additional surveillance); (ii) the target domain (e.g., selecting a different target that is not as well protected); (iii) the resource domain (e.g., adding resources to the attack in order to reduce uncertainty or overcome safeguards and/or countermeasures); or (iv) the attack planning/attack method domain (e.g., changing the attack weapon or attack path). Threat shifting is a natural consequence of a dynamic set of interactions between threat sources and types of organizational assets targeted. With more sophisticated threat sources, it also tends to default to the path of least resistance to exploit particular vulnerabilities, and the responses are not always predictable. In addition to the safeguards and/or countermeasures implemented and the impact of a successful exploit of an organizational vulnerability, another influence on threat shifting is the benefit to the attacker. That perceived benefit on the attacker side can also influence how much and when threat shifting occurs."}
  - {"page": 18, "locator": "2.3.(ii)", "reason": "no-marker", "text": "Vulnerabilities and Predisposing Conditions"}
  - {"page": 18, "locator": "2.3.(ii)", "reason": "no-marker", "text": "The severity of a vulnerability is an assessment of the relative importance of mitigating/remediating the vulnerability. The severity can be determined by the extent of the potential adverse impact if such a vulnerability is exploited by a threat source. Thus, the severity of vulnerabilities, in general, is context-dependent."}
  - {"page": 18, "locator": "2.3.(ii)", "reason": "no-marker", "text": "NIST Special Publication 800-39 provides guidance on vulnerabilities at all three tiers in the risk management hierarchy and the potential adverse impact that can occur if threats exploit such vulnerabilities."}
  - {"page": 19, "locator": "2.3.(ii)", "reason": "short", "text": "Likelihood"}
  - {"page": 20, "locator": "2.3.(ii)", "reason": "no-marker", "text": "Threat-vulnerability pairing (i.e., establishing a one-to-one relationship between threats and vulnerabilities) may be undesirable when assessing likelihood at the mission/business function level, and in many cases, can be problematic even at the information system level due to the potentially large number of threats and vulnerabilities. This approach typically drives the level of detail in identifying threat events and vulnerabilities, rather than allowing organizations to make effective use of threat information and/or to identify threats at a level of detail that is meaningful. Depending on the level of detail in threat specification, a given threat event could exploit multiple vulnerabilities. In assessing likelihoods, organizations examine vulnerabilities that threat events could exploit and also the mission/business function susceptibility to events for which no security controls or viable implementations of security controls exist (e.g., due to functional dependencies, particularly external dependencies). In certain situations, the most effective way to reduce mission/business risk attributable to information security risk is to redesign the mission/business processes so there are viable work-arounds when information systems are compromised. Using the concept of threat scenarios described above, may help organizations overcome some of the limitations of threat-vulnerability pairing."}
  - {"page": 20, "locator": "2.3.(ii)", "reason": "short", "text": "Impact"}
  - {"page": 20, "locator": "2.3.(ii)", "reason": "no-marker", "text": "The term organizational assets can have a very wide scope of applicability to include, for example, high-impact programs, physical plant, mission-critical information systems, personnel, equipment, or a logically related group of systems. More broadly, organizational assets represent any resource or set of resources which the organization values, including intangible assets such as image or reputation."}
  - {"page": 21, "locator": "2.3.(ii)", "reason": "short", "text": "Risk"}
  - {"page": 21, "locator": "2.3.(ii)", "reason": "not-a-statement", "text": "Figure 3 illustrates an example of a risk model including the key risk factors discussed above and the relationship among the factors. Each of the risk factors is used in the risk assessment process in Chapter Three."}
