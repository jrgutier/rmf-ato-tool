  - id: "REQ-SP800-30R1-0250"
    citation: {"ref": "SP800-30R1", "page": 91, "anchor": "In conclusion, organizations can benefit significantly by refining risk assessment results in"}
    kind: "indicative"
    locator: "INFORMING RISK RESPONSE"
    context: "APPROACHES TO REFINING RISK ASSESSMENT RESULTS"
    statement: "In conclusion, organizations can benefit significantly by refining risk assessment results in preparation for the risk response step in the risk management process. During the risk response step, which is described in NIST Special Publication 800-39, organizations: (i) analyze different courses of action; (ii) conduct cost-benefit analyses; (iii) address scalability issues for large-scale implementations; (iv) examine the interactions/dependencies among risk mitigation approaches (e.g., dependencies among security controls); and (v) assess other factors affecting organizational missions/business functions. In addition, organizations address cost, schedule, and performance issues associated with information systems and information technology infrastructure supporting organizational missions/business functions."
    status: "partial"
    reason: "Cost and dependencies are required fields; scalability has no field"
    evidence: [{"kind": "schema", "asserts": "Organizations conduct cost-benefit analyses of different courses of action", "target": "framework/schema/rar.schema.json#/$defs/course_of_action/properties/cost", "claim": "presence"}]
    work_item: "WI-276"
  - id: "REQ-SP800-30R1-0251"
    citation: {"ref": "SP800-30R1", "page": 91, "anchor": "Organizations are cautioned that risk assessments are often not precise instruments of"}
    kind: "modal"
    locator: "INFORMING RISK RESPONSE"
    context: "CAUTIONARY NOTE"
    statement: "Organizations are cautioned that risk assessments are often not precise instruments of measurement and reflect the limitations of the specific assessment methodologies, tools, and techniques employed— as well as the subjectivity, quality, and trustworthiness of the data used. Risk determinations may be very coarse due to the assessment approach selected, the uncertainty in the likelihood of occurrence and impact values, and the potential mischaracterization of threats. Risks that are on the borderline between bins using the organization-defined binning scales, must ultimately be assigned to one bin. This determination could have a significant effect on the risk prioritization process. Thus, organizations should incorporate as much information as practical on particular risks during the prioritization process to ensure that the values for risks are appropriately determined (e.g., very low, low, moderate, high, very high)."
    status: "partial"
    reason: "How borderline values were assigned is a required field; its content is prose"
    evidence: [{"kind": "schema", "asserts": "Risks on the borderline between bins are assigned to one bin, and how is recorded", "target": "framework/schema/ra.schema.json#/properties/prioritization/properties/borderline", "claim": "presence"}]
    work_item: "WI-204"
  - id: "REQ-SP800-30R1-0252"
    citation: {"ref": "SP800-30R1", "page": 92, "anchor": "his appendix provides the essential elements of information that organizations can use"}
    kind: "indicative"
    locator: "RISK ASSESSMENT REPORTS"
    context: "ESSENTIAL ELEMENTS OF INFORMATION"
    statement: "his appendix provides the essential elements of information that organizations can use to communicate the results of risk assessments.57 Risk assessment results provide decision makers with an understanding of the information security risk to organizational operations and assets, individuals, other organizations, or the Nation that derive from the operation and use of organizational information systems and the environments in which those systems operate. The essential elements of information in a risk assessment can be described in three sections of the risk assessment report (or whatever vehicle is chosen by organizations to convey the results of the assessment): (i) an executive summary; (ii) the main body containing detailed risk assessment results; and (iii) supporting appendices."
    status: "not-a-requirement"
    reason: "Appendix K opening: what organizations 'can use' and the three sections a report 'can be described in'; a lead-in with no duty of its own over the items, which are live."
