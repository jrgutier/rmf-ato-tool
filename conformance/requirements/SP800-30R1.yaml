  - id: "REQ-SP800-30R1-0040"
    citation: {"ref": "SP800-30R1", "page": 15, "anchor": "Because organizational missions and business functions, supporting mission/business processes, information systems, threats,"}
    kind: "indicative"
    locator: "2.2"
    context: "RISK ASSESSMENT Risk assessments can support a wide variety of risk-based decisions and activities by organizational officials across all three tiers in the risk management hierarchy including, but no"
    statement: "Because organizational missions and business functions, supporting mission/business processes, information systems, threats, and environments of operation tend to change over time, the validity and usefulness of any risk assessment is bounded in time."
    status: "not-a-requirement"
    reason: "Observation that an assessment's validity is bounded in time; the duty to set that time frame is in REQ-SP800-30R1-0112."
  - id: "REQ-SP800-30R1-0041"
    citation: {"ref": "SP800-30R1", "page": 15, "anchor": "Risk is a measure of the extent to which an entity is"}
    kind: "modal"
    locator: "2.3"
    context: "KEY RISK CONCEPTS"
    statement: "Risk is a measure of the extent to which an entity is threatened by a potential circumstance or event, and is typically a function of: (i) the adverse impacts that would arise if the circumstance or event occurs; and (ii) the likelihood of occurrence. Information security risks are those risks that arise from the loss of confidentiality, integrity, or availability of information or information systems and reflect the potential adverse impacts to organizational operations (i.e., mission, functions, image, or reputation), organizational assets, individuals, other organizations, and the Nation. Risk assessment is the process of identifying, estimating, and prioritizing information security risks. Assessing risk requires the careful analysis of threat and vulnerability information to determine the extent to which circumstances or events could adversely impact an organization and the likelihood that such circumstances or events will occur."
    status: "not-a-requirement"
    reason: "Definitions of risk and risk assessment; 'requires' states what analysis the activity consists of and 'will' sits in a definition of likelihood, so neither binds anyone."
  - id: "REQ-SP800-30R1-0042"
    citation: {"ref": "SP800-30R1", "page": 15, "anchor": "A risk assessment methodology typically includes: (i) a risk assessment process (as"}
    kind: "indicative"
    locator: "2.3"
    context: "KEY RISK CONCEPTS"
    statement: "A risk assessment methodology typically includes: (i) a risk assessment process (as described in Chapter Three); (ii) an explicit risk model, defining key terms and assessable risk factors and the relationships among the factors; (iii) an assessment approach (e.g., quantitative, qualitative, or semi-qualitative), specifying the range of values those risk factors can assume during the risk assessment and how combinations of risk factors are identified/analyzed so that values of those factors can be functionally combined to evaluate risk; and (iv) an analysis approach (e.g., threat-oriented, asset/impact-oriented, or vulnerability-oriented), describing how combinations of risk factors are identified/analyzed to ensure adequate coverage of the problem space at a consistent level of detail. Risk assessment methodologies are defined by organizations and are a component of the risk management strategy developed during the risk framing step of the risk management process.17 Figure 2 illustrates the fundamental components in organizational risk frames and the relationships among those components."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0043"
    citation: {"ref": "SP800-30R1", "page": 16, "anchor": "Establishes Foundation for Risk Management"}
    kind: "lettered"
    locator: "2.3.-"
    context: "KEY RISK CONCEPTS"
    statement: "- Establishes Foundation for Risk Management"
    status: "not-a-requirement"
    reason: "Label read out of Figure 2, 'Establishes Foundation for Risk Management'; a figure caption fragment."
  - id: "REQ-SP800-30R1-0044"
    citation: {"ref": "SP800-30R1", "page": 16, "anchor": "Organizations can use a single risk assessment methodology or can employ multiple"}
    kind: "should"
    locator: "2.3"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS"
    statement: "Organizations can use a single risk assessment methodology or can employ multiple assessment methodologies, with the selection of a specific methodology depending on, for example: (i) the time frame for investment planning or for planning policy changes; (ii) the complexity/maturity of organizational mission/business processes (by enterprise architecture segments); (iii) the phase of the information systems in the system development life cycle; or (iv) the criticality/sensitivity18 of the information and information systems supporting the core organizational missions/business functions. By making explicit the risk model, the assessment approach, and the analysis approach employed, and requiring as part of the assessment process, a rationale for the assessed values of risk factors, organizations can increase the reproducibility and repeatability of risk assessments.19"
    status: "not-a-requirement"
    reason: "Advisory: organizations 'can use' one or more methodologies and 'can increase' repeatability; a permission and a benefit, not a minimum set."
  - id: "REQ-SP800-30R1-0045"
    citation: {"ref": "SP800-30R1", "page": 16, "anchor": "Risk assessment methodologies are influenced in large measure by the organizational risk"}
    kind: "indicative"
    locator: "2.3"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS"
    statement: "Risk assessment methodologies are influenced in large measure by the organizational risk management strategy. However, risk assessment methodologies can be customized for each risk assessment based on the purpose and scope of the assessment and the specific inputs organizations choose to make regarding the risk assessment process, risk model, assessment approach, and analysis approach."
    status: "not-a-requirement"
    reason: "Footnote 17: methodologies are influenced by the strategy and 'can be customized'; description and permission."
  - id: "REQ-SP800-30R1-0046"
    citation: {"ref": "SP800-30R1", "page": 16, "anchor": "Reproducibility refers to the ability of different experts to produce the same"}
    kind: "indicative"
    locator: "2.3"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS"
    statement: "Reproducibility refers to the ability of different experts to produce the same results from the same data. Repeatability refers to the ability to repeat the assessment in the future, in a manner that is consistent with and hence comparable to prior assessments—enabling the organization to identify trends."
    status: "not-a-requirement"
    reason: "Footnote 19 defining reproducibility and repeatability."
  - id: "REQ-SP800-30R1-0047"
    citation: {"ref": "SP800-30R1", "page": 17, "anchor": "Risk models define the risk factors to be assessed and the relationships"}
    kind: "indicative"
    locator: "2.3"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS"
    statement: "Risk models define the risk factors to be assessed and the relationships among those factors.20 Risk factors are characteristics used in risk models as inputs to determining levels of risk in risk assessments. Risk factors are also used extensively in risk communications to highlight what strongly affects the levels of risk in particular situations, circumstances, or contexts. Typical risk factors include threat, vulnerability, impact, likelihood, and predisposing condition. Risk factors can be decomposed into more detailed characteristics (e.g., threats decomposed into threat sources and threat events).21 These definitions are important for organizations to document prior to conducting risk assessments because the assessments rely upon well-defined attributes of threats, vulnerabilities, impact, and other risk factors to effectively determine risk."
    status: "partial"
    reason: "The risk factors of the model are recorded; their relationships are stated as prose in risk_model.combination"
    evidence: [{"kind": "schema", "asserts": "The risk model identifies its risk factors: threat, vulnerability, impact, likelihood and predisposing condition", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/factors", "claim": "constraint"}]
    work_item: "WI-203"
  - id: "REQ-SP800-30R1-0048"
    citation: {"ref": "SP800-30R1", "page": 17, "anchor": "the intent and method targeted at the exploitation of a vulnerability; or"}
    kind: "lettered"
    locator: "2.3.(i)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "(i) the intent and method targeted at the exploitation of a vulnerability; or (ii) a situation and method that may accidentally exploit a vulnerability. In general, types of threat sources include:"
    status: "not-a-requirement"
    reason: "Continuation of the definition of a threat source and the lead-in to its types; description. The sentence head was rejected on page 17 as no-marker and is noise too."
  - id: "REQ-SP800-30R1-0049"
    citation: {"ref": "SP800-30R1", "page": 17, "anchor": "hostile cyber or physical attacks; (ii) human errors of omission or commission;"}
    kind: "lettered"
    locator: "2.3.(i)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "(i) hostile cyber or physical attacks; (ii) human errors of omission or commission; (iii) structural failures of organization-controlled resources (e.g., hardware, software, environmental controls); and (iv) natural and man-made disasters, accidents, and failures beyond the control of the organization. Various taxonomies of threat sources have been developed.23 Some taxonomies of threat sources use the type of adverse impacts as an organizing principle. Multiple threat sources can initiate or cause the same threat event—for example, a provisioning server can be taken off-line by a denial-of-service attack, a deliberate act by a malicious system administrator, an administrative error, a hardware fault, or a power failure."
    status: "not-a-requirement"
    reason: "Types of threat sources with an example; description, the taxonomy is Table D-2."
  - id: "REQ-SP800-30R1-0050"
    citation: {"ref": "SP800-30R1", "page": 17, "anchor": "Risk models differ in the degree of detail and complexity with which"}
    kind: "indicative"
    locator: "2.3.(i)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "Risk models differ in the degree of detail and complexity with which threat events are identified. When threat events are identified with great specificity, threat scenarios can be modeled, developed, and analyzed.24 Threat events for cyber or physical attacks are characterized by the tactics, techniques, and procedures (TTPs) employed by adversaries. Understanding adversary-based threat events gives organizations insights into the capabilities associated with certain threat sources. In addition, having greater knowledge about who is carrying out the attacks gives organizations a better understanding of what adversaries desire to gain by the attacks. Knowing"
    status: "not-a-requirement"
    reason: "Explains how risk models differ in detail and what knowing an adversary gives; description. The paragraph runs on into page 18."
  - id: "REQ-SP800-30R1-0051"
    citation: {"ref": "SP800-30R1", "page": 17, "anchor": "identification of the relationships among those risk factors (both conceptual relationships, presented"}
    kind: "lettered"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "(ii) identification of the relationships among those risk factors (both conceptual relationships, presented descriptively, and algorithms for combining values). The risk model presented in this section (and described in Appendices D-I) does not specify algorithms for combining values."
    status: "partial"
    reason: "How values combine is a required prose field; no rule recomputes the algorithm"
    evidence: [{"kind": "schema", "asserts": "The relationships among risk factors include the algorithms for combining values", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/combination", "claim": "presence"}]
    work_item: "WI-203"
  - id: "REQ-SP800-30R1-0052"
    citation: {"ref": "SP800-30R1", "page": 17, "anchor": "A risk factor can have a single assessable characteristic (e.g., impact severity)"}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "A risk factor can have a single assessable characteristic (e.g., impact severity) or multiple characteristics, some of which may be assessable and some of which may not be assessable. Characteristics which are not assessable typically help determine what lower-level characteristics are relevant. For example, a threat source has a (characteristic) threat type (using a taxonomy of threat types, which are nominal rather than assessable). The threat type determines which of the more detailed characteristics are relevant (e.g., a threat source of type adversary has associated characteristics of capabilities, intent, and targeting, which are directly assessable characteristics)."
    status: "not-a-requirement"
    reason: "Footnote 21 explaining assessable characteristics; 'may not' says some characteristics are not assessable, a fact about factors that forbids nothing."
  - id: "REQ-SP800-30R1-0053"
    citation: {"ref": "SP800-30R1", "page": 17, "anchor": "Organizations can choose to specify threat events as: (i) single events, actions,"}
    kind: "should"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "Organizations can choose to specify threat events as: (i) single events, actions, or circumstances; or (ii) sets and/or sequences of related actions, activities, and/or circumstances."
    status: "not-a-requirement"
    reason: "Footnote 22, advisory: organizations 'can choose' single events or sequences; a permission."
  - id: "REQ-SP800-30R1-0054"
    citation: {"ref": "SP800-30R1", "page": 18, "anchor": "A vulnerability is a weakness in an information system, system security procedures,"}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "A vulnerability is a weakness in an information system, system security procedures, internal controls, or implementation that could be exploited by a threat source.25 Most information system vulnerabilities can be associated with security controls that either have not been applied (either intentionally or unintentionally), or have been applied, but retain some weakness. However, it is also important to allow for the possibility of emergent vulnerabilities that can arise naturally over time as organizational missions/business functions evolve, environments of operation change, new technologies proliferate, and new threats emerge. In the context of such change, existing security controls may become inadequate and may need to be reassessed for effectiveness. The tendency for security controls to potentially degrade in effectiveness over time reinforces the need to maintain risk assessments during the entire system development life cycle and also the importance of continuous monitoring programs to obtain ongoing situational awareness of the organizational security posture."
    status: "not-a-requirement"
    reason: "Definition of a vulnerability and an explanation of emergent weakness; 'need to' says controls may have to be looked at again and that degradation reinforces a point, and binds no one. Task 4-1 and Task 4-2 carry the duty."
  - id: "REQ-SP800-30R1-0055"
    citation: {"ref": "SP800-30R1", "page": 18, "anchor": "Vulnerabilities are not identified only within information systems. Viewing information systems in"}
    kind: "indicative"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "Vulnerabilities are not identified only within information systems. Viewing information systems in a broader context, vulnerabilities can be found in organizational governance structures (e.g., the lack of effective risk management strategies and adequate risk framing, poor intra-agency communications, inconsistent decisions about relative priorities of missions/business functions, or misalignment of enterprise architecture to support mission/business activities). Vulnerabilities can also be found in external relationships (e.g., dependencies on particular energy sources, supply chains, information technologies, and telecommunications providers), mission/business processes (e.g., poorly defined processes or processes that are not risk-aware), and enterprise/information security architectures (e.g., poor architectural decisions resulting in lack of diversity or resiliency in organizational information systems).26"
    status: "not-a-requirement"
    reason: "Examples of vulnerabilities outside information systems; description, with the external side held in ra-external-risk."
  - id: "REQ-SP800-30R1-0056"
    citation: {"ref": "SP800-30R1", "page": 19, "anchor": "In addition to vulnerabilities as described above, organizations also consider predisposing conditions."}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "In addition to vulnerabilities as described above, organizations also consider predisposing conditions. A predisposing condition is a condition that exists within an organization, a mission or business process, enterprise architecture, information system, or environment of operation, which affects (i.e., increases or decreases) the likelihood that threat events, once initiated, result in adverse impacts to organizational operations and assets, individuals, other organizations, or the Nation.27 Predisposing conditions include, for example, the location of a facility in a hurricane- or flood-prone region (increasing the likelihood of exposure to hurricanes or floods) or a stand-alone information system with no external network connectivity (decreasing the likelihood of exposure to a network-based cyber attack). Vulnerabilities resulting from predisposing conditions that cannot be easily corrected could include, for example, gaps in contingency plans, use of outdated technologies, or weaknesses/deficiencies in information system backup and failover mechanisms. In all cases, these types of vulnerabilities create a predisposition toward threat events having adverse impacts on organizations. Vulnerabilities (including those attributed to predisposing conditions) are part of the overall security posture of organizational information systems and environments of operation that can affect the likelihood of occurrence of a threat event."
    status: "candidate"
  - id: "REQ-SP800-30R1-0057"
    citation: {"ref": "SP800-30R1", "page": 19, "anchor": "The likelihood of occurrence is a weighted risk factor based on an"}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "The likelihood of occurrence is a weighted risk factor based on an analysis of the probability that a given threat is capable of exploiting a given vulnerability (or set of vulnerabilities). The likelihood risk factor combines an estimate of the likelihood that the threat event will be initiated with an estimate of the likelihood of impact (i.e., the likelihood that the threat event results in adverse impacts). For adversarial threats, an assessment of likelihood of occurrence is typically based on: (i) adversary intent; (ii) adversary capability; and (iii) adversary targeting. For other than adversarial threat events, the likelihood of occurrence is estimated using historical evidence, empirical data, or other factors. Note that the likelihood that a threat event will be initiated or will occur is assessed with respect to a specific time frame (e.g., the next six months, the next year, or the period until a specified milestone is reached). If a threat event is almost certain to be initiated or occur in the (specified or implicit) time frame, the risk assessment may take into consideration the estimated frequency of the event. The likelihood of threat occurrence can also be based on the state of the organization (including for example, its core mission/business processes, enterprise architecture, information security architecture, information systems, and environments in which those systems operate)—taking into consideration predisposing conditions and the presence and effectiveness of deployed security controls to protect against unauthorized/undesirable behavior, detect and limit damage, and/or maintain or restore mission/business capabilities. The likelihood of impact addresses the probability (or possibility) that the threat event will result in an adverse impact, regardless of the magnitude of harm that can be expected."
    status: "partial"
    reason: "The three likelihood steps are required fields; the combination of their values is the organization's algorithm, stated as prose in risk_model.combination, which no rule recomputes"
    evidence: [{"kind": "schema", "asserts": "Each threat event assesses the likelihood of initiation or occurrence", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood_initiation", "claim": "constraint"}, {"kind": "schema", "asserts": "Each threat event assesses the likelihood that it results in adverse impacts once initiated or occurring", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood_impact", "claim": "constraint"}, {"kind": "schema", "asserts": "For adversarial threats, likelihood of occurrence is based on adversary capability, intent and targeting", "target": "framework/schema/ra.schema.json#/properties/threat_sources/items/properties/capability", "claim": "constraint"}]
    work_item: "WI-200"
  - id: "REQ-SP800-30R1-0058"
    citation: {"ref": "SP800-30R1", "page": 19, "anchor": "The concept of predisposing condition is also related to the term susceptibility"}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "The concept of predisposing condition is also related to the term susceptibility or exposure. Organizations are not susceptible to risk (or exposed to risk) if a threat cannot exploit a vulnerability to cause adverse impact. For example, organizations that do not employ database management systems are not vulnerable to the threat of SQL injections and therefore, are not susceptible to such risk."
    status: "not-a-requirement"
    reason: "Footnote 27 relating predisposing condition to susceptibility; 'cannot' says a threat lacking an exploitable weakness poses no exposure, a fact, not a prohibition."
  - id: "REQ-SP800-30R1-0059"
    citation: {"ref": "SP800-30R1", "page": 20, "anchor": "Organizations typically employ a three-step process to determine the overall likelihood of"}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "Organizations typically employ a three-step process to determine the overall likelihood of threat events. First, organizations assess the likelihood that threat events will be initiated (for adversarial threat events) or will occur (for non-adversarial threat events). Second, organizations assess the likelihood that the threat events once initiated or occurring, will result in adverse impacts or harm to organizational operations and assets, individuals, other organizations, or the Nation. Finally, organizations assess the overall likelihood as a combination of likelihood of initiation/occurrence and likelihood of resulting in adverse impact."
    status: "partial"
    reason: "The three likelihood steps are required fields; the combination of their values is the organization's algorithm, stated as prose in risk_model.combination, which no rule recomputes"
    evidence: [{"kind": "schema", "asserts": "Each threat event assesses the likelihood of initiation or occurrence", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood_initiation", "claim": "constraint"}, {"kind": "schema", "asserts": "Each threat event assesses the likelihood that it results in adverse impacts once initiated or occurring", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood_impact", "claim": "constraint"}, {"kind": "schema", "asserts": "Each threat event assesses the overall likelihood", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood", "claim": "constraint"}]
    work_item: "WI-200"
  - id: "REQ-SP800-30R1-0060"
    citation: {"ref": "SP800-30R1", "page": 20, "anchor": "The level of impact from a threat event is the magnitude of"}
    kind: "indicative"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "The level of impact from a threat event is the magnitude of harm that can be expected to result from the consequences of unauthorized disclosure of information, unauthorized modification of information, unauthorized destruction of information, or loss of information or information system availability. Such harm can be experienced by a variety of organizational and non-organizational stakeholders including, for example, heads of agencies, mission and business owners, information owners/stewards, mission/business process owners, information system owners, or individuals/groups in the public or private sectors relying on the organization—in essence, anyone with a vested interest in the organization’s operations, assets, or individuals, including other organizations in partnership with the organization, or the Nation.28 Organizations make explicit: (i) the process used to conduct impact determinations; (ii) assumptions related to impact determinations; (iii) sources and methods for obtaining impact information; and (iv) the rationale for conclusions reached with regard to impact determinations."
    status: "partial"
    reason: "Each threat event records its impact level and the harm and asset affected; the stakeholders who experience the harm are prose"
    evidence: [{"kind": "schema", "asserts": "The level of impact from a threat event is the magnitude of harm that can be expected", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/impact", "claim": "constraint"}]
    work_item: "WI-200"
  - id: "REQ-SP800-30R1-0061"
    citation: {"ref": "SP800-30R1", "page": 20, "anchor": "Organizations may explicitly define how established priorities and values guide the identification"}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "Organizations may explicitly define how established priorities and values guide the identification of high-value assets and the potential adverse impacts to organizational stakeholders. If such information is not defined, priorities and values related to identifying targets of threat sources and associated organizational impacts can typically be derived from strategic planning and policies. For example, security categorization levels indicate the organizational impacts of compromising different types of information. Privacy Impact Assessments and criticality levels (when defined as part of contingency planning or Mission/Business Impact Analysis) indicate the adverse impacts of destruction, corruption, or loss of accountability for information resources to organizations."
    status: "not-a-requirement"
    reason: "Advisory: organizations 'may' define how priorities guide high-value assets; 'accountability' is a word in an example of harm from losing information resources, and no duty attaches."
  - id: "REQ-SP800-30R1-0062"
    citation: {"ref": "SP800-30R1", "page": 21, "anchor": "Strategic plans and policies also assert or imply the relative priorities of"}
    kind: "should"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "Strategic plans and policies also assert or imply the relative priorities of immediate or near-term mission/business function accomplishment and long-term organizational viability (which can be undermined by the loss of reputation or by sanctions resulting from the compromise of sensitive information). Organizations can also consider the range of effects of threat events including the relative size of the set of resources affected, when making final impact determinations. Risk tolerance assumptions may state that threat events with an impact below a specific value do not warrant further analysis."
    status: "not-a-requirement"
    reason: "Advisory and descriptive: strategic plans imply priorities, organizations 'can also consider' range of effects, tolerance assumptions 'may state' a floor."
  - id: "REQ-SP800-30R1-0063"
    citation: {"ref": "SP800-30R1", "page": 21, "anchor": "As noted above, risk is a function of the likelihood of a"}
    kind: "indicative"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "As noted above, risk is a function of the likelihood of a threat event’s occurrence and potential adverse impact should the event occur. This definition accommodates many types of adverse impacts at all tiers in the risk management hierarchy described in Special Publication 800-39 (e.g., damage to image or reputation of the organization or financial loss at Tier 1; inability to successfully execute a specific mission/business process at Tier 2; or the resources expended in responding to an information system incident at Tier 3). It also accommodates relationships among impacts (e.g., loss of current or future mission/business effectiveness due to the loss of data confidentiality; loss of confidence in critical information due to loss of data or system integrity; or unavailability or degradation of information or information systems). This broad definition also allows risk to be represented as a single value or as a vector (i.e., multiple values), in which different types of impacts are assessed separately. For purposes of risk communication, risk is generally grouped according to the types of adverse impacts (and possibly the time frames in which those impacts are likely to be experienced)."
    status: "not-a-requirement"
    reason: "Explains the definition of risk and its forms; 'should' sits in 'should the event occur', a conditional that binds no one."
  - id: "REQ-SP800-30R1-0064"
    citation: {"ref": "SP800-30R1", "page": 22, "anchor": "Organizations may use risk aggregation to roll up several discrete or lower-level"}
    kind: "should"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "Organizations may use risk aggregation to roll up several discrete or lower-level risks into a more general or higher-level risk. Organizations may also use risk aggregation to efficiently manage the scope and scale of risk assessments involving multiple information systems and multiple mission/business processes with specified relationships and dependencies among those systems and processes. Risk aggregation, conducted primarily at Tiers 1 and 2 and occasionally at Tier 3, assesses the overall risk to organizational operations, assets, and individuals given the set of discrete risks. In general, for discrete risks (e.g., the risk associated with a single information system supporting a well-defined mission/business process), the worst-case impact establishes an upper bound for the overall risk to organizational operations, assets, and individuals.29 One issue for risk aggregation is that this upper bound for risk may fail to apply. For example, it may be advantageous for organizations to assess risk at the organization level when multiple risks materialize concurrently or when the same risk materializes repeatedly over a period of time. In such situations, there is the possibility that the amount of overall risk incurred is beyond the risk capacity of the organization, and therefore the overall impact to organizational operations and assets (i.e., mission/business impact) goes beyond that which was originally assessed for each specific risk."
    status: "not-a-requirement"
    reason: "Advisory on aggregation: organizations 'may use' risk aggregation, then an explanation of why an upper bound can fail."
  - id: "REQ-SP800-30R1-0065"
    citation: {"ref": "SP800-30R1", "page": 22, "anchor": "When aggregating risk, organizations consider the relationship among various discrete risks. For"}
    kind: "indicative"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "When aggregating risk, organizations consider the relationship among various discrete risks. For example, there may be a cause and effect relationship in that if one risk materializes, another risk is more or less likely to materialize. If there is a direct or inverse relationship among discrete risks, then the risks can be coupled (in a qualitative sense) or correlated (in a quantitative sense) either in a positive or negative manner. Risk coupling or correlation (i.e., finding relationships among risks that increase or decrease the likelihood of any specific risk materializing) can be done at Tiers 1, 2, or 3."
    status: "partial"
    reason: "Couplings among risks are recorded and name listed events (SRA-003); the cause and effect relationship itself is prose"
    evidence: [{"kind": "rule", "asserts": "The relationship among discrete risks is recorded as coupling of listed risks", "target": "SRA-003", "fixture": "tests/fixtures/negative/SRA-003.coupling.yaml", "expect": "a coupling names threat event", "holds_when": "ART-RA is produced or seeded on a 0.2.0 contract", "claim": "constraint"}]
    work_item: "WI-204"
  - id: "REQ-SP800-30R1-0066"
    citation: {"ref": "SP800-30R1", "page": 22, "anchor": "Uncertainty is inherent in the evaluation of risk, due to such considerations"}
    kind: "modal"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "Uncertainty is inherent in the evaluation of risk, due to such considerations as: (i) limitations on the extent to which the future will resemble the past; (ii) imperfect or incomplete knowledge of the threat (e.g., characteristics of adversaries including tactics, techniques, and procedures); (iii) undiscovered vulnerabilities in technologies or products; and (iv) unrecognized dependencies, which can lead to unforeseen impacts. Uncertainty about the value of specific risk factors can also be due to the step in the RMF or phase in the system development life cycle at which a risk assessment is performed. For example, at early phases in the system development life cycle, the presence and effectiveness of security controls may be unknown, while at later phases in the life cycle, the cost of evaluating control effectiveness may outweigh the benefits in terms of more fully informed decision making. Finally, uncertainty can be due to incomplete knowledge of the risks associated with other information systems, mission/ business processes, services, common infrastructures, and/or organizations. The degree of uncertainty in risk assessment results, due to these different reasons, can be communicated in the form of the results (e.g., by expressing results qualitatively, by providing ranges of values rather than single values for identified risks, or by using a visual representations of fuzzy regions rather than points)."
    status: "not-a-requirement"
    reason: "Explains why uncertainty exists; 'will' is inside 'the extent to which the future will resemble the past', a limit on knowledge and no duty. The duty to record uncertainty is REQ-SP800-30R1-0206."
  - id: "REQ-SP800-30R1-0067"
    citation: {"ref": "SP800-30R1", "page": 22, "anchor": "Security categorizations conducted in accordance with FIPS Publication 199 provide examples of"}
    kind: "modal"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "Security categorizations conducted in accordance with FIPS Publication 199 provide examples of worst-case impact analyses (using the high water mark concept). This type of impact analysis provides an upper bound for risk when applied to discrete situations within organizations."
    status: "not-a-requirement"
    reason: "Footnote 29: categorizations 'in accordance with' FIPS 199 are cited as an example of worst-case analysis; the phrase names the method and binds no one here."
  - id: "REQ-SP800-30R1-0068"
    citation: {"ref": "SP800-30R1", "page": 23, "anchor": "Risk, and its contributing factors, can be assessed in a variety of"}
    kind: "modal"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "Risk, and its contributing factors, can be assessed in a variety of ways, including quantitatively, qualitatively, or semi-quantitatively. Each risk assessment approach considered by organizations has advantages and disadvantages. A preferred approach (or situation-specific set of approaches) can be selected based on organizational culture and, in particular, attitudes toward the concepts of uncertainty and risk communication. Quantitative assessments typically employ a set of methods, principles, or rules for assessing risk based on the use of numbers—where the meanings and proportionality of values are maintained inside and outside the context of the assessment. This type of assessment most effectively supports cost-benefit analyses of alternative risk responses or courses of action. However, the meaning of the quantitative results may not always be clear and may require interpretation and explanation—particularly to explain the assumptions and constraints on using the results. For example, organizations may typically ask if the numbers or results obtained in the risk assessments are reliable or if the differences in the obtained values are meaningful or insignificant. Additionally, the rigor of quantification is significantly lessened when subjective determinations are buried within the quantitative assessments, or when significant uncertainty surrounds the determination of values. The benefits of quantitative assessments (in terms of the rigor, repeatability, and reproducibility of assessment results) can, in some cases, be outweighed by the costs (in terms of the expert time and effort and the possible deployment and use of tools required to make such assessments)."
    status: "not-a-requirement"
    reason: "Compares assessment approaches; 'may not' and 'require' say quantitative results can be unclear, and 'tools required to' make an assessment are a cost, all description of a method, none a duty."
  - id: "REQ-SP800-30R1-0069"
    citation: {"ref": "SP800-30R1", "page": 23, "anchor": "Finally, semi-quantitative assessments typically employ a set of methods, principles, or rules"}
    kind: "modal"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "Finally, semi-quantitative assessments typically employ a set of methods, principles, or rules for assessing risk that uses bins, scales, or representative numbers whose values and meanings are not maintained in other contexts. This type of assessment can provide the benefits of quantitative and qualitative assessments. The bins (e.g., 0-15, 16-35, 36-70, 71-85, 86-100) or scales (e.g., 1-10) translate easily into qualitative terms that support risk communications for decision makers (e.g., a score of 95 can be interpreted as very high), while also allowing relative comparisons between values in different bins or even within the same bin (e.g., the difference between risks scored 70 and 71 respectively is relatively insignificant, while the difference between risks scored 36 and 70 is relatively significant). The role of expert judgment in assigning values is more evident than in a purely quantitative approach. Moreover, if the scales or sets of bins provide sufficient granularity, relative prioritization among results is better supported than in a purely qualitative approach. As in a quantitative approach, rigor is significantly lessened when subjective determinations are buried within assessments, or when significant uncertainty surrounds a determination of value. As with the nonnumeric categories or levels used in a well-founded qualitative approach, each bin or range of values needs to be clearly defined and/or characterized by meaningful examples."
    status: "candidate"
  - id: "REQ-SP800-30R1-0070"
    citation: {"ref": "SP800-30R1", "page": 24, "anchor": "Analysis approaches differ with respect to the orientation or starting point of"}
    kind: "indicative"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "Analysis approaches differ with respect to the orientation or starting point of the risk assessment, level of detail in the assessment, and how risks due to similar threat scenarios are treated. An analysis approach can be: (i) threat-oriented; (ii) asset/impact-oriented; or (iii) vulnerability-oriented.30 A threat-oriented approach starts with the identification of threat sources and threat events, and focuses on the development of threat scenarios; vulnerabilities are identified in the context of threats, and for adversarial threats, impacts are identified based on adversary intent. An asset/impact-oriented approach starts with the identification of impacts or consequences of concern and critical assets, possibly using the results of a mission or business impact analyses31 and identifying threat events that could lead to and/or threat sources that could seek those impacts or consequences. A vulnerability-oriented approach starts with a set of predisposing conditions or exploitable weaknesses/deficiencies in organizational information systems or the environments in which the systems operate, and identifies threat events that could exercise those vulnerabilities together with possible consequences of vulnerabilities being exercised. Each analysis approach takes into consideration the same risk factors, and thus entails the same set of risk assessment activities, albeit in different order. Differences in the starting point of the risk assessment can potentially bias the results, causing some risks not to be identified. Therefore, identification of risks from a second orientation (e.g., complementing a threat-oriented analysis approach with an asset/impact-oriented analysis approach) can improve the rigor and effectiveness of the analysis."
    status: "not-a-requirement"
    reason: "Describes threat, asset and vulnerability orientation; a second orientation 'can improve' rigor, which is advice."
  - id: "REQ-SP800-30R1-0071"
    citation: {"ref": "SP800-30R1", "page": 24, "anchor": "In addition to the orientation of the analysis approach, organizations can apply"}
    kind: "indicative"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "In addition to the orientation of the analysis approach, organizations can apply more rigorous analysis techniques (e.g., graph-based analyses) to provide an effective way to account for the many-to-many relationships between: (i) threat sources and threat events (i.e., a single threat event can be caused by multiple threat sources and a single threat source can cause multiple threat events); (ii) threat events and vulnerabilities (i.e., a single threat event can exploit multiple vulnerabilities and a single vulnerability can be exploited by multiple threat events); and (iii) threat events and impacts/assets (i.e., a single threat event can affect multiple assets or have multiple impacts, and a single asset can be affected by multiple threat events).32 Rigorous analysis approaches also provide a way to account for whether, in the time frame for which risks are assessed, a specific adverse impact could occur (or a specific asset could be harmed) at most once, or perhaps repeatedly, depending on the nature of the impacts and on how organizations (including mission/business processes or information systems) recover from such adverse impacts."
    status: "not-a-requirement"
    reason: "Advisory: organizations 'can apply' graph-based analysis; a technique on offer, not a minimum."
  - id: "REQ-SP800-30R1-0072"
    citation: {"ref": "SP800-30R1", "page": 25, "anchor": "Organizations can differ in the risk models, assessment approaches, and analysis approaches"}
    kind: "modal"
    locator: "2.3"
    context: "FIGURE 3: GENERIC RISK MODEL WITH KEY RISK FACTORS"
    statement: "Organizations can differ in the risk models, assessment approaches, and analysis approaches that they prefer for a variety of reasons. For example, cultural issues33 can predispose organizations to employ risk models that assume a constant value for one or more possible risk factors, so that some factors that are present in other organizations’ models are not represented. Culture can also predispose organizations to employ risk models that require detailed analyses using quantitative assessments (e.g., nuclear safety). Alternately, organizations may prefer qualitative or semi-quantitative assessment approaches. In addition to differences among organizations, differences can also exist within organizations. For example, organizations can use coarse or high-level risk models early in the system development life cycle to select security controls, and subsequently, more detailed models to assess risk to given missions or business functions. Organizational risk frames34 determine which risk models, assessment approaches, and analysis approaches to use under varying circumstances."
    status: "not-a-requirement"
    reason: "Explains how culture shapes choices; 'require' says some models demand detailed analysis, a property of a model and no duty on anyone."
  - id: "REQ-SP800-30R1-0073"
    citation: {"ref": "SP800-30R1", "page": 25, "anchor": "A single risk model (consisting of a fixed set of factors, a"}
    kind: "modal"
    locator: "2.3"
    context: "THE USE OF RISK MODELS"
    statement: "A single risk model (consisting of a fixed set of factors, a fixed assessment scale for each factor, and a fixed algorithm for combining factors) cannot meet the diverse needs of the organizations in the public and private sectors that rely on Special Publication 800-30. For example, while some organizations may emphasize adversarial threats and provide detailed information about such threats, other organizations may choose instead to focus on non-adversarial threats, providing greater detail for those types of threats and lesser detail for adversarial threats. Therefore, the risk models developed by organizations with different assumptions regarding threats will involve different factors as well as different levels of detail."
    status: "not-a-requirement"
    reason: "Boxed explanation: 'cannot' says no one model fits everyone and 'will' says models differ; observations about models, not duties."
  - id: "REQ-SP800-30R1-0074"
    citation: {"ref": "SP800-30R1", "page": 25, "anchor": "Similarly, within a single organization or community of interest, different assessment scales"}
    kind: "should"
    locator: "2.3"
    context: "THE USE OF RISK MODELS"
    statement: "Similarly, within a single organization or community of interest, different assessment scales may be appropriate for different missions/business functions, different categories of information systems, and/or for systems at different stages in the system development life cycle. For example, during an initial risk assessment performed when an information system is first being considered, the information available about threats and vulnerabilities may be nonspecific and highly uncertain. For such risk assessments, a qualitative assessment, using only a few factors, may be appropriate. By contrast, a risk assessment informed by a security controls assessment can be far more specific, and estimates can be made with greater fidelity. For such assessments, a semi-quantitative assessment using the 0-100 value scales may be more appropriate."
    status: "not-a-requirement"
    reason: "Boxed advice: different scales 'may be appropriate' at different stages; a suggestion with examples."
  - id: "REQ-SP800-30R1-0075"
    citation: {"ref": "SP800-30R1", "page": 25, "anchor": "The expectation set forth in Special Publications 800-39 and 800-30 is that"}
    kind: "modal"
    locator: "2.3"
    context: "THE USE OF RISK MODELS"
    statement: "The expectation set forth in Special Publications 800-39 and 800-30 is that each organization or community will define a risk model appropriate to its view of risk (i.e., formulas that reflect organizational or community views of which risk factors must be considered, which factors can be combined, which factors must be further decomposed, and how assessed values should be combined algorithmically). Special Publication 800-30 does identify risk factors that are common across a wide spectrum of risk models. In addition, by defining multiple aligned value scales, this publication provides a foundation for a consistent approach to estimating information security risk across the system development life cycle, without forcing assessments early in the life cycle to be more detailed than can be justified by available information."
    status: "candidate"
    work_item: "WI-166"
  - id: "REQ-SP800-30R1-0076"
    citation: {"ref": "SP800-30R1", "page": 26, "anchor": "As stated previously, risk assessments can be conducted at all three tiers"}
    kind: "should"
    locator: "2.4"
    context: "APPLICATION OF RISK ASSESSMENTS"
    statement: "As stated previously, risk assessments can be conducted at all three tiers in the risk management hierarchy—organization level, mission/business process level, and information system level. Figure 4 illustrates the risk management hierarchy defined in NIST Special Publication 800-39, which provides multiple risk perspectives from the strategic level to the tactical level. Traditional risk assessments generally focus at the Tier 3 level (i.e., information system level) and as a result, tend to overlook other significant risk factors that may be more appropriately assessed at the Tier 1 or Tier 2 levels (e.g., exposure of a core mission/business function to an adversarial threat based on information system interconnections)."
    status: "not-a-requirement"
    reason: "States that assessments 'can be conducted' at three tiers and introduces Figure 4; background."
  - id: "REQ-SP800-30R1-0077"
    citation: {"ref": "SP800-30R1", "page": 26, "anchor": "Risk assessments support risk response decisions at the different tiers of the"}
    kind: "indicative"
    locator: "2.4"
    context: "FIGURE 4: RISK MANAGEMENT HIERARCHY"
    statement: "Risk assessments support risk response decisions at the different tiers of the risk management hierarchy. At Tier 1, risk assessments can affect, for example: (i) organization-wide information security programs, policies, procedures, and guidance; (ii) the types of appropriate risk responses (i.e., risk acceptance, avoidance, mitigation, sharing, or transfer); (iii) investment decisions for information technologies/systems; (iv) procurements; (v) minimum organization-wide security controls; (vi) conformance to enterprise/security architectures; and (vii) monitoring strategies and ongoing authorizations of information systems and common controls. At Tier 2, risk assessments can affect, for example: (i) enterprise architecture/security architecture design decisions; (ii) the selection of common controls; (iii) the selection of suppliers, services, and contractors to support organizational missions/business functions; (iv) the development of risk-aware mission/business processes; and (v) the interpretation of information security policies with respect to organizational information systems and environments in which those systems operate. Finally, at Tier 3, risk assessments can affect, for example: (i) design decisions (including the selection, tailoring, and supplementation of security controls and the selection of information technology products for organizational information systems); (ii) implementation decisions (including whether specific information technology products or product configurations meet security control requirements); and (iii) operational decisions (including the requisite level of monitoring activity, the frequency of ongoing information system authorizations, and system maintenance decisions)."
    status: "not-a-requirement"
    reason: "Examples of what risk assessments 'can affect' at each tier; description of uses."
  - id: "REQ-SP800-30R1-0078"
    citation: {"ref": "SP800-30R1", "page": 27, "anchor": "Risk assessments can also inform other risk management activities across the three"}
    kind: "should"
    locator: "2.4"
    context: "FIGURE 4: RISK MANAGEMENT HIERARCHY"
    statement: "Risk assessments can also inform other risk management activities across the three tiers that are not security-related. For example, at Tier 1, risk assessments can provide useful inputs to: (i) operational risk determinations (including business continuity for organizational missions and business functions); (ii) organizational risk determinations (including financial risk, compliance risk, regulatory risk, reputation risk, and cumulative acquisition risk across large-scale projects); and (iii) multiple-impact risk (including supply chain risk and risk involving partnerships). At Tier 2, risk assessments can provide the same useful inputs to operational, organizational, and multiple-impact risks, specific to mission/business processes. At Tier 3, risk assessments can inform assessments of cost, schedule, and performance risks associated with information systems, with information security experts coordinating with program managers, information system owners, and authorizing officials. This type of coordination is essential within organizations in order to eliminate silos and/or stove-piped activities that produce less than optimal or inefficient information technology and security solutions—thus affecting the ability of organizations to carry out assigned missions/business functions with maximum efficiency and cost-effectiveness."
    status: "partial"
    reason: "Built: technical risks rate their cost and schedule implications (protection.yaml). Sentences 1 to 3 are permissions and sentence 4 explains why coordination matters; none can fail."
    evidence: [{"kind": "schema", "target": "framework/schema/protection.schema.json#/properties/technical_risks/items/properties/impact/properties/schedule", "claim": "constraint", "asserts": "risk assessments inform cost and schedule risks associated with information systems: Schedule implications of the technical risk", "sentence": "At Tier 3, risk assessments can inform assessments of cost, schedule, and performance risks associated with information systems, with information security experts coordinating with program managers, information system owners, and authorizing officials."}]
    work_item: "WI-89"
    ruling_sought: [{"sentence": "Risk assessments can also inform other risk management activities across the three tiers that are not security-related.", "reason": "Permission: risk assessments 'can also inform' other activities; nothing fails if they do not."}, {"sentence": "At Tier 2, risk assessments can provide the same useful inputs to operational, organizational, and multiple-impact risks, specific to mission/business processes.", "reason": "Permission: 'can provide the same useful inputs'."}, {"sentence": "At Tier 3, risk assessments can inform assessments of cost, schedule, and performance risks associated with information systems, with information security experts coordinating with program managers, information system owners, and authorizing officials.", "reason": "Permission: 'can inform assessments of cost, schedule, and performance risks'."}]
  - id: "REQ-SP800-30R1-0079"
    citation: {"ref": "SP800-30R1", "page": 27, "anchor": "It is important to note that information security risk contributes to non-security"}
    kind: "modal"
    locator: "2.4"
    context: "FIGURE 4: RISK MANAGEMENT HIERARCHY"
    statement: "It is important to note that information security risk contributes to non-security risks at each tier. Thus, the results of a risk assessment at a given tier serve as inputs to, and are aligned with, non-security risk management activities at that tier.35 In addition, the results of risk assessments at lower tiers serve as inputs to risk assessments at higher tiers. Risks can arise on different time scales (e.g., the disclosure of information about current organizational operations can compromise the effectiveness of those operations immediately, while the disclosure of strategic planning information can compromise future operational capabilities). Risk response decisions can also take effect in different time frames (e.g., changes in organizational policies or investment strategies can sometimes require years to take effect, while configuration changes in an individual system can often be implemented immediately). In general, the risk management process tends to move more slowly at Tiers 1 and 2 than at Tier 3. This is due to how organizations typically respond to risks that potentially affect widespread organizational operations and assets—where such risk responses may need to address systemic or institutional issues. However, some Tier 1 decisions (e.g., newly discovered threats or vulnerabilities requiring the implementation of an organization-wide mandate for mitigation) can involve immediate action."
    status: "partial"
    reason: "Recipients, method and what is shared are recorded, and P-14 feeds back to P-3 so a system's results reach the organization-level assessment; no rule checks that P-3 reads them, or that P-3 reads Tier 2 results and mission-essential functions"
    evidence: [{"kind": "schema", "asserts": "Risk assessment results are communicated to designated organizational stakeholders", "target": "framework/schema/ra.schema.json#/properties/communication/properties/recipients", "claim": "constraint"}]
    work_item: "WI-198"
  - id: "REQ-SP800-30R1-0080"
    citation: {"ref": "SP800-30R1", "page": 27, "anchor": "At Tier 1, risk assessments support organizational strategies, policies, guidance, and processes"}
    kind: "indicative"
    locator: "2.4"
    context: "FIGURE 4: RISK MANAGEMENT HIERARCHY"
    statement: "At Tier 1, risk assessments support organizational strategies, policies, guidance, and processes for managing risk. Risk assessments conducted at Tier 1 focus on organizational operations, assets, and individuals—comprehensive assessments across mission/business lines. For example, Tier 1 risk assessments may address: (i) the specific types of threats directed at organizations that may be different from other organizations and how those threats affect policy decisions; (ii) systemic weaknesses or deficiencies discovered in multiple organizational information systems capable of being exploited by adversaries; (iii) the potential adverse impact on organizations from the loss or compromise of organizational information (either intentionally or unintentionally); and (iv) the use of new information and computing technologies such as mobile and cloud and the potential effect on the ability of organizations to successfully carry out their missions/business operations while using those technologies. Organization-wide assessments of risk can be based solely on the assumptions, constraints, risk tolerances, priorities, and trade-offs established in the risk framing step (i.e., derived primarily from Tier 1 activities). However, more realistic and meaningful risk assessments are based on assessments conducted across multiple mission/business lines (i.e., derived primarily from Tier 2 activities). The ability of organizations to effectively use Tier 2 risk assessments as inputs to Tier 1 risk assessments is shaped by such considerations as: (i) the similarity of organizational missions/business functions and mission/business processes; and (ii) the degree of autonomy that organizational entities or subcomponents have with respect to parent organizations. In decentralized organizations or organizations with varied missions/business functions and/or environments of operation, expert analysis may be needed to normalize the results from Tier 2 risk assessments. Finally, risk assessments at Tier 1 take into consideration the identification of mission-essential functions from Continuity of Operations Plans (COOP)36 prepared by organizations when determining the contribution of Tier 2 risks."
    status: "not-a-requirement"
    reason: "Same passage as REQ-SP800-30R1-0301, which holds this text and the last sentence the extractor rejected; duplicate of the live entry, kept out so the Tier 1 text is decided once."
  - id: "REQ-SP800-30R1-0081"
    citation: {"ref": "SP800-30R1", "page": 28, "anchor": "At Tier 2, risk assessments support the determination of mission/business process protection"}
    kind: "indicative"
    locator: "2.4"
    context: "FIGURE 4: RISK MANAGEMENT HIERARCHY"
    statement: "At Tier 2, risk assessments support the determination of mission/business process protection and resiliency requirements, and the allocation of those requirements to the enterprise architecture as part of mission/business segments (that support mission/business processes). This allocation is accomplished through an information security architecture embedded within the enterprise architecture. Tier 2 risk assessments also inform and guide decisions on whether, how, and when to use information systems for specific mission/business processes, in particular for alternative mission/business processing in the face of compromised information systems. Risk management and associated risk assessment activities at Tier 2 are closely aligned with the development of Business Continuity Plans (BCPs). Tier 2 risk assessments focus on mission/business segments, which typically include multiple information systems, with varying degrees of criticality and/or sensitivity with regard to core organizational missions/business functions.37 Risk assessments at Tier 2 can also focus on information security architecture as a critical component of enterprise architecture to help organizations select common controls inherited by organizational information systems at Tier 3. Risk assessment results produced at Tier 2 are communicated to and shared with organizational entities at Tier 3 to help inform and guide the allocation of security controls to information systems and environments in which those systems operate. Tier 2 risk assessments also provide assessments of the security and risk posture of organizational mission/business processes, which inform assessments of organizational risks at Tier 1. Thus, risk assessment results at Tier 2 are routinely communicated to organizational entities at Tier 1 and Tier 3."
    status: "partial"
    reason: "Recipients, method and what is shared are recorded, and P-14 feeds back to P-3 so a system's results reach the organization-level assessment; no rule checks that P-3 reads them, or that P-3 reads Tier 2 results and mission-essential functions"
    evidence: [{"kind": "prose", "asserts": "Tier 2 risk assessments inform decisions on the use of information systems for mission processes", "target": "templates/artifacts/ART-RA.md", "claim": "presence"}]
    work_item: "WI-198"
  - id: "REQ-SP800-30R1-0082"
    citation: {"ref": "SP800-30R1", "page": 28, "anchor": "The Tier 2 context and the system development life cycle determine the"}
    kind: "indicative"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "The Tier 2 context and the system development life cycle determine the purpose and define the scope of risk assessment activities at Tier 3. While initial risk assessments (i.e., risk assessments performed for the first time, rather than updating prior risk assessments) can be performed at any phase in the system development life cycle, ideally these assessments should be performed in the Initiation phase.38 In the Initiation phase, risk assessments evaluate the anticipated vulnerabilities and predisposing conditions affecting the confidentiality, integrity, and availability of information systems in the context of the planned environments of operation. Such assessments inform risk response, enabling information system owners/program managers, together with mission/business owners to make the final decisions about the security controls necessary based on the security categorization and the environment of operation. Risk assessments are also conducted at later phases in the system development life cycle, updating risk assessment results from earlier phases. These risk assessment results for as-built or as-deployed information systems typically include descriptions of vulnerabilities in the systems, an assessment of the risks associated with each vulnerability (thereby updating the assessment of vulnerability severity), and corrective actions that can be taken to mitigate the risks. The risk assessment results also include an assessment of the overall risk to the organization and the information contained in the information systems by operating the systems as evaluated. Risk assessment results at Tier 3 are communicated to organizational entities at Tier 1 and Tier 2."
    status: "partial"
    reason: "Whether the assessment is initial or subsequent is recorded; the Tier 2 context that sets the Tier 3 purpose and scope is prose"
    evidence: [{"kind": "schema", "asserts": "Risk assessments state whether they are initial risk assessments or updates of prior risk assessments", "target": "framework/schema/ra.schema.json#/properties/purpose/properties/kind", "claim": "constraint"}]
    work_item: "WI-198"
  - id: "REQ-SP800-30R1-0083"
    citation: {"ref": "SP800-30R1", "page": 28, "anchor": "The criticality of information systems to organizational missions/business functions may be identified"}
    kind: "should"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "The criticality of information systems to organizational missions/business functions may be identified in Business Impact Analyses."
    status: "not-a-requirement"
    reason: "Footnote 37: criticality 'may be identified' in a BIA; a pointer to where the information is found."
  - id: "REQ-SP800-30R1-0084"
    citation: {"ref": "SP800-30R1", "page": 29, "anchor": "Risk assessment activities can be integrated with the steps in the Risk"}
    kind: "indicative"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Risk assessment activities can be integrated with the steps in the Risk Management Framework (RMF), as defined in NIST Special Publication 800-37. The RMF, in its system development life cycle approach, operates primarily at Tier 3 with some application at Tiers 1 and 2, for example, in the selection of common controls. Risk assessments can be tailored to each step in the RMF as reflected in the purpose and scope of the assessments described in Section 3.1. Risk assessments can also help determine the type of security assessments conducted during various phases of the system development life cycle, the frequency of such assessments, the level of rigor applied during the assessments, the assessment methods used, and the types/number of objects assessed. The benefit of risk assessments conducted as part of the RMF can be realized from both initial assessments and from updated assessments, as described below."
    status: "not-a-requirement"
    reason: "Advisory on the RMF: assessments 'can be integrated' and 'can be tailored' to each step; a benefit statement."
  - id: "REQ-SP800-30R1-0085"
    citation: {"ref": "SP800-30R1", "page": 29, "anchor": "Organizations can use initial risk assessments to make security categorization decisions consistent"}
    kind: "indicative"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Organizations can use initial risk assessments to make security categorization decisions consistent with the risk management strategy provided by the risk executive (function) and as a preparatory step to security control selection. Conducting initial risk assessments brings together the available information on threat sources, threat events, vulnerabilities, and predisposing conditions—thus enabling organizations to use such information to categorize information and information systems based on known and potential threats to and vulnerabilities in organizational information systems and environments in which those systems operate.39 Security categorization decisions inform the selection of initial baseline security controls. Baseline security controls serve as the starting point for organizational tailoring and supplementation activities described in the RMF Select step."
    status: "not-a-requirement"
    reason: "Advisory: organizations 'can use' initial assessments for categorization, followed by description of the baseline; C-2 reads ART-RA, but the source offers this as an option."
  - id: "REQ-SP800-30R1-0086"
    citation: {"ref": "SP800-30R1", "page": 29, "anchor": "Organizations can use risk assessments to inform and guide the selection of"}
    kind: "indicative"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Organizations can use risk assessments to inform and guide the selection of security controls for organizational information systems and environments of operation. After the initial security control baseline is selected based on the security categorization process, the risk assessment results help organizations: (i) apply appropriate tailoring guidance to adjust the controls based on specific mission/business requirements, assumptions, constraints, priorities, trade-offs, or other organization-defined conditions; and (ii) supplement the controls based on specific and credible threat information.40 Threat data from risk assessments provide critical information on adversary capabilities, intent, and targeting that may affect the decisions by organizations regarding the selection of additional security controls including the associated costs and benefits. Organizations also consider risk assessment results when selecting common controls (typically a Tier 1 and Tier 2 activity). Risk is introduced if the implementation of a common control results in a single point of failure because the control provides a security capability potentially inherited by multiple information systems. As risk assessments are updated and refined, organizations use the results to modify current security control selections based on the most recent threat and vulnerability information available."
    status: "partial"
    reason: "Built: P-2 states in ART-ORG-CONTEXT how risk assessments are maintained, S-5 records it in conmon.yaml risk_assessment (ISCM-001 requires it), M-4 applies it, and ART-RA has a Maintenance section. Unheld: that results inform the selection of controls."
    evidence: [{"kind": "schema", "asserts": "An update of the risk assessment revises the results that inform tailoring and supplementing the selected controls", "target": "framework/schema/conmon.schema.json#/properties/risk_assessment/properties/updates", "claim": "presence"}]
    work_item: "WI-260"
  - id: "REQ-SP800-30R1-0087"
    citation: {"ref": "SP800-30R1", "page": 29, "anchor": "Even when an initial risk assessment is performed prior to the existence"}
    kind: "modal"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Even when an initial risk assessment is performed prior to the existence of an information system, vulnerabilities may be present in certain technologies that will be used in the system, in common controls that will be inherited by the system, or in the environment in which the system will operate."
    status: "not-a-requirement"
    reason: "Footnote 39: 'will' describes technologies and controls a future system will use; an explanation of why early assessments find weaknesses, no duty."
  - id: "REQ-SP800-30R1-0088"
    citation: {"ref": "SP800-30R1", "page": 29, "anchor": "Supplementation will be incorporated into the tailoring process in NIST Special Publication"}
    kind: "modal"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Supplementation will be incorporated into the tailoring process in NIST Special Publication 800-53, Revision 4."
    status: "not-a-requirement"
    reason: "Footnote 40: 'will' forecasts a change to SP 800-53 Revision 4, a dated editorial note that binds no reader."
  - id: "REQ-SP800-30R1-0089"
    citation: {"ref": "SP800-30R1", "page": 30, "anchor": "Organizations can use risk assessment results to identify alternative implementations of selected"}
    kind: "modal"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Organizations can use risk assessment results to identify alternative implementations of selected security controls (e.g., considering vulnerabilities inherent in one security control implementation versus another). Some information technology products, system components, or architectural configurations may be more susceptible to certain types of threat sources; these susceptibilities are subsequently addressed during security control development and implementation. In addition, the strength of security mechanisms selected for implementation can take into consideration the threat data from risk assessments. Individual configuration settings for information technology products and system components can eliminate vulnerabilities identified during the analysis of threat events. Risk assessment results also help inform decisions regarding the cost, benefit, and risk trade-offs in using one type of technology versus another or how security controls are effectively implemented in particular operational environments (e.g., when compensating controls must be used due to the unavailability of certain technologies). As risk assessments are updated and refined, organizations use the results to help determine if current security control implementations remain effective given changes to the threat space."
    status: "partial"
    reason: "Built: P-2 states in ART-ORG-CONTEXT how risk assessments are maintained, S-5 records it in conmon.yaml risk_assessment (ISCM-001 requires it), M-4 applies it, and ART-RA has a Maintenance section. Unheld: that results identify alternative implementations."
    evidence: [{"kind": "schema", "asserts": "An update of the risk assessment revises the threat data that informs alternative implementations of selected controls", "target": "framework/schema/conmon.schema.json#/properties/risk_assessment/properties/updates", "claim": "presence"}]
    work_item: "WI-260"
  - id: "REQ-SP800-30R1-0090"
    citation: {"ref": "SP800-30R1", "page": 30, "anchor": "Organizations can use the results from security control assessments to inform risk"}
    kind: "indicative"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Organizations can use the results from security control assessments to inform risk assessments. Security control assessments (documented in security assessment reports) identify vulnerabilities in organizational information systems and the environments in which those systems operate. Partial or complete failure of deployed security controls or the absence of planned controls represents potential vulnerabilities that can be exploited by threat sources. Organizations use the results from risk assessments to help determine the severity of such vulnerabilities which in turn, can guide and inform organizational risk responses (e.g., prioritizing risk response activities, establishing milestones for corrective actions)."
    status: "candidate"
  - id: "REQ-SP800-30R1-0091"
    citation: {"ref": "SP800-30R1", "page": 30, "anchor": "Organizations can use risk assessment results to provide risk-related information to authorizing"}
    kind: "should"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Organizations can use risk assessment results to provide risk-related information to authorizing officials. The risk responses carried out by organizations based on the risk assessments result in a known security posture of organizational information systems and environments of operation. Risk assessment results provide essential information to enable authorizing officials to make risk-based decisions on whether to operate those systems in the current security posture or take actions to provide additional security controls, thereby further reducing risk to organizational operations and assets, individuals, other organizations, or the Nation."
    status: "not-a-requirement"
    reason: "Advisory wording of the Authorize step: organizations 'can use' results to inform authorizing officials, then what those results provide. R-2 reads ART-RA, so nothing is lost."
  - id: "REQ-SP800-30R1-0092"
    citation: {"ref": "SP800-30R1", "page": 30, "anchor": "Organizations can update risk assessments on an ongoing basis using security-related information"}
    kind: "indicative"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "Organizations can update risk assessments on an ongoing basis using security-related information from organizational continuous monitoring processes.41 Continuous monitoring processes evaluate: (i) the effectiveness of security controls; (ii) changes to information systems and environments of operation; and (iii) compliance to federal legislation, regulations, directives, policies, standards, and guidance. As risk assessments are updated and refined, organizations use the results to update the risk management strategy, thereby incorporating lessons learned into risk management processes, improving responses to risk, and building a solid foundation of threat and vulnerability information tailored to organizational missions/business functions."
    status: "candidate"
    work_item: "WI-161"
  - id: "REQ-SP800-30R1-0093"
    citation: {"ref": "SP800-30R1", "page": 31, "anchor": "The risk assessment process entails ongoing communications and information sharing among stakeholders"}
    kind: "indicative"
    locator: "2.4.3"
    context: "Risk Assessments at the Information System Tier"
    statement: "The risk assessment process entails ongoing communications and information sharing among stakeholders to ensure that: (i) the inputs to such assessments are as accurate as possible; (ii) intermediate assessment results can be used, for example, to support risk assessments at other tiers; and (iii) the results are meaningful and useful inputs to the risk response step in the risk management process. The manner and form in which risks are communicated are an expression of organizational culture as well as legal, regulatory, and contractual constraints. To be effective, communication of information security risks and other risk-related information produced during the risk assessment is consistent with other forms of risk communication within organizations. To maximize the benefit of risk assessments, organizations should establish policies, procedures, and implementing mechanisms to ensure that the information produced during such assessments is effectively communicated and shared across all three risk management tiers.42 To reinforce the importance of risk communication and information sharing within organizations, the input tables in Appendices D, E, F, G, H, and I (i.e., threat sources, threat events, vulnerabilities, predisposing conditions, likelihood, impact, and risk) and the recommended elements of a risk assessment report (Appendix K) provide recommendations for risk communication/sharing among the tiers."
    status: "partial"
    reason: "Recipients, method and what is shared are recorded, and P-14 feeds back to P-3 so a system's results reach the organization-level assessment; no rule checks that P-3 reads them, or that P-3 reads Tier 2 results and mission-essential functions"
    evidence: [{"kind": "schema", "asserts": "Risk assessment results are communicated to designated organizational stakeholders", "target": "framework/schema/ra.schema.json#/properties/communication/properties/recipients", "claim": "constraint"}, {"kind": "schema", "asserts": "Share source information, intermediate results and supporting evidence of the risk assessment", "target": "framework/schema/ra.schema.json#/properties/communication/properties/shared", "claim": "constraint"}]
    work_item: "WI-198"
  - id: "REQ-SP800-30R1-0094"
    citation: {"ref": "SP800-30R1", "page": 31, "anchor": "Organizations can use targeted risk assessments, in which the scope is narrowly"}
    kind: "indicative"
    locator: "2.4.3"
    context: "TARGETED RISK ASSESSMENTS"
    statement: "Organizations can use targeted risk assessments, in which the scope is narrowly defined, to produce answers to specific questions (e.g., what is the risk associated with relying on a given technology, how should prior assessments of risk be revised based on incidents that have occurred, what new risks can be identified based on knowledge about a newly discovered threat or vulnerability) or to inform specific decisions (e.g., which risks should be managed at Tier 1 rather than Tier 2 or 3). Organizations may consider assessing risk at Tier 1 and Tier 2 arising from a set of common threats and vulnerabilities applicable to a wide range of organizational information systems. Assessing risk at Tiers 1 and 2 allows organizations to reduce the number of threats and vulnerabilities considered at the individual information system level and develop common risk responses for such organization-wide risks. This approach can support the common control selection process for organizations and increase the efficiency and cost-effectiveness of risk assessments across the organization."
    status: "not-a-requirement"
    reason: "Boxed advice on targeted assessments: organizations 'can use' and 'may consider' them, and 'should' appears only in the sample questions."
  - id: "REQ-SP800-30R1-0095"
    citation: {"ref": "SP800-30R1", "page": 31, "anchor": "the methodologies, tools, and techniques used to conduct such risk assessments; or"}
    kind: "lettered"
    locator: "2.4.3.(ii)"
    context: "TARGETED RISK ASSESSMENTS"
    statement: "(ii) the methodologies, tools, and techniques used to conduct such risk assessments; or (iii) the format and content of assessment results and any associated reporting mechanisms. Organizations have maximum flexibility on how risk assessments are conducted, where such assessments are applied, and how the results will be used. Organizations are encouraged to use the guidance in a manner that most effectively and cost-effectively provides the information necessary to senior leaders/executives to facilitate informed risk management decisions."
    status: "not-a-requirement"
    reason: "Tail of an express non-requirement, 'there are no specific requirements' (head rejected on page 31); 'will' and 'encouraged' sit in 'how the results will be used' and in an invitation to use the guidance flexibly."
  - id: "REQ-SP800-30R1-0096"
    citation: {"ref": "SP800-30R1", "page": 32, "anchor": "the activities necessary to communicate the assessment results and share risk-related information;"}
    kind: "lettered"
    locator: "THE PROCESS.(iv)"
    context: "CONDUCTING RISK ASSESSMENTS WITHIN ORGANIZATIONS"
    statement: "(iv) the activities necessary to communicate the assessment results and share risk-related information; and (v) the activities necessary to maintain the results of risk assessments on an ongoing basis. The risk assessment process43 is composed of four steps: (i) prepare for the assessment; (ii) conduct the assessment; (iii) communicate assessment results; and (iv) maintain the assessment.44 Each step is divided into a set of tasks. For each task, supplemental guidance provides additional information for organizations conducting risk assessments. Risk tables and exemplary assessment scales are listed in appropriate tasks and cross-referenced to additional, more detailed information in the supporting appendices. Figure 5 illustrates the basic steps in the risk assessment process and highlights the specific tasks for conducting the assessment."
    status: "not-a-requirement"
    reason: "Tail of the Chapter Three opening: a roadmap of the steps and an introduction to Figure 5."
