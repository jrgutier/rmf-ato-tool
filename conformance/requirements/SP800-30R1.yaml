    context: "FIGURE 1: RISK ASSESSMENT WITHIN THE RISK MANAGEMENT PROCESS"
    statement: "(ii) evaluating the alternative courses of action; (iii) determining appropriate courses of action consistent with organizational risk tolerance; and (iv) implementing risk responses based on selected courses of action."
