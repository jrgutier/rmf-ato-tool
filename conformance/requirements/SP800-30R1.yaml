    context: "APPROACHES TO REFINING RISK ASSESSMENT RESULTS Will the materialization of a particular risk result in:"
    statement: "If a risk is highly coupled to other risks or seen as likely to lead to other risks materializing (whether the risk is the cause or materializes concurrently), the risk should be given higher priority than a risk that has no particular effect on other risks. If a risk materializing actually decreases the likelihood of other risks materializing, then further analysis is warranted to determine which risks become a lower priority to mitigate."
