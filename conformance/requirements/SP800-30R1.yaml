  - id: "REQ-SP800-30R1-0262"
    citation: {"ref": "SP800-30R1", "page": 92, "anchor": "The essential elements of information described in this appendix are informative and"}
    kind: "modal"
    locator: "RISK ASSESSMENT REPORTS"
    context: "ESSENTIAL ELEMENTS OF INFORMATION"
    statement: "The essential elements of information described in this appendix are informative and exemplary only and are not intended to require or promote a specific template for documenting risk assessment results. Organizations have maximum flexibility in determining the type and the level of detail of information included in organizational risk assessments and the associated reports. For example, Tier 1 and Tier 2 risk assessment results may be conveyed via an executive briefing or dashboard, whereas Tier 3 risk assessment results may be conveyed via a risk assessment report (formal or informal depending on organizational preference). The essential elements of information for communicating risk assessment results can be modified accordingly to meet the needs of organizations conducting the assessments."
    status: "not-a-requirement"
    reason: "Footnote 57: Appendix K is 'informative and exemplary only' and 'not intended to require or promote a specific template'; a statement of latitude, binding no one."
