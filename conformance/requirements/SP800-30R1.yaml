  - {"page": 38, "locator": "3.2", "reason": "no-marker", "text": "For example, the risk assessment could start with an identification of mission/business impacts at Tiers 1 and 2 using common techniques such as Mission Impact Analyses, Business Impact Analyses, Mission/Business Thread Analyses, or Business Continuity Analyses. The results of such analyses could enable risk assessors to focus attention on, and perform more detailed analysis of, potential threats to critical information systems, databases, communications links, or other assets."}
  - {"page": 39, "locator": "3.2", "reason": "no-marker", "text": "STEP 2: CONDUCT THE ASSESSMENT"}
