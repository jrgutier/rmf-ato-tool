  - id: "REQ-SP800-30R1-0181"
    citation: {"ref": "SP800-30R1", "page": 42, "anchor": "Supplemental Guidance: Organizations employ a three-step process to determine the overall likelihood"}
    kind: "modal"
    locator: "3.2"
    context: "DETERMINE LIKELIHOOD"
    statement: "Supplemental Guidance: Organizations employ a three-step process to determine the overall likelihood of threat events. First, organizations assess the likelihood that threat events will be initiated (for adversarial threat events) or will occur (for non-adversarial threat events). Second, organizations assess the likelihood that threat events once initiated or occurring, will result in adverse impacts to organizational operations and assets, individuals, other organizations, or the Nation. Finally, organizations assess the overall likelihood as a combination of likelihood of initiation/occurrence and likelihood of resulting in adverse impact."
    status: "partial"
    reason: "The three likelihood steps are required fields; the combination of their values is the organization's algorithm, stated as prose in risk_model.combination, which no rule recomputes"
    evidence: [{"kind": "schema", "asserts": "Each threat event assesses the likelihood of initiation or occurrence", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood_initiation", "claim": "constraint"}, {"kind": "schema", "asserts": "Each threat event assesses the likelihood that it results in adverse impacts once initiated or occurring", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood_impact", "claim": "constraint"}, {"kind": "schema", "asserts": "Each threat event assesses the overall likelihood", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood", "claim": "constraint"}]
    work_item: "WI-200"
  - id: "REQ-SP800-30R1-0182"
    citation: {"ref": "SP800-30R1", "page": 42, "anchor": "Organizations assess the likelihood of threat event initiation by taking into consideration"}
    kind: "modal"
    locator: "3.2"
    context: "DETERMINE LIKELIHOOD"
    statement: "Organizations assess the likelihood of threat event initiation by taking into consideration the characteristics of the threat sources of concern including capability, intent, and targeting (see Task 2-1 and Appendix D). If threat events require more capability than adversaries possess (and adversaries are cognizant of this fact), then the adversaries are not expected to initiate the events. If adversaries do not expect to achieve intended objectives by executing threat events, then the adversaries are not expected to initiate the events. And finally, if adversaries are not actively targeting specific organizations or their missions/business functions, adversaries are not expected to initiate threat events. Organizations use the assessment scale in Table G-2 and provide a rationale for the assessment allowing explicit consideration of deterrence and threat shifting. Organizations can assess the likelihood of threat event occurrence (non-adversarial) using Table G-3 and provide a similar rationale for the assessment."
    status: "partial"
    reason: "Capability, intent and targeting of each adversarial source are rated (SRA-001); that initiation likelihood follows from them is judgment"
    evidence: [{"kind": "schema", "asserts": "Organizations assess the likelihood of threat event initiation from the capability of threat sources", "target": "framework/schema/ra.schema.json#/properties/threat_sources/items/properties/capability", "claim": "constraint"}]
    work_item: "WI-200"
  - id: "REQ-SP800-30R1-0183"
    citation: {"ref": "SP800-30R1", "page": 42, "anchor": "Organizations assess the likelihood that threat events result in adverse impacts by"}
    kind: "indicative"
    locator: "3.2"
    context: "DETERMINE LIKELIHOOD"
    statement: "Organizations assess the likelihood that threat events result in adverse impacts by taking into consideration the set of identified vulnerabilities and predisposing conditions (see Task 2-3 and Appendix F). For threat events initiated by adversaries, organizations consider characteristics of associated threat sources. For non-adversarial threat events, organizations take into account the anticipated severity and duration of the event (as included in the description of the event). Organizations use the assessment scale in Table G-4 and provide a rationale for the assessment allowing explicit consideration as stated above. Threat events for which no vulnerabilities or predisposing conditions are identified, have a very low likelihood of resulting in adverse impacts. Such threat events can be highlighted and moved to the end of the table (or to a separate table), so that they can be tracked for consideration in follow-on risk assessments. However, no further consideration during the current assessment is warranted."
    status: "partial"
    reason: "Each threat event names the vulnerabilities and predisposing conditions it exploits and gives a rationale; the use of Table G-4 and the content of the rationale are prose"
    evidence: [{"kind": "schema", "asserts": "The likelihood that threat events result in adverse impacts considers the identified vulnerabilities", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/vulnerabilities", "claim": "presence"}, {"kind": "schema", "asserts": "Organizations provide a rationale for the likelihood assessment", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood_rationale", "claim": "presence"}]
    work_item: "WI-200"
  - id: "REQ-SP800-30R1-0184"
    citation: {"ref": "SP800-30R1", "page": 43, "anchor": "The overall likelihood of a threat event is a combination of: (i)"}
    kind: "modal"
    locator: "3.2"
    context: "DETERMINE LIKELIHOOD"
    statement: "The overall likelihood of a threat event is a combination of: (i) the likelihood that the event will occur (e.g., due to human error or natural disaster) or be initiated by an adversary; and (ii) the likelihood that the initiation/occurrence will result in adverse impacts. Organizations assess the overall likelihood of threat events by using inputs from Tables G-2, G-3, and G-4. Any specific algorithm or rule for combining the determined likelihood values depends on: (i) general organizational attitudes toward risk, including overall risk tolerance and tolerance for uncertainty; (ii) specific tolerances toward uncertainty in different risk factors; and (iii) organizational weighting of risk factors. For example, organizations could use any of the following rules (or could define a different rule): (i) use the maximum of the two likelihood values; (ii) use the minimum of the two likelihood values; (iii) consider likelihood of initiation/occurrence only, assuming that if threat events are initiated or occur, the events will result in adverse impacts; (iv) consider likelihood of impact only, assuming that if threat events could result in adverse impacts, adversaries will initiate the events; or (v) take a weighted average of the two likelihood values. Organizations make explicit the rules used."
    status: "partial"
    reason: "The three likelihood steps are required fields; the combination of their values is the organization's algorithm, stated as prose in risk_model.combination, which no rule recomputes"
    evidence: [{"kind": "schema", "asserts": "Each threat event assesses the overall likelihood", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/likelihood", "claim": "constraint"}, {"kind": "schema", "asserts": "The specific algorithm or rule for combining the determined likelihood values is stated", "target": "framework/schema/ra.schema.json#/properties/risk_model/properties/combination", "claim": "presence"}]
    work_item: "WI-200"
