  - {"page": 23, "locator": "2.3", "reason": "short", "text": "2.3.2 Assessment Approaches"}
  - {"page": 23, "locator": "2.3", "reason": "no-marker", "text": "In contrast to quantitative assessments, qualitative assessments typically employ a set of methods, principles, or rules for assessing risk based on nonnumerical categories or levels (e.g., very low, low, moderate, high, very high). This type of assessment supports communicating risk results to decision makers. However, the range of values in qualitative assessments is comparatively small in most cases, making the relative prioritization or comparison within the set of reported risks difficult. Additionally, unless each value is very clearly defined or is characterized by meaningful examples, different experts relying on their individual experiences could produce significantly different assessment results. The repeatability and reproducibility of qualitative assessments are increased by the annotation of assessed values (e.g., this value is high because of the following reasons) and by the use of tables or other well-defined functions to combine qualitative values."}
  - {"page": 24, "locator": "2.3", "reason": "short", "text": "2.3.3 Analysis Approaches"}
  - {"page": 24, "locator": "2.3", "reason": "no-marker", "text": "Organizations have great flexibility in choosing a particular analysis approach. The specific approach taken is driven by different organizational considerations (e.g., the quality and quantity of information available with respect to threats, vulnerabilities, and impacts/assets; the specific orientation carrying the highest priority for organizations; availability of analysis tools emphasizing certain orientations; or a combination of the above)."}
  - {"page": 24, "locator": "2.3", "reason": "no-marker", "text": "A Business Impact Analysis (BIA) identifies high-value assets and adverse impacts with respect to the loss of integrity or availability. DHS Federal Continuity Directive 2 provides guidance on BIAs at the organization and mission/business process levels of the risk management hierarchy, respectively. NIST Special Publication 800-34 provides guidance on BIAs at the information system level of the risk management hierarchy."}
  - {"page": 24, "locator": "2.3", "reason": "no-marker", "text": "For example, graph-based analysis techniques (e.g., functional dependency network analysis, attack tree analysis for adversarial threats, fault tree analysis for other types of threats) provide ways to use specific threat events to generate threat scenarios. Graph-based analysis techniques can also provide ways to account for situations in which one event can change the likelihood of occurrence for another event. Attack and fault tree analyses, in particular, can generate multiple threat scenarios that are nearly alike, for purposes of determining the levels of risk. With automated modeling and simulation, large numbers of threat scenarios (e.g., attack/fault trees, traversals of functional dependency networks) can be generated. Thus, graph-based analysis techniques include ways to restrict the analysis to define a reasonable subset of all possible threat scenarios."}
  - {"page": 25, "locator": "2.3", "reason": "no-marker", "text": "2.3.4 Effects of Organizational Culture on Risk Assessments"}
  - {"page": 25, "locator": "2.3", "reason": "no-marker", "text": "NIST Special Publication 800-39 describes how organizational culture affects risk management."}
  - {"page": 25, "locator": "2.3", "reason": "no-marker", "text": "NIST Special Publication 800-39 defines an organization’s risk frame as the set of assumptions, constraints, risk tolerances, priorities, and trade-offs that underpin the organization’s risk management strategy—establishing a solid foundation for managing risk and bounding its risk-based decisions."}
  - {"page": 26, "locator": "2.4.-", "reason": "label-only", "text": "- Traceability and Transparency of"}
