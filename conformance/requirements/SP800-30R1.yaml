  - id: "REQ-SP800-30R1-0141"
    citation: {"ref": "SP800-30R1", "page": 39, "anchor": "Supplemental Guidance: Organizations identify threat sources of concern and determine the characteristics"}
    kind: "indicative"
    locator: "3.2"
    context: "IDENTIFY THREAT SOURCES"
    statement: "Supplemental Guidance: Organizations identify threat sources of concern and determine the characteristics associated with those threat sources. For adversarial threat sources, assess the capabilities, intentions, and targeting associated with the threat sources. For non-adversarial threat sources, assess the potential range of effects from the threat sources. The risk management strategy and the results of the Prepare step provide organizational direction and guidance for conducting threat source identification and characterization including, for example: (i) sources for obtaining threat information; (ii) threat sources to consider (by type/name); (iii) threat taxonomy to be used; and (iv) the process for identifying which threat sources are of concern for the risk assessment. As identified in Task 1-3, organizations make explicit any assumptions concerning threat sources including decisions regarding the identification of threat sources when specific and credible threat information is unavailable. Organizations can also view adversarial threat sources from a broad-based perspective, considering the time such threat sources may have to exploit identified organizational vulnerabilities, the scale of the attack, and the potential use of multiple attack vectors. The identification and characterization of Advanced Persistent Threats (APTs) can involve considerable uncertainty. Organizations annotate such threat sources with appropriate rationale and references (and providing classifications as necessary)."
    status: "partial"
    reason: "Capability, intent and targeting of each adversarial source and range of effects of each other one are rated (SRA-001); the strategy's direction on threat sources is prose"
    evidence: [{"kind": "schema", "asserts": "For adversarial threat sources, assess the capabilities of the threat sources", "target": "framework/schema/ra.schema.json#/properties/threat_sources/items/properties/capability", "claim": "constraint"}, {"kind": "schema", "asserts": "For non-adversarial threat sources, assess the potential range of effects", "target": "framework/schema/ra.schema.json#/properties/threat_sources/items/properties/range_of_effects", "claim": "constraint"}]
    work_item: "WI-201"
