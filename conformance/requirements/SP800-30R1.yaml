  - id: "REQ-SP800-30R1-0279"
    citation: {"ref": "SP800-30R1", "page": 19, "anchor": "In general, risks materialize as a result of a series of threat"}
    kind: "modal"
    locator: "2.3.(ii)"
    context: "FIGURE 2: RELATIONSHIP AMONG RISK FRAMING COMPONENTS A threat source is characterized as:"
    statement: "In general, risks materialize as a result of a series of threat events, each of which takes advantage of one or more vulnerabilities. Organizations define threat scenarios to describe how the events caused by a threat source can contribute to or cause harm. Development of threat scenarios is analytically useful, since some vulnerabilities may not be exposed to exploitation unless and until other vulnerabilities have been exploited. Analysis that illuminates how a set of vulnerabilities, taken together, could be exploited by one or more threat events is therefore more useful than the analysis of individual vulnerabilities. In addition, a threat scenario tells a story, and hence is useful for risk communication as well as for analysis."
    status: "partial"
    reason: "Threat scenarios chain two or more listed threat events (SRA-001); a run may record none, since the analysis may stop at events"
    evidence: [{"kind": "rule", "asserts": "Threat scenarios describe how threat events chain: each names listed events", "target": "SRA-001", "fixture": "tests/fixtures/negative/SRA-001.scenario.yaml", "expect": "names threat event", "holds_when": "ART-RA is produced or seeded on a 0.2.0 contract", "claim": "constraint"}, {"kind": "schema", "asserts": "Organizations define threat scenarios as a series of threat events", "target": "framework/schema/ra.schema.json#/properties/threat_scenarios/items/properties/events", "claim": "constraint"}]
    work_item: "WI-205"
  - id: "REQ-SP800-30R1-0280"
    citation: {"ref": "SP800-30R1", "page": 37, "anchor": "Security categorization constitutes a determination of the potential impacts should certain events"}
    kind: "modal"
    locator: "3.1"
    context: "IDENTIFY INFORMATION SOURCES"
    statement: "Security categorization constitutes a determination of the potential impacts should certain events occur which jeopardize the information and information systems needed by the organization to accomplish its assigned missions, protect its assets, fulfill its legal responsibilities, maintain its day-to-day functions, and protect individuals. Security categories are to be used in conjunction with vulnerability and threat information in assessing the risk to organizational operations and assets, individuals, other organizations, and the Nation. Security categories constitute an initial summary of impact in terms of failures to meet the security objectives of confidentiality, integrity, and availability, and are informed by the types of harm presented in Table H-2."
    status: "candidate"
