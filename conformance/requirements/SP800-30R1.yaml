  - id: "REQ-SP800-30R1-0206"
    citation: {"ref": "SP800-30R1", "page": 44, "anchor": "Supplemental Guidance: Organizations assess the risks from threat events as a combination"}
    kind: "modal"
    locator: "3.2"
    context: "DETERMINE RISK"
    statement: "Supplemental Guidance: Organizations assess the risks from threat events as a combination of likelihood and impact. The level of risk associated with identified threat events represents a determination of the degree to which organizations are threatened by such events. Organizations make explicit the uncertainty in the risk determinations, including, for example, organizational assumptions and subjective judgments/decisions. Organizations can order the list of threat events of concern by the level of risk determined during the risk assessment—with the greatest attention going to high-risk events. Organizations can further prioritize risks at the same level or with similar scores (see Appendix J). Each risk corresponds to a specific threat event with a level of impact if that event occurs. In general, the risk level is typically not higher than the impact level, and likelihood can serve to reduce risk below that impact level. However, when addressing organization-wide risk management issues with a large number of missions/business functions, mission/business processes, and supporting information systems, impact as an upper bound on risk may not hold. For example, when multiple risks materialize, even if each risk is at the moderate level, the set of those moderate-level risks could aggregate to a higher level of risk for organizations. To address situations where harm occurs multiple times, organizations can define a threat event as multiple occurrences of harm and an impact level associated with the cumulative degree of harm. During the execution of Tasks 2-1 through 2-5, organizations capture key information related to uncertainties in risk assessments. These uncertainties arise from sources such as missing information, subjective determinations, and assumptions made. The effectiveness of risk assessment results is in part determined by the ability of decision makers to be able to determine the continued applicability of assumptions made as part of the assessment."
    status: "partial"
    reason: "Each threat event carries its risk level and uncertainty, and the events are ordered by risk (SRA-003); the assumptions and subjective judgments behind them are prose"
    evidence: [{"kind": "rule", "asserts": "Organizations order the list of threat events of concern by the level of risk", "target": "SRA-003", "fixture": "tests/fixtures/negative/SRA-003.rank.yaml", "expect": "ranks a lower risk above a higher one", "holds_when": "ART-RA is produced or seeded on a 0.2.0 contract", "claim": "constraint"}, {"kind": "schema", "asserts": "Each threat event records the uncertainty associated with its risk determination", "target": "framework/schema/ra.schema.json#/properties/threat_events/items/properties/uncertainty", "claim": "presence"}]
    work_item: "WI-201"
