    statement: "(c) New Public Access. When user-authenticating technology (e.g., password, digital certificate, biometric) is newly applied to an electronic information system accessed by members of the public."
    status: "candidate"
    work_item: "WI-133"
  - id: "REQ-DODI5400.16-0046"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "Commercial Sources. When agencies systematically incorporate into existing IT systems databases of"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a.(3).(d)"
    context: "PROCEDURES If PII is collected, a PIA is required for:"
    statement: "(d) Commercial Sources. When agencies systematically incorporate into existing IT systems databases of PII purchased or obtained from commercial or public sources. Merely querying such a source on an ad hoc basis using existing technology does not trigger the PIA requirement."
    status: "candidate"
    work_item: "WI-133"
  - id: "REQ-DODI5400.16-0047"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "New Interagency Uses. When federal agencies work together on shared functions involving"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a.(3).(e)"
    context: "PROCEDURES If PII is collected, a PIA is required for:"
    statement: "(e) New Interagency Uses. When federal agencies work together on shared functions involving significant new uses or exchanges of PII, such as the cross-cutting E-Government initiatives."
    status: "candidate"
    work_item: "WI-133"
  - id: "REQ-DODI5400.16-0048"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "Alteration in Character of Data. When new PII added to a collection"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a.(3).(f)"
    context: "PROCEDURES If PII is collected, a PIA is required for:"
    statement: "(f) Alteration in Character of Data. When new PII added to a collection raises the risks to personal privacy (e.g., the addition of health or financial information)."
    status: "candidate"
    work_item: "WI-133"
  - id: "REQ-DODI5400.16-0049"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "An adapted PIA is required by the OMB in accordance with OMB"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: "PROCEDURES"
    statement: "b. An adapted PIA is required by the OMB in accordance with OMB Memorandum M-10-23 (Reference (f)) when a DoD Component’s use of a third-party website or application may make PII available to the DoD Component."
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-DODI5400.16-0050"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "No PII is collected."}
    kind: "lettered"
    locator: "ENCLOSURE 3.c.(1)"
    context: "PROCEDURES A PIA is not required if:"
    statement: "(1) No PII is collected."
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-DODI5400.16-0051"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "The IT is a National Security System in accordance with Reference (d)."}
    kind: "lettered"
    locator: "ENCLOSURE 3.c.(2)"
    context: "PROCEDURES A PIA is not required if:"
    statement: "(2) The IT is a National Security System in accordance with Reference (d). Although the PIA requirements exclude National Security Systems, privacy implications are to be considered for all DoD information systems and electronic collections that collect PII. When assessing the impact on privacy, DoD Components will be guided by the privacy principles set out in Reference (e) and DoD 5400.11-R (Reference (g))"
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-DODI5400.16-0052"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "No PIA is required where information relates to internal U.S. Government operations,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: "PROCEDURES"
    statement: "d. No PIA is required where information relates to internal U.S. Government operations, when information has been previously assessed under an evaluation similar to a PIA (e.g., data use agreement), where privacy issues are unchanged from a previous assessment of PII, or as stated in paragraphs 1d(1) through 1d(3) of this section, in accordance with Reference (d)."
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-DODI5400.16-0053"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "For U.S. Government-run public websites where the user is given the option"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.(1)"
    context: "PROCEDURES"
    statement: "(1) For U.S. Government-run public websites where the user is given the option of contacting the site operator for the limited purpose of providing feedback (e.g., questions or comments) or obtaining additional information."
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-DODI5400.16-0054"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "When all elements of a PIA are addressed in a matching agreement"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.(2)"
    context: "PROCEDURES"
    statement: "(2) When all elements of a PIA are addressed in a matching agreement governed by the computer matching provisions of sections 552a(a)(8-10), (e)(12), (o), (p), (q), (r), and (u) of Title 5, United States Code, also known as the Privacy Act of 1974 (Reference (h)), which specifically provides privacy protection for matched information."
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-DODI5400.16-0055"
    citation: {"ref": "DODI5400.16", "page": 8, "anchor": "When all elements of a PIA are addressed in an interagency agreement"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.(3)"
    context: "PROCEDURES"
    statement: "(3) When all elements of a PIA are addressed in an interagency agreement permitting the merging of data for strictly statistical purposes and where the resulting data are protected from improper disclosure and use."
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-DODI5400.16-0056"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "The PIA will be prepared using DD Form 2930, “Privacy Impact Assessment"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: "PROCEDURES"
    statement: "a. The PIA will be prepared using DD Form 2930, “Privacy Impact Assessment (PIA),” available on the Internet from the DoD Forms Management Website at http://www.esd.whs.mil/Directives/forms/. The DD Form 2930A, “Adapted Privacy Impact Assessment (PIA),” is used in accordance with Reference (f)."
    status: "candidate"
    work_item: "WI-134"
  - id: "REQ-DODI5400.16-0057"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "Completion of the PIA requires coordination by the program manager or designee"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: "PROCEDURES"
    statement: "b. Completion of the PIA requires coordination by the program manager or designee through the information system security manager and privacy representative at the local level. Coordinate with the applicable records management office to ensure appropriate lifecycle management of any records created are maintained, used, preserved, and disposed of in accordance with DoD Instruction 5015.02 (Reference (i)) and National Archives and Records Administration approved records schedules."
    status: "candidate"
    work_item: "WI-137"
  - id: "REQ-DODI5400.16-0058"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "The DoD Component senior information security officer or designee will review completed"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: "PROCEDURES"
    statement: "c. The DoD Component senior information security officer or designee will review completed PIAs and confirm compliance with DoD cybersecurity policies."
    status: "candidate"
    work_item: "WI-137"
  - id: "REQ-DODI5400.16-0059"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "The DoD Component privacy officer will review completed PIAs and confirm compliance"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: "PROCEDURES"
    statement: "d. The DoD Component privacy officer will review completed PIAs and confirm compliance with Reference (e)."
    status: "candidate"
    work_item: "WI-137"
  - id: "REQ-DODI5400.16-0060"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "The DoD Component CIOs or reviewing official will serve as the DoD"}
    kind: "lettered"
    locator: "ENCLOSURE 3.e"
    context: "PROCEDURES"
    statement: "e. The DoD Component CIOs or reviewing official will serve as the DoD Component PIA final review and approval official."
    status: "candidate"
    work_item: "WI-137"
  - id: "REQ-DODI5400.16-0061"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "Each DoD Component will maintain a central repository of its PIAs on"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: "PROCEDURES"
    statement: "a. Each DoD Component will maintain a central repository of its PIAs on the Component’s public website until PII is no longer maintained in the system or the system is not in operation."
    status: "candidate"
    work_item: "WI-136"
  - id: "REQ-DODI5400.16-0062"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "Publish only section 1 of DD Form 2930."}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: "PROCEDURES"
    statement: "b. Publish only section 1 of DD Form 2930."
    status: "candidate"
    work_item: "WI-136"
  - id: "REQ-DODI5400.16-0063"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "If section 1 of DD Form 2930 contains information that would raise"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: "PROCEDURES"
    statement: "c. If section 1 of DD Form 2930 contains information that would raise security concerns or reveal classified or sensitive information, the DoD Component can restrict the publication of the assessment. Such information will be protected and handled consistent with section 552 of Reference (h), also known as the “Freedom of Information Act.”"
    status: "candidate"
    work_item: "WI-136"
  - id: "REQ-DODI5400.16-0064"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "The DoD CIO PIA Website, http://dodcio.defense.gov/In-the-News/Privacy-Impact- Assessments/, is the central link to"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: "PROCEDURES"
    statement: "d. The DoD CIO PIA Website, http://dodcio.defense.gov/In-the-News/Privacy-Impact- Assessments/, is the central link to the DoD Component PIA websites. If the component PIA Website changes, the component PIA representative will send an updated URL to osd.mc-alex.dod-cio.mbx.pia@mail.mil."
    status: "not-applicable"
    reason: "Binds the component PIA representative, who 'will send an updated URL' if the Component's PIA website changes; the first sentence only describes the DoD CIO site. Checked PER-PRIV, the nearest role: a website address change is an organizational event, ART-CHG logs system changes, and no artifact keeps the URL."
  - id: "REQ-DODI5400.16-0065"
    citation: {"ref": "DODI5400.16", "page": 9, "anchor": "SUBMISSION. DoD Components submit an electronic copy of each approved PIA to"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.4"
    context: "PROCEDURES"
    statement: "4. SUBMISSION. DoD Components submit an electronic copy of each approved PIA to the osd.mc-alex.dod-cio.mbx.pia@mail.mil. The appointed DoD CIO PIA action officer forwards only the public required PIAs to OMB."
    status: "candidate"
    work_item: "WI-136"
  - id: "REQ-DODI5400.16-0066"
    citation: {"ref": "DODI5400.16", "page": 10, "anchor": "REVIEW AND UPDATE CYCLE. Review and update of existing PIAs:"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.5"
    context: "PROCEDURES"
    statement: "5. REVIEW AND UPDATE CYCLE. Review and update of existing PIAs:"
    status: "not-a-requirement"
    reason: "Section heading and lead-in 'Review and update of existing PIAs:' with no verb. The duties are its items 0067 to 0069."
  - id: "REQ-DODI5400.16-0067"
    citation: {"ref": "DODI5400.16", "page": 10, "anchor": "For DoD IT must be synchronized with the information system’s assessment and"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: "PROCEDURES"
    statement: "a. For DoD IT must be synchronized with the information system’s assessment and authorization cycle."
    status: "candidate"
    work_item: "WI-133"
  - id: "REQ-DODI5400.16-0068"
    citation: {"ref": "DODI5400.16", "page": 10, "anchor": "For electronic collections must be completed within 3 years of PIA approval"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: "PROCEDURES"
    statement: "b. For electronic collections must be completed within 3 years of PIA approval date."
    status: "candidate"
    work_item: "WI-133"
  - id: "REQ-DODI5400.16-0069"
    citation: {"ref": "DODI5400.16", "page": 10, "anchor": "Is required when a significant system change or a change in privacy"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: "PROCEDURES"
    statement: "c. Is required when a significant system change or a change in privacy or security posture occurs."
    status: "candidate"
    work_item: "WI-133"
