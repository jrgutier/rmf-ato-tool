    citation: {"ref": "DODI5400.16", "page": 1, "anchor": "In accordance with the authority in DoD Directive (DoDD) 5144.02 (Reference (a)),"}
    kind: "lettered"
    locator: "References: See Enclosure 1.a"
    context: ""
    statement: "a. In accordance with the authority in DoD Directive (DoDD) 5144.02 (Reference (a)), reissues DoD Instruction 5400.16 (Reference (b)) to establish policy and assign responsibilities for completion and approval of PIAs."
    status: "not-a-requirement"
    reason: "Purpose clause. Its 'in accordance with' only names DoDD 5144.02 as the authority for the reissue, and 'assign responsibilities' only announces that Enclosure 2 does so, so it binds no one: the responsibilities are the entries of that enclosure."
  - id: "REQ-DODI5400.16-0002"
    citation: {"ref": "DODI5400.16", "page": 1, "anchor": "Provides procedures for the completion and approval of PIAs in DoD to"}
    kind: "lettered"
    locator: "References: See Enclosure 1.b"
    context: ""
    statement: "b. Provides procedures for the completion and approval of PIAs in DoD to meet the statutory requirement as stated in section 208 of Public Law 107-347 (Reference (c)) to analyze and ensure personally identifiable information (PII) in electronic form is collected, stored, protected, used, shared, and managed in a manner that protects privacy. These procedures also support Office of Management and Budget (OMB) Memorandum M-03-22 (Reference (d))."
    status: "not-a-requirement"
    reason: "Purpose clause: says the instruction 'Provides procedures' to meet section 208 and supports M-03-22. Background to Enclosure 3, whose entries hold the procedures."
