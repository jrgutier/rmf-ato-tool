    locator: "ENCLOSURE 3.a.(3).(a)"
    context: "PROCEDURES If PII is collected, a PIA is required for:"
    statement: "(a) Significant System Management Changes. When new uses of an existing IT system, including application of new technologies, significantly change how PII is managed in the system. For example, when an agency employs new relational database technologies or Web-based processing to access multiple data stores, such additions could create a more open environment and avenues for exposure of data that previously did not exist."
    status: "candidate"
    work_item: "WI-133"
