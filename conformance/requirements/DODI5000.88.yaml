    locator: "3.6.e.(1).(b)"
    context: "SPECIALTY ENGINEERING The LSE, working for the PM, will:"
    statement: "(b) Identify, document, and analyze identified hazards and assess the ESOH risks where hazards cannot be eliminated."
    status: "candidate"
  - id: "REQ-DODI5000.88-0218"
