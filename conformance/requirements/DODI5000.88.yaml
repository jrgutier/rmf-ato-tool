    statement: "(e) Schedule reduction."
    status: "candidate"
  - id: "REQ-DODI5000.88-0242"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "Increased system-on-system interoperability, mission integration, and reuse across the joint force."}
    kind: "lettered"
    locator: "3.7.a.(2).(f)"
    context: "DESIGN AND ARCHITECTURAL FACTORS MOSA The PM will use an appropriate open business model and system architecture that allows major system components to be severable at the appropriate level for increm"
    statement: "(f) Increased system-on-system interoperability, mission integration, and reuse across the joint force."
    status: "candidate"
  - id: "REQ-DODI5000.88-0243"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "Availability of IP and government rights thereto."}
    kind: "lettered"
    locator: "3.7.a.(2).(g)"
    context: "DESIGN AND ARCHITECTURAL FACTORS MOSA The PM will use an appropriate open business model and system architecture that allows major system components to be severable at the appropriate level for increm"
    statement: "(g) Availability of IP and government rights thereto."
    status: "candidate"
  - id: "REQ-DODI5000.88-0244"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "In accordance with Sections 2446a, 2446b, and 2446c of Title 10, U.S.C.,"}
    kind: "lettered"
    locator: "3.7.a.(3)"
    context: "DESIGN AND ARCHITECTURAL FACTORS MOSA"
    statement: "(3) In accordance with Sections 2446a, 2446b, and 2446c of Title 10, U.S.C., the LSE, working for the PM, will clearly define major system interfaces between the major system platform and major system components, between major system components, and between major system platforms. Specifically consider the expected evolution of the platform, subsystem, and major component as well as interdependent systems dependencies."
    status: "candidate"
  - id: "REQ-DODI5000.88-0245"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "The LSE, working for the PM, will use consensus-based standards for interfaces,"}
    kind: "lettered"
    locator: "3.7.a.(4)"
    context: "DESIGN AND ARCHITECTURAL FACTORS MOSA"
    statement: "(4) The LSE, working for the PM, will use consensus-based standards for interfaces, unless unavailable or unsuitable, and provide open sharing of definitions to interdependent programs. The PM will provide justification to the MDA if consensus-based standards are not used."
    status: "candidate"
  - id: "REQ-DODI5000.88-0246"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "In support of Milestone B (or equivalent), the PM will provide to"}
    kind: "lettered"
    locator: "3.7.a.(5)"
    context: "DESIGN AND ARCHITECTURAL FACTORS MOSA"
    statement: "(5) In support of Milestone B (or equivalent), the PM will provide to the MDA the program’s modular open system approach. The MDA will review the approach to ensure standardized interfaces and appropriate arrangements for obtaining necessary IP rights have been addressed and implemented. The PM will provide justification to the MDA if MOSA is not used. The MDA will review and determine whether or not the justification to not use MOSA is appropriate."
    status: "candidate"
  - id: "REQ-DODI5000.88-0247"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "The PM will ensure that the RFPs for development or production contracts"}
    kind: "lettered"
    locator: "3.7.a.(6)"
    context: "DESIGN AND ARCHITECTURAL FACTORS MOSA"
    statement: "(6) The PM will ensure that the RFPs for development or production contracts include compliance with MOSA enabling interfaces, the modular open system approach, appropriate data rights requests, and identification of the minimum set of major system components to which the design and data sharing requirements apply."
    status: "candidate"
  - id: "REQ-DODI5000.88-0248"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "Ensure compliance with U.S. and host nation electromagnetic spectrum regulations in accordance"}
    kind: "lettered"
    locator: "3.7.b.(1)"
    context: "DESIGN AND ARCHITECTURAL FACTORS The PM will:"
    statement: "(1) Ensure compliance with U.S. and host nation electromagnetic spectrum regulations in accordance with Section 305 of Title 47, U.S.C., and Sections 901 through 904 and Section 104 of Public Law 102-538."
    status: "candidate"
  - id: "REQ-DODI5000.88-0249"
    citation: {"ref": "DODI5000.88", "page": 26, "anchor": "Submit written determinations to the DoD Component chief information officer or equivalent"}
    kind: "lettered"
    locator: "3.7.b.(2)"
    context: "DESIGN AND ARCHITECTURAL FACTORS The PM will:"
    statement: "(2) Submit written determinations to the DoD Component chief information officer or equivalent that the electromagnetic spectrum necessary to support the operation of the system during its expected life-cycle is or will be available in accordance with DoDI 4650.01. These determinations will be the basis for recommendations provided to the MDA by the DoD Component chief information officer, or equivalent."
    status: "candidate"
  - id: "REQ-DODI5000.88-0250"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "Working for the PM and in conjunction with the product support manager,"}
    kind: "lettered"
    locator: "3.7.c.(1)"
    context: "DESIGN AND ARCHITECTURAL FACTORS The LSE will:"
    statement: "(1) Working for the PM and in conjunction with the product support manager, evaluate corrosion considerations throughout the acquisition and sustainment phases that reduce, control, or mitigate corrosion in sustainment."
    status: "candidate"
  - id: "REQ-DODI5000.88-0251"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "Perform corrosion prevention and control planning and include corrosion control management and"}
    kind: "lettered"
    locator: "3.7.c.(2)"
    context: "DESIGN AND ARCHITECTURAL FACTORS The LSE will:"
    statement: "(2) Perform corrosion prevention and control planning and include corrosion control management and design considerations for corrosion prevention and control in the SEP and life-cycle sustainment plan."
    status: "candidate"
  - id: "REQ-DODI5000.88-0252"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "Ensure that corrosion control requirements are included in the design and verified"}
    kind: "lettered"
    locator: "3.7.c.(3)"
    context: "DESIGN AND ARCHITECTURAL FACTORS The LSE will:"
    statement: "(3) Ensure that corrosion control requirements are included in the design and verified as part of test and acceptance programs established pursuant to DoDI 5000.67."
    status: "candidate"
  - id: "REQ-DODI5000.88-0253"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "The PM will plan for and implement item unique identification to identify"}
    kind: "modal"
    locator: "3.7.d"
    context: "DESIGN AND ARCHITECTURAL FACTORS"
    statement: "The PM will plan for and implement item unique identification to identify and track applicable major end items, configuration-controlled items, and U.S. Government-furnished property to enhance life-cycle management of assets in systems acquisition and sustainment, and to provide more accurate asset valuation and property accountability. Item unique identification planning and implementation will be documented in an item unique identification implementation plan linked to the program’s SEP. DoDI 8320.04 provides the standards for unique item identifiers."
    status: "candidate"
  - id: "REQ-DODI5000.88-0254"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "The PM, in conjunction with the product support manager, will include supportability"}
    kind: "modal"
    locator: "3.7.e"
    context: "DESIGN AND ARCHITECTURAL FACTORS"
    statement: "The PM, in conjunction with the product support manager, will include supportability analyses (e.g., failure modes, effects and criticality analysis; level of repair, source of repair; maintenance task, provisioning) as an integral part of the systems engineering process at acquisition pathway initiation and continuing throughout the program life-cycle."
    status: "candidate"
  - id: "REQ-DODI5000.88-0255"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "The supportability analysis results should be reflected in the evolution of the"}
    kind: "lettered"
    locator: "3.7.e.(1)"
    context: "DESIGN AND ARCHITECTURAL FACTORS"
    statement: "(1) The supportability analysis results should be reflected in the evolution of the digital authoritative source of truth."
    status: "candidate"
  - id: "REQ-DODI5000.88-0256"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "The LSE, working for the PM, will ensure that engineering analyses conducted"}
    kind: "lettered"
    locator: "3.7.e.(2)"
    context: "DESIGN AND ARCHITECTURAL FACTORS"
    statement: "(2) The LSE, working for the PM, will ensure that engineering analyses conducted by the specialty engineering disciplines inform the supportability analyses and sustainment risk mitigation strategies."
    status: "candidate"
  - id: "REQ-DODI5000.88-0257"
    citation: {"ref": "DODI5000.88", "page": 27, "anchor": "The PM will plan for the identification and implementation of specifications and"}
    kind: "modal"
    locator: "3.7.f"
    context: "DESIGN AND ARCHITECTURAL FACTORS"
    statement: "The PM will plan for the identification and implementation of specifications and standards that support interoperable, reliable, technologically superior, and affordable capabilities pursuant to DoDI 4120.24."
    status: "candidate"
  - id: "REQ-DODI5000.88-0258"
    citation: {"ref": "DODI5000.88", "page": 16, "anchor": "CDR."}
    kind: "lettered"
