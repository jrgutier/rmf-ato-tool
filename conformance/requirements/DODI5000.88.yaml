  - id: "REQ-DODI5000.88-0034"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "The application of this engineering instruction covers systems engineering, and other engineering"}
    kind: "lettered"
    locator: "3.1.a.(1)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(1) The application of this engineering instruction covers systems engineering, and other engineering disciplines, in the development of DoD systems which aligns with industry best practices. Systems engineering comprises a methodical and disciplined approach for the specification, design, development, realization, technical management, operations, and retirement of a system."
    status: "candidate"
  - id: "REQ-DODI5000.88-0035"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "The engineering processes apply critical thinking in a structured multi-disciplined approach to"}
    kind: "lettered"
    locator: "3.1.a.(1).(a)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(a) The engineering processes apply critical thinking in a structured multi-disciplined approach to solve problems including the balance of cost, schedule, and performance while maintaining an acceptable level of risk."
    status: "candidate"
  - id: "REQ-DODI5000.88-0036"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "Although this issuance employs some terminology mainly applicable to the major capability"}
    kind: "lettered"
    locator: "3.1.a.(1).(b)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(b) Although this issuance employs some terminology mainly applicable to the major capability acquisition pathway, the principles and practices described herein should be applied, as appropriate, to all DoD systems."
    status: "candidate"
  - id: "REQ-DODI5000.88-0037"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "ME and MIM activities will be performed as part of concept and"}
    kind: "lettered"
    locator: "3.1.a.(2)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(2) ME and MIM activities will be performed as part of concept and system development to inform developmental decisions and ensure the department is systematically investing in the appropriate capabilities, in an integrated and cost effective manner, to meet mission needs."
    status: "candidate"
  - id: "REQ-DODI5000.88-0038"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "ME and MIM activities start before conducting material solution analysis in order"}
    kind: "lettered"
    locator: "3.1.a.(2).(a)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(a) ME and MIM activities start before conducting material solution analysis in order to inform development of the concept baseline, and continue through the acquisition life-cycle."
    status: "candidate"
  - id: "REQ-DODI5000.88-0039"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "The Office of the USD(R&E) (OUSD(R&E)) will promulgate ME and integration management"}
    kind: "lettered"
    locator: "3.1.a.(2).(b)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(b) The Office of the USD(R&E) (OUSD(R&E)) will promulgate ME and integration management guidance, standards, and infrastructure to govern and digitally facilitate integration and data sharing across all DoD and OSD Components and life-cycle phases."
    status: "candidate"
  - id: "REQ-DODI5000.88-0040"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "The Military Services, PMs, lead systems engineers (LSEs), and product support managers"}
    kind: "lettered"
    locator: "3.1.a.(3)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(3) The Military Services, PMs, lead systems engineers (LSEs), and product support managers will implement engineering processes focused on a series of best practices to include concept exploration, ME, technical baseline management, engineering technical reviews, peer and independent reviews, test and evaluation, risk and CM, and technical decisions, while ensuring the security and integrity of capabilities and services."
    status: "candidate"
  - id: "REQ-DODI5000.88-0041"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "The systems engineering and engineering management approach and processes that guide all"}
    kind: "lettered"
    locator: "3.1.a.(4)"
    context: "INTRODUCTION Engineering Overview"
    statement: "(4) The systems engineering and engineering management approach and processes that guide all technical activities of the program will be documented in an SEP. The SEP describes key technical risks, processes, resources, metrics, engineering products, organizations, and design considerations. The SEP is highly specific for each program and will be updated as needed to reflect the program’s evolving systems engineering approach, plans, and current status."
    status: "candidate"
  - id: "REQ-DODI5000.88-0042"
    citation: {"ref": "DODI5000.88", "page": 8, "anchor": "Engineering application in the development of DoD systems is provided in the"}
    kind: "indicative"
    locator: "3.1.b"
    context: "INTRODUCTION"
    statement: "Engineering application in the development of DoD systems is provided in the Defense Acquisition Guidebook and other guidance documents listed in the References section."
    status: "candidate"
  - id: "REQ-DODI5000.88-0043"
    citation: {"ref": "DODI5000.88", "page": 9, "anchor": "Periodic review by independent technical personnel is a core best practice fundamental"}
    kind: "lettered"
    locator: "3.2.a"
    context: "INDEPENDENT REVIEW TEAMS (IRTS)"
    statement: "a. Periodic review by independent technical personnel is a core best practice fundamental to engineering development and managing risk."
    status: "candidate"
  - id: "REQ-DODI5000.88-0044"
    citation: {"ref": "DODI5000.88", "page": 9, "anchor": "The component acquisition executive (CAE) will implement a technical review process, in"}
    kind: "lettered"
    locator: "3.2.a.(1)"
    context: "INDEPENDENT REVIEW TEAMS (IRTS)"
    statement: "(1) The component acquisition executive (CAE) will implement a technical review process, in accordance with Paragraph 3.5., which incorporates participation and review by an IRT. The CAE will approve IRT members to ensure all organizational, professional, and relational influences from the program management office are avoided."
    status: "candidate"
  - id: "REQ-DODI5000.88-0045"
    citation: {"ref": "DODI5000.88", "page": 9, "anchor": "Large acquisition programs, such as MDAPs, may require IRT composition from separate"}
    kind: "lettered"
    locator: "3.2.a.(2)"
    context: "INDEPENDENT REVIEW TEAMS (IRTS)"
    statement: "(2) Large acquisition programs, such as MDAPs, may require IRT composition from separate U.S. Government organizations, whereas smaller acquisition programs may be able to structure an independent team from within the organization. Ideally, the IRT is consistent throughout the program life-cycle and serves as a trusted technical advisor to the CAE."
    status: "candidate"
  - id: "REQ-DODI5000.88-0046"
    citation: {"ref": "DODI5000.88", "page": 9, "anchor": "The IRT will identify and document critical issues that jeopardize achieving program"}
    kind: "lettered"
    locator: "3.2.b"
    context: "INDEPENDENT REVIEW TEAMS (IRTS)"
    statement: "b. The IRT will identify and document critical issues that jeopardize achieving program or mission objectives, to include recommended corrective action. Results will be provided directly to the CAE, with coordination but not undue influence from the Program Managers Office. The PM, with support from the LSE, will review, develop, and implement corrective action to the satisfaction of the CAE."
    status: "candidate"
  - id: "REQ-DODI5000.88-0047"
    citation: {"ref": "DODI5000.88", "page": 9, "anchor": "OUSD(R&E) will monitor the implementation of the independent review process."}
    kind: "lettered"
    locator: "3.2.c"
    context: "INDEPENDENT REVIEW TEAMS (IRTS)"
    statement: "c. OUSD(R&E) will monitor the implementation of the independent review process."
    status: "candidate"
  - id: "REQ-DODI5000.88-0048"
    citation: {"ref": "DODI5000.88", "page": 9, "anchor": "Engineering activities begin at the identification of a military need and continue"}
    kind: "lettered"
    locator: "3.3.a"
    context: "ME AND CONCEPT DEVELOPMENT"
    statement: "a. Engineering activities begin at the identification of a military need and continue throughout sustainment of the end item. OUSD(R&E) and the DoD Components will conduct an intensive process of ME and engineering trades leading to a concept design review and the establishment of a concept baseline. ME products will be developed as required to guide Planning, Programming, Budgeting, and Execution inputs, drive new technology development and experiments, provide mission-based inputs to the requirements process, and justify program or prototype initiation or continuation."
    status: "candidate"
  - id: "REQ-DODI5000.88-0049"
    citation: {"ref": "DODI5000.88", "page": 9, "anchor": "OUSD(R&E) and the DoD Components will collaboratively perform ME and MIM in"}
    kind: "lettered"
    locator: "3.3.b"
    context: "ME AND CONCEPT DEVELOPMENT"
    statement: "b. OUSD(R&E) and the DoD Components will collaboratively perform ME and MIM in accordance with the USD(R&E) ME Guide and Section 855 of Public Law 114-328. ME will consist of an evolving analysis, including gap analysis, of the mission-efficacy based on programs or prototypes contributing to a mission area."
    status: "candidate"
