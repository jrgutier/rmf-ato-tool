    statement: "1. The user representative, as defined in MIL-STD-882E, must be part of this process throughout the life-cycle and will provide formal concurrence before serious and high risk acceptance decisions. Before exposing people, equipment, or the environment to known system-related hazards, the LSE will document that the associated risks have been accepted by these acceptance authorities: the CAE (or DAE) for high risks, program executive officer-level for serious risks, and the PM for medium and low risks."
    status: "candidate"
