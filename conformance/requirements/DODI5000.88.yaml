    context: "SPECIALTY ENGINEERING The LSE, working for the PM, will:"
    statement: "2. For joint programs, risk acceptance authorities reside within the lead DoD Component. The PM will report the status of ESOH risks and acceptance decisions at technical reviews. Acquisition program reviews and fielding decisions will address the status of all serious and high ESOH risks. The PM will manage risks associated with ESOH statutory requirements using the program overall risk, issue, and opportunity management processes."
