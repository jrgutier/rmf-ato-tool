    locator: "3.6.e.(1).(a)"
    context: "SPECIALTY ENGINEERING The LSE, working for the PM, will:"
    statement: "(a) Integrate system safety engineering into the overall systems engineering process. The LSE will use the methodology in Military Standard (MIL-STD)-882E to address environment, safety, and occupational health (ESOH) risks associated with system-related hazards. In addition to MIL-STD-822E, the LSE will use the guidance identified in the DoD Joint Software Systems Safety Engineering Handbook to achieve an acceptable level of software system safety risk."
