  - {"page": 11, "locator": "Executive Summary", "reason": "no-marker", "text": "NIST Special Publication (SP) 800-18r2 (Revision 2) addresses the development of system plans in support of risk management activities, such as tasks in the NIST Risk Management Framework (RMF) steps in [SP800-37]. This revision:"}
  - {"page": 12, "locator": "Executive Summary.1", "reason": "label-only", "text": "1. Introduction"}
  - {"page": 12, "locator": "Executive Summary.1", "reason": "no-marker", "text": "All systems that process, store, and transmit information within an organization need safeguards that adhere to an organization-wide risk management strategy to address security, privacy, and cybersecurity supply chain risks. A standardized method of presenting risk management information about a system can help organizational leadership, risk managers, and system personnel understand the safeguards that are designed to protect the organization and system assets."}
  - {"page": 12, "locator": "Executive Summary.1", "reason": "no-marker", "text": "System plans collectively refer to the system security plan, system privacy plan, and cybersecurity supply chain risk management (C-SCRM) plan, which describe the assets and individuals being protected within the scope of a system and the risks associated with information exchanges that involve systems outside the scope (e.g., database sharing, cloud- or web-based service, simple file exchange)."}
  - {"page": 12, "locator": "Executive Summary.1", "reason": "no-marker", "text": "The NIST Privacy Framework [NIST PF] explains the privacy engineering objectives of predictability, manageability, and disassociability."}
  - {"page": 13, "locator": "Executive Summary.1", "reason": "no-marker", "text": "While there is a shift toward automating information capture and managing system plans using standardized machine-readable formats,2 organizations with limited resources to automate may rely on the manual preparation of traditional system plan artifacts."}
  - {"page": 13, "locator": "1.1", "reason": "no-marker", "text": "This publication focuses on the development of system plans that address system-level security, privacy, and C-SCRM requirements that are derived from enterprise, organization, and mission/business process requirements. The guidelines in this publication can be extended to:"}
  - {"page": 13, "locator": "1.1", "reason": "no-marker", "text": "The NIST Open Security Controls Assessment Language [OSCAL] is designed to standardize the representation, implementation, and assessment of controls using machine-readable data formats (e.g., XML, JSON, YAML). These OSCAL representations can be used in conjunction with the other OSCAL schemas to represent structured and machine-readable system plan information, control assessment plans, and assessment results, which facilitate the continuous assessment and monitoring of system controls. Initially designed for security assessment, OSCAL has been proven suitable for the machine-readable representation of other control types (e.g., privacy, supply chain, accessibility, safety) and to support their continuous assessment and monitoring."}
