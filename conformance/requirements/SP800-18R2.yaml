  - {"page": 41, "locator": "3.3", "reason": "no-marker", "text": "Automating the collection of system plan element information can increase the effectiveness and efficiency of maintaining system plans. Organizations have the flexibility to decide when, where, and how to use automation tools (e.g., GRC, SOAR, SIEM) to manage information for the system plan elements associated with each system. For instance, automation tools can:"}
  - {"page": 42, "locator": "3.3", "reason": "no-marker", "text": "NIST does not recommend, endorse, or certify specific products, vendors, or technologies for the automation of system plan development and maintenance."}
  - {"page": 42, "locator": "3.3.1", "reason": "no-marker", "text": "The collected information informs various management activities, such as prioritizing security, privacy, or C-SCRM initiatives and allocating resources based on impact priorities. Automating the collection of system-level risk information in a centralized repository following organization-defined data standards can reduce inconsistencies that may lead to erroneous risk-based decisions."}
  - {"page": 43, "locator": "3.3.2", "reason": "no-marker", "text": "The dashboard interfaces and reporting functions of organization-wide information management tools can ensure that authorized personnel receive updates on system component inventory information and the status of risk management efforts, including the system’s operational status, assessment and reauthorization schedules, POA&M statuses (e.g., late POA&Ms, expiring POA&Ms), and accepted risk information."}
  - {"page": 43, "locator": "3.3.2", "reason": "lead-in", "text": "Information management tools may share control implementation statuses, control assessment statuses, and implementation details with system owners and other authorized individuals from:"}
  - {"page": 43, "locator": "3.3.3", "reason": "lead-in", "text": "Automation facilitates system plan information management throughout the system life cycle, including:"}
  - {"page": 44, "locator": "3.3.3", "reason": "not-normative", "text": "Automation can be particularly useful in assessing and continuously monitoring controls throughout the system life cycle. Storing system plan data in machine-readable formats can facilitate updates to control implementation details due to assessment results, control catalog or baseline updates, and other system changes. For example, POA&Ms for “other than satisfied” findings in a machine-readable assessment report can trigger updates to system plans and other system artifacts that are stored within a central repository."}
  - {"page": 45, "locator": "3.3.4.4", "reason": "not-a-statement", "text": "Fig. 2. NIST Risk Management Framework Steps"}
  - {"page": 46, "locator": "4.1", "reason": "lead-in", "text": "When the system life cycle is initiated, key information is collected to inform initial drafts of system plans, including:"}
  - {"page": 46, "locator": "4.1", "reason": "no-marker", "text": "Defining the Authorization Boundary"}
  - {"page": 46, "locator": "4.1", "reason": "no-marker", "text": "System-specific C-SCRM concerns may include risks derived from suppliers that are several layers removed from the end user or supply chain risks associated with specific organization-defined technologies. For example, C-SCRM considers the complexities of new technologies and dynamic system interdependencies that can result in suppliers gaining incidental access18 to data. C-SCRM plan considerations include vendor-controlled SaaS offerings, hybrid or cloud environments, open-source software, information and communications technology and operational technology from suppliers outside of Trade Agreements Act nations, general procurement from unauthorized resellers, and supply chains of emerging technologies, such as artificial intelligence capabilities."}
  - {"page": 48, "locator": "4.3.1", "reason": "no-marker", "text": "[SP 800-161] includes specific C-SCRM instructions for selecting, tailoring, and implementing controls based on (i) the environments in which enterprise information systems are acquired and operate; (ii) the nature of operations conducted by enterprises; (iii) the types of threats facing enterprises, mission and business processes, supply chains, and information systems; and (iv) the type of information processed, stored, or transmitted by information systems and the supply chain infrastructure."}
  - {"page": 49, "locator": "4.3.3", "reason": "no-marker", "text": "The National Online Informative References Program maps CSF Subcategories to [SP 800-53] controls, and the NIST Privacy Engineering Program maps the Privacy Framework to [SP 800-53] controls."}
