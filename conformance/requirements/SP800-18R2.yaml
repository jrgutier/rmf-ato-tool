  - id: "REQ-SP800-18R2-0325"
    citation: {"ref": "SP800-18R2", "page": 49, "anchor": "Tailoring can involve enhancing existing controls to meet system-specific operational needs, such"}
    kind: "indicative"
    locator: "4.3.1"
    context: "Control Tailoring"
    statement: "Tailoring can involve enhancing existing controls to meet system-specific operational needs, such as strengthening consent mechanisms or implementing stricter access controls for high-risk data processing activities. Privacy officials tailor controls to address system-specific privacy requirements (e.g., additional safeguards for health or financial data) and confirm that tailoring decisions do not result in compliance gaps or additional privacy risks. The C-SCRM PMO can provide input for C-SCRM plan development through tailored common controls that may apply across the organization or mission, such as supplier risk assessments."
    status: "partial"
    reason: "S-1 interviews PER-PRIV with PER-ISSM on the privacy controls and S-2 records in ART-BASELINE `## Privacy tailoring` that tailoring leaves no compliance gap or added privacy risk; prose no rule reads."
    evidence: [{"kind": "prose", "target": "playbooks/S/S-2.md", "asserts": "S-2 has the privacy officials tailor the privacy controls with the ISSM", "claim": "presence"}]
    work_item: "WI-145"
  - id: "REQ-SP800-18R2-0326"
    citation: {"ref": "SP800-18R2", "page": 49, "anchor": "System plans identify the intended system-specific application of each allocated control along"}
    kind: "modal"
    locator: "4.3.2"
    context: "Identification of Planned Control Implementations"
    statement: "System plans identify the intended system-specific application of each allocated control along with an adequate level of implementation detail to support the assessment and monitoring of the control and associated control enhancements. Controls that are partially implemented by a common control provider are identified in the system plan as hybrid controls. Implementation details for the system-specific part of hybrid controls describe the risk management responsibilities that are shared between the system and the common control provider."
    status: "candidate"
  - id: "REQ-SP800-18R2-0327"
    citation: {"ref": "SP800-18R2", "page": 49, "anchor": "For fully inherited or hybrid controls, system plans reference the source of"}
    kind: "indicative"
    locator: "4.3.2"
    context: "Identification of Planned Control Implementations"
    statement: "For fully inherited or hybrid controls, system plans reference the source of the common control to avoid duplicating the common control implementation details.22 Notes may be added to the implementation details to describe how fully inherited controls address system requirements. Control implementation details in the system privacy plan describe how the controls meet privacy-specific requirements, such as those that address risks related to the processing of personal information, the context of data use, and potential consequences for individuals."
    status: "partial"
    reason: "ART-SSP holds the system privacy plan for a system processing PII (PRIV-008 asks the privacy requirements and assessment methods); inherited control notes are prose."
    evidence: [{"kind": "prose", "target": "templates/artifacts/ART-SSP.md", "asserts": "ART-SSP holds the system privacy plan with the security plan", "claim": "presence"}]
    work_item: "WI-141"
  - id: "REQ-SP800-18R2-0328"
    citation: {"ref": "SP800-18R2", "page": 49, "anchor": "The senior agency official for privacy is responsible for reviewing and approving"}
    kind: "modal"
    locator: "4.3.3"
    context: "Plan Review and Approval"
    statement: "The senior agency official for privacy is responsible for reviewing and approving the system privacy plan or consolidated plan before it is submitted to the authorizing official or designated representative. This review ensures that privacy risks have been thoroughly identified and that privacy controls and risk management strategies are aligned with organizational policies, legal requirements, and privacy objectives. When reviewing the system-specific C-SCRM plan in the authorization package, authorizing officials consult with the C-SCRM PMO as well as acquisitions personnel in cases of technology procurements. The C-SCRM review ensures that the C-SCRM controls and risk management strategies align with the overall organizational risk tolerances."
    status: "candidate"
    work_item: "WI-02"
