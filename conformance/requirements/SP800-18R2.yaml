  - id: "REQ-SP800-18R2-0140"
    citation: {"ref": "SP800-18R2", "page": 29, "anchor": "Organizational policies may identify the laws, regulations, and policies that are applicable"}
    kind: "modal"
    locator: "3.2"
    context: "System Plan Element Details Discussion: Identify the sources of specific requirements for the:"
    statement: "Organizational policies may identify the laws, regulations, and policies that are applicable to all systems within the organization or include a standardized list of requirement sources in an organizational template for system plans. As the legal and regulatory landscape evolves, the system plans are updated to adapt to new security, privacy, and cybersecurity supply chain risk management requirements, such as those that arise from the use of emerging technologies, automated decision-making, and data analytics. For example, privacy laws that govern data subject rights directly influence the development of the system privacy plan, including how data is handled and how the system protects individual rights, frames broader privacy risks, and addresses organizational privacy goals. The C-SCRM plan identifies suppliers or products that are prohibited by law, subject to regulatory exclusions, and constrained by organization- or system-specific policies."
    status: "partial"
    reason: "Updates are logged; what triggers one on a change in law is prose"
    evidence: [{"kind": "schema", "asserts": "The review happened on an event when system plans are updated, as well as on schedule", "target": "framework/schema/plan-reviews.schema.json#/properties/reviews/items/properties/trigger", "claim": "constraint", "sentence": "As the legal and regulatory landscape evolves, the system plans are updated to adapt to new security, privacy, and cybersecurity supply chain risk management requirements, such as those that arise from the use of emerging technologies, automated decision-making, and data analytics."}]
    work_item: "WI-282"
