    citation: {"ref": "SP800-18R2", "page": 46, "anchor": "The system-level C-SCRM plan provides a context for how organizational C-SCRM policies"}
    kind: "modal"
    locator: "4.1"
    context: "Prepare"
    statement: "The system-level C-SCRM plan provides a context for how organizational C-SCRM policies are applied at the system level by enumerating requirements, describing constraints, and addressing other supply chain risk implications. C-SCRM plans for systems align with the established organization-wide risk tolerances and C-SCRM strategy. Many organizations choose to enable systems to inherit common controls that support the organization or enterprise C-SCRM requirements. In cases where multiple components within an organization are responsible for different subsets of the same system, the organization decides the scope of the C-SCRM plan."
