    statement: "This structure provides a basis for the logical development and maintenance of a “living” system plan. The system plan elements enable an organization to determine a method for collecting and presenting information about the system, whether it is being developed or is authorized to operate. The information collected and reported for each element accurately communicates the efforts to safeguard the system information and components to organizational leadership, authorizing officials, system owners, and risk managers throughout the system life cycle."
    status: "not-a-requirement"
    reason: "Description of what the element structure gives a reader: a basis for a 'living' plan. Claims about the structure, not a duty on anyone."
