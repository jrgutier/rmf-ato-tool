    locator: "4.7"
    context: "Monitor"
    statement: "For example, the system privacy plan can define privacy metrics (e.g., access requests from individuals, data sharing frequency, incidents) that are regularly analyzed during monitoring activities to track trends and risks. The system privacy officer is responsible for identifying assessment methodologies and metrics to determine whether privacy controls are implemented correctly, operating as intended, and complying with applicable privacy requirements. Appropriate updates to privacy controls and the system privacy plan can strengthen protections."
    status: "partial"
    reason: "Privacy metrics are prose in ART-CONMON and the privacy plan's assessment methods (ssp-records.yaml privacy_plan); nothing checks a metric."
    evidence: [{"kind": "prose", "target": "templates/artifacts/ART-CONMON.md", "asserts": "ART-CONMON records privacy metrics analyzed during monitoring", "claim": "presence"}]
    work_item: "WI-139"
  - id: "REQ-SP800-18R2-0357"
    citation: {"ref": "SP800-18R2", "page": 52, "anchor": "Additionally, the system C-SCRM plan can identify a continuous monitoring capability for"}
    kind: "modal"
    locator: "4.7"
    context: "Monitor"
    statement: "Additionally, the system C-SCRM plan can identify a continuous monitoring capability for critical suppliers to alert system owners to changes that might affect the system’s risk posture. New critical components or technology refresh activities can trigger reviews of and updates to the C-SCRM plan, which may require system reauthorization."
    status: "not-a-requirement"
    reason: "Advisory: the plan 'can identify' a monitoring capability, and new components 'can trigger' reviews, 'which may require system reauthorization'. That 'require' states a possible outcome and binds no one; a firm supplier monitoring duty sits in SP800-161R1, slug cscrm-supplier-monitoring."
  - id: "REQ-SP800-18R2-0358"
    citation: {"ref": "SP800-18R2", "page": 53, "anchor": "System components and information assets may be disposed of at any time"}
    kind: "modal"
    locator: "4.7"
    context: "Monitor"
    statement: "System components and information assets may be disposed of at any time during the system life cycle, which may introduce opportunities for the compromise of stored data. System plans can include or reference the instructions for properly disposing of systems or components (e.g., sanitization of storage media) in accordance with applicable data and records retention requirements, such as those provided by the National Archives and Records Administration [NARARECM]. Component disposal records may be referenced in the system plan to indicate the date of component disposal and details about the information assets that are transferred to other systems. Updates to the system component inventory may trigger additional updates to the system plans to reflect changes in the environment of operation."
    status: "not-a-requirement"
    reason: "Advisory: components 'may be disposed of', plans 'can include or reference' instructions, records 'may be referenced', updates 'may trigger' more updates. All permissions and remarks; 'in accordance with' only qualifies those instructions and binds no one. ART-DISP holds this content anyway."
  - id: "REQ-SP800-18R2-0359"
    citation: {"ref": "SP800-18R2", "page": 53, "anchor": "Key considerations for the removal of a system or system elements from"}
    kind: "modal"
    locator: "4.7"
    context: "Monitor"
    statement: "Key considerations for the removal of a system or system elements from operation include the responsibilities of the system owner for protecting system data, the responsibility of the authorizing official for risks associated with data remanence,25 and the organizational liability for inadequate data sanitization. Demonstrating due diligence can address the legal and financial liabilities of data breaches caused by inadequate sanitization, unauthorized access to residual data, or the improper transfer of data to another system."
    status: "candidate"
