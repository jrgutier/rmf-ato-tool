    locator: "4.3"
    context: "Select System plans identify the controls that are selected and allocated to the system for implementation. [SP800-37] describes two approaches for selecting controls:"
    statement: "This derives from the work done regarding third-party risks in the Zero Trust Data Security Guide [ZTDATASEC], which discusses third parties and suppliers with incidental access to data. [SP 800-88] provides minimum sanitization requirements for use in determining recommended sanitization methods for specific media to minimize data remanence and the availability of residual data."
