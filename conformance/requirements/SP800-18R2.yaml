    kind: "modal"
    locator: "4.2"
    context: "Categorize"
    statement: "The system’s [FIPS199] security categorization reflects potential adverse impacts of the loss of confidentiality, integrity, or availability; determines the [FIPS200] minimum security requirements; and supports the RMF Select step. Security categorization information in the system plan provides the rationale for categorization decisions, including privacy and C-SCRM impacts [SP800-60v2]. Approving the security categorization may require additional input from the senior agency official for privacy and the senior procurement official."
    status: "candidate"
    work_item: "WI-112"
  - id: "REQ-SP800-18R2-0306"
    citation: {"ref": "SP800-18R2", "page": 47, "anchor": "To account for both privacy and security risks in system plans, impact"}
    kind: "indicative"
    locator: "4.2"
    context: "Categorize"
    statement: "To account for both privacy and security risks in system plans, impact levels for each information type reflect potential adverse impacts on organizational operations and assets and the privacy of individuals whose data is processed by the system. Privacy impacts are informed by other risk management activities and documentation, such as PIAs, SORNs, MOUs, and the NIST PRAM."
    status: "partial"
    reason: "C-2 step 6 records in ART-CAT `## Overlays` each Appendix factor with its level, any added factor, the weighting, the overall privacy risk level and the SAOP's approval; the section is prose no rule reads."
    evidence: [{"kind": "prose", "target": "playbooks/C/C-2.md", "asserts": "C-2 records the privacy risk analysis that selects the Privacy Overlay control set", "claim": "presence"}]
    work_item: "WI-144"
  - id: "REQ-SP800-18R2-0307"
    citation: {"ref": "SP800-18R2", "page": 47, "anchor": "The C-SCRM plan is generally developed for high- and moderate-impact systems, as"}
    kind: "indicative"
    locator: "4.2"
    context: "Categorize"
    statement: "The C-SCRM plan is generally developed for high- and moderate-impact systems, as indicated in [SP800-161]. However, there is value in developing the C-SCRM plan to protect low-impact systems as well, particularly if the low-impact system uses the same components found in high-and moderate-impact systems. In the absence of a C-SCRM plan for a low-impact system, the system security plan can identify the inheritance of C-SCRM controls from organization-level common control providers, enumerate organizational and system risk tolerances, and demonstrate the acceptance versus the transfer or mitigation of cybersecurity supply chain risks via system-specific controls."
    status: "candidate"
    work_item: "WI-124"
