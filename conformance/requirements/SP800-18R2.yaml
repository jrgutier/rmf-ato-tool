  - {"page": 16, "locator": "1.3.2", "reason": "lead-in", "text": "Based on the organization’s risk management strategy and NIST guidelines (e.g., [SP800-37], [SP800-53], [SP800-161]), system plans:"}
  - {"page": 16, "locator": "1.3.2", "reason": "no-marker", "text": "This section addresses the objectives and purposes of the system security plan, system privacy plan, and C-SCRM plan."}
  - {"page": 17, "locator": "2.2", "reason": "no-marker", "text": "This includes identifying and cataloging key inputs, such as data actions, contextual factors that describe the circumstances surrounding data processing, privacy capabilities, and privacy engineering and security objectives based on organizational mission needs, risk tolerance, and privacy goals."}
  - {"page": 17, "locator": "2.2", "reason": "no-marker", "text": "The FIPPs have been adopted in various forms in law and policy within the U.S. Government and by international organizations, such as the Organization for Economic Cooperation and Development (OECD) and the European Union. [OMB A-130] identifies and explains the FIPPs for U.S. federal agencies."}
  - {"page": 17, "locator": "2.2", "reason": "no-marker", "text": "Per the NIST Privacy Framework [NIST PF], a problematic data action (PDA) may cause an adverse effect for individuals."}
  - {"page": 17, "locator": "2.2", "reason": "no-marker", "text": "Many laws, regulations, and guidance focus on a defined scope of information that is covered by privacy protections for PII, such as [OMB A-130] or the California Privacy Rights Act [CPRA]. However, data processing may still introduce privacy risks, even if data does not meet a narrow privacy definition (e.g., some data that is not PII can be combined with other information during processing to become PII)."}
  - {"page": 18, "locator": "2.3", "reason": "no-marker", "text": "The system-level C-SCRM plan draws from the organization’s overarching C-SCRM strategy10 to address cybersecurity risks at the system level throughout the supply chain, including commercial-off-the-shelf (COTS) products, turn-key solutions, and support services. It incorporates organization-level priorities, policies, and risk tolerances to address system-level risks and interdependencies with inherited or system-specific controls that enhance trust and protection. The C-SCRM plan:"}
  - {"page": 19, "locator": "2.4", "reason": "not-a-statement", "text": "Fig. 1. Cybersecurity, privacy, and cybersecurity supply chain risk relationships While security-related controls can support system privacy outcomes, privacy risks may require additional privacy-focused controls that go beyond protecting confidentiality, integrity, and availability. Some may also introduce privacy risks that require additional management, such as monitoring for insider threats. For example, an implemented software component may have vulnerabilities that allow organization users to gain unauthorized access to datasets with employees’ personal information."}
  - {"page": 20, "locator": "2.4", "reason": "no-marker", "text": "Unauthorized data access and authorized disclosures that are made without sufficient disassociability can introduce privacy problems for individuals that may have an impact on the organization and result in noncompliance costs, direct business costs, or other impacts [PDAP]. Incorporating the security, privacy, and C-SCRM controls into a unified system plan provides a holistic view of the risk management requirements and activities throughout the system life cycle."}
