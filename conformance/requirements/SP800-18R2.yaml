    locator: "4.3.•"
    context: "Select"
    statement: "• Baseline control selection: Controls in the organizationally tailored control baselines that were determined during the RMF Prepare step are factored into the control selection process. The initial security baselines in [SP800-53B] group controls that are designed to support the [FIPS200] minimum security requirements for systems based on the [FIPS199] security impact level."
