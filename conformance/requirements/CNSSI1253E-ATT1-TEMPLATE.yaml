  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0002"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 1, "anchor": "The Classified System Overlay identifies security control specifications needed to safeguard classified"}
    kind: "indicative"
    locator: "1"
    context: ""
    statement: "The Classified System Overlay identifies security control specifications needed to safeguard classified information stored, processed, or transmitted by national security systems (NSS). This overlay is baseline independent and can be used with any NSS baseline (security and privacy) to safeguard classified information. As a result, there may be overlap of controls between an NSS baseline and controls identified in this overlay.1"
    status: "not-a-requirement"
    reason: "Sample text, the opening of the Classified System Overlay, shown under 'Example'. Its own register holds it as CNSSI1253E-ATT5-CLASSIFIED 0001."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0003"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 1, "anchor": "Organizations must effectively manage security and privacy risks related to safeguarding classified"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "Organizations must effectively manage security and privacy risks related to safeguarding classified information. To do so, the security and privacy control baselines are implemented together to support risk management decisions related to confidentiality, integrity, and/or availability as well as manage enterprise privacy risks. The Classified System Overlay provides details on why it is necessary to apply specified controls for safeguarding classified information."
    status: "not-a-requirement"
    reason: "Sample text from the Classified overlay. 'Organizations must effectively manage' binds in that overlay, where it is entry 0001; this copy is an example, so must binds no one here."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0004"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 1, "anchor": "The security and privacy baselines in CNSSI No. 1253 are “starting points”"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "The security and privacy baselines in CNSSI No. 1253 are “starting points” to guide an organization in controls applicable to their system once categorization is complete. Organizations are permitted to tailor2 the applied baseline to address specific mission or business needs and risks. Controls identified in this overlay generally have a legal/regulatory requirement associated with them and should not be tailored out without significant justification. For example, AT-2 (Literacy Training and Awareness) is in all NSS Security Control Baselines and the NSS Privacy Control Baseline because it is required by a regulatory requirement. An organization may tailor AT-2 out based on a risk assessment of the sufficiency of training and awareness provided. However, if an organization has a system with classified information on it and this overlay is applied, this overlay specifically identifies AT-2 as a control to support the safeguarding of classified information. While tailoring AT-2 out may have minimal risk to unclassified NSS, there could be significant risk to systems processing classified information if users with access to such systems and classified information on those systems are not properly and regularly trained on their responsibilities regarding protection of classified information."
    status: "not-a-requirement"
    reason: "Sample text, the Classified overlay's AT-2 passage. 'is required by a regulatory requirement', 'should not be tailored out' and 'their responsibilities' are the example's words; should binds in the overlay, not in this template, and the copy is noise."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0005"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 1, "anchor": "For NSS that process personally identifiable information (PII) and must address system-specific"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "For NSS that process personally identifiable information (PII) and must address system-specific privacy risks3, the Privacy Overlays may apply. Security and dissemination restrictions provided by classified systems are separate and distinct from privacy controls and handling requirements for addressing privacy risk."
    status: "not-a-requirement"
    reason: "Sample text on PII from the Classified overlay. 'NSS that process ... PII and must address system-specific privacy risks' states a condition inside an example; must binds no one."
