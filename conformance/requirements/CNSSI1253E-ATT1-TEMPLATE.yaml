  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0055"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 8, "anchor": "Guidance (delete when the overlay is completed): This section should be a"}
    kind: "modal"
    locator: "6"
    context: "Table 1: [Insert Title] Summary of Control Specifications"
    statement: "Guidance (delete when the overlay is completed): This section should be a comprehensive view of the overlay controls that may include unique control extensions, justification to select, guidance, parameter values, or regulatory/statutory references. Organize the information for each control using subheadings. If a subheading is not used for a specific control, delete the subheading. If multiple overlays are included, address which overlay(s) the control applies to, as appropriate. Justification to [Select, Not Select] Subheading: Identify whether the control is selected or not selected and provide the rationale for that decision based on the risk associated with the characteristics of the overlay. Control Extension Subheading: If the use of an overlay builds additional functionality, alters the strength of a control, or limits or adds implementation options, include the capability statement for those controls. Guidance Subheading: In some cases, the guidance for the selected controls and enhancements must be modified to address the characteristics of the overlay and the environments in which the system(s) operate. The guidance can also provide details as to why a particular control or control enhancement may not be applicable in some environments and offer suggestions for compensating controls, as appropriate. Parameter Value(s) Subheading: If the overlay establishes specific values for the organization-defined parameters of the applicable controls, include the values. Regulatory/Statutory Reference(s) Subheading: If a control is selected to help meet the requirements of a regulation/statute, reference all appropriate regulations/statutes, including the title, section, and paragraph. These references can be used to justify the control applicability. Example (delete when this section is completed, except for the boilerplate information): Boilerplate information: This section is a comprehensive view of the control specifications as they apply to this overlay. The guidance provided in this section elaborates on the guidance in NIST SP 800-53."
    status: "candidate"
