  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0010"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 3, "anchor": "Guidance (delete when description is completed): Identify the characteristics of a system"}
    kind: "modal"
    locator: "3"
    context: ""
    statement: "Guidance (delete when description is completed): Identify the characteristics of a system that justify the control specifications and the applicability of the overlay. The characteristics may include a description of the environment in which the overlay will be used (e.g., inside a guarded building within the continental United States, in a mobile vehicle in close proximity to adversaries, while traveling for business to a foreign country that is known for attempting to gain access to sensitive or classified information). The characteristics may also include a description of the type of information that will be processed within an information system (e.g., a system that contains personally identifiable information (PII), sensitive financial information, or health records). Another possible characteristic of overlays focuses on the functionality within the system (e.g., the system is a stand-alone system or a cross domain solution). For example, an overlay based on the environment in which the system will operate should include details about the type and quality of connectivity, type of interface used within the system, storage capacity, characteristics of the physical environment such as the power source and availability of other utilities, types of hazards in the environment, inventory of spare parts, type and amount of training individuals will have, and a description of any additional operating requirements. Specify whether this overlay is independent of a CNSS baseline or is dependent on a CNSS baseline, and if so, which baseline is included. Identify the assumptions about systems that justify the control specifications and the applicability of the overlay. These are assumptions that differ from those used in developing the baselines."
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0011"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "Example (delete when description is completed): (From the Space Platform Overlay): A"}
    kind: "indicative"
    locator: "3"
    context: ""
    statement: "Example (delete when description is completed): (From the Space Platform Overlay): A space system is a defined set of interrelated processes, communications links, and devices providing specified products or services to users or customers from a space platform(s), or directly necessary for the proper operation of the space platform(s). Examples of space system devices or components are space platforms; payloads; space bus/payload operations centers; mission/user terminals for initial reception, processing, and/or exploitation; and launch systems. These devices or components can be categorized into four segments: space segment, launch segment, ground segment, and user segment. Space platforms and payloads constitute the space segment. Launch vehicles, launch ranges, launch site services, and payload adapters constitute the launch segment. Space bus/payload operations centers constitute the ground segment. Mission terminals constitute the user segment. The life cycle of a space platform consists of the following phases: on-ground development, on-ground testing, pre-operational testing in space, operations in space, and decommissioning. This overlay applies to information technology (IT) components of unmanned space platforms in the space segment of national security space systems (whether experimental or operational). This overlay does not apply to ground or user segments or to the launch segment, nor does it address the space platform while it is in development or testing on the ground. The assumptions made in this section about the applicable unmanned space platforms do not necessarily hold true for manned space platforms or the launch, user, or ground segments. This overlay does not capture all sources of requirements driving selection of controls. Security requirements for space systems are contained in Committee on National Security Systems Policy (CNSSP) No. 12, National Information Assurance Policy for Space Systems Used to Support National Security Missions, and other issuances such as department- or service-specific directives and instructions used to implement CNSSP No. 12. Mission-specific technologies, designs, threats, and concepts of operation (CONOPS) also drive security requirements. Unmanned space platforms in the space segment differ from ground systems—they do not suffer the same threats and vulnerabilities as information systems on the ground. The following describe assumptions made about or characteristics of unmanned space platforms driving the need to use the Space Platform Overlay (i.e., add or subtract controls):"
    status: "candidate"
    removed: true
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0012"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "Space platforms after launch are impractical to physically access for repairs, reconfiguration,"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Space platforms after launch are impractical to physically access for repairs, reconfiguration, updates, or maintenance once deployed; therefore, many controls associated with these activities are not selected or must be implemented differently than intended by the control text. However, the ability for robotic spacecraft to physically access current and future space platforms is quickly emerging. This will likely require a reevaluation of the controls necessary to enable authorized interactions for repair and refueling operations and protect friendly space platforms from attacks by adversary robotic systems."
    status: "not-a-requirement"
    reason: "Sample Space characteristic. 'must be implemented differently' and 'will likely require a reevaluation' describe space platforms in an example; must and require bind no one here. This wording is from an older Space overlay, not the August 2025 attachment."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0013"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "Space platforms operate in the harsh environment of space (e.g., high radiation"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Space platforms operate in the harsh environment of space (e.g., high radiation levels, temperature extremes, vacuum, micro-gravity,); therefore, it is not appropriate to select controls intended to mitigate risks of natural or man-made disasters (e.g., fire, flood, earthquake) associated with traditional ground-based systems."
    status: "not-a-requirement"
    reason: "Sample Space characteristic: the harsh environment of space rules out disaster controls."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0014"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "Space platforms have no external “facility” to house IT components; therefore, the"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Space platforms have no external “facility” to house IT components; therefore, the controls related to providing and protecting the facility and the supporting infrastructure are typically not applicable (e.g., uninterruptable power; lighting; heating, ventilation, air conditioning, and humidity control; access control points, fences, and guards; intrusion monitoring and response; fire detection and suppression; flood or water damage detection). If some of these controls (e.g., temperature sensing and control) are applicable, it may not be possible to implement the controls in the same manner as for IT components in ground-based facilities."
    status: "not-a-requirement"
    reason: "Sample Space characteristic: no external facility. 'it may not be possible to implement the controls' states a limit in an example, so may not forbids nothing."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0015"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "Space acquisitions focus most energy and funding on getting the development correct,"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Space acquisitions focus most energy and funding on getting the development correct, due to the fact that space systems and sub-systems are typically highly specialized, low production, and high-cost units."
    status: "not-a-requirement"
    reason: "Sample Space characteristic on where acquisitions spend their energy and funding."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0016"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "Space platforms generally have a higher mission and/or monetary value than ground-based"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Space platforms generally have a higher mission and/or monetary value than ground-based IT; therefore, greater protections are put in place to ensure space platforms are not disabled or degraded and remain in a secure state once launched."
    status: "not-a-requirement"
    reason: "Sample Space characteristic: higher mission value, so greater protections."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0017"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "Space platforms have a greater time and cost to replace; therefore, it"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Space platforms have a greater time and cost to replace; therefore, it is important to design and build space platforms to higher standards and assurances to minimize residual vulnerabilities and potential defects or deficiencies."
    status: "not-a-requirement"
    reason: "Sample Space characteristic on replacement cost and building to higher standards."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0018"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 4, "anchor": "All communications with space platforms are inherently wireless, but not in the"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• All communications with space platforms are inherently wireless, but not in the sense of ground-based systems wireless access points. Therefore, controls intended to mitigate wireless threats and vulnerabilities are not implemented or are implemented differently to address space-specific threats, vulnerabilities, and technologies."
    status: "not-a-requirement"
    reason: "Sample Space characteristic: communications are inherently wireless, so wireless controls differ."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0019"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 5, "anchor": "Space systems communication architectures drive applicability of controls. Conventional platforms refer to"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Space systems communication architectures drive applicability of controls. Conventional platforms refer to point-to-point, circuit-based architectures used by the vast majority of current satellites, while advanced platforms refer to packet-switched or routed architectures which are increasing in use. Advanced platforms tend to have more complex communications architectures, rely on a distributed control plane, and potentially have more vulnerabilities. Controls necessary to mitigate additional risk in an advanced space platform are often not necessary in a conventional space platform."
    status: "not-a-requirement"
    reason: "Sample Space characteristic comparing conventional and advanced platforms' architectures."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0020"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 5, "anchor": "The boundary device for space platforms is the cryptographic interface, which ensures"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• The boundary device for space platforms is the cryptographic interface, which ensures only authorized entities (i.e., those possessing the correct algorithm implementation and keys) can communicate."
    status: "not-a-requirement"
    reason: "Sample Space characteristic: the cryptographic interface as boundary device."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0021"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 5, "anchor": "Access to space platform payload or bus command and control is restricted"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Access to space platform payload or bus command and control is restricted to organizational users either through mission-owned operations centers or mission-provided user terminals. Non-organizational users have no command and control access. Therefore, the model for selecting controls related to access is substantially different than for internet-based information systems on the ground."
    status: "not-a-requirement"
    reason: "Sample Space characteristic on organizational users and command and control access."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0022"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 5, "anchor": "Identification and authentication policies are less applicable, as there is no human"}
    kind: "lettered"
    locator: "3.•"
    context: ""
    statement: "• Identification and authentication policies are less applicable, as there is no human user who formally identifies and authenticates to the space platform in the traditional sense."
    status: "not-a-requirement"
    reason: "Last sample Space characteristic: no human user authenticates to the platform."
