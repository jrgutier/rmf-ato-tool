  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0009"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 3, "anchor": "The Privacy Overlays should be evaluated for revision if subsequent laws or"}
