  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0065"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 10, "anchor": "Guidance (delete when the tailoring guidance has been defined): Provide information to"}
    kind: "modal"
    locator: "7"
    context: "Table 1: [Insert Title] Summary of Control Specifications"
    statement: "Guidance (delete when the tailoring guidance has been defined): Provide information to system owners and authorizing officials to consider when implementing specific system capabilities. For example, some controls do not warrant selection or exclusion for a specific type of system, information, or environment but may require further consideration when systems employ these controls (e.g., part of a baseline, part of another overlay, tailoring decision) to ensure safeguarding considerations related to that control are adequately addressed. For example, AC-18, which discusses use of wireless access, is not mandatory for systems storing, processing, or transmitting classified information. However, when AC-18 is implemented for systems that contain classified information, organizations must consider how to implement this control in a way that properly protects classified information."
    status: "candidate"
