    context: "Table 1: [Insert Title] Summary of Control Specifications"
    statement: "For controls that must or should either be selected or not selected, a justification is provided based on the defined overlay characteristics. In addition to a justification, a control may have other specifications that include guidance, parameter values, and regulatory/statutory references. The specifications in this section are summarized in Table 1, Section 5. Per NIST SP 800-53, control enhancements cannot be selected without also selecting the corresponding base security control. For baseline independent overlays, controls and enhancements are explicitly identified in an overlay only if they directly support the overlay topic (i.e., they mitigate the risk associated with the characteristics described in Section 3, Overlay Characteristics). For baseline dependent overlays, all controls and enhancements included in the applied baseline are included. Tailor all controls and enhancements in the final control set as appropriate using the general tailoring guidance in CNSSI No. 1253. Controls and enhancements in a baseline or overlay either meet regulatory requirements or mitigate an anticipated risk. During tailoring, care must be taken that controls are not tailored out without a thorough understanding of the system, mission, environment, risks present (in the operational or development environment), regulatory requirements, and network, etc., as tailoring the control out may affect meeting a regulatory requirement or decrease the security posture of the system, possibly jeopardizing a system authorization. Example of when a control is selected (from the CDS Overlay):"
