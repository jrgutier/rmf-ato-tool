  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0029"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 6, "anchor": "Include a table that summarizes the control specifications. Detailed control information (e.g.,"}
    kind: "modal"
    locator: "5"
    context: ""
    statement: "Include a table that summarizes the control specifications. Detailed control information (e.g., control extensions5, justification to select, guidance) is explained in the Detailed Control Specifications section. Identify the controls that apply to the [Title] Overlay, using the format illustrated in Table 1. The first column of the table should include the control ID, optionally followed by the control name. In the applicability column (indicated by the overlay name), denote the controls that have control extensions, guidance, parameter values, and regulatory/statutory references that are unique to the overlay. Use the symbols as defined in this section’s boilerplate paragraph to denote this information. In the CNSSI No. 1253 Appendix D tables, the Privacy Implementation Considerations column identifies controls that are not added to the CNSS Privacy Control Baseline but, if implemented, may have a privacy impact and require coordination with the Senior Agency Official for Privacy (SAOP) or designee to address privacy considerations prior to implementation. If more than one type of information or more than one type of environment is associated with an overlay, multiple columns are used in the table to document the different but related overlays included in the document. For example, the Privacy Overlays includes 3 columns representing 3 different overlays and their corresponding control selections. Include an explanation of each overlay after the boilerplate information if applicable. Important Concept: Providing clear Justification to Select entries may be one of the most important aspects of an overlay. Users of overlays need to understand why each control is specified, and that specification needs to tie back to the risk associated with characteristics of the overlay topic (i.e., type of system, information, or environment)."
    status: "candidate"
