  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0060"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 9, "anchor": "Justification to Not Select: Space platform access does not fall into the"}
    kind: "modal"
    locator: "6"
    context: "Table 1: [Insert Title] Summary of Control Specifications"
    statement: "Justification to Not Select: Space platform access does not fall into the definition of remote access. Space platforms are commanded or directed (as opposed to passive receipt of information, which is broadcast) from a ground system that has encryption keys for just that space platform. This makes the space platform communication case analogous to the VPN. The definitions explicitly state that a virtual private network, when adequately provisioned with appropriate security controls, is considered an internal network (i.e., the organization establishes a network connection between organization-controlled endpoints in a manner that does not require the organization to depend on external networks to protect the confidentiality or integrity of information transmitted across the network). Example of when a control is not specified (i.e., selected or not selected in Table 1) in the overlay, but supplemental guidance is needed if the control is included as part of the baseline or added through tailoring (from the Space Platform Overlay): RA-5 (5), Vulnerability Monitoring and Scanning | Privileged Access"
    status: "not-a-requirement"
    reason: "Space sample, Justification to Not Select for AC-17. 'does not require the organization to depend on external networks' sits inside a definition, so require binds no one."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0061"
    citation: {"ref": "CNSSI1253E-ATT1-TEMPLATE", "page": 10, "anchor": "Justification to Not Select: Access to the space platform does not fall"}
    kind: "modal"
    locator: "6"
    context: "Table 1: [Insert Title] Summary of Control Specifications"
    statement: "Justification to Not Select: Access to the space platform does not fall under the definition of remote access, as discussed in AC-17. Guidance: Providing privileged access would be equivalent to providing access to the encrypted commanding channel and any command access required for space platforms. Privileged access for vulnerability scanning (a potentially intrusive function) creates the possibility of accidentally damaging or disabling critical functions. This creates significant mission risk for an asset that cannot be replaced or repaired after launch. Conversely, there are very few benefits from scanning due to the unique nature of space platform operating systems, since they don’t suffer from the same types of vulnerabilities as Internet-based ground systems. Other forms of mitigation are sufficient, such as checking the integrity of the flight software. Example of when an overlay incorporates another overlay (from the CDS Overlay):"
    status: "not-a-requirement"
    reason: "Space sample for RA-5(5). 'an asset that cannot be replaced or repaired' describes a platform, so cannot binds no one. The actual Space text is in Section 6, WI-21."
  - id: "REQ-CNSSI1253E-ATT1-TEMPLATE-0062"
