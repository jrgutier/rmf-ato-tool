    kind: "lettered"
    locator: "2.5.b.(5)"
    context: "DCAPE. The DCAPE: PMs:"
    statement: "(5) Comply with statutory requirements unless waived in accordance with relevant provisions."
    status: "candidate"
  - id: "REQ-DODI5000.80-0051"
    citation: {"ref": "DODI5000.80", "page": 9, "anchor": "Develop innovative and disciplined approaches for approval by the CAE or DA"}
    kind: "lettered"
    locator: "2.5.b.(6)"
    context: "DCAPE. The DCAPE: PMs:"
    statement: "(6) Develop innovative and disciplined approaches for approval by the CAE or DA to implement appropriate alternatives to any regulatory requirements that are viewed as not applicable or do not add value to rapid development of fieldable prototypes that demonstrate new capabilities and meet emerging military needs. Ensure DoD business owners within the PM organization for applicable regulatory processes are appropriately notified of recommended alternatives to any regulatory requirements that are viewed as not applicable."
    status: "candidate"
  - id: "REQ-DODI5000.80-0052"
    citation: {"ref": "DODI5000.80", "page": 9, "anchor": "Submit MTA documentation, within 14 days of approval by the DA, to"}
    kind: "lettered"
    locator: "2.5.b.(7)"
    context: "DCAPE. The DCAPE: PMs:"
    statement: "(7) Submit MTA documentation, within 14 days of approval by the DA, to the Knowledge Management and Decision Support System for review by the Joint Staff to determine if a proposed capability fulfills a gap in joint military capabilities. This submission does not constitute entrance into the Joint Capabilities Integration and Development System process. Submission of documents into the Knowledge Management and Decision Support System provides the Joint Staff visibility into the MTA program so the Joint Staff can ensure requirements are sound and risks are appropriately addressed."
    status: "candidate"
  - id: "REQ-DODI5000.80-0053"
    citation: {"ref": "DODI5000.80", "page": 9, "anchor": "In accordance with DoDI 5000.91 and with the support of the product"}
    kind: "lettered"
    locator: "2.5.b.(8)"
    context: "DCAPE. The DCAPE: PMs:"
    statement: "(8) In accordance with DoDI 5000.91 and with the support of the product support managers, develop and implement sustainment programs addressing applicable integrated product support elements to deliver affordable readiness."
    status: "candidate"
  - id: "REQ-DODI5000.80-0054"
    citation: {"ref": "DODI5000.80", "page": 9, "anchor": "Advises the USD(A&S) on policies and guidance for the MTA Pathway."}
    kind: "lettered"
