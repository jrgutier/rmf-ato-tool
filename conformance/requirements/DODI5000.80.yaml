requirements:
  - id: "REQ-DODI5000.80-0001"
    citation: {"ref": "DODI5000.80", "page": 4, "anchor": "1.1. APPLICABILITY. This issuance applies to OSD, the Military Departments, the Office"}
    kind: "indicative"
    locator: "SECTION 1: GENERAL ISSUANCE INFORMATION"
    context: ""
    statement: "1.1. APPLICABILITY. This issuance applies to OSD, the Military Departments, the Office of the Chairman of the Joint Chiefs of Staff and the Joint Staff, the Combatant Commands, the Office of Inspector General of the Department of Defense, the Defense Agencies, the DoD Field Activities, and all other organizational entities within the DoD (referred to collectively in this issuance as the “DoD Components”)."
    status: "candidate"
  - id: "REQ-DODI5000.80-0002"
    citation: {"ref": "DODI5000.80", "page": 4, "anchor": "The overarching management principles that govern the defense acquisition system (DAS) are"}
    kind: "lettered"
    locator: "1.2.a"
    context: "POLICY"
    statement: "a. The overarching management principles that govern the defense acquisition system (DAS) are described in DoDD 5000.01 and DoD Instruction (DoDI) 5000.02."
    status: "candidate"
  - id: "REQ-DODI5000.80-0003"
    citation: {"ref": "DODI5000.80", "page": 4, "anchor": "The objective of the DAS is to support the National Defense Strategy,"}
    kind: "lettered"
    locator: "1.2.a.(1)"
    context: "POLICY"
    statement: "(1) The objective of the DAS is to support the National Defense Strategy, through the development of a more lethal force based on U.S. technological innovation and a culture of performance that yields a decisive and sustained U.S. military advantage."
    status: "candidate"
  - id: "REQ-DODI5000.80-0004"
    citation: {"ref": "DODI5000.80", "page": 4, "anchor": "To achieve that objective, the DoD will employ an adaptive acquisition framework"}
    kind: "lettered"
    locator: "1.2.a.(2)"
    context: "POLICY"
    statement: "(2) To achieve that objective, the DoD will employ an adaptive acquisition framework comprised of acquisition pathways, shown in Figure 1, each tailored for the unique characteristics and risk profile of the capability being acquired. The adaptive acquisition framework supports the DAS with the objective of delivering effective, secure, supportable, and affordable solutions to the end user while enabling execution at the speed of relevance. This issuance describes the responsibilities of principal acquisition officials and the purpose and key characteristics of the MTA acquisition pathway."
    status: "candidate"
  - id: "REQ-DODI5000.80-0005"
    citation: {"ref": "DODI5000.80", "page": 4, "anchor": "The MTA pathway is intended to fill a gap in the DAS"}
    kind: "lettered"
    locator: "1.2.b"
    context: "POLICY"
    statement: "b. The MTA pathway is intended to fill a gap in the DAS for those capabilities that have a level of maturity to allow them to be rapidly prototyped within an acquisition program or fielded, within 5 years of MTA program start. The MTA pathway may be used to accelerate capability maturation before transitioning to another acquisition pathway or may be used to minimally develop a capability before rapidly fielding."
    status: "candidate"
  - id: "REQ-DODI5000.80-0006"
    citation: {"ref": "DODI5000.80", "page": 4, "anchor": "The rapid prototyping path provides for the use of innovative technologies to"}
    kind: "lettered"
    locator: "1.2.c"
    context: "POLICY"
    statement: "c. The rapid prototyping path provides for the use of innovative technologies to rapidly develop fieldable prototypes to demonstrate new capabilities and meet emerging military needs. The objective of an acquisition program under this path will be to field a prototype meeting defined requirements that can be demonstrated in an operational environment and provide for a residual operational capability within 5 years of the MTA program start date. Virtual prototyping models are acceptable if they result in a fieldable residual operational capability. MTA programs may not be planned to exceed 5 years to completion and, in execution, will not exceed 5 years after MTA program start without a Defense Acquisition Executive (DAE) waiver."
    status: "candidate"
  - id: "REQ-DODI5000.80-0007"
    citation: {"ref": "DODI5000.80", "page": 4, "anchor": "The rapid fielding path provides for the use of proven technologies to"}
    kind: "lettered"
    locator: "1.2.d"
    context: "POLICY"
    statement: "d. The rapid fielding path provides for the use of proven technologies to field production quantities of new or upgraded systems with minimal development required. The objective of an acquisition program under this path will be to begin production within 6 months, complete fielding within 5 years of the MTA program start date, and enter into operations and sustainment. MTA program production start date will not exceed 6 months after the MTA program start date without a DAE waiver. MTA programs may not be planned to exceed 5 years to completion and, in execution, will not exceed 5 years after MTA program start without a DAE waiver."
    status: "candidate"
  - id: "REQ-DODI5000.80-0008"
    citation: {"ref": "DODI5000.80", "page": 5, "anchor": "Not all programs are appropriate for the MTA pathway. Major systems intended"}
    kind: "lettered"
    locator: "1.2.e"
    context: "Figure 1. Adaptive Acquisition Framework."
    statement: "e. Not all programs are appropriate for the MTA pathway. Major systems intended to satisfy requirements that are critical to a major interagency requirement, are primarily focused on technology development, or have significant international partner involvement are discouraged from using the MTA pathway. For programs that include international partner involvement, program managers (PMs) must ensure that all efforts to design and implement exportability to foreign partners are consistent with Sections 2457 and 4067 of Title 10, United States Code (U.S.C.); Section 1049 of Public Law 115-232; and other applicable statutes."
    status: "candidate"
  - id: "REQ-DODI5000.80-0009"
    citation: {"ref": "DODI5000.80", "page": 5, "anchor": "MTA programs will not be subject to the guidance in Chairman of"}
    kind: "lettered"
    locator: "1.2.f"
    context: "Figure 1. Adaptive Acquisition Framework."
    statement: "f. MTA programs will not be subject to the guidance in Chairman of the Joint Chiefs of Staff Instruction 5123.01 and DoDD 5000.01. Each DoD Component will develop a streamlined process in accordance with Paragraph 2.6. These streamlined processes provide the DoD more pathways to manage risk associated with the tradeoff between speed and interoperability across the joint force."
    status: "candidate"
  - id: "REQ-DODI5000.80-0010"
    citation: {"ref": "DODI5000.80", "page": 5, "anchor": "DoD Component-required procedures will be compliant with applicable statutes and consistent with"}
    kind: "lettered"
    locator: "1.2.g"
    context: "Figure 1. Adaptive Acquisition Framework."
    statement: "g. DoD Component-required procedures will be compliant with applicable statutes and consistent with the requirements for acquisition programs stated in this issuance. When necessary, requests for waivers to the provisions of this issuance will be submitted to the DAE."
    status: "candidate"
