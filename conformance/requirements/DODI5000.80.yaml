    context: "DOD CHIEF INFORMATION OFFICER (DOD CIO). The DoD CIO:"
    statement: "a. Advises the USD(A&S) on policies and guidance for the MTA Pathway."
    status: "candidate"
  - id: "REQ-DODI5000.80-0055"
    citation: {"ref": "DODI5000.80", "page": 10, "anchor": "Advises the USD(A&S) on MTA program technologies, information systems, cybersecurity, and other"}
    kind: "lettered"
    locator: "2.7.b"
    context: "DOD CHIEF INFORMATION OFFICER (DOD CIO). The DoD CIO:"
    statement: "b. Advises the USD(A&S) on MTA program technologies, information systems, cybersecurity, and other areas, as appropriate."
    status: "candidate"
  - id: "REQ-DODI5000.80-0056"
    citation: {"ref": "DODI5000.80", "page": 10, "anchor": "Consults with the USD(A&S), as appropriate, on policies and guidance for the"}
    kind: "lettered"
    locator: "2.8.a"
    context: "VCJCS. The VCJCS:"
    statement: "a. Consults with the USD(A&S), as appropriate, on policies and guidance for the MTA pathway."
    status: "candidate"
  - id: "REQ-DODI5000.80-0057"
    citation: {"ref": "DODI5000.80", "page": 10, "anchor": "Maintains a library of MTA requirement documents available to DoD Components."}
    kind: "lettered"
    locator: "2.8.b"
    context: "VCJCS. The VCJCS:"
    statement: "b. Maintains a library of MTA requirement documents available to DoD Components."
    status: "candidate"
  - id: "REQ-DODI5000.80-0058"
    citation: {"ref": "DODI5000.80", "page": 10, "anchor": "Advises DoD Components on interoperability across the joint force, cybersecurity of military"}
    kind: "lettered"
    locator: "2.8.c"
    context: "VCJCS. The VCJCS:"
    statement: "c. Advises DoD Components on interoperability across the joint force, cybersecurity of military networks, and alignment with future warfighting concepts."
    status: "candidate"
  - id: "REQ-DODI5000.80-0059"
    citation: {"ref": "DODI5000.80", "page": 11, "anchor": "Operational Needs. DoD Components will develop a merit-based process for the consideration of innovative technologies and"}
    kind: "lettered"
    locator: "3.1.a"
    context: "RAPID PROTOTYPING"
    statement: "a. Operational Needs. DoD Components will develop a merit-based process for the consideration of innovative technologies and new capabilities to meet needs communicated by the Joint Chiefs of Staff and the Combatant Commanders. This process will result in an approved requirement and a DA signed acquisition decision memorandum (ADM) that validates the rationale for using the MTA pathway and identifies the full funding required."
    status: "candidate"
  - id: "REQ-DODI5000.80-0060"
    citation: {"ref": "DODI5000.80", "page": 11, "anchor": "Acquisition and Funding Strategies. DoD Components will develop a process to implement acquisition and full funding strategies for the program. This process will result in an acquisition strategy, which includes security, schedule and production risks, and a cost estimate."}
    kind: "lettered"
    locator: "3.1.b"
    context: "RAPID PROTOTYPING"
    statement: "b. Acquisition and Funding Strategies. DoD Components will develop a process to implement acquisition and full funding strategies for the program. This process will result in an acquisition strategy, which includes security, schedule and production risks, and a cost estimate."
    status: "candidate"
  - id: "REQ-DODI5000.80-0061"
    citation: {"ref": "DODI5000.80", "page": 11, "anchor": "Demonstrating and Evaluating Performance. DoD Components will develop a process for demonstrating performance and evaluating the proposed products and technologies for current operational purposes. This process will result in a test strategy or an assessment of"}
    kind: "lettered"
    locator: "3.1.c"
    context: "RAPID PROTOTYPING"
    statement: "c. Demonstrating and Evaluating Performance. DoD Components will develop a process for demonstrating performance and evaluating the proposed products and technologies for current operational purposes. This process will result in a test strategy or an assessment of test results, included in the acquisition strategy, documenting the evaluation of the demonstrated operational performance, to include validation against required non-kinetic threats (i.e., cybersecurity; electromagnetic spectrum; chemical, biological, radiological, and nuclear; and space) and interoperability requirements, as applicable. Programs on the DOT&E oversight list will follow applicable procedures, in accordance with DoDI 5000.89."
    status: "candidate"
  - id: "REQ-DODI5000.80-0062"
    citation: {"ref": "DODI5000.80", "page": 11, "anchor": "Transitioning MTA Rapid Prototyping Programs. For each MTA program, DoD Components will"}
    kind: "lettered"
    locator: "3.1.d"
    context: "RAPID PROTOTYPING"
    statement: "d. Transitioning MTA Rapid Prototyping Programs. For each MTA program, DoD Components will develop a process for transitioning successful prototypes to new or existing acquisition programs for production, fielding, and operations and sustainment under the rapid fielding pathway or other acquisition pathway. This process will result in a transition plan, to be provided to the Office of the USD(A&S) via the AIR database, within 2 years of program start. The transition plan will provide a timeline for completion of all necessary documentation required for transition to an alternative pathway, as determined by the DA, no later than 3 months before program completion."
    status: "candidate"
  - id: "REQ-DODI5000.80-0063"
    citation: {"ref": "DODI5000.80", "page": 11, "anchor": "Operational Needs. DoD Components will develop a merit-based process for the consideration of existing products and"}
    kind: "lettered"
    locator: "3.2.a"
    context: "RAPID FIELDING"
    statement: "a. Operational Needs. DoD Components will develop a merit-based process for the consideration of existing products and proven technologies to meet needs communicated by the Joint Chiefs of Staff and the Combatant Commanders. This process will result in an approved requirement and a DA signed ADM, with minimum fielding plan criteria, identifying the full funding required."
    status: "candidate"
  - id: "REQ-DODI5000.80-0064"
    citation: {"ref": "DODI5000.80", "page": 11, "anchor": "Demonstrating and Evaluating Performance. DoD Components will develop a process for demonstrating performance and evaluating the proposed products and technologies for current operational purposes. This process will result in a test strategy and an assessment of"}
    kind: "lettered"
    locator: "3.2.b"
    context: "RAPID FIELDING"
    statement: "b. Demonstrating and Evaluating Performance. DoD Components will develop a process for demonstrating performance and evaluating the proposed products and technologies for current operational purposes. This process will result in a test strategy and an assessment of test results, included in the acquisition strategy, documenting the evaluation of the demonstrated operational performance, to include validation against required non-kinetic threat threats (i.e., cybersecurity; electromagnetic spectrum; chemical, biological, radiological, and nuclear; and space) and interoperability requirements, as applicable. The operational demonstration assessment will support the initial production decision by the DA. Programs on the DOT&E oversight list shall ensure they are operating in full compliance with DoDI 5000.89."
    status: "candidate"
  - id: "REQ-DODI5000.80-0065"
    citation: {"ref": "DODI5000.80", "page": 12, "anchor": "Acquisition and Funding Strategies. DoD Components will develop a process to implement acquisition and full funding strategies for the program. This process will result in an acquisition strategy, which includes security, schedule and production risks, and a cost estimate."}
    kind: "lettered"
    locator: "3.2.c"
    context: "RAPID FIELDING"
    statement: "c. Acquisition and Funding Strategies. DoD Components will develop a process to implement acquisition and full funding strategies for the program. This process will result in an acquisition strategy, which includes security, schedule and production risks, and a cost estimate."
    status: "candidate"
  - id: "REQ-DODI5000.80-0066"
    citation: {"ref": "DODI5000.80", "page": 12, "anchor": "Lifecycle Cost, Logistics Support, and Interoperability. DoD Components will develop a process"}
    kind: "lettered"
    locator: "3.2.d"
    context: "RAPID FIELDING"
    statement: "d. Lifecycle Cost, Logistics Support, and Interoperability. DoD Components will develop a process for considering lifecycle costs and address issues of logistics support and training; system, security risk, joint, and coalition interoperability; and planning for cooperative opportunities, to include foreign sales. This process will result in a tailored lifecycle sustainment plan, in accordance with DoDI 5000.89. MTA programs that exceed the MDAP threshold must comply with the requirements for covered systems in Sections 4323 and 4324 of Title 10, U.S.C., and DoDI 5000.91."
    status: "candidate"
  - id: "REQ-DODI5000.80-0067"
    citation: {"ref": "DODI5000.80", "page": 12, "anchor": "Reducing Total Ownership Cost. DoD Components will develop a process for identifying"}
    kind: "lettered"
    locator: "3.2.e"
    context: "RAPID FIELDING"
    statement: "e. Reducing Total Ownership Cost. DoD Components will develop a process for identifying and exploiting opportunities to use the rapid fielding pathway to reduce total ownership costs. Success in this process will result in a tailored lifecycle sustainment plan that considers the integrated product support elements."
    status: "candidate"
  - id: "REQ-DODI5000.80-0068"
    citation: {"ref": "DODI5000.80", "page": 12, "anchor": "Sustainment Metrics. Each MTA rapid fielding program will include sustainment requirements in"}
    kind: "lettered"
    locator: "3.2.f"
    context: "RAPID FIELDING"
    statement: "f. Sustainment Metrics. Each MTA rapid fielding program will include sustainment requirements in its design requirements, system specifications, and contracts. These requirements are the same metrics used by MDAP and major capability acquisition pathway systems (e.g., materiel availability, operational availability, reliability, maintainability, human systems integration, and operating and support costs). However, MTA programs will not use the Joint Capabilities Integration and Development System process. After initial operational capability or transition to the major capability acquisition pathway, MTA systems will be added to the required list of systems reporting all required sustainment data into the Advana Executive Analytics section, in accordance with DoDI 3110.05. A transition plan is required 2 years from the MTA program start date for programs using either the MTA rapid prototyping or MTA rapid fielding pathway."
    status: "candidate"
  - id: "REQ-DODI5000.80-0069"
    citation: {"ref": "DODI5000.80", "page": 12, "anchor": "Transitioning MTA Rapid Fielding Programs. For each MTA program, DoD Components will"}
    kind: "lettered"
    locator: "3.2.g"
    context: "RAPID FIELDING"
    statement: "g. Transitioning MTA Rapid Fielding Programs. For each MTA program, DoD Components will develop a process for transitioning successful programs to operations and sustainment. This process will result in a transition plan, to be provided to the Office of the USD(A&S) via the AIR database, within 2 years of program start. The transition plan will provide a timeline for completion of all necessary documentation required for transition to an alternative pathway, as determined by the DA, no later than 3 months before program completion."
    status: "candidate"
  - id: "REQ-DODI5000.80-0070"
    citation: {"ref": "DODI5000.80", "page": 13, "anchor": "The DA will approve MTA program documentation within their purview. Table 1"}
    kind: "lettered"
    locator: "4.1.a"
    context: "ENTRANCE"
    statement: "a. The DA will approve MTA program documentation within their purview. Table 1 describes the documentation CAEs will ensure is available via Nonclassified Internet Protocol Router Network or SECRET Internet Protocol Router Network Defense Acquisition Visibility Environment (DAVE) or Acquisition Information Repository data entry or interfaces."
    status: "candidate"
  - id: "REQ-DODI5000.80-0071"
    citation: {"ref": "DODI5000.80", "page": 13, "anchor": "Rapid Prototyping | • ADM signed by the DA • Approved Requirement3"}
    kind: "table"
    locator: "4.1"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "Rapid Prototyping | • ADM signed by the DA • Approved Requirement3 • Acquisition Strategy4 • Cost Estimate5 | • ADM signed by the DA"
    status: "candidate"
  - id: "REQ-DODI5000.80-0072"
    citation: {"ref": "DODI5000.80", "page": 13, "anchor": "Rapid Fielding"}
    kind: "table"
    locator: "4.1"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "Rapid Fielding 1. Above threshold as defined pursuant to Section 3041 of Title 10, U.S.C. 2. Equal to or below threshold as defined pursuant to Section 3041 of Title 10, U.S.C. 3. CAEs will ensure the approved requirement document is available in the Knowledge Management and Decision Support System. 4. Rapid prototyping acquisition strategies will include security, schedule, and technical risks; and, a test strategy or an assessment of test results. 5. Cost estimate conducted in accordance with DoDI 5000.73. 6. Rapid fielding acquisition strategies will include security, schedule, and production risks; and, a test strategy and assessment of test results. 7. Rapid fielding programs that exceed the MDAP threshold must comply with the requirements for covered systems in Sections 4323 and 4324 of Title 10, U.S.C., and DoDI 5000.91. | • ADM signed by the DA • Approved Requirement3 • Acquisition Strategy56 • Cost Estimate5 • Lifecycle sustainment plan7 | • ADM signed by the DA"
    status: "candidate"
  - id: "REQ-DODI5000.80-0073"
    citation: {"ref": "DODI5000.80", "page": 13, "anchor": "For any MTA program expected to require an eventual total expenditure that"}
    kind: "lettered"
    locator: "4.1.b"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "b. For any MTA program expected to require an eventual total expenditure that exceeds the major system threshold defined pursuant to Section 3041 of Title 10, U.S.C., CAEs will ensure documentation in Table 1 is available via DAVE at the time of the President’s budget submission. Full funding plans for the MTA program (to include year of execution), will be reflected in the documentation, consistent with the cost estimate."
    status: "candidate"
  - id: "REQ-DODI5000.80-0074"
    citation: {"ref": "DODI5000.80", "page": 14, "anchor": "For MTA programs that exceed the MDAP dollar threshold, the DA will"}
    kind: "lettered"
    locator: "4.1.c"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "c. For MTA programs that exceed the MDAP dollar threshold, the DA will submit the approved acquisition strategy and initiate the new program in DAVE. The DA will request approval from the Advisory Board (described in Paragraph 4.2.) for MDAP equivalent programs to use the MTA pathway."
    status: "candidate"
  - id: "REQ-DODI5000.80-0075"
    citation: {"ref": "DODI5000.80", "page": 14, "anchor": "Any MTA program expected to exceed the MDAP threshold defined pursuant to"}
    kind: "lettered"
    locator: "4.1.d"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "d. Any MTA program expected to exceed the MDAP threshold defined pursuant to Section 4201 of Title 10, U.S.C., requires a written decision from the USD(A&S), after consultation with the Advisory Board defined in Paragraph 4.2., approving use of the MTA pathway, or direction to use an alternative strategy, before obligation of funds to a performing activity. Considerations will include the strategic risks involved, the scope and criticality of the desired capability, whether programs are well positioned to meet statutory requirements based on review and input from relevant advisors and whether the program is well-suited for use of the MTA pathway. Documents initiated and approved outside of those required by this issuance are not required to be submitted into the Acquisition Information Repository or DAVE database. MTA programs that are estimated to require an eventual total expenditure that exceeds the MDAP threshold must comply with the requirements for covered systems in Sections 4323 and 4324 of Title 10, U.S.C., and DoDI 5000.91."
    status: "candidate"
  - id: "REQ-DODI5000.80-0076"
    citation: {"ref": "DODI5000.80", "page": 14, "anchor": "For programs that are not expected to be MDAP equivalent programs, the"}
    kind: "lettered"
    locator: "4.1.e"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "e. For programs that are not expected to be MDAP equivalent programs, the DA will sign an ADM to approve the program’s use of the MTA pathway. The date of signature will be the official program start date."
    status: "candidate"
  - id: "REQ-DODI5000.80-0077"
    citation: {"ref": "DODI5000.80", "page": 14, "anchor": "For programs that enter the MTA pathway below the MDAP funding threshold"}
    kind: "lettered"
    locator: "4.1.f"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "f. For programs that enter the MTA pathway below the MDAP funding threshold and later exceed it, an update must be provided to the full MTA Advisory Board to address any concerns about significant growth of the program."
    status: "candidate"
  - id: "REQ-DODI5000.80-0078"
    citation: {"ref": "DODI5000.80", "page": 14, "anchor": "In addition to the documentation listed in Table 1, DoD Components will"}
    kind: "lettered"
    locator: "4.1.g"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "g. In addition to the documentation listed in Table 1, DoD Components will ensure availability of the program identification data (PID) via DAVE interfaces. (For a description of PID requirements and connection to the submission portal, see the MTA pathway at the Adaptive Acquisition Framework page on the Defense Acquisition University website at: https://www.dau.edu/aafdid/mta). PID requirements are tiered between major and non-major systems. DoD Components will submit updated PID via DAVE data entry or interfaces with the President’s Budget and Program Objective Memorandum submissions to OSD. DoD Components must comply with the online PID requirements, consistent with the policy specified in this issuance. Substantive changes to online content not required by law must be formally coordinated following the guidelines in DoDI 5025.01. Substantive changes include any additional requirements that add to the financial and personnel burden of any DoD Components."
    status: "candidate"
  - id: "REQ-DODI5000.80-0079"
    citation: {"ref": "DODI5000.80", "page": 14, "anchor": "CAEs will ensure that MTA program names and budget reporting clearly and"}
    kind: "lettered"
    locator: "4.1.h"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "h. CAEs will ensure that MTA program names and budget reporting clearly and discretely indicate the scope of the effort being conducted under the MTA pathway, especially when the MTA program is a subprogram of a larger program or is a program spiral, increment, or block upgrade. The Office of the USD(A&S) will maintain the authoritative list of MTA programs for the DoD."
    status: "candidate"
  - id: "REQ-DODI5000.80-0080"
    citation: {"ref": "DODI5000.80", "page": 14, "anchor": "Programs using the MTA pathway are encouraged to consider the use of"}
    kind: "lettered"
    locator: "4.1.i"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "i. Programs using the MTA pathway are encouraged to consider the use of modern software practices, such as Agile, DevSecOps, and Lean, in the development of their programs, as appropriate. PMs should use DoDI 5000.87 for Agile metrics and value assessments as a reference when including software in their program."
    status: "candidate"
  - id: "REQ-DODI5000.80-0081"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "4.2. GOVERNANCE. The USD(A&S) will chair the MTA Advisory Board comprised of"}
    kind: "modal"
    locator: "4.1.i"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "4.2. GOVERNANCE. The USD(A&S) will chair the MTA Advisory Board comprised of the CAEs, the VCJCS, the USD(R&E), the DCAPE, the DOT&E, the USD(C)/CFO, DoD CIO, and others as requested by the USD(A&S) to assess the use of the MTA authority when a request is made by a CAE for a program that exceeds the MDAP threshold to use the MTA pathway, as provided in Paragraph 4.1.c. In the event of a USD(A&S) decision that any program is not appropriate for the MTA pathway, the USD(A&S) will direct the program to use an alternate acquisition pathway."
    status: "candidate"
  - id: "REQ-DODI5000.80-0082"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "Outcome determination ADM signed by the DA."}
    kind: "lettered"
    locator: "4.1.a"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "a. Outcome determination ADM signed by the DA."
    status: "candidate"
  - id: "REQ-DODI5000.80-0083"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "An assessment of test results."}
    kind: "lettered"
    locator: "4.1.b"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "b. An assessment of test results."
    status: "candidate"
  - id: "REQ-DODI5000.80-0084"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "Final PID capturing updated entries, to include the outcome, sustainment, and final"}
    kind: "lettered"
    locator: "4.1.c"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "c. Final PID capturing updated entries, to include the outcome, sustainment, and final budget of the MTA program."
    status: "candidate"
  - id: "REQ-DODI5000.80-0085"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "4.4. MTA PROGRAM TERMINATION. In the case a DA terminates an acquisition"}
    kind: "modal"
    locator: "4.1.c"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "4.4. MTA PROGRAM TERMINATION. In the case a DA terminates an acquisition program using the MTA pathway, the DA will provide notification of the termination to the Office of the USD(A&S) within 7 days. The Office of the USD(A&S) will submit a notification of such termination to Congress within 30 days. The congressional notification will include:"
    status: "candidate"
  - id: "REQ-DODI5000.80-0086"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "The initial amount of a contract awarded under such acquisition program;"}
    kind: "lettered"
    locator: "4.1.a"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "a. The initial amount of a contract awarded under such acquisition program;"
    status: "candidate"
  - id: "REQ-DODI5000.80-0087"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "The aggregate amount of funds awarded under such contract; and"}
    kind: "lettered"
    locator: "4.1.b"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "b. The aggregate amount of funds awarded under such contract; and"
    status: "candidate"
  - id: "REQ-DODI5000.80-0088"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "Written documentation of the reason for termination of such acquisition program."}
    kind: "lettered"
    locator: "4.1.c"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "c. Written documentation of the reason for termination of such acquisition program."
    status: "candidate"
  - id: "REQ-DODI5000.80-0089"
    citation: {"ref": "DODI5000.80", "page": 15, "anchor": "4.5. PRE-EXISTING MTA PROGRAMS. MTA programs designated prior to December 30, 2019,"}
    kind: "modal"
    locator: "4.1.c"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "4.5. PRE-EXISTING MTA PROGRAMS. MTA programs designated prior to December 30, 2019, will maintain their MTA program start date of funds first obligated. No later than 60 calendar days after the effective date of this issuance, pre-existing MTA programs will comply with this issuance, to include Table 1 deliverables."
    status: "candidate"
  - id: "REQ-DODI5000.80-0090"
    citation: {"ref": "DODI5000.80", "page": 16, "anchor": "4.7. ADDITIONAL REQUIREMENTS. The online requirements specified at https://www.dau.edu/aafdid/mta will inform MTA"}
    kind: "modal"
    locator: "4.1.c"
    context: "Table 1. MTA Entrance Documentation Deliverables"
    statement: "4.7. ADDITIONAL REQUIREMENTS. The online requirements specified at https://www.dau.edu/aafdid/mta will inform MTA program management and are to be treated the same as if the requirements were published in this issuance. Substantive changes to the online requirements, not required by law, must be formally coordinated in accordance with the procedures in DoDI 5025.01. Substantive changes include any additional requirements that add to the financial, personnel, or administrative burden of any of the DoD Components."
    status: "candidate"
  - id: "REQ-DODI5000.80-0091"
    citation: {"ref": "DODI5000.80", "page": 7, "anchor": "2.1. USD(A&S). In addition to the responsibilities in Paragraph 2.6., the USD(A&S):"}
    kind: "modal"
    locator: "SECTION 2: RESPONSIBILITIES"
    context: ""
    statement: "2.1. USD(A&S). In addition to the responsibilities in Paragraph 2.6., the USD(A&S):"
