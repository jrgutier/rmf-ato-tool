    kind: "indicative"
    locator: "2.5.b"
    context: "DCAPE. The DCAPE:"
    statement: "2.6. DOD AND OSD COMPONENT HEADS WITH MTA PROGRAMS. The DoD and OSD Component heads with MTA programs oversee their MTA programs through their CAEs and PMs. Each DoD and OSD Component develops a streamlined process that results in a succinct requirements document no later than 6 months from the time the operational needs process is initiated. In order to promote rapid action, approval authorities for each capability requirement may be delegated to a level no lower than the PM."
    status: "candidate"
