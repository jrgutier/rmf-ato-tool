  - id: "REQ-SP800-18R1-0014"
    citation: {"ref": "SP800-18R1", "page": 10, "anchor": "In order to develop the system security plan, it is necessary to"}
    kind: "indicative"
    locator: "1.6"
    context: "Other Related NIST Publications"
    statement: "In order to develop the system security plan, it is necessary to be familiar with NIST security standards and guidelines. It is essential that users of this publication understand the requirements and methodology for information system categorization as described in NIST FIPS 199 as well as the requirements for addressing minimum security controls for a given system as described in NIST SP 800-53, Recommended Security Controls for Federal Information Systems, and FIPS 200, Minimum Security Requirements for Federal information and Information System. Other key NIST publications directly supporting the preparation of the security plan are NIST SP 800-30, Risk Management Guide for Information Technology Systems, and NIST SP 800-37, Guide for the Security Certification and Accreditation of Federal Information Systems. All documents can be obtained from the NIST Computer Security Resource Center website at: http://csrc.nist.gov/."
    status: "not-a-requirement"
    reason: "Reader advice: 'It is essential that users of this publication understand' FIPS 199 and SP 800-53, then a pointer to where to get them. 'essential' speaks to whoever reads this guide, and names no role and no output; 0004 is the duty on the roles. 'Recommended' is only in the title of SP 800-53."
  - id: "REQ-SP800-18R1-0015"
    citation: {"ref": "SP800-18R1", "page": 10, "anchor": "Agencies should develop policy on the system security planning process. System security"}
    kind: "modal"
    locator: "1.7"
    context: "System Security Plan Responsibilities"
    statement: "Agencies should develop policy on the system security planning process. System security plans are living documents that require periodic review, modification, and plans of action and milestones for implementing security controls. Procedures should be in place outlining who reviews the plans, keeps the plan current, and follows up on planned security controls. In addition, procedures should require that system security plans be developed and reviewed prior to proceeding with the security certification and accreditation process for the system. During the security certification and accreditation process, the system security plan is analyzed, updated, and accepted. The certification agent confirms that the security controls described in the system security plan are consistent with the FIPS 199 security category determined for the information system, and that the threat and vulnerability identification and initial risk determination are identified and documented in the system security plan, risk assessment, or equivalent document. The results of a security certification are used to reassess the risks, develop the plan of action and milestones (POA&Ms) which are required to track remedial actions, and update the system security plan, thus providing the factual basis for an authorizing official to render a security accreditation decision. For additional information on the certification and accreditation process, see NIST SP 800-37. Figure 1, depicts the key inputs/outputs into the security planning process."
    status: "partial"
    reason: "plan-reviews.yaml holds periodic review; the rest describes the superseded certification and accreditation process"
    evidence: [{"kind": "rule", "asserts": "System security plans are living documents that require periodic review on a schedule", "target": "MPLAN-001", "fixture": "tests/fixtures/negative/MPLAN-001.overdue.yaml", "expect": "past the organization-defined schedule", "claim": "constraint", "holds_when": "ART-SSP is produced or seeded and plan-reviews.yaml exists", "sentence": "System security plans are living documents that require periodic review, modification, and plans of action and milestones for implementing security controls."}]
