  - id: "REQ-SP800-18R1-0086"
    citation: {"ref": "SP800-18R1", "page": 21, "anchor": "Security controls designated by the agency as common controls will, in most"}
    kind: "lettered"
    locator: "Common security control-related considerations—.-"
    context: ""
    statement: "- Security controls designated by the agency as common controls will, in most cases, be managed by an organizational entity other than the information system owner. Every control in a security control baseline must be addressed either by the agency through common security controls or by the information system owner. Decisions on common control designations must not, however, affect the agency's responsibility in providing the necessary security controls required to meet the minimum security requirements for the information system. (Additional information on common controls is provided in Section 2.5.3.)"
    status: "candidate"
