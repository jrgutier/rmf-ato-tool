  - id: "REQ-SP800-18R1-0101"
    citation: {"ref": "SP800-18R1", "page": 24, "anchor": "System owners have been briefed on the system security planning process including"}
    kind: "lettered"
    locator: "2.5.3.•"
    context: "Common Security Controls Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system own"
    statement: "• System owners have been briefed on the system security planning process including use of common controls; and"
    status: "not-a-requirement"
    reason: "A success factor under the same lead-in: system owners have been briefed. Advisory; P-5 consults PER-PM."
  - id: "REQ-SP800-18R1-0102"
    citation: {"ref": "SP800-18R1", "page": 24, "anchor": "Agency experts in the common control areas identified have been consulted as"}
    kind: "lettered"
    locator: "2.5.3.•"
    context: "Common Security Controls Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system own"
    statement: "• Agency experts in the common control areas identified have been consulted as part of the process. An agency may also assign a hybrid status to security controls in situations where one part of the control is deemed to be common, while another part of the control is deemed to be system-specific. For example, an agency may view the IR-1 (Incident Response Policy and Procedures) security control as a hybrid control with the policy portion of the control deemed to be common and the procedures portion of the control deemed to be system-specific. Hybrid security controls may also serve as templates for further control refinement. An agency may choose, for example, to implement the CP-2 (Contingency Plan) security control as a master template for a generalized contingency plan for all agency information systems with individual information system owners tailoring the plan, where appropriate, for system-specific issues. Information system owners are responsible for any system-specific issues associated with the implementation of an agency's common security controls. These issues are identified and described in the system security plans for the individual information systems. The SAISO, acting on behalf of the CIO, should coordinate with agency officials (e.g., facilities managers, site managers, personnel managers) responsible for the development and implementation of the designated common security controls to ensure that the required controls are put into place, the controls are assessed, and the assessment results are shared with the appropriate information system owners. Partitioning security controls into common security controls and system-specific security controls can result in significant savings to the agency in control development and implementation costs. It can also result in a more consistent application of the security controls across the agency at large. Moreover, equally significant savings can be realized in the security certification and accreditation process. Rather than assessing common security controls in every information system, the certification process draws upon any applicable results from the most current assessment of the common security controls performed at the agency level. An agency-wide approach to reuse and sharing of assessment results can greatly enhance the efficiency of the security certifications and accreditations being conducted by an agency and significantly reduce security program costs."
    status: "candidate"
    work_item: "WI-156"
  - id: "REQ-SP800-18R1-0103"
    citation: {"ref": "SP800-18R1", "page": 25, "anchor": "While the concept of security control partitioning into common security controls and"}
    kind: "indicative"
    locator: "2.5.3"
    context: "Common Security Controls Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system own"
    statement: "While the concept of security control partitioning into common security controls and system-specific controls is straightforward and intuitive, the application of this principle within an agency takes planning, coordination, and perseverance. If an agency is just beginning to implement this approach or has only partially implemented this approach, it may take some time to get the maximum benefits from security control partitioning and the associated reuse of assessment evidence. Because of the potential dependence on common security controls by many of an agency's information systems, a failure of such common controls may result in a significant increase in agency-level risk—risk that arises from the operation of the systems that depend on these controls."
    status: "not-a-requirement"
    reason: "Closing remark: partitioning 'takes planning' and a failure of common controls 'may result in' more risk. An observation, nobody bound."
  - id: "REQ-SP800-18R1-0104"
    citation: {"ref": "SP800-18R1", "page": 26, "anchor": "The remainder of this document guides the reader in writing a system"}
    kind: "indicative"
    locator: "2.5.3.3"
    context: "Common Security Controls"
    statement: "The remainder of this document guides the reader in writing a system security plan, including logical steps which should be followed in approaching plan development, recommended structure and content, and how to maximize the use of current NIST publications to effectively support system security planning activity. There should be established agency policy on how the information system security plans are to be controlled and accessed prior to initiation of the activity."
    status: "partial"
    reason: "Agency policy on control of and access to the plans is organizational; the handling marking SYSD-006 sets on documents holding vulnerability detail is one control of access."
    evidence: [{"kind": "rule", "target": "SYSD-006", "fixture": "tests/fixtures/negative/SYSD-006.yaml", "expect": "configuration detail is handled at a minimum as CUI", "asserts": "The security plans are controlled and accessed under a handling marking", "claim": "constraint", "holds_when": "the document is in play once its producer is active or it is seeded"}]
    work_item: "WI-174"
  - id: "REQ-SP800-18R1-0105"
    citation: {"ref": "SP800-18R1", "page": 26, "anchor": "The first item listed in the system security plan is the system"}
    kind: "indicative"
    locator: "3.1"
    context: "System Name and Identifier"
    statement: "The first item listed in the system security plan is the system name and identifier. As required in OMB Circular A-11, each system should be assigned a name and unique identifier. Assignment of a unique identifier supports the agency's ability to easily collect agency information and security metrics specific to the system as well as facilitate complete traceability to all requirements related to system implementation and performance. This identifier should remain the same throughout the life of the system and be retained in audit logs related to system use."
    status: "candidate"
  - id: "REQ-SP800-18R1-0106"
    citation: {"ref": "SP800-18R1", "page": 26, "anchor": "Each system identified in the agency's system inventory must be categorized using"}
    kind: "modal"
    locator: "3.2"
    context: "System Categorization"
    statement: "Each system identified in the agency's system inventory must be categorized using FIPS 199. NIST Special Publication 800-60, Guide for Mapping Types of Information and Information Systems to Security Categories, provides implementation guidance in completing this activity. See Table 1 for a summary of FIPS 199 categories."
    status: "candidate"
