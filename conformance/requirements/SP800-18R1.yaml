  - id: "REQ-SP800-18R1-0112"
    citation: {"ref": "SP800-18R1", "page": 27, "anchor": "An authorizing official must be identified in the system security plan for"}
    kind: "modal"
    locator: "3.4"
    context: "Authorizing Official"
    statement: "An authorizing official must be identified in the system security plan for each system. This person is the senior management official who has the authority to authorize operation (accredit) of an information system (major application or general support system) and accept the residual risk associated with the system. The assignment of the authorizing official should be in writing, and the plan must include the same contact information listed in Section 3.3."
    status: "candidate"
    work_item: "WI-170"
  - id: "REQ-SP800-18R1-0113"
    citation: {"ref": "SP800-18R1", "page": 27, "anchor": "This section should include names of other key contact personnel who can"}
    kind: "should"
    locator: "3.5"
    context: "Other Designated Contacts"
    statement: "This section should include names of other key contact personnel who can address inquiries regarding system characteristics and operation. The same information listed in Section 3.3 should be included for each person listed under this section."
    status: "candidate"
    work_item: "WI-170"
  - id: "REQ-SP800-18R1-0114"
    citation: {"ref": "SP800-18R1", "page": 28, "anchor": "Within an agency, an individual must be assigned responsibility for each system."}
    kind: "modal"
    locator: "3.6"
    context: "Assignment of Security Responsibility"
    statement: "Within an agency, an individual must be assigned responsibility for each system. This can be accomplished in many ways. In some agencies, the overall responsibility may be delegated to the SAISO. Often, the SAISO is supported by a subnet of security officers assigned to each major component. These security officers may be authorized to address the security requirements for all systems within their domain of authority. Other models may segment this responsibility in other ways based on agency structure and responsibility. The same contact information, as listed under Section 3.3, should be provided for these individuals. Most important is that this responsibility be formalized in writing either in the employee's Position Description or by delegation Memorandum."
    status: "candidate"
    work_item: "WI-170"
