  - id: "REQ-SP800-18R1-0051"
    citation: {"ref": "SP800-18R1", "page": 14, "anchor": "The rules of behavior, which are required in OMB Circular A-130, Appendix"}
    kind: "modal"
    locator: "1.8"
    context: "Rules of Behavior"
    statement: "The rules of behavior, which are required in OMB Circular A-130, Appendix III, and is a security control contained in NIST SP 800-53, should clearly delineate responsibilities and expected behavior of all individuals with access to the system. The rules should state the consequences of inconsistent behavior or noncompliance and be made available to every user prior to receiving authorization for access to the system. It is required that the rules contain a signature page for each user to acknowledge receipt, indicating that they have read, understand, and agree to abide by the rules of behavior. Electronic signatures are acceptable for use in acknowledging the rules of behavior. Figure 2 lists examples from OMB Circular A-130 Appendix III of what should be covered in typical rules of behavior. These are examples only and agencies have flexibility in the detail and contents. When developing the rules of behavior, keep in mind that the intent is to make all users accountable for their actions by acknowledging that they have read, understand, and agree to abide by the rules of behavior. The rules should not be a complete copy of the security policy or procedures guide, but rather cover, at a high level, some of the controls described in the following Figure."
    status: "candidate"
