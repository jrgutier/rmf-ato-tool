  - id: "REQ-SP800-18R1-0001"
    citation: {"ref": "SP800-18R1", "page": 7, "anchor": "In order for the plans to adequately reflect the protection of the"}
    kind: "modal"
    locator: ""
    context: ""
    statement: "In order for the plans to adequately reflect the protection of the resources, a senior management official must authorize a system to operate. The authorization of a system to process information, granted by a management official, provides an important quality control. By authorizing processing in a system, the manager accepts its associated risk. Management authorization should be based on an assessment of management, operational, and technical controls. Since the system security plan establishes and documents the security controls, it should form the basis for the authorization, supplemented by the assessment report and the plan of actions and milestones. In addition, a periodic review of controls should also contribute to future authorizations. Re-authorization should occur whenever there is a significant change in processing, but at least every three years."
