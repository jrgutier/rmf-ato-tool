  - id: "REQ-SP800-18R1-0011"
    citation: {"ref": "SP800-18R1", "page": 9, "anchor": "1.4 Systems Inventory and Federal Information Processing Standards (FIPS 199) FISMA requires"}
    kind: "modal"
    locator: "1.3"
    context: "Organization of Document A brief description of its contents follows:"
    statement: "1.4 Systems Inventory and Federal Information Processing Standards (FIPS 199) FISMA requires that agencies have in place an information systems inventory. All information systems in the inventory should be categorized using FIPS 199 as a first step in the system security planning activity. FIPS 199 is the mandatory standard to be used by all federal agencies to categorize all information and information systems collected or maintained by or on behalf of each agency based on the objectives of providing appropriate levels of information security according to impact. Security categorization standards for information and information systems provide a common framework and understanding for expressing security that, for the federal government, promotes: (i) effective management and oversight of information security programs, including the coordination of information security efforts throughout the civilian, national security, emergency preparedness, homeland security, and law enforcement communities; and (ii) consistent reporting to the Office of Management and Budget (OMB) and Congress on the adequacy and effectiveness of information security policies, procedures, and practices."
    status: "candidate"
  - id: "REQ-SP800-18R1-0012"
    citation: {"ref": "SP800-18R1", "page": 9, "anchor": "1.5 Major Applications, General Support Systems, and Minor Applications All information systems"}
    kind: "modal"
    locator: "1.3"
    context: "Organization of Document"
    statement: "1.5 Major Applications, General Support Systems, and Minor Applications All information systems must be covered by a system security plan and labeled as a major application1 or general support system.2 Specific system security plans for minor applications3 are not required because the security controls for those applications are typically provided by the general support system or major application in which they operate. In those cases where the minor application is not connected to a major application or general support system, the minor application should be briefly described in a general support system plan that has either a common physical location or is supported by the same organization. Additional information is provided in Chapter 2."
    status: "partial"
    reason: "The IT type fact labels every system; minor applications described in a general support system's plan are not modelled."
