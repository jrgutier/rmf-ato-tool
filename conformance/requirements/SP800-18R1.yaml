  - id: "REQ-SP800-18R1-0093"
    citation: {"ref": "SP800-18R1", "page": 22, "anchor": "Compensating security controls are the management, operational, or technical controls employed by"}
    kind: "modal"
    locator: "2.5.2"
    context: "Compensating Controls"
    statement: "Compensating security controls are the management, operational, or technical controls employed by an agency in lieu of prescribed controls in the low, moderate, or high security control baselines, which provide equivalent or comparable protection for an information system. Compensating security controls for an information system will be employed by an agency only under the following conditions: (i) the agency selects the compensating controls from the security control catalog in NIST SP 800-53; (ii) the agency provides a complete and convincing rationale and justification for how the compensating controls provide an equivalent security capability or level of protection for the information system; and (iii) the agency assesses and formally accepts the risk associated with employing the compensating controls in the information system. The use of compensating security controls must be reviewed, documented in the system security plan, and approved by the authorizing official for the information system."
    status: "partial"
    reason: "Equivalent protection, the risk and the AO's acceptance are required and checked; SP 800-18r1 limits the source to the catalog where SP 800-53B also allows other sources, and the SSP review is not held"
    evidence: [{"kind": "rule", "asserts": "Compensating security controls state how they provide equivalent or comparable protection", "target": "TLR-001", "fixture": "tests/fixtures/negative/TLR-001.equivalence.yaml", "expect": "does not state how it provides equivalent or comparable protection", "claim": "presence", "holds_when": "S-2 is active", "sentence": "Compensating security controls for an information system will be employed by an agency only under the following conditions: (i) the agency selects the compensating controls from the security control catalog in NIST SP 800-53; (ii) the agency provides a complete and convincing rationale and justification for how the compensating controls provide an equivalent security capability or level of protection for the information system; and (iii) the agency assesses and formally accepts the risk associated with employing the compensating controls in the information system."}, {"kind": "rule", "asserts": "The use of compensating security controls is approved by the authorizing official", "target": "TLR-001", "fixture": "tests/fixtures/negative/TLR-001.acceptor.yaml", "expect": "not the authorizing official", "claim": "constraint", "holds_when": "S-2 is active", "sentence": "The use of compensating security controls must be reviewed, documented in the system security plan, and approved by the authorizing official for the information system."}]
    work_item: "WI-220"
  - id: "REQ-SP800-18R1-0094"
    citation: {"ref": "SP800-18R1", "page": 22, "anchor": "When employing the “high watermark” concept, some of the security objectives (i.e.,"}
    kind: "modal"
