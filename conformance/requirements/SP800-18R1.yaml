  - id: "REQ-SP800-18R1-0080"
    citation: {"ref": "SP800-18R1", "page": 19, "anchor": "Agencies are expected to exercise management judgment in determining which of their"}
    kind: "modal"
    locator: "2.4"
    context: "Minor Applications"
    statement: "Agencies are expected to exercise management judgment in determining which of their applications are minor applications and to ensure that the security requirements of minor applications are addressed as part of the system security plan for the applicable general support systems or, in some cases, the applicable major application. It is very common that a minor application may have a majority of its security controls provided by the general support system or major application on which it resides. If this is the case, the information system owner of the general support system or major application is the information system owner for the minor application and is responsible for developing the system security plan. The additional security controls specific to the minor application should be documented in the system security plan as an appendix or paragraph. The minor application owner (often the same as information owner) may develop the appendix or paragraph describing the additional controls. The complete general support system or major application system security plan should be shared with the information owner. The minor application can have a FIPS 199 security category of low or moderate. However, if the minor application resides on a system that does not have adequate boundary protection, the minor application must implement the minimum baseline controls required by the host or interconnected system."
    status: "partial"
    reason: "Minor applications are not modelled."
    evidence: [{"kind": "prose", "target": "playbooks/P/P-11.md", "asserts": "Minor application security requirements are addressed in the plan of the general support system", "claim": "presence"}]
    work_item: "WI-175"
  - id: "REQ-SP800-18R1-0081"
    citation: {"ref": "SP800-18R1", "page": 20, "anchor": "FIPS 200 provides seventeen minimum security requirements for federal information and information"}
    kind: "modal"
    locator: "2.5"
    context: "Security Controls"
    statement: "FIPS 200 provides seventeen minimum security requirements for federal information and information systems. The requirements represent a broad-based, balanced information security program that addresses the management, operational, and technical aspects of protecting the confidentiality, integrity, and availability of federal information and information systems. An agency must meet the minimum security requirements in this standard by applying security controls selected in accordance with NIST SP 800-53 and the designated impact levels of the information systems. An agency has the flexibility to tailor the security control baseline in accordance with the terms and conditions set forth in the standard. Tailoring activities include: (i) the application of scoping guidance; (ii) the specification of compensating controls; and (iii) the specification of agency-defined parameters in the security controls, where allowed. The system security plan should document all tailoring activities."
    status: "candidate"
  - id: "REQ-SP800-18R1-0082"
    citation: {"ref": "SP800-18R1", "page": 20, "anchor": "Scoping guidance provides an agency with specific terms and conditions on the"}
    kind: "modal"
    locator: "2.5.1"
    context: "Scoping Guidance"
    statement: "Scoping guidance provides an agency with specific terms and conditions on the applicability and implementation of individual security controls in the security control baselines defined in NIST SP 800-53. Several considerations described below can potentially impact how the baseline security controls are applied by the agency. System security plans should clearly identify which security controls employed scoping guidance and include a description of the type of considerations that were made. The application of scoping guidance must be reviewed and approved by the authorizing official for the information system."
    status: "candidate"
  - id: "REQ-SP800-18R1-0083"
