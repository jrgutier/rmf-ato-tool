  - id: "REQ-SP800-18R1-0132"
    citation: {"ref": "SP800-18R1", "page": 30, "anchor": "List any laws, regulations, or policies that establish specific requirements for confidentiality,"}
    kind: "indicative"
    locator: "3.12"
    context: "Laws, Regulations, and Policies Affecting the System"
    statement: "List any laws, regulations, or policies that establish specific requirements for confidentiality, integrity, or availability of the system and information retained by, transmitted by, or processed by the system. General agency security requirements need not be listed since they mandate security for all systems. Each agency should decide on the level of laws, regulations, and policies to include in the system security plan. Examples might include the Privacy Act of 1974 or a specific statute or regulation concerning the information processed (e.g., tax or census information). If the system processes records subject to the Privacy Act, include the number and title of the Privacy Act system(s) of records and whether the system(s) are used for computer matching activities."
    status: "candidate"
    work_item: "WI-132"
  - id: "REQ-SP800-18R1-0133"
    citation: {"ref": "SP800-18R1", "page": 31, "anchor": "In preparation for documenting how the NIST SP 800-53 security controls for"}
    kind: "should"
    locator: "3.13"
    context: "Security Control Selection"
    statement: "In preparation for documenting how the NIST SP 800-53 security controls for the applicable security control baseline (low-, moderate-, or high impact information systems) are implemented or planned to be implemented, the security controls contained in the baseline should be reviewed and possibly tailored. The scoping guidelines explained in Section 2.5.1 should be used when determining the applicability or tailoring of individual controls. Additionally the controls that are common among numerous systems or within the whole agency should be identified and then documented in the plan. See Section 2.5.3 for guidance on how the common controls should be determined, documented, and coordinated. The process of selecting the appropriate security controls and applying the scoping guidelines to achieve adequate security17 is a multifaceted, risk-based activity involving management and operational personnel within the agency and should be conducted before the security control portion of the plan is written."
    status: "candidate"
