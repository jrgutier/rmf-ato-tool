    context: ""
    statement: "- Security controls associated with public access information systems must be carefully considered and applied with discretion since some of the security controls from the specified security control baselines (e.g., personnel security controls, identification and authentication controls) may not be applicable to users accessing information systems through public interfaces.12"
    status: "candidate"
  - id: "REQ-SP800-18R1-0088"
