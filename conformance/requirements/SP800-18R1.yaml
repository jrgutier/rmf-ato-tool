    kind: "modal"
    locator: "2.1"
    context: "Figure 3: Decomposition of large and complex information systems"
    statement: "Having the ability to isolate the high impact systems will not only result in more secure systems, but will also reduce the amount of resources required to secure many applications/systems that do not require that level of security. NIST SP 800-53 provides three security control baselines, i.e., low, moderate, and high, that are associated with the three FIPS 199 impact levels; as the impact level increases, so do the minimum assurance requirements. For reporting purposes, i.e., FISMA annual report, when an information system has varying FIPS 199 impact levels, that system is categorized at the highest impact level on that information system."
    status: "partial"
    reason: "Describes decomposition and FISMA reporting; GEN-STALE-001 holds the baseline that follows the categorization."
    evidence: [{"kind": "rule", "target": "GEN-STALE-001", "fixture": "tests/fixtures/negative/GEN-STALE-001.categorization.yaml", "expect": "differs from a fresh `rmf baseline resolve`", "claim": "constraint", "asserts": "Security control baselines are associated with the impact levels: a selected baseline that differs from a fresh baseline resolve fails"}]
    work_item: "WI-95"
  - id: "REQ-SP800-18R1-0198"
    citation: {"ref": "SP800-18R1", "page": 32, "anchor": "Security control class designations (i.e., management, operational, and technical) are defined below"}
    kind: "modal"
    locator: "3.14"
    context: "Table 2: Security Control Class, Family, and Identifier"
    statement: "Security control class designations (i.e., management, operational, and technical) are defined below for clarification in preparation of system security plans. Management controls focus on the management of the information system and the management of risk for a system. They are techniques and concerns that are normally addressed by management. Operational controls address security methods focusing on mechanisms primarily implemented and executed by people (as opposed to systems). These controls are put in place to improve the security of a particular system (or group of systems). They often require technical or specialized expertise and often rely upon management activities as well as technical controls. Technical controls focus on security controls that the computer system executes. The controls can provide automated protection for unauthorized access or misuse, facilitate detection of security violations, and support security requirements for applications and data."
    status: "not-a-requirement"
    reason: "Definitions of the management, operational and technical classes, 'defined below for clarification'. 'require technical or specialized expertise' describes such controls and binds no one. SP 800-53r5 dropped the classes."
