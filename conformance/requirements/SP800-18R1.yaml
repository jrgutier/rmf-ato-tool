    work_item: "WI-223"
  - id: "REQ-SP800-18R1-0095"
    citation: {"ref": "SP800-18R1", "page": 22, "anchor": "Information that is security-relevant at the system level (e.g., password files, network"}
    kind: "modal"
    locator: "2.5.2"
    context: "Compensating Controls"
    statement: "Information that is security-relevant at the system level (e.g., password files, network routing tables, cryptographic key management information) must be distinguished from user-level information within an information system. Certain security controls within an information system are used to support the security objectives of confidentiality and integrity for both user-level and system-level information. Organizations must exercise caution in downgrading confidentiality or integrity-related security controls to ensure that the downgrading action does not affect the security-relevant information within the information system."
    status: "partial"
    reason: "A downgrade must record that security-relevant information is unaffected; distinguishing that information from user-level information is not recorded"
    evidence: [{"kind": "rule", "asserts": "Downgrading confidentiality or integrity-related security controls must not affect the security-relevant information", "target": "TLR-002", "fixture": "tests/fixtures/negative/TLR-002.relevant.yaml", "expect": "affects the protection of the security-relevant information", "claim": "constraint", "holds_when": "S-2 is active", "sentence": "Organizations must exercise caution in downgrading confidentiality or integrity-related security controls to ensure that the downgrading action does not affect the security-relevant information within the information system."}]
    work_item: "WI-223"
  - id: "REQ-SP800-18R1-0096"
    citation: {"ref": "SP800-18R1", "page": 23, "anchor": "An agency-wide view of the information security program facilitates the identification of"}
    kind: "indicative"
    locator: "2.5.3"
    context: "Common Security Controls"
    statement: "An agency-wide view of the information security program facilitates the identification of common security controls that can be applied to one or more agency information systems. Common security controls can apply to: (i) all agency information systems; (ii) a group of information systems at a specific site (sometimes associated with the terms site certification/accreditation); or (iii) common information systems, subsystems, or applications (i.e., common hardware, software, and/or firmware) deployed at multiple operational sites (sometimes associated with the terms type certification/accreditation). Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system owners, and information system security officers (and by developmental program managers in the case of common security controls for common hardware, software, and/or firmware), have the following properties:"
    status: "not-a-requirement"
    reason: "Description of common controls: what they 'can apply to' and how they are 'typically identified', a lead-in to two properties. P-5 and its RACI hold who takes part."
  - id: "REQ-SP800-18R1-0097"
    citation: {"ref": "SP800-18R1", "page": 23, "anchor": "The development, implementation, and assessment of common security controls can be assigned"}
    kind: "lettered"
    locator: "2.5.3.•"
    context: "Common Security Controls Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system own"
    statement: "• The development, implementation, and assessment of common security controls can be assigned to responsible agency officials or organizational elements (other than the information system owners whose systems will implement or use those common security controls); and"
    status: "not-a-requirement"
    reason: "A property of common controls, under 0096: the work 'can be assigned' to officials. 'will implement' only describes systems that use them and binds no one."
  - id: "REQ-SP800-18R1-0098"
    citation: {"ref": "SP800-18R1", "page": 23, "anchor": "The results from the assessment of the common security controls can be"}
    kind: "lettered"
    locator: "2.5.3.•"
    context: "Common Security Controls Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system own"
    statement: "• The results from the assessment of the common security controls can be used to support the security certification and accreditation processes of agency information systems where those controls have been applied. Many of the management and operational controls (e.g., contingency planning controls, incident response controls, security awareness and training controls, personnel security controls, and physical security controls) needed to protect an information system may be excellent candidates for common security control status. The objective is to reduce security costs by centrally managing the development, implementation, and assessment of the common security controls designated by the agency—and subsequently, sharing assessment results with the owners of information systems where those common security controls are applied. Security controls not designated as common controls are considered system-specific controls and are the responsibility of the information system owner. System security plans should clearly identify which security controls have been designated as common security controls and which controls have been designated as system-specific controls. For efficiency in developing system security plans, common security controls should be documented once and then inserted or imported into each system security plan for the information systems within the agency. The individual responsible for implementing the common control should be listed in the security plan. Effectively maximizing the application of common controls in the system security planning process depends upon the following factors:"
    status: "candidate"
  - id: "REQ-SP800-18R1-0099"
    citation: {"ref": "SP800-18R1", "page": 24, "anchor": "The agency has developed, documented, and communicated its specific guidance on identifying"}
    kind: "lettered"
    locator: "2.5.3.•"
    context: "Common Security Controls Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system own"
    statement: "• The agency has developed, documented, and communicated its specific guidance on identifying common security controls;"
    status: "not-a-requirement"
    reason: "A success factor under 'Effectively maximizing ... depends upon the following factors': the agency has guidance on common controls. Advisory, no minimum set; P-5 publishes the controls."
  - id: "REQ-SP800-18R1-0100"
    citation: {"ref": "SP800-18R1", "page": 24, "anchor": "The agency has assigned the responsibility for coordinating common security control identification"}
    kind: "lettered"
    locator: "2.5.3.•"
    context: "Common Security Controls Common security controls, typically identified during a collaborative agency-wide process with the involvement of the CIO, SAISO, authorizing officials, information system own"
    statement: "• The agency has assigned the responsibility for coordinating common security control identification and review and obtaining consensus on the common control designations, to a management official with security program responsibilities such as the CIO or SAISO;"
