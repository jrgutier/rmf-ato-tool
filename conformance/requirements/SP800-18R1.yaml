    locator: "Infrastructure-related considerations—"
    context: ""
    statement: "For example, while the baseline security controls require identification and authentication of organizational personnel who maintain and support information systems that provide public access services, the same controls might not be required for users accessing those systems through public interfaces to obtain publicly available information. On the other hand, identification and authentication must be required for users accessing information systems through public interfaces to access their private/personal information."
    status: "not-a-requirement"
    reason: "Footnote 12, the worked example behind 0087, opening 'For example'. 'require' and 'must be required' illustrate how scoping falls on public interfaces; the rule is 0087, and ia-2 and ia-8 bind the authentication."
  - id: "REQ-SP800-18R1-0090"
