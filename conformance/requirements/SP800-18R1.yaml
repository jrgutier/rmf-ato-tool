    citation: {"ref": "SP800-18R1", "page": 19, "anchor": "Shared information processing service facility A general support system can have a"}
    kind: "lettered"
    locator: "2.3.•"
    context: "General Support Systems A general support system, for example11, can be a:"
    statement: "• Shared information processing service facility A general support system can have a FIPS 199 impact level of low, moderate, or high in its security categorization depending on the criticality or sensitivity of the system and any major applications the general support system is supporting. A general support system is considered a major information system when special management attention is required, there are high development, operating, or maintenance costs; and the system/information has a significant role in the administration of agency programs. When the general support system is a major information system, the system's FIPS 199 impact level is either moderate or high. A major application can be hosted on a general support system. The general support system plan should reference the major application system security plan."
