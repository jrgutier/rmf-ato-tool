  - id: "REQ-SP800-18R1-0193"
    citation: {"ref": "SP800-18R1", "page": 7, "anchor": "Executive Summary The objective of system security planning is to improve protection"}
    kind: "modal"
    locator: ""
    context: ""
    statement: "Executive Summary The objective of system security planning is to improve protection of information system resources. All federal systems have some level of sensitivity and require protection as part of good management practice. The protection of a system must be documented in a system security plan. The completion of system security plans is a requirement of the Office of Management and Budget (OMB) Circular A-130, “Management of Federal Information Resources,” Appendix III, “Security of Federal Automated Information Resources,” and” Title III of the E-Government Act, entitled the Federal Information Security Management Act (FISMA). The purpose of the system security plan is to provide an overview of the security requirements of the system and describe the controls in place or planned for meeting those requirements. The system security plan also delineates responsibilities and expected behavior of all individuals who access the system. The system security plan should be viewed as documentation of the structured process of planning adequate, cost-effective security protection for a system. It should reflect input from various managers with responsibilities concerning the system, including information owners, the system owner, and the senior agency information security officer (SAISO). Additional information may be included in the basic plan and the structure and format organized according to agency needs, so long as the major sections described in this document are adequately covered and readily identifiable."
    status: "candidate"
  - id: "REQ-SP800-18R1-0194"
    citation: {"ref": "SP800-18R1", "page": 11, "anchor": "The roles and responsibilities in this section are specific to information system"}
    kind: "modal"
    locator: "1.7"
    context: "Figure 1: Security Planning Process Inputs/Outputs"
    statement: "The roles and responsibilities in this section are specific to information system security planning. Recognizing that agencies have widely varying missions and organizational structures, there may be differences in naming conventions for security planning-related roles and how the associated responsibilities are allocated among agency personnel (e.g., multiple individuals filling a single role or one individual filling multiple roles4)."
    status: "not-a-requirement"
    reason: "Scope remark on Section 1.7: its 'roles and responsibilities' are specific to security planning and naming may differ. 'responsibilities' describes the section and binds no one. framework/personas.yaml maps the names."
  - id: "REQ-SP800-18R1-0195"
