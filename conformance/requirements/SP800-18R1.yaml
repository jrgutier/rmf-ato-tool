  - id: "REQ-SP800-18R1-0196"
    citation: {"ref": "SP800-18R1", "page": 17, "anchor": "While the above considerations may be useful to agencies in determining information"}
    kind: "modal"
    locator: "2.1"
    context: "Figure 3: Decomposition of large and complex information systems"
    statement: "While the above considerations may be useful to agencies in determining information system boundaries for purposes of security accreditation, they should not be viewed as limiting the agency's flexibility in establishing boundaries that promote effective information security within the available resources of the agency. Authorizing officials and senior agency information security officers should consult with prospective information system owners when establishing information system boundaries. The process of establishing boundaries for agency information systems and the associated security implications, is an agency-level activity that should include careful negotiation among all key participants—taking into account the mission/business requirements of the agency, the technical considerations with respect to information security, and the programmatic costs to the agency. FIPS 199 defines security categories for information systems based on potential impact on organizations, assets, or individuals should there be a breach of security—that is, a loss of confidentiality, integrity, or availability. FIPS 199 security categories can play an important part in defining information system boundaries by partitioning the agency's information systems according to the criticality or sensitivity of the information and information systems and the importance of those systems in accomplishing the agency's mission. This is particularly important when there are various FIPS 199 impact levels contained in one information system. The FIPS 199 requirement to secure an information system to the high watermark or highest impact level must be applied when grouping minor applications/subsystems with varying FIPS 199 impact levels into a single general support system or major application unless there is adequate boundary protection, e.g., firewalls and encryption, around those subsystems or applications with the highest impact level. Additionally, there must be assurance that the shared resources, i.e., networks, communications, and physical access within the whole general support system or major application, are protected adequately for the highest impact level."
    status: "partial"
    reason: "Boundary flexibility is guidance."
    evidence: [{"kind": "prose", "target": "playbooks/P/P-11.md", "asserts": "Authorizing officials consult on establishing boundaries", "claim": "presence"}]
    work_item: "WI-175"
  - id: "REQ-SP800-18R1-0197"
