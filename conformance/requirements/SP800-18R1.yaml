  - id: "REQ-SP800-18R1-0064"
    citation: {"ref": "SP800-18R1", "page": 16, "anchor": "Before the system security plan can be developed, the information system and"}
    kind: "modal"
    locator: "1.9.2"
    context: "System Security Plan Approval"
    statement: "Before the system security plan can be developed, the information system and the information resident within that system must be categorized based on a FIPS 199 impact analysis. Then a determination can be made as to which systems in the inventory can be logically grouped into major applications or general support systems. The FIPS 199 impact levels must be considered when the system boundaries are drawn and when selecting the initial set of security controls (i.e., control baseline). The baseline security controls can then be tailored based on an assessment of risk and local conditions including organization-specific security requirements, specific threat information, cost-benefit analyses, the availability of compensating controls, or special circumstances. Common security controls, which is one of the tailoring considerations, must be identified prior to system security plan preparation in order to identity those controls covered at the agency level, which are not system-specific. These common security controls can then be incorporated into the system security plan by reference."
    status: "partial"
    reason: "The categorization precedes the boundary in the run's order; that FIPS 199 levels shaped the boundary is prose."
    evidence: [{"kind": "prose", "target": "playbooks/P/P-11.md", "asserts": "The FIPS 199 impact levels are considered when the system boundaries are drawn", "claim": "presence"}]
    work_item: "WI-175"
  - id: "REQ-SP800-18R1-0065"
    citation: {"ref": "SP800-18R1", "page": 16, "anchor": "The process of uniquely assigning information resources9 to an information system defines"}
    kind: "indicative"
    locator: "2.1"
    context: "System Boundaries"
    statement: "The process of uniquely assigning information resources9 to an information system defines the security boundary for that system. Agencies have great flexibility in determining what constitutes an information system (i.e., major application or general support system). If a set of information resources is identified as an information system, the resources should generally be under the same direct management control. Direct management control10 does not necessarily imply that there is no intervening management. It is also possible for an information system to contain multiple subsystems. A subsystem is a major subdivision or component of an information system consisting of information, information technology, and personnel that perform one or more specific functions. Subsystems typically fall under the same management authority and are included within a single system security plan. Figure 3 depicts a general support system with three subsystems. In addition to the consideration of direct management control, it may be helpful for agencies to consider if the information resources being identified as an information system:"
    status: "partial"
    reason: "Assigning resources to a system is the boundary's components; management control is prose."
    evidence: [{"kind": "prose", "target": "playbooks/P/P-11.md", "asserts": "Information resources are assigned to the system as boundary components defining the security boundary", "claim": "presence"}]
    work_item: "WI-175"
