    statement: "-- Legacy. A Legacy environment contains older systems or applications that may use older, less-secure communication mechanisms. Other machines operating in a Legacy environment may need less restrictive security settings so that they can communicate with legacy systems and applications. A Legacy environment could be a subset of a standalone or managed environment.16"
    status: "not-a-requirement"
    reason: "Definition of a Legacy environment: older systems that 'may use' weaker mechanisms. Description."
  - id: "REQ-SP800-18R1-0125"
    citation: {"ref": "SP800-18R1", "page": 30, "anchor": "System interconnection is the direct connection of two or more IT systems"}
    kind: "modal"
    locator: "3.11"
    context: "System Interconnection/Information Sharing"
    statement: "System interconnection is the direct connection of two or more IT systems for the purpose of sharing information resources. System interconnection, if not appropriately protected, may result in a compromise of all connected systems and the data they store, process, or transmit. It is important that system owners, information owners, and management obtain as much information as possible regarding vulnerabilities associated with system interconnections and information sharing. This is essential to selecting the appropriate controls required to mitigate those vulnerabilities. An Interconnection Security Agreement (ISA), Memorandum of Understanding (MOU), or Memorandum of Agreement (MOA) is needed between systems (not between workstations/desktops or publicly accessed systems) that share data that are owned or operated by different organizations. An ISA is not needed with internal agency systems if an agency manages and enforces a rigid system development life cycle, which requires approvals and sign-offs ensuring compliance with security requirements. For additional information on interconnections, see NIST SP 800-47, Security Guide for Interconnecting Information Technology Systems. In this section, for each interconnection between systems that are owned or operated by different organizations, provide the following information concerning the authorization for the connection to other systems or the sharing of information:"
    status: "partial"
    reason: "Interconnections are recorded with their agreements; obtaining information on their vulnerabilities is prose."
    evidence: [{"kind": "rule", "target": "SYSD-003", "fixture": "tests/fixtures/negative/SYSD-003.record.yaml", "expect": "has no interconnection record", "asserts": "System interconnections are identified with an agreement record so their protection can be reviewed", "claim": "constraint"}]
    work_item: "WI-190"
