  - id: "REQ-SP800-137-0101"
    citation: {"ref": "SP800-137", "page": 26, "anchor": "Policy, procedures, and templates necessarily address manual and automated monitoring methodologies. Additionally"}
    kind: "indicative"
    locator: "3.1.1"
    context: "ORGANIZATION (TIER 1) AND MISSION/BUSINESS PROCESSES (TIER 2) ISCM STRATEGY"
    statement: "Policy, procedures, and templates necessarily address manual and automated monitoring methodologies. Additionally at these tiers, organizations establish policy and procedures for training of personnel with ISCM roles. This may include training on management and use of automated tools (e.g., establishing baselines and tuning of measurements to provide accurate monitoring of operational environments). It may also include training for recognition of and appropriate response to triggers and alerts from metrics indicating risks beyond acceptable limits, as well as training on internal or external reporting requirements. This training may be included in existing role-based training requirements for those with significant security roles, or it may consist of training specifically focused on implementation of the organization’s ISCM policy and procedures."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0102"
    citation: {"ref": "SP800-137", "page": 26, "anchor": "When implementing policies, procedures, and templates developed at higher tiers, lower tiers"}
    kind: "should"
    locator: "3.1.1"
    context: "ORGANIZATION (TIER 1) AND MISSION/BUSINESS PROCESSES (TIER 2) ISCM STRATEGY"
    statement: "When implementing policies, procedures, and templates developed at higher tiers, lower tiers fill in any gaps related to their tier-specific processes. Decisions and activities by Tier 1 and 2 officials may be constrained by things such as mission/business needs, limitations of the infrastructure (including the human components), immutable governance policies, and external drivers."
    status: "candidate"
  - id: "REQ-SP800-137-0103"
    citation: {"ref": "SP800-137", "page": 26, "anchor": "The system-level ISCM strategy is developed and implemented to support risk management,"}
    kind: "modal"
    locator: "3.1.2"
    context: "INFORMATION SYSTEM (TIER 3) ISCM STRATEGY"
    statement: "The system-level ISCM strategy is developed and implemented to support risk management, not only at the information systems tier, but at all three tiers in accordance with system and organizational risk tolerance. Although the strategy may be defined at Tiers 1 or 2, system-specific policy and procedures for implementation may also be developed at Tier 3. System-level security-related information includes assessment data pertaining to system-level security controls and metrics data obtained from system-level security controls. System owners establish a system-level strategy for ISCM by considering factors such as the system’s architecture and operational environment, as well as organizational and mission-level requirements,26 policy, procedures, and templates."
    status: "candidate"
  - id: "REQ-SP800-137-0104"
    citation: {"ref": "SP800-137", "page": 26, "anchor": "System-level ISCM addresses monitoring security controls for effectiveness (assessments), monitoring for security"}
    kind: "modal"
    locator: "3.1.2"
    context: "INFORMATION SYSTEM (TIER 3) ISCM STRATEGY"
    statement: "System-level ISCM addresses monitoring security controls for effectiveness (assessments), monitoring for security status, and reporting findings. At a minimum, all security controls, including common and hybrid controls implemented at the system level, are assessed for effectiveness in accordance with the system security plan and the methods described in NIST SP 800-53A, as amended. System owners determine assessment frequencies of security controls based on drivers from all three tiers. A full discussion of factors to consider when determining assessment and monitoring frequencies can be found in Section 3.2.2. System-level security-related information is used to determine security status at all three tiers. Use of system-level security-related information in metrics for determining security status is addressed in Section 3.2.1."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0105"
    citation: {"ref": "SP800-137", "page": 26, "anchor": "The ISCM strategy is designed, in part, to help ensure that compromises"}
    kind: "indicative"
    locator: "3.1.2"
    context: "INFORMATION SYSTEM (TIER 3) ISCM STRATEGY"
    statement: "The ISCM strategy is designed, in part, to help ensure that compromises to the security architecture are managed in a way to prevent or minimize impact on business and mission functions."
    status: "not-a-requirement"
    reason: "Footnote 26: the strategy 'is designed, in part, to help ensure' compromises are managed; a purpose statement."
  - id: "REQ-SP800-137-0106"
    citation: {"ref": "SP800-137", "page": 27, "anchor": "The ISCM strategy at the information systems tier also supports ongoing authorization."}
    kind: "modal"
    locator: "3.1.2"
    context: "INFORMATION SYSTEM (TIER 3) ISCM STRATEGY"
    statement: "The ISCM strategy at the information systems tier also supports ongoing authorization. Ongoing authorization implies recurring updates to the authorization decision information in accordance with assessment and monitoring frequencies. Assessment results from monitoring common controls implemented and managed at the organization or mission/business process tier may be combined with information generated at the information systems tier in order to provide the authorizing official (AO) with a complete set of independently-generated evidence. 27"
    status: "candidate"
  - id: "REQ-SP800-137-0107"
