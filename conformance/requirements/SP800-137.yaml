  - id: "REQ-SP800-137-0086"
    citation: {"ref": "SP800-137", "page": 25, "anchor": "The ISCM strategy is developed and implemented to support risk management in"}
    kind: "modal"
    locator: "3.1.1"
    context: "ORGANIZATION (TIER 1) AND MISSION/BUSINESS PROCESSES (TIER 2) ISCM STRATEGY"
    statement: "The ISCM strategy is developed and implemented to support risk management in accordance with organizational risk tolerance. While ISCM strategy, policy, and procedures may be developed at any tier, typically, the organization-wide ISCM strategy and associated policy are developed at the organization tier with general procedures for implementation developed at the mission/business processes tier. If the organization-wide strategy is developed at the mission/business processes tier, Tier 1officials review and approve the strategy to ensure that organizational risk tolerance across all missions and business processes has been appropriately considered. This information is communicated to staff at the mission/business processes and information systems tiers and reflected in mission/business processes and information systems tier strategy, policy, and procedures."
    status: "candidate"
    work_item: "WI-158"
