  - id: "REQ-SP800-137-0065"
    citation: {"ref": "SP800-137", "page": 20, "anchor": "This section describes the roles and responsibilities of key participants involved in"}
    kind: "modal"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "This section describes the roles and responsibilities of key participants involved in an organization’s ISCM program. Widely varying missions and organizational structures may lead to differences in naming conventions for ISCM-related roles and how specific responsibilities are allocated among organizational personnel (e.g., multiple individuals filling a single role or one individual filling multiple roles). Roles and responsibilities commonly associated with ISCM include:"
    status: "not-a-requirement"
    reason: "Introduction to section 2.4: 'This section describes the roles and responsibilities' and 'Roles and responsibilities commonly associated with ISCM include:'; a lead-in with no duty, each role paragraph carrying its own."
  - id: "REQ-SP800-137-0066"
    citation: {"ref": "SP800-137", "page": 21, "anchor": "Head of Agency. The agency head is likely to participate in the"}
    kind: "indicative"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Head of Agency. The agency head is likely to participate in the organization’s ISCM program within the context of the risk executive (function)."
    status: "not-a-requirement"
    reason: "'The agency head is likely to participate' within the risk executive (function); a forecast, not a duty. PER-CIO carries Head of Agency and P-7 already lists it."
  - id: "REQ-SP800-137-0067"
    citation: {"ref": "SP800-137", "page": 21, "anchor": "Risk Executive (Function). The risk executive (function) oversees the organization’s ISCM strategy"}
    kind: "indicative"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Risk Executive (Function). The risk executive (function) oversees the organization’s ISCM strategy and program. The risk executive (function) reviews status reports from the ISCM process as input to information security risk posture and risk tolerance decisions and provides input to mission/business process and information systems tier entities on ISCM strategy and requirements; promotes collaboration and cooperation among organizational entities; facilitates sharing of security-related information; provides an organization-wide forum to consider all sources of risk; and ensures that risk information is considered for continuous monitoring decisions."
    status: "candidate"
    work_item: "WI-284"
  - id: "REQ-SP800-137-0068"
    citation: {"ref": "SP800-137", "page": 21, "anchor": "Chief Information Officer (CIO). The CIO leads the organization’s ISCM program. The"}
    kind: "indicative"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Chief Information Officer (CIO). The CIO leads the organization’s ISCM program. The CIO ensures that an effective ISCM program is established and implemented for the organization by establishing expectations and requirements for the organization’s ISCM program; working closely with authorizing officials to provide funding, personnel, and other resources to support ISCM; and maintaining high-level communications and working group relationships among organizational entities."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0069"
    citation: {"ref": "SP800-137", "page": 21, "anchor": "Authorizing Official (AO). The AO assumes responsibility for ensuring the organization’s ISCM"}
    kind: "modal"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Authorizing Official (AO). The AO assumes responsibility for ensuring the organization’s ISCM program is applied with respect to a given information system. The AO ensures the security posture of the information system is maintained, reviews security status reports and critical security documents and determines if the risk to the organization from operation of the information system remains acceptable. The AO also determines whether significant information system changes require reauthorization actions and reauthorizes the information system when required."
    status: "candidate"
    work_item: "WI-08"
  - id: "REQ-SP800-137-0070"
    citation: {"ref": "SP800-137", "page": 21, "anchor": "Information System Owner (ISO)/Information Owner/Steward. The ISO establishes processes and procedures in"}
    kind: "modal"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Information System Owner (ISO)/Information Owner/Steward. The ISO establishes processes and procedures in support of system-level implementation of the organization’s ISCM program. This includes developing and documenting an ISCM strategy for the information system; participating in the organization’s configuration management process; establishing and maintaining an inventory of components associated with the information system; conducting security impact analyses on changes to the information system; conducting, or ensuring conduct of, assessment of security controls according to the ISCM strategy; preparing and submitting security status reports in accordance with organizational policy and procedures; conducting remediation activities as necessary to maintain system authorization; revising the system-level security control monitoring process as required; reviewing ISCM reports from common control providers to verify that the common controls continue to provide adequate protection for the information system; and updating critical security documents based on the results of ISCM."
    status: "candidate"
    work_item: "WI-156"
  - id: "REQ-SP800-137-0071"
    citation: {"ref": "SP800-137", "page": 22, "anchor": "The common control provider establishes processes and procedures in support of ongoing"}
    kind: "modal"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "The common control provider establishes processes and procedures in support of ongoing monitoring of common controls. The common control provider develops and documents an ISCM strategy for assigned common controls; participates in the organization’s configuration management process; establishes and maintains an inventory of components associated with the common controls; conducts security impact analyses on changes that affect the common controls; ensures security controls are assessed according to the ISCM strategy; prepares and submits security status reports in accordance with organizational policy/procedures; conducts remediation activities as necessary to maintain common control authorization; updates/revises the common security control monitoring process as required; updates critical security documents as changes occur; and distributes critical security documents to individual information owners/information system owners, and other senior leaders in accordance with organizational policy/procedures."
    status: "candidate"
    work_item: "WI-156"
  - id: "REQ-SP800-137-0072"
    citation: {"ref": "SP800-137", "page": 22, "anchor": "Information System Security Officer (ISSO). The ISSO supports the organization’s ISCM program"}
    kind: "modal"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Information System Security Officer (ISSO). The ISSO supports the organization’s ISCM program by assisting the ISO in completing ISCM responsibilities and by participating in the configuration management process."
    status: "candidate"
  - id: "REQ-SP800-137-0073"
    citation: {"ref": "SP800-137", "page": 22, "anchor": "Security Control Assessor. The security control assessor provides input into the types"}
    kind: "indicative"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Security Control Assessor. The security control assessor provides input into the types of security-related information gathered as part of ISCM and assesses information system or program management security controls for the organization’s ISCM program. The security control assessor develops a security assessment plan for each security control; submits the security assessment plan for approval prior to conducting assessments; conducts assessments of security controls as defined in the security assessment plan; updates the security assessment report as changes occur during ISCM; and updates/revises the security assessment plan as needed."
    status: "candidate"
    work_item: "WI-07"
  - id: "REQ-SP800-137-0074"
    citation: {"ref": "SP800-137", "page": 22, "anchor": "Organizations may define other roles (e.g., information system administrator, ISCM program manager)"}
    kind: "should"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Organizations may define other roles (e.g., information system administrator, ISCM program manager) as needed to support the ISCM process."
    status: "not-a-requirement"
    reason: "Advisory permission: 'Organizations may define other roles'. Not a minimum set."
  - id: "REQ-SP800-137-0075"
    citation: {"ref": "SP800-137", "page": 22, "anchor": "Organizations may have multiple common control providers."}
    kind: "should"
    locator: "2.4"
    context: "ISCM ROLES AND RESPONSIBILITIES"
    statement: "Organizations may have multiple common control providers."
    status: "not-a-requirement"
    reason: "Footnote 23, a remark: 'Organizations may have multiple common control providers'; states a possibility."
  - id: "REQ-SP800-137-0076"
