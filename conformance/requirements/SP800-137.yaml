  - id: "REQ-SP800-137-0014"
    citation: {"ref": "SP800-137", "page": 10, "anchor": "The tiered approach herein mirrors that described in NIST SP 800-37 and"}
    kind: "modal"
    locator: "1.2"
    context: "RELATIONSHIP TO OTHER SPECIAL PUBLICATIONS"
    statement: "The tiered approach herein mirrors that described in NIST SP 800-37 and NIST SP 800-39 where Tier 1 is organization, Tier 2 is mission/business processes, and Tier 3 is information systems. In NIST SP 800-39, these tiers are used to address risk management from varying organizational perspectives. In this document, the tiers are used to address perspectives for ISCM for each tier. Organization-wide, tier-specific ISCM policies, procedures, and responsibilities are included for the organization, mission/business processes, and information systems tiers. Automation is leveraged where possible, and manual (e.g., procedural) monitoring methodologies are implemented where automation is not practical or possible."
    status: "not-a-requirement"
    reason: "Describes the document: the tiered approach 'mirrors' SP 800-37 and 'policies, procedures, and responsibilities are included for' each tier, meaning included in this text, so responsibilities here assign nothing. The automation clause is live at REQ-SP800-137-0170."
  - id: "REQ-SP800-137-0015"
    citation: {"ref": "SP800-137", "page": 10, "anchor": "The ISCM program will evolve over time as the program matures in"}
    kind: "modal"
    locator: "1.2"
    context: "RELATIONSHIP TO OTHER SPECIAL PUBLICATIONS"
    statement: "The ISCM program will evolve over time as the program matures in general, additional tools and resources become available, measurement and automation capabilities mature, and changes are implemented to ensure continuous improvement in the organizational security posture and in the organization’s security program. The monitoring strategy is regularly reviewed for relevance and accuracy in reflecting organizational risk tolerances, correctness of measurements, applicability of metrics, and effectiveness in supporting risk management decisions."
    status: "candidate"
    work_item: "WI-159"
  - id: "REQ-SP800-137-0016"
