  - id: "REQ-SP800-137-0125"
    citation: {"ref": "SP800-137", "page": 29, "anchor": "Organizations may find that collecting data from every object of every system"}
    kind: "should"
    locator: "3.1.4"
    context: "DEFINE SAMPLE POPULATIONS"
    statement: "Organizations may find that collecting data from every object of every system within an organization may be impractical or cost-prohibitive. Sampling is a methodology employable with both manual and automated monitoring that may make ISCM more cost-effective. A risk with sampling is that the sample population may fail to capture the variations in assessment outcomes that would be obtained from an assessment of the full population. This could result in an inaccurate view of security control effectiveness and organizational security status."
    status: "not-a-requirement"
    reason: "Background on sampling: 'Organizations may find that collecting data ... may be impractical', 'A risk with sampling is'; explains the topic of 3.1.4."
