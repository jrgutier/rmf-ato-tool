  - id: "REQ-SP800-137-0034"
    citation: {"ref": "SP800-137", "page": 12, "anchor": "ISCM strategies evolve in accordance with drivers for risk-based decision making and"}
    kind: "modal"
    locator: "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT"
    context: "The process of implementing ISCM as described in Chapter Three is:"
    statement: "ISCM strategies evolve in accordance with drivers for risk-based decision making and requirements for information. These requirements may come from any tier in the organization. Organizations implement ISCM based on requirements of those accountable and responsible for maintaining ongoing control of organizational security posture to within organizational risk tolerances. The implementation is standardized across the organization to the greatest extent possible so as to minimize use of resources (e.g., funding for purchase of tools/applications, data calls, organization-wide policies/procedures/templates, etc.) and to maximize leveragability of security-related information. Upon analysis, the resulting information informs the discrete processes used to manage the organization’s security posture and overall risk. ISCM helps to provide situational awareness of the security status of the organization’s systems based on information collected from resources (e.g., people, processes, technology, environment) and the capabilities in place to react as the situation changes."
    status: "candidate"
  - id: "REQ-SP800-137-0035"
    citation: {"ref": "SP800-137", "page": 12, "anchor": "Organizations implement processes to manage organizational security and metrics that provide insight"}
    kind: "modal"
    locator: "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT"
    context: ""
    statement: "Organizations implement processes to manage organizational security and metrics that provide insight into those processes and hence into organizational security status. Some of those security processes will align with individual security controls, and others will align with components or combinations of controls. Discussions of metrics can be found in Section 3.2.1 and in NIST SP 800-55, Performance Measurement Guide for Information Security, as amended."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137-0036"
    citation: {"ref": "SP800-137", "page": 13, "anchor": "Organizations increase situational awareness through enhanced monitoring capabilities and subsequently increase insight"}
    kind: "indicative"
    locator: "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT"
    context: ""
    statement: "Organizations increase situational awareness through enhanced monitoring capabilities and subsequently increase insight into and control of the processes used to manage organizational security. Increased insight into and control of security processes in turn enhances situational awareness. Therefore, the process of implementing ISCM is recursive. ISCM informs and is informed by distinct organizational security processes and associated requirements for input and output of security-related information. Consider the following example:"
    status: "not-a-requirement"
    reason: "Description of a feedback loop: 'Organizations increase situational awareness' and hence 'the process of implementing ISCM is recursive', ending in 'Consider the following example:'; the requirements for input and output are mentioned, not set."
  - id: "REQ-SP800-137-0037"
    citation: {"ref": "SP800-137", "page": 13, "anchor": "Security-related information pertaining to a system component inventory is used to determine"}
    kind: "indicative"
    locator: "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT"
    context: "Consider the following example:"
    statement: "Security-related information pertaining to a system component inventory is used to determine compliance with CM-8 Information System Component Inventory."
    status: "not-a-requirement"
    reason: "First sentence of the page's boxed example: inventory information 'is used to determine compliance with CM-8'; an illustration."
  - id: "REQ-SP800-137-0038"
    citation: {"ref": "SP800-137", "page": 13, "anchor": "The information is assessed to determine whether or not the control is"}
    kind: "indicative"
    locator: "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT"
    context: ""
    statement: "The information is assessed to determine whether or not the control is effective, (i.e., if the inventory is accurate). If found to be inaccurate, an analysis to determine the root cause of the inaccuracy is initiated (e.g., perhaps a process for connecting components to the network has been ignored or is out of date, asset management tools are not operating as expected, or the organization is under attack). Based on the analysis, responses are initiated as appropriate (e.g., responsible parties update inventory, update relevant organizational processes, train employees, disconnect errant devices, etc.). Additionally, security-related information pertaining to a system component inventory may be used to support predefined metrics. More accurate system component inventories support improved effectiveness of other security domains such as patch management and vulnerability management."
    status: "not-a-requirement"
    reason: "Rest of the same example: 'responsible parties update inventory' and the root-cause analysis are what might happen after an inaccurate inventory; 'e.g.' shows no one is made responsible."
  - id: "REQ-SP800-137-0039"
    citation: {"ref": "SP800-137", "page": 13, "anchor": "This example illustrates how data collected in assessing a security control is"}
    kind: "indicative"
    locator: "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT"
    context: ""
    statement: "This example illustrates how data collected in assessing a security control is leveraged to calculate a metric and provide input into various organizational processes. It further illustrates that a problem, once detected, can trigger an assessment of one or more controls across an organization, updates to relevant security-related information, modifications to the organizational security program plan and security processes, and improved compliance to the security program and applicable system security plan. The end result is improved organization-wide risk management and continual improvement limited only by the speed with which the organization can collect information and respond to findings."
    status: "not-a-requirement"
    reason: "'This example illustrates' what the inventory example shows; commentary on the example."
  - id: "REQ-SP800-137-0040"
    citation: {"ref": "SP800-137", "page": 13, "anchor": "Maintaining an up-to-date view of information security risks across an organization is"}
    kind: "modal"
    locator: "2.1"
    context: "ORGANIZATION-WIDE VIEW OF ISCM"
    statement: "Maintaining an up-to-date view of information security risks across an organization is a complex, multifaceted undertaking. It requires the involvement of the entire organization, from senior leaders providing governance and strategic vision to individuals developing, implementing, and operating individual information systems in support of the organization’s core missions and business functions. Figure 2-1 illustrates a tiered approach to organization-wide ISCM in support of risk management. Tier 1 governance, risk management goals, and organizational risk tolerance drive the ISCM strategy. Organizational risk tolerance established by senior executives/leaders as part of the risk executive (function)11 influences ISCM policy, procedures, and implementation activities across all tiers. Data collection primarily occurs at the information systems tier. Metrics are designed to present information in a context that is meaningful for each tier. For example, ISCM data collected at Tier 3 may be aggregated to provide security status or risk scores for a single system, for a collection of systems, across a core business process, or for the entire organization. Policies, procedures, and tools may be established at any tier; however, when established at Tiers 1 or 2, they facilitate the consistent implementation of ISCM across the organization and better support data reuse and judicious use of resources. Data collection, analysis, and reporting are automated where possible.12 Through the use of automation, it is possible to monitor a greater number of security metrics with fewer resources, higher frequencies, larger sample sizes,13 and with greater consistency and reliability than is feasible using manual processes. Organizations regularly review the ISCM strategy to ensure that metrics continue to be relevant, meaningful, actionable, and supportive of risk management decisions made by organizational officials at all tiers."
    status: "candidate"
    work_item: "WI-159"
  - id: "REQ-SP800-137-0041"
    citation: {"ref": "SP800-137", "page": 13, "anchor": "See Section 2.4 for a discussion of roles and responsibilities of the"}
    kind: "modal"
    locator: "2.1"
    context: "ORGANIZATION-WIDE VIEW OF ISCM"
    statement: "See Section 2.4 for a discussion of roles and responsibilities of the risk executive (function)."
    status: "not-a-requirement"
    reason: "Footnote 11, a cross-reference: 'See Section 2.4 for a discussion of roles and responsibilities of the risk executive (function)'."
  - id: "REQ-SP800-137-0042"
    citation: {"ref": "SP800-137", "page": 14, "anchor": "Care must be taken in determining how best to use security-related information"}
    kind: "modal"
    locator: "2.1"
    context: "ORGANIZATION-WIDE VIEW OF ISCM"
    statement: "Care must be taken in determining how best to use security-related information from individual information systems in calculating organizational metrics for security and risk. Dashboards and metrics, designed to provide organizational situational awareness of security and risk, can provide a false sense of security if used without continued assurance of the relevance of the metrics."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137-0043"
    citation: {"ref": "SP800-137", "page": 14, "anchor": "If an organization does not have the resources or infrastructure necessary to"}
    kind: "indicative"
    locator: "2.1"
    context: "ORGANIZATION-WIDE VIEW OF ISCM"
    statement: "If an organization does not have the resources or infrastructure necessary to assess every relevant object within its information infrastructure, sampling is an approach that may be useful in reducing the level of effort associated with continuous monitoring. Additional information is provided in Section 3.1.4."
    status: "not-a-requirement"
    reason: "Advisory, footnote 13: sampling 'is an approach that may be useful'; an option and a cross-reference, not a minimum. The sampling duty is at REQ-SP800-137-0126."
  - id: "REQ-SP800-137-0044"
    citation: {"ref": "SP800-137", "page": 15, "anchor": "Tier 1 risk management activities address high-level information security governance policy as"}
    kind: "modal"
    locator: "2.1.1"
    context: "TIER 1- ORGANIZATION"
    statement: "Tier 1 risk management activities address high-level information security governance policy as it relates to risk to the organization as a whole, to its core missions, and to its business functions. At this tier, the criteria for ISCM are defined by the organization’s risk management strategy, including how the organization plans to assess, respond to, and monitor risk, and the oversight required to ensure that the risk management strategy is effective. Security controls, security status, and other metrics defined and monitored by officials at this tier are designed to deliver information necessary to make risk management decisions in support of governance. Tier 1 metrics are developed for supporting governance decisions regarding the organization, its core missions, and its business functions. Tier 1 metrics may be calculated based on security-related information from common, hybrid, and system-specific security controls. The metrics and the frequency with which they are monitored15"
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137-0045"
    citation: {"ref": "SP800-137", "page": 16, "anchor": "and reported are determined by requirements to maintain operations within organizational risk"}
    kind: "indicative"
    locator: "2.1.1"
    context: "TIER 1- ORGANIZATION"
    statement: "and reported are determined by requirements to maintain operations within organizational risk tolerances. As part of the overall governance structure established by the organization, the Tier 1 risk management strategy and the associated monitoring requirements are communicated throughout Tiers 2 and 3."
    status: "candidate"
    work_item: "WI-256"
  - id: "REQ-SP800-137-0046"
    citation: {"ref": "SP800-137", "page": 16, "anchor": "Organizational officials that are accountable for one or more missions or business"}
    kind: "modal"
    locator: "2.1.2"
    context: "TIER 2 - MISSION/BUSINESS PROCESSES"
    statement: "Organizational officials that are accountable for one or more missions or business processes are also responsible for overseeing the associated risk management activities for those processes. The Tier 2 criteria for continuous monitoring of information security are defined by how core mission/business processes are prioritized with respect to the overall goals and objectives of the organization, the types of information needed to successfully execute the stated mission/business processes, and the organization-wide information security program strategy. Controls in the Program Management (PM) family are an example of Tier 2 security controls. These controls address the establishment and management of the organization’s information security program. Tier 2 controls are deployed organization-wide and support all information systems. They may be tracked at Tier 2 or Tier 1. The frequencies with which Tier 2 security controls are assessed and security status and other metrics are monitored are determined in part by the objectives and priorities of the mission or business process and measurement capabilities inherent in the infrastructure.16"
    status: "candidate"
    work_item: "WI-168"
  - id: "REQ-SP800-137-0047"
    citation: {"ref": "SP800-137", "page": 16, "anchor": "ISCM activities at Tier 3 address risk management from an information system"}
    kind: "indicative"
    locator: "2.1.3"
    context: "TIER 3 - INFORMATION SYSTEMS"
    statement: "ISCM activities at Tier 3 address risk management from an information system perspective. These activities include ensuring that all system-level security controls (technical, operational, and management controls) are implemented correctly, operate as intended, produce the desired outcome with respect to meeting the security requirements for the system, and continue to be effective over time. ISCM activities at Tier 3 also include assessing and monitoring hybrid and common controls implemented at the system level. Security status reporting at this tier often includes but is not limited to security alerts, security incidents, and identified threat activities.17 The ISCM strategy for Tier 3 also ensures that security-related information supports the monitoring requirements of other organizational tiers. Data feeds/assessment results from system-level controls (system-specific, hybrid, or common), along with associated security status reporting, support risk-based decisions at the organization and mission/business processes tiers. Information is tailored for each tier and delivered in ways that inform risk-based decision making at all tiers. Those resulting decisions impact the ISCM strategy applied at the information systems tier.18"
    status: "candidate"
  - id: "REQ-SP800-137-0048"
    citation: {"ref": "SP800-137", "page": 16, "anchor": "ISCM metrics originating at the information systems tier can be used to"}
    kind: "should"
    locator: "2.1.3"
    context: "TIER 3 - INFORMATION SYSTEMS"
    statement: "ISCM metrics originating at the information systems tier can be used to assess, respond, and monitor risk across the organization. The ongoing monitoring activities implemented at the information systems tier provide security-related information to authorizing officials (AOs) in support of ongoing system authorization decisions and to the risk executive (function) in support of ongoing organizational risk management."
    status: "candidate"
  - id: "REQ-SP800-137-0049"
    citation: {"ref": "SP800-137", "page": 17, "anchor": "At Tier 3, RMF Step 6 Monitor activities and ISCM activities are"}
    kind: "indicative"
    locator: "2.1.3"
    context: "TIER 3 - INFORMATION SYSTEMS"
    statement: "At Tier 3, RMF Step 6 Monitor activities and ISCM activities are closely aligned. The assessment methods relevant for implemented security controls are the same whether the assessments are being done solely in support of system authorization or in support of a broader, more comprehensive continuous monitoring effort. Information systems tier officials and staff conduct assessments and monitoring, and analyze results on an ongoing basis. The information is leveraged at the organization, mission/business processes, and information systems tiers to support risk management. Though frequency requirements differ, each tier receives the benefit of security-related information that is current and applicable to affected processes. RMF Step 6 activities performed within the context of an ISCM program support information system risk determination and acceptance, i.e., authorization (RMF Step 5) on an ongoing basis."
    status: "candidate"
  - id: "REQ-SP800-137-0050"
    citation: {"ref": "SP800-137", "page": 17, "anchor": "Initial authorization to operate is based on evidence available at one point"}
    kind: "indicative"
    locator: "2.2"
    context: "ONGOING SYSTEM AUTHORIZATIONS"
    statement: "Initial authorization to operate is based on evidence available at one point in time, but systems and environments of operation change. Ongoing assessment of security control effectiveness supports a system’s security authorization over time in highly dynamic environments of operation with changing threats, vulnerabilities, technologies, and missions/business processes. Through ISCM, new threat or vulnerability information is evaluated as it becomes available, permitting organizations to make adjustments to security requirements or individual controls as needed to maintain authorization decisions. The process for obtaining system authorization, and more generally, for managing information security and information system-related risk, is the RMF.19 The RMF, illustrated in Figure 2-2, provides a disciplined and structured process that integrates information system security and risk management activities into the SDLC. The monitoring step (Step 6) of the RMF includes interactions between the three tiers as illustrated in the organizational view of ISCM in Figure 2-1. Interaction between the tiers includes data from system owners, common control providers, and authorizing officials on security control assessments and ongoing authorization of system and common controls provided to the risk executive (function).20"
    status: "candidate"
    work_item: "WI-284"
  - id: "REQ-SP800-137-0051"
    citation: {"ref": "SP800-137", "page": 17, "anchor": "There is also dissemination of updated risk-related information such as vulnerability and"}
    kind: "indicative"
    locator: "2.2"
    context: "ONGOING SYSTEM AUTHORIZATIONS"
    statement: "There is also dissemination of updated risk-related information such as vulnerability and threat data and organizational risk tolerance from Tiers 1 and 2 to authorizing officials and information system owners. When the RMF is applied within an organization that has also implemented a robust ISCM strategy, organizational officials are provided with a view of the organizational security posture and each system’s contribution to said posture on demand."
    status: "candidate"
    work_item: "WI-161"
  - id: "REQ-SP800-137-0052"
    citation: {"ref": "SP800-137", "page": 17, "anchor": "System authorization to operate may be partially dependent on assessment/monitoring and ongoing"}
    kind: "should"
    locator: "2.2"
    context: "ONGOING SYSTEM AUTHORIZATIONS"
    statement: "System authorization to operate may be partially dependent on assessment/monitoring and ongoing security authorization of common controls. NIST SP 800-37, as amended, provides information on security authorization of common controls."
    status: "not-a-requirement"
    reason: "Footnote 19 says authorization 'may be partially dependent on' common controls and points to SP 800-37; a description of a dependency with no act."
  - id: "REQ-SP800-137-0053"
    citation: {"ref": "SP800-137", "page": 18, "anchor": "ISCM in support of ongoing assessment and authorization has the potential to"}
    kind: "should"
    locator: "2.2"
    context: "Figure 2-2. Risk Management Framework"
    statement: "ISCM in support of ongoing assessment and authorization has the potential to be resource-intensive and time-consuming. It is impractical to collect security-related information and assess every aspect of every security control deployed across an organization at all times. A more practical approach is to establish reasonable assessment frequencies for collecting security-related information. The frequency of assessments should be sufficient to assure adequate security commensurate with risk, as determined by system categorization and ISCM strategy requirements. Sampling of information system security objects, rather than 100 percent inspection, can also be an efficient and effective means of monitoring, particularly in cases where monitoring is not automated. Important considerations in determining sample sizes and monitoring frequencies are discussed in Chapter Three."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0054"
    citation: {"ref": "SP800-137", "page": 19, "anchor": "Monitoring frequencies (e.g., annually, quarterly, monthly, daily) are not static, and they"}
    kind: "indicative"
    locator: "2.2"
    context: "Figure 2-2. Risk Management Framework"
    statement: "Monitoring frequencies (e.g., annually, quarterly, monthly, daily) are not static, and they are not uniform across all metrics. Security control assessment and monitoring frequencies, for example, are adjusted to support changes in organizational information systems or their environments of operation, including emerging information on security threats and vulnerabilities. The priorities for ISCM vary and are adjusted in response to security incidents, to identify problems with security control implementations, or to evaluate changes to systems and system components that are determined to have a significant impact on security. An ISCM strategy can deliver dynamic updates of security-related data to support system authorizations conducted at any interval. Section 3.2.2 includes a more complete discussion of factors to consider when determining monitoring frequencies."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0055"
    citation: {"ref": "SP800-137", "page": 19, "anchor": "When possible, organizations look for automated solutions to lower costs, enhance efficiency,"}
    kind: "modal"
    locator: "2.3"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "When possible, organizations look for automated solutions to lower costs, enhance efficiency, and improve the reliability of monitoring security-related information. Security is implemented through a combination of people, processes, and technology. The automation of information security deals primarily with automating aspects of security that require little human interaction. Automated tools are often able to recognize patterns and relationships that may escape the notice of human analysts, especially when the analysis is performed on large volumes of data. This includes items such as verifying technical settings on individual network endpoints or ensuring that the software on a machine is up to date with organizational policy. Automation serves to augment the security processes conducted by security professionals within an organization and may reduce the amount of time a security professional must spend on doing redundant tasks, thereby increasing the amount of time the trained professional may spend on tasks requiring human cognition."
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0056"
    citation: {"ref": "SP800-137", "page": 19, "anchor": "The ISCM strategy does not focus solely on the security-related information that"}
    kind: "modal"
    locator: "2.3"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "The ISCM strategy does not focus solely on the security-related information that is easy for an organization to collect or easy to automate. When an ISCM program is first implemented, there will likely be several aspects of the organization’s security program that are manually monitored. Organizations’ monitoring capabilities will expand and mature over time. Metrics will evolve with lessons learned and with increased insight into organizational security status and risk tolerance. The focus of an ISCM strategy is to provide adequate information about security control effectiveness and organizational security status allowing organizational officials to make informed, timely security risk management decisions. Thus, implementation, effectiveness, and adequacy of all security controls are monitored along with organizational security status."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0057"
    citation: {"ref": "SP800-137", "page": 19, "anchor": "When determining the extent to which the organization automates ISCM, organizations consider"}
    kind: "indicative"
    locator: "2.3"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "When determining the extent to which the organization automates ISCM, organizations consider potential efficiencies of process standardization that may be gained with automation, and the potential value (or lack of value) of the automated security-related information from a risk management perspective. Additionally, organizations consider intangibles such as the potential value of personnel reassignment and more comprehensive situational awareness."
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0058"
    citation: {"ref": "SP800-137", "page": 20, "anchor": "While automation of IT security has the potential to significantly reduce the"}
    kind: "modal"
    locator: "2.3"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "While automation of IT security has the potential to significantly reduce the amount of time a human must spend doing certain tasks, it is not possible to fully automate all of an organization's information security program functions. The technologies discussed in Appendix D, for example, still require human analysis for implementation and maintenance of the tools as well as appropriate interpretation of findings. Similarly, these tools operate within the context of processes designed, run, and maintained by humans. If individuals carry out their responsibilities insecurely, then the effectiveness of the technologies is compromised, and the security of the systems and the mission/business or organizational processes supported by those systems is put in jeopardy."
    status: "not-a-requirement"
    reason: "Limits of automation: tools 'still require human analysis' and a human 'must spend' less time; a remark on technology, so neither require nor must binds anyone. 'individuals carry out their responsibilities insecurely' is a warning."
  - id: "REQ-SP800-137-0059"
    citation: {"ref": "SP800-137", "page": 20, "anchor": "Pull information from a variety of sources (i.e., assessment objects22"}
    kind: "lettered"
    locator: "2.3.•"
    context: "ROLE OF AUTOMATION IN ISCM Consideration is given to ISCM tools that:"
    statement: "• Pull information from a variety of sources (i.e., assessment objects22"
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0060"
    citation: {"ref": "SP800-137", "page": 20, "anchor": "Use open specifications such as the Security Content Automation Protocol (SCAP);"}
    kind: "lettered"
    locator: "2.3.•"
