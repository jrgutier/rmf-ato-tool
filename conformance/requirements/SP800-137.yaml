  - {"page": 18, "locator": "2.2", "reason": "no-marker", "text": "AUTHORIZE Information S ys tem"}
  - {"page": 18, "locator": "2.2", "reason": "no-marker", "text": "IMPLEMENT Security Controls Step 4"}
  - {"page": 18, "locator": "2.2", "reason": "short", "text": "ASSESS Security Controls"}
  - {"page": 18, "locator": "2.2", "reason": "no-marker", "text": "The output of a strategically designed and well-managed organization-wide ISCM program can be used to maintain a system’s authorization to operate and keep required system information and data (i.e., System Security Plan together with Risk Assessment Report, Security Assessment Report, and POA&M) up to date on an ongoing basis. Security management and reporting tools may provide functionality to automate updates to key evidence needed for ongoing authorization decisions. ISCM also facilitates risk-based decision making regarding the ongoing authorization to operate information systems and security authorization for common controls by providing evolving threat activity or vulnerability information on demand. A security control assessment and risk determination process, otherwise static between authorizations, is thus transformed into a dynamic process that supports timely risk response actions and cost-effective, ongoing authorizations. Continuous monitoring of threats, vulnerabilities, and security control effectiveness provides situational awareness for risk-based support of ongoing authorization decisions. An appropriately designed ISCM strategy and program supports ongoing authorization of type authorizations, as well as single, joint, and leveraged authorizations.21"}
  - {"page": 18, "locator": "2.2", "reason": "no-marker", "text": "See NIST SP 800-37, as amended, for a discussion of authorization types."}
  - {"page": 20, "locator": "2.3", "reason": "no-marker", "text": "Automation makes security-related information readily available in an environment where ongoing monitoring needs change. Therefore, during security control implementation (RMF Step 3), consideration is given to the capabilities inherent in available technology to support ISCM as part of the criteria in determining how best to implement a given control."}
  - {"page": 20, "locator": "2.3", "reason": "lead-in", "text": "Consideration is given to ISCM tools that:"}
  - {"page": 20, "locator": "2.3", "reason": "short", "text": ");"}
  - {"page": 20, "locator": "2.3", "reason": "no-marker", "text": "Automation supports collecting more data more frequently and from a larger and more diverse pool of technologies, people, processes, and environments. It can therefore make comprehensive, ongoing control of information security practical and affordable. How effective the organization is in utilizing the monitoring results (obtained in a manual or automated fashion) still depends upon the organizational ISCM strategy, including validity and comprehensiveness of the metrics, as well as the processes in place to analyze monitoring results and respond to findings. Technologies for enabling automation of some ISCM tasks are discussed in greater detail in Appendix D."}
  - {"page": 20, "locator": "2.4", "reason": "no-marker", "text": "See NIST SP 800-53A, as amended, for information on assessment objects."}
  - {"page": 22, "locator": "2.4", "reason": "short", "text": "Common Control Provider.23"}
  - {"page": 23, "locator": "Defining an ISCM Strategy and Implementing an ISCM Program", "reason": "short", "text": "T"}
  - {"page": 23, "locator": "Defining an ISCM Strategy and Implementing an ISCM Program", "reason": "no-marker", "text": "his chapter describes the process for developing an ISCM strategy and implementing an ISCM program including activities at the organization, mission/business process, and information systems tiers. A well-designed ISCM strategy encompasses security control assessment, security status monitoring, and security status reporting in support of timely risk-based decision making throughout the organization. It also incorporates processes to assure that response actions are taken. An organization’s strategy for action based on the data collected is as important (if not more important) than collecting the data. The process for developing an ISCM strategy and implementing an ISCM program is as follows:"}
  - {"page": 23, "locator": "Defining an ISCM Strategy and Implementing an ISCM Program", "reason": "no-marker", "text": "This process is depicted below in Figure 3- 1."}
  - {"page": 24, "locator": "Defining an ISCM Strategy and Implementing an ISCM Program", "reason": "short", "text": "Continuous Monitoring"}
  - {"page": 24, "locator": "Defining an ISCM Strategy and Implementing an ISCM Program", "reason": "no-marker", "text": "▪Maps to risk tolerance ▪Adapts to ongoing needs ▪Actively involves management"}
  - {"page": 24, "locator": "Defining an ISCM Strategy and Implementing an ISCM Program", "reason": "no-marker", "text": "Risk tolerance, enterprise architecture, security architecture, security configurations, plans for changes to the enterprise architecture, and available threat information provide data that is fundamental to the execution of these steps and to ongoing management of information security-related risks. Security-related information is analyzed for its relevance to organizational risk management at all three tiers."}
  - {"page": 25, "locator": "3.1.1", "reason": "lead-in", "text": "When developed at Tiers 1 and/or 2, the following policies, procedures, and templates facilitate organization-wide, standardized processes in support of the ISCM strategy:"}
  - {"page": 25, "locator": "3.1.1", "reason": "no-marker", "text": "See NIST SP 800-128, as amended, for more information on security-focused configuration management."}
  - {"page": 26, "locator": "3.1.1", "reason": "no-marker", "text": "Supporting Roles: Information System Owner/Common Control Provider"}
  - {"page": 26, "locator": "3.1.1", "reason": "no-marker", "text": "Expected Input: Organizational risk assessment and current risk tolerance, current threat information, organizational expectations and priorities, available tools from OMB lines of business and/or third-party vendors"}
  - {"page": 27, "locator": "3.1.2", "reason": "no-marker", "text": "Supporting Roles: Senior Information Security Officer, Authorizing Official, Security Control Assessor"}
  - {"page": 27, "locator": "3.1.2", "reason": "no-marker", "text": "Expected Input: Organizational risk tolerance information, organizational ISCM strategy, policy, procedures, templates, system-specific threat information, and system information (e.g., System Security Plan, Security Assessment Report, Plan of Action and Milestones, Security Assessment Plan, System Risk Assessment, etc.28"}
  - {"page": 27, "locator": "3.1.2", "reason": "short", "text": ")"}
  - {"page": 27, "locator": "3.1.3", "reason": "no-marker", "text": "This system information is an outcome of the RMF. Electronic standardized templates and document management systems readily support frequent updates with data generated by continuous monitoring programs."}
  - {"page": 29, "locator": "3.1.3", "reason": "short", "text": "Monitor]."}
  - {"page": 29, "locator": "3.1.4", "reason": "no-marker", "text": "NIST SP 800-53A, as amended, describes how to achieve satisfactory coverage when determining sample populations for the three named assessment methods: examine, interview, and test. The guidelines in NIST SP 800-53A for basic, focused, and comprehensive testing30 addresses the need for a “representative sample of assessment objects” or a “sufficiently large sample of assessment objects.” Statistical tools can be used to help quantify sample size."}
  - {"page": 29, "locator": "3.1.4", "reason": "no-marker", "text": "NIST 800-53A provides guidelines to help address the general issue of sampling and particularly that of coverage. In selecting a sample population, the coverage attribute is satisfied through consideration of three criteria:"}
  - {"page": 29, "locator": "3.1.4", "reason": "no-marker", "text": "See NIST SP 800-53A, as amended, Appendix D."}
  - {"page": 30, "locator": "3.1.4", "reason": "no-marker", "text": "Sample measurements are summarized into a statistic (e.g., sample mean) and the observed value compared with the allowable value as represented by organizational risk tolerance. Statistics calculated using sampling can become less reliable predictors of the full population if the population is not randomly selected and if the sample size (i.e., objects to be tested) is small.31 As described in the NIST Engineering Statistics Handbook, when deciding how many objects to include in sample populations, the following are considered:32"}
  - {"page": 30, "locator": "3.1.4", "reason": "no-marker", "text": "Supporting Roles: Risk Executive (Function), Authorizing Official, Chief Information Officer, Senior Information Security Officer"}
  - {"page": 30, "locator": "3.1.4", "reason": "no-marker", "text": "Expected Input: Organizational- and system-level policy and procedures on ISCM strategy, metrics, and the Security Assessment Plan updated with assessment and monitoring frequencies"}
  - {"page": 30, "locator": "3.1.4", "reason": "no-marker", "text": "The Central Limit Theorem is a key theorem that allows one to assume that a statistic (e.g., mean) calculated from a random sample has a normal distribution (i.e., bell curve) regardless of the underlying distribution from which individual samples are being taken. For small sample sizes (roughly less than 30), the normal distribution assumption tends to be good only if the underlying distribution from which random samples are being taken is close to normal."}
  - {"page": 30, "locator": "3.1.4", "reason": "no-marker", "text": "For detailed information on selecting sample sizes, see http://www.itl.nist.gov/div898/handbook/ppc/section3/ppc333.htm."}
  - {"page": 32, "locator": "3.2.1", "reason": "no-marker", "text": "Supporting Roles: Authorizing Officials, Information System Owner/Common Control Provider"}
  - {"page": 32, "locator": "3.2.1", "reason": "no-marker", "text": "Expected Input: Organizational risk assessment, organizational risk tolerance, current threat information, reporting requirements, current vulnerability information"}
  - {"page": 32, "locator": "3.2.2", "reason": "no-marker", "text": "Considerations in Determining Assessment and Monitoring Frequencies."}
  - {"page": 33, "locator": "3.2.2", "reason": "short", "text": "35"}
  - {"page": 33, "locator": "3.2.2", "reason": "short", "text": "37"}
  - {"page": 33, "locator": "3.2.2.•", "reason": "label-only", "text": "• Vulnerability information."}
