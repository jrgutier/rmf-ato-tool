    reason: "Label and cross-reference: 'Review and adjustment of the monitoring strategy is covered in detail in Section 3.6'. The review duty is REQ-SP800-137-0185."
  - id: "REQ-SP800-137-0157"
    citation: {"ref": "SP800-137", "page": 34, "anchor": "Reporting requirements. Reporting requirements do not drive the ISCM strategy but may"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "• Reporting requirements. Reporting requirements do not drive the ISCM strategy but may play a role in the frequency of monitoring. For instance, if OMB policy requires quarterly reports on the number of unauthorized components detected and corrective actions taken, the organization would monitor the system for unauthorized components at least quarterly."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0158"
    citation: {"ref": "SP800-137", "page": 34, "anchor": "Organizations focus on obtaining the data required at the determined frequencies and"}
    kind: "indicative"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Organizations focus on obtaining the data required at the determined frequencies and deploy their human and capitol resources accordingly. As automation capability or resources are added, organizations may consider increasing affected monitoring frequencies. Similarly, if resource availability decreases, the organization considers adjusting affected monitoring frequencies to ensure that security-related information is appropriately analyzed while continuing to meet organizational risk management requirements."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0159"
    citation: {"ref": "SP800-137", "page": 34, "anchor": "Many security controls in the NIST SP 800-53 catalog have multiple implementation"}
    kind: "modal"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Many security controls in the NIST SP 800-53 catalog have multiple implementation requirements along with control enhancements that may also have multiple implementation requirements. It may be necessary to assess or monitor individual control requirements and/or control enhancements within a given control with differing frequencies. For instance, the control AC-2, Account Management, has ten separate requirements (a. through j.) within the base control and four control enhancements [(1) through (4)]. The monitoring frequency may vary for each requirement in accordance with the considerations discussed. For example, AC-2a involves the identification of account types. For a typical information system, once the account types have been identified and documented, they are not likely to change very often. For this reason, AC-2a is a candidate for relatively infrequent assessment. AC-2h involves the deactivation of temporary accounts and accounts of terminated or transferred users. Since personnel regularly come and go, a typical organization would most likely assess AC-2h on a more frequent basis than AC-2a. AC- 2 (3) requires that the system automatically disable accounts after a specified time period of inactivity. As an automated control and one with typically high volatility, AC-2 (3) is a candidate for relatively frequent monitoring and also may serve to automate some of the base control requirements so that they can be monitored more frequently in accordance with the organizational ISCM strategy."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0160"
    citation: {"ref": "SP800-137", "page": 35, "anchor": "At the mission/business processes tier, the organization establishes the minimum frequency with"}
    kind: "modal"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "At the mission/business processes tier, the organization establishes the minimum frequency with which each security control or metric is to be assessed or monitored. Frequencies are established across all organizational systems and common controls based on the criteria described above in this section. Common, hybrid, and system-specific security controls are addressed by organization and mission/business processes tier policy and procedures. Common controls are often inherited by a large number of organizational systems. The aggregate criticality of such controls may require more frequent assessments than would similar controls responsible for protecting a single system. Additionally, determining the frequency for assessing common controls includes the organization’s determination of the trustworthiness of the common control provider. Common controls that are process-related (e.g., procedures/templates, PM controls) do not tend to be volatile and typically do not lend themselves well to automation. Still, the organization considers the volatility of such controls as well as related threat information when establishing assessment frequencies."
    status: "candidate"
    work_item: "WI-164"
  - id: "REQ-SP800-137-0161"
    citation: {"ref": "SP800-137", "page": 35, "anchor": "Expected Output: Organization-wide policies and procedures, recommended frequencies with which each security"}
    kind: "indicative"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Expected Output: Organization-wide policies and procedures, recommended frequencies with which each security control and metric is assessed or monitored"
    status: "candidate"
    work_item: "WI-164"
  - id: "REQ-SP800-137-0162"
    citation: {"ref": "SP800-137", "page": 35, "anchor": "At the information systems tier, system owners review the minimum monitoring/assessment frequencies"}
    kind: "modal"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "At the information systems tier, system owners review the minimum monitoring/assessment frequencies established by organization and/or mission/business processes tier policy and determine if the minimum frequencies are adequate for a given information system. For some information systems, it may be necessary to assess specific controls or metrics with greater frequency than prescribed by the organization, again based on the criteria described above in this section. System owners also consider identification of specific system components that may require more frequent monitoring than other system components (e.g., public-facing servers, boundary protection devices, components deemed critical in the Business Impact Analysis)."
    status: "candidate"
    work_item: "WI-164"
  - id: "REQ-SP800-137-0163"
    citation: {"ref": "SP800-137", "page": 35, "anchor": "Expected Output: Security assessment plans updated to reflect the frequency with which"}
    kind: "indicative"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Expected Output: Security assessment plans updated to reflect the frequency with which each system-specific security control is assessed and metrics are monitored Event-Driven Assessments."
    status: "candidate"
    work_item: "WI-164"
  - id: "REQ-SP800-137-0164"
    citation: {"ref": "SP800-137", "page": 36, "anchor": "Events may occur that trigger the immediate need to assess security controls"}
    kind: "modal"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Events may occur that trigger the immediate need to assess security controls or verify security status outside of requirements expressed in the ISCM strategy. This may require an assessment that is unplanned, but of the type defined in the ISCM strategy or a customized assessment tailored to address an emerging need (e.g., a change in planned assessment or monitoring frequency). For example, if a Web application is added to a system, an existing ISCM process that includes configuration management and control, SIA, developmental vulnerability scans, etc., may be sufficient to assess controls implemented for the new Web application."
    status: "candidate"
    work_item: "WI-258"
  - id: "REQ-SP800-137-0165"
    citation: {"ref": "SP800-137", "page": 36, "anchor": "When defining criteria for event-driven assessments, organizations consider events such as incidents,"}
    kind: "modal"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "When defining criteria for event-driven assessments, organizations consider events such as incidents, new threat information, significant changes to systems and operating environments, new or additional mission responsibilities, and results of a security impact analysis (SIA) or assessment of risk."
    status: "candidate"
    work_item: "WI-258"
  - id: "REQ-SP800-137-0166"
    citation: {"ref": "SP800-137", "page": 36, "anchor": "Organizations determine how the information will be collected and delivered within and"}
    kind: "modal"
    locator: "3.2.3"
    context: "DEVELOP ISCM ARCHITECTURE"
    statement: "Organizations determine how the information will be collected and delivered within and between the tiers as well as external to the organization. The core requirements of an architecture implemented to support ISCM are data collection, data storage, data analysis capabilities, and retrieval and presentation (reporting) capabilities. Methodologies are standardized to facilitate efficiencies, intra- and inter-tier information exchange, correlation, and other analysis."
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0167"
    citation: {"ref": "SP800-137", "page": 36, "anchor": "Organizations use automated tools, technologies, and methodologies where appropriate to allow for"}
    kind: "indicative"
    locator: "3.2.3"
    context: "DEVELOP ISCM ARCHITECTURE"
    statement: "Organizations use automated tools, technologies, and methodologies where appropriate to allow for increased efficiencies and insight including those gained through collection, analysis and dissemination of large volumes of data from diverse sources. The architecture and associated policies and procedures are designed to minimize data calls and maximize data reuse.39"
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0168"
    citation: {"ref": "SP800-137", "page": 36, "anchor": "Data feeds come from a heterogeneous mix of sources (e.g., authorization packages,"}
    kind: "modal"
    locator: "3.2.3"
    context: "DEVELOP ISCM ARCHITECTURE"
    statement: "Data feeds come from a heterogeneous mix of sources (e.g., authorization packages, training records, system logs) and accommodate different stakeholder views. Interoperable data specifications (e.g., SCAP, XML) enable data to be collected once and reused many times. Accountability for different facets of the security posture may reside with different roles or functions within an organization and hence require use of raw data in different metrics and contexts and at different intervals (e.g., security assessment and authorization, user awareness and training, and access control). Similarly, organizational missions and business functions have varied requirements for reporting and various drivers for action (e.g., changes to risk tolerance; changes in operational environments, including evolving threat activities; security architecture adjustments, security status reporting)."
    status: "not-a-requirement"
    reason: "Description of data sources: 'Data feeds come from a heterogeneous mix'; 'Accountability for different facets ... may reside with different roles' and 'hence require use of raw data' say why views differ, so accountability and require bind no one. Runs from page 36 to page 37."
  - id: "REQ-SP800-137-0169"
    citation: {"ref": "SP800-137", "page": 37, "anchor": "ISCM is implemented in accordance with the strategy. Security-related information (data) is"}
    kind: "modal"
    locator: "3.3"
    context: "IMPLEMENT AN ISCM PROGRAM"
    statement: "ISCM is implemented in accordance with the strategy. Security-related information (data) is collected as required for predefined metrics, security control assessments are conducted, and the security-related information generated is reported in accordance with organizational policies and procedures. All security control classes (management, operational, and technical) and types (common, hybrid, and system-specific) are included in the organizational continuous monitoring program. Every control is monitored for effectiveness, and every control is subject to use in monitoring security status. Data sources include people, processes, technologies, the computing environment, as well as any existing relevant security control assessment reports."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0170"
    citation: {"ref": "SP800-137", "page": 37, "anchor": "Collection, analysis, and reporting of data are automated where possible. Whether manual"}
    kind: "modal"
    locator: "3.3"
    context: "IMPLEMENT AN ISCM PROGRAM"
    statement: "Collection, analysis, and reporting of data are automated where possible. Whether manual or automated, the data collected is assembled for analysis and reported to the organizational officials charged with correlating and analyzing it in ways that are relevant for risk management activities. As indicated in the examples above, this may mean taking data from a variety of sources, collected at various points in time, and combining it in ways that are meaningful for the official receiving it at the time that it is requested. Part of the implementation stage of the continuous monitoring process is effectively organizing and delivering ISCM data to stakeholders in accordance with decision-making requirements. Tools and methodologies are chosen for the organization-wide ISCM architecture, in order to help ensure that risk-based decisions are informed by accurate, current security-related information."
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0171"
    citation: {"ref": "SP800-137", "page": 37, "anchor": "Discrete security processes inform and are informed by ISCM data. Organizations also"}
    kind: "indicative"
    locator: "3.3"
    context: "IMPLEMENT AN ISCM PROGRAM"
    statement: "Discrete security processes inform and are informed by ISCM data. Organizations also use ISCM data to inform processes that are not primarily used to control information security risk. Similarly, data from those processes can also be used to inform the ISCM program. Examples of processes that inform and are informed by ISCM include, but are not limited to, patch management, asset management, license management, configuration management, vulnerability management, and system authorization."
    status: "not-a-requirement"
    reason: "Description of how ISCM connects to other processes: 'Discrete security processes inform and are informed by ISCM data', 'data ... can also be used', 'Examples ... include'; no actor must do anything."
  - id: "REQ-SP800-137-0172"
    citation: {"ref": "SP800-137", "page": 38, "anchor": "Organizations develop procedures for analyzing and reporting assessment and monitoring results. This"}
    kind: "indicative"
    locator: "3.4"
    context: "ANALYZE DATA AND REPORT FINDINGS"
    statement: "Organizations develop procedures for analyzing and reporting assessment and monitoring results. This includes the specific staff/roles to receive ISCM reports, the content and format of the reports, the frequency of reports, and any tools to be used. Also included are requirements for analyzing and reporting results of controls that are not easily automated. It may be necessary to collect additional data to supplement or clarify security-related information under analysis or provided in initial reports. System- and mission/business-level staff receives and provides reports as required by organizational and mission/business-level policies and procedures."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0173"
    citation: {"ref": "SP800-137", "page": 38, "anchor": "Organizations analyze the security-related information resulting from ISCM. It may be necessary"}
    kind: "indicative"
    locator: "3.4.1"
    context: "ANALYZE DATA"
    statement: "Organizations analyze the security-related information resulting from ISCM. It may be necessary to collect additional data to supplement or clarify security-related information under analysis. The information to be analyzed is provided to organizational officials in a variety of ways, such as recurring reports, automated reports, ad hoc reports, data feeds, and database views."
    status: "candidate"
  - id: "REQ-SP800-137-0174"
    citation: {"ref": "SP800-137", "page": 38, "anchor": "Security-related information resulting from ISCM is analyzed in the context of stated"}
    kind: "modal"
    locator: "3.4.1"
    context: "ANALYZE DATA"
    statement: "Security-related information resulting from ISCM is analyzed in the context of stated risk tolerances, the potential impact that vulnerabilities may have on information systems, mission/business processes, and organization as a whole, and the potential impact of mitigation options. Even with real-time or near real-time organization-specific and system-specific security-related information, evolving vulnerability and threat data is always considered during the analysis. Organizational officials review the analyzed reports to determine whether to conduct mitigation activities or to transfer, avoid/reject, or accept risk. In some cases, authorizing officials may determine that accepting some specific risk is preferable to implementing a mitigating response. The rationale for such determinations may include organizational risk tolerance, negative impact to mission/business processes, or cost-effectiveness/return on investment of the implementation. Resolution of risk and the rationale for the decision is recorded in accordance with organizational policies and procedures."
    status: "partial"
    reason: "M-3 records the response and its rationale in rar.yaml; review of the reports by officials is not recorded"
    evidence: [{"kind": "prose", "asserts": "Organizational officials decide whether to mitigate or accept risk, and the rationale is recorded", "target": "playbooks/M/M-3.md", "claim": "presence"}]
    work_item: "WI-276"
  - id: "REQ-SP800-137-0175"
    citation: {"ref": "SP800-137", "page": 38, "anchor": "Organizations report on assessments of all implemented security controls for effectiveness in"}
    kind: "modal"
    locator: "3.4.2"
    context: "REPORT ON SECURITY CONTROL ASSESSMENTS"
    statement: "Organizations report on assessments of all implemented security controls for effectiveness in accordance with organizational requirements. Security-related information from assessments may be conveyed in templates or spreadsheets or collected and reported in an automated fashion. At the system level, security-related information from assessments directly supports ongoing authorization decisions and plans of action and milestones creation and tracking. Some security controls or elements of security controls, by definition, are security metrics (e.g., SI-4 Information System Monitoring). Hence, assessing the effectiveness of these controls results in monitoring the security status of the related metric."
    status: "candidate"
  - id: "REQ-SP800-137-0176"
    citation: {"ref": "SP800-137", "page": 39, "anchor": "Staff report assessment results in accordance with organizational policies and procedures. Reporting"}
    kind: "modal"
    locator: "3.4.2"
    context: "REPORT ON SECURITY CONTROL ASSESSMENTS"
    statement: "Staff report assessment results in accordance with organizational policies and procedures. Reporting on additional metrics and/or assessment results may be required by higher-level organizations such as OMB. Organizations define security status reporting requirements in the ISCM strategy. This includes the specific staff/roles to receive ISCM reports, the content and format of the reports, the frequency of reports, and any tools to be used."
    status: "candidate"
  - id: "REQ-SP800-137-0177"
    citation: {"ref": "SP800-137", "page": 39, "anchor": "Tier 3 officials report on findings, document any system-level mitigations made, and/or"}
    kind: "modal"
    locator: "3.4.2"
    context: "REPORT ON SECURITY CONTROL ASSESSMENTS"
    statement: "Tier 3 officials report on findings, document any system-level mitigations made, and/or provide recommendations to officials at Tiers 1 and 2. Organizational officials at Tiers 1 and 2 review Tier 3 findings to determine aggregate security status and the effectiveness and adequacy of all controls in meeting mission/business and organizational information security requirements. Information contained within a report will vary based on its recipient, frequency, purpose, supported tool sets, and metrics used. For example, the risk executive (function) may receive a general report on all systems annually and a detailed report on specific high-impact systems quarterly. The reports provided to the CIO and SISO may contain more granular technical data on all systems quarterly, and the AO may receive monthly comprehensive reports on the systems for which s/he is responsible. The computer incident response team (CIRT) lead may receive exception reports when alerts are generated, and network administrators may review dashboards showing network activity that is updated every minute, with summary metrics that are updated hourly or daily.40"
    status: "candidate"
    work_item: "WI-284"
  - id: "REQ-SP800-137-0178"
    citation: {"ref": "SP800-137", "page": 39, "anchor": "Organizations may consider more frequent reports for specific controls with more volatility"}
    kind: "should"
    locator: "3.4.2"
    context: "REPORT ON SECURITY CONTROL ASSESSMENTS"
    statement: "Organizations may consider more frequent reports for specific controls with more volatility or on controls for which there have been weaknesses or lack of compliance."
    status: "not-a-requirement"
    reason: "Advisory permission: 'Organizations may consider more frequent reports for specific controls'; not a minimum."
  - id: "REQ-SP800-137-0179"
    citation: {"ref": "SP800-137", "page": 39, "anchor": "Organizations also define requirements for reporting results of controls, such as PM"}
    kind: "indicative"
    locator: "3.4.2"
    context: "REPORT ON SECURITY CONTROL ASSESSMENTS"
    statement: "Organizations also define requirements for reporting results of controls, such as PM controls, that are not easily automated. Organizations develop procedures for collecting and reporting assessment and monitoring results, including results that are derived via manual methods, and for managing and collecting information from POA&Ms to be used for frequency determination, status reporting, and monitoring strategy revision."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0180"
    citation: {"ref": "SP800-137", "page": 39, "anchor": "Organizations develop procedures for reporting on security status monitoring. Security status data"}
    kind: "modal"
    locator: "3.4.3"
    context: "REPORT ON SECURITY STATUS MONITORING"
    statement: "Organizations develop procedures for reporting on security status monitoring. Security status data is derived from monitoring the predefined metrics across the organization using output generated by organization-wide tools (often implemented as common controls). The organization-wide tools may be part of a specific system or systems, but the security-related information generated may not be system-specific."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137-0181"
    citation: {"ref": "SP800-137", "page": 40, "anchor": "Security-related information obtained from monitoring is analyzed and met with appropriate responses."}
    kind: "modal"
    locator: "3.5"
    context: "RESPOND TO FINDINGS"
    statement: "Security-related information obtained from monitoring is analyzed and met with appropriate responses. Response to findings at all tiers may include risk mitigation, risk acceptance, risk avoidance/rejection, or risk sharing/transfer, in accordance with organizational risk tolerance.41"
    status: "partial"
    reason: "The response enum names the options; alignment with organizational risk tolerance is judgment"
    evidence: [{"kind": "prose", "asserts": "Findings from monitoring are met with risk mitigation, acceptance, avoidance or transfer", "target": "playbooks/M/M-3.md", "claim": "presence"}]
    work_item: "WI-276"
  - id: "REQ-SP800-137-0182"
    citation: {"ref": "SP800-137", "page": 40, "anchor": "Responses are coordinated with appropriate security management activities such as the security-focused"}
    kind: "indicative"
    locator: "3.5"
    context: "RESPOND TO FINDINGS"
    statement: "Responses are coordinated with appropriate security management activities such as the security-focused configuration management program. At Tier 1, response to findings may result in changes to security policies around organizational governance. Tier 1’s response may be constrained by the mission/business needs and the limitations of the enterprise architecture (including the human components), immutable governance policies, or other external drivers. At Tier 2, response to findings may include requests for additional security-related information, new or modified metrics, changes in mission/business processes, or Tier 3 reporting requirements, and/or additions or modifications to common control implementations. The Tier 2 response may be constrained by organizational governance policies and strategies as well as mission/business goals and objectives and limitations of organizational resources and infrastructure. At Tier 3, mitigation strategies have a direct and immediate impact on system-level risk and responses to findings may include implementation of additional controls, modifications to previously implemented controls, removal of systems’ authorization to operate, changes to the frequency of monitoring, and/or additional or more detailed analysis of security-related information. System-level mitigations are made within constraints set by Tier 1 and 2 policies, requirements, and strategies, to ensure that organizational processes are not negatively affected."
    status: "candidate"
    work_item: "WI-161"
  - id: "REQ-SP800-137-0183"
    citation: {"ref": "SP800-137", "page": 40, "anchor": "Response strategies may be implemented over a period of time, documenting implementation"}
    kind: "indicative"
    locator: "3.5"
    context: "RESPOND TO FINDINGS"
    statement: "Response strategies may be implemented over a period of time, documenting implementation plans in the system’s Plan of Action and Milestones. As weaknesses are found, response actions are evaluated and any mitigation actions are conducted immediately or are added to the POA&M. Other key system documents are updated accordingly. Security controls that are modified, enhanced, or added as part of the response step of the continuous monitoring process are assessed to ensure that the new or revised controls are effective in their implementations.42"
    status: "candidate"
  - id: "REQ-SP800-137-0184"
    citation: {"ref": "SP800-137", "page": 41, "anchor": "Going forward, new or revised controls are included in the overall continuous"}
    kind: "indicative"
    locator: "3.5"
    context: "RESPOND TO FINDINGS"
    statement: "Going forward, new or revised controls are included in the overall continuous monitoring strategy."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0185"
    citation: {"ref": "SP800-137", "page": 41, "anchor": "ISCM strategies and programs are not static. Security control assessments, security status"}
    kind: "modal"
    locator: "3.6"
    context: "REVIEW AND UPDATE THE MONITORING PROGRAM AND STRATEGY"
    statement: "ISCM strategies and programs are not static. Security control assessments, security status metrics, and monitoring and assessment frequencies change in accordance with the needs of the organization. The continuous monitoring strategy is reviewed to ensure that it sufficiently supports the organization in operating within acceptable risk tolerance levels, that metrics remain relevant, and that data is current and complete. The strategy review also identifies ways to improve organizational insight into security posture, effectively supports informed risk management decision making/ongoing authorizations, and improves the organization’s ability to respond to known and emerging threats."
    status: "candidate"
    work_item: "WI-159"
  - id: "REQ-SP800-137-0186"
    citation: {"ref": "SP800-137", "page": 41, "anchor": "The organization establishes a procedure for reviewing and modifying all aspects of"}
    kind: "indicative"
    locator: "3.6"
    context: "REVIEW AND UPDATE THE MONITORING PROGRAM AND STRATEGY"
    statement: "The organization establishes a procedure for reviewing and modifying all aspects of the ISCM strategy, including relevance of the overall strategy, accuracy in reflecting organizational risk tolerance, accuracy/correctness of measurements, and applicability of metrics, reporting requirements, and monitoring and assessment frequencies. If any of the data collected is not required for reporting purposes or found to be not useful in maintaining or improving the organization’s security posture, then the organization considers saving resources by discontinuing that particular collection. Factors precipitating changes in the monitoring strategy may include, but are not limited to:"
    status: "candidate"
    work_item: "WI-159"
