  - {"page": 36, "locator": "3.2.2", "reason": "no-marker", "text": "Supporting Roles: Risk Executive (Function), Senior Information Security Officer, Security Control Assessor"}
  - {"page": 36, "locator": "3.2.2", "reason": "no-marker", "text": "Expected Input: Organizational risk assessment, organizational risk tolerance, current threat information, current vulnerability information, organizational priorities and expectations"}
  - {"page": 36, "locator": "3.2.3", "reason": "no-marker", "text": "An example of an architecture for ISCM can be found in Draft NISTIR 7756, CAESARS Framework Extension: An Enterprise Continuous Monitoring Technical Reference Architecture (Draft)."}
  - {"page": 37, "locator": "3.3", "reason": "no-marker", "text": "As described in Chapter Two, the ISCM data output from one process may serve as input to many others."}
