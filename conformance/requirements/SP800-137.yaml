    kind: "lettered"
    locator: "3.1.3.•"
    context: "PROCESS ROLES AND RESPONSIBILITIES Tiers 1 and 2 officials have responsibilities throughout the ISCM process, including, but not limited to, the following:"
    statement: "• Provide input to the development of the organizational ISCM strategy including establishment of metrics, policy, and procedures, compiling and correlating Tier 3 data into security-related information of use at Tiers 1 and 2, policies on assessment and monitoring frequencies, and provisions for ensuring sufficient depth and coverage when sampling methodologies are utilized [ISCM steps: Define, Establish, Implement]. 27 See NIST SP 800-53, CA-2, Control Enhancement 1, for specific assessor independence requirements. Assessors need only be independent of the operation of the system. They may be from within the organizational tier, the mission/business tier, or from within some other independent entity internal or external to the organization. Results of assessments done by system operators can be used if they have been validated by independent assessors."
    status: "candidate"
    work_item: "WI-14"
