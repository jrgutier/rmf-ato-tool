    citation: {"ref": "SP800-137", "page": 20, "anchor": "Offer interoperability with other products such as help desk, inventory management, configuration"}
    kind: "lettered"
    locator: "2.3.•"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "• Offer interoperability with other products such as help desk, inventory management, configuration management, and incident response solutions;"
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0062"
    citation: {"ref": "SP800-137", "page": 20, "anchor": "Support compliance with applicable federal laws, Executive Orders, directives, policies, regulations, standards,"}
    kind: "lettered"
    locator: "2.3.•"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "• Support compliance with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidelines;"
    status: "candidate"
    work_item: "WI-259"
  - id: "REQ-SP800-137-0063"
    citation: {"ref": "SP800-137", "page": 20, "anchor": "Provide reporting with the ability to tailor output and drill down from"}
    kind: "lettered"
    locator: "2.3.•"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "• Provide reporting with the ability to tailor output and drill down from high-level, aggregate metrics to system-level metrics; and"
