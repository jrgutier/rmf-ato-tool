  - id: "REQ-SP800-137-0083"
    citation: {"ref": "SP800-137", "page": 24, "anchor": "Effective ISCM begins with development of a strategy that addresses ISCM requirements"}
    kind: "modal"
    locator: "3.1"
    context: "DEFINE ISCM STRATEGY"
    statement: "Effective ISCM begins with development of a strategy that addresses ISCM requirements and activities at each organizational tier (organization, mission/business processes, and information systems). Each tier monitors security metrics and assesses security control effectiveness with established monitoring and assessment frequencies and status reports customized to support tier-specific decision making. Policies, procedures, tools, and templates that are implemented from Tiers 1 and 2, or that are managed in accordance with guidance from Tiers 1 and 2, best support shared use of data within and across tiers. The lower tiers may require information in addition to that required at higher tiers and hence develop tier-specific strategies that are consistent with those at higher tiers and still sufficient to address local tier requirements for decision making. Depending on the organization, there may be overlap in the tasks and activities conducted at each tier."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0084"
    citation: {"ref": "SP800-137", "page": 24, "anchor": "The guidelines below, though not prescriptive, helps to ensure an organization-wide approach"}
    kind: "indicative"
    locator: "3.1"
    context: "DEFINE ISCM STRATEGY"
    statement: "The guidelines below, though not prescriptive, helps to ensure an organization-wide approach to ISCM that best promotes standardized methodologies and consistent practices and hence maximizes efficiencies and leveragability of security-related data. As changes occur, the ISCM strategy is reviewed for relevance, accuracy in reflecting organizational risk tolerances, correctness of measurements, and applicability of metrics. An inherent part of any ISCM strategy is the inclusion of criteria describing the conditions that trigger a review or update of the strategy, in addition to the preestablished frequency audit. Likewise, the organization defines criteria and procedures for updating the ISCM program based on the revised ISCM strategy."
    status: "candidate"
    work_item: "WI-159"
