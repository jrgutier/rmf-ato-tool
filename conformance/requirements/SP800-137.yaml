  - {"page": 33, "locator": "3.2.2", "reason": "no-marker", "text": "Attack patterns describe common methods for exploiting software, based on in-depth analysis of specific real-world attack examples. For more information, see the Common Attack Pattern Enumeration and Classification (CAPEC) site at http://capec.mitre.org/."}
  - {"page": 33, "locator": "3.2.2", "reason": "no-marker", "text": "For current vulnerability information, see http://www.kb.cert.org/vuls and http://nvd.nist.gov/."}
