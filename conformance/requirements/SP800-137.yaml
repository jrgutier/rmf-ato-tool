rejected:
  - {"page": 8, "locator": "INTRODUCTION", "reason": "short", "text": "I"}
  - {"page": 9, "locator": "INTRODUCTION", "reason": "no-marker", "text": "ISCM, a critical step in an organization’s Risk Management Framework (RMF), gives organizational officials access to security-related information on demand, enabling timely risk management decisions, including authorization decisions. Frequent updates to security plans, security assessment reports, plans of action and milestones, hardware and software inventories, and other system information are also supported. ISCM is most effective when automated mechanisms are employed where possible for data collection and reporting. Effectiveness is further enhanced when the output is formatted to provide information that is specific, measurable, actionable, relevant, and timely. While this document encourages the use of automation, it is recognized that many aspects of ISCM programs are not easily automated."}
  - {"page": 9, "locator": "1.1", "reason": "no-marker", "text": "The concept of monitoring information system security has long been recognized as sound management practice. In 1997, Office of Management and Budget (OMB) Circular A-130, Appendix III5"}
  - {"page": 9, "locator": "1.1", "reason": "no-marker", "text": "Most recently, OMB issued memorandum M-11-33, FY 2011 Reporting Instructions for the Federal Information Security Management Act and Agency Privacy Management.6"}
  - {"page": 9, "locator": "1.1", "reason": "no-marker", "text": "The memorandum provides instructions for annual FISMA reporting and emphasizes monitoring the security state of information systems on an ongoing basis with a frequency sufficient to make ongoing, risk-based decisions."}
  - {"page": 9, "locator": "1.1", "reason": "no-marker", "text": "Tools supporting automated monitoring of some aspects of information systems have become an effective means for both data capture and data analysis. Ease of use, accessibility, and broad applicability across products and across vendors help to ensure that monitoring tools can be readily deployed in support of near real-time, risk-based decision making."}
  - {"page": 9, "locator": "1.2", "reason": "no-marker", "text": "NIST SP 800-39, Managing Information Security Risk: Organization, Mission, and Information System View, describes three key organization-wide ISCM activities: monitoring for effectiveness, monitoring for changes to systems and environments of operation, and monitoring for compliance. NIST SP 800-37 describes monitoring security controls at the system level (RMF Step 6) and also includes an organization-wide perspective, integration with the system development life cycle (SDLC), and support for ongoing authorizations. The concepts presented in NIST SP 800-39 and NIST SP 800-37 are expanded upon in order to provide guidelines sufficient for developing an ISCM strategy and implementing an ISCM program."}
  - {"page": 9, "locator": "1.2", "reason": "no-marker", "text": "See OMB Memoranda M-11-33, Question #28, for information on ongoing authorization (http://www.whitehouse.gov/sites/default/files/omb/memoranda/2011/m11-33.pdf)."}
  - {"page": 9, "locator": "1.2", "reason": "no-marker", "text": "OMB Circular A-130 is available at http://www.whitehouse.gov/omb/circulars_a130_a130trans4."}
  - {"page": 9, "locator": "1.2", "reason": "no-marker", "text": "OMB memorandum M-11-33 is available at http://www.whitehouse.gov/sites/default/files/omb/memoranda/2011/m11-33.pdf."}
  - {"page": 10, "locator": "1.4", "reason": "lead-in", "text": "This publication serves individuals associated with the design, development, implementation, operation, maintenance, and disposal of federal information systems, including:"}
  - {"page": 10, "locator": "1.4", "reason": "short", "text": ");"}
  - {"page": 11, "locator": "1.5", "reason": "lead-in", "text": "The remainder of this special publication is organized as follows:"}
  - {"page": 12, "locator": "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT", "reason": "short", "text": "T"}
  - {"page": 12, "locator": "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT", "reason": "lead-in", "text": "The process of implementing ISCM as described in Chapter Three is:"}
  - {"page": 13, "locator": "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT", "reason": "no-marker", "text": "ISCM is a tactic in a larger strategy of organization-wide risk management.9"}
  - {"page": 13, "locator": "ONGOING MONITORING IN SUPPORT OF RISK MANAGEMENT", "reason": "short", "text": "10"}
  - {"page": 13, "locator": "2.1", "reason": "no-marker", "text": "ISCM is discussed within the larger context of organization-wide risk management in NIST SP 800-39."}
  - {"page": 13, "locator": "2.1", "reason": "no-marker", "text": "CM-8 is a security control from the Configuration Management family in NIST SP 800-53, Appendix F."}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "Risk Tolerance/ Governance/Policies/"}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "Strategies"}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "Tools"}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "Data"}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "MISSION/BUSINESS PROCESSES Collection/Correlation/Analysis/Reporting"}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "Tools"}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "Data"}
  - {"page": 15, "locator": "2.1", "reason": "short", "text": "INFORMATION SYSTEMS Collection/Correlation/Analysis/Reporting"}
  - {"page": 15, "locator": "2.1", "reason": "no-marker", "text": "An organization-wide approach to continuous monitoring of information and information system security supports risk-related decision making at the organization level (Tier 1), the mission/business processes level (Tier 2), and the information systems level (Tier 3).14"}
  - {"page": 15, "locator": "2.1.1", "reason": "no-marker", "text": "NIST Special Publication 800-39, as amended, provides guidelines on the holistic approach to risk management."}
  - {"page": 16, "locator": "2.1.2", "reason": "no-marker", "text": "Security-related information may come from common, hybrid, and system-specific controls. Metrics and dashboards can be useful at Tiers 1 and 2 in assessing, normalizing, communicating, and correlating monitoring activities below the mission/business processes tier in a meaningful manner."}
  - {"page": 16, "locator": "2.1.3", "reason": "no-marker", "text": "Monitoring organizationally defined metrics is referred to as security status monitoring throughout this document."}
  - {"page": 16, "locator": "2.1.3", "reason": "no-marker", "text": "As an organization’s technical and human capital capabilities mature, monitoring capabilities increase."}
  - {"page": 16, "locator": "2.1.3", "reason": "no-marker", "text": "Threat activities include malicious activities observed on organizational networks or other anomalous activities that are indicators of inappropriate actions. See NIST SP 800-30, as amended, for more information on threats."}
  - {"page": 16, "locator": "2.1.3", "reason": "no-marker", "text": "A continuous monitoring strategy for an individual system may also include metrics related to its potential impact on other systems."}
  - {"page": 17, "locator": "2.2", "reason": "not-normative", "text": "Roles and responsibilities of organizational officials within a continuous monitoring program are discussed in Section 2.4. NIST SP 800-37, as amended, describes the interaction of the risk executive (function) in the context of the RMF."}
  - {"page": 18, "locator": "2.2", "reason": "no-marker", "text": "PROCESS OVERVIEW Architecture Description"}
