    citation: {"ref": "SP800-137", "page": 20, "anchor": "Allow for data consolidation into Security Information and Event Management (SIEM) tools"}
    kind: "lettered"
    locator: "2.3.•"
    context: "ROLE OF AUTOMATION IN ISCM"
    statement: "• Allow for data consolidation into Security Information and Event Management (SIEM) tools and dashboard products."
    status: "candidate"
