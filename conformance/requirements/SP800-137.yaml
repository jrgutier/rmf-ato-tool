  - id: "REQ-SP800-137-0155"
    citation: {"ref": "SP800-137", "page": 34, "anchor": "Risk assessment results. Results from organizational and/or system-specific assessments of risk (either"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "• Risk assessment results. Results from organizational and/or system-specific assessments of risk (either formal or informal) are examined and taken into consideration when establishing monitoring frequencies. For instance, if a system-specific risk assessment identifies potential threats and vulnerabilities related to nonlocal maintenance (NIST SP 800-53, MA-4), the organization considers more frequent monitoring of the records kept on nonlocal maintenance and diagnostic activities. If a risk scoring scheme is in place at the organization, the risk scores may be used as justification to increase or decrease the monitoring frequencies of related controls."
    status: "candidate"
    work_item: "WI-255"
