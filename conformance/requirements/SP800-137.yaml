  - id: "REQ-SP800-137-0009"
    citation: {"ref": "SP800-137", "page": 8, "anchor": "Communication with all stakeholders is key in developing the strategy and implementing"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "This necessitates:"
    statement: "Communication with all stakeholders is key in developing the strategy and implementing the program. This document builds on the monitoring concepts introduced in NIST SP 800-37 Rev. 1, Guide for Applying the Risk Management Framework to Federal Information Systems: A Security Life Cycle Approach. An ISCM program helps to ensure that deployed security controls continue to be effective and that operations remain within stated organizational risk tolerances in light of the inevitable changes that occur over time. In cases where security controls are determined to be inadequate, ISCM programs facilitate prioritized security response actions based on risk."
    status: "not-a-requirement"
    reason: "Motivation: 'Communication with all stakeholders is key', the document's lineage, and what 'An ISCM program helps to ensure'; nothing here tells anyone to do something."
