    context: "ORGANIZATION (TIER 1) AND MISSION/BUSINESS PROCESSES (TIER 2) ISCM STRATEGY"
    statement: "The risk executive (function) determines the overall organizational risk tolerance and risk mitigation strategy at the organization tier.24"
