  - id: "REQ-SP800-137-0137"
    citation: {"ref": "SP800-137", "page": 31, "anchor": "Organizations establish a program to implement the ISCM strategy. The program is"}
    kind: "indicative"
    locator: "3.2"
    context: "ESTABLISH AN ISCM PROGRAM"
    statement: "Organizations establish a program to implement the ISCM strategy. The program is sufficient to inform risk-based decisions and maintain operations within established risk tolerances. Goals include detection of anomalies and changes in the organization’s environments of operation and information systems, visibility into assets, awareness of vulnerabilities, knowledge of threats, security control effectiveness, and security status including compliance. Metrics are designed and frequencies determined to ensure that information needed to manage risk to within organizational risk tolerances is available. Tools, technologies, and manual and/or automated methodologies are implemented within the context of an architecture designed to deliver the required information in the appropriate context and at the right frequencies."
    status: "candidate"
    work_item: "WI-158"
  - id: "REQ-SP800-137-0138"
    citation: {"ref": "SP800-137", "page": 31, "anchor": "Organizations determine metrics to be used to evaluate and control ongoing risk"}
    kind: "modal"
    locator: "3.2.1"
    context: "DETERMINE METRICS"
    statement: "Organizations determine metrics to be used to evaluate and control ongoing risk to the organization. Metrics, which include all the security-related information from assessments and monitoring produced by automated tools and manual procedures, are organized into meaningful information to support decision making and reporting requirements. Metrics should be derived from specific objectives that will maintain or improve security posture. Metrics are developed for system-level data to make it meaningful in the context of mission/business or organizational risk management."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137-0139"
    citation: {"ref": "SP800-137", "page": 31, "anchor": "Metrics may use security-related information acquired at different frequencies and therefore with"}
    kind: "should"
    locator: "3.2.1"
    context: "DETERMINE METRICS"
    statement: "Metrics may use security-related information acquired at different frequencies and therefore with varying data latencies. Metrics may be calculated from a combination of security status monitoring, security control assessment data, and from data collected from one or more security controls. Metrics may be determined at any tier or across an organization. Some examples of metrics are the number and severity of vulnerabilities revealed and remediated, number of unauthorized access attempts, configuration baseline information, contingency plan testing dates and results, and number of employees who are current on awareness training requirements, risk tolerance thresholds for organizations, and the risk score associated with a given system configuration."
    status: "not-a-requirement"
    reason: "Permission and examples: 'Metrics may use', 'may be calculated', 'may be determined at any tier', 'Some examples of metrics are'; a sketch of what a metric can be, not a minimum set."
  - id: "REQ-SP800-137-0140"
    citation: {"ref": "SP800-137", "page": 31, "anchor": "As an example, a metric that an organization might use to monitor"}
    kind: "modal"
    locator: "3.2.1"
    context: "DETERMINE METRICS"
    statement: "As an example, a metric that an organization might use to monitor status of authorized and unauthorized components on a network could rely on related metrics such as physical asset locations, logical asset locations (subnets/Internet protocol (IP) addresses), media access control (MAC) addresses, system association, and policies/procedures for network connectivity. The metrics would be refreshed at various frequencies in accordance with the ISCM strategy. The metrics might be computed hourly, daily, or weekly. Though logical asset information might change daily, it is likely that policies and procedures for network connectivity will be reviewed or revised no more than annually. These metrics are informative only and are not recommended metrics. They are included to assist in explaining the concept of metrics as they are applied across tiers. Organizations define their own metrics and associated monitoring frequencies. In order to calculate metrics, associated controls and/or their objects are assessed and monitored with frequencies consistent with the timing requirements expressed in the metric."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137-0141"
    citation: {"ref": "SP800-137", "page": 31, "anchor": "It should be noted that metrics are fundamentally flawed without assurance that"}
    kind: "modal"
    locator: "3.2.1"
    context: "DETERMINE METRICS"
    statement: "It should be noted that metrics are fundamentally flawed without assurance that all security controls are implemented correctly. Metrics are defined or calculated in accordance with output from the security architecture. Collecting metrics from a security architecture with security controls that have not been assessed is equivalent to using a broken or uncalibrated scale. The interpretation of metrics data presumes that controls directly and indirectly used in the metric calculation are implemented and working as anticipated. If a metric indicates a problem, the root cause could be any number of things. Without fundamental assurance of correct implementation and continued effectiveness of security controls that are not associated with the metric, the root cause analysis is going to be hampered, and the analysis may be inappropriately narrowed to a predetermined list, overlooking the true problem. For detailed information on establishing metrics, see NIST SP 800-55, as amended."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137-0142"
    citation: {"ref": "SP800-137", "page": 32, "anchor": "Determining frequencies for security status monitoring and for security control assessments are"}
    kind: "indicative"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Determining frequencies for security status monitoring and for security control assessments are critical functions of the organization’s ISCM program. For some organizations, dashboards and ongoing assessments are a shift away from the model of complete security control assessments conducted at a distinct point in time. For this shift to be constructive and effective from security, assurance, and resource use perspectives, organizations determine the frequencies with which each security control or control element is assessed for effectiveness and the frequencies with which each metric is monitored."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0143"
    citation: {"ref": "SP800-137", "page": 32, "anchor": "Security control effectiveness across a tier or throughout the organization can itself"}
    kind: "modal"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Security control effectiveness across a tier or throughout the organization can itself be taken as a security metric and as such may have an associated status monitoring frequency. Though monitoring and assessment frequencies are determined for each individual metric and control, organizations use this data of different latencies to create a holistic view of the security of each system as well as a view of the security of the enterprise architecture. As the monitoring program matures, monitoring and assessment frequencies are important in the context of how the data is used and the question When did the system receive authorization to operate? will become less meaningful than How resilient is the system?"
    status: "candidate"
    work_item: "WI-284"
  - id: "REQ-SP800-137-0144"
    citation: {"ref": "SP800-137", "page": 32, "anchor": "Security control volatility. Volatile security controls are assessed more frequently, whether the"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES Organizations take the following criteria into consideration when establishing monitoring frequencies for metrics or assessment frequencies for security"
    statement: "• Security control volatility. Volatile security controls are assessed more frequently, whether the objective is establishing security control effectiveness or supporting calculation of a metric.33"
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0145"
    citation: {"ref": "SP800-137", "page": 32, "anchor": "Controls in the NIST SP 800-53 Configuration Management (CM) family are a"}
    kind: "modal"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES Organizations take the following criteria into consideration when establishing monitoring frequencies for metrics or assessment frequencies for security"
    statement: "Controls in the NIST SP 800-53 Configuration Management (CM) family are a good example of volatile controls. Information system configurations typically experience high rates of change. Unauthorized or unanalyzed changes in the system configuration often render the system vulnerable to exploits. Therefore, corresponding controls such as CM-6, Configuration Settings, and CM-8, Information System Component Inventory, may require more frequent assessment and monitoring, preferably using automated, SCAP-validated tools that provide alerts and status on demand. Conversely, controls such as PS-2, Position Categorization, or PS-3, Personnel Screening, (from the NIST SP 800-53 Personnel Security family of controls) are not volatile in most organizational settings. They tend to remain static over long periods and would therefore typically require less frequent assessment."
    status: "not-a-requirement"
    reason: "Example under REQ-SP800-137-0144: CM and PS controls are 'a good example', CM-6 and CM-8 'may require' more frequent assessment and PS-2 'would ... require less'. The cited controls illustrate volatility; nothing here is required of anyone."
  - id: "REQ-SP800-137-0146"
    citation: {"ref": "SP800-137", "page": 32, "anchor": "Security control volatility is a measure of how frequently a control is"}
    kind: "indicative"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "Security control volatility is a measure of how frequently a control is likely to change over time subsequent to its implementation."
    status: "not-a-requirement"
    reason: "Footnote 33 defining volatility: 'is a measure of how frequently a control is likely to change'."
  - id: "REQ-SP800-137-0147"
    citation: {"ref": "SP800-137", "page": 33, "anchor": "System categorizations/impact levels. In general, security controls implemented on systems that are"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "• System categorizations/impact levels. In general, security controls implemented on systems that are categorized as high-impact are monitored more frequently than controls implemented on moderate-impact systems, which are in turn monitored more frequently than controls implemented on low-impact systems.34"
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0148"
    citation: {"ref": "SP800-137", "page": 33, "anchor": "Security controls or specific assessment objects providing critical functions. Security controls or"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "• Security controls or specific assessment objects providing critical functions. Security controls or assessment objects that provide critical security functions (e.g., log management server, firewalls) are candidates for more frequent monitoring. Additionally, individual assessment objects that support critical security functions and/or are deemed critical to the system (in accordance with the Business Impact Analysis"
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0149"
    citation: {"ref": "SP800-137", "page": 33, "anchor": ") or to the organization may be candidates for more frequent monitoring."}
    kind: "should"
    locator: "3.2.2"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: ") or to the organization may be candidates for more frequent monitoring."
    status: "not-a-requirement"
    reason: "Tail of the sentence cut after 'Business Impact Analysis': ') or to the organization may be candidates'; the live piece is REQ-SP800-137-0148."
  - id: "REQ-SP800-137-0150"
    citation: {"ref": "SP800-137", "page": 33, "anchor": "Security controls with identified weaknesses. Existing risks documented in security assessment reports"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "• Security controls with identified weaknesses. Existing risks documented in security assessment reports (SARs) are considered for more frequent monitoring to ensure that risks stay within tolerance. Similarly, controls documented in the POA&M as having weaknesses are monitored more frequently until remediation of the weakness is complete. Note that not all weaknesses require the same level of monitoring. For example, weaknesses deemed in the SAR to be of minor or low-impact risk to the system or organization are monitored less frequently than a weakness with a higher-impact risk to the system or organization."
    status: "candidate"
    work_item: "WI-255"
  - id: "REQ-SP800-137-0151"
    citation: {"ref": "SP800-137", "page": 33, "anchor": "Organizational risk tolerance.36"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "• Organizational risk tolerance.36"
    status: "not-a-requirement"
    reason: "Bare label 'Organizational risk tolerance.36'; the criterion's body is the rejected paragraph promoted as REQ-SP800-137-0220."
  - id: "REQ-SP800-137-0152"
    citation: {"ref": "SP800-137", "page": 33, "anchor": "Threat information. Organizations consider current credible threat information, including known exploits and"}
    kind: "lettered"
    locator: "3.2.2.•"
    context: "ESTABLISH MONITORING AND ASSESSMENT FREQUENCIES"
    statement: "• Threat information. Organizations consider current credible threat information, including known exploits and attack patterns, when establishing monitoring frequencies. For instance, if a specific attack is developed which exploits a vulnerability of an implemented technology, temporary or permanent increases to the monitoring frequencies for related controls or metrics may help provide protection from the threat."
    status: "candidate"
    work_item: "WI-255"
