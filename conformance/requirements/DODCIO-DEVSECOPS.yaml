  - id: "REQ-DODCIO-DEVSECOPS-0063"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 22, "anchor": "expansion and determining the definition of done. The concept of an iteration"}
    kind: "table"
    locator: "3.2.1"
    context: "Plan"
    statement: "expansion and determining the definition of done. The concept of an iteration is supported in | the"
    status: "not-a-requirement"
