  - {"page": 7, "locator": "1 Introduction", "reason": "no-marker", "text": "Provides the definition of DevSecOps and a description of the DevSecOps lifecycle and phases."}
  - {"page": 7, "locator": "1 Introduction", "reason": "no-marker", "text": "Section 3.0: Implementing DevSecOps"}
  - {"page": 7, "locator": "1 Introduction", "reason": "no-marker", "text": "Provides in-depth information regarding the components of DevSecOps to include DevSecOps integration with other processes."}
  - {"page": 7, "locator": "1 Introduction", "reason": "no-marker", "text": "Section 4.0: Institutionalizing DevSecOps"}
