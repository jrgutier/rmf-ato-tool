  - id: "REQ-DODCIO-DEVSECOPS-0110"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 32, "anchor": "Metrics are crucial to software development, delivery, and operations as they provide"}
    kind: "should"
    locator: "4.3"
    context: "Measuring Success with Performance Metrics"
    statement: "Metrics are crucial to software development, delivery, and operations as they provide objective and quantifiable measures of performance, progress, and quality. By tracking and analyzing metrics, organizations can gain valuable insights into the efficiency, effectiveness, and health of their software development processes. Metrics help identify bottlenecks, measure productivity, and assess the impact of process improvements. They enable teams to make data-driven decisions, set realistic goals, and continuously improve their practices. Metrics also facilitate communication and transparency, allowing stakeholders to understand the status of projects, identify risks, and make informed decisions. Ultimately, metrics empower organizations to optimize their software development and delivery processes, enhance customer satisfaction, and achieve better outcomes."
    status: "not-a-requirement"
    reason: "Explains why metrics matter: 'are crucial', they 'help identify' and 'enable teams'. A rationale for section 4.3, with no metric or actor named."
  - id: "REQ-DODCIO-DEVSECOPS-0111"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 32, "anchor": "Aggregation of performance metrics is accomplished by querying data from multiple tools"}
    kind: "indicative"
    locator: "4.3"
    context: "Measuring Success with Performance Metrics"
    statement: "Aggregation of performance metrics is accomplished by querying data from multiple tools across the software factory and is most often accomplished using existing tool APIs. Most git repositories have documented APIs to query how often an artifact is pulled from a main branch, for example. If you have successfully automated deployment, you can pull the deployment metrics from your automation stack."
    status: "not-a-requirement"
    reason: "How aggregation is 'most often accomplished': through tool APIs, with git as an example. A how-to hint; 'you can pull' is a permission."
