    kind: "modal"
    locator: "3.3.1.2"
    context: "Risk Management Framework"
    statement: "Continuous Authorization to Operate: A cATO is the state achieved when the organization(s) that develops, secures, and operates a system has demonstrated sufficient maturity in their ability to maintain a resilient cybersecurity posture that traditional risk assessments and authorizations become redundant. This organization must have implemented robust information security continuous monitoring capabilities, active cyber defense, and secure software supply chain requirements to enable continuous delivery of capabilities without adversely impacting the system’s cyber posture."
    status: "partial"
    reason: "Maturity, monitoring, cyber defense and supply chain are D-5 data at p12"
