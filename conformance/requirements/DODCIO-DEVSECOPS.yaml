  - id: "REQ-DODCIO-DEVSECOPS-0140"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 35, "anchor": "A software product team typically consists of a group of individuals who"}
    kind: "modal"
    locator: "4.4"
    context: "Workforce"
    statement: "A software product team typically consists of a group of individuals who work together to develop and deliver a specific product or feature. The team is typically cross-functional, meaning that each member brings a unique skillset or expertise. This allows for efficient collaboration, quick decision-making, and the ability to deliver a product that meets customer needs within a shorter timeframe. A small team size promotes a sense of ownership, accountability, and close collaboration among team members, leading to a more agile and responsive development process (see Figure 13). On highly functional teams, a given individual might execute in multiple roles, and that the nature of a cross-functional team means that this is not only allowable, but to be encouraged."
    status: "not-a-requirement"
    reason: "Describes what a product team 'typically' looks like. A small team promotes 'accountability' as a benefit, and 'to be encouraged' is said of one person in several roles, an observation about small teams that binds none of them. Separation of duties for privileged users stays at 0033."
