  - id: "REQ-DODCIO-DEVSECOPS-0028"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 12, "anchor": "There are several critical components in implementing DevSecOps. These components include the"}
    kind: "modal"
    locator: "3.1"
    context: "DevSecOps Implementation Components"
    statement: "There are several critical components in implementing DevSecOps. These components include the software supply chain, software factories, DevSecOps platforms, CI/CD pipelines, and Infrastructure as Code (IaC). The software supply chain provides the full context for software delivery, setting the stage for the other components. A software factory encompasses the entire set of software capabilities required to deliver resilient software capability at speed. The DevSecOps platform consists of those software capabilities that are common across all software factories and provides a standardized and secure foundation for software development. CI/CD pipelines include the tools, process workflows, scripts, and environments to produce a set of software deployable artifacts with minimal human intervention. IaC consists of code baselines that automatically establish common infrastructure or other service capability for faster, more consistent implementation. These components are described in the following sections."
    status: "not-a-requirement"
    reason: "Overview of the components, each one sentence of what it is. 'Required to deliver' sizes a software factory's capability set and binds no one."
  - id: "REQ-DODCIO-DEVSECOPS-0029"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 12, "anchor": "Note that a DevSecOps implementation does not require a specific architecture, containers,"}
    kind: "modal"
    locator: "3.1"
    context: "DevSecOps Implementation Components"
    statement: "Note that a DevSecOps implementation does not require a specific architecture, containers, or even explicit use of cloud computing. However, the use of these components is strongly recommended, and in some cases mandated by specific DoD reference designs. Teams are encouraged to start small and build up their capabilities progressively, striving for continuous process improvement at each of the ten lifecycle phases."
    status: "candidate"
    work_item: "WI-296"
  - id: "REQ-DODCIO-DEVSECOPS-0030"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 12, "anchor": "The software supply chain is a logistical pathway that covers the entirety"}
    kind: "modal"
    locator: "3.1.1"
    context: "Software Supply Chain"
    statement: "The software supply chain is a logistical pathway that covers the entirety of all the hardware, Infrastructure as a Service (IaaS), Platform as a Service (PaaS), Software as a Service (SaaS), and tools and practices that are brought together to deliver specific software capabilities. The software supply chain matters because the end software supporting the warfighter, from embedded software on the bridge of a Naval vessel to electronic warfare algorithms in an aircraft, is only possible due to the people, processes, and tools that create the end result. For example, a compiler is unlikely to be deployed onto a physical vessel, but without the compiler there would be no guidance system. For this reason, the software supply chain must be recognized, understood, secured, and monitored to ensure mission success."
    status: "candidate"
    work_item: "WI-288"
  - id: "REQ-DODCIO-DEVSECOPS-0031"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 12, "anchor": "Software supply chains exist for business systems, weapons systems, and everywhere software"}
    kind: "indicative"
    locator: "3.1.1"
    context: "Software Supply Chain"
    statement: "Software supply chains exist for business systems, weapons systems, and everywhere software is developed and deployed. It is easy, but naïve and incorrect, to dismiss an embedded system in a projectile as “isolated” and disconnected. The projectile includes embedded software that was compiled leveraging 3rd party libraries and links to hardware drivers and relies upon features of embedded firmware. Additionally, the very performance of the software was likely tested using modeling and simulation software executing within a high-performance computing cloud."
    status: "not-a-requirement"
    reason: "Argument that embedded systems have supply chains too, with a projectile as its example. It tells no one to do anything."
  - id: "REQ-DODCIO-DEVSECOPS-0032"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 12, "anchor": "DevSecOps methodologies span multiple links of the software supply chain. DevSecOps cannot"}
    kind: "modal"
    locator: "3.1.1"
    context: "Software Supply Chain"
    statement: "DevSecOps methodologies span multiple links of the software supply chain. DevSecOps cannot exist without this logistical supply chain – Integrated Development Environments (IDEs), build tools, code repositories, artifact repositories, testing software suites, and many other pieces of software must work together in unison to effectively execute a DevSecOps powered software factory. The totality of these environments must be considered when evaluating the software supply chain. For example, the cybersecurity and risk postures of a specific artifact or application would be calculated using the product rule across the entirety of the software supply chain. If the compiler is 90% secure, the code repository is 90% secure, the artifact repository is 90% secure, and the container orchestrator is 90% secure – the overall system is not 90% secure. The cybersecurity level of the end-to-end ecosystem is actually .9 * .9 *.9 * .9, or roughly 65% secure."
    status: "candidate"
    work_item: "WI-293"
  - id: "REQ-DODCIO-DEVSECOPS-0033"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 14, "anchor": "Digital Platform Capabilities include the distinct development environments of the software factory,"}
    kind: "should"
    locator: "3.1.2"
    context: "Figure 2: Software Capabilities of a Software Factory"
    statement: "Digital Platform Capabilities include the distinct development environments of the software factory, its CI/CD pipelines, a clearly implemented log aggregation and analysis strategy, and continuous monitoring operations. These capabilities should support multi-tenancy, enforce separation of duties for privileged users, and be considered part of the cyber survivability supply chain of the final software artifacts produced."
    status: "candidate"
    work_item: "WI-293"
  - id: "REQ-DODCIO-DEVSECOPS-0034"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 14, "anchor": "The set of environments within this capability set rely upon CI/CD pipelines,"}
    kind: "should"
    locator: "3.1.2"
    context: "Figure 2: Software Capabilities of a Software Factory"
    statement: "The set of environments within this capability set rely upon CI/CD pipelines, each equipped with a purpose-driven set of tools and process workflows. The environmental boundaries are heavily automated with strict gates controlling promotion of software artifacts from development to test, and from test to integration. These capabilities also encompass planning and backlog functionality, configuration management (CM) repositories, and local and released artifact repositories. Access control for privileged users is expected to follow an environment-wide least privilege access model. Continuous monitoring assesses the state of compliance for all resources and services evaluated against NIST SP 800-53 controls. Reference NIST Special Publication 800-137, Information Security Continuous Monitoring (ISCM) for Federal Information Systems and Organizations and (CUI) DoD Information Security Continuous Monitoring Strategy for more information."
    status: "candidate"
    work_item: "WI-292"
