  - id: "REQ-DODCIO-DEVSECOPS-0064"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 22, "anchor": "minimum viable capability release (MVCR) if the MVP does not have sufficient"}
    kind: "table"
    locator: "3.2.1"
    context: "Plan"
    statement: "minimum viable capability release (MVCR) if the MVP does not have sufficient capability or performance to deploy into operations.2"
    status: "deferred"
    reason: "Governs the MVCR, a delivery scope. 'The PM and the sponsor should also define' it when the MVP cannot deploy, and defining it is acquisition substance; DODI5000.87 0111 keeps only the fielding event live, on swp-gate-map, and no RMF run reads this definition. Basis: engineering process modelled at its RMF touchpoints."
  - id: "REQ-DODCIO-DEVSECOPS-0065"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 22, "anchor": "The CI feedback loop iterates across the Develop, Build, and Test phases"}
    kind: "modal"
    locator: "3.2.2"
    context: "Continuous Integration"
    statement: "The CI feedback loop iterates across the Develop, Build, and Test phases of the DevSecOps lifecycle, depicted in Figure 7. If build doesn’t complete successfully, then the commit must be sent back to the submitting engineer to fix. Without a successful build, further steps are both illogical and impossible to complete. Common types of feedback between Develop and Build include a successful build by the build tool (because a broken build shouldn’t be merged into the main branch) and a pull request that creates the software equivalency of two-person integrity. The pull request performed is intended to evaluate the architecture and software structure, identify technical debt that the original engineer may (inadvertently) introduce if this commit is merged into the main branch, and most importantly, identify any glaring security risks and confusing code. Once the pull request is merged into the main branch, a complete series of automated tests are executed, including a full set of integration tests."
    status: "candidate"
    work_item: "WI-292"
  - id: "REQ-DODCIO-DEVSECOPS-0066"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 24, "anchor": "The Monitor and Feedback phases must bring together a deep, rich set"}
    kind: "modal"
    locator: "3.2.5"
    context: "Monitor/Feedback"
    statement: "The Monitor and Feedback phases must bring together a deep, rich set of real-time performance metrics and supporting data to continuously evaluate the totality of the software environment. These phases serve two main functions: cybersecurity monitoring to ensure events and incidents are handled in accordance with DoD mandates and policies and live data feedback and interaction between network defenders, end users, and developers. For cybersecurity, the antiquated snapshot view of network security is replaced with real time feeds, allowing security actions to be taken by local defenders, monitoring teams (Cybersecurity Service Providers (CSSPs)), incident response teams (Cyber Protection Teams (CPTs)), and Command and Control (C2) elements of U.S. Cyber Command/Joint Force Headquarters – DoD Information Network (JFHQ-DoDIN). For customer satisfaction, developers receive feedback regarding the operational effectiveness of the software release and its impact in meeting mission requirements. Some other monitoring activities include fault detection, log auditing, and value assessment."
    status: "candidate"
    work_item: "WI-290"
  - id: "REQ-DODCIO-DEVSECOPS-0067"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 25, "anchor": "A software factory consists of the technology and processes focused on the"}
    kind: "modal"
    locator: "3.3"
    context: "Integration with Other DoD Processes"
    statement: "A software factory consists of the technology and processes focused on the development and delivery of software capability and is only one of many processes in the Department that impact speed to delivery. Figure 10 depicts other DoD processes (not all inclusive) that must be integrated with the DevSecOps lifecycle to deliver better software faster to the warfighter. These processes include security, risk management framework, test and evaluation, and acquisition."
    status: "candidate"
    work_item: "WI-321"
  - id: "REQ-DODCIO-DEVSECOPS-0068"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 25, "anchor": "The security inherent within DevSecOps is achieved through a fundamental change in"}
    kind: "modal"
    locator: "3.3.1"
    context: "Security"
    statement: "The security inherent within DevSecOps is achieved through a fundamental change in the culture and approach to cybersecurity and testing. Security is continuously shifted left and integrated throughout the software artifacts from the beginning. As software is developed, the development teams use secure coding techniques and practices while the pipeline includes control gates and guardrails that evaluate code for discrepancies and vulnerabilities before sending it to production. Additionally, security practices continue through deployment and into production. Repositories are scanned and software updated when new vulnerabilities are found, and continuous monitoring in production helps identify operational vulnerabilities and insider threat incidents. One can see that security spans the full lifecycle, whether during development, deployment, or production. Assessments, testing, documentation, detection, mitigation, and remediation are also required to provide the most secure operational capability possible."
    status: "candidate"
    work_item: "WI-288"
  - id: "REQ-DODCIO-DEVSECOPS-0069"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 26, "anchor": "This approach differs from the view that cybersecurity can simply be a"}
    kind: "modal"
    locator: "3.3.1"
    context: "Figure 11: DevSecOps Integrated with Security"
    statement: "This approach differs from the view that cybersecurity can simply be a bolt-on activity after the software is built and deployed into production. When security problems are identified in production software, they almost always require the software development team to (re-)write code to fix the problem. DevSecOps is only fully realized when security and functional capabilities are built, tested, and monitored at each step of the lifecycle, preventing security and functional problems from reaching production in the first place."
    status: "not-a-requirement"
    reason: "Contrast with bolt-on security. Problems in production 'require the software development team to (re-)write code' is an observation of cost, and 'only fully realized when' is a definition of success. Neither binds a team."
  - id: "REQ-DODCIO-DEVSECOPS-0070"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 26, "anchor": "DevSecOps software factories and platforms must adopt zero trust as the target"}
    kind: "modal"
    locator: "3.3.1.1"
    context: "Zero Trust"
    statement: "DevSecOps software factories and platforms must adopt zero trust as the target security model for cybersecurity. Teams should consistently strive to bake in as many of the zero trust principles as are supported by their architecture across each of the ten phases of the DevSecOps lifecycle. Further, DevSecOps teams must fully consider security from both the end user perspective and all non-person entities (NPEs). To illustrate several of these concepts in a notional list, these NPEs include servers, the mutual transport layer security (mTLS) between well-defined services relying on Federal Information Processing Standard (FIPS) compliant cryptography, adoption of deny by default postures, and an understanding of how all traffic, both north-south and east-west, is protected throughout the system’s architecture."
    status: "candidate"
    work_item: "WI-292"
  - id: "REQ-DODCIO-DEVSECOPS-0071"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 27, "anchor": "The Risk Management Framework (RMF) is the framework DoD uses to ensure"}
    kind: "modal"
    locator: "3.3.1.2"
    context: "Risk Management Framework"
    statement: "The Risk Management Framework (RMF) is the framework DoD uses to ensure all IT systems and applications are “cyber” secure. RMF provides a disciplined and structured, yet flexible process for managing security. The six-step process is designed to develop strong cybersecurity through proper categorization, vulnerability identification and mitigation, assessment, and monitoring of systems and software. RMF includes activities to prepare organizations to execute the framework at organizationally defined risk management levels. RMF is the key component of the process used to authorize systems, applications, and networks. An AO will review the output from a risk management evaluation of security controls and system configuration information to determine the residual risk associated with a system, application, or network. For DevSecOps software factories and platforms, the AO must include the people, processes, and technology used to develop software in their analysis. Most authorizations will provide a one-, two-, or three-year authorization based on the level of residual risk. A reauthorization must take place at the end of the original authorization."
    status: "candidate"
    work_item: "WI-08"
  - id: "REQ-DODCIO-DEVSECOPS-0072"
