  - id: "REQ-DODCIO-DEVSECOPS-0010"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 9, "anchor": "DevSecOps emphasizes collaboration across these disciplines, along with automation and continuous monitoring"}
    kind: "modal"
    locator: "2.1"
    context: "Definition"
    statement: "DevSecOps emphasizes collaboration across these disciplines, along with automation and continuous monitoring to support the delivery of secure, high-quality software. DevSecOps integrates security tools and practices into the development pipeline, emphasizes the automation of processes, and fosters a culture of shared responsibility for performance, security, and operational integrity throughout the entire software lifecycle, from development to deployment and beyond. Figure 1 visually depicts the DevSecOps lifecycle as an iterative infinity loop divided into ten distinct phases."
    status: "not-a-requirement"
    reason: "Second half of the definition of DevSecOps: what it emphasizes, integrates and fosters, then a pointer to Figure 1. 'Shared responsibility' names a culture the method fosters and assigns no responsibility to anyone."
  - id: "REQ-DODCIO-DEVSECOPS-0011"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 9, "anchor": "DevSecOps is iterative by design, recognizing that software is never done. The"}
    kind: "indicative"
    locator: "2.1"
    context: "Definition"
    statement: "DevSecOps is iterative by design, recognizing that software is never done. The serial-style delivery of the waterfall process is replaced with small, frequent deliveries that make it easier to change course as necessary. Each small delivery is accomplished through a fully automated process or semi-automated process with minimal human intervention to accelerate continuous integration and continuous deployment. This lifecycle is adaptable and includes numerous feedback loops that drive continuous process improvements."
    status: "not-a-requirement"
    reason: "Describes the iterative model: small deliveries replace serial ones. 'Is accomplished through' tells how delivery works, and a semi-automated process qualifies, so nothing is required of a team."
  - id: "REQ-DODCIO-DEVSECOPS-0012"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 9, "anchor": "The DevSecOps lifecycle consists of ten phases. The ten phases group common"}
    kind: "indicative"
    locator: "2.2"
    context: "DevSecOps Lifecycle"
    statement: "The DevSecOps lifecycle consists of ten phases. The ten phases group common activities and any quality gates that occur at that point in the lifecycle and proceed in a cyclical manner with the result of a cycle being a software product release. A software product release is an iteration of the product that includes new functionality, performance enhancements, and/or security improvements. Each cycle builds upon the results of previous cycles. The duration of the cycle is determined by the mission owner in response to the needs of the stakeholders. Some phase activities may start in one phase and continue throughout additional phases of the lifecycle. The ten phases are defined below with specific activities for each phase enumerated in the DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools.1"
    status: "deferred"
    reason: "Governs release cadence: 'The duration of the cycle is determined by the mission owner'. That is delivery planning. A run authorizes per release under PW-SWP but neither reads nor produces the cycle length. Basis: engineering process modelled at its RMF touchpoints."
