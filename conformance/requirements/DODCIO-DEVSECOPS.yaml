  - id: "REQ-DODCIO-DEVSECOPS-0076"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 28, "anchor": "Each group consists of numerous activities/practices that software factories should follow to"}
    kind: "should"
    locator: "3.3.1.2"
    context: "Risk Management Framework"
    statement: "Each group consists of numerous activities/practices that software factories should follow to ensure the software supply chain is secure and software delivered is safe. Following such practices should help software producers reduce the number of vulnerabilities in released software, reduce the potential impact of the exploitation of undetected or unaddressed vulnerabilities, and address the root causes of vulnerabilities to prevent future recurrences."
    status: "candidate"
    work_item: "WI-96"
  - id: "REQ-DODCIO-DEVSECOPS-0077"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 28, "anchor": "A DevSecOps platform and its software factories must complete an authorization. Once"}
    kind: "modal"
    locator: "3.3.1.2"
    context: "Risk Management Framework"
    statement: "A DevSecOps platform and its software factories must complete an authorization. Once an authorization is approved, the DevSecOps platform and its software factories can expedite future authorization activities and processes by obtaining a cATO. cATO moves away from a control assessment point-in-time document-based approach (though some documents are still required) towards a continuous risk determination and authorization concept by continuously assessing, monitoring, and managing risk. cATO raises the security standard over a traditional Authorization to Operate (ATO) and provides the ability to deploy updated software more rapidly while improving security. cATO includes the need for a Secure Software Supply Chain (SSSC) and requires a Software Bill of Materials (SBOM). Further information about cATO is available in the DevSecOps Continuous Authorization Implementation Guide.5"
    status: "candidate"
    work_item: "WI-296"
  - id: "REQ-DODCIO-DEVSECOPS-0078"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 28, "anchor": "While the DevSecOps lifecycle includes a phase named “Test,” there are testing"}
    kind: "indicative"
    locator: "3.3.2"
    context: "Test and Evaluation"
    statement: "While the DevSecOps lifecycle includes a phase named “Test,” there are testing activities throughout the lifecycle, whether by securing the software supply chain or by adopting practices in alignment with NIST SP 800-218. These testing activities are identified in Figure 12 and were developed in coordination with the Operational Test and Evaluation (OT&E) and the Developmental Test and Evaluation (DT&E) organizations and the Joint Interoperability Test Command (JITC). At a high level, the two categories of testing are Functional Testing and Security Testing. The DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools contains more details about the different tests to include throughout the lifecycle and maps the tests to the SSDF."
    status: "not-a-requirement"
    reason: "Overview of testing: where it occurs, who the activities were coordinated with, the two categories, and a pointer to the guidebook. Past tense and description."
  - id: "REQ-DODCIO-DEVSECOPS-0079"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 28, "anchor": "Functional Testing: Functional testing is essential to DevSecOps, as it ensures that"}
    kind: "should"
    locator: "3.3.2"
    context: "Test and Evaluation"
    statement: "Functional Testing: Functional testing is essential to DevSecOps, as it ensures that each product increment functions as intended. Integrated into the CI/CD pipeline, functional testing validates the behavior of individual components, modules, and the entire system, simulating real-world scenarios to confirm correct operation under various conditions. Tailoring the DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools to each mission could result in additional testing activities."
    status: "not-a-requirement"
    reason: "Says functional testing 'is essential' to DevSecOps and what it validates. A claim of value about product behavior, with no actor; 'could result in additional testing' is a possibility. Security testing is what a run reads, at 0154."
