    context: ""
    statement: "Adoption of DevSecOps and its methodologies and technical tools must be likened to a marathon, not a sprint. In more direct terms, comprehension of this document’s material is the starting point, not the destination. Practitioners must demonstrate an insatiable thirst for knowledge to accept constructive criticism from their teammates, and indirectly from their individual and team performance metrics. Continuous improvement is just that – continuous. Keep your journey going and review these materials next at https://dodcio.defense.gov/library/"
    status: "not-a-requirement"
    reason: "Closing exhortation. 'Must be likened to a marathon' is a figure of speech, and 'must demonstrate an insatiable thirst for knowledge' is encouragement to readers, so neither must binds a role or can be shown."
  - id: "REQ-DODCIO-DEVSECOPS-0150"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 37, "anchor": "DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools"}
    kind: "lettered"
