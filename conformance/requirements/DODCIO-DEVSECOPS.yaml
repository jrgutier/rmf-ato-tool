  - id: "REQ-DODCIO-DEVSECOPS-0037"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 15, "anchor": "The development environment contains the rawest form of source code. When a"}
    kind: "modal"
    locator: "3.1.2"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment"
    statement: "The development environment contains the rawest form of source code. When a developer looks to merge their completed work into the main branch of the code repository, they encounter a control gate. As an example of this, if code is successfully compiled, it will forward with a pull/merge request for peer review, which includes a critical security step that is the software code equivalent of two-person integrity. If the peer review identifies security flaws, architectural concerns, a lack of appropriate documentation within the code itself, or other problems, the merge request can be rejected, and the code sent back to the software developer for rework. Once the merge request is approved and any other activities such as unit tests are completed, the continuous integration step is triggered."
    status: "not-a-requirement"
    reason: "Walk-through of the development environment. 'As an example of this', code 'will forward' to peer review; 'will' narrates what happens to code in the example, and 'can be rejected' is what a reviewer is able to do. Gates bind at 0047 and 0065."
  - id: "REQ-DODCIO-DEVSECOPS-0038"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 15, "anchor": "Once the code and artifact(s) reach the integration environment, the continuous deployment"}
    kind: "indicative"
    locator: "3.1.2"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment"
    statement: "Once the code and artifact(s) reach the integration environment, the continuous deployment (CD) assembly line is triggered. More tests and security scans are performed in this environment, including operational and performance tests, user acceptance tests, and additional security compliance scans."
    status: "not-a-requirement"
    reason: "Continues the walk-through at the integration environment: the CD line is triggered and more scans 'are performed'. Narrative of a generic factory, whose opening lines on p. 15 say 'ideal or very mature'."
  - id: "REQ-DODCIO-DEVSECOPS-0039"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "Released is never equivalent to Deployed! This is a source of confusion"}
    kind: "modal"
    locator: "3.1.2"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment"
    statement: "Released is never equivalent to Deployed! This is a source of confusion for many. A released artifact is available for deployment. Deployment may or may not occur instantly. A laptop that is powered off when a security patch is pushed into production will not immediately receive the artifact. Larger updates or out-of-cycle refreshes like anti-virus definition refreshes often require the user to initiate. The deployment occurs later. While this is a trivialized example, it effectively illustrates that released is never equivalent to deployed."
    status: "not-a-requirement"
    reason: "Explains why released does not mean deployed, with a laptop example. 'Require the user to initiate' describes larger updates, not a duty on the user, 'will not immediately receive' is the example, and 'may or may not occur instantly' says deployment is not simultaneous."
  - id: "REQ-DODCIO-DEVSECOPS-0040"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "Continuous Deployment, covered next. These are related but different concepts. This document"}
    kind: "table"
    locator: "3.1.2"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment"
    statement: "Continuous Deployment, covered next. These are related but different concepts. This document will use CD to mean continuous deployment. In this document, Continuous Delivery is a software development practice that allows frequent releases of value to staging or various test environments once verified by automated testing. Continuous Deployment relies on a manual decision to deploy to production, though the deployment process itself should be automated."
    status: "candidate"
    work_item: "WI-96"
  - id: "REQ-DODCIO-DEVSECOPS-0041"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "DoD needs multiple software factories tuned for specific types of software systems,"}
    kind: "modal"
    locator: "3.1.2"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment"
    statement: "DoD needs multiple software factories tuned for specific types of software systems, such as web applications or embedded systems that may include significant amounts of HWIL for automated testing. It also requires software factories operating at varying classification levels in both cloud and on-premises or disconnected environments."
    status: "not-a-requirement"
    reason: "States what the Department wants of software factories as a whole: 'DoD needs' several kinds and 'requires' them at varying classification levels. A view of the enterprise, with no office named and nothing a factory or system does."
  - id: "REQ-DODCIO-DEVSECOPS-0042"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "Under the shift to a cATO, each software factory will have its"}
    kind: "modal"
    locator: "3.1.2"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment"
    statement: "Under the shift to a cATO, each software factory will have its processes, teams, and storage reviewed, certified, and continuously monitored to allow them to deploy applications into a continuously monitored system. This shift greatly lessens the initial burden of achieving an ATO for each piece of software, as the process and roll out are certified and fed into a continuous monitoring architecture."
    status: "candidate"
    work_item: "WI-287"
  - id: "REQ-DODCIO-DEVSECOPS-0043"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "Standardization: Establishes standardized practices, processes, and tools for software development. It promotes"}
    kind: "lettered"
    locator: "3.1.2.1"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "1. Standardization: Establishes standardized practices, processes, and tools for software development. It promotes consistency and reduces variability, allowing product teams to work more efficiently and effectively."
    status: "not-a-requirement"
    reason: "Advisory: first attribute under 'An ideal DevSecOps software factory does the following', standardized tools and processes. The word ideal makes these attributes to aim at, not a minimum."
  - id: "REQ-DODCIO-DEVSECOPS-0044"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "Automation: Automates various activities of the software development lifecycle, including code compilation,"}
    kind: "lettered"
    locator: "3.1.2.2"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "2. Automation: Automates various activities of the software development lifecycle, including code compilation, testing, and deployment. This automation reduces manual effort, minimizes errors, and accelerates the delivery of software updates."
    status: "not-a-requirement"
    reason: "Advisory: the ideal factory's automation of compile, test and deploy. Its benefits take up the second sentence; no minimum is set."
  - id: "REQ-DODCIO-DEVSECOPS-0045"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "CI/CD: Provides continuous integration and deployment, allowing developers to frequently integrate their"}
    kind: "lettered"
    locator: "3.1.2.3"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "3. CI/CD: Provides continuous integration and deployment, allowing developers to frequently integrate their code changes and deliver software updates in an automated and reliable manner. It moves Developmental and Operational Test and Evaluation activities earlier in the CI/CD pipelines instead of bolted on at the end, facilitating more rapid feedback to the development teams. This promotes agility, collaboration, and faster time-to-market."
    status: "not-a-requirement"
    reason: "Advisory: an ideal factory moves DT&E and OT&E earlier in the pipeline. An attribute, not a rule on test events; what test results reach a run is software-te-evidence."
  - id: "REQ-DODCIO-DEVSECOPS-0046"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "Scalability and Flexibility: Scales and adapts to the needs of the organization."}
    kind: "lettered"
    locator: "3.1.2.4"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "4. Scalability and Flexibility: Scales and adapts to the needs of the organization. It must be designed for multi-tenancy and accommodate different types of applications, technologies, and deployment environments, including on-premises, cloud, and hybrid infrastructures."
    status: "candidate"
    work_item: "WI-293"
  - id: "REQ-DODCIO-DEVSECOPS-0047"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 16, "anchor": "Security and Compliance: Incorporates security practices throughout the development and delivery process."}
    kind: "lettered"
    locator: "3.1.2.5"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "5. Security and Compliance: Incorporates security practices throughout the development and delivery process. It provides a dynamically scalable set of pipelines with three distinct cyber survivability control gates and integrates security scanning tools, vulnerability assessments, and compliance checks to identify and address security issues early on. This helps ensure that software products meet security standards and regulatory requirements and provides assurance as an AO that functional, security, integration, operational, and all other tests are reliably performed and passed prior to formal release and delivery."
    status: "candidate"
    work_item: "WI-292"
  - id: "REQ-DODCIO-DEVSECOPS-0048"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 17, "anchor": "Collaboration and Communication: Fosters collaboration and communication among teams, enabling them to"}
    kind: "lettered"
    locator: "3.1.2.6"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "6. Collaboration and Communication: Fosters collaboration and communication among teams, enabling them to work together seamlessly. It provides shared repositories, issue tracking systems, and collaboration tools to facilitate teamwork and information sharing."
    status: "not-a-requirement"
    reason: "Advisory: the ideal factory fosters collaboration through shared repositories and issue tracking. Team convenience, with no minimum set."
  - id: "REQ-DODCIO-DEVSECOPS-0049"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 17, "anchor": "Continuous Improvement: Promotes a culture of continuous improvement by collecting metrics, analyzing"}
    kind: "lettered"
    locator: "3.1.2.7"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "7. Continuous Improvement: Promotes a culture of continuous improvement by collecting metrics, analyzing performance, and identifying areas for enhancement. It enables teams to learn from past experiences, iterate on processes, and drive ongoing optimization."
    status: "not-a-requirement"
    reason: "Advisory: the ideal factory promotes improvement by collecting metrics and analyzing performance. Metrics that bind are 0066."
  - id: "REQ-DODCIO-DEVSECOPS-0050"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 17, "anchor": "Every DoD organization is encouraged to seek out an existing managed PaaS"}
    kind: "should"
    locator: "3.1.2.7"
    context: "Figure 4: Generic Software Factory with a Separate Production Environment An ideal DevSecOps software factory does the following:"
    statement: "Every DoD organization is encouraged to seek out an existing managed PaaS to learn about and begin applying DevSecOps."
    status: "not-a-requirement"
    reason: "Advisory. 'Encouraged to seek out' an existing PaaS, in order to 'learn about and begin applying' DevSecOps, is an invitation to get started, on the order of 'organizations may'."
  - id: "REQ-DODCIO-DEVSECOPS-0051"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 17, "anchor": "A DevSecOps platform is defined as a group of resources and capabilities"}
    kind: "indicative"
    locator: "3.1.3"
    context: "DevSecOps Platform"
    statement: "A DevSecOps platform is defined as a group of resources and capabilities that form a base upon which other capabilities or services are built and operated within the same technical framework. It provides a comprehensive set of common tools, services, and infrastructure to support the implementation and execution of DevSecOps practices within an organization and serves as a centralized hub for managing and automating various phases of the software development lifecycle, with a strong focus on security. It can be a multi-tenant environment that brings together a significant portion of a software supply chain, operating under cATO or a provisional ATO. Each DevSecOps platform may be composed of multiple software factories, multiple environments, multiple tools, and numerous cyber resiliency tools and techniques."
    status: "not-a-requirement"
    reason: "Definition of a DevSecOps platform and what it may hold. 'Operating under cATO or a provisional ATO' says how one can run, and sets no condition."
  - id: "REQ-DODCIO-DEVSECOPS-0052"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 18, "anchor": "DevSecOps platforms provide rapid access to common software development infrastructure capabilities for"}
    kind: "should"
    locator: "3.1.3"
    context: "Figure 5: DevSecOps Platform"
    statement: "DevSecOps platforms provide rapid access to common software development infrastructure capabilities for use by a DevSecOps team. DevSecOps platforms employ automation at multiple levels and across multiple activities in the develop, build, test, release, and deliver phases of the DevSecOps lifecycle. Each environment in the process is automated to the maximum extent that is safely and securely possible, rehydrated using Infrastructure as Code (IaC) and Configuration as Code (CaC) that run on various tools. DevSecOps platforms are expected to be instantiated from hardened IaC code and scripts or DoD hardened containers from a DoD artifact repository like Iron Bank, a hardened container image repository and one of Platform One’s value streams."
    status: "candidate"
    work_item: "WI-292"
  - id: "REQ-DODCIO-DEVSECOPS-0053"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 18, "anchor": "Platforms are necessary to implement software delivery through DevSecOps. DevSecOps platforms represent"}
    kind: "should"
    locator: "3.1.3"
    context: "Figure 5: DevSecOps Platform"
    statement: "Platforms are necessary to implement software delivery through DevSecOps. DevSecOps platforms represent a prime opportunity for the DoD software community to leverage reuse in the underlying infrastructure. DoD organizations are encouraged to leverage government-managed and curated platforms, such as Platform One’s tailorable Big Bang platform, and contribute modifications back to the baseline to provide the DoD-enterprise with a growing set of pre-configured integrations."
    status: "not-a-requirement"
    reason: "Advisory. 'Encouraged to leverage' Platform One and to contribute back is an invitation, an 'organizations may'; 'are necessary' repeats the means-to-end claim of 0025. Needing an approved platform for a cATO binds through WI-24 at 0029 and 0077."
  - id: "REQ-DODCIO-DEVSECOPS-0054"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 19, "anchor": "It is within each CI/CD pipeline that the software supply chain is"}
    kind: "modal"
    locator: "3.1.4"
    context: "CI/CD Pipelines"
    statement: "It is within each CI/CD pipeline that the software supply chain is actualized. Per NIST SP 800-204D, “Strategies for the Integration of Software Supply Chain Security in DevSecOps CI/CD Pipelines,” a software supply chain must not be reduced to merely a set of artifacts. Every software supply chain must explicitly address every link that exists between writing source code through production deployment:"
    status: "candidate"
    work_item: "WI-96"
  - id: "REQ-DODCIO-DEVSECOPS-0055"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 19, "anchor": "“While software composition (e.g., dependency management) is under the purview of software"}
    kind: "indicative"
    locator: "3.1.4"
    context: "CI/CD Pipelines Every software supply chain must explicitly address every link that exists between writing source code through production deployment:"
    statement: "“While software composition (e.g., dependency management) is under the purview of software supply chain activities, other often overlooked activities are central to the software supply chain. This includes writing source code; building, packaging, and delivering an application; and repackaging and containerization.”"
    status: "not-a-requirement"
    reason: "Quotation that ends 0054's colon, saying which activities count as supply chain activities. Describing item under a lead-in that holds the duty; 0054 is live."
  - id: "REQ-DODCIO-DEVSECOPS-0056"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 20, "anchor": "The shift to immutable infrastructure using IaC provides security and value in"}
    kind: "modal"
    locator: "3.1.5"
    context: "Infrastructure as Code (IaC)"
    statement: "The shift to immutable infrastructure using IaC provides security and value in a number of ways. First, it removes lethargic and error-prone step-by-step deployment and configuration guides performed manually. In a legacy, manual driven approach, it is too easy to inadvertently skip a step or mistype a configuration command. Second, it confirms that the command will execute as expected, mitigating the risk of a change without any type of peer review before execution. Third, by providing a standard deployment model, a standard set of outputs can be auto-ingested into Defensive Cyber Operations (DCO) platforms and data collection/visualization mediums. This allows DCO to begin instantaneously and provides data analytics to identify necessary next innovations."
    status: "not-a-requirement"
    reason: "Lists the benefits of immutable infrastructure, first, second and third. 'Can be auto-ingested' is a benefit, 'will execute as expected' is what IaC confirms about a command, and nothing is asked of a team. Reliance on IaC binds at 0052."
  - id: "REQ-DODCIO-DEVSECOPS-0057"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 20, "anchor": "DoD provides approved IaC templates for use across DoD Components at https://www.hacc.mil/Portfolio/DOD-Cloud-IaC/."}
    kind: "modal"
    locator: "3.1.5"
    context: "Infrastructure as Code (IaC)"
    statement: "DoD provides approved IaC templates for use across DoD Components at https://www.hacc.mil/Portfolio/DOD-Cloud-IaC/. DoD IaCs leverage automation to generate preconfigured, preauthorized PaaS focused environments. These baselines exist in the form of IaC templates that organizations can deploy to establish their own decentralized cloud platform. Baselines significantly reduce mission owner security responsibilities by leveraging security control inheritance from CSP PaaS managed services, where host and middleware security is the responsibility of the CSP including hardening and patching. Each baseline documents its associated inheritable controls to expedite the Assessment and Authorization (A&A) process. DoD IaC baselines can be built into DevSecOps pipelines to rapidly deploy the entire environment and mission applications."
    status: "not-a-requirement"
    reason: "Describes what DoD offers: IaC templates, available 'for use'. 'Is the responsibility of the CSP' and the reduced 'mission owner security responsibilities' state what such a baseline shifts to the provider, an explanation of inheritance that binds no one here; a run's shared responsibility is in ART-SSP '## Inheritance and shared responsibility'."
  - id: "REQ-DODCIO-DEVSECOPS-0058"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 20, "anchor": "Every DevSecOps software factory and platform must include a minimal set of"}
    kind: "modal"
    locator: "3.1.6"
    context: "Common Tools"
    statement: "Every DevSecOps software factory and platform must include a minimal set of common tooling. The use of the word common is indicative of a class of tooling; it does not, nor should it be construed that the same tool must be used across every implementation."
    status: "candidate"
    work_item: "WI-295"
  - id: "REQ-DODCIO-DEVSECOPS-0059"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 21, "anchor": "Feedback loops are critical mechanisms that overlap with specific DevSecOps lifecycle phases."}
    kind: "should"
    locator: "3.2"
    context: "DevSecOps Lifecycle Process"
    statement: "Feedback loops are critical mechanisms that overlap with specific DevSecOps lifecycle phases. Each feedback loop is built upon transparency and speed. As an illustration, when a software developer commits code to a branch, a build is automatically triggered to confirm the code still builds correctly, and if it doesn’t, the developer is immediately notified of the problem."
    status: "not-a-requirement"
    reason: "Explains feedback loops, then 'As an illustration' shows a build trigger. Calling them critical mechanisms ('are critical') describes them; no one is told to build one here."
  - id: "REQ-DODCIO-DEVSECOPS-0060"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 21, "anchor": "the DevSecOps lifecycle. These activities may include business-need assessment, plan creation, and"}
    kind: "table"
    locator: "3.2.1"
    context: "Plan"
    statement: "the DevSecOps lifecycle. These activities may include business-need assessment, plan creation, and"
    status: "not-a-requirement"
