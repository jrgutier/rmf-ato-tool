    work_item: "WI-289"
  - id: "REQ-DODCIO-DEVSECOPS-0073"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 27, "anchor": "Continuous Monitoring: Per NIST SP 800-137.26, “Information Security Continuous Monitoring (ISCM) for"}
    kind: "lettered"
