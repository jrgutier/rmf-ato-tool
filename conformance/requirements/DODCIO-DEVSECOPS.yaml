    locator: "3.3.1.2.•"
    context: "Risk Management Framework"
    statement: "• Secure Software Supply Chain: NIST 800-218, “Secure Software Development Framework (SSDF),” describes a set of fundamental, secure software development practices that can be integrated into each software development lifecycle implementation. The software development practices are organized into four groups:"
