    context: "Risk Management Framework"
    statement: "• Continuous Monitoring: Per NIST SP 800-137.26, “Information Security Continuous Monitoring (ISCM) for Federal Information Systems and Organizations,” ISCM is defined as maintaining ongoing awareness of information security, vulnerabilities, and threats to support organizational risk management decisions."
    status: "not-a-requirement"
    reason: "Defines ISCM, quoting SP 800-137. 'ISCM is defined as' and nothing more; the source prints 'SP 800-137.26'."
  - id: "REQ-DODCIO-DEVSECOPS-0074"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 27, "anchor": "Active Cyber Defense: ISCM, as a component of active cyber defense, includes"}
    kind: "lettered"
    locator: "3.3.1.2.•"
    context: "Risk Management Framework"
    statement: "• Active Cyber Defense: ISCM, as a component of active cyber defense, includes an integrated auditing and incident response capability with predefined triggers and thresholds that can be displayed on an interactive dashboard. Continuously monitoring a DevSecOps platform and its software factories requires the ability to continually evaluate and assess security controls, gates, guardrails, and operating conditions for software either in development or operations. The outcome of this monitoring ensures the effectiveness of security control implementation, verifies compliance with organizational and federal security requirements, and provides the AO information on the residual risk associated with the development and operations of the platform and software. This is a critical component to maintaining a cATO."
    status: "candidate"
    work_item: "WI-286"
  - id: "REQ-DODCIO-DEVSECOPS-0075"
