  - id: "REQ-DODCIO-DEVSECOPS-0151"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 7, "anchor": "The Department of Defense is on a multi-year journey to fundamentally transform"}
    kind: "should"
    locator: "1 Introduction"
    context: ""
    statement: "The Department of Defense is on a multi-year journey to fundamentally transform how software is built, used, and managed across all aspects of the DOD enterprise. This includes business systems, weapons systems, embedded software, and essential command and control and warfighting support systems. This transformation is essential to maintain the technology advantage that underpins US military capability. The DoD Enterprise DevSecOps Fundamentals recognizes the importance of software. This document is an educational compendium of DevSecOps concepts and is intended to promote the adoption of modern software practices across the Department. Additional information is captured in corresponding guidance available at https://dodcio.defense.gov/library/."
    status: "not-a-requirement"
    reason: "Opening background. 'Is essential' is the document's view of why transformation matters, naming no actor, and it calls itself 'an educational compendium', so nothing in the paragraph binds."
  - id: "REQ-DODCIO-DEVSECOPS-0152"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 19, "anchor": "As an actor initiates a series of steps within a CI/CD pipeline,"}
    kind: "promoted"
    locator: "3.1.4"
    context: ""
    statement: "As an actor initiates a series of steps within a CI/CD pipeline, resources and input artifacts are consumed, and one or more final artifacts result. It is crucial to monitor each step, or link, in the software supply chain across every segment of the CI/CD pipeline. This monitoring involves collecting and analyzing comprehensive metadata at each stage, providing visibility into the entire process. Effective observability allows teams to track the flow of data, identify potential bottlenecks, and ensure that each step is executed correctly and securely."
    status: "candidate"
    work_item: "WI-288"
    promoted: {"reason": "Rejected as no-marker though 'It is crucial to monitor each step, or link' states the duty; the extractor's pattern needs 'is critical' or 'is essential', and 'crucial' is neither."}
  - id: "REQ-DODCIO-DEVSECOPS-0153"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 20, "anchor": "The DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools provides a clean set"}
    kind: "promoted"
    locator: "3.1.6"
    context: ""
    statement: "The DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools provides a clean set of tables that captures both required and preferred tooling across DevSecOps lifecycle phase activities. DoD approved reference designs augment the DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools, adding in its environmentally specific required and preferred tooling. Reference designs do not remove a required tool or activity, only augment. The DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools and DoD approved reference designs are available at https://dodcio.defense.gov/Library/."
    status: "candidate"
    work_item: "WI-295"
    promoted: {"reason": "Rejected as no-marker. Says what 'required' tooling is and that a reference design only adds to it, which sets the floor of the 'must include a minimal set of common tooling' at REQ-DODCIO-DEVSECOPS-0058."}
  - id: "REQ-DODCIO-DEVSECOPS-0154"
    citation: {"ref": "DODCIO-DEVSECOPS", "page": 25, "anchor": "Figure 11 identifies security activities that occur throughout the DevSecOps lifecycle. These"}
    kind: "promoted"
    locator: "3.3.1"
    context: ""
    statement: "Figure 11 identifies security activities that occur throughout the DevSecOps lifecycle. These are not all inclusive. Each shield surrounding the DevSecOps lifecycle represents a distinct category of cybersecurity testing and activities. This blanket of protection is intentionally depicted surrounding the ten phases because these tests must permeate throughout the lifecycle to achieve benefits. Failure to weave security and functional testing into just one of the ten phases can create a risk of exposure, or worse, compromise, in the final product."
    status: "candidate"
    work_item: "WI-292"
    promoted: {"reason": "Rejected as not-a-statement because the paragraph opens on a figure reference, yet it says 'these tests must permeate throughout the lifecycle to achieve benefits'."}
