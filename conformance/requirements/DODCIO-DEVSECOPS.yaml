  - {"page": 7, "locator": "1 Introduction", "reason": "no-marker", "text": "Section 5.0: Getting Started"}
  - {"page": 7, "locator": "1 Introduction", "reason": "no-marker", "text": "Provides next steps and identifies additional resources to support a DevSecOps journey."}
  - {"page": 7, "locator": "1.1", "reason": "lead-in", "text": "The DoD Enterprise DevSecOps Fundamentals makes the following assumptions:"}
  - {"page": 9, "locator": "2.1", "reason": "no-marker", "text": "DevSecOps is a combination of software engineering methodologies, practices, and tools that unifies software development (Dev), security (Sec), and operations (Ops)."}
  - {"page": 10, "locator": "2.3", "reason": "no-marker", "text": "There are fundamental concepts associated with adopting DevSecOps. These concepts are described in Table 1 and are detailed in the sections that follow."}
  - {"page": 10, "locator": "2.3", "reason": "no-marker", "text": "DevSecOps Fundamentals Guidebook: DevSecOps Activities & Tools, May 2023. Available: https://dodcio.defense.gov/Portals/0/Documents/Library/DevSecOpsActivitesToolsGuidebookTables.pdf?ver=_Syl g1WJB9K0Jxb2XTvzDQ%3d%3d."}
  - {"page": 13, "locator": "3.1.1", "reason": "no-marker", "text": "DevSecOps aims to harness the collective expertise and knowledge across the entire software supply chain to mitigate risk at each step. Only then can the overall cyber survivability of the ecosystem significantly increase. To further illustrate this point, if a DevSecOps team only increases security 5%, raising each level from 90% to 95%, then overall cyber survivability security jumps from 65% to 81%."}
  - {"page": 13, "locator": "3.1.2", "reason": "no-marker", "text": "A software factory is a collection of people, tools, and processes that enables teams to continuously deliver value by deploying software to meet the needs of a specific community of end users. It leverages automation to replace manual processes. Software factories are strongly linked to one or more specific software supply chains but the software factory itself is not an entire software supply chain."}
  - {"page": 13, "locator": "3.1.2", "reason": "no-marker", "text": "A software factory provides a structured and repeatable approach to software development, enabling organizations to streamline their processes, improve efficiency, and ensure consistent quality across products. It consists of the full set of software capabilities depicted in Figure 2, which organizes the software capabilities under Infrastructure, Digital Platform, and Applications."}
  - {"page": 13, "locator": "3.1.2", "reason": "no-marker", "text": "Infrastructure Capabilities supply the hosting environment for the software factory, explicitly providing compute, storage, network resources, and additional CSP managed services to enable function, cybersecurity, and non-functional capabilities. Typically, this is either an approved or DoD provisionally authorized environment provided by a CSP but is not limited to a CSP."}
  - {"page": 14, "locator": "3.1.2", "reason": "no-marker", "text": "Application Capabilities include application frameworks, data stores such as relational or NoSQL databases and object stores, and other middleware unique to the application and outside the realm of the CI/CD pipeline."}
  - {"page": 14, "locator": "3.1.2", "reason": "not-a-statement", "text": "Figure 3 illustrates a generic software factory with multiple pipelines where the production environment is integrated within its defined security boundaries (e.g., software developed and delivered to a production environment within the boundaries of their DevSecOps platform). Figure 4 illustrates a second software factory use case where the production environment is external to the software factory security boundaries as defined in their Authorization to Operate (ATO) (e.g., software developed and delivered to a weapons system or afloat asset)."}
  - {"page": 15, "locator": "3.1.2", "reason": "no-marker", "text": "In an ideal or very mature software factory, Free and Open Source Software (FOSS), Commercial off the Shelf (COTS), Government off the Shelf (GOTS), and/or newly developed code and supporting scripts and configuration files are committed into the factory’s local artifact or code repository, respectively. Assembly line-like automation moves software changes from one phase to the next. When starting, a best practice is to migrate into a software factory while sustaining legacy capability."}
  - {"page": 15, "locator": "3.1.2", "reason": "no-marker", "text": "Continuous integration (CI) executes automated tests such as unit tests and Static Application Security Test (SAST), verifying the integrity of the work in the broader context of the artifact or application. The CI assembly line is solely responsible at this point for guiding the pipeline, including but not limited to dependency tracking, regression tests, code standards compliance, and pulling dependencies from the local artifact repository, as necessary. When the CI completes, the artifact is automatically promoted to the test environment."}
  - {"page": 15, "locator": "3.1.2", "reason": "no-marker", "text": "Usually, the test environment is where a more in-depth set of tests is executed. For example, hardware-in-the-loop (HWIL) tests or software-in-the-loop (SWIL) tests may occur at this point. In addition, the test environment pipeline performs additional or more in-depth testing variants of static code analysis, functional tests, interface tests, and dynamic code analysis. If these tests complete without error, then the artifact is poised to pass through another control gate into the integration environment or be sent back to the development team to fix any issues discovered during the automated testing."}
  - {"page": 16, "locator": "3.1.2", "reason": "no-marker", "text": "Once all tests complete without issue, the CD assembly line releases and delivers the final product package to the released artifact repository."}
  - {"page": 16, "locator": "3.1.2", "reason": "lead-in", "text": "An ideal DevSecOps software factory does the following:"}
  - {"page": 17, "locator": "3.1.2.7", "reason": "no-marker", "text": "DoD DevSecOps Platform and Software Factory Inventory (CAC-enabled)"}
  - {"page": 17, "locator": "3.1.2.7", "reason": "short", "text": "https://go.intelink.gov/ab7U5ad"}
  - {"page": 17, "locator": "3.1.3", "reason": "not-a-statement", "text": "Figure 5 illustrates a DevSecOps platform in support of a software factory. It identifies reference design interconnects which represent a unique set of tools and activities that exist within and/or at the boundaries between the digital platform capabilities. These unique toolsets or configurations to include proprietary tooling or specific architectural constructs connect various aspects of the DevSecOps platform together. Well-defined reference design interconnects as provided in DoD approved DevSecOps reference designs enable tailoring of the software factory design, while ensuring that core capabilities of the software factory remain intact."}
  - {"page": 18, "locator": "3.1.4", "reason": "no-marker", "text": "A critical part of a software factory are the Continuous Integration/Continuous Delivery (CI/CD) pipelines. The adoption of CI/CD pipelines reduce risk through the practice of making many small, incremental changes to software instead of one gigantic change. The incremental changes can be reviewed quickly. Mistakes that are introduced are easier to capture and isolate when only a few things have changed."}
  - {"page": 19, "locator": "3.1.4", "reason": "no-marker", "text": "As described previously, a software factory may contain multiple CI/CD pipelines which are equipped with a set of tools, process workflows, scripts, and environments, to produce a set of software deployable artifacts with minimal human intervention. It automates the activities in the develop, build, test, release, and deliver phases. Different pipelines are needed for different types of software such as web applications, business systems, command and control systems, embedded systems, or AI/ML."}
  - {"page": 19, "locator": "3.1.4", "reason": "no-marker", "text": "Activities in the CI/CD pipeline empower stronger communication between developers and information security personnel. The creation of shared context by and between development teams and information security teams enables security controls to be discussed and expectations established for each individual link across the totality of the CI/CD pipeline. Figure 6 illustrates a generic CI/CD pipeline."}
  - {"page": 20, "locator": "3.1.4", "reason": "no-marker", "text": "Observability goes beyond simple monitoring; it enables teams to gain deep insights into the performance, security, and reliability of the pipeline. By aggregating logs, metrics, and traces from each step, teams can quickly diagnose issues, ensure compliance with security policies, and optimize the pipeline for efficiency. This level of observability is especially important in environments that have received a cATO, where continuous monitoring capabilities are in place to maintain the security and integrity of the system."}
  - {"page": 20, "locator": "3.1.5", "reason": "no-marker", "text": "IaC plays a critical role in automation for DevSecOps platforms. For Platform teams, IaC streamlines infrastructure deployment, authorization, and security for customers leveraging cloud, shortening the time to stand up the typical infrastructure by months. IaC consists of baselines that automatically establish cloud environments in hours. It accelerates the authorization process with inheritable common controls and the use of PaaS services, which reduces the need for Security Technical Implementation Guides (STIGs), Assured Compliance Assessment Solution (ACAS), and Host-Based Security System (HBSS). If implemented correctly, it can shorten the deployment of networking, identity, and security policies for security compliance from the standard 30 weeks to hours."}
  - {"page": 21, "locator": "3.2", "reason": "not-a-statement", "text": "Figure 7 visually depicts the DevSecOps phases, feedback loops, and control gates. The lifecycle is built around a series of iterations, with each iteration covering the Plan, Develop, Build, Test, Release, Deliver, Deploy, Operate, Monitor, and Feedback phases. While some may view this graphic as a waterfall process, this graphic contains the identical set of steps depicted previously in Figure 1 as an infinite loop but is “unfolded” to effectively illustrate the multiplicity of continuous feedback loops. The unfolded loop better illustrates the relationship between the lifecycle phases and the continuous feedback loops used to drive continuous process improvement."}
  - {"page": 21, "locator": "3.2", "reason": "no-marker", "text": "The following sections address the importance of the iteration as well as each feedback loop and the value it adds to the software factory."}
  - {"page": 22, "locator": "3.2.1", "reason": "no-marker", "text": "Adaptive Acquisition Framework, DoDI 5000.87, Operation of the Software Acquisition Pathway. DoDI 5000.87 provides that the program manager (PM) and sponsor define a minimum viable product (MVP)"}
  - {"page": 22, "locator": "3.2.1", "reason": "no-marker", "text": "The plan phase repeats ahead of each iteration."}
  - {"page": 22, "locator": "3.2.2", "reason": "no-marker", "text": "According to Martin Fowler, CI practices occur when members of a team integrate their work frequently, usually each person integrates minimally daily, leading to multiple integrations per day verified by an automated build (including test) to detect integration errors as quickly as possible.3 If multiple teams (with possibly different contractors) are working on a larger, unified system, this means that the whole system is integrated frequently, ideally at least daily, avoiding long integration efforts after most development is complete."}
  - {"page": 22, "locator": "3.2.2", "reason": "no-marker", "text": "DoDI 5000.87, “Operation of the Software Acquisition Pathway”, https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodi/500087p.PDF, October 2, 2020"}
  - {"page": 23, "locator": "3.2.2", "reason": "no-marker", "text": "Execution of the automated test suite enhances software quality because it quickly identifies if/when a specific merge into the main branch fails to produce the excepted outcome, creates a regression, or breaks an API."}
  - {"page": 23, "locator": "3.2.3", "reason": "no-marker", "text": "The Continuous Delivery feedback loop iterates across the Release, Deliver, and Deploy phases of the DevSecOps lifecycle depicted in Figure 8."}
  - {"page": 23, "locator": "3.2.3", "reason": "no-marker", "text": "The most pertinent thing to understand is that release and deliver do not mean pushed into production. Continuous delivery acknowledges that a feature meets the Agile definition of “done.” The code has been written, peer reviewed, merged into the main branch, successfully passed its complete set of automated tests, and finally tagged with a version within the source code configuration management tool and deployed into an artifact repository."}
  - {"page": 23, "locator": "3.2.3", "reason": "no-marker", "text": "At this point, the feature and its related artifacts could be deployed but deployment is not mandatory. It is common to group together a series of features and deploy them into production as a unit, for example."}
  - {"page": 23, "locator": "3.2.3", "reason": "no-marker", "text": "M. Fowler, “Continuous Integration.” May 1, 2006, [Online]. Available: https://martinfowler.com/articles/continuousIntegration.html."}
  - {"page": 24, "locator": "3.2.4", "reason": "no-marker", "text": "The Continuous Deployment feedback loop iterates across the Plan, Develop, Build, Test, Release, Deliver, Deploy, and Operate phases of the DevSecOps lifecycle depicted in Figure 9. Deployment is formally the act of pushing one or more features into production in an automated fashion. This is the first additional control gate outside of the control gates depicted in the software CI/CD pipeline, visualized in Figure 9."}
  - {"page": 24, "locator": "3.2.4", "reason": "no-marker", "text": "Continuous deployment is triggered by the successful delivery of released artifacts to the artifact repository, and deployment may be subject to control with human intervention according to the nature of the application."}
  - {"page": 24, "locator": "3.2.4", "reason": "no-marker", "text": "The use of the word continuous here is contextual and situational. First, in some programs, continuous deployment may occur automatically when a new feature is released and delivered. For example, during a cloud based microservice continuous deployment, it is possible to automate the deployment. Alternatively, if this artifact is destined for an underwater resource, it may be several orders of magnitude harder to automatically push a 750MB release of software to a submersed vehicle operating at 300 feet below the surface of the ocean. This scenario further illustrates the separation between continuous delivery and continuous deployment."}
  - {"page": 26, "locator": "3.3.1.1", "reason": "no-marker", "text": "DevSecOps inherently addresses the principles of zero trust by integrating development, security, and operations teams, and addressing security throughout each phase. It includes control gates and guardrails prior to deployment and relies on constant monitoring and feedback to address any vulnerabilities or incidents."}
  - {"page": 27, "locator": "3.3.1.1", "reason": "no-marker", "text": "For more information on zero trust, refer to the DoD Zero Trust Strategy.4"}
  - {"page": 27, "locator": "3.3.1.2.o", "reason": "label-only", "text": "o Prepare the Organization"}
  - {"page": 27, "locator": "3.3.1.2.o", "reason": "label-only", "text": "o Protect the Software"}
  - {"page": 27, "locator": "3.3.1.2.o", "reason": "label-only", "text": "o Produce Well-Secured Software"}
  - {"page": 27, "locator": "3.3.1.2", "reason": "no-marker", "text": "DoD CIO Cyber Security, Zero Trust Strategy, https://dodcio.defense.gov/Portals/0/Documents/Library/DoD- ZTStrategy.pdf, October 21, 2022."}
  - {"page": 28, "locator": "3.3.1.2.o", "reason": "label-only", "text": "o Respond to Vulnerabilities"}
  - {"page": 28, "locator": "3.3.2", "reason": "no-marker", "text": "Security Testing: There is no “one size fits all” solution for security testing design. Each product team has its own unique requirements and constraints. However, the software artifact promotion control gates are a best practice of the software factory. Different pipelines within the software factory may define different collections of tests to maximize the effectiveness of a control gate."}
  - {"page": 28, "locator": "3.3.2", "reason": "no-marker", "text": "DoD CIO, “DevSecOps Continuous Authorization Implementation Guide,” April 11, 2024."}
  - {"page": 29, "locator": "3.3.3", "reason": "no-marker", "text": "Traditionally, the DoD acquisition process for software applications was lengthy and expensive, taking years and millions of dollars to deploy systems. With the adoption of Agile and DevSecOps and the use of the DoD Software Acquisition Pathway (SWP), the acquisition process can be streamlined and accelerated. This alignment between SWP and DevSecOps provides for the efficient and effective acquisition, development, integration, and timely delivery of secure software.6 Refer to DoDI 5000.87 for the steps in the SWP."}
  - {"page": 29, "locator": "3.3.3", "reason": "no-marker", "text": "DoDI 5000.87, “Operation of the Software Acquisition Pathway”, https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodi/500087p.PDF, October 2, 2020"}
  - {"page": 30, "locator": "4.1", "reason": "no-marker", "text": "DORA’s 2023 State of DevOps Report established that a healthy, generative culture is instrumental in driving not only organizational performance but also software delivery and operational efficiency. Key to this is the cultivation of an environment where information flows freely, reducing knowledge silos and enhancing the effectiveness of task execution."}
  - {"page": 30, "locator": "4.1", "reason": "no-marker", "text": "Their findings identified that culture drives organizational performance in teams with a generative culture delivering a 30% higher organization performance than teams without. They found that “the relationship between culture and technical capabilities is reciprocal: culture emerges from practices, and practices emerge from culture.” Other findings include the following:"}
  - {"page": 30, "locator": "4.1", "reason": "lead-in", "text": "There are several tenets for a successful transition to a DevSecOps culture:"}
  - {"page": 31, "locator": "4.2", "reason": "no-marker", "text": "A whole-of-DoD approach involves a comprehensive and coordinated effort across the Department to embrace and integrate modern software development practices such as Agile and DevSecOps."}
  - {"page": 31, "locator": "4.2", "reason": "lead-in", "text": "Leadership and Culture:"}
  - {"page": 31, "locator": "4.2", "reason": "lead-in", "text": "Workforce Development:"}
  - {"page": 31, "locator": "4.2", "reason": "lead-in", "text": "Management and Governance:"}
  - {"page": 32, "locator": "4.2", "reason": "lead-in", "text": "Collaboration and Partnerships:"}
  - {"page": 32, "locator": "4.2", "reason": "lead-in", "text": "Continuous Improvement and Measurement:"}
  - {"page": 33, "locator": "4.3.1", "reason": "no-marker", "text": "The 2023 State of DevOps Report, compiled by DevOps Research and Assessment (DORA) and Google Cloud, investigates the capabilities and measures of high-performing technology-driven organizations. The DORA research for 2023 looked at the following:"}
  - {"page": 33, "locator": "4.3.1", "reason": "lead-in", "text": "They also researched performance measures for the following:"}
  - {"page": 33, "locator": "4.3.1", "reason": "no-marker", "text": "Another set of metrics that have value for measuring day to day operations are Google’s Four Golden Signals.7 These metrics have a higher value for platform operators than for developers or security team members. However, they are very useful for developers to measure application performance and for security teams to identify abnormalities that may point to a concern."}
  - {"page": 33, "locator": "4.3.1", "reason": "no-marker", "text": "The Four Golden Signals, [Online]. Available: https://sre.google/sre-book/monitoring-distributed-systems/#xref_monitoring_golden-signals."}
  - {"page": 34, "locator": "4.3.1", "reason": "lead-in", "text": "OUSD(A&S) has defined the DoD4 which is an expansion of the DORA 4 and includes the following:"}
  - {"page": 34, "locator": "4.3.1", "reason": "no-marker", "text": "Additional metrics guidance is available from OUSD(A&S) at https://aaf.dau.edu/wp-content/uploads/2022/08/Agile-Metrics-Guide.pdf. Software Acquisition Pathway metrics are available at https://aaf.dau.edu/aaf/software/metrics-and-reporting/."}
  - {"page": 34, "locator": "4.3.2", "reason": "no-marker", "text": "OKR stands for Objectives and Key Results. OKRs are a methodology for settings goals and tracking results. It started with Peter Drucker who introduced Management by Objectives in 1954. It was improved upon by Andy Grove at Intel in the 1970s by adding the Key Results. Google adopted OKRs in 1999. The goal of OKRs is to focus on what matters. A current DoD example using OKRs is Platform One. Some metrics from Platform One include the following:"}
  - {"page": 34, "locator": "4.3.3", "reason": "no-marker", "text": "Flow metrics are a set of quantitative measures used to assess the flow of work through a software development or delivery process. They provide insights into the efficiency and effectiveness of the process, helping teams identify bottlenecks, optimize workflow, and improve overall productivity. Flow metrics focus on the movement of work items from one stage to another, tracking the time taken at each stage and the rate at which work items progress through the process."}
  - {"page": 34, "locator": "4.3.3", "reason": "lead-in", "text": "Some common flow metrics include the following:"}
  - {"page": 36, "locator": "4.4", "reason": "no-marker", "text": "Depending on the specific needs of the product, the team may also include and is not limited to other roles such as an Agile Coach, business analyst, technical writer, or customer support representative."}
  - {"page": 36, "locator": "4.4", "reason": "no-marker", "text": "There are additional roles that may impact the software product team. They include the Warfighter/User, Mission Owner, Authorizing Official, Program Executive Officer (PEO), Program Manager, Sponsor, Financial Manager, Cost Analyst, Contracting Officer, Human Resources Specialist, Product Support Manager, and Intel/Threat Analyst."}
  - {"page": 36, "locator": "4.5", "reason": "no-marker", "text": "In April 2019, DoD conducted the first monthly DoD Enterprise DevSecOps Community of Practice (DSO CoP). The DSO CoP is a monthly meeting where practitioners from across DoD, academia, and industry gather to learn, exchange success stories and innovative ideas, educate members, raise issues to the greater DevSecOps community, and collaborate to resolve issues. The community reduces silos and enhances knowledge building across the Department by encouraging participation and partnerships and by staying connected to centers of excellence and pioneer implementers. To become a member of the DSO CoP, contact: osd.mc-alex.dod-cio.mbx.devsecops@mail.mil."}
  - {"page": 37, "locator": "5 Getting Started", "reason": "no-marker", "text": "This document introduces DevSecOps – its definition, implementation, and institutionalization."}
  - {"page": 37, "locator": "5 Getting Started.•", "reason": "label-only", "text": "• DoD Approved Reference Designs."}
