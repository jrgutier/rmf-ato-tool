  - {"page": 3, "locator": "Appendix A: DevSecOps Continuous Authorization to Operate: Scope for General Use Cases ... 5", "reason": "short", "text": "Evaluation Criteria"}
  - {"page": 3, "locator": "Executive Summary", "reason": "no-marker", "text": "Continuous Authorization to Operate (cATO) is a modernized authorization process designed to work with software delivery organizations that want to move faster and are willing to adopt the necessary culture change. cATO moves away from solely a document-based, point-in-time technical security assessment approach (though some point-in-time documents are still required), towards focusing on a continuous risk determination and authorization concept by continuously assessing, monitoring, and managing risk. cATO raises the security standard over a traditional Authorization to Operate (ATO) and provides the ability to deploy software more rapidly to the field while improving security. (See Glossary for a more precise definition of cATO.)"}
  - {"page": 3, "locator": "Executive Summary", "reason": "short", "text": "Overview"}
  - {"page": 3, "locator": "Executive Summary", "reason": "no-marker", "text": "This cATO Evaluation Criteria establishes the use cases and guidelines for evaluating a request for continuous authorization for a software factory (for an explanation of a DevSecOps platform and software factory, see DoD Enterprise DevSecOps Fundamentals)."}
