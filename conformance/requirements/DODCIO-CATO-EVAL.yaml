  - id: "REQ-DODCIO-CATO-EVAL-0006"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 5, "anchor": "Programs or software factories applying for a DSO cATO should already be"}
    kind: "should"
    locator: "Appendix A: DevSecOps Continuous Authorization to Operate: Scope for General Use Cases"
    context: ""
    statement: "Programs or software factories applying for a DSO cATO should already be in one of the following use case categories."
