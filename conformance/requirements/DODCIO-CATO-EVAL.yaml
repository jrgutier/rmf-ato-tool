  - {"page": 18, "locator": "Glossary", "reason": "no-marker", "text": "Authorization boundary “All components of an information system to be authorized for operation by an authorizing official. This excludes separately authorized systems to which the information system is connected.” NIST 800-37r2."}
  - {"page": 18, "locator": "Glossary", "reason": "no-marker", "text": "Continuous Integration/Continuous Delivery (CI/CD) Pipeline is the process workflows and associated tools to achieve the continuous integration and continuous delivery of software with maximum use of automation."}
  - {"page": 18, "locator": "Glossary", "reason": "no-marker", "text": "DevSecOps is a software engineering culture and practice that aims at unifying software development (Dev), security (Sec) and operations (Ops). The main characteristic of DevSecOps is to automate, monitor, and apply security at all phases of software development: plan, develop, build, test, release, deliver, deploy, operate, and monitor."}
  - {"page": 18, "locator": "Glossary", "reason": "no-marker", "text": "ISCM is defined as “maintaining ongoing awareness of information security, vulnerabilities, and threats to support organizational risk management decisions.” NIST SP 800-137."}
  - {"page": 18, "locator": "Glossary", "reason": "no-marker", "text": "Continuous Authorization to Operate (cATO) – Evaluation Criteria Page 18 Software Factory is a software assembly plant that contains multiple pipelines, which are equipped with a set of tools, process workflows, scripts, and environments, to produce a set of software deployable artifacts with minimal human intervention. It automates the activities in the develop, build, test, release, and deliver phases. The software factory supports multi-tenancy."}
