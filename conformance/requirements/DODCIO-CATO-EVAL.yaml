  - id: "REQ-DODCIO-CATO-EVAL-0188"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 18, "anchor": "Authorizing Official (AO) is “a senior Federal official or executive with the"}
    kind: "modal"
    locator: "Glossary"
    context: ""
    statement: "Authorizing Official (AO) is “a senior Federal official or executive with the authority to authorize (i.e., assume responsibility for) the operation of an information system or the use of a designated set of common controls at an acceptable level of risk to agency operations (including mission, functions, image, or reputation), agency assets, individuals, other organizations, and the Nation.” NIST 800-37r2."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0189"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 18, "anchor": "Authorization to Operate (ATO) is “the official management decision given by a"}
    kind: "indicative"
    locator: "Glossary"
    context: ""
    statement: "Authorization to Operate (ATO) is “the official management decision given by a senior Federal official or officials to authorize operation of an information system and to explicitly accept the risk to agency operations (including mission, functions, image, or reputation), agency assets, individuals, other organizations, and the Nation based on the implementation of an agreed-upon set of security and privacy controls. Authorization also applies to common controls inherited by agency information systems.” NIST 800-37r2."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0190"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 18, "anchor": "Continuous Authorization to Operate (cATO) is the state achieved when the organization"}
    kind: "modal"
    locator: "Glossary"
    context: ""
    statement: "Continuous Authorization to Operate (cATO) is the state achieved when the organization that develops, secures, and operates a system has demonstrated sufficient maturity in their ability to maintain a resilient cybersecurity posture that traditional risk assessments and authorizations become redundant. This organization must have implemented robust information security continuous monitoring capabilities, active cyber defense, and secure software supply chain requirements to enable continuous delivery of capabilities without adversely impacting the system’s cyber posture."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0191"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 18, "anchor": "Control gate is a defined point in the project lifecycle when specific"}
    kind: "modal"
    locator: "Glossary"
    context: ""
    statement: "Control gate is a defined point in the project lifecycle when specific requirements, called exit criteria, must be met to move to the next phase in the lifecycle. Exit criteria include functional, security, and non-functional criteria."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0192"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 18, "anchor": "DevSecOps Platform (DSOP) is the set of tools and automation that enables"}
    kind: "should"
    locator: "Glossary"
    context: ""
    statement: "DevSecOps Platform (DSOP) is the set of tools and automation that enables a software factory. It includes the ability to create DevSecOps pipelines with control gates, and to deploy software into development and test environments. It may also deploy into production, depending on the production environment. Use of a DevSecOps platform is encouraged to accelerate development, delivery, and authorization. DoD Enterprise DevSecOps Reference Designs for a DSOP may be found here."
    status: "candidate"
