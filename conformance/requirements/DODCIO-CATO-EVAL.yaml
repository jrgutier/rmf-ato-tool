  - id: "REQ-DODCIO-CATO-EVAL-0007"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 5, "anchor": "Use Case 1 (Inside the Software Factory Boundary): A software factory uses"}
    kind: "indicative"
    locator: "Appendix A: DevSecOps Continuous Authorization to Operate: Scope for General Use Cases"
    context: ""
    statement: "Use Case 1 (Inside the Software Factory Boundary): A software factory uses a development, security, and operations (DevSecOps) platform that already has an ATO. Software is developed in that factory and deployed within its production environment (i.e., within its system boundary) as depicted in Figure 1. The software factory seeks a cATO that includes its production environment. This is the main use case for a SWF leveraging cATO. Example: Software developed and put into production using the Platform One (P1) Party Bus. (Note: Information flow includes development, test, and security artifacts)."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0008"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 5, "anchor": "Use Case 2 (Outside the SWF Boundary): A software factory using a"}
    kind: "modal"
    locator: "Appendix A: DevSecOps Continuous Authorization to Operate: Scope for General Use Cases"
    context: "Figure 1. Single Authorization Boundary"
    statement: "Use Case 2 (Outside the SWF Boundary): A software factory using a DevSecOps platform that already has an ATO, but the software is deployed into another authorization boundary (e.g., a weapon system) with its own ATO as depicted in Figure 2. The software factory seeks a cATO for the factory that allows deployment into the production environment. This involves at least two authorization boundaries and there must be agreements in place to pass software across the boundary and subsequently pass results and feedback back to the software factory. Example: The Forge Software Factory has an ATO to build software that is then deployed on Navy ships, each of which have their own ATOs."
    status: "candidate"
