requirements:
  - id: "REQ-DODCIO-CATO-EVAL-0001"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 3, "anchor": "To maintain a competitive advantage, the Department of Defense (DoD) must develop"}
    kind: "modal"
    locator: "Executive Summary"
    context: ""
    statement: "To maintain a competitive advantage, the Department of Defense (DoD) must develop and deploy software with increasing speed and agility, while improving security. Additionally, the DoD must respond quickly to rapidly changing threats through the continuous integration and delivery of capabilities, cybersecurity, resiliency, and survivability. The Department accomplishes this using DevSecOps practices for software development. Software factories (SWF) that use DevSecOps practices can mitigate threats early during software development as well as during operations. To allow software delivery organizations to deploy more secure software faster, the Department will implement a new approach to system authorizations: Continuous Authorization to Operate (cATO)."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0002"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 3, "anchor": "A software factory with a cATO is allowed to continuously develop, assess,"}
    kind: "indicative"
    locator: "Executive Summary"
    context: ""
    statement: "A software factory with a cATO is allowed to continuously develop, assess, and deploy software that meets the risk tolerances laid out within a system authorization boundary."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0003"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 3, "anchor": "A DevSecOps cATO is based on continual assessment of the processes, the"}
    kind: "indicative"
    locator: "Executive Summary"
    context: ""
    statement: "A DevSecOps cATO is based on continual assessment of the processes, the skills of its SWF teams, and the use of a DevSecOps Platform that meets one of the DoD Enterprise DevSecOps Reference Designs, and which implements continuous monitoring, active cyber defense, and the National Institute of Standards and Technology (NIST) secure supply chain guidance."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0004"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 3, "anchor": "Additionally, it provides the recommended processes and information required for software factories"}
    kind: "indicative"
    locator: "Executive Summary"
    context: ""
    statement: "Additionally, it provides the recommended processes and information required for software factories to generate a cATO package and send to DCIO(CS) for review and approval. Appendix A outlines the two use cases for which requesting a DevSecOps (DSO) cATO is appropriate. Appendix B highlights the baseline guidance and assessment overview as well as the specific information required for the cATO package. Please note that due to evolving requirements, this"
    status: "candidate"
