  - id: "REQ-DODCIO-CATO-EVAL-0028"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 7, "anchor": "Software Factory practices required for cATO are informed by the existing RMF"}
    kind: "modal"
    locator: "Appendix B: DevSecOps Continuous Authorization: Implementation Guidance and"
    context: "Figure 4. Assessment Method Overview"
    statement: "Software Factory practices required for cATO are informed by the existing RMF authorization to operate assessment and the implementation of continuous monitoring. This assumes that before applying for a cATO, the software factory has already progressed into the monitoring phase of RMF and has a valid ATO. The cATO assessment further evaluates the ‘Prepare’, ‘Assess’, and ‘Authorize’ RMF phases. However, the key to receiving a cATO is having a robust continuous monitoring strategy that includes automated triggers based on approved thresholds within the auditing and incident response plans. The automated triggers and approved thresholds should include both internal and external threats. Additionally, a complete understanding and implementation (or planned implementation) of the shift security left and shield right concept that incorporates vulnerability scanning and compliance checking with detection and response activities to security incidents in real time. This includes tight integration with a Cybersecurity Service Provider (CSSP) and Security Operations Center (SOC) if established. Hosting an environment (development, test, staging, production, etc.) on a cloud requires the deployment of a Cloud Native Application Protection Platform (CNAPP). Once the Chief Information Security"
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0029"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 7, "anchor": "Continuous Authorization to Operate (cATO) – Evaluation Criteria Page 7"}
    kind: "modal"
    locator: "Appendix B: DevSecOps Continuous Authorization: Implementation Guidance and"
    context: "Figure 4. Assessment Method Overview"
    statement: "Continuous Authorization to Operate (cATO) – Evaluation Criteria Page 7 Officer (CISO)1 grants a cATO, continuous monitoring practices (including the CSSP) monitor the risk. Upon identification of an issue or anomaly, the CSSP, along with the Security Control Assessor (SCA), shall investigate and mitigate as necessary. If the issue or anomaly is outside of agreed upon thresholds, the CSSP or SCA in collaboration with the Authorizing Official (AO) may initiate a review of the cATO. If so, the CISO may decide to revoke the cATO. However, with the approval of the originating Component authorizing official, the system can revert to its original ATO by kicking off a new workflow in the Component’s RMF Inventory Tool, if the cATO is revoked."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0030"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 8, "anchor": "The approval to implement cATO process within a DevSecOps software factory is"}
    kind: "modal"
    locator: "Appendix B: DevSecOps Continuous Authorization: Implementation Guidance and"
    context: "Figure 4. Assessment Method Overview"
    statement: "The approval to implement cATO process within a DevSecOps software factory is granted by following the RMF guidelines identified in CNSSI 1253, NIST SP 800-53 and DoDI 8510.01. In order to receive an approved cATO, the software factory must have a current ATO with no ‘High’ or ‘Very High’ unmitigated findings. The cATO analysis will review the existing authorization, further evaluate the continuous monitoring strategy, ensure active cyber defense is implemented properly, assess the DevSecOps and supply chain processes, and validate that they are following cybersecurity supply chain risk management guidance in accordance with NIST SP 800-161r1."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0031"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 8, "anchor": "Currently, this level of authority is at the DoD-level. Once cATO criteria"}
    kind: "modal"
    locator: "Appendix B: DevSecOps Continuous Authorization: Implementation Guidance and"
    context: "Figure 4. Assessment Method Overview"
    statement: "Currently, this level of authority is at the DoD-level. Once cATO criteria is standardized for the DevSecOps use case, the DoD CISO will delegate approval authority to the Component CISO or equivalent."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0032"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 9, "anchor": "The three competencies in the memo “Continuous Authorization to Operate (cATO),” February"}
    kind: "modal"
    locator: "Appendix C: DevSecOps cATO Assessment Overview"
    context: ""
    statement: "The three competencies in the memo “Continuous Authorization to Operate (cATO),” February 3, 2022, are (1) Continuous Monitoring (CONMON), (2) Active Cyber Defense (ACD) and (3) Secure Software Supply Chain (SSSC). However, the assessment of this use case is organized into evaluating the DevSecOps Platform, Processes, and People (Teams). This section discusses how to reconcile these two sets of concepts. To be considered for cATO, the environment must ensure:"
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0033"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 9, "anchor": "1) The DevSecOps Platform (DSOP) contains essential automation to enable CONMON, ACD,"}
    kind: "indicative"
    locator: "Appendix C: DevSecOps cATO Assessment Overview"
    context: "To be considered for cATO, the environment must ensure:"
    statement: "1) The DevSecOps Platform (DSOP) contains essential automation to enable CONMON, ACD, and to support DevSecOps (DSO) tooling for a Secure Software Supply Chain (SSSC). 2) Processes are defined for people using, operating, and maintaining the DSOP. 3) People are trained on the DSOP and its processes."
    status: "candidate"
  - id: "REQ-DODCIO-CATO-EVAL-0034"
    citation: {"ref": "DODCIO-CATO-EVAL", "page": 9, "anchor": "The cATO applies to the software factory, which includes the DSOP, and"}
    kind: "modal"
    locator: "Appendix C: DevSecOps cATO Assessment Overview"
    context: ""
    statement: "The cATO applies to the software factory, which includes the DSOP, and the software produced by the software factory. The processes for using the SWF and DSOP must be clear, and the people must be familiar with all aspects of DevSecOps."
    status: "candidate"
