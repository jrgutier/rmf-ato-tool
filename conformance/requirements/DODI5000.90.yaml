    locator: "3.1"
    context: "CYBERSECURTIY FOUNDATIONS IN THE DEFENSE ACQUISITION SYSTEM"
    statement: "In order to harden the U.S.’s weapon systems and infrastructure, the Department must inculcate cyber security into all aspects of the DAS and operations. The focus on cybersecurity must encompass platforms, weapons, and the DIB and must be regularly assessed, properly resourced, and continually mitigated. Cybersecurity crosses all pathways within the AAF."
    status: "candidate"
