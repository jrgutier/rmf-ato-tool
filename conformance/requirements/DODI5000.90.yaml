    status: "candidate"
  - id: "REQ-DODI5000.90-0134"
    citation: {"ref": "DODI5000.90", "page": 17, "anchor": "Protection of Information on Networks | FAR Clause 52.204-21 This clause is"}
    kind: "table"
    locator: "SECTION 4: SUMMARY OF CYBERSECURITY RESOURCES"
    context: "Table 2. Cybersecurity and Related Program Security Resources and Publications"
    statement: "Protection of Information on Networks | FAR Clause 52.204-21 This clause is related to protection of information not intended for public release that is provided by or generated for the U.S. Government under a contract to develop or deliver a product or service to the U.S. Government, but not including information provided by the U.S. Government to the public (such as on public websites) or simple transactional information, such as necessary transactions to process payments. DFARS Clause 252.204-7012 The clause is related to protection and safeguarding of CDI, as defined in the clause, and reporting to the DoD of the possible exfiltration, manipulation, or other loss or compromise of unclassified CDI; or other activities that allow unauthorized access to the contractor’s unclassified IS on which unclassified CDI is resident or transiting. For more information, see Guidance to Stakeholders for Implementing DFARS Clause 252.204-7012, released by the Office of the Deputy Assistant Secretary of Defense for Systems Engineering. DoDI 5205.13 - Establishes an approach for protecting unclassified DoD information transiting or residing on unclassified DIB ISs and networks. - Increases DoD and DIB situational awareness. - Establishes a DoD and DIB collaborative information sharing environment. - DoD CIO manages the DIB Cyber Security/ Information Assurance Program. Executive Order 13691 Encourages and promotes sharing of cybersecurity threat information within the private sector and between the private sector and government."
    status: "candidate"
  - id: "REQ-DODI5000.90-0135"
    citation: {"ref": "DODI5000.90", "page": 17, "anchor": "OPSEC | DoDD 5205.02E Establishes process for identifying critical information and analyzing"}
    kind: "table"
    locator: "SECTION 4: SUMMARY OF CYBERSECURITY RESOURCES"
    context: "Table 2. Cybersecurity and Related Program Security Resources and Publications"
    statement: "OPSEC | DoDD 5205.02E Establishes process for identifying critical information and analyzing friendly actions attendant to military operations and other activities to: - Identify those actions that can be observed by adversary intelligence systems. - Determine indicators and vulnerabilities that adversary intelligence systems might obtain that could be interpreted or pieced together to derive critical information in time to be useful to adversaries, and determine which of these represent an unacceptable risk. - Select and execute countermeasures that eliminate the risk to friendly actions and operations or reduce it to an acceptable level."
    status: "candidate"
  - id: "REQ-DODI5000.90-0136"
    citation: {"ref": "DODI5000.90", "page": 17, "anchor": "Protection of information technology and ISs | DoDI 8500.01 Establishes a DoD"}
    kind: "table"
    locator: "SECTION 4: SUMMARY OF CYBERSECURITY RESOURCES"
    context: "Table 2. Cybersecurity and Related Program Security Resources and Publications"
    statement: "Protection of information technology and ISs | DoDI 8500.01 Establishes a DoD cybersecurity program to protect and defend DoD information and information technology. DoDI 8510.01 Establishes the DoD decision process for managing cybersecurity risk to DoD information technology. Section 2223(a) of Title 10 U.S.C. Requires a cybersecurity strategy for programs that are considered Mission Critical and Mission Essential and includes information technology."
    status: "candidate"
  - id: "REQ-DODI5000.90-0137"
    citation: {"ref": "DODI5000.90", "page": 17, "anchor": "System Protection | DoDI 5200.39 Provides policy and procedures for protecting CPI."}
    kind: "table"
    locator: "SECTION 4: SUMMARY OF CYBERSECURITY RESOURCES"
    context: "Table 2. Cybersecurity and Related Program Security Resources and Publications"
    statement: "System Protection | DoDI 5200.39 Provides policy and procedures for protecting CPI. CPI includes U.S. capability elements that contribute to the warfighters’ technical advantage, which, if compromised, undermine U.S. military preeminence. U.S. capability elements may include, but are not limited to, software algorithms and specific hardware residing on the system, its training equipment, or maintenance support equipment. DoDI 5200.44 Establishes policy and procedures for managing supply chain risk. A supply chain is at risk when an adversary may sabotage, maliciously introduce unwanted function, or otherwise subvert the design, integrity, manufacturing, production, distribution, installation, operation, or maintenance of a system so as to surveil, deny, disrupt, or otherwise degrade the function, use, or operation of such system."
    status: "candidate"
  - id: "REQ-DODI5000.90-0138"
    citation: {"ref": "DODI5000.90", "page": 18, "anchor": "Section 933 of the National Defense Authorization Act (NDAA) for Fiscal Year"}
    kind: "table"
    locator: "SECTION 4: SUMMARY OF CYBERSECURITY RESOURCES"
    context: "Table 3. Cybersecurity and Related Program Security Resources and Publications,"
    statement: "Section 933 of the National Defense Authorization Act (NDAA) for Fiscal Year (FY) 2013, Public Law 112-239 Requires use of appropriate automated vulnerability analysis tools in computer software code during the entire life cycle, including during development, operational testing, operations and sustainment phases, and retirement. Section 937 of the NDAA for Fiscal Year 2014, Public Law 113-66 Requires the DoD to establish a joint federation of capabilities to support trusted defense system needs to ensure the security of software and hardware developed, maintained, and used by the DoD. DoDI 8530.01 Establishes policy and assigns responsibilities to protect the DoD Information Network against unauthorized activity, vulnerabilities, or threats. Joint Federated Assurance Center, chartered under Section 937 of the Fiscal Year 2014 NDAA Federation of subject matter experts and capabilities to support program hardware and software assurance needs. National Cyber Range (NCR) The NCR is institutionally funded by USD(R&E) Test Resource Management Center to provide cybersecurity T&E as a service to DoD Customers. The NCR provides secure facilities, computing resources, repeatable processes and skilled workforce as a service to PMs. The NCR Team helps the PM plan and execute a wide range of event types including science and technology experimentation, architectural evaluations, security control assessments, cooperative vulnerability, adversarial assessments, training and mission rehearsal. The NCR creates hi-fidelity, mission representative cyberspace environments and also facilitates the integration of cyberspace T&E infrastructure through partnerships with key stakeholders across DoD, the Department of Homeland Security, industry, and academia."
    status: "candidate"
  - id: "REQ-DODI5000.90-0139"
    citation: {"ref": "DODI5000.90", "page": 18, "anchor": "Threat Assessment and Integration | DIA Produces intelligence and counterintelligence assessments, to"}
    kind: "table"
    locator: "SECTION 4: SUMMARY OF CYBERSECURITY RESOURCES"
    context: "Table 3. Cybersecurity and Related Program Security Resources and Publications,"
    statement: "Threat Assessment and Integration | DIA Produces intelligence and counterintelligence assessments, to include assessment of supplier threats to acquisition programs providing critical weapons, ISs, or service capabilities, and system threat intelligence reports. Defense Counterintelligence and Security Agency Provides the cleared U.S. defense industry with information about foreign intelligence threats; and ensures that the cleared U.S. defense industry safeguards the classified information in their possession while performing work on contracts, programs, bids, or research and development efforts."
    status: "candidate"
  - id: "REQ-DODI5000.90-0140"
