    statement: "Threat Assessment and Integration | Joint Acquisition Protection and Exploitation Cell An USD(R&E) organization focusing on collaboration among the acquisition, intelligence, counterintelligence, law enforcement, and operations communities to prevent, mitigate, and respond to data loss."
    status: "candidate"
