    context: "CYBERSECURITY IN THE SUPPLY CHAIN"
    statement: "Over the past decade, the United States’ strategic competitors have been able to exploit vulnerabilities in the DoD supply chain by stealing U.S. intellectual property and decreasing confidence in the security of products delivered to the DoD. Contractor facilities—including design, development, and production environments, networks, supply chains, and personnel— can be used by threat actors as cyber pathways to access government program organizations or fielded systems to steal, alter, or destroy system functionality, information, or technology. The DoD must deliberately harden the supply chain commensurate with the risk to national security. For SCRM:"
