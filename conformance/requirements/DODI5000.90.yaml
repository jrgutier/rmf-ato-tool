    locator: "3.1.a"
    context: "Figure 1. AAF"
    statement: "a. The DAS ensures that the DoD is equipped to win military operations against all adversaries in all warfighting domains—including cyberspace. This is especially important when the warfighting domains are actively and aggressively contested."
    status: "candidate"
