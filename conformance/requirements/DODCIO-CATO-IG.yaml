  - id: "REQ-DODCIO-CATO-IG-0002"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "The exigencies of today demand the agility to respond to changing mission"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "The exigencies of today demand the agility to respond to changing mission needs by delivering capabilities more rapidly than with traditional DoD processes. To enable such a rapid pace, industry has moved to using DevSecOps software development, often delivering new capabilities multiple times per day. DoD must also modernize its approach to software development and delivery to keep pace with the constantly changing threat so that it can deliver resilient software capability at the speed of relevance."
    status: "not-a-requirement"
    reason: "Introduction's motivation. The 'must' is the Department stating why it is modernizing, with no role, artifact or date, so the must binds no one reading this guide."
  - id: "REQ-DODCIO-CATO-IG-0003"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "Many DoD Components identify obtaining an Authorization to Operate (ATO) as the"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "Many DoD Components identify obtaining an Authorization to Operate (ATO) as the longest step in developing and deploying software. Delivering new features rapidly requires an authorization process that can keep pace with continuous change for a developing capability— called Continuous Authorization to Operate (cATO). An organization with a cATO is allowed to continuously assess and deploy subsystems that meet the risk tolerances for use within a system authorization boundary. A cATO moves away from a control assessment point-in-time approach to focusing on continuous risk determination and authorization through demonstrated continuous assessing, monitoring, and risk management."
    status: "not-a-requirement"
    reason: "Background that introduces the term cATO. 'Requires' here is about speed: delivering features 'requires an authorization process that can keep pace', an observation that binds no one. 'Is allowed to' states the effect of holding a cATO."
  - id: "REQ-DODCIO-CATO-IG-0004"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "This document focuses on the continuous assessment and authorization of developing and"}
    kind: "indicative"
    locator: "Introduction"
    context: ""
    statement: "This document focuses on the continuous assessment and authorization of developing and securing application software produced by a software factory that includes a DevSecOps Platform (DSOP), particularly the two use cases described in the DevSecOps Continuous Authorization to Operate Evaluation Criteria [3] and reproduced here in Appendix A. This document identifies the key practices of continuous authorization and describes the method for assessing an organization’s readiness to enter continuous authorization. Active risk management, in the form of cATO, is enabled by organizations establishing competencies in managing risk through a risk governance process."
    status: "not-a-requirement"
    reason: "Scope of the guide: what it focuses on and identifies, and that risk management 'is enabled by' competencies. The practices themselves are at 0048 onward."
