  - id: "REQ-DODCIO-CATO-IG-0122"
    citation: {"ref": "DODCIO-CATO-IG", "page": 17, "anchor": "Use Case 1 (Software delivery inside the DevSecOps Platform (DSOP) Boundary): A"}
    kind: "indicative"
    locator: "Appendix A. Use Cases"
    context: ""
    statement: "Use Case 1 (Software delivery inside the DevSecOps Platform (DSOP) Boundary): A software factory already has an ATO. Software is developed in that factory and deployed within its production environment (i.e., within its system boundary) as depicted in Figure 3. The software factory seeks a cATO that includes its production environment. This is the main use case for a DevSecOps Platform (DSOP) leveraging cATO. Example: Software developed and put into production using the Platform One (P1) Party Bus."
    status: "not-a-requirement"
    reason: "Defines Use Case 1, the category 0121 points to: a factory with an ATO deploying inside its own boundary, with Party Bus as the example. Its one condition, the ATO, is 0007."
  - id: "REQ-DODCIO-CATO-IG-0123"
    citation: {"ref": "DODCIO-CATO-IG", "page": 17, "anchor": "Use Case 2 (Software delivery outside the DSOP Boundary): Software is developed"}
    kind: "modal"
    locator: "Appendix A. Use Cases"
    context: "Figure 3. Software Factory with an Integrated Production Environment"
    statement: "Use Case 2 (Software delivery outside the DSOP Boundary): Software is developed by a software factory that already has an ATO, but the software is deployed into another environment (e.g., a weapon system) with its own ATO as depicted in Figure 4. The software factory seeks a cATO for the factory that allows deployment into the production environment. Error! Reference source not found.This involves at least 2 authorization boundaries and there must be agreements in place to pass software across the boundary and subsequently pass results and feedback back to the software factory. Example: The Forge Software Factory has an ATO to build software that is then deployed on Navy ships, each of which have their own ATOs. An outcome of issuing a cATO for use case 2 is to seamlessly incorporate software factory products through reciprocity agreements into the production environment."
    status: "candidate"
    work_item: "WI-317"
