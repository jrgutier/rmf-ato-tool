  - id: "REQ-DODCIO-CATO-IG-0016"
    citation: {"ref": "DODCIO-CATO-IG", "page": 8, "anchor": "In the terminology of the NIST Risk Management Framework (RMF), the software"}
    kind: "modal"
    locator: "Approach"
    context: "Figure 1. Software Factory: cATO Viewpoint"
    statement: "In the terminology of the NIST Risk Management Framework (RMF), the software factory contains at least one system with a single authorization boundary. This typically contains a development system, a testing system, and a staging (or pre-production) system. It may also contain the production system, or that system may be hosted on a different platform such as in an embedded system. These two use cases are explained in more detail in Appendix A. In either of these cases, the cATO will cover the software developed in the software factory and deployed to the production systems."
