  - id: "REQ-DODCIO-CATO-IG-0006"
    citation: {"ref": "DODCIO-CATO-IG", "page": 6, "anchor": "Continuous Authorization to Operate (cATO) is the state achieved when the organization"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "Continuous Authorization to Operate (cATO) is the state achieved when the organization that develops, secures, and operates a system has demonstrated sufficient maturity in their ability to maintain a resilient cybersecurity posture that traditional risk assessments and authorizations become redundant. This organization must have implemented robust information security continuous monitoring capabilities, active cyber defense, and secure software supply chain requirements to enable continuous delivery of capabilities without adversely impacting the system’s cyber posture."
