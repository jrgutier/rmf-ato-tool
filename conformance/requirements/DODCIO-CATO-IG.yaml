    statement: "This section summarizes the requirements to assess for a cATO. The intent is to provide an abstraction of the practices to provide flexibility to implementing organizations. It also indicates which requirements are threshold (T) and which are objective (O). A threshold requirement must be met, while an objective requirement is one that should be met, but which may not be fully met initially, while still obtaining a cATO."
