  - id: "REQ-DODCIO-CATO-IG-0030"
    citation: {"ref": "DODCIO-CATO-IG", "page": 9, "anchor": "The assessment process for a cATO involves developing an understanding of the"}
    kind: "indicative"
    locator: "Assessment Method"
    context: ""
    statement: "The assessment process for a cATO involves developing an understanding of the organization’s risk management practices in the software factory through the review of evidence of use of the practices, interviews with personnel performing the practices to determine the level of organizational understanding and implementation, and review of results from continuous monitoring activities. The information is used by the assessment team to determine the organization’s readiness to manage risk based on evaluation criteria developed by the assessment team. These criteria should be based on the DevSecOps Continuous Authorization to Operate Evaluation Criteria [3]."
    status: "candidate"
    work_item: "WI-287"
