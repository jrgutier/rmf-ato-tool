    locator: "Key Practices"
    context: "Figure 2. Cybersecurity Risk Governance Group"
    statement: "The objective for assessing the DevSecOps teams is to build trust in the team executing the development, performing the security analysis, and the risk management functions. This includes the development team’s ability for developing secure code and interpreting vulnerability reports, the security team’s ability for managing security control compliance, effectiveness, and risk tolerance, and the DSOP team’s ability to instantiate pipelines integrated with security tools and control gates, and to monitor the production environment for possible malicious actions. These teams are an integral part of how the risk management governance group will manage the risk of use of applications within the single authorization boundary. The team assessment reviews the organizational practices that have been put in place to ensure people are educated, trained, and certified accordingly, based on their DevSecOps position’s required knowledge, skills, and abilities."
    status: "not-a-requirement"
    reason: "States why the teams are assessed and what the team assessment reviews. The 'will' is 'how the risk management governance group will manage the risk', and 'required' qualifies knowledge a position needs; both describe, and the duties are the bullets from 0068 on."
