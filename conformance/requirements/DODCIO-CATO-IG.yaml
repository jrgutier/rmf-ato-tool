  - id: "REQ-DODCIO-CATO-IG-0008"
    citation: {"ref": "DODCIO-CATO-IG", "page": 6, "anchor": "A cATO is a superset of the National Institute of Standards and"}
    kind: "indicative"
    locator: "Introduction"
    context: ""
    statement: "A cATO is a superset of the National Institute of Standards and Technology (NIST) Risk Management Framework (RMF) term ongoing authorization (see the Glossary for a definition), which has existed for years but lacked the automation to make it effective across a broad community. Continuous authorization for DevSecOps includes additional aspects, such as assessing the team and a DevSecOps Platform for supporting continuous risk monitoring."
    status: "not-a-requirement"
    reason: "Relates cATO to the NIST term ongoing authorization ('is a superset of'). A description; that the team and the platform are assessed is stated as a step at 0031 and 0041."
