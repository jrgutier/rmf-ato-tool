  - id: "REQ-DODCIO-CATO-IG-0122"
    citation: {"ref": "DODCIO-CATO-IG", "page": 17, "anchor": "Use Case 1 (Software delivery inside the DevSecOps Platform (DSOP) Boundary): A"}
