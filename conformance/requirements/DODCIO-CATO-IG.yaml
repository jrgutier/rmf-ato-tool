requirements:
  - id: "REQ-DODCIO-CATO-IG-0001"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "“Real-time or near real-time data analytics for reporting security events is essential"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "“Real-time or near real-time data analytics for reporting security events is essential to achieve the level of cybersecurity required to combat today’s cyber threats and operate in contested spaces.” – Continuous Authorization To"
    status: "not-a-requirement"
    reason: "Epigraph quoted from the cATO memo, standing above the Introduction as its motivation. 'Is essential' is the memo's judgment of what analytics are worth, with no actor or action, and 'required to' combat threats describes a level of cybersecurity, not who must reach it, so neither binds anyone here. Real-time reporting binds as a practice at 0027; the memo's own duty is quoted at 0009."
  - id: "REQ-DODCIO-CATO-IG-0002"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "The exigencies of today demand the agility to respond to changing mission"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "The exigencies of today demand the agility to respond to changing mission needs by delivering capabilities more rapidly than with traditional DoD processes. To enable such a rapid pace, industry has moved to using DevSecOps software development, often delivering new capabilities multiple times per day. DoD must also modernize its approach to software development and delivery to keep pace with the constantly changing threat so that it can deliver resilient software capability at the speed of relevance."
    status: "not-a-requirement"
    reason: "Introduction's motivation. The 'must' is the Department stating why it is modernizing, with no role, artifact or date, so the must binds no one reading this guide."
  - id: "REQ-DODCIO-CATO-IG-0003"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "Many DoD Components identify obtaining an Authorization to Operate (ATO) as the"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "Many DoD Components identify obtaining an Authorization to Operate (ATO) as the longest step in developing and deploying software. Delivering new features rapidly requires an authorization process that can keep pace with continuous change for a developing capability— called Continuous Authorization to Operate (cATO). An organization with a cATO is allowed to continuously assess and deploy subsystems that meet the risk tolerances for use within a system authorization boundary. A cATO moves away from a control assessment point-in-time approach to focusing on continuous risk determination and authorization through demonstrated continuous assessing, monitoring, and risk management."
    status: "not-a-requirement"
    reason: "Background that introduces the term cATO. 'Requires' here is about speed: delivering features 'requires an authorization process that can keep pace', an observation that binds no one. 'Is allowed to' states the effect of holding a cATO."
  - id: "REQ-DODCIO-CATO-IG-0004"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "This document focuses on the continuous assessment and authorization of developing and"}
    kind: "indicative"
    locator: "Introduction"
    context: ""
    statement: "This document focuses on the continuous assessment and authorization of developing and securing application software produced by a software factory that includes a DevSecOps Platform (DSOP), particularly the two use cases described in the DevSecOps Continuous Authorization to Operate Evaluation Criteria [3] and reproduced here in Appendix A. This document identifies the key practices of continuous authorization and describes the method for assessing an organization’s readiness to enter continuous authorization. Active risk management, in the form of cATO, is enabled by organizations establishing competencies in managing risk through a risk governance process."
    status: "not-a-requirement"
    reason: "Scope of the guide: what it focuses on and identifies, and that risk management 'is enabled by' competencies. The practices themselves are at 0048 onward."
  - id: "REQ-DODCIO-CATO-IG-0005"
    citation: {"ref": "DODCIO-CATO-IG", "page": 5, "anchor": "The audience for this document is implementers of systems that seek a"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "The audience for this document is implementers of systems that seek a cATO. It provides an overview of cATO that includes key practices that must be implemented to achieve a cATO."
    status: "not-a-requirement"
    reason: "Names the audience and says the document gives an overview of practices that 'must be implemented'. The must is a pointer to the practices listed later and binds no one in this sentence."
  - id: "REQ-DODCIO-CATO-IG-0006"
    citation: {"ref": "DODCIO-CATO-IG", "page": 6, "anchor": "Continuous Authorization to Operate (cATO) is the state achieved when the organization"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "Continuous Authorization to Operate (cATO) is the state achieved when the organization that develops, secures, and operates a system has demonstrated sufficient maturity in their ability to maintain a resilient cybersecurity posture that traditional risk assessments and authorizations become redundant. This organization must have implemented robust information security continuous monitoring capabilities, active cyber defense, and secure software supply chain requirements to enable continuous delivery of capabilities without adversely impacting the system’s cyber posture."
    status: "candidate"
    work_item: "WI-289"
  - id: "REQ-DODCIO-CATO-IG-0007"
    citation: {"ref": "DODCIO-CATO-IG", "page": 6, "anchor": "Systems seeking a cATO must have already achieved an Authorization to Operate"}
    kind: "modal"
    locator: "Introduction"
    context: ""
    statement: "Systems seeking a cATO must have already achieved an Authorization to Operate (ATO) and have entered the Risk Management Framework (RMF) monitor stage."
    status: "candidate"
    work_item: "WI-289"
  - id: "REQ-DODCIO-CATO-IG-0008"
    citation: {"ref": "DODCIO-CATO-IG", "page": 6, "anchor": "A cATO is a superset of the National Institute of Standards and"}
    kind: "indicative"
    locator: "Introduction"
    context: ""
    statement: "A cATO is a superset of the National Institute of Standards and Technology (NIST) Risk Management Framework (RMF) term ongoing authorization (see the Glossary for a definition), which has existed for years but lacked the automation to make it effective across a broad community. Continuous authorization for DevSecOps includes additional aspects, such as assessing the team and a DevSecOps Platform for supporting continuous risk monitoring."
    status: "not-a-requirement"
    reason: "Relates cATO to the NIST term ongoing authorization ('is a superset of'). A description; that the team and the platform are assessed is stated as a step at 0031 and 0041."
  - id: "REQ-DODCIO-CATO-IG-0009"
    citation: {"ref": "DODCIO-CATO-IG", "page": 6, "anchor": "The Continuous Authorization To Operate (cATO) Memo [1] states: “In order to"}
    kind: "modal"
    locator: "The cATO Competencies"
    context: ""
    statement: "The Continuous Authorization To Operate (cATO) Memo [1] states: “In order to achieve cATO, the Authorizing Official (AO) must be able to demonstrate three main competencies: On-going visibility of key cybersecurity activities inside of the system boundary with a robust continuous monitoring of RMF controls; the ability to conduct active cyber defense in order to respond to cyber threats in real time; and the adoption and use of an approved DevSecOps reference design.” To summarize, the three competencies are:"
    status: "candidate"
