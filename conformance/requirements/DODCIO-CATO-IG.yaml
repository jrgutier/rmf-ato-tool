  - {"page": 5, "locator": "Introduction", "reason": "no-marker", "text": "An integral aspect of this agile modernization is the ability to respond rapidly to changing threats through the continuous integration and delivery of cybersecurity, resiliency, and survivability. The cybersecurity landscape, with its advanced persistent threats and innovative approaches to exploiting vulnerabilities, encourages a movement away from point in time assessments and authorizations, instead moving towards continuous monitoring and assessment of risk, using security automation and security posture dashboards that assist in managing the cybersecurity risk in near real-time."}
  - {"page": 5, "locator": "Introduction", "reason": "no-marker", "text": "The modernization approach is delineated in the DoD Software Modernization Strategy [2], which includes objectives to advance DevSecOps through enterprise providers, and to accelerate software deployment with continuous authorization."}
  - {"page": 6, "locator": "Introduction", "reason": "no-marker", "text": "What is Continuous Authorization?"}
  - {"page": 6, "locator": "The cATO Competencies", "reason": "short", "text": "Evaluation Criteria"}
  - {"page": 7, "locator": "Approach", "reason": "short", "text": "Foundational Concepts"}
  - {"page": 7, "locator": "Approach", "reason": "no-marker", "text": "To simplify the discussion here are definitions of some key terms."}
  - {"page": 7, "locator": "Approach", "reason": "no-marker", "text": "DevSecOps pipeline – a collection of DevSecOps tools, upon which the DevSecOps process workflows can be created and executed. – DoD Enterprise DevSecOps Fundamentals, Version 2.1 [4]."}
  - {"page": 7, "locator": "Approach", "reason": "no-marker", "text": "DevSecOps Platform (DSOP) – the set of tools and automation that enables a software factory. It includes the ability to create DevSecOps pipelines with control gates, and to deploy software into development, test, and staging/pre-production environments. It may also deploy into production, depending on the production environment."}
  - {"page": 7, "locator": "Approach", "reason": "no-marker", "text": "Software Factory – a DSOP combined with the people and processes that support the DSOP, as well as a hosting environment such as a cloud; it includes at least development, test and staging/pre-production environments, and it may include a production environment, as well as other environments such as integration."}
  - {"page": 9, "locator": "Approach", "reason": "no-marker", "text": "The RMF outlines a risk-based framework for authorizing a system. It includes a mechanism for continuous assessment and authorization, supported by an organization’s ability to continuously monitor the ongoing risk and ensure it remains within agreed-to risk tolerances. The program office, mission owners, risk assessors, and authorization official collaboratively develop a set of acceptable risk tolerances. The software factory employs risk thresholds that align to organizational risk management tolerances."}
  - {"page": 9, "locator": "Approach", "reason": "lead-in", "text": "A cATO assessment ensures the software factory includes these features:"}
  - {"page": 9, "locator": "Assessment Method", "reason": "no-marker", "text": "This assessment method is a fundamental shift from a point-in-time assessment of organizational compliance with security controls to a periodic assessment of an organization’s continued readiness for managing risk throughout the application lifecycle from development through operations under continuous integration, delivery, and deployment."}
  - {"page": 9, "locator": "Assessment Method", "reason": "short", "text": "cATO Assessment Method"}
  - {"page": 10, "locator": "Assessment Method", "reason": "lead-in", "text": "High Level Evaluation Criteria:"}
  - {"page": 10, "locator": "Assessment Method", "reason": "no-marker", "text": "Appendix B in Table 2 on cATO requirements targets and objectives."}
  - {"page": 10, "locator": "Assessment Method", "reason": "no-marker", "text": "cATO Memo Assessment Crosswalk"}
  - {"page": 10, "locator": "Assessment Method", "reason": "lead-in", "text": "This section relates the assessment method of evaluating the software factory, processes, and people to the cATO Memo competencies discussed earlier in the cATO Competencies section:"}
  - {"page": 10, "locator": "Assessment Method", "reason": "not-normative", "text": "These competencies are themes that resonate across the cATO assessment process, as illustrated in Table 1. For example, for CONMON, the software factory must have the automation to generate, analyze and display machine evidence; also, there must be good processes in use (e.g., incident response); and the people must be trained in both the automation and the processes. Similarly, for each of the other competencies."}
  - {"page": 11, "locator": "Assessment Method", "reason": "no-marker", "text": "DevSecOps Continuous Authorization to Operate Evaluation Criteria"}
  - {"page": 11, "locator": "Key Practices", "reason": "no-marker", "text": "This section discusses key practices to implement and assess. These are organized into the DevSecOps Platform, cATO Process, and DevSecOps Team (People) practices."}
  - {"page": 11, "locator": "Key Practices", "reason": "short", "text": "DevSecOps Platform Practices"}
  - {"page": 12, "locator": "Key Practices", "reason": "short", "text": "cATO Process Practices"}
  - {"page": 12, "locator": "Key Practices", "reason": "no-marker", "text": "The cATO process practices provide for the continuous monitoring, assessment, and management of risk. The objective is to assess the organizational practices to ensure continuous monitoring and response has been instituted for managing production system cyber risk within tolerances. Many of these practices can be automated, including risk determinations and continued ongoing authorization decisions."}
  - {"page": 13, "locator": "Key Practices", "reason": "short", "text": "DevSecOps Team Practices"}
