    locator: "Appendix A. Use Cases"
    context: ""
    statement: "Use Case 1 (Software delivery inside the DevSecOps Platform (DSOP) Boundary): A software factory already has an ATO. Software is developed in that factory and deployed within its production environment (i.e., within its system boundary) as depicted in Figure 3. The software factory seeks a cATO that includes its production environment. This is the main use case for a DevSecOps Platform (DSOP) leveraging cATO. Example: Software developed and put into production using the Platform One (P1) Party Bus."
