  - id: "REQ-DODCIO-CATO-IG-0179"
    citation: {"ref": "DODCIO-CATO-IG", "page": 23, "anchor": "Authorizing Official (AO) is “a senior Federal official or executive with the"}
    kind: "modal"
    locator: "Appendix C. Glossary"
    context: ""
    statement: "Authorizing Official (AO) is “a senior Federal official or executive with the authority to authorize (i.e., assume responsibility for) the operation of an information system or the use of a designated set of common controls at an acceptable level of risk to agency operations (including mission, functions, image, or reputation), agency assets, individuals, other organizations, and the Nation.” NIST 800-37r2 [7]."
    status: "not-a-requirement"
    reason: "Glossary definition of the AO quoted from SP 800-37r2. 'Assume responsibility' describes the office and imposes nothing here; PER-AO holds the role."
  - id: "REQ-DODCIO-CATO-IG-0180"
    citation: {"ref": "DODCIO-CATO-IG", "page": 23, "anchor": "Authorization to Operate (ATO) is “the official management decision given by a"}
    kind: "indicative"
    locator: "Appendix C. Glossary"
    context: ""
    statement: "Authorization to Operate (ATO) is “the official management decision given by a senior Federal official or officials to authorize operation of an information system and to explicitly accept the risk to agency operations (including mission, functions, image, or reputation), agency assets, individuals, other organizations, and the Nation based on the implementation of an agreed-upon set of security and privacy controls. Authorization also applies to common controls inherited by agency information systems.” NIST 800-37r2 [7]."
    status: "not-a-requirement"
    reason: "Glossary definition of an ATO from SP 800-37r2; AD-ATO in framework/decisions.yaml carries the decision."
  - id: "REQ-DODCIO-CATO-IG-0181"
    citation: {"ref": "DODCIO-CATO-IG", "page": 23, "anchor": "Authorization to Use is “the official management decision given by an authorizing"}
    kind: "indicative"
    locator: "Appendix C. Glossary"
    context: ""
    statement: "Authorization to Use is “the official management decision given by an authorizing official to authorize the use of an information system, service, or application based on the information in an existing authorization package generated by another organization, and to explicitly accept the risk to agency operations (including mission, functions, image, or reputation), agency assets, individuals, other organizations, and the Nation based on the implementation of an agreed-upon set of controls in the system, service, or application. Note: An authorization to use typically applies to cloud and shared systems, services, and applications and is employed when an organization (referred to as the customer organization) chooses to accept the information in an existing authorization package generated by another organization (referred to as the provider organization).” NIST 800-37r2 [7]."
    status: "not-a-requirement"
    reason: "Glossary definition of authorization to use from SP 800-37r2. Its absence from the decisions is WI-01, raised from that source."
  - id: "REQ-DODCIO-CATO-IG-0182"
    citation: {"ref": "DODCIO-CATO-IG", "page": 23, "anchor": "Continuous Authority to Operate (cATO) is the state achieved when the organization"}
    kind: "modal"
    locator: "Appendix C. Glossary"
    context: ""
    statement: "Continuous Authority to Operate (cATO) is the state achieved when the organization that develops, secures, and operates a system has demonstrated sufficient maturity in their ability to maintain a resilient cybersecurity posture that traditional risk assessments and authorizations become redundant. This organization must have implemented robust information security continuous monitoring capabilities, active cyber defense, and secure software supply chain requirements to enable continuous delivery of capabilities without adversely impacting the system’s cyber posture."
    status: "candidate"
    work_item: "WI-289"
  - id: "REQ-DODCIO-CATO-IG-0183"
    citation: {"ref": "DODCIO-CATO-IG", "page": 23, "anchor": "Control gate is a defined point in the project lifecycle when specific"}
    kind: "modal"
    locator: "Appendix C. Glossary"
    context: ""
    statement: "Control gate is a defined point in the project lifecycle when specific requirements, called exit criteria, must be met to move to the next phase in the lifecycle. Exit criteria include functional, security, and non-functional criteria."
    status: "not-a-requirement"
    reason: "Glossary definition of a control gate. 'Must be met' is inside the definition, saying what a gate is, so the must binds no one; the gates themselves are 0059."
  - id: "REQ-DODCIO-CATO-IG-0184"
    citation: {"ref": "DODCIO-CATO-IG", "page": 23, "anchor": "Common Control Provider is “an organizational official responsible for the development, implementation,"}
    kind: "modal"
    locator: "Appendix C. Glossary"
    context: ""
    statement: "Common Control Provider is “an organizational official responsible for the development, implementation, assessment, and monitoring of common controls (i.e., controls inheritable by organizational systems).” NIST 800-37r2 [7]."
    status: "not-a-requirement"
    reason: "Glossary definition from SP 800-37r2: 'responsible for' says who the term means and places no new duty. PER-CCP holds the role."
  - id: "REQ-DODCIO-CATO-IG-0185"
