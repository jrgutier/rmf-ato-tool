  - id: "REQ-DODI5000.82-0003"
    citation: {"ref": "DODI5000.82", "page": 4, "anchor": "The acquisition of digital capabilities, as defined for the purposes of this"}
    kind: "lettered"
    locator: "1.2.a"
    context: "POLICY"
    statement: "a. The acquisition of digital capabilities, as defined for the purposes of this issuance, supports the National Defense Strategy and the DoD Digital Modernization Strategy – DoD Information Resource Strategic Plan Fiscal Years 2019-2023 (also known and referred to in this issuance as the “DoD Digital Modernization Strategy”), and aligns with DoD IT, cybersecurity, and supply chain risk management (SCRM) policies, enterprise architectures, and technology and data standards. This alignment results in the delivery of interoperable, secure, survivable, and operationally resilient digital capabilities across the joint force."
    status: "not-a-requirement"
    reason: "Description of what digital acquisition does: it 'supports the National Defense Strategy', 'aligns with' DoD policies, and 'This alignment results in' delivery. No actor and no act."
  - id: "REQ-DODI5000.82-0004"
    citation: {"ref": "DODI5000.82", "page": 4, "anchor": "Procurements, including vendor or contractor provided procurements, not specifically addressed in this"}
    kind: "lettered"
    locator: "1.2.b"
    context: "POLICY"
    statement: "b. Procurements, including vendor or contractor provided procurements, not specifically addressed in this issuance must be authorized by the contracting officer."
    status: "deferred"
    reason: "Procurements 'must be authorized by the contracting officer': a contracting authority rule for buys this issuance does not name. It governs procurement, no persona holds a contracting officer, and no RMF run touches it."
  - id: "REQ-DODI5000.82-0005"
    citation: {"ref": "DODI5000.82", "page": 4, "anchor": "The overarching management principles that guide the DAS are described in DoDD"}
    kind: "modal"
    locator: "1.3"
    context: "DEFENSE ACQUISITION SYSTEM (DAS) REALIGNMENT PLAN"
    statement: "The overarching management principles that guide the DAS are described in DoDD 5000.01 and DoDI 5000.02. The DAS supports the National Defense Strategy by developing a lethal and effective force based on American technological innovation, and a culture of performance that yields decisive and sustained U.S. military advantage. To achieve this objective, the DoD will employ an adaptive acquisition framework comprised of acquisition pathways (see Figure 1), each with unique characteristics of the capability being acquired."
    status: "candidate"
