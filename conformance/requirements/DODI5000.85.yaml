  - id: "REQ-DODI5000.85-0106"
    citation: {"ref": "DODI5000.85", "page": 19, "anchor": "ACAT III"}
    kind: "table"
    locator: "APPENDIX 3A: ACATS"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs."
    statement: "ACAT III Footnotes 1. Unless designated an MDAP by the Secretary of Defense (SecDef), AIS programs5, Defense Business System programs, and programs or projects carried out using rapid prototyping or fielding procedures pursuant to Section 804 of Public Law (PL) 114-92, do not meet the definition of an MDAP. 2. ACAT IB decision authority is assigned pursuant to Section 2430 of Title 10, U.S.C. Paragraph 3A.2.b. provides DoD implementation details. 3. The Special Interest designation is typically based on one or more of the following factors: technological complexity; congressional interest; a large commitment of resources; or the program is critical to the achievement of a capability or set of capabilities, part of a system of systems, or a joint program. Programs that already meet the MDAP thresholds cannot be designated as Special Interest. 4. As delegated by the SecDef or Secretary of the Military Department. | • Does not meet dollar value thresholds for ACAT II or above • Is not designated a “major system” by the MDA | Designated by the CAE4"
