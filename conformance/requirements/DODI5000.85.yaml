    context: "GENERAL PROCEDURES The policies outlined in Paragraphs (1) through (3) will guide decision reviews:"
    statement: "(1) The MDA is the sole and final decision authority. Staff members and staff organizations support and facilitate the MDA's execution of that authority."
    status: "candidate"
  - id: "REQ-DODI5000.85-0032"
    citation: {"ref": "DODI5000.85", "page": 8, "anchor": "The Defense Acquisition Board will advise the DAE on critical acquisition decisions"}
    kind: "lettered"
    locator: "3.1.b.(2)"
    context: "GENERAL PROCEDURES The policies outlined in Paragraphs (1) through (3) will guide decision reviews:"
    statement: "(2) The Defense Acquisition Board will advise the DAE on critical acquisition decisions when the DAE, or designee, is the MDA. The DAE or designee will chair the Defense Acquisition Board. Similar procedures will be established at the DoD Component level for use by other MDAs. An acquisition decision memorandum (ADM) will document decisions resulting from reviews."
    status: "not-applicable"
    reason: "Binds the Defense Acquisition Board and the DAE: 'The Defense Acquisition Board will advise the DAE' and 'The DAE or designee will chair'. How a body outside the run organizes its own advice is its internal procedure; checked PER-MDA, which takes the decision but holds no board, and nothing in a run records an ADM."
  - id: "REQ-DODI5000.85-0033"
    citation: {"ref": "DODI5000.85", "page": 8, "anchor": "Overarching Integrated Product Teams at the OSD level, and similar organizations within"}
    kind: "lettered"
