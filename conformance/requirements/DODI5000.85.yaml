    statement: "(b) The PM uses PS analyses (e.g., failure modes, effects and criticality analysis; level of repair, source of repair; maintenance task, provisioning) to determine logistics product data contract and technical data requirements, logistics support analysis, and the maintenance concept (organic, contractor, or a combination)."
    status: "deferred"
    reason: "'The PM uses PS analyses' to set logistics data and the maintenance concept: product support engineering, which no RMF run performs."
  - id: "REQ-DODI5000.85-0141"
    citation: {"ref": "DODI5000.85", "page": 25, "anchor": "The acquisition strategy is the basis of contract data requirement lists and"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a.(2).(c)"
    context: "CONSIDERATIONS Acquisition Strategies PS and Supportability Planning"
    statement: "(c) The acquisition strategy is the basis of contract data requirement lists and should consider providing for planning for incremental quality reviews of vendor/original equipment manufacturer deliverables."
