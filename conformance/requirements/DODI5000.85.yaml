    status: "deferred"
    reason: "'MDAs will structure program strategies and oversight, phase content, the timing and scope of decision reviews': tailoring of the acquisition program. Security is named only as one factor; no RMF run reads this structure."
  - id: "REQ-DODI5000.85-0036"
