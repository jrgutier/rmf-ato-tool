  - id: "REQ-DODI5000.85-0030"
    citation: {"ref": "DODI5000.85", "page": 8, "anchor": "The purpose of decision reviews embedded in the acquisition procedures described in"}
    kind: "modal"
    locator: "3.1.b"
    context: "GENERAL PROCEDURES"
    statement: "The purpose of decision reviews embedded in the acquisition procedures described in this section is to carefully assess a program’s readiness to proceed to the next acquisition phase and to make a sound investment decision committing the Department’s financial resources. Consequently, reviews will be issue and data focused to facilitate an examination of relevant questions affecting the decisions under consideration and to allow the MDA to judge whether the program is ready to proceed. The policies outlined in Paragraphs (1) through (3) will guide decision reviews:"
    status: "deferred"
    reason: "'reviews will be issue and data focused' so the MDA can judge readiness for the next phase: how acquisition decision reviews are run; no RMF input or output. Its last sentence is the lead-in to items (1) to (3)."
  - id: "REQ-DODI5000.85-0031"
    citation: {"ref": "DODI5000.85", "page": 8, "anchor": "The MDA is the sole and final decision authority. Staff members and"}
    kind: "lettered"
