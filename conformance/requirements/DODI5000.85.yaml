  - id: "REQ-DODI5000.85-0027"
    citation: {"ref": "DODI5000.85", "page": 8, "anchor": "A rapid, iterative approach to capability development reduces cost, avoids technological obsolescence,"}
    kind: "lettered"
    locator: "3.1.a.(1)"
    context: "GENERAL PROCEDURES Program Planning"
    statement: "(1) A rapid, iterative approach to capability development reduces cost, avoids technological obsolescence, and reduces acquisition risk. Consistent with that intent, acquisitions will rely on mature, proven technologies and early testing. Planning will capitalize on commercial solutions and non-traditional suppliers, and expand the role of warfighters and security, counterintelligence, and intelligence analysis throughout the acquisition process."
    status: "candidate"
  - id: "REQ-DODI5000.85-0028"
