  - id: "REQ-DODI5000.85-0129"
    citation: {"ref": "DODI5000.85", "page": 23, "anchor": "It is a program manager’s responsibility to fully understand the skills and"}
    kind: "modal"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a"
    context: "CONSIDERATIONS"
    statement: "It is a program manager’s responsibility to fully understand the skills and capacity required for successful program execution and for the CAE to provide those skills to ensure that programs execute successfully. Program offices will be established prior to Milestone A or earlier as necessary. Program offices for MDAPs will be staffed in key leadership positions with military or DoD civilian employees qualified in accordance with DoDI 5000.66. Key leadership positions include the PM and deputy PM, and the other positions identified in DoDI 5000.66."
    status: "deferred"
    reason: "'Program offices will be established prior to Milestone A' and staffed in key leadership positions under DoDI 5000.66: acquisition workforce staffing, which no RMF run touches."
  - id: "REQ-DODI5000.85-0130"
    citation: {"ref": "DODI5000.85", "page": 23, "anchor": "A joint program office will be established when a defense acquisition program"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.b.(1)"
    context: "CONSIDERATIONS Joint Program Office Organization"
    statement: "(1) A joint program office will be established when a defense acquisition program involves the satisfaction of validated capability requirements from multiple DoD Components or international partners, and is funded by more than one DoD Component or partner during any phase of the acquisition process In joint programs, a lead Component will be designated to manage the acquisition process and act as the acquisition agent for the participating DoD Components. The participating DoD Components (i.e., those with a requirement for the program’s products) support and participate with the lead DoD Component in managing the acquisition process."
    status: "deferred"
    reason: "'A joint program office will be established' for multi-Component programs and 'a lead Component will be designated to manage the acquisition process': acquisition management, not joint authorization (WI-10)."
  - id: "REQ-DODI5000.85-0131"
    citation: {"ref": "DODI5000.85", "page": 23, "anchor": "Joint programs will be managed in accordance with the provisions of a"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.b.(2)"
    context: "CONSIDERATIONS Joint Program Office Organization"
    statement: "(2) Joint programs will be managed in accordance with the provisions of a memorandum of agreement and with the lead DoD Component’s acquisition procedures and acquisition chain of command, unless directed otherwise by the DAE."
    status: "deferred"
    reason: "'Joint programs will be managed in accordance with the provisions of a memorandum of agreement' and the lead Component's acquisition chain: program management with no RMF input or output."
  - id: "REQ-DODI5000.85-0132"
    citation: {"ref": "DODI5000.85", "page": 23, "anchor": "DoD Components will neither terminate nor substantially reduce participation in joint MDAPs"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.b.(3)"
    context: "CONSIDERATIONS Joint Program Office Organization"
    statement: "(3) DoD Components will neither terminate nor substantially reduce participation in joint MDAPs without capability requirements validation authority review and DAE approval. The DAE may require a DoD Component to continue some or all funding, as necessary, to sustain the joint program in an efficient manner, despite approving a request to terminate or reduce participation. Memorandums of agreement between DoD Components should address termination or reduced participation by any parties to the agreement. Substantial reduction will be determined by the MDA in coordination with the requirements validation authority, and is defined as a funding or quantity decrease that impacts the viability of the program or significantly increases the costs to the other participants in the program."
    status: "deferred"
    reason: "'DoD Components will neither terminate nor substantially reduce participation in joint MDAPs': funding commitments, which no RMF run touches."
  - id: "REQ-DODI5000.85-0133"
    citation: {"ref": "DODI5000.85", "page": 24, "anchor": "PMs direct the development, production, deployment, PS, sustainment, and supportability of new"}
    kind: "modal"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.b.(3)"
    context: "CONSIDERATIONS Joint Program Office Organization"
    statement: "PMs direct the development, production, deployment, PS, sustainment, and supportability of new defense systems. Management activities will be designed to achieve the cost, schedule, and performance parameters specified in the MDA-approved APB, and include PS considerations. The tools outlined in Paragraphs 3C.3.a. thorugh e. will be used to facilitate effective program planning and execution."
    status: "deferred"
    reason: "'Management activities will be designed to achieve the cost, schedule, and performance parameters specified in the MDA-approved APB': program management tools outside any RMF run."
  - id: "REQ-DODI5000.85-0134"
    citation: {"ref": "DODI5000.85", "page": 24, "anchor": "The PM will develop and execute an approved acquisition strategy. This document"}
    kind: "modal"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a.(1)"
    context: "CONSIDERATIONS Acquisition Strategies"
    statement: "The PM will develop and execute an approved acquisition strategy. This document is the PM’s plan for program execution across the entire program life cycle."
    status: "deferred"
    reason: "'The PM will develop and execute an approved acquisition strategy': the strategy is a program document no RMF run produces. What it takes from a run is at 0137."
  - id: "REQ-DODI5000.85-0135"
    citation: {"ref": "DODI5000.85", "page": 24, "anchor": "The acquisition strategy is a comprehensive, integrated plan that identifies the acquisition"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a.(1).(a)"
    context: "CONSIDERATIONS Acquisition Strategies"
    statement: "(a) The acquisition strategy is a comprehensive, integrated plan that identifies the acquisition approach and key framing assumptions, and describes the business, technical, PS, security, and supportability strategies that the PM plans to employ to manage program risks and meet program objectives. The strategy evolves over time and should continuously reflect the current status and desired goals of the program."
    status: "deferred"
    reason: "'The strategy evolves over time and should continuously reflect the current status': a description of the acquisition strategy as a plan; its security content is reached through 0137, and no RMF run keeps this document."
  - id: "REQ-DODI5000.85-0136"
    citation: {"ref": "DODI5000.85", "page": 24, "anchor": "The strategy should address capability requirements for system performance likely to evolve"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a.(1).(b)"
    context: "CONSIDERATIONS Acquisition Strategies"
    statement: "(b) The strategy should address capability requirements for system performance likely to evolve during the life cycle because of evolving technology, threat, or interoperability needs or to reduce program cost or schedule and enable technology refresh. The acquisition strategy defines the relationship between the acquisition phases and work efforts, and key program events such as decision points and reviews."
    status: "deferred"
    reason: "'The strategy should address capability requirements for system performance likely to evolve': performance and technology refresh planning, on no RMF touchpoint."
  - id: "REQ-DODI5000.85-0137"
    citation: {"ref": "DODI5000.85", "page": 24, "anchor": "The strategy must reflect the PM’s understanding of the business environment; technical"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a.(1).(c)"
    context: "CONSIDERATIONS Acquisition Strategies"
    statement: "(c) The strategy must reflect the PM’s understanding of the business environment; technical alternatives; small business strategy; costs, risks and risk mitigation approach; environment, safety, and occupational health (ESOH) risk and requirements management approach; contract awards; the incentive structure; test activities; manufacturing and quality approach and risks; production lot or delivery quantities; operational deployment objectives; opportunities in the domestic and international markets; foreign disclosure, exportability, technology transfer, and security requirements; and the plan to support successful delivery of the capability at an affordable life-cycle price, on a realistic schedule. Acquisition strategies are baseline plans for the execution of the program and should be prepared and submitted in time to obtain approval to support more detailed planning and the preparation of RFPs."
    status: "candidate"
  - id: "REQ-DODI5000.85-0138"
    citation: {"ref": "DODI5000.85", "page": 24, "anchor": "The acquisition strategy is an approved plan; it is not a contract."}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a.(1).(d)"
    context: "CONSIDERATIONS Acquisition Strategies"
    statement: "(d) The acquisition strategy is an approved plan; it is not a contract. Minor changes to the plan reflected in the acquisition strategy due to changed circumstances or increased knowledge are to be expected and do not require MDA pre-approval. Major changes, such as contract type or basic program structure, do require MDA approval prior to implementation. All changes should be noted and reflected in an update at the next program decision point or milestone."
    status: "deferred"
    reason: "'Major changes, such as contract type or basic program structure, do require MDA approval prior to implementation': change control of the acquisition strategy, not of the system, so no RMF run touches it."
  - id: "REQ-DODI5000.85-0139"
    citation: {"ref": "DODI5000.85", "page": 25, "anchor": "The PM, with the support of the PS manager (PSM), will include"}
    kind: "lettered"
    locator: "APPENDIX 3B: PROGRAM INFORMATION.a.(2).(a)"
    context: "CONSIDERATIONS Acquisition Strategies PS and Supportability Planning"
    statement: "(a) The PM, with the support of the PS manager (PSM), will include PS and supportability planning, tests, evaluations, and quality reviews in the acquisition strategy and the integrated master plan/schedule."
    status: "deferred"
    reason: "'The PM ... will include PS and supportability planning, tests, evaluations, and quality reviews in the acquisition strategy': product support content, on no RMF touchpoint."
  - id: "REQ-DODI5000.85-0140"
    citation: {"ref": "DODI5000.85", "page": 25, "anchor": "The PM uses PS analyses (e.g., failure modes, effects and criticality analysis;"}
    kind: "lettered"
