    locator: "APPENDIX 3A: ACATS.b.(1)"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs, Continued. ACAT IB Programs"
    statement: "(1) Pursuant to Subsection (d) of Section 2430, of Title 10, U.S.C., the SAE of the Military Department that is managing an MDAP reaching Milestone A after October 1, 2016 will be the MDA for the MDAP unless, based on one or more exceptions in the statute, the SecDef designates an alternate MDA. In accordance with DoDD 5135.02, the SecDef has delegated the authority to designate an alternate MDA for an MDAP to the USD(A&S)."
    status: "deferred"
    reason: "'the SAE of the Military Department that is managing an MDAP ... will be the MDA': which acquisition official holds a program's milestones. PER-MDA has no appointing authority and no RMF input or output depends on this rule."
  - id: "REQ-DODI5000.85-0109"
    citation: {"ref": "DODI5000.85", "page": 20, "anchor": "At least annually, at submission of the Program Objective Memorandum, each SAE"}
    kind: "lettered"
    locator: "APPENDIX 3A: ACATS.b.(2)"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs, Continued. ACAT IB Programs"
    statement: "(2) At least annually, at submission of the Program Objective Memorandum, each SAE will provide, in writing, sufficient information to allow the USD(A&S) to consider whether any of the bases for designation of an alternate MDA as set forth in Section 2430(d) of Title 10, U.S.C., apply. This information must be provided for all programs for which the Military Department anticipates an MDD or a Milestone A decision (or later milestone decision if this will be the program's first milestone) in the first year of the Program Objective Memorandum FYDP and that are estimated to require eventual total expenditures of funds for all increments that exceed the MDAP dollar value thresholds set in Section 2430 of Title 10, U.S.C., as adjusted and specified in Table 1."
    status: "not-applicable"
    reason: "Binds the SAE to USD(A&S): 'each SAE will provide, in writing, sufficient information' on alternate MDAs each POM. Checked PER-MDA; this is a yearly department report between acquisition executives, and nothing in a run holds or consumes it."
  - id: "REQ-DODI5000.85-0110"
    citation: {"ref": "DODI5000.85", "page": 20, "anchor": "Programs, for which the SAE is the MDA by operation of Section"}
    kind: "lettered"
    locator: "APPENDIX 3A: ACATS.b.(3)"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs, Continued. ACAT IB Programs"
    statement: "(3) Programs, for which the SAE is the MDA by operation of Section 2430 of Title 10, U.S.C., will be designated within the DoD as ACAT IB programs to differentiate these programs from ACAT ID programs, where the USD(A&S) is the MDA, or ACAT IC programs, where the USD(A&S) as the DAE has delegated the DAE's decision authority to the SAE. Should the USD(A&S) designate the DAE or other official as the alternate MDA the ACAT IB program will be re-designated as ACAT ID."
    status: "deferred"
    reason: "'Programs ... will be designated within the DoD as ACAT IB programs', with re-designation as ACAT ID: labels for acquisition oversight, with no RMF input or output."
  - id: "REQ-DODI5000.85-0111"
    citation: {"ref": "DODI5000.85", "page": 20, "anchor": "Pursuant to subparagraph (d)(3)(A) of Section 2430, of Title 10, U.S.C., for"}
    kind: "lettered"
    locator: "APPENDIX 3A: ACATS.b.(4)"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs, Continued. ACAT IB Programs"
    statement: "(4) Pursuant to subparagraph (d)(3)(A) of Section 2430, of Title 10, U.S.C., for programs for which the USD(A&S) has designated an alternate MDA, the Secretary of the Military Department concerned, or designee, may request reversion of responsibility back to the SAE. The USD(A&S) must make a decision with regard to the Military Department's request within 180 days after receiving the request. In the event the MDA for the program reverts back to the SAE, either at the request of the Military Department or at the DAE's discretion, the program would revert from its ACAT ID designation to an ACAT IB designation."
    status: "not-applicable"
    reason: "Binds USD(A&S) and the Secretary: 'The USD(A&S) must make a decision' on reversion within 180 days. Checked PER-MDA, whose identity changes but whose run duties do not; the request is OSD procedure, and no run consumes it."
  - id: "REQ-DODI5000.85-0112"
    citation: {"ref": "DODI5000.85", "page": 20, "anchor": "SAEs managing ACAT IB programs must continue to comply with all statutes"}
    kind: "lettered"
    locator: "APPENDIX 3A: ACATS.b.(5)"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs, Continued. ACAT IB Programs"
    statement: "(5) SAEs managing ACAT IB programs must continue to comply with all statutes that require information about an MDAP to be provided to OSD or the Office of the USD(A&S). For example, Section 2432 of Title 10, U.S.C., requires the SecDef to submit Selected Acquisition Reports (SARs) for MDAPs. For ACAT IB programs, the Military Departments must continue to use the Defense Acquisition Visibility Environment system for preparation and management of APBs and SARs, to enable continued efficient and streamlined execution of Congressional reporting for all MDAPs, including ACAT IB programs, through the Principal Deputy Assistant Secretary of Defense (Acquisition Enablers)."
    status: "not-applicable"
    reason: "Binds the SAE and the Military Departments: 'SAEs managing ACAT IB programs must continue to comply' with statutes on reporting to OSD, through Selected Acquisition Reports. Checked PER-MDA; this congressional cost reporting has no artifact in a run, and SAR here is not ART-SAR."
  - id: "REQ-DODI5000.85-0113"
    citation: {"ref": "DODI5000.85", "page": 21, "anchor": "The Military Departments will use the Defense Acquisition Management Information Retrieval system"}
    kind: "lettered"
    locator: "APPENDIX 3A: ACATS.b.(6)"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs, Continued. ACAT IB Programs"
    statement: "(6) The Military Departments will use the Defense Acquisition Management Information Retrieval system for the ACAT IB program quarterly unit cost reporting required by Section 2433 of Title 10, U.S.C., and will continue to report other quarterly DAE Summary information."
    status: "not-applicable"
    reason: "Binds the Military Departments: 'will use the Defense Acquisition Management Information Retrieval system' for quarterly unit cost reports. Checked PER-PM; a department cost report under 10 U.S.C. 2433 has no home in a run and feeds none."
  - id: "REQ-DODI5000.85-0114"
