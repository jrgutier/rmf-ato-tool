    locator: "APPENDIX 3A: ACATS.5"
    context: "Table 1. Description and Decision Authority for ACAT I – III Programs, Continued."
    statement: "5. An AIS is a system of computer hardware, computer software, data or telecommunications that performs functions such as collecting, processing, storing, transmitting, and displaying information. Excluded are computer resources, both hardware and software, that are: embedded as an integral part of a weapon or weapon system; used for highly sensitive classified programs (as determined by the SecDef) or other highly sensitive information technology programs (as determined by the DoD Chief Information Officer; or determined by the DAE or designee to be better overseen as a non- AIS program (e.g., a program with a low ratio of research, development, testing, and evaluation funding to total program acquisition costs or that requires significant hardware development). An AIS that breaches the dollar thresholds in Section 2302d of Title 10, U.S.C., as adjusted, is a “major system.”"
    status: "not-a-requirement"
    reason: "Footnote 5, a definition: 'An AIS is a system of computer hardware'. 'requires significant hardware development' is an example in that definition and requires nothing of anyone."
