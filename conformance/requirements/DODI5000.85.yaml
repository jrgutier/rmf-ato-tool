    reason: "Table 1 row for ACAT III run together with footnotes 1 to 4: definitions of MDAP and Special Interest. 'cannot be designated' limits a label and 'is critical' describes a program; each binds no one in or near a run, and 0103 holds the duty."
  - id: "REQ-DODI5000.85-0107"
    citation: {"ref": "DODI5000.85", "page": 20, "anchor": "An AIS is a system of computer hardware, computer software, data or"}
