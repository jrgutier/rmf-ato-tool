    context: "GENERAL PROCEDURES The policies outlined in Paragraphs (1) through (3) will guide decision reviews:"
    statement: "(3) Overarching Integrated Product Teams at the OSD level, and similar organizations within the DoD Components, are expected to collectively assist the MDA in making sound investment decisions for the department, and to ensure programs are structured and resourced to succeed. These organizations are not decision bodies and they and their leaders do not supplant the authority of the PM, Program Executive Officer (PEO), component acquisition executive (CAE), or DAE."
    status: "not-applicable"
    reason: "Binds Overarching Integrated Product Teams, which 'are expected to collectively assist the MDA': the internal staffing of OSD and Component advisory groups. Checked PER-MDA and PER-PM; these groups have no role in a run and no output it consumes."
  - id: "REQ-DODI5000.85-0034"
    citation: {"ref": "DODI5000.85", "page": 9, "anchor": "Acquisition, requirements, and budgeting are closely related and must operate simultaneously in"}
    kind: "modal"
    locator: "3.1.c"
    context: "GENERAL PROCEDURES"
    statement: "Acquisition, requirements, and budgeting are closely related and must operate simultaneously in close coordination. Validated requirements provide the basis for defining the products that will be acquired through the acquisition system. The budgeting process determines DoD priorities and resource allocations and provides the funds necessary to execute planned programs. Adjustments may have to be made during a program’s life cycle to keep the three processes aligned to ensure programs are executable and to adapt to evolving circumstances. Decisions in this context must consider mission area or portfolio considerations as well as those directly impacting the program under review."
    status: "deferred"
    reason: "'Acquisition, requirements, and budgeting ... must operate simultaneously in close coordination', and decisions 'must consider mission area or portfolio considerations': alignment of three department processes and funding, which no RMF run touches."
  - id: "REQ-DODI5000.85-0035"
    citation: {"ref": "DODI5000.85", "page": 9, "anchor": "MDAs will structure program strategies and oversight, phase content, the timing and"}
    kind: "lettered"
