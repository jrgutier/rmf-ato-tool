    citation: {"ref": "DODI5000.89", "page": 30, "anchor": "Whether the results of such test and evaluation confirm that the items"}
    kind: "lettered"
    locator: "6.1.b.(2)"
    context: "OVERVIEW For programs under T&E oversight, the DOT&E will provide the MDA with milestone assessments. The DOT&E will submit a report to the Secretary of Defense and the congressional defense committee"
    statement: "(2) Whether the results of such test and evaluation confirm that the items or components actually tested are effective and suitable for combat."
    status: "not-a-requirement"
    reason: "Describing item under 0219: whether results 'confirm that the items or components actually tested are effective and suitable for combat'. A second topic of the opinion."
  - id: "REQ-DODI5000.89-0222"
    citation: {"ref": "DODI5000.89", "page": 30, "anchor": "The lead OTA will prepare and report results of one or more"}
    kind: "lettered"
    locator: "6.2.a.(1)"
    context: "OT&E ACTIVITIES OAs"
    statement: "(1) The lead OTA will prepare and report results of one or more EOAs as appropriate in support of one or more of the design phase life-cycle events (namely, the capability development document validation, the development RFP release decision point, or MS B). An EOA is typically an assessment, conducted in accordance with an approved test plan, of the program’s progress in identifying operational design constraints, developing system capabilities, and reducing program risks. For programs that enter development at MS B, the lead OTA will (as appropriate) prepare and report EOA results after program initiation and before the critical design review."
    status: "deferred"
    reason: "Governs early operational assessment: 'The lead OTA will prepare and report results of one or more EOAs' for design phase events. Design progress for acquisition events, which no RMF run touches."
  - id: "REQ-DODI5000.89-0223"
    citation: {"ref": "DODI5000.89", "page": 30, "anchor": "The lead OTA conducts an OA in accordance with a test plan"}
    kind: "lettered"
    locator: "6.2.a.(2)"
    context: "OT&E ACTIVITIES OAs"
    statement: "(2) The lead OTA conducts an OA in accordance with a test plan approved by the DOT&E for programs that are under T&E oversight. OAs can include dedicated early operational testing, as well as developmental test results, provided they are conducted with operational realism. As a general criterion for proceeding through MS C, the lead OTA will conduct and report results of at least one OA. For an acquisition program using an incrementally deployed software program model, a risk-appropriate OA is usually required in support of every limited deployment. An OT, usually an OA, is required before deployment of accelerated or urgent acquisition programs that are under T&E or LFT&E oversight. The OTA may combine an OA with training events. An OA may not be required for programs that enter the acquisition system at MS C."
    status: "deferred"
    reason: "Governs operational assessment: 'the lead OTA will conduct and report results of at least one OA' before MS C, and an OT 'is required before deployment' of urgent programs. A general effectiveness gate; cybersecurity OT is 0120, so no RMF run touches this."
  - id: "REQ-DODI5000.89-0224"
    citation: {"ref": "DODI5000.89", "page": 30, "anchor": "The Military Services will provide to the DOT&E and USD(R&E) an approved"}
    kind: "modal"
    locator: "6.2.b"
    context: "OT&E ACTIVITIES"
    statement: "The Military Services will provide to the DOT&E and USD(R&E) an approved final draft TEMP or other test strategy documentation before release of RFPs for MS B and MS C. To the maximum extent feasible, RFPs should be consistent with the OT program documented in the TEMP, or other test strategy documentation."
    status: "deferred"
    reason: "Governs RFP timing: 'The Military Services will provide to the DOT&E and USD(R&E) an approved final draft TEMP' before RFP release, and RFPs 'should be consistent' with the OT program. An acquisition sequence, which no RMF run touches."
  - id: "REQ-DODI5000.89-0225"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "OT&E for Reliability and Maintainability."}
    kind: "lettered"
