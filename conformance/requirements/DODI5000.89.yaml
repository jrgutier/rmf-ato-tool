    statement: "(1) The PM is responsible for determining what certifications are required, involving the representatives of applicable certifying authorities in the T&E WIPT, and satisfying the certification requirements."
    status: "deferred"
    reason: "Governs certifications: 'The PM is responsible for determining what certifications are required' and satisfying them. The ATO is required by DoDI 8510.01, not found here, so this list of certifications is one no RMF run touches."
  - id: "REQ-DODI5000.89-0230"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "The PM will provide the MDA, DOT&E, and the lead OTA with"}
    kind: "lettered"
