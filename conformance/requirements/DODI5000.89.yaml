    context: "DT&E ACTIVITIES"
    statement: "a. DT&E activities will start when requirements are being developed to ensure key technical requirements are measurable, testable, and achievable; as well as provide feedback that the system engineering process is performing adequately."
    status: "deferred"
    reason: "Governs DT timing: 'DT&E activities will start when requirements are being developed' so that requirements are testable. Systems engineering feedback; no RMF run touches it."
