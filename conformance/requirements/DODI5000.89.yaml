  - id: "REQ-DODI5000.89-0162"
    citation: {"ref": "DODI5000.89", "page": 24, "anchor": "The software pathway focuses on modern iterative software development techniques such as"}
    kind: "lettered"
    locator: "4.5.a"
    context: "T&E FOR SOFTWARE ACQUISITION PATHWAY"
    statement: "a. The software pathway focuses on modern iterative software development techniques such as agile, lean, and development security operations, which promise faster delivery of working code to the user. The goal of this software acquisition pathway is to achieve continuous integration and continuous delivery to the maximum extent possible. Integrated testing, to include contractor testing, is a critical component needed to reach this goal. Identifying integrated T&E and interoperability requirements early in test strategy development will enable streamlined integration, developmental and operational T&E, interoperability certification, and faster delivery to the field. The program acquisition strategy must clearly identify T&E requirements that have been fully coordinated with the test community."
    status: "deferred"
    reason: "Governs the software acquisition strategy: 'The program acquisition strategy must clearly identify T&E requirements that have been fully coordinated with the test community'. An acquisition strategy duty; no RMF run touches it, and pipeline evidence is PW-SWP's."
  - id: "REQ-DODI5000.89-0163"
    citation: {"ref": "DODI5000.89", "page": 24, "anchor": "The software pathway policy includes a requirement to create a test strategy."}
    kind: "lettered"
    locator: "4.5.b"
    context: "T&E FOR SOFTWARE ACQUISITION PATHWAY"
    statement: "b. The software pathway policy includes a requirement to create a test strategy. The program CDT or T&E lead, in collaboration with the other T&E stakeholders, should develop the test strategy and discuss the approach to developing measurable criteria derived from requirements (e.g., user features, user stories, use cases). The software pathway policy additionally requires the identification of test platforms and infrastructure be included in the acquisition strategy; the estimated T&E costs be included in the cost estimate; and the periodic delivery of the technical baseline to include scripts, tools, libraries, and other software executables necessary to test the software. Taken as whole, the test strategy for software intensive systems should include:"
    status: "candidate"
    work_item: "WI-30"
