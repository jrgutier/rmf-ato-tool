    statement: "(1) Test plans must consider the potential effects on personnel and the environment, in accordance with Sections 4321-4347 of Title 42, U.S.C., and Executive Order 12114. The T&E community, working with the PM and the user community, will provide relevant safety documentation (to include formal environment, safety, and occupational health risk acceptance for the test event) to the developmental and operational testers before any test that may affect safety of personnel."
    status: "deferred"
    reason: "Governs safety and environment: 'Test plans must consider the potential effects on personnel and the environment', and safety documentation goes to testers. Test safety, which no RMF run touches."
  - id: "REQ-DODI5000.89-0245"
    citation: {"ref": "DODI5000.89", "page": 34, "anchor": "Barring significant unforeseen circumstances, all elements of an approved OTP or LFTP"}
    kind: "lettered"
