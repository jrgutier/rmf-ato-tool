    reason: "Pointer: 'Additional information will be available' at the DAU website. That will promises a web page and binds no one."
  - id: "REQ-DODI5000.89-0188"
    citation: {"ref": "DODI5000.89", "page": 27, "anchor": "DT&E activities support data generation for independent evaluations. They also provide program"}
    kind: "indicative"
    locator: "5.1"
    context: "OVERVIEW"
    statement: "DT&E activities support data generation for independent evaluations. They also provide program engineers and decision-makers with information to measure progress, identify problems, characterize system capabilities and limitations, and manage technical and programmatic risks. PMs use DT&E activities to manage and reduce risks during development, verify that products are compliant with contractual and technical requirements, prepare for OT, and inform decision-makers throughout the program life cycle. DT&E results verify exit criteria to ensure adequate progress before investment commitments or initiation of phases of the program, and as the basis for contract incentives."
    status: "not-a-requirement"
    reason: "Description of DT&E: 'DT&E activities support data generation for independent evaluations', and what PMs use them for. Background, with no act assigned."
  - id: "REQ-DODI5000.89-0189"
    citation: {"ref": "DODI5000.89", "page": 27, "anchor": "DT&E starts with capability requirements and continues through product development, delivery, and"}
    kind: "lettered"
    locator: "5.1.a"
    context: "OVERVIEW"
    statement: "a. DT&E starts with capability requirements and continues through product development, delivery, and acceptance; transition to OT&E; production; and operations and support. Consideration of DT&E in the requirements and systems engineering processes ensures that capability requirements are measurable, testable, and achievable. Identifying and correcting deficiencies early is less costly than discovering system deficiencies late in the acquisition process."
    status: "not-a-requirement"
    reason: "Description: 'DT&E starts with capability requirements and continues through product development', and early correction 'is less costly'. It states a sequence and a benefit, and requirements here is a noun."
  - id: "REQ-DODI5000.89-0190"
    citation: {"ref": "DODI5000.89", "page": 27, "anchor": "The PM will take full advantage of DoD ranges, labs, and other"}
    kind: "lettered"
    locator: "5.1.b"
    context: "OVERVIEW"
    statement: "b. The PM will take full advantage of DoD ranges, labs, and other resources. Programs will use government T&E capabilities unless an exception can be justified as cost-effective to the government. PMs will conduct a cost-benefit analysis for exceptions to this policy and obtain approval through the TEMP approval process before acquiring or using non-government, program-unique test facilities or resources."
    status: "deferred"
    reason: "Governs test facilities: 'Programs will use government T&E capabilities unless an exception can be justified as cost-effective', and PMs 'will conduct a cost-benefit analysis'. Cost and facilities, which no RMF run touches."
  - id: "REQ-DODI5000.89-0191"
    citation: {"ref": "DODI5000.89", "page": 27, "anchor": "Systems have become more complex, and resource constraints often force tradeoffs in"}
    kind: "lettered"
    locator: "5.1.c"
    context: "OVERVIEW"
    statement: "c. Systems have become more complex, and resource constraints often force tradeoffs in the type and scope of testing that can be performed. The DT&E budget and schedule must allow testing that adequately verifies performance to contractual requirements in a controlled environment and to operational requirements."
    status: "deferred"
    reason: "Governs DT budget: 'The DT&E budget and schedule must allow testing that adequately verifies performance'. A budget rule, which no RMF run touches."
  - id: "REQ-DODI5000.89-0192"
