  - id: "REQ-DODI5000.89-0173"
    citation: {"ref": "DODI5000.89", "page": 25, "anchor": "PMs are encouraged to automate and integrate DT and OT testing to"}
    kind: "lettered"
    locator: "4.5.d"
    context: "T&E FOR SOFTWARE ACQUISITION PATHWAY"
    statement: "d. PMs are encouraged to automate and integrate DT and OT testing to the maximum extent possible in order to accelerate acquisition timelines when feasible. This includes planning for and collecting test data from the contractor testing that can be used for evaluation. Just as the software product is being developed incrementally and iteratively in this modern software development paradigm, so too should be the T&E activities and products, particularly the test report. To maximize the benefit of early and automated data collection opportunities, the PM must collaborate with the T&E interfaces and work through the T&E processes defined for DT&E (see Section 5) and OT&E (see Section 6) to tailor a plan that will enable the effective and efficient execution of analysis and evaluation, as well as the determination of test adequacy."
    status: "deferred"
    reason: "Governs test automation: 'PMs are encouraged to automate and integrate DT and OT testing', and 'the PM must collaborate with the T&E interfaces'. Test tailoring for acceleration; no RMF run touches it, and pipeline evidence is PW-SWP's."
