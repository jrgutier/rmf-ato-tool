    statement: "(2) Cybersecurity operational T&E must also include a cyber economic vulnerability analysis as outlined in the September 14, 2010 and January 21, 2015 DOT&E Memoranda. The MDA will not tailor cybersecurity T&E solely to meet authority to operate requirements."
    status: "candidate"
  - id: "REQ-DODI5000.89-0183"
