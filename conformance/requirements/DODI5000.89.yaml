    statement: "(2) Barring significant unforeseen circumstances, all elements of an approved OTP or LFTP must be fully satisfied by the end of an operational or live fire test. If an approved plan cannot be fully executed, DOT&E concurrence with any changes must be obtained before revised test events are executed."
    status: "deferred"
    reason: "Governs test plan execution: 'all elements of an approved OTP or LFTP must be fully satisfied', and 'DOT&E concurrence with any changes must be obtained'. Oversight of operational test execution, which no RMF run touches."
