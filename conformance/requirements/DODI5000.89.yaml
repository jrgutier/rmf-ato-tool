  - id: "REQ-DODI5000.89-0027"
    citation: {"ref": "DODI5000.89", "page": 7, "anchor": "The fundamental purpose of T&E is to enable the DoD to acquire"}
    kind: "lettered"
    locator: "3.1.a"
    context: "OVERVIEW"
    statement: "a. The fundamental purpose of T&E is to enable the DoD to acquire systems that support the warfighter in accomplishing their mission. To that end, T&E provides engineers and decision-makers with knowledge to assist in managing risks; to measure technical progress; and to characterize operational effectiveness, operational suitability, interoperability, survivability (including cybersecurity), and lethality. This is done by planning and executing a robust and rigorous T&E program."
    status: "not-a-requirement"
    reason: "Purpose statement: 'The fundamental purpose of T&E is to enable the DoD to acquire systems' and what T&E provides. Background on why testing exists, with no act assigned."
  - id: "REQ-DODI5000.89-0028"
    citation: {"ref": "DODI5000.89", "page": 7, "anchor": "Integrated testing and independent evaluation are part of a larger continuum of"}
    kind: "lettered"
    locator: "3.1.b"
    context: "OVERVIEW"
    statement: "b. Integrated testing and independent evaluation are part of a larger continuum of T&E that includes DT&E (both contractor and government), OT&E, and LFT&E. Integrated testing requires the collaborative planning and execution of test phases and events to provide shared data in support of independent analysis, evaluation, and reporting by all stakeholders. Whenever feasible, the programs will conduct testing in an integrated fashion to permit all stakeholders to use data in support of their respective functions."
    status: "candidate"
  - id: "REQ-DODI5000.89-0029"
    citation: {"ref": "DODI5000.89", "page": 7, "anchor": "Programs will incorporate integrated testing at the earliest opportunity when developing program"}
    kind: "lettered"
    locator: "3.1.c"
    context: "OVERVIEW"
    statement: "c. Programs will incorporate integrated testing at the earliest opportunity when developing program strategies, plans with program protection, documentation, and T&E strategies or the TEMPs. Developing and adopting integrated testing early in the process increases the effectiveness and efficiency of the overall T&E program."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0030"
    citation: {"ref": "DODI5000.89", "page": 7, "anchor": "If done correctly, integrated testing provides greater opportunity for early identification of"}
    kind: "lettered"
    locator: "3.1.c.(1)"
    context: "OVERVIEW"
    statement: "(1) If done correctly, integrated testing provides greater opportunity for early identification of concerns to improve the system design, and guides the system development during the engineering and manufacturing development phase. Conducting critical test activities earlier will enable the discovery of problems that the program can fix while the system is still in development and avoid costly redesigns late in the acquisition life cycle."
    status: "not-a-requirement"
    reason: "Description of a benefit: 'If done correctly, integrated testing provides greater opportunity for early identification of concerns'. Its 'will enable' says what earlier testing achieves, and that will binds no one."
  - id: "REQ-DODI5000.89-0031"
    citation: {"ref": "DODI5000.89", "page": 7, "anchor": "Integrated testing and independent evaluation also encourage the sharing of all developmental"}
    kind: "lettered"
    locator: "3.1.c.(2)"
    context: "OVERVIEW"
    statement: "(2) Integrated testing and independent evaluation also encourage the sharing of all developmental test (DT), OT, and live fire test resources to accomplish the test program. For programs informing decisions that are not addressed in Title 10, U.S.C., such as fielding, deployment, and low-rate production decisions, well planned and executed integrated testing may provide necessary data for an OTA to determine the system’s operational effectiveness, suitability, and overall mission capability."
    status: "not-a-requirement"
    reason: "Description: integrated testing and independent evaluation 'also encourage the sharing' of resources, and such testing 'may provide' data to an OTA. It states an effect and asks nothing."
  - id: "REQ-DODI5000.89-0032"
    citation: {"ref": "DODI5000.89", "page": 7, "anchor": "Integrated testing does not replace or eliminate the requirement for IOT&E, as"}
    kind: "lettered"
    locator: "3.1.c.(3)"
    context: "OVERVIEW"
    statement: "(3) Integrated testing does not replace or eliminate the requirement for IOT&E, as a condition to proceed beyond LRIP for programs with beyond low-rate (i.e., full-rate) production decisions as required by Section 2399 of Title 10, U.S.C."
    status: "deferred"
    reason: "Governs production gating: integrated testing 'does not replace or eliminate the requirement for IOT&E, as a condition to proceed beyond LRIP'. A statutory test-before-production rule that no RMF run touches."
  - id: "REQ-DODI5000.89-0033"
    citation: {"ref": "DODI5000.89", "page": 7, "anchor": "To ensure T&E focuses on informing the program’s decision-making process throughout the"}
    kind: "lettered"
    locator: "3.1.d"
    context: "OVERVIEW"
    statement: "d. To ensure T&E focuses on informing the program’s decision-making process throughout the acquisition life cycle, the TEMP will include the program’s key decision points and the T&E information needed to support them. These decisions may be made by leaders ranging from the program manager (PM) to the MDA, and should represent major turning or decision points in the acquisition life cycle that need T&E information in order to make an informed decision. Examples include milestone decisions, key integration points, and technical readiness decisions."
    status: "deferred"
    reason: "Governs the TEMP's decision table: 'the TEMP will include the program's key decision points and the T&E information needed to support them', with milestone, integration and technical readiness examples. No RMF run touches this general rule; the ATO clause is 0114."
  - id: "REQ-DODI5000.89-0034"
    citation: {"ref": "DODI5000.89", "page": 8, "anchor": "This information is captured in a table known as the Integrated Decision"}
    kind: "modal"
    locator: "3.1.d"
    context: "OVERVIEW"
    statement: "This information is captured in a table known as the Integrated Decision Support Key (IDSK). This table is developed by the PM by analyzing what is already known about the capability, what still needs to be known about the capability, and when it needs to be known."
    status: "deferred"
    reason: "Governs the IDSK: 'This table is developed by the PM by analyzing what is already known about the capability'. A program test-planning table no task reads, so no RMF run touches it."
