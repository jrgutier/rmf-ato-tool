  - id: "REQ-DODI5000.89-0212"
    citation: {"ref": "DODI5000.89", "page": 28, "anchor": "The PM and test team will develop detailed test plans for each"}
    kind: "modal"
    locator: "5.3.a"
    context: "DT&E EXECUTION, EVALUATION, AND REPORTING"
    statement: "The PM and test team will develop detailed test plans for each DT event identified in the TEMP. The PM, in concert with the user and T&E community, will provide relevant safety documentation (e.g., occupational health risk acceptance) and required documentation (e.g., the National Environmental Policy Act and Executive Order 12114 documentation for the DT event, safety, and occupational health risk assessment) to testers before any test that may affect safety of personnel. The PM will conduct test readiness reviews for those events identified in the TEMP, or other test strategy documentation."
    status: "candidate"
  - id: "REQ-DODI5000.89-0213"
    citation: {"ref": "DODI5000.89", "page": 29, "anchor": "For ACAT 1B/1C programs on the T&E oversight list for which USD(R&E)"}
    kind: "modal"
    locator: "5.3.b.(1)"
    context: "DT&E EXECUTION, EVALUATION, AND REPORTING DT&E Evaluation"
    statement: "For ACAT 1B/1C programs on the T&E oversight list for which USD(R&E) did not conduct a DT&E sufficiency assessment, the USD(R&E) will provide the MDA with a program assessment at the development RFP release decision point and MS B and C. This will be updated to support the operational test readiness review or as requested by the MDA or PM. The program assessment will be based on the completed DT&E and any operational T&E activities completed to date, and will address the adequacy of the program planning, the implications of testing results to date, and the risks to successfully meeting the goals of the remaining T&E events in the program."
    status: "deferred"
    reason: "Governs DT&E oversight: 'the USD(R&E) will provide the MDA with a program assessment' at the RFP decision and MS B and C. A milestone product for the MDA, which no RMF task reads."
  - id: "REQ-DODI5000.89-0214"
    citation: {"ref": "DODI5000.89", "page": 29, "anchor": "In accordance with Sections 2366b(c)(l) and 2366c(a)(4) of Title 10, U.S.C., when"}
    kind: "modal"
    locator: "5.3.b.(2)"
    context: "DT&E EXECUTION, EVALUATION, AND REPORTING DT&E Evaluation"
    statement: "In accordance with Sections 2366b(c)(l) and 2366c(a)(4) of Title 10, U.S.C., when the USD(A&S) is the MDA, the USD(R&E) will conduct DT&E sufficiency assessments for MDAPs to be included in MS B and MS C brief summary reports provided to the congressional defense committees. When the Service or the Component acquisition executive is the MDA, the senior official within the Military Department, Defense Agency, or DoD Field Activity with responsibility for DT will conduct DT&E sufficiency assessments for MDAPs to be included in MS B and MS C brief summary reports provided to the congressional defense committees."
    status: "deferred"
    reason: "Governs sufficiency assessments: 'the USD(R&E) will conduct DT&E sufficiency assessments' for MDAPs, for reports to Congress, or the Component's senior DT official will. Milestone oversight no RMF run touches."
  - id: "REQ-DODI5000.89-0215"
