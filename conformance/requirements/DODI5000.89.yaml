    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Planning Test Events"
    statement: "(4) Pursuant to Section 2399 of Title 10, U.S.C., persons employed by the contractor for the system being developed may only participate in OT&E of systems under T&E oversight to the extent they are planned to be involved in the operation, maintenance, and other support of the system when deployed in combat."
    status: "deferred"
    reason: "Governs contractor participation: contractor staff 'may only participate in OT&E' to the extent they will support the system when deployed. A Section 2399 limit on OT, which no RMF run touches."
  - id: "REQ-DODI5000.89-0237"
    citation: {"ref": "DODI5000.89", "page": 33, "anchor": "A contractor that has participated (or is participating) in the development, production,"}
