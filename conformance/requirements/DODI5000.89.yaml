    status: "deferred"
    reason: "Governs certification data: 'The PM will provide the MDA, DOT&E, and the lead OTA with all data on certifications as requested.' A data call to acquisition overseers, which no RMF run touches."
  - id: "REQ-DODI5000.89-0231"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "In accordance with DoDI 8330.01, all program TEMPs must reflect interoperability and"}
    kind: "lettered"
    locator: "6.2.e.(3)"
    context: "OT&E ACTIVITIES"
    statement: "(3) In accordance with DoDI 8330.01, all program TEMPs must reflect interoperability and supportability requirements, and serve as the basis for interoperability assessments and certifications. The preceding policies are summarized together with associated DOT&E guidance and TEMP outlines at: http://www.dote.osd.mil/temp-guidebook/index.html."
    status: "deferred"
    reason: "Governs interoperability: 'all program TEMPs must reflect interoperability and supportability requirements' under DoDI 8330.01. Interoperability content of the TEMP, which feeds no assessment, so no RMF run touches it."
  - id: "REQ-DODI5000.89-0232"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "The following policy applies to all acquisition pathways as described in DoDI"}
    kind: "modal"
    locator: "6.3"
    context: "LFT&E"
    statement: "The following policy applies to all acquisition pathways as described in DoDI 5000.02T. Section 2366 of Title 10, U.S.C. mandates the LFT&E and formal LFT&E reporting for all covered systems, munition programs, missile programs, or covered product improvement programs as determined by the DOT&E. The primary emphasis is on testing vulnerability with respect to potential user casualties and taking into equal consideration the susceptibility to attack and combat performance of the system. The DOT&E will approve LFT&E strategies and LFT&E test plans (including survivability and lethality test plans) for covered systems as defined in Section 2366 of Title 10, U.S.C. LFT&E strategies and test plans may be tailored in accordance with program objectives and selected acquisition strategies. The DOT&E will approve the quantity of test articles procured for all LFT&E test events for any system under LFT&E oversight."
    status: "deferred"
    reason: "Governs live fire: Section 2366 'mandates the LFT&E and formal LFT&E reporting', and 'The DOT&E will approve LFT&E strategies'. Survivability and lethality substance, which no RMF run touches."
  - id: "REQ-DODI5000.89-0233"
    citation: {"ref": "DODI5000.89", "page": 32, "anchor": "For all programs under T&E oversight, including accelerated acquisitions, the DOT&E will"}
    kind: "lettered"
    locator: "6.4.a.(1)"
    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Planning Test Events"
    statement: "(1) For all programs under T&E oversight, including accelerated acquisitions, the DOT&E will approve OTPs and LFTPs before the corresponding operational or major live fire test events in accordance with Section 2399, Title 10, U.S.C. and DoDD 5141.02. The DOT&E will approve any LFTP for a major test event, such as full-up system-level test, total ship survivability trial, or full ship shock trials. The major live fire test events will be identified in the TEMP (or LFT&E strategy or equivalent document). An LTO develops test plans for both OT&E and LFT&E."
    status: "deferred"
    reason: "Governs test plan approval: 'the DOT&E will approve OTPs and LFTPs before the corresponding operational or major live fire test events'. Oversight approval; no RMF run reads these plans outside the urgent pathway at 0137."
  - id: "REQ-DODI5000.89-0234"
    citation: {"ref": "DODI5000.89", "page": 32, "anchor": "For programs under T&E oversight, the appropriate LTO will brief the DOT&E"}
    kind: "lettered"
    locator: "6.4.a.(2)"
    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Planning Test Events"
    statement: "(2) For programs under T&E oversight, the appropriate LTO will brief the DOT&E on T&E concepts for the OTP or the major LFT&E as early as possible and no less than 180 calendar days before the start of any such testing. The DOT&E and DoD Component heads will be kept apprised of changes in test concept and progress on the OTP. The lead OTA will deliver the DoD Component-approved OTP for DOT&E review no later than 60 calendar days before test start. The LTO for major live fire events will deliver the DoD Component-approved LFTP for DOT&E review no later than 90 days before test start. OTPs and major LFTPs will include the plans for data collection and management. To support agile acquisition, the timetables for the test concept and OTP delivery may be tailored with mutual consent between the DOT&E, OTA, and program office; and should be negotiated via the program T&E WIPT."
    status: "deferred"
    reason: "Governs oversight timelines: 'the appropriate LTO will brief the DOT&E ... no less than 180 calendar days before the start', the OTP 'no later than 60 calendar days', the LFTP 'no later than 90 days'. Oversight deadlines no RMF run touches."
  - id: "REQ-DODI5000.89-0235"
    citation: {"ref": "DODI5000.89", "page": 32, "anchor": "In OT&E, typical users or units will operate and maintain the system"}
    kind: "lettered"
    locator: "6.4.a.(3)"
    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Planning Test Events"
    statement: "(3) In OT&E, typical users or units will operate and maintain the system or item under conditions simulating combat stress in accordance with Section 139, Title 10, U.S.C., and peacetime conditions, when applicable. The lead OTA, in consultation with the user and the PM, will identify realistic operational scenarios based on the CONOPS and mission threads derived from the joint mission essential task list or DoD Component-specific mission essential task list."
    status: "deferred"
    reason: "Governs operational realism: 'typical users or units will operate and maintain the system', and 'The lead OTA ... will identify realistic operational scenarios'. OT design, which no RMF run touches; cybersecurity conditions are 0119."
  - id: "REQ-DODI5000.89-0236"
    citation: {"ref": "DODI5000.89", "page": 33, "anchor": "Pursuant to Section 2399 of Title 10, U.S.C., persons employed by the"}
