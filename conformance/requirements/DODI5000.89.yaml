    locator: "3.5.b.(1)"
    context: "CYBERSECURITY T&E The PMs will:"
    statement: "(1) Develop a cybersecurity strategy as part of the program protection plan based on the Joint Capabilities Integration and Development System or other system cybersecurity, survivability, and resilience requirements; known and postulated threats; derived system requirements; draft system performance specifications; and the intended operational use and environment. The cybersecurity strategy will also incorporate the appropriate aspects of the risk management framework (RMF) process (governed by DoDI 8500.01 and DoDI 8510.01) that supports obtaining an authority to operate and other items as addressed in DoD cybersecurity policies. The cybersecurity strategy should describe how the authority to operate decision will be informed by the cybersecurity testing specified in the DoD Cybersecurity T&E Guidebook. The cybersecurity strategy should leverage integrated contractor and government testing to evaluate the security of contractor and government development capabilities of the program’s sub-components, components, and integrated components; and describe the dedicated government system vulnerability and threat-based cybersecurity testing to be conducted before program product acceptance."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0114"
    citation: {"ref": "DODI5000.89", "page": 16, "anchor": "Use the cybersecurity strategy as a source document to develop the TEMP,"}
    kind: "lettered"
    locator: "3.5.b.(2)"
    context: "CYBERSECURITY T&E The PMs will:"
    statement: "(2) Use the cybersecurity strategy as a source document to develop the TEMP, or other test strategy documentation. The TEMP DEF and OEF will identify specific cybersecurity data required to address the various cybersecurity stakeholder needs (PM, engineers, RMF, DT testers, OTA), crosswalk the data to develop an integrated cybersecurity T&E strategy that efficiently obtains these data, and describe how key program decisions, including the authority to operate decision, will be informed by cybersecurity testing."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0115"
    citation: {"ref": "DODI5000.89", "page": 16, "anchor": "Determine the avenues and means by which the system and supporting infrastructure"}
    kind: "lettered"
    locator: "3.5.b.(3)"
    context: "CYBERSECURITY T&E The PMs will:"
    statement: "(3) Determine the avenues and means by which the system and supporting infrastructure may be exploited for cyber-attack and use this information to design T&E activities and scenarios. Conduct a mission-based cyber risk assessment (such as a cyber table top) to identify those elements and interfaces of the system that, based on criticality and vulnerability analysis, need specific attention in T&E events."
    status: "candidate"
  - id: "REQ-DODI5000.89-0116"
    citation: {"ref": "DODI5000.89", "page": 16, "anchor": "Plan to conduct contractor and government integrated tailored cooperative vulnerability identification (T&E"}
    kind: "lettered"
    locator: "3.5.b.(4)"
    context: "CYBERSECURITY T&E The PMs will:"
    statement: "(4) Plan to conduct contractor and government integrated tailored cooperative vulnerability identification (T&E activities to identify vulnerabilities and plan the means to mitigate or resolve them, including system scans, analysis, and architectural reviews. These activities begin with prototypes."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0117"
    citation: {"ref": "DODI5000.89", "page": 16, "anchor": "Plan to conduct integrated tailored cybersecurity DT&E events using realistic threat exploitation"}
    kind: "lettered"
    locator: "3.5.b.(5)"
    context: "CYBERSECURITY T&E The PMs will:"
    statement: "(5) Plan to conduct integrated tailored cybersecurity DT&E events using realistic threat exploitation techniques in representative operating environments and scenarios to exercise critical missions within a cyber-contested environment to identify any vulnerabilities and assess system cyber resilience. Whenever possible, plan threat-based testing as part of integrated contractor and government T&E."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0118"
    citation: {"ref": "DODI5000.89", "page": 16, "anchor": "The April 3, 2018 DOT&E Memorandum directs OTAs to perform a cybersecurity"}
    kind: "lettered"
    locator: "3.5.c"
    context: "CYBERSECURITY T&E"
    statement: "c. The April 3, 2018 DOT&E Memorandum directs OTAs to perform a cybersecurity cooperative vulnerability and penetration assessment (CVPA) and an adversarial assessment (AA) of all acquisition programs. The January 21, 2015 DOT&E Memorandum directs OTAs to modify their cybersecurity T&E processes as appropriate for DoD systems whose functions include financial or fiscal/business activities or the management of funds. The January 21, 2015 DOT&E Memorandum also directs the OTAs to add cyber economic threat analysis, cyber economic scenario testing, and financial transaction analysis to their cybersecurity test planning for DBS."
    status: "candidate"
  - id: "REQ-DODI5000.89-0119"
    citation: {"ref": "DODI5000.89", "page": 16, "anchor": "The DOT&E requires testing of cybersecurity during OT&E to include the representative"}
    kind: "lettered"
    locator: "3.5.d"
    context: "CYBERSECURITY T&E"
    statement: "d. The DOT&E requires testing of cybersecurity during OT&E to include the representative users and an operationally representative environment. This may include hardware; software (including embedded software and firmware); operators; maintainers; operational cyber and network defense; end users; network and system administrators; help desk; training; support documentation; tactics, techniques, and procedures; cyber threats; and other systems that input or exchange information with the system under test, as applicable."
    status: "candidate"
  - id: "REQ-DODI5000.89-0120"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "The OTAs will evaluate cybersecurity in OT&E via two assessments: a cybersecurity"}
    kind: "lettered"
    locator: "3.5.d.(1)"
    context: "CYBERSECURITY T&E"
    statement: "(1) The OTAs will evaluate cybersecurity in OT&E via two assessments: a cybersecurity CVPA and an AA. The CVPA and AA should be designed to identify cyber vulnerabilities, examine attack paths, evaluate operational cyber defense capabilities, and establish the operational mission effects (e.g., loss of critical operational capability) in a cyber threat environment while conducting operational missions."
    status: "candidate"
  - id: "REQ-DODI5000.89-0121"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "The OTA, with DOT&E review and approval, should integrate developmental and operational"}
    kind: "lettered"
    locator: "3.5.d.(2)"
    context: "CYBERSECURITY T&E"
    statement: "(2) The OTA, with DOT&E review and approval, should integrate developmental and operational testing where possible to ensure sufficient data are obtained to meet OT&E objectives and measures. The OTAs should review and consider data from DT events (such as the cooperative vulnerability identification and adversarial cybersecurity DT&E) and any integrated tests previously conducted. CVPA and AA results used in conjunction with the other OT&E and LFT&E results will inform the overall evaluation of operational effectiveness, suitability, and survivability."
    status: "deferred"
    reason: "Governs OT evaluation: the OTA 'should integrate developmental and operational testing where possible' and 'should review and consider data from DT events' to meet OT&E objectives. Overall effectiveness and suitability evaluation; no RMF run touches how the OTA does it."
  - id: "REQ-DODI5000.89-0122"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "All programs should plan for periodic integrated government cybersecurity test events before"}
    kind: "lettered"
    locator: "3.5.e"
    context: "CYBERSECURITY T&E"
    statement: "e. All programs should plan for periodic integrated government cybersecurity test events before beginning operational testing or initial production, with the goal of increasing efficiency and effectiveness of cybersecurity T&E."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0123"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "Understanding that the objectives and knowledge requirements of DT&E and OT&E must"}
    kind: "lettered"
    locator: "3.5.e.(1)"
    context: "CYBERSECURITY T&E"
    statement: "(1) Understanding that the objectives and knowledge requirements of DT&E and OT&E must be met, it is critical that the conditions of the test event and the maturity of the system under test are acceptable to both stakeholders."
    status: "candidate"
  - id: "REQ-DODI5000.89-0124"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "The system under test must be mature enough to represent the production"}
    kind: "lettered"
    locator: "3.5.e.(2)"
    context: "CYBERSECURITY T&E"
    statement: "(2) The system under test must be mature enough to represent the production version. The test conditions should be realistic enough to adequately represent the operational environment, while still being flexible enough to allow a wide range of penetration and adversarial activities. The goal is to maximize assessment of vulnerabilities, evaluate adversarial exploitability of those vulnerabilities, as well as evaluate recovery and restoral processes."
    status: "candidate"
  - id: "REQ-DODI5000.89-0125"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "Testing must include evaluating appropriate defensive cyberspace operations in accordance with DoDI"}
    kind: "lettered"
    locator: "3.5.e.(3)"
    context: "CYBERSECURITY T&E"
    statement: "(3) Testing must include evaluating appropriate defensive cyberspace operations in accordance with DoDI 8530.01. The result of cybersecurity testing should be an understanding of mission critical cybersecurity vulnerabilities, each of which should then be eliminated before fielding the system."
    status: "candidate"
  - id: "REQ-DODI5000.89-0126"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "Interoperability testing is governed by DoDI 8330.01. All programs or acquisition paths"}
    kind: "lettered"
    locator: "3.6.a"
    context: "INTEROPERABILITY T&E"
    statement: "a. Interoperability testing is governed by DoDI 8330.01. All programs or acquisition paths that exchange data with an organization or site external to their Service require an interoperability certification from the Joint Interoperability Test Command, and will need to incorporate interoperability into the DT and OT."
    status: "deferred"
    reason: "Governs interoperability certification: programs exchanging data outside their Service 'require an interoperability certification from the Joint Interoperability Test Command'. No task, input or decision in a run reads it, so no RMF run touches it. Governed by DoDI 8330.01, not in references/."
  - id: "REQ-DODI5000.89-0127"
    citation: {"ref": "DODI5000.89", "page": 17, "anchor": "IT interoperability should be evaluated early and with sufficient frequency throughout a"}
    kind: "lettered"
    locator: "3.6.b"
    context: "INTEROPERABILITY T&E"
    statement: "b. IT interoperability should be evaluated early and with sufficient frequency throughout a system's life cycle to capture and assess changes affecting interoperability in a platform, joint, multinational, and interagency environment. Interoperability T&E can be tailored for the characteristics of the capability being acquired in accordance with applicable acquisition pathway policy. Interoperability certification must be granted before fielding of a new IT capability or upgrade to existing IT."
    status: "deferred"
    reason: "Governs interoperability timing: 'Interoperability certification must be granted before fielding of a new IT capability'. A fielding gate under DoDI 8330.01 that is not an RMF decision, so no RMF run touches it."
  - id: "REQ-DODI5000.89-0128"
    citation: {"ref": "DODI5000.89", "page": 18, "anchor": "Working with the DoD business, warfighting, intelligence, and enterprise information environment mission"}
    kind: "lettered"
    locator: "3.6.c"
    context: "INTEROPERABILITY T&E"
    statement: "c. Working with the DoD business, warfighting, intelligence, and enterprise information environment mission area owners (Chief Management Officer of the Department of Defense, Chairman of the Joint Chiefs of Staff, Under Secretary of Defense for Intelligence and Security, and DoD Chief Information Officer) and the other DoD Component heads, the T&E WIPTs should require that capability-focused, architecture-based measures of performance and associated metrics are developed to support evaluations of IT interoperability throughout a system’s life cycle and to ensure logistics assets are planned for within the T&E management plan."
    status: "deferred"
    reason: "Governs interoperability measures: the T&E WIPTs 'should require that capability-focused, architecture-based measures of performance' are developed, and logistics assets planned. Test metrics that no RMF run touches."
  - id: "REQ-DODI5000.89-0129"
    citation: {"ref": "DODI5000.89", "page": 18, "anchor": "In accordance with the national defense strategy and DoDD 4650.05, resilient positioning,"}
    kind: "lettered"
    locator: "3.7.a"
    context: "NAVIGATION WARFARE (NAVWAR) COMPLIANCE T&E"
    statement: "a. In accordance with the national defense strategy and DoDD 4650.05, resilient positioning, navigation, and timing (PNT) information is essential to the execution and command and control of military missions and to the efficient operation of information networks necessary for continuous situational awareness by Combatant Commanders. The DoD will employ NAVWAR capabilities to ensure a PNT advantage in support of military operations, and programs producing or using PNT information must be NAVWAR compliant. NAVWAR compliance testing is governed by DoDI 4650.08."
    status: "deferred"
    reason: "Governs positioning, navigation and timing: 'programs producing or using PNT information must be NAVWAR compliant'. A warfighting capability rule under DoDI 4650.08, not in references/; no RMF run touches it."
  - id: "REQ-DODI5000.89-0130"
    citation: {"ref": "DODI5000.89", "page": 18, "anchor": "Each program or system producing or using PNT information must incorporate the"}
    kind: "lettered"
    locator: "3.7.b"
    context: "NAVIGATION WARFARE (NAVWAR) COMPLIANCE T&E"
    statement: "b. Each program or system producing or using PNT information must incorporate the system survivability KPP as defined in Paragraph 3.2.a. of DoDI 4650.08."
    status: "deferred"
    reason: "Governs a performance parameter: each program using PNT 'must incorporate the system survivability KPP'. A capability requirement of one class of system, with no RMF input or output."
  - id: "REQ-DODI5000.89-0131"
    citation: {"ref": "DODI5000.89", "page": 18, "anchor": "For each program or system producing or using PNT information, the PM"}
    kind: "lettered"
    locator: "3.7.c"
    context: "NAVIGATION WARFARE (NAVWAR) COMPLIANCE T&E"
    statement: "c. For each program or system producing or using PNT information, the PM must conduct system T&E (e.g., real-world test; modeling and simulation; empirical analysis) sufficient to validate that all systems or platforms producing or using PNT information meet the system survivability KPP referred to in Paragraph 3.7.b."
    status: "deferred"
    reason: "Governs NAVWAR test: 'the PM must conduct system T&E' to validate the system survivability KPP. Test substance on PNT survivability, whose results no assessment reads, so no RMF run touches it."
  - id: "REQ-DODI5000.89-0132"
    citation: {"ref": "DODI5000.89", "page": 18, "anchor": "Pursuant to Section 1610 of Public Law 115-232, also known as “the"}
    kind: "lettered"
    locator: "3.7.d"
    context: "NAVIGATION WARFARE (NAVWAR) COMPLIANCE T&E"
    statement: "d. Pursuant to Section 1610 of Public Law 115-232, also known as “the National Defense Authorization Act for Fiscal Year 2019,” the PM will systematically collect PNT T&E data, lessons learned, and design solutions. In accordance with DoDD 4650.05, the USD(R&E) and the DOT&E will share insights gained from such information with the DoD PNT Enterprise Oversight Council, as appropriate."
    status: "deferred"
    reason: "Governs PNT lessons: 'the PM will systematically collect PNT T&E data, lessons learned, and design solutions', shared with the PNT council. A statutory collection no RMF run touches."
  - id: "REQ-DODI5000.89-0133"
    citation: {"ref": "DODI5000.89", "page": 19, "anchor": "Pursuant to DoDD 5000.01 and DoDI 5000.02T, the PM will develop an"}
    kind: "lettered"
    locator: "4.1.a"
    context: "GENERAL PROCEDURES"
    statement: "a. Pursuant to DoDD 5000.01 and DoDI 5000.02T, the PM will develop an acquisition strategy for MDA approval that matches the acquisition pathway (see Figure 2) processes, reviews, documents, and metrics to the character and risk of the capability being acquired."
    status: "deferred"
    reason: "Governs the acquisition strategy: 'the PM will develop an acquisition strategy for MDA approval that matches the acquisition pathway'. The approval has no RMF input or output, so no RMF run touches it."
  - id: "REQ-DODI5000.89-0134"
    citation: {"ref": "DODI5000.89", "page": 19, "anchor": "Follow the overarching guidance in Paragraph 3.1 plus the pathway specific guidance"}
    kind: "lettered"
    locator: "4.1.b"
    context: "GENERAL PROCEDURES"
    statement: "b. Follow the overarching guidance in Paragraph 3.1 plus the pathway specific guidance in this section."
    status: "not-a-requirement"
    reason: "Pointer: 'Follow the overarching guidance in Paragraph 3.1 plus the pathway specific guidance in this section.' It routes the reader to text decided at its own entries and adds nothing."
  - id: "REQ-DODI5000.89-0135"
    citation: {"ref": "DODI5000.89", "page": 19, "anchor": "As applicable within each pathway, and upon coordination with the DOT&E, the"}
    kind: "lettered"
    locator: "4.1.c"
    context: "GENERAL PROCEDURES"
    statement: "c. As applicable within each pathway, and upon coordination with the DOT&E, the DOT&E approves, in writing, the adequacy of OT&E plans for all programs on the T&E oversight list, including, but not limited to, early operational assessments (EOAs), OAs, IOT&E, and follow-on OT&E. In accordance with Section 139 of Title 10, U.S.C., OTAs provide DOT&E plans to assess adequacy of data collection and analysis planning to support the DOT&E’s independent assessment of a system’s operational effectiveness, operational suitability, survivability (including cybersecurity), or lethality."
    status: "deferred"
    reason: "Governs OT plan oversight: 'the DOT&E approves, in writing, the adequacy of OT&E plans', and OTAs provide plans 'In accordance with Section 139'. Oversight of OT plans, which no RMF run reads."
  - id: "REQ-DODI5000.89-0136"
    citation: {"ref": "DODI5000.89", "page": 20, "anchor": "The DOT&E will monitor all programs using the urgent capability pathway to"}
    kind: "lettered"
    locator: "4.2.a"
    context: "T&E FOR URGENT CAPABILITY ACQUISITION PATHWAY"
    statement: "a. The DOT&E will monitor all programs using the urgent capability pathway to determine placement under T&E oversight. A TEMP is not normally required. Designated programs for DOT&E operational and live fire oversight will adhere to the policies established by the DOT&E for oversight programs. These include:"
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0137"
    citation: {"ref": "DODI5000.89", "page": 20, "anchor": "Approval by the DOT&E of OTPs and live fire test plans (LFTPs)"}
    kind: "lettered"
    locator: "4.2.a.(1)"
    context: "T&E FOR URGENT CAPABILITY ACQUISITION PATHWAY The DOT&E will monitor all programs using the urgent capability pathway to determine placement under T&E oversight. A TEMP is not normally required. Desig"
    statement: "(1) Approval by the DOT&E of OTPs and live fire test plans (LFTPs) at the production and development milestone. The Military Services are required to deliver test plans to the DOT&E 60 days before the start of testing."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0138"
    citation: {"ref": "DODI5000.89", "page": 20, "anchor": "Approval by the DOT&E of post-deployment assessment plans at the production and"}
    kind: "lettered"
    locator: "4.2.a.(2)"
    context: "T&E FOR URGENT CAPABILITY ACQUISITION PATHWAY The DOT&E will monitor all programs using the urgent capability pathway to determine placement under T&E oversight. A TEMP is not normally required. Desig"
    statement: "(2) Approval by the DOT&E of post-deployment assessment plans at the production and deployment milestone."
    status: "deferred"
    reason: "Governs post-fielding assessment: 'Approval by the DOT&E of post-deployment assessment plans at the production and deployment milestone'. A-2 runs before fielding and no M task reads these plans, so no RMF run touches them, as with DODI5000.81-0014."
  - id: "REQ-DODI5000.89-0139"
    citation: {"ref": "DODI5000.89", "page": 21, "anchor": "Programs not under T&E oversight are approved at the Service level; the"}
    kind: "lettered"
    locator: "4.2.b"
    context: "T&E FOR URGENT CAPABILITY ACQUISITION PATHWAY"
    statement: "b. Programs not under T&E oversight are approved at the Service level; the program may require a rapid and focused operational assessment (OA) and live fire testing (if applicable) before deploying an urgent need solution. The acquisition approach will identify any requirements to evaluate health, safety, or operational effectiveness, suitability, survivability, and lethality."
    status: "deferred"
    reason: "Governs urgent test approval: 'Programs not under T&E oversight are approved at the Service level', and 'The acquisition approach will identify any requirements to evaluate health, safety' and more. Test scope for the deployment decision; no RMF run touches it."
  - id: "REQ-DODI5000.89-0140"
    citation: {"ref": "DODI5000.89", "page": 21, "anchor": "As applicable, the DOT&E will submit independent OT and live fire reports"}
    kind: "lettered"
    locator: "4.2.c"
    context: "T&E FOR URGENT CAPABILITY ACQUISITION PATHWAY"
    statement: "c. As applicable, the DOT&E will submit independent OT and live fire reports to the Secretary of Defense, the USD(A&S), congressional defense committees, and Military Services. The Secretary of Defense may authorize certain programs to defer some testing until after fielding if he or she determines the testing would unnecessarily impede the deployment of the needed capability. Testing should normally include user feedback to support design and operational use improvements and the PM’s plans to correct identified deficiencies."
    status: "deferred"
    reason: "Governs reporting and test deferral: 'the DOT&E will submit independent OT and live fire reports', and the Secretary 'may authorize certain programs to defer some testing'. Reporting upward and a SecDef decision that no RMF run touches, as with DODI5000.81-0015."
  - id: "REQ-DODI5000.89-0141"
    citation: {"ref": "DODI5000.89", "page": 21, "anchor": "MTA programs include rapid prototyping and rapid fielding programs intended to complete"}
    kind: "modal"
    locator: "4.3.a"
    context: "T&E FOR MTA PATHWAY"
    statement: "MTA programs include rapid prototyping and rapid fielding programs intended to complete in 2 to 5 years. MTA programs may be placed on the T&E oversight list and remain subject to: the LFT&E requirements in Section 2366 of Title 10, U.S.C.; IOT&E requirements in Section 2399 of Title 10, U.S.C.; LRIP quantities described in Section 2400 of Title 10, U.S.C.; and cybersecurity test requirements described in the April 3, 2018 DOT&E Memorandum. The DOT&E will determine whether to oversee an MTA program according to standards set in Paragraph 3.2.b. Memorandum."
    status: "candidate"
  - id: "REQ-DODI5000.89-0142"
    citation: {"ref": "DODI5000.89", "page": 21, "anchor": "General Approach for Programs on T&E Oversight."}
    kind: "lettered"
    locator: "4.3.b"
    context: "T&E FOR MTA PATHWAY"
    statement: "b. General Approach for Programs on T&E Oversight."
    status: "not-a-requirement"
    reason: "Heading: 'General Approach for Programs on T&E Oversight.' A label over 0143 to 0146."
  - id: "REQ-DODI5000.89-0143"
    citation: {"ref": "DODI5000.89", "page": 21, "anchor": "The DOT&E supports both the intent of the MTA pathway and the"}
    kind: "lettered"
    locator: "4.3.b.(1)"
    context: "T&E FOR MTA PATHWAY"
    statement: "(1) The DOT&E supports both the intent of the MTA pathway and the statutory mandate that MTA programs demonstrate and evaluate operational performance."
    status: "not-a-requirement"
    reason: "Position statement: 'The DOT&E supports both the intent of the MTA pathway and the statutory mandate'. It describes a stance and assigns no act."
  - id: "REQ-DODI5000.89-0144"
    citation: {"ref": "DODI5000.89", "page": 21, "anchor": "DoDI 5000.80 requires both rapid prototyping and rapid fielding programs using the"}
    kind: "lettered"
    locator: "4.3.b.(2)"
    context: "T&E FOR MTA PATHWAY"
    statement: "(2) DoDI 5000.80 requires both rapid prototyping and rapid fielding programs using the MTA pathway to develop a test strategy. Programs under T&E oversight will submit this test strategy, to include plans for operational testing and operational demonstrations (ops demos), to the DOT&E for approval. MTA ops demos offer a unique opportunity to “fly before you buy” by involving the operational user early in the acquisition process, before the initial production decision is made. The lead OTA will incorporate operational user inputs and participation in program test strategies. The DOT&E encourages tailoring MTA ops demos, and other T&E, to enable rapid fielding while maintaining acceptable risk to the warfighter."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0145"
    citation: {"ref": "DODI5000.89", "page": 21, "anchor": "The program’s decision authority will designate a DoD Component OTA to serve"}
    kind: "lettered"
    locator: "4.3.b.(3)"
    context: "T&E FOR MTA PATHWAY"
    statement: "(3) The program’s decision authority will designate a DoD Component OTA to serve as the lead OTA. The PM will collaborate with the OTA and other stakeholders to develop a fully integrated test strategy. The OTA will submit plans for ops demos to the DOT&E for approval before starting the test. For programs conducting multiple ops demos, the DOT&E will tailor this approval process to ensure appropriate oversight of ops demos leading to fielding or transition to another pathway in order to minimize disrupting early testing. The DOT&E, in collaboration with the PM or OTA, will set the timeline for submitting the test strategy and OTPs for approval. The data from all ops demos should be made available to the OTAs, the DOT&E, and other stakeholders for use to scope and inform subsequent test events and decisions."
    status: "deferred"
    reason: "Governs OT arrangements on MTA: 'The program's decision authority will designate a DoD Component OTA', and 'The OTA will submit plans for ops demos to the DOT&E for approval'. Designation and plan approval that no RMF run touches."
  - id: "REQ-DODI5000.89-0146"
    citation: {"ref": "DODI5000.89", "page": 22, "anchor": "Early and continuous coordination and collaboration among the DOT&E, the PM, and"}
    kind: "lettered"
    locator: "4.3.b.(4)"
    context: "T&E FOR MTA PATHWAY"
    statement: "(4) Early and continuous coordination and collaboration among the DOT&E, the PM, and the OTA will support faster reviews by the DOT&E. The PM will ensure that the OTA and DOT&E has access to ops demos and other operational, live fire, and cybersecurity test events and data. For rapid prototyping programs that will not field a significant residual operational capability to the deployed warfighter, the DOT&E will tailor the test plan approval process, which may include delegating approval authority, depending on the level of risk to the warfighter."
    status: "deferred"
    reason: "Governs oversight access: 'The PM will ensure that the OTA and DOT&E has access to ops demos and other operational, live fire, and cybersecurity test events and data'. Access for OT overseers, and DOT&E tailoring of approvals; no RMF run touches either."
  - id: "REQ-DODI5000.89-0147"
    citation: {"ref": "DODI5000.89", "page": 22, "anchor": "To develop the test strategy, the PM may follow the streamlined TEMP"}
    kind: "lettered"
    locator: "4.3.c.(1)"
    context: "T&E FOR MTA PATHWAY Test Strategy"
    statement: "(1) To develop the test strategy, the PM may follow the streamlined TEMP guide, if that facilitates their planning, or other planning guides pre-coordinated with the OTA and DOT&E, to tailor their particular strategy to the acquisition pathway and the expected operational environment. The test strategy should present, within the context of the intended acquisition strategy, the acquisition decision that the testing will inform, program objectives and schedule including major test events and milestones, the evaluation framework, required test resources (facilities, ranges, tools, test articles, personnel, and funding), and technical or test limitations."
    status: "deferred"
    reason: "Governs test strategy form: 'the PM may follow the streamlined TEMP guide', and the strategy 'should present' decisions, schedule, resources and limits. Names no cybersecurity content, which is at 0148, so no RMF run touches it."
  - id: "REQ-DODI5000.89-0148"
    citation: {"ref": "DODI5000.89", "page": 22, "anchor": "Rapid prototyping test strategies will set evaluation criteria and milestones for technology"}
    kind: "lettered"
    locator: "4.3.c.(2)"
    context: "T&E FOR MTA PATHWAY Test Strategy"
    statement: "(2) Rapid prototyping test strategies will set evaluation criteria and milestones for technology maturity and prototype performance, culminating in an ops demo of the fieldable prototype in an operational environment. The test strategy will describe the testing that will produce the data necessary to measure technology maturity and prototype performance as well as a description of how the program will achieve a residual operational capability. Evaluation criteria should include performance, safety, interoperability, reliability, and cybersecurity. Progressive operational and live-fire assessments of capabilities and limitations, based on data from incremental integrated test events during the prototype development program, should be included in the test strategy."
    status: "candidate"
    work_item: "WI-30"
  - id: "REQ-DODI5000.89-0149"
    citation: {"ref": "DODI5000.89", "page": 22, "anchor": "Rapid fielding test strategies will set evaluation criteria and milestones to demonstrate"}
    kind: "lettered"
    locator: "4.3.c.(3)"
    context: "T&E FOR MTA PATHWAY Test Strategy"
    statement: "(3) Rapid fielding test strategies will set evaluation criteria and milestones to demonstrate performance of the proposed products or technologies for current operational purposes. Rapid fielding decisions should be based on integrated developmental and operational testing that demonstrates how the capability contributes to fulfilling the warfighter’s mission or the CONOPS. As rapid fielding programs will begin production within 6 months of program start, they typically will rely heavily on previous testing to support this accelerated timeline. The test strategy will identify all prior testing used, and will specify the additional testing necessary to address differences between the tested prototype and the planned production configuration."
    status: "candidate"
    work_item: "WI-30"
