    context: "DT&E EXECUTION, EVALUATION, AND REPORTING DT&E Reports and Data"
    statement: "(1) The USD(R&E) and the acquisition chain of command and their designated representatives will have full and prompt access to all ongoing developmental testing and integrated testing, and all DT and integrated test records and reports, including but not limited to: data from all tests, recurring test site status and execution reports, system logs, execution logs, test director notes, certifications, user and operator assessments, and surveys. This applies to all government-accessible data including classified, unclassified, and competition sensitive or proprietary data. Data may be preliminary and identified as such, when applicable."
    status: "candidate"
