    statement: "(b) For hardware acquisitions, production-representative articles should be assembled using the parts, tools, and manufacturing processes intended for use in FRP; utilize the intended production versions of software; and the operational logistics systems including mature drafts of maintenance manuals intended for use on the fielded system should be in place. The manufacturing processes to be used in FRP should be adhered to as closely as possible, and PMs for programs under T&E oversight will provide the DOT&E a detailed description of any major manufacturing process changes."
