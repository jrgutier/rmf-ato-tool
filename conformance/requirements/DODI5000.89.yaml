  - id: "REQ-DODI5000.89-0092"
    citation: {"ref": "DODI5000.89", "page": 13, "anchor": "The Secretaries of the Military Departments, in coordination with the DAE, the"}
    kind: "lettered"
    locator: "3.3.h"
