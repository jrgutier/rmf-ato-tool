  - id: "REQ-DODI5000.89-0241"
    citation: {"ref": "DODI5000.89", "page": 33, "anchor": "For software acquisitions, a production-representative system consists of typical users performing operational"}
    kind: "lettered"
    locator: "6.4.a.(6).(c)"
    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Planning Test Events IOT&E for all programs will use production or production-representative test articles that,"
    statement: "(c) For software acquisitions, a production-representative system consists of typical users performing operational tasks with the hardware and software intended for deployment, in an operationally realistic computing environment, with representative DoD information network operations and supporting cybersecurity capabilities. All manuals, training, helpdesk, continuity of operations, system upgrades, and other life-cycle system support should be in place."
    status: "deferred"
    reason: "Governs software articles: a production-representative system 'consists of typical users performing operational tasks', and manuals and support 'should be in place'. An IOT&E article definition, which no RMF run touches."
  - id: "REQ-DODI5000.89-0242"
    citation: {"ref": "DODI5000.89", "page": 33, "anchor": "IOT&E will require more than an evaluation that is based exclusively on"}
    kind: "lettered"
    locator: "6.4.a.(7)"
    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Planning Test Events"
    statement: "(7) IOT&E will require more than an evaluation that is based exclusively on computer modeling, simulation, or an analysis of system requirements, engineering proposals, design specifications, or any other information contained in program documents in accordance with Sections 2399 and 2366 of Title 10, U.S.C. IOT&E will feature end-to-end testing of system capabilities including all interrelated systems needed to employ and support those capabilities."
    status: "deferred"
    reason: "Governs IOT&E adequacy: 'IOT&E will require more than an evaluation that is based exclusively on computer modeling', and 'will feature end-to-end testing'. Statutory OT substance, which no RMF run touches."
  - id: "REQ-DODI5000.89-0243"
    citation: {"ref": "DODI5000.89", "page": 33, "anchor": "PMs for all programs (and particularly accelerated acquisitions) may, in coordination with"}
    kind: "lettered"
    locator: "6.4.a.(8)"
    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Planning Test Events"
    statement: "(8) PMs for all programs (and particularly accelerated acquisitions) may, in coordination with the lead OTA, elect to perform integrated testing in conjunction with training, joint and operational exercises, or synchronized test events. Such testing is efficient, but inherently increases the risk that a significant problem will not be discovered. If no subsequent operational or live fire testing is conducted before initial fielding, then additional testing will typically be required after initial fielding. When additional testing is required, the plan for the T&E and reporting of results will be included in the applicable TEMP or other test strategy documentation."
    status: "deferred"
    reason: "Governs test with exercises: PMs 'may ... elect to perform integrated testing in conjunction with training', and 'additional testing will typically be required after initial fielding'. OT planning, which no RMF run touches; the fielded case for cybersecurity is 0160."
  - id: "REQ-DODI5000.89-0244"
    citation: {"ref": "DODI5000.89", "page": 34, "anchor": "Test plans must consider the potential effects on personnel and the environment,"}
