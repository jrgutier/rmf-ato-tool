    locator: "3.1.i"
    context: "Figure 1. Integrated T&E Framework"
    statement: "i. As part of the digital engineering strategy, models and data will be used to digitally represent the system in a mission context to conduct integrated T&E activities. To the largest extent possible, programs will use an accessible digital ecosystem (e.g., high bandwidth network, computational architectures, multi-classification environment, enterprise resources, tools, and advanced technologies). This environment must provide authoritative sources of models, data, and test artifacts (e.g., test cases, plans, deficiencies, and results) and provide digital technologies to automate, reuse, and auto-generate test artifacts to gain greater accuracy, precision, and efficiencies across integrated test resources."
