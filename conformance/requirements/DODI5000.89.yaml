    context: "T&E FOR THE DBS PATHWAY DBS PMs will develop a TEMP or other test strategy documentation. The PM will describe the test strategy and essential elements of the TEMP in the DBS implementation plan. Spec"
    statement: "(3) T&E planning will include mission-oriented developmental T&E with actual operators performing end-to-end scenarios in a controlled environment to collect human-system interface data and reduce risk during operational testing."
