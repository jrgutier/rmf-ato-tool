    context: "OT&E ACTIVITIES"
    statement: "c. OT&E for Reliability and Maintainability."
    status: "not-a-requirement"
    reason: "Heading: 'OT&E for Reliability and Maintainability.' A label over 0226."
  - id: "REQ-DODI5000.89-0226"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "The TEMP, or other test strategy documentation, will include a plan to"}
    kind: "modal"
    locator: "6.2.c"
    context: "OT&E ACTIVITIES"
    statement: "The TEMP, or other test strategy documentation, will include a plan to allocate top-level reliability and maintainability requirements and rationale for the requirements that may be allocated down to the components and sub-components. Reliability allocations may include hardware and software, and may include commercial and non-developmental items."
    status: "deferred"
    reason: "Governs reliability allocation: the TEMP 'will include a plan to allocate top-level reliability and maintainability requirements'. Sustainment engineering, which no RMF run touches."
  - id: "REQ-DODI5000.89-0227"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "The DoD Components will each establish an operational test readiness review process"}
    kind: "modal"
    locator: "6.2.d"
    context: "OT&E ACTIVITIES"
    statement: "The DoD Components will each establish an operational test readiness review process to be executed before any OT. Before IOT&E, the process will include a review of DT&E results; an assessment of the system’s progress against the KPPs, key system attributes, and critical technical parameters in the TEMP, or other test strategy documentation; an analysis of identified technical risks to verify that those risks have been retired or reduced to the extent possible during DT&E or OT&E; a review of system certifications; and a review of the IOT&E entrance criteria specified in the TEMP, or other test strategy documentation."
    status: "deferred"
    reason: "Governs operational test readiness: 'The DoD Components will each establish an operational test readiness review process'. A Component test gate, not RV-TRR for DT events, and no RMF run touches it."
  - id: "REQ-DODI5000.89-0228"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "Testing in support of certifications should be planned in conjunction with all"}
    kind: "should"
    locator: "6.2.e"
    context: "OT&E ACTIVITIES"
    statement: "Testing in support of certifications should be planned in conjunction with all other testing."
    status: "deferred"
    reason: "Governs certification testing in general: 'Testing in support of certifications should be planned in conjunction with all other testing.' The section's named case is interoperability, and A-2 already coordinates test events for the authorization, so no RMF run touches the rest."
  - id: "REQ-DODI5000.89-0229"
    citation: {"ref": "DODI5000.89", "page": 31, "anchor": "The PM is responsible for determining what certifications are required, involving the"}
    kind: "lettered"
    locator: "6.2.e.(1)"
