    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Conducting Test Events"
    statement: "(a) Once testing has begun, deviations from approved elements of the test plan cannot be made without consultation with the OTA commander (for OTP), or appropriate LTO (for LFTP), and the concurrence of the DOT&E."
    status: "deferred"
    reason: "Governs deviations: 'deviations from approved elements of the test plan cannot be made without consultation with the OTA commander' and DOT&E concurrence. An oversight control, which no RMF run touches."
  - id: "REQ-DODI5000.89-0247"
    citation: {"ref": "DODI5000.89", "page": 34, "anchor": "DOT&E concurrence is not required when a need to change the execution"}
    kind: "lettered"
    locator: "6.4.b.(2).(b)"
    context: "Figure 3. Operational or Major Live Fire Test Event: Planning, Approval, Execution, and Conducting Test Events"
    statement: "(b) DOT&E concurrence is not required when a need to change the execution of an element of the test plan arises in real time as its execution is underway. If DOT&E on-site representatives are not present and the test director concludes changes to the plan are warranted that would revise events yet to be conducted, the test director must contact the relevant DOT&E personnel to obtain concurrence with the proposed changes. If it is not possible to contact DOT&E personnel in a timely manner, the test director can proceed with execution of the revised test event but must inform the DOT&E of the deviations from the test plan as soon as possible."
    status: "deferred"
