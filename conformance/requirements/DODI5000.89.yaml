  - id: "REQ-DODI5000.89-0240"
    citation: {"ref": "DODI5000.89", "page": 33, "anchor": "For hardware acquisitions, production-representative articles should be assembled using the parts, tools,"}
    kind: "lettered"
    locator: "6.4.a.(6).(b)"
