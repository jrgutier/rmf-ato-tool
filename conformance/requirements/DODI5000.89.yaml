  - id: "REQ-DODI5000.89-0112"
    citation: {"ref": "DODI5000.89", "page": 15, "anchor": "Cybersecurity planning and execution occurs throughout the entire life cycle. All DoD"}
    kind: "lettered"
    locator: "3.5.a"
    context: "CYBERSECURITY T&E"
    statement: "a. Cybersecurity planning and execution occurs throughout the entire life cycle. All DoD acquisition programs and systems (e.g., DBS, national security systems, weapon systems, non-developmental items), regardless of acquisition pathway, will execute the cybersecurity DT and OT iterative T&E process detailed in the DoD Cybersecurity T&E Guidebook throughout the program’s life cycle, including new increments of capability. The DoD Cybersecurity T&E Guidebook provides the latest in data-driven, mission-impact-based analysis and assessment methods for cybersecurity T&E and supports assessment of cybersecurity, survivability, and resilience within a mission context and encourages planning for tighter integration with traditional system T&E."
    status: "candidate"
