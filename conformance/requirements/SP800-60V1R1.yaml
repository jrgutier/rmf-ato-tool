  - id: "REQ-SP800-60V1R1-0193"
    citation: {"ref": "SP800-60V1R1", "page": 41, "anchor": "Business Impact Analysis (BIA): Agency personnel should consider the cross-utilization of security"}
    kind: "lettered"
    locator: "4.6.•"
    context: "Uses of Categorization Information The results of system security categorization can and should be used by, or made available to, appropriate agency personnel to support agency activities including:"
    statement: "• Business Impact Analysis (BIA): Agency personnel should consider the cross-utilization of security categorization and BIA information in the performance of each activity. Their common objectives enable agencies to mutually draw from them, thus, providing checks and balances to ensure accuracy for each information system. Conflicting information and anomalous conditions, such as a low availability impact and a BIA three-hour recovery time objective, should trigger a reevaluation by the mission and data owners."
    status: "candidate"
    work_item: "WI-09"
  - id: "REQ-SP800-60V1R1-0194"
    citation: {"ref": "SP800-60V1R1", "page": 41, "anchor": "Capital Planning and Investment Control (CPIC) and Enterprise Architecture (EA): Just as"}
    kind: "lettered"
    locator: "4.6.•"
    context: "Uses of Categorization Information The results of system security categorization can and should be used by, or made available to, appropriate agency personnel to support agency activities including:"
    statement: "• Capital Planning and Investment Control (CPIC) and Enterprise Architecture (EA): Just as no IT investment should be made without a business-approved architecture,21 the security categorization that begins the security life cycle is a business-enabling activity directly feeding the enterprise architecture and CPIC processes for new investments, as well as migration and upgrade decisions. Specifically, the security categorization can provide a firm basis for justifying certain capital expenditures and also can provide analytical input to avoid unnecessary investments."
    status: "not-a-requirement"
    reason: "Says categorization feeds EA and CPIC and 'can provide a firm basis'. 'no IT investment should be made' is an aside on OMB's own rule, the sentence's comparison, and binds no one here. CPIC is not on the touchpoint list and no run holds it."
  - id: "REQ-SP800-60V1R1-0195"
    citation: {"ref": "SP800-60V1R1", "page": 41, "anchor": "System Design: Understanding and designing the system architecture with varying information sensitivity"}
    kind: "lettered"
    locator: "4.6.•"
    context: "Uses of Categorization Information The results of system security categorization can and should be used by, or made available to, appropriate agency personnel to support agency activities including:"
    statement: "• System Design: Understanding and designing the system architecture with varying information sensitivity levels in mind may assist in achieving economies of scale with security services and protection through common security zones within the enterprise. For example, an information system containing privacy information may be located in one security zone with other information systems containing similar sensitive information. Each zone may have varying levels of security. For instance, the more critical zones may require 3-factor authentication where the open area may only require normal access controls. This type of approach requires a solid understanding of an agency’s information and data types gained through the security categorization process."
    status: "not-a-requirement"
    reason: "Advisory: designing around sensitivity 'may assist', and zones 'may require' stronger authentication, offered as an example. 'requires a solid understanding' describes that approach and binds no one."
  - id: "REQ-SP800-60V1R1-0196"
    citation: {"ref": "SP800-60V1R1", "page": 42, "anchor": "Contingency and Disaster Recovery Planning: Contingency and disaster recovery planning personnel should"}
    kind: "lettered"
    locator: "21 FEA Consolidated Reference Model Document Version 2.3, October 2007.•"
    context: ""
    statement: "• Contingency and Disaster Recovery Planning: Contingency and disaster recovery planning personnel should review information systems that have multiple data types of varying impact levels and consider grouping applications with similar information system impact levels with sufficiently protected infrastructures. This ensures efficient application of the correct contingency and disaster protection security controls and avoids the over protection of lower impact information systems."
    status: "not-applicable"
    reason: "Binds contingency and disaster recovery planning personnel across an organization's systems: 'should review information systems that have multiple data types' and 'consider grouping applications'. No persona holds it: I checked PER-ISSM and PER-CSSP, and neither plans hosting across systems. ART-CP plans one system's recovery, and a run has no view of the other systems to group with."
  - id: "REQ-SP800-60V1R1-0197"
    citation: {"ref": "SP800-60V1R1", "page": 42, "anchor": "Information Sharing and System Interconnection Agreements: Agency personnel should utilize aggregated and"}
    kind: "lettered"
    locator: "21 FEA Consolidated Reference Model Document Version 2.3, October 2007.•"
    context: ""
    statement: "• Information Sharing and System Interconnection Agreements: Agency personnel should utilize aggregated and individual security categorization information when assessing interagency connections. For example, knowing that information processed on a high impact information system is flowing to another agency’s moderate impact information system should cause both agencies to evaluate the security categorization information, the implemented or resulting security controls, and the risk associated with interconnecting systems. The results of this evaluation may substantiate the need for additional security controls in the form of a Service Level Agreement, information systems upgrades, additional mitigating security controls, or alternative means of sharing the required information."
    status: "partial"
    reason: "Each interconnection has a connection record with its risk (SRA-002); that the assessment uses the aggregated security categorization of both systems is not held"
    evidence: [{"kind": "rule", "asserts": "The risk associated with interconnecting systems is evaluated for every interagency connection", "target": "SRA-002", "fixture": "tests/fixtures/negative/SRA-002.yaml", "expect": "has no connection record in ra.yaml, so the risk its connection and information exchange introduce is not considered", "holds_when": "ART-RA is produced or seeded on a 0.2.0 contract", "claim": "constraint"}]
    work_item: "WI-199"
