rejected:
  - {"page": 7, "locator": "", "reason": "lead-in", "text": "Title III of the E-Government Act (Public Law 107-347), titled the Federal Information Security Management Act (FISMA), tasked the National Institute of Standards and Technology (NIST) to develop:"}
  - {"page": 7, "locator": "", "reason": "no-marker", "text": "In response to the second of these tasks, this guideline has been developed to assist Federal government agencies to categorize information and information systems. The guideline’s objective is to facilitate application of appropriate levels of information security according to a range of levels of impact or consequences that might result from the unauthorized disclosure, modification, or use of the information or information system. This guideline assumes that the user is familiar with Standards for Security Categorization of Federal Information and Information Systems (Federal Information Processing Standard [FIPS] 199). The guideline and its appendices:"}
  - {"page": 7, "locator": "", "reason": "no-marker", "text": "Provisional security impact levels are the initial or conditional impact determinations made until all considerations are fully reviewed, analyzed, and accepted in the subsequent categorization steps by appropriate officials."}
  - {"page": 9, "locator": "1.3", "reason": "lead-in", "text": "NIST Special Publication (SP) 800-60 is a member of the NIST family of security-related publications including:"}
  - {"page": 9, "locator": "1.3", "reason": "no-marker", "text": "FISMA defines a national security system as any information system (including telecommunications system) used or operated by an agency or by a contractor on behalf of an agency, or any other organization on behalf of an agency"}
  - {"page": 10, "locator": "1.3", "reason": "no-marker", "text": "This series of nine documents is intended to provide a structured, yet flexible framework for selecting, specifying, employing, evaluating, and monitoring the security controls in Federal information systems—and thus, makes a significant contribution toward satisfying the requirements of the Federal Information Security Management Act (FISMA) of 2002. While the publications are mutually reinforcing and have some dependencies, in most cases, they can be effectively used independently of one another."}
  - {"page": 10, "locator": "1.4", "reason": "no-marker", "text": "This is Volume I of two volumes. It contains the basic guidelines for mapping types of information and information systems to security categories. The appendices, including security categorization recommendations for mission-based information types and rationale for security categorization recommendations, are published as a separate Volume II."}
  - {"page": 10, "locator": "1.4", "reason": "lead-in", "text": "Volume I provides the following background information and mapping guidelines:"}
  - {"page": 11, "locator": "1.4.•", "reason": "label-only", "text": "• Appendix A: Glossary; and"}
  - {"page": 11, "locator": "1.4.•", "reason": "label-only", "text": "• Appendix B: References."}
  - {"page": 11, "locator": "1.4", "reason": "lead-in", "text": "Volume II includes the following appendices:"}
  - {"page": 13, "locator": "4 See Section 2.5, Figure 1: NIST Risk Management Framework", "reason": "no-marker", "text": "In contrast, conducting FIPS 199 impact analyses as an agency-wide exercise with the participation of key officials (e.g., Chief Information Officer [CIO], Senior Agency Information Security Officer [SAISO], Authorizing Officials, Mission/System Owners) at multiple levels can enable the agency to leverage economies of scale through the effective management and implementation of security controls at the enterprise level. A resulting value of consistently implementing this systematic process for determining the security categorization and the application of appropriate security protection is an improved overall understanding of the agency’s mission, business processes, and information and system ownership."}
  - {"page": 13, "locator": "4 See Section 2.5, Figure 1: NIST Risk Management Framework", "reason": "short", "text": "Implementation Tip"}
  - {"page": 14, "locator": "2.4", "reason": "short", "text": "Implementation Tip"}
  - {"page": 14, "locator": "2.4", "reason": "no-marker", "text": "It is important to routinely revisit the security categorization as the mission/ business changes because it is likely the impact levels or even information types may change as well."}
  - {"page": 14, "locator": "2.5", "reason": "not-a-statement", "text": "Figure 1, NIST Risk Management Framework, depicts the role of NIST security standards and guidelines for information system security."}
  - {"page": 14, "locator": "2.5", "reason": "no-marker", "text": "NIST SP 800-39, Managing Risk from Information Systems: An Organizational Perspective, (Initial Public Draft), October 2007."}
  - {"page": 15, "locator": "2.5", "reason": "lead-in", "text": "The security categorization process documented in this publication provides input into the following processes:"}
  - {"page": 17, "locator": "3.1.1", "reason": "no-marker", "text": "FIPS 199 establishes three potential levels of impact (low, moderate, and high) relevant to securing Federal information and information systems for each of three stated security objectives (confidentiality, integrity, and availability)."}
  - {"page": 17, "locator": "3.1.2", "reason": "no-marker", "text": "As reflected in Table 1, FISMA and FIPS 199 define three security objectives for information and information systems."}
  - {"page": 17, "locator": "3.1.2", "reason": "fragment", "text": "Objectives"}
  - {"page": 17, "locator": "3.1.2", "reason": "no-marker", "text": "Information is categorized according to its information type. An information type is a specific category of information (e.g., privacy, medical, proprietary, financial, investigative, contractor sensitive, security management) defined by an organization or, in some instances, by a specific law, Executive Order, directive, policy, or regulation."}
  - {"page": 18, "locator": "3.2", "reason": "fragment", "text": "Impact"}
  - {"page": 18, "locator": "3.2", "reason": "no-marker", "text": "Adverse effects on individuals may include, but are not limited to, loss of the privacy to which individuals are entitled under law."}
  - {"page": 20, "locator": "4.0", "reason": "no-marker", "text": "This section provides a methodology for assigning security impact levels and security categorizations for information types and information systems consistent with the organization’s assigned mission and business functions based on FIPS 199, Standards for Security Categorization of Federal Information and Information Systems. This document assumes that the user has read and is familiar with FIPS 199. Figure 2 illustrates the four-step security categorization process and how it drives the selection of baseline security controls."}
