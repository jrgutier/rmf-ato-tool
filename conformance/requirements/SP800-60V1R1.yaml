  - id: "REQ-SP800-60V1R1-0089"
    citation: {"ref": "SP800-60V1R1", "page": 26, "anchor": "The FEA BRM Information Types are provided only as a taxonomy guideline."}
    kind: "indicative"
    locator: "4.1.4"
    context: "Identifying Information Types Not Listed in this Guideline"
    statement: "The FEA BRM Information Types are provided only as a taxonomy guideline. Not all information processed by an information system may be identified from Tables 4 through 6. Therefore, an agency may identify unique information types not listed in this guideline or may choose not to select provisional impact levels from Volume II, Appendix C (for management and support information types) or Volume II, Appendix D (for mission-based information types). Sections 4.2.1 through 4.2.3 of this guideline provide assistance to agencies in assigning provisional security categories to agency-identified information types and information systems."
    status: "not-a-requirement"
    reason: "A permission: 'an agency may identify unique information types' or choose not to use the provisional levels. The page sets no minimum set. infotypes.schema.json allows it with empty `sp800_60_ids`."
