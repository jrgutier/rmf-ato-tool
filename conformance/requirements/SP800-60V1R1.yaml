    statement: "• Step 5: Authorize information system operation based upon a determination of the risk to organizational operations, organizational assets, or to individuals resulting from the operation of the information system and the decision that this risk is acceptable as specified in NIST SP 800-37, Guide for the Security Certification and Accreditation of Federal Information Systems."
