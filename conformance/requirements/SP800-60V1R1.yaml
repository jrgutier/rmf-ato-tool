  - id: "REQ-SP800-60V1R1-0124"
    citation: {"ref": "SP800-60V1R1", "page": 30, "anchor": "For many information types and information systems, the availability impact level depends"}
    kind: "imperative"
    locator: "4.2.2.(ii)"
    context: "Common Factors for Selection of Impact Levels"
    statement: "For many information types and information systems, the availability impact level depends on how long the information or system remains unavailable. Undetected loss of availability can be catastrophic for many information types. For example, permanent loss of budget execution, contingency planning, continuity of operations, service recovery, debt collection, taxation management, personnel management, payroll management, security management, inventory control, logistics management, or accounting information databases would be catastrophic for almost any agency. Complete reconstruction of such databases would be time consuming and expensive."
    status: "not-a-requirement"
    reason: "Describes how availability impact depends on duration, with examples of databases whose loss would be catastrophic. The extractor took 'contingency planning' as an imperative; there is no command and no actor."
  - id: "REQ-SP800-60V1R1-0125"
    citation: {"ref": "SP800-60V1R1", "page": 30, "anchor": "In most cases, the adverse effects of a limited-duration availability compromise on"}
    kind: "modal"
    locator: "4.2.2.(ii)"
    context: "Common Factors for Selection of Impact Levels"
    statement: "In most cases, the adverse effects of a limited-duration availability compromise on an organization’s mission functions and public confidence will be limited. In contrast, for time-critical information types, availability is less likely to be restored before serious harm is done to agency assets, operations, or personnel (or to public welfare). In such instances, the documented availability impact level recommendations should indicate the information is time-critical and the basis for criticality."
    status: "partial"
    reason: "Time criticality is an adjustment factor; the per-type availability recommendation does not flag it."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "Time-critical information types raise the availability impact level through a recorded adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-186"
