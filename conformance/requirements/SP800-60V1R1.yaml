    status: "not-a-requirement"
    reason: "Result line of SYSTEM EXAMPLE 1: the category of contract information."
  - id: "REQ-SP800-60V1R1-0141"
    citation: {"ref": "SP800-60V1R1", "page": 34, "anchor": "SC acquisition system = {(confidentiality, MODERATE), (integrity, MODERATE), (availability, LOW)},"}
