  - id: "REQ-SP800-60V1R1-0048"
    citation: {"ref": "SP800-60V1R1", "page": 17, "anchor": "Federal Information Processing Standard 199 (FIPS 199), Standards for Security Categorization of"}
    kind: "indicative"
    locator: "3.0"
    context: "SECURITY CATEGORIZATION OF INFORMATION AND INFORMATION SYSTEMS"
    statement: "Federal Information Processing Standard 199 (FIPS 199), Standards for Security Categorization of Federal Information and Information Systems, defines the security categories, security objectives, and impact levels to which SP 800-60 maps information types. FIPS 199 establishes security categories based on the magnitude of harm expected to result from compromises rather than on the results of an assessment that includes an attempt to determine the probability of compromise. FIPS 199 also describes the context of use for this guideline. Some of the content of FIPS 199 is included in this section in order to simplify the use of this guideline."
    status: "not-a-requirement"
    reason: "Says what FIPS 199 defines and that it rests on the magnitude of harm 'expected to result', not probability. Description of another standard, which binds no one here; FIPS 199's own entries carry it."
  - id: "REQ-SP800-60V1R1-0049"
    citation: {"ref": "SP800-60V1R1", "page": 17, "anchor": "FIPS 199 establishes security categories for both information6 and information systems. The"}
    kind: "modal"
    locator: "3.1.1"
    context: "Security Categories"
    statement: "FIPS 199 establishes security categories for both information6 and information systems. The security categories are based on the potential impact on an organization should certain events occur. The potential impacts could jeopardize the information and information systems needed by the organization to accomplish its assigned mission, protect its assets, fulfill its legal responsibilities, maintain its day-to-day functions, and protect individuals. Security categories are to be used in conjunction with vulnerability and threat information in assessing the risk to an organization."
    status: "candidate"
  - id: "REQ-SP800-60V1R1-0050"
