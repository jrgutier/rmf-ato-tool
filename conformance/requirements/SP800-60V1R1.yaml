    kind: "modal"
    locator: "4.1"
    context: "Step 1: Identify Information Types"
    statement: "Although this guideline identifies a number of information types and bases its taxonomy on the BRM, only a few of the types identified are likely to be processed by any single system. Also, each system may process information that does not fall neatly into one of the listed information types. Once a set of information types identified in this guideline has been selected, it is prudent to review the information processed by each system under review to see if additional types need to be identified for impact assessment purposes. Also, it is recommended that organizational officials maintain proper documentation of identified information types per information system along with the basis for the information type selection. Guidance for documenting information types is provided in Section 4.5."
    status: "partial"
    reason: "Each type has a selection basis; reviewing for additional types is prose."
    evidence: [{"kind": "rule", "target": "CATG-003", "fixture": "tests/fixtures/negative/CATG-003.yaml", "expect": "records no basis for selecting the information type", "asserts": "Review the information processed to see if additional information types need to be identified, each with its selection basis", "claim": "presence", "holds_when": "ART-INFOTYPES is in play once P-12 is active or it is seeded"}]
    work_item: "WI-187"
  - id: "REQ-SP800-60V1R1-0077"
    citation: {"ref": "SP800-60V1R1", "page": 22, "anchor": "This section describes a process for identifying mission-based information types and for"}
    kind: "indicative"
    locator: "4.1.1"
    context: "Identification of Mission-based Information Types"
    statement: "This section describes a process for identifying mission-based information types and for specifying the impact of unauthorized disclosure, modification, or unavailability of this information. Mission-based information types are, by definition, specific to individual departments and agencies or to specific sets of departments and agencies. The BRM services for citizens business area provides the primary frame of reference for determining the security objectives impact levels for mission-based information and information systems. The consequences or impact of unauthorized disclosure of information, modification or destruction of information, and disruption of access to or use of information are defined by the nature and beneficiary of the service being provided or supported. The BRM establishes 26 direct services and delivery support lines of business with 98 associated information types (reference Table 4). Two additional information types were included to address Executive Functions of the Executive Office of the President and Trade Law Enforcement. These additions are identified by italics in Table 4."
    status: "not-a-requirement"
    reason: "Describes section 4.1.1 and what mission-based types are. The text carries on to page 23; a description, with the duty at 0081."
  - id: "REQ-SP800-60V1R1-0078"
    citation: {"ref": "SP800-60V1R1", "page": 22, "anchor": "One issue associated with the taxonomy activity is the determination of the"}
    kind: "modal"
    locator: "4.1.1"
    context: "Identification of Mission-based Information Types"
    statement: "One issue associated with the taxonomy activity is the determination of the degree of granularity. If the categories are too broad, then the guidelines for assigning impact levels are likely to be too general to be useful. On the other hand, if an attempt is made to provide guidelines for each element of information processed by each government agency, the guideline is likely to be unwieldy and to require excessively frequent changes."
    status: "not-a-requirement"
    reason: "Footnote 12 on how fine a taxonomy should be: 'to require excessively frequent changes' is NIST's reasoning for its own catalog, and it binds no one."
  - id: "REQ-SP800-60V1R1-0079"
    citation: {"ref": "SP800-60V1R1", "page": 22, "anchor": "Definitions are provided in SP 800-60 Appendix A for the BRM terms"}
    kind: "indicative"
    locator: "4.1.1"
    context: "Identification of Mission-based Information Types"
    statement: "Definitions are provided in SP 800-60 Appendix A for the BRM terms such as “Business Areas”, “Lines of Businesses” and “Sub-functions”."
    status: "not-a-requirement"
    reason: "Footnote 13: says the BRM terms are defined in Appendix A. A pointer."
