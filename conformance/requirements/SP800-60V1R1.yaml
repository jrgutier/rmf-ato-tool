  - id: "REQ-SP800-60V1R1-0118"
    citation: {"ref": "SP800-60V1R1", "page": 29, "anchor": "In most cases, the most serious impacts of integrity compromise occur when"}
    kind: "indicative"
    locator: "4.2.2.(ii)"
    context: "Common Factors for Selection of Impact Levels"
    statement: "In most cases, the most serious impacts of integrity compromise occur when some action is taken that is based on the modified information or the modified information is disseminated to other organizations or the public."
    status: "not-a-requirement"
    reason: "Describes when integrity loss is worst, when action follows from modified information. Background to the factor at 0107."
  - id: "REQ-SP800-60V1R1-0119"
    citation: {"ref": "SP800-60V1R1", "page": 29, "anchor": "Undetected loss of integrity can be catastrophic for many information types. The"}
    kind: "should"
    locator: "4.2.2.(ii)"
    context: "Common Factors for Selection of Impact Levels"
    statement: "Undetected loss of integrity can be catastrophic for many information types. The consequences of integrity compromise can be either direct (e.g., modification of a financial entry, medical alert, or criminal record) or indirect (e.g., facilitation of unauthorized access to sensitive or private information or deny access to information or information system services). Malicious use of write access to information and information systems can do enormous harm to an agency’s mission and can be employed to use an agency system as a proxy for attacks on other systems."
    status: "not-a-requirement"
    reason: "Describes what undetected integrity loss can do, direct or indirect. Background with no actor."
  - id: "REQ-SP800-60V1R1-0120"
    citation: {"ref": "SP800-60V1R1", "page": 29, "anchor": "In many cases, the consequences of unauthorized modification or destruction of information"}
    kind: "should"
    locator: "4.2.2.(ii)"
    context: "Common Factors for Selection of Impact Levels"
    statement: "In many cases, the consequences of unauthorized modification or destruction of information to agency mission functions and public confidence in the agency can be expected to be limited. In other cases, integrity compromises can result in the endangerment of human life or other severe consequences. The impact can be particularly severe in the case of time-critical information."
    status: "not-a-requirement"
    reason: "Describes the range of integrity consequences: 'can be expected to be limited' in many cases. A forecast of harm that binds no one; time-critical information is taken up at 0125."
  - id: "REQ-SP800-60V1R1-0121"
    citation: {"ref": "SP800-60V1R1", "page": 30, "anchor": "Using the FIPS 199 potential impact criteria summarized in Table 7, each information type should be evaluated for availability with"}
    kind: "modal"
    locator: "4.2.2.(ii)"
    context: "Common Factors for Selection of Impact Levels"
    statement: "Using the FIPS 199 potential impact criteria summarized in Table 7, each information type should be evaluated for availability with respect to the impact level associated with the disruption of access to or use of information of (i) each known variant of the information belonging to the type and (ii) each use of the information by the system under review. Answers to the following questions will help in the evaluation process:"
    status: "partial"
    reason: "Each type carries an availability level; evaluating each variant and use is prose."
