    kind: "indicative"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization The resulting security category of the information system is initially expressed as:"
    statement: "SC SCADA system = {(confidentiality, LOW), (integrity, HIGH), (availability, HIGH)},"
    status: "not-a-requirement"
    reason: "Result line of SYSTEM EXAMPLE 2: the SCADA system's initial category."
  - id: "REQ-SP800-60V1R1-0144"
    citation: {"ref": "SP800-60V1R1", "page": 34, "anchor": "representing the high water mark or maximum potential impact values for each"}
    kind: "should"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization"
    statement: "representing the high water mark or maximum potential impact values for each security objective from the information types resident on the SCADA system. The management at the power plant chooses to increase the potential impact from a loss of confidentiality from low to moderate reflecting a more realistic view of the potential impact on the information system should there be a security breach due to the unauthorized disclosure of system-level information or processing functions. The final security category of the information system is expressed as:"
    status: "not-a-requirement"
    reason: "Part of SYSTEM EXAMPLE 2: 'should there be a security breach' is a condition in an example of management raising confidentiality, and it binds no one. It illustrates 0137 and 0147."
  - id: "REQ-SP800-60V1R1-0145"
    citation: {"ref": "SP800-60V1R1", "page": 34, "anchor": "SC SCADA system = {(confidentiality, MODERATE), (integrity, HIGH), (availability, HIGH)}."}
    kind: "indicative"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization The final security category of the information system is expressed as:"
    statement: "SC SCADA system = {(confidentiality, MODERATE), (integrity, HIGH), (availability, HIGH)}."
    status: "not-a-requirement"
    reason: "Result line of SYSTEM EXAMPLE 2: the SCADA system's final category."
  - id: "REQ-SP800-60V1R1-0146"
    citation: {"ref": "SP800-60V1R1", "page": 34, "anchor": "In some cases, the impact level for a system security category will"}
    kind: "modal"
    locator: "4.4.2"
    context: "Guidelines for System Categorization"
    statement: "In some cases, the impact level for a system security category will be higher than any security objective impact level for any information type processed by the system."
    status: "not-a-requirement"
    reason: "'will be higher' forecasts an outcome in some cases, with no actor. The duty to weigh the factors that raise it is 0147 and the sections after it."
  - id: "REQ-SP800-60V1R1-0147"
    citation: {"ref": "SP800-60V1R1", "page": 34, "anchor": "The primary factors that most commonly raise the impact levels of the"}
    kind: "modal"
    locator: "4.4.2"
    context: "Guidelines for System Categorization"
    statement: "The primary factors that most commonly raise the impact levels of the system security category above that of its constituent information types are aggregation and critical system functionality. Additionally, variations in sensitivity/criticality with respect to time may need to be factored into the impact assignment process. Some information loses its sensitivity in time (e.g., economic/commodity projections after they’ve been published). Other information is particularly critical at some point in time (e.g., weather data in the terminal approach area during aircraft landing operations). This section provides some general guidelines regarding how aggregation, critical functionality, and other system factors may affect system security categorization."
    status: "partial"
    reason: "Aggregation and critical functionality are recorded adjustment factors; variations with time are prose."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "Aggregation and critical system functionality raise the system impact level above the information types, recorded as an adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0148"
    citation: {"ref": "SP800-60V1R1", "page": 35, "anchor": "Agency personnel should be aware that there are several factors that should"}
    kind: "should"
    locator: "4.4.2"
    context: "Guidelines for System Categorization"
    statement: "Agency personnel should be aware that there are several factors that should be considered during the aggregation of system information types. When considering these factors, previously unforeseen concerns may surface affecting the confidentiality, integrity, and/or availability impact levels at the system level. These factors include data aggregation, critical system functionality, extenuating circumstances, and other system factors."
    status: "not-a-requirement"
    reason: "Boxed Implementation Tip: 'should be aware' and 'should be considered' introduce factors named again in the sections below it. Advisory, and no minimum set."
  - id: "REQ-SP800-60V1R1-0149"
    citation: {"ref": "SP800-60V1R1", "page": 35, "anchor": "In order to effectively accomplish this step, various stakeholders (e.g., management, operational"}
    kind: "modal"
    locator: "4.4.2"
    context: "Guidelines for System Categorization"
    statement: "In order to effectively accomplish this step, various stakeholders (e.g., management, operational personnel, or security experts) may need to be involved in decisions regarding system-level impact assessments. The following sections provide factors to consider in adjusting the system security objective impact levels."
    status: "not-a-requirement"
    reason: "Advisory: 'may need to be involved' suggests who could join, and the page sets no minimum. C-2's raci already reaches management, operations and security. The second sentence is a roadmap."
  - id: "REQ-SP800-60V1R1-0150"
    citation: {"ref": "SP800-60V1R1", "page": 35, "anchor": "Some information may have little or no sensitivity in isolation but may"}
    kind: "modal"
    locator: "4.4.2"
    context: "Guidelines for System Categorization"
    statement: "Some information may have little or no sensitivity in isolation but may be highly sensitive in aggregation. In some cases, aggregation of large quantities of a single information type can reveal sensitive patterns and plans, or facilitate access to sensitive or critical systems. In other cases, aggregation of information of several different and seemingly innocuous types can have similar effects. In general, the sensitivity of a given data element is likely to be greater in context than in isolation (e.g., association of an account number with the identity of an individual and/or institution). The availability, routine operational employment, and sophistication of data aggregation and inference tools are all increasing rapidly. If review reveals increased sensitivity or criticality associated with information aggregates, then the system security objective impact levels may need to be adjusted to a higher level than would be indicated by the security impact levels associated with any individual information type. This could be implemented by incorporating a statement that explains the aggregation and potential security objective affected as well as the modification to impact levels."
    status: "partial"
    reason: "Aggregation is an adjustment factor; nothing tests that aggregated sensitivity was weighed."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "Sensitivity in aggregation is recorded as an adjustment raising the impact level, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0151"
    citation: {"ref": "SP800-60V1R1", "page": 35, "anchor": "Other systems to which the system in question is connected, or"}
    kind: "lettered"
    locator: "4.4.2.•"
    context: "Guidelines for System Categorization Compromise of some information types may have low impact in the context of a system’s primary function but may have much more significance when viewed in the conte"
    statement: "• Other systems to which the system in question is connected, or"
    status: "not-a-requirement"
    reason: "Noun item under a rejected lead-in on the potential impact of compromising: connected systems. The duty on it is 0153."
  - id: "REQ-SP800-60V1R1-0152"
    citation: {"ref": "SP800-60V1R1", "page": 35, "anchor": "Other systems which are dependent on that system’s information."}
    kind: "lettered"
    locator: "4.4.2.•"
    context: "Guidelines for System Categorization Compromise of some information types may have low impact in the context of a system’s primary function but may have much more significance when viewed in the conte"
    statement: "• Other systems which are dependent on that system’s information."
    status: "not-a-requirement"
    reason: "Noun item under the same lead-in: dependent systems. The duty on it is 0153."
  - id: "REQ-SP800-60V1R1-0153"
    citation: {"ref": "SP800-60V1R1", "page": 35, "anchor": "Access control information for a system that processes only low impact information"}
    kind: "modal"
    locator: "4.4.2"
    context: "Guidelines for System Categorization Compromise of some information types may have low impact in the context of a system’s primary function but may have much more significance when viewed in the conte"
    statement: "Access control information for a system that processes only low impact information might initially be thought to have only low impact security objectives. However, if access to that system might result in some form of access to other systems (e.g., over a network), the sensitivity and criticality attributes of all systems to which such indirect access can result needs to be considered. Similarly, some information may, in general, have low sensitivity and/or criticality security objectives. However, that information may be used by other systems to enable extremely sensitive or critical functions (e.g., air traffic control use of weather information or use of commercial flight information to identify military combat transport systems). Loss of data integrity, availability, temporal context, or other context can have catastrophic consequences."
    status: "partial"
    reason: "Indirect access to other systems can raise the level through a recorded adjustment; nothing finds such access."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "Access to other systems is weighed and any raised impact level is recorded as an adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0154"
    citation: {"ref": "SP800-60V1R1", "page": 36, "anchor": "This publication focuses on categorizing an information system based on its information"}
    kind: "should"
    locator: "4.4.2"
    context: "Guidelines for System Categorization"
    statement: "This publication focuses on categorizing an information system based on its information types and associated security objective impacts. There are times when a system security objective impact level should be elevated based on reasons other than its information. For example, the information system provides critical process flow or security capability, the visibility of the system to the public, the sheer number of other systems reliant on its operation or possibly its overall cost of replacement. These examples, given a specific situation, may provide reason for the system owner to increase the overall security impact level of a system."
    status: "partial"
    reason: "Raising for reasons other than information is a recorded adjustment with its factor; whether one was warranted is judgment."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "A system security objective impact level elevated for reasons other than its information is recorded as an adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0155"
    citation: {"ref": "SP800-60V1R1", "page": 36, "anchor": "An elevation based on extenuating circumstances can be more apparent by comparing"}
    kind: "modal"
    locator: "4.4.2"
    context: "Guidelines for System Categorization"
    statement: "An elevation based on extenuating circumstances can be more apparent by comparing the original security categorization to the business impact analysis. If the system was categorized based on FIPS 199 at a Moderate overall impact level but the system owner has determined it needs to be operational within 4-8 hours of a disruption irrespective of the aggregated information type availability security impact level assigned, then there is a disconnect that might be caused by the system’s extenuating circumstances. Agencies must customize the information system availability security impact level as appropriate to obtain full value and accuracy."
    status: "partial"
    reason: "An elevation for extenuating circumstances is a recorded adjustment; comparison with the business impact analysis is not tested."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "An elevation of the availability impact level for extenuating circumstances is recorded as an adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0156"
    citation: {"ref": "SP800-60V1R1", "page": 36, "anchor": "Most Federal agencies maintain web pages that are accessible to the public."}
    kind: "indicative"
    locator: "Public Information Integrity"
    context: ""
    statement: "Most Federal agencies maintain web pages that are accessible to the public. The vast majority of these public web pages permit interaction between the site and the public. In some cases, the site provides only information. In other cases, forms may be submitted via the website (e.g., applications for service or job applications). In some cases, the site is a medium for business transactions. Unauthorized modification or destruction of information affecting external communications (e.g., web pages, electronic mail) may adversely affect operations and/or public confidence in the agency. In most cases, the damage can be corrected within a relatively short period of time, and the damage is limited (impact level is low). In other cases (e.g., very large fraudulent transactions or modification of a web page belonging to an intelligence/security community component), the damage to mission function and/or public confidence in the agency can be serious. In such cases, the integrity impact associated with unauthorized modification or destruction of a public web page would be at least moderate."
    status: "partial"
    reason: "Public visibility is an adjustment factor; nothing finds a public web presence."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "Public visibility of external communications raises the impact level through a recorded adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0157"
    citation: {"ref": "SP800-60V1R1", "page": 36, "anchor": "Either physical or logical destruction of major assets can result in very"}
    kind: "should"
    locator: "Catastrophic Loss of System Availability"
    context: ""
    statement: "Either physical or logical destruction of major assets can result in very large expenditures to restore the assets and/or long periods of time for recovery. Permanent loss/unavailability of information system capabilities can seriously hamper agency operations and, where direct services to the public are involved, have a severe adverse effect on public confidence in Federal agencies. Particularly in the case of large systems, FIPS 199 criteria suggest that catastrophic loss of system availability may result in a high availability impact level. Whether or not the impact level of system availability should be high (and subsequent high system security impact level) is dependent on other factors, such as cost and criticality of the system, rather than on the security impact levels for the information types being processed by the system."
    status: "partial"
    reason: "Replacement cost and catastrophic loss of availability are adjustment factors; nothing tests whether one applies."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "Catastrophic loss of system availability raises the availability impact level through a recorded adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0158"
    citation: {"ref": "SP800-60V1R1", "page": 37, "anchor": "Large or complex information systems composed of multiple lower level systems often"}
    kind: "modal"
    locator: "Large Supporting and Interconnecting Systems"
    context: ""
    statement: "Large or complex information systems composed of multiple lower level systems often require additional consideration regarding assignment of system security categorization. This section will provide guidelines for applying and interrelating individual system security categorization results to enterprise organizations, large supporting infrastructures (such as general support systems, data warehouse applications, large data storage units, server farms, and information repositories), and interconnecting systems."
    status: "partial"
    reason: "Subsystem categorization is held; enterprise-level categorization of large infrastructures is outside the run."
    evidence: [{"kind": "rule", "target": "SUBS-001", "fixture": "tests/fixtures/negative/SUBS-001.yaml", "expect": "below the high-water mark", "asserts": "Large systems composed of lower level systems are categorized no lower than the high-water mark of their subsystems", "claim": "constraint"}]
    work_item: "WI-175"
  - id: "REQ-SP800-60V1R1-0159"
    citation: {"ref": "SP800-60V1R1", "page": 37, "anchor": "Upon security categorization identification for all information systems interacting with large infrastructure"}
    kind: "modal"
    locator: "Large Supporting and Interconnecting Systems"
    context: ""
    statement: "Upon security categorization identification for all information systems interacting with large infrastructure systems, senior IT and security officials have possession of valuable information that can now enable an enterprise wide security perspective. One significant activity includes levying an overall security categorization for the agency’s supporting network infrastructures. Since networks, as well as other general support systems, do not inherently “own” mission-based or management and support information types, the infrastructure’s categorization is based on the aggregation of the information systems’ security categorizations. In other words, the infrastructure’s security categorization is the high water mark of the supported information systems and is based on the information types processed, flowed, or stored on the network or general support system. Together, the top down enterprise wide threat assessment and bottom up security assessment derived by aggregation will allow an organization to look at its risk profile from a comprehensive and balanced view. Further, this analysis will ensure the proper application of common security controls supporting the multiple information systems and the protection provided by those controls are inherited by the individual systems."
    status: "partial"
    reason: "An enterprise-wide categorization of supporting networks is outside the run."
    evidence: [{"kind": "prose", "target": "playbooks/P/P-11.md", "asserts": "Security categorization of interacting systems informs the categorization of supporting network infrastructures", "claim": "presence"}]
    work_item: "WI-175"
  - id: "REQ-SP800-60V1R1-0160"
    citation: {"ref": "SP800-60V1R1", "page": 37, "anchor": "Where the mission served by an information system, or the information that"}
    kind: "modal"
    locator: "Critical Infrastructures and Key Resources"
    context: ""
    statement: "Where the mission served by an information system, or the information that the system processes, affects the security of critical infrastructures and key resources, the harm that results from a compromise requires particularly close attention. In this case, an effect on security might include a significant reduction in the effectiveness of physical or cyber security protection mechanisms, or facilitation of a terrorist attack on critical infrastructures and key resources. Accordingly, the system security categorization should be carefully determined when a loss of confidentiality, integrity, or availability will result in a negative impact on the critical infrastructures and key resources."
    status: "partial"
    reason: "Critical infrastructure is an adjustment factor and a special handling flag; nothing tests the careful determination."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "above the high-water mark", "asserts": "Where the system affects critical infrastructures the system security categorization is raised through a recorded adjustment, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0161"
    citation: {"ref": "SP800-60V1R1", "page": 37, "anchor": "The Critical Information Infrastructure Act of 2002, Public Law 107-296 §§ 211-215"}
    kind: "should"
    locator: "Critical Infrastructures and Key Resources"
    context: ""
    statement: "The Critical Information Infrastructure Act of 2002, Public Law 107-296 §§ 211-215 of November 25, 2002 (codified as 6 U.S.C. 131-134), defines the term \"critical infrastructure information\" to mean information not customarily in the public domain and related to the security of critical infrastructure or protected systems. Should information types be aligned with Critical Infrastructures, then action should be taken to ensure compliance with Homeland Security Presidential Directive No. 7 (HSPD 7) and to initiate an interdependency analysis."
    status: "partial"
    reason: "Critical infrastructure information is a special handling flag; HSPD 7 compliance and interdependency analysis are outside the run."
    evidence: [{"kind": "schema", "target": "framework/schema/infotypes.schema.json#/properties/information_types/items/properties/handling/properties/special", "claim": "presence", "asserts": "Information types aligned with critical infrastructure carry the special handling flag"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0162"
    citation: {"ref": "SP800-60V1R1", "page": 37, "anchor": "The E-Government Act of 2002 complements privacy protection requirements of the Privacy"}
    kind: "modal"
    locator: "Privacy Information"
    context: ""
    statement: "The E-Government Act of 2002 complements privacy protection requirements of the Privacy Act of 1974. Under the terms of these public laws, Federal government agencies have specific responsibilities regarding collection, dissemination or disclosure of information regarding individuals.19"
    status: "not-a-requirement"
    reason: "Background to the privacy subsection: 'have specific responsibilities' cites the laws in general and names no duty of its own. The act is at 0163 and 0164."
  - id: "REQ-SP800-60V1R1-0163"
    citation: {"ref": "SP800-60V1R1", "page": 38, "anchor": "The September 26, 2003 OMB Memorandum M-03-22, “OMB Guidance for Implementing the"}
    kind: "modal"
    locator: "Privacy Information"
    context: ""
    statement: "The September 26, 2003 OMB Memorandum M-03-22, “OMB Guidance for Implementing the Privacy Provisions of the E-Government Act of 2002,” puts the privacy provisions of the E- Government Act of 2002 into effect. The guidance applies to information that identifies individuals in a recognizable form, including name, address, telephone number, Social Security Number, and e-mail addresses. OMB instructed agency heads “to describe how the government handles information that individuals provide electronically, so that the American public has assurances that personal information is protected.” Under these public laws and executive policies, it is necessary to broaden the definition of “unauthorized disclosure” to encompass any access, use, disclosure, or sharing of privacy-protected information among Federal government agencies when such actions are prohibited by privacy laws and policies. Since most privacy regulations focus on access, use, disclosure, or sharing of information, privacy considerations are dealt with in this guideline as special factors affecting the confidentiality impact level. In establishing confidentiality impact levels for each information type, responsible parties must consider the consequences of unauthorized disclosure of privacy information (with respect to violations of Federal policy and/or law)."
    status: "candidate"
    work_item: "WI-144"
  - id: "REQ-SP800-60V1R1-0164"
    citation: {"ref": "SP800-60V1R1", "page": 38, "anchor": "Agencies are required to conduct Privacy Impact Assessments (PIAs) before developing IT"}
    kind: "modal"
    locator: "Privacy Information"
    context: ""
    statement: "Agencies are required to conduct Privacy Impact Assessments (PIAs) before developing IT systems that contain personally identifiable information or before collecting personally identifiable information electronically. The impact of privacy violations should consider any adverse effects experienced by individuals or organizations as a result of the loss of PII confidentiality. Examples of adverse effects experienced by individuals may include blackmail, identity theft, discrimination, or emotional distress. Examples of adverse effects experienced by organizations may include administrative burden, financial losses, loss of public reputation and confidence, and the penalties associated with violation of the relevant statutes and policies."
    status: "candidate"
    work_item: "WI-135"
  - id: "REQ-SP800-60V1R1-0165"
    citation: {"ref": "SP800-60V1R1", "page": 38, "anchor": "Categorizations should be reviewed to ensure that the adverse effects of a"}
    kind: "should"
    locator: "Privacy Information"
    context: ""
    statement: "Categorizations should be reviewed to ensure that the adverse effects of a loss of PII confidentiality have been adequately factored into impact determinations. The confidentiality impact level should generally fall into the moderate range."
    status: "partial"
    reason: "PII confidentiality falling in the moderate range is guidance; nothing raises it."
    evidence: [{"kind": "prose", "target": "playbooks/C/C-2.md", "asserts": "Loss of PII confidentiality is factored into the impact determination under the pii factor", "claim": "presence"}]
    work_item: "WI-180"
  - id: "REQ-SP800-60V1R1-0166"
    citation: {"ref": "SP800-60V1R1", "page": 38, "anchor": "There are several laws that specifically prohibit unauthorized disclosure of trade secrets"}
    kind: "modal"
    locator: "Trade Secrets"
    context: ""
    statement: "There are several laws that specifically prohibit unauthorized disclosure of trade secrets (e.g., 7 U.S.C., Chapter 6, Subchapter II, Section 136h and 42 U.S.C., Chapter 6A, Subchapter XII, Part E, Section 300j-4(d)(1)). Systems that store, communicate, or process trade secrets will generally be assigned at least a moderate confidentiality impact level."
    status: "partial"
    reason: "Trade secrets are flagged; the moderate confidentiality floor is not enforced."
    evidence: [{"kind": "schema", "target": "framework/schema/infotypes.schema.json#/properties/information_types/items/properties/handling/properties/special", "claim": "presence", "asserts": "Systems that process trade secrets flag the special handling"}]
    work_item: "WI-180"
  - id: "REQ-SP800-60V1R1-0167"
    citation: {"ref": "SP800-60V1R1", "page": 38, "anchor": "Since the impact values (i.e., levels) for confidentiality, integrity, and availability may"}
    kind: "modal"
    locator: "4.4.3"
    context: "Overall Information System Impact"
    statement: "Since the impact values (i.e., levels) for confidentiality, integrity, and availability may not always be the same for a particular information system, the high water mark concept20 is used to determine the overall impact level of the information system. The security impact level for an information system will generally be the highest impact level for the security objectives (confidentiality, integrity, and availability) associated with the aggregate of system information types. Thus, a low-impact system is defined as an information system in which all three of the security objectives are low. A moderate-impact system is an information system in which at least one of the security objectives is moderate and no security objective is greater than moderate. And finally, a high-impact system is an information system in which at least one security objective is high."
    status: "candidate"
  - id: "REQ-SP800-60V1R1-0168"
    citation: {"ref": "SP800-60V1R1", "page": 38, "anchor": "The OMB definition of an individual is, “a citizen of the United"}
    kind: "should"
    locator: "4.4.3"
    context: "Overall Information System Impact"
    statement: "The OMB definition of an individual is, “a citizen of the United States or an alien lawfully admitted for permanent residence.” Agencies may choose to extend the protections of the Privacy Act and E-Government Act to businesses, sole proprietors, aliens, etc."
    status: "not-a-requirement"
    reason: "Footnote 19: the OMB definition of an individual, then a permission, 'Agencies may choose to extend the protections'. A definition and an option with no minimum set."
  - id: "REQ-SP800-60V1R1-0169"
    citation: {"ref": "SP800-60V1R1", "page": 39, "anchor": "Essential to the security categorization process is documenting the research, key decisions"}
    kind: "modal"
    locator: "4.5"
    context: "Documenting the Security Categorization Process"
    statement: "Essential to the security categorization process is documenting the research, key decisions and approvals, and supporting rationale driving the information system security categorization. This information is key to supporting the security life cycle and will need to be included in the information system’s security plan."
    status: "candidate"
  - id: "REQ-SP800-60V1R1-0170"
    citation: {"ref": "SP800-60V1R1", "page": 40, "anchor": "Business and Mission Supported: The SCADA (supervisory control and data acquisition) system"}
    kind: "table"
    locator: "4.5"
    context: "Documenting the Security Categorization Process"
    statement: "Business and Mission Supported: The SCADA (supervisory control and data acquisition) system provides real-time control and information supporting the main power plant. The power plant provides critical distribution of electric power to the military installation."
