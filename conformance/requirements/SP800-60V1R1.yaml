  - id: "REQ-SP800-60V1R1-0033"
    citation: {"ref": "SP800-60V1R1", "page": 12, "anchor": "Security categorization provides a vital step in integrating security into the government"}
    kind: "indicative"
    locator: "2.0"
    context: "PUBLICATION OVERVIEW"
    statement: "Security categorization provides a vital step in integrating security into the government agency’s business and information technology management functions and establishes the foundation for security standardization amongst their information systems. Security categorization starts with the identification of what information supports which government lines of business, as defined by the Federal Enterprise Architecture (FEA). Subsequent steps focus on the evaluation of the need for security in terms of confidentiality, integrity, and availability. The result is strong linkage between missions, information, and information systems with cost effective information security."
    status: "not-a-requirement"
    reason: "Overview: categorization is a vital step and starts from lines of business. Description of value; the steps themselves are 0034 and section 4."
  - id: "REQ-SP800-60V1R1-0034"
    citation: {"ref": "SP800-60V1R1", "page": 12, "anchor": "Agencies support the categorization process by establishing mission-based information types for the"}
    kind: "indicative"
    locator: "2.1"
    context: "Agencies Support the Security Categorization Process"
    statement: "Agencies support the categorization process by establishing mission-based information types for the organization. The approach to establishing mission-based information types at an agency begins by documenting the agency’s mission and business areas. In the case of mission-based information, the responsible individuals, in coordination with management, operational, enterprise architecture, and security stakeholders, should compile a comprehensive set of the agency’s lines of business and mission areas. In addition, responsible individuals should identify the applicable sub-functions necessary to accomplish the organization’s mission. For example, one organization’s mission might be related to economic development. Sub-functions that are part of the organization’s economic development mission might include business and industry development, intellectual property protection, or financial sector oversight. Each of these sub-functions represents an information type."
    status: "candidate"
    work_item: "WI-19"
  - id: "REQ-SP800-60V1R1-0035"
    citation: {"ref": "SP800-60V1R1", "page": 12, "anchor": "Agencies should conduct FIPS 199 security categorizations of their information systems as"}
    kind: "should"
    locator: "2.1"
    context: "Agencies Support the Security Categorization Process"
    statement: "Agencies should conduct FIPS 199 security categorizations of their information systems as an agency-wide activity with the involvement of the senior leadership and other key officials within the organization (e.g., mission and business owners, authorizing officials, risk executive, chief information officer, senior agency information security officer, information system owners, and information owners) to ensure that each information system receives the appropriate management oversight and reflects the needs of the organization as a whole. Senior leadership oversight in the security categorization process is essential so that the next steps in the NIST Risk Management Framework4 (e.g., security control selection) can be carried out in an effective and consistent manner throughout the agency."
    status: "candidate"
  - id: "REQ-SP800-60V1R1-0036"
    citation: {"ref": "SP800-60V1R1", "page": 12, "anchor": "Federal agencies are heavily dependent upon information and information systems to successfully"}
    kind: "modal"
    locator: "2.2"
    context: "Value to Agency Missions, Security Programs and IT Management"
    statement: "Federal agencies are heavily dependent upon information and information systems to successfully conduct critical missions. With an increasing reliability on and growing complexity of information systems as well as a constantly changing risk environment, information security has become a mission-essential function. This function must be conducted in a manner that reduces the risks to the information entrusted to the agency, its overall mission, and its ability to do business and to serve the American public. In the end, information security, as a function, becomes a business enabler through diligent and effective management of risk to information confidentiality, integrity, and availability."
    status: "not-a-requirement"
    reason: "Background on why security matters to agencies. 'must be conducted' sits on 'This function', meaning information security in general; it names no actor or act and binds no one."
  - id: "REQ-SP800-60V1R1-0037"
    citation: {"ref": "SP800-60V1R1", "page": 13, "anchor": "Therefore, the value of information security categorization is to enable agencies to"}
    kind: "indicative"
    locator: "4 See Section 2.5, Figure 1: NIST Risk Management Framework"
    context: ""
    statement: "Therefore, the value of information security categorization is to enable agencies to proactively implement appropriate information security controls based on the assessed potential impact to information confidentiality, integrity, and availability and in turn to support their mission in a cost-effective manner. An incorrect information system impact analysis (i.e., incorrect FIPS 199 security categorization) can result in the agency either over protecting the information system thus wasting valuable security resources, or under protecting the information system and placing important operations and assets at risk. The aggregation of such mistakes at the enterprise level can further compound the problem."
    status: "not-a-requirement"
    reason: "Value of categorization: an incorrect analysis over or under protects. A statement of consequence, with no actor told to do anything."
  - id: "REQ-SP800-60V1R1-0038"
    citation: {"ref": "SP800-60V1R1", "page": 13, "anchor": "To enable an appropriate level of mission support and the diligent implementation"}
    kind: "modal"
    locator: "4 See Section 2.5, Figure 1: NIST Risk Management Framework"
    context: ""
    statement: "To enable an appropriate level of mission support and the diligent implementation of current and future information security requirements, each agency should establish a formal process to validate system level security categorizations in terms of agency priorities. This will not only promote comparable evaluation of systems, but also yield added benefits to include leveraging common security controls and establishing defense-in-depth."
    status: "not-a-requirement"
    reason: "Boxed Implementation Tip: 'each agency should establish a formal process' is advisory, a tip the page does not make a minimum set. 'will' describes its benefits. It binds no one."
  - id: "REQ-SP800-60V1R1-0039"
    citation: {"ref": "SP800-60V1R1", "page": 13, "anchor": "An initial security categorization should occur early in the agency’s system development"}
    kind: "indicative"
    locator: "2.3"
    context: "Role in the System Development Lifecycle"
    statement: "An initial security categorization should occur early in the agency’s system development lifecycle (SDLC). The resulting security categorization would feed into security requirements identification (later to evolve into security controls) and other related activities such as privacy impact analysis or critical infrastructure analysis. Ultimately, the identified security requirements and selected security controls are introduced to the standard systems engineering process to effectively integrate the security controls with the information systems functional and operational requirements, as well as other pertinent system requirements (e.g., reliability, maintainability, supportability)."
    status: "candidate"
  - id: "REQ-SP800-60V1R1-0040"
    citation: {"ref": "SP800-60V1R1", "page": 13, "anchor": "Security categorization establishes the foundation of the certification and accreditation (C&A) activity"}
    kind: "indicative"
    locator: "2.4"
    context: "Role in the Certification and Accreditation Process"
    statement: "Security categorization establishes the foundation of the certification and accreditation (C&A) activity by determining the levels of rigor required for certification and overall assurance testing of security controls, as well as additional activities that may be needed (i.e., privacy and critical infrastructure protection (CIP)). Thus, it assists in determining C&A level of effort and associated activity duration."
    status: "not-a-requirement"
    reason: "Says what categorization does for certification: 'levels of rigor required' describes an effect, and no one is told to act."
  - id: "REQ-SP800-60V1R1-0041"
    citation: {"ref": "SP800-60V1R1", "page": 14, "anchor": "Security categorization is a prerequisite activity for the C&A process. The categorization"}
    kind: "modal"
    locator: "2.4"
    context: "Role in the Certification and Accreditation Process"
    statement: "Security categorization is a prerequisite activity for the C&A process. The categorization should be revisited at least every three years or when significant change occurs to the system or supporting business lines. Situational changes outside the system or agency may require a reevaluation of the categorization (i.e., directed mission changes, changes in governance, elevated or targeted threat activities). For more information, see NIST SP 800-64, Security Considerations in the Information System Development Life Cycle and NIST SP 800-37, Guide for the Security Certification and Accreditation of Federal Information Systems."
    status: "partial"
    reason: "When the categorization is revisited is a free-text field; nothing tests the three-year revisit or a significant change."
    evidence: [{"kind": "schema", "target": "framework/schema/facts.schema.json#/properties/categorization/properties/revisit", "claim": "presence", "asserts": "The categorization is revisited at least every three years or when significant change occurs"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0042"
    citation: {"ref": "SP800-60V1R1", "page": 14, "anchor": "Security Categorization is the key first step in the Risk Management Framework5"}
    kind: "indicative"
    locator: "2.5"
    context: "Role in the NIST Risk Management Framework"
    statement: "Security Categorization is the key first step in the Risk Management Framework5 because of its effect on all other steps in the framework from selection of security controls to level of effort in assessing security control effectiveness."
    status: "not-a-requirement"
    reason: "Says categorization is the key first step of the framework and why. A description of the step's place; no actor."
