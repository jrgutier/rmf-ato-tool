    context: "Table 4: Mission-Based Information Types and Delivery Mechanisms14"
    statement: "Recommended mission-based lines of business and constituent sub-functions that may be processed by information systems are identified in Table 4 with details provided in Volume II, Appendix D, “Examples of Impact Determination for Mission-based Information and Information Systems.”"
    status: "not-a-requirement"
    reason: "Pointer to Table 4 and Volume II Appendix D: 'Recommended' describes the lines of business listed there. It binds no one."
  - id: "REQ-SP800-60V1R1-0083"
    citation: {"ref": "SP800-60V1R1", "page": 24, "anchor": "At the agency level, all government agencies perform at least one of"}
    kind: "indicative"
    locator: "4.1.1"
    context: "Table 4: Mission-Based Information Types and Delivery Mechanisms14"
    statement: "At the agency level, all government agencies perform at least one of the mission areas and employ at least one of the services delivery mechanisms described in Table 4. However, some information systems may only provide a supporting role to the agency’s mission and not directly process any of the mission-based information types."
    status: "not-a-requirement"
    reason: "Boxed Implementation Tip: a description that every agency has a mission area and that some systems only support one. Advisory, and no minimum set."
  - id: "REQ-SP800-60V1R1-0084"
    citation: {"ref": "SP800-60V1R1", "page": 24, "anchor": "Much Federal government information and many supporting information systems are not employed"}
    kind: "modal"
    locator: "4.1.2"
    context: "Identification of Management and Support Information"
    statement: "Much Federal government information and many supporting information systems are not employed directly to provide direct mission-based services, but are primarily intended to support delivery of services or to manage resources. The support delivery of services and management of resources business areas are together composed of 13 lines of business (Tables 5 and 6). The BRM subdivides the lines of business into 72 sub-functions. The support delivery of services and management of resource business areas are common to most Federal government agencies, and the information associated with each of their sub-functions is identified in this guideline as a management and support information type. Four additional management and support sub-factor information types have been defined to address privacy information. One additional management and support sub-factor information type has been defined to address General Information as a catch-all information type that may not be defined by the FEA BRM. As such, agencies may find it necessary to identify additional information types not defined in the BRM and assign associated security impact levels to those types."
    status: "not-a-requirement"
    reason: "Describes the management and support business areas. Its last sentence is a permission: 'may find it necessary to identify additional information types'; the page sets no minimum, and infotypes.schema.json already allows such types. 'may not be defined by the FEA BRM' describes the General Information type and binds no one."
  - id: "REQ-SP800-60V1R1-0085"
