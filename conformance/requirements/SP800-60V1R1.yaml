  - {"page": 29, "locator": "4.2.2.(ii)", "reason": "no-marker", "text": "Unauthorized modification or destruction of information can take many forms. The changes can be subtle and hard to detect, or they can occur on a massive scale. One can construct an extraordinarily wide range of scenarios for modification of information and its likely consequences. Just a few examples include forging or modifying information to:"}
  - {"page": 30, "locator": "4.2.2.(ii)", "reason": "short", "text": "4.2.2.3 Availability Factors"}
  - {"page": 30, "locator": "4.2.3", "reason": "lead-in", "text": "FIPS 199-based examples of security objective impact selection and security categorization for sample information types follow:"}
  - {"page": 30, "locator": "4.2.3", "reason": "not-a-statement", "text": "EXAMPLE 1: An organization managing public information on its web server determines that there is no potential impact from a loss of confidentiality (i.e., confidentiality requirements are not applicable), a moderate potential impact from a loss of integrity, and a moderate potential impact from a loss of availability. The resulting security category of this information type is expressed as:"}
  - {"page": 30, "locator": "4.2.3", "reason": "not-a-statement", "text": "EXAMPLE 2: A law enforcement organization managing extremely sensitive investigative information determines that the potential impact from a loss of confidentiality is high, the potential impact from a loss of integrity is moderate, and the potential impact from a loss of availability is moderate. The resulting security category for this type of information is expressed as:"}
  - {"page": 31, "locator": "4.2.3", "reason": "no-marker", "text": "Security Category investigative information = {(confidentiality, high), (integrity, moderate), (availability, moderate)}."}
  - {"page": 31, "locator": "4.2.3", "reason": "not-a-statement", "text": "EXAMPLE 3: A financial organization managing routine administrative information (not privacy-related information) determines that the potential impact from a loss of confidentiality is low, the potential impact from a loss of integrity is low, and the potential impact from a loss of availability is low. The resulting security category of this information type is expressed as:"}
  - {"page": 31, "locator": "4.2.3", "reason": "no-marker", "text": "Security Category administrative information = {(confidentiality, low), (integrity, low), (availability, low)}."}
  - {"page": 31, "locator": "4.3", "reason": "no-marker", "text": "Information Type Impact Levels"}
  - {"page": 31, "locator": "4.3", "reason": "not-normative", "text": "The impact of information compromise of a particular type can vary in different agencies or in dissimilar operational contexts. Also, the impact for an information type may vary throughout the life cycle. For example, contract information that has a moderate confidentiality impact level during the life of the contract may have a low impact level when the contract is completed. Policy information may have moderate confidentiality and integrity impact levels during the policy development process, low confidentiality and moderate integrity impact levels when the policy is implemented, and low confidentiality and integrity impact levels when the policy is no longer used."}
  - {"page": 32, "locator": "4.3", "reason": "no-marker", "text": "The impact levels associated with the management and support information common to many agencies are strongly affected by the mission-based information with which it is associated. That is, agency-common management and support information used with very sensitive or critical mission-based information types may have higher impact levels than the same agency-common information used with less critical mission-based information types."}
  - {"page": 33, "locator": "4.4.1", "reason": "lead-in", "text": "The generalized format for expressing the security category, or SC, of an information system is:"}
  - {"page": 33, "locator": "4.4.1", "reason": "no-marker", "text": "where the acceptable values for potential impact are LOW, MODERATE, or HIGH."}
  - {"page": 33, "locator": "4.4.1", "reason": "no-marker", "text": "The following examples illustrate the system security categorization process described in FIPS 199."}
  - {"page": 34, "locator": "4.4.1", "reason": "no-marker", "text": "SC administrative information = {(confidentiality, LOW), (integrity, LOW), (availability, LOW)}."}
  - {"page": 34, "locator": "4.4.1", "reason": "lead-in", "text": "The resulting security category of the information system is expressed as:"}
  - {"page": 34, "locator": "4.4.1", "reason": "no-marker", "text": "representing the high water mark or maximum potential impact values for each security objective from the information types resident on the acquisition system."}
  - {"page": 34, "locator": "4.4.1", "reason": "no-marker", "text": "SYSTEM EXAMPLE 2: A power plant contains a SCADA (supervisory control and data acquisition) system controlling the distribution f electric power for a large military installation. The SCADA system contains both real-time sensor data and routine administrative information. The management at the power plant determines that: (i) for the sensor data being acquired by the SCADA system, there is no potential impact from a loss of confidentiality, a high potential impact from a loss of integrity, and a high potential impact from a loss of availability; and (ii) for the administrative information being processed by the system, there is a low potential impact from a loss of confidentiality, a low potential impact from a loss of integrity, and a low potential impact from a loss of availability. The resulting security categories, or SC, of these information types are expressed as:"}
  - {"page": 34, "locator": "4.4.1", "reason": "no-marker", "text": "SC administrative information = {(confidentiality, LOW), (integrity, LOW), (availability, LOW)}."}
  - {"page": 34, "locator": "4.4.1", "reason": "lead-in", "text": "The resulting security category of the information system is initially expressed as:"}
  - {"page": 35, "locator": "4.4.2", "reason": "short", "text": "Implementation Tip"}
  - {"page": 35, "locator": "4.4.2", "reason": "short", "text": "4.4.2.1 Aggregation"}
  - {"page": 35, "locator": "4.4.2", "reason": "no-marker", "text": "4.4.2.2 Critical System Functionality"}
  - {"page": 35, "locator": "4.4.2", "reason": "lead-in", "text": "Compromise of some information types may have low impact in the context of a system’s primary function but may have much more significance when viewed in the context of the potential impact of compromising:"}
  - {"page": 36, "locator": "4.4.2", "reason": "short", "text": "4.4.2.3 Extenuating Circumstances"}
  - {"page": 36, "locator": "4.4.2", "reason": "no-marker", "text": "4.4.2.4 Other System Factors"}
  - {"page": 39, "locator": "4.5", "reason": "no-marker", "text": "The high water mark concept is employed because there are significant dependencies among the security objectives of confidentiality, integrity, and availability. In most cases, a compromise in one security objective ultimately affects the other security objectives as well."}
