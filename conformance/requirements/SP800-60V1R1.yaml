    status: "not-a-requirement"
    reason: "Footnote 14 on Table 4: the 'recommended' types come from the BRM. Says where a catalog came from; 'recommended' describes the types and binds no one."
  - id: "REQ-SP800-60V1R1-0081"
    citation: {"ref": "SP800-60V1R1", "page": 24, "anchor": "The approach to establishing mission-based information types at an agency level begins"}
    kind: "modal"
    locator: "4.1.1"
    context: "Table 4: Mission-Based Information Types and Delivery Mechanisms14"
    statement: "The approach to establishing mission-based information types at an agency level begins by documenting the agency’s business and mission areas. The owner, or designee, of each information system is responsible for identifying the information types stored in, processed by, or generated by that information system. In the case of mission-based information, the responsible individuals, in coordination with management, operational, and security stakeholders, should compile a comprehensive set of lines of business and mission areas conducted by the agency. In addition, the responsible individuals should identify the applicable sub-functions necessary to conduct agency business and in turn accomplish the agency’s mission. For example, one mission conducted by an agency might be law enforcement. Sub-functions that are part of the agency’s law enforcement mission might include criminal investigation and surveillance, criminal apprehension, criminal incarceration, citizen protection, crime prevention, and property protection. Each of these sub-functions would represent an information type."
    status: "candidate"
    work_item: "WI-19"
  - id: "REQ-SP800-60V1R1-0082"
    citation: {"ref": "SP800-60V1R1", "page": 24, "anchor": "Recommended mission-based lines of business and constituent sub-functions that may be processed"}
    kind: "indicative"
