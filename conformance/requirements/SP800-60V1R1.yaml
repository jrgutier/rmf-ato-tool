  - {"page": 20, "locator": "4.0", "reason": "not-a-statement", "text": "Table 3 provides a step-by-step roadmap for identifying information types, establishing security impact levels for loss of confidentiality, integrity, and availability of information types, and assigning security categorization for the information types and for the information systems. Security categorization is the basis for identifying an initial baseline set of security controls for the information system.10 Each functional step in the process is explained in detail in Sections 4.1 through 4.4."}
  - {"page": 20, "locator": "4.0", "reason": "no-marker", "text": "An information system is a discrete set of information resources organized for the collection, processing, maintenance, use, sharing, dissemination, or disposition of information [Source: SP 800-53; FIPS 200; FIPS 199; 44 U.S.C., Sec. 3502; OMB Circular A-130, App. III]"}
  - {"page": 21, "locator": "4.0", "reason": "no-marker", "text": "Security perimeter is synonymous with the term accreditation boundary and includes all components of an information system to be accredited by an authorizing official and excludes separately accredited systems to which the information system is connected."}
