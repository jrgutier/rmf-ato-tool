  - id: "REQ-SP800-60V1R1-0127"
    citation: {"ref": "SP800-60V1R1", "page": 31, "anchor": "In Step 3, organizations should review and adjust the provisional security impact"}
    kind: "should"
    locator: "4.3"
    context: "Step 3: Review Provisional Impact Levels and Adjust/Finalize"
    statement: "In Step 3, organizations should review and adjust the provisional security impact levels for the security objectives of each information type and arrive at a finalized state. To accomplish this, organizations should: (i) review the appropriateness of the provisional impact levels based on the organization, environment, mission, use, and data sharing; (ii) adjust the security objective impact levels as necessary using the special factors18 guidance found in Volume II, Appendices C and D; and (iii) document all adjustments to the impact levels and provide the rationale or justification for the adjustments."
    status: "partial"
    reason: "The review factors and adjustments are recorded; adjustment through Volume II special factors is prose."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.factors.yaml", "expect": "the provisional impact levels are not reviewed against", "asserts": "Review the appropriateness of the provisional impact levels based on the organization, environment, mission, use and data sharing, the provisional impact levels reviewed", "claim": "constraint"}]
    work_item: "WI-186"
  - id: "REQ-SP800-60V1R1-0128"
    citation: {"ref": "SP800-60V1R1", "page": 31, "anchor": "When security categorization impact levels recommended in Section 4.2 or Volume II,"}
    kind: "indicative"
    locator: "4.3"
    context: "Step 3: Review Provisional Impact Levels and Adjust/Finalize"
    statement: "When security categorization impact levels recommended in Section 4.2 or Volume II, Appendices C and D are adopted as provisional security impact levels, the agency should review the appropriateness of the provisional impact levels in the context of the organization, environment, mission, use, and data sharing associated with the information system under review. This review should include the agency’s mission importance; lifecycle and timeliness implications; configuration and security policy related information; special handling requirements; etc. The FIPS 199 factors presented in Section 4.2.2 of this document should be used as the basis for decisions regarding adjustment or finalization of the provisional impact levels. The confidentiality, integrity, and availability impact levels may be adjusted one or more times in the course of the review. Once the review and adjustment process is complete, the mapping of impact levels by information type can be finalized."
    status: "partial"
    reason: "The review factors are recorded; lifecycle, timeliness and special handling are partly factors."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.factors.yaml", "expect": "the provisional impact levels are not reviewed against", "asserts": "The provisional impact levels are reviewed in the context of the organization, environment, mission, use and data sharing, the provisional impact levels reviewed", "claim": "constraint"}]
    work_item: "WI-186"
  - id: "REQ-SP800-60V1R1-0129"
    citation: {"ref": "SP800-60V1R1", "page": 31, "anchor": "The special factor guidance in NIST SP 800-60, Volume II, provides specific"}
    kind: "indicative"
    locator: "4.3"
    context: "Step 3: Review Provisional Impact Levels and Adjust/Finalize"
    statement: "The special factor guidance in NIST SP 800-60, Volume II, provides specific guidance on considerations for adjusting each security objective (confidentiality, integrity, and availability) for each information type. The special factor guidance is applied to each information type, based on how the information type is used, the organization’s mission, or the system’s operating environment."
    status: "not-a-requirement"
    reason: "Footnote 18: describes what the Volume II special factor guidance is and that it is 'applied to each information type'. The duty to use it is clause (ii) of 0127."
  - id: "REQ-SP800-60V1R1-0130"
    citation: {"ref": "SP800-60V1R1", "page": 32, "anchor": "Further, information systems process many types of information. Not all of these"}
    kind: "modal"
    locator: "4.3"
    context: "Step 3: Review Provisional Impact Levels and Adjust/Finalize"
    statement: "Further, information systems process many types of information. Not all of these information types are likely to have the same security impact levels. The compromise of some information types will jeopardize system functionality and agency mission more than the compromise of other information types. System security impact levels must be assessed in the context of system mission and function as well as on the basis of the aggregate of the component information types."
    status: "partial"
    reason: "The system is never below the aggregate of its information types; mission context is a review factor."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.below.yaml", "expect": "below the high-water mark", "asserts": "System security impact levels are assessed on the basis of the aggregate of the component information types, judged against the high-water mark", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0131"
    citation: {"ref": "SP800-60V1R1", "page": 32, "anchor": "Additionally, configuration and security policy enforcement information should be reviewed and adjusted"}
    kind: "modal"
    locator: "4.3"
    context: "Step 3: Review Provisional Impact Levels and Adjust/Finalize"
    statement: "Additionally, configuration and security policy enforcement information should be reviewed and adjusted considering the information processed on the system. Configuration and security policy information includes password files, network access rules, other hardware and software configuration settings, and documentation affecting access to the information system’s data, programs, and/or processes. At a minimum, a low confidentiality and integrity impact level will apply to this set of information and processes due to a potential for corruption, misuse, or abuse of system information and processes."
    status: "partial"
    reason: "Configuration and security policy information is system information held at the user information level, which is at least low."
    evidence: [{"kind": "rule", "target": "CATG-002", "fixture": "tests/fixtures/negative/CATG-002.sysinfo.yaml", "expect": "below the most sensitive user information", "asserts": "Configuration and security policy information is held at the level of the most sensitive user information processed", "claim": "constraint"}]
    work_item: "WI-187"
  - id: "REQ-SP800-60V1R1-0132"
    citation: {"ref": "SP800-60V1R1", "page": 32, "anchor": "A factor specific to the confidentiality objective is information subject to special"}
    kind: "modal"
    locator: "4.3"
    context: "Step 3: Review Provisional Impact Levels and Adjust/Finalize"
    statement: "A factor specific to the confidentiality objective is information subject to special handling (e.g., information subject to the Privacy Act of 1974, 5 U.S.C. § 552A). Regardless of other considerations, some minimum confidentiality impact level must be assigned to any information system that stores, processes, or generates such information. Examples of such information include information subject to the Trade Secrets Act, the Privacy Act, Department of Energy Safeguards Information, Internal Revenue Service Official Use Only Information, and Environmental Protection Agency Confidential Business Information (e.g., subject to Toxic Substances Control Act; Resource Conservation and Recovery Act; Comprehensive Environmental Response, Compensation, and Liability Act). Some of these statutory and regulatory specifications are listed in Volume II, Appendix E, “Legislative and Executive Sources Establishing Sensitivity/Criticality.”"
    status: "partial"
    reason: "Special handling is flagged per type; a minimum confidentiality is enforced for CUI only."
    evidence: [{"kind": "schema", "target": "framework/schema/infotypes.schema.json#/properties/information_types/items/properties/handling/properties/special", "claim": "presence", "asserts": "Information subject to special handling such as the Privacy Act is flagged"}]
    work_item: "WI-180"
  - id: "REQ-SP800-60V1R1-0133"
    citation: {"ref": "SP800-60V1R1", "page": 33, "anchor": "FIPS 199 recognizes that determining the security category of an information system"}
    kind: "modal"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization"
    statement: "FIPS 199 recognizes that determining the security category of an information system requires additional analysis and must consider the security categories of all information types resident on the information system. For an information system, the potential security impact levels assigned to each of the respective security objectives (confidentiality, integrity, availability) are the highest level (i.e., high water mark) for any one of these objectives that has been determined for the types of information resident on the information system."
    status: "candidate"
    work_item: "WI-13"
  - id: "REQ-SP800-60V1R1-0134"
    citation: {"ref": "SP800-60V1R1", "page": 33, "anchor": "Information systems are composed of both computer programs and information. Programs in"}
    kind: "modal"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization"
    statement: "Information systems are composed of both computer programs and information. Programs in execution within an information system (i.e., system processes) facilitate the processing, storage, and transmission of information and are necessary for the organization to conduct its essential business functions and operations. These system-processing functions also require protection and could be subject to security categorization as well. However, in the interest of simplification, it is assumed that the security categorization of all information types associated with the information system provide an appropriate worst case potential for the overall information system—thereby obviating the need to consider the system processes in the security categorization of the information system. This is in recognition of:"
    status: "not-a-requirement"
    reason: "Explains why system processes are left out of categorization: 'also require protection' is the premise of a simplifying assumption, and 'obviating the need to consider' them is its result, so it binds no one. The entry ends in a lead-in to 0135 and 0136."
  - id: "REQ-SP800-60V1R1-0135"
    citation: {"ref": "SP800-60V1R1", "page": 33, "anchor": "The fundamental requirement to protect the integrity, availability, and, for key information"}
    kind: "lettered"
    locator: "4.4.1.•"
    context: "FIPS 199 Process for System Security Categorization This is in recognition of:"
    statement: "• The fundamental requirement to protect the integrity, availability, and, for key information such as passwords and encryption keys, the confidentiality of system-level processing functions and information at the high water mark; and"
    status: "not-a-requirement"
    reason: "Item under 'This is in recognition of:', a reason for the assumption in 0134. It explains; the duty on system information is 0058 and 0131."
  - id: "REQ-SP800-60V1R1-0136"
    citation: {"ref": "SP800-60V1R1", "page": 33, "anchor": "The strong interdependence between confidentiality, integrity, and availability."}
    kind: "lettered"
    locator: "4.4.1.•"
    context: "FIPS 199 Process for System Security Categorization This is in recognition of:"
    statement: "• The strong interdependence between confidentiality, integrity, and availability."
    status: "not-a-requirement"
    reason: "Second reason under the same lead-in: the three objectives are interdependent. A statement of fact."
  - id: "REQ-SP800-60V1R1-0137"
    citation: {"ref": "SP800-60V1R1", "page": 33, "anchor": "For this reason, FIPS 199 notes that, while the value (i.e., level)"}
    kind: "modal"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization This is in recognition of:"
    statement: "For this reason, FIPS 199 notes that, while the value (i.e., level) of not applicable can apply to a security objective for specific information types processed by systems, this value cannot be assigned to any security objective for an information system. There is a minimum provisional impact (i.e., low water mark) for a compromise of confidentiality, integrity, and availability for an information system. This is necessary to protect the system-level processing functions and information critical to the operation of the information system."
    status: "candidate"
  - id: "REQ-SP800-60V1R1-0138"
    citation: {"ref": "SP800-60V1R1", "page": 33, "anchor": "SC information system = {(confidentiality, impact), (integrity, impact), (availability, impact)},"}
    kind: "indicative"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization The generalized format for expressing the security category, or SC, of an information system is:"
    statement: "SC information system = {(confidentiality, impact), (integrity, impact), (availability, impact)},"
    status: "candidate"
  - id: "REQ-SP800-60V1R1-0139"
    citation: {"ref": "SP800-60V1R1", "page": 33, "anchor": "SYSTEM EXAMPLE 1: An information system used for large acquisitions in a"}
    kind: "indicative"
    locator: "4.4.1"
    context: "FIPS 199 Process for System Security Categorization"
    statement: "SYSTEM EXAMPLE 1: An information system used for large acquisitions in a contracting organization contains both sensitive, pre-solicitation phase contract information and routine administrative information. The management within the contracting organization determines that: (i) for the sensitive contract information, the potential impact from a loss of confidentiality is moderate, the potential impact from a loss of integrity is moderate, and the potential impact from a loss of availability is low; and (ii) for the routine administrative information (non-privacy-related information), the potential impact from a loss of confidentiality is low, the potential impact from a loss of integrity is low, and the potential impact from a loss of availability is low. The resulting security categories, or SC, of these information types are expressed as:"
    status: "not-a-requirement"
    reason: "SYSTEM EXAMPLE 1, an acquisition system's information types. An illustration of the process, as the sentence before it says."
