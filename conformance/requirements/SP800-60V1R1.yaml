    statement: "In FIPS 199, the security category of an information type can be associated with both user information and system information8 and can be applicable to information in either electronic or non-electronic form. It is also used as input in considering the appropriate security category for a system. Establishing an appropriate security category for an information type simply requires determining the potential impact for each security objective associated with the particular information type. The generalized format for expressing the security category, or SC, of an information type is:"
