    statement: "Most information systems employed in both service delivery support and resource management activities engage in one or more of the eight support delivery of services lines of business. Each of the information types associated with support delivery of services sub-functions is provided in"
    status: "not-a-requirement"
    reason: "Describes service delivery support lines of business and points to Volume II C.2. The factor it mentions, the supported mission, is stated as a rule at 0086."
  - id: "REQ-SP800-60V1R1-0086"
    citation: {"ref": "SP800-60V1R1", "page": 25, "anchor": "The government resource management information business area includes the back office support"}
    kind: "indicative"
    locator: "4.1.2"
    context: "Table 5: Services Delivery Support Functions and Information Types15"
    statement: "The government resource management information business area includes the back office support activities enabling the Federal government to operate effectively. The five government resource management information lines of business and the sub-functions associated with each information type are identified in Table 6. Volume II, Appendix C.3, “Government Resource Management Information,” recommends provisional impact levels for confidentiality, integrity, and availability security objectives. Many departments and agencies operate their own support systems. Others obtain at least some support services from other organizations. Some agencies’ missions are primarily to support other government departments and agencies in the conduct of direct service missions. As indicated above, security objectives and associated security impact levels for administrative and management information and systems are determined by the nature of the supported direct services and constituencies being supported."
    status: "partial"
    reason: "Describes a business area; the information types record their SP 800-60 identifiers."
