  - id: "REQ-SP800-60V1R1-0053"
    citation: {"ref": "SP800-60V1R1", "page": 18, "anchor": "FIPS 199 defines three levels of potential impact on organizations or individuals"}
    kind: "modal"
    locator: "3.2"
    context: "Impact Assessment"
    statement: "FIPS 199 defines three levels of potential impact on organizations or individuals should there be a breach of security (i.e., a loss of confidentiality, integrity, or availability). The application of these definitions must take place within the context of each organization and the overall national interest. Table 2 provides FIPS 199 potential impact definitions."
    status: "partial"
    reason: "The national interest and organization are review factors CATG-001 requires; the definitions are FIPS 199's."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.factors.yaml", "expect": "the provisional impact levels are not reviewed against", "asserts": "The application of these definitions takes place within the context of each organization and the overall national interest, the provisional impact levels reviewed", "claim": "constraint"}]
    work_item: "WI-173"
  - id: "REQ-SP800-60V1R1-0054"
    citation: {"ref": "SP800-60V1R1", "page": 18, "anchor": "Low | The potential impact is low if—The loss of confidentiality, integrity,"}
    kind: "table"
    locator: "3.2"
    context: "Table 2: Potential Impact Levels"
    statement: "Low | The potential impact is low if—The loss of confidentiality, integrity, or availability could be expected to have a limited adverse effect on organizational operations, organizational assets, or individuals.7 A limited adverse effect means that, for example, the loss of confidentiality, integrity, or availability might: (i) cause a degradation in mission capability to an extent and duration that the organization is able to perform its primary functions, but the effectiveness of the functions is noticeably reduced; (ii) result in minor damage to organizational assets; (iii) result in minor financial loss; or (iv) result in minor harm to individuals."
    status: "not-a-requirement"
    reason: "Table 2 row, the definition of low: 'could be expected to' states the scale. Rows 0054 to 0056 are FIPS 199 definitions, decided one way; the duty to apply them is 0053 and 0093."
  - id: "REQ-SP800-60V1R1-0055"
    citation: {"ref": "SP800-60V1R1", "page": 18, "anchor": "Moderate | The potential impact is moderate if—The loss of confidentiality, integrity,"}
    kind: "table"
    locator: "3.2"
    context: "Table 2: Potential Impact Levels"
    statement: "Moderate | The potential impact is moderate if—The loss of confidentiality, integrity, or availability could be expected to have a serious adverse effect on organizational operations, organizational assets, or individuals. A serious adverse effect means that, for example, the loss of confidentiality, integrity, or availability might: (i) cause a significant degradation in mission capability to an extent and duration that the organization is able to perform its primary functions, but the effectiveness of the functions is significantly reduced; (ii) result in significant damage to organizational assets; (iii) result in significant financial loss; or (iv) result in significant harm to individuals that does not involve loss of life or serious life threatening injuries."
    status: "not-a-requirement"
    reason: "Table 2 row, the definition of moderate: 'could be expected to' states the scale at serious adverse effect, and it binds no one."
  - id: "REQ-SP800-60V1R1-0056"
    citation: {"ref": "SP800-60V1R1", "page": 18, "anchor": "High | The potential impact is high if—The loss of confidentiality, integrity,"}
    kind: "table"
    locator: "3.2"
    context: "Table 2: Potential Impact Levels"
    statement: "High | The potential impact is high if—The loss of confidentiality, integrity, or availability could be expected to have a severe or catastrophic adverse effect on organizational operations, organizational assets, or individuals. A severe or catastrophic adverse effect means that, for example, the loss of confidentiality, integrity, or availability might: (i) cause a severe degradation in or loss of mission capability to an extent and duration that the organization is not able to perform one or more of its primary functions; (ii) result in major damage to organizational assets; (iii) result in major financial loss; or (iv) result in severe or catastrophic harm to individuals involving loss of life or serious life threatening injuries."
    status: "not-a-requirement"
    reason: "Table 2 row, the definition of high: 'could be expected to' states the scale at severe or catastrophic adverse effect, and it binds no one."
  - id: "REQ-SP800-60V1R1-0057"
