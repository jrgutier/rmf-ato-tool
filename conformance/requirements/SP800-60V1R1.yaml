  - id: "REQ-SP800-60V1R1-0201"
    citation: {"ref": "SP800-60V1R1", "page": 32, "anchor": "Once the security impact levels have been selected, reviewed and adjusted as"}
    kind: "promoted"
    locator: "4.4"
    context: ""
    statement: "Once the security impact levels have been selected, reviewed and adjusted as necessary for the security objectives of each individual information type processed by an information system, it is necessary to assign a system security category based on the aggregate of information types. The Step 4 activities include the following: (i) review identified security categorizations for the aggregate of information types; (ii) determine the system security categorization by identifying the high water mark for each of the security objectives (confidentiality, integrity, availability) based on the aggregate of the information types; (iii) adjust the high water mark for each system security objective, as necessary, by applying the factors discussed in section 4.4.2; (iv) assign the overall information system impact level based on the highest impact level for the system security objectives; and (v) document all security categorization determinations and decisions."
    status: "candidate"
    work_item: "WI-13"
    promoted: {"reason": "Rejected as no-marker: the opening of section 4.4 states Step 4 and lists its five activities, including documenting all determinations and decisions."}
