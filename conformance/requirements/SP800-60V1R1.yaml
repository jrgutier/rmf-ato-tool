    context: "Figure 1: NIST Risk Management Framework The security categorization process documented in this publication provides input into the following processes:"
    statement: "• Step 6: Monitor and assess selected security controls in the information system on a continuous basis including documenting changes to the system, conducting security impact analyses of the associated changes, and reporting the security status of the system to appropriate organizational officials on a regular basis. (Reference NIST SP 800-37 and SP 800-53A)."
