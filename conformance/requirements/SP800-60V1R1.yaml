  - id: "REQ-SP800-60V1R1-0010"
    citation: {"ref": "SP800-60V1R1", "page": 7, "anchor": "This document is intended as a reference resource rather than as a"}
    kind: "modal"
    locator: ""
    context: "EXECUTIVE SUMMARY The guideline and its appendices:"
    statement: "This document is intended as a reference resource rather than as a tutorial and not all of the material will be relevant to all agencies. This document includes two volumes, a basic guideline and a volume of appendices. Users should review the guidelines provided in Volume I, then refer to only that specific material from the appendices that applies to their own systems and applications. The provisional impact assignments are provided in Volume II, Appendix C and D. The basis employed in this guideline for the identification of information types is the Office of Management and Budget’s Federal Enterprise Architecture (FEA) Program Management Office (PMO) October 2007 publication, The Consolidated Reference Model Document Version 2.3."
    status: "not-a-requirement"
    reason: "How to read the two volumes. 'will be relevant' and 'should review' are reading advice to a user of the document, and they bind no one to any act in a process."
  - id: "REQ-SP800-60V1R1-0011"
    citation: {"ref": "SP800-60V1R1", "page": 9, "anchor": "The identification of information processed on an information system is essential to"}
    kind: "should"
    locator: "1.0"
    context: "INTRODUCTION"
    statement: "The identification of information processed on an information system is essential to the proper selection of security controls and ensuring the confidentiality, integrity, and availability of the system and its information. The National Institute of Standards and Technology (NIST) Special Publication (SP) 800-60 has been developed to assist Federal government agencies to categorize information and information systems."
    status: "not-a-requirement"
    reason: "Opening of the introduction: identifying information 'is essential' to selecting controls states why the topic matters, and the duty is 0070."
  - id: "REQ-SP800-60V1R1-0012"
    citation: {"ref": "SP800-60V1R1", "page": 9, "anchor": "NIST SP 800-60 addresses the FISMA direction to develop guidelines recommending the"}
    kind: "indicative"
    locator: "1.1"
    context: "Purpose and Applicability"
    statement: "NIST SP 800-60 addresses the FISMA direction to develop guidelines recommending the types of information and information systems to be included in each category of potential security impact. This guideline is intended to help agencies consistently map security impact levels to types of: (i) information (e.g., privacy, medical, proprietary, financial, contractor sensitive, trade secret, investigation); and (ii) information systems (e.g., mission critical, mission support, administrative). This guideline applies to all Federal information systems other than national security systems. National security systems store, process, or communicate national security information.2"
    status: "not-a-requirement"
    reason: "Purpose and applicability: says what the guideline is for and that it leaves out national security systems. A scope statement with no duty; the scope limit is a source conflict in the report."
  - id: "REQ-SP800-60V1R1-0013"
    citation: {"ref": "SP800-60V1R1", "page": 9, "anchor": "This publication is intended to serve a diverse federal audience of information"}
    kind: "modal"
    locator: "1.2"
    context: "Target Audience"
    statement: "This publication is intended to serve a diverse federal audience of information system and information security professionals including: (i) individuals with information system and information security management and oversight responsibilities (e.g., chief information officers, senior agency information security officers, authorizing officials); (ii) organizational officials having a vested interest in the accomplishment of organizational missions (e.g., mission and business area owners, information owners); (iii) individuals with information system development responsibilities (e.g., program and project managers, information system developers); and (iv) individuals with information security implementation and operational responsibilities (e.g., information system owners, information owners, information system security officers)."
    status: "not-a-requirement"
    reason: "Target audience: names who may read the publication. 'responsibilities' describes those readers' jobs, and it binds no one."
