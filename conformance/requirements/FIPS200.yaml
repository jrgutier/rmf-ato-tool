  - id: "REQ-FIPS200-0015"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "Since the potential impact values for confidentiality, integrity, and availability may not"}
    kind: "modal"
    locator: "2 INFORMATION SYSTEM IMPACT LEVELS"
    context: ""
    statement: "Since the potential impact values for confidentiality, integrity, and availability may not always be the same for a particular information system, the high water mark concept must be used to determine the overall impact level of the information system. Thus, a low-impact system is an information system in which all three of the security objectives are low. A moderate-impact system is an information system in which at least one of the security objectives is moderate and no security objective is greater than moderate. And finally, a high-impact system is an information system in which at least one security objective is high. The determination of information system impact levels must be accomplished prior to the consideration of minimum security requirements and the selection of appropriate security controls for those information systems."
    status: "partial"
    reason: "The second sentence is held: FACTS-001 fails a categorization not approved before S-1 selects the baseline, and rmf baseline resolve refuses one. The first sentence, one overall impact level by the high-water mark, conflicts with CNSSI 1253 Section 1.2, which does not adopt the high-water mark for NSS and under which DoDI 8510.01 categorizes every DoD system; the tool takes it only under the degraded fallback (baseline.py high-water-mark). Listed as a source conflict for the user."
    evidence: [{"kind": "rule", "target": "FACTS-001", "fixture": "tests/fixtures/negative/FACTS-001.approved.yaml", "expect": "categorization is not approved (categorization.approved.value must be true before S-1)", "claim": "constraint", "asserts": "The determination of system impact levels is accomplished prior to the selection of security controls: a categorization not approved before S-1 fails", "sentence": "The determination of information system impact levels must be accomplished prior to the consideration of minimum security requirements and the selection of appropriate security controls for those information systems."}]
