requirements:
  - id: "REQ-FIPS200-0001"
    citation: {"ref": "FIPS200", "page": 2, "anchor": "The Federal Information Processing Standards (FIPS) Publication Series of the National Institute"}
    kind: "should"
    locator: ""
    context: "FOREWORD"
    statement: "The Federal Information Processing Standards (FIPS) Publication Series of the National Institute of Standards and Technology (NIST) is the official series of publications relating to standards and guidelines adopted and promulgated under the provisions of the Federal Information Security Management Act (FISMA) of 2002. Comments concerning FIPS publications are welcomed and should be addressed to the Director, Information Technology Laboratory, National Institute of Standards and Technology, 100 Bureau Drive, Stop 8900, Gaithersburg, MD 20899-8900."
    status: "candidate"
  - id: "REQ-FIPS200-0002"
    citation: {"ref": "FIPS200", "page": 3, "anchor": "Federal Information Processing Standards Publications (FIPS PUBS) are issued by the National Institute of Standards and Technology after approval by"}
    kind: "indicative"
    locator: ""
    context: "AUTHORITY"
    statement: "Federal Information Processing Standards Publications (FIPS PUBS) are issued by the National Institute of Standards and Technology after approval by the Secretary of Commerce pursuant to Section 5131 of the Information Technology Management Reform Act of 1996 (Public Law 104-106) and the Federal Information Security Management Act of 2002 (Public Law 107-347)."
    status: "candidate"
  - id: "REQ-FIPS200-0003"
    citation: {"ref": "FIPS200", "page": 4, "anchor": "Federal Information Processing Standards Publications (FIPS PUBS) are issued by the National Institute of Standards and Technology (NIST) after approval"}
    kind: "indicative"
    locator: ""
    context: "AUTHORITY"
    statement: "Federal Information Processing Standards Publications (FIPS PUBS) are issued by the National Institute of Standards and Technology (NIST) after approval by the Secretary of Commerce pursuant to the Federal Information Security Management Act (FISMA) of 2002."
    status: "candidate"
  - id: "REQ-FIPS200-0004"
    citation: {"ref": "FIPS200", "page": 4, "anchor": "This standard is applicable to: (i) all information within the federal government"}
    kind: "modal"
    locator: "6"
    context: "AUTHORITY"
    statement: "This standard is applicable to: (i) all information within the federal government other than that information that has been determined pursuant to Executive Order 12958, as amended by Executive Order 13292, or any predecessor order, or by the Atomic Energy Act of 1954, as amended, to require protection against unauthorized disclosure and is marked to indicate its classified status; and (ii) all federal information systems other than those information systems designated as national security systems as defined in 44 United States Code Section 3542(b)(2). The standard has been broadly developed from a technical perspective to complement similar standards for national security systems. In addition to the agencies of the federal government, state, local, and tribal governments, and private sector organizations that compose the critical infrastructure of the United States are encouraged to consider the use of this standard, as appropriate."
    status: "candidate"
  - id: "REQ-FIPS200-0005"
    citation: {"ref": "FIPS200", "page": 5, "anchor": "This standard specifies minimum security requirements for federal information and information systems"}
    kind: "modal"
    locator: "8"
    context: "AUTHORITY"
    statement: "This standard specifies minimum security requirements for federal information and information systems in seventeen security-related areas. Federal agencies must meet the minimum security requirements as defined herein through the use of the security controls in accordance with NIST Special Publication 800-53, Recommended Security Controls for Federal Information Systems, as amended."
    status: "candidate"
  - id: "REQ-FIPS200-0006"
    citation: {"ref": "FIPS200", "page": 5, "anchor": "This standard is effective immediately. Federal agencies must be in compliance with"}
    kind: "modal"
    locator: "9"
    context: "AUTHORITY"
    statement: "This standard is effective immediately. Federal agencies must be in compliance with this standard not later than one year from its effective date."
    status: "candidate"
  - id: "REQ-FIPS200-0007"
    citation: {"ref": "FIPS200", "page": 5, "anchor": "The application of the security controls defined in NIST Special Publication 800-53"}
    kind: "modal"
    locator: "10"
    context: "AUTHORITY"
    statement: "The application of the security controls defined in NIST Special Publication 800-53 required by this standard represents the current state-of-the-practice safeguards and countermeasures for information systems. The security controls will be reviewed by NIST at least annually and, if necessary, revised and extended to reflect: (i) the experience gained from using the controls; (ii) the changing security requirements within federal agencies; and (iii) the new security technologies that may be available. The minimum security controls defined in the low, moderate, and high security control baselines are also expected to change over time as well, as the level of security and due diligence for mitigating risks within federal agencies increases. The proposed additions, deletions, or modifications to the catalog of security controls and the proposed changes to the security control baselines in NIST Special Publication 800-53 will go through a rigorous, public review process to obtain government and private sector feedback and to build consensus for the changes. Federal agencies will have up to one year from the date of final publication to fully comply with the changes but are encouraged to initiate compliance activities immediately."
    status: "candidate"
  - id: "REQ-FIPS200-0008"
    citation: {"ref": "FIPS200", "page": 5, "anchor": "No provision is provided under FISMA for waivers to FIPS made mandatory"}
    kind: "indicative"
    locator: "11"
    context: "AUTHORITY"
    statement: "No provision is provided under FISMA for waivers to FIPS made mandatory by the Secretary of Commerce."
    status: "candidate"
  - id: "REQ-FIPS200-0009"
    citation: {"ref": "FIPS200", "page": 7, "anchor": "Standards for categorizing information and information systems1 collected or maintained by or"}
    kind: "lettered"
    locator: "1 PURPOSE.•"
    context: "Title III of the E-Government Act, entitled the Federal Information Security Management Act (FISMA) of 2002, tasked NIST with the responsibility of developing security standards and guidelines for the"
    statement: "• Standards for categorizing information and information systems1 collected or maintained by or on behalf of each federal agency based on the objectives of providing appropriate levels of information security according to a range of risk levels;"
    status: "candidate"
  - id: "REQ-FIPS200-0010"
    citation: {"ref": "FIPS200", "page": 7, "anchor": "Guidelines recommending the types of information and information systems to be included"}
    kind: "lettered"
    locator: "1 PURPOSE.•"
    context: "Title III of the E-Government Act, entitled the Federal Information Security Management Act (FISMA) of 2002, tasked NIST with the responsibility of developing security standards and guidelines for the"
    statement: "• Guidelines recommending the types of information and information systems to be included in each category; and"
    status: "candidate"
  - id: "REQ-FIPS200-0011"
    citation: {"ref": "FIPS200", "page": 7, "anchor": "Minimum information security requirements for information and information systems in each such"}
    kind: "lettered"
    locator: "1 PURPOSE.•"
    context: "Title III of the E-Government Act, entitled the Federal Information Security Management Act (FISMA) of 2002, tasked NIST with the responsibility of developing security standards and guidelines for the"
    statement: "• Minimum information security requirements for information and information systems in each such category."
    status: "candidate"
  - id: "REQ-FIPS200-0012"
    citation: {"ref": "FIPS200", "page": 7, "anchor": "FIPS Publication 199, Standards for Security Categorization of Federal Information and Information"}
    kind: "modal"
    locator: "1 PURPOSE"
    context: "Title III of the E-Government Act, entitled the Federal Information Security Management Act (FISMA) of 2002, tasked NIST with the responsibility of developing security standards and guidelines for the"
    statement: "FIPS Publication 199, Standards for Security Categorization of Federal Information and Information Systems, approved by the Secretary of Commerce in February 2004, is the first of two mandatory security standards required by the FISMA legislation.2 FIPS Publication 200, the second of the mandatory security standards, specifies minimum security requirements for information and information systems supporting the executive agencies of the federal government and a risk-based process for selecting the security controls necessary to satisfy the minimum security requirements. This standard will promote the development, implementation, and operation of more secure information systems within the federal government by establishing minimum levels of due diligence for information security and facilitating a more consistent, comparable, and repeatable approach for selecting and specifying security controls for information systems that meet minimum security requirements."
    status: "candidate"
  - id: "REQ-FIPS200-0013"
    citation: {"ref": "FIPS200", "page": 7, "anchor": "FIPS Publication 199 requires agencies to categorize their information systems as low-impact,"}
    kind: "modal"
    locator: "2 INFORMATION SYSTEM IMPACT LEVELS"
    context: ""
    statement: "FIPS Publication 199 requires agencies to categorize their information systems as low-impact, moderate-impact, or high-impact for the security objectives of confidentiality, integrity, and availability. The potential impact values assigned to the respective security objectives are the highest values (i.e., high water mark3) from among the security categories that have been determined for each type of information resident on those information systems.4 The generalized format for expressing the security category (SC) of an information system is:"
    status: "candidate"
  - id: "REQ-FIPS200-0014"
    citation: {"ref": "FIPS200", "page": 7, "anchor": "SC information system = {(confidentiality, impact), (integrity, impact), (availability, impact)}, where the"}
    kind: "indicative"
    locator: "2 INFORMATION SYSTEM IMPACT LEVELS"
    context: "The generalized format for expressing the security category (SC) of an information system is:"
    statement: "SC information system = {(confidentiality, impact), (integrity, impact), (availability, impact)}, where the acceptable values for potential impact are low, moderate, or high."
    status: "candidate"
  - id: "REQ-FIPS200-0015"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "Since the potential impact values for confidentiality, integrity, and availability may not"}
    kind: "modal"
    locator: "2 INFORMATION SYSTEM IMPACT LEVELS"
    context: ""
    statement: "Since the potential impact values for confidentiality, integrity, and availability may not always be the same for a particular information system, the high water mark concept must be used to determine the overall impact level of the information system. Thus, a low-impact system is an information system in which all three of the security objectives are low. A moderate-impact system is an information system in which at least one of the security objectives is moderate and no security objective is greater than moderate. And finally, a high-impact system is an information system in which at least one security objective is high. The determination of information system impact levels must be accomplished prior to the consideration of minimum security requirements and the selection of appropriate security controls for those information systems."
    status: "candidate"
  - id: "REQ-FIPS200-0016"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "The minimum security requirements cover seventeen security-related areas with regard to protecting"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "The minimum security requirements cover seventeen security-related areas with regard to protecting the confidentiality, integrity, and availability of federal information systems and the information processed, stored, and transmitted by those systems. The security-related areas include: (i) access control; (ii) awareness and training; (iii) audit and accountability; (iv) certification, accreditation, and security assessments; (v) configuration management; (vi) contingency planning; (vii) identification and authentication; (viii) incident response; (ix) maintenance; (x) media protection; (xi) physical and environmental protection; (xii) planning; (xiii) personnel security; (xiv) risk assessment; (xv) systems and services acquisition; (xvi) system and communications protection; and (xvii) system and information integrity. The seventeen areas represent a broad-based, balanced information security program that addresses the management, operational, and technical aspects of protecting federal information and information systems."
    status: "candidate"
  - id: "REQ-FIPS200-0017"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "Policies and procedures play an important role in the effective implementation of"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Policies and procedures play an important role in the effective implementation of enterprise-wide information security programs within the federal government and the success of the resulting security measures employed to protect federal information and information systems. Thus, organizations must develop and promulgate formal, documented policies and procedures governing the minimum security requirements set forth in this standard and must ensure their effective implementation."
    status: "candidate"
  - id: "REQ-FIPS200-0018"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "Access Control (AC): Organizations must limit information system access to authorized users,"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Access Control (AC): Organizations must limit information system access to authorized users, processes acting on behalf of authorized users, or devices (including other information systems) and to the types of transactions and functions that authorized users are permitted to exercise."
    status: "candidate"
  - id: "REQ-FIPS200-0019"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "Awareness and Training (AT): Organizations must: (i) ensure that managers and users"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Awareness and Training (AT): Organizations must: (i) ensure that managers and users of organizational information systems are made aware of the security risks associated with their activities and of the applicable laws, Executive Orders, directives, policies, standards, instructions, regulations, or procedures related to the security of organizational information systems; and (ii) ensure that organizational personnel are adequately trained to carry out their assigned information security-related duties and responsibilities."
    status: "candidate"
  - id: "REQ-FIPS200-0020"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "Audit and Accountability (AU): Organizations must: (i) create, protect, and retain information"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Audit and Accountability (AU): Organizations must: (i) create, protect, and retain information system audit records to the extent needed to enable the monitoring, analysis, investigation, and reporting of unlawful, unauthorized, or inappropriate information system activity; and (ii) ensure that the actions of individual information system users can be uniquely traced to those users so they can be held accountable for their actions."
    status: "candidate"
  - id: "REQ-FIPS200-0021"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "Certification, Accreditation, and Security Assessments (CA): Organizations must: (i) periodically assess the"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Certification, Accreditation, and Security Assessments (CA): Organizations must: (i) periodically assess the security controls in organizational information systems to determine if the controls are effective in their application; (ii) develop and implement plans of action designed to correct deficiencies and reduce or eliminate vulnerabilities in organizational information systems; (iii) authorize the operation of organizational information systems and any associated information system connections; and (iv) monitor information system security controls on an ongoing basis to ensure the continued effectiveness of the controls."
    status: "candidate"
  - id: "REQ-FIPS200-0022"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Configuration Management (CM): Organizations must: (i) establish and maintain baseline configurations and"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Configuration Management (CM): Organizations must: (i) establish and maintain baseline configurations and inventories of organizational information systems (including hardware, software, firmware, and documentation) throughout the respective system development life cycles; and (ii) establish and enforce security configuration settings for information technology products employed in organizational information systems."
    status: "candidate"
  - id: "REQ-FIPS200-0023"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Contingency Planning (CP): Organizations must establish, maintain, and effectively implement plans for"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Contingency Planning (CP): Organizations must establish, maintain, and effectively implement plans for emergency response, backup operations, and post-disaster recovery for organizational information systems to ensure the availability of critical information resources and continuity of operations in emergency situations."
    status: "candidate"
  - id: "REQ-FIPS200-0024"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Identification and Authentication (IA): Organizations must identify information system users, processes acting"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Identification and Authentication (IA): Organizations must identify information system users, processes acting on behalf of users, or devices and authenticate (or verify) the identities of those users, processes, or devices, as a prerequisite to allowing access to organizational information systems."
    status: "candidate"
  - id: "REQ-FIPS200-0025"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Incident Response (IR): Organizations must: (i) establish an operational incident handling capability"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Incident Response (IR): Organizations must: (i) establish an operational incident handling capability for organizational information systems that includes adequate preparation, detection, analysis, containment, recovery, and user response activities; and (ii) track, document, and report incidents to appropriate organizational officials and/or authorities."
    status: "candidate"
  - id: "REQ-FIPS200-0026"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Maintenance (MA): Organizations must: (i) perform periodic and timely maintenance on organizational"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Maintenance (MA): Organizations must: (i) perform periodic and timely maintenance on organizational information systems; and (ii) provide effective controls on the tools, techniques, mechanisms, and personnel used to conduct information system maintenance."
    status: "candidate"
  - id: "REQ-FIPS200-0027"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Media Protection (MP): Organizations must: (i) protect information system media, both paper"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Media Protection (MP): Organizations must: (i) protect information system media, both paper and digital; (ii) limit access to information on information system media to authorized users; and (iii) sanitize or destroy information system media before disposal or release for reuse."
    status: "candidate"
  - id: "REQ-FIPS200-0028"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Physical and Environmental Protection (PE): Organizations must: (i) limit physical access to"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Physical and Environmental Protection (PE): Organizations must: (i) limit physical access to information systems, equipment, and the respective operating environments to authorized individuals; (ii) protect the physical plant and support infrastructure for information systems; (iii) provide supporting utilities for information systems; (iv) protect information systems against environmental hazards; and (v) provide appropriate environmental controls in facilities containing information systems."
    status: "candidate"
  - id: "REQ-FIPS200-0029"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Planning (PL): Organizations must develop, document, periodically update, and implement security plans"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Planning (PL): Organizations must develop, document, periodically update, and implement security plans for organizational information systems that describe the security controls in place or planned for the information systems and the rules of behavior for individuals accessing the information systems."
    status: "candidate"
  - id: "REQ-FIPS200-0030"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Personnel Security (PS): Organizations must: (i) ensure that individuals occupying positions of"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Personnel Security (PS): Organizations must: (i) ensure that individuals occupying positions of responsibility within organizations (including third-party service providers) are trustworthy and meet established security criteria for those positions; (ii) ensure that organizational information and information systems are protected during and after personnel actions such as terminations and transfers; and (iii) employ formal sanctions for personnel failing to comply with organizational security policies and procedures."
    status: "candidate"
  - id: "REQ-FIPS200-0031"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "Risk Assessment (RA): Organizations must periodically assess the risk to organizational operations"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "Risk Assessment (RA): Organizations must periodically assess the risk to organizational operations (including mission, functions, image, or reputation), organizational assets, and individuals, resulting from the operation of organizational information systems and the associated processing, storage, or transmission of organizational information."
    status: "candidate"
  - id: "REQ-FIPS200-0032"
    citation: {"ref": "FIPS200", "page": 9, "anchor": "System and Services Acquisition (SA): Organizations must: (i) allocate sufficient resources to"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "System and Services Acquisition (SA): Organizations must: (i) allocate sufficient resources to adequately protect organizational information systems; (ii) employ system development life cycle processes that incorporate information security considerations; (iii) employ software usage and installation restrictions; and (iv) ensure that third-party providers employ adequate security measures to protect information, applications, and/or services outsourced from the organization."
    status: "candidate"
  - id: "REQ-FIPS200-0033"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "System and Communications Protection (SC): Organizations must: (i) monitor, control, and protect"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "System and Communications Protection (SC): Organizations must: (i) monitor, control, and protect organizational communications (i.e., information transmitted or received by organizational information systems) at the external boundaries and key internal boundaries of the information systems; and (ii) employ architectural designs, software development techniques, and systems engineering principles that promote effective information security within organizational information systems."
    status: "candidate"
  - id: "REQ-FIPS200-0034"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "System and Information Integrity (SI): Organizations must: (i) identify, report, and correct"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "System and Information Integrity (SI): Organizations must: (i) identify, report, and correct information and information system flaws in a timely manner; (ii) provide protection from malicious code at appropriate locations within organizational information systems; and (iii) monitor information system security alerts and advisories and take appropriate actions in response."
    status: "candidate"
  - id: "REQ-FIPS200-0035"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "Organizations must meet the minimum security requirements in this standard by selecting"}
    kind: "modal"
    locator: "4 SECURITY CONTROL SELECTION"
    context: ""
    statement: "Organizations must meet the minimum security requirements in this standard by selecting the appropriate security controls and assurance requirements as described in NIST Special Publication 800-53, Recommended Security Controls for Federal Information Systems.5 The process of selecting the appropriate security controls and assurance requirements for organizational information systems to achieve adequate security6 is a multifaceted, risk-based activity involving management and operational personnel within the organization. Security categorization of federal information and information systems, as required by FIPS Publication 199, is the first step in the risk management process.7 Subsequent to the security categorization process, organizations must select an appropriate set of security controls for their information systems that satisfy the minimum security requirements set forth in this standard. The selected set of security controls must include one of three, appropriately tailored8 security control baselines from NIST Special Publication 800-53 that are associated with the designated impact levels of the organizational information systems as determined during the security categorization process."
    status: "candidate"
  - id: "REQ-FIPS200-0036"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "For low-impact information systems, organizations must, as a minimum, employ appropriately tailored"}
    kind: "lettered"
    locator: "4 SECURITY CONTROL SELECTION.-"
    context: ""
    statement: "- For low-impact information systems, organizations must, as a minimum, employ appropriately tailored security controls from the low baseline of security controls defined in NIST Special Publication 800-53 and must ensure that the minimum assurance requirements associated with the low baseline are satisfied."
    status: "candidate"
  - id: "REQ-FIPS200-0037"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "For moderate-impact information systems, organizations must, as a minimum, employ appropriately tailored"}
    kind: "lettered"
    locator: "4 SECURITY CONTROL SELECTION.-"
    context: ""
    statement: "- For moderate-impact information systems, organizations must, as a minimum, employ appropriately tailored security controls from the moderate baseline of security controls defined in NIST Special Publication 800-53 and must ensure that the minimum assurance requirements associated with the moderate baseline are satisfied."
    status: "candidate"
  - id: "REQ-FIPS200-0038"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "For high-impact information systems, organizations must, as a minimum, employ appropriately tailored"}
    kind: "lettered"
    locator: "4 SECURITY CONTROL SELECTION.-"
    context: ""
    statement: "- For high-impact information systems, organizations must, as a minimum, employ appropriately tailored security controls from the high baseline of security controls defined in NIST Special Publication 800-53 and must ensure that the minimum assurance requirements associated with the high baseline are satisfied."
    status: "candidate"
  - id: "REQ-FIPS200-0039"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "Organizations must employ all security controls in the respective security control baselines"}
    kind: "modal"
    locator: "4 SECURITY CONTROL SELECTION"
    context: ""
    statement: "Organizations must employ all security controls in the respective security control baselines unless specific exceptions are allowed based on the tailoring guidance provided in NIST Special Publication 800-53."
    status: "candidate"
  - id: "REQ-FIPS200-0040"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "Organizations must use the most current version of NIST Special Publication 800-53,"}
    kind: "modal"
    locator: "4 SECURITY CONTROL SELECTION"
    context: ""
    statement: "Organizations must use the most current version of NIST Special Publication 800-53, as amended, for the security control selection process."
    status: "candidate"
  - id: "REQ-FIPS200-0041"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "Security categorization must be accomplished as an enterprise-wide activity with the involvement"}
    kind: "modal"
    locator: "4 SECURITY CONTROL SELECTION"
    context: ""
    statement: "Security categorization must be accomplished as an enterprise-wide activity with the involvement of senior-level organizational officials including, but not limited to, chief information officers, senior agency information security officers, authorizing officials (a.k.a. accreditation authorities), information system owners, and information owners."
    status: "candidate"
  - id: "REQ-FIPS200-0042"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "Tailoring guidance for security control baselines is provided in NIST Special Publication"}
    kind: "indicative"
    locator: "4 SECURITY CONTROL SELECTION"
    context: ""
    statement: "Tailoring guidance for security control baselines is provided in NIST Special Publication 800-53."
    status: "candidate"
  - id: "REQ-FIPS200-0043"
    citation: {"ref": "FIPS200", "page": 11, "anchor": "To ensure a cost-effective, risk-based approach to achieving adequate security across the"}
    kind: "modal"
    locator: "4 SECURITY CONTROL SELECTION"
    context: ""
    statement: "To ensure a cost-effective, risk-based approach to achieving adequate security across the organization, security control baseline tailoring activities must be coordinated with and approved by appropriate organizational officials (e.g., chief information officers, senior agency information security officers, authorizing officials, or authorizing officials designated representatives). The resulting set of security controls must be documented in the security plan for the information system."
    status: "candidate"
  - id: "REQ-FIPS200-0044"
    citation: {"ref": "FIPS200", "page": 7, "anchor": "The E-Government Act of 2002 (Public Law 107-347), passed by the one"}
    kind: "modal"
    locator: "1 PURPOSE"
    context: ""
    statement: "The E-Government Act of 2002 (Public Law 107-347), passed by the one hundred and seventh Congress and signed into law by the President in December 2002, recognized the importance of information security to the economic and national security interests of the United States. Title III of the E-Government Act, entitled the Federal Information Security Management Act (FISMA) of 2002, tasked NIST with the responsibility of developing security standards and guidelines for the federal government including the development of:"
    status: "candidate"
