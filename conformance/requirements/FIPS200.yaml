  - {"page": 7, "locator": "2 INFORMATION SYSTEM IMPACT LEVELS", "reason": "no-marker", "text": "An information system is a discrete set of information resources organized for the collection, processing, maintenance, use, sharing, dissemination, or disposition of information. Information resources include information and related resources, such as personnel, equipment, funds, and information technology."}
  - {"page": 7, "locator": "2 INFORMATION SYSTEM IMPACT LEVELS", "reason": "no-marker", "text": "NIST security standards and guidelines referenced in this publication are available at http://csrc.nist.gov."}
  - {"page": 7, "locator": "2 INFORMATION SYSTEM IMPACT LEVELS", "reason": "no-marker", "text": "The high water mark concept is employed because there are significant dependencies among the security objectives of confidentiality, integrity, and availability. In most cases, a compromise in one security objective ultimately affects the other security objectives as well."}
  - {"page": 7, "locator": "2 INFORMATION SYSTEM IMPACT LEVELS", "reason": "no-marker", "text": "NIST Special Publication 800-60, Guide for Mapping Types of Information and Information Systems to Security Categories, provides implementation guidance on the assignment of security categories to information and information systems."}
  - {"page": 8, "locator": "3 MINIMUM SECURITY REQUIREMENTS", "reason": "no-marker", "text": "Specifications for Minimum Security Requirements"}
  - {"page": 10, "locator": "4 SECURITY CONTROL SELECTION", "reason": "no-marker", "text": "The Office of Management and Budget (OMB) Circular A-130, Appendix III, defines adequate security as security commensurate with the risk and the magnitude of harm resulting from the loss, misuse, or unauthorized access to or modification of information."}
