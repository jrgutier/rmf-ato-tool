  - id: "REQ-FIPS200-0035"
    citation: {"ref": "FIPS200", "page": 10, "anchor": "Organizations must meet the minimum security requirements in this standard by selecting"}
    kind: "modal"
    locator: "4 SECURITY CONTROL SELECTION"
    context: ""
    statement: "Organizations must meet the minimum security requirements in this standard by selecting the appropriate security controls and assurance requirements as described in NIST Special Publication 800-53, Recommended Security Controls for Federal Information Systems.5 The process of selecting the appropriate security controls and assurance requirements for organizational information systems to achieve adequate security6 is a multifaceted, risk-based activity involving management and operational personnel within the organization. Security categorization of federal information and information systems, as required by FIPS Publication 199, is the first step in the risk management process.7 Subsequent to the security categorization process, organizations must select an appropriate set of security controls for their information systems that satisfy the minimum security requirements set forth in this standard. The selected set of security controls must include one of three, appropriately tailored8 security control baselines from NIST Special Publication 800-53 that are associated with the designated impact levels of the organizational information systems as determined during the security categorization process."
    status: "partial"
    reason: "Two of three sentences are held. Selection: BSEL-001 fails a selected baseline that differs from the one resolved from the approved categorization, and SSE-003 fails an assurance-related baseline control whose assurance requirements are unsatisfied once in place. The third sentence is a source conflict (triage): a default run selects the per-objective union of CNSSI 1253 Appendix D, not one of the three SP 800-53 baselines; only the degraded fallback takes one literally (baseline_id SP800-53B-<level>). The user rules on that reading."
    evidence: [{"kind": "rule", "target": "SSE-003", "fixture": "tests/fixtures/negative/SSE-003.satisfied.yaml", "expect": "is in place, and the minimum assurance requirements it carries for the baseline are not satisfied", "claim": "constraint", "asserts": "Organizations meet the minimum security requirements by selecting assurance requirements as described in SP 800-53: an assurance-related control in place whose minimum assurance requirements are not satisfied fails", "holds_when": "S-4 is in the run's scope", "sentence": "Organizations must meet the minimum security requirements in this standard by selecting the appropriate security controls and assurance requirements as described in NIST Special Publication 800-53, Recommended Security Controls for Federal Information Systems.5"}, {"kind": "rule", "target": "BSEL-001", "fixture": "tests/fixtures/negative/BSEL-001.categorization.yaml", "expect": "the baseline is selected for impact values", "claim": "constraint", "asserts": "Subsequent to the security categorization, organizations select the set of security controls: a selected baseline that differs from a fresh baseline resolve of the categorization fails", "sentence": "Subsequent to the security categorization process, organizations must select an appropriate set of security controls for their information systems that satisfy the minimum security requirements set forth in this standard."}]
    work_item: "WI-95"
