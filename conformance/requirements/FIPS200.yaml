  - id: "REQ-FIPS200-0004"
    citation: {"ref": "FIPS200", "page": 4, "anchor": "This standard is applicable to: (i) all information within the federal government"}
    kind: "modal"
    locator: "6"
    context: "AUTHORITY"
    statement: "This standard is applicable to: (i) all information within the federal government other than that information that has been determined pursuant to Executive Order 12958, as amended by Executive Order 13292, or any predecessor order, or by the Atomic Energy Act of 1954, as amended, to require protection against unauthorized disclosure and is marked to indicate its classified status; and (ii) all federal information systems other than those information systems designated as national security systems as defined in 44 United States Code Section 3542(b)(2). The standard has been broadly developed from a technical perspective to complement similar standards for national security systems. In addition to the agencies of the federal government, state, local, and tribal governments, and private sector organizations that compose the critical infrastructure of the United States are encouraged to consider the use of this standard, as appropriate."
    status: "not-a-requirement"
    reason: "Item 6, Applicability: 'This standard is applicable to' all federal information and systems except classified information and national security systems. It says who the standard reaches and names no act. 'to require protection' describes the excluded classified information, and 'encouraged' invites state, local, tribal and private bodies to consider the standard; neither binds anyone."
