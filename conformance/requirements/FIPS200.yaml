  - id: "REQ-FIPS200-0016"
    citation: {"ref": "FIPS200", "page": 8, "anchor": "The minimum security requirements cover seventeen security-related areas with regard to protecting"}
    kind: "modal"
    locator: "3 MINIMUM SECURITY REQUIREMENTS"
    context: ""
    statement: "The minimum security requirements cover seventeen security-related areas with regard to protecting the confidentiality, integrity, and availability of federal information systems and the information processed, stored, and transmitted by those systems. The security-related areas include: (i) access control; (ii) awareness and training; (iii) audit and accountability; (iv) certification, accreditation, and security assessments; (v) configuration management; (vi) contingency planning; (vii) identification and authentication; (viii) incident response; (ix) maintenance; (x) media protection; (xi) physical and environmental protection; (xii) planning; (xiii) personnel security; (xiv) risk assessment; (xv) systems and services acquisition; (xvi) system and communications protection; and (xvii) system and information integrity. The seventeen areas represent a broad-based, balanced information security program that addresses the management, operational, and technical aspects of protecting federal information and information systems."
    status: "not-a-requirement"
    reason: "Describes coverage: 'The minimum security requirements cover seventeen security-related areas' and lists their names, among them 'audit and accountability', an area title in which 'accountability' binds no one. The duty of each area is its own entry, 0018 to 0034."
