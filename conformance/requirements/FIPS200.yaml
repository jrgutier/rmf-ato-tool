  - {"page": 4, "locator": "", "reason": "no-marker", "text": "Federal Information Processing Standards 200"}
  - {"page": 4, "locator": "", "reason": "short", "text": "March 9, 2006"}
  - {"page": 4, "locator": "", "reason": "no-marker", "text": "Announcing the Standard for Minimum Security Requirements for Federal Information and Information Systems"}
  - {"page": 4, "locator": "1", "reason": "label-only", "text": "1. Name of Standard."}
  - {"page": 4, "locator": "1", "reason": "no-marker", "text": "FIPS Publication 200: Minimum Security Requirements for Federal Information and Information Systems."}
  - {"page": 4, "locator": "2", "reason": "label-only", "text": "2. Category of Standard."}
  - {"page": 4, "locator": "2", "reason": "short", "text": "Information Security."}
  - {"page": 4, "locator": "3", "reason": "label-only", "text": "3. Explanation."}
  - {"page": 4, "locator": "3", "reason": "no-marker", "text": "The E-Government Act (P.L. 107-347), passed by the one hundred and seventh Congress and signed into law by the President in December 2002, recognized the importance of information security to the economic and national security interests of the United States. Title III of the E-Government Act, entitled the Federal Information Security Management Act (FISMA), emphasizes the need for each federal agency to develop, document, and implement an enterprise-wide program to provide information security for the information and information systems that support the operations and assets of the agency including those provided or managed by another agency, contractor, or other source. FISMA directed the promulgation of federal standards for: (i) the security categorization of federal information and information systems based on the objectives of providing appropriate levels of information security according to a range of risk levels; and (ii) minimum security requirements for information and information systems in each such category. This standard addresses the specification of minimum security requirements for federal information and information systems."}
  - {"page": 4, "locator": "4", "reason": "label-only", "text": "4. Approving Authority."}
  - {"page": 4, "locator": "4", "reason": "short", "text": "Secretary of Commerce."}
  - {"page": 4, "locator": "5", "reason": "label-only", "text": "5. Maintenance Agency."}
  - {"page": 4, "locator": "5", "reason": "no-marker", "text": "Department of Commerce, NIST, Information Technology Laboratory."}
  - {"page": 4, "locator": "6", "reason": "label-only", "text": "6. Applicability."}
  - {"page": 5, "locator": "7", "reason": "label-only", "text": "7. Specifications."}
  - {"page": 5, "locator": "7", "reason": "no-marker", "text": "FIPS Publication 200, Minimum Security Requirements for Federal Information and Information Systems."}
  - {"page": 5, "locator": "8", "reason": "label-only", "text": "8. Implementations."}
  - {"page": 5, "locator": "9", "reason": "label-only", "text": "9. Effective Date."}
  - {"page": 5, "locator": "10", "reason": "label-only", "text": "10. Qualifications."}
  - {"page": 5, "locator": "11", "reason": "label-only", "text": "11. Waivers."}
  - {"page": 5, "locator": "12", "reason": "label-only", "text": "12. Where to Obtain Copies."}
  - {"page": 5, "locator": "12", "reason": "no-marker", "text": "This publication is available from the NIST Computer Security Division web site by accessing http://csrc.nist.gov/publications."}
