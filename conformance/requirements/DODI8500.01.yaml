    work_item: "WI-209"
  - id: "REQ-DODI8500.01-0252"
    citation: {"ref": "DODI8500.01", "page": 32, "anchor": "Knowledge Repositories. These contain a broad collection of best practices, benchmarks, standards,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.f"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "f. Knowledge Repositories. These contain a broad collection of best practices, benchmarks, standards, templates, checklists, tools, guidelines, rules, principles, and the like. Examples include the National Vulnerability Database (https://nvd.nist.gov/), the Open Vulnerability and Assessment Language Repository (https://oval.mitre.org/repository), and the DoD’s KS as defined in Reference (q). In many respects, knowledge repositories serve as the cybersecurity and cyberspace defense community “memory” and they enable policy or process interoperability and should be used to share information and answer questions."
    status: "candidate"
  - id: "REQ-DODI8500.01-0253"
    citation: {"ref": "DODI8500.01", "page": 32, "anchor": "CYBERSPACE DEFENSE. DoD uses architectures, cybersecurity, intelligence, counterintelligence (CI), other security programs,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.f.5"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "5. CYBERSPACE DEFENSE. DoD uses architectures, cybersecurity, intelligence, counterintelligence (CI), other security programs, LE, and other military capabilities to harden the DoD Information Enterprise to be more resistant to penetration and disruption; to strengthen the U.S. ability to respond to unauthorized activity and defend DoD information and the DODIN against sophisticated and agile cyber threats; and to recover quickly from cyber incidents."
    status: "not-a-requirement"
    reason: "Introduction: 'DoD uses architectures, cybersecurity, intelligence' and more to harden the Enterprise. Describes the means and purpose of cyberspace defense; duties follow in a to f."
  - id: "REQ-DODI8500.01-0254"
    citation: {"ref": "DODI8500.01", "page": 32, "anchor": "DODIN Cyberspace. DoD Components that own or operate the network are generally"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "a. DODIN Cyberspace. DoD Components that own or operate the network are generally authorized to take cyberspace defensive actions except in cases when they would compromise the operations of elements of cyberspace outside their responsibility. USCYBERCOM and its subordinate headquarters (Joint Forces Headquarter-DODIN) coordinates all defensive actions that impact more than one DoD Component or have impacts outside the realm of the network owner. These actions are under the direction of the Commander, USCYBERCOM, in accordance with Reference (bx) and conducted as described in Commander, USCYBERCOM, orders or other directives such as alerts and bulletins and Reference (bg). Cybersecurity activities are integrated and support DODIN operations as described in Reference (bg)."
    status: "not-applicable"
    reason: "Binds network-owning Components and USCYBERCOM: Components 'are generally authorized to take cyberspace defensive actions' and USCYBERCOM 'coordinates all defensive actions' across Components. Checked PER-CSSP: its agreement sets a system's containment authority, not this allocation."
  - id: "REQ-DODI8500.01-0255"
    citation: {"ref": "DODI8500.01", "page": 32, "anchor": "Continuous Monitoring Capability. DoD will establish and maintain a continuous monitoring capability"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "b. Continuous Monitoring Capability. DoD will establish and maintain a continuous monitoring capability that provides cohesive collection, transmission, storage, aggregation, and presentation of data that conveys current operational status to affected DoD stakeholders. DoD Components will achieve cohesion through the use of a common continuous monitoring framework, lexicon, and workflow as specified in NIST SP 800-137 (Reference (cj))."
    status: "candidate"
