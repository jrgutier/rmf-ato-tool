    statement: "(1) Cybersecurity products (e.g., firewalls, file integrity checkers, virus scanners, intrusion detection systems, anti‐malware software) should operate in a net-centric manner to enhance the exchange of data and shared security policies."
    status: "not-applicable"
    reason: "Binds DoD's product community: 'Cybersecurity products ... should operate in a net-centric manner'. Checked PER-ISSE and PER-CSSP: a property of enterprise tooling; no run step picks or tests it."
  - id: "REQ-DODI8500.01-0248"
    citation: {"ref": "DODI8500.01", "page": 31, "anchor": "Semantic, technical, and policy interoperability will be used to integrate disparate cybersecurity"}
