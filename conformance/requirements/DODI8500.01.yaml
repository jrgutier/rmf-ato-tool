  - id: "REQ-DODI8500.01-0201"
    citation: {"ref": "DODI8500.01", "page": 26, "anchor": "Cybersecurity Risk Management. Managing cybersecurity risks is a complex, multifaceted undertaking that"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: "PROCEDURES"
    statement: "a. Cybersecurity Risk Management. Managing cybersecurity risks is a complex, multifaceted undertaking that requires the involvement of the entire organization, from senior leaders planning and managing DoD operations, to individuals developing, implementing, and operating the IT supporting those operations. Cybersecurity risk management is a subset of the overall risk management process for all DoD acquisitions as defined in Reference (at), which includes cost, performance, and schedule risk associated with the execution of all programs of record, and all other acquisitions of DoD. The risk assessment process extends to the logistics support of fielded equipment and the need to maintain the integrity of supply sources."
    status: "not-a-requirement"
    reason: "Background: managing risk 'requires the involvement of the entire organization'. That 'requires' describes the nature of the work and binds no one; the sentences after it only place cybersecurity risk within acquisition risk."
  - id: "REQ-DODI8500.01-0202"
