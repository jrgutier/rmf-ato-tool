  - id: "REQ-DODI8500.01-0250"
    citation: {"ref": "DODI8500.01", "page": 32, "anchor": "Standards-Based Approach. The DoD cybersecurity and cyberspace defense data strategy will enable"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "d. Standards-Based Approach. The DoD cybersecurity and cyberspace defense data strategy will enable semantic, technical, and policy interoperability through a standards-based approach that has been refined by many in industry, academia, and government. It is an information‐ oriented approach (see for example the security content automation protocol (SCAP) discussion in NIST SP 800-126 (Reference (ci))."
    status: "not-a-requirement"
    reason: "Description: the data strategy 'will enable' interoperability. That 'will' states what a strategy achieves and binds no one; the rest describes the approach and points to SCAP."
  - id: "REQ-DODI8500.01-0251"
    citation: {"ref": "DODI8500.01", "page": 32, "anchor": "DoD Architecture Principles. Interoperability and effective management of security content will be"}
    kind: "lettered"
    locator: "ENCLOSURE 3.e"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "e. DoD Architecture Principles. Interoperability and effective management of security content will be achieved through adherence to DoD cybersecurity architectures as issued. All DoD Components must commit to these architectures to facilitate sharing of information necessary to achieve mission success while managing the risk inherent in interconnecting systems."
