  - id: "REQ-DODI8500.01-0245"
    citation: {"ref": "DODI8500.01", "page": 31, "anchor": "Net-Centric Operations. A net-centric model provides people, services, and platforms the ability"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "a. Net-Centric Operations. A net-centric model provides people, services, and platforms the ability to discover one another and connect to form new capabilities or teams without being constrained by geographic, organizational, or technical barriers. The net-centric model allows people, services, and platforms to work together to achieve shared ends. To be net-centric, cybersecurity will be designed, organized, and managed such that it can work together in any combination that events demand and maintain an expected level of readiness so that all required cybersecurity assets can be brought to bear in a rapid and flexible manner to meet new or changing mission needs."
    status: "not-applicable"
    reason: "Binds DoD at enterprise level: 'cybersecurity will be designed, organized, and managed' to combine as events demand. Checked PER-LSE and PER-ISSE: a net-centric aim across DoD that no single system's run can show."
  - id: "REQ-DODI8500.01-0246"
    citation: {"ref": "DODI8500.01", "page": 31, "anchor": "Integration. Cybersecurity must be fully integrated into system life cycles so that"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: "Figure 1. Three-Tiered Approach to Risk Management"
    statement: "b. Integration. Cybersecurity must be fully integrated into system life cycles so that it will be a visible element of organizational, joint, and DoD Component architectures, capability identification and development processes, integrated testing, information technology portfolios, acquisition, operational readiness assessments, supply chain risk management, SSE, and operations and maintenance activities."
    status: "candidate"
  - id: "REQ-DODI8500.01-0247"
