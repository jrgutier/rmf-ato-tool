n testing is planned and resourced as part of both the DT&E and the OT&E", "claim": "constraint", "asserts": "penetration and exploitation testing must be planned and resourced as part of the DT&E and OT&E: penetration and exploitation testing is planned and resourced as part of both the DT&E and the OT&E", "holds_when": "A-2 is in scope or the run holds test-strategy.yaml", "sentence": "Penetration and exploitation testing must be planned and resourced as part of the DT&E and OT&E via the appropriate program test documentation."}]
