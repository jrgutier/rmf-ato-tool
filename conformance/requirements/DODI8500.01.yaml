    status: "not-a-requirement"
    reason: "Background: risk management 'can be viewed as a holistic activity', and Figure 1 'illustrates' three tiers. Explains a model from SP 800-39 and assigns nothing."
  - id: "REQ-DODI8500.01-0205"
