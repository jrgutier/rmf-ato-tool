    statement: "Analysis prioritization manages the prioritization and urgency of different vulnerabilities to address highly critical requirements immediately. Impact assessment results, environmental metrics, base metrics, and temporal metrics determine prioritization through the Common Vulnerability Scoring System (CVSS). DoD Components will prioritize vulnerabilities to address the most critical vulnerabilities first."
