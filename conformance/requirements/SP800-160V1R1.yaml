  - id: "REQ-SP800-160V1R1-0015"
    citation: {"ref": "SP800-160V1R1", "page": 18, "anchor": "The considerations set forth in this publication are applicable to all federal"}
    kind: "indicative"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE This publication is intended to:"
    statement: "The considerations set forth in this publication are applicable to all federal systems other than those systems designated as national security systems as defined in 44 U.S.C., Section 3542.6 These considerations have been broadly developed from a technical and technical management perspective to complement similar considerations for national security systems and may be used for such systems with the approval of federal officials who exercise policy authority over such systems. State, local, and tribal governments, as well as private sector entities, are encouraged to consider using the material in this publication, as appropriate."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0016"
    citation: {"ref": "SP800-160V1R1", "page": 18, "anchor": "Increasing the trustworthiness of systems is a significant undertaking that requires a"}
    kind: "modal"
