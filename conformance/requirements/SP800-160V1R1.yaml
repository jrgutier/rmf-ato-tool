  - {"page": 135, "locator": "References: [4] [30] [31] [61] [86] [98] [99] [100] [105] [106] [107] [108] [109].SN-5.2", "reason": "no-marker", "text": "Note: Determining the relative criticality of measures (e.g., measures of effectiveness) captures technical achievements and reflects stakeholder priorities."}
