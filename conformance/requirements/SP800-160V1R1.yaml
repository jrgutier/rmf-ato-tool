  - id: "REQ-SP800-160V1R1-0528"
    citation: {"ref": "SP800-160V1R1", "page": 127, "anchor": "Tailoring can occur as part of the project planning process at the"}
    kind: "should"
    locator: "G.1. Process Overview"
    context: "Table 5. System Life Cycle Processes"
    statement: "Tailoring can occur as part of the project planning process at the start of the systems engineering effort or in an ad hoc manner at any time during the engineering effort when situations and circumstances so dictate. Understanding the fundamentals of systems security engineering (i.e., the science underpinning the discipline) helps to inform the tailoring process whenever it occurs during the system life cycle. The INCOSE Systems Engineering Handbook provides additional guidance on how to tailor the systems engineering processes [15]."
