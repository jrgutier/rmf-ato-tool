  - id: "REQ-SP800-160V1R1-0114"
    citation: {"ref": "SP800-160V1R1", "page": 33, "anchor": "DATA AND INFORMATION | This asset class includes all types of data"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 1. Common Asset Classes"
    statement: "DATA AND INFORMATION | This asset class includes all types of data and information (aggregations of data) and all encodings and representations of data and information (e.g., digital, optical, audio, visual). There are general sensitivity classes of data and information that do not fall within the above categories, such as classified information, Controlled Unclassified Information (CUI), and unclassified data and information. | Data and information are protected from loss due to unauthorized alteration, exfiltration, infiltration, and destruction."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0115"
    citation: {"ref": "SP800-160V1R1", "page": 33, "anchor": "DERIVATIVE NON- TANGIBLES | This asset class is comprised of derivative, non-"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 1. Common Asset Classes"
    statement: "DERIVATIVE NON- TANGIBLES | This asset class is comprised of derivative, non- tangible assets, such as image, reputation, and trust. These assets are defined, assessed, and affected – positively and negatively – by the success or failure to provide adequate protection for assets in the other classes. | Non-tangible assets are protected from loss by ensuring the adequate protection of assets in the other classes."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0116"
    citation: {"ref": "SP800-160V1R1", "page": 33, "anchor": "Assets may also be considered as individual items or as an aggregate"}
    kind: "modal"
    locator: "2.1.2"
    context: "Table 1. Common Asset Classes"
    statement: "Assets may also be considered as individual items or as an aggregate or group of items that spans asset types or asset classes (e.g., personnel data, fire control function, environmental sensor capability). This publication uses the term asset of interest to emphasize and establish bounds on the scope of reasoning for a specific asset, asset type, or asset class. The valuation of an asset is a key input in decision-making about investments to protect an asset (Section 3.6). For those cases where an asset is associated with multiple stakeholders, there may be differing, contradictory, competing, or conflicting views about the valuation that must be resolved."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0117"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "Loss is the experience of having an asset taken away or destroyed"}
    kind: "indicative"
    locator: "2.1.2"
    context: "Table 1. Common Asset Classes"
    statement: "Loss is the experience of having an asset taken away or destroyed or the failure to keep or to continue to have an asset in a desired state or form.32 A loss typically results from an adverse event or condition that causes unacceptable ramifications, consequences, or impacts. A specific loss is determined and assessed independent of the causal events and conditions necessary to produce the loss (i.e., the triggering event, such as an error of omission, or the exploitation event, such as an attack). Examples of resultant adverse events or conditions and their ramifications, impacts, or consequences include:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0118"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "Adverse event or condition: Data is stolen or inadvertently disclosed on a"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Table 1. Common Asset Classes Examples of resultant adverse events or conditions and their ramifications, impacts, or consequences include:"
    statement: "• Adverse event or condition: Data is stolen or inadvertently disclosed on a public website and is no longer solely in the possession of the owner or entities authorized by the owner."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0119"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "Ramification, impact, or consequence: Market share and competitive advantage is taken away"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Table 1. Common Asset Classes Examples of resultant adverse events or conditions and their ramifications, impacts, or consequences include:"
    statement: "• Ramification, impact, or consequence: Market share and competitive advantage is taken away because the data that was lost or stolen provided detailed instructions for a precision machining method that no other company possessed."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0120"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "Adverse event or condition: A vehicle gets a flat tire, which no"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Table 1. Common Asset Classes Examples of resultant adverse events or conditions and their ramifications, impacts, or consequences include:"
    statement: "• Adverse event or condition: A vehicle gets a flat tire, which no longer supports the vehicle weight."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0121"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "Ramification, impact, or consequence: One cannot drive the vehicle and needs alternate"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Table 1. Common Asset Classes Examples of resultant adverse events or conditions and their ramifications, impacts, or consequences include:"
    statement: "• Ramification, impact, or consequence: One cannot drive the vehicle and needs alternate transportation to get to work, the store, or go on vacation."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0122"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "Adverse event or condition: Confidence in the system of interest operating correctly"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Table 1. Common Asset Classes Examples of resultant adverse events or conditions and their ramifications, impacts, or consequences include:"
    statement: "• Adverse event or condition: Confidence in the system of interest operating correctly is lost or questioned."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0123"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "Ramification, impact, or consequence: Trust in the system and its outputs is"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Table 1. Common Asset Classes Examples of resultant adverse events or conditions and their ramifications, impacts, or consequences include:"
    statement: "• Ramification, impact, or consequence: Trust in the system and its outputs is lost, whether the loss of confidence is justified or not."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0124"
    citation: {"ref": "SP800-160V1R1", "page": 34, "anchor": "The potential to experience loss suggests the need for loss control objectives"}
    kind: "modal"
    locator: "2.1.2"
    context: "Table 1. Common Asset Classes"
    statement: "The potential to experience loss suggests the need for loss control objectives that serve as the basis for judgments about effectively addressing the prevention and limiting of loss. This includes the resultant adverse events and conditions and their ramifications. The loss control objectives also serve as the basis to acquire evidence of assurance that the system as designed, built, used, and sustained will adequately protect against loss while achieving its design intent. The loss control objectives reflect an ideal to preserve the assets’ characteristics (i.e., state, condition, form, utility) to the extent practicable despite the potential for those characteristics to be changed. The objectives accept uncertainty in the form of limits to what can be done (i.e., not all losses can be avoided) and limits to the effectiveness of what is done (i.e., anything done has its scope of effectiveness and set of potential failure modes)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0125"
    citation: {"ref": "SP800-160V1R1", "page": 35, "anchor": "Due to uncertainty, it is not possible to guarantee that some form"}
    kind: "modal"
    locator: "2.1.2"
    context: "Table 1. Common Asset Classes"
    statement: "Due to uncertainty, it is not possible to guarantee that some form of loss will not occur. There is a need to emphasize protection against the effects of loss, including cascading or ripple events (i.e., the immediate effect of a loss causes some additional unintended or undesired effects or causes additional losses to occur). Thus, holistically protecting against loss and the unintended or undesired effects of loss considers the full spectrum of possible loss across types of losses and loss effects associated with each asset class. This is important considering that all forms of adversity are not knowable. Therefore, it is prudent to ensure that there is focus on the effect to be controlled rather than on the cause when protecting against loss."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0126"
    citation: {"ref": "SP800-160V1R1", "page": 35, "anchor": "The loss control objectives in Table 2 address the possibilities to control"}
    kind: "modal"
    locator: "2.1.2"
    context: "Table 1. Common Asset Classes"
    statement: "The loss control objectives in Table 2 address the possibilities to control the potential for loss and the effects of loss given the limits of certainty, feasibility, and practicality. Collectively, the loss control objectives include the concerns attributed to security and to system survivability, safety, and resilience. Note that satisfying loss control objectives may require trade-offs. Avoiding or limiting the loss of one asset may come at the expense of not avoiding or limiting the loss of another asset, as well as having trade-offs with other objectives (e.g., cost and schedule)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0127"
    citation: {"ref": "SP800-160V1R1", "page": 35, "anchor": "LOSS PREVENTION (Prevent the loss from occurring) | LOSS PREVENTION | •"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "LOSS PREVENTION (Prevent the loss from occurring) | LOSS PREVENTION | • This is the case where a loss is totally avoided. That is, despite the presence of adversity:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0128"
    citation: {"ref": "SP800-160V1R1", "page": 35, "anchor": "(Prevent the loss | - The system continues to provide only the"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "(Prevent the loss | - The system continues to provide only the intended behavior and produces only the intended"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0129"
    citation: {"ref": "SP800-160V1R1", "page": 35, "anchor": "from occurring) | outcomes. - The desired properties of the system and"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "from occurring) | outcomes. - The desired properties of the system and assets used by the system are retained. - The assets continue to exist. • Loss avoidance may be achieved by any combination of: - Preventing or removing the event or events that cause the loss - Preventing or removing the condition or conditions that allow the loss to occur - Not suffering an adverse effect despite the events or conditions • Terms such as avoid, continue, delay, divert, eliminate, harden, prevent, redirect, remove, tolerate, and withstand are typically used to characterize approaches to achieving this objective such that a loss does not occur despite the system being subjected to adversity. • The term tolerate refers to the objective of fault/failure tolerance, whereby adversity in the form of faults, errors, and failures is rendered inconsequential and does not alter or prevent the realization of authorized and intended system behavior and outcomes (i.e., the faults, errors, and failures are tolerated)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0130"
    citation: {"ref": "SP800-160V1R1", "page": 35, "anchor": "LOSS LIMITATION | • This covers cases where a loss can or"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "LOSS LIMITATION | • This covers cases where a loss can or has occurred, and the extent of loss is to be limited. • The extent of loss can be limited in terms of any combination of the following:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0131"
    citation: {"ref": "SP800-160V1R1", "page": 36, "anchor": "(Limit the extent of the loss) | (Limit the extent of |"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "(Limit the extent of the loss) | (Limit the extent of | - Limited dispersion (e.g., migration, propagation, spreading, ripple, domino, or cascading effects)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0132"
    citation: {"ref": "SP800-160V1R1", "page": 36, "anchor": "the loss) | - Limited duration (e.g., milliseconds, minutes, hours, days) -"}
    kind: "table"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "the loss) | - Limited duration (e.g., milliseconds, minutes, hours, days) - Limited capacity (e.g., diminished utility, delivery of function, service, or capability) - Limited volume (e.g., bits or bytes of data/information) • Decisions to limit the extent of loss may require prioritizing what constitutes acceptable loss across a set of losses, whereby the objective to limit the loss for one asset requires accepting a loss of some other asset. • The extreme case of loss limitation is to avoid destruction of the asset. • Terms such as tolerate, withstand, remove, continue, constrain, stop/halt, and restart fall into this category in the case where the loss occurs and the system can, or enables the ability to, limit the effect of the loss. • Loss recovery and loss delay are two means to limit loss: - Loss Recovery: Action is taken by the system or enabled by the system to recover (or allow the recovery of) some or all of its ability to function (i.e., behave, interact, produce outcomes) and to recover assets used by the system (e.g., re-imaging, reloading, or recreating data and information, including software in the system). The restoration of the asset, fully or partially, can limit the dispersion, duration, capacity, or volume of the loss. - Loss Delay: The loss event is avoided until the adverse effect is lessened or when a delay enables a more robust response or quicker recovery. • System and environmental conditions may be assumed to result in loss, but measures are taken to limit impacts. • Terms such as contain, recover, restore, reconstitute, reconfigure, and restart are typically used to characterize approaches to achieving this objective."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0133"
    citation: {"ref": "SP800-160V1R1", "page": 36, "anchor": "Objective 1: Determine asset protection needs"}
