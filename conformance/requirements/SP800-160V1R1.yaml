    kind: "lettered"
    locator: "2.1.2.-"
    context: "Table 2. Loss Control Objectives The elements are also grouped into two objectives to facilitate reasoning about the asset of interest:"
    statement: "- Significance of Loss: The effect of asset loss (or consequences) based on its valuation34"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0136"
    citation: {"ref": "SP800-160V1R1", "page": 36, "anchor": "Confidence in Addressing Loss: The assurance to be achieved based on claims-driven"}
    kind: "lettered"
    locator: "2.1.2.-"
    context: "Table 2. Loss Control Objectives The elements are also grouped into two objectives to facilitate reasoning about the asset of interest:"
    statement: "- Confidence in Addressing Loss: The assurance to be achieved based on claims-driven and evidence-based arguments about the effectiveness of what is done to address potential and actual loss"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0137"
    citation: {"ref": "SP800-160V1R1", "page": 36, "anchor": "Valuation is a stakeholder determination. Factors that stakeholders may consider include the"}
    kind: "should"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "Valuation is a stakeholder determination. Factors that stakeholders may consider include the various costs associated with the asset and the effects of loss. The effects of loss may be short-term (e.g., completing a business transaction) or long-term (e.g., extended loss of capability awaiting replacement of asset)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0138"
    citation: {"ref": "SP800-160V1R1", "page": 37, "anchor": "Objective 2: Satisfy asset protection needs"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Table 2. Loss Control Objectives"
    statement: "• Objective 2: Satisfy asset protection needs"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0139"
    citation: {"ref": "SP800-160V1R1", "page": 37, "anchor": "Cause of Loss: The events, conditions, or circumstances that describe what has"}
    kind: "lettered"
    locator: "2.1.2.-"
    context: "Table 2. Loss Control Objectives"
    statement: "- Cause of Loss: The events, conditions, or circumstances that describe what has happened before and what can happen in the future that constitute the potential for loss to occur"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0140"
    citation: {"ref": "SP800-160V1R1", "page": 37, "anchor": "Addressing Loss: The various actions taken to exercise control over loss to"}
    kind: "lettered"
    locator: "2.1.2.-"
    context: "Table 2. Loss Control Objectives"
    statement: "- Addressing Loss: The various actions taken to exercise control over loss to the extent practicable. The control objectives are to prevent loss from occurring and to limit the extent and duration for those losses that do occur. Limiting loss includes recovery from loss to the extent practicable."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0141"
    citation: {"ref": "SP800-160V1R1", "page": 37, "anchor": "The asset of interest is the asset class, asset type, or individual"}
    kind: "indicative"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "The asset of interest is the asset class, asset type, or individual asset being addressed. Reasoning about loss is based on the asset of interest. Distinguishing the asset of interest from all other assets provides clarity in the interpretation of loss for the asset of interest and the associated judgments of the suitability and effectiveness of protections employed. A focus on a specific asset class, type, or discrete element also enables precise traceability to requirements that support the analysis needed to determine the protection-relevant impact of changes to requirements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0142"
    citation: {"ref": "SP800-160V1R1", "page": 37, "anchor": "The context of loss establishes the boundary, scope, and time frame for"}
    kind: "indicative"
    locator: "2.1.2"
    context: "Table 2. Loss Control Objectives"
    statement: "The context of loss establishes the boundary, scope, and time frame for the reasoning, analyses, assessments, and conclusions about the asset of interest. The context of loss also provides a basis to relate and trace asset dependencies and interactions and to group assets for protection. The context of loss time frame is particularly important because the asset of interest has a life cycle35 that is different from the system of interest.36 For example, the asset of interest may be created, configured, or modified outside of the scope of control of the system of interest yet be within the scope of the engineering effort. The asset of interest, once within the scope of control of the system of interest, may have differing protection needs associated with the state or mode of the system (e.g., the system operational mode protection may differ from the system training mode). Additionally, system life cycle assets (Section 3.8) may only exist within a development or production system and their associated supporting environments. The effect of the loss for these assets may transfer to a loss associated with the system of interest. Therefore, the context of loss includes the life cycle of the asset, the state and mode of the system, and other time-based periods or characteristics during which loss is addressed."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0143"
    citation: {"ref": "SP800-160V1R1", "page": 38, "anchor": "A financial portfolio (i.e., an asset or collection of assets) with specific"}
    kind: "should"
    locator: "2.1.2"
    context: "TIME FRAME OF LOSS – AN EXAMPLE"
    statement: "A financial portfolio (i.e., an asset or collection of assets) with specific investment objectives and risk acceptance considerations may be created by a financial advisor for a client, funded by the client, and subsequently managed using multiple systems across one or more institutional investment firms throughout the portfolio’s life cycle. Each asset of interest within the portfolio may have differing protection needs at different times depending on the type of asset, market conditions, regulatory jurisdiction, risk position, and other asset management factors that are imposed on the system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0144"
    citation: {"ref": "SP800-160V1R1", "page": 38, "anchor": "The significance of loss is the adverse effect (consequence) on the asset"}
    kind: "indicative"
    locator: "2.1.2"
    context: "TIME FRAME OF LOSS – AN EXAMPLE"
    statement: "The significance of loss is the adverse effect (consequence) on the asset of interest or the resultant adverse effect associated with the asset. The significance of loss is best described as an experience that is to be avoided, thereby warranting an investment to protect against the loss occurring and to minimize the extent of the adverse effect should the loss occur. The significance of loss is determined and assessed as an effects-based judgment. That is, it is determined without any consideration of how or why the loss occurs, the probability or likelihood of the loss occurring, and any intent or the absence of intent related to the loss.37"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0145"
    citation: {"ref": "SP800-160V1R1", "page": 38, "anchor": "What are the ramifications, effects, and problems that result from suffering a"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "TIME FRAME OF LOSS – AN EXAMPLE The significance of loss answers the following questions:"
    statement: "• What are the ramifications, effects, and problems that result from suffering a loss of the asset of interest?"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0146"
    citation: {"ref": "SP800-160V1R1", "page": 38, "anchor": "What is the severity of those ramifications, effects, and problems?"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "TIME FRAME OF LOSS – AN EXAMPLE The significance of loss answers the following questions:"
    statement: "• What is the severity of those ramifications, effects, and problems?"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0147"
    citation: {"ref": "SP800-160V1R1", "page": 39, "anchor": "The significance of loss requires clarity in what loss means for the"}
    kind: "modal"
    locator: "2.1.2"
    context: "TIME FRAME OF LOSS – AN EXAMPLE"
    statement: "The significance of loss requires clarity in what loss means for the asset of interest. Examples of terms used to describe asset loss include ability, accessibility, accuracy, assurance, advantage (technological, competitive, combatant), capability, control, correctness, existence, investment, ownership, performance, possession, precision, quality, satisfaction, and time."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0148"
    citation: {"ref": "SP800-160V1R1", "page": 39, "anchor": "The significance of loss due to a flat tire is determined and"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE"
    statement: "The significance of loss due to a flat tire is determined and assessed without consideration for how or why the tire became flat (e.g., puncture, manufacturing defect, impact with curb or other object) and without any consideration of malicious intent (e.g., tire cut, valve stem loosened). Regardless of how or why the tire became flat, the significance of loss remains the same (e.g., loss of control if the vehicle is moving, inability to drive if the vehicle is stationary, time lost to replace or repair the tire to make the vehicle operable). The significance of loss due to a flat tire includes the inability to steer the vehicle, and the resultant adverse effect may be to impact some other object (i.e., a crash). The adverse effect of the loss of steering (loss of control) is specific, while the adverse effect of a crash is general (many other circumstances may result in a crash without any loss of the ability to steer the vehicle)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0149"
    citation: {"ref": "SP800-160V1R1", "page": 39, "anchor": "Confidence in addressing loss ensures that protections have a body of objective"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE"
    statement: "Confidence in addressing loss ensures that protections have a body of objective evidence that demonstrates the effectiveness, sufficiency, and suitability of protective measures to satisfy asset protection needs. Confidence in addressing loss is cumulative. It begins with determining the loss concerns for the asset of interest and continuously builds as those concerns are better understood and addressed across the context of loss, the significance of loss, the causes of loss, and how loss is addressed. The evidence basis that provides confidence is informed by the verification and validation activities that occur throughout the life cycles of the assets and the system, including requirements elicitation and analysis. A key informing element to those activities is to ensure that the results contribute to the confidence sought."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0150"
    citation: {"ref": "SP800-160V1R1", "page": 39, "anchor": "Single events and conditions that alone can produce the loss"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE The following considerations apply to reasoning about the causes of loss:"
    statement: "• Single events and conditions that alone can produce the loss"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0151"
    citation: {"ref": "SP800-160V1R1", "page": 39, "anchor": "Combinations, sequences, and aggregate events and conditions"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE The following considerations apply to reasoning about the causes of loss:"
    statement: "• Combinations, sequences, and aggregate events and conditions"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0152"
    citation: {"ref": "SP800-160V1R1", "page": 39, "anchor": "Many terms are used to describe the cause of asset loss. Some"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE The following considerations apply to reasoning about the causes of loss:"
    statement: "Many terms are used to describe the cause of asset loss. Some of these terms are specific to a community of interest or specialty field, while others span communities and specialties. There are also cases where the same term may be used differently across communities and specialty fields (e.g., the term threat has varying interpretations across communities, such as physical security, cybersecurity, commerce, law enforcement, industry, military combat operations, and military intelligence). The terms used as a synonym for the cause of asset loss include attack, breach, compromise, hazard, mishap, threat, violation, and vulnerability."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0153"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "Events and conditions that are desirable, intended, and even planned yet produce"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE"
    statement: "• Events and conditions that are desirable, intended, and even planned yet produce unanticipated, unforeseen, and unpredictable results"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0154"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "Cascading and ripple events and conditions"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE"
    statement: "• Cascading and ripple events and conditions"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0155"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "How can loss occur?"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE Finally, the causes of asset loss answer the following questions:"
    statement: "• How can loss occur?"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0156"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "How has loss occurred in the past?"}
    kind: "lettered"
