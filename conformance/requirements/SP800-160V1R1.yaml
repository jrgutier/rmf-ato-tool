  - id: "REQ-SP800-160V1R1-0180"
    citation: {"ref": "SP800-160V1R1", "page": 43, "anchor": "The stakeholder perspective is based on the assets that belong to stakeholders."}
    kind: "indicative"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS To summarize, the following considerations impact the identification of protection needs:"
    statement: "The stakeholder perspective is based on the assets that belong to stakeholders. Therefore, those stakeholders determine the protection needs. The system perspective is based on the assets necessary for the system to function. These assets are determined by system design decisions and the criticality and priority41 of the asset in providing or supporting the functions of the system. Stakeholders are typically unaware of the existence of system assets and are not able to make decisions about the protection needs for system assets. The protection of system assets is an element of trustworthy secure system design."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0181"
    citation: {"ref": "SP800-160V1R1", "page": 43, "anchor": "Three predominant viewpoints of system security include system function, security function, and"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "Three predominant viewpoints of system security include system function, security function, and life cycle assets. These viewpoints shape the considerations that are used as trustworthy secure design considerations for any system type, intended use, and consequence of system failure."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0182"
    citation: {"ref": "SP800-160V1R1", "page": 43, "anchor": "the totality of the system’s purpose or role to securely satisfy stakeholder"}
    kind: "lettered"
    locator: "2.1.2.–"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "– the totality of the system’s purpose or role to securely satisfy stakeholder capability needs. The security function enforces security-driven constraints as part of the overall system design. The purpose of the constraints is to avoid, reduce, and tolerate susceptibilities, defects, weaknesses, and flaws in the system that may constitute vulnerabilities that can be exploited or triggered. These vulnerabilities can reside within the system’s structure or behaviors and can have the effect of countering, defeating, or minimizing the ability of the system to effectively satisfy its design intent to deliver the required capability. Thus, the constraints also enable the synthesis of the security function within the system function in a non-conflicting manner."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0183"
    citation: {"ref": "SP800-160V1R1", "page": 43, "anchor": "Passive aspects of the security function do not exhibit behavior (i.e., are"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS The security function of the system has both passive and active aspects:"
    statement: "• Passive aspects of the security function do not exhibit behavior (i.e., are non-functional in nature). They include the system architecture and design elements. The passive aspects are part of the system structure and are, therefore, embodied in the architecture of the system. For example, the functional architecture may segment system functions (including security functions) into different subsystems, reducing the possibility of interference among functions as well as limiting the propagation of erroneous behavior. Passive aspects inherently reduce the susceptibility of the system to exposure, hazard, and vulnerability, thereby limiting if not eliminating the potential for loss scenarios. The employment of passive aspects generally enables greater confidence in the protection capability of the system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0184"
    citation: {"ref": "SP800-160V1R1", "page": 43, "anchor": "Criticality and priority based on asset valuation are typically used in decisions"}
    kind: "modal"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS The security function of the system has both passive and active aspects:"
    statement: "Criticality and priority based on asset valuation are typically used in decisions on protection needs. An asset with higher criticality and priority would take precedence in providing protection should there be constraints that require choosing between the overall protection needs."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0185"
    citation: {"ref": "SP800-160V1R1", "page": 44, "anchor": "Active aspects of the security function exhibit behavior (i.e., are functional in"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "• Active aspects of the security function exhibit behavior (i.e., are functional in nature). They include engineered features and devices, referred to as controls, countermeasures, features, inhibits, mechanisms, overrides, safeguards, or services. The active aspects are employed or allocated within the system architecture, have a specific design, and have capabilities and limitations that affect their suitability and effectiveness relative to their intended use."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0186"
    citation: {"ref": "SP800-160V1R1", "page": 44, "anchor": "Passive and active aspects of security function factor into trades, as discussed"}
    kind: "modal"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "Passive and active aspects of security function factor into trades, as discussed in Section D.4.4. Active aspects may also require additional hardware or loads on existing hardware; increasing demands for size, weight, and power (SWaP); and making active aspects a challenge for SWaP-restricted systems (e.g., satellites)."
    status: "candidate"
