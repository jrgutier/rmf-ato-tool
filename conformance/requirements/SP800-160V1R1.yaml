  - id: "REQ-SP800-160V1R1-0049"
    citation: {"ref": "SP800-160V1R1", "page": 22, "anchor": "The effectiveness of any engineering discipline first requires a thorough understanding of"}
    kind: "modal"
    locator: "References"
    context: "ENGINEERING-DRIVEN SOLUTIONS"
    statement: "The effectiveness of any engineering discipline first requires a thorough understanding of the problem and consideration of all feasible solutions before acting to solve the identified problem. To maximize the effectiveness of systems security engineering, the security requirements for the protection against asset loss must be driven by business, mission, and all other stakeholder asset loss concerns. The security requirements are defined and managed as a well-defined set of engineering requirements and cannot be addressed independently or after the fact."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0050"
    citation: {"ref": "SP800-160V1R1", "page": 22, "anchor": "In the context of systems security engineering, the term protection has a"}
    kind: "modal"
    locator: "References"
    context: "ENGINEERING-DRIVEN SOLUTIONS"
    statement: "In the context of systems security engineering, the term protection has a broad scope and is primarily focused on the concept of assets and asset loss resulting in unacceptable consequences. The protection capability provided by a system goes beyond prevention and aims to control the events, conditions, and consequences that constitute asset loss. It is achieved in the form of the specific capability and constraints on system architecture, design, function, implementation, construction, selection of technology, methods, and tools and must be “engineered in” as part of the system life cycle process."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0051"
    citation: {"ref": "SP800-160V1R1", "page": 22, "anchor": "Understanding stakeholder asset protection needs (including assets that they own and assets"}
    kind: "modal"
    locator: "References"
    context: "ENGINEERING-DRIVEN SOLUTIONS"
    statement: "Understanding stakeholder asset protection needs (including assets that they own and assets that they do not own but must protect) and expressing those needs through a set of well-defined security requirements is an investment in the organization’s mission and business success in the modern age of global commerce, powerful computing systems, and network connectivity."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0052"
    citation: {"ref": "SP800-160V1R1", "page": 23, "anchor": "Examples of systems include information systems, communications systems, financial systems, manufacturing systems,"}
    kind: "should"
    locator: "2.1.1"
    context: "Systems and System Structure"
    statement: "Examples of systems include information systems, communications systems, financial systems, manufacturing systems, transportation systems, logistics systems, medical systems, weapons systems, mechanical systems, space systems, industrial control systems (ICS), optical systems, or electrical systems. Systems can be physical or conceptual, use information technology (IT) or operational technology (OT), include humans, be cyber-physical, and leverage Internet of Things (IoT) or other technologies."
    status: "candidate"
    removed: true
  - id: "REQ-SP800-160V1R1-0053"
    citation: {"ref": "SP800-160V1R1", "page": 24, "anchor": "A system of systems is a system whose interacting system elements are"}
    kind: "modal"
    locator: "2.1.1"
    context: "Systems and System Structure"
    statement: "A system of systems is a system whose interacting system elements are themselves systems. It provides a unique capability that the constituent systems cannot provide on their own. A system of systems may include inter-system infrastructure, facilities, and processes necessary to enable the constituent systems to integrate or interoperate [10]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0054"
    citation: {"ref": "SP800-160V1R1", "page": 24, "anchor": "Interfacing systems are systems that interact with the system of interest. Interfacing"}
    kind: "should"
    locator: "2.1.2"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "Interfacing systems are systems that interact with the system of interest. Interfacing systems have an interface for exchanging data, energy, or other resources with the system of interest. An interfacing system exchanges resources with the system of interest during one or more system life cycle stages, such as a system that interfaces for maintenance purposes or a system used to develop the system of interest. The relationships with interfacing systems can be either bi-directional or one way. Interfacing systems have two specific subsets: enabling systems and interoperating systems."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0055"
    citation: {"ref": "SP800-160V1R1", "page": 24, "anchor": "Enabling systems provide the essential services required to create and sustain the"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "• Enabling systems provide the essential services required to create and sustain the system of interest. Examples of enabling systems include software development environments, production systems, training systems, and maintenance systems."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0056"
    citation: {"ref": "SP800-160V1R1", "page": 25, "anchor": "Interoperating systems interact with the system of interest for the purpose of"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "• Interoperating systems interact with the system of interest for the purpose of jointly performing a function."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0057"
    citation: {"ref": "SP800-160V1R1", "page": 25, "anchor": "Systems engineering is a transdisciplinary12 and integrative approach to enabling the successful"}
    kind: "indicative"
    locator: "2.1.2"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "Systems engineering is a transdisciplinary12 and integrative approach to enabling the successful realization, use, and retirement of engineered systems. It employs systems principles and concepts, as well as scientific, technological, and management methods to achieve such systems [12]. Systems engineering is system-holistic in nature, whereby the contributions across multiple engineering and specialty disciplines are evaluated and balanced to produce a coherent system capability. Systems engineering applies systems science and systems thinking13 to satisfy the often-conflicting needs and priorities of stakeholders within the constraints of cost, schedule, performance, and effectiveness. The objective is to limit uncertainty and thereby manage risk. Systems engineering is outcome-oriented and leverages engineering processes to realize a system while effectively managing complexity and serving as the principal integrating mechanism for the technical, management, and support activities related to the engineering effort. Finally, systems engineering is data- and analytics-driven to ensure that all decisions and trades are guided and informed by data produced by analyses conducted with an appropriate level of fidelity and rigor."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0058"
    citation: {"ref": "SP800-160V1R1", "page": 26, "anchor": "Systems engineering efforts are complex, system-specific, and context-dependent,14 requiring close coordination between"}
    kind: "modal"
    locator: "2.1.2"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "Systems engineering efforts are complex, system-specific, and context-dependent,14 requiring close coordination between the engineering team and stakeholders throughout the system life cycle stages.15 While systems engineering is typically considered in terms of its developmental role as part of capability acquisition, systems engineering efforts and responsibilities do not end once a system completes development and is transitioned to the operational environment for day-to-day use. Stakeholders responsible for the system’s utilization, support, and retirement provide data to the systems engineering team on an ongoing basis. This data captures the experiences, problems, and issues associated with the operation, maintenance, and sustainment of the system. Stakeholders also advise the engineering team on system enhancements and improvements made or desired. In addition, field engineering provides on-site, full-system life cycle engineering support for operations, maintenance, and sustainment organizations."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0059"
    citation: {"ref": "SP800-160V1R1", "page": 26, "anchor": "The concepts of trust and trustworthiness are foundational to engineering trustworthy secure"}
    kind: "indicative"
    locator: "2.1.2"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "The concepts of trust and trustworthiness are foundational to engineering trustworthy secure systems, to the decisions made to grant trust, and to the extent that trust is granted based on demonstrated trustworthiness. Trust is a belief that an entity meets certain expectations and can be relied upon. The terms belief and can imply that trust may be granted to an entity whether the entity is trustworthy or not. A trustworthy entity is one for which sufficient evidence exists to support its claimed trustworthiness. Thus, trustworthiness is the demonstrated ability and, therefore, the worthiness of an entity to be trusted to satisfy expectations, including satisfying expectations in the face of adversity. Since trustworthiness is something demonstrated, it is based on evidence that supports a claim or judgment of an entity being worthy of trust [2] [20] [21]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0060"
    citation: {"ref": "SP800-160V1R1", "page": 26, "anchor": "Since trust is not necessarily based on a judgment of trustworthiness, the"}
    kind: "should"
    locator: "2.1.2"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "Since trust is not necessarily based on a judgment of trustworthiness, the decision to trust an entity should consider the significance (i.e., consequences, effects, and impacts) of expectations not being fulfilled because of non-performance – whether due to incompetence, deficiency, or failure. Trust that is granted without establishing the required trustworthiness is a significant contributor to risk. The concepts of trust and trustworthiness are discussed in Appendix F."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0061"
    citation: {"ref": "SP800-160V1R1", "page": 26, "anchor": "INCOSE offers a systems engineering handbook [15] and Systems Engineering Book of"}
    kind: "indicative"
    locator: "2.1.2"
    context: "Interfacing, Enabling, and Interoperating Systems"
    statement: "INCOSE offers a systems engineering handbook [15] and Systems Engineering Book of Knowledge [13] as general resources. The National Aeronautical and Space Administration (NASA) also offers systems engineering material as it is applied within the NASA community. Publications include the NASA Systems Engineering Handbook [17] and two volumes of expanded systems engineering guidance [18] [19]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0062"
    citation: {"ref": "SP800-160V1R1", "page": 28, "anchor": "This chapter describes the aspects necessary for a systems engineering perspective on"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "This chapter describes the aspects necessary for a systems engineering perspective on security. A systems engineering perspective on security requires an understanding of the concept of security (Section 3.1), the concept of an adequately secure system (Section 3.2), and the characteristics of systems (Section 3.3). It also requires an understanding of the concept of assets (Section 3.4), the concepts of loss and loss control (Section 3.5), how to reason about asset loss (Section 3.6), and how to determine protection needs (Section 3.7). In satisfying such needs, specific viewpoints (Section 3.8) and how security is demonstrated are considered, including what is adequate (Section 3.9). The systems engineering subdiscipline that encompasses these considerations is referred to as systems security engineering (Section 3.10)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0063"
    citation: {"ref": "SP800-160V1R1", "page": 28, "anchor": "A system with freedom from those conditions that can cause a loss"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "A system with freedom from those conditions that can cause a loss of assets with unacceptable consequences must provide the intended behaviors and outcomes and also avoid any unintended behaviors and outcomes that constitute a loss. The term intended is reflected in two cases, both of which must be satisfied:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0064"
    citation: {"ref": "SP800-160V1R1", "page": 28, "anchor": "User intent: The system behaviors and outcomes expected by the user"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST The term intended is reflected in two cases, both of which must be satisfied:"
    statement: "• User intent: The system behaviors and outcomes expected by the user"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0065"
    citation: {"ref": "SP800-160V1R1", "page": 28, "anchor": "Design intent: The system behaviors and outcomes to be achieved by the"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST The term intended is reflected in two cases, both of which must be satisfied:"
    statement: "• Design intent: The system behaviors and outcomes to be achieved by the design"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0066"
    citation: {"ref": "SP800-160V1R1", "page": 28, "anchor": "The primary security objective is to ensure that only the intended behaviors"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "The primary security objective is to ensure that only the intended behaviors and outcomes occur, both with the system and within the system.17 Every security need and concern derive from this objective, which is based on the concept of authorization for what is and is not allowed.18 As such, the primary security control objective is enforcing constraints in the form of rules for allowed and disallowed behaviors and outcomes. This control objective – and a foundational principle of trustworthy secure design – is Mediated Access. If access is not mediated (i.e., controlled though enforcing constraints) following a set of non-conflicting rules, then no basis exists upon which to claim that security is achieved."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0067"
    citation: {"ref": "SP800-160V1R1", "page": 28, "anchor": "The rules for mediated access are stated in a set of security"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "The rules for mediated access are stated in a set of security policies19 that reflect or are derived from laws, directives, regulations, life cycle concepts,20 requirements, or other specifically stated stakeholder objectives. A security policy includes a scope of control that establishes bounds within which the policy applies. Security policy rules are stated in terms of subjects (active entities), objects (passive entities), and the operations that the subject can perform or invoke on the object.21 The rules govern subject-to-object and subject-to-subject behaviors and outcomes. Each security policy rule must be accurate, consistent, compatible, and complete with respect to stakeholder objectives for the defined scope of control.22 Inconsistency, incompatibility, inaccuracy, or incompleteness in the security policy rules lead to protection gaps. It is equally important that the security protection capabilities of the system are aligned with and can achieve the expectations of the policy."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0068"
    citation: {"ref": "SP800-160V1R1", "page": 28, "anchor": "An attacker seeks to produce unauthorized behaviors or outcomes. Attackers attempt to"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "An attacker seeks to produce unauthorized behaviors or outcomes. Attackers attempt to accomplish something that they are not authorized to accomplish, even if that behavior or outcome is authorized for some other entity."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0069"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "Privileges23 define the set of allowed and disallowed behavior and outcomes granted"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "Privileges23 define the set of allowed and disallowed behavior and outcomes granted to a subject. Privileges are the basis for making mediated access decisions. A restrictive default practice for security policy enforcement is to design the enforcement mechanism to allow only what the policy explicitly allows and to deny everything else. For a system to be deemed trustworthy secure, there must be sufficient confidence that the system is capable of enforcing the security policy on a continuous basis for the duration of the time that the policy is in effect (Appendix F)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0070"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "It enables the delivery of the required system capability despite intentional and"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST The definition of security expresses an ideal that encapsulates three essential characteristics of a secure system:"
    statement: "• It enables the delivery of the required system capability despite intentional and unintentional forms of adversity."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0071"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "It enforces constraints to ensure that only the desired behaviors and outcomes"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST The definition of security expresses an ideal that encapsulates three essential characteristics of a secure system:"
    statement: "• It enforces constraints to ensure that only the desired behaviors and outcomes associated with the required system capability are realized while satisfying the first characteristic."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0072"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "It enforces constraints based on a set of rules to ensure that"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST The definition of security expresses an ideal that encapsulates three essential characteristics of a secure system:"
    statement: "• It enforces constraints based on a set of rules to ensure that only authorized human-to-machine and machine-to-machine interactions and operations are allowed to occur while satisfying the second characteristic."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0073"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "These characteristics are to be achieved to the extent practicable, resulting in"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST The definition of security expresses an ideal that encapsulates three essential characteristics of a secure system:"
    statement: "These characteristics are to be achieved to the extent practicable, resulting in a gap between the ideal secure system and the security performance that the system can dependably achieve.24 The judgment that a system is adequately secure25 requires an evidence-based determination that security performance is optimized against all other performance objectives and constraints. The scope of conditions relevant to security and the acceptable level of security are specific to stakeholder needs. To be adequately secure, the system:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0074"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "Meets minimum tolerable levels26 of security, as determined by experience, analysis, or"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST To be adequately secure, the system:"
    statement: "• Meets minimum tolerable levels26 of security, as determined by experience, analysis, or a combination of both"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0075"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "Is as secure as reasonably practicable (ASARP)"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST To be adequately secure, the system:"
    statement: "• Is as secure as reasonably practicable (ASARP)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0076"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "At the highest level of assurance, security policies are formally specified and"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "At the highest level of assurance, security policies are formally specified and verified."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0077"
    citation: {"ref": "SP800-160V1R1", "page": 29, "anchor": "Because system security is asymmetric – that is, things can be observed"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "Because system security is asymmetric – that is, things can be observed to be insecure, but no observation allows one to declare an arbitrary system secure [22] – the ideal cannot be achieved without some uncertainty."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0078"
    citation: {"ref": "SP800-160V1R1", "page": 30, "anchor": "As secure as reasonably practicable means that an incremental improvement in security"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "As secure as reasonably practicable means that an incremental improvement in security would require a disproportionate deterioration of meeting other system cost, schedule, or performance objectives; would violate system constraints; or would require unacceptable concessions such as an unacceptable change in the way operations are performed."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0079"
    citation: {"ref": "SP800-160V1R1", "page": 30, "anchor": "An adequately secure system does not necessarily preclude all of the conditions"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "An adequately secure system does not necessarily preclude all of the conditions that can lead to or result in undesirable consequences. The minimum tolerable levels of security performance and interpretations of as secure as reasonably practicable may not be fixed for the life of a system. The information gathered while the system is in use and the lessons learned may guide and inform modifications that raise the bar on either or both (tolerability and practicability)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0080"
    citation: {"ref": "SP800-160V1R1", "page": 30, "anchor": "The concept of adequately secure is, therefore, inherently context-dependent, and subjective in"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "The concept of adequately secure is, therefore, inherently context-dependent, and subjective in nature. It is based on assertions and expectations about the system security objectives and determining how well those objectives have been achieved. Figure 4 illustrates the trade-offs between system security and the cost, schedule, and technical performance of the system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0081"
    citation: {"ref": "SP800-160V1R1", "page": 30, "anchor": "Judging the adequacy of system security requires an understanding of system states."}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "Judging the adequacy of system security requires an understanding of system states. All systems operate in and transition between a set of states. These states and transitions may correspond to or be defined by characteristics of the system, such as how the system functions (e.g., start, run, idle, recovery), how the system is used (e.g., operational, training, maintenance, peacetime, wartime), and by environmental conditions (e.g., under fire or not, temperature ranges). There are security characteristics that determine whether each state or transition is secure, insecure, or indeterminate (i.e., unknown whether secure or insecure). Adequate security depends on being able to distinguish among secure, insecure, and indeterminate states and to keep the system operating in secure states by applying the principles of Protective Failure and Protective Recovery."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0082"
    citation: {"ref": "SP800-160V1R1", "page": 31, "anchor": "System states may be secure states (i.e., what states are desired and"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "System states may be secure states (i.e., what states are desired and allowed) and insecure states (i.e., what states are not desired nor allowed). Ideally, a secure system is a system that begins execution in a secure state and does not transition to an insecure state. That is, every state transition results in the same or another secure state. Each state transition must also be secure. Figure 5 illustrates a subset of these idealized secure system state transitions."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0083"
    citation: {"ref": "SP800-160V1R1", "page": 31, "anchor": "Protective failure requires the ability to (1) detect that the system is"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "Protective failure requires the ability to (1) detect that the system is in an insecure state and (2) detect a transition that will place the system into an insecure state for the purposes of responding to avoid the propagation of new failure. Protective failure calls for responsive and corrective actions, including (when needed) transitioning to a secure halt state with a protected recovery to allow for the continuation of operations in a reconstituted, reconfigured, or alternative secure operational mode. Other stakeholder objectives may necessitate the continuation of operations in a less-than-fully-secure state and should be reflected as necessary in such things as policy and requirements (Section C.3)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0084"
    citation: {"ref": "SP800-160V1R1", "page": 31, "anchor": "Protective recovery requires the ability to take reactive, responsive, or corrective action"}
    kind: "modal"
    locator: "2.1.2"
    context: "ENGINEERING FOR TRUST"
    statement: "Protective recovery requires the ability to take reactive, responsive, or corrective action to securely transition from an insecure state to a secure state (or a less insecure state). The secure state achieved after completing protective recovery actions includes those actions that limit or prevent any further state transition and those that constitute a type of degraded capability, mode, or operation."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0085"
    citation: {"ref": "SP800-160V1R1", "page": 32, "anchor": "System type, function, and primary purpose"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST These system characteristics can include:"
    statement: "• System type, function, and primary purpose"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0086"
    citation: {"ref": "SP800-160V1R1", "page": 32, "anchor": "System technological, mechanical, physical, and human element characteristics"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ENGINEERING FOR TRUST These system characteristics can include:"
    statement: "• System technological, mechanical, physical, and human element characteristics"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0087"
    citation: {"ref": "SP800-160V1R1", "page": 32, "anchor": "System states and modes of operation"}
    kind: "lettered"
    locator: "2.1.2.•"
