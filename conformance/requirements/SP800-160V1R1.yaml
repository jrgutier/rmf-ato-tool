  - id: "REQ-SP800-160V1R1-0027"
    citation: {"ref": "SP800-160V1R1", "page": 19, "anchor": "There is a growing need to reuse or leverage system implementation successes"}
    kind: "modal"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "There is a growing need to reuse or leverage system implementation successes within operational environments that are different from how they were originally designed and developed. This type of reuse or reimplementation of systems within other operational environments is more efficient and represents potential advantages in maximizing interoperability between various system implementations. It should be noted that reuse may violate the assumptions used to determine that a system or system component was trustworthy."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0028"
