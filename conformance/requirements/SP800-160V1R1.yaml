    context: "DS-1 PREPARE FOR DISPOSAL"
    statement: "- Address security concerns for material, data, and information: The security aspects address protections for sensitive components, technology, data, and information removed from service, dismantled, stored, prepared for reuse, or destroyed. The aspects may include the duration of protection level/state, downgrades, releasability, and criteria that define authorized access and use during the storage period. The protection needs for disposal are defined by stakeholders and agreements and may be subject to regulatory requirements, expectations, and constraints."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0976"
    citation: {"ref": "SP800-160V1R1", "page": 163, "anchor": "Transition the system and system elements for future use: The security aspects"}
    kind: "lettered"
    locator: "H.14.3. Security Activities and Tasks.DS-1.1.-"
    context: "DS-1 PREPARE FOR DISPOSAL"
    statement: "- Transition the system and system elements for future use: The security aspects address the transition of the system or system elements for future use in a modified or adapted form, including legacy migration and return to service. The security aspects may include constraints, limitations, or other criteria to enable recovery of the systems’ functions and services within a specified time or to ensure security-oriented interoperability with future enabling systems and other systems. These aspects may also include periodic inspections to account for the security posture and return-to-service readiness of stored system elements, associated data and information, and all supporting operations and sustainment support materials. The security aspects apply to all system functions and services and are not limited to only security protection-oriented functions and services of the system."
    status: "candidate"
