  - id: "REQ-SP800-160V1R1-0037"
    citation: {"ref": "SP800-160V1R1", "page": 21, "anchor": "This publication is intended to serve as a reference and educational resource"}
    kind: "modal"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "This publication is intended to serve as a reference and educational resource for systems engineers, engineering specialties, architects, designers, and any individuals involved in the development of trustworthy secure systems and system components. It is meant to be flexible in its application to meet the diverse needs of organizations. There is no expectation that all of the technical content in this publication will be used as part of a systems engineering effort. Rather, the concepts and principles for trustworthy secure design in Appendices D through F as well as the systems life cycle processes and security-relevant activities and tasks in Appendices G through K can be selectively employed by organizations – relying on the experience and expertise of the engineering teams to determine what is correct for their purposes. Applying the content of this publication enables the achievement of security outcomes that are consistent with the systems engineering perspective on system life cycle processes."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0038"
    citation: {"ref": "SP800-160V1R1", "page": 21, "anchor": "The system life cycle processes described in this publication can take advantage"}
    kind: "indicative"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "The system life cycle processes described in this publication can take advantage of any system or software development methodology. The processes are equally applicable to waterfall, spiral, DevOps, agile, and other approaches. The processes can be applied recursively, iteratively, concurrently, sequentially, or in parallel and to any system regardless of its size, complexity, purpose, scope, operational environment, or special nature. The full extent of the application of the content in this publication is guided by stakeholder capability needs, protection needs, and concerns with particular attention paid to considerations of cost, schedule, and performance."
    status: "candidate"
