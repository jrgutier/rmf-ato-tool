    statement: "• Determining measures of success"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0217"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "Determining life cycle security concepts52"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS The problem context includes:"
    statement: "• Determining life cycle security concepts52"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0218"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "Protection needs are determined based on the security objectives, life cycle concepts,"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "Protection needs are determined based on the security objectives, life cycle concepts, and stakeholder concerns. The protection needs are subsequently transformed into stakeholder security requirements and associated constraints, as well as the measures needed to validate that all requirements have been met. A well-defined and stakeholder-validated problem definition and context provide the foundation for all systems engineering and systems security engineering and supporting activities."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0219"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "The problem context may be interpreted within a life cycle phase as"}
    kind: "should"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "The problem context may be interpreted within a life cycle phase as being informed by solutions from earlier life cycle stages, thereby providing a more accurate statement of the problem and its associated constraints. For example, the stakeholder requirements may be the solution of an early life cycle phase, which then constrains activities completed in later life cycle stages."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0220"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "The solution context establishes the security aspects and constraints for the architecture"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "The solution context establishes the security aspects and constraints for the architecture and design of the system that (1) satisfies the requirements and objectives of the problem context, (2) realizes the design for the system, and (3) produces sufficient evidence to demonstrate that the requirements and objectives of the problem context have been satisfied.53 The solution context is based on a balanced preemptive and reactive system security protection strategy54 that exercises control over events, conditions, asset loss, and the significance of loss to the degree possible, practicable, and acceptable to stakeholders. The solution context includes:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0221"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "Defining the security aspects of the solution"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS The solution context includes:"
    statement: "• Defining the security aspects of the solution"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0222"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "Realizing the security aspects of the solution"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS The solution context includes:"
    statement: "• Realizing the security aspects of the solution"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0223"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "The term life cycle security concept refers to the processes and activities"}
    kind: "modal"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS The solution context includes:"
    statement: "The term life cycle security concept refers to the processes and activities associated with the system throughout the life cycle (from concept development through retirement) with specific security considerations. It is an extension of the concept of operation and includes the processes and activities related to development, prototyping, assessment of alternative solutions, training, logistics, maintenance, sustainment, evolution, modernization, refurbishment, and disposal. Each life cycle concept has one or more security considerations and constraints that must be fully integrated into the life cycle to ensure that the system security objectives can be met. Life cycle security concepts include those applied during acquisition and program management. Life cycle security concepts can affect such things as Requests for Information, Requests for Proposal, Statements of Work, source selections, development and test environments, operating environments, supply chains, supporting infrastructures, distribution, logistics, maintenance, training, clearances, and background checks."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0224"
    citation: {"ref": "SP800-160V1R1", "page": 50, "anchor": "The system security protection strategy is consistent with the overall concept of"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "The system security protection strategy is consistent with the overall concept of secure function. The concept of secure function, defined during the problem context, constitutes a strategy for a preemptive and reactive protection capability throughout the system life cycle (Section D.2). The strategy has the objective to provide freedom from specific concerns associated with asset loss and loss consequences."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0225"
    citation: {"ref": "SP800-160V1R1", "page": 51, "anchor": "Producing evidence for the security aspects of the solution"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "• Producing evidence for the security aspects of the solution"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0226"
    citation: {"ref": "SP800-160V1R1", "page": 51, "anchor": "The security aspects of the solution include the development of a system"}
    kind: "modal"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "The security aspects of the solution include the development of a system protection strategy; allocated, decomposed, and derived security requirements; security architecture views and viewpoints; security design; security aspects, capabilities, and limitations in the system life cycle procedures; and security performance verification measures. The security aspects of the solution are realized during the implementation of the system design in accordance with the system architecture and in satisfaction of the security requirements. The evidence associated with the security aspects of the solution is obtained with a fidelity and rigor influenced by the level of assurance55 targeted by the security objectives. Assurance evidence is obtained from standard systems engineering verification methods (e.g., analysis, demonstration, inspection, testing, and evaluation) and complementary validation methods applied against the stakeholder requirements. Application of the solution context may be interpreted to provide a part of the solution, constraining the next iteration of the problem context."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0227"
    citation: {"ref": "SP800-160V1R1", "page": 51, "anchor": "Developing and maintaining the assurance case"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS This context consists of:"
    statement: "• Developing and maintaining the assurance case"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0228"
    citation: {"ref": "SP800-160V1R1", "page": 51, "anchor": "Demonstrating that the assurance case is satisfied"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS This context consists of:"
    statement: "• Demonstrating that the assurance case is satisfied"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0229"
    citation: {"ref": "SP800-160V1R1", "page": 51, "anchor": "Assurance cases are used to demonstrate that a system exhibits some complex"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "Assurance cases are used to demonstrate that a system exhibits some complex emergent property, such as safety, security, resilience, reliability, or survivability. An effective security assurance case contains foundational security claims derived from security objectives, credible and relevant evidence that substantiates the claims, and valid arguments that relate the various evidence to the supported security claims. The result provides a compelling statement that adequate security has been achieved and driven by stakeholder needs and expectations."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0230"
    citation: {"ref": "SP800-160V1R1", "page": 51, "anchor": "Assurance cases typically include supporting information, such as assumptions, constraints, and inferences"}
    kind: "modal"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "Assurance cases typically include supporting information, such as assumptions, constraints, and inferences that affect the reasoning process. As part of assurance case development, subject-matter expert analyses determine that all security claims are substantiated by the evidence and the arguments relating the evidence to the claims. Assurance cases must be maintained in response to variances throughout the engineering effort."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0231"
    citation: {"ref": "SP800-160V1R1", "page": 52, "anchor": "The specific form of an assurance case and the level of rigor"}
    kind: "modal"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "The specific form of an assurance case and the level of rigor and formality in acquiring the evidence required is a trade space consideration. It involves the target (i.e., desired) level of assurance, the nature of the consequences for which assurance is sought, and the size and complexity of the dimensions that factor into determining trustworthiness. The assurance case is an engineering construct and must be managed to ensure that the expended effort is justified by the need for the evidence in determining trustworthiness. The assurance claims are the key trustworthiness factor and are developed from the security objectives and associated measures of success independent of the system realization and its supporting evidence. Trustworthiness and assurance are discussed further in Appendix F."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0232"
    citation: {"ref": "SP800-160V1R1", "page": 52, "anchor": "Establishing the problem, solution, and trustworthiness contexts as key components of a"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SYSTEMS SECURITY ENGINEERING FRAMEWORK – WHY IT MATTERS"
    statement: "Establishing the problem, solution, and trustworthiness contexts as key components of a systems security engineering framework helps ensure that the security of a system is based on achieving a sufficiently complete understanding of the problem as defined by a set of stakeholder security objectives, security concerns, protection needs, and security requirements. This understanding is essential to developing effective security solutions – that is, a system that is sufficiently trustworthy and adequately secure to protect stakeholder’s assets in terms of loss and the associated consequences."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0233"
    citation: {"ref": "SP800-160V1R1", "page": 80, "anchor": "Security policy rules are stated in terms of authorized relationships that involve"}
    kind: "modal"
    locator: "C.1.1. Rules"
    context: ""
    statement: "Security policy rules are stated in terms of authorized relationships that involve subjects (i.e., active entities) and objects (i.e., passive entities). The rules govern the operations that a subject can perform or invoke on other subjects (i.e., subject-to-subject operations) and the operations that a subject can perform or invoke on objects (i.e., subject-to-object operations). The rules must be accurate, consistent, compatible, and complete with respect to stakeholder security objectives within the defined scope of control. Inaccurate, inconsistent, incompatible, or incomplete rule sets will allow undesired behavior and outcomes."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0234"
    citation: {"ref": "SP800-160V1R1", "page": 80, "anchor": "Security Policy (Protection) Objectives: A set of objectives that captures a preferred"}
    kind: "lettered"
    locator: "C.1.2. Scope of Control.•"
    context: "A typical scope of applicability includes:"
    statement: "• Security Policy (Protection) Objectives: A set of objectives that captures a preferred state or what is to be achieved. These objectives include assets to be protected, statements of intent to protect the assets within the specific scope of stakeholder responsibility, and the protection scope. Security policy objectives are the basis for deriving all other security policy forms."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0235"
    citation: {"ref": "SP800-160V1R1", "page": 80, "anchor": "Organizational Security Policy: A set of rules59 that regulates how an organization"}
    kind: "lettered"
    locator: "C.1.2. Scope of Control.•"
    context: "A typical scope of applicability includes:"
    statement: "• Organizational Security Policy: A set of rules59 that regulates how an organization achieves its objectives. The rules provide individuals with a reasonable ability to determine whether their actions either violate or comply with the security policy. Organizational security policy defines the individual’s behavior in performing their missions and business functions and is used for developing processes and procedures."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0236"
    citation: {"ref": "SP800-160V1R1", "page": 80, "anchor": "This appendix discusses policy in a manner that suggests policy precedes engineering."}
    kind: "modal"
    locator: "C.1.2. Scope of Control"
    context: "A typical scope of applicability includes:"
    statement: "This appendix discusses policy in a manner that suggests policy precedes engineering. However, policy may need to be modified to align with the capabilities of the delivered as-is system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0237"
    citation: {"ref": "SP800-160V1R1", "page": 80, "anchor": "The rules may be captured in laws and practices."}
    kind: "should"
    locator: "C.1.2. Scope of Control"
    context: ""
    statement: "The rules may be captured in laws and practices."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0238"
    citation: {"ref": "SP800-160V1R1", "page": 81, "anchor": "System Security Policy: A policy that specifies the system security capability. It"}
    kind: "lettered"
    locator: "C.1.2. Scope of Control.•"
    context: ""
    statement: "• System Security Policy: A policy that specifies the system security capability. It is the set of restrictions and properties that specifies how a system enforces or contributes to enforcing organizational security policy."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0239"
    citation: {"ref": "SP800-160V1R1", "page": 81, "anchor": "Personnel Security Policy: A policy that defines the expectations of personnel.60 These"}
    kind: "lettered"
    locator: "C.1.2. Scope of Control.•"
    context: ""
    statement: "• Personnel Security Policy: A policy that defines the expectations of personnel.60 These include the behaviors of the personnel using or sustaining the system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0240"
    citation: {"ref": "SP800-160V1R1", "page": 81, "anchor": "A requirement is a statement that translates or expresses a specific need"}
    kind: "indicative"
    locator: "C.2. Security Requirements"
    context: ""
    statement: "A requirement is a statement that translates or expresses a specific need and its associated constraints and conditions.61 Security requirements translate or express protection needs (Section 3.7), associated constraints, and associated conditions. The constraints also reflect concerns about the system functions, system architecture, and design to ensure that they are specified in a manner that avoids and reduces susceptibilities, defects, flaws, and weaknesses (Section 3.8) and is consistent with the needs of active security functions."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0241"
    citation: {"ref": "SP800-160V1R1", "page": 81, "anchor": "Requirements can be categorized as (1) stakeholder requirements that address the need"}
    kind: "modal"
    locator: "C.2. Security Requirements"
    context: ""
    statement: "Requirements can be categorized as (1) stakeholder requirements that address the need to be satisfied in a design-independent manner and (2) system requirements that express the specific solution that will be delivered (design-dependent manner). Figure 12 illustrates the two types of requirements and their relationship to the verification and validation of the system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0242"
    citation: {"ref": "SP800-160V1R1", "page": 82, "anchor": "Security requirements and security-relevant constraints and conditions on other requirements are informed"}
    kind: "indicative"
    locator: "C.2. Security Requirements"
    context: ""
    statement: "Security requirements and security-relevant constraints and conditions on other requirements are informed by various items, such as those pictured in Figure 13."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0243"
    citation: {"ref": "SP800-160V1R1", "page": 82, "anchor": "The protection needed for the mission or business, data, information, processes, functions,"}
    kind: "lettered"
    locator: "C.2.1. Stakeholder Security Requirements.•"
    context: "These requirements specify:"
    statement: "• The protection needed for the mission or business, data, information, processes, functions, humans, and system assets"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0244"
    citation: {"ref": "SP800-160V1R1", "page": 82, "anchor": "The roles, responsibilities, and security-relevant actions of individuals who perform and support"}
    kind: "lettered"
    locator: "C.2.1. Stakeholder Security Requirements.•"
    context: "These requirements specify:"
    statement: "• The roles, responsibilities, and security-relevant actions of individuals who perform and support the mission or business processes"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0245"
    citation: {"ref": "SP800-160V1R1", "page": 82, "anchor": "The interactions between the security-relevant solution elements"}
    kind: "lettered"
    locator: "C.2.1. Stakeholder Security Requirements.•"
    context: "These requirements specify:"
    statement: "• The interactions between the security-relevant solution elements"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0246"
    citation: {"ref": "SP800-160V1R1", "page": 82, "anchor": "The assurance that is to be obtained in the security solution"}
    kind: "lettered"
    locator: "C.2.1. Stakeholder Security Requirements.•"
    context: "These requirements specify:"
    statement: "• The assurance that is to be obtained in the security solution Systems security considerations within activities and tasks such as those described in Appendices H, I, J, and K provide the security perspective to ensure that stakeholder security requirements are included in the stakeholder requirements and that the stakeholder security requirements are consistent with all other stakeholder requirements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0247"
    citation: {"ref": "SP800-160V1R1", "page": 83, "anchor": "System requirements specify the technical view of a system or solution that"}
    kind: "modal"
    locator: "C.2.2. System Security Requirements"
    context: ""
    statement: "System requirements specify the technical view of a system or solution that meets the specified stakeholder needs. The system requirements are a transformation of the validated stakeholder requirements. System requirements specify what the system or solution must do to satisfy the stakeholder requirements. System security requirements are those system requirements that have security relevance. These requirements define:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0248"
    citation: {"ref": "SP800-160V1R1", "page": 83, "anchor": "The protection capabilities provided by the security solution"}
    kind: "lettered"
    locator: "C.2.2. System Security Requirements.•"
    context: "These requirements define:"
    statement: "• The protection capabilities provided by the security solution"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0249"
    citation: {"ref": "SP800-160V1R1", "page": 83, "anchor": "The performance and behavioral characteristics exhibited by the security solution"}
    kind: "lettered"
    locator: "C.2.2. System Security Requirements.•"
    context: "These requirements define:"
    statement: "• The performance and behavioral characteristics exhibited by the security solution"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0250"
    citation: {"ref": "SP800-160V1R1", "page": 83, "anchor": "Assurance processes, procedures, and techniques"}
    kind: "lettered"
    locator: "C.2.2. System Security Requirements.•"
    context: "These requirements define:"
    statement: "• Assurance processes, procedures, and techniques"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0251"
    citation: {"ref": "SP800-160V1R1", "page": 83, "anchor": "Constraints on the system and the processes, methods, and tools used to"}
    kind: "lettered"
    locator: "C.2.2. System Security Requirements.•"
    context: "These requirements define:"
    statement: "• Constraints on the system and the processes, methods, and tools used to realize the system"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0252"
    citation: {"ref": "SP800-160V1R1", "page": 84, "anchor": "The evidence required to determine that the system security requirements have been"}
    kind: "lettered"
    locator: "C.2.2. System Security Requirements.•"
    context: "These requirements define:"
    statement: "• The evidence required to determine that the system security requirements have been satisfied62"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0253"
    citation: {"ref": "SP800-160V1R1", "page": 84, "anchor": "Due to the complexity of system security, system security requirements have several"}
    kind: "indicative"
    locator: "C.2.2. System Security Requirements"
    context: "These requirements define:"
    statement: "Due to the complexity of system security, system security requirements have several types and purposes, including (1) structural security requirements that express the passive aspects of the protection capability provided primarily by the system architecture and (2) functional security requirements that express the active aspects of the protection capability provided by engineered features and devices (e.g., security mechanisms, controls, safeguards, inhibits, overrides, and countermeasures). Decomposition of the system security requirements is accomplished as part of the system requirements decomposition and is consistent with the different levels of hierarchical abstraction and forms of the system requirements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0254"
    citation: {"ref": "SP800-160V1R1", "page": 84, "anchor": "Systems operate in secure, insecure, and indeterminant states (Section 3.2). System security"}
    kind: "indicative"
    locator: "C.2.2. System Security Requirements"
    context: "SYSTEM STATES, POLICY, AND REQUIREMENTS"
    statement: "Systems operate in secure, insecure, and indeterminant states (Section 3.2). System security policy and system requirements account for these states and the state transitions, including those that reflect the design principles of Protective Failure and Protective Recovery. For example, requirements capture needs to (1) detect insecure system states;"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0255"
    citation: {"ref": "SP800-160V1R1", "page": 84, "anchor": "detect a transition that will result in an insecure state; (3) transition"}
    kind: "lettered"
    locator: "C.2.2. System Security Requirements.(2)"
    context: "SYSTEM STATES, POLICY, AND REQUIREMENTS"
    statement: "(2) detect a transition that will result in an insecure state; (3) transition to a secure halt state; (4) recover to a reconstituted, reconfigured, or alternative secure operational mode; and if necessary, (5) continue operating within insecure or indeterminant states when other needs override protection needs."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0256"
    citation: {"ref": "SP800-160V1R1", "page": 84, "anchor": "The terms requirements, policy, and mechanisms are often used in an abstract"}
    kind: "indicative"
    locator: "C.3. Distinguishing Requirements, Policy, and Mechanisms"
    context: ""
    statement: "The terms requirements, policy, and mechanisms are often used in an abstract manner that allows them to be considered as synonyms. However, when these terms are used in the context of engineering trustworthy secure systems, they are distinct in their meaning and importance to specifying, realizing, utilizing, and sustaining systems."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0257"
    citation: {"ref": "SP800-160V1R1", "page": 84, "anchor": "The security policy states the behavior that is necessary to achieve a"}
    kind: "modal"
    locator: "C.3. Distinguishing Requirements, Policy, and Mechanisms"
    context: ""
    statement: "The security policy states the behavior that is necessary to achieve a secure condition, whereas a security mechanism is a means to achieve the necessary behavior. The distinction between security policy and security mechanism extends to differentiating security requirements from security policy. Security requirements specify the capability, behavior, and quality attributes exhibited and possessed by security mechanisms as well as the constraints on each. Security policy specifies how the security mechanisms must behave in an operational context and the constraints on those behaviors. From the system standpoint, a human is a system element and may serve as a security mechanism. Therefore, the human is expected to behave as stated by relevant security policy and security requirements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0258"
    citation: {"ref": "SP800-160V1R1", "page": 84, "anchor": "Requirements, policies, and mechanisms have an important dependency relationship. System security requirements"}
    kind: "modal"
    locator: "C.3. Distinguishing Requirements, Policy, and Mechanisms"
    context: ""
    statement: "Requirements, policies, and mechanisms have an important dependency relationship. System security requirements specify the capabilities and behaviors that a security mechanism can provide. A security policy specifies the aspects that a mechanism must enforce to achieve organizational objectives. This means that a secure system cannot be achieved if the security requirements do not fully specify the minimal capability necessary to enforce the security policy. It also means that the satisfaction of requirements alone does not result in a secure system. Verification and validation activities must be done separately and coordinated to ensure the individual and combined correctness and effectiveness of the requirements and policy."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0259"
    citation: {"ref": "SP800-160V1R1", "page": 85, "anchor": "Note that a security mechanism that fully satisfies its system security requirements"}
    kind: "modal"
    locator: "C.3. Distinguishing Requirements, Policy, and Mechanisms"
    context: ""
    statement: "Note that a security mechanism that fully satisfies its system security requirements may be deemed capable of enforcing the security policy that is defined for two different organizations. Each organization will use the same mechanism and configure it to behave in a manner that enforces the rules of their organizational security policy. However, if the organizations were to switch mechanisms and keep the same configuration of the mechanism, they would achieve uncertain results (unless their security policy objectives required the exact same configuration of the mechanism). From this, the following conclusions may be drawn:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0260"
    citation: {"ref": "SP800-160V1R1", "page": 85, "anchor": "Requirements express both the security protections to be provided by security mechanisms"}
    kind: "lettered"
    locator: "C.3. Distinguishing Requirements, Policy, and Mechanisms.•"
    context: "From this, the following conclusions may be drawn:"
    statement: "• Requirements express both the security protections to be provided by security mechanisms and the security-informed constraints to be enforced by security mechanisms."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0261"
    citation: {"ref": "SP800-160V1R1", "page": 85, "anchor": "Security policy determines the behavior and outcomes that are deemed secure."}
    kind: "lettered"
    locator: "C.3. Distinguishing Requirements, Policy, and Mechanisms.•"
    context: "From this, the following conclusions may be drawn:"
    statement: "• Security policy determines the behavior and outcomes that are deemed secure."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0262"
    citation: {"ref": "SP800-160V1R1", "page": 85, "anchor": "For a mechanism to be deemed secure, the mechanism’s capability requirements must"}
    kind: "lettered"
    locator: "C.3. Distinguishing Requirements, Policy, and Mechanisms.•"
    context: "From this, the following conclusions may be drawn:"
    statement: "• For a mechanism to be deemed secure, the mechanism’s capability requirements must be consistent with security policy enforcement rules; the mechanism must satisfy the security requirements; and the mechanism must be configured to behave in a manner defined by the organizational security policy."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0263"
    citation: {"ref": "SP800-160V1R1", "page": 86, "anchor": "A principled system design strengthens trustworthiness claims [2]. The concepts in this"}
    kind: "should"
    locator: "Appendix D. Trustworthy Secure Design"
    context: ""
    statement: "A principled system design strengthens trustworthiness claims [2]. The concepts in this appendix and the principles in Appendix E provide a sound basis for reasoning about a system and enable the demonstration of system trustworthiness. Applying concepts and principles and using other enablers (e.g., standards, specifications, design patterns, security policy models, cryptographic algorithms, security protocols, strength of mechanism, and known adversities) should be planned for, appropriately scoped, and revisited throughout the system life cycle and engineering effort."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0264"
    citation: {"ref": "SP800-160V1R1", "page": 86, "anchor": "The design approach for engineering trustworthy secure systems is intended to establish"}
    kind: "modal"
    locator: "D.1. Design Approach for Trustworthy Systems"
    context: ""
    statement: "The design approach for engineering trustworthy secure systems is intended to establish and maintain the ability to deliver system capabilities at an acceptable level of performance64 while minimizing the occurrence and extent of loss. This approach provides a system structure for optimal employment of the engineered features and devices. The system design must provide the intended behaviors and outcomes, avoid the unintended behaviors and outcomes, prevent loss, and limit loss when it occurs. A trustworthy secure design includes a situational awareness capability and margin65 to account for adversity due to the unknowns and uncertainty inherent in the system and in its operational environment. The situational awareness capability helps to determine accountability for the actions of all users and entities (e.g., audit, logging, event recording) and detect pending and actual failure (e.g., by crossing the threshold of the margins that have been established). The design principle of Anomaly Detection embodies this capability."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0265"
    citation: {"ref": "SP800-160V1R1", "page": 86, "anchor": "Note that human factor elements of trust are not discussed. A system"}
    kind: "modal"
    locator: "D.1. Design Approach for Trustworthy Systems"
    context: ""
    statement: "Note that human factor elements of trust are not discussed. A system may be trustworthy, but a user may not trust it. Similarly, a user may trust an untrustworthy system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0266"
    citation: {"ref": "SP800-160V1R1", "page": 86, "anchor": "The term margin refers to a spare amount, measure, or degree allowed"}
    kind: "indicative"
    locator: "D.1. Design Approach for Trustworthy Systems"
    context: ""
    statement: "The term margin refers to a spare amount, measure, or degree allowed or given for contingencies or special situations. The allowances are carried to account for uncertainties and risks. Two types of margins are used in systems engineering: design margin and operational margin. See the design principle of Loss Margins."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0267"
    citation: {"ref": "SP800-160V1R1", "page": 87, "anchor": "Define the intended behaviors and outcomes for the system67"}
    kind: "lettered"
    locator: "D.1. Design Approach for Trustworthy Systems.•"
    context: ""
    statement: "• Define the intended behaviors and outcomes for the system67"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0268"
    citation: {"ref": "SP800-160V1R1", "page": 87, "anchor": "Identify the system states and conditions that reflect the intended behaviors and"}
    kind: "lettered"
    locator: "D.1. Design Approach for Trustworthy Systems.•"
    context: ""
    statement: "• Identify the system states and conditions that reflect the intended behaviors and outcomes"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0269"
    citation: {"ref": "SP800-160V1R1", "page": 87, "anchor": "Identify the system states and conditions that potentially lead to loss in"}
    kind: "lettered"
    locator: "D.1. Design Approach for Trustworthy Systems.•"
    context: ""
    statement: "• Identify the system states and conditions that potentially lead to loss in the system"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0270"
    citation: {"ref": "SP800-160V1R1", "page": 87, "anchor": "Select and alter the system design to prevent loss to the extent"}
    kind: "lettered"
    locator: "D.1. Design Approach for Trustworthy Systems.•"
    context: ""
    statement: "• Select and alter the system design to prevent loss to the extent practicable (preferred) and limit the loss that does occur (where, when, and to the extent necessary and practicable)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0271"
    citation: {"ref": "SP800-160V1R1", "page": 87, "anchor": "Iterate the above elements to address how the functions that serve to"}
    kind: "lettered"
    locator: "D.1. Design Approach for Trustworthy Systems.•"
    context: ""
    statement: "• Iterate the above elements to address how the functions that serve to prevent or limit loss may fail due to intentional or unintentional reasons"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0272"
    citation: {"ref": "SP800-160V1R1", "page": 88, "anchor": "The preemptive aspect recognizes the conditions under which loss may occur and"}
    kind: "modal"
    locator: "D.1. Design Approach for Trustworthy Systems"
    context: ""
    statement: "The preemptive aspect recognizes the conditions under which loss may occur and addresses the scenarios before loss occurs (i.e., what can happen). If the loss does occur, the results are limited due to system features and actions taken in advance. The preemptive aspect is independent of any specific knowledge of attacks and attacker objectives, instead focusing on what is possible in the system’s life cycle. The reactive aspect recognizes the limits of certainty about what can happen, and that new, unanticipated, and otherwise unforeseen adverse consequences will occur despite proactive planning and instituting of means and methods to control loss and the extent of its consequences. The reactive aspect promotes informed operational decision-making after the system is in use and a loss condition occurs, proactively providing an operations capability to address the loss condition and handle the loss. The reactive aspect complements the preemptive aspect by providing an informed basis and means for an external entity (e.g., a human operator or system) to act when failures occur. Essentially, the reactive aspect is a proactive engineering activity about providing a reactive capability."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0273"
    citation: {"ref": "SP800-160V1R1", "page": 89, "anchor": "An effective design will optimize protection against loss to the extent practical"}
    kind: "modal"
    locator: "D.1. Design Approach for Trustworthy Systems"
    context: ""
    statement: "An effective design will optimize protection against loss to the extent practical while recognizing that losses will occur irrespective of the protections put in place. Optimization decisions across preemptive and reactive approaches must consider assets, stakeholders, concerns, and objectives. Achieving a proper mix requires establishing security objectives and conducting requirements elicitation and analysis to unambiguously ascertain the scope of security in terms of addressing failure and the associated consequences in its preemptive and reactive aspects."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0274"
    citation: {"ref": "SP800-160V1R1", "page": 89, "anchor": "A system is expected to deliver the required capabilities as authorized, as"}
    kind: "should"
    locator: "D.2. Design Considering Emergence"
    context: ""
    statement: "A system is expected to deliver the required capabilities as authorized, as intended, and at the specified level of performance. It should not deliver unauthorized or unintended capabilities. One cause of unintended behaviors and outcomes lies with the concept of emergence. Emergence refers to the behaviors and outcomes that result from how individual system elements compose to form the system beyond the collection of behaviors and outcomes of the individual system elements. This composition is covered in the design principle of Structured Decomposition and Composition and illustrated in Figure 2."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0275"
    citation: {"ref": "SP800-160V1R1", "page": 89, "anchor": "Some emergence is desired and productive; other emergence is not desired or"}
    kind: "modal"
    locator: "D.2. Design Considering Emergence"
    context: ""
    statement: "Some emergence is desired and productive; other emergence is not desired or productive, creating unknown, unforeseen, or adverse effects.68 Engineering trustworthy secure systems seeks to deliver only desired emergence. Trustworthiness judgments are based on the expectation that the system can satisfy the stated capability needs. To achieve this, the design must address emergence at all levels of system abstraction in terms of how the system is decomposed into its constituent elements and how those system elements compose to produce the system. This is covered in the design principle of Compositional Trustworthiness."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0276"
    citation: {"ref": "SP800-160V1R1", "page": 89, "anchor": "The objective of security is to achieve only authorized and intended system"}
    kind: "modal"
    locator: "D.2. Design Considering Emergence"
    context: "SECURITY IS EMERGENT"
    statement: "The objective of security is to achieve only authorized and intended system behaviors and outcomes. This requires a fundamental understanding of how individual system elements are composed into the system as a whole. Systems are designed from that basis of understanding to limit emergent behaviors and outcomes that are not specified (including desired and undesired unspecified behaviors and outcomes)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0277"
    citation: {"ref": "SP800-160V1R1", "page": 89, "anchor": "Emergence may be described in terms of properties exhibited by entities only"}
    kind: "should"
    locator: "D.2. Design Considering Emergence"
    context: "SECURITY IS EMERGENT"
    statement: "Emergence may be described in terms of properties exhibited by entities only when attributed to the whole, not to any individual constituent element."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0278"
    citation: {"ref": "SP800-160V1R1", "page": 90, "anchor": "The security design order of precedence (SecDOP)69 is a design approach with"}
    kind: "modal"
    locator: "D.3. Security Design Order of Precedence"
    context: ""
    statement: "The security design order of precedence (SecDOP)69 is a design approach with the objective of minimizing the system design basis for loss potential. SecDOP emphasizes the importance of establishing a secure structural context for the employment of engineered features and devices. Using a principled engineering approach, the SecDOP eliminates susceptibility, hazard, and vulnerability to the extent practicable, thereby eliminating the associated risk. For those cases in which susceptibility, hazard, or vulnerability cannot be eliminated, the SecDOP reduces the potential of experiencing a loss to an acceptable level within the constraints of cost, schedule, and performance. The SecDOP identifies design alternatives in order of decreasing effectiveness, thus enabling a maximized return on investment."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0279"
    citation: {"ref": "SP800-160V1R1", "page": 90, "anchor": "Eliminate the potential for loss through design selection"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.•"
    context: "The SecDOP alternatives are:"
    statement: "• Eliminate the potential for loss through design selection"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0280"
    citation: {"ref": "SP800-160V1R1", "page": 90, "anchor": "Example: The design selected for a system function of interest results in"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: ""
    statement: "- Example: The design selected for a system function of interest results in the minimum number of external interfaces to other systems and the minimum number of internal interfaces that provide the required functions. Since every interface presents a potential for susceptibility, hazard, and vulnerability, a design selection with the minimum number of interfaces results in less susceptibility, hazard, and vulnerability than a design that includes additional and unnecessary internal and external interfaces."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0281"
    citation: {"ref": "SP800-160V1R1", "page": 90, "anchor": "Note: The design selection also considers the need to accommodate mechanisms that"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: ""
    statement: "- Note: The design selection also considers the need to accommodate mechanisms that provide mediated access and trusted communication as these engineered features and devices are necessary for a secure system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0282"
    citation: {"ref": "SP800-160V1R1", "page": 90, "anchor": "Reduce the potential for loss through design alteration"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.•"
    context: ""
    statement: "• Reduce the potential for loss through design alteration"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0283"
    citation: {"ref": "SP800-160V1R1", "page": 90, "anchor": "Example: The selected design has interfaces and, therefore, has inherent susceptibilities, hazards,"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: ""
    statement: "- Example: The selected design has interfaces and, therefore, has inherent susceptibilities, hazards, and vulnerabilities, both with respect to interactions with the environment and with respect to interactions within the system. The potential for loss can be reduced by altering design to segment functionality that interacts with external entities and influences from functionality strictly within system boundaries."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0284"
    citation: {"ref": "SP800-160V1R1", "page": 90, "anchor": "Note: The design alteration also considers the need to accommodate mechanisms that"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: ""
    statement: "- Note: The design alteration also considers the need to accommodate mechanisms that provide mediated access and trusted communication, as these engineered features and devices are necessary for a secure system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0285"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Incorporate engineered features or devices to control the potential for loss"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.•"
    context: ""
    statement: "• Incorporate engineered features or devices to control the potential for loss"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0286"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Mandatory security features and devices: Mandatory security features and devices apply foundational"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: "Two general types of engineered features and devices employed to address the potential for loss associated with the system function of interest are:"
    statement: "- Mandatory security features and devices: Mandatory security features and devices apply foundational security principles to the interfaces. For example, each interface must have mediated access to control access to and use of the capability and data provided by the interface."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0287"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Function-specific features and devices: Function-specific security features and devices protect against a"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: "Two general types of engineered features and devices employed to address the potential for loss associated with the system function of interest are:"
    statement: "- Function-specific features and devices: Function-specific security features and devices protect against a loss associated with the design’s ability to meet functional requirements and performance parameters. Engineered features such as redundant data and control flows and redundant system elements can supplement the design selection to achieve the required protection. The system may also have engineered features that enable external entities to intervene in the system to address the potential, severity, or extent of loss."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0288"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Provide visibility and feedback to external entities"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.•"
    context: "Two general types of engineered features and devices employed to address the potential for loss associated with the system function of interest are:"
    statement: "• Provide visibility and feedback to external entities"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0289"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "If design alteration, material selection, and engineered features and devices are not"}
    kind: "modal"
    locator: "D.3. Security Design Order of Precedence"
    context: "Two general types of engineered features and devices employed to address the potential for loss associated with the system function of interest are:"
    statement: "If design alteration, material selection, and engineered features and devices are not feasible or do not adequately lower the frequency, potential, severity, or extent of loss caused by the susceptibility, hazard, or vulnerability, employ engineered detection and feedback systems and warning devices to alert external entities to the presence of a susceptible, hazardous, or vulnerable condition; the occurrence of an event that will lead to a loss; or an actual loss event. External entities include operational personnel, monitoring systems, or other systems capable of responding."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0290"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Example: Anomaly detection features can be used to provide situational awareness data"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: ""
    statement: "- Example: Anomaly detection features can be used to provide situational awareness data and warnings to system users."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0291"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Note: The visibility and feedback provided is not of value if the"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: ""
    statement: "- Note: The visibility and feedback provided is not of value if the external entities are not able to respond appropriately. For example, the visibility and feedback must be provided in a timely manner and be in a form that can be interpreted correctly."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0292"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Incorporate signage, procedures, training, and proper equipment"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.•"
    context: ""
    statement: "• Incorporate signage, procedures, training, and proper equipment"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0293"
    citation: {"ref": "SP800-160V1R1", "page": 91, "anchor": "Incorporate procedures, training, signage, and proper equipment where design alternatives, design changes,"}
    kind: "modal"
    locator: "D.3. Security Design Order of Precedence"
    context: ""
    statement: "Incorporate procedures, training, signage, and proper equipment where design alternatives, design changes, and engineered features and devices are not feasible and warning devices cannot adequately lessen the potential, severity, or extent of loss caused by the hazard, susceptibility, or vulnerability. Procedures and training include proper warnings and cautions and may prescribe the use of equipment. The use of signage, procedures, training, and equipment as the only means to reduce the potential, severity, or extent of loss should be avoided."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0294"
    citation: {"ref": "SP800-160V1R1", "page": 92, "anchor": "Example: Procedures and training address the proper use of the system function"}
    kind: "lettered"
    locator: "D.3. Security Design Order of Precedence.-"
    context: ""
    statement: "- Example: Procedures and training address the proper use of the system function of interest, the use of mediated access functions, and the relevant warnings, cautions, and warning systems."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0295"
    citation: {"ref": "SP800-160V1R1", "page": 92, "anchor": "Protection Control Decision Functions: These functions make authorization decisions or take other"}
    kind: "lettered"
    locator: "D.4.1. Roles for Security-Relevant Control.•"
    context: "These functions may be characterized and evaluated by using the following designations:"
    statement: "• Protection Control Decision Functions: These functions make authorization decisions or take other actions for protection control enforcement functions. For example, a function that decides to grant or deny access to a resource based on a request (e.g., from a protection control enforcement function)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0296"
    citation: {"ref": "SP800-160V1R1", "page": 92, "anchor": "Protection Control Enforcement Functions: These functions enforce a constraint to ensure that"}
    kind: "lettered"
    locator: "D.4.1. Roles for Security-Relevant Control.•"
    context: "These functions may be characterized and evaluated by using the following designations:"
    statement: "• Protection Control Enforcement Functions: These functions enforce a constraint to ensure that the system or system element exhibits only authorized and intended behaviors or outcomes. For example, a protection control enforcement function enforces a decision to grant or deny access to a resource."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0297"
    citation: {"ref": "SP800-160V1R1", "page": 93, "anchor": "Protection Control Infrastructure Functions: These functions support and help protection control enforcement"}
    kind: "lettered"
    locator: "D.4.1. Roles for Security-Relevant Control.•"
    context: ""
    statement: "• Protection Control Infrastructure Functions: These functions support and help protection control enforcement and control decision functions fulfill their purposes. The functions also provide data or services or perform operations upon which protection control enforcement and decision functions depend. For example, a protection control infrastructure function includes secure storage, secure communication, and anomaly detection mechanisms."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0298"
    citation: {"ref": "SP800-160V1R1", "page": 93, "anchor": "Other functions, including control functions for other purposes besides protection, can potentially"}
    kind: "indicative"
    locator: "D.4.1. Roles for Security-Relevant Control"
    context: ""
    statement: "Other functions, including control functions for other purposes besides protection, can potentially adversely affect the correct operation of the protection control functions. For the purposes of secure design and evaluation, the functions are designated other system functions. Ideally, these functions should be non-interfering. This non-interference objective may be achieved through assurance with constraints on the requirements, architecture, design, and use of these functions."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0299"
    citation: {"ref": "SP800-160V1R1", "page": 93, "anchor": "To effectively achieve the objectives of trustworthy secure design, mechanisms (i.e., engineered"}
    kind: "modal"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: ""
    statement: "To effectively achieve the objectives of trustworthy secure design, mechanisms (i.e., engineered features and devices) must satisfy four essential design criteria. They must be non-bypassable, evaluatable, always invoked, and tamper-proof [35]. Generally, a design for any control function that provides protection should adhere to these criteria.71 Table 3 briefly describes the essential design criteria."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0300"
    citation: {"ref": "SP800-160V1R1", "page": 93, "anchor": "The argument that any control function should be non-bypassable, evaluatable, always invoked,"}
    kind: "should"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: ""
    statement: "The argument that any control function should be non-bypassable, evaluatable, always invoked, and tamper-proof follows from an in-depth examination of Systems Theoretic Process Analysis (STPA) as described in [36], specifically the discussions on why controls may fail and how to address failure."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0301"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "NON-BYPASSABLE | The mechanism must not be circumventable."}
    kind: "table"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "NON-BYPASSABLE | The mechanism must not be circumventable."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0302"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "EVALUATABLE | EVALUATABLE | The mechanism must be sufficiently small and simple"}
    kind: "table"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "EVALUATABLE | EVALUATABLE | The mechanism must be sufficiently small and simple enough to be assessed to produce adequate confidence in the protection provided, the constraint (or control objective) enforced, and the correct implementation of the mechanism. The assessment includes the analysis and testing needed. (Clear Abstractions, Reduced Complexity, and Structured Decomposition and Composition)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0303"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "ALWAYS INVOKED | The protection provided by a mechanism or feature that"}
    kind: "table"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "ALWAYS INVOKED | The protection provided by a mechanism or feature that is not always invoked is not continuous, and, therefore, a loss may occur while the mechanism or feature is suspended or turned off. (Continuous Protection)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0304"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "TAMPER-PROOF | The mechanism or feature and the data that the mechanism"}
    kind: "table"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "TAMPER-PROOF | The mechanism or feature and the data that the mechanism or feature depends on cannot be modified in an unauthorized manner."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0305"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "The design criteria described above are based on the generalized reference monitor"}
    kind: "modal"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "The design criteria described above are based on the generalized reference monitor concept. The reference monitor concept72 is an abstract model of the necessary and sufficient properties that must be achieved by any mechanism that performs an access mediation control function [21] [37]. The reference monitor concept is a foundational access control concept for assured system design. It is defined as a trustworthy abstract machine that mediates all accesses to objects by subjects [38]. As a concept for an abstract machine, the reference monitor does not address any specific implementation. A reference validation mechanism, which includes a combination of hardware and software, realizes the reference monitor concept to provide the access mediation foundation for a trustworthy secure system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0306"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "The generalized reference monitor concept and the four essential design criteria can"}
    kind: "modal"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "The generalized reference monitor concept and the four essential design criteria can be used effectively as the design basis for individual system elements, collections of elements, networks, and systems where intentional and unintentional adversity can prevent the realization of a loss. The reference monitor concept drives the need for rigor in engineering activities commensurate with the trust to be placed in the system or its constituent system elements.73 The concept describes an abstract model of the necessary properties that must be realized by any mechanism that claims to achieve a constraint or set of constraints and the basis for determining the extent to which the properties are satisfied. A mechanism that achieves successful constraint has two parts: (1) a means to decide whether to constrain or not constrain and (2) enforcement of the decision. Enforcement of the decision must sufficiently:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0307"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "Enforce constraints to achieve only the authorized and intended system behaviors and"}
    kind: "lettered"
    locator: "D.4.2. Essential Design Criteria for Mechanisms.•"
    context: "Table 3. Essential Design Criteria for Mechanisms Enforcement of the decision must sufficiently:"
    statement: "• Enforce constraints to achieve only the authorized and intended system behaviors and outcomes"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0308"
    citation: {"ref": "SP800-160V1R1", "page": 94, "anchor": "Provide self-protection against targeted attacks on the mechanism enforcing the decision (including"}
    kind: "lettered"
    locator: "D.4.2. Essential Design Criteria for Mechanisms.•"
    context: "Table 3. Essential Design Criteria for Mechanisms Enforcement of the decision must sufficiently:"
    statement: "• Provide self-protection against targeted attacks on the mechanism enforcing the decision (including applying the essential design criteria)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0309"
    citation: {"ref": "SP800-160V1R1", "page": 95, "anchor": "Be absent of self-induced, emergent, erroneous, unsafe, and non-assured control actions"}
    kind: "lettered"
    locator: "D.4.2. Essential Design Criteria for Mechanisms.•"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "• Be absent of self-induced, emergent, erroneous, unsafe, and non-assured control actions"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0310"
    citation: {"ref": "SP800-160V1R1", "page": 95, "anchor": "The protection characteristics for mechanisms must account for but not depend on"}
    kind: "modal"
    locator: "D.4.2. Essential Design Criteria for Mechanisms"
    context: "Table 3. Essential Design Criteria for Mechanisms"
    statement: "The protection characteristics for mechanisms must account for but not depend on having detailed knowledge of the capability, means, and methods of an adversary."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0311"
    citation: {"ref": "SP800-160V1R1", "page": 95, "anchor": "The design principle of Protective Failure states that a failure of a"}
    kind: "modal"
    locator: "D.4.3. Security Function Failure Analysis"
    context: ""
    statement: "The design principle of Protective Failure states that a failure of a particular system element should neither result in an unacceptable loss nor invoke another loss scenario. The failure of a security function is of special concern, given the need for security functions to always be invoked and operating correctly. Consequently, failure analyses must be performed during system design to determine the impacts of security function failure on the system capabilities."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0312"
    citation: {"ref": "SP800-160V1R1", "page": 95, "anchor": "Failure analyses consider the assets that may be impacted by security function"}
    kind: "should"
    locator: "D.4.3. Security Function Failure Analysis"
    context: ""
    statement: "Failure analyses consider the assets that may be impacted by security function failure and the associated loss consequences. Failure analyses also consider the function allocation to system elements and the way the system function and element combination interacts with other system function and element combinations, independent of specific events and conditions that might lead to the failure. The principles for trustworthy secure design in Appendix E serve to guide and inform the analyses."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0313"
    citation: {"ref": "SP800-160V1R1", "page": 95, "anchor": "“Each of these [design] requirements [for mechanisms] is significant, for without them,"}
    kind: "modal"
    locator: "D.4.3. Security Function Failure Analysis"
    context: "THE SCIENCE BEHIND SECURITY"
    statement: "“Each of these [design] requirements [for mechanisms] is significant, for without them, the mechanism cannot be considered secure. The [need to be tamper-proof] is obvious, since if the reference validation mechanism can be tampered with, its validity is destroyed, as is any hope of achieving security through it. The [third] requirement of always invoking the reference validation mechanism simply states that if the reference validation is (or must be) suspended for some group of programs, then those programs must be considered part of the security apparatus and be [tamper-proof and evaluatable]. The [evaluatable] requirement is equally important. It states that because the reference validation mechanism is the security mechanism in the system, it must be possible to ascertain that it works correctly in all cases and is always invoked. If this cannot be achieved, then there is no way to know that the reference validation correctly takes place in all cases, and therefore there is no basis for certifying a system as secure.”"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0314"
    citation: {"ref": "SP800-160V1R1", "page": 96, "anchor": "Situational awareness is a foundational security means objective. That is, to achieve"}
    kind: "modal"
    locator: "D.4.4. Situational Awareness"
    context: ""
    statement: "Situational awareness is a foundational security means objective. That is, to achieve other security objectives, situational awareness is necessary and must be accounted for in design. For example:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0315"
    citation: {"ref": "SP800-160V1R1", "page": 96, "anchor": "Mediating access requires situational awareness in cases where rules for granting access"}
    kind: "lettered"
    locator: "D.4.4. Situational Awareness.•"
    context: "For example:"
    statement: "• Mediating access requires situational awareness in cases where rules for granting access involve timing, sequence, state, and other conditions about the system and prior access."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0316"
    citation: {"ref": "SP800-160V1R1", "page": 96, "anchor": "Preventing and limiting loss are informed by comprehensive data and information about"}
    kind: "lettered"
    locator: "D.4.4. Situational Awareness.•"
    context: "For example:"
    statement: "• Preventing and limiting loss are informed by comprehensive data and information about system states and conditions (Anomaly Detection)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0317"
    citation: {"ref": "SP800-160V1R1", "page": 96, "anchor": "Situational awareness requires the ability to accurately detect, capture, record, and analyze"}
    kind: "modal"
    locator: "D.4.4. Situational Awareness"
    context: "For example:"
    statement: "Situational awareness requires the ability to accurately detect, capture, record, and analyze the needed characteristics and details of the system’s behaviors and actions at a frequency and with the granularity necessary to act and/or inform external entities for subsequent action to be taken.74 False positives and false negatives are to be avoided to the extent practicable."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0318"
    citation: {"ref": "SP800-160V1R1", "page": 96, "anchor": "Given the potential consequences of compromises of situational awareness capabilities and wrongful"}
    kind: "modal"
    locator: "D.4.4. Situational Awareness"
    context: ""
    statement: "Given the potential consequences of compromises of situational awareness capabilities and wrongful attribution, the mechanisms used must meet the essential design criteria (Section D.4.2) with the appropriate rigor. The system audit logs and other system records often need stringent protection, such as using Distributed Privilege for access and storing the logs and records in a separate subsystem (Domain Separation)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0319"
    citation: {"ref": "SP800-160V1R1", "page": 96, "anchor": "System design involves trade space decisions. Decision-making about protecting assets is guided"}
    kind: "indicative"
    locator: "D.4.5. Trade Space Considerations"
    context: ""
    statement: "System design involves trade space decisions. Decision-making about protecting assets is guided by a determination of valuation that informs asset criticality and priority (e.g., assessing the positive effect in achieving objectives and the negative effect for any loss associated with an asset). The criticality and priority based on valuation are used in investment decisions on the type, rigor, and expected effectiveness of protection (Commensurate Protection). Decisions may also be guided by the costs and benefits from different design options."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0320"
    citation: {"ref": "SP800-160V1R1", "page": 96, "anchor": "Common organizational actions include (1) responses to security-relevant anomalies, such as remedial"}
    kind: "modal"
    locator: "D.4.5. Trade Space Considerations"
    context: ""
    statement: "Common organizational actions include (1) responses to security-relevant anomalies, such as remedial training for users or replacing the right system component responsible for undesired system behaviors, and (2) audits of system activities, including assessing for suspicious patterns of access that indicate insider threats and to satisfy accountability regulations, such as those required of financial institutions."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0321"
    citation: {"ref": "SP800-160V1R1", "page": 97, "anchor": "The benefits of a design option are determined by its effectiveness in"}
    kind: "should"
    locator: "D.4.5. Trade Space Considerations"
    context: ""
    statement: "The benefits of a design option are determined by its effectiveness in providing the required protection capability, the trustworthiness that can be placed on it, and the loss potential associated with it, given the value, criticality, exposure, and importance of the assets protected. An optimal balance between cost and benefit may be realized by using a less costly combination of engineering activities and system features and functions rather than the use of a single cost-prohibitive activity or security feature or function. Moreover, an adverse performance impact may preclude some security options."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0322"
    citation: {"ref": "SP800-160V1R1", "page": 98, "anchor": "This appendix describes the design principles that serve as the foundation for"}
    kind: "should"
    locator: "Appendix E. Principles for Trustworthy Secure Design"
    context: ""
    statement: "This appendix describes the design principles that serve as the foundation for engineering trustworthy secure systems.75 The principles provide a basis for reasoning about a system. They should not be applied as rules to be complied with, nor should they be prioritized, sequenced, or ordered for prescriptive application or used as a basis for making judgments on conformance."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0323"
    citation: {"ref": "SP800-160V1R1", "page": 98, "anchor": "The use of the design principles is subject to various priorities and"}
    kind: "modal"
    locator: "Appendix E. Principles for Trustworthy Secure Design"
    context: ""
    statement: "The use of the design principles is subject to various priorities and constraints that may restrict or preclude their application within a specific context.76 The principles may conflict with other principles, and that conflict must be understood. In practice, the principles can be satisfied or implemented in various and often equally effective ways. The use of specific principles may change in response to changes and variances in requirements, architecture, design, and risk acceptability. Therefore, their application should be planned for, appropriately scoped, and revisited throughout the engineering effort."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0324"
    citation: {"ref": "SP800-160V1R1", "page": 98, "anchor": "An important objective for security is the reduction of uncertainty regarding the"}
    kind: "modal"
    locator: "Appendix E. Principles for Trustworthy Secure Design"
    context: "KEY SECURITY OBJECTIVE"
    statement: "An important objective for security is the reduction of uncertainty regarding the occurrence and effects of adverse events. Reducing the uncertainty of adverse events is achieved by eliminating hazards, susceptibility, and vulnerability to the extent possible. Where elimination cannot occur, their effects should be controlled to the extent possible. Applying the design principles for trustworthy secure systems is a means of achieving the elimination and control of the hazards, susceptibility, and vulnerability that lead to adverse events [39]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0325"
    citation: {"ref": "SP800-160V1R1", "page": 98, "anchor": "The principles for trustworthy secure design are representative of the practices of"}
    kind: "modal"
    locator: "Appendix E. Principles for Trustworthy Secure Design"
    context: "KEY SECURITY OBJECTIVE"
    statement: "The principles for trustworthy secure design are representative of the practices of the safety, security, reliability, survivability, and resilience communities and the specialty engineering disciplines associated with those communities. Collectively, the goals of these practices represent the end objectives that the system must satisfy for trustworthy control of adverse effects. The principles are grounded in research, development, and application experience starting with the early incorporation of mechanisms into trusted operating systems to today’s components, environments, and systems and are expected to remain universally applicable for new, emerging, and maturing approaches. The concepts and theorems from the disciplines of computer science, computer engineering, systems engineering, control systems, fault/failure tolerance, software engineering, and mathematics – as employed across the communities and specialties – constitute the means to achieve the end objectives.77 The principles for trustworthy secure design are listed in Table 4."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0326"
    citation: {"ref": "SP800-160V1R1", "page": 98, "anchor": "For example, trustworthiness requires that mechanisms be evaluatable (Section D.4.2). Consequently, many"}
    kind: "should"
    locator: "Appendix E. Principles for Trustworthy Secure Design"
    context: "KEY SECURITY OBJECTIVE"
    statement: "For example, trustworthiness requires that mechanisms be evaluatable (Section D.4.2). Consequently, many principles deal with reducing and managing complexity and creating systems that can be more easily evaluated. See [41] for discussions on how systems may be too complex to be analyzed for adequate assurance."
    status: "candidate"
