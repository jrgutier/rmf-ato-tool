  - {"page": 152, "locator": "References: [4] [30] [61] [98] [99].TR-2.2", "reason": "no-marker", "text": "Note: Secure delivery considers the various forms, means, and methods that accomplish the end-to-end transport of system elements to ensure that they are not tampered with during transport. Items and packages are delivered only to the intended recipient, which may mean shipping with more lead time to account for additional security."}
  - {"page": 152, "locator": "References: [4] [30] [61] [98] [99].TR-2.4", "reason": "no-marker", "text": "Note: The installation and connection procedures are to be properly verified to provide confidence that the intended system configuration across all system modes and states is achieved. This includes completing acceptance tests defined in agreements. These tests include security aspects associated with physical connections between the system and the environment."}
  - {"page": 153, "locator": "References: [4] [30] [61] [98] [99].TR-2.6", "reason": "no-marker", "text": "Note: Security activation and checkout shows that the system can initialize to its initial secure operational state for all defined modes of operation and accounts for all interconnections to other systems across physical, virtual, and wireless interfaces."}
  - {"page": 153, "locator": "References: [4] [30] [61] [98] [99].TR-2.10", "reason": "no-marker", "text": "Note: This includes providing security support to users and operators at the time of the system commissioning."}
  - {"page": 153, "locator": "H.11. Validation", "reason": "no-marker", "text": "The purpose of the Validation process is to provide objective evidence that the system, when in use, fulfills its business or mission objectives and stakeholder requirements, achieving its intended use in its intended operational environment."}
  - {"page": 153, "locator": "H.11. Validation", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 154, "locator": "H.11.3. Security Activities and Tasks.VA-1.1", "reason": "no-marker", "text": "Note: The security aspects of validation focus on the stakeholders’ protection needs, concerns, and associated security requirements. The scope includes system elements, the entire system, or any artifact that impacts the stakeholder’s confidence in the system and the decision to accept the system as being trustworthy for its intended use."}
  - {"page": 154, "locator": "H.11.3. Security Activities and Tasks.VA-1.2", "reason": "no-marker", "text": "Note: Constraints may include the level of assurance and the availability of business or mission stakeholders to support validation activities; the availability of sufficient, relevant, and credible threat data; the limits on conducting validation activities in actual operational conditions across all business and mission modes and associated system states and modes; the technology employed; the size and complexity of the system element or artifact; and the cost and time allotted for validation activities."}
  - {"page": 155, "locator": "H.11.3. Security Activities and Tasks.VA-1.4", "reason": "no-marker", "text": "Note: The security aspects of the validation strategy address the approach to incorporate security considerations into all validation actions, while considering the trade-offs between scope, depth, and rigor needed for the desired level of assurance and the given constraints."}
  - {"page": 155, "locator": "H.11.3. Security Activities and Tasks.VA-1.5", "reason": "no-marker", "text": "Note: These constraints are associated with the clarity and accuracy of the expression of needs and requirements to achieve the desired level of assurance with certainty and repeatability."}
  - {"page": 155, "locator": "References: [4] [30] [61] [86] [97] [98] [99] [100] [118].VA-2.2", "reason": "no-marker", "text": "Note 1: Security-focused validation actions from the execution of validation procedures contribute to demonstrating that the system is sufficiently trustworthy."}
  - {"page": 155, "locator": "References: [4] [30] [61] [86] [97] [98] [99] [100] [118].VA-2.2", "reason": "no-marker", "text": "Note 2: The performance of a security-focused validation action consists of capturing a result from the execution of the procedure, comparing the obtained result with the expected result, deducing the degree of compliance of the element, and deciding about the acceptability of compliance if uncertainty remains."}
  - {"page": 155, "locator": "References: [4] [86] [97] [100] [118].VA-3.1", "reason": "no-marker", "text": "Note: The recorded validation results include nonconformance issues, anomalies, or problems that are potentially security related. These results inform the analyses to determine causes and enable corrective or improvement actions. Corrective actions may affect the security aspects of the system architecture definition, design definition, system security requirements and associated constraints, the level of assurance that can be obtained, and/or the implementation strategy, including its security aspects."}
  - {"page": 156, "locator": "H.12. Operation", "reason": "no-marker", "text": "The purpose of the Operation process is to use the system to deliver its services."}
  - {"page": 156, "locator": "H.12. Operation", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 157, "locator": "H.12.3. Security Activities and Tasks.OP-1.1", "reason": "no-marker", "text": "Note 1: This includes the approach to enable the continuous secure operation and use of the system and its security services, as well as the provision of support to operations elements to address anomalies identified during the operation and use of the system. It also includes:"}
  - {"page": 157, "locator": "H.12.3. Security Activities and Tasks.OP-1.6", "reason": "no-marker", "text": "Note: Security qualification and training includes role and function-oriented competency, proficiency, certification, and other criteria to securely operate and use the system in all of its defined modes or states."}
  - {"page": 158, "locator": "H.12.3. Security Activities and Tasks.OP-1.7", "reason": "no-marker", "text": "References: [4] [86] [100] [111] [112] [113] [114]"}
  - {"page": 158, "locator": "H.12.3. Security Activities and Tasks.OP-2.2", "reason": "no-marker", "text": "Note 2: Operational personnel may perform system modification and support activities, such as software updates."}
  - {"page": 158, "locator": "H.12.3. Security Activities and Tasks.OP-2.4", "reason": "no-marker", "text": "Note: System monitoring includes reviewing whether the performance is within established security-relevant thresholds (loss margins), periodic instrument readings are acceptable, and service and response times are acceptable. Operator feedback and suggestions are useful input for improving the security aspects of system operational performance."}
  - {"page": 158, "locator": "H.12.3. Security Activities and Tasks.OP-2.5", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100]"}
  - {"page": 158, "locator": "H.12.3. Security Activities and Tasks.OP-3.1", "reason": "no-marker", "text": "Note: Anomalies include those associated with the operation strategy, the operation of enabling systems, the execution of the operation, and incorrect system definition, all of which may be due to security issues or may result in security issues."}
  - {"page": 158, "locator": "H.12.3. Security Activities and Tasks.OP-3.4", "reason": "no-marker", "text": "References: [4] [30] [61] [98] [99] [100]"}
  - {"page": 159, "locator": "H.12.3. Security Activities and Tasks.OP-4.1", "reason": "no-marker", "text": "Note: Assistance and consultation includes the provision or recommendation of sources for security-relevant training, security aspects of documentation, vulnerability resolution, security reporting, and other security-relevant support services that enable the effective and secure use of the product or service."}
  - {"page": 159, "locator": "H.12.3. Security Activities and Tasks.OP-4.3", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 159, "locator": "H.13. Maintenance", "reason": "no-marker", "text": "The purpose of the Maintenance process is to sustain the capability of the system to provide a product or service."}
  - {"page": 159, "locator": "H.13. Maintenance", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 159, "locator": "H.13.1. Security Purpose", "reason": "no-marker", "text": "Note: Secure sustainment includes all maintenance and logistics activities for the packaging, handling, storage, and transportation of replacement system elements."}
  - {"page": 159, "locator": "MA-1 PREPARE FOR MAINTENANCE AND LOGISTICS.MA-1.1", "reason": "no-marker", "text": "Note: The maintenance strategy seeks to preserve the secure capability and performance of the delivered system. The security aspects of the maintenance strategy generally include:"}
  - {"page": 160, "locator": "MA-1 PREPARE FOR MAINTENANCE AND LOGISTICS.MA-1.7", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100] [111] [112] [113] [114] [115]"}
  - {"page": 161, "locator": "MA-2 PERFORM MAINTENANCE.MA-2.1", "reason": "no-marker", "text": "Note: Security-relevant maintenance needs include those needs that are direct (e.g., an identified security incident) or indirect (e.g., considerations to securely address a maintenance need)."}
  - {"page": 161, "locator": "MA-2 PERFORM MAINTENANCE.MA-2.4", "reason": "no-marker", "text": "Note: Secure restoration means that the maintenance action itself does not worsen the secure state or condition of the system."}
  - {"page": 161, "locator": "MA-2 PERFORM MAINTENANCE.MA-2.7", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100] [114] [115]"}
  - {"page": 161, "locator": "MA-3 PERFORM LOGISTICS SUPPORT.MA-3.3", "reason": "no-marker", "text": "Note 1: These mechanisms enable secure packaging, handling, storage, and transportation."}
  - {"page": 161, "locator": "MA-3 PERFORM LOGISTICS SUPPORT.MA-3.3", "reason": "no-marker", "text": "Note 2: These mechanisms aid in the prevention and detection of counterfeits, tampering, substitution, and redirection."}
  - {"page": 161, "locator": "MA-3 PERFORM LOGISTICS SUPPORT.MA-3.4", "reason": "no-marker", "text": "References: [4] [30] [61] [98] [99] [100] [111] [112] [113] [114] [115]"}
  - {"page": 162, "locator": "MA-4 MANAGE RESULTS OF MAINTENANCE AND LOGISTICS.MA-4.6", "reason": "no-marker", "text": "References: [4] [30] [61] [98] [99] [100] [114] [115] [116]"}
  - {"page": 162, "locator": "H.14. Disposal", "reason": "no-marker", "text": "The purpose of the Disposal process is to end the existence of a system element or system for a specified intended use, appropriately handle replaced or retired elements and any waste products, and properly attend to identified critical disposal needs (e.g., per an agreement, per organizational policy, or for environmental, legal, safety, or security aspects)."}
  - {"page": 162, "locator": "H.14. Disposal", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 162, "locator": "H.14.3. Security Activities and Tasks.DS-1.1", "reason": "no-marker", "text": "Note: The security aspects address securely terminating system functions and services, transforming the system and environment into an acceptable secure state, addressing security concerns, and transitioning the system and system elements for future use. The disposal strategy determines approaches, schedules, resources, specific considerations of secure disposal, and the effectiveness and completeness of secure disposal and disposition actions."}
  - {"page": 163, "locator": "H.14.3. Security Activities and Tasks.DS-1.7", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 164, "locator": "H.14.3. Security Activities and Tasks.DS-2.4", "reason": "no-marker", "text": "Note: Secure disassembly preserves the security characteristics of the system elements that are not removed."}
  - {"page": 164, "locator": "H.14.3. Security Activities and Tasks.DS-2.6", "reason": "no-marker", "text": "Note 1: Governing agreements, laws, and regulations determine the appropriate means to sanitize and destroy data, information, and system elements that contain data and information, as well as retention periods before sanitization and destruction can occur."}
  - {"page": 164, "locator": "H.14.3. Security Activities and Tasks.DS-2.6", "reason": "no-marker", "text": "Note 2: Sanitization and destruction techniques include clearing, purging, cryptographic erase, physical modification, and physical destruction."}
  - {"page": 164, "locator": "H.14.3. Security Activities and Tasks.DS-2.6", "reason": "no-marker", "text": "Note 3: Sanitization and destruction techniques and methods may be specific to data, information, and system element type."}
  - {"page": 164, "locator": "H.14.3. Security Activities and Tasks.DS-2.6", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 164, "locator": "H.14.3. Security Activities and Tasks.DS-3.4", "reason": "short", "text": "References: [4] [100]"}
  - {"page": 165, "locator": "Appendix I. Technical Management Processes", "reason": "no-marker", "text": "This appendix contains the Technical Management Processes from [4] with security-relevant considerations and contributions for the purpose, outcomes, activities, and tasks."}
  - {"page": 165, "locator": "I.1. Project Planning", "reason": "no-marker", "text": "The purpose of the Project Planning process is to produce and coordinate effective and workable plans."}
  - {"page": 165, "locator": "I.1. Project Planning", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-1.5", "reason": "no-marker", "text": "Note: Entry criteria, inputs, process sequence constraints, and Measures of Effectiveness and/or Measures of Performance attributes may all have security aspects."}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-1.5", "reason": "no-marker", "text": "References: [4][30] [61] [86] [96] [98] [99] [100] [111] [112] [113] [123]"}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-2.1", "reason": "no-marker", "text": "Note: This includes security aspects that impact the definition of the duration, relationship, dependencies, and sequence of activities; achievement milestones; resources employed; reviews (including security subject matter expertise employed); and schedule reserves for security risk management necessary to achieve timely completion of the project."}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-2.2", "reason": "no-marker", "text": "Note: This includes the criteria defined by regulatory, certification, evaluation, and other approval authorities."}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-2.5", "reason": "no-marker", "text": "Note: This includes defining the project organization, staff acquisitions, and development of staff security-relevant skills. Authorities include legally responsible roles and individuals, as appropriate. These security-relevant authorities include security design authorization, security test and operation authorization, and the award of certification, accreditation, or authorization."}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-2.6", "reason": "no-marker", "text": "Note: This includes defining the capacity needed for security infrastructure and services, its availability, and its allocation to project tasks. Security infrastructure includes facilities (e.g., Sensitive Compartmented Information Facilities [SCIFs] and isolated networks), specific strength of mechanism mediated access, cross-domain solutions, tools, communication, and information technology assets."}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-2.8", "reason": "no-marker", "text": "Note: Security considerations and the planning to address those considerations are captured in a Systems Engineering Management Plan, Software Engineering Management Plans, and similar plans."}
  - {"page": 166, "locator": "I.1.3. Security Activities and Tasks.PL-2.8", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100] [111] [112] [113]"}
  - {"page": 167, "locator": "I.1.3. Security Activities and Tasks.PL-3.3", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 167, "locator": "I.2. Project Assessment and Control", "reason": "no-marker", "text": "The purpose of the Project Assessment and Control process is to assess if the plans are aligned and feasible; determine the status of the project, technical, and process performance; and direct execution to help ensure that the performance is within projected budgets according to plans and schedules to satisfy technical objectives."}
  - {"page": 167, "locator": "I.2. Project Assessment and Control", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 167, "locator": "I.2.3. Security Activities and Tasks.PA-1.1", "reason": "no-marker", "text": "Note 1: This includes the planned security assessment methods and time frames, as well as necessary security management and technical reviews."}
  - {"page": 168, "locator": "I.2.3. Security Activities and Tasks.PA-1.1", "reason": "no-marker", "text": "Note 2: Expectations of regulatory, certification, and authorization entities inform the security aspects of the project assessment and control strategy."}
  - {"page": 168, "locator": "I.2.3. Security Activities and Tasks.PA-1.1", "reason": "no-marker", "text": "References: [4] [30] [61] [98] [99] [100]"}
  - {"page": 168, "locator": "I.2.3. Security Activities and Tasks.PA-2.4", "reason": "no-marker", "text": "Note: This includes assessment of the adequacy of personnel competencies to perform project roles and accomplish project tasks."}
  - {"page": 168, "locator": "I.2.3. Security Activities and Tasks.PA-2.6", "reason": "no-marker", "text": "Note: This includes collecting and evaluating security-relevant data for labor, materials, service costs, and technical performance, as well as other technical data about security objectives. These are compared against security-relevant measures of achievement, including conducting effectiveness assessments to determine the adequacy of the evolving system to fulfill security requirements."}
  - {"page": 168, "locator": "I.2.3. Security Activities and Tasks.PA-2.8", "reason": "no-marker", "text": "Note: This includes identifying and evaluating technology maturity from a security perspective, as well as the feasibility of technology insertion for satisfying security objectives."}
  - {"page": 168, "locator": "I.2.3. Security Activities and Tasks.PA-2.9", "reason": "no-marker", "text": "Note: Measurement results are analyzed to identify security-relevant deviations, variations, or undesirable trends from planned values and to make security-relevant recommendations for corrective, preventive, adaptive, additive, or perfective actions."}
  - {"page": 169, "locator": "I.2.3. Security Activities and Tasks.PA-2.11", "reason": "no-marker", "text": "Note: This includes an analysis of process security measures and a review of security-relevant trends with respect to project objectives."}
  - {"page": 169, "locator": "I.2.3. Security Activities and Tasks.PA-2.11", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100]"}
  - {"page": 169, "locator": "I.2.3. Security Activities and Tasks.PA-3.2", "reason": "no-marker", "text": "Note: Replanning is initiated when the security aspects of project objectives or constraints have changed or when security-relevant planning assumptions are shown to be invalid."}
  - {"page": 169, "locator": "I.2.3. Security Activities and Tasks.PA-3.3", "reason": "no-marker", "text": "Note: The security impact is not necessarily obvious when the request is not security-driven or security-oriented."}
  - {"page": 169, "locator": "I.2.3. Security Activities and Tasks.PA-3.4", "reason": "no-marker", "text": "References: [4] [86] [100] [111] [112] [113]"}
  - {"page": 169, "locator": "I.3. Decision Management", "reason": "no-marker", "text": "The purpose of the Decision Management process is to provide a structured, analytical framework for objectively identifying, characterizing, and evaluating a set of alternatives for a decision at any point in the life cycle and select the most beneficial course of action."}
  - {"page": 169, "locator": "I.3. Decision Management", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 170, "locator": "DM-1 PREPARE FOR DECISIONS.DM-1.3", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 170, "locator": "DM-2 ANALYZE THE DECISION INFORMATION.DM-2.1", "reason": "no-marker", "text": "Note: This includes the security-relevant level of rigor and the data and system analysis needed."}
  - {"page": 170, "locator": "DM-2 ANALYZE THE DECISION INFORMATION.DM-2.3", "reason": "no-marker", "text": "Note: If many alternatives exist, security aspects are to qualitatively screen to reduce alternatives to a manageable number for further detailed system analysis."}
  - {"page": 170, "locator": "DM-2 ANALYZE THE DECISION INFORMATION.DM-2.4", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 170, "locator": "DM-3 MAKE AND MANAGE DECISIONS.DM-3.3", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 170, "locator": "I.4. Risk Management", "reason": "no-marker", "text": "The purpose of the Risk Management process is to identify, analyze, treat, and monitor the risks continually."}
  - {"page": 171, "locator": "I.4. Risk Management", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 171, "locator": "I.4.3. Security Activities and Tasks.RM-1.1", "reason": "no-marker", "text": "Note 1: The nature of security risk includes intentional and unintentional casual events, considerations of the intended behaviors and outcomes, functions (security and other functions), and the potential effects of security risk realization. Casual events may be combinations of events in the operational environment and events in the system environment."}
  - {"page": 171, "locator": "I.4.3. Security Activities and Tasks.RM-1.1", "reason": "no-marker", "text": "Note 2: The security aspects scope of the risk management process, risk management approach, risk criteria, measures, parameters, rating scale, and treatment alternatives are defined. This includes security aspects of the risk management process at all levels of the supply chain (e.g., suppliers, subcontractors) and how they are incorporated into the project risk management process."}
  - {"page": 171, "locator": "I.4.3. Security Activities and Tasks.RM-1.1", "reason": "no-marker", "text": "Note 3: The strategy can include those security-relevant issues (i.e., risks with a likelihood of occurrence of 1) and opportunities (i.e., risks with positive outcomes) within scope and approach. Opportunity aspects include opportunity criteria, measures, parameters, rating scale, and treatment alternatives."}
  - {"page": 171, "locator": "I.4.3. Security Activities and Tasks.RM-1.2", "reason": "no-marker", "text": "Note 1: This includes the identification of security-relevant stakeholders and descriptions of their perspectives, risk categories, and technical and managerial objectives, assumptions, and constraints."}
  - {"page": 171, "locator": "I.4.3. Security Activities and Tasks.RM-1.2", "reason": "no-marker", "text": "Note 2: Security opportunities provide potential benefits for the system or project. Security contexts consider the security impact of not pursuing an opportunity and the security risk of not achieving the effects provided by the opportunity."}
  - {"page": 172, "locator": "I.4.3. Security Activities and Tasks.RM-1.2", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100] [124] [125]"}
  - {"page": 172, "locator": "I.4.3. Security Activities and Tasks.RM-2.1", "reason": "no-marker", "text": "Note: The security risk thresholds define the levels at which the appropriate treatment strategies are considered."}
  - {"page": 172, "locator": "I.4.3. Security Activities and Tasks.RM-2.3", "reason": "no-marker", "text": "Note: Project planning determines the frequency of communicating the risk profile and its security aspects."}
  - {"page": 172, "locator": "I.4.3. Security Activities and Tasks.RM-2.3", "reason": "no-marker", "text": "References: [4] [86] [100] [124] [125]"}
  - {"page": 172, "locator": "I.4.3. Security Activities and Tasks.RM-3.4", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100] [124] [125]"}
  - {"page": 172, "locator": "I.4.3. Security Activities and Tasks.RM-4.4", "reason": "no-marker", "text": "References: [4] [86] [100] [124] [125]"}
  - {"page": 173, "locator": "I.4.3. Security Activities and Tasks.RM-5.1", "reason": "no-marker", "text": "Note: Changes with security-relevant risks and their treatments may prompt reevaluation. The initial treatment plans for a security-relevant risk may include preplanned additional actions when risk increases or insufficiently decreases despite treatment."}
  - {"page": 173, "locator": "I.4.3. Security Activities and Tasks.RM-5.3", "reason": "no-marker", "text": "Note: This includes monitoring known changes in adversities."}
  - {"page": 173, "locator": "I.4.3. Security Activities and Tasks.RM-5.3", "reason": "no-marker", "text": "References: [4] [30] [61] [86] [98] [99] [100] [124] [125]"}
  - {"page": 173, "locator": "I.5. Configuration Management", "reason": "no-marker", "text": "The purpose of the Configuration Management process is to manage system and system elements and configurations over the life cycle."}
  - {"page": 173, "locator": "I.5. Configuration Management", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 173, "locator": "I.5.3. Security Activities and Tasks.CM-1.1", "reason": "lead-in", "text": "Note: These include:"}
  - {"page": 174, "locator": "I.5.3. Security Activities and Tasks.CM-1.2", "reason": "no-marker", "text": "Note: This includes rules that govern secure retention, access, and use."}
  - {"page": 174, "locator": "I.5.3. Security Activities and Tasks.CM-1.2", "reason": "no-marker", "text": "References: [4] [74] [86] [100] [126] [127]"}
  - {"page": 174, "locator": "I.5.3. Security Activities and Tasks.CM-2.6", "reason": "no-marker", "text": "Note 1: The security aspects of a release are security-relevant considerations of authorization of the use of a system or system element for a specific purpose with or without security-relevant restrictions. Examples are releases for tests or operational use."}
  - {"page": 174, "locator": "I.5.3. Security Activities and Tasks.CM-2.6", "reason": "no-marker", "text": "Note 2: Releases generally include a set of changes made through the Technical Processes. Release approval generally includes acceptance of the verified and validated changes and any impacts to security of the changes."}
  - {"page": 174, "locator": "I.5.3. Security Activities and Tasks.CM-2.6", "reason": "no-marker", "text": "References: [4] [86] [100] [111] [112] [113]"}
  - {"page": 174, "locator": "I.5.3. Security Activities and Tasks.CM-3.1", "reason": "no-marker", "text": "Note 1: This includes requests for deviation, waiver, or concession."}
  - {"page": 175, "locator": "I.5.3. Security Activities and Tasks.CM-3.1", "reason": "no-marker", "text": "Note 2: Change or variance can be based on reasons other than security or without an obvious relevance to security."}
  - {"page": 175, "locator": "I.5.3. Security Activities and Tasks.CM-3.4", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 175, "locator": "I.5.3. Security Activities and Tasks.CM-4.1", "reason": "no-marker", "text": "Note: The information includes security certification, accreditation, authorization, or approval decisions for a system, system element, baseline, or release."}
  - {"page": 175, "locator": "I.5.3. Security Activities and Tasks.CM-4.2", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 175, "locator": "I.5.3. Security Activities and Tasks.CM-5.4", "reason": "no-marker", "text": "Note: This includes the security aspects of the functional configuration audit (FCA) that are focused on functional and performance capabilities and of the physical configuration audit (PCA) that are focused on system conformance to operational and configuration information items."}
  - {"page": 175, "locator": "I.5.3. Security Activities and Tasks.CM-5.5", "reason": "no-marker", "text": "References: [4] [86] [100]"}
  - {"page": 176, "locator": "I.6. Information Management", "reason": "no-marker", "text": "The purpose of the Information Management process is to generate, obtain, confirm, transform, retain, retrieve, disseminate, and dispose of information to designated stakeholders."}
  - {"page": 176, "locator": "I.6. Information Management", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 176, "locator": "I.6.3. Security Activities and Tasks.IM-1.1", "reason": "no-marker", "text": "Note: The security aspects include stakeholder, technical, and other information. These aspects address security, privacy, and intellectual property concerns."}
  - {"page": 177, "locator": "I.6.3. Security Activities and Tasks.IM-1.5", "reason": "no-marker", "text": "References: [4] [86] [100] [128]"}
  - {"page": 177, "locator": "I.6.3. Security Activities and Tasks.IM-2.1", "reason": "no-marker", "text": "Note: Obtaining, developing, and transforming information items includes labeling the items by their protection needs (e.g., classifying)."}
  - {"page": 177, "locator": "I.6.3. Security Activities and Tasks.IM-2.5", "reason": "no-marker", "text": "References: [4] [86] [100] [128] [129]"}
