  - id: "REQ-SP800-160V1R1-0515"
    citation: {"ref": "SP800-160V1R1", "page": 126, "anchor": "The security-relevant considerations and contributions to the system life cycle are provided"}
    kind: "indicative"
    locator: "G.1. Process Overview"
    context: "Table 5. System Life Cycle Processes"
    statement: "The security-relevant considerations and contributions to the system life cycle are provided as systems security engineering tasks. The tasks are aligned with the engineering viewpoints of the life cycle processes and are based on the foundational security and trust principles and concepts described in Chapter Two, Chapter Three, Chapter Four, Appendix C, Appendix D, Appendix E, and Appendix F. The tasks use and leverage the principles, concepts, terms, and practices of systems engineering to help facilitate consistency in their application as part of a systems engineering effort."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0516"
    citation: {"ref": "SP800-160V1R1", "page": 126, "anchor": "The system life cycles processes, activities, and tasks are to be applied"}
    kind: "modal"
    locator: "G.1. Process Overview"
    context: "Table 5. System Life Cycle Processes"
    statement: "The system life cycles processes, activities, and tasks are to be applied as needed. They are not dependent on, oriented to, or presumed to be used or needed in any specific system development methodology. By design, the processes and their activities and tasks can be applied concurrently, iteratively, or recursively at any level in the structural hierarchy of a system with the appropriate fidelity and rigor and at any stage in the system life cycle in accordance with acquisition, systems engineering, or other process models. Using their expertise and experience, practitioners can tailor the system life cycle processes, activities, and tasks to achieve optimized and efficient results.92 Considerations include:"
    status: "candidate"
