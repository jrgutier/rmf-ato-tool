rejected:
  - {"page": 14, "locator": "References", "reason": "leader", "text": "Underlying [the discipline of] engineering is science. Sometimes engineering gets ahead of science, such as in bridge building, where the fundamentals of material science were not well understood. Many bridges were built; many fell down; some stayed up; designs of the ones that stayed up were copied. Eventually, for engineering to advance beyond some point, science must catch up with engineering. The science underlying cybersecurity [and more generally, security] engineering is complex and difficult. On the other hand, there is no time like the present to start, because it is both urgent and important to the future....”"}
  - {"page": 14, "locator": "References", "reason": "no-marker", "text": "-- O. Sami Saydjari Engineering Trustworthy Systems McGraw-Hill, August 2018"}
  - {"page": 15, "locator": "References", "reason": "no-marker", "text": "For system developers, there are also fundamental principles and concepts that can be found in mathematics, computer science, computer and electrical engineering, systems engineering, and software engineering that when properly employed, provide the necessary trustworthiness to engender that same level of confidence. Trustworthy secure systems are achieved by making a significant and substantial investment in strengthening the underlying systems and system components by employing transdisciplinary systems engineering efforts guided and informed by well-defined security requirements and secure architectures and designs. Such efforts have been proven over time to produce sound engineering-based solutions to complex and challenging systems security problems. Only under those circumstances can we build systems that are adequately secure and exhibit a level of trustworthiness that is sufficient for the purpose for which the system was built."}
  - {"page": 15, "locator": "References", "reason": "no-marker", "text": "“Scientists study the world as it is, engineers create the world that never has been.”"}
  - {"page": 15, "locator": "References", "reason": "no-marker", "text": "Theodore von Kármán 1962 National Medal of Science Recipient"}
  - {"page": 16, "locator": "References", "reason": "no-marker", "text": "-- John A. Thomas President, INCOSE INCOSE Insight, July 2013."}
  - {"page": 17, "locator": "References", "reason": "short", "text": "Introduction"}
  - {"page": 17, "locator": "References", "reason": "lead-in", "text": "Peter Neumann described the concept of trustworthiness in [2] as follows:"}
  - {"page": 17, "locator": "References", "reason": "no-marker", "text": "A system is an arrangement of parts or elements that exhibit a behavior or meaning that the individual constituents do not [3]. The elements that compose a system include hardware, software, data, humans, processes, procedures, facilities, materials, and naturally occurring entities [4]."}
  - {"page": 17, "locator": "References", "reason": "no-marker", "text": "The term adversity refers to those conditions that can cause asset loss (e.g., threats, attacks, vulnerabilities, hazards, disruptions, and exposures)."}
  - {"page": 17, "locator": "References", "reason": "no-marker", "text": "The phrasing used in this definition of security is intentional. Ross Anderson noted in [5] that “now that everything’s acquiring connectivity, you can’t have safety without security, and these ecosystems are emerging.” Reflecting on this observation, the security definition was chosen to achieve alignment with a prevailing safety definition."}
  - {"page": 17, "locator": "References", "reason": "short", "text": "Adapted from [6]."}
  - {"page": 18, "locator": "References", "reason": "no-marker", "text": "“Security is embedded in systems. Rather than two engineering groups designing two systems, one intended to protect the other, systems engineering specifies and designs a single system with security embedded in the system and its components.”"}
  - {"page": 18, "locator": "References", "reason": "no-marker", "text": "-- An Objective of Security in the Future of Systems Engineering [7]"}
  - {"page": 18, "locator": "References", "reason": "short", "text": "Purpose and Applicability"}
  - {"page": 18, "locator": "References", "reason": "lead-in", "text": "This publication is intended to:"}
  - {"page": 19, "locator": "References", "reason": "no-marker", "text": "The applicability statement is not meant to limit the technical and management application of these considerations. That is, the security design principles, concepts, and techniques described in this publication are part of a trustworthy secure design approach as described in Appendix D and can be applied in any of the following cases:"}
  - {"page": 19, "locator": "References", "reason": "no-marker", "text": "The engineering effort includes such activities as concept exploration, preliminary or applied research to refine the concepts and/or feasibility of technologies employed in a new system, and an assessment of alternative solutions. This effort is initiated during the concept and development stages of the system life cycle."}
  - {"page": 19, "locator": "References", "reason": "no-marker", "text": "The engineering effort involves migrating or adapting a system or system implementation from one operational environment or set of operating conditions to another operational environment or set of operating conditions.7"}
  - {"page": 20, "locator": "References", "reason": "no-marker", "text": "The engineering effort occurs across a set of constituent systems, each with its own stakeholders, primary purpose, and planned evolution. The composition of the constituent systems into a system of systems as noted in [9] produces a capability that would otherwise be difficult or impractical to achieve. This effort can occur across a variety of system of systems from a relatively informal, unplanned system of systems concept and evolution that emerges over time via voluntary participation to a more formal execution with the most formal being a system of systems concept that is directed, structured, planned, and achieved via a centrally managed engineering effort. Any resulting emergent behavior often introduces opportunities and additional challenges for systems security engineering."}
  - {"page": 20, "locator": "References", "reason": "short", "text": "Target Audience"}
  - {"page": 20, "locator": "References", "reason": "no-marker", "text": "Systems security engineering activities and tasks can be applied to a mechanism, component, system element, system, system of systems, processes, or organizations. Regardless of the size or complexity of the entity, a transdisciplinary systems engineering team is needed to deliver systems that are trustworthy and that satisfy the protection needs and concerns of stakeholders. The processes are intended to be tailored to facilitate effectiveness."}
  - {"page": 21, "locator": "References", "reason": "no-marker", "text": "Organization of this Publication"}
  - {"page": 21, "locator": "References", "reason": "lead-in", "text": "The remainder of this publication is organized as follows:"}
  - {"page": 21, "locator": "References", "reason": "lead-in", "text": "The following sections provide additional information to support the engineering of trustworthy secure systems:"}
  - {"page": 23, "locator": "References", "reason": "short", "text": "Systems Engineering Overview"}
  - {"page": 23, "locator": "References", "reason": "no-marker", "text": "This chapter presents system, systems engineering, trust, and trustworthiness concepts that provide the foundation for engineering trustworthy secure systems."}
  - {"page": 23, "locator": "References", "reason": "short", "text": "System Concepts"}
  - {"page": 23, "locator": "References", "reason": "no-marker", "text": "Many system concepts are important to inform engineering trustworthy secure systems. This includes what constitutes a system, the structure of a system, categories of systems, and the concept of a system of systems."}
  - {"page": 23, "locator": "2.1.1", "reason": "no-marker", "text": "A system9 is an arrangement of parts or elements that together exhibit a behavior or meaning that the individual constituents do not. The properties of a system (i.e., attributes, qualities, or characteristics) emerge from the system’s parts or elements and their individual properties, as well as the relationships and interactions between and among the parts or elements, the system, and its environment [3]. An engineered system is designed or adapted to interact with an anticipated operational environment to achieve one or more intended purposes while complying with applicable constraints [3]. Figure 1 shows the basic structure of a system, including its constituent system elements.10 11"}
  - {"page": 23, "locator": "2.1.1", "reason": "not-a-statement", "text": "Fig. 1. Basic System and System Element Relationship"}
  - {"page": 23, "locator": "2.1.1", "reason": "no-marker", "text": "The purpose of a system is to deliver one or more capabilities. The capabilities may directly or indirectly interact with, control, or monitor physical, mechanical, hydraulic, or pneumatic devices or other systems or capabilities, or it may provide the ability to create, access, manipulate, transmit, store, or share resources, such as data and information."}
  - {"page": 23, "locator": "2.1.1", "reason": "not-a-statement", "text": "Examples of systems include information systems, communications systems, financial systems, manufacturing systems, transportation systems, logistics systems, medical systems, weapons systems, mechanical systems, space systems, industrial control systems (ICS), optical systems, or electrical systems. Systems can be physical or conceptual, use information technology (IT) or operational technology (OT), include humans, be cyber-physical, and leverage Internet of Things (IoT) or other technologies."}
  - {"page": 23, "locator": "2.1.1", "reason": "no-marker", "text": "A system element can be a discrete component, product, service, subsystem, system, organization, human, infrastructure, or enterprise. System elements are implemented by hardware, software, and firmware that perform operations on information or data; physical structures, devices, and components in the operational environment; and the people, processes, and procedures for operating, sustaining, and supporting the elements."}
  - {"page": 23, "locator": "2.1.1", "reason": "no-marker", "text": "Systems with few or no active functions (e.g., physical infrastructure) may also exhibit assured trustworthiness. For example, the interstate highway system employs safety barriers such as Jersey walls (a system element) that contribute to the transportation system’s trustworthiness."}
  - {"page": 24, "locator": "2.1.1", "reason": "not-a-statement", "text": "Figure 2 is a general hierarchical model for the representation of a system. Not all systems, such as networks, are hierarchical in nature. Non-hierarchical systems have models that can more accurately reflect the relationships of their constituent elements. A system element may itself be considered a system (i.e., comprised of other system elements). Realizing a system of interest involves recursively resolving its structure to the point where understandable and manageable system elements can be implemented (i.e., developed, bought, or reused) and subsequently integrating those elements into the system."}
  - {"page": 24, "locator": "2.1.1", "reason": "not-a-statement", "text": "Fig. 2. Model for a System and its Elements"}
  - {"page": 25, "locator": "2.1.2", "reason": "not-a-statement", "text": "Figure 3 illustrates the relationship between the system of interest and its interfacing systems in both operational and non-operational (external) environments."}
  - {"page": 25, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 3. System of Interest and Interfacing Systems"}
  - {"page": 25, "locator": "2.1.2", "reason": "short", "text": "Systems Engineering Foundations"}
  - {"page": 25, "locator": "2.1.2", "reason": "no-marker", "text": "As noted in [11], transdisciplinary approaches reach “beyond disciplines to find and exploit connections to solve complex problems. Transdisciplinary thinking encourages thinking in terms of new relationships among traditionally distinct disciplines and focusing on new concepts that might arise from such thinking.”"}
  - {"page": 25, "locator": "2.1.2", "reason": "no-marker", "text": "Systems science is an interdisciplinary field that studies complex systems in nature, society, and science. It aims to develop interdisciplinary foundations that are applicable in a variety of areas, such as social sciences, engineering, biology, and medicine. Systems thinking is a discipline of examining wholes, interrelationships, and patterns [13]."}
  - {"page": 26, "locator": "2.1.2", "reason": "no-marker", "text": "There are many additional resources available that provide more in-depth examinations of systems engineering.16 Such discussions are beyond the scope of this publication."}
  - {"page": 26, "locator": "2.1.2", "reason": "short", "text": "Trust and Trustworthiness"}
  - {"page": 26, "locator": "2.1.2", "reason": "no-marker", "text": "The International Council on Systems Engineering (INCOSE) notes in [14] that “systems engineering in application is specific to stakeholder needs, solution space, resulting system solution(s), and context throughout the system life cycle” and \"systems engineering influences and is influenced by internal and external resource, political, economic, social, technological, environmental, and legal factors.”"}
  - {"page": 26, "locator": "2.1.2", "reason": "no-marker", "text": "Nomenclature for stages of the system life cycle varies but often includes concept analysis; solution analysis; technology maturation; system design and development; engineering and manufacturing development; production and deployment; training, operations, and support; and retirement and disposal."}
  - {"page": 27, "locator": "2.1.2", "reason": "no-marker", "text": "In January 2022, INCOSE released the Systems Engineering Vision 2035 [16]. It is intended to inspire, guide, and inform the strategic direction for the global systems engineering community. A core element identified for the future state of systems engineering is increased confidence in systems to improve the practice of engineering trusted systems."}
  - {"page": 27, "locator": "2.1.2", "reason": "no-marker", "text": "As noted in [7], a key problem to address in realizing Vision 2035 is that “systems security has moved from its traditional focus on trust to a more singular focus on risk.” The need is to prove a level of system security through evidence-based assurance."}
  - {"page": 28, "locator": "2.1.2", "reason": "short", "text": "System Security Concepts"}
  - {"page": 28, "locator": "2.1.2", "reason": "no-marker", "text": "The Concept of Security"}
  - {"page": 28, "locator": "2.1.2", "reason": "no-marker", "text": "A system that delivers a capability per the design intent but inconsistent with the user intent constitutes a loss. For example, vehicle control loss might result from a failure in the vehicle’s steering control function (i.e., failure to meet the design intent) or through an attack that takes control away from the driver (i.e., failure to meet the user intent)."}
  - {"page": 28, "locator": "2.1.2", "reason": "no-marker", "text": "Intended behaviors include interactions. Relevant interactions include human-to-machine and machine-to-machine interactions. Human-to-machine interactions are transformed into machine-to-machine interactions, whereby a machine element operates on behalf of the human."}
  - {"page": 28, "locator": "2.1.2", "reason": "no-marker", "text": "A security policy is a set of rules that govern security-relevant system and system element behavior (Appendix C)."}
  - {"page": 28, "locator": "2.1.2", "reason": "no-marker", "text": "Life cycle concepts include operation, sustainment, evolution, maintenance, training, startup, and shutdown."}
  - {"page": 29, "locator": "2.1.2", "reason": "no-marker", "text": "The Concept of an Adequately Secure System"}
  - {"page": 29, "locator": "2.1.2", "reason": "no-marker", "text": "Adequate security is a concept that enables meaningful judgments about the idealistic nature of security objectives. The definition of security expresses an ideal that encapsulates three essential characteristics of a secure system:"}
  - {"page": 29, "locator": "2.1.2", "reason": "no-marker", "text": "Active entities exhibit behavior (e.g., a process in execution) while passive entities do not (e.g., data, file)."}
  - {"page": 29, "locator": "2.1.2", "reason": "no-marker", "text": "Privileges are also referred to as authorizations or rights."}
  - {"page": 29, "locator": "2.1.2", "reason": "no-marker", "text": "The concept of adequately secure is an adaptation of the concept of adequately safe from [23]."}
  - {"page": 29, "locator": "2.1.2", "reason": "no-marker", "text": "Below such levels, the system is considered insecure."}
  - {"page": 30, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 4. System Security and Cost/Schedule/Technical Performance"}
  - {"page": 31, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 5. Idealized Notional Secure System State Transitions"}
  - {"page": 32, "locator": "2.1.2", "reason": "short", "text": "Characteristics of Systems"}
  - {"page": 32, "locator": "2.1.2", "reason": "no-marker", "text": "The characteristics of systems, their interrelationships with other systems, and their roles within a system of systems all impact security and determinations of adequate security and system trustworthiness. These system characteristics can include:"}
  - {"page": 32, "locator": "2.1.2", "reason": "no-marker", "text": "The Concept of Assets"}
  - {"page": 32, "locator": "2.1.2", "reason": "no-marker", "text": "An asset is an item of value. There are many different types of assets. Assets are broadly categorized as either tangible or intangible. Tangible assets include physical items, such as hardware, computing platforms, other technology components, and humans. Intangible assets include humans, firmware, software, capabilities, functions, services, trademarks, intellectual property, data, copyrights, patents, image, or reputation.28 Within asset categories, assets can be further identified and described in terms of common asset classes as illustrated in Table 1."}
  - {"page": 32, "locator": "2.1.2", "reason": "no-marker", "text": "To the extent feasible, self-protection is a required capability that enables the system to deliver the required stakeholder capabilities while also protecting their assets against loss and the consequences of loss."}
  - {"page": 32, "locator": "2.1.2", "reason": "no-marker", "text": "Humans are perhaps the most important and valuable of all intangible assets. Safety and security explicitly consider the human asset."}
  - {"page": 32, "locator": "2.1.2", "reason": "no-marker", "text": "Adapted from the Merriam Webster and Oxford definitions of infrastructure."}
  - {"page": 33, "locator": "2.1.2", "reason": "no-marker", "text": "The term intellectual property is defined as an output of a creative human thought process that has some intellectual or informational value [24]. Examples include microcomputer design and computer programs."}
  - {"page": 33, "locator": "2.1.2", "reason": "no-marker", "text": "The term technology is defined as the application of scientific knowledge, tools, techniques, crafts, systems, or methods of organization to solve a problem or achieve an objective [25]."}
  - {"page": 34, "locator": "2.1.2", "reason": "no-marker", "text": "The Concepts of Loss and Loss Control"}
  - {"page": 34, "locator": "2.1.2", "reason": "not-normative", "text": "While the loss condition or event is negative relative to the intended norm, the effect of the loss can be either neutral/inconsequential or negative/consequential. For example, a flat tire on a vehicle that is used only for off-road excursion is neutral/inconsequential if no such excursion is planned or affected."}
  - {"page": 34, "locator": "2.1.2", "reason": "no-marker", "text": "Loss may occur because of a single or combination of intentional or unintentional causes, events, and conditions. These may include the authorized or unauthorized use of the system; intentional acts of disruption or subversion; human and machine faults, errors, and failures; human acts of misuse and abuse; and the by-product of emergence, side effects, and feature interaction. These losses may be inconsequential to the mission or business objectives that the system supports. The objectives may still be achieved despite suffering an immediate or eventual loss that impacts other stakeholder objectives."}
  - {"page": 34, "locator": "2.1.2", "reason": "no-marker", "text": "Adapted from the Merriam Webster definition of loss."}
  - {"page": 35, "locator": "2.1.2", "reason": "fragment", "text": "OBJECTIVE"}
  - {"page": 36, "locator": "2.1.2", "reason": "fragment", "text": "OBJECTIVE"}
  - {"page": 36, "locator": "2.1.2", "reason": "no-marker", "text": "Reasoning about Asset Loss"}
  - {"page": 36, "locator": "2.1.2", "reason": "no-marker", "text": "As shown in Figure 6, the elements of a structured approach to reason about asset loss include the (1) context of loss, (2) confidence in addressing loss, (3) significance of loss, (4) addressing loss, and (5) cause of loss. The elements provide an asset-protection basis to determine the objectives for a secure system, optimize the system protection capability, and judge the overall suitability and effectiveness of the implemented protections.33 The elements are also grouped into two objectives to facilitate reasoning about the asset of interest:"}
  - {"page": 36, "locator": "2.1.2", "reason": "no-marker", "text": "Applying the asset reasoning approach works equally to reason about assets in terms of mission (i.e., mission-driven asset reasoning), organization (i.e., organization-driven asset reasoning), and enterprise (i.e., enterprise-driven asset reasoning)."}
  - {"page": 37, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 6. Reasoning about Asset Protection"}
  - {"page": 38, "locator": "2.1.2", "reason": "lead-in", "text": "The significance of loss answers the following questions:"}
  - {"page": 38, "locator": "2.1.2", "reason": "no-marker", "text": "The lifetime of an asset may be different from the lifetime of the system. Assets may predate the system and may persist after the system’s retirement from use. The significance of the loss of an asset can have ramifications that are independent of the system, system function, and business and mission objectives."}
  - {"page": 38, "locator": "2.1.2", "reason": "no-marker", "text": "The asset life cycle is the same as the system life cycle when the asset of interest is the system of interest. The asset life cycle may be the same or shorter than the system life cycle for those assets created by the system of interest and only required while the system of interest is operating."}
  - {"page": 38, "locator": "2.1.2", "reason": "no-marker", "text": "Determining the significance of loss is not a determination of risk."}
  - {"page": 40, "locator": "2.1.2", "reason": "lead-in", "text": "Finally, the causes of asset loss answer the following questions:"}
  - {"page": 40, "locator": "2.1.2", "reason": "no-marker", "text": "Addressing loss occurs through the protective measures that enforce constraints to ensure that only authorized and intended behaviors and outcomes of the system occur. These include:"}
  - {"page": 41, "locator": "2.1.2", "reason": "short", "text": "Determining Protection Needs"}
  - {"page": 41, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 7. Defining Protection Needs"}
  - {"page": 41, "locator": "2.1.2", "reason": "no-marker", "text": "The purpose of establishing the need for protection is to decide what assets to protect and to determine the priority given to such protection. This can be accomplished without considering a cause or condition against which to protect. As shown in Figure 8, the need for protection is derived from the relationship among the asset of interest, context of loss, type of loss, and the consequences of loss. This approach establishes the need for protection that – once validated by stakeholders across all assets of interest – provides the basis for developing security objectives and requirements.40"}
  - {"page": 42, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 8. Relationship among Asset, Loss, and Consequence"}
  - {"page": 42, "locator": "2.1.2", "reason": "lead-in", "text": "To summarize, the following considerations impact the identification of protection needs:"}
  - {"page": 43, "locator": "2.1.2", "reason": "no-marker", "text": "Protection needs are continuously reassessed and adjusted as variances, changes, and trades occur throughout the system life cycle. These include the maturation of the system design and life cycle concepts, improved understanding of the operational environment (e.g., a more thorough understanding of adversities), and changes in understanding of the consequences of asset loss. Revisiting protection needs is a necessary part of the iterative nature of systems engineering. Systems security engineering is necessary to ensure completeness in understanding the problem space, exploring all feasible solutions, and engineering a trustworthy secure system."}
  - {"page": 43, "locator": "2.1.2", "reason": "short", "text": "System Security Viewpoints"}
  - {"page": 43, "locator": "2.1.2", "reason": "no-marker", "text": "Every system is delivered to satisfy stakeholder capability needs. These needs constitute the system function – the system’s purpose or role as fulfilled by the totality of the capability it delivers combined with its intended use. The system function is the predominant viewpoint and establishes the context for the security function and the associated system life cycle assets."}
  - {"page": 43, "locator": "2.1.2", "reason": "no-marker", "text": "The stakeholder capability needs include the protection capability needs. The protection needs parallel the concept of stakeholder capability needs and constitute the system’s security function"}
  - {"page": 43, "locator": "2.1.2", "reason": "lead-in", "text": "The security function of the system has both passive and active aspects:"}
  - {"page": 44, "locator": "2.1.2", "reason": "no-marker", "text": "Life cycle assets are associated with the system but are not engineered into or delivered with the system. Their association with the system means that they can be the direct cause of loss or a conduit/means through which a loss can occur. Life cycle assets have several types:"}
  - {"page": 44, "locator": "2.1.2", "reason": "short", "text": "Demonstrating System Security"}
  - {"page": 45, "locator": "2.1.2", "reason": "no-marker", "text": "No system can provide absolute security due to the limits of human certainty, the uncertainty that exists in the life cycle of every system, and the constraints of cost, schedule, performance, feasibility, and practicality. As such, trade-offs made routinely across contradictory, competing, and conflicting needs and constraints are optimized to achieve adequate security, which reflects a decision made by stakeholders."}
  - {"page": 45, "locator": "2.1.2", "reason": "short", "text": "Systems Security Engineering"}
  - {"page": 45, "locator": "2.1.2", "reason": "no-marker", "text": "An individual function or mechanism can be verified and validated for correctness against its quality and performance attributes. Those results help inform the determination of system security but are insufficient alone."}
  - {"page": 45, "locator": "2.1.2", "reason": "no-marker", "text": "While the evidence obtained through demonstrating compliance to a set of expectations or criteria may support judgments of adequate security, such evidence alone does not support a claim of adequate security."}
  - {"page": 46, "locator": "2.1.2", "reason": "no-marker", "text": "Systems security engineering overlaps with other subdisciplines and leverages multiple specialties to accomplish systems security engineering activities and tasks. These specialties include computer security; communications security; transmission security; electronic emissions security; anti-tamper protection; physical security; information, software, hardware, and supply chain assurance; and technology specialties, such as biometrics and cryptography."}
  - {"page": 46, "locator": "2.1.2", "reason": "no-marker", "text": "Systems security engineering also leverages contributions from other enabling engineering disciplines and specialties to analyze and manage complexity, interconnectedness, dynamicity, and susceptibility associated with hardware, software, and firmware-based technologies.46 This includes the development, manufacturing, handling, and distribution of technologies throughout the system life cycle.47"}
  - {"page": 46, "locator": "2.1.2", "reason": "not-a-statement", "text": "Figure 9 illustrates the relationships among systems engineering, systems security engineering, and contributing security and other specialty engineering areas."}
  - {"page": 46, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 9. Systems Engineering and Other Specialty Engineering Disciplines"}
  - {"page": 46, "locator": "2.1.2", "reason": "lead-in", "text": "As part of a transdisciplinary systems engineering effort to deliver a trustworthy secure system, systems security engineering:"}
  - {"page": 46, "locator": "2.1.2", "reason": "no-marker", "text": "Enabling engineering disciplines and specialties include reliability, availability, and maintainability (RAM) engineering; software engineering; resilience engineering; and human factors engineering (ergonomics)."}
  - {"page": 46, "locator": "2.1.2", "reason": "no-marker", "text": "This includes assessing potential supply chain assurance deficiencies when third parties and reuse are considered in planning the system and its realization."}
  - {"page": 47, "locator": "2.1.2", "reason": "no-marker", "text": "A system is engineered to achieve a capability driven by stakeholder mission and business needs. Security is an emergent property of a system that is achieved through a principled engineering process that reflects the stakeholder’s protection needs and concerns. The engineered security capability contributes to the overall system capability that satisfies stakeholder mission and business needs. No system can provide absolute security due to the limits of human certainty, the uncertainty that exists in the life cycle of every system, and the constraints of cost, schedule, performance, feasibility, and practicality. As such, trade-offs made routinely across contradictory, competing, and conflicting needs and constraints are optimized to provide adequate security."}
  - {"page": 47, "locator": "2.1.2", "reason": "no-marker", "text": "It is important to understand the context in which the term system security requirement is being used in this publication. For example, due to the complexity of system security, there are several types and purposes of system security requirements (Section 3.8 and Appendix C)."}
  - {"page": 48, "locator": "2.1.2", "reason": "no-marker", "text": "Systems Security Engineering Framework"}
  - {"page": 48, "locator": "2.1.2", "reason": "no-marker", "text": "The framework defines three contexts for conducting activities and tasks: (1) the problem context, (2) the solution context, (3) and the trustworthiness context. The three contexts help to ensure that the engineering is driven by a sufficiently complete understanding of the problem. This understanding drives the effort to provide the solution and is supported by a set of activities to design and realize the solution. It also demonstrates the worthiness of the solution in providing adequate security across competing and often conflicting constraints."}
  - {"page": 48, "locator": "2.1.2", "reason": "no-marker", "text": "While the framework appears to follow a sequential execution across the three contexts, it is intended to be implemented in a closed loop iterative and recursive manner. This approach facilitates a refinement of the problem statement, the proposed solution, and the trustworthiness objectives as the design evolves from concept to the realized solution. The closed loop feedback facilitates interactions among the three framework contexts and the requisite system security analyses to continuously identify and address variances that are introduced into the engineering effort. The feedback loop also helps to achieve continuous process improvement for the system, including viewing the outputs of one life cycle phase (i.e., the solution to the phase) as the inputs to the next phase (i.e., the problem for the next phase)."}
  - {"page": 48, "locator": "2.1.2", "reason": "no-marker", "text": "The three framework contexts share a common foundational base of system security analyses, including system analyses with security interpretations of the analyses results (Section H.6). System security analyses produce data to support engineering and stakeholder decision-making.51 Such analyses are differentiated for application within the problem, solution, and trustworthiness contexts and employ a variety of concepts, principles, techniques, means, methods, processes, practices, and tools. System security analyses:"}
  - {"page": 48, "locator": "2.1.2", "reason": "short", "text": "Adapted from [6]."}
  - {"page": 48, "locator": "2.1.2", "reason": "no-marker", "text": "Engineering and stakeholder decision-making involves architecture, assurance, behavior, cost, criticality, design, effectiveness, emergence, exposure, fit-for-purpose, life cycle concepts, penetration resistance, performance (including security performance), protection needs, security objectives, privacy, requirements, resilience, risk, strength of function, threats, trades, uncertainty, vulnerability, verification, and validation."}
  - {"page": 49, "locator": "2.1.2", "reason": "not-a-statement", "text": "Figure 10 illustrates the systems security engineering framework and its key components."}
  - {"page": 49, "locator": "2.1.2", "reason": "not-a-statement", "text": "Fig. 10. Systems Security Engineering Framework"}
  - {"page": 49, "locator": "2.1.2", "reason": "short", "text": "The Problem Context"}
  - {"page": 49, "locator": "2.1.2", "reason": "no-marker", "text": "The problem context defines the basis for an adequately secure system. It focuses on stakeholders’ concerns about unacceptable losses given their mission, operational capability, and performance needs and concerns, as well as all associated cost, schedule, performance, and risk-driven constraints. The problem context enables the engineering team to focus on acquiring as complete an understanding of the stakeholder problem as practical, to explore all feasible solution class options, and to select the solution class option or options to be pursued. The problem context includes:"}
  - {"page": 50, "locator": "2.1.2", "reason": "no-marker", "text": "The security objectives are foundational, establishing and scoping what it means to be adequately secure in terms of protection against asset loss and the significance of such loss. The security objectives have associated measures of success. These measures of success constitute specific and measurable criteria relative to operational performance measures and stakeholder concerns. Measures of success include both the strength of protection and the level of assurance in the protection capability that has been engineered. These measures influence developing security requirements and assurance claims."}
  - {"page": 50, "locator": "2.1.2", "reason": "short", "text": "The Solution Context"}
  - {"page": 50, "locator": "2.1.2", "reason": "no-marker", "text": "Security constraints are transformed and incorporated into system design requirements with metadata-tagging to identify security relevance."}
  - {"page": 51, "locator": "2.1.2", "reason": "short", "text": "The Trustworthiness Context"}
  - {"page": 51, "locator": "2.1.2", "reason": "no-marker", "text": "The trustworthiness context is a decision-making context that provides an evidence-based demonstration – through reasoning – that the system of interest is deemed trustworthy (or not) based on a set of claims derived from security objectives. This context consists of:"}
  - {"page": 51, "locator": "2.1.2", "reason": "no-marker", "text": "The trustworthiness context is grounded in the concept of an assurance case. An assurance case is a well-defined and structured set of arguments and a body of evidence showing that a system satisfies specific claims.56 Assurance cases provide reasoned, auditable artifacts that support the contention that a top-level claim or set of claims is satisfied, including systematic argumentation and underlying evidence and explicit assumptions that support the claims [30]. The claims may build from subclaims. For a given system life cycle stage, an outcome may sufficiently satisfy a subclaim or set of subclaims, such as a subclaim that stakeholder requirements are sufficiently comprehensive to support a claim that the realized system is adequately secure."}
  - {"page": 51, "locator": "2.1.2", "reason": "no-marker", "text": "Assurance is the measure of confidence associated with a given requirement. As the level of assurance increases, so does the scope, depth, and rigor associated with the methods and analyses conducted (Appendix F)."}
  - {"page": 51, "locator": "2.1.2", "reason": "no-marker", "text": "Software Engineering Institute, Carnegie Mellon University."}
  - {"page": 80, "locator": "Appendix C. Security Policy and Requirements", "reason": "no-marker", "text": "This appendix discusses security policy and requirements considerations57 in support of Appendix D, Appendix E, and Appendix H. Covered topics include the rules and scope of control for security policy (Section C.1), stakeholder and system security requirements (Section C.2), and the relationship among security requirements, policy, and mechanisms (Section C.3)."}
  - {"page": 80, "locator": "C.1. Security Policy", "reason": "no-marker", "text": "A security policy is a set of rules (Section C.1.1) that governs behavior and outcomes within a defined scope of control (Section C.1.2). The policy generally includes a set of policies that reflect the needs and expectations established by an authority with a specific scope and purpose (Section C.1.2). The policy rules have a hierarchy, from security policy top-level objectives that are refined and allocated to organizational security policies, which in turn are refined and allocated to system security policies."}
  - {"page": 80, "locator": "C.1.2. Scope of Control", "reason": "no-marker", "text": "Security policies reflect and are derived from laws, directives, regulations, life cycle concepts,58 requirements, or stakeholder objectives. Each policy includes a scope of control that establishes the bounds within which the policy applies. A typical scope of applicability includes:"}
  - {"page": 80, "locator": "C.1.2. Scope of Control", "reason": "no-marker", "text": "Life cycle concepts include operation, sustainment, evolution, maintenance, training, startup, and shutdown."}
  - {"page": 81, "locator": "C.1.2. Scope of Control", "reason": "no-marker", "text": "Security policy goes through an iterative refinement process that decomposes an abstract statement of security policy into more specific statements of security policy. The refinement occurs in parallel with requirements allocation and decomposition. Figure 11 illustrates security policy allocation across the organization."}
  - {"page": 81, "locator": "C.1.2. Scope of Control", "reason": "not-a-statement", "text": "Fig. 11. Allocation of Security Policy Responsibilities"}
  - {"page": 81, "locator": "C.2. Security Requirements", "reason": "no-marker", "text": "These expectations often cover personnel actions that may expose them to negative external influences (e.g., social media use)."}
  - {"page": 81, "locator": "C.2. Security Requirements", "reason": "no-marker", "text": "General requirements and definition processes are described in sources such as [31]and [32]."}
  - {"page": 82, "locator": "C.2. Security Requirements", "reason": "not-a-statement", "text": "Fig. 12. Stakeholder and System Requirements"}
  - {"page": 82, "locator": "C.2.1. Stakeholder Security Requirements", "reason": "no-marker", "text": "Stakeholder security requirements are those stakeholder requirements that have security relevance. These requirements specify:"}
  - {"page": 83, "locator": "C.2.1. Stakeholder Security Requirements", "reason": "not-a-statement", "text": "Fig. 13. Entities that Affect Security Requirements Development"}
  - {"page": 84, "locator": "C.3. Distinguishing Requirements, Policy, and Mechanisms", "reason": "no-marker", "text": "Each system security requirement, like any system requirement, is expressed in a manner that makes verification possible via inspection, analysis, demonstration, testing, or other defined and achievable means [31]."}
  - {"page": 85, "locator": "C.3. Distinguishing Requirements, Policy, and Mechanisms", "reason": "not-a-statement", "text": "Figure 14 illustrates the significance of the consistency relationship that must be maintained across interacting security requirements, security policy, and security mechanisms."}
  - {"page": 85, "locator": "C.3. Distinguishing Requirements, Policy, and Mechanisms", "reason": "not-a-statement", "text": "Fig. 14. Relationship between Mechanisms and Security Policy Enforcement"}
  - {"page": 86, "locator": "Appendix D. Trustworthy Secure Design", "reason": "no-marker", "text": "This appendix discusses the approach and considerations for applying technical63 concepts of a trustworthy secure system design. The concepts described provide a balanced and integrated approach that optimally protects against asset loss. The discussions include the design approach for trustworthy systems (Section D.1), authorized and intended behaviors and outcomes of the system (Section D.2), security design order of precedence (Section D.3), and functional design and trade space considerations (Section D.4)."}
  - {"page": 86, "locator": "Appendix D. Trustworthy Secure Design", "reason": "no-marker", "text": "Finally, trustworthiness and assurance needs and considerations also inform trustworthy secure design. Appendix F provides further discussion of the concepts of trustworthiness and assurance."}
  - {"page": 86, "locator": "Appendix D. Trustworthy Secure Design", "reason": "no-marker", "text": "Trustworthy secure design is a means to provide stakeholders with the confidence that their conflicting capability needs, concerns, priorities, and constraints are satisfied."}
  - {"page": 86, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "no-marker", "text": "An acceptable level of performance lies between the minimum threshold of acceptability and the objective of maximum performance. This level may vary across operational or system states and modes (e.g., patrolling in clear weather versus severe weather conditions), may vary across contingency conditions (e.g., normal, degraded), and may be subject to operational priorities (e.g., search and rescue, manhunt)."}
  - {"page": 87, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "no-marker", "text": "The design approach includes the following elements:66"}
  - {"page": 87, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "not-a-statement", "text": "Figure 15 illustrates the steps in the design approach in the context of the Systems Security Engineering Framework described in Chapter Four."}
  - {"page": 87, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "not-a-statement", "text": "Fig. 15. Design Approach in a Systems Security Engineering Framework"}
  - {"page": 87, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "no-marker", "text": "The approach to trustworthy design includes both preemptive and reactive aspects. These mutually reinforcing aspects provide the protection needed to achieve only the authorized and intended behaviors and outcomes. The preemptive aspect results in system features and system actions taken to prevent and limit loss before the loss occurs, while the reactive aspect results in system actions to limit loss and its effects once a loss has occurred. Figure 16 illustrates a balanced design strategy that includes preemptive and reactive aspects."}
  - {"page": 87, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "no-marker", "text": "These steps are useful in applying a system control concept for any loss-relevant emergent property (e.g., safety, resilience)."}
  - {"page": 87, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "no-marker", "text": "This flow iterates through systems engineering as the system is decomposed. Subsequent iterations would apply within the elements that comprise the system of interest (i.e., the subsystems, assemblies, and components)."}
  - {"page": 88, "locator": "D.1. Design Approach for Trustworthy Systems", "reason": "not-a-statement", "text": "Fig. 16. Balanced Design Strategy for Achieving Trustworthy Secure Systems"}
  - {"page": 90, "locator": "D.3. Security Design Order of Precedence", "reason": "lead-in", "text": "The SecDOP alternatives are:"}
  - {"page": 90, "locator": "D.3. Security Design Order of Precedence", "reason": "no-marker", "text": "Susceptibility, hazard, and vulnerability are eliminated by selecting a design or material alternative that completely removes susceptibility, hazard, and vulnerability and, thus, prevents loss."}
  - {"page": 90, "locator": "D.3. Security Design Order of Precedence", "reason": "no-marker", "text": "If adopting an alternative design or material to eliminate susceptibility, hazard, and vulnerability is not feasible, consider design changes or material selections that would reduce the frequency, potential, severity, and/or extent of loss caused by the susceptibility, hazard, or vulnerability."}
  - {"page": 90, "locator": "D.3. Security Design Order of Precedence", "reason": "no-marker", "text": "The security design order of precedence is inspired by the System Safety Design Order of Precedence, an optimized design approach for system safety described in [34]."}
  - {"page": 91, "locator": "D.3. Security Design Order of Precedence", "reason": "no-marker", "text": "If preventing, limiting, or reducing the potential for loss through design alteration and material selection is not feasible or adequate, employ engineered features and devices to control loss associated with susceptibility, hazard, and vulnerability. In general, engineered features actively disrupt the loss scenario sequence and interactions, and devices reduce the potential, severity, and extent of loss."}
  - {"page": 91, "locator": "D.3. Security Design Order of Precedence", "reason": "lead-in", "text": "Two general types of engineered features and devices employed to address the potential for loss associated with the system function of interest are:"}
  - {"page": 92, "locator": "D.3. Security Design Order of Precedence", "reason": "no-marker", "text": "Common practice in some communities is to select and overlay systems with security controls (i.e., management, operational, and technical safeguards or countermeasures) as a primary means to address security concerns [67] [68]. But as observed in [69], “Poor systems security engineering is very difficult to mitigate by overlaying security controls, whereas security controls overlaid on a sound, secure design can be quite effective.”"}
  - {"page": 92, "locator": "D.3. Security Design Order of Precedence", "reason": "no-marker", "text": "The Security Design Order of Precedence, as part of a systems engineering practice, helps to ensure a proper integration of technical controls and operational controls."}
  - {"page": 92, "locator": "D.4. Functional Design Considerations", "reason": "no-marker", "text": "This section describes the functional design considerations for trustworthy secure systems. These considerations include (1) assured functions that provide control enforcement, control decision, and control infrastructure; (2) design criteria for mechanisms; (3) security function failure analysis; (4) situational awareness; and (5) trade space considerations."}
  - {"page": 92, "locator": "D.4.1. Roles for Security-Relevant Control", "reason": "no-marker", "text": "All functions have the potential to influence behaviors and outcomes beyond themselves and are relevant to security.70 However, some functions have dedicated security purposes (e.g., functions that support audit capabilities). Examples include the protection control functions."}
  - {"page": 92, "locator": "D.4.1. Roles for Security-Relevant Control", "reason": "no-marker", "text": "Historically, the term security relevance has been used in secure system design and evaluation to differentiate the role of system functions that either singularly or in combination exhibit a behavior, produce an outcome, or provide a capability to enforce authorized and intended system behaviors or outcomes. However, from the security perspective (Section 3.8) and the possibility of loss due to weaknesses and defects in any system function, all functions have loss-related concerns and, thus, protection concerns."}
  - {"page": 93, "locator": "D.4.1. Roles for Security-Relevant Control", "reason": "no-marker", "text": "System functions can be mapped to one or more protection control decision functions, protection control enforcement functions, or protection control infrastructure functions, or other system functions for the purpose of secure design and evaluation. The distinction guides and informs a principled design to limit interference among functions with confidence. Such confidence can be achieved by employing Trustworthy System Control, applying the design criteria described in Section D.4.2, and optimally placing a function in the system architecture to limit the side effects and interactions that may interfere with the protection control functions."}
  - {"page": 93, "locator": "D.4.1. Roles for Security-Relevant Control", "reason": "no-marker", "text": "System analyses can determine the extent to which functions may interfere with other functions, including identifying any needed actions to increase assurance (Appendix F). For example, to satisfy a specific size or form-factor constraint, a system function mapped to a system function designated as “other” may occupy the same privilege domain as control enforcement, control decision, or control infrastructure functions, thereby elevating the privilege of that system function. If the size or form-factor constraint does not exist, it would be prudent to allocate that system function elsewhere to avoid giving the function elevated privilege. This would increase the assurance that the enforcement, decision, and infrastructure functions are isolated from the other parts of the system and would not be adversely impacted by their behavior or provide an avenue for attack."}
  - {"page": 94, "locator": "D.4.2. Essential Design Criteria for Mechanisms", "reason": "fragment", "text": "CRITERIA"}
  - {"page": 94, "locator": "D.4.2. Essential Design Criteria for Mechanisms", "reason": "no-marker", "text": "The reference monitor concept is described in the Trustworthy System Control principle in Appendix E."}
  - {"page": 94, "locator": "D.4.2. Essential Design Criteria for Mechanisms", "reason": "no-marker", "text": "Conceptually, the reference monitor concept can be extended to any control function that is to enforce a system constraint [39]."}
  - {"page": 95, "locator": "D.4.3. Security Function Failure Analysis", "reason": "no-marker", "text": "The outcomes of the security function failure analyses also drive assurance levels and objectives, as well as the fidelity and rigor of architecture, design, and implementation methods employed to achieve those objectives. Assurance considerations are discussed in Appendix F."}
  - {"page": 95, "locator": "D.4.3. Security Function Failure Analysis", "reason": "no-marker", "text": "-- James P. Anderson The Anderson Report [37]"}
  - {"page": 96, "locator": "D.4.5. Trade Space Considerations", "reason": "no-marker", "text": "The costs associated with a trustworthy secure design approach include the cost to acquire, develop, integrate, operate, and sustain the security features; the cost of the security features and functions in terms of their system performance impact; the cost of security services used by the system; the cost of developing and managing life cycle documentation and training; and the cost of obtaining and maintaining the target level of assurance."}
  - {"page": 96, "locator": "D.4.5. Trade Space Considerations", "reason": "no-marker", "text": "The cost of analysis to substantiate the trustworthiness claims of certain design choices is also an important trade space factor. Given two equally effective design options, the more attractive of the two options may be the one that has a lower relative cost to obtain the assurance needed to demonstrate satisfaction of trustworthiness claims. In all cases, assess the cost of system security at the system level; and consider trustworthiness objectives and the cost that is driven by the assurance activities necessary to achieve the trustworthiness objectives. Trustworthiness design principles such as Commensurate Rigor and Commensurate Trustworthiness inform the trade space analysis."}
  - {"page": 97, "locator": "D.4.5. Trade Space Considerations", "reason": "no-marker", "text": "“The law of conservation of energy states that energy can neither be created nor destroyed, only change in form. This law has many important implications in engineering, including implying the impossibility of creating a perpetual motion machine ... There is a parallel pseudo-principle that is often offered in a half-joking maxim – risk can neither be created nor destroyed, only moved around. It is not universally true [but] it is worthwhile considering the pseudo-principle because often, a change to a design often does end up ‘squeezing the risk balloon,’ only to discover that the risk appears elsewhere, perhaps in an unexpected place in the system, which could cause the defended system to be less secure than the engineering intended.”"}
  - {"page": 97, "locator": "D.4.5. Trade Space Considerations", "reason": "no-marker", "text": "-- O. Sami Saydjari Engineering Trustworthy Secure Systems [62]"}
  - {"page": 98, "locator": "Appendix E. Principles for Trustworthy Secure Design", "reason": "no-marker", "text": "NIST acknowledges the significant contributions of the Naval Postgraduate School Center for Information Systems Security Studies and Research and The MITRE Corporation in providing content for this appendix. The content was informed by the research reports of the principal investigators from those organizations [21] [39]."}
  - {"page": 98, "locator": "Appendix E. Principles for Trustworthy Secure Design", "reason": "no-marker", "text": "Engineering judgment considerations for the application of the principles for trustworthy secure systems are described in [39]."}
  - {"page": 99, "locator": "E.1. Anomaly Detection", "reason": "no-marker", "text": "Principle: Any salient anomaly in the system or its environment is detected in a timely manner that enables effective response action."}
  - {"page": 99, "locator": "E.1. Anomaly Detection", "reason": "no-marker", "text": "The “timely manner” aspect of anomaly detection reflects the urgency to detect emerging loss conditions as early as possible. Early detection increases response action options, such as graduated response options, and ensures that response actions have sufficient time to have an effect. When the determination of response involves humans in the loop, early detection enables a more reasoned judgment of proper response."}
  - {"page": 99, "locator": "E.1. Anomaly Detection", "reason": "no-marker", "text": "The basis for anomaly detection in the environment differs from that in the system because the environment is not under the control of the system. The environment presents a wide range of adversity to the system, and the system is designed to achieve its design intent within defined bounds of environmental conditions. Those bounds can be treated as the “norm” for anomaly detection, whereby environmental conditions that are trending beyond the norm or that reflect conditions outside of the norm may result in an adverse effect on the system, thus requiring a planned response to prepare for an impending difficulty or crisis."}
  - {"page": 100, "locator": "E.1. Anomaly Detection", "reason": "lead-in", "text": "Three aspects of anomaly detection are necessary to provide criteria for an appropriate response action or set of actions:"}
  - {"page": 100, "locator": "E.1. Anomaly Detection", "reason": "lead-in", "text": "Two approaches to anomaly detection are:"}
  - {"page": 100, "locator": "E.1. Anomaly Detection", "reason": "no-marker", "text": "References: [20] [40] [43]"}
  - {"page": 101, "locator": "E.2. Clear Abstractions", "reason": "no-marker", "text": "Principle: The abstractions used to characterize the system are simple, well-defined, accurate, precise, necessary, and sufficient."}
  - {"page": 101, "locator": "E.2. Clear Abstractions", "reason": "no-marker", "text": "References: [2] [20] [21] [24]"}
  - {"page": 101, "locator": "E.3. Commensurate Protection", "reason": "no-marker", "text": "Principle: The strength and type of protection provided to a system element are commensurate with the most significant adverse effect that results from a failure of that element."}
  - {"page": 101, "locator": "E.3. Commensurate Protection", "reason": "short", "text": "References: [2] [21]"}
  - {"page": 101, "locator": "E.4. Commensurate Response", "reason": "no-marker", "text": "Principle: The system design matches the aggressiveness of an engineered response action’s effect to the needed immediacy to control the effects of each loss scenario."}
  - {"page": 102, "locator": "E.4. Commensurate Response", "reason": "lead-in", "text": "Note: The selected response to a detected anomaly considers three factors to determine the effect that the response has on the loss and the system:"}
  - {"page": 102, "locator": "E.4. Commensurate Response", "reason": "no-marker", "text": "Responses can be achieved by a combination of manual, semi-automated, fully automated, or autonomous means. However, the response action is distinct from the determination that a response is necessary and from the notification or signaling that invokes the response action."}
  - {"page": 102, "locator": "E.4. Commensurate Response", "reason": "short", "text": "References: [40]"}
  - {"page": 102, "locator": "E.5. Commensurate Rigor", "reason": "no-marker", "text": "Note: Rigor determines the scope, depth, and detail of an engineering activity. Rigor is a means of providing confidence in the results of a completed engineering activity. Generally, an increase in rigor translates to an increase in confidence in the results of the activity. Further, increased confidence reduces the uncertainty that can also reduce risk or provide a better understanding of what to address to achieve risk reduction. The relationship between rigor and the criticality of data and information used to make decisions is recognized by systems analysis practices [4]."}
  - {"page": 103, "locator": "E.5. Commensurate Rigor", "reason": "short", "text": "References: [2] [4]"}
  - {"page": 103, "locator": "E.6. Commensurate Trustworthiness", "reason": "no-marker", "text": "Principle: A system element is trustworthy to a level commensurate with the most significant adverse effect that results from a failure of that element."}
  - {"page": 103, "locator": "E.6. Commensurate Trustworthiness", "reason": "short", "text": "References: [4] [20]"}
  - {"page": 103, "locator": "E.7. Compositional Trustworthiness", "reason": "no-marker", "text": "Principle: The system design is trustworthy for each aggregate composition of interacting system elements."}
  - {"page": 103, "locator": "E.7. Compositional Trustworthiness", "reason": "no-marker", "text": "References: [2] [4] [36] [42]"}
  - {"page": 104, "locator": "E.8. Continuous Protection", "reason": "short", "text": "References: [21]"}
  - {"page": 104, "locator": "E.9. Defense In Depth", "reason": "no-marker", "text": "Principle: Loss is prevented or minimized by employing multiple coordinated mechanisms."}
  - {"page": 104, "locator": "E.9. Defense In Depth", "reason": "no-marker", "text": "Note: The coordinated deployment of multiple protective mechanisms for a system helps to avoid single points of failure. The principle of defense in depth has three pillars:"}
  - {"page": 104, "locator": "E.9. Defense In Depth", "reason": "no-marker", "text": "The coordination of defense-in-depth mechanisms (i.e., combinations of structural, data, and control flow coordination) in conjunction with other design principles (e.g., Anomaly Detection, Commensurate Response) reflects a design strategy to satisfy the specified loss control objectives."}
  - {"page": 104, "locator": "E.9. Defense In Depth", "reason": "no-marker", "text": "While defense in depth distributes the protection capability to many components, a defense-in-depth strategy may also consider a distributed composition to a line of defense. A protection capability provided by a single system component is a potential single point of failure or bottleneck to system performance. It may also raise other concerns. A distributed composition of a defense layer may provide additional options within the coordination of layers."}
  - {"page": 104, "locator": "E.9. Defense In Depth", "reason": "no-marker", "text": "While the discussion in this section is limited to the machine, defense in depth may involve a combination of technical, operational, and organizational elements. Additional discussion on defense in depth can be found in [52]."}
  - {"page": 105, "locator": "E.9. Defense In Depth", "reason": "no-marker", "text": "References: [2] [21] [40] [47]"}
  - {"page": 105, "locator": "E.10. Distributed Privilege", "reason": "no-marker", "text": "Principle: Multiple authorized entities act in a coordinated manner before an operation on the system is allowed to occur."}
  - {"page": 105, "locator": "E.10. Distributed Privilege", "reason": "short", "text": "References: [21] [46]"}
  - {"page": 105, "locator": "E.11. Diversity (Dynamicity)", "reason": "no-marker", "text": "Principle: The system design delivers the required capability through structural, behavioral, or data or control flow variation."}
  - {"page": 105, "locator": "E.11. Diversity (Dynamicity)", "reason": "no-marker", "text": "Saltzer and Schroeder [46] originally named this the separation of privilege. It is also equivalent to separation of duty."}
  - {"page": 106, "locator": "E.11. Diversity (Dynamicity)", "reason": "no-marker", "text": "Diversity options include intentionally designed regular or irregular changes in the system (e.g., implementing the concept of dynamicity). A design incorporating dynamicity can (1) complicate the attack planning of an adversary, (2) reduce the potential for non-adversarial adversity to have an effect on the system, (3) provide the margin to deliver a required capability while reducing actual losses, and (4) protect against the effects of an attack. Dynamic change may refer to either shifting the target or shifting the behaviors of a target in performing its activities (e.g., frequency hopping complicates attempts to intercept or jam signals within wireless communications)."}
  - {"page": 106, "locator": "E.11. Diversity (Dynamicity)", "reason": "no-marker", "text": "References: [20] [47] [45]"}
  - {"page": 106, "locator": "E.12. Domain Separation", "reason": "no-marker", "text": "Principle: Domains with distinctly different protection needs are physically or logically separated."}
  - {"page": 106, "locator": "E.12. Domain Separation", "reason": "no-marker", "text": "Historically, domain separation has been used to enforce the separation of roles or privileges. For example, a system may separate an “administrative” or “supervisor” domain from “user” domains. The administrative domain is accessible only by system administrators with proper privileges, and distinctly administrative functions may only be executed by administrators from the administrative domain. Similarly, data intended to be accessed only by administrators and administrative functions (e.g., system configurations) is stored and accessed only within that domain, ensuring needed protection of the data."}
  - {"page": 107, "locator": "E.12. Domain Separation", "reason": "short", "text": "References: [21] [43]"}
  - {"page": 107, "locator": "E.13. Hierarchical Protection", "reason": "no-marker", "text": "Principle: A system element need not be protected from more trustworthy elements."}
  - {"page": 107, "locator": "E.13. Hierarchical Protection", "reason": "short", "text": "References: [2] [43]"}
  - {"page": 107, "locator": "E.14. Least Functionality", "reason": "no-marker", "text": "Principle: Each system element has the capability to accomplish its required functions but no more."}
  - {"page": 108, "locator": "E.14. Least Functionality", "reason": "short", "text": "References: [2] [21]"}
  - {"page": 108, "locator": "E.15. Least Persistence", "reason": "no-marker", "text": "Principle: System elements and other resources are available, accessible, and able to fulfill their design intent only for the time for which they are needed."}
  - {"page": 108, "locator": "E.15. Least Persistence", "reason": "no-marker", "text": "Note: Least persistence reduces susceptibility. It limits the extent to which functions, resources, data, and information remain present, accessible, and usable when not required, thereby reducing the opportunity for their inadvertent or unauthorized use, modification, or activation."}
  - {"page": 108, "locator": "E.15. Least Persistence", "reason": "no-marker", "text": "Least persistence is reflected in concepts such as sanitizing, erasing, and clearing memory and/or storage locations; disabling, removing, and disconnecting network ports, system interfaces, and the services provided by system interfaces; powering off and unplugging hardware when not needed; and instantiating software just before need and de-instantiating after it is no longer needed. Least persistence has added benefits that include simplifying the processes of:"}
  - {"page": 109, "locator": "E.15. Least Persistence", "reason": "short", "text": "References: [53]"}
  - {"page": 109, "locator": "E.16. Least Privilege", "reason": "no-marker", "text": "Principle: Each system element is allocated privileges that are necessary to accomplish its specified functions but no more."}
  - {"page": 109, "locator": "E.16. Least Privilege.(2)", "reason": "no-marker", "text": "Least privilege can inform the use of other principles such as the employment of Domain Separation and Structured Decomposition and Composition. That is, the system modules can be designed so that only the system elements encapsulated by the module are directly accessed or operated on by the functions within the module, thus aiding the implementation of least privilege."}
  - {"page": 109, "locator": "E.16. Least Privilege.(2)", "reason": "no-marker", "text": "References: [2] [20] [21] [46]"}
  - {"page": 109, "locator": "E.17. Least Sharing", "reason": "no-marker", "text": "Principle: System resources are shared among system elements only when necessary and among as few elements as possible.83"}
  - {"page": 109, "locator": "E.17. Least Sharing", "reason": "no-marker", "text": "Two criteria provide the basis for applying the principle of least sharing: (1) share only if absolutely necessary, and (2) minimize sharing if allowed. The first criterion is a trade decision that weighs the cost and benefit of sharing resources against the increased exposure that results from the sharing. The second criterion is a constraint on the extent of sharing."}
  - {"page": 109, "locator": "E.17. Least Sharing", "reason": "no-marker", "text": "References: [2] [21] [46] [54] [55]"}
  - {"page": 109, "locator": "E.17. Least Sharing", "reason": "no-marker", "text": "The historically well-known security design principle least common mechanism is an instance of least sharing. The principle of least common mechanism is described in [55]."}
  - {"page": 110, "locator": "E.18. Loss Margins", "reason": "no-marker", "text": "Principle: The system is designed to operate in a state space sufficiently distanced from the threshold at which loss occurs."}
  - {"page": 110, "locator": "E.18. Loss Margins", "reason": "no-marker", "text": "Uncertainty may derive from the operational environment, the design and realization of the system, the utilization and sustainment of the system, and the adversity presenting itself to the system. Loss margins are effective in addressing uncertainty about how and when a loss-triggering event occurs. Specifically, loss margins are effective in addressing uncertainty associated with:"}
  - {"page": 110, "locator": "E.18. Loss Margins", "reason": "no-marker", "text": "References: [6] [23] [40] [45] [56] [57] [63]"}
  - {"page": 110, "locator": "E.19. Mediated Access", "reason": "no-marker", "text": "Principle: All access to and operations on system elements are mediated."}
  - {"page": 110, "locator": "E.19. Mediated Access", "reason": "no-marker", "text": "Note: Mediated access is a foundational principle in the design of secure systems. The purpose of mediated access is to:"}
  - {"page": 111, "locator": "E.19. Mediated Access", "reason": "no-marker", "text": "Mediated access has two parts: (1) a policy-based access mediation decision and (2) the enforcement of the access mediation decision. The access mediation decision may include conditional constraints that further restrict access (e.g., role, time of day, system state or mode, or duration of operation). If access is not sufficiently mediated, there is no possibility of limiting how system elements (including human and machine elements) interact to ensure that only authorized behaviors and intended outcomes result."}
  - {"page": 111, "locator": "E.19. Mediated Access", "reason": "no-marker", "text": "Mediated access is achieved by an access mediation control mechanism. Seminal computer security work has defined the reference validation mechanism as the generalized form of any mechanism that is an implementation of the reference monitor concept (Section D.4.2). The reference monitor provides the design assurance basis for demonstrating the trustworthiness of a mediated access control mechanism. The essential design criteria (Section D.4.2) provide a refinement to extend the generalized reference monitor concept. Mediated access may enforce the constraints described in the principles of Distributed Privilege, Least Privilege, and Least Sharing."}
  - {"page": 111, "locator": "E.19. Mediated Access", "reason": "no-marker", "text": "As a predominant security function, mediating access may result in performance bottlenecks if not designed and implemented correctly. The use of a least common mechanism is one means to help reduce bottlenecks, an approach referred to as efficiently mediated access [21]."}
  - {"page": 111, "locator": "E.19. Mediated Access", "reason": "no-marker", "text": "References: [2] [21] [37] [40] [46] [58]"}
  - {"page": 111, "locator": "E.20. Minimal Trusted Elements", "reason": "no-marker", "text": "Principle: A system has as few trusted system elements as practicable."}
  - {"page": 111, "locator": "E.20. Minimal Trusted Elements", "reason": "no-marker", "text": "Note: Minimizing trusted system elements is a cost-benefit trade space consideration employed for the functional allocation of trust within the system. The need for trust is tied to the function provided by a system element, and that need is independent of any distribution of trust across multiple elements in the architecture. The trade decision is, therefore, how best to allocate trust to system elements given the functions they provide and how the elements are best distributed throughout the architecture where distribution is a justified need. Minimizing trusted system elements is one consideration in making that decision."}
  - {"page": 112, "locator": "E.20. Minimal Trusted Elements", "reason": "no-marker", "text": "References: [2] [20] [43] [44]"}
  - {"page": 112, "locator": "E.21. Minimize Detectability", "reason": "no-marker", "text": "Principle: The design of the system minimizes the detectability of the system as much as practicable."}
  - {"page": 112, "locator": "E.21. Minimize Detectability", "reason": "no-marker", "text": "References: [53] [59] [60]"}
  - {"page": 112, "locator": "E.22. Protective Defaults", "reason": "no-marker", "text": "Principle: The default configuration of the system provides maximum protection effectiveness."}
  - {"page": 112, "locator": "E.22. Protective Defaults", "reason": "no-marker", "text": "References: [2] [21] [46]"}
  - {"page": 112, "locator": "E.23. Protective Failure", "reason": "no-marker", "text": "Principle: A failure of a system element neither results in an unacceptable loss nor invokes another loss scenario."}
  - {"page": 113, "locator": "E.23. Protective Failure", "reason": "no-marker", "text": "References: [2] [21] [40] [47] [45]"}
  - {"page": 113, "locator": "E.24. Protective Recovery", "reason": "no-marker", "text": "Principle: The recovery of a system element does not result in nor lead to unacceptable loss."}
  - {"page": 113, "locator": "E.24. Protective Recovery", "reason": "no-marker", "text": "References: [2] [6] [20] [21]"}
  - {"page": 113, "locator": "E.25. Reduced Complexity", "reason": "no-marker", "text": "Principle: The system design is as simple as practicable."}
  - {"page": 113, "locator": "E.25. Reduced Complexity", "reason": "no-marker", "text": "Complexity can be found in the system structure, interfaces, dependencies, data and control flows, and the interaction of the system with its operational environment. Complexity derives from how the system is decomposed into its individual and aggregates of constituent elements (e.g., subsystems, assemblies), and from how those elements compose through their behaviors and interactions to comprise the functional system."}
  - {"page": 114, "locator": "E.25. Reduced Complexity", "reason": "no-marker", "text": "A more complex design increases uncertainty. Such uncertainty leads to errors and hinders acquiring confidence in the understanding of the design. A complex design is also more prone to erroneous interpretation when conducting the engineering activities of analysis, implementation, and verification throughout the system life cycle [45]. Thus, reduced design complexity contributes to confidence in the technical understanding of the design, enabling more informed trade decisions and decreasing uncertainty in the design and the subsequent realization of the design as a system."}
  - {"page": 114, "locator": "E.25. Reduced Complexity", "reason": "no-marker", "text": "Complexity also increases the difficulty in identifying and assessing loss scenarios, susceptibilities, and vulnerabilities. Conclusions about the nature and effect of vulnerabilities can be reached with a higher degree of assurance in cases of reduced design complexity in contrast to cases where the design is overly complex."}
  - {"page": 114, "locator": "E.25. Reduced Complexity", "reason": "no-marker", "text": "The principle of reduced complexity may also be referred to as the principle of simplification or least common mechanism."}
  - {"page": 114, "locator": "E.25. Reduced Complexity", "reason": "no-marker", "text": "References: [2] [40] [45] [46] [47]"}
  - {"page": 114, "locator": "E.26. Redundancy", "reason": "no-marker", "text": "Principle: The system design delivers the required capability by replication of system functions or elements."}
  - {"page": 114, "locator": "E.26. Redundancy", "reason": "no-marker", "text": "Redundant solutions are susceptible to common mode failure (i.e., a single event that results in the same or equivalent elements failing in the same manner). Diversity is a means to address the concerns of common mode failure."}
  - {"page": 114, "locator": "E.26. Redundancy", "reason": "no-marker", "text": "References: [2] [20] [45] [47]"}
  - {"page": 114, "locator": "E.27. Self-Reliant Trustworthiness", "reason": "no-marker", "text": "Principle: The trustworthiness of a system element is achieved with minimal dependence on other elements."}
  - {"page": 114, "locator": "E.27. Self-Reliant Trustworthiness", "reason": "no-marker", "text": "Note: In the ideal case, the trustworthiness of a system element occurs when the claim of trustworthiness is not dependent on protection from another system element. If an element is dependent on other elements to satisfy its trustworthiness claims, then that element’s trustworthiness is susceptible to any loss or degradation of the protection capability provided by the other element. The considerations for the extent to which a system element exhibits self-reliant trustworthiness include:"}
  - {"page": 115, "locator": "E.27. Self-Reliant Trustworthiness", "reason": "short", "text": "References: [2]"}
  - {"page": 115, "locator": "E.28. Structured Decomposition and Composition", "reason": "no-marker", "text": "Principle: System complexity is managed through the structured decomposition of the system and the structured composition of the constituent elements to deliver the required capability."}
  - {"page": 115, "locator": "E.28. Structured Decomposition and Composition", "reason": "no-marker", "text": "Modularity is the system design technique to divide and conquer – that is, sub-divide the system into smaller, well-defined cohesive components and assemblies that are referred to as modules. Modularity serves to isolate functions and data structures into well-defined logical units. Modular decomposition can include the allocation of policies to systems in a network, the allocation of system policies to layers, the separation of system applications into processes with distinct address spaces, and the separation of processes into subjects with distinct privileges based on hardware-supported privilege domains. Modular design may also extend to consider trust, trustworthiness, privilege, and policy."}
  - {"page": 115, "locator": "E.28. Structured Decomposition and Composition", "reason": "no-marker", "text": "References: [2] [20] [46] [48] [49]"}
  - {"page": 116, "locator": "E.29. Substantiated Trustworthiness", "reason": "no-marker", "text": "References: [2] [21] [50]"}
  - {"page": 116, "locator": "E.30. Trustworthy System Control", "reason": "no-marker", "text": "Principle: The design for system control functions conforms to the properties of the generalized reference monitor."}
  - {"page": 116, "locator": "E.30. Trustworthy System Control", "reason": "no-marker", "text": "Note: The trustworthy system control principle reflects the generalization of the reference monitor concept to provide a uniform design assurance basis for trustworthy system control mechanisms or constraint-enforcing mechanisms that compose to provide system control functions."}
  - {"page": 116, "locator": "E.30. Trustworthy System Control", "reason": "no-marker", "text": "Adapted from a statement made by John Rushby, SRI International, about the need for software to be treated as “guilty until proven innocent” at a Layered Assurance Workshop (LAW)."}
  - {"page": 117, "locator": "E.30. Trustworthy System Control", "reason": "no-marker", "text": "The reference monitor concept (Section D.4.2) is a foundational access control concept for secure system design. It is defined as a trustworthy abstract machine that mediates all accesses to objects by subjects [38]. As a concept for an abstract machine, the reference monitor does not address any specific implementation. A reference validation mechanism, which is a combination of hardware and software, realizes the reference monitor concept to provide the access mediation foundation for a secure system [37]."}
  - {"page": 117, "locator": "E.30. Trustworthy System Control", "reason": "lead-in", "text": "The reference monitor concept has several criteria that provide design assurance of its realization as a reference validation mechanism:"}
  - {"page": 117, "locator": "E.30. Trustworthy System Control", "reason": "no-marker", "text": "For trustworthy system control, a fourth criterion of non-bypassability is added (Section D.4.2)."}
  - {"page": 117, "locator": "E.30. Trustworthy System Control", "reason": "lead-in", "text": "Trustworthy system control also encompasses control, safety, and security concepts to establish a system capability that sufficiently:"}
  - {"page": 117, "locator": "E.30. Trustworthy System Control", "reason": "no-marker", "text": "Such a system capability underlies the loss control objectives and transforms the approach for design to not rely on having detailed knowledge of the capability, means, and methods of an adversary. This design approach can be employed in attack-dependent or attack-independent manners based on the limits of certainty for what is known with confidence about the adversary."}
  - {"page": 117, "locator": "E.30. Trustworthy System Control", "reason": "no-marker", "text": "References: [21] [35] [37] [38]"}
  - {"page": 118, "locator": "Appendix F. Trustworthiness and Assurance", "reason": "no-marker", "text": "-- Executive Order (EO) on Improving the Nation’s Cybersecurity [1] May 2021"}
  - {"page": 118, "locator": "F.1.1. Roles of Requirements in Trustworthiness", "reason": "no-marker", "text": "This includes risks attributed to poor, incorrect, and unjustified decisions."}
  - {"page": 118, "locator": "F.1.1. Roles of Requirements in Trustworthiness", "reason": "no-marker", "text": "These methods include combinations of demonstration, inspection, analysis, and testing."}
  - {"page": 119, "locator": "F.1.2. Design Considerations.•", "reason": "label-only", "text": "• States, Modes, and Transitions"}
  - {"page": 119, "locator": "F.1.2. Design Considerations", "reason": "no-marker", "text": "Constraints and claims are expressed in terms of functional correctness, strength of function, concerns for asset loss and consequences, and the protection capability derived from adherence to standards or from the use of specific processes, procedures, or methods."}
  - {"page": 120, "locator": "F.1.2. Design Considerations.•", "reason": "label-only", "text": "• Failure Propagation"}
  - {"page": 120, "locator": "F.1.2. Design Considerations.•", "reason": "label-only", "text": "• Anomaly Detection"}
  - {"page": 120, "locator": "F.1.2. Design Considerations", "reason": "no-marker", "text": "Anomaly Detection provides situational awareness that allows the system to decide and recommend corrective actions to account for actual and potential deviations from accepted norms."}
  - {"page": 120, "locator": "F.1.2. Design Considerations.•", "reason": "label-only", "text": "• Trades"}
  - {"page": 120, "locator": "F.1.2. Design Considerations", "reason": "no-marker", "text": "Not every system element has trustworthiness that is sufficient for its intended purpose. A deficiency in trustworthiness can result from:"}
  - {"page": 120, "locator": "F.1.2. Design Considerations", "reason": "not-normative", "text": "The trade space is the rigorous application of the design principles that provide a basis for the necessary design decisions to maximize the trustworthiness of individual system elements and aggregates of elements. For example, in addressing the feasibility and practicality of cost and schedule issues, the design principle of minimizing the number of system elements that must be trusted (Minimal Trusted Elements) is applied. This reduces the size and scope of the effort and potentially reduces the expense of generating evidence of trustworthiness."}
  - {"page": 120, "locator": "F.2. Assurance", "reason": "no-marker", "text": "The term adversity refers to those conditions that can cause a loss of assets (e.g., threats, attacks, vulnerabilities, hazards, disruptions, and exposures)."}
  - {"page": 121, "locator": "F.2. Assurance", "reason": "no-marker", "text": "Assurance is difficult but necessary."}
  - {"page": 121, "locator": "F.2. Assurance", "reason": "no-marker", "text": "“I’ve covered a lot of material in this book, some of it quite tricky. But I’ve left the hardest parts to the last. First, there’s the question of assurance ...“ [5]."}
  - {"page": 121, "locator": "F.2. Assurance", "reason": "no-marker", "text": "Compliance is a form of “veneer security.” While compliance may have an important informing role in judgments of trustworthiness, compliance-based judgments – like other forms of veneer security – do not suffice as the sole evidentiary basis for assurance and the associated judgments of trustworthiness."}
  - {"page": 121, "locator": "F.2.1. Security Assurance Claims", "reason": "no-marker", "text": "Top-level claims decompose in a structured manner into subclaims about the desired attributes of a trustworthy secure system. Subclaims address the requirements, design, implementation, methods, and adversities that demonstrate that the system adequately contributes to ensuring only authorized and intended system behaviors and outcomes. These subclaims are derived from concerns about the completeness and accuracy of stakeholder and system requirements,89 enforcement of the security policy, proper implementation of the design, proper maintenance of the system, the usability of the system,90 and the avoidance, minimization, and mitigation of defects, errors, and vulnerabilities.91 Other subclaims may exist involving the ability to exhibit predictable behavior while operating in secure states in the presence and absence of adversity and the ability to recover from an insecure state. Claims can be expressed in terms of functional correctness, strength of function, and the protection capability derived from adherence to standards and/or from the use of specific processes, procedures, and methods."}
  - {"page": 122, "locator": "F.2.1. Security Assurance Claims", "reason": "no-marker", "text": "The NASA System Safety Handbook [6] describes the relevant claims to be met in terms of the top-level claim that the system is adequately safe with subclaims, including that the system is designed to be as safe as reasonably practicable, built to be as safe as reasonably practicable, and operated as safely as reasonably practicable."}
  - {"page": 122, "locator": "F.2.2. Approaches to Assurance", "reason": "no-marker", "text": "There are three general approaches to assurance. These assurance approaches can vary based on the type of evidence, how the evidence is acquired, the strength of the judgments made based on the acquired evidence, and the extent to which the assurance matches decision-making needs. From weakest to strongest, the assurance approaches are axiomatic, analytic, and synthetic."}
  - {"page": 123, "locator": "F.2.2. Approaches to Assurance", "reason": "no-marker", "text": "An assurance case is a reasoned, auditable artifact that is created to support the contention that a top-level claim is satisfied. The assurance case includes systematic argumentation, evidence, and explicit assumptions that support the claim."}
  - {"page": 123, "locator": "F.2.2. Approaches to Assurance", "reason": "lead-in", "text": "An assurance case contains the following elements [30]:"}
  - {"page": 123, "locator": "F.2.2. Approaches to Assurance", "reason": "no-marker", "text": "Many formalizations and tools for building assurance cases have been developed in recent years, including the Goal Structuring Notation (GSN) [64] and NASA’s AdvoCATE: Assurance Case Automation Toolset [65]."}
  - {"page": 124, "locator": "F.2.3. Assurance Needs", "reason": "lead-in", "text": "Assurance needs determine the type of evidence and the rigor associated with the activities, methods, and tools used to acquire the evidence to satisfy the following cases:"}
  - {"page": 125, "locator": "F.2.3. Assurance Needs", "reason": "not-a-statement", "text": "Fig. 17. Assurance and Degree of Rigor in Realizing a Capability Need"}
  - {"page": 125, "locator": "F.2.3. Assurance Needs", "reason": "no-marker", "text": "Due to associated costs and complexity, formal methods are typically limited to engineering efforts where only the highest levels of assurance are needed, such as the formal modeling, specification, and verification of security policy and the implementation that enforces the policy (Section D.4.2). In this case, the security policy model is verified as complete for its scope of control and as self-consistent. The verified security policy model then serves as a foundation to verify the models of the design and implementation of the mechanisms that provide for decision-making and the enforcement of those decisions."}
  - {"page": 126, "locator": "Appendix G. System Life Cycle Processes Overview", "reason": "no-marker", "text": "This appendix provides an overview of the system life cycle processes in [4], establishes the basis for the in-depth coverage of those processes in subsequent appendices, and describes relevant relationships among the various process groups and processes (Section G.2)."}
  - {"page": 126, "locator": "G.1. Process Overview", "reason": "no-marker", "text": "The activities performed during the system life cycle are grouped into Technical Processes (Appendix H), Technical Management Processes (Appendix I), Organizational Project-Enabling Processes (Appendix J), and Agreement Processes (Appendix K) [4]. Appendices H, I, J, and K describe the considerations and contributions to the system life cycle processes to achieve trustworthy secure systems. Table 5 lists the four process groups and processes in each group [4]."}
  - {"page": 127, "locator": "G.1. Process Overview", "reason": "lead-in", "text": "Tailoring the system life cycle processes allows the engineering team to:"}
  - {"page": 127, "locator": "G.1. Process Overview", "reason": "no-marker", "text": "While the life cycle processes and activities are restated from [4], the tasks in this publication are neither a restatement of nor a one-for-one mapping to the tasks in [4]. This publication focuses on the security contributions to the processes, and, therefore, the tasks are titled to reflect these contributions. In some cases, tasks have been added to address the range of outcomes appropriate for achieving trustworthy secure system objectives."}
  - {"page": 128, "locator": "G.1. Process Overview", "reason": "no-marker", "text": "Each of the system life cycle processes contains a set of activities and tasks that produce security-focused outcomes.93 These outcomes combine to deliver a system and corresponding body of evidence94 that serve as the basis to:"}
  - {"page": 128, "locator": "G.1. Process Overview", "reason": "lead-in", "text": "Each system life cycle process description has the following sections:"}
  - {"page": 128, "locator": "G.1. Process Overview", "reason": "no-marker", "text": "Outcomes inform other processes, including those external to the engineering effort (e.g., the organizational life cycle processes of stakeholders and certification, authorization, or regulatory processes)."}
  - {"page": 128, "locator": "G.1. Process Overview", "reason": "no-marker", "text": "The comprehensiveness, depth, fidelity, credibility, and relevance of the body of evidence are factors in achieving the desired level of assurance. The objective is a body of evidence sufficient to convince stakeholders that their assurance needs are satisfied."}
  - {"page": 129, "locator": "G.1. Process Overview", "reason": "not-a-statement", "text": "Fig. 18. Types of Personnel and Roles that Support Life Cycle Processes"}
  - {"page": 129, "locator": "G.2. Process Relationships", "reason": "not-a-statement", "text": "Figure 19 illustrates common logical relationships among system life cycle process groups and processes that can be used as a framework and altered as necessary as part of tailoring [4]."}
  - {"page": 129, "locator": "G.2. Process Relationships", "reason": "not-a-statement", "text": "Fig. 19. Relationships Among Life Cycle Processes Process relationships are further illustrated by the use cases in [94]. Several prominent use cases include:"}
  - {"page": 130, "locator": "G.2. Process Relationships", "reason": "no-marker", "text": "The following sources provide additional information on system life cycle processes and their relationships: [4] [13] [15] [17] [18] [19] [27] [94] [95] [96]. Processes for software-intensive systems are discussed in [86]."}
  - {"page": 130, "locator": "G.2. Process Relationships", "reason": "no-marker", "text": "This use case often supports satisfying an agreement."}
  - {"page": 131, "locator": "Appendix H. Technical Processes", "reason": "no-marker", "text": "This appendix contains the Technical Processes from [4] with security-relevant considerations and contributions for the purpose, outcomes, activities, and tasks. As noted in Section G.2, the application of these processes at any life cycle stage is described in [96], which has a set of example stages and stage outcomes for enacting technical processes within system and software life cycles."}
  - {"page": 131, "locator": "H.1. Business or Mission Analysis", "reason": "no-marker", "text": "The purpose of the Business or Mission Analysis process is to define the overall strategic problem or opportunity, characterize the solution space, and determine potential solution class(es) that can address a problem or take advantage of an opportunity."}
  - {"page": 131, "locator": "H.1. Business or Mission Analysis", "reason": "no-marker", "text": "Reprinted with permission from IEEE, Copyright IEEE 2015, All rights reserved."}
  - {"page": 132, "locator": "References: [4] [97].BA-2.1", "reason": "no-marker", "text": "Note: The security-relevant trade space factors are analyzed within the context of all factors, including factors related to loss tolerances. The results of the analyses inform decisions on the suitability and feasibility of alternative options to be pursued."}
  - {"page": 132, "locator": "References: [4] [97].BA-2.2", "reason": "no-marker", "text": "Note: Information is elicited from stakeholders to acquire an understanding of the mission, business, or operational problem or opportunity from a system security perspective. Security aspects include security objectives, concerns, and constraints."}
