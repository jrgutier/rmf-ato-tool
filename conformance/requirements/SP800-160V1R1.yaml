  - id: "REQ-SP800-160V1R1-0157"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "However, determining how loss can occur does not require asking or answering"}
    kind: "modal"
    locator: "2.1.2"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE Finally, the causes of asset loss answer the following questions:"
    statement: "However, determining how loss can occur does not require asking or answering the question, “What is likely or probable to happen?”39"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0158"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "Protective measures that are provided by the machine portion of the system"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE These include:"
    statement: "• Protective measures that are provided by the machine portion of the system (i.e., the system architecture and design, the use of engineered features and devices within the architecture and design)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0159"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "Protective measures that are provided by the human in the system (i.e.,"}
