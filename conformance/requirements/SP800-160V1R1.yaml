requirements:
  - id: "REQ-SP800-160V1R1-0001"
    citation: {"ref": "SP800-160V1R1", "page": 14, "anchor": "“For the first few decades as a burgeoning discipline, cybersecurity has been"}
    kind: "modal"
    locator: "References"
    context: "VIEWING SECURITY FROM THE PROPER PERSPECTIVE"
    statement: "“For the first few decades as a burgeoning discipline, cybersecurity has been dominated by the development of widgets to address some aspect of the problem. Systems have become increasingly complex and interconnected, creating even more attack opportunities, which in turn creates even more opportunities to create defensive widgets that will bring some value in detecting or preventing an aspect of the attack space. Eventually, this becomes a game of whack-a-mole in which a simulated mole pops up from one of many holes and the objective is to whack the mole before it pops back in its hole. The moles represent new attacks, and the holes represent a huge array of potential vulnerabilities – both known and as-yet-undiscovered."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0002"
    citation: {"ref": "SP800-160V1R1", "page": 15, "anchor": "When crossing a bridge, we have a reasonable expectation that the bridge"}
    kind: "modal"
    locator: "References"
    context: "THE IMPORTANCE OF SCIENCE AND ENGINEERING"
    statement: "When crossing a bridge, we have a reasonable expectation that the bridge will not collapse and will get us to our destination without incident. For bridge builders, the focus is on equilibrium, static and dynamic loads, vibrations, and resonance. The science of physics combines with civil engineering principles and concepts to produce a product that we deem trustworthy, giving us a level of confidence that the bridge is fit-for-purpose."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0003"
    citation: {"ref": "SP800-160V1R1", "page": 16, "anchor": "“To deliver system behavior, the systems engineer must define a group of"}
    kind: "modal"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "“To deliver system behavior, the systems engineer must define a group of subsystems and precisely how those subsystems are to interact with each other. It is the subsystems and their interactions which produce the system-level behavior. Many of us recognize a vehicle that can take a 60-degree curve at 200 miles per hour as possessing a valuable system behavior. Would we as quickly recognize safe, private, trusted, and available as system behaviors? These behaviors require the same careful system-level design and trades to achieve optimal solutions as the performance system behavior I mentioned above. And there is a clear need — investors want the system to keep their data private, to be safe, and to be trustworthy so that their control is not compromised by a cyber threat, and to be highly available."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0004"
    citation: {"ref": "SP800-160V1R1", "page": 16, "anchor": "If we systems engineers are willing to recognize these behaviors as system"}
    kind: "modal"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "If we systems engineers are willing to recognize these behaviors as system behaviors, then we are accountable for delivering them as part of our job. If we choose to view these behaviors as attributes of the parts of our system but not the system as a whole, then we are likely to consider them as jobs for the “specialty engineers.” I’ve looked back into past behaviors of our system engineering community. What I find are examples of systems engineers giving our ‘specialty engineering’ colleagues these challenges by way of the requirements-allocation process. I think we have been wrong to do this. Our “specialty” colleagues are likely to take these allocated requirements and focus on building safe, private, trusted, available parts of a system—rather than in delivering safe, private, trusted, and available system behaviors. It is true you can build a safer system by building safe parts. However, you can’t build a truly safe system without having safe parts interacting with each other in a safe manner. The same can be said for other system behaviors (private, trusted, available, and so on).”"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0005"
    citation: {"ref": "SP800-160V1R1", "page": 17, "anchor": "Today’s systems1 are inherently complex. The growth in the size, number, and"}
    kind: "modal"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "Today’s systems1 are inherently complex. The growth in the size, number, and types of components and technologies2 that compose those systems as well as the system dependencies result in a range of consequences from inconvenience to catastrophic loss due to adversity3 within the operating environment. Managing the complexity of trustworthy secure systems requires achieving the appropriate level of confidence in the feasibility, correctness-in-concept, philosophy, and design of a system to produce only the intended behaviors and outcomes. This provides the foundation to address stakeholder protection needs and security concerns with sufficient confidence that the system functions only as intended while subjected to different types of adversity and to realistically bound those expectations with respect to constraints and uncertainty. The failure to address complexity and security will leave the Nation susceptible to potentially serious, severe, or catastrophic consequences."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0006"
    citation: {"ref": "SP800-160V1R1", "page": 17, "anchor": "The term security is used in this publication to mean freedom from"}
    kind: "modal"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "The term security is used in this publication to mean freedom from the conditions that can cause a loss of assets with unacceptable consequences.4 Stakeholders must define the scope of security in terms of the assets to which security applies and the consequences against which security is assessed.5 Systems engineering provides a foundation for a disciplined and structured approach to building assured, trustworthy secure systems. As a systems engineering subdiscipline, systems security engineering addresses security-relevant considerations intended to produce secure outcomes. The engineering efforts are conducted at the appropriate level of fidelity and rigor needed to achieve trustworthiness and assurance objectives."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0007"
    citation: {"ref": "SP800-160V1R1", "page": 17, "anchor": "“By trustworthiness, we mean simply worthy of being trusted to fulfill whatever"}
    kind: "should"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE Peter Neumann described the concept of trustworthiness in [2] as follows:"
    statement: "“By trustworthiness, we mean simply worthy of being trusted to fulfill whatever critical requirements may be needed for a particular component, subsystem, system, network, application, mission, enterprise, or other entity. Trustworthiness requirements might typically involve (for example) attributes of security, reliability, performance, and survivability under a wide range of potential adversities. Measures of trustworthiness are meaningful only to the extent that (a) the requirements are sufficiently complete and well defined, and (b) can be accurately evaluated.”"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0008"
    citation: {"ref": "SP800-160V1R1", "page": 17, "anchor": "The term technology is used in the broadest context in this publication"}
    kind: "indicative"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "The term technology is used in the broadest context in this publication to include computing, communications, and information technologies, as well as any mechanical, hydraulic, pneumatic, or structural components in systems that contain or are enabled by such technologies. This view of technology provides an increased recognition of the digital, computational, and electronic machine-based foundation of modern complex systems and the growing importance of an assured trustworthiness of that foundation in providing the system’s functional capability and interaction with its physical machine and human system elements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0009"
    citation: {"ref": "SP800-160V1R1", "page": 18, "anchor": "Systems security engineering provides complementary engineering capabilities that extend the concept of"}
    kind: "modal"
    locator: "References"
    context: "CRITICAL SYSTEM BEHAVIORS OF THE FUTURE"
    statement: "Systems security engineering provides complementary engineering capabilities that extend the concept of trustworthiness to deliver trustworthy secure systems. Trustworthiness is not only about demonstrably meeting a set of requirements. The requirements must also be complete, consistent, and correct. From a security perspective, a trustworthy system meets a set of well-defined requirements, including security requirements. Through evidence and expert judgment, trustworthy secure systems can limit and prevent the effects of modern adversities. Such adversities come in malicious and non-malicious forms and can emanate from a variety of sources, including physical and electronic. Adversities can include attacks from determined and capable adversaries, human errors of omission and commission, accidents and incidents, component faults and failures, abuses and misuses, and natural and human-made disasters."
    status: "candidate"
