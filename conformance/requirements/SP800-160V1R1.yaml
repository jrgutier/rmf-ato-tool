  - id: "REQ-SP800-160V1R1-0160"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "Protective measures that are provided by the physical environment (i.e., controlled access"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE These include:"
    statement: "• Protective measures that are provided by the physical environment (i.e., controlled access areas, facility access points, physical monitoring, environmental controls, fire suppression)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0161"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "The terminology used to describe means and methods includes mechanisms, configurations, controls,"}
    kind: "modal"
    locator: "2.1.2"
    context: "SIGNIFICANCE OF LOSS – AN EXAMPLE These include:"
    statement: "The terminology used to describe means and methods includes mechanisms, configurations, controls, safeguards, countermeasures, features, techniques, overrides, practices, procedures, processes, and inhibits. These may be applied in accordance with governing policies, regulations, laws, practices, standards, and techniques."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0162"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "Do not focus on what is likely to happen. Instead, focus on"}
    kind: "should"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "Do not focus on what is likely to happen. Instead, focus on what can happen, and be prepared. That is what systems security engineering means by adopting a preemptive and reactive strategy (Section D.2) in the form of a concept of secure function that addresses the spectrum of asset loss and associated consequences. This means proactively planning and designing to prevent the loss of an asset that you are not willing to accept, to be able to minimize the consequences should such a loss occur, and to be in an informed position to reactively recover from the loss when it does happen."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0163"
    citation: {"ref": "SP800-160V1R1", "page": 40, "anchor": "This point distinguishes analysis of what can happen from a risk assessment"}
    kind: "modal"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "This point distinguishes analysis of what can happen from a risk assessment that determines probability greater than zero and less than one that the adverse event will happen."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0164"
    citation: {"ref": "SP800-160V1R1", "page": 41, "anchor": "Stakeholders need to achieve their mission or business objectives in a secure"}
    kind: "modal"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "Stakeholders need to achieve their mission or business objectives in a secure manner that preserves assets and limits the extent of asset loss. Asset protection must be continuous, thereby making it possible for stakeholders to have a realistic expectation of continuous success in the ability of their systems to support and achieve their objectives."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0165"
    citation: {"ref": "SP800-160V1R1", "page": 41, "anchor": "The scope and expectations for the protection of assets is foundational to"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "The scope and expectations for the protection of assets is foundational to achieving the design intent for a trustworthy secure system. Protection needs typically correlate to the severity of consequences associated with the loss of an asset. The protection needs are determined from all needs, concerns, priorities, and constraints to protect and preserve stakeholder and system assets. There are three perspectives for protection needs: (1) the stakeholder perspective, (2) the system perspective, and (3) the trades perspective. Figure 7 illustrates the key input sources used to define protection needs and the outputs derived from the specification of those needs."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0166"
    citation: {"ref": "SP800-160V1R1", "page": 41, "anchor": "Requirements provide a formal and clear expression of the needs, concerns, priorities,"}
    kind: "modal"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "Requirements provide a formal and clear expression of the needs, concerns, priorities, and constraints to be satisfied for system function, operation, and maintenance. Each requirement is accompanied by verification methods for demonstrating that the requirement is satisfied. Requirements must be accurate, unambiguous, comprehensive, evaluatable, and achievable."
    status: "candidate"
