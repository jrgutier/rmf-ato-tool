  - id: "REQ-SP800-160V1R1-0342"
    citation: {"ref": "SP800-160V1R1", "page": 99, "anchor": "Note: The purpose of anomaly detection is to identify the need to"}
    kind: "modal"
    locator: "E.1. Anomaly Detection"
    context: ""
    statement: "Note: The purpose of anomaly detection is to identify the need to take corrective action to address a loss condition that has occurred or that will occur if conditions that affect the system behavior are allowed to persist. Anomaly detection is critical to achieving loss control objectives to prevent and limit loss and its adverse effects. The detection of such anomalies requires monitoring system behaviors and outcomes to determine when any deviations from the design intent occur. It also requires monitoring conditions in the environment to identify or forecast those conditions that can cause an anomaly in the system if corrective action is not taken."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0343"
    citation: {"ref": "SP800-160V1R1", "page": 99, "anchor": "Anomaly detection can be implemented at varying levels of abstraction (e.g., system,"}
    kind: "should"
    locator: "E.1. Anomaly Detection"
    context: ""
    statement: "Anomaly detection can be implemented at varying levels of abstraction (e.g., system, sub-system, assembly, function, mechanism) and may occur in periodic, aperiodic, or event-driven manners. The basis for anomaly detection within the system is the expectation that the system behaviors, outcomes, and interactions produced are expected to remain consistent, adhere to some norm, or are deterministic across all system states and modes. The types of anomalies include those associated with the results of system behavior; state consistency; continuity of function; integrity, correctness, and trustworthiness of system elements; system configuration; and the abuse or misuse of the system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0344"
    citation: {"ref": "SP800-160V1R1", "page": 100, "anchor": "Anomaly detection requires capturing data to support all intended response actions for"}
    kind: "modal"
    locator: "E.1. Anomaly Detection"
    context: ""
    statement: "Anomaly detection requires capturing data to support all intended response actions for a detected anomaly, including attribution-related data. Consequently, the fidelity in data describing the anomaly must be commensurate with the consequences of the loss scenarios associated with the anomaly and of wrong responses in addressing the detected anomaly. The responses taken will often rely on attribution to uniquely identifiable entities that may be responsible for undesired actions, behaviors, or outcomes. For non-human entities, corrective actions may include component replacements, repairs, or other corrections. For human entities, these may include training, remediation, or disciplinary actions. Wrongful attribution may have undesired consequences, such as the cost of unnecessarily repairing the wrong system element while an undesired condition persists or the wrongful termination of an individual. Attribution rigor is driven by the needed proof that an entity is responsible for an anomaly."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0345"
    citation: {"ref": "SP800-160V1R1", "page": 100, "anchor": "Basis for Correctness: A system model provides a basis against which actual"}
    kind: "lettered"
    locator: "E.1. Anomaly Detection.-"
    context: "Three aspects of anomaly detection are necessary to provide criteria for an appropriate response action or set of actions:"
    statement: "- Basis for Correctness: A system model provides a basis against which actual behavior and outcomes can be compared to confidently enable conclusions that an anomaly exists or to determine or forecast that an anomaly is about to occur. System models include normal, contingency, degraded, and other system states/modes of operation and account for the adversity to which the system is subjected."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0346"
    citation: {"ref": "SP800-160V1R1", "page": 100, "anchor": "Data Collection: Systems capture self-awareness data in the form of health, status,"}
    kind: "lettered"
    locator: "E.1. Anomaly Detection.-"
    context: "Three aspects of anomaly detection are necessary to provide criteria for an appropriate response action or set of actions:"
    statement: "- Data Collection: Systems capture self-awareness data in the form of health, status, test, and other data indicative of actual behavior and outcomes, including traceability to support attribution. Terms for data collection include instrumentation, monitoring, logging, auditing, self-tests, and built-in tests."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0347"
    citation: {"ref": "SP800-160V1R1", "page": 100, "anchor": "Data Interpretation: The interpretation of data allows for conclusions of unacceptable or"}
    kind: "lettered"
    locator: "E.1. Anomaly Detection.-"
    context: "Three aspects of anomaly detection are necessary to provide criteria for an appropriate response action or set of actions:"
    statement: "- Data Interpretation: The interpretation of data allows for conclusions of unacceptable or suspicious events that have happened (e.g., halt or failure condition), that are progressing (e.g., approaching a threshold of failure condition), or that can be expected to happen (i.e., in the absence of change, the failure condition will occur), including tracing to responsible entities to inform appropriate responses to events."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0348"
    citation: {"ref": "SP800-160V1R1", "page": 100, "anchor": "Caution must be taken with the use of design features that may"}
    kind: "modal"
    locator: "E.1. Anomaly Detection"
    context: "Three aspects of anomaly detection are necessary to provide criteria for an appropriate response action or set of actions:"
    statement: "Caution must be taken with the use of design features that may hinder anomaly detection. Poorly designed lines of defense for defense in depth have been found to conceal emerging dangerous system states and conditions, especially from human observers [40]. The system design must minimize the difference between estimated system states and conditions and actual system states and conditions."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0349"
    citation: {"ref": "SP800-160V1R1", "page": 100, "anchor": "Self-Anomaly Detection: An entity has no dependency on another entity to detect"}
    kind: "lettered"
    locator: "E.1. Anomaly Detection.-"
    context: "Two approaches to anomaly detection are:"
    statement: "- Self-Anomaly Detection: An entity has no dependency on another entity to detect an anomaly within the scope of its intended design. Self-anomaly detection usually involves an axiomatic or environmentally enforced assumption about its integrity. Typically, trusted elements have the capability for self-anomaly detection. This means that at the highest level of trustworthiness, an entity must be able to assess its internal state and functionality to a meaningful extent at various stages of execution. The detected anomalies must correlate to the trustworthiness assumptions placed on the entity."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0350"
    citation: {"ref": "SP800-160V1R1", "page": 100, "anchor": "Dependent Anomaly Detection: An entity-of-interest is dependent on another entity for some"}
    kind: "lettered"
    locator: "E.1. Anomaly Detection.-"
    context: "Two approaches to anomaly detection are:"
    statement: "- Dependent Anomaly Detection: An entity-of-interest is dependent on another entity for some or all anomalies that are detected. When an entity-of-interest relies on another entity for any portion of the assessment, that entity must be at least as trustworthy as the entity-of-interest."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0351"
    citation: {"ref": "SP800-160V1R1", "page": 101, "anchor": "Note: Abstractions can help manage the complexity of the system [24]. Clarity"}
    kind: "indicative"
    locator: "E.2. Clear Abstractions"
    context: ""
    statement: "Note: Abstractions can help manage the complexity of the system [24]. Clarity in the abstract representations of the system facilitates an accurate understanding of the system and how the system functions to deliver the required capability. Clear abstractions also reduce the potential for misunderstanding or misinterpretation of what is represented by the abstraction. Applying the principle of clear abstractions means that a system has simple, well-defined interfaces and functions that provide a consistent and intuitive view of the data and how it is managed. The elegance (e.g., accuracy, precision, simplicity, necessity, sufficiency) of the system interfaces – combined with a precise definition of the functional behavior of the interfaces – promotes ease of analysis, inspection, and testing, as well as the correct and secure use of the system. Examples that reflect the application of this principle include avoidance of redundant, unused interfaces; information hiding;78 and avoidance of semantic overloading of interfaces or their parameters (e.g., not using one function to provide different functionality, depending on how it is used)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0352"
    citation: {"ref": "SP800-160V1R1", "page": 101, "anchor": "It is important to ensure that the proper rigor is applied in"}
    kind: "modal"
    locator: "E.2. Clear Abstractions"
    context: ""
    statement: "It is important to ensure that the proper rigor is applied in the development of system abstractions during design. Clarity in the abstract representation of the system requires the use of well-defined syntax and semantics with elaboration as needed to ensure that the representations are well-defined, precise, necessary, and sufficient. Clear abstractions promote confidence in analysis, verification, and the correct use of the system. Abstractions can be achieved using models, including Systems Modeling Languages."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0353"
    citation: {"ref": "SP800-160V1R1", "page": 101, "anchor": "Note: The strength and effectiveness of the protection for a system element"}
    kind: "modal"
    locator: "E.3. Commensurate Protection"
    context: ""
    statement: "Note: The strength and effectiveness of the protection for a system element must be proportional to the need. As the need increases, the protection of that element should also increase to the same degree. Need is derived from the most significant adverse effect associated with the system element or the trust that is placed in the element. The protection can come in the form of the system element’s own self-protection, from protections provided by the system architecture, or from protection provided by other elements. The needed strength of protection is independent of these design choices (or others, such as distributed versus centralized design), a concept sometimes referred to as secure distributed composition [2]. Furthermore, confidence in the effectiveness of the protections provided to a system element should also increase commensurate to the need. This is addressed by the principle of Commensurate Rigor."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0354"
    citation: {"ref": "SP800-160V1R1", "page": 101, "anchor": "The term information hiding, also called representation-independent programming, is a design discipline"}
    kind: "should"
    locator: "E.4. Commensurate Response"
    context: ""
    statement: "The term information hiding, also called representation-independent programming, is a design discipline to ensure that the internal representation of information in one system component is not visible to another system component invoking or calling the first component, such that the published abstraction is not influenced by how the data may be managed internally."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0355"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "The effectiveness and aggressiveness of the engineered response to directly address the"}
    kind: "lettered"
    locator: "E.4. Commensurate Response.-"
    context: "Note: The selected response to a detected anomaly considers three factors to determine the effect that the response has on the loss and the system:"
    statement: "- The effectiveness and aggressiveness of the engineered response to directly address the anomaly and to prevent or limit the loss"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0356"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "The direct, residual, or side effect of the response on the system"}
    kind: "lettered"
    locator: "E.4. Commensurate Response.-"
    context: "Note: The selected response to a detected anomaly considers three factors to determine the effect that the response has on the loss and the system:"
    statement: "- The direct, residual, or side effect of the response on the system"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0357"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "The opportunities that remain to take other response actions should the selected"}
    kind: "lettered"
    locator: "E.4. Commensurate Response.-"
    context: "Note: The selected response to a detected anomaly considers three factors to determine the effect that the response has on the loss and the system:"
    statement: "- The opportunities that remain to take other response actions should the selected response fail to achieve the intended result"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0358"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "Commensurate responses require consideration of the response-effect-consequence relationship associated with a specific"}
    kind: "modal"
    locator: "E.4. Commensurate Response"
    context: ""
    statement: "Commensurate responses require consideration of the response-effect-consequence relationship associated with a specific loss. Ideally, for any given need for a response, a single action taken will be effective to resolve the loss concern and will have no associated adverse effect. Practically, due to complexity and the limits of certainty, the response action may not have the desired effect, may compound the problem, or may cause another problem. The balance required is one that determines if, when, and how a response action should be taken to be initially more aggressive or initially less aggressive. The severity of the problem and the time available for an effective response dictate a strategy for a continuum of responses, characterized by two extremes:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0359"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "Graduated Response: A graduated response is initially the least aggressive or impactful"}
    kind: "lettered"
    locator: "E.4. Commensurate Response.-"
    context: "The severity of the problem and the time available for an effective response dictate a strategy for a continuum of responses, characterized by two extremes:"
    statement: "- Graduated Response: A graduated response is initially the least aggressive or impactful action possible to prevent the loss from continuing or escalating and does so with consideration of the possible side effects associated with the response action. The graduated response allows for taking increasingly more aggressive action should the loss situation persist or escalate."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0360"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "Ungraduated Response: An ungraduated response is the most aggressive and impactful action"}
    kind: "lettered"
    locator: "E.4. Commensurate Response.-"
    context: "The severity of the problem and the time available for an effective response dictate a strategy for a continuum of responses, characterized by two extremes:"
    statement: "- Ungraduated Response: An ungraduated response is the most aggressive and impactful action to prevent the loss from continuing or escalating and does so without consideration of the potential side effects associated with the response action. The ungraduated response recognizes the severity of the loss as justifying the most aggressive action, even if that option provides no alternatives should it fail to have the intended or desired effect or if it causes other losses to occur."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0361"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "Without early observability of potential loss, the option for a graduated response"}
    kind: "modal"
    locator: "E.4. Commensurate Response"
    context: "The severity of the problem and the time available for an effective response dictate a strategy for a continuum of responses, characterized by two extremes:"
    statement: "Without early observability of potential loss, the option for a graduated response may not exist. A commensurate response is aided by early detection, which in turn increases the options for a graduated response."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0362"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "Principle: The rigor associated with the conduct of an engineering activity provides"}
    kind: "modal"
    locator: "E.5. Commensurate Rigor"
    context: ""
    statement: "Principle: The rigor associated with the conduct of an engineering activity provides the confidence required to address the most significant adverse effect that can occur."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0363"
    citation: {"ref": "SP800-160V1R1", "page": 102, "anchor": "The principle of commensurate rigor helps to ensure that the concept of"}
    kind: "modal"
    locator: "E.5. Commensurate Rigor"
    context: ""
    statement: "The principle of commensurate rigor helps to ensure that the concept of rigor is included as an equal factor in the trade space of capability, adverse effect, cost, and schedule in the planning and conduct of engineering activities, method and tool selection, and personnel selection. An increase in rigor may translate into an increase in the cost of personnel, methods, and tools required to complete rigorous engineering activities or an increase in schedule to accomplish the activities with the expected rigor. Any increased cost that may occur can be justified by acquiring confidence about system performance to limit loss while also addressing the system’s ability to deliver the capability. Therefore, the rigor associated with an engineering activity should be commensurate with the significance of the most adverse effect associated with the activity."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0364"
    citation: {"ref": "SP800-160V1R1", "page": 103, "anchor": "Note: A trusted element continuously exhibits properties of trust during the time"}
    kind: "modal"
    locator: "E.6. Commensurate Trustworthiness"
    context: ""
    statement: "Note: A trusted element continuously exhibits properties of trust during the time that it is depended upon by other system elements. The degree of trustworthiness needed for a trusted element is determined by those entities that depend on the element. Some basis is required to support decisions about trust and trustworthiness. The basis includes expressing the trust that is to be placed in a system element, expressing the trustworthiness that is exhibited by the element, and comparing the trustworthiness of different system elements. This principle is particularly relevant when considering systems and elements with complex chains of trust dependencies."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0365"
    citation: {"ref": "SP800-160V1R1", "page": 103, "anchor": "Note: The trustworthiness of an aggregate of composed system elements cannot be"}
    kind: "modal"
    locator: "E.7. Compositional Trustworthiness"
    context: ""
    statement: "Note: The trustworthiness of an aggregate of composed system elements cannot be assumed based on the trustworthiness assertions of each individual element in the aggregate. Further, the trustworthiness of an aggregate of composed trustworthy system elements cannot be assumed to be equal to the trustworthiness of the least trustworthy element in the aggregate. By definition, a system is a combination of interacting system elements. Each system function results from the emergent behavior of a composed set of system elements. Similarly, the trustworthiness of a composed set of system elements is an emergent property of the composition. Therefore, the trustworthiness of the composed set of system elements (i.e., aggregate) for a given system function must be determined by treating the aggregate as a single discrete element. The compositional trustworthiness principle addresses how an argument can be made for system-level trustworthiness given how the constituent elements of the system compose to form the system and do so by adhering to the composition principles."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0366"
    citation: {"ref": "SP800-160V1R1", "page": 103, "anchor": "Principle: The protection provided for a system element must be effective and"}
    kind: "modal"
    locator: "E.8. Continuous Protection"
    context: ""
    statement: "Principle: The protection provided for a system element must be effective and uninterrupted during the time that the protection is required."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0367"
    citation: {"ref": "SP800-160V1R1", "page": 103, "anchor": "Note: The protection capability must be uninterrupted across all relevant system states,"}
    kind: "modal"
    locator: "E.8. Continuous Protection"
    context: ""
    statement: "Note: The protection capability must be uninterrupted across all relevant system states, modes, and transitions for there to be assurance that the system can be effective in delivering the required capability while controlling loss. Continuous protection requires adherence to the following principles:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0368"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "Trustworthy System Control: Every controlled action is constrained by the mechanism, and"}
    kind: "lettered"
    locator: "E.8. Continuous Protection.-"
    context: "Continuous protection requires adherence to the following principles:"
    statement: "- Trustworthy System Control: Every controlled action is constrained by the mechanism, and the mechanism can protect itself from tampering. Sufficient assurance of the correctness and completeness of the mechanism can be ascertained from analysis and testing."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0369"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "Protective Failure and Protective Recovery: A protective state is preserved during error,"}
    kind: "lettered"
    locator: "E.8. Continuous Protection.-"
    context: "Continuous protection requires adherence to the following principles:"
    statement: "- Protective Failure and Protective Recovery: A protective state is preserved during error, fault, failure, and successful attack, as well as during the recovery of assets or of recovery to normal, degraded, or alternative operational modes."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0370"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "Continuous protection applies to all configurations, states, and modes of the system,"}
    kind: "modal"
    locator: "E.8. Continuous Protection"
    context: "Continuous protection requires adherence to the following principles:"
    statement: "Continuous protection applies to all configurations, states, and modes of the system, as well as the transitions between those configurations, states, and modes. The system design must ensure that protections are coordinated and composed in a non-conflicting and mutually supportive manner across the non-behavioral aspects of the system structure and the behavioral aspects of system function and data flow."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0371"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "While the design for continuous protection applies for the entire time that"}
    kind: "modal"
    locator: "E.8. Continuous Protection"
    context: ""
    statement: "While the design for continuous protection applies for the entire time that the protection is required, the protection capability is sometimes intentionally disabled (e.g., Battleshort79 intentional override). The intentional disabling/override of protection is an exception case and, therefore, does not violate this principle. That is, the principle of continuous protection applies only for the entirety of time that the protection is required and not knowingly and intentionally disabled.80"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0372"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "Multiple lines of defenses or barriers should be placed along loss scenario"}
    kind: "lettered"
    locator: "E.9. Defense In Depth.-"
    context: "The principle of defense in depth has three pillars:"
    statement: "- Multiple lines of defenses or barriers should be placed along loss scenario sequences."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0373"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "Loss control should not rely on a single defensive element."}
    kind: "lettered"
    locator: "E.9. Defense In Depth.-"
    context: "The principle of defense in depth has three pillars:"
    statement: "- Loss control should not rely on a single defensive element."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0374"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "The successive barriers should be diverse in nature and include technical, operational,"}
    kind: "lettered"
    locator: "E.9. Defense In Depth.-"
    context: "The principle of defense in depth has three pillars:"
    statement: "- The successive barriers should be diverse in nature and include technical, operational, and organizational barriers [52]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0375"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "Defense in depth requires the use of coordinated mechanisms (active) within an"}
    kind: "modal"
    locator: "E.9. Defense In Depth"
    context: "The principle of defense in depth has three pillars:"
    statement: "Defense in depth requires the use of coordinated mechanisms (active) within an architectural structure (passive) that achieves the depth characteristic.81 Ideally, the initial lines of defense prevent loss, while subsequent lines of defense block loss scenario escalation and/or contain loss and potential consequences when needed. A defense-in-depth strategy examines loss scenarios for those points of opportunity to prevent or contain loss. It also leverages the opportunities to use active or passive mechanisms or constraints to meet loss control objectives."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0376"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "Battleshort is the capability to bypass normal interlocks in mission-critical equipment (e.g.,"}
    kind: "modal"
    locator: "E.9. Defense In Depth"
    context: ""
    statement: "Battleshort is the capability to bypass normal interlocks in mission-critical equipment (e.g., equipment that must not be shut down or the mission function will fail) during battle conditions [51]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0377"
    citation: {"ref": "SP800-160V1R1", "page": 104, "anchor": "However, the inclusion of a capability for intentionally disabling/overriding protection requires additional"}
    kind: "modal"
    locator: "E.9. Defense In Depth"
    context: ""
    statement: "However, the inclusion of a capability for intentionally disabling/overriding protection requires additional control features, devices, and associated analysis for the enforcement of constraints to prevent the inadvertent actuation of the override capability."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0378"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Defense in depth is, in part, a form of the principle of"}
    kind: "should"
    locator: "E.9. Defense In Depth"
    context: ""
    statement: "Defense in depth is, in part, a form of the principle of Protective Failure. It helps satisfy the objective that a failure of a system element should not result in an unacceptable loss. However, it does not satisfy the objective that a failure of a system element should not invoke another loss scenario."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0379"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Note: Distributed privilege82 is a means to require agreement and coordination from"}
    kind: "modal"
    locator: "E.10. Distributed Privilege"
    context: ""
    statement: "Note: Distributed privilege82 is a means to require agreement and coordination from multiple entities when performing an operation, thereby preventing a single entity from acting alone. Distributed privilege separates, divides, or in some other manner distributes the privileges required to perform an operation among multiple entities. This distribution includes a set of rules, conditions, and constraints that describe how multiple entities must interact through positive actions before a requested operation can proceed and be completed. The rules, conditions, and constraints may reflect combinations of the following:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0380"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Simultaneous Actions: Multiple different authorized entities execute a command within a specified"}
    kind: "lettered"
    locator: "E.10. Distributed Privilege.-"
    context: "The rules, conditions, and constraints may reflect combinations of the following:"
    statement: "- Simultaneous Actions: Multiple different authorized entities execute a command within a specified time window."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0381"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Sequenced Actions: Multiple different entities interact within a linear sequence of actions"}
    kind: "lettered"
    locator: "E.10. Distributed Privilege.-"
    context: "The rules, conditions, and constraints may reflect combinations of the following:"
    statement: "- Sequenced Actions: Multiple different entities interact within a linear sequence of actions where each successive action is enabled only by the successful completion of a prior action."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0382"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Parallel Actions: Multiple entities execute sequences concurrently, and success is achieved either"}
    kind: "lettered"
    locator: "E.10. Distributed Privilege.-"
    context: "The rules, conditions, and constraints may reflect combinations of the following:"
    statement: "- Parallel Actions: Multiple entities execute sequences concurrently, and success is achieved either by a consensus of the results of each concurrent action or by voting among the participants."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0383"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Defeating distributed privilege requires collusion to take an unauthorized or improper action."}
    kind: "modal"
    locator: "E.10. Distributed Privilege"
    context: "The rules, conditions, and constraints may reflect combinations of the following:"
    statement: "Defeating distributed privilege requires collusion to take an unauthorized or improper action. In the case of an attack, distributed privilege forces the adversary to target all of the entities to whom privilege is distributed."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0384"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Note: A system design that incorporates diversity helps to avoid common mode"}
    kind: "modal"
    locator: "E.11. Diversity (Dynamicity)"
    context: ""
    statement: "Note: A system design that incorporates diversity helps to avoid common mode failures and introduces unpredictability to adversaries, thus complicating the planning and execution of where, when, and how to target their attacks. While the system behaviors that result from a design may be unpredictable from the viewpoint of the adversary, the design itself must be predictable and verifiable in achieving only the intended outcomes. The options for diversity include variety in the system structural and architectural design elements, the system functional and behavioral elements, the interfaces and interconnections between interfaces, the data and control flow, and the technology and component selection. Diversity can reside in:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0385"
    citation: {"ref": "SP800-160V1R1", "page": 105, "anchor": "Fixed or static characteristics of the system (e.g., multiple instances of a"}
    kind: "lettered"
    locator: "E.11. Diversity (Dynamicity).-"
    context: "Diversity can reside in:"
    statement: "- Fixed or static characteristics of the system (e.g., multiple instances of a system element, multiple communication channels)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0386"
    citation: {"ref": "SP800-160V1R1", "page": 106, "anchor": "Variable or dynamic characteristics of the system (e.g., reconfiguration, relocation, refresh of"}
    kind: "lettered"
    locator: "E.11. Diversity (Dynamicity).-"
    context: ""
    statement: "- Variable or dynamic characteristics of the system (e.g., reconfiguration, relocation, refresh of system elements; random routing of data over different communication channels from source to destination; the ability to change aspects of the system behavior, structure, data, or configuration in a random but nonetheless verifiable manner)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0387"
    citation: {"ref": "SP800-160V1R1", "page": 106, "anchor": "A design approach that includes diversity in structure, configuration, communications, protocols, and"}
    kind: "modal"
    locator: "E.11. Diversity (Dynamicity)"
    context: ""
    statement: "A design approach that includes diversity in structure, configuration, communications, protocols, and similar or dissimilar system elements (e.g., N-version, heterogeneity) increases uncertainty due to the increased complexity of the design and the behaviors and outcomes that stem from emergent effects, side effects, and feature interaction. This drives the need for confidence that the design approach will deliver only the authorized and intended functional behavior, produce only the authorized and intended outcomes, and do so in a manner that allows for control over side effects, emergence, and feature interaction."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0388"
    citation: {"ref": "SP800-160V1R1", "page": 106, "anchor": "The uncertainty and diminished predictability associated with the employment of diversity and"}
    kind: "modal"
    locator: "E.11. Diversity (Dynamicity)"
    context: ""
    statement: "The uncertainty and diminished predictability associated with the employment of diversity and dynamicity in design can be problematic where it impedes or prevents having confidence that the system will function and produce outcomes only as authorized and intended. It is important to differentiate where the uncertainty lies: (1) uncertainty in how the system achieves an end objective (i.e., the means to an end) or (2) uncertainty that an objective will be achieved (i.e., achieving the end). A design that employs diversity and dynamicity must be based on acquiring confidence that the system will produce only the desired results despite uncertainty in knowing exactly how the desired results are achieved. This constitutes a design trade that is specific to diversity- and dynamicity-based designs. Diversity may have a cost (e.g., hardware, software, maintenance, training, assurance) greater than the value or effectiveness that it provides."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0389"
    citation: {"ref": "SP800-160V1R1", "page": 106, "anchor": "Note: The separation of domains enables enhanced control and, therefore, protection of"}
    kind: "imperative"
    locator: "E.12. Domain Separation"
    context: ""
    statement: "Note: The separation of domains enables enhanced control and, therefore, protection of system function and the flow of data. Control relative to separated domains limits the extent to which an entity or domain is influenced by or is able to influence some other entity or domain, thereby enhancing the protection of a domain. This is achieved through the control of information flow and data between domains as well as control over the use of a system capability between domains."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0390"
    citation: {"ref": "SP800-160V1R1", "page": 106, "anchor": "The differing protection needs that are used to define domains may be"}
    kind: "indicative"
    locator: "E.12. Domain Separation"
    context: ""
    statement: "The differing protection needs that are used to define domains may be thought of in terms of protecting the domain from influence by external entities (i.e., susceptibility) and protecting external entities from erroneous behavior that occurs within the domain (i.e., containment). This distinction may include separating critical functions from less critical functions, such as separating the flight control functions of a transport aircraft from the environmental control functions that maintain a safe environment for the cargo and passengers being transported."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0391"
    citation: {"ref": "SP800-160V1R1", "page": 107, "anchor": "Domain separation requires a domain to be contained within its own protected"}
    kind: "modal"
    locator: "E.12. Domain Separation"
    context: ""
    statement: "Domain separation requires a domain to be contained within its own protected subsystem so that elements of the domain are only directly accessible by procedures or functions of the protected subsystem. The concept of isolation enables the implementation of domain separation. Isolation limits the extent to which one domain can influence or can be influenced by other entities. The challenge is that the system elements within domains must at times interact with other elements and the environment to deliver a capability. Every interface that results from design decisions can diminish domain separation while achieving requirements for a system capability. External requests for resources or functions within protected subsystems are arbitrated at these interfaces. Firewall, data diodes, and cross-domain solutions (CDS) are examples of mechanisms that enable varying degrees of control over the interactions between separated domains."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0392"
    citation: {"ref": "SP800-160V1R1", "page": 107, "anchor": "Encryption is another mechanism often used to provide domain separation. For example,"}
    kind: "indicative"
    locator: "E.12. Domain Separation"
    context: ""
    statement: "Encryption is another mechanism often used to provide domain separation. For example, communication between distinct subsystems within a domain may be encrypted with a key that is known only to the subsystems within the domain. Where a common storage module or subsystem is used for multiple domains, encryption may be used to limit information access to the domain that owns the key to decrypt."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0393"
    citation: {"ref": "SP800-160V1R1", "page": 107, "anchor": "Note: Hierarchical protection is a simplifying assumption for trade decisions to help"}
    kind: "modal"
    locator: "E.13. Hierarchical Protection"
    context: ""
    statement: "Note: Hierarchical protection is a simplifying assumption for trade decisions to help determine where emphasis is placed in providing protection and the extent of the protection effectiveness. The simplifying assumption introduces susceptibilities to system elements that are dependent on more trustworthy elements. The assumption relies on validated trust assertions about the more trustworthy element and acceptable uncertainty associated with behavior outside of the scope of the validated trust assertions. For example, systems may include a human element, which is often the more trustworthy element. The assertions of the trusted human are violated for the malicious insider threat. The extent to which any element is considered trustworthy has limits, and beyond those limits, the element should not be assumed to remain trustworthy. In the degenerate case of the most trustworthy system element, it must protect itself from all other elements. For example, if an operating system kernel is deemed the most trustworthy component in a system, then it must protect itself from the less trustworthy applications it supports. However, the applications do not need to protect themselves from the operating system kernel."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0394"
    citation: {"ref": "SP800-160V1R1", "page": 107, "anchor": "Note: Susceptibility and vulnerability increase unnecessarily when a system element provides more"}
    kind: "should"
    locator: "E.14. Least Functionality"
    context: ""
    statement: "Note: Susceptibility and vulnerability increase unnecessarily when a system element provides more functionality than is needed to achieve its intended purpose. Least functionality reduces the potential for susceptibility and vulnerability and reduces the scope of analysis of the system element’s trustworthiness and loss potential. The strictest interpretation of least functionality is to prohibit any system element functions that are not required. Where that is not possible or practical, the unnecessary functions of the system element should be disabled, disarmed, or put into a “safe” mode that prevents the functions from being used. In all other cases, mediated access can be used to prevent access to and use of the unneeded functions."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0395"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "An example of when it may not be possible or practical to"}
    kind: "modal"
    locator: "E.14. Least Functionality"
    context: ""
    statement: "An example of when it may not be possible or practical to avoid unnecessary functions is the use of commercial off-the-shelf (COTS) components. COTS components typically contain functions beyond those required to fulfill their intended purpose. In such cases, the components should be configured to enable only the functions that are required to fulfill their purpose and prohibit or restrict functions that are not required to fulfill their purpose."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0396"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "The broadest interpretation of least persistence is to not install, instantiate, or"}
    kind: "should"
    locator: "E.15. Least Persistence"
    context: ""
    statement: "The broadest interpretation of least persistence is to not install, instantiate, or apply power to system elements and resources until needed and to completely remove system elements or power from system elements and resources when they are no longer required. When it is not possible or practical to do so, those system elements and resources should be fully disabled, disarmed, or put into safe mode to prevent their ability to function or be used. Finally, when it is not possible to disable, disarm or put into safe mode, access to those elements and resources should be mediated to constrain the time and duration of their use (Mediated Access)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0397"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "Presence (active and non-active): The system element or resource must be installed,"}
    kind: "lettered"
    locator: "E.15. Least Persistence.-"
    context: "Three conditions must be satisfied for an active system element or resource to be usable, and two of these conditions apply to non-active elements or resources:"
    statement: "- Presence (active and non-active): The system element or resource must be installed, loaded, residing in memory (software), and configured."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0398"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "Accessible (active and non-active): The system element or resource must be invoked,"}
    kind: "lettered"
    locator: "E.15. Least Persistence.-"
    context: "Three conditions must be satisfied for an active system element or resource to be usable, and two of these conditions apply to non-active elements or resources:"
    statement: "- Accessible (active and non-active): The system element or resource must be invoked, interacted with, or operated on."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0399"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "Able to Function (active): The system element or resource must be able"}
    kind: "lettered"
    locator: "E.15. Least Persistence.-"
    context: "Three conditions must be satisfied for an active system element or resource to be usable, and two of these conditions apply to non-active elements or resources:"
    statement: "- Able to Function (active): The system element or resource must be able to execute (i.e., powered on, enabled, or armed) to deliver a service or perform a function."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0400"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "Cleansing the system element to remove corrupted aspects or side effects"}
    kind: "lettered"
    locator: "E.15. Least Persistence.-"
    context: "Least persistence has added benefits that include simplifying the processes of:"
    statement: "- Cleansing the system element to remove corrupted aspects or side effects"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0401"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "Re-establishing the system element to a known state (i.e., a refresh)"}
    kind: "lettered"
    locator: "E.15. Least Persistence.-"
    context: "Least persistence has added benefits that include simplifying the processes of:"
    statement: "- Re-establishing the system element to a known state (i.e., a refresh)"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0402"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "Minimizing the time in which system elements are exposed to the environment,"}
    kind: "lettered"
    locator: "E.15. Least Persistence.-"
    context: "Least persistence has added benefits that include simplifying the processes of:"
    statement: "- Minimizing the time in which system elements are exposed to the environment, to attack, and to erroneous behavior"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0403"
    citation: {"ref": "SP800-160V1R1", "page": 108, "anchor": "Where system elements or resources are removed and then restored as needed,"}
    kind: "modal"
    locator: "E.15. Least Persistence"
    context: "Least persistence has added benefits that include simplifying the processes of:"
    statement: "Where system elements or resources are removed and then restored as needed, there must be a trusted representation of the system element and a trusted ability to instantiate that system element within the time constraints for its use."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0404"
    citation: {"ref": "SP800-160V1R1", "page": 109, "anchor": "Note: System elements can be implemented by entities such as hardware, firmware,"}
    kind: "modal"
    locator: "E.16. Least Privilege"
    context: ""
    statement: "Note: System elements can be implemented by entities such as hardware, firmware, software, and personnel. By design, the system must be able to limit the scope of a system element’s actions. This has two desirable effects: (1) the impact of a failure, corruption, or misuse of the element is minimized, and"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0405"
    citation: {"ref": "SP800-160V1R1", "page": 109, "anchor": "the analysis of the system element is simplified. A design driven by"}
    kind: "lettered"
    locator: "E.16. Least Privilege.(2)"
    context: ""
    statement: "(2) the analysis of the system element is simplified. A design driven by least privilege considerations results in a sufficiently fine granularity of privilege decomposition and the ability for the fine-grained allocation of privileges to human and machine elements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0406"
    citation: {"ref": "SP800-160V1R1", "page": 109, "anchor": "The application of the principle of least privilege means allocating to a"}
    kind: "modal"
    locator: "E.16. Least Privilege.(2)"
    context: ""
    statement: "The application of the principle of least privilege means allocating to a system element only the privileges that are necessary to permit that element to perform the functions required of it. This could include a need to modify, delete, use, or configure a resource, or to authorize, start/enable, or stop/disable a process [20]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0407"
    citation: {"ref": "SP800-160V1R1", "page": 109, "anchor": "Note: Sharing via common mechanism and other means can increase the susceptibility"}
    kind: "modal"
    locator: "E.17. Least Sharing"
    context: ""
    statement: "Note: Sharing via common mechanism and other means can increase the susceptibility of system resources (e.g., data, information, system variables, interfaces, functions, services) to unauthorized access, disclosure, use, or modification and can adversely affect the capabilities provided by the system. According to Saltzer and Schroeder [46], “Every shared mechanism (especially one involving shared variables) represents a potential information path between users and must be designed with great care to be sure it does not unintentionally compromise security.” A design that employs least sharing helps reduce the adverse consequences that can result from sharing system functions, state, resources, and variables among different system elements. A system element that corrupts a shared state or shared variables has the potential to corrupt other elements whose behavior is dependent on the state. Minimized sharing also helps to simplify the design and implementation [54]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0408"
    citation: {"ref": "SP800-160V1R1", "page": 110, "anchor": "Note: Margins refer to the difference between a conservative threshold at which"}
    kind: "modal"
    locator: "E.18. Loss Margins"
    context: ""
    statement: "Note: Margins refer to the difference between a conservative threshold at which the system is expected to operate while subjected to adversity and the point at which the adversity results in failure. Loss margins are created by engineered features put in place to maintain operational conditions and the associated adversity level at some distance (i.e., conservative threshold) from the estimated critical adversity threshold or loss-triggering threshold. Loss margins also allow for increased time to (1) detect the need for a response action (Anomaly Detection), (2) determine what the response action should be (Commensurate Response), and (3) complete the selected response action. When there is uncertainty about the effectiveness of the response action, loss margins need to allow time to evaluate response effectiveness, determine any additional actions needed, and complete any selected actions."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0409"
    citation: {"ref": "SP800-160V1R1", "page": 110, "anchor": "Intelligently designed and executed attacks, including attacks that persist and evolve over"}
    kind: "lettered"
    locator: "E.18. Loss Margins.-"
    context: "Specifically, loss margins are effective in addressing uncertainty associated with:"
    statement: "- Intelligently designed and executed attacks, including attacks that persist and evolve over time"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0410"
    citation: {"ref": "SP800-160V1R1", "page": 110, "anchor": "Unknown, unquantified, and underappreciated susceptibilities, threats, vulnerabilities, hazards, and associated risks"}
    kind: "lettered"
    locator: "E.18. Loss Margins.-"
    context: "Specifically, loss margins are effective in addressing uncertainty associated with:"
    statement: "- Unknown, unquantified, and underappreciated susceptibilities, threats, vulnerabilities, hazards, and associated risks"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0411"
    citation: {"ref": "SP800-160V1R1", "page": 110, "anchor": "For designs that incorporate loss margins, uncertainty about adversity makes determining the"}
    kind: "should"
    locator: "E.18. Loss Margins"
    context: "Specifically, loss margins are effective in addressing uncertainty associated with:"
    statement: "For designs that incorporate loss margins, uncertainty about adversity makes determining the loss-triggering thresholds difficult. Loss margins for design should be determined with a balance between certainty (i.e., what has happened and can happen again) and uncertainty (i.e., what has not happened but can happen, or what has happened but can also happen in a different way). Loss scenarios that include loss escalation and an estimation of the critical threshold for loss occurrence are helpful in making design decisions that incorporate loss margins. Loss scenarios also help to determine the limits of adversity-driven decisions due to uncertainty in knowledge about the adversity (i.e., the adversity is insufficiently known or understood or is just unknown)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0412"
    citation: {"ref": "SP800-160V1R1", "page": 110, "anchor": "Sensitivity analyses must inform the determination of loss margins. Other factors for"}
    kind: "modal"
    locator: "E.18. Loss Margins"
    context: ""
    statement: "Sensitivity analyses must inform the determination of loss margins. Other factors for computing loss margins include system complexity, the use of newer technology or older technology in new ways, and the degree of new environments being introduced. An additional factor is the ability to complete comprehensive and effective testing. Limitations on system test coverage and effectiveness for actual, simulated, or emulated adversity necessitate larger margins to account for the remaining uncertainty. The size of the margin may be reduced over time as unknown and underappreciated loss scenarios are uncovered and corrected. The size of the margin may also need to be increased over time as a malicious adversity capability matures in sophistication."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0413"
    citation: {"ref": "SP800-160V1R1", "page": 110, "anchor": "Place limits on access to and use of the system"}
    kind: "lettered"
    locator: "E.19. Mediated Access.-"
    context: "The purpose of mediated access is to:"
    statement: "- Place limits on access to and use of the system"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0414"
    citation: {"ref": "SP800-160V1R1", "page": 110, "anchor": "Reduce the possibility of loss escalation"}
    kind: "lettered"
    locator: "E.19. Mediated Access.-"
    context: "The purpose of mediated access is to:"
    statement: "- Reduce the possibility of loss escalation"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0415"
    citation: {"ref": "SP800-160V1R1", "page": 111, "anchor": "Reduce the extent to which loss escalates and propagates"}
    kind: "lettered"
    locator: "E.19. Mediated Access.-"
    context: "The purpose of mediated access is to:"
    statement: "- Reduce the extent to which loss escalates and propagates"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0416"
    citation: {"ref": "SP800-160V1R1", "page": 111, "anchor": "Access to the System Element: The requesting entity only has authorized access"}
    kind: "lettered"
    locator: "E.19. Mediated Access.-"
    context: "Mediated access is based on the interaction between an entity and a target system element and has two aspects:"
    statement: "- Access to the System Element: The requesting entity only has authorized access to a target system element."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0417"
    citation: {"ref": "SP800-160V1R1", "page": 111, "anchor": "Use of the System Element: The requesting entity is only allowed to"}
    kind: "lettered"
    locator: "E.19. Mediated Access.-"
    context: "Mediated access is based on the interaction between an entity and a target system element and has two aspects:"
    statement: "- Use of the System Element: The requesting entity is only allowed to perform authorized operations on the target system element."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0418"
    citation: {"ref": "SP800-160V1R1", "page": 111, "anchor": "Trusted elements are generally costlier to construct due to increased rigor in"}
    kind: "modal"
    locator: "E.20. Minimal Trusted Elements"
    context: ""
    statement: "Trusted elements are generally costlier to construct due to increased rigor in engineering processes and activities. They also require more analysis to qualify their trustworthiness. Minimizing the number of trusted system elements reduces the cost of analysis (i.e., decreases the size, scope, and complexity of the analysis). When the minimization of trusted system elements considers the principle of Commensurate Protection, the cost-effectiveness of the analysis is also ensured (i.e., cost of the analysis is justified by the extent of trust required)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0419"
    citation: {"ref": "SP800-160V1R1", "page": 111, "anchor": "Historically, the analysis of interactions between trusted system elements and untrusted system"}
    kind: "modal"
    locator: "E.20. Minimal Trusted Elements"
    context: ""
    statement: "Historically, the analysis of interactions between trusted system elements and untrusted system elements is one of the most important aspects of the trust-based verification of system security performance. If these interactions are unnecessarily complex, the security of the system will also be more difficult to ascertain than one whose internal trust relationships are simple and elegantly constructed. In general, fewer trusted components will result in fewer internal trust relationships and a simpler system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0420"
    citation: {"ref": "SP800-160V1R1", "page": 112, "anchor": "Note: A system that is not discoverable, observable, or trackable by an"}
    kind: "modal"
    locator: "E.21. Minimize Detectability"
    context: ""
    statement: "Note: A system that is not discoverable, observable, or trackable by an adversarial threat or exposed to such a threat is less prone to a targeted attack. Minimizing detectability drives engineering design decisions to eliminate or reduce exposures such as unnecessary interfaces, access points, footprints, and emanations, thereby reducing susceptibility to adversarial threat actions. Interfaces and access points have the effect of exposing the system to intentional adversity (i.e., attacks) and unintentional adversity (i.e., faults, errors, incidents, accidents). Yet interfaces and access points are necessary to compose system elements to deliver required capabilities, and duplicating interfaces and access points is needed to avoid single points of failure. System design must balance the need for interfaces with the susceptibility that results from the interface being exposed, discovered, and observed. Every interface, whether internal or external, constitutes an exposure that must be considered."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0421"
    citation: {"ref": "SP800-160V1R1", "page": 112, "anchor": "Minimizing detectability reduces the ability of an adversary to observe and discover"}
    kind: "should"
    locator: "E.21. Minimize Detectability"
    context: ""
    statement: "Minimizing detectability reduces the ability of an adversary to observe and discover information about the system to craft and execute attacks. This includes detecting a system’s location, presence, and movement (e.g., due to emissions, signatures, or footprints). Ways by which a system may be detected include heat emission, electronic magnetic (EM) emissions, sound, vibrations, reflecting radar waves or light, response to stimulus (e.g., a response to an Internet Control Message Protocol [ICMP] echo request or “ping”), and software traces and thrown exceptions. Specific forms or means to minimize detectability include camouflage, stealth, low probability of intercept/low probability of detect (LPI/LPD) waveforms (for radios), and frequency hopping."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0422"
    citation: {"ref": "SP800-160V1R1", "page": 112, "anchor": "Note: The configuration of the system includes the parameters for system functions,"}
    kind: "modal"
    locator: "E.22. Protective Defaults"
    context: ""
    statement: "Note: The configuration of the system includes the parameters for system functions, data, interfaces, and resources that determine how the system behaves and the outcomes it produces. Protective defaults guarantee that the “as shipped” system configuration and parameters prioritize the achievement of loss control objectives over the ability to deliver a required system capability and performance without dependence on human intervention. Protective defaults require conscientious action to establish the system configuration and parameters that deliver the required capability and performance in a manner that provides Commensurate Protection against loss. Protective default configurations for systems include constituent subsystems, components, and mechanisms. The principles of Protective Failure, Protective Recovery, and Continuous Protection parallel this principle to provide the ability to detect and recover from failure."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0423"
    citation: {"ref": "SP800-160V1R1", "page": 113, "anchor": "Avoid Single Points of Failure: The failure of a single system element"}
    kind: "lettered"
    locator: "E.23. Protective Failure.-"
    context: "Two aspects of protective failure must be satisfied to achieve the intended effect:"
    statement: "- Avoid Single Points of Failure: The failure of a single system element should not lead to unacceptable loss. Unacceptable loss should only occur in the case of multiple independent malfunctions – a safety principle known as single failure criterion. The principle of Defense in Depth can help achieve this aspect of protective failure."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0424"
    citation: {"ref": "SP800-160V1R1", "page": 113, "anchor": "Avoid Propagation of New Failure: If unmitigated, failures in the system can"}
    kind: "lettered"
    locator: "E.23. Protective Failure.-"
    context: "Two aspects of protective failure must be satisfied to achieve the intended effect:"
    statement: "- Avoid Propagation of New Failure: If unmitigated, failures in the system can result in propagating, cascading, or rippling effects on the system. These effects can be addressed if the remaining protections remain effective to prevent the originating failure from causing additional failures."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0425"
    citation: {"ref": "SP800-160V1R1", "page": 113, "anchor": "Protective failure applies to discrete system elements, aggregates of system elements, and"}
    kind: "modal"
    locator: "E.23. Protective Failure"
    context: "Two aspects of protective failure must be satisfied to achieve the intended effect:"
    statement: "Protective failure applies to discrete system elements, aggregates of system elements, and systems abstraction. Protective failure seeks to limit a failure’s effect to the extent practicable and, in doing so, minimize introducing new loss possibilities. Protective failure can limit the extent to which a failure is able to advance loss scenarios associated with the failure, including cascading losses; trigger a different loss scenario; or create a new loss scenario. Efforts to avoid or limit failures may themselves degrade system performance, which is a form of failure. Thus, system designers may need to consider trade spaces between possible adverse effects and system performance."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0426"
    citation: {"ref": "SP800-160V1R1", "page": 113, "anchor": "Note: Protective recovery is an aspect of Continuous Protection that ensures that"}
    kind: "indicative"
    locator: "E.24. Protective Recovery"
    context: ""
    statement: "Note: Protective recovery is an aspect of Continuous Protection that ensures that a protection capability is not interrupted during recovery from actual or impending failure. Protective recovery is applied to discrete system elements, aggregates of system elements, and the system. To the extent practicable, any recovery from impending or actual failure to resume normal, degraded, contingency or alternative operation, or the recovery of other asset losses should not (1) advance the loss scenario that is the target of the recovery, (2) trigger other loss scenarios, or (3) create new loss scenarios. The practicable aspect of this principle recognizes that for some recovery efforts to be successful, they may degrade system performance, which is a form of loss. Protective recovery is an aspect of the response strategy for the system. Thus, graduated and ungraduated considerations of Commensurate Response apply to best suit expediency in the need for a protective recovery."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0427"
    citation: {"ref": "SP800-160V1R1", "page": 113, "anchor": "Note: Engineered systems are often complex. Some degree of complexity in the"}
    kind: "modal"
    locator: "E.25. Reduced Complexity"
    context: ""
    statement: "Note: Engineered systems are often complex. Some degree of complexity in the system design is inherent, unavoidable, and must be accepted. The objective of this principle is to ensure that the design reflects the extent to which complexity can be reasonably minimized (i.e., avoid unnecessary complexity)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0428"
    citation: {"ref": "SP800-160V1R1", "page": 114, "anchor": "Note: Redundancy employs multiples of the same system elements, data and control"}
    kind: "modal"
    locator: "E.26. Redundancy"
    context: ""
    statement: "Note: Redundancy employs multiples of the same system elements, data and control flows, or paths to avoid single points of failure. Redundancy requires a strategy for how multiple system elements are used individually or in combination (e.g., load-balancing, fail-over, concurrently, backup, voting, agreement, consensus)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0429"
    citation: {"ref": "SP800-160V1R1", "page": 114, "anchor": "The trustworthiness objective for the capability"}
    kind: "lettered"
    locator: "E.27. Self-Reliant Trustworthiness.-"
    context: "The considerations for the extent to which a system element exhibits self-reliant trustworthiness include:"
    statement: "- The trustworthiness objective for the capability"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0430"
    citation: {"ref": "SP800-160V1R1", "page": 114, "anchor": "The trustworthiness of the system element in providing the capability"}
    kind: "lettered"
    locator: "E.27. Self-Reliant Trustworthiness.-"
    context: "The considerations for the extent to which a system element exhibits self-reliant trustworthiness include:"
    statement: "- The trustworthiness of the system element in providing the capability"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0431"
    citation: {"ref": "SP800-160V1R1", "page": 114, "anchor": "The extent to which the capability provided by a system element is"}
    kind: "lettered"
    locator: "E.27. Self-Reliant Trustworthiness.-"
    context: "The considerations for the extent to which a system element exhibits self-reliant trustworthiness include:"
    statement: "- The extent to which the capability provided by a system element is dependent on another element"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0432"
    citation: {"ref": "SP800-160V1R1", "page": 114, "anchor": "The extent to which the trustworthiness associated with a capability is dependent"}
    kind: "lettered"
    locator: "E.27. Self-Reliant Trustworthiness.-"
    context: "The considerations for the extent to which a system element exhibits self-reliant trustworthiness include:"
    statement: "- The extent to which the trustworthiness associated with a capability is dependent on another system element"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0433"
    citation: {"ref": "SP800-160V1R1", "page": 114, "anchor": "An argument for self-reliant trustworthiness can be applied at the discrete system"}
    kind: "modal"
    locator: "E.27. Self-Reliant Trustworthiness"
    context: "The considerations for the extent to which a system element exhibits self-reliant trustworthiness include:"
    statement: "An argument for self-reliant trustworthiness can be applied at the discrete system element level, at the level of an aggregate of elements, at the system level, or at the system of systems level. In all cases, the distinction between the capability provided and the trustworthiness responsibility for that capability must be preserved (e.g., self-reliant trustworthiness cannot be claimed if the protection assertions for trust are allocated to and dependent on some other entity). Similarly, when a system capability is distributed across multiple system elements, self-reliant trustworthiness requires that the trust expectations for the capability be properly allocated across the elements that comprise the distributed capability."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0434"
    citation: {"ref": "SP800-160V1R1", "page": 115, "anchor": "The judgment that a system element is self-reliantly trustworthy is based on"}
    kind: "modal"
    locator: "E.27. Self-Reliant Trustworthiness"
    context: ""
    statement: "The judgment that a system element is self-reliantly trustworthy is based on the element’s ability to satisfy a specific set of requirements and associated assumptions. An element that is self-reliantly trustworthy for one set of requirements and assumptions is not necessarily self-reliantly trustworthy for other sets of requirements and assumptions. Any change in the requirement, the satisfaction of the requirement, or in the assumptions associated with the requirement requires reassessment to determine that the element remains self-reliantly trustworthy."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0435"
    citation: {"ref": "SP800-160V1R1", "page": 115, "anchor": "Note: The structured decomposition of the system and the subsequent composition of"}
    kind: "indicative"
    locator: "E.28. Structured Decomposition and Composition"
    context: ""
    statement: "Note: The structured decomposition of the system and the subsequent composition of the system elements are guided and informed by the concepts of modularity, layering, and partially ordered dependencies."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0436"
    citation: {"ref": "SP800-160V1R1", "page": 115, "anchor": "Layering is the grouping of modules into a relational structure with well-defined"}
    kind: "modal"
    locator: "E.28. Structured Decomposition and Composition"
    context: ""
    statement: "Layering is the grouping of modules into a relational structure with well-defined interfaces, function, data, and control flow so that the dependencies graph among layers is linearly or partially ordered such that higher layers are dependent only on lower layers [2]. Partially ordered dependencies among modules (e.g., if module A depends on module B, then module B cannot depend on module A) and system layering contribute significantly to system design simplicity and coherence. While a partial ordering of all functions and processes may not be possible, the inherent problems of circularity can be more easily managed if the circular dependencies are constrained to occur within layers and minimized within each layer. Partially ordered dependencies also facilitate system testing and analysis and enable a strong form of loose coupling (i.e., minimizing interdependencies among modules)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0437"
    citation: {"ref": "SP800-160V1R1", "page": 115, "anchor": "Modularity and layering are effective in managing the complexity of the composed"}
    kind: "modal"
    locator: "E.28. Structured Decomposition and Composition"
    context: ""
    statement: "Modularity and layering are effective in managing the complexity of the composed system. They provide the means to decompose the system into discrete and aggregate elements to better comprehend the system in terms of its structure, flows, relationships, and how the system delivers the required capability. The structured composition of the constituent elements must also adhere to the principle of Compositional Trustworthiness to provide a basis to support claims about how the system is composed based on the application of modularity, layering, and partially ordered dependencies to achieve authorized and intended behaviors and outcomes."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0438"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "Principle: System trustworthiness judgments are based on evidence that the criteria for"}
    kind: "indicative"
    locator: "E.29. Substantiated Trustworthiness"
    context: ""
    statement: "Principle: System trustworthiness judgments are based on evidence that the criteria for trustworthiness have been satisfied."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0439"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "Note: Trustworthiness should not be assumed but rather substantiated through evidence that"}
    kind: "modal"
    locator: "E.29. Substantiated Trustworthiness"
    context: ""
    statement: "Note: Trustworthiness should not be assumed but rather substantiated through evidence that clearly shows the extent to which an entity is worth being trusted. This helps to ensure that an entity is never trusted beyond the extent to which it is worthy of trust. The approach to substantiated trustworthiness requires Commensurate Rigor with cautious mistrust (i.e., system elements are assumed to be guilty until proven innocent).84"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0440"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "Substantiated trustworthiness is characterized by a design mentality in which all components"}
    kind: "should"
    locator: "E.29. Substantiated Trustworthiness"
    context: ""
    statement: "Substantiated trustworthiness is characterized by a design mentality in which all components involved in the design context (i.e., a system element and the elements with which it interacts) are treated with a mutually suspicious mindset [2] [20]. Such mutual suspicion reflects cautious mistrust – the feeling or thought that something undesired, unwanted, or unexpected is possible or can happen. The design for every system element should reflect a lack of trust in interacting elements or itself. This suspicion assumes element non-performance and addresses the following cases:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0441"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "Interacting element suspicion (mutual suspicion): The system element-of-interest design is based on"}
    kind: "lettered"
    locator: "E.29. Substantiated Trustworthiness.-"
    context: "This suspicion assumes element non-performance and addresses the following cases:"
    statement: "- Interacting element suspicion (mutual suspicion): The system element-of-interest design is based on the non-performance of the elements it interacts with and how their non-performance can influence the element-of-interest’s behavior and outcomes. Designing to mutual suspicion is reinforced by applying the principle of Least Privilege to all entities (so that an element executes with only the privileges needed, mitigating harm that may be created) while applying the principle of Least Persistence so that each element is minimally exposed."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0442"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "Self-suspicion: The design for the system element-of-interest must consider its own non-performance"}
    kind: "lettered"
    locator: "E.29. Substantiated Trustworthiness.-"
    context: "This suspicion assumes element non-performance and addresses the following cases:"
    statement: "- Self-suspicion: The design for the system element-of-interest must consider its own non-performance independent of any external influence. Designing to self-suspicion may involve self-monitoring and built-in actions, including built-in testing at the initiation of the element."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0443"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "This approach forces the system designer to assume that things will not"}
    kind: "modal"
    locator: "E.29. Substantiated Trustworthiness"
    context: "This suspicion assumes element non-performance and addresses the following cases:"
    statement: "This approach forces the system designer to assume that things will not go right and to rigorously seek evidence that demonstrates the effectiveness of the design when things go wrong. Considerations for system element non-performance include:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0444"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "An expectation that elements will behave and produce outcomes that are inconsistent"}
    kind: "lettered"
    locator: "E.29. Substantiated Trustworthiness.-"
    context: "Considerations for system element non-performance include:"
    statement: "- An expectation that elements will behave and produce outcomes that are inconsistent with their design intent"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0445"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "The constraints, assumptions, and preconditions that are associated with achieving threshold performance"}
    kind: "lettered"
    locator: "E.29. Substantiated Trustworthiness.-"
    context: "Considerations for system element non-performance include:"
    statement: "- The constraints, assumptions, and preconditions that are associated with achieving threshold performance"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0446"
    citation: {"ref": "SP800-160V1R1", "page": 116, "anchor": "Intentional and unintentional events and conditions, typically referred to by terms like"}
    kind: "lettered"
    locator: "E.29. Substantiated Trustworthiness.-"
    context: "Considerations for system element non-performance include:"
    statement: "- Intentional and unintentional events and conditions, typically referred to by terms like fault, error, failure, and compromise"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0447"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "The reference validation mechanism must be tamper-proof to ensure that its integrity"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "The reference monitor concept has several criteria that provide design assurance of its realization as a reference validation mechanism:"
    statement: "- The reference validation mechanism must be tamper-proof to ensure that its integrity and validity are not destroyed."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0448"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "The reference validation mechanism must always be invoked, and if it cannot"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "The reference monitor concept has several criteria that provide design assurance of its realization as a reference validation mechanism:"
    statement: "- The reference validation mechanism must always be invoked, and if it cannot be, then the group of programs for which it provides validation services must be considered part of the reference validation mechanism and be subject to the first and third requirements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0449"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "The reference validation mechanism must be subject to rigorous analysis and tests,"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "The reference monitor concept has several criteria that provide design assurance of its realization as a reference validation mechanism:"
    statement: "- The reference validation mechanism must be subject to rigorous analysis and tests, the completeness of which can be assured (with the purpose of ascertaining that the reference validation mechanism works correctly in all cases)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0450"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "Successful achievement of these criteria will prevent the interference of outside entities"}
    kind: "modal"
    locator: "E.30. Trustworthy System Control"
    context: ""
    statement: "Successful achievement of these criteria will prevent the interference of outside entities on a protection mechanism or controller. Specifically:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0451"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "A protection mechanism or feature should not be circumventable (i.e., the mechanism"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "Specifically:"
    statement: "- A protection mechanism or feature should not be circumventable (i.e., the mechanism should be non-bypassable)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0452"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "A protection mechanism or feature should be evaluatable (i.e., sufficiently small and"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "Specifically:"
    statement: "- A protection mechanism or feature should be evaluatable (i.e., sufficiently small and simple enough to be assessed to produce adequate confidence in the protection provided, the constraint or control objective enforced, and the correct implementation of the mechanism [Reduced Complexity])."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0453"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "A protection mechanism or feature is always invoked, providing continuous protection."}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "Specifically:"
    statement: "- A protection mechanism or feature is always invoked, providing continuous protection."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0454"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "A protection mechanism or feature must be tamper-proof (i.e., neither the protection"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "Specifically:"
    statement: "- A protection mechanism or feature must be tamper-proof (i.e., neither the protection functions nor the data that the functions depend on can be modified without authorization)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0455"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "Enforces constraints to achieve only the authorized and intended system behaviors and"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "Trustworthy system control also encompasses control, safety, and security concepts to establish a system capability that sufficiently:"
    statement: "- Enforces constraints to achieve only the authorized and intended system behaviors and outcomes"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0456"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "Provides self-protection against targeted attacks on the system"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "Trustworthy system control also encompasses control, safety, and security concepts to establish a system capability that sufficiently:"
    statement: "- Provides self-protection against targeted attacks on the system"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0457"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "Is absent of self-induced emergent, erroneous, unsafe, and non-secure control actions"}
    kind: "lettered"
    locator: "E.30. Trustworthy System Control.-"
    context: "Trustworthy system control also encompasses control, safety, and security concepts to establish a system capability that sufficiently:"
    statement: "- Is absent of self-induced emergent, erroneous, unsafe, and non-secure control actions"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0458"
    citation: {"ref": "SP800-160V1R1", "page": 117, "anchor": "Trustworthy system control serves well as the design basis for individual system"}
    kind: "indicative"
    locator: "E.30. Trustworthy System Control"
    context: ""
    statement: "Trustworthy system control serves well as the design basis for individual system elements, collections of elements, networks, and systems where intentional and unintentional adversity can prevent the achievement of the loss control objectives. The principle also drives the need for rigor in engineering activities commensurate to the trust placed in the system elements."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0459"
    citation: {"ref": "SP800-160V1R1", "page": 118, "anchor": "The trustworthiness of a system is based on the concept of assurance."}
    kind: "modal"
    locator: "Appendix F. Trustworthiness and Assurance"
    context: ""
    statement: "The trustworthiness of a system is based on the concept of assurance. Assurance is the grounds for justified confidence that a claim or set of claims has been or will be achieved [61]. Justified confidence is derived from objective evidence that reduces uncertainty to an acceptable level and, in doing so, reduces the associated risk (Section F.2).85 Evidence is produced by engineering verification and validation methods.86 The evidence must be relevant, accurate, credible, and of sufficient quantity to enable reasoned conclusions and consensus among subject-matter experts that the claims are satisfied. The relationship between evidence and claims can be represented in many ways. Section F.2 discusses these approaches."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0460"
    citation: {"ref": "SP800-160V1R1", "page": 118, "anchor": "“The trust we place in our digital infrastructure should be proportional to"}
    kind: "modal"
    locator: "Appendix F. Trustworthiness and Assurance"
    context: ""
    statement: "“The trust we place in our digital infrastructure should be proportional to how trustworthy and transparent that infrastructure is and to the consequences we will incur if that trust is misplaced.”"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0461"
    citation: {"ref": "SP800-160V1R1", "page": 118, "anchor": "As discussed in Section 2.3, trust and trustworthiness are foundational concepts to"}
    kind: "modal"
    locator: "F.1. Trust and Trustworthiness"
    context: ""
    statement: "As discussed in Section 2.3, trust and trustworthiness are foundational concepts to engineering trustworthy secure systems, to the decisions made to grant trust, and to the extent to which trust is granted based on demonstrated trustworthiness. Trust is a belief that an entity meets certain expectations and can, therefore, be relied upon. A trustworthy entity requires sufficient evidence to support its trustworthiness claims. Trustworthiness is demonstrated based on evidence that supports a stated claim or judgment of being worthy to be trusted [2] [20] [21]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0462"
    citation: {"ref": "SP800-160V1R1", "page": 118, "anchor": "Trust in an entity can occur without a basis for or knowledge"}
    kind: "indicative"
    locator: "F.1. Trust and Trustworthiness"
    context: ""
    statement: "Trust in an entity can occur without a basis for or knowledge of the entity’s trustworthiness. This may occur because (1) there is no alternative (e.g., an individual trusts the components involved in an Internet transaction without knowing anything about the components), (2) the need for trustworthiness is not realized and occurs de facto, or (3) other reasons (e.g., miscommunication or misrepresentation of evidence) [58]. Since the decision to trust an entity is not necessarily based on a judgment of trustworthiness, the decision to trust an entity should consider the significance (i.e., consequences, effects, and impacts) of trust expectations not being fulfilled. The criteria to grant trust are used to determine the trustworthiness of an entity. Trust granted without establishing the required trustworthiness is a significant contributor to risk."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0463"
    citation: {"ref": "SP800-160V1R1", "page": 118, "anchor": "Trustworthiness judgments are based on expectations to be fulfilled by the entity"}
    kind: "indicative"
    locator: "F.1.1. Roles of Requirements in Trustworthiness"
    context: ""
    statement: "Trustworthiness judgments are based on expectations to be fulfilled by the entity to be trusted. The expectations of trustworthiness of the system, inclusive of its elements, are found in the system capability, performance, security, and other requirements. These judgments are meaningful only to the extent to which the trustworthiness-relevant requirements accurately reflect the problem, accurately define the solution, and can be verified as being satisfied by the solution."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0464"
    citation: {"ref": "SP800-160V1R1", "page": 119, "anchor": "The trustworthiness requirements about security derive from the protection needs, priorities, constraints,"}
    kind: "modal"
    locator: "F.1.1. Roles of Requirements in Trustworthiness"
    context: ""
    statement: "The trustworthiness requirements about security derive from the protection needs, priorities, constraints, and concerns associated with the system’s ability to achieve authorized and intended behaviors and outcomes, deal with adversity, and control loss. The requirements also address the measures used to assess trustworthiness and the evidentiary data and information required to substantiate trustworthiness conclusions and grant trust. The requirements engineering discipline provides the methods, processes, techniques, and tools for this to occur."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0465"
    citation: {"ref": "SP800-160V1R1", "page": 119, "anchor": "“A meaningful claim of trustworthiness cannot be based on an isolated demonstration"}
    kind: "modal"
    locator: "F.1.1. Roles of Requirements in Trustworthiness"
    context: ""
    statement: "“A meaningful claim of trustworthiness cannot be based on an isolated demonstration that the system contains a protection capability assumed to be effective or sufficient. Instead, conclusions about a protection capability must have their basis on evidence that the system was properly specified, designed, and implemented with the rigor needed to deliver a system-level function in a manner deemed to be trustworthy and secure.” [2]"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0466"
    citation: {"ref": "SP800-160V1R1", "page": 119, "anchor": "The design for a trustworthy secure system requires the application of principled"}
    kind: "modal"
    locator: "F.1.2. Design Considerations"
    context: ""
    statement: "The design for a trustworthy secure system requires the application of principled engineering concepts and methods supported by evidence that provides assurance that all security-relevant claims about the system are satisfied (Section F.2).87 Some considerations that apply to achieving trustworthiness in system design are:"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0467"
    citation: {"ref": "SP800-160V1R1", "page": 119, "anchor": "Trustworthiness judgments are compositional. They must align with how the set of"}
    kind: "modal"
    locator: "F.1.2. Design Considerations"
    context: "Some considerations that apply to achieving trustworthiness in system design are:"
    statement: "Trustworthiness judgments are compositional. They must align with how the set of composed elements provides a system capability. The way that the system is composed from its system elements must include the design principles of Compositional Trustworthiness and, to the extent practical, Structured Decomposition and Composition."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0468"
    citation: {"ref": "SP800-160V1R1", "page": 119, "anchor": "Ideally, the implemented system design will result in a system that continually"}
    kind: "modal"
    locator: "F.1.2. Design Considerations"
    context: ""
    statement: "Ideally, the implemented system design will result in a system that continually remains in secure states and modes with secure transitions between states and modes (Section 3.2). Realistically, the system will have insecure and indeterminant (i.e., unknown if secure or insecure) systems states and modes. The design must account for these cases and provide the capability to transition from insecure and indeterminant states and modes to secure states and modes (Protective Recovery)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0469"
    citation: {"ref": "SP800-160V1R1", "page": 120, "anchor": "All systems fail at some point. When a failure occurs, another failure"}
    kind: "should"
    locator: "F.1.2. Design Considerations"
    context: ""
    statement: "All systems fail at some point. When a failure occurs, another failure scenario or the creation of a new failure scenario should not be triggered or invoked (Protective Failure). Designing without single points of failure (Redundancy) – including not having common mode failures (Diversity) – can help isolate system element failures while providing the required system capabilities. Additionally, the response to failure should not lead to loss or other failures (Protective Recovery)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0470"
    citation: {"ref": "SP800-160V1R1", "page": 120, "anchor": "Technical feasibility and practicality issues"}
    kind: "lettered"
    locator: "F.1.2. Design Considerations.-"
    context: "A deficiency in trustworthiness can result from:"
    statement: "- Technical feasibility and practicality issues"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0471"
    citation: {"ref": "SP800-160V1R1", "page": 120, "anchor": "Cost and schedule issues of what is feasible and practical"}
    kind: "lettered"
    locator: "F.1.2. Design Considerations.-"
    context: "A deficiency in trustworthiness can result from:"
    statement: "- Cost and schedule issues of what is feasible and practical"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0472"
    citation: {"ref": "SP800-160V1R1", "page": 120, "anchor": "The limits of certainty (i.e., what is not known, what cannot be"}
    kind: "lettered"
    locator: "F.1.2. Design Considerations.-"
    context: "A deficiency in trustworthiness can result from:"
    statement: "- The limits of certainty (i.e., what is not known, what cannot be known, and what is underappreciated [known or could be known but dismissed prematurely])"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0473"
    citation: {"ref": "SP800-160V1R1", "page": 120, "anchor": "Assurance is the grounds for justified confidence that a claim or set"}
    kind: "modal"
    locator: "F.2. Assurance"
    context: ""
    statement: "Assurance is the grounds for justified confidence that a claim or set of claims has been or will be achieved [61]. Assurance is a complex and multi-dimensional property of the system that builds over time. Assurance must be planned, established, and maintained in alignment with the system throughout the system life cycle."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0474"
    citation: {"ref": "SP800-160V1R1", "page": 120, "anchor": "Adequate security judgments should be based on the level of confidence in"}
    kind: "modal"
    locator: "F.2. Assurance"
    context: ""
    statement: "Adequate security judgments should be based on the level of confidence in the ability of the system to protect itself against asset loss and the associated consequences across all forms of adversity.88 It cannot be based solely on individual efforts, such as demonstrating compliance, functional testing, or adversarial penetration tests. Judgments include what the system cannot do, will not do, or cannot be forced to do. These judgments of non-behavior must be grounded in sufficient confidence in the system’s ability to correctly deliver its intended function in the presence and absence of adversity and to do so when used in accordance with its design intent."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0475"
    citation: {"ref": "SP800-160V1R1", "page": 121, "anchor": "The needed evidentiary basis for such judgments derives from well-formed and comprehensive"}
    kind: "modal"
    locator: "F.2. Assurance"
    context: ""
    statement: "The needed evidentiary basis for such judgments derives from well-formed and comprehensive evidence-producing activities that address the requirements, design, properties, capabilities, vulnerabilities, and effectiveness of security functions. These activities include a combination of demonstration, inspection, analysis, testing, and other methods required to produce the needed evidence. The evidence acquired from these activities informs reasoning by qualified subject-matter experts to interpret the evidence to substantiate the assurance claims made while considering other emergent properties that the system may possess."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0476"
    citation: {"ref": "SP800-160V1R1", "page": 121, "anchor": "Veneer security is security functionality provided without corresponding assurance so that the"}
    kind: "modal"
    locator: "F.2. Assurance"
    context: "VENEER SECURITY"
    statement: "Veneer security is security functionality provided without corresponding assurance so that the functionality only appears to protect resources when it does not. Veneer security results in a false sense of security and, in fact, increases risk due to the uncertainty about the behavior and outcomes produced by the security functionality in the presence and absence of adversity. Veneer security must be avoided [62]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0477"
    citation: {"ref": "SP800-160V1R1", "page": 121, "anchor": "From a security perspective, a top-level claim addresses freedom from the conditions"}
    kind: "modal"
    locator: "F.2.1. Security Assurance Claims"
    context: ""
    statement: "From a security perspective, a top-level claim addresses freedom from the conditions that cause asset loss and the associated consequences. Specifically, this means the system will adequately contribute to freedom from the conditions that cause asset loss and the associated consequences."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0478"
    citation: {"ref": "SP800-160V1R1", "page": 121, "anchor": "Claims are not expressed solely as a restatement of the security functional"}
    kind: "indicative"
    locator: "F.2.1. Security Assurance Claims"
    context: ""
    statement: "Claims are not expressed solely as a restatement of the security functional and performance requirements. Doing so only provides assurance that the security requirements are satisfied with the implicit assumption that the requirements are correct, provide adequate coverage, and accurately reflect stakeholder needs and concerns."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0479"
    citation: {"ref": "SP800-160V1R1", "page": 121, "anchor": "Most system failures have a human component. Thus, assurance must consider human"}
    kind: "modal"
    locator: "F.2.1. Security Assurance Claims"
    context: ""
    statement: "Most system failures have a human component. Thus, assurance must consider human frailty [5]. Operator behavior is a product of the environment (including its systems) in which it occurs [36]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0480"
    citation: {"ref": "SP800-160V1R1", "page": 122, "anchor": "Axiomatic Assurance (assurance by assertion) is based on beliefs accepted on faith"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.•"
    context: ""
    statement: "• Axiomatic Assurance (assurance by assertion) is based on beliefs accepted on faith in an artifact or process. The beliefs are often accepted because they are not contradicted by experiment or demonstration. Axiomatic assurance is not suited to complex scenarios [62]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0481"
    citation: {"ref": "SP800-160V1R1", "page": 122, "anchor": "Demonstration of conformance and compliance are types of axiomatic assurance. While useful,"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.-"
    context: ""
    statement: "- Demonstration of conformance and compliance are types of axiomatic assurance. While useful, they are not well-suited as the sole basis of assurance for complex scenarios."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0482"
    citation: {"ref": "SP800-160V1R1", "page": 122, "anchor": "Analytic Assurance (assurance by test and analysis) derives from testing or reasoning"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.•"
    context: ""
    statement: "• Analytic Assurance (assurance by test and analysis) derives from testing or reasoning to justify conclusions about properties of interest. Belief is relocated from an artifact or process to trust in some method of analysis. The feasibility of establishing an analytic basis depends on the amount of work involved in performing the analysis and on the soundness of any assumptions underlying that analysis. Analytic methods are most relevant in a model that spans all relevant uses and all interfaces to the environment. That is, the model must not ignore too many details."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0483"
    citation: {"ref": "SP800-160V1R1", "page": 122, "anchor": "Testing demonstrates the presence but not the absence of errors and vulnerabilities."}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.-"
    context: ""
    statement: "- Testing demonstrates the presence but not the absence of errors and vulnerabilities. Testing and analyses will have uncertainty that cannot be ignored, especially when they lack comprehensiveness. Uncertainty contributes to risk."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0484"
    citation: {"ref": "SP800-160V1R1", "page": 122, "anchor": "Synthetic Assurance (assurance by structured reasoning) derives from the method of composition"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.•"
    context: ""
    statement: "• Synthetic Assurance (assurance by structured reasoning) derives from the method of composition of the “components of assurance” (i.e., the assurance derives from the manner of synthesis of the constituent parts). It requires that assurance be a consideration at every step of design and implementation, from the smallest components to the final subsystem realization."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0485"
    citation: {"ref": "SP800-160V1R1", "page": 122, "anchor": "Not all vulnerabilities can be mitigated to an acceptable level. There are"}
    kind: "modal"
    locator: "F.2.2. Approaches to Assurance"
    context: ""
    statement: "Not all vulnerabilities can be mitigated to an acceptable level. There are three classes of vulnerabilities in systems: (1) vulnerabilities whose existence is known and either eliminated or made to be inconsequential, (2) vulnerabilities whose existence is known but that are not sufficiently mitigated, and (3) unknown vulnerabilities that constitute an element of uncertainty. That is, the fact that the vulnerability has not been identified should not give increased confidence that the vulnerability does not exist. Determining the effect of vulnerabilities that are in the delivered system and the risk posed by those vulnerabilities and accepting uncertainty about the existence of a vulnerability that will only become known over time are important aspects that are addressed by assurance."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0486"
    citation: {"ref": "SP800-160V1R1", "page": 123, "anchor": "The assurance case described in [30] is an example of structured reasoning"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.-"
    context: ""
    statement: "- The assurance case described in [30] is an example of structured reasoning (Section 4.3). Structured reasoning serves to fill the gaps associated with the axiomatic and analytic assurance approaches. Since synthetic assurance is based on the expert judgment of available evidence, it is not complete. However, synthetic assurance does further reduce uncertainty and, thus, reduces risk."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0487"
    citation: {"ref": "SP800-160V1R1", "page": 123, "anchor": "Assurance depends on the quality of the evidence used in arguments demonstrating"}
    kind: "modal"
    locator: "F.2.2. Approaches to Assurance"
    context: ""
    statement: "Assurance depends on the quality of the evidence used in arguments demonstrating that claims about the system are satisfied. Assurance evidence can be obtained either directly through measurement, testing, observation, or inspection or indirectly through analysis, including the analysis of data obtained from measurement, testing, observation, or inspection. Evidence must have sufficient quality in accuracy, credibility, relevance, rigor, and quantity. The accuracy, credibility, and relevance of evidence should be confirmed prior to its use. For example, some evidence can support arguments for strength of function, others for negative requirements (i.e., what will not happen), and still other evidence for qualitative properties."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0488"
    citation: {"ref": "SP800-160V1R1", "page": 123, "anchor": "One or more claims about properties"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.•"
    context: "ASSURANCE CASE An assurance case contains the following elements [30]:"
    statement: "• One or more claims about properties"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0489"
    citation: {"ref": "SP800-160V1R1", "page": 123, "anchor": "Arguments that logically link the evidence and any assumptions"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.•"
    context: "ASSURANCE CASE An assurance case contains the following elements [30]:"
    statement: "• Arguments that logically link the evidence and any assumptions"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0490"
    citation: {"ref": "SP800-160V1R1", "page": 123, "anchor": "A body of evidence"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.•"
    context: "ASSURANCE CASE An assurance case contains the following elements [30]:"
    statement: "• A body of evidence"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0491"
    citation: {"ref": "SP800-160V1R1", "page": 123, "anchor": "Justification of the choice of a top-level claim and the method of"}
    kind: "lettered"
    locator: "F.2.2. Approaches to Assurance.•"
    context: "ASSURANCE CASE An assurance case contains the following elements [30]:"
    statement: "• Justification of the choice of a top-level claim and the method of reasoning"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0492"
    citation: {"ref": "SP800-160V1R1", "page": 123, "anchor": "Assurance cases have numerous advantages over other means for obtaining confidence, such"}
    kind: "modal"
    locator: "F.2.2. Approaches to Assurance"
    context: "ASSURANCE CASE An assurance case contains the following elements [30]:"
    statement: "Assurance cases have numerous advantages over other means for obtaining confidence, such as in the areas of comprehension, informing needed allocation responsibilities, information organization, and robust due diligence [63]. These advantages were greater in areas with otherwise insufficient methods for achieving high assurance. Additionally, assurance cases were determined to be more efficient for complex and novel systems, as well as systems in need of high assurance."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0493"
    citation: {"ref": "SP800-160V1R1", "page": 124, "anchor": "Assurance is a need that is to be engineered and satisfied similar"}
    kind: "modal"
    locator: "F.2.3. Assurance Needs"
    context: ""
    statement: "Assurance is a need that is to be engineered and satisfied similar to the need to engineer the system capability to satisfy specified capability needs. Assurance needs for trustworthy secure systems are grounded in the concerns of loss and adverse effects due to intentional and unintentional adversity (Commensurate Trustworthiness, Substantiated Trustworthiness, Commensurate Rigor). Assurance needs include the evidence-basis for reasoning, the degree of rigor to acquire and interpret the evidence, and the selection of the methods, tools, and processes used throughout the system life cycle. Similar to capability and performance needs, assurance needs, expectations, priorities, and constraints should be expressed as system requirements and achieved, tracked, and maintained within the systems engineering effort."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0494"
    citation: {"ref": "SP800-160V1R1", "page": 124, "anchor": "Assurance evidence can support a conclusion that a stated claim is not"}
    kind: "should"
    locator: "F.2.3. Assurance Needs"
    context: "CONFIDENCE MAY BE NEGATIVE"
    statement: "Assurance evidence can support a conclusion that a stated claim is not achieved or that there is an insufficient basis to conclude that the claim is supported or not supported. In either case, the assurance is negative relative to the goal of substantiating the claim. That is, the system or some part of the system is not sufficiently trustworthy and should not be trusted relative to its specified function without further action."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0495"
