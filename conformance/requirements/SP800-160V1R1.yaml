  - id: "REQ-SP800-160V1R1-0193"
    citation: {"ref": "SP800-160V1R1", "page": 44, "anchor": "Examples include software and hardware development tools and suites; modeling and simulation"}
    kind: "modal"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS Such demonstration must consider the system as an emergent43 whole that consists of:"
    statement: "Examples include software and hardware development tools and suites; modeling and simulation environments and tools; maintenance and diagnostics devices, components, and suites; simulators and test-case scenario generators; and training systems. While these assets are not necessarily within the scope of engineering the system of interest, behaviors and outcomes of these systems have security implications that must be addressed in the secure design of the system of interest. The behaviors and outcomes to consider include how they might directly or indirectly enable, interface, interact, and interoperate with the system of interest."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0194"
    citation: {"ref": "SP800-160V1R1", "page": 44, "anchor": "An emergent property is a property exhibited by entities that is meaningful"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "An emergent property is a property exhibited by entities that is meaningful only when attributed to the whole, not to any individual constituent element [27]. Emergent properties of systems include its capability, safety, security, reliability, resilience, survivability, agility, maintainability, and availability. Appendix D discusses emergence in greater detail."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0195"
    citation: {"ref": "SP800-160V1R1", "page": 45, "anchor": "The limits of certainty44"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "• The limits of certainty44"
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0196"
    citation: {"ref": "SP800-160V1R1", "page": 45, "anchor": "In particular, the limits of certainty apply to requirements and accepting the"}
    kind: "modal"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "In particular, the limits of certainty apply to requirements and accepting the potential errors, inconsistencies, or gaps in the completeness and coverage of those requirements. Therefore, the requirements and associated verification and validation methods, while a necessary aspect of demonstrating adequate security, are not sufficient to deem a system as adequately secure. The level of confidence provided must be commensurate with the asset loss consequences addressed. The evidence basis for demonstrating confidence must be recorded, traced, maintained, and evolved as variances that are relevant to demonstrating adequate security occur throughout the system life cycle. Additionally, the evidence basis must be meaningful to subject-matter experts across the subjective, competing, and often contradicting needs and beliefs of stakeholders."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0197"
    citation: {"ref": "SP800-160V1R1", "page": 45, "anchor": "Demonstrating this justified confidence or assurance is achieved by an evidentiary basis"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "Demonstrating this justified confidence or assurance is achieved by an evidentiary basis provided by systems analyses and other evidence-producing activities.45 The evidentiary basis is used within an approach for structured reasoning, as demonstrated in assurance cases (Section 4.3). The reasoning considers the system needs and capabilities, contributing system quantitative and qualitative factors, and how these capabilities and factors produce an evidentiary base upon which further analyses are conducted in the context of system security. In turn, these analyses support substantiated and reasoned conclusions that serve as the basis for consensus among stakeholders that the system is adequately secure (Appendix F)."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0198"
    citation: {"ref": "SP800-160V1R1", "page": 45, "anchor": "As a subdiscipline of systems engineering, systems security engineering is a transdisciplinary"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS"
    statement: "As a subdiscipline of systems engineering, systems security engineering is a transdisciplinary and integrative approach to enabling the successful realization, use, and retirement of engineered trustworthy secure systems. Systems security engineering employs systems, security, and other principles and concepts, as well as scientific, technological, and management methods. Systems security engineering ensures that these principles, concepts, methods, and practices are applied during the system life cycle to achieve stakeholder objectives for assured trustworthiness and asset protection despite adversity. It also helps to reduce and control the causes and conditions that can lead to vulnerability and, as a result, reduces the effect that adversity can have on the system."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0199"
    citation: {"ref": "SP800-160V1R1", "page": 46, "anchor": "Works with stakeholders to ensure that security objectives, protection needs and concerns,"}
    kind: "lettered"
    locator: "2.1.2.•"
    context: "ASSET-BASED PROTECTION – ENGINEERING FOR SUCCESS As part of a transdisciplinary systems engineering effort to deliver a trustworthy secure system, systems security engineering:"
    statement: "• Works with stakeholders to ensure that security objectives, protection needs and concerns, assurance needs, security requirements (including measures of effectiveness [MOEs] and measures of performance [MOPs]), and associated validation methods are defined"
    status: "candidate"
