    citation: {"ref": "SP800-160V1R1", "page": 127, "anchor": "The descriptions of the system life cycle processes assume that sufficient time,"}
    kind: "indicative"
    locator: "G.1. Process Overview"
    context: "Table 5. System Life Cycle Processes"
    statement: "The descriptions of the system life cycle processes assume that sufficient time, funding, and human and material resources are available to ensure the complete application of the processes within the systems engineering effort. The processes represent the standard of excellence within which appropriate tailoring is accomplished to achieve realistic, optimal, and cost-effective results within the constraints imposed on the engineering team."
