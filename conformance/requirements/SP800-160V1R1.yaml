  - id: "REQ-SP800-160V1R1-0537"
    citation: {"ref": "SP800-160V1R1", "page": 128, "anchor": "The outcomes described are achieved by personnel, processes, and technology. Personnel conduct"}
    kind: "modal"
    locator: "G.1. Process Overview"
    context: "Table 5. System Life Cycle Processes Each system life cycle process description has the following sections:"
    statement: "The outcomes described are achieved by personnel, processes, and technology. Personnel conduct activities and tasks throughout the stages of the system life cycle to produce outcomes that achieve the defined security objectives. No single personnel role is responsible for producing all outcomes stated in the system life cycle processes (i.e., the processes are not role-specific). Thus, multiple roles may contribute to a specific outcome."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0538"
    citation: {"ref": "SP800-160V1R1", "page": 128, "anchor": "Finally, this publication describes systems engineering considerations to produce the specified outcomes."}
    kind: "modal"
    locator: "G.1. Process Overview"
    context: "Table 5. System Life Cycle Processes"
    statement: "Finally, this publication describes systems engineering considerations to produce the specified outcomes. However, no specific roles or responsibilities are identified. Organizations define and allocate roles and responsibilities to the personnel who execute the life cycle processes. Figure 18 provides an example of personnel categories, each with a scope of authority, control, roles, and responsibilities that collectively achieve the outcomes for the category. The outcomes produced across all personnel categories achieve the defined security objectives."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0539"
    citation: {"ref": "SP800-160V1R1", "page": 128, "anchor": "The activities and tasks are accomplished cooperatively within and across various roles"}
    kind: "indicative"
    locator: "G.1. Process Overview"
    context: "Table 5. System Life Cycle Processes"
    statement: "The activities and tasks are accomplished cooperatively within and across various roles of the organization, inclusive of systems security engineering. While this publication focuses on systems security engineering, it does not fulfill all aspects of every activity and task."
    status: "candidate"
