    locator: "F.2.3. Assurance Needs"
    context: "CONFIDENCE MAY BE NEGATIVE The assurance trade space includes the following considerations:"
    statement: "The highest levels of rigor across systems can require formal methods – techniques that model systems as mathematical entities to enable rigorous verification of the system’s properties through mathematical proofs. Formal methods depend on formal specifications (i.e., statements in a language whose vocabulary, syntax, and semantics are formally defined) and a variety of models, including a formal security policy model (i.e., a mathematically rigorous specification of a system’s security policy [Appendix C])."
