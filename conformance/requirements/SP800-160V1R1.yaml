    context: "CONFIDENCE MAY BE NEGATIVE The assurance trade space includes the following considerations:"
    statement: "• Qualifications necessary for subject-matter experts Requirements analysis across stakeholder and system requirements determines the threshold degree of rigor that is required. When a system cannot practicably meet the needed degrees of rigor, stakeholders should have a means to determine if they will accept the associated risk."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0504"
    citation: {"ref": "SP800-160V1R1", "page": 125, "anchor": "The highest levels of rigor across systems can require formal methods –"}
