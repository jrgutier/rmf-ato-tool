  - id: "REQ-SP800-160V1R1-0209"
    citation: {"ref": "SP800-160V1R1", "page": 47, "anchor": "The term risk treatment is used in [4] and defined in [28]."}
    kind: "indicative"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "The term risk treatment is used in [4] and defined in [28]."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0210"
    citation: {"ref": "SP800-160V1R1", "page": 48, "anchor": "The systems security engineering framework [29] provides a conceptual view of the"}
    kind: "indicative"
    locator: "2.1.2"
    context: "SECURITY – AN EMERGING PROPERTY OF AN ENGINEERING PROCESS"
    statement: "The systems security engineering framework [29] provides a conceptual view of the key contexts within which systems security engineering activities are conducted. It defines, bounds, and focuses activities and tasks toward achieving stakeholder security objectives and presents a coherent, well-formed, evidence-based case to support judgments about achievement of the objectives.50 The framework is independent of system type and engineering or acquisition process model. It is not to be interpreted as a sequence of flows or steps but rather as a set of interacting contexts, each with its own checks and balances. The systems security engineering framework emphasizes an integrated, holistic security perspective across all system life cycle stages and is applied to satisfy the milestone objectives of each life cycle stage."
    status: "candidate"
  - id: "REQ-SP800-160V1R1-0211"
    citation: {"ref": "SP800-160V1R1", "page": 48, "anchor": "Provide relevant data and technical interpretations of system issues from the system"}
    kind: "lettered"
    locator: "2.1.2.•"
