  - id: "REQ-DODI8510.01-0081"
    citation: {"ref": "DODI8510.01", "page": 12, "anchor": "The RMF process for lifecycle cybersecurity risk to DoD systems is in"}
    kind: "modal"
    locator: "3.1"
    context: "OVERVIEW"
    statement: "The RMF process for lifecycle cybersecurity risk to DoD systems is in accordance with the NIST SP 800-30, 800-37, 800-39, 800-53A, 800-137, Committee on National Security Systems Policy No. 22, CNSSI No. 1253 and 1254, DoDD 8000.01, and DoDI 8500.01. The RMF process adopts the NIST RMF in accordance with NIST SP 800-37 to comply with FISMA requirements. This process is intended to ensure DoD systems with digital capabilities, including National Security Systems, are engineered for cyber survivability. This is done by integrating controls that support security, privacy, operational resilience, supply chain risk management, and the best cyber intelligence, or commercial cyber threat information available at the system and organizational levels."
    status: "not-a-requirement"
    reason: "Overview that describes the process: 'is in accordance with' lists the source documents and 'is intended to ensure' states an aim. Nobody is told to act, and the duties follow in 3.1.a to c and 3.2."
