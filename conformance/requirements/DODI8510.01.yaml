    kind: "lettered"
    locator: "3.1.a"
    context: "OVERVIEW"
    statement: "a. The RMF consists of the steps depicted in Figure 1. This process integrates with the system life-cycle and system security engineering processes. The program initiates or updates RMF activities during system inception (e.g., documented during requirements identification) and for any significant system modifications (e.g., engineering changes). Refer to the RMF KS section on ‘System and Environment Changes’ for further information regarding what is included in significant system modification."
    status: "partial"
    reason: "Sentence 2: UPD-002 fails a significant change implemented with no plan update, the RMF updated for a significant modification; initiation at inception is the run itself. Sentences 1 and 3 describe the steps and point at the KS."
    evidence: [{"kind": "rule", "target": "UPD-002", "fixture": "tests/fixtures/negative/UPD-002.yaml", "expect": "a significant change was implemented but the system security plan was not updated for it", "asserts": "The program updates RMF activities for any significant system modifications: a significant change implemented with the plan not updated fails", "holds_when": "ART-CHG is produced or seeded", "sentence": "The program initiates or updates RMF activities during system inception (e.g., documented during requirements identification) and for any significant system modifications (e.g., engineering changes).", "claim": "constraint"}]
    work_item: "WI-481"
