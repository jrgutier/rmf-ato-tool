  - id: "REQ-DODI8510.01-0081"
    citation: {"ref": "DODI8510.01", "page": 12, "anchor": "The RMF process for lifecycle cybersecurity risk to DoD systems is in"}
    kind: "modal"
    locator: "3.1"
    context: "OVERVIEW"
    statement: "The RMF process for lifecycle cybersecurity risk to DoD systems is in accordance with the NIST SP 800-30, 800-37, 800-39, 800-53A, 800-137, Committee on National Security Systems Policy No. 22, CNSSI No. 1253 and 1254, DoDD 8000.01, and DoDI 8500.01. The RMF process adopts the NIST RMF in accordance with NIST SP 800-37 to comply with FISMA requirements. This process is intended to ensure DoD systems with digital capabilities, including National Security Systems, are engineered for cyber survivability. This is done by integrating controls that support security, privacy, operational resilience, supply chain risk management, and the best cyber intelligence, or commercial cyber threat information available at the system and organizational levels."
    status: "not-a-requirement"
    reason: "Overview that describes the process: 'is in accordance with' lists the source documents and 'is intended to ensure' states an aim. Nobody is told to act, and the duties follow in 3.1.a to c and 3.2."
  - id: "REQ-DODI8510.01-0082"
    citation: {"ref": "DODI8510.01", "page": 12, "anchor": "The RMF consists of the steps depicted in Figure 1. This process"}
    kind: "lettered"
    locator: "3.1.a"
    context: "OVERVIEW"
    statement: "a. The RMF consists of the steps depicted in Figure 1. This process integrates with the system life-cycle and system security engineering processes. The program initiates or updates RMF activities during system inception (e.g., documented during requirements identification) and for any significant system modifications (e.g., engineering changes). Refer to the RMF KS section on ‘System and Environment Changes’ for further information regarding what is included in significant system modification."
    status: "candidate"
  - id: "REQ-DODI8510.01-0083"
    citation: {"ref": "DODI8510.01", "page": 12, "anchor": "Failure to initiate the RMF at system or program inception is not"}
    kind: "lettered"
    locator: "3.1.b"
    context: "Figure 1. RMF Process"
    statement: "b. Failure to initiate the RMF at system or program inception is not a justification for ignoring or not complying with the RMF. Systems without an ATO must begin the RMF, regardless of the system life-cycle stage (e.g., acquisition, operation). Chapter 3 of NIST SP 800-37 details the steps of the RMF, with additional guidance on the RMF KS."
    status: "partial"
    reason: "That failing to start at inception is no excuse, and the pointer to Chapter 3, are not tested"
    evidence: [{"kind": "rule", "asserts": "Systems without an ATO, a current authorization in effect, must begin the RMF regardless of the system life-cycle stage, at assessment and authorization rather than monitoring", "target": "OMP-001", "fixture": "tests/fixtures/negative/OMP-001.unauthorized.yaml", "expect": "needs a current authorization in effect", "claim": "constraint", "sentence": "Systems without an ATO must begin the RMF, regardless of the system life-cycle stage (e.g., acquisition, operation).", "holds_when": "ART-AUTHREC is produced or seeded"}]
    work_item: "WI-08"
  - id: "REQ-DODI8510.01-0084"
    citation: {"ref": "DODI8510.01", "page": 13, "anchor": "The RMF process applies to all systems and organizations regardless of acquisition"}
    kind: "lettered"
    locator: "3.1.c"
    context: "Figure 1. RMF Process"
    statement: "c. The RMF process applies to all systems and organizations regardless of acquisition pathway in the DoD, as well as DoD partnered systems and organizations where it has been agreed that DoD standards will be followed."
    status: "partial"
    reason: "A statement of where the RMF applies; whether a partnered system agreed to DoD standards is not recorded."
    evidence: [{"kind": "prose", "target": "playbooks/C/C-1.md", "asserts": "The RMF process applies to partnered systems whose interconnection agreements record DoD cybersecurity requirements", "claim": "presence", "sentence": "The RMF process applies to all systems and organizations regardless of acquisition pathway in the DoD, as well as DoD partnered systems and organizations where it has been agreed that DoD standards will be followed."}]
