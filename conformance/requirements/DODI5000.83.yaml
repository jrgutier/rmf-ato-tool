    statement: "Software (including firmware) and microelectronics hardware used in a system or incorporated into spares can be deliberately compromised while in the supply chain with the intent to use these compromises for malicious attacks to trigger future system failures. Undiscovered weaknesses or flaws in system elements containing software or microelectronics (including spares) can provide the foundation for threat actors to defeat fielded systems through cyber-attacks. This includes technology and systems required to accomplish the operational and mission requirements, to include access and availability of advanced and assured microelectronics."
