    context: "ACTIVITIES TO MITIGATE ADVERSARY THREATS TO TECHNOLOGY AND PROGRAMS"
    statement: "S&T protection and program protection measures implemented during concept development, engineering, and test activities do not ensure security is maintained throughout operations. Program protection requirements evolve as technology and threats evolve. Once technology and systems are fielded, they become exposed to a changing threat environment and potentially different vulnerabilities. Planning for maintaining appropriate technology and system security must be considered early and throughout the lifecycle. S&T managers and lead systems engineers will:"
