  - id: "REQ-DODI5000.83-0131"
    citation: {"ref": "DODI5000.83", "page": 13, "anchor": "S&T managers and engineering teams will employ and tailor S&T and program"}
    kind: "modal"
    locator: "3.3"
    context: "ACTIVITIES TO MITIGATE ADVERSARY THREATS TO TECHNOLOGY AND PROGRAMS"
    statement: "S&T managers and engineering teams will employ and tailor S&T and program protection measures. S&T managers and engineering teams will assess technology and program risks and opportunities to determine necessary protections. Protection measures include operations security, information safeguarding, research protection, designed-in system protections, SCRM, software assurance, hardware assurance, anti-counterfeit practices, AT, and program security related and engineering cyber-resilient activities. S&T managers and lead systems engineers will be responsible for the procedures as assigned in this paragraph."
