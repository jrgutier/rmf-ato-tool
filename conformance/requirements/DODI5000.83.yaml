    reason: "Tier 1, left partial: sentences 1 and 2 are held by PPROT-002 (tailoring to the pathway, countermeasures mitigating assessed technical risks). Unheld: sentence 3 assigns the procedures of the paragraph to S&T managers and lead systems engineers; the run checks who prepares the PPP (0248) but not each procedure's owner."
