    statement: "DoD technology, programs, systems, networks, supporting contract facilities, and activities are at risk of attacks by state and non-state threat actors. S&T managers and lead systems engineers, assisted by supporting organizations to the S&T and engineering community, are responsible for risk informed protection planning and management of their technology, programs, systems, and technical information to mitigate adversary impacts. Risks include:"
