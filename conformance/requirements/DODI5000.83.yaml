    kind: "modal"
    locator: "3.1"
    context: "GENERAL"
    statement: "The overarching management policies governing the DAS are described in DoDD 5000.01 and DoDI 5000.02. The purpose of the DAS is to deliver effective and affordable solutions to the end user while enabling execution at the speed of relevance. To achieve that objective, the DoD employs an adaptive acquisition framework comprised of acquisition pathways (provided at https://aaf.dau.edu/aaf/), each tailored for the unique characteristics and risk profile of the capability being acquired. Technology area and program protection planning procedures will also be tailored for the:"
