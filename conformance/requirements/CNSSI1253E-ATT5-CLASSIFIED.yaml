    context: ""
    statement: "Justification to Select: EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. Information leakage through electromagnetic signals must be protected against to ensure the confidentiality of the classified information. Reference(s): EO 13526, Sec. 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a). PE-19(1), Information Leakage | National Emissions Policies and Procedures"
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0140"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 30, "anchor": "Justification to Select: EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. Information leakage through electromagnetic signals must be protected against to ensure the confidentiality of the classified information. Reference(s): EO 13526, Sec. 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a). PE-22, Component Marking"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. Information leakage through electromagnetic signals must be protected against to ensure the confidentiality of the classified information. Reference(s): EO 13526, Sec. 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a). PE-22, Component Marking"
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0141"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 30, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Marking hardware components"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Marking hardware components to indicate the classification level of information permitted to be processed, stored, or transmitted by the hardware component(s) is an organizational procedure that serves to remind users that classified information of the specified level exists within the system. Users should, as a result, be more aware and ready to guard against access to hardware components by uncleared personnel passing through the facility. Parameter Value(s): Mark all system hardware components in facilities containing systems that process, store, or transmit classified information indicating the impact level or classification level of the information permitted to be processed, stored, or transmitted by the hardware component. Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). PM-12, Insider Threat Program"
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0142"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 31, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. Guidance: This control"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): EO 13587, Sec. 2.1(b) and Sec 5.2; CNSSD No. 504."
    status: "candidate"
    work_item: "WI-70"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0143"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 31, "anchor": "Justification to Select: EO 13526 states that all personnel that have access to classified information must be cleared through a determination of eligibility, NDA, and have the appropriate need to know for"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 states that all personnel that have access to classified information must be cleared through a determination of eligibility, NDA, and have the appropriate need to know for the information. Guidance: The agency head or agency head's designee must make a favorable determination that the person is eligible for access for information at classification levels up to and including the level specified in the clearance. Reference(s): EO 13526, Sec. 4.1, para. (a) and (b); EO 13587, Sec 5.2, para. (a). PS-4, Personnel Termination"
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0144"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 31, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need to know. After an individual ceases to be employed by the organization, they no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information. Guidance: This control has"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need to know. After an individual ceases to be employed by the organization, they no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information. Guidance: This control has been identified as having privacy implementation considerations (see Table 1)."
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0145"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 32, "anchor": "Disable system access within a time period as soon as possible but"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Disable system access within a time period as soon as possible but not to exceed 5 working days if termination is voluntary; if termination is involuntary, within same day as termination."
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0146"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 32, "anchor": "Conduct exit interviews that include a discussion of: (i) prohibitions against the"}
    kind: "lettered"
    locator: "c"
    context: ""
    statement: "c. Conduct exit interviews that include a discussion of: (i) prohibitions against the removal of classified information from the organization's control and (ii) the direction that information be declassified in order to remove it from the organization's control.12 Reference(s): EO 13526, Sec. 4.1, para. (c). PS-4(1), Personnel Termination | Post-Employment Requirements"
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0147"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 32, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need to know. After an individual ceases to be employed by the organization, they no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information. Reference(s): EO 13526, Sec."}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need to know. After an individual ceases to be employed by the organization, they no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information. Reference(s): EO 13526, Sec. 4.1, para. (c). PS-6(2), Access Agreements | Classified Information Requiring Special Protection"
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0148"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 32, "anchor": "Justification to Select: EO 13526 states that all personnel that have access to classified information must be cleared through a determination of eligibility, NDA, and have the appropriate need-to-know for the information."}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 states that all personnel that have access to classified information must be cleared through a determination of eligibility, NDA, and have the appropriate need-to-know for the information."
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0149"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 32, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. After an individual ceases"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. After an individual ceases to be employed by the organization, they may no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information. Reference(s): EO 13526, Sec 4.1, para. (a) and (c)."
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0150"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 33, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. Guidance: Organizations should ensure"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. Guidance: Organizations should ensure that individual organizational roles and position descriptions clearly document and provide understanding regarding security or privacy responsibilities associated with the roles, as well as the role-based security and privacy training requirements for the roles. This should include roles and training for roles that require appropriate clearances and need-to-know. Reference(s): EO 13526, Sec 4.1 para (a); EO 13764, Sec 1 para (a). RA-3(2), Risk Assessment | Use of All-Source Intelligence"
    status: "candidate"
    work_item: "WI-71"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0151"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 33, "anchor": "Justification to Select: Organizations need to identify protections commensurate with an information’s"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: Organizations need to identify protections commensurate with an information’s classification when developing agreements to share all-source intelligence information or resulting decisions with other organizations to assist in the analysis of risk. Reference(s): EO 13526, Sec. 4.1, para. (f) and (g). RA-5, Vulnerability Monitoring and Scanning"
    status: "candidate"
    work_item: "WI-73"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0152"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 33, "anchor": "Justification to Select: Classified information may be more appealing to adversaries, who"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: Classified information may be more appealing to adversaries, who would want to take advantage of any vulnerabilities of a system that has classified information on it. Organizations with classified information on their systems should ensure vulnerability monitoring and scanning is implemented for its system components, ensuring that the potential sources of vulnerabilities—such as infrastructure components (e.g., switches, routers, firewalls, sensors), networked printers, scanners, and copiers— are not overlooked. This will allow organizations to ensure that any new vulnerabilities to systems that process, store, or transmit classified information are identified, mitigated, and reported as quickly as possible. Reference(s): EO 13526, Sec. 4.1, para. (f) and (g). RA-6, Technical Surveillance Countermeasures Survey"
    status: "candidate"
    work_item: "WI-73"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0153"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 33, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. Many information technology products"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. Many information technology products are vulnerable to inadvertent, or intentional, surveillance actions and need to be countered to prevent information leakage to unauthorized personnel. This control serves to ensure the organization takes conscious actions to minimize the technical surveillance risk and protect the confidentiality of classified information. Guidance: This control has been identified as having privacy implementation considerations (see Table 1)."
    status: "candidate"
    work_item: "WI-73"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0154"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 34, "anchor": "Justification to Select: NSM-8 invokes EO 14028, which, in Section 7(b) requires"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: NSM-8 invokes EO 14028, which, in Section 7(b) requires deployment of an Endpoint Detection and Response (EDR) initiative to support proactive detection of cybersecurity incidents within Federal Government infrastructure, active cyber hunting, containment and remediation, and incident response. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): NSM-8, Sec 1(e). SA-3(2), System Development Life Cycle | Use of Live or Operational Data"
    status: "candidate"
    work_item: "WI-73"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0155"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 34, "anchor": "Justification to Select: EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. When used in"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. When used in test environments, live data must be protected to preserve authorized restrictions on information access. The use of live data in a test environment does not change its classification."
    status: "candidate"
    work_item: "WI-74"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0156"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 34, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Application partitioning"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Application partitioning provides a means to reduce the opportunities individuals may have to gain access to information for which they do not have a need-to-know. Reference(s): EO 13526, Sec 4.1, para. (a)."
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0157"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 35, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Security function"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Security function isolation provides a means to reduce the opportunities cleared individuals may have to gain access to information for which they do not have a need-to-know. Reference(s): EO 13526, Sec 4.1, para. (a). SC-7(26), Boundary Protection | Classified National Security System Connections"
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0158"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 35, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to provide adequate protection"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to provide adequate protection of classified information while stored, processed, or when transmitted and to prevent access by unauthorized persons to classified information. Organizations may not have control over external networks; therefore, the interconnection of a system to an external network presents unique challenges for protecting classified information. An appropriate boundary protection device is needed to address these challenges. For interconnections of NSS operating at different classification levels, refer to the CDS Overlay. Parameter Value: Prohibit the direct connection of a classified national security system to an external network without the use of an appropriate boundary protection device. Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). SC-8, Transmission Confidentiality and Integrity"
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0159"
