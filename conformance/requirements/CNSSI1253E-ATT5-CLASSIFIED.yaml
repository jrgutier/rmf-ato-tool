  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0163"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 36, "anchor": "Justification to Select: CNSSP No. 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit. Guidance:"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: CNSSP No. 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit. Guidance: NSM-8 requires all organizations use NSA-approved, public-standards-based cryptographic protocols to ensure widespread cryptographic interoperability among NSS. If mission-unique requirements preclude the use of public standards-based cryptographic protocols, NSA-approved mission unique protocols may be used. This control has been identified as having privacy implementation considerations (see Table 1)."
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0164"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 37, "anchor": "Parameter Value: Establish and manage cryptographic keys when cryptography is employed within"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Parameter Value: Establish and manage cryptographic keys when cryptography is employed within the system in accordance with the following key management requirements: for classified NSS, employ NSA-approved cryptographic guidance addressing processes/requirements for key generation, distribution, storage, access, and destruction."
    status: "candidate"
