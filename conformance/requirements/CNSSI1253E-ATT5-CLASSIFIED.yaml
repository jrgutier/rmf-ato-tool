    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 15, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use, or potential for use, of mobile devices presents unique challenges for protecting classified information. Guidance: If the"}
