    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 16, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. Sharing information without conducting"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. Sharing information without conducting due diligence to ensure information products are appropriately marked, the recipients are authorized to access such information, and appropriate protections are in place can result in policy violations."
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0084"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 17, "anchor": "Guidance: Organizations need to define information sensitivity and classification level before sharing"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Guidance: Organizations need to define information sensitivity and classification level before sharing information from systems handling classified information. Protections commensurate with information sensitivity and classification level are essential for avoiding potential data spillage. Reference(s): EO 13526, Sec 4.1. AC-23, Data Mining Protection"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0085"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 17, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. AC-23 requires organizations"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. AC-23 requires organizations to identify appropriate techniques to prevent and detect unnecessary or unauthorized data mining, which can be used by an insider to collect organizational information for the purpose of exfiltration. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): EO 13587, Sec. 2.1(b) and Sec 5.2; CNSSD No. 504. AT-2, Literacy Awareness Training"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0086"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 17, "anchor": "Justification to Select: EO 13526 requires organizations to provide training on the"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to provide training on the proper safeguarding of classified information. Guidance: The organization provides training on the proper safeguarding of classified information and on the criminal, civil, and administrative sanctions that may be imposed on an individual who fails to protect classified information from unauthorized disclosure. This training is provided upon granting a person a clearance and at least annually for as long as the user has access to the system. Parameter Value: a.1.: As part of initial training for new users and annually for as long as the user has access to the system thereafter; c.: Update literacy training and awareness content at least annually and following [Assignment: organization-defined events]; Reference(s): EO 13526, Sec 4.1, para. (b). AT-2(2), Literacy Awareness Training | Insider Threat"
    status: "candidate"
    work_item: "WI-59"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0087"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 17, "anchor": "Justification to Select: CNSSD No. 504 requires, as part of an organization’s"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: CNSSD No. 504 requires, as part of an organization’s insider threat program, insider threat awareness training to all cleared employees. Reference(s): CNSSD No. 504."
    status: "candidate"
    work_item: "WI-59"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0088"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 18, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. CNSSD No. 504 requires agencies to monitor and audit user activity on classified networks. Reviewing"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. CNSSD No. 504 requires agencies to monitor and audit user activity on classified networks. Reviewing and analyzing audit records support the detection of insider threat activities. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): EO 13587, Sec 2.1(b) and Sec 5.2; CNSSD No. 504. AU-6(4), Audit Record Review, Analysis, and Reporting | Central Review and Analysis"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0089"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 18, "anchor": "Justification to Select: The White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, requires the organization to gather"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: The White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, requires the organization to gather information for centralized analysis, reporting and response. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec E.1.; CNSSD No. 504. AU-6(5), Audit Record Review, Analysis, and Reporting | Integrated Analysis of Audit Records"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0090"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 18, "anchor": "Justification to Select: The White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, requires the organization to build"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: The White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, requires the organization to build and maintain an insider threat analytic and response capability to manually and/or electronically gather, integrate, review, assess, and respond to information derived from counterintelligence, security, information assurance, human resources, law enforcement, the monitoring of user activity, and other sources as necessary and appropriate. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Parameter Value: Integrate analysis of audit records with the analysis of vulnerability scanning information, performance data, system monitoring information, counterintelligence, security, cybersecurity, human resources, law enforcement, the monitoring of user activity, and other sources as necessary and appropriate to further enhance the ability to identify inappropriate or unusual activity."
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0091"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 19, "anchor": "Justification to Select: CNSSD No. 504 requires organizations’ insider threat programs to"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: CNSSD No. 504 requires organizations’ insider threat programs to include full text analyses of all privileged user commands."
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0092"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 19, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. CNSSD No. 504 requires agencies to monitor and audit user activity on classified networks. Correlating"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. CNSSD No. 504 requires agencies to monitor and audit user activity on classified networks. Correlating audit records support the detection of insider threat activities. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): White House Memorandum, National Insider Threat Policy, Tab 1, Sec B.2(2, 4) and Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec E.1; CNSSD No. 504. AU-12, Audit Record Generation"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0093"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 19, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. The White House"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. The White House Memorandum, National Insider Threat Policy and Minimum Standards for Executive Branch Insider Threat Programs, requires agencies to monitor and audit user activity on classified networks. Generating audit records supports the detection of insider threat activities. Reference(s): EO 13587, Sec 2.1(b) and Sec 5.2; White House Memorandum, National Insider Threat Policy, Tab 1, Sec B.2(1) and Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1.; CNSSD No. 504."
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0094"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 20, "anchor": "Justification to Select: The White House Memorandum, National Insider Threat Policy and"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: The White House Memorandum, National Insider Threat Policy and Minimum Standards for Executive Branch Insider Threat Programs, requires the capability to capture audit information to detect and mitigate insider threat and requires agencies to monitor and audit user activity on classified networks. This control directly supports the capture of user activities during sessions. Having the capability to generate audit records containing this content is considered a best practice for safeguarding classified information against insider threat. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): White House Memorandum, National Insider Threat Policy, Tab 1, Sec B.2(1) and Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504. AU-16, Cross-Organizational Audit Logging"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0095"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 20, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. Coordinating audit information"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. Coordinating audit information across organizations supports the detection of insider threat activities. Guidance: This control has been identified as having privacy implementation considerations (see Table 1)."
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0096"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 21, "anchor": "Justification to Select: Providing cross-organizational audit information is required to facilitate the"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: Providing cross-organizational audit information is required to facilitate the detection and mitigation of insider threats on all classified networks. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Parameter Value: Provide cross-organizational audit information to the organization’s insider threat program at a minimum based on [Assignment: organization-defined cross-organizational sharing agreements]. Reference(s): EO 13587, Sec 2.1(b) and Sec 5.2; White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504. CA-3, Information Exchange"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0097"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 21, "anchor": "Justification to Select: EO 13526 requires organizations to ensure classified information disseminated"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to ensure classified information disseminated outside the executive branch is protected in a manner equivalent to that provided within the executive branch. An Interconnection Security Agreement (ISA) is the appropriate means to convey the expectations for the associated security requirements. Guidance: For interconnections of systems processing classified information that serve to disseminate classified information outside the executive branch, the organization ensures the protection of the information in a manner equivalent to that provided within the executive branch using an ISA. The organization prohibits the interconnection between classified and unclassified NSS unless using approved technologies (e.g., CDS) (see CDS Overlay for further guidance). Parameter Value:"
    status: "candidate"
    work_item: "WI-61"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0098"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 21, "anchor": "Approve and manage the exchange of information between the system and other"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Approve and manage the exchange of information between the system and other systems using interconnection security agreements;"
    status: "candidate"
    work_item: "WI-61"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0099"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 21, "anchor": "Review and update the agreements at least annually or as changes to"}
    kind: "lettered"
    locator: "c"
    context: ""
    statement: "c. Review and update the agreements at least annually or as changes to the systems or connections change. Reference(s): EO 13526, Sec 4.1, para. (e). CM-3(6), Configuration Change Control | Cryptography Management"
    status: "candidate"
