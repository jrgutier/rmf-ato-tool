    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 40, "anchor": "Justification to Select: EO 13873 requires the USG to protect against supply chain risks from foreign adversaries, reducing the probability of adversaries successfully identifying and targeting the supply chain, and limiting harm that can be done by unauthorized persons to classified information. Reference(s): EO"}
