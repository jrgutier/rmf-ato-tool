    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use, or potential for use, of mobile devices presents unique challenges for protecting classified information. Guidance: If the organization intends to allow mobile devices in the same facility as the system of interest, even if not part of the system, this control must be selected."
    status: "candidate"
