  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0030"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 41, "anchor": "Justification to Select: EO 13873 requires the USG to protect against supply"}
    kind: "modal"
    locator: ""
    context: ""
    statement: "Justification to Select: EO 13873 requires the USG to protect against supply chain risks from foreign adversaries, reducing the probability of adversaries successfully identifying and targeting the supply chain, and limiting harm that can be done by unauthorized persons to classified information. Reference(s): EO 13873 Sec. 1.a.; EO 14032; CNSSD No. 505."
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0031"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 41, "anchor": "Justification to Select: EO 13873 requires continual assessment of threats to the"}
    kind: "modal"
    locator: ""
    context: ""
    statement: "Justification to Select: EO 13873 requires continual assessment of threats to the United States from information and communications technology or services designed, developed, manufactured, or supplied by persons owned by, controlled by, or subject to the jurisdiction or direction of a foreign adversary. Operational Security (OPSEC) controls support organizational ability to conduct such assessment as part of protecting their supply chains and preventing unauthorized persons access to classified information. Reference(s): EO 13873 Sec. 5; CNSSD No. 505. SR-12, Component Disposal"
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0032"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 41, "anchor": "Justification to Select: EO 13526 states that all classified information must be"}
    kind: "modal"
    locator: ""
    context: ""
    statement: "Justification to Select: EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement. Proper disposal is required to prevent unauthorized reuse. Parameter Value: Dispose of all digital and non-digital system media containing classified information using the following techniques and methods: approved methods in accordance with the classification of the information processed. Reference(s): EO 13526, Sec 4.1, para. (g); CNSSD No. 505."
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0033"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 41, "anchor": "Organizations should consider the following control guidance when implementing specific system capabilities"}
    kind: "modal"
    locator: "7"
    context: ""
    statement: "Organizations should consider the following control guidance when implementing specific system capabilities on systems used to process classified information. Controls that do not warrant selection or exclusion for safeguarding classified information require further consideration when systems containing classified information employ these controls (e.g., part of a baseline, part of another overlay, tailoring decision) to ensure safeguarding considerations related to that control are adequately addressed. For example, AC-18, which discusses use of wireless access, is not mandatory for systems storing, processing, or transmitting classified information. However, when AC-18 is implemented for systems that contain classified information, organizations must consider how to implement this control in a way that properly protects classified information. AC-18(1), Wireless Access | Authentication and Encryption"
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0034"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 42, "anchor": "Guidance: If the organization intends to use wireless access for the system of interest, this control must be selected. If wireless capabilities are enabled, there is a risk of unauthorized access to, and exfiltration of, classified information. If this control applies/is selected, please see EO 13526, Sec 4.1, para. (d), (f) and (g) and CNSSP No. 17. AC-18(5), Wireless Access"}
    kind: "modal"
    locator: "7"
    context: ""
    statement: "Guidance: If the organization intends to use wireless access for the system of interest, this control must be selected. If wireless capabilities are enabled, there is a risk of unauthorized access to, and exfiltration of, classified information. If this control applies/is selected, please see EO 13526, Sec 4.1, para. (d), (f) and (g) and CNSSP No. 17. AC-18(5), Wireless Access | Antennas and Transmission Power Levels"
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0035"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 42, "anchor": "Guidance: If the organization intends to use wireless access for the system of interest, this control must be selected. If wireless capabilities are enabled, there is a risk of unauthorized access to, and exfiltration of, classified information. If this control applies/is selected, please see EO 13526, Sec 4.1, para. (d), (f) and (g) and CNSSP No. 17. AC-19(5), Access Control"}
    kind: "modal"
    locator: "7"
    context: ""
    statement: "Guidance: If the organization intends to use wireless access for the system of interest, this control must be selected. If wireless capabilities are enabled, there is a risk of unauthorized access to, and exfiltration of, classified information. If this control applies/is selected, please see EO 13526, Sec 4.1, para. (d), (f) and (g) and CNSSP No. 17. AC-19(5), Access Control for Mobile Devices | Full Device or Container-Based Encryption"
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0036"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 42, "anchor": "Guidance: If the organization intends to allow mobile devices as part of"}
    kind: "modal"
    locator: "7"
    context: ""
    statement: "Guidance: If the organization intends to allow mobile devices as part of the system of interest, this control must be selected. If this control applies/is selected, please see EO 13526, Sec 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a); and CNSSP No. 17 for guidance. SA-9(8), External System Services | Processing and Storage Location – U.S. Jurisdiction"
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0037"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 42, "anchor": "Guidance: If the organization intends to process and store classified information on"}
    kind: "modal"
    locator: "7"
    context: ""
    statement: "Guidance: If the organization intends to process and store classified information on an external system, outside of the United States, then the geographic location must be restricted to facilities located within in the legal jurisdictional boundary of the United States and this control must be selected. If this control applies/is selected, please refer to EO 13526, Sec 4.1, para. (f) and (g) and CNSSP No. 32."
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0038"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 43, "anchor": "Guidance: If the organization intends to implement capabilities on its systems or"}
    kind: "modal"
    locator: "7"
    context: ""
    statement: "Guidance: If the organization intends to implement capabilities on its systems or system components to determine if organizational data has been exfiltrated or improperly removed (whether passively or actively, or from adversaries or unintended user procedures) from the organization, this control must be selected. If this control applies/is selected, please refer to EO 13526, Sec 4.1, para. (f) and (g)."
    status: "candidate"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0039"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 43, "anchor": "The terms used in this overlay are all defined in CNSSI No."}
