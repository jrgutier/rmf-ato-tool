    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 21, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Cryptographic mechanisms are"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Cryptographic mechanisms are required (per the justification in this overlay for SC-8(1))"
    status: "candidate"
    work_item: "WI-62"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0101"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 22, "anchor": "to protect the confidentiality of transmitted classified information. Configuration management of the"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "to protect the confidentiality of transmitted classified information. Configuration management of the cryptographic mechanisms employed helps to ensure that the required protections remain in effect. Organizations must ensure that cryptographic mechanisms used to provide safeguarding of classified information from unauthorized access or modification are under configuration management. Reference(s): EO 13526, Sec 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a). CM-5(5), Access Restrictions for Change | Privilege Limitation for Production and Operation"
    status: "candidate"
    work_item: "WI-62"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0102"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 22, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Limiting privileges to"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Limiting privileges to change system components reduces the opportunities for insiders to grant access to classified information by unauthorized personnel. Parameter Value: (b) Review and reevaluate privileges at least quarterly. Reference(s): EO 13526, Sec 4.1, para. (g). IA-2, Identification and Authentication (Organizational Users)"
    status: "candidate"
    work_item: "WI-62"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0103"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 22, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Uniquely identifying and"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Uniquely identifying and authenticating users limits access to authorized users and is a foundational component of detecting potentially malicious insiders. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): EO 13587, Sec 2.1 (b) and Sec 5.2 (a). IA-2(1), Identification and Authentication (Organizational Users) | Multi- Factor Authentication to Privileged Accounts"
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0104"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 22, "anchor": "Justification to Select: Per NSM-8, agencies shall implement multifactor authentication and encryption for NSS data-at-rest and data-in-transit. CNSSD No. 504 Annex C requires that"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: Per NSM-8, agencies shall implement multifactor authentication and encryption for NSS data-at-rest and data-in-transit. CNSSD No. 504 Annex C requires that agencies implement standardized access control methodologies, specifically multifactor authentication for users with privileged roles."
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0105"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 23, "anchor": "Justification to Select: Per NSM-8, agencies shall implement multifactor authentication and encryption for NSS data-at-rest and data-in-transit. CNSSD No. 504 Annex A requires that"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: Per NSM-8, agencies shall implement multifactor authentication and encryption for NSS data-at-rest and data-in-transit. CNSSD No. 504 Annex A requires that agencies implement standardized access control methodologies, specifically multifactor authentication. Reference(s): NSM-8 Sec 1(b)(iii); CNSSD No. 504. IA-5(6), Authentication Management | Protection of Authenticators"
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0106"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 23, "anchor": "Justification to Select: CNSSP No. 25 requires NSA review and approval of"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: CNSSP No. 25 requires NSA review and approval of PKI cryptographic components, to include tokens used for accessing Secret-level networks. Guidance: In general, authenticators must be protected commensurate with the highest security classification of information on the system. Organizations should refer to the authoritative guidance to ensure compliance and understand how to appropriately protect authenticators. For hardware smart card-based tokens that users could use on Secret Internet Protocol Router Network (SIPRNet) workstations and still be carried by the user into unclassified spaces, NSA developed criteria that smart cards are required to meet to allow access to Secret data but be considered unclassified when not in use. Reference(s): CNSSP No. 25. IR-6, Incident Reporting"
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0107"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 23, "anchor": "Require personnel to report suspected incidents to the organizational incident response capability"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Require personnel to report suspected incidents to the organizational incident response capability within 2 hours; and"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0108"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 23, "anchor": "Report incident information to the National Manager through the appropriate Federal Cyber"}
    kind: "lettered"
    locator: "b"
    context: ""
    statement: "b. Report incident information to the National Manager through the appropriate Federal Cyber Center or other designated central department point of contact (e.g., DoD CERT, IC CERT). Reference(s): NSM-8, Sec 2(b). IR-9, Information Spillage Response"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0109"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 23, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When"}
    kind: "modal"
    locator: "b"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons. Guidance: CNSSP No. 18 and CNSSI No. 1001 provide guidance on additional actions that should be take when responding to classified information spills and should be followed when taking corrective action. Parameter Value:"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0110"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 24, "anchor": "Assigning, at a minimum, information owner, the Information Assurance Manager"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Assigning, at a minimum, information owner, the Information Assurance Manager"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0111"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 24, "anchor": "(IAM)/Information System Security Manager (ISSM), the Activity Security Manager, and the responsible"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "(IAM)/Information System Security Manager (ISSM), the Activity Security Manager, and the responsible Incident Response Center (IRC) with responsibility for responding to information spills"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0112"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 24, "anchor": "Alerting the information owner, the IAM/ISSM, the Activity Security Manager, and the"}
    kind: "lettered"
    locator: "c"
    context: ""
    statement: "c. Alerting the information owner, the IAM/ISSM, the Activity Security Manager, and the responsible IRC of the information spill using a method of communication not associated with the spill Reference(s): EO 13526, Sec 4.1, para. (g).; CNSSP No. 18; CNSSI No. 1001. IR-9(2), Information Spillage Response | Training"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0113"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 24, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons. Reference(s):"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons. Reference(s): EO 13526, Sec 4.1, para. (g); CNSSI No. 1001. IR-9(4), Information Spillage Response | Exposure to Unauthorized Personnel"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0114"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 24, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons. Guidance:"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): EO 13526, Sec 4.1, para. (g); CNSSI No. 1001. MA-3(3), Maintenance Tools | Prevent Unauthorized Removal"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0115"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 24, "anchor": "Justification to Select: EO 13526 prohibits the removal of classified information from"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 prohibits the removal of classified information from official premises without proper authorization. Maintenance tools may contain classified information and their unauthorized removal from the premises may result in the loss of classified information; therefore, the removal of maintenance tools must be appropriately conducted."
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0116"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 25, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use of maintenance personnel that lack"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use of maintenance personnel that lack required clearances or are not U.S. citizens presents challenges for protecting classified information; MA-5(1) is needed to address these challenges. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): EO 13526, Sec 4.1, para. (g). MP-1, (Media Protection) Policy and Procedures"
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0117"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 25, "anchor": "Justification to Select: EO 13526 states that classified information may not be removed from official premises without proper authorization. Organizations"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 states that classified information may not be removed from official premises without proper authorization. Organizations that process classified information must include appropriate content in their media protection policy and procedures. Guidance: The organization includes in media protection policy and/or procedures: (i) how authorizations for removing classified information from official premises are determined and documented; (ii) the appropriate means for controlling, protecting and monitoring removal of classified information from official premises; (iii) the appropriate means for transporting classified non-digital media, and classified and unclassified digital media, outside of the organization's controlled areas; and (iv) procedures for identifying areas as controlled vs. uncontrolled. Reference(s): EO 13526, Sec. 4.1, para. (d); CNSSD No. 504. MP-2, Media Access"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0118"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 25, "anchor": "Justification to Select: Media devices are resources that can be used to"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: Media devices are resources that can be used to exfiltrate classified information and access to the devices should be limited to authorized personnel. EO 13526 states that classified information may not be removed from official premises without proper authorization. EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. Reference(s): EO 13526, Sec 4.1, para. (d); EO 13587, Sec 5.2 and 6.1."
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0119"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 26, "anchor": "Justification to Select: EO 13526 requires organizations to mark classified information to"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to mark classified information to reflect its classification. Marking refers to human readable labels, such as labels on thumb drives. (For labeling guidance, see AC-16.) Reference(s): EO 13526, Sec 1.6, para. (a) and Sec 2.1, para. (a) and (b); CNSSP No. 26. MP-4, Media Storage"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0120"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 26, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Physically controlling and"}
    kind: "modal"
    locator: "c"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Physically controlling and securely storing media is necessary to protect the classified information contained within the media. Parameter Value:"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0121"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 26, "anchor": "Physically control and securely store digital and non-digital media containing classified information"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Physically control and securely store digital and non-digital media containing classified information within an area and/or container approved for processing and storing media based on the classification of the information contained within the media; Reference(s): EO 13526, Sec 4.1, para. (g); CNSSP No. 26. MP-5, Media Transport"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0122"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 26, "anchor": "Justification to Select: EO 13526 states that classified information may not be removed from official premises without proper authorization and that it must be stored under conditions that provide adequate protection and prevent access by unauthorized persons. Protection of classified information during transport, which includes maintaining accountability, documenting transport activities, and employing cryptographic measures, is essential to satisfy these requirements. Parameter Value(s):"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 states that classified information may not be removed from official premises without proper authorization and that it must be stored under conditions that provide adequate protection and prevent access by unauthorized persons. Protection of classified information during transport, which includes maintaining accountability, documenting transport activities, and employing cryptographic measures, is essential to satisfy these requirements. Parameter Value(s):"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0123"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 26, "anchor": "Protect and control digital and non-digital media containing classified information during transport"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Protect and control digital and non-digital media containing classified information during transport outside controlled areas using double-wrapping in opaque enclosures and transport only by personnel with a security clearance for the classification of the media being transported;"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0124"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 26, "anchor": "Justification to Select: EO 13526 states that classified information may not be removed from official premises without proper authorization and that it must be stored under conditions that provide adequate protection and prevent access by unauthorized persons. Protection of classified information during transport, which includes maintaining accountability, documenting transport activities, and employing cryptographic measures, is essential to satisfy these requirements."}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 states that classified information may not be removed from official premises without proper authorization and that it must be stored under conditions that provide adequate protection and prevent access by unauthorized persons. Protection of classified information during transport, which includes maintaining accountability, documenting transport activities, and employing cryptographic measures, is essential to satisfy these requirements. Guidance: The organization employs an identified custodian during transport of classified system media outside of controlled areas. Reference(s): EO 13526, Sec 4.1, para. (d), (e), (f), and (g); EO 13587, Sec 5.2, para. (a). MP-6, Media Sanitization"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0125"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 27, "anchor": "Justification to Select: EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement. Parameter Value:"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement. Parameter Value:"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0126"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 27, "anchor": "Sanitize all classified media prior to disposal, release out of organizational control,"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Sanitize all classified media prior to disposal, release out of organizational control, or release for reuse using approved sanitization techniques and procedures in accordance with applicable federal and organizational standards and policies; Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). MP-6(1), Media Sanitization | Review, Approve, Track, Document, and Verify"
    status: "candidate"
