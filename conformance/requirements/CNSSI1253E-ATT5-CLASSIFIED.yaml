    statement: "Safeguards for protecting classified information are not equivalent to addressing safeguarding needs to address the risks related to impact levels for information types as these two concepts are mutually exclusive. As a result, safeguards (including to address regulatory requirements for an information type) may be needed to address information type risk in addition to safeguards to protect classified information."
