  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0075"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 14, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use, or potential for use, of mobile devices presents unique challenges for protecting classified information. Guidance: Regardless of"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use, or potential for use, of mobile devices presents unique challenges for protecting classified information. Guidance: Regardless of whether the organization intends to use mobile devices as part of the system of interest, these controls must be selected. Advances in mobile technology have led to more powerful, smaller devices. These devices are used by a large percentage of the population and, as a result, unique countermeasures must be developed. Mobile devices may pose a risk of unauthorized access to, and exfiltration of, classified information. Selecting this control does not imply intent to allow mobile devices, but instead serves to ensure the organization takes conscious actions to either allow and to establish appropriate restrictions on their use or disallow their use."
    status: "candidate"
    work_item: "WI-57"
