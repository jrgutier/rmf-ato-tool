    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 39, "anchor": "Justification to Select: CNSSD No. 504 requires the implementation of trusted network"}
    kind: "modal"
    locator: "b.(b)"
    context: ""
    statement: "Justification to Select: CNSSD No. 504 requires the implementation of trusted network connection restrictions to prevent malicious users from exploiting known vulnerabilities of hard-linking to areas outside of their authorized access, Injecting code, and covering their activities. This control supports holistic endpoint security requirements. Reference(s): EO 13526, Sec 4.1, para. (f) and (g); CNSSD No. 504. SC-42, Sensor Capability and Data"
