  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0040"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 1, "anchor": "While tailoring AT-2 out may have minimal risk to unclassified NSS, there"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "While tailoring AT-2 out may have minimal risk to unclassified NSS, there could be significant risk to systems processing classified information if users with access to such systems and classified information on those systems are not properly and regularly trained on their responsibilities regarding protection of classified information. For NSS that process personally identifiable information (PII) and must address system-specific privacy risks3, the Privacy Overlays may apply. Security and dissemination restrictions provided by classified systems are separate and distinct from privacy controls and handling requirements for addressing privacy risk. Organizations must ensure appropriate privacy control specifications are applied to classified systems that process4 PII consistent with the Privacy Overlay, and document them (e.g., in the privacy plan). Consult the Privacy Overlay to determine whether a system has PII and therefore must apply the Privacy Overlay in addition to applying this overlay."
    status: "partial"
    reason: "Tailoring at-2 out needs a basis (TLR-002); the classified-risk judgment is prose in ART-BASELINE."
    evidence: [{"kind": "prose", "target": "playbooks/S/S-2.md", "asserts": "S-2 records why tailoring a training control out is acceptable for a classified system", "claim": "presence"}]
    work_item: "WI-141"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0041"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 4, "anchor": "These procedures consist of safeguards to properly store, reproduce, transfer, and destroy"}
    kind: "modal"
    locator: "3"
    context: ""
    statement: "These procedures consist of safeguards to properly store, reproduce, transfer, and destroy classified information. Methods for safeguarding classified information include, but are not limited to, requiring personnel clearances, signed non-disclosure agreements (NDAs), and the appropriate clearance and need to know for information access. Proper marking is also essential for appropriate handling of classified information. The assumptions that underlie the security control selections and serve as the basis to justify the allocation of controls in the Classified System Overlay include:"
    status: "partial"
    reason: "Safeguards, clearances and NDAs are the overlay's control assumptions; the run records classification and markings only."
    evidence: [{"kind": "prose", "target": "playbooks/C/C-1.md", "asserts": "Proper marking of classified information is recorded in the classification fact's handling markings", "claim": "presence"}]
    work_item: "WI-174"
