  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0183"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 38, "anchor": "Justification to Select: EO 13526 directs the safeguarding of classified information while"}
    kind: "promoted"
    locator: "b"
    context: ""
    statement: "Justification to Select: EO 13526 directs the safeguarding of classified information while in use and when transmitted to provide adequate protection and prevent access by unauthorized persons. Use of collaborative computing devices in unauthorized locations represents an unacceptable risk of disclosure of classified information to unauthorized persons. Guidance: Collaborative devices have an aspect of trust associated with their use (e.g., it is hard to verify how many people are listening through one connection). In secure work areas, it is necessary to verify that all personnel have valid authorizations to access classified information and to disable or remove collaborative devices that are at a lower classification level than the secure work area. Disabling lower classification collaborative devices is necessary to prevent unauthorized access to classified information (e.g., through eavesdropping)."
    status: "candidate"
    work_item: "WI-75"
    promoted: {"reason": "Guidance row of Section 6 with a duty; the rejected row held no marker"}
