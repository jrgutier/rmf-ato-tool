    context: ""
    statement: "Justification to Select: CNSSP No. 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit. Parameter Value: Produce, control, and distribute symmetric cryptographic keys using NSA-approved key management technology and processes. Reference(s): NSM-8 Sec 1 (b) (iv); CNSSP No. 15. SC-12(3), Cryptographic Key Establishment and Management | Asymmetric Keys"
    status: "candidate"
