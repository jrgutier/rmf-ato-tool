  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0019"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 4, "anchor": "SAP is defined in EO 13526, Section 4.3. If the system stores,"}
