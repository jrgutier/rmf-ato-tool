requirements:
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0001"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 1, "anchor": "The Classified System Overlay identifies security control specifications needed to safeguard classified"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "The Classified System Overlay identifies security control specifications needed to safeguard classified information stored, processed, or transmitted by national security systems (NSS). This overlay is baseline independent and can be used with any NSS baseline (security and privacy) to safeguard classified information. As a result, there may be overlap of controls between an NSS baseline and controls identified in this overlay.1 Organizations must effectively manage security and privacy risks related to safeguarding classified information. To do so, the security and privacy control baselines are implemented together to support risk management decisions related to confidentiality, integrity, and/or availability as well as manage enterprise privacy risks. The Classified System Overlay provides details on why it is necessary to apply specified controls for safeguarding classified information. The security and privacy baselines in CNSSI No. 1253 are “starting points” to guide an organization in controls applicable to their system once categorization is complete. Organizations are permitted to tailor2 the applied baseline to address specific mission or business needs and risks. Controls identified in this overlay generally have a legal/regulatory requirement associated with them and should not be tailored out without significant justification. For example, AT-2 (Literacy Training and Awareness) is in all NSS Security Control Baselines and the NSS Privacy Control Baseline because it is required by a regulatory requirement. An organization may tailor AT-2 out based on a risk assessment of the sufficiency of training and awareness provided. However, if an organization has a system with classified information on it and this overlay is applied, this overlay specifically identifies AT-2 as a control to support the safeguarding of classified information."
    status: "candidate"
