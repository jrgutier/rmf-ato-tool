  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0058"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 2, "anchor": "An overlay is separate and distinct from a NIST Cybersecurity Framework Profile."}
    kind: "indicative"
    locator: "2"
    context: ""
    statement: "An overlay is separate and distinct from a NIST Cybersecurity Framework Profile. Profiles provide guidance to address strategic mission/business objectives and reduce cybersecurity risk and identify specific cybersecurity activities to support mission/business success. Overlays identify specific sets of controls (and control enhancements) to apply to systems and support implementation of the NIST Risk Management Framework. CNSSI No. 1253 focuses on the applicability and use of CNSS-defined overlays."
    status: "not-a-requirement"
    reason: "Says what an overlay is against a NIST Cybersecurity Framework Profile: 'An overlay is separate and distinct'. Description, with no act."
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0059"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 10, "anchor": "This section is a comprehensive view of the control specifications as they"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "This section is a comprehensive view of the control specifications as they apply to this overlay. The guidance provided in this section elaborates on the guidance in NIST SP 800-53. For controls that should be selected, a justification is provided based on the defined overlay characteristics. In addition to a justification, a control may have other specifications that include guidance, parameter values, and regulatory/statutory references. The specifications in this section are summarized by Section 5, Table 1. Per NIST SP 800-53, control enhancements cannot be selected independently from or without also selecting the corresponding base security control (i.e., if a control enhancement is selected, then the corresponding base control must also be selected). Controls and enhancements are explicitly identified in an overlay only if they directly support the overlay topic. Tailor all controls and enhancements in the final control set as appropriate using the general tailoring guidance in CNSSI No. 1253. Controls and enhancements in a baseline or overlay either meet regulatory requirements or mitigate an anticipated threat. During tailoring, care must be taken that controls are not removed without a thorough understanding of the system, mission, environment, threats present (in the operational or development environment), regulatory requirements, and network, as removal may affect meeting a regulatory requirement and the security posture of the system, ultimately jeopardizing a system authorization. AC-1, (Access Control) Policy and Procedures"
    status: "candidate"
    work_item: "WI-59"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0060"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 10, "anchor": "Justification to Select: CNSSD No. 504 requires the implementation of standardized access"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "Justification to Select: CNSSD No. 504 requires the implementation of standardized access control methodologies (e.g., Identify and Access Management) for classified information. Organizations that process classified information must include appropriate content in their access control policy and procedures. Guidance: The tighter coupling of the identity to a trusted credential will enhance the ability to enforce, control, and manage the access of users on NSS and prevent the threat of a malicious insider inappropriately using another user's credentials in an attempt to obfuscate involvement in the misuse of national security information. Reference(s): EO 13526, Sec. 4.1, para. (d); CNSSD No. 504. AC-3(2), Access Enforcement | Dual Authorization"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0061"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 10, "anchor": "Justification to Select: CNSSD No. 504 requires the implementation of two-person controls"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "Justification to Select: CNSSD No. 504 requires the implementation of two-person controls (review and concurrence of a second person) for operations when protection is necessary to prevent significant disruptions and reduce the risk related to insider threats. Reference(s): EO 13587, Sec 6.1.; CNSSD No. 504."
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0062"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 11, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Discretionary access"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Discretionary access controls provide a means to reduce the opportunities cleared individuals may have to gain access to information for which they do not have a need-to-know. Reference(s): EO 13526, Sec 4.1, para. (a). AC-5, Separation of Duties"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0063"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 11, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. CNSSD No. 504 requires the implementation of"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. CNSSD No. 504 requires the implementation of the separation of duties. Separation of duties provides a means to safeguard the information by reducing the opportunities individuals may have to gain access to information. Guidance: Organizations should separate roles for network or database administration from other sensitive function, such as cryptographic key management, hardware management, removable media data transfer, system security management, or access to particularly sensitive information. Reference(s): EO 13587, Sec 6.1; CNSSD No. 504. AC-6, Least Privilege"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0064"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 11, "anchor": "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Implementing least"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "Justification to Select: EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Implementing least privilege provides a means to reduce the opportunities individuals may have to gain access to information for which they do not have a need-to-know. CNSSD No. 504 requires the implementation of least privilege. Reference(s): EO 13526, Sec 4.1, para. (a); CNSSD No. 504. AC-6(7), Least Privilege | Review of User Privileges"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0065"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 11, "anchor": "Justification to Select: CNSSD No. 504 requires the review of all privileged"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "Justification to Select: CNSSD No. 504 requires the review of all privileged users and ensures they have the appropriate clearances, roles, and scope to perform their duties and make changes as needed. Reference(s): EO 13526, Sec 4.1, para. (a); CNSSD No. 504."
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0066"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 12, "anchor": "Justification to Select: EO 13526 requires organizations to establish uniform procedures to"}
    kind: "modal"
    locator: "6"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish uniform procedures to ensure systems that store, process, or transmit classified information prevent access by unauthorized persons. Requiring a device lock after a specified period of inactivity helps to prevent unauthorized users from physically using an authorized user's session as a means to gain unauthorized access to classified information. Parameter Value:"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0067"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 12, "anchor": "Prevent further access to the system by initiating a device lock after"}
    kind: "lettered"
    locator: "a"
    context: ""
    statement: "a. Prevent further access to the system by initiating a device lock after a period not to exceed 15 minutes of inactivity, requiring the user to initiate a device lock before leaving the system unattended; Reference(s): EO 13526, Sec 4.1, para. (f).; EO 13587, Sec 5.2, para. (a). AC-11(1), Device Lock | Pattern-Hiding Displays"
    status: "candidate"
    work_item: "WI-57"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0068"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 12, "anchor": "Justification to Select: EO 13526 defines classification levels and requires organizations to label classified information to"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 defines classification levels and requires organizations to label classified information to reflect its classification. Labeling refers to internal labels that the software can read, such as fields attached to information that might be used in a CDS or multilevel system, or for message routing. Guidance: For classification and control labeling, the organization determines the permitted attributes and permitted values consistent with the policies applicable to the organization and based on the classification level and related security characteristics of the information stored, processed, or transmitted by the system. (For marking guidance, see MP-3.) Reference(s): EO 13526, Sec 1.2, para. (a), Sec 1.6, para. (a), and Sec 2.1, para. (a-b). AC-16(5), Security and Privacy Attributes | Attribute Displays on Objects to be Output"
    status: "candidate"
