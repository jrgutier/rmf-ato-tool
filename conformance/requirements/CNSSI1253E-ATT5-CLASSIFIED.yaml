  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0169"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 38, "anchor": "Justification to Select: EO 13526 directs the safeguarding of classified information while stored to prevent access by unauthorized persons and to ensure the integrity of the information. Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit. Guidance:"}
    kind: "modal"
    locator: "b"
    context: ""
    statement: "Justification to Select: EO 13526 directs the safeguarding of classified information while stored to prevent access by unauthorized persons and to ensure the integrity of the information. Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit. Guidance: The organization, in accordance with law, Executive Orders, and policy, determines the protection needs for the confidentiality of the information, including who has access to the information and the appropriate means for its protection. Parameter Value: Protect the confidentiality and integrity of the following information at rest: classified information at rest. Reference(s): EO 13526, Sec 4.1, para. (f); EO 13587, Sec 5.2, para. (a); NSM-8 Sec 1"
    status: "candidate"
