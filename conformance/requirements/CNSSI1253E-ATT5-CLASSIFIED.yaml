  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0029"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 9, "anchor": "Controls with Implementation Considerations Table 2 (below) identifies controls that may be"}
