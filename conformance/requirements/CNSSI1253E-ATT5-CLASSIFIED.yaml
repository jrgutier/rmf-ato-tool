  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0130"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 28, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Removable media provides"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Removable media provides a means for personnel to move classified data from official premises without proper authorization, and then in turn provide the classified information to unauthorized personnel. Restricting the use of removable media on systems that store, process or transmit classified information decreases the opportunities for unauthorized disclosure of classified information. Reference(s): EO 13526, Sec. 4.1, para. (d); EO 13587, Sec 2.1(b) and Sec 5.2. MP-8, Media Downgrading"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0131"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 28, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed. Guidance: An"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed. Guidance: An alternative to downgrading is to replicate the unclassified or lower classified information to media that is designated for the classification level. Reference(s): EO 13526, Sec. 4.1, para. (g); EO 13587, Sec 5.2, para (a). MP-8(1), Media Downgrading | Documentation of Process"
    status: "candidate"
    work_item: "WI-67"
