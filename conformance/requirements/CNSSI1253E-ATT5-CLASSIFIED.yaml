    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed. Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). MP-8(2), Media Downgrading | Equipment Testing"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0133"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 28, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed. Guidance: Testing"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed. Guidance: Testing of sanitization equipment and procedures should be conducted by qualified and authorized entities."
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0134"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 29, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed. Guidance: Downgrading"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed. Guidance: Downgrading of classified information requires use of approved sanitization tools, techniques, and procedures to ensure only confirmed unclassified information is moved from a classified system to unclassified media. Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). PE-2(3), Physical Access Authorizations | Restrict Unescorted Access"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0135"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 29, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Restricting unescorted access"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Restricting unescorted access is necessary to protect the classified information contained within the facility. Guidance: Organizations manage their facilities and provide adequate protections to ensure personnel do not have unescorted access to areas operating at classification levels higher than the clearance they have been granted. The organization may provide additional guidance to address their mission needs for areas within facilities or systems with components operating at different classification levels. Parameter Value(s): Restrict unescorted access to the facility where the system resides to personnel with security clearances for all information contained within the system. Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). PE-3(2), Physical Access Control | Facility and Systems"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0136"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 29, "anchor": "Justification to Select: EO 13526 states that information may not be removed"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 states that information may not be removed from official premises without proper authorization. Conducting security checks at random or a pre-defined frequency helps mitigate the risk of unauthorized removal of classified materials. Guidance: The organization monitors for unauthorized exfiltration of classified information."
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0137"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 30, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Employing guards or"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Employing guards or alarms at each access point helps mitigate the risk of authorized removal of classified material. Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). PE-4, Access Control for Transmission"
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0138"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 30, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Physically controlling the"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Physically controlling the access to distribution and transmission lines helps mitigate the risk of unauthorized access to classified information. Reference(s): EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a). PE-19, Information Leakage"
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0139"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 30, "anchor": "Justification to Select: EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. Information leakage through electromagnetic signals must be protected against to ensure the confidentiality of the classified information. Reference(s): EO 13526, Sec. 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a). PE-19(1), Information Leakage"}
    kind: "modal"
