  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0011"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 3, "anchor": "This overlay applies to NSS that store, process, or transmit classified information."}
    kind: "modal"
    locator: "3"
    context: ""
    statement: "This overlay applies to NSS that store, process, or transmit classified information. Information may be considered for classification when there is a reasonable expectation that unauthorized disclosure of the information could cause damage to national security8. There are three levels of classification: Top Secret (exceptionally grave damage), Secret (serious damage), and Confidential (damage). This overlay does not apply to NSS that store, process, or transmit only information that is unclassified, to include Controlled Unclassified Information (CUI). Types of classified information include information that pertains to military plans, weapon systems, or operations; foreign government information; intelligence activities (including covert action), intelligence sources or methods or cryptology; foreign relations or foreign activities of the United States, including confidential sources; scientific, technological, or economic matters relating to the national security; United States Government programs for safeguarding nuclear materials or facilities; vulnerabilities or capabilities of systems, installations, infrastructures, projects, plans, or protection services relating to the national security; or the development, production, or use of weapons of mass destruction. Classified information on systems requires protections and handling methods that are in addition to those required to protect unclassified information, because of the classified information’s nature and potential harm that would result from unauthorized disclosure. Impact values for confidentiality are not equivalent to classification levels. A loss of confidentiality is different from an unauthorized disclosure of classified information. Confidentiality impact values represent levels of impact on organizational operations and assets, individuals, other organizations, and the Nation. In contrast, classification levels represent the degrees of damage to national security. The categorization decision (i.e., the impact values for confidentiality, integrity, and availability) is independent of the classification decision. Organizations are required by EO 13526 to establish uniform procedures to ensure systems prevent access by unauthorized persons and ensure the integrity of the information."
    status: "partial"
    reason: "The overlay's applicability is held by SYSD-001 against the classification fact; the rest of the paragraph defines classification levels."
