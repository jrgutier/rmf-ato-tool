  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0018"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 4, "anchor": "Safeguards for protecting classified information are not equivalent to addressing safeguarding needs"}
    kind: "modal"
    locator: "4"
