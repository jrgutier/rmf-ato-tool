  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0080"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 16, "anchor": "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use of external systems present unique challenges for protecting classified information; AC-20 enhancements are needed to address these challenges. Guidance: Some organizations"}
    kind: "modal"
    locator: "a"
    context: ""
    statement: "Justification to Select: EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use of external systems present unique challenges for protecting classified information; AC-20 enhancements are needed to address these challenges. Guidance: Some organizations may choose to establish trust relationships with other organizations to enable use of non-organizationally owned systems, system components, or devices that process, store, or transmit classified organizational information. In cases of media devices, the organization should restrict use. The organization should also restrict the use of non-organizationally owned systems, system components, or devices to process, store, or transmit classified information."
    status: "candidate"
