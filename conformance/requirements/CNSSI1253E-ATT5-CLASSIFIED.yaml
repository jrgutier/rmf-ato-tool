  - {"page": 20, "locator": "a", "reason": "no-marker", "text": "Reference(s): EO 13587, Sec 2.1(b) and Sec 5.2; White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504. AU-16(1), Cross-Organizational Audit Logging | Identity Preservation"}
  - {"page": 20, "locator": "a", "reason": "no-marker", "text": "Justification to Select: Preserving the identities of individuals in cross-organization audit trails facilitates the detection of insider threats on all classified networks. Guidance: This control has been identified as having privacy implementation considerations (see Table 1). Reference(s): EO 13587, Sec 2.1(b) and Sec 5.2; White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504."}
