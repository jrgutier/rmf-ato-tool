  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0173"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 39, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Prohibiting the remote"}
    kind: "modal"
    locator: "b.(b)"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Prohibiting the remote activation of devices with sensor capabilities in all areas where classified information is stored, processed, transmitted, or discussed is considered a best practice for safeguarding classified information."
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0174"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 39, "anchor": "Guidance: The organization may define exceptions to allow remote activation of sensor"}
    kind: "should"
    locator: "b.(b)"
    context: ""
    statement: "Guidance: The organization may define exceptions to allow remote activation of sensor capabilities such as secure VTC, provided that the sensor capabilities are designed, configured, and operated securely. Organizations may designate some areas acceptable for temporary storage, processing, transmission, or discussion of classified information; however, during the periods when classified information is not being stored, processed, transmitted or discussed, the organization may allow remote activation of devices with sensor capabilities in those areas. This control has been identified as having privacy implementation considerations (see Table 1)."
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253E-ATT5-CLASSIFIED-0175"
    citation: {"ref": "CNSSI1253E-ATT5-CLASSIFIED", "page": 39, "anchor": "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Monitoring wireless networks"}
    kind: "modal"
    locator: "b.(b)"
    context: ""
    statement: "Justification to Select: EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Monitoring wireless networks for unauthorized use is necessary to protect classified information as it identifies unsanctioned connections and potential information leaks."
    status: "candidate"
    work_item: "WI-76"
