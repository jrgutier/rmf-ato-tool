    context: ""
    statement: "Justification to Select: EO 13526 directs the safeguarding of classified information while in transmission to ensure the integrity of the information and provide adequate protection from unauthorized access. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit. Parameter Value: Protect the confidentiality and integrity of transmitted information. Reference(s): EO 13526, Sec 4.1, para. (a), (f) and (g); EO 13587, Sec 5.2, para. (a); NSM-8, Sec 1(b)(iii). SC-8(1), Transmission Confidentiality and Integrity | Cryptographic Protection"
    status: "candidate"
