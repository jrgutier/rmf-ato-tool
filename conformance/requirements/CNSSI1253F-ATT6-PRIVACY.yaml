  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0065"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 94, "anchor": "Appendix: Privacy Risk Factors This appendix provides seven factors to help organizations"}
    kind: "indicative"
    locator: "4.2"
    context: "Privacy Overlays Relationship to Categorize and Select in the Risk"
    statement: "Appendix: Privacy Risk Factors This appendix provides seven factors to help organizations determine the privacy risk level associated with the PII processed in NSS. The factors should be applied by following these activities:"
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0066"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 94, "anchor": "Consider the factors (in the Appendix) individually and select the corresponding risk"}
    kind: "lettered"
    locator: "4.2.a"
    context: "Privacy Overlays Relationship to Categorize and Select in the Risk The factors should be applied by following these activities:"
    statement: "a. Consider the factors (in the Appendix) individually and select the corresponding risk level of each factor. To support consistency, organizations may not eliminate factors from the privacy risk analysis. Additional factors may be added to determine a system’s privacy risk level in an exceptional situation, but not as a matter of course."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0067"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 94, "anchor": "Next, consider the risk levels of the factors collectively and determine the"}
    kind: "lettered"
    locator: "4.2.b"
    context: "Privacy Overlays Relationship to Categorize and Select in the Risk The factors should be applied by following these activities:"
    statement: "b. Next, consider the risk levels of the factors collectively and determine the overall privacy risk level of the PII, and by extension of the system. The Privacy Overlays do not follow a high watermark approach for evaluating privacy risk factors. Agencies may weight factors equally or weight them corresponding to the specific circumstances or context of the PII or system. Additionally, if a factor is a higher risk level than all other factors for the system, the agency could select the lower risk level and tailor in supplemental controls that specifically address the risk of the outlying factor. Appendix D provides system risk analysis use cases. The SAOP, or designee, must approve the Privacy Overlays selected for the system."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0068"
