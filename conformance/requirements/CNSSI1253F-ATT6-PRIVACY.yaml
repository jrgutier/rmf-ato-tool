    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Recommend for Privacy Enhancing: Most effective means to protect PII is to only archive what will be used after it is archived. This best practice supports records retention requirements and Minimization FIPP. Reference(s): OMB Circular A-130 SI-19(3), De-Identification | Release*"
