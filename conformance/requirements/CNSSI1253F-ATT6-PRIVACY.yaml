    ruling_sought: [{"sentence": "Justification to Recommend for Privacy Enhancing: Deploying automatic mechanisms provides additional privacy enhancing protections by preventing PII from being processed when processing is not authorized, or in a manner that is not authorized, or by automatically identifying when such unauthorized processing occurs.", "reason": "A Privacy Enhancing control is optional: the organization may tailor it in to address system-specific privacy risk (Section 3.2), so a recommendation to select it can never fail"}]
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0221"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 70, "anchor": "Justification to Select for Moderate and High: Data tagging supports tracking and enforcement of processing structured"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for Moderate and High: Data tagging supports tracking and enforcement of processing structured or unstructured PII for the purpose for which it was collected, obtained, or accessed. Consistent with the Privacy Act and the Purpose Specification Principle and Use Limitation Principle of the Fair Information Practice Principles (FIPPs), sharing of PII should be compatible with this purpose. Consistent with the Privacy Act routine use exception and the FIPPs’ Transparency Principle, any subsequent sharing that is not compatible may not be done until the agency notifies the individual, obtains consent, and updates or publishes relevant documents, e.g., when applicable and appropriate publish an updated SORN to cover the additional incompatible sharing and obtain consent from the affected individuals. Reference(s): 5 U.S.C. §552a(e); OMB Circular A-130 PT-3(2), Personally Identifiable Information Processing Purposes | Automation*"
    status: "candidate"
    work_item: "WI-72"
