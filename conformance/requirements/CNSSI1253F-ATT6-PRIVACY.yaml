  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0174"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 53, "anchor": "Justification to Select for Moderate and High: Test processing PII prior to"}
    kind: "modal"
    locator: "4.2.g.(f)"
    context: "CA-3, INFORMATION EXCHANGE Parameter Value:"
    statement: "Justification to Select for Moderate and High: Test processing PII prior to going live reduces the impact of possible misuse or abuse. Guidance: If PII is processed in the test environment, then the same controls required for systems containing PII must be applied to the test environment. Synthetic or simulated PII information should be used to the maximum extent practicable when testing system functionality. A Privacy Act system of records must use synthetic data, even in test environments, until the SORN has met statutory requirements. Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 CM-4(2), Impact Analyses | Verification of Controls"
    status: "candidate"
    work_item: "WI-62"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0175"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 53, "anchor": "Justification to Select for Moderate and High: If a system change is"}
