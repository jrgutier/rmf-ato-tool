  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0123"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 34, "anchor": "Justification to Recommend for Privacy Enhancing: To provide the ability for an"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Recommend for Privacy Enhancing: To provide the ability for an organization to monitor and prevent transfer of PII across different security domains, a system needs to have mechanisms to automatically detect, and where appropriate, prohibit the unauthorized transfer of PII across different security domains. Typical implementations of such controls will detect particular data types or metadata tagging and take action to prevent the transfer of the information beyond the ended boundaries. Guidance: The organization provides the capability for the organization to centrally monitor for and detect unauthorized transfer of such PII across different security domains. Some technologies that would facilitate this include data-loss prevention, data-rights management, and key-word detection to prevent the unauthorized export of information from a network or to render such information unusable in the event of the unauthorized export of such information between security domains. Reference(s): 5 U.S.C. §552a(c), (e)(10), FISA, EO 12333 AC-4(17), Information Flow Enforcement | Domain Authentication*"
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: nothing a rule can fail. Unheld: the recommendation is a permission, ruling sought on it; the entry's other sentences are prose no rule judges; the guidance for AC-4.15 is prose the SSP author reads through rmf catalog show --fields overlay; no rule judges it."
