  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0060"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 28, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Account management is"}
    kind: "modal"
    locator: "4.2"
    context: "Table 2: Privacy Overlays Security and Privacy Controls"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Account management is a critical function for developing and implementing an access control framework that is appropriate for the information contained in systems and applications. When implemented effectively, the access control framework provides the necessary constructs for controlling access to PII, limiting disclosure of records about individuals to only those system and application users that have a need for the information to perform their job functions. Organizations should provide access only to the minimum amount of PII necessary for users to perform their duties. Guidance: Use of temporary accounts is prohibited for accessing PII as these accounts have increased risk and little or no accountability. ACCT, Low, and Moderate Parameter Value:"
    status: "candidate"
    work_item: "WI-79"
