  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0163"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 50, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Boundary protection devices"}
    kind: "modal"
    locator: "4.2"
    context: "CA-3, INFORMATION EXCHANGE"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Boundary protection devices protect systems containing PII from unauthorized access by individuals outside the organization. Agreements document whether and under what circumstances PII can be shared between systems in different authorization boundaries (e.g., an interface between systems owned by different agencies) over a dedicated or “always on” connection. Agreements communicate that PII will be exchanged via the connection and define the security parameters required to protect it. Agreements also provide a record of agreed upon terms and a document against which controls can be enforced and audited. Organizational policy dictates whether agreements are required for internal connections within an organization."
    status: "candidate"
    work_item: "WI-61"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0164"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 51, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Privacy requirements such"}
