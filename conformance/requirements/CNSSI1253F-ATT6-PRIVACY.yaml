  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0152"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 45, "anchor": "Justification to Select for Moderate and High: Systems with increased privacy risk"}
    kind: "modal"
    locator: "4.2"
    context: "AU-3, CONTENT OF AUDIT RECORDS"
    statement: "Justification to Select for Moderate and High: Systems with increased privacy risk require more detailed information in audit records to ensure appropriate levels of accountability for accessing and processing of PII and, in cases of PII incidents or breaches, to identify countermeasures to mitigate potential privacy harms. Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12 AU-3(3), Content of Audit Records | Limit Personally Identifiable Information Elements – In the Privacy Control Baseline"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0153"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 46, "anchor": "Justification to Select for Moderate and High: Appropriate officials must be notified"}
    kind: "modal"
    locator: "4.2"
    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Justification to Select for Moderate and High: Appropriate officials must be notified of audit logging failures in a timely manner in order to take actions to prevent or limit the loss of information necessary to identify whether PII is abused or misused. Reference(s): 5 U.S.C. §552a(e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12 AU-6, AUDIT RECORD REVIEW, ANALYSIS, AND REPORTING"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0154"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 46, "anchor": "Justification to Select for Moderate and High: Review and analysis of privacy"}
    kind: "modal"
    locator: "4.2"
    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Justification to Select for Moderate and High: Review and analysis of privacy logs are important for proactively identifying indications of inappropriate or unusual activity that may signify PII misuse or abuse, particularly for systems with a higher privacy risk. Guidance: Inappropriate or unusual activity must be reported to privacy offices or other officials so that appropriate responses or actions can be taken to prevent or mitigate privacy harms. Adjustments to the review, analysis, or reporting of audit information may be required to ensure that individuals are held accountable for any abuse or misuse of PII."
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0155"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 47, "anchor": "Justification to Select for Moderate and High: Correlating and analyzing privacy audit"}
    kind: "modal"
    locator: "4.2"
    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Justification to Select for Moderate and High: Correlating and analyzing privacy audit logs across different log repositories and systems better enables potential identification of PII misuse or abuse across the organization and ensures greater accountability of individuals who use higher privacy risk systems. Reference(s): 5 U.S.C. §552a(g), (i); OMB Circular A-130; OMB M-17-12 AU-7, AUDIT REDUCTION AND REPORT GENERATION"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0156"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 47, "anchor": "Justification to Select for Moderate and High: Using cryptographic mechanisms protects integrity"}
    kind: "modal"
    locator: "4.2"
    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Justification to Select for Moderate and High: Using cryptographic mechanisms protects integrity and the confidentiality of the information in the audit logs, including information related to potential privacy incidents and breaches. Audit information may be necessary to enforce criminal or civil penalties under the Privacy Act. In addition to cryptographic mechanisms to protect integrity, the confidentiality of PII in the audit logs themselves may require the use of encryption. Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); OMB Circular A-130; OMB M-17-12 AU-9(4), Protection of Audit Information | Access by Subset of Privileged Users"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0157"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 48, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Minimizing the number"}
    kind: "modal"
    locator: "4.2"
    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Minimizing the number of individuals with access to the audit logs facilitates audit log integrity by reducing the opportunity for individuals to inhibit audit activities or modify audit records. It also limits the disclosure of PII within the logs to those who have a mission requirement and need to know."
    status: "candidate"
