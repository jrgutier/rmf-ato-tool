  - {"page": 98, "locator": "4.2.c", "reason": "no-marker", "text": "Aggregating records in larger quantities increases the potential privacy impact in the event of loss or misuse. For example, OMB M-17-05, Fiscal Year 2016-2017 Guidance on Federal Information Security and Privacy Management Requirements, states, “An unauthorized modification of, unauthorized deletion of, unauthorized exfiltration of, or unauthorized access to 100,000 or more individuals' PII constitutes a ‘major incident.’”"}
