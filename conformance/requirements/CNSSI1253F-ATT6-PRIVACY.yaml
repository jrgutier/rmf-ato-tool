  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0059"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 28, "anchor": "This section is a comprehensive view for each control specified for the"}
    kind: "indicative"
    locator: "4.2"
    context: "Table 2: Privacy Overlays Security and Privacy Controls"
    statement: "This section is a comprehensive view for each control specified for the overlays control sets, as well as the Privacy Enhancing controls as they apply to the Privacy Overlays. The guidance provided in this section elaborates on the guidance given in NIST SP 800-53, Rev. 5. For controls that should either be selected (“+”) or not selected (“--”), a justification is given based on the defined overlays characteristics and assumptions. In addition to justification, a control may have other specifications that include control extensions “(“E”), guidance (“G”) – including specific tailoring guidance), parameter values (“V”), and regulatory/statutory references (“R”). Controls indicated with an asterisk (“*”) are optional. On occasion, a security or privacy control may only include a selection or guidance without a reference – in these instances applicability of the control is not absolute but should align with commonly expected practices. Parameter values (shown in italics) align with, but do not replace, other parameter values indicated in CNSSI 1253. AC-1, (ACCESS CONTROL) POLICY AND PROCEDURES – Included in the Privacy Control Baseline AC-2, ACCOUNT MANAGEMENT"
    status: "candidate"
