    statement: "Justification to Recommend for Privacy Enhancing: Supports the FIPPs of Quality and Integrity and Minimization. Guidance: Factor in the system’s records control schedules when applicable. Refreshing information implements several FIPPs. For example, refreshing the information and generating it on demand implements the Quality and Integrity FIPPs. Deleting information when it is no longer needed implements the Minimization FIPP. Reference(s): OMB Circular A-130 SR-1, (SUPPLY CHAIN RISK MANAGEMENT) POLICY AND PROCEDURES – Included in the Privacy Control Baseline SR-4, PROVENANCE"
