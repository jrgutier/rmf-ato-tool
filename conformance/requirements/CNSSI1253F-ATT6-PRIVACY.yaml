    kind: "lettered"
    locator: "3.o"
    context: "Example:"
    statement: "o When combined: (Address of large apartment building) + (Address of a large work establishment) + (“Dumb” tracking device showing mobile location information over time (not tied to a phone number or direct identifier, e.g., personal athletic tracking device)) = PII. 3.1.3. Data Elements Added to PII Once data elements are PII (either direct identifier or compiled data elements), then any other data elements about that individual that are then combined with the PII will also become PII. In other words, when information that is not otherwise attributed to an individual is associated with that individual’s PII, then the non-attributable information becomes PII by association. Instance #3: Data elements that are not PII will become PII when combined with a Direct Identifier."
