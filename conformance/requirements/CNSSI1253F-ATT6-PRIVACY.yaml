  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0078"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 4, "anchor": "Security and privacy professionals often have differing backgrounds and levels of understanding"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "Security and privacy professionals often have differing backgrounds and levels of understanding for each other’s requirements and activities. The Privacy Overlays include information to help privacy and security communities understand each other and to work in partnership to manage privacy risk to individuals, manage risk to organizations that may arise from causing privacy risks to individuals, and protect PII. Organizations may also need to identify additional measures during the privacy engineering process to address privacy risk that is not addressed through the security and privacy controls that are available in NIST SP 800-53, Revision 5. CNSSI No. 1253 provides the security and privacy control baselines for NSS.11 The Privacy Overlays provide NSS-specific information on protecting PII in the national security community, and parameter values for NIST SP 800-53 controls that are applicable to all NSS with PII. The Privacy Overlays apply to all NSS that process PII. For NSS, where differences between the NIST documentation and these Privacy Overlays occur, these Privacy Overlays take precedence."
    status: "not-a-requirement"
    reason: "Section 1 tail: what the overlays are for, and that 'Organizations may also need to identify additional measures'. Description and a permission, which binds no one."
