  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0180"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 55, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Backup copies of"}
    kind: "modal"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Backup copies of information must be protected with the same level of security as the information maintained on the original system. Applicable controls necessary to achieve this and to protect confidentiality include encryption of the backup. Backing up information helps maintain the integrity of the data, which is a requirement under the Privacy Act. Use the encryption methodology specified in SC-13 to encrypt Low, Moderate, and High information in backups at the storage location."
    status: "candidate"
    work_item: "WI-63"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0181"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 55, "anchor": "Justification to Select for Moderate and High: PII with a higher privacy"}
    kind: "modal"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "Justification to Select for Moderate and High: PII with a higher privacy risk requires increased protections. Reference(s): 5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503 CP-10, INFORMATION SYSTEM RECOVERY AND RECONSTITUTION"
    status: "candidate"
    work_item: "WI-63"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0182"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 55, "anchor": "Reference(s): 5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130 IA-2(1), Identification and"}
    kind: "modal"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "Reference(s): 5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130 IA-2(1), Identification and Authentication (Organizational Users) | Multifactor Authentication to Privileged Accounts Justification to Select for Moderate and High: System owners are required to know who is accessing data and who is receiving the data. Users of privileged accounts are trusted with access to perform system control, monitoring, administration functions, or security-relevant functions that ordinary users are not authorized to perform. Thus, users with access to privileged accounts should undergo more than one means of verification to log onto the system. This can be addressed with two factor authentication."
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0183"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 56, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Shared accounts inhibit"}
    kind: "modal"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Shared accounts inhibit the ability to trace and hold individuals accountable for their access and use of PII. Shared accounts must be individually authenticated to ensure PII processed by the information system is safeguarded. Reference(s): 5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130 IA-2(6), Identification and Authentication (Organizational Users) | Access to Accounts – Separate Device"
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0184"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 56, "anchor": "Justification to Select for Moderate and High: Requiring multi-factor authentication to privileged"}
    kind: "modal"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "Justification to Select for Moderate and High: Requiring multi-factor authentication to privileged accounts provides added assurance that a privileged user, who likely has elevated privileges with access to PII, has proven their identity during the authentication process. During multi-factor authentication, implementing one of the factors on a separate device reduces the likelihood of compromise and provides heightened assurance of identity during the authentication process. Guidance: Two-factor authentication should require one factor separate from the computer itself. A separate device would include a Common Access Card (CAC). This control is required when the network access is remote (from outside the organization-controlled networks). Reference(s): 5 U.S.C. §552a(e)(10); NSM-8; OMB M-17-12 IA-4, IDENTIFIER MANAGEMENT"
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0185"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 56, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Identifiers are unique"}
    kind: "modal"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Identifiers are unique and should not be shared or reused. Processes and procedures must be used to manage user identifiers in order to prevent inappropriate access to an information system holding PII. Guidance: Receiving authorization to assign an individual, group, role, or device identifier; selecting and assigning an identifier to an individual, group, role or device; preventing the reuse of identifiers for a defined time period; and disabling the identifier after a defined time period of inactivity are some of the best practices for safeguarding PII within an organization or system. Social Security Numbers (SSNs) and parts of SSNs should not be used as identifiers for individuals. SSNs create the potential for unauthorized disclosure of the SSN. In addition, system identifiers are not protected with the same level of security as are database elements or passwords and use of an SSN may allow linkage to other PII for that individual. Use of an individual’s SSN as an identifier may create notice requirements under the Privacy Act. Reference(s): 5 U.S.C. §552a (note §§7(a)(1)), (b), (e)(10) and (j); 44 U.S.C. §3518(c)(1); NSM-8 IA-5, AUTHENTICATOR MANAGEMENT"
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0186"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 57, "anchor": "Justification to Select for Moderate and High: PII requires encryption in certain"}
    kind: "modal"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "Justification to Select for Moderate and High: PII requires encryption in certain circumstances, including requirements for authentication to cryptographic modules. Guidance: Organizations must either use cryptographic modules which satisfy FIPS 140- 322, including requirements for authentication, or NSA-certified hardware-based encryption modules. Use of unapproved cryptographic modules potentially allows unauthorized access to the cryptographic module or underlying, encrypted PII. Reference(s): 5 U.S.C. §552a(e)(10); NSM-8; OMB M-17-12"
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0187"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 57, "anchor": "There is a multi-year overlapping period between FIPS 140-2 and FIPS 140-3,"}
    kind: "should"
    locator: "4.2"
    context: "CP-9, INFORMATION SYSTEM BACKUP"
    statement: "There is a multi-year overlapping period between FIPS 140-2 and FIPS 140-3, ending September 21, 2026. Until that time, organizations may satisfy either FIPS 140-2 or 140-3, as applicable."
    status: "not-a-requirement"
    reason: "Advisory note on an expired window: until September 2026 'organizations may satisfy either FIPS 140-2 or 140-3'. A permission, and the date has passed."
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0188"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 58, "anchor": "Justification to Select for Low, Moderate, and High: Authentication of non-organizational users"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for Low, Moderate, and High: Authentication of non-organizational users accessing information systems is required to protect PII and privacy. This control requires information systems to uniquely identify and authenticate system users that are not part of the organization, as well as processes that act on behalf of another organization. This means no one is provided anonymous access to PII and supports managing each user’s appropriate access to PII."
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0189"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 58, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Collecting, validating, and"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Collecting, validating, and verifying a user’s identity information to establish their credentials to gain access to a system processing PII helps protect PII against harm by limiting access to PII to those individuals who are permitted and have a need to know the information in the performance of the users’ official duties."
    status: "candidate"
    work_item: "WI-64"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0190"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 58, "anchor": "Justification to Select for Moderate and High: Simulated incident response training provides"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for Moderate and High: Simulated incident response training provides an opportunity for stakeholders to practice their roles, responsibilities, response plans, and actions to help ensure a more effective response in the event of a crisis, such as a breach of PII. Using simulated events training to gain practical experience managing incident response reduces likelihood of misuse or abuse of PII, which reduces privacy risk. This control can be addressed at the organizational or system level."
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0191"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 59, "anchor": "Justification to Select for Moderate and High: Certain threats, such as cyber-attacks"}
    kind: "should"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for Moderate and High: Certain threats, such as cyber-attacks involving breaches of PII, may only be seen after looking at information from various sources. Correlating incident information and incident responses that involve PII can provide an organization-wide perspective on incident awareness and response. This control can be addressed at the organizational or system level. Reference(s): OMB Circular A-130 IR-4(7), Incident Handling | Insider Threats — Intra-Organization Coordination – Included in the Privacy Control Baseline IR-5, INCIDENT MONITORING - Included in the Privacy Control Baseline IR-6, INCIDENT REPORTING - Included in the Privacy Control Baseline"
    status: "candidate"
    work_item: "WI-65"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0192"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 59, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Privacy considerations should"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Privacy considerations should be included in system maintenance policy and procedures especially when the system contains information subject to the Privacy Act. Guidance: This can be satisfied through an enterprise policy for systems that maintain PII. System maintenance policy and procedures must ensure that contractors operating a system of records by or on behalf of an agency to accomplish an agency function are contractually bound to be covered by the Privacy Act."
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0193"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 60, "anchor": "Justification to Select for Moderate and High: Maintenance tools that may access"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for Moderate and High: Maintenance tools that may access PII on a system may only be used by technical personnel who need to know the PII related to their official functions and have completed appropriate training as outlined in the AT controls. Guidance: Ensure maintenance tools can only be leveraged by the authorized providers to ensure that training requirements and access controls are followed. Reference(s): 5 U.S.C. §552a(b), (e)(9)-(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6); Section 1.6(d); ICD 107; ICD 503 MA-3(5), MAINTENANCE TOOLS: EXECUTION WITH PRIVILEGE"
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0194"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 60, "anchor": "Justification to Select for Moderate and High: Maintenance tools that execute with"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for Moderate and High: Maintenance tools that execute with increased system privilege can result in unauthorized access to PII that would otherwise be inaccessible. Individuals with increased system privilege must have a need to know the PII in the system and have taken appropriate privacy training. Reference(s): 5 U.S.C. §552a(b), (e)(9)-(10), 12333, FISA Sections 101(h); 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503 MA-4(6), Nonlocal Maintenance | Cryptographic Protection"
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0195"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 60, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Encrypting the communications"}
    kind: "indicative"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Encrypting the communications channel when maintenance is performed remotely protects user credentials, PII, and other data as it travels “across the wire.” Reference(s): FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503; OMB M-17-12, OMB Circular A-130 MA-5, MAINTENANCE PERSONNEL"
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0196"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 60, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Ensures maintenance personnel"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Ensures maintenance personnel and others with physical access to a system are properly authorized and/or supervised by someone who is authorized to access the system, which protects PII and other information from unauthorized use and disclosure. Guidance: If maintenance personnel are contractors operating a system of records by or on behalf of an agency to accomplish an agency function, then the organization must ensure that the contractors are contractually bound to implement the Privacy Act. Reference(s): 5 U.S.C. §552a(b), (e)(9)-(10), and (m); FAR Part 24.104, 39.105, and 52.224-1 MP-1, MEDIA PROTECTION POLICY AND PROCEDURES – Included in the Privacy Control Baseline MP-2, MEDIA ACCESS"
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0197"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 61, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Restricting access to"}
    kind: "indicative"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Restricting access to digital and non-digital media, including mobile devices with storage capabilities, protects PII from unauthorized use and disclosure. Guidance: Conduct a risk assessment to determine what PII, if any, can be stored on certain media types and who is authorized to do so."
    status: "candidate"
    work_item: "WI-66"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0198"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 61, "anchor": "Parameter Values: Restrict access to any digital or non-digital media containing PII"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Parameter Values: Restrict access to any digital or non-digital media containing PII to authorized individuals with a valid need to know."
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0199"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 61, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: To enable individuals"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: To enable individuals to appropriately protect media containing PII, that media (or its container) must be marked to specify the contents, applicable protections (i.e., distribution limitations, handling caveats, and applicable security markings), or both, for the information therein. Guidance: Media containing PII, or the container for the media if labeling the media is not practicable, shall be marked appropriately. Reference(s): 5 U.S.C. §552a(e)(10); ICD 107; ICD 121; ICD 503; OMB Circular A-130 MP-4, MEDIA STORAGE"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0200"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 61, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Controlling the storage"}
    kind: "modal"
    locator: "4.2"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Controlling the storage of media containing PII protects the media from theft and promotes accountability. Parameter Value:"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0201"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 61, "anchor": "Physically control and securely store removable media that contains PII within any"}
    kind: "lettered"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "a. Physically control and securely store removable media that contains PII within any securable area or in a locked container; and Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 MP-5, MEDIA TRANSPORT"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0202"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 61, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Protecting and controlling"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Protecting and controlling media containing PII, commensurate with the sensitivity of the PII contained on the media, during transport outside of controlled areas promotes accountability and limits situations that make the media vulnerable to unauthorized use and disclosure through loss, theft, or other mishandling. Parameter Value:"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0203"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 62, "anchor": "Protect and control digital media that contains PII during transport outside of"}
    kind: "lettered"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "a. Protect and control digital media that contains PII during transport outside of controlled areas using NSA-approved or FIPS-validated encryption;"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0204"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 62, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Properly sanitizing media"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Properly sanitizing media that contains PII prior to disposal or release protects PII from unauthorized use and disclosure and facilitates compliance with retention schedules. All PII must be removed to prevent privacy breaches."
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0205"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 62, "anchor": "Sanitize digital media that contains PII prior to disposal, release out of"}
    kind: "lettered"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "a. Sanitize digital media that contains PII prior to disposal, release out of organizational control, or release for reuse using NSA-approved or FIPS-validated media sanitization techniques or procedures; and"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0206"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 62, "anchor": "Justification to Recommend for Privacy Enhancing: Tracking, documenting, and verifying media sanitization"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Recommend for Privacy Enhancing: Tracking, documenting, and verifying media sanitization and disposal actions for media that contains PII reduces the risk of unauthorized disclosure of PII and increases accountability."
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: nothing a rule can fail. Unheld: the recommendation is a permission, ruling sought on it; the entry's other sentences are prose no rule judges; the wording beyond the cited authorities."
    evidence: [{"kind": "prose", "target": "playbooks/S/S-2.md", "claim": "presence", "asserts": "S-2 reads the overlay's recommendation for an optional Privacy Enhancing control through rmf catalog show --fields overlay before tailoring it in"}]
    work_item: "WI-67"
    ruling_sought: [{"sentence": "Justification to Recommend for Privacy Enhancing: Tracking, documenting, and verifying media sanitization and disposal actions for media that contains PII reduces the risk of unauthorized disclosure of PII and increases accountability.", "reason": "A Privacy Enhancing control is optional: the organization may tailor it in to address system-specific privacy risk (Section 3.2), so a recommendation to select it can never fail"}]
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0207"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 62, "anchor": "Justification to Select for Moderate and High: Permits the organization to specify"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for Moderate and High: Permits the organization to specify remote memory and data wipe when the smart device is reported lost or stolen, and/or implementing a limited number of unsuccessful login attempts before the smart device wipes its memory and clears its contents. Guidance: Consider use of this control for mobile devices such as iPads or other smart device. If using personal smart devices (for example, BYOD), the organization must evaluate methods to ensure this control is enforced or that compensating controls are in place. Consider including contractual clauses to be able to delete the information from cloud systems. Reference(s): 5 U.S.C. §552a(b) and (e)(10); OMB Circular A-130 MP-7, MEDIA USE"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0208"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 63, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Personally owned mobile"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Personally owned mobile devices and other personal media exist outside the boundaries of organization-owned systems, which limits the ability of organizations to control how PII is handled. Therefore, controlling what may be placed on a personally owned mobile device reduces organizational risk. Systems that process any PII must not have unidentifiable systems attached."
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0209"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 63, "anchor": "Restrict the use of portable storage and mobile devices on information systems"}
    kind: "lettered"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "a. Restrict the use of portable storage and mobile devices on information systems and networks containing PII, without using device ownership, media sanitization and encryption controls;"
    status: "candidate"
    work_item: "WI-67"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0210"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 63, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Physical access controls"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Physical access controls that limit access to a facility commensurate with the level of sensitivity of the PII processed in a facility is required to protect the PII from unauthorized access, use, and disclosure. Reference(s): 5 U.S.C. §552a(b), (e)(10); OMB Circular A-130 PE-5, ACCESS CONTROL FOR OUTPUT DEVICES Justification to Select for Moderate and High: Controlling physical access to output devices such as monitors, printers, and audio devices protects PII from unauthorized access. Guidance: Access controls applied to output devices should be commensurate with the privacy risk level. For example, human resource information should be sent only to printers located in secured locations rather than in widely accessible areas within the facility."
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0211"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 64, "anchor": "Justification to Select for Moderate and High: PII collected, stored, and processed"}
    kind: "indicative"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for Moderate and High: PII collected, stored, and processed at an alternate worksite is subject to the same laws, regulations, and policies as PII handled at the primary organizational facility.”"
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0212"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 64, "anchor": "Justification to Select for High: This control is required to limit intentional"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for High: This control is required to limit intentional and unintentional disclosures of PII. Guidance: Locate system components that either store or display PII and place components in a manner to decrease the risk of unauthorized disclosure. One example is ensuring placement of monitors to prevent unauthorized viewing of the displayed information. Another example is ensuring servers and disk arrays containing PII are located in a secured space."
    status: "candidate"
    work_item: "WI-68"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0213"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 65, "anchor": "Included in the Privacy Control Baseline PL-8, SECURITY AND PRIVACY ARCHITECTURES"}
    kind: "lettered"
    locator: "4.2.a.–"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "– Included in the Privacy Control Baseline PL-8, SECURITY AND PRIVACY ARCHITECTURES"
    status: "not-a-requirement"
    reason: "Heading fragment: '– Included in the Privacy Control Baseline PL-8, SECURITY AND PRIVACY ARCHITECTURES'. It names the next control and says what baseline holds it."
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0214"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 66, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: The privacy risks"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: The privacy risks inherent with monitoring user activity and merging sensitive PII from myriad data resources within an organization, such as human resource and user activity, require the active participation, review, and concurrence of the SAOP, or designee. Extension: When defining the requirements for and designing an organization's insider threat program, the insider threat team must engage and obtain concurrence of the organization's Privacy Officer prior to implementation and on a continuing basis. For existing insider threat programs, conduct a review of the program with the organization’s Privacy Officer to ensure the program meets applicable privacy requirements. Reference(s): 5 U.S.C. §552a(e)(5), (9), (10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503; OMB Circular A-130; OMB M-17- 12 PM-13, SECURITY AND PRIVACY WORKFORCE – Included in the Privacy Control Baseline PM-14, TESTING, TRAINING, AND MONITORING – Included in the Privacy Control Baseline PM-17, PROTECTING CONTROLLED UNCLASSIFIED INFORMATION ON EXTERNAL SYSTEMS – Included in the Privacy Control Baseline PM-18, PRIVACY PROGRAM PLAN – Included in the Privacy Control Baseline PM-19, PRIVACY PROGRAM LEADERSHIP ROLE – Included in the Privacy Control Baseline PM-20, DISSEMINATION OF PRIVACY PROGRAM INFORMATION – Included in the Privacy Control Baseline PM-20(1), Dissemination of Privacy Program Information | Privacy Policies on Websites, Applications, and Digital Services – Included in the Privacy Control Baseline PM-21, ACCOUNTING OF DISCLOSURES"
