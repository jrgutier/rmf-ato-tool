  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0223"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 70, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Consistent with the Individual Participation FIPP, organizations"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Consistent with the Individual Participation FIPP, organizations should involve the individual in the process of using PII and, to the extent practicable, seek individual consent prior to processing PII. For systems of records protected by the Privacy Act, written consent is required before records are disclosed by any means of communication to any person or agency unless there is a Privacy Act exception. Guidance: Obtain consent when collecting or processing PII. Opt-in is the preferred method to obtain consent. The SAOP, or designee, can provide information on what is required for a particular system. For systems of records protected by the Privacy Act, written consent is required before records are disclosed by any means of communication to any person or agency unless there is a Privacy Act exception. Reference(s): 5 U.S.C. §552a(b), (e)(3)-(4), OMB Circular A-130 PT-5, PRIVACY NOTICE"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0224"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 71, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Consistent with the Purpose Specification and Use Limitation and Transparency FIPPs, organizations should provide appropriate"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Consistent with the Purpose Specification and Use Limitation and Transparency FIPPs, organizations should provide appropriate notice of the privacy practices and specific purpose for which PII is collected. Organizations should also limit processing of PII to purposes explained in the notice and compatible with the purpose for which the PII was collected, or that is otherwise legally authorized. Guidance: Provide privacy notices when required. For Privacy Act systems of record, Privacy Act Statement is required unless appropriately claimed statutory exemptions are in place. For many mission related national security systems, this will be the case. The SAOP, or designee, can provide information on what is required for a particular system. Consistent with FIPPs’ Transparency Principle, a privacy notice should be provided which describes the privacy practices associated with that PII, including, but not limited to, the way the PII is protected, how it is used, and whether it is shared. Reference(s): 5 U.S.C. §552a(e); OMB Circular A-130 PT-5(1), Privacy Notice | Just-In-Time Notice"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0225"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 71, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Just-in-time privacy notices"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Just-in-time privacy notices provide individuals with information about how their PII will be processed at the time when they are best able to assess their privacy risk based on current circumstances. Just-in-time privacy notices ensure that individuals have accurate and timely information, enabling them to provide informed consent to the processing of their PII."
    status: "candidate"
    work_item: "WI-72"
