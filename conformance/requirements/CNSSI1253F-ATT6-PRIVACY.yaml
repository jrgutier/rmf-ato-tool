  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0298"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 93, "anchor": "There are two new tools that support collaboration between privacy and security"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "There are two new tools that support collaboration between privacy and security offices regarding privacy controls: the Privacy Implementation Considerations column in the CNSSI No. 1253 and the Collaboration Index for Security and Privacy Controls (Collaboration Index) which is available through the Federal Privacy Council’s website FPC.gov. CNSSI No. 1253 identified certain controls in its Privacy Implementation Considerations column. Selection of these controls requires coordination with the SAOP, or designee, to address any privacy risks and mitigation considerations that may arise from selecting controls listed under privacy implementation considerations. The Federal Privacy Council and the Federal Chief Information Officer Council jointly developed the Collaboration Index to serve as a guide to help Federal information security programs and Federal privacy programs consider the level of collaboration between the security and privacy offices necessary for each control. For each control and control enhancement listed in NIST Special Publication 800-53 Revision 5, the Collaboration Index provides a value that denotes the level of collaboration that may be appropriate. The Collaboration Index and the Privacy Implementation Considerations column in CNSSI 1253 have a different scope and purpose. The Privacy Implementation Considerations indicator denotes the situation in which security programs should coordinate with privacy programs because how the control is implemented may introduce unexpected privacy risk. This is distinct from the Collaboration Index, which provides general guidance on the amount of collaboration that may be appropriate between information security programs and privacy programs and is not specific to NSS. If an organization does not already have established mechanisms for collaboration to implement Privacy Implementation Consideration controls, the Collaboration Index offers a starting point for determining the degree of responsibility and collaboration between security and privacy. 8 Definitions"
    status: "candidate"
    work_item: "WI-32"
