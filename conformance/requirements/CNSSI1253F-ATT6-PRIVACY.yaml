    statement: "Justification to Select for Low, Moderate, and High: PII must be processed only in accordance with established privacy requirements. Exceptions to processing rules must be reviewed at regular intervals and removed when no longer supported. Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 SC-8, TRANSMISSION CONFIDENTIALITY AND INTEGRITY"
    status: "candidate"
