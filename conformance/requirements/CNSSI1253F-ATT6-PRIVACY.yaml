  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0256"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 78, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Supports ability to"}
    kind: "modal"
    locator: "4.2.c"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Supports ability to associate an individual user with their activity in a system with PII and, in turn, hold them accountable for any unauthorized access, misuse, or abuse of PII. Accountability and traceability also support the FIPPs of purpose specification and use limitation by providing visibility into how a user actually processes PII, which can be confirmed against the users’ permissions."
    status: "candidate"
    work_item: "WI-74"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0257"
