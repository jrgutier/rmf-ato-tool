    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Justification to Select for Moderate and High: Session audit capabilities enhance the ability to conduct investigations into potential abuse or misuse of PII, PII incidents or breaches, or other inappropriate activities that may result in privacy harms. This capability is critical to higher privacy risk systems due to the increased chance of substantial harm to individuals. Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130 AU-14(3), Session Audit | Remote Viewing and Listening"
    status: "candidate"
