  - {"page": 28, "locator": "4.2", "reason": "no-marker", "text": "Detailed Overlays Control Specifications"}
  - {"page": 30, "locator": "4.2.j", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Automated mechanisms protect privacy by providing stronger assurance than manual approaches that access to the PII is appropriately managed. Temporary and emergency accounts may allow access to PII that differs from on-going access requirements. Automating the process of removing or disabling temporary and emergency accounts helps ensure that access controls return to normal within a reasonable and intended timeframe. Reference(s): 5 U.S.C. §552a(e)(10); FISA; EO 12333; OMB Circular A-130 AC-2(3), Account Management | Disable Accounts"}
  - {"page": 30, "locator": "4.2.j", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Automated mechanisms better protect privacy by providing stronger assurance than manual approaches that access to the PII is appropriately managed. Reference(s): 5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333; OMB Circular A-130 AC-2(5), Account Management | Inactivity Logout"}
  - {"page": 30, "locator": "4.2.j", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Protects privacy by ensuring access to the PII is appropriately managed. Reference(s): 5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333; OMB Circular A-130 AC-2(6), Account Management | Dynamic Privilege Management*"}
  - {"page": 31, "locator": "4.2.j", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Disabling accounts for high-risk individuals is a minimum requirement to be included in the organization’s rules of behavior as a consequence for abusing access privileges to access PII, including information protected under the Privacy Act of 1974."}
  - {"page": 32, "locator": "4.2.j", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333 AC-3, ACCESS ENFORCEMENT"}
  - {"page": 32, "locator": "4.2.j.(b)", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Overrides of Access Control Mechanisms create a situation where users are permitted access to systems during emergency situations who under normal circumstances would not have system access or privileges. This open access creates the potential for the individual to have access to PII. Auditing access control overrides provides a way of identifying and addressing privacy issues that may occur as a result of the override."}
  - {"page": 33, "locator": "4.2.j.(b)", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(9)-(10); NIST SP 800-122 AC-3(11), Access Enforcement | Restrict Access to Specific Information Types*"}
  - {"page": 33, "locator": "4.2.j.(b)", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Protects privacy by providing granular access to specific, limited information. Reference(s): 5 U.S.C. §552a(b) and (e)(9)-(10); NIST SP 800-162 AC-3(13), Access Enforcement | Attribute-Based Access Control*"}
  - {"page": 34, "locator": "4.2.j.(b)", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Security and privacy policy filtering technology, such as data loss prevention (DLP), can provide a form of continuous monitoring for compliance with privacy laws and regulations. Implementation of this control reduces the potential for unauthorized transfer of PII. Parameter Value:"}
  - {"page": 34, "locator": "4.2.j.(a)", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12; NIST SP 800-37 AC-4(15), Information Flow Enforcement | Detection of Unsanctioned Information*"}
  - {"page": 36, "locator": "4.2.j.(a)", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Limiting access and documenting the justification for this operational need provides an added layer of privacy protection by further reducing and clarifying the individuals who have access to the PII. By restricting access to specific commands, it limits inadvertent access to or disclosure of PII and protects the integrity of PII. Reference(s): 5 U.S.C. §552a(b); EO 14028 Sec 4(i); CNSSD No. 504 AC-6(5), Least Privilege | Privileged Accounts"}
  - {"page": 40, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); OMB M-17-12; NIST SP 800-46 AC-17(1), Remote Access | Monitoring and Control"}
  - {"page": 40, "locator": "4.2.a", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Encrypting remote sessions protects the confidentiality and integrity of PII. Reference(s): 5 U.S.C. §552a(e)(10); OMB M-17-12; NIST SP 800-46 AC-18(1), Wireless Access | Authentication and Encryption"}
  - {"page": 42, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); OMB M-17-12; OMB Circular A-130 AC-21, INFORMATION SHARING"}
  - {"page": 44, "locator": "4.2.a", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Practical exercises are a great way to gauge the organization’s understanding of PII and privacy requirements. Reference(s): 5 U.S.C. §552a(e)(9), (10); OMB Circular A-130 AT-2(2), Literacy Training and Awareness | Insider Threat"}
  - {"page": 44, "locator": "4.2.a", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Training the workforce, including through practical exercises, to recognize attempts at social engineering and social mining helps to protect the organization’s data, including PII. Providing examples of actual instances of social engineering and social mining are especially effective training materials. Reference(s): 5 U.S.C. §552a(e)(9), (10); OMB Circular A-130 AT-2(4), Literacy Training and Awareness | Suspicious Communications and Anomalous System Behavior"}
  - {"page": 45, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12 AU-3(1), Content of Audit Records | Additional Audit Information"}
  - {"page": 46, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Adequate storage capacity for audit logs reduces the likelihood of the logs exceeding available storage space and potentially losing log information or reducing auditing capability. Audit information could be necessary, for example, to identify whether PII was misused or abused, to enforce criminal or civil penalties under the Privacy Act, to meet reporting requirements for potential PII incidents and breaches, etc. Providing adequate storage capacity allows for preserving complete audit information for these purposes. Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12 AU-4(1), Audit Log Storage Capacity | Transfer to Alternate Storage"}
  - {"page": 46, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: An alternate storage location for audit logs reduces the likelihood of the logs being lost due to lack of storage capacity. It also ensures that a compromise of the system does not also result in a compromise of its audit logs, which would impact the ability to conduct PII incident response activities or investigations. Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12 AU-5, RESPONSE TO AUDIT LOGGING PROCESS FAILURES"}
  - {"page": 47, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12 AU-6(3), Audit Record Review, Analysis, and Reporting | Correlate Audit Record Repositories"}
  - {"page": 47, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: On-demand, accurate, and customizable audit report generation that does not alter potential forensic evidence is necessary to support privacy incident or breach reporting requirements and after-the-fact investigations within required timelines. Reference(s): 5 U.S.C. §552a(g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12 AU-7(1), Audit Record Reduction and Report Generation | Automatic Processing"}
  - {"page": 47, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for Moderate and High: The ability to analyze audit records quickly and easily facilitates timely identification and reporting of potential privacy incidents or breaches and allows for quicker identification and enactment of countermeasures to mitigate potential privacy harms. Reference(s): 5 U.S.C. §552a(g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12 AU-9, PROTECTION OF AUDIT INFORMATION – Included in the Privacy Control Baseline"}
  - {"page": 47, "locator": "4.2", "reason": "no-marker", "text": "AU-9(3), Protection of Audit Information | Cryptographic Protection"}
  - {"page": 48, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(1); OMB Circular A-130; OMB M-07-16 AU-9(6), Protection of Audit Information | Read-Only Access*"}
  - {"page": 48, "locator": "4.2", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Read only access protects the integrity of audit logs by minimizing the ability of individuals to inhibit audit activities or modify audit records. Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 AU-10, NON-REPUDIATION – Included in the Privacy Control Baseline AU-10(1), Non-Repudiation | Association of Identities*"}
  - {"page": 48, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); OMB Circular A-130 AU-11, AUDIT RECORD RETENTION – Included in the Privacy Control Baseline AU-11(1), Audit Record Retention | Long-Term Retrieval Capability"}
  - {"page": 50, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(5), (e)(10) CA-3(6), Information Exchange | Transfer Authorizations"}
  - {"page": 50, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Ensures that the information is shared only with those authorized to receive it."}
  - {"page": 50, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333 CA-3(7), Information Exchange | Transitive Information Exchanges*"}
  - {"page": 50, "locator": "4.2", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Reduces unintended access, which may be necessary for some high-risk systems."}
  - {"page": 50, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333 CA-5, PLAN OF ACTION AND MILESTONES – Included in the Privacy Control Baseline CA-6, SECURITY AUTHORIZATION – Included in the Privacy Control Baseline CA-7, CONTINUOUS MONITORING – Included in the Privacy Control Baseline"}
  - {"page": 50, "locator": "4.2", "reason": "no-marker", "text": "CA-7(4), Continuous Monitoring | Risk Monitoring – Included in the Privacy Control Baseline CA-8, PENETRATION TESTING"}
  - {"page": 51, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(10); OMB Circular A-130 CA-9, INTERNAL SYSTEM CONNECTIONS"}
  - {"page": 51, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Baseline configurations of systems reflect the current enterprise architecture and enable the identification of configuration changes that might impact privacy risks."}
