  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0047"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 12, "anchor": "Question 1: Does the system process any PII other than, or in"}
    kind: "modal"
    locator: "3.3"
    context: "Assumptions"
    statement: "Question 1: Does the system process any PII other than, or in addition to, audit logs or account management records? Section 3.1provides an explanation of the definition of PII and examples. No: If the system does not process PII that is distinct from audit logs or account management records, then proceed to Question 2. The Low, Moderate, and High Privacy Overlays are not required. Question 2 will help you determine whether the ACCT Overlay is required. Yes: If the system does process PII other than, or in addition to, audit logs or account management records, next determine the privacy risk level of the PII using the privacy risk factors in the Appendix. The type and level of privacy risk related to the PII in NSS depends on various factors. The Appendix describes the privacy risk factors to consider when selecting the applicable control set – Low, Moderate, or High – and provides examples and instructions for applying the privacy risk factors."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0048"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 12, "anchor": "Question 2: Does the system process audit logs or account management records"}
    kind: "modal"
    locator: "3.3"
    context: "Assumptions"
    statement: "Question 2: Does the system process audit logs or account management records that capture users’ access, activities, or processing of data in the system? No: If the system does not process audit logs20 or account management records, then the ACCT Overlay is not required, and the analysis is finished. The controls in the Privacy Control Baseline are sufficient. Yes: If the system does process audit logs or account management records, the Accountability (ACCT) control set is required to protect this PII."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0049"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 12, "anchor": "The Privacy Overlays correlate to Categorize and Select in the RMF. Previously,"}
    kind: "should"
    locator: "4.2"
    context: "Privacy Overlays Relationship to Categorize and Select in the Risk"
    statement: "The Privacy Overlays correlate to Categorize and Select in the RMF. Previously, system owners would select the PCIL for the PII in the system, and then consider the PCIL when determining the impact value for the system’s security objectives. Conducting the privacy risk analysis using this document results in a privacy risk level of low, moderate, or high for the system and replaces the PCIL. Organizations should use this privacy risk level result in place of the PCIL.21 Figure 1 illustrates the relationship between the Privacy Overlays and the RMF in greater detail."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0050"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 12, "anchor": "If a system has logs of any type that include PII, then"}
    kind: "modal"
    locator: "4.2"
    context: "Privacy Overlays Relationship to Categorize and Select in the Risk"
    statement: "If a system has logs of any type that include PII, then the ACCT Overlay is required. If a system owner believes that the system does not have any logs that include PII, then the system owner must consult with the SAOP, or designee, to confirm that the logs do not have any PII and do not require a Privacy Overlay."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0051"
