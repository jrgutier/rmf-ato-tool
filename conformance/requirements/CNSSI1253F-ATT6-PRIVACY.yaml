    statement: "Justification to Select for ACCT, Low, Moderate, and High: Organizations’ handling of PII should be commensurate with the expectations of the users whose PII is in the system. This implements the FIPPs of minimization, quality and integrity, and purpose specification and use limitation. Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 SA-8(33), Security and Privacy Engineering Principles | Minimization – Included in the Privacy Control Baseline SA-9, EXTERNAL INFORMATION SYSTEM SERVICES – Included in the Privacy Control Baseline SA-9(1), External System Services | Risk Assessments and Organizational Approvals"
    status: "candidate"
