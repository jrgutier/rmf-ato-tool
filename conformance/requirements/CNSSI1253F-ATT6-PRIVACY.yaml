    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Users should only have access to the PII necessary to accomplish the legitimate purpose for why it was collected. This protects the PII by implementing the FIPP of purpose specification and use limitation. Reference(s): 5 U.S.C. §552a(e)(10); EO 14208, NSM-8; OMB Circular A-130 SA-8(15), Security and Privacy Engineering Principles | Predicate Permission*"
    status: "candidate"
    work_item: "WI-74"
