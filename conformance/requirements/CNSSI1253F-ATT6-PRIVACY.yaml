    statement: "Justification to Recommend for Privacy Enhancing: Processing domains can support privacy risk management by providing a location that uses more restrictive privacy controls beyond those that may be required for other processing environments. This can help organizations meet their objectives while more efficiently using their resources (e.g., controls may be less expensive to employ in a smaller, restricted domain than across the entire network). Reference(s): 5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12 AC-4(8), Information Flow Enforcement | Security and Privacy Policy Filters*"
    status: "partial"
