  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0042"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 10, "anchor": "The Privacy Overlays provide four baseline-independent control sets (Accountability, Low, Moderate, and"}
    kind: "modal"
    locator: "3.2"
    context: "Privacy Overlays Controls"
    statement: "The Privacy Overlays provide four baseline-independent control sets (Accountability, Low, Moderate, and High) and a selection of individual optional controls (Privacy Enhancing) to enable system owners to manage systems with varying levels of privacy risk, and support compliance with federal privacy requirements.13 A privacy risk analysis must be completed for all information systems that process PII to identify the applicable control set.14 The Privacy Overlays incorporate an adapted version of the FIPS 199 impact values as adopted by CNSSI No. 1253 to address NSS that process PII at a Low, Moderate, and High privacy risk level. The Privacy Overlays also include an Accountability PII control set to address systems that, whether or not they intentionally process PII, have access or use controls on the system that identify individual users for accountability purposes (e.g., audit logs, user accesses for a particular data set). Each control set layers additional protections required for the next higher risk level from Accountability to High (e.g., the Low control set layers on controls on top of the Accountability control set). Finally, the Privacy Overlays include a column with a Privacy Enhancing indicator denoting optional controls that the organization may tailor in individually to address system-specific privacy risks (e.g., controls related to de-identification can further enhance the privacy risk posture of systems). In the event that a control is required by both the security control baseline and the Privacy Overlays, the control may be implemented in a manner that addresses both security and privacy interests rather than requiring multiple iterations of the same control. Table 1 provides a description of each Privacy Overlays control set. Section 4.1 provides the approach for selecting the appropriate Privacy Overlays controls set."
    status: "partial"
    reason: "C-2 step 6 records in ART-CAT `## Overlays` each Appendix factor with its level, any added factor, the weighting, the overall privacy risk level and the SAOP's approval; the section is prose no rule reads."
    evidence: [{"kind": "prose", "target": "playbooks/C/C-2.md", "asserts": "C-2 records the privacy risk analysis that selects the Privacy Overlay control set", "claim": "presence"}]
    work_item: "WI-144"
