  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0118"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 33, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: The Individual Participation"}
    kind: "modal"
    locator: "4.2.j.(b)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: The Individual Participation Fair Information Practice Principle (FIPP) requires organizations to provide mechanisms for individuals to gain access to their PII when appropriate. The Privacy Act of 1974, as amended, requires organizations to provide mechanisms for individuals to gain access to their PII when that PII meets the definition of a “record.” Some systems may be exempted from this requirement when statutory requirements are met. Access is also an important aspect of supporting correction of PII and redress against alleged violations and misuse of their PII. Guidance: Provide for public access to records, including PII not included in a Privacy Act System of Records, where required or appropriate. While the language of this control is specific to the Privacy Act's requirements for access, FIPPs encourage organizations to use available authorities to provide access when the Privacy Act does not apply. For example, some organizations use the Freedom of Information Act as another tool to provide access to PII for an affected individual. Also select for Privacy Act System of Records that do not have exemptions. Reference(s): 5 U.S.C. §552a(c)(3), (c)(4), (d), and (h); FISA; EO 12333; OMB Circular A-130 AC-4, INFORMATION FLOW ENFORCEMENT"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0119"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 33, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: The information flow"}
    kind: "indicative"
    locator: "4.2.j.(b)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: The information flow enforcement controls provide a technical means of implementing disclosure requirements by minimizing information shared between networks, devices, and individuals within systems and between interconnected systems. This control can also limit information transfers between organizations based on data structures and content. Reference(s): 5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12 AC-4(1), Information Flow Enforcement | Object Security and Privacy Attributes*"
    status: "candidate"
    work_item: "WI-58"
