  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0121"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 34, "anchor": "Justification to Recommend for Privacy Enhancing: Processing domains can support privacy risk"}
