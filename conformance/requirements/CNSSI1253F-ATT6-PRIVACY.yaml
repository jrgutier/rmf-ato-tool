  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0269"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 82, "anchor": "Justification to Select for Low, Moderate, and High: Boundary Protection is critical"}
    kind: "modal"
    locator: "4.2.b"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for Low, Moderate, and High: Boundary Protection is critical to the protection of PII in transit. Implementation of this control requires monitoring both at controlled interfaces and at the secure boundary, a boundary that may include and exceed the established authorization boundary. Implementation of this control may also include managed interfaces such as gateways, routers, firewalls, guards, etc. implemented within a security architecture. Requiring this control for all PII overlays ensures the protection of the most sensitive PII. Reference(s): EO 14208, NSM-8; OMB Circular A-130 SC-7(8), Boundary Protection | Route Traffic to Authenticated Proxy Servers"
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0270"
