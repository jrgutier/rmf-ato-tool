    statement: "Justification to Select for Moderate and High: PII must be protected from both intentional and unintentional exfiltration. This control requires the secure implementation of boundary protection(s). Secure solutions such as guards allow for both protection and monitoring of data traversing the system boundary. Reference(s): NSM-8; OMB Circular A-130 SC-7(24), Boundary Protection | Personally Identifiable Information"
    status: "candidate"
    work_item: "WI-75"
