    work_item: "WI-58"
    ruling_sought: [{"sentence": "Justification to Recommend for Privacy Enhancing: To provide the ability for an organization to monitor and prevent transfer of PII across different security domains, a system needs to have mechanisms to automatically detect, and where appropriate, prohibit the unauthorized transfer of PII across different security domains.", "reason": "A Privacy Enhancing control is optional: the organization may tailor it in to address system-specific privacy risk (Section 3.2), so a recommendation to select it can never fail"}]
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0124"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 35, "anchor": "Justification to Recommend for Privacy Enhancing: The ability to identify source and"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Recommend for Privacy Enhancing: The ability to identify source and destination points for PII flow within systems is necessary for attribution and compliance with need to know requirements. Guidance: Implement a higher level of granularity for identification and authentication based on sensitivity of the PII. This is not to determine permissibility of the transfer but to enable an audit capability. Parameter Value: Uniquely identify and authenticate source and destination points by the applicable organization, system, application, or individual for information transfer. Reference(s): 5 U.S.C. §552a(c) and (e)(10); FISA, 12333; NIST SP 800-46 AC-5, SEPARATION OF DUTIES"
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: an SSP statement of AC-4.17 recording no value for ac-04.17_odp fails (OVS-003). Unheld: whether the recorded value is the overlay's or stricter is not compared."
    evidence: [{"kind": "rule", "target": "OVS-003", "fixture": "tests/fixtures/negative/OVS-003.yaml", "expect": "assigns a parameter value for it", "claim": "constraint", "asserts": "A value is recorded for each ODP the overlay assigns a parameter value for in AC-4.17 (The ability to identify source and destination points for PII flow within): ac-04.17_odp"}]
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0125"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 35, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Separation of duties"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Separation of duties aligns privileges with appropriate roles with the idea that duties are split between roles in such a way as to reduce the risk of malevolent or inappropriate behaviors based on access. Implementing this control helps reduce the risk of inappropriate access to PII (e.g., separating employees that perform security investigations from mission and business functions). Guidance: Separation of duties is implemented by designating a selected set of administrators the capability to set user permissions to PII information, while those administrators do not themselves have access to the PII. The principle of separation of duties is significant for developers as well as for operational system administrators. Reference(s): 5 U.S.C. §552a(e)(9)-(e)(10) AC-6, LEAST PRIVILEGE Justification to Select for ACCT, Low, Moderate, and High: Limit access to PII to designated individuals with a need-to-know in performance of their job duties. Guidance: Enforce the most restrictive set of rights/privileges or access needed by users (or processes acting on behalf of users) for the performance of specified tasks — increasing the level of restriction as privacy risk level rises. The organization ensures that users who must access records containing PII only have access to the minimum amount of PII, along with only those privileges (e.g., read, write, execute) necessary to perform their assigned tasks. Reference(s): 5 U.S.C. §552a(b); NIST SP 800-122; CNSSD No. 504 AC-6(1), Least Privilege | Authorize Access to Security Functions"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0126"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 36, "anchor": "Justification to Select for Moderate and High: Limit access to security functions"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for Moderate and High: Limit access to security functions to authorized personnel to reduce the number of users able to perform certain security functions, such as configuring access permissions, setting audit logs, performing system management functions. Examples of authorized personnel include security administrators, system and network administrators, system security officers, system maintenance personnel, system programmers, and other privileged users. These types of security functions can provide a level of access to PII, and capabilities to manipulate it, in ways that other user roles typically could not. Guidance: Identify the security relevant functions that require authorized access for all systems that contain Moderate or High PII. Reference(s): 5 U.S.C. §552a(b)(1); NIST SP 800-205; CNSSD No. 504 AC-6(2), Least Privilege | Non-Privileged Access for Non-Security Functions"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0127"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 36, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: System users with"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: System users with elevated privileges use non-privileged accounts when performing non-security functions. Requiring system users to use their non-privileged accounts when working with PII for purposes other than security functions limits inadvertent access to or disclosure of PII and protects the integrity of PII. Guidance: Any access involving PII that is non-administrative in nature should require the user to use their non-privileged accounts to perform that function. Reference(s): 5 U.S.C. §552a(b); EO 14028 Sec 4(i); CNSSD No. 504 AC-6(3), Least Privilege | Network Access to Privileged Commands*"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0128"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 37, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: This control limits"}
    kind: "indicative"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: This control limits who is authorized to have administrative accounts, such as those who can perform security functions to include configuring access permissions, setting audit log collection events and performing system management functions. These types of system and network management personnel typically have a level of access that is capable of circumventing other access controls. Limiting access to these accounts further protects PII by limiting the number of individuals that have the “keys to the kingdom” on a network or system. Reference(s): 5 U.S.C. §552a(b)(1); FISA; EO 12333; EO 14028 Sec 4(i)(k); CNSSD No. 504 AC-6(7), Least Privilege | Review of User Privileges"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0129"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 37, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Review of user"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Review of user privileges is necessary in order to ensure privileges are revoked for those who no longer require access to PII. Implementation of this control reduces the risk of unauthorized access to PII by users who no longer need access to perform their job functions. ACCT, Low, and Moderate Parameter Value:"
    status: "candidate"
    work_item: "WI-58"
