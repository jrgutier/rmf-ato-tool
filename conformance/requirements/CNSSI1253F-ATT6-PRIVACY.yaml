    locator: "4.2.c"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Contracts for systems, components, or services that may include systems of records must incorporate requirements of the Privacy Act. It is much easier, cheaper, and more effective to build privacy protections into a system during the acquisition or development phase of the life cycle than it is to retrofit it afterwards. Reference(s): 5 U.S.C. §552a (e)(10), (m); FAR Part 24 and 39.105 SA-4(12), Acquisition Process | Data Ownership"
    status: "candidate"
    work_item: "WI-74"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0251"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 77, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: An organization’s PII"}
    kind: "modal"
    locator: "4.2.c"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: An organization’s PII that is stored, operated, or maintained on contractors’ systems has an increased privacy risk while it is out of the direct control of the organization. One way to mitigate this risk is to incorporate privacy protections into the contract to protect the PII and to require the complete removal and return of the PII to the organization at the end of the contract."
    status: "candidate"
    work_item: "WI-74"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0252"
