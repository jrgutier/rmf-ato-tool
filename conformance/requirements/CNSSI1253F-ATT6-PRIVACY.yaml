    context: ""
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Sanitize equipment of any PII to ensure the information is not inadvertently put at risk. Parameter Values: Sanitize equipment to remove the following information from associated media prior to removal from organizational facilities for off-site maintenance, repair, or replacement: PII;"
