    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "b. Next, consider the risk levels of the factors collectively and determine the overall privacy risk level of the PII, and by extension of the system. The Privacy Overlays do not follow a high watermark approach for evaluating privacy risk factors. Agencies may weight factors equally or weight them corresponding to the specific circumstances or context of the PII or system. Additionally, if a factor is a higher risk level than all other factors for the system, the agency could select the lower risk level and tailor in supplemental controls that specifically address the risk of the outlying factor. Appendix D provides system risk analysis use cases. The SAOP, or designee, must approve the Privacy Overlays selected for the system."
