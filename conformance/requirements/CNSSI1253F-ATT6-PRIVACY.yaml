    work_item: "WI-59"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0150"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 44, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Training the workforce to recognize suspicious communications"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Training the workforce to recognize suspicious communications and anomalous behavior in organizational systems reduces the likelihood of loss of data, including PII. Insider threat programs often are implemented at the organizational level for all systems processing PII. Insider threat programs can be implemented as system-specific if the system processes highly sensitive PII. Reference(s): 5 U.S.C. §552a(e)(9), (10); OMB Circular A-130 AT-2(5), Literacy Training and Awareness | Advanced Persistent Threat Justification to Select for ACCT, Low, Moderate, and High: Training the workforce to recognize advanced persistent threats reduces the likelihood of loss of data, including PII. Insider threat programs often are implemented at the organizational level for all systems processing PII. Insider threat programs can be implemented as system-specific if the system processes highly sensitive PII. Reference(s): 5 U.S.C. §552a(e)(9), (10); OMB Circular A-130 AT-3, ROLE-BASED SECURITY TRAINING – Included in the Privacy Control Baseline AT-3(5), Role-Based Training | Processing Personally Identifiable Information – Included in the Privacy Control Baseline AT-4, Training Records – Included in the Privacy Control Baseline AT-6, Training Feedback – Included in the Privacy Control Baseline AU-1, AUDIT AND ACCOUNTABILITY | POLICY AND PROCEDURES – Included in the Privacy Control Baseline AU-2, AUDIT LOGGING – Included in the Privacy Control Baseline"
