    locator: "4.2.g.(f)"
    context: "CA-3, INFORMATION EXCHANGE Parameter Value:"
    statement: "Justification to Select for Moderate and High: If a system change is made, verification of Privacy Overlays security control functions is required to ensure continued compliance with privacy-related statutes and regulations. Reference(s): 5 U.S.C. §552a(e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130; OMB M-03-22 CM-13, DATA ACTION MAPPING*"
