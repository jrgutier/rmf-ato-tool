  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0021"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 7, "anchor": "To protect PII within NSS, system owners must be able to identify"}
    kind: "modal"
    locator: "3"
    context: ""
    statement: "To protect PII within NSS, system owners must be able to identify PII and should recognize that inclusion of PII in a system may not be immediately apparent. PII is defined in CNSSI No. 4009, Glossary, and OMB Circular A-130 as, “information that can be used to distinguish or trace an individual’s identity, either alone or when combined with other information that is linked or linkable to a specific individual”. The definition of PII is not based on the location or nationality of the individual. The definition of PII also is not limited to any single type of information or technology. Rather, determining PII requires a case-by-case assessment of the specific likelihood that an individual can be identified. PII may appear in various forms and contexts in NSS. Practitioners must understand the data that is processed by their system or tool, including whether PII will or may be processed, or if data may become PII after processing. Resources that may help practitioners determine the PII their system processes or may process include the system description, data dictionaries, data stores, architecture for the data store(s), and data flow diagrams. The instances in Sections 3.1.1 - 3.1.3 provide representative examples of data that are PII. These examples are not exhaustive lists of the data elements that are PII, but rather show some of the myriad ways data elements may be PII independently or can become PII in combination. 3.1.1 Data Elements that Alone Identify an Individual Data elements that alone can distinguish or trace an individual’s identity are also referred to as direct identifiers. Direct identifiers are specific characteristics of an individual, such as biometrics, or an identifier assigned to an individual, such as a name or employee identification number."
    status: "partial"
    reason: "How PII was identified is required text for a type holding PII; whether all PII was found is not testable."
    evidence: [{"kind": "rule", "target": "CATG-003", "fixture": "tests/fixtures/negative/CATG-003.pii.yaml", "expect": "and does not say how the PII was identified", "asserts": "System owners identify PII in the system and record how it was identified", "claim": "presence", "holds_when": "ART-INFOTYPES is in play once P-12 is active or it is seeded"}]
