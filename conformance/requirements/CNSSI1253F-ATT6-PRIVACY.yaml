    locator: "4.2"
    context: "CA-3, INFORMATION EXCHANGE"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Privacy requirements such as sharing and disclosure apply to internal systems and their connections as well as to external connections. Guidance: Include privacy requirements in the Information Connection Document (or equivalent such as an Interconnection Security Agreement or an Authority to Connect package), specifically addressing the collection authority, compatibility of purpose for use, and need for recipient of information to achieve specific business purpose. Documentation must also address responsibilities of the receiving system for protecting PII. Parameter Value:"
    status: "candidate"
