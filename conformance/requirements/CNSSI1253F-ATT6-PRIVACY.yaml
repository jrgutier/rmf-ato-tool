  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0230"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 72, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Privacy Act systems of record must be"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Privacy Act systems of record must be covered by a SORN which provides notice to the public about the existence and character of records that federal agencies maintain about individuals protected by the Act. Once a SORN is published in the Federal Register, Federal agencies must operate within the scope of the SORN. Federal agencies must publish an update before collecting, processing, or disseminating PII in any way that is not addressed within the SORN. Guidance: Ensure the Privacy Act system of records is covered by an appropriate SORN. The SAOP, or designee, can assist in writing and publishing the SORN and any required exemptions. Reference(s): 5 U.S.C. §552a(e)(4) PT-6(1), System of Records Notice | Routine Uses"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0231"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 72, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Statutory requirements prohibit"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Statutory requirements prohibit disclosing records protected by the Privacy Act without written consent from the individual unless the disclosure is permitted by a published statutory exception, including the “routine use” disclosure exception. Privacy Act records cannot be disclosed until and unless a SORN containing the routine use(s) has been published in the Federal Register. A revised SORN containing any new or revised routine uses must be published first before disclosing the records to different recipients or for a different purpose. Guidance: Records protected by the Privacy Act may be disclosed pursuant to the routine use disclosure exception only if the applicable SORN includes an appropriate routine use. That is, with respect to the disclosure of a record, “the use of [a] [personally identifiable] record for a purpose which is compatible with the purpose for which it was collected.” Consult the SAOP, or designee, before disclosing or sharing records protected by the Privacy Act. Reference(s): 5 U.S.C. §552a(a)(7), (b)(3) PT-6(2), System of Records Notice | Exemption Rules"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0232"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 73, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Privacy Act systems of records may be"}
    kind: "indicative"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Privacy Act systems of records may be exempted from select statutory requirements when an exemption is applicable to the system and the exemption has been published in the Federal Register in the system’s SORN."
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0233"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 73, "anchor": "Guidance: Records protected by the Privacy Act must have a published exemption"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Guidance: Records protected by the Privacy Act must have a published exemption rule to notify the public about which statutory provisions do not apply to that particular system of records. Consult the SAOP, or designee, to ensure the system of records is covered by an appropriate exemption rule. Reference(s): 5 U.S.C. §552a(j), (k) PT-7, SPECIFIC CATEGORIES OF PERSONALLY IDENTIFIABLE INFORMATION"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0234"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 73, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Systems processing PII"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Systems processing PII that are a Privacy Act system of records have a variety of potentially applicable statutory requirements, such as a SORN or Privacy Act Statement. The system must be evaluated to determine whether it falls under the statute."
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0235"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 73, "anchor": "Guidance: Apply the statutory requirements of the Privacy Act to systems containing"}
    kind: "imperative"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Guidance: Apply the statutory requirements of the Privacy Act to systems containing PII retrieved by the name of the individual or by some identifying number, symbol, or other identifying particular assigned to the individual. Consult the SAOP, or designee, to ensure the system has met the applicable requirements. Parameter Value: Apply the statutory requirements of the Privacy Act for specific categories of personally identifiable information."
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0236"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 73, "anchor": "Reference(s): 5 U.S.C. §552a PT-7(1), Specific Categories of Personally Identifiable Information |"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Reference(s): 5 U.S.C. §552a PT-7(1), Specific Categories of Personally Identifiable Information | Social Security Numbers Justification to Select for ACCT, Low, Moderate, and High: SSNs may not be used as identifier unless specifically approved by the SAOP, or designee."
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0237"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 74, "anchor": "Guidance: SSNs present increased risk to individuals and organizations if they are"}
    kind: "imperative"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Guidance: SSNs present increased risk to individuals and organizations if they are misused, abused, or lost. Refrain from using SSN as an identifier in any form, including, but not limited to masked, partially masked, truncated, encrypted, and or disguised as SSNs unless specifically approved by the SAOP, or designee. Consult the SAOP, or designee, for approval when applicable. Reference(s): 5 U.S.C. §552a(e)(9)-(10); 32 CFR Part 157; OMB M-17-12 PT-7(2), Specific Categories of Personally Identifiable Information | First Amendment Information"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0238"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 74, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Processing PII about"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Processing PII about how an individual exercises rights guaranteed by the First Amendment presents privacy and civil liberties concerns and is generally prohibited by the Privacy Act."
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0239"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 74, "anchor": "Guidance: PII describing how an individual exercises rights guaranteed by the First"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Guidance: PII describing how an individual exercises rights guaranteed by the First Amendment may not be processed unless it meets statutory requirements and is addressed in a way that minimally impacts civil liberties. Consult the SAOP, or designee, before processing this PII. Reference(s): 5 U.S.C. §552a(e)(7) PT-8, COMPUTER MATCHING REQUIREMENT"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0240"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 74, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: PII maintained in"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: PII maintained in a system of records may not be disclosed to a recipient agency or non-Federal agency for use in a computer matching program without a written agreement that meets statutory requirements. Guidance: Any personally identifiable records contained in a system of records may only be disclosed to a recipient agency or non-federal agency for use in a computer matching program pursuant to a Computer Matching Agreement (CMA) between the source agency and the recipient agency or non-federal agency. For many mission related national security systems, the CMA is not applicable. The SAOP, or designee, can provide information on what is required for a particular system. Consult the SAOP, or designee, before disclosing and or sharing this PII with another entity. Reference(s): 5 U.S.C. §552a(o) RA-1, RISK ASSESSMENT POLICY AND PROCEDURES – Included in the Privacy Control Baseline RA-2, SECURITY CATEGORIZATION – Included in the Privacy Control Baseline RA-3, RISK ASSESSMENT – Included in the Privacy Control Baseline RA-7, RISK RESPONSE – Included in the Privacy Control Baseline RA-8, PRIVACY IMPACT ASSESSMENTS"
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0241"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 75, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: E-Government Act does"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: E-Government Act does not require – nor does it prohibit – conducting a PIA for NSS. Privacy Impact Assessments are structured qualitative and quantitative reviews of how information is processed by the system and potential impacts to individuals and organizations for the output of systems that process PII, including potential harms from expected outcomes as well as loss of control or mishandling of the PII. The PIA process benefits the organization and individuals whose PII is in the system by facilitating the identification, evaluation, and management of privacy risks and potential problematic data actions for the PII in that system. A PIA is not a time-restricted activity limited to a particular milestone but a living document that must be updated whenever changes to the information technology, changes to the agency’s practices, or other factors alter the privacy risks associated with the use of such information technology."
    status: "candidate"
    work_item: "WI-72"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0242"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 75, "anchor": "Guidance: Conduct PIAs or comparable privacy risk assessment commensurate with the privacy"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Guidance: Conduct PIAs or comparable privacy risk assessment commensurate with the privacy risk of the PII in the system. Review and update the PIA as necessary when making system changes that impact the PII. Limit access to PIAs for NSS to appropriately cleared individuals with a need to know the information. Reference(s): E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB M-03-22; OMB Circular A-130 SA-1, (SYSTEM AND SERVICES ACQUISITION) POLICY AND PROCEDURES – Included in the Privacy Control Baseline SA-2, ALLOCATION OF RESOURCES"
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: removing RA-8 without naming E-Government Act of 2002, Pub. L. 107-347, OMB M-03-22, OMB Circular A-130 fails (OVS-001). Unheld: the overlay does not say whether each authority cited for RA-8 requires its selection or the control only helps to meet it, so a removal is held to all of them alike; the guidance for RA-8 is prose the SSP author reads through rmf catalog show --fields overlay; no rule judges it."
    evidence: [{"kind": "rule", "target": "OVS-001", "fixture": "tests/fixtures/negative/OVS-001.yaml", "expect": "references cite for it", "claim": "constraint", "asserts": "RA-8 is selected because E-Government Act does not require – nor does it prohibit – conducting a PIA (Conduct PIAs or comparable privacy risk assessment commensurate with the); removing it names each law, regulation or policy the overlay references cite for it (E-Government Act of 2002; Pub. L. 107-347; OMB M-03-22; OMB Circular A-130)"}]
    work_item: "WI-73"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0243"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 75, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Resources must be"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Resources must be considered for the protection of privacy and confidentiality when budgeting for an information system. As part of the capital planning and investment control process, the organization must determine, document, and allocate resources required to protect the privacy and confidentiality of PII in the information system. Reference(s): E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130 SA-3, SYSTEM DEVELOPMENT LIFECYCLE Justification to Select for ACCT, Low, Moderate, and High: Managing a system through a defined lifecycle process helps to ensure that privacy controls are appropriately considered from initial system conception and requirements development, to verification of implemented requirements, and through decommissioning. Guidance: To ensure that privacy and security controls are appropriately considered during each phase of the system development life cycle, the SAOP, or designee, should clearly understand and participate in the requirements to protect PII in the system. Reference(s): OMB Circular A-130 SA-3(2), System Development Life Cycle | Use of Live or Operational Data"
    status: "candidate"
    work_item: "WI-74"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0244"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 76, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Operational data may"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Operational data may only be used in Privacy Act systems after the SORN has been published. If the system is not designed to process PII, but includes ACCT PII, there must be a published SORN that covers the ACCT PII. Document that the required SORN has been completed. Reference(s): 5 U.S.C. §552a(e)(11) SA-4, ACQUISITION PROCESS"
    status: "candidate"
    work_item: "WI-74"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0245"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 76, "anchor": "Justification to Select for Low, Moderate, and High: Contracts for systems, components,"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for Low, Moderate, and High: Contracts for systems, components, or services must meet the privacy requirements of the Federal government. It is much easier, cheaper, and more effective to build privacy into a system during the acquisition phase of the life cycle than it is to bolt it on after the system has already been acquired."
    status: "candidate"
    work_item: "WI-74"
