  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0109"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 29, "anchor": "Justification to Select for Moderate and High: Automated mechanisms provide stronger assurance"}
    kind: "modal"
    locator: "4.2.j"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for Moderate and High: Automated mechanisms provide stronger assurance than manual approaches to protecting PII, ensuring access to PII is limited to individuals who are permitted access and have a need to know the information. Reference(s): 5 U.S.C. §552a(e)(10); FISA; EO 12333; OMB Circular A-130 AC-2(2), Account Management | Automated Temporary and Emergency Account Management"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0110"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 30, "anchor": "Justification to Select for Moderate and High: Protects privacy and implements the"}
    kind: "modal"
    locator: "4.2.j"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for Moderate and High: Protects privacy and implements the FIPPs of minimization and security, and supports Purpose Specification and Use Limitation, by ensuring access to the PII is limited to those individuals who are permitted and have a need to know the information. Reference(s): 5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333; OMB Circular A-130 AC-2(4), Account Management | Automated Audit Actions"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0111"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 30, "anchor": "Justification to Recommend for Privacy Enhancing: Protects privacy by integrating granular access"}
    kind: "modal"
    locator: "4.2.j"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Recommend for Privacy Enhancing: Protects privacy by integrating granular access criteria for PII (e.g., confirming training or mission requirements are met) in real-time as the system runs. Reference(s): FISA; EO 12333 AC-2(7), Account Management | Privileged User Accounts Justification to Select for Low, Moderate, and High: Protects privacy by ensuring access to the PII is limited to those individuals who are permitted and have a need to know the information. Privileged users play a critical role in implementing access controls that protect PII. They also support program and system owners with understanding the access control options that are available in their environment. Reference(s): 5 U.S.C. §552a (e)(9)-(10); FISA; EO 12333 AC-2(8), Account Management | Dynamic Account Management"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0112"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 31, "anchor": "Justification to Not Select for ACCT, Low, Moderate, or High: Systems that"}
    kind: "modal"
    locator: "4.2.j"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Not Select for ACCT, Low, Moderate, or High: Systems that process PII must not select this control without first coordinating with the SAOP or designee. Access to PII may not be granted to entities who are previously unknown, but rather only to officers and employees who have a need for the information in performance of their duties. Dynamic account creation is an automated process that may not support independent verification of a need for access to PII. Reference(s): 5 U.S.C. §552a(b)(1); FISA; EO 12333; OMB Circular A-130 AC-2(9), Account Management | Restrictions on Use of Shared and Group Accounts"
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: selecting AC-2.8 without the SAOP's coordination fails (OVS-002). Unheld: the wording beyond the cited authorities."
    evidence: [{"kind": "rule", "target": "OVS-002", "fixture": "tests/fixtures/negative/OVS-002.yaml", "expect": "the coordination with the SAOP or designee", "claim": "constraint", "asserts": "AC-2.8 Dynamic Account Management is selected for a system that processes PII only after the coordination with the SAOP or designee is recorded"}]
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0113"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 31, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Atypical use of"}
    kind: "should"
    locator: "4.2.j"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Atypical use of systems with PII may be an indicator of a privacy incident or breach. Guidance: Atypical use that involves PII should be reported to the SAOP, or designee, for further evaluation. Reference(s): 5 USC 552a(e)(10), OMB M-17-12, OMB Circular A-130 AC-2(13), Account Management | Disable Accounts for High-Risk Individuals"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0114"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 32, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Organizations shall control"}
    kind: "modal"
    locator: "4.2.j"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Organizations shall control access to PII through access enforcement mechanisms. Well-designed, automated access controls (e.g., mandatory access control (MAC), discretionary access control (DAC), role-based access control (RBAC), or attribute-based access control (ABAC)) limit user access to information according to defined access policies, which helps ensure the security and confidentiality of the PII processed by the system. Guidance: For example, implement role-based access controls and configure access controls so that each user can access only the pieces of information necessary for the user’s role or only permit users to access PII through an application that restricts their access to the PII the users require, instead of allowing users direct access to a database or files containing PII. Reference(s): 5 U.S.C. §552a(b), (e)(9)-(10); EO 14028 Sec 3(a), Sec 4(a-b), e(i)(C), (g) AC-3(9) Access Enforcement | Controlled Release"
    status: "candidate"
    work_item: "WI-58"
