    context: "CA-3, INFORMATION EXCHANGE Parameter Value:"
    statement: "Justification to Select for Low, Moderate, and High: Contingency plans must take applicable privacy requirements into account so that executing contingency measures does not result in avoidable privacy incidents and breaches or compliance issues with intelligence related policies and procedures designed to protect privacy."
