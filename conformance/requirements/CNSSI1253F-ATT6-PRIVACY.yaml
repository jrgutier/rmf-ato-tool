    locator: "4.2.b"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Parameter Value: Establish and manage cryptographic keys when cryptography is employed within the system in accordance with the following key management requirements: centralized management of key generation, distribution, storage, access, and destruction in accordance with NIST SP 800-55 and NIST SP 800-57."
    status: "candidate"
