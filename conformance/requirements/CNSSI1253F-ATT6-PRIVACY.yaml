  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0220"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 69, "anchor": "Justification to Recommend for Privacy Enhancing: Deploying automatic mechanisms provides additional privacy"}
    kind: "modal"
