  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0131"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 37, "anchor": "Review at least quarterly the privileges assigned to individuals with access to"}
    kind: "lettered"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "(a) Review at least quarterly the privileges assigned to individuals with access to privileged accounts and at least annually the privileges assigned to individuals with access to high PII to validate the need for such privileges; Reference(s): 5 U.S.C. §552a(b),(e)(9)-(10); FISA; EO12333; OMB M-17-12; CNSSD No. 504 AC-6(8), Least Privilege | Privilege Levels for Code Execution"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0132"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 37, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Ensure system software"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Ensure system software does not allow users to obtain elevated privileges (and potentially access to PII beyond what the individual requires in performance of their job duties). Guidance: Enforce the most restrictive set of rights/privileges or access needed by users (or processes acting on behalf of users) for the performance of specified tasks — increasing the level of restriction as privacy risk level rises. Users who must access records containing PII should only have access to the minimum amount of PII and privileges (e.g., read, write, execute) necessary to perform their assigned tasks. Reference(s): 5 U.S.C. §552a(b); OMB Circular A-130; CNSSD No. 504 AC-6(9), Least Privilege | Log Use of Privileged Functions"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0133"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 38, "anchor": "Justification to Select for Moderate and High: Privileged functions have elevated permissions"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for Moderate and High: Privileged functions have elevated permissions to access, and grant access, to PII. Accountability requires the ability to detect, trace, and audit a privileged function whenever it is executed. Reference(s): 5 U.S.C. §552a(b); FISA; EO 12333; EO 14028 Sec 4(e)(i)(B); OMB Circular A-130; CNSSD No. 504 AC-6(10), Least Privilege | Prohibit Non-Privileged Users from Executing Privileged Functions"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0134"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 38, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Non-privileged users may"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Non-privileged users may not have the same level of trust as privileged users. Privileged functions have access beyond that of the typical user, and as such may have greater ability to access PII. Individual accountability requires the ability to trace (audit) the actions of the user who initiated them. Reference(s): OMB Circular A-130; CNSSD No. 504 AC-8, SYSTEM USE NOTIFICATION – Included in Privacy Control Baseline AC-11, DEVICE LOCK"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0135"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 38, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Protect PII from"}
    kind: "modal"
    locator: "4.2.j.(a)"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Protect PII from unauthorized access when system users are away from their workstation. Session lock for remote and mobile devices is neither technically nor financially burdensome. Based on risk, many agencies have adopted 15-minute session locks by policy as a best practice. Period of inactivity shall be no more than 30 minutes before session lock occurs for remote and mobile devices and requires user re-authentication. Parameter Value:"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0136"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 38, "anchor": "Prevent further access to the system by initiating a device lock after"}
    kind: "lettered"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "a. Prevent further access to the system by initiating a device lock after a period not to exceed 30 minutes of inactivity, requiring the user to initiate a device lock before leaving the system unattended; Reference(s): 5 U.S.C. §552a(e)(10); OMB M-17-12 AC-16, SECURITY AND PRIVACY ATTRIBUTES Justification to Select for Moderate and High: Implementation of this control provides a technical means to enforce security and privacy policies, e.g., access controls and encryption. Meta-data that supports privacy attributes is required to properly determine whether access to PII should be granted. to enable cross system functionality and reciprocity through consistent privacy attribute interpretation. This control supports privacy protections by assigning privacy attributes that characterize information, devices, or processes (i.e., an “object”) as containing PII or associate an organization’s mandatory security/privacy training requirement with a user of a system containing PII (i.e., a “subject”). Security and privacy attributes are meta-data about either a subject or an object. Other attributes may exist for other requirements beyond privacy. If an organization creates privacy attributes they should be cognizant of the risk associated with including PII in that meta-data. Parameter Value:"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0137"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 39, "anchor": "Provide the means to associate a privacy attribute to demonstrate the user"}
    kind: "lettered"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "a. Provide the means to associate a privacy attribute to demonstrate the user (subject) has completed privacy training in the last year with a privacy attribute of “Contains PII” having a value of “yes” or “no” for data structures that are known or plan to contain PII for information in storage, in process, and/or in transmission; Reference(s): 5 U.S.C. §552a(b), (e)(9)-(10); OMB Circular A-130 AC-16(3), Security and Privacy Attributes | Maintenance of Attribute Associations by System"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0138"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 39, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Limiting access to"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Limiting access to PII from remote networks and/or restricting activities that can be conducted with PII remotely reduces the risk of intentional and unintentional disclosures of PII that may not exist on an internal network. Guidance: Allow remote access to PII only with two-factor authentication where one of the factors is provided by a device separate from the computer gaining access."
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0139"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 40, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Auditing remote access"}
    kind: "should"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Auditing remote access ensures unauthorized connections to systems containing PII can be detected across all system platforms (e.g., servers, mobile devices, workstations). Guidance: Audit all remote access to, and actions on, resources containing PII. Reference(s): 5 U.S.C. §552a(e)(10); OMB M-17-12; NIST SP 800-46 AC-17(2), Remote Access | Protection of Confidentiality and Integrity Using Encryption"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0140"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 40, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Authentication is necessary"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Authentication is necessary to know who accesses the PII. Communications over wireless networks, unless properly secured, have greater risk of interception than hard-wired networks. Implementing encryption of wireless network communications containing PII renders any intercepted data unreadable. Guidance: If wireless networks permit access to organization systems containing PII, then encryption of content and authentication of users or devices is required. Organizations should ensure that all wireless local area network (WLAN) components use Federal Information Processing Standards (FIPS)-validated cryptographic algorithms to protect the confidentiality and integrity of WLAN communications and NSA-approved cryptographic algorithms to protect the confidentiality and integrity of classified WLAN communications. Reference(s): 5 U.S.C. §552a(b), (e)(10); OMB Circular A-130; NIST SP 800-97, NIST SP 800-153 AC-19, ACCESS CONTROL FOR MOBILE DEVICES"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0141"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 40, "anchor": "Justification to Select for Low, Moderate, and High: Limiting access to PII"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for Low, Moderate, and High: Limiting access to PII from mobile devices reduces the risk of intentional and unintentional disclosures of PII that may not exist on an internal network."
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0142"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 41, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Access to PII"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Access to PII from external systems (including, but not limited to, personally owned systems/devices) increases risk of loss of the data. Reinforce by a binding agreement to terms and conditions of the organization’s privacy requirements to ensure awareness and accountability of both parties. Privacy requirements shall be addressed in agreements that cover relationships in which external systems are used to access, process, store, or transmit and manage PII. Access to PII from external systems (including, but not limited to, personally owned systems/devices) is limited to those organizations and individuals with a binding agreement to terms and conditions of privacy requirements which protect the PII. Guidance: Such agreements may include memoranda of understanding (MOUs), terms of service, or contracts. Reference(s): 5 U.S.C. §552a(e)(10); FAR Part 24, 39.105; OMB Circular A-130 AC-20(1), Use of External Systems | Limits on Authorized Use"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0143"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 41, "anchor": "Justification to Select for Low, Moderate, and High: Access to PII from"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for Low, Moderate, and High: Access to PII from external systems increases risk of loss of the data. An external system which processes, stores, or transmits PII needs to have its security and privacy controls verified to meet the organization's security control requirements for systems processing PII. Reference(s): 5 U.S.C. §552a(e)(10); FAR Part 24, 39.105; OMB Circular A-130 AC-20(3), Use of External Systems | Non-Organizationally Owned Systems — Restricted Use"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0144"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 42, "anchor": "Justification to Select for Low, Moderate, and High: This control is needed"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for Low, Moderate, and High: This control is needed to implement protections for PII contained on any device not owned by the organization, including personal mobile devices, commonly referred to as “bring your own device” (BYOD). Mobile devices are more vulnerable to loss or theft than other types of computing media (e.g., desktops and servers) due to their portability and widespread use inside and outside of government facilities. PII stored on mobile devices is more vulnerable as a result. At a minimum, controls must include implementation of either full-device or virtual container encryption to reduce the vulnerability of PII contained on mobile devices. Prior to being provided access to PII on remote devices, device users must acknowledge through a binding agreement their responsibilities to safeguard the PII accessible from the device and that they are aware of and agree to the organization’s capabilities to manage the organization’s PII on the device, including confiscation, in consultation with the organization’s counsel, if necessary to remove the PII. Guidance: The organization should include in its mobile strategy a method to ensure both the device’s access to PII can be revoked and the device’s PII contents can be remotely removed. Parameter Value: Restrict the use of non-organizationally owned systems or system components to process organizational information using PII."
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0145"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 42, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: PII protected by"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: PII protected by the Privacy Act may not be disclosed without first providing notice to the individuals about whom the information will be disclosed and for what purpose. When PII is shared it is necessary to ensure the PII is being shared in accordance with statutory and regulatory requirements, including any restrictions on how the PII may be shared and the receiving partner’s security requirements. Sharing PII with third parties introduces new risks to the individual which, as applicable, requires organizations to establish formal agreements with the third party and ensure the sharing is compatible with the purposes described in notice to, and consent from, the individual. Consideration of privacy risks for sharing PII apply regardless of the method used or whether the information remains stored in the system of records. For example, data removed from a system covered by a System of Records Notice (SORN) (e.g., an HR database) and shared in another format (e.g., an Excel spreadsheet) must still meet purpose and use requirements of the associated notice. PII not in a system of records that is shared with a third party still must meet the Purpose Specification and, relatedly, Use Limitation FIPPs. In particular, organizations should provide notice of the specific purpose for which PII is collected and should only process PII for a purpose that is explained in the notice and is compatible with the purpose for which the PII was collected, or that is otherwise legally authorized. Guidance: This control addresses the sharing of information in a general sense (i.e., disclosure). It is not “information sharing” as defined by the Information Sharing Environment (ISE) Privacy Guidelines."
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0146"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 43, "anchor": "All sharing partners, processes, and systems must comply with applicable SORN, Privacy"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "All sharing partners, processes, and systems must comply with applicable SORN, Privacy Impact Assessment (PIA), or other forms of notice or public statements. Consistent with the Purpose Specification and Use Limitation FIPPs, sharing of PII must be compatible with the purpose for which it was collected. Consistent with the Transparency FIPP, any subsequent sharing that is not compatible or pursuant to a statutory exemption may not be done until additional notice is provided to the individual, their consent is obtained, and relevant documents are updated or published, e.g., when applicable and appropriate publish an updated SORN to cover the additional incompatible sharing and obtain consent from the affected individuals. Reference(s): 5 U.S.C. §552a(b) and (e)(10) AC-22, PUBLICLY ACCESSIBLE CONTENT"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0147"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 43, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: PII may only"}
    kind: "modal"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: PII may only be disclosed through appropriate channels. PII that is maintained in a system of records or not approved for release under the Freedom of Information Act (FOIA) is nonpublic information. When agencies consider sharing or posting PII, they must do so in a way that fully protects individual privacy. This control implements procedures to protect information, including PII, from being improperly posted publicly. Guidance: PII that is nonpublic information shall not be posted onto a publicly accessible system. Reference(s): 5 U.S.C. §552a(b)(6), (c)-(d), FISA; EO 12333; OMB M-11-02 AC-23, DATA MINING PROTECTION*"
    status: "candidate"
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0148"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 43, "anchor": "Justification to Recommend for Privacy Enhancing: Data mining increases privacy risk because"}
    kind: "should"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Recommend for Privacy Enhancing: Data mining increases privacy risk because the correlations or patterns discovered through the analytical process may result in unanticipated revelations or reveal information that has greater potential for harm to the individual than the data that initially went into the analytics. Data mining programs should be thoughtfully implemented with limited access to the PII and data mining results to ensure the analytics remain within the FIPPS of purpose specification and use limitation, as well as transparency. Reference(s): 5 U.S.C. §552a(e), NIST IR 8062 AT-1, AWARENESS AND TRAINING | POLICY AND PROCEDURES – Included in the Privacy Control Baseline AT-2, LITERACY TRAINING AND AWARENESS – Included in the Privacy Control Baseline AT-2(1), Literacy Training and Awareness | Practical Exercises*"
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: nothing a rule can fail. Unheld: the entry's sentences are prose no rule judges; the wording beyond the cited authorities."
    evidence: [{"kind": "prose", "target": "personas/PER-PRIV.md", "claim": "presence", "asserts": "The privacy officer weighs the Privacy Enhancing control the overlay recommends, with its justification, at S-2"}]
    work_item: "WI-58"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0149"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 44, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Training the workforce to recognize indicators of"}
    kind: "should"
    locator: "4.2.a"
    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Training the workforce to recognize indicators of insider threat reduces the likelihood of loss of data, including PII. Insider threat programs often are implemented at the organizational level for all systems processing PII. Insider threat programs can be implemented as system-specific if the system processes highly sensitive PII. Reference(s): 5 U.S.C. §552a(e)(5), (9), (10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; FISA Sections 101(h); 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503; OMB Circular A-130; OMB M-17-12 AT-2(3), Literacy Training and Awareness | Social Engineering and Mining"
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: removing AT-2.2 without naming 5 U.S.C. 552a, E-Government Act of 2002, Pub. L. 107-347, FISA, EO 12333, ICD 107, ICD 121, ICD 503, OMB Circular A-130, OMB M-17-12 fails (OVS-001). Unheld: the overlay does not say whether each authority cited for AT-2.2 requires its selection or the control only helps to meet it, so a removal is held to all of them alike; the justification reaches the run as text; selection is the Privacy Overlay table in cnssi-1253.yaml."
