  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0025"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 8, "anchor": "Biometrics (e.g., facial image, fingerprint, iris, retina, voice prints, x-rays)"}
