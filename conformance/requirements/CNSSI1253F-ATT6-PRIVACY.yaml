    statement: "c. FAR Clauses per FAR Part 24 and Part 39.105, and any other organization specific privacy clause. Reference(s): 5 U.S.C. §552a (e)(10) and (m); E-Government Act of 2002 (I; Pub. L. No. 107-347) §208; FISMA (Pub. L. No. 107-347); FAR Part 24 and 39.105; OMB Circular A-130 SA-4(11), Acquisition Process | System of Records"
