  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0228"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 72, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Consistent with the Purpose Specification and Use Limitation and Transparency FIPPs, organizations should provide notice"}
    kind: "modal"
    locator: "4.2"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Consistent with the Purpose Specification and Use Limitation and Transparency FIPPs, organizations should provide notice of the specific purpose for which PII is collected. For Privacy Act systems of record, this notice is provided through a Privacy Act Statement. For Privacy Act systems of records, unless a Privacy Act exception is in place, agencies must inform each individual whom it asks to supply information, on the form which it uses to collect the information or on a separate form that can be retained by the individual regarding the agency's collection and maintained of the information."
