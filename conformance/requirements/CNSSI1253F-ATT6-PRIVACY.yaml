    context: "Table 2: Privacy Overlays Security and Privacy Controls ACCT, Low, and Moderate Parameter Value: Moderate and High Parameter Value: Release information outside of the system only if:"
    statement: "Justification to Recommend for Privacy Enhancing: Enhances privacy protection by requiring PII to be tagged for identification and protects information in transit with flow enforcement preventing the PII from being moved to a system not authorized to host PII. For example, a record containing PII may be flagged with an attribute that indicates sharing the PII is not permitted. A system can then be configured to take actions such as excluding the record when sharing a group of records from the system. Reference(s): 5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12 AC-4(2), Information Flow Enforcement | Processing Domains*"
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: nothing a rule can fail. Unheld: the recommendation is a permission, ruling sought on it; the entry's other sentences are prose no rule judges; the wording beyond the cited authorities."
    evidence: [{"kind": "prose", "target": "playbooks/S/S-2.md", "claim": "presence", "asserts": "S-2 reads the overlay's recommendation for an optional Privacy Enhancing control through rmf catalog show --fields overlay before tailoring it in"}]
    work_item: "WI-58"
