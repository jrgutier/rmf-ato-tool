  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0250"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 76, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Contracts for systems, components, or services that"}
