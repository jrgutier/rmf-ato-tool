    locator: "4.2"
    context: "AU-3, CONTENT OF AUDIT RECORDS"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Audit records must contain detailed information to serve various purposes, including to identify whether PII was misused or abused, to enforce criminal or civil penalties under the Privacy Act, and to meet reporting requirements for potential PII incidents and breaches."
