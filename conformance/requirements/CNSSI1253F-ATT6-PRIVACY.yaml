  - {"page": 52, "locator": "4.2.g.(f)", "reason": "no-marker", "text": "Reference(s): OMB Circular A-130 CM-3(6), Configuration Change Control | Cryptography Management"}
  - {"page": 53, "locator": "4.2.g.(f)", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(5), (e)(10); OMB Circular A-130 CM-4, IMPACT ANALYSES – Included in the Privacy Control Baseline CM-4(1), Impact Analyses | Separate Test Environments"}
  - {"page": 53, "locator": "4.2.g.(f)", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Mapping PII helps to understand where the data are located, going, and how they are processed. Reference(s): 5 U.S.C. §552a(e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130; OMB M-03-22 CP-1, CONTINGENCY PLANNING POLICY AND PROCEDURES – Included in the Privacy Control Baseline CP-2, CONTINGENCY PLAN"}
  - {"page": 54, "locator": "4.2.g.(f)", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305(a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503; OMB Circular A-130 CP-6, ALTERNATE STORAGE SITE"}
  - {"page": 54, "locator": "4.2.g.(f)", "reason": "no-marker", "text": "Guidance for Moderate and High: When using an alternate processing site, implement administrative, physical and technical controls to protect PII commensurate with the identified privacy risks. Reference(s): 5 U.S.C. §552a(e)(10); ICD 107; ICD 503"}
  - {"page": 55, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503; OMB Circular A-130 CP-9(8), System Backup | Cryptographic Protection"}
  - {"page": 55, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Information system recovery and reconstitution is an important step to restoring PII to an accurate state for decision making following execution of a contingency plan. Reference(s): 5 U.S.C. §552a(e)(5) and (e)(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503 IA-1, (IDENTIFICATION AND AUTHENTICATION) POLICY AND PROCEDURES – Included in the Privacy Control Baseline IA-2, IDENTIFICATION AND AUTHENTICATION (ORGANIZATIONAL USERS)"}
  - {"page": 55, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Implementing this control ensures unique identification and authentication of an individual’s account, preventing anonymous access to PII and providing appropriate access for organizational users who have a need for the PII in the performance of the users’ official duties."}
  - {"page": 56, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130 IA-2(5), Identification and Authentication (Organizational Users) | Individual Authentication With Group Authentication"}
  - {"page": 58, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(10); FISMA (P.L. 107-347, Title III); NSM-8; OMB Circular A-130 IA-12, IDENTITY PROOFING"}
  - {"page": 58, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); NSM-8 IR-1, INCIDENT RESPONSE POLICY AND PROCEDURES – Included in the Privacy Control Baseline IR-2, INCIDENT RESPONSE TRAINING – Included in the Privacy Control Baseline"}
  - {"page": 58, "locator": "4.2", "reason": "no-marker", "text": "IR-2(1), Incident Response Training | Simulated Events"}
  - {"page": 58, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): OMB Circular A-130 IR-2(3), Incident Response Training | Breach – Included in the Privacy Control Baseline IR-3, INCIDENT RESPONSE TESTING – Included in the Privacy Control Baseline IR-4, INCIDENT HANDLING – Included in the Privacy Control Baseline IR-4(4), Incident Handling | Information Correlation"}
  - {"page": 59, "locator": "4.2", "reason": "no-marker", "text": "IR-7, INCIDENT RESPONSE ASSISTANCE - Included in the Privacy Control Baseline IR-8, INCIDENT RESPONSE PLAN - Included in the Privacy Control Baseline"}
  - {"page": 59, "locator": "4.2", "reason": "no-marker", "text": "IR-8(1), Incident Response Plan | Breaches - Included in the Privacy Control Baseline MA-1, (MAINTENANCE) POLICY AND PROCEDURES"}
  - {"page": 59, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(9)-(10), and (m); FAR Parts 24.104, 39.105, and 52.224-1&2; ICD 107; ICD 503; OMB Circular A-130 MA-2, CONTROLLED MAINTENANCE"}
  - {"page": 60, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): OMB M-17-12; NARA GRS MA-3(4), MAINTENANCE TOOLS: RESTRICTED TOOL USE"}
  - {"page": 61, "locator": "4.2", "reason": "no-marker", "text": "Reference(s): E-Government Act of 2002 (Pub. L. No. 107-347) § 208; ICD 121; OMB M-17-12 MP-3, MEDIA MARKING"}
  - {"page": 62, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): ICD 107; ICD 121; ICD 503; OMB M-17-12; OMB Circular A-130 MP-6, MEDIA SANITIZATION"}
  - {"page": 62, "locator": "4.2.a", "reason": "lead-in", "text": "Parameter Value:"}
  - {"page": 62, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(10); OMB Circular A-130; OMB M-17-12 MP-6(1), Media Sanitization | Review, Approve, Track, Document, and Verify*"}
  - {"page": 62, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(10); OMB Circular A-130; OMB M-17-12 MP-6(2), Media Sanitization | Equipment Testing*"}
  - {"page": 62, "locator": "4.2.a", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: As an additional layer of protection, testing sanitization equipment and procedures helps to ensure that the intended sanitization is achieved. This may be appropriate when disposing of media that had particularly sensitive PII or which if released would seriously harm national security."}
  - {"page": 62, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503 MP-6(8), Media Sanitization | Purging or Wiping of Information"}
  - {"page": 63, "locator": "4.2.a", "reason": "lead-in", "text": "Parameter Value:"}
  - {"page": 63, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(10); OMB Circular A-130 PE-1, (PHYSICAL AND ENVIRONMENTAL PROTECTION) POLICY AND PROCEDURES – Included in the Privacy Control Baseline PE-2, PHYSICAL ACCESS AUTHORIZATIONS – Included in the Privacy Control Baseline PE-3, PHYSICAL ACCESS CONTROL"}
  - {"page": 64, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 PE-8, VISITOR ACCESS RECORDS – Included in the Privacy Control Baseline PE-8(3), Visitor Access Records | Limit Personally Identifiable Information Elements – Included in the Privacy Control Baseline PE-17, ALTERNATE WORK SITE"}
  - {"page": 64, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10), OMB Circular A-130 PL-1, (PLANNING) POLICY AND PROCEDURES – Included in the Privacy Control Baseline PL-2, SYSTEM SECURITY AND PRIVACY PLANS – Included in the Privacy Control Baseline PL-4, RULES OF BEHAVIOR – Included in the Privacy Control Baseline PL-4(1), Rules of Behavior | Social Media and External Site/Application Usage Restrictions"}
  - {"page": 65, "locator": "4.2.a", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: The security and privacy architectures identify security and privacy controls necessary to support privacy requirements. The SAOP or Chief Privacy Officer (CPO) are the best resource for identifying privacy requirements and privacy controls."}
  - {"page": 65, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. 552a(e)(10); E-Government Act of 2002 (Pub. L. 107-347) § 208; OMB M-03-22 PL-8(1), Security and Privacy Architectures | Defense In Depth"}
  - {"page": 65, "locator": "4.2.a", "reason": "no-marker", "text": "Justification to Select for Low, Moderate, and High: Requiring multiple controls inhibits and deters adversaries from achieving unauthorized access to PII. The security and privacy architectures identify security and privacy controls necessary to support a defense-in-depth approach. The SAOP or Chief Privacy Officer (CPO) are the best resource for identifying privacy requirements and privacy controls. Reference(s): 5 U.S.C. 552a(e)(10); E-Government Act of 2002 (Pub. L. 107-347) § 208; OMB M-03-22 PL-9, CENTRAL MANAGEMENT – Included in the Privacy Control Baseline PL-10, BASELINE SELECTION – Included in the Privacy Control Baseline PL-11, BASELINE TAILORING – Included in the Privacy Control Baseline PM-1, INFORMATION SECURITY PROGRAM PLAN – Included in the Privacy Control Baseline"}
  - {"page": 65, "locator": "4.2.a", "reason": "no-marker", "text": "PM-3, INFORMATION SECURITY RESOURCES – Included in the Privacy Control Baseline PM-4, PLAN OF ACTION AND MILESTONES PROCESS – Included in the Privacy Control Baseline PM-5, INFORMATION SYSTEM INVENTORY – Included in the Privacy Control Baseline"}
  - {"page": 65, "locator": "4.2.a", "reason": "no-marker", "text": "PM-5(1), System Inventory | Inventory of Personally Identifiable Information – Included in the Privacy Control Baseline PM-6, MEASURES OF PERFORMANCE – Included in the Privacy Control Baseline PM-7, ENTERPRISE ARCHITECTURE – Included in the Privacy Control Baseline PM-8, CRITICAL INFRASTRUCTURE PLAN – Included in the Privacy Control Baseline PM-9, RISK MANAGEMENT STRATEGY – Included in the Privacy Control Baseline PM-10, AUTHORIZATION PROCESS – Included in the Privacy Control Baseline"}
  - {"page": 66, "locator": "4.2.a", "reason": "no-marker", "text": "PM-11, MISSION/BUSINESS PROCESS DEFINITION – Included in the Privacy Control Baseline PM-12, INSIDER THREAT PROGRAM"}
  - {"page": 68, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 CFR § 1400.101(b); 5 C.F.R. § 731.106; OMB Circular A-130 PS-3, PERSONNEL SCREENING"}
  - {"page": 68, "locator": "4.2.a", "reason": "no-marker", "text": "Justification to Select for Low, Moderate, and High: Terminating access to PII upon termination of personnel employment reduces privacy risk of unauthorized access to PII and misuse or abuse of PII. Reference(s): 5 U.S.C. § 552a(b)(1); OMB Circular A-130 PS-5, PERSONNEL TRANSFER"}
  - {"page": 69, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. § 552a(m); FAR Parts 24.1, 39.105, and 52.224-1&2; OMB Circular A-130 PS-8, PERSONNEL SANCTIONS – Included in the Privacy Control Baseline PS-9, POSITION DESCRIPTIONS – Included in the Privacy Control Baseline PT-1, (PII PROCESSING AND TRANSPARENCY) POLICY AND PROCEDURES – Included in the Privacy Control Baseline PT-2, AUTHORITY TO PROCESS PERSONALLY IDENTIFIABLE INFORMATION"}
  - {"page": 77, "locator": "4.2.c", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(m), (e)(10); FAR Part 24 and 39.105; OMB Circular A-130 SA-8, SECURITY AND PRIVACY ENGINEERING PRINCIPLES"}
  - {"page": 77, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Considering the privacy requirements of a system during the design phase of the life cycle ensures the most cost effective and efficient implementation of controls. It is much easier, cheaper, and more effective to build privacy protections into a system during the acquisition or development phase of the life cycle than it is to retrofit it afterwards."}
  - {"page": 77, "locator": "4.2.c", "reason": "no-marker", "text": "Reference(s): E-Government Act of 2002 (Pub. L. 107-347) § 208; OMB Circular A-130; OMB M-05-08; OMB M-03-22; NISTIR-8062 SA-8(1), Security and Privacy Engineering Principles | Clear Abstractions*"}
  - {"page": 77, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: The clarity provided by simple, well-defined interfaces and functions is necessary for systems that are complex or present a sufficiently high privacy risk. SA-8(12), Security and Privacy Engineering Principles | Hierarchical Protection*"}
  - {"page": 77, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Supports resource management for systems with PII by permitting presumption of protection through components that are equally or more trustworthy than the system with PII. SA-8(14), Security and Privacy Engineering Principles | Least Privilege"}
  - {"page": 78, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Decreasing the system’s reliance on other systems decreases the risk of loss, misuse, or inadvertent access to high risk PII. SA-8(17), Security and Privacy Engineering Principles | Secure Distributed Composition*"}
  - {"page": 78, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Ensuring the system protects PII at least as well as the distributed components decreases the risk of loss, misuse, or inadvertent access to high risk PII. SA-8(18), Security and Privacy Engineering Principles | Trusted Communications* Channels"}
  - {"page": 78, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Trusted communication channels protects PII in transit as well as at rest. Decreases the risk of loss, misuse, or inadvertent access to PII. SA-8(19), Security and Privacy Engineering Principles | Continuous Protection"}
  - {"page": 79, "locator": "4.2.c", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); EO 14208, NSM-8; OMB Circular A-130 SA-8(28), Security and Privacy Engineering Principles | Acceptable Security"}
  - {"page": 79, "locator": "4.2.c", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130 SA-9(6), External System Services | Organization-Controlled Cryptographic Keys"}
  - {"page": 80, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Protects PII by reducing risk that unauthorized individuals are able to access the system. Reference(s): 5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130 SA-9(7), External System Services | Organization-Controlled Integrity Checking"}
  - {"page": 80, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Protects PII by supporting visibility into access and use of PII, which reduces risk of unauthorized access or use of the PII. Reference(s): 5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130 SA-9(8), External System Services | Processing and Storage Location - U.S. Jurisdiction"}
  - {"page": 80, "locator": "4.2.c", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130 SA-10, DEVELOPER CONFIGURATION MANAGEMENT"}
  - {"page": 80, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Protects PII by ensuring integrity of the data while making configuration changes. Reference(s): 5 U.S.C. §552a SA-10(7), Developer Configuration Management | Security and Privacy Representatives"}
  - {"page": 81, "locator": "4.2.c", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 SA-15(12), Development Process, Standards, and Tools | Minimize Personally Identifiable Information"}
  - {"page": 81, "locator": "4.2.c", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(4); OMB Circular A-130 SA-17, DEVELOPER SECURITY AND PRIVACY ARCHITECTURE AND DESIGN"}
  - {"page": 81, "locator": "4.2.c", "reason": "no-marker", "text": "Justification to Select for Moderate and High: The privacy architecture and design identifies controls necessary to meet both security and privacy requirements. The SAOP, or designee, is the best resource for identifying privacy requirements."}
  - {"page": 82, "locator": "4.2.b", "reason": "no-marker", "text": "Reference(s): 5 C.F.R. §731.106; FAR Part 24 and 39.105 SC-1, (SYSTEM AND COMMUNICATIONS PROTECTION) - Included in the Privacy Control Baseline SC-7, BOUNDARY PROTECTION"}
  - {"page": 83, "locator": "4.2.b", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(b), (e)(10); E-Government Act of 2002 (Pub. L. No. 107- 347), Title III; NSM-8 Sec 1.b.iv; OMB Circular A-130; CNSSP No. 15"}
  - {"page": 84, "locator": "4.2", "reason": "no-marker", "text": "Justification to Select for Low, Moderate, and High: NSA-approved and FIPS-validated cryptographic modules are the government standard for encryption. Cryptography is a secure solution implemented to protect sensitive and classified information and is a best practice to secure PII."}
  - {"page": 84, "locator": "4.2.b", "reason": "no-marker", "text": "Reference(s): EO 14028 Section 3.d; NSM-8 Section 3; OMB Circular A-130; OMB M-17-12 SC-16, TRANSMISSION OF SECURITY AND PRIVACY ATTRIBUTES"}
  - {"page": 84, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Implementation of attributes to PII protects the integrity and confidentiality of the information and supports attribute-based access control (ABAC). ABAC limits user access to information according to defined access policies, which helps ensure the security and confidentiality of the PII processed by the systems."}
  - {"page": 84, "locator": "4.2.b", "reason": "no-marker", "text": "Reference(s): OMB Circular A-130; NIST SP 800-122 SC-16(1), Transmission of Security and Privacy Attributes | Integrity Verification"}
  - {"page": 84, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Verifying the security and privacy attributes of transmitted information helps to ensure data was not compromised in transit or subject to unauthorized access. This verification helps ensure the integrity of the data."}
  - {"page": 84, "locator": "4.2.b", "reason": "no-marker", "text": "Reference(s): OMB Circular A-130 SC-16(2), Transmission of Security and Privacy Attributes | Anti-Spoofing Mechanisms*"}
  - {"page": 85, "locator": "4.2.b", "reason": "no-marker", "text": "Reference(s): OMB Circular A-130 SC-28, PROTECTION OF INFORMATION AT REST"}
  - {"page": 86, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Select for Moderate and High: Detection of unauthorized changes to PII and systems that process PII is fundamental to ensuring data quality and integrity as required by the Privacy Act and the FIPPs. Parameter Value:"}
  - {"page": 86, "locator": "4.2.a", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a (10); OMB M-17-12; OMB M-04-04; OMB Circular A- 130 SI-10, INFORMATION INPUT VALIDATION"}
  - {"page": 87, "locator": "4.2.b", "reason": "no-marker", "text": "Reference(s): 5 U.S.C. §552a(e)(5) and (10); OMB Circular A-130 SI-12, INFORMATION HANDLING AND RETENTION – Included in the Privacy Control Baseline SI-12(1), Information Management and Retention | Limit Personally Identifiable Information Elements"}
  - {"page": 89, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Employing data tags for PII can support the use of automation tools to correct or delete relevant PII. Reference(s): OMB Circular A-130 SI-18(3), Personally Identifiable Information Quality Operations | Collection"}
  - {"page": 89, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Select for ACCT, Low, Moderate, and High: Collecting PII directly from the individual to which it pertains can increase the likelihood that the information is accurate or can be used to validate information collected from other sources. Reference(s): OMB Circular A-130 SI-18(4), Personally Identifiable Information Quality Operations | Individual Requests"}
  - {"page": 91, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: This best practice supports the FIPPs of Minimization as well as Purpose Specification and Use Limitation Reference(s): OMB Circular A-130 SI-19(4), De-Identification | Removal, Masking, Encryption, Hashing, or Replacement of Direct Identifiers*"}
  - {"page": 91, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: One of several techniques for implementing de-identification. Guidance: Useful in situations with lower privacy risk or when resources do not permit more robust techniques. Generally easy and inexpensive to implement. Some methods are more robust than others (see 800-53 discussion for examples of methods). Utility of the data may vary. Reference(s): OMB Circular A-130 SI-19(5), De-Identification | Statistical Disclosure Control*"}
  - {"page": 91, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Results of statistical analysis can make connections to identifiable individuals less obvious. Guidance: Often not appropriate in small datasets because distinguishing characteristics can lead to easier re-identification or other inferences about individuals in the dataset. Reference(s): OMB Circular A-130 SI-19(6), De-Identification | Differential Privacy*"}
  - {"page": 92, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: One of several techniques for implementing de-identification. Reference(s): OMB Circular A-130 SI-19(8), De-Identification | Motivated Intruder*"}
  - {"page": 92, "locator": "4.2.b", "reason": "no-marker", "text": "Justification to Recommend for Privacy Enhancing: Provide useful insights regarding how successfully de-identification techniques have been deployed and the residual risks that may necessitate additional controls for protecting the data. Reference(s): OMB Circular A-130 SI-20, TAINTING*"}
  - {"page": 98, "locator": "4.2.c", "reason": "no-marker", "text": "Aggregating records in larger quantities increases the potential privacy impact in the event of loss or misuse. For example, OMB M-17-05, Fiscal Year 2016-2017 Guidance on Federal Information Security and Privacy Management Requirements, states, “An unauthorized modification of, unauthorized deletion of, unauthorized exfiltration of, or unauthorized access to 100,000 or more individuals' PII constitutes a ‘major incident.’”"}
