  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0311"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 86, "anchor": "Justification to Select for Moderate and High: Information input validation serves two"}
    kind: "promoted"
    locator: "4.2.a"
    context: ""
    statement: "Justification to Select for Moderate and High: Information input validation serves two important purposes for protecting PII: 1) when PII is entered, validation techniques support data quality measures (e.g., ensuring the PII entered is the expected type and format of data), and 2) it provides the capability to limit or exclude PII from being entered into a field (e.g., recognizing a restricted format, such as an SSN). Parameter Values: Check the validity of the following information inputs: PII Reference(s): 5 U.S.C. §552a(e)(5), (e)(6), and (e)(10); OMB Circular A-130 SI-11, ERROR HANDLING"
    status: "candidate"
    work_item: "WI-76"
    promoted: {"reason": "Parameter Value row of Section 6, value text no live statement holds"}
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0312"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 57, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: User authentication is"}
    kind: "promoted"
    locator: "4.2"
    context: ""
    statement: "Justification to Select for ACCT, Low, Moderate, and High: User authentication is a means to control who has access to an information system holding PII. Adequate security to ensure confidentiality for an information system containing PII is achieved through the management of the authenticators permitting access to that system. Guidance: Authenticator management includes verifying the identity of the user, group, service or device when the authenticator (password) is initially distributed; establishing the content of the authenticator; periodically changing passwords or other identifiers (e.g., certification and signatures) ensuring the strength of authenticators; requiring users to protect their authenticators; changing default authenticators. This reinforces identity validation and adherence to administrative security policies as well as enforces a time-based restriction on access, all of which bound access to PII in some way, limiting exposure in the event a user account is compromised. Reference(s): 5 U.S.C. §552a(b) and (e)(10); FISMA (P.L. No. 107-347, Title III) § 3547; NSM-8; OMB M-17-12; OMB M-06-16 IA-7, CRYPTOGRAPHIC MODULE AUTHENTICATION"
    status: "candidate"
    work_item: "WI-64"
    promoted: {"reason": "Guidance row of Section 6 with a duty; the rejected row held no marker"}
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0313"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 69, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Ensures proper authority"}
    kind: "promoted"
    locator: "4.2.a"
    context: ""
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Ensures proper authority permitting the system to process PII. Additional measures, including design choices, ensure the information system collecting, using, maintaining, or disseminating PII complies with those authorities permitting the processing. Guidance: Ensure PII processed by the information system is related to, and compatible with, the purpose and scope of the authority described in the information system documentation. When applicable, privacy documentation may include a SORN or PIA. Reference(s): 5 U.S.C. §552a; Pub. L. No. 107-347, §208 PT-2(1), Authority to Process Personally Identifiable Information | Data Tagging"
    status: "candidate"
    work_item: "WI-72"
    promoted: {"reason": "Guidance row of Section 6 with a duty; the rejected row held no marker"}
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0314"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 70, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Ensures authorized purpose(s)"}
    kind: "promoted"
    locator: "4.2"
    context: ""
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Ensures authorized purpose(s) to process PII. Additional measures, including, but not limited to, design choices and auditing, ensure the information system collecting, using, maintaining, or disseminating PII complies with those authorized purposes. Guidance: Ensure the PII processed by the information system adheres to the specific purpose(s) described in the information system documentation, including privacy documentation. When applicable, privacy documentation may include a SORN or PIA. Reference(s): 5 U.S.C. §552a(e)(3)(A)-(B); Pub. L. No. 107-347, §208(b)(2)(B)(ii) and (c)(1)(B) PT-3(1), Personally Identifiable Information Processing Purposes | Data Tagging"
    status: "candidate"
    work_item: "WI-72"
    promoted: {"reason": "Guidance row of Section 6 with a duty; the rejected row held no marker"}
