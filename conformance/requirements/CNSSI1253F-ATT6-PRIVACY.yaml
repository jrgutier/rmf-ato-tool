  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0159"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 48, "anchor": "Justification to Select for Moderate and High: Systems with a higher privacy"}
    kind: "modal"
    locator: "4.2"
    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Justification to Select for Moderate and High: Systems with a higher privacy risk require longer term retrieval of audit records to ensure that abuse or misuse of PII with capability to cause more significant privacy harms or that may involve civil or criminal penalties can be identified and investigated."
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0160"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 48, "anchor": "Reference(s): 5 U.S.C. §552a(g), (i); EO 12333, 1.6(b)-(c); OMB Circular A-130 AU-12,"}
    kind: "modal"
    locator: "4.2"
    context: "AU-4, AUDIT STORAGE CAPACITY"
    statement: "Reference(s): 5 U.S.C. §552a(g), (i); EO 12333, 1.6(b)-(c); OMB Circular A-130 AU-12, AUDIT GENERATION – Included in the Privacy Control Baseline AU-12(3), Audit Record Generation | Changes by Authorized Individuals Justification to Select for Moderate and High: Changes to the audit of information systems containing PII must be limited to a subset of authorized system administrators to ensure integrity of audit logs. This control requires organizations to define the individuals or roles that would be able to make changes to audit generation requirements. Such changes to logging may be necessary to support investigations into potential abuse or misuse of PII, PII incidents or breaches, or other inappropriate activities that may result in privacy harms. Parameter Value: Provide and implement the capability for a limited subset of authorized system administrators to change the logging to be performed on any system that contains PII based on a change in risk based on law enforcement, intelligence, or other credible sources of information or a security incident within [Assignment: organization-defined time thresholds]. Reference(s): 5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130 AU-14, SESSION AUDIT"
    status: "candidate"
    work_item: "WI-60"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0161"
