  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0219"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 69, "anchor": "Justification to Select for Moderate and High: Data tagging supports tracking and enforcement of structured or"}
    kind: "modal"
    locator: "4.2.a"
    context: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS) Parameter Value:"
    statement: "Justification to Select for Moderate and High: Data tagging supports tracking and enforcement of structured or unstructured authorized PII processing. PII data that meets the definition of a “record” as defined by the Federal Records Act or the Privacy Act, and is removed or repurposed from an information system covered by a SORN (e.g., an HR database) and extracted or ingested into another format (e.g., an Excel spreadsheet), must still meet purpose and use requirements of the associated notice, i.e., data that is extracted from a SOR must still meet the requirements of the SORN. Reference(s): 5 U.S.C. §552a(b), (e)(4); 44 U.S.C. §2201; OMB Circular A-130 PT-2(2), Authority to Process Personally Identifiable Information | Automation*"
    status: "candidate"
