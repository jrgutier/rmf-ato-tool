    statement: "Justification to Select for ACCT, Low, Moderate, and High: Contracts for systems, components, or services must meet the privacy requirements of the Federal government. It is much easier, less expensive, and more effective to build privacy into a system during the acquisition phase of the life cycle than it is to bolt it on after the system has already been acquired. Reference(s): 5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130 SA-9(2), External System Services | Identification of Functions, Ports, Protocols, and Services"
    status: "candidate"
