    statement: "Guidance: Provide a Privacy Act Statement when asking individuals to supply information to be maintained in a Privacy Act system of record unless appropriate statutory exemptions are in place. For many mission-related national security systems, this will be the case. The SAOP, or designee, can provide information on what is required for a particular system. Reference(s): 5 U.S.C. §552a(e)(3) PT-6, SYSTEM OF RECORD NOTICE"
