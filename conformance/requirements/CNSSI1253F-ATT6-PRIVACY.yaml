    statement: "Justification to Select for High: PII that presents a high privacy risk must be protected at all times from loss, misuse, or inadvertent access. Reference(s): 5 U.S.C. §552a(e)(10); EO 14208, NSM-8; OMB Circular A-130 SA-8(20), Security and Privacy Engineering Principles | Secure Metadata Management*"
    status: "candidate"
