    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for Low, Moderate, and High: Requires implementation of an authenticated proxy server to protect PII at managed interfaces. This layer of security further enhances other security measures such as encryption and access control for a multilayered security solution that will increase the security profile of PII. Reference(s): NSM-8; OMB Circular A-130 SC-7(10), Boundary Protection | Prevent Exfiltration"
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0271"
