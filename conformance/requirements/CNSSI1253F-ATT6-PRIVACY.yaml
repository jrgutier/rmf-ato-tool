  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0071"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 2, "anchor": "As new programs are developed and old programs renewed, systematically identifying the"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "As new programs are developed and old programs renewed, systematically identifying the PII in the system, evaluating privacy risks associated with processing the PII and mitigating those risks are instrumental to systems and programs that serve the Federal mission and public. Security and privacy professionals work collaboratively to support organizations and programs with applying the Privacy Overlays. The Privacy Overlays identify the security and privacy controls and specifications that help organizations manage privacy risk and address the privacy requirements of federal statutes, regulations, policies, and standards. The Privacy Overlays also incorporate a foundational control set composed of controls needed for systems that process PII for purposes of maintaining audit logs and account management records, such as usernames, access permissions, roles, group affiliation, etc. In addition to identifying controls that protect PII, the Privacy Overlays provide guidance for identifying the overall privacy risk level of a system based on impacts to the individuals whose PII is processed by the system, as well as the related risk to the organization. The privacy risk level (low, moderate, or high) is the product of the magnitude of potential harm or negative impact to an individual and organization with consideration of the likelihood of the harm occurring. The control sets in the Privacy Overlays are commensurate with the system’s overall privacy risk level. Privacy and security controls selected to manage privacy risk in information systems require an independent analysis, distinct from that required for dissemination restrictions, e.g., “NOFORN”, and security classifications, e.g., “Secret”. Security classifications focus on protecting national security interests, while privacy controls manage privacy risk and focus on protecting individuals and organizations from potential harms specific to processing PII. The system’s privacy risk level is independent and separate from the system’s classification.8"
    status: "partial"
    reason: "C-2 step 6 records in ART-CAT `## Overlays` each Appendix factor with its level, any added factor, the weighting, the overall privacy risk level and the SAOP's approval; the section is prose no rule reads."
    evidence: [{"kind": "prose", "target": "playbooks/C/C-2.md", "asserts": "C-2 records the privacy risk analysis that selects the Privacy Overlay control set", "claim": "presence"}]
    work_item: "WI-144"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0072"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 3, "anchor": "PII and data processing activities in NSS may create various types of"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "PII and data processing activities in NSS may create various types of privacy risks resulting from the loss, misuse, inappropriate access, or abuse of PII. To that end, many security measures also support privacy needs. However, addressing security risk does not address all types of privacy risk. Even when PII is protected against security threats and vulnerabilities, the system may still present privacy risks because of its intended activities, or data actions, also referred to as \"problematic data actions”. A valid mission and business process that is necessary and intentional can still introduce privacy risk by nature of the activity.9 The Privacy Overlays in this document provide a consistent approach for organizations to identify “appropriate administrative, technical, and physical safeguards” to protect PII in systems regardless of whether the system that maintains the PII is a system of records as defined by the Privacy Act.10 While many of the controls in the Privacy Overlays are system-level controls, agencies may choose to address some controls at the organizational level and allow systems to inherit the controls when appropriate. Determinations of inheritability should be made on a case-by-case basis specific to the structure and function of the organization and system. The Privacy Overlays are one part of a larger ecosystem of privacy requirements. Controls address or mitigate risks affecting confidentiality, integrity, and availability of PII. Additionally, controls selected for the Privacy Overlays both mitigate and help identify potential privacy risks other than those affecting confidentiality, integrity, and availability. One example, RA-8 (Privacy Impact Assessments), requires an assessment of privacy risk for NSS that have PII and may identify problematic data actions that can be addressed through privacy engineering."
    status: "candidate"
