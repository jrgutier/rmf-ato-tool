  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0310"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 59, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Sanitize equipment of"}
