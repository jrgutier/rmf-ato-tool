    statement: "Justification to Select for Low, Moderate, and High: Mobile devices are more likely to be lost or stolen and as a result PII is more vulnerable. Encryption reduces this vulnerability. Guidance: Encrypt information on all mobile devices that contains low, moderate, and high PII. Parameter Value: Employ full-device encryption or container encryption to protect the confidentiality and integrity of information on any type of mobile device permitted by the organization to access PII. Reference(s): 5 U.S.C. §552a(e)(10); OMB Circular A-130 AC-20, USE OF EXTERNAL SYSTEMS"
