    kind: "lettered"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "b. Reveal error messages only to authorized individuals with a need to know in the performance of their official duties"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0286"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 87, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Any data processing"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Any data processing activities that include PII inherently introduce privacy risk that must be managed. The nature of privacy risk can vary at each stage of the information life cycle (e.g., risk may be lower when PII is initially collected and then increased when it is combined with other information during later processing). Organizations must adhere to the Minimization FIPP throughout each stage of the information lifecycle when processing PII to help limit privacy risk and the potential for breaches. Reference(s): 5 U.S.C. §552a(e)(1), (4), (5); OMB Circular A-130 SI-12(2), Information Management and Retention | Minimize Personally Identifiable Information in Testing, Training, and Research Justification to Select for Low, Moderate, and High: The controls that protect live, operational, or production environments are not always employed in development, testing, training, or research environments, which can leave PII at a heightened risk for accidental loss, theft, or compromise. Therefore, the organization should take measures to reduce that risk. Guidance: When PII is of a sufficiently sensitive nature, to the greatest extent possible, PII should not be used when testing or developing an information system. Systems of records as defined by the Privacy Act cannot use real PII during system development, testing, training, or research until the SORN has been published or updated. Reference(s): 5 U.S.C. §552a(e)(11); OMB Circular A-130 SI-12(3), Information Management and Retention | Information Disposal"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0287"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 88, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Both the Privacy"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Both the Privacy Act and the Federal Records Act require records to be processed and disposed of in accordance with a published Records Schedule. Disposal and destruction of PII must be done securely so that it may not be reconstructed. In addition to this requirement, properly disposing of or destroying PII when no longer needed reduces the risk of compromise or misuse. Discussion: Organizations are only permitted to keep PII in accordance with applicable retention schedules. Coordinate with the cognizant privacy and records officials when establishing retention and disposition requirements for PII. Parameter Value: Use the following techniques to dispose of, destroy, or erase information following the retention period: NSA-approved or FIPS-validated techniques or methods. Reference(s): OMB Circular A-130 SI-18, PERSONALLY IDENTIFIABLE INFORMATION QUALITY OPERATIONS"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0288"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 88, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: PII should be"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: PII should be accurate, relevant, timely, and complete to assure fairness to the individual. This is especially important when a record is used to decide a right, benefit, or privilege for an individual or when information is shared beyond a program or system for processing by others. Organizations should ensure the quality of all of their PII, even if it is not covered by the Privacy Act. Guidance: When PII is of a sufficiently sensitive nature (e.g., when it is used to adjudicate an employee's clearance), organizations should incorporate mechanisms into systems and develop corresponding procedures for how frequently, and by what method, the information is to be confirmed accurate, relevant, timely, and complete. Frequency of confirmation should be commensurate with risks to the individual and the business processes that the information supports. There may be statutory exemptions for national security systems. The SAOP, or designee, can provide information on what is required for a particular system. Reference(s): 5 U.S.C. §552a(e)(1), (5); EO 12333; OMB Circular A-130 SI-18(1), Personally Identifiable Information Quality Operations | Automation Support"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0289"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 89, "anchor": "Justification to Select for ACCT, Low Moderate, and High: Automating the enforcement"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for ACCT, Low Moderate, and High: Automating the enforcement of data quality management requirements can strengthen the implementation of SI-18 when done in a way that does not perpetuate or create new privacy risk. Guidance: Certain NSS may have a published exemption for this requirement. The SAOP, or designee, can provide information on what is required for a particular system. Reference(s): 5 U.S.C. §552a(e)(1), (5), (j), and (k) SI-18(2), Personally Identifiable Information Quality Operations | Data Tags*"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0290"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 89, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Supports redress and"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Supports redress and data integrity requirements for PII by providing a process for individuals to request correction of, or amendment to, their PII maintained by an organization. Agencies maintaining systems of records as defined by the Privacy Act must have a process in place to permit individuals to request amendment of a record pertaining to the individuals, subject to a published exemption. The process, when required, must comply with the Privacy Act requirements including but not limited to the ability to seek an administrative appeal, and the circumstances in which an individual can prepare a statement of disagreement. Guidance: Organizations maintaining a system of records as defined by the Privacy Act must provide a process to ensure that individuals can request amendments of, or correction to their records. Certain NSS may have a published exemption for this requirement. The SAOP, or designee, can provide information on what is required for a particular system. Reference(s): 5 U.S.C. §552a(c)(4), (d), and (h); OMB Circular A-130 SI-18(5), Personally Identifiable Information Quality Operations | Notice of Correction or Deletion"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0291"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 90, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Informing authorized recipients"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Informing authorized recipients of PII that the information has been corrected or deleted is critical to supporting data quality efforts when information is shared with other programs, processes, systems, or organizations. This notice provides the information practitioners need to make decisions about how to incorporate changes to PII in their data processing environment. Additionally, confirming to individuals or their designated representatives that a requested correction or deletion has been made fosters trust in the organization by demonstrating responsiveness to redress requests. Guidance: Organizations maintaining a system of records as defined by the Privacy Act must provide notice of correction or deletion to individuals who request such actions. Certain NSS may have a published exemption for this requirement. The SAOP, or designee, can provide information on what is required for a particular system. Reference(s): OMB Circular A-130 SI-19, DE-IDENTIFICATION"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0292"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 90, "anchor": "Justification to Select for Low, Moderate, and High: De-identification, when appropriate, directly"}
    kind: "should"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for Low, Moderate, and High: De-identification, when appropriate, directly supports the concept of minimization by removing the association between identifying data and the data subject. Due to its utility in reducing privacy risk to individuals and related risk to organizations, de-identification techniques should be employed as the default approach when practicable. Reference(s): OMB Circular A-130 SI-19(1), De-Identification | Collection*"
    status: "candidate"
    work_item: "WI-76"
