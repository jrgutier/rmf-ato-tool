requirements:
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0001"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 1, "anchor": "The Privacy Overlays support the Categorize and Select steps of the National"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "The Privacy Overlays support the Categorize and Select steps of the National Institute of Standards, and Technology (NIST) Risk Management Framework (RMF). The Privacy Overlays identify security and privacy control specifications required to protect Personally Identifiable Information (PII) in National Security Systems (NSS) and reduce privacy risks to individuals, agencies, and organizations throughout the information lifecycle. The Privacy Overlays do not supersede or change privacy requirements established by statutes, regulations, Executive Orders (EO), or applicable Federal policies or alter any agency authorities. Where certain activities are not required for NSS by relevant authorities, the Privacy Overlays may still require the activities for NSS to reduce privacy risk levels at as matter of policy. Agencies have significant flexibility in implementing the RMF, including these Privacy Overlays, as long as they are meeting all applicable requirements and effectively managing security and privacy risk. Systems used for activities under EO 12333, both classified and unclassified, process PII, including United States Persons Information (USPI) about U.S. citizens and lawful resident aliens, as well as information about foreign nationals.1 The Privacy Act of 1974, as amended, (hereinafter Privacy Act) protects records about U.S. citizens and lawful resident aliens (collectively called U.S. Persons, or USP) maintained in systems of records. Additional policies protect PII about U.S. citizens, lawful permanent residents, and foreign nationals.2 Therefore, NSS must apply the Privacy Overlays to protect PII about USP and foreign nationals.3 Note, applying the Privacy Overlays protects PII in NSS but does not create new legal obligations nor grant any new rights or privileges to individuals that did not already exist."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0002"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 1, "anchor": "PII about foreign nationals may present varied privacy and security risks to"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "PII about foreign nationals may present varied privacy and security risks to organizations and individuals. For example, inappropriate handling or release of PII about a foreign human source or PII collected from foreign communications may cause exceptionally grave damage to national security. Systems storing that information must receive commensurate protections to mitigate such risk."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0003"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 2, "anchor": "The Fair Information Practice Principles (FIPPs)5 inform Federal statutes and laws, including"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "The Fair Information Practice Principles (FIPPs)5 inform Federal statutes and laws, including the Privacy Act, and are critical to how the government approaches information management, including the processing of PII. Implementing the FIPPS, the Privacy Act established the requirement for “appropriate administrative, technical, and physical safeguards to ensure the security and confidentiality of records” and to “protect... the integrity” of systems. 6 Fifty years after the establishment of the Privacy Act, as technology and threats to technology evolve, organizations continue to modernize how they protect information. NIST Special Publication (SP) 800-53 provides the current catalog of security and privacy controls for federal systems to protect information. CNSSI No. 1253 Appendix D Tables D-1 through D-20 establish a Privacy Implementation Considerations column, which identifies controls that are not included in the privacy control baseline but may introduce privacy risk if selected to meet security objectives. CNSSI No. 1253 requires that the privacy control baseline must be selected regardless of whether or not the system processes PII. The Privacy Overlays complement the privacy control baseline by identifying additional controls that must be selected for systems that create, collect, use, process, store, maintain, disseminate, disclose, or dispose of (collectively referred to as “process”)7 PII based on the privacy risk for the system as discussed in this document. System owners must consult with the Senior Agency Official for Privacy (SAOP), or designee to determine the complete list of applicable privacy controls and privacy requirements for an NSS that processes PII. Building privacy safeguards into IT systems helps prevent the loss, breach, misuse, or abuse of data, or processing data in unintended ways."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0004"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 2, "anchor": "“Establish appropriate administrative, technical, and physical safeguards to ensure the security and"}
    kind: "indicative"
    locator: "1"
    context: ""
    statement: "“Establish appropriate administrative, technical, and physical safeguards to ensure the security and confidentiality of records and to protect against any unanticipated threats or hazards to their security or integrity which could result in substantial harm, embarrassment, inconvenience, or unfairness to any individual on whom information is maintained.” 5 U.S.C. §552a(e)(10)."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0005"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 3, "anchor": "Unclassified systems may have a privacy risk level of High. Top secret"}
    kind: "should"
    locator: "1"
    context: ""
    statement: "Unclassified systems may have a privacy risk level of High. Top secret systems may have a privacy risk level of Low."
    status: "candidate"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0006"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 3, "anchor": "For example, many tollbooths collect payment when drivers pass through using a"}
    kind: "modal"
    locator: "1"
    context: ""
    statement: "For example, many tollbooths collect payment when drivers pass through using a toll tag. The information collected during these transactions introduces a privacy risk by providing the ability to track the travel patterns and history of individuals. This privacy risk does not mean toll booth operators should stop collecting the information they need to collect payment. It does, however, mean that they need to be aware of the potential privacy risk and take measures to prevent that risk from being realized (e.g., carefully controlling the flow of the information, limiting who has access to the information)."
    status: "candidate"
