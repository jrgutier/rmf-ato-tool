    kind: "modal"
    locator: "4.2.b"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for Low, Moderate, and High: The confidentiality and integrity of PII must be assured in transit to provide adequate protection due to the sensitivity of PII. Protecting the confidentiality and integrity of information can be accomplished by physical or logical means. Parameter Value: Protect the confidentiality and integrity of transmitted information. Reference(s): 5 U.S.C. §552a(e)(5), (10); E-Government Act of 2002 (I; Pub. L. No. 107- 347), Title III; OMB Circular A-130 SC-12, CRYPTOGRAPHIC KEY ESTABLISHMENT AND MANAGEMENT"
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0274"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 83, "anchor": "Justification to Select for Low, Moderate, and High: CNSSP No. 15 requires"}
    kind: "modal"
    locator: "4.2.b"
    context: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES Guidance: When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the"
    statement: "Justification to Select for Low, Moderate, and High: CNSSP No. 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Use of cryptography is required to protect PII. Cryptographic key establishment and management must be performed such that even the loss of keys will not permit unauthorized access to PII. Per NSM-8 and NMM-2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit. Guidance: NSM-8 and NMM-2023-01 require all organizations use NSA-approved, public-standards-based cryptographic protocols to ensure widespread cryptographic interoperability among NSS. If mission-unique requirements preclude the use of public standards-based cryptographic protocols, NSA-approved mission unique protocols may be used."
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0275"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 83, "anchor": "Parameter Value: Establish and manage cryptographic keys when cryptography is employed within"}
