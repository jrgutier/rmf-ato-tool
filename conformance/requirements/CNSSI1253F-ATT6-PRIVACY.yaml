  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0279"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 85, "anchor": "Justification to Select for ACCT, Low, Moderate, and High: Cryptography provides protections"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for ACCT, Low, Moderate, and High: Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8 and NMM-2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit for all NSS. Parameter Value: Protect the confidentiality and integrity of the following information at rest: PII. Reference(s): 5 U.S.C. §552a(b) and (e)(10); EO 14028 Section 3.d; NSM-8 Section 1.b.iii-iv; OMB Circular A-130; OMB M-17-12 SC-28(1), Protection of Information at Rest | Cryptographic Protection"
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0280"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 85, "anchor": "Justification to Select for Low, Moderate, and High: Cryptography provides protections for"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for Low, Moderate, and High: Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8 and NMM- 2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit for all National Security Systems."
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0281"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 85, "anchor": "Justification to Select for Moderate and High: Cryptography provides protections for the"}
    kind: "modal"
    locator: "4.2.b"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for Moderate and High: Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8 and NMM-2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit for all NSS. Reference(s): 5 U.S.C. §552a(b) and (e)(10); EO 14028 Section 3.d; NSM-8, Section 1.b.iii; OMB Circular A-130 SI-1, SYSTEM AND INFORMATION INTEGRITY POLICY AND PROCEDURES – Included in the Privacy Control Baseline SI-4, SYSTEM MONITORING Justification to Select for Low, Moderate, and High: System monitoring is necessary for organizations to determine when security and privacy events occur and to determine when those events require further investigation to discern whether an incident or breach has occurred. It must be done in a way that protects the privacy of individuals and the data captured during monitoring. Guidance: System monitoring tools may capture PII of all types transacted during the monitoring period. Notice to users who are monitored should be provided prior to system use. Controls sufficient to protect the type of PII collected must be in place for the technology performing the monitoring, e.g., encryption of monitoring data that may contain PII. When conducting system monitoring on internal or external systems which may collect PII, the organization should coordinate with the organization’s counsel and cognizant privacy official. Reference(s): 5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130; OMB M-17-12 SI-7, SOFTWARE, FIRMWARE, AND INFORMATION INTEGRITY"
    status: "candidate"
    work_item: "WI-75"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0282"
