    kind: "lettered"
    locator: "4.2.a"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "a. Employ integrity verification tools to detect unauthorized changes to the following software, firmware, and information: PII, metadata that contains privacy attributes associated with information; Reference(s): 5 U.S.C. §552a(e)(5); OMB M-04-04; OMB Circular A-130 SI-7(6), Software, Firmware, and Information Integrity | Cryptographic Protection*"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0283"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 86, "anchor": "Justification to Recommend for Privacy Enhancing: Detection of unauthorized changes to PII"}
    kind: "modal"
    locator: "4.2.a"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Recommend for Privacy Enhancing: Detection of unauthorized changes to PII and systems containing PII is fundamental to ensuring data integrity. Guidance: Use FIPS-validated or NSA-approved to detect unauthorized changes to software, firmware, and information. NSA-approved or FIPS-validated cryptographic modules are the government standard for integrity verification. When PII requires integrity verification the organization must comply with these standards."
    status: "partial"
    reason: "Built: framework/baselines/overlay-specs.yaml carries this specification, checked against the overlay's summary table. Held: nothing a rule can fail. Unheld: the entry's sentences are prose no rule judges; the guidance for SI-7.6 is prose the SSP author reads through rmf catalog show --fields overlay; no rule judges it."
    evidence: [{"kind": "prose", "target": "personas/PER-PRIV.md", "claim": "presence", "asserts": "The privacy officer weighs the Privacy Enhancing control the overlay recommends, with its justification, at S-2"}]
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0284"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 87, "anchor": "Justification to Select for Moderate and High: Error messages can provide useful"}
    kind: "modal"
    locator: "4.2.a"
    context: "SC-13, CRYPTOGRAPHIC PROTECTION Parameter Value:"
    statement: "Justification to Select for Moderate and High: Error messages can provide useful insights into issues when operating a system. However, they can introduce privacy risk and practitioners must take care when constructing these messages to ensure the content and delivery of error messages do not inadvertently introduce privacy risk. Guidance: An error in a system may reveal PII. For example, if there is an error posting a form that contains PII and the system includes the PII entered in the form when it writes to the error log, it will be visible to whoever has access permissions to the error log. Therefore, error handling must be considered in the design of the system and access to errors containing PII should be provided only to those individuals with a need for that information in the performance of their duties. Parameter Values:"
    status: "candidate"
    work_item: "WI-76"
  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0285"
