  - id: "REQ-CNSSI1253F-ATT6-PRIVACY-0026"
    citation: {"ref": "CNSSI1253F-ATT6-PRIVACY", "page": 8, "anchor": "Asset information or unique alphanumeric string uniquely assigned to an individual device,"}
    kind: "lettered"
    locator: "3.•"
    context: "Example:"
    statement: "• Asset information or unique alphanumeric string uniquely assigned to an individual device, person, or small well-defined group of people (e.g., Internet Protocol (IP) address or Media Access Control (MAC) address, International Mobile Equipment Identity (IMEI), advertising identifier). 3.1.2. Data Elements that in Combination Identify an Individual (Compilation) Data elements that are indirect identifiers, or data that alone or without additional context does not identify an individual, will become PII when combined with other data elements about that individual or context whereby that combination is sufficient to enable identification. This is also referred to as the compilation or mosaic effect. The mosaic effect occurs, and data becomes PII, whether identification of individuals is inadvertent or intentional. These combined data elements may be linked or associated within a single data repository or system or may be linked or associated through data processing across multiple repositories, or when the data is used for the purpose of identifying individuals within specific mission contexts. Regardless of where or when this association occurs, it is important to evaluate if the association results in the ability to identify an individual. Additionally, if the purpose of combining the data elements is to determine the identity of the individual, then by definition the mosaic effect has occurred, and the data is PII. Instance #2: Data elements about an individual that, when combined, enable identification are PII."
    status: "partial"
    reason: "Device identifiers and combinations are named in the PII identification guidance only."
