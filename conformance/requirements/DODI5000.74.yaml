    statement: "(9) Metrics."
    status: "candidate"
  - id: "REQ-DODI5000.74-0144"
    citation: {"ref": "DODI5000.74", "page": 19, "anchor": "Performance management metrics should be considered to the maximum extent practicable during"}
    kind: "should"
    locator: "4.3.g.(9)"
    context: "SRRB SRRBs provide a process for senior leaders to assess, review, and validate services requirements. Requirements reviews should be appropriately tailored to include, but not be limited to:"
    statement: "Performance management metrics should be considered to the maximum extent practicable during the SRRB review and approval process."
    status: "candidate"
  - id: "REQ-DODI5000.74-0145"
    citation: {"ref": "DODI5000.74", "page": 19, "anchor": "SRRBs may be conducted on individual requirements. Comprehensive reviews enhance the quality"}
    kind: "lettered"
    locator: "4.3.h"
    context: "SRRB"
    statement: "h. SRRBs may be conducted on individual requirements. Comprehensive reviews enhance the quality of requirements prioritization and services requirements risk assessments. These reviews may be tiered at different levels of the organization as directed by DoD Component guidance."
    status: "candidate"
  - id: "REQ-DODI5000.74-0146"
    citation: {"ref": "DODI5000.74", "page": 19, "anchor": "Organizations must track SRRB results, to include review goals, the cost baseline"}
    kind: "lettered"
    locator: "4.3.i"
    context: "SRRB"
    statement: "i. Organizations must track SRRB results, to include review goals, the cost baseline of services requirements, number of services contracts in the organization and number reviewed, value of efficiencies identified, and impact on meeting small business and competition goals."
    status: "candidate"
  - id: "REQ-DODI5000.74-0147"
    citation: {"ref": "DODI5000.74", "page": 20, "anchor": "Although not required, organizations should consider integrating and aligning their SRRB forecasting"}
    kind: "lettered"
    locator: "4.3.j"
    context: "SRRB"
    statement: "j. Although not required, organizations should consider integrating and aligning their SRRB forecasting processes with program objective memorandum or other type of 5-year funding plans identifying the specific capabilities needed to meet planning guidance objectives for their mission."
    status: "candidate"
  - id: "REQ-DODI5000.74-0148"
    citation: {"ref": "DODI5000.74", "page": 20, "anchor": "The services acquisition strategy describes the plan to achieve the goals set"}
    kind: "lettered"
    locator: "4.4.a"
    context: "SERVICES ACQUISITION STRATEGY"
    statement: "a. The services acquisition strategy describes the plan to achieve the goals set in the services acquisition. The services acquisition strategy document is called an Acquisition Plan when the total cost of contracts for the acquisition program is estimated to be equal to or greater than the threshold described in Subpart 207.103(d)(i)(B) of the DFARS. The services acquisition strategy contains sufficient detail to allow senior leadership and the S-CAT decision authority to assess whether the strategy makes good business sense, effectively implements laws and policies, and reflects management’s priorities, including affordability."
    status: "candidate"
  - id: "REQ-DODI5000.74-0149"
    citation: {"ref": "DODI5000.74", "page": 20, "anchor": "Consistent with the size and complexity of the program, requiring activities will"}
    kind: "lettered"
    locator: "4.4.b"
    context: "SERVICES ACQUISITION STRATEGY"
    statement: "b. Consistent with the size and complexity of the program, requiring activities will prepare acquisition plans when the total cost of contracts for the acquisition program is estimated to be equal to or greater than the threshold described in Subpart 207.103(d)(i)(B) of DFARS. The contents of written acquisition plans must be consistent with Subpart 207.105 of the DFARS."
    status: "candidate"
  - id: "REQ-DODI5000.74-0150"
    citation: {"ref": "DODI5000.74", "page": 20, "anchor": "Requiring activities will document the management and oversight process for the acquisition"}
    kind: "lettered"
    locator: "4.4.c"
    context: "SERVICES ACQUISITION STRATEGY"
    statement: "c. Requiring activities will document the management and oversight process for the acquisition of services using streamlined documentation when the total cost of contracts for the acquisition program is estimated to be above the simplified acquisition threshold, but less than the threshold described in Subpart 207.103(d)(i)(B) of the DFARS. At a minimum, documentation for the management and oversight process for the acquisition of services will consider:"
    status: "candidate"
  - id: "REQ-DODI5000.74-0151"
    citation: {"ref": "DODI5000.74", "page": 20, "anchor": "Requirements development and management, which will include (tailored as appropriate):"}
    kind: "lettered"
    locator: "4.4.c.(1)"
    context: "SERVICES ACQUISITION STRATEGY Requiring activities will document the management and oversight process for the acquisition of services using streamlined documentation when the total cost of contracts f"
    statement: "(1) Requirements development and management, which will include (tailored as appropriate):"
    status: "candidate"
  - id: "REQ-DODI5000.74-0152"
    citation: {"ref": "DODI5000.74", "page": 20, "anchor": "The source of the requirement, the outcomes to be achieved and, if"}
    kind: "lettered"
    locator: "4.4.c.(1).(a)"
    context: "SERVICES ACQUISITION STRATEGY Requiring activities will document the management and oversight process for the acquisition of services using streamlined documentation when the total cost of contracts f"
    statement: "(a) The source of the requirement, the outcomes to be achieved and, if performance-based, what metrics will be used to measure the outcomes."
