    statement: "(4) Workforce Analysis."
    status: "candidate"
  - id: "REQ-DODI5000.74-0141"
    citation: {"ref": "DODI5000.74", "page": 19, "anchor": "An analysis of the decision to insource or outsource, including any past"}
    kind: "modal"
    locator: "4.3.g.(4)"
    context: "SRRB SRRBs provide a process for senior leaders to assess, review, and validate services requirements. Requirements reviews should be appropriately tailored to include, but not be limited to:"
    statement: "An analysis of the decision to insource or outsource, including any past decisions and why the requirement cannot be fulfilled with military or civilian personnel. Coordination with the DoD Component Manpower and Personnel officials should be done in accordance with DoD Directive 1100.4. The analysis should also take into consideration guidance outlined in DoDI 1100.22, DoDI 7041.04 and Office of Management and Budget Circular A-76/Section 2461 of Title 10, U.S.C. In addition, the OSBP is required to review and advise on any decisions to convert an activity performed by a small business concern to an activity performed by a federal employee."
    status: "candidate"
  - id: "REQ-DODI5000.74-0142"
    citation: {"ref": "DODI5000.74", "page": 19, "anchor": "A review and identification of contract and work functions that may be"}
    kind: "modal"
    locator: "4.3.g.(4)"
    context: "SRRB SRRBs provide a process for senior leaders to assess, review, and validate services requirements. Requirements reviews should be appropriately tailored to include, but not be limited to:"
    statement: "A review and identification of contract and work functions that may be prohibited or require heightened management attention, such as closely associated with inherently governmental functions or critical functions. For additional guidance on identification, SRRBs are recommended to use the DoD Handbook of Contract Function Checklists for Services Acquisition, as needed."
    status: "candidate"
  - id: "REQ-DODI5000.74-0143"
    citation: {"ref": "DODI5000.74", "page": 19, "anchor": "Metrics."}
    kind: "lettered"
    locator: "4.3.g.(9)"
