  - id: "REQ-DODI5000.74-0133"
    citation: {"ref": "DODI5000.74", "page": 18, "anchor": "Identify and document opportunities for savings and cost avoidance that may be"}
    kind: "lettered"
    locator: "4.3.e.(6)"
    context: "SRRB An SRRB will review requirements for services acquisitions and is led by the organization that requires those services. An SRRB will:"
    statement: "(6) Identify and document opportunities for savings and cost avoidance that may be realized through reduction in service delivery levels, outright cancellation to bring services requirements in-house in accordance with Section 2463 of Title 10, U.S.C., or elimination of the services altogether to fund higher-priority services requirements."
    status: "candidate"
  - id: "REQ-DODI5000.74-0134"
    citation: {"ref": "DODI5000.74", "page": 18, "anchor": "Requirements approval should be obtained from the assigned SRRB chair before financial"}
    kind: "lettered"
    locator: "4.3.f"
    context: "SRRB"
    statement: "f. Requirements approval should be obtained from the assigned SRRB chair before financial or contracting actions are initiated unless otherwise directed by the decision authority. The seniority of the SRRB chair will be commensurate with the complexity, contract value, and performance risk associated with the services requirement."
    status: "candidate"
  - id: "REQ-DODI5000.74-0135"
