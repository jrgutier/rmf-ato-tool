  - id: "REQ-DODI5000.74-0107"
    citation: {"ref": "DODI5000.74", "page": 15, "anchor": "S-CAT V"}
    kind: "table"
    locator: "3.5"
    context: "Table 1. S-CATs Decision Authorities"
    statement: "S-CAT V 1 Dollar threshold is determined based on the independent government cost estimate in current-year dollars, in accordance with the DoD Handbook for Services Acquisition, Independent Government Cost Estimate. 2 The “Special Interest” designation is typically based on one or more of these factors: Technological complexity; congressional or administration interest; a large commitment of resources; or whether the program is critical to the achievement of a capability or set of capabilities, part of a system of systems; or a joint program. 3 In accordance with DPC memorandum, “Approval of Changes to the Decision Authorities of DoD Components for Acquisition of Services,” dated June 21, 2016, as amended. 4 For services acquired in support of business systems; acquisition decision authorities will align with DoDI 5000.75. | Acquisitions of services with an estimated total value above the simplified acquisition threshold, but less than $10 million | Component SSM or designee"
