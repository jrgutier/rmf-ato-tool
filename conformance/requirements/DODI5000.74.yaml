  - id: "REQ-DODI5000.74-0011"
    citation: {"ref": "DODI5000.74", "page": 5, "anchor": "The overarching management principles that govern the defense acquisition system are described"}
    kind: "modal"
    locator: "1.2.a"
    context: "POLICY"
    statement: "The overarching management principles that govern the defense acquisition system are described in DoD Directive 5000.01, DoDI 5000.02, and DoDI 5000.02T. The purpose of the defense acquisition system is to deliver effective and affordable solutions to the end user while enabling execution at the speed of relevance. To achieve that objective, the DoD will employ an adaptive acquisition framework comprising acquisition pathways (see Figure 1), each tailored for the unique characteristics and risk profile of the capability being acquired. This issuance describes the responsibilities of principal acquisition officials and the purpose and key characteristics of the services acquisition pathway."
    status: "not-a-requirement"
    reason: "Background to the policy section. 'The DoD will employ an adaptive acquisition framework' restates DoDI 5000.02 as purpose text, and 'describes the responsibilities' only tells the reader what the issuance contains; neither 'will' nor 'responsibilities' binds an actor here. The operating duty sits in DoDI 5000.02."
  - id: "REQ-DODI5000.74-0012"
    citation: {"ref": "DODI5000.74", "page": 5, "anchor": "Acquisition of services is a command responsibility: unit, organization, and installation commanders"}
    kind: "lettered"
    locator: "1.2.b.(1)"
    context: "Figure 1. Adaptive Acquisition Framework General"
    statement: "(1) Acquisition of services is a command responsibility: unit, organization, and installation commanders are responsible for the appropriate, efficient, and effective acquisition of services by their organizations. Organizations will assign roles and responsibilities as outlined in this issuance."
    status: "deferred"
    reason: "'unit, organization, and installation commanders are responsible for' services acquisition, and 'Organizations will assign roles' for it: command ownership of buying services. No RMF run consumes or produces that assignment."
  - id: "REQ-DODI5000.74-0013"
