  - id: "REQ-DODI5000.74-0108"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "Responsibility for Services Acquisition Requirements Development."}
    kind: "lettered"
    locator: "4.1.a"
    context: "SERVICES ACQUISITION REQUIREMENTS DEVELOPMENT"
    statement: "a. Responsibility for Services Acquisition Requirements Development."
    status: "candidate"
  - id: "REQ-DODI5000.74-0109"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "The decision authority listed in Table 1 or designee is responsible for"}
    kind: "modal"
    locator: "4.1.a"
    context: "SERVICES ACQUISITION REQUIREMENTS DEVELOPMENT"
    statement: "The decision authority listed in Table 1 or designee is responsible for ensuring qualified FSMs oversee planning and execution of services acquisition requirements."
    status: "candidate"
  - id: "REQ-DODI5000.74-0110"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "The requiring activity will determine the need for an FSM with relevant"}
    kind: "lettered"
    locator: "4.1.a.(1)"
    context: "SERVICES ACQUISITION REQUIREMENTS DEVELOPMENT"
    statement: "(1) The requiring activity will determine the need for an FSM with relevant training and qualifications based on risk or complexity of the acquisition."
    status: "candidate"
  - id: "REQ-DODI5000.74-0111"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "In the absence of FSMs with relevant training and qualifications, an FSM"}
    kind: "lettered"
    locator: "4.1.a.(2)"
    context: "SERVICES ACQUISITION REQUIREMENTS DEVELOPMENT"
    statement: "(2) In the absence of FSMs with relevant training and qualifications, an FSM with functional expertise for a given services requirement will exercise management responsibilities and be trained in accordance with the tools included in Paragraph 4.8."
    status: "candidate"
  - id: "REQ-DODI5000.74-0112"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "The FSM and his or her project team should leverage the tools"}
    kind: "lettered"
    locator: "4.1.a.(3)"
    context: "SERVICES ACQUISITION REQUIREMENTS DEVELOPMENT"
    statement: "(3) The FSM and his or her project team should leverage the tools and checklists included in Paragraph 4.8."
    status: "candidate"
  - id: "REQ-DODI5000.74-0113"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "The FSM and his or her project team should consider costs of"}
    kind: "modal"
    locator: "4.1.b"
    context: "SERVICES ACQUISITION REQUIREMENTS DEVELOPMENT"
    statement: "The FSM and his or her project team should consider costs of labor skill mix and categories, service levels, frequency of performance, and dictated quality levels when developing the requirement to meet mission needs for services acquisition. Discrete costs of increased levels of service or the next-higher labor category must be weighed against mission needs and budget constraints to ensure the services to be acquired represent the best value to the government and meet mission requirements."
    status: "candidate"
  - id: "REQ-DODI5000.74-0114"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "The MFT will be led by the FSM assigned to the services"}
    kind: "lettered"
    locator: "4.2.a"
    context: "MFT GUIDELINES"
    statement: "a. The MFT will be led by the FSM assigned to the services acquisition requirement."
    status: "candidate"
  - id: "REQ-DODI5000.74-0115"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "The FSM must engage with all functional stakeholders during the MFT formation"}
    kind: "lettered"
    locator: "4.2.b"
    context: "MFT GUIDELINES"
    statement: "b. The FSM must engage with all functional stakeholders during the MFT formation process to ensure the team is adequately staffed with required skillsets and has coordinated any necessary training to execute the services acquisition."
    status: "candidate"
  - id: "REQ-DODI5000.74-0116"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "The MFT assembled to develop the requirements should be comprised of individuals"}
    kind: "lettered"
    locator: "4.2.c"
    context: "MFT GUIDELINES"
    statement: "c. The MFT assembled to develop the requirements should be comprised of individuals with various critical functional skills (including subject matter experts), and may be unique to an acquisition."
    status: "candidate"
  - id: "REQ-DODI5000.74-0117"
    citation: {"ref": "DODI5000.74", "page": 16, "anchor": "MFTs that support services acquisition requirements applicable to this issuance with a"}
    kind: "lettered"
    locator: "4.2.d"
    context: "MFT GUIDELINES"
    statement: "d. MFTs that support services acquisition requirements applicable to this issuance with a total contract value of $500 million or more or an annual value of $250 million or more must participate in a services acquisition workshop (SAW), or equivalent program, as provided by the Defense Acquisition University (DAU). For multiple award, indefinite delivery, indefinite quantity contracts, a SAW is not required for the base contract, but is required for any task order valued at $100 million or more. In cases where a SAW is required, it is required before a services acquisition strategy will be approved."
    status: "candidate"
  - id: "REQ-DODI5000.74-0118"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "MILDEP, Joint Command, and Fourth Estate Component SSMs must electronically submit an"}
    kind: "lettered"
    locator: "4.2.d.(1)"
    context: "MFT GUIDELINES"
    statement: "(1) MILDEP, Joint Command, and Fourth Estate Component SSMs must electronically submit an annual SAW 5-year forecast to SAW@dau.edu by October 1 each year. The 5-year forecast must provide the projected number of SAWs for each fiscal year including requirement names."
    status: "candidate"
  - id: "REQ-DODI5000.74-0119"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "Requiring activities may request a SAW that includes DAU staff consulting on"}
    kind: "lettered"
    locator: "4.2.d.(2)"
    context: "MFT GUIDELINES"
    statement: "(2) Requiring activities may request a SAW that includes DAU staff consulting on multiple-phase engagements during pre-award."
    status: "candidate"
  - id: "REQ-DODI5000.74-0120"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "SAW waivers may only be granted by the DoD Component SSM. For"}
    kind: "lettered"
    locator: "4.2.d.(3)"
    context: "MFT GUIDELINES"
    statement: "(3) SAW waivers may only be granted by the DoD Component SSM. For Special Interest acquisitions, SAW waivers may only be granted by the decision authority."
    status: "candidate"
  - id: "REQ-DODI5000.74-0121"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "Although not required, requiring activities should consider applying the SAW requirement to"}
    kind: "lettered"
    locator: "4.2.d.(4)"
    context: "MFT GUIDELINES"
    statement: "(4) Although not required, requiring activities should consider applying the SAW requirement to services acquisitions valued at $10 million or more, but less than the dollar cap set forth in subparagraph d above."
    status: "candidate"
  - id: "REQ-DODI5000.74-0122"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "The FSM or other personnel assigned to lead the MFT should understand"}
    kind: "lettered"
    locator: "4.2.e"
    context: "MFT GUIDELINES"
    statement: "e. The FSM or other personnel assigned to lead the MFT should understand the costs related to the services being acquired. The representative must apply a cost analysis outlining these discrete costs within the overall service requirement, coupled with initial market research and a thorough screening of the requirement against the anticipated costs of the proposed services to ensure an effective trade-off is made during the SRRB process between mission needs, cost, and affordability. This ensures only the highest-priority services describing well-defined mission requirements will be approved for acquisition."
    status: "candidate"
  - id: "REQ-DODI5000.74-0123"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "An SRRB process will be used to review, validate, prioritize, and approve"}
    kind: "lettered"
    locator: "4.3.a"
    context: "SRRB"
    statement: "a. An SRRB process will be used to review, validate, prioritize, and approve services requirements to accurately inform the budget and acquisition processes. The SRRB should also be conducted to build a contractual services forecast on an annual basis. A requirements review process is critical to the final cost, schedule, and performance of an acquired service and should be informed by current and accurate mission needs, spend data analysis, cost analysis, risk analysis, and initial market research."
    status: "candidate"
  - id: "REQ-DODI5000.74-0124"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "The SRRB will be conducted as early in the services acquisition process"}
    kind: "lettered"
    locator: "4.3.b"
    context: "SRRB"
    statement: "b. The SRRB will be conducted as early in the services acquisition process as practical before a procurement request package is transferred over to a DoD Component’s contracting office for execution. It will not be combined with contract review boards chaired by contracting authorities that occur throughout the year and are focused on approving individual contract actions before release of request for proposals."
    status: "candidate"
  - id: "REQ-DODI5000.74-0125"
    citation: {"ref": "DODI5000.74", "page": 17, "anchor": "DoD Components will use an SRRB process for services acquisitions with an"}
    kind: "lettered"
    locator: "4.3.c"
    context: "SRRB"
    statement: "c. DoD Components will use an SRRB process for services acquisitions with an estimated total value $10 million or more. For an indefinite delivery, indefinite quantity contract, this includes both the base contract and any task orders of $10 million or more. Although not required, decision authorities should consider screening for requirements with an estimated total value below $10 million which may benefit from the SRRB process."
    status: "candidate"
  - id: "REQ-DODI5000.74-0126"
    citation: {"ref": "DODI5000.74", "page": 18, "anchor": "Although not required, DoD Components should consider using Contractual Services Managers, SRRB"}
    kind: "lettered"
    locator: "4.3.d"
    context: "SRRB"
    statement: "d. Although not required, DoD Components should consider using Contractual Services Managers, SRRB engagement teams, or services acquisition management software tools if appropriate to track and streamline SRRB processes and work with the requiring activity before holding a board meeting."
    status: "candidate"
