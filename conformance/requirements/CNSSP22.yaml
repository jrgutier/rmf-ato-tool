  - id: "REQ-CNSSP22-0031"
    citation: {"ref": "CNSSP22", "page": 7, "anchor": "The following CNSS issuances are specific to establishing organization-wide Cybersecurity Risk Management"}
    kind: "lettered"
    locator: "1"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "1. The following CNSS issuances are specific to establishing organization-wide Cybersecurity Risk Management Programs within the national security community:"
    status: "not-a-requirement"
    reason: "Lead-in: 'The following CNSS issuances are specific to' introduces the two entries of Annex A paragraph 1 and only labels the list; the duty to implement Annex A issuances is REQ-CNSSP22-0023."
  - id: "REQ-CNSSP22-0032"
    citation: {"ref": "CNSSP22", "page": 7, "anchor": "CNSSI 1253, Security Categorization and Control Selection for National Security Systems (Reference"}
    kind: "lettered"
    locator: "a"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "a. CNSSI 1253, Security Categorization and Control Selection for National Security Systems (Reference 8), adopts the security controls catalogued in NIST SP 800-53, and concepts from FIPS PUB 199, as adapted for use with NSS. It also provides guidance for categorizing NSS and the information it processes, baseline sets of controls for NSS based on the system categorization, developing and applying overlays, and parameter values for security controls appropriate to set at the CNSS level. CNSSI 1253 is a companion document to the NIST publications relevant to categorization and selection (Reference 5)."
    status: "not-a-requirement"
    reason: "Description of another document: 'CNSSI 1253 ... adopts' and 'provides guidance' say what it contains; the duty to implement it is REQ-CNSSP22-0023 and its content has its own register."
  - id: "REQ-CNSSP22-0033"
    citation: {"ref": "CNSSP22", "page": 7, "anchor": "CNSSI 1254, Risk Management Framework Documentation, Data Element Standards, and Reciprocity Process"}
    kind: "lettered"
    locator: "b"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "b. CNSSI 1254, Risk Management Framework Documentation, Data Element Standards, and Reciprocity Process for National Security Systems (Reference 6), creates an integrated standard for data elements within RMF core documents to establish consistency and facilitate reciprocity across the NSS community. CNSSI 1254 is a companion document to the NIST publications relevant to Risk Management Framework documentation."
    status: "not-a-requirement"
    reason: "Description of another document: 'CNSSI 1254 ... creates an integrated standard' says what it is; the duties to use its data elements are REQ-CNSSP22-0020 and 0028, and it has its own register."
  - id: "REQ-CNSSP22-0034"
    citation: {"ref": "CNSSP22", "page": 7, "anchor": "The following documents are applicable to the national security community to establish"}
    kind: "lettered"
    locator: "b.2"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "2. The following documents are applicable to the national security community to establish an organization-wide Cybersecurity Risk Management Program:"
    status: "not-a-requirement"
    reason: "Lead-in: 'The following documents are applicable' introduces Annex A paragraph 2; each listed item, REQ-CNSSP22-0035 to 0040, carries its own applicability sentence, so this adds nothing."
  - id: "REQ-CNSSP22-0035"
    citation: {"ref": "CNSSP22", "page": 7, "anchor": "NIST SP 800-39, Managing Information Security Risk: Organization, Mission, and Information System"}
    kind: "lettered"
    locator: "a"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "a. NIST SP 800-39, Managing Information Security Risk: Organization, Mission, and Information System View (Reference 3), provides guidance for an integrated, organization-wide program for managing information security risk to organizational operations (i.e., mission, functions, image, and reputation), organizational assets, individuals, other organizations, and the Nation resulting from the operation and use of federal information systems. This document, as written, is applicable to organizations that employ NSS."
    status: "not-a-requirement"
    reason: "Applicability of a reference: 'NIST SP 800-39 ... provides guidance' and is applicable to NSS as written. It says which document applies; the library pins SP 800-39 and the tasks cite it, so the sentence binds no act."
    work_item: "WI-481"
  - id: "REQ-CNSSP22-0036"
    citation: {"ref": "CNSSP22", "page": 7, "anchor": "NIST SP 800-37, Guide for Applying the Risk Management Framework to Federal"}
    kind: "lettered"
    locator: "b"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "b. NIST SP 800-37, Guide for Applying the Risk Management Framework to Federal Information Systems (Reference 9), provides guidelines for applying the Risk Management Framework to federal information systems to include conducting the activities of security categorization, security control selection, implementation, security control assessment, information system authorization, and security control monitoring. This document, as written, is applicable to the organizations that employ NSS."
    status: "not-a-requirement"
    reason: "Applicability of a reference: 'NIST SP 800-37 ... provides guidelines for applying the RMF' and is applicable as written. It says which document applies; the framework's 47 tasks are that document, so the sentence binds no act."
    work_item: "WI-481"
  - id: "REQ-CNSSP22-0037"
    citation: {"ref": "CNSSP22", "page": 7, "anchor": "NIST SP 800-53, Security and Privacy Controls for Federal Information Systems and"}
    kind: "lettered"
    locator: "c"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "c. NIST SP 800-53, Security and Privacy Controls for Federal Information Systems and Organizations (Reference 5), provides guidance on the process for selecting security controls, as well as providing the security controls applicable to all federal government information systems. Portions of this document are applicable to the national security community, as described in CNSSI 1253 (Reference 8)."
    status: "not-a-requirement"
    reason: "Applicability of a reference: 'NIST SP 800-53 ... provides guidance' and portions apply as CNSSI 1253 describes. It says which document applies; the baseline resolver reads CNSSI 1253 and SP 800-53, so the sentence binds no act."
    work_item: "WI-481"
  - id: "REQ-CNSSP22-0038"
    citation: {"ref": "CNSSP22", "page": 8, "anchor": "NIST SP 800-53A, Assessing Security and Privacy Controls in Federal Information Systems"}
    kind: "lettered"
    locator: "d"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "d. NIST SP 800-53A, Assessing Security and Privacy Controls in Federal Information Systems and Organizations: Building Effective Assessment Plans (Reference 10), provides guidelines for building effective security assessment plans and a comprehensive set of procedures for assessing the effectiveness of security controls employed in information systems supporting the executive agencies of the federal government. This document, as written, is applicable to organizations that employ NSS. Supplemental documents may be necessary to address NSS-specific assessment requirements and recommendations for topics unique to NSS."
    status: "not-a-requirement"
    reason: "Applicability of a reference: 'NIST SP 800-53A ... provides guidelines for building effective security assessment plans' and is applicable as written. It says which document applies; the A tasks cite it, so the sentence binds no act."
    work_item: "WI-481"
  - id: "REQ-CNSSP22-0039"
    citation: {"ref": "CNSSP22", "page": 8, "anchor": "NIST SP 800-30, Guide for Conducting Risk Assessments (Reference 4), provides guidance"}
    kind: "lettered"
    locator: "e"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "e. NIST SP 800-30, Guide for Conducting Risk Assessments (Reference 4), provides guidance for conducting risk assessments of federal information systems and organizations, amplifying the guidance in NIST SP 800-39. This document provides guidance for carrying out each of the steps in the risk assessment process and how risk assessments and other organizational risk management processes complement and inform each other. This document, as written, is applicable to the organizations that employ NSS."
    status: "not-a-requirement"
    reason: "Applicability of a reference: 'NIST SP 800-30 ... provides guidance for conducting risk assessments' and is applicable as written. It says which document applies; P-3, P-14 and R-2 use it, so the sentence binds no act."
    work_item: "WI-481"
  - id: "REQ-CNSSP22-0040"
    citation: {"ref": "CNSSP22", "page": 8, "anchor": "Federal Information Processing Standard (FIPS) Publication (PUB) 199, Standards for Security Categorization"}
    kind: "lettered"
    locator: "f"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "f. Federal Information Processing Standard (FIPS) Publication (PUB) 199, Standards for Security Categorization of Federal Information and Information Systems (Reference 11), provides standards for categorizing information and information systems. The security categories are based on the potential impact on an organization should certain events occur which jeopardize the information and information systems needed by the organization to accomplish its assigned mission, protect its assets, fulfill its legal responsibilities, maintain its day-to-day functions, and protect individuals. Security categories are to be used in conjunction with vulnerability and threat information in assessing the risk to an organization. This document, as written, is applicable to organizations that employ NSS."
    status: "partial"
    reason: "Sentence 1 is held: CATG-001 fails a system categorized below the potential impact of its information types. Sentence 2 states the document's applicability to organizations that employ NSS, which no run record can break; the use of categories with threat and vulnerability information is C-2's input ART-RA, unheld by a rule."
    evidence: [{"kind": "rule", "target": "CATG-001", "fixture": "tests/fixtures/negative/CATG-001.yaml", "expect": "below the high-water mark", "claim": "constraint", "asserts": "The security categories are based on the potential impact on the organization: a system availability below the high-water mark of the information types' impact fails", "sentence": "The security categories are based on the potential impact on an organization should certain events occur which jeopardize the information and information systems needed by the organization to accomplish its assigned mission, protect its assets, fulfill its legal responsibilities, maintain its day-to-day functions, and protect individuals."}]
    work_item: "WI-481"
