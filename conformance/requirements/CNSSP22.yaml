  - id: "REQ-CNSSP22-0042"
    citation: {"ref": "CNSSP22", "page": 8, "anchor": "NIST SP 800-137, Information Security Continuous Monitoring (ISCM) for Federal Information Systems"}
    kind: "lettered"
    locator: "a"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "a. NIST SP 800-137, Information Security Continuous Monitoring (ISCM) for Federal Information Systems and Organizations (Reference 12), assists organizations in the development of an ISCM strategy and the implementation of an ISCM program that provides awareness of threats and vulnerabilities, visibility into organizational assets, and the effectiveness of deployed security controls."
    status: "not-a-requirement"
    reason: "Description of an optional document: 'NIST SP 800-137 ... assists organizations' says what it does; the ISCM duty is REQ-CNSSP22-0021."
  - id: "REQ-CNSSP22-0043"
    citation: {"ref": "CNSSP22", "page": 8, "anchor": "NIST SP 800-60 Volume I, Guide for Mapping Types of Information and"}
    kind: "lettered"
    locator: "b"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "b. NIST SP 800-60 Volume I, Guide for Mapping Types of Information and Types of Information Systems to Security Categories (Reference 13), addresses the FISMA direction to develop guidelines recommending the types of information and information systems to be included in each category of potential security impact. This guideline is intended to help agencies consistently map security impact levels to types of: (i) information (e.g., privacy, medical, proprietary, financial, contractor sensitive, trade secret, investigation); and (ii) information systems (e.g., mission critical, mission support, administrative)."
    status: "not-a-requirement"
    reason: "Description of an optional document: 'NIST SP 800-60 Volume I ... addresses the FISMA direction' and 'is intended to help agencies' give its purpose, not a duty on a reader."
  - id: "REQ-CNSSP22-0044"
    citation: {"ref": "CNSSP22", "page": 8, "anchor": "NIST SP 800-60 Volume II, Appendices to Guide for Mapping Types of"}
    kind: "lettered"
    locator: "c"
    context: "CYBERSECURITY RISK MANAGEMENT ISSUANCES"
    statement: "c. NIST SP 800-60 Volume II, Appendices to Guide for Mapping Types of Information and Types of Information Systems to Security Categories (Reference 14), includes security categorization recommendations and rationale for mission-based and management and support information types."
    status: "not-a-requirement"
    reason: "Description of an optional document: 'NIST SP 800-60 Volume II ... includes' categorization recommendations; it lists contents only."
