requirements:
  - id: "REQ-SP800-53R5-0001"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "Modern information systems1 can include a variety of computing platforms (e.g., industrial"}
    kind: "should"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "Modern information systems1 can include a variety of computing platforms (e.g., industrial control systems, general purpose computing systems, cyber-physical systems, super computers, weapons systems, communications systems, environmental control systems, medical devices, embedded devices, sensors, and mobile devices such as smart phones and tablets). These platforms all share a common foundation—computers with complex hardware, software and firmware providing a capability that supports the essential mission and business functions of organizations.2"
    status: "not-a-requirement"
    reason: "Background: what modern information systems 'can include' and the common foundation they share. A list of platforms with no actor."
  - id: "REQ-SP800-53R5-0002"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "Security controls are the safeguards or countermeasures employed within a system or"}
    kind: "modal"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "Security controls are the safeguards or countermeasures employed within a system or an organization to protect the confidentiality, integrity, and availability of the system and its information and to manage information security3 risk. Privacy controls are the administrative, technical, and physical safeguards employed within a system or an organization to manage privacy risks and to ensure compliance with applicable privacy requirements.4 Security and privacy controls are selected and implemented to satisfy security and privacy requirements levied on a system or organization. Security and privacy requirements are derived from applicable laws, executive orders, directives, regulations, policies, standards, and mission needs to ensure the confidentiality, integrity, and availability of information processed, stored, or transmitted and to manage risks to individual privacy."
    status: "not-a-requirement"
    reason: "Definitions of security and privacy controls and of where requirements come from. In 'mission needs to ensure', 'needs' is a noun followed by a purpose clause, so 'needs to' binds no one. The duty to select and implement is 0031."
  - id: "REQ-SP800-53R5-0003"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "The selection, design, and implementation of security and privacy controls5 are important"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "The selection, design, and implementation of security and privacy controls5 are important tasks that have significant implications for the operations6 and assets of organizations as well as the welfare of individuals and the Nation. Organizations should answer several key questions when addressing information security and privacy controls:"
    status: "not-a-requirement"
    reason: "Lead-in to three questions: 'Organizations should answer several key questions'. The 'should' has no content until the questions, and each question has its own verb and home, so it binds through 0004, 0005 and 0006, which stay live. The first sentence only says the tasks are important."
  - id: "REQ-SP800-53R5-0004"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "What security and privacy controls are needed to satisfy security and privacy"}
    kind: "lettered"
    locator: "INTRODUCTION.•"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS Organizations should answer several key questions when addressing information security and privacy controls:"
    statement: "• What security and privacy controls are needed to satisfy security and privacy requirements and to adequately manage mission/business risks or risks to individuals?"
    status: "covered"
    reason: "S-1 answers which controls are needed: rmf baseline resolve selects them for the categorization, and a baseline for another one fails GEN-STALE-001"
    evidence: [{"kind": "rule", "target": "GEN-STALE-001", "fixture": "tests/fixtures/negative/GEN-STALE-001.selection.yaml", "expect": "differs from a fresh `rmf baseline resolve`", "claim": "constraint", "asserts": "The controls needed to satisfy requirements and manage risks start from the baseline selected for the system: a baseline for another impact differs from a fresh baseline resolve"}]
  - id: "REQ-SP800-53R5-0005"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "Have the selected controls been implemented or is there a plan in"}
    kind: "lettered"
    locator: "INTRODUCTION.•"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS Organizations should answer several key questions when addressing information security and privacy controls:"
    statement: "• Have the selected controls been implemented or is there a plan in place to do so?"
    status: "partial"
    reason: "Proxy: a floor control of CFLR-001 recorded not-applicable in the SSP, neither implemented nor planned, fails; for the other selected controls the question is answered only by the status SSP-STAT-001 reads and the generic coverage rules."
    evidence: [{"kind": "rule", "target": "CFLR-001", "fixture": "tests/fixtures/negative/CFLR-001.ssp.yaml", "expect": "is recorded not-applicable in the SSP", "claim": "constraint", "asserts": "Have the selected controls been implemented or is there a plan: a selected control recorded not-applicable in the SSP fails"}]
    work_item: "WI-488"
  - id: "REQ-SP800-53R5-0006"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "What is the required level of assurance (i.e., grounds for confidence) that"}
    kind: "lettered"
    locator: "INTRODUCTION.•"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS Organizations should answer several key questions when addressing information security and privacy controls:"
    statement: "• What is the required level of assurance (i.e., grounds for confidence) that the selected controls, as designed and implemented, are effective?7 The answers to these questions are not given in isolation but rather in the context of a risk management process for the organization that identifies, assesses, responds to, and monitors security and privacy risks arising from its information and systems on an ongoing basis.8 The security and privacy controls in this publication are recommended for use by organizations to satisfy their information security and privacy requirements. The control catalog can be viewed as a toolbox containing a collection of safeguards, countermeasures, techniques, and processes to respond to security and privacy risks. The controls are employed as part of a well-defined risk management process that supports organizational information security and privacy programs. In turn, those information security and privacy programs lay the foundation for the success of the mission and business functions of the organization."
    status: "partial"
    reason: "The question of sentence 1 is answered by requirements.yaml engineering.assurance: SSE-002 fails a level of assurance carried by no requirement with an assurance measure. Sentences 2 to 4 describe the catalog (recommended for use, a toolbox, employed in a risk management process) and set no duty; they are listed for the user as noise."
    evidence: [{"kind": "rule", "target": "SSE-002", "fixture": "tests/fixtures/negative/SSE-002.carried.yaml", "expect": "the level of assurance is carried by no requirement of the traceability matrix with an assurance measure", "claim": "constraint", "asserts": "The required level of assurance that the selected controls are effective is stated: a level of assurance carried by no requirement with an assurance measure fails", "holds_when": "P-15 is in the run's scope", "sentence": "• What is the required level of assurance (i.e., grounds for confidence) that the selected controls, as designed and implemented, are effective?7"}]
    work_item: "WI-95"
  - id: "REQ-SP800-53R5-0007"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "The term organization describes an entity of any size, complexity, or positioning"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "The term organization describes an entity of any size, complexity, or positioning within an organizational structure (e.g., a federal agency or, as appropriate, any of its operational elements)."
    status: "not-a-requirement"
    reason: "Footnote 2: defines the term organization as an entity of any size or positioning."
  - id: "REQ-SP800-53R5-0008"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "The two terms information security and security are used synonymously in this"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "The two terms information security and security are used synonymously in this publication."
    status: "not-a-requirement"
    reason: "Footnote 3: a usage note, 'information security' and 'security' are synonyms here."
  - id: "REQ-SP800-53R5-0009"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "Controls provide safeguards and countermeasures in systems security and privacy engineering processes"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "Controls provide safeguards and countermeasures in systems security and privacy engineering processes to reduce risk during the system development life cycle."
    status: "not-a-requirement"
    reason: "Footnote 5: describes what controls provide in engineering processes, risk reduction during the life cycle. No actor."
  - id: "REQ-SP800-53R5-0010"
    citation: {"ref": "SP800-53R5", "page": 28, "anchor": "Security and privacy control effectiveness addresses the extent to which the controls"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "Security and privacy control effectiveness addresses the extent to which the controls are implemented correctly, operating as intended, and producing the desired outcome with respect to meeting the designated security and privacy requirements [SP 800-53A]."
    status: "not-a-requirement"
    reason: "Footnote 7: defines control effectiveness as the extent controls are implemented correctly, operating as intended and producing the desired outcome."
  - id: "REQ-SP800-53R5-0011"
    citation: {"ref": "SP800-53R5", "page": 29, "anchor": "It is important that responsible officials understand the security and privacy risks"}
    kind: "modal"
    locator: "INTRODUCTION"
    context: "THE NEED TO PROTECT INFORMATION, SYSTEMS, ORGANIZATIONS, AND INDIVIDUALS"
    statement: "It is important that responsible officials understand the security and privacy risks that could adversely affect organizational operations and assets, individuals, other organizations, and the Nation.9 These officials must also understand the current status of their security and privacy programs and the controls planned or in place to protect information, information systems, and organizations in order to make informed judgments and investments that respond to identified risks in an acceptable manner. The objective is to manage these risks through the selection and implementation of security and privacy controls."
    status: "candidate"
    reason: "ART-SECRPT and ART-RAR bring the posture and the risks to the AO and senior leaders; that officials understand them is no record a rule can break"
    work_item: "WI-481"
  - id: "REQ-SP800-53R5-0012"
    citation: {"ref": "SP800-53R5", "page": 29, "anchor": "This publication establishes controls for systems and organizations. The controls can be"}
    kind: "modal"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "This publication establishes controls for systems and organizations. The controls can be implemented within any organization or system that processes, stores, or transmits information. The use of these controls is mandatory for federal information systems10 in accordance with Office of Management and Budget (OMB) Circular A-130 [OMB A-130] and the provisions of the Federal Information Security Modernization Act11 [FISMA], which requires the implementation of minimum controls to protect federal information and information systems.12 This publication, along with other supporting NIST publications, is designed to help organizations identify the security and privacy controls needed to manage risk and to satisfy the security and privacy requirements in FISMA, the Privacy Act of 1974 [PRIVACT], OMB policies (e.g., [OMB A-130]), and designated Federal Information Processing Standards (FIPS), among others. It accomplishes this objective by providing a comprehensive and flexible catalog of security and privacy controls to meet current and future protection needs based on changing threats, vulnerabilities, requirements, and technologies. The publication also improves communication among organizations by providing a common lexicon that supports the discussion of security, privacy, and risk management concepts."
    status: "partial"
    reason: "Control-held: the mandatory controls are the baseline.json controls (GEN-STALE-001 holds the selection), each stated under PL-2 (SSP-COV-001) and assessed under CA-2 (SAR-COV-001); the first sentence is descriptive"
    evidence: [{"kind": "rule", "target": "GEN-STALE-001", "fixture": "tests/fixtures/negative/GEN-STALE-001.selection.yaml", "expect": "differs from a fresh `rmf baseline resolve`", "claim": "constraint", "asserts": "The use of these controls is mandatory for federal information systems: a baseline for another impact differs from a fresh baseline resolve", "sentence": "The use of these controls is mandatory for federal information systems10 in accordance with Office of Management and Budget (OMB) Circular A-130 [OMB A-130] and the provisions of the Federal Information Security Modernization Act11 [FISMA], which requires the implementation of minimum controls to protect federal information and information systems.12"}]
    work_item: "WI-488"
  - id: "REQ-SP800-53R5-0013"
    citation: {"ref": "SP800-53R5", "page": 29, "anchor": "Information systems that have been designated as national security systems, as defined"}
    kind: "indicative"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "Information systems that have been designated as national security systems, as defined in 44 U.S.C., Section 3542, are not subject to the requirements in [FISMA]. However, the controls established in this publication may be selected for national security systems as otherwise required (e.g., the Privacy Act of 1974) or with the approval of federal officials exercising policy authority over such systems. [CNSSP 22] and [CNSSI 1253] provide guidance for national security systems. [DODI 8510.01] provides guidance for the Department of Defense."
    status: "not-a-requirement"
    reason: "Footnote 11, applicability: NSS 'are not subject to the requirements in [FISMA]', and controls 'may be selected' where 'otherwise required' by another authority or with approval. 'Required' points to other authorities and binds no one in this document; a run takes the CNSSI 1253 and DoDI 8510.01 route the footnote names."
  - id: "REQ-SP800-53R5-0014"
    citation: {"ref": "SP800-53R5", "page": 29, "anchor": "While the controls established in this publication are mandatory for federal information"}
    kind: "should"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "While the controls established in this publication are mandatory for federal information systems and organizations, other organizations such as state, local, and tribal governments as well as private sector organizations are encouraged to consider using these guidelines, as appropriate. See [SP 800-53B] for federal control baselines."
    status: "not-a-requirement"
    reason: "Footnote 12: state, local and tribal governments and the private sector 'are encouraged to consider' these guidelines. 'Encouraged' is advice to parties outside any run, so it binds no one there. The clause that controls 'are mandatory' repeats the duty in 0012."
  - id: "REQ-SP800-53R5-0015"
    citation: {"ref": "SP800-53R5", "page": 30, "anchor": "Finally, the controls are independent of the process employed to select those"}
    kind: "indicative"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "Finally, the controls are independent of the process employed to select those controls. The control selection process can be part of an organization-wide risk management process, a systems engineering process [SP 800-160-1],13 the Risk Management Framework [SP 800-37], the Cybersecurity Framework [NIST CSF], or the Privacy Framework [NIST PF].14 The control selection criteria can be guided and informed by many factors, including mission and business needs, stakeholder protection needs, threats, vulnerabilities, and requirements to comply with federal laws, executive orders, directives, regulations, policies, standards, and guidelines. The combination of a catalog of security and privacy controls and a risk-based control selection process can help organizations comply with stated security and privacy requirements, obtain adequate security for their information systems, and protect the privacy of individuals."
    status: "not-a-requirement"
    reason: "Says the catalog is independent of the selection process: selection 'can be part of' several frameworks and 'can be guided' by many factors. A description of options; DoDI 8510.01 fixes the process for a run."
