  - id: "REQ-SP800-53R5-0029"
    citation: {"ref": "SP800-53R5", "page": 31, "anchor": "Organizations continuously assess the security and privacy risks to organizational operations and"}
    kind: "modal"
    locator: "1.3"
    context: "ORGANIZATIONAL RESPONSIBILITIES"
    statement: "Organizations continuously assess the security and privacy risks to organizational operations and assets, individuals, other organizations, and the Nation. Security and privacy risks arise from the planning and execution of organizational mission and business functions, placing information systems into operation, or continuing system operations. Realistic assessments of risk require a thorough understanding of the susceptibility to threats based on the specific vulnerabilities in information systems and organizations and the likelihood and potential adverse impacts of successful exploitations of such vulnerabilities by those threats.15 Risk assessments also require an understanding of privacy risks.16"
    status: "partial"
    reason: "the risk assessment guidance says how threats, vulnerabilities, likelihood and impact are understood; that assessments are realistic is not judged"
    evidence: [{"kind": "schema", "target": "framework/schema/org-context.schema.json#/properties/risk_assessment_guidance/properties/likelihood", "asserts": "Realistic assessments of risk rest on the likelihood and impact approach and on understanding vulnerabilities and threats", "claim": "presence"}]
    work_item: "WI-161"
  - id: "REQ-SP800-53R5-0030"
    citation: {"ref": "SP800-53R5", "page": 31, "anchor": "To address the organization’s concerns about assessment and determination of risk, security"}
    kind: "indicative"
    locator: "1.3"
    context: "ORGANIZATIONAL RESPONSIBILITIES"
    statement: "To address the organization’s concerns about assessment and determination of risk, security and privacy requirements are satisfied with the knowledge and understanding of the organizational risk management strategy.17 The risk management strategy considers the cost, schedule, performance, and supply chain issues associated with the design, development, acquisition, deployment, operation, sustainment, and disposal of organizational systems. A risk management process is then applied to manage risk on an ongoing basis.18"
    status: "candidate"
    reason: "P-2 records the strategy and tolerance R-2 and S-5 read; the cost, schedule, performance and supply chain issues the strategy considers are unheld"
    work_item: "WI-485"
  - id: "REQ-SP800-53R5-0031"
    citation: {"ref": "SP800-53R5", "page": 31, "anchor": "The catalog of security and privacy controls can be effectively used to"}
    kind: "modal"
    locator: "1.3"
    context: "ORGANIZATIONAL RESPONSIBILITIES"
    statement: "The catalog of security and privacy controls can be effectively used to protect organizations, individuals, and information systems from traditional and advanced persistent threats and privacy risks arising from the processing of personally identifiable information (PII) in varied operational, environmental, and technical scenarios. The controls can be used to demonstrate compliance with a variety of governmental, organizational, or institutional security and privacy requirements. Organizations have the responsibility to select the appropriate security and privacy controls, to implement the controls correctly, and to demonstrate the effectiveness of the controls in satisfying security and privacy requirements.19 Security and privacy controls can also be used in developing specialized baselines or overlays for unique or specialized missions or business applications, information systems, threat concerns, operational environments, technologies, or communities of interest.20"
    status: "candidate"
    work_item: "WI-03"
  - id: "REQ-SP800-53R5-0032"
    citation: {"ref": "SP800-53R5", "page": 32, "anchor": "This publication defines controls to satisfy a diverse set of security and"}
    kind: "indicative"
    locator: "1.4"
    context: "RELATIONSHIP TO OTHER PUBLICATIONS"
    statement: "This publication defines controls to satisfy a diverse set of security and privacy requirements that have been levied on information systems and organizations and that are consistent with and complementary to other recognized national and international information security and privacy standards. To develop a broadly applicable and technically sound set of controls for information systems and organizations, many sources were considered during the development of this publication. These sources included requirements and controls from the manufacturing, defense, financial, healthcare, transportation, energy, intelligence, industrial control, and audit communities as well as national and international standards organizations. In addition, the controls in this publication are used by the national security community in publications such as Committee on National Security Systems (CNSS) Instruction No. 1253 [CNSSI 1253] to provide guidance specific to systems designated as national security systems. Whenever possible, the controls have been mapped to international standards to help ensure maximum usability and applicability.22 The relationship of this publication to other risk management, security, privacy, and publications can be found at [FISMA IMP]."
    status: "not-a-requirement"
    reason: "Background on 1.4: the sources considered in writing the controls, CNSSI 1253's use of them, and the mapping to international standards. History of the publication."
  - id: "REQ-SP800-53R5-0033"
    citation: {"ref": "SP800-53R5", "page": 32, "anchor": "The security and privacy controls described in this publication represent the state-of-the-practice"}
    kind: "indicative"
    locator: "1.5"
    context: "REVISIONS AND EXTENSIONS"
    statement: "The security and privacy controls described in this publication represent the state-of-the-practice protection measures for individuals, information systems, and organizations. The controls are reviewed and revised periodically to reflect the experience gained from using the controls; new or revised laws, executive orders, directives, regulations, policies, and standards; changing security and privacy requirements; emerging threats, vulnerabilities, attack and information processing methods; and the availability of new technologies."
    status: "not-a-requirement"
    reason: "Describes the catalog's upkeep: controls 'are reviewed and revised periodically' as law and threats change. NIST maintains its own publication, and no reader acts on this."
  - id: "REQ-SP800-53R5-0034"
    citation: {"ref": "SP800-53R5", "page": 32, "anchor": "The security and privacy controls in the control catalog are also expected"}
    kind: "indicative"
    locator: "1.5"
    context: "REVISIONS AND EXTENSIONS"
    statement: "The security and privacy controls in the control catalog are also expected to change over time as controls are withdrawn, revised, and added. In addition to the need for change, the need for stability is addressed by requiring that proposed modifications to security and privacy controls go through a rigorous and transparent public review process to obtain public and private sector feedback and to build a consensus for such change. The review process provides a technically sound, flexible, and stable set of security and privacy controls for the organizations that use the control catalog."
    status: "not-a-requirement"
    reason: "Describes how NIST changes the catalog: controls 'are also expected to change', and proposals go through public review. 'Expected to' predicts and 'requiring' is NIST's own process, so neither binds a reader."
  - id: "REQ-SP800-53R5-0035"
    citation: {"ref": "SP800-53R5", "page": 33, "anchor": "Chapter Two describes the fundamental concepts associated with security and privacy controls,"}
    kind: "lettered"
    locator: "1.6.•"
    context: "PUBLICATION ORGANIZATION"
    statement: "• Chapter Two describes the fundamental concepts associated with security and privacy controls, including the structure of the controls, how the controls are organized in the consolidated catalog, control implementation approaches, the relationship between security and privacy controls, and trustworthiness and assurance."
    status: "not-a-requirement"
    reason: "Outline bullet: 'Chapter Two describes the fundamental concepts'. A table of contents in prose."
  - id: "REQ-SP800-53R5-0036"
    citation: {"ref": "SP800-53R5", "page": 33, "anchor": "Chapter Three provides a consolidated catalog of security and privacy controls including"}
    kind: "lettered"
    locator: "1.6.•"
    context: "PUBLICATION ORGANIZATION"
    statement: "• Chapter Three provides a consolidated catalog of security and privacy controls including a discussion section to explain the purpose of each control and to provide useful information regarding control implementation and assessment, a list of related controls to show the relationships and dependencies among controls, and a list of references to supporting publications that may be helpful to organizations."
    status: "not-a-requirement"
    reason: "Outline bullet: 'Chapter Three provides a consolidated catalog' with its discussion, related controls and references."
  - id: "REQ-SP800-53R5-0037"
    citation: {"ref": "SP800-53R5", "page": 33, "anchor": "References, Glossary, Acronyms, and Control Summaries provide additional information on the use"}
    kind: "lettered"
    locator: "1.6.•"
    context: "PUBLICATION ORGANIZATION"
    statement: "• References, Glossary, Acronyms, and Control Summaries provide additional information on the use of security and privacy controls.23"
