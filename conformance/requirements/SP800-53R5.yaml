    reason: "Outline bullet: the back matter 'provide additional information'."
  - id: "REQ-SP800-53R5-0038"
    citation: {"ref": "SP800-53R5", "page": 34, "anchor": "It is important to understand the relationship between requirements and controls. For"}
    kind: "indicative"
    locator: "2.1"
    context: "REQUIREMENTS AND CONTROLS"
    statement: "It is important to understand the relationship between requirements and controls. For federal information security and privacy policies, the term requirement is generally used to refer to information security and privacy obligations imposed on organizations. For example, [OMB A- 130] imposes information security and privacy requirements with which federal agencies must comply when managing information resources. The term requirement can also be used in a broader sense to refer to an expression of stakeholder protection needs for a particular system or organization. Stakeholder protection needs and the corresponding security and privacy requirements may be derived from many sources (e.g., laws, executive orders, directives, regulations, policies, standards, mission and business needs, or risk assessments). The term requirement, as used in this guideline, includes both legal and policy requirements, as well as an expression of the broader set of stakeholder protection needs that may be derived from other sources. All of these requirements, when applied to a system, help determine the necessary characteristics of the system—encompassing security, privacy, and assurance.24"
    status: "not-a-requirement"
    reason: "Defines 'requirement' as used in the guideline. 'must comply' sits in an example of what the word means, A-130's hold on federal agencies, so it binds no one here; A-130 reaches a run through 0012 and 0024."
  - id: "REQ-SP800-53R5-0039"
    citation: {"ref": "SP800-53R5", "page": 34, "anchor": "Organizations may divide security and privacy requirements into more granular categories, depending"}
    kind: "modal"
    locator: "2.1"
    context: "REQUIREMENTS AND CONTROLS"
    statement: "Organizations may divide security and privacy requirements into more granular categories, depending on where the requirements are employed in the system development life cycle (SDLC) and for what purpose. Organizations may use the term capability requirement to describe a capability that the system or organization must provide to satisfy a stakeholder protection need. In addition, organizations may refer to system requirements that pertain to particular hardware, software, and firmware components of a system as specification requirements—that is, capabilities that implement all or part of a control and that may be assessed (i.e., as part of the verification, validation, testing, and evaluation processes). Finally, organizations may use the term statement of work requirements to refer to actions that must be performed operationally or during system development."
    status: "not-a-requirement"
    reason: "Advisory: 'Organizations may divide' requirements and 'may use the term' for each category. An 'organizations may' permission over vocabulary. 'must provide' and 'must be performed' define those terms and bind no one."
  - id: "REQ-SP800-53R5-0040"
    citation: {"ref": "SP800-53R5", "page": 35, "anchor": "Controls can be viewed as descriptions of the safeguards and protection capabilities"}
    kind: "indicative"
    locator: "2.1"
    context: "REQUIREMENTS AND CONTROLS"
    statement: "Controls can be viewed as descriptions of the safeguards and protection capabilities appropriate for achieving the particular security and privacy objectives of the organization and reflecting the protection needs of organizational stakeholders. Controls are selected and implemented by the organization in order to satisfy the system requirements. Controls can include administrative, technical, and physical aspects. In some cases, the selection and implementation of a control may necessitate additional specification by the organization in the form of derived requirements or instantiated control parameter values. The derived requirements and control parameter values may be necessary to provide the appropriate level of implementation detail for particular controls within the SDLC."
    status: "not-a-requirement"
    reason: "Describes what controls are: 'can be viewed as descriptions', 'can include' aspects, 'may necessitate' derived requirements. 'Controls are selected and implemented by the organization' restates 0031 inside the description."
  - id: "REQ-SP800-53R5-0041"
    citation: {"ref": "SP800-53R5", "page": 35, "anchor": "Security and privacy controls described in this publication have a well-defined organization"}
    kind: "indicative"
    locator: "2.2"
    context: "CONTROL STRUCTURE AND ORGANIZATION"
    statement: "Security and privacy controls described in this publication have a well-defined organization and structure. For ease of use in the security and privacy control selection and specification process, controls are organized into 20 families.25 Each family contains controls that are related to the specific topic of the family. A two-character identifier uniquely identifies each control family (e.g., PS for Personnel Security). Security and privacy controls may involve aspects of policy, oversight, supervision, manual processes, and automated mechanisms that are implemented by systems or actions by individuals. Table 1 lists the security and privacy control families and their associated family identifiers."
    status: "not-a-requirement"
    reason: "Describes the catalog's layout: 20 families and two-character identifiers. Table 1 follows."
