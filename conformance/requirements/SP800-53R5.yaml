  - id: "REQ-SP800-53R5-0052"
    citation: {"ref": "SP800-53R5", "page": 35, "anchor": "Families of controls contain base controls and control enhancements, which are directly"}
    kind: "modal"
    locator: "2.2"
    context: "TABLE 1: SECURITY AND PRIVACY CONTROL FAMILIES"
    statement: "Families of controls contain base controls and control enhancements, which are directly related to their base controls. Control enhancements either add functionality or specificity to a base control or increase the strength of a base control. Control enhancements are used in systems and environments of operation that require greater protection than the protection provided by the base control. The need for organizations to select and implement control enhancements is due to the potential adverse organizational or individual impacts or when organizations require additions to the base control functionality or assurance based on assessments of risk. The selection and implementation of control enhancements always requires the selection and implementation of the base control."
    status: "partial"
    reason: "Selecting or implementing an enhancement without its base control fails; four sentences describe what enhancements are and why they are selected"
    evidence: [{"kind": "rule", "asserts": "The selection of control enhancements always requires the selection of the base control", "target": "TLR-007", "fixture": "tests/fixtures/negative/TLR-007.yaml", "expect": "is selected without the selection of its base control", "claim": "constraint", "holds_when": "S-1 or S-2 is active", "sentence": "The selection and implementation of control enhancements always requires the selection and implementation of the base control."}, {"kind": "rule", "asserts": "The implementation of control enhancements always requires the implementation of the base control", "target": "TLR-007", "fixture": "tests/fixtures/negative/TLR-007.base.yaml", "expect": "and the implementation of its base control", "claim": "constraint", "holds_when": "S-1 or S-2 is active", "sentence": "The selection and implementation of control enhancements always requires the selection and implementation of the base control."}]
    work_item: "WI-327"
  - id: "REQ-SP800-53R5-0053"
    citation: {"ref": "SP800-53R5", "page": 36, "anchor": "The families are arranged in alphabetical order, while the controls and control"}
    kind: "indicative"
    locator: "2.2"
    context: "TABLE 1: SECURITY AND PRIVACY CONTROL FAMILIES"
    statement: "The families are arranged in alphabetical order, while the controls and control enhancements within each family are in numerical order. The order of the families, controls, and control enhancements does not imply any logical progression, level of prioritization or importance, or order in which the controls or control enhancements are to be implemented. Rather, it reflects the order in which they were included in the catalog. Control designations are not re-used when a control is withdrawn."
    status: "not-a-requirement"
    reason: "Describes the catalog's ordering: alphabetical families, order 'does not imply' priority, and designations 'are not re-used'. NIST's numbering convention, with no duty on a reader."
  - id: "REQ-SP800-53R5-0054"
    citation: {"ref": "SP800-53R5", "page": 36, "anchor": "The control section prescribes a security or privacy capability to be implemented."}
    kind: "modal"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "The control section prescribes a security or privacy capability to be implemented. Security and privacy capabilities are achieved by the activities or actions, automated or nonautomated, carried out by information systems and organizations. Organizations designate the responsibility for control development, implementation, assessment, and monitoring. Organizations have the flexibility to implement the controls selected in whatever manner that satisfies organizational mission or business needs consistent with law, regulation, and policy."
    status: "partial"
    reason: "Every SSP statement names the roles responsible for developing and implementing the control (ssp-controls responsible_roles, required, at least one persona); responsibility for assessment (the SAP team) and monitoring (the conmon frequencies) is held by other records no item here cites. 'Organizations have the flexibility' is a permission and the opening sentences describe the control section."
    evidence: [{"kind": "schema", "target": "framework/schema/ssp-controls.schema.json#/properties/controls/items/properties/responsible_roles", "claim": "constraint", "asserts": "Organizations designate the responsibility for control development and implementation: every SSP statement names the roles responsible for developing and implementing the control"}]
    work_item: "WI-488"
  - id: "REQ-SP800-53R5-0055"
    citation: {"ref": "SP800-53R5", "page": 37, "anchor": "The discussion section provides additional information about a control. Organizations can use"}
    kind: "indicative"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "The discussion section provides additional information about a control. Organizations can use the information as needed when developing, tailoring, implementing, assessing, or monitoring controls. The information provides important considerations for implementing controls based on mission or business requirements, operational environments, or assessments of risk. The additional information can also explain the purpose of controls and often includes examples. Control enhancements may also include a separate discussion section when the discussion information is applicable only to a specific control enhancement."
    status: "not-a-requirement"
    reason: "Describes the discussion section; 'Organizations can use the information as needed' is an advisory permission."
  - id: "REQ-SP800-53R5-0056"
    citation: {"ref": "SP800-53R5", "page": 37, "anchor": "The related controls section provides a list of controls from the control"}
    kind: "indicative"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "The related controls section provides a list of controls from the control catalog that impact or support the implementation of a particular control or control enhancement, address a related security or privacy capability, or are referenced in the discussion section. Control enhancements are inherently related to their base control. Thus, related controls that are referenced in the base control are not repeated in the control enhancements. However, there may be related controls identified for control enhancements that are not referenced in the base control (i.e., the related control is only associated with the specific control enhancement). Controls may also be related to enhancements of other base controls. When a control is designated as a related control, a corresponding designation is made on that control in its source location in the catalog to illustrate the two-way relationship. Additionally, each control in a given family is inherently related to the -1 control (Policy and Procedures) in the same family. Therefore, the relationship between the -1 control and the other controls in the same family is not specified in the related controls section for each control."
    status: "not-a-requirement"
    reason: "Describes the related controls section and how two-way relations are marked in the catalog, including the implicit link to each -1 control. A reader's guide."
  - id: "REQ-SP800-53R5-0057"
    citation: {"ref": "SP800-53R5", "page": 37, "anchor": "The control enhancements section provides statements of security and privacy capability that"}
    kind: "indicative"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "The control enhancements section provides statements of security and privacy capability that augment a base control. The control enhancements are numbered sequentially within each control so that the enhancements can be easily identified when selected to supplement the base control. Each control enhancement has a short subtitle to indicate the intended function or capability provided by the enhancement. In the AU-4 example, if the control enhancement is selected, the control designation becomes AU-4(1). The numerical designation of a control enhancement is used only to identify that enhancement within the control. The designation is not indicative of the strength of the control enhancement, level of protection, priority, degree of importance, or any hierarchical relationship among the enhancements. Control enhancements are not intended to be selected independently. That is, if a control enhancement is selected, then the corresponding base control is also selected and implemented."
    status: "partial"
    reason: "Selecting or implementing an enhancement without its base control fails; three sentences describe how enhancements are numbered"
    evidence: [{"kind": "rule", "asserts": "Control enhancements are not selected independently of the base control", "target": "TLR-007", "fixture": "tests/fixtures/negative/TLR-007.yaml", "expect": "is selected without the selection of its base control", "claim": "constraint", "holds_when": "S-1 or S-2 is active", "sentence": "Control enhancements are not intended to be selected independently."}, {"kind": "rule", "asserts": "If a control enhancement is selected, the corresponding base control is also selected and implemented", "target": "TLR-007", "fixture": "tests/fixtures/negative/TLR-007.base.yaml", "expect": "and the implementation of its base control", "claim": "constraint", "holds_when": "S-1 or S-2 is active", "sentence": "That is, if a control enhancement is selected, then the corresponding base control is also selected and implemented."}]
    work_item: "WI-327"
  - id: "REQ-SP800-53R5-0058"
    citation: {"ref": "SP800-53R5", "page": 37, "anchor": "The references section includes a list of applicable laws, policies, standards, guidelines,"}
    kind: "indicative"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "The references section includes a list of applicable laws, policies, standards, guidelines, websites, and other useful references that are relevant to a specific control or control enhancement.26 The references section also includes hyperlinks to publications for obtaining additional information for control development, implementation, assessment, and monitoring. For some controls, additional flexibility is provided by allowing organizations to define specific values for designated parameters associated with the controls. Flexibility is achieved as part of a tailoring process using assignment and selection operations embedded within the controls and enclosed by brackets. The assignment and selection operations give organizations the capability to customize controls based on organizational security and privacy requirements. In contrast to assignment operations which allow complete flexibility in the designation of parameter values, selection operations narrow the range of potential values by providing a specific list of items from which organizations choose."
    status: "not-a-requirement"
    reason: "Describes the references section, then says what assignment and selection operations are and that they 'give organizations the capability' to customize. Explains a mechanism; the duty to set values sits in S-2."
  - id: "REQ-SP800-53R5-0059"
    citation: {"ref": "SP800-53R5", "page": 37, "anchor": "References are provided to assist organizations in understanding and implementing the security"}
    kind: "indicative"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "References are provided to assist organizations in understanding and implementing the security and privacy controls and are not intended to be inclusive or complete."
    status: "not-a-requirement"
    reason: "Footnote 26: references 'are provided to assist' and are not complete. A note on the list."
  - id: "REQ-SP800-53R5-0060"
    citation: {"ref": "SP800-53R5", "page": 38, "anchor": "Determination of the organization-defined parameters can evolve from many sources, including laws,"}
    kind: "indicative"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "Determination of the organization-defined parameters can evolve from many sources, including laws, executive orders, directives, regulations, policies, standards, guidance, and mission or business needs. Organizational risk assessments and risk tolerance are also important factors in determining the values for control parameters. Once specified by the organization, the values for the assignment and selection operations become a part of the control. Organization-defined control parameters used in the base controls also apply to the control enhancements associated with those controls. The implementation of the control is assessed for effectiveness against the completed control statement."
    status: "candidate"
    reason: "Parameter values become part of the control in the OSCAL SSP (rmf build set-parameters) and A-3 assesses against the SSP as stated; tool code and prose FW-REQ-003 cannot cite"
    work_item: "WI-480"
  - id: "REQ-SP800-53R5-0061"
    citation: {"ref": "SP800-53R5", "page": 38, "anchor": "In addition to assignment and selection operations embedded in a control, additional"}
    kind: "indicative"
    locator: "2.2"
    context: "FIGURE 1: CONTROL STRUCTURE"
    statement: "In addition to assignment and selection operations embedded in a control, additional flexibility is achieved through iteration and refinement actions. Iteration allows organizations to use a control multiple times with different assignment and selection values, perhaps being applied in different situations or when implementing multiple policies. For example, an organization may have multiple systems implementing a control but with different parameters established to address different risks for each system and environment of operation. Refinement is the process of providing additional implementation detail to a control. Refinement can also be used to narrow the scope of a control in conjunction with iteration to cover all applicable scopes (e.g., applying different authentication mechanisms to different system interfaces). The combination of assignment and selection operations and iteration and refinement actions when applied to controls provides the needed flexibility to allow organizations to satisfy a broad base of security and privacy requirements at the organization, mission and business process, and system levels of implementation."
    status: "not-a-requirement"
    reason: "Explains iteration and refinement: 'Iteration allows organizations to use a control multiple times', 'Refinement is the process'. A definition with an example of an organization that 'may have multiple systems'."
  - id: "REQ-SP800-53R5-0062"
    citation: {"ref": "SP800-53R5", "page": 38, "anchor": "There are three approaches to implementing the controls in Chapter Three: (1)"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL IMPLEMENTATION APPROACHES"
    statement: "There are three approaches to implementing the controls in Chapter Three: (1) a common (inheritable) control implementation approach, (2) a system-specific control implementation approach, and (3) a hybrid control implementation approach. The control implementation approaches define the scope of applicability for the control, the shared nature or inheritability of the control, and the responsibility for control development, implementation, assessment, and authorization. Each control implementation approach has a specific objective and focus that helps organizations select the appropriate controls, implement the controls in an effective manner, and satisfy security and privacy requirements. A specific control implementation approach may achieve cost benefits by leveraging security and privacy capabilities across multiple systems and environments of operation.27"
    status: "not-a-requirement"
    reason: "Names the three implementation approaches and says what they 'define', among them 'the responsibility' for development through authorization. A definition that assigns no responsibility, so the word binds no one. The assignment is in 0065."
  - id: "REQ-SP800-53R5-0063"
    citation: {"ref": "SP800-53R5", "page": 39, "anchor": "Common controls are controls whose implementation results in a capability that is"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL IMPLEMENTATION APPROACHES"
    statement: "Common controls are controls whose implementation results in a capability that is inheritable by multiple systems or programs. A control is deemed inheritable when the system or program receives protection from the implemented control, but the control is developed, implemented, assessed, authorized, and monitored by an internal or external entity other than the entity responsible for the system or program. The security and privacy capabilities provided by common controls can be inherited from many sources, including mission or business lines, organizations, enclaves, environments of operation, sites, or other systems or programs. Implementing controls as common controls can introduce the risk of a single point of failure."
    status: "not-a-requirement"
    reason: "Defines common controls and inheritability. 'the entity responsible for the system' identifies who a provider differs from and assigns nothing, so 'responsible for' binds no one. 'can introduce the risk of a single point of failure' is an observation."
  - id: "REQ-SP800-53R5-0064"
    citation: {"ref": "SP800-53R5", "page": 39, "anchor": "Many of the controls needed to protect organizational information systems—including many physical"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL IMPLEMENTATION APPROACHES"
    statement: "Many of the controls needed to protect organizational information systems—including many physical and environmental protection controls, personnel security controls, and incident response controls—are inheritable and, therefore, are good candidates for common control status. Common controls can also include technology-based controls, such as identification and authentication controls, boundary protection controls, audit and accountability controls, and access controls. The cost of development, implementation, assessment, authorization, and monitoring can be amortized across multiple systems, organizational elements, and programs using the common control implementation approach."
    status: "not-a-requirement"
    reason: "Examples of controls that 'are good candidates for common control status', and the cost case for amortizing them. Advice with no actor; P-5 identifies a run's common controls. 'Accountability' only names the audit and accountability controls in the list, so it binds no one."
  - id: "REQ-SP800-53R5-0065"
    citation: {"ref": "SP800-53R5", "page": 39, "anchor": "Controls not implemented as common controls are implemented as system-specific or hybrid"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL IMPLEMENTATION APPROACHES"
    statement: "Controls not implemented as common controls are implemented as system-specific or hybrid controls. System-specific controls are the primary responsibility of the system owner and the authorizing official for a given system. Implementing system-specific controls can introduce risk if the control implementations are not interoperable with common controls. Organizations can implement a control as hybrid if one part of the control is common (inheritable) and the other part is system-specific. For example, an organization may implement control CP-2 using a predefined template for the contingency plan for all organizational information systems with individual system owners tailoring the plan for system-specific uses, where appropriate. The division of a hybrid control into its common (inheritable) and system-specific parts may vary by organization, depending on the types of information technologies employed, the approach used by the organization to manage its controls, and assignment of responsibilities. When a control is implemented as a hybrid control, the common control provider is responsible for ensuring the implementation, assessment, and monitoring of the common part of the hybrid control, and the system owner is responsible for ensuring the implementation, assessment, and monitoring of the system-specific part of the hybrid control. Implementing controls as hybrid controls can introduce risk if the responsibility for the implementation and ongoing management of the common and system-specific parts of the controls is unclear."
    status: "partial"
    reason: "how hybrid controls divide between provider and system is not recorded here; the provider's controls are"
    evidence: [{"kind": "schema", "target": "framework/schema/org-context.schema.json#/properties/common_controls/items/properties/controls", "asserts": "The common controls of a provider are recorded; controls not implemented as common controls are system-specific or hybrid", "claim": "constraint"}]
    work_item: "WI-156"
  - id: "REQ-SP800-53R5-0066"
    citation: {"ref": "SP800-53R5", "page": 39, "anchor": "The determination as to the appropriate control implementation approach (i.e., common, hybrid,"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL IMPLEMENTATION APPROACHES"
    statement: "The determination as to the appropriate control implementation approach (i.e., common, hybrid, or system-specific) is context-dependent. The control implementation approach cannot be determined to be common, hybrid, or system-specific simply based on the language of the control. Identifying the control implementation approach can result in significant savings to organizations in implementation and assessment costs and a more consistent application of the controls organization-wide. Typically, the identification of the control implementation approach is straightforward. However, the implementation takes significant planning and coordination."
    status: "not-a-requirement"
    reason: "Observation that the approach is context-dependent: it 'cannot be determined' from a control's language. 'Cannot' states a limit of reading and binds no one; designating is the duty S-3 holds (0068 for how). The rest is cost benefit."
  - id: "REQ-SP800-53R5-0067"
    citation: {"ref": "SP800-53R5", "page": 39, "anchor": "[SP 800-37] provides additional guidance on control implementation approaches (formerly referred to"}
    kind: "indicative"
    locator: "2.3"
    context: "CONTROL IMPLEMENTATION APPROACHES"
    statement: "[SP 800-37] provides additional guidance on control implementation approaches (formerly referred to as control designations) and how the different approaches are used in the Risk Management Framework."
    status: "not-a-requirement"
    reason: "Footnote 27: a pointer to SP 800-37 for more on implementation approaches."
  - id: "REQ-SP800-53R5-0068"
    citation: {"ref": "SP800-53R5", "page": 40, "anchor": "Planning for the implementation approach of a control (i.e., common, hybrid, or"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL IMPLEMENTATION APPROACHES"
    statement: "Planning for the implementation approach of a control (i.e., common, hybrid, or system-specific) is best carried out early in the system development life cycle and coordinated with the entities providing the control [SP 800-37]. Similarly, if a control is to be inheritable, coordination is required with the inheriting entity to ensure that the control meets its needs. This is especially important given the nature of control parameters. An inheriting entity cannot assume that controls are the same and mitigate the appropriate risk to the system just because the control identifiers (e.g., AC-1) are the same. It is essential to examine the control parameters (e.g., assignment or selection operations) when determining if a common control is adequate to mitigate system-specific risks."
    status: "partial"
    reason: "A determination per provider is required and checked for the deciders and commensurate protection; that the parameters were examined is the run's recorded answer, since the provider's parameter values are not in the run"
    evidence: [{"kind": "rule", "asserts": "If a control is to be inheritable, the inheriting entity records that the control meets its needs", "target": "TLR-010", "fixture": "tests/fixtures/negative/TLR-010.yaml", "expect": "and no determination records that its common controls protect the system commensurate with risk", "claim": "constraint", "holds_when": "S-3 is active", "sentence": "Similarly, if a control is to be inheritable, coordination is required with the inheriting entity to ensure that the control meets its needs."}, {"kind": "rule", "asserts": "An inheriting entity cannot assume controls mitigate the appropriate risk just because the control identifiers are the same", "target": "TLR-010", "fixture": "tests/fixtures/negative/TLR-010.commensurate.yaml", "expect": "whose common controls are not determined to provide protection commensurate with risk", "claim": "constraint", "holds_when": "S-3 is active", "sentence": "An inheriting entity cannot assume that controls are the same and mitigate the appropriate risk to the system just because the control identifiers (e.g., AC-1) are the same."}, {"kind": "rule", "asserts": "Examine the control parameters when determining if a common control is adequate to mitigate system-specific risks", "target": "TLR-010", "fixture": "tests/fixtures/negative/TLR-010.parameters.yaml", "expect": "does not examine the control parameters", "claim": "constraint", "holds_when": "S-3 is active", "sentence": "It is essential to examine the control parameters (e.g., assignment or selection operations) when determining if a common control is adequate to mitigate system-specific risks."}]
    work_item: "WI-222"
  - id: "REQ-SP800-53R5-0069"
    citation: {"ref": "SP800-53R5", "page": 40, "anchor": "The selection and implementation of security and privacy controls reflect the objectives"}
    kind: "modal"
    locator: "2.4"
    context: "SECURITY AND PRIVACY CONTROLS"
    statement: "The selection and implementation of security and privacy controls reflect the objectives of information security and privacy programs and how those programs manage their respective risks. Depending on the circumstances, these objectives and risks can be independent or overlapping. Federal information security programs are responsible for protecting information and information systems from unauthorized access, use, disclosure, disruption, modification, or destruction (i.e., unauthorized activity or system behavior) to provide confidentiality, integrity, and availability. Those programs are also responsible for managing security risk and for ensuring compliance with applicable security requirements. Federal privacy programs are responsible for managing risks to individuals associated with the creation, collection, use, processing, storage, maintenance, dissemination, disclosure, or disposal (collectively referred to as “processing”) of PII and for ensuring compliance with applicable privacy requirements.28 When a system processes PII, the information security program and the privacy program have a shared responsibility for managing the security risks for the PII in the system. Due to this overlap in responsibilities, the controls that organizations select to manage these security risks will generally be the same regardless of their designation as security or privacy controls in control baselines or program or system plans."
    status: "candidate"
    reason: "PER-CISO and PER-PRIV carry the two programs, both assigned at P-1 and sharing tasks in the RACI; the sentences state the programs' responsibilities, which no run record can break"
    work_item: "WI-481"
  - id: "REQ-SP800-53R5-0070"
    citation: {"ref": "SP800-53R5", "page": 40, "anchor": "There also may be circumstances in which the selection and/or implementation of"}
    kind: "should"
    locator: "2.4"
    context: "SECURITY AND PRIVACY CONTROLS"
    statement: "There also may be circumstances in which the selection and/or implementation of the control or control enhancement affects the ability of a program to achieve its objectives and manage its respective risks. The control discussion section may highlight specific security and/or privacy considerations so that organizations can take these considerations into account as they determine the most effective method to implement the control. However, these considerations are not exhaustive."
    status: "not-a-requirement"
    reason: "Says a control's discussion 'may highlight' considerations so organizations 'can take' them into account. Describes the catalog, with no list of considerations and no duty."
  - id: "REQ-SP800-53R5-0071"
    citation: {"ref": "SP800-53R5", "page": 40, "anchor": "For example, an organization might select AU-3 (Content of Audit Records) to"}
    kind: "should"
    locator: "2.4"
    context: "SECURITY AND PRIVACY CONTROLS"
    statement: "For example, an organization might select AU-3 (Content of Audit Records) to support monitoring for unauthorized access to an information asset that does not include PII. Since the potential loss of confidentiality of the information asset does not affect privacy, security objectives are the primary driver for the selection of the control. However, the implementation of the control with respect to monitoring for unauthorized access could involve the processing of PII which may result in privacy risks and affect privacy program objectives. The discussion section in AU-3 includes privacy risk considerations so that organizations can take those considerations into account as they determine the best way to implement the control. Additionally, the control enhancement AU-3(3) (Limit Personally Identifiable Information Elements) could be selected to support managing these privacy risks."
    status: "not-a-requirement"
    reason: "Worked example: 'an organization might select AU-3', and AU-3(3) 'could be selected'. It shows one choice and its privacy side effect."
  - id: "REQ-SP800-53R5-0072"
    citation: {"ref": "SP800-53R5", "page": 40, "anchor": "Privacy programs may also choose to consider the risks to individuals that"}
    kind: "modal"
    locator: "2.4"
    context: "SECURITY AND PRIVACY CONTROLS"
    statement: "Privacy programs may also choose to consider the risks to individuals that may arise from their interactions with information systems, where the processing of personally identifiable information may be less impactful than the effect that the system has on individuals’ behavior or activities. Such effects would constitute risks to individual autonomy, and organizations may need to take steps to manage those risks in addition to information security and privacy risks."
    status: "not-a-requirement"
    reason: "Footnote 28: privacy programs 'may also choose to consider' autonomy risks, and organizations 'may need to take steps'. An option with a speculative 'need to', which binds no one. As in SP800-37R2 0099."
  - id: "REQ-SP800-53R5-0073"
    citation: {"ref": "SP800-53R5", "page": 41, "anchor": "Due to permutations in the relationship between information security and privacy program"}
    kind: "indicative"
    locator: "2.4"
    context: "SECURITY AND PRIVACY CONTROLS"
    statement: "Due to permutations in the relationship between information security and privacy program objectives and risk management, there is a need for close collaboration between programs to select and implement the appropriate controls for information systems processing PII. Organizations consider how to promote and institutionalize collaboration between the two programs to ensure that the objectives of both disciplines are met and risks are appropriately managed.29"
    status: "candidate"
    reason: "PER-PRIV sits beside PER-ISSM on S-1, S-2, S-3 and I-1 and is interviewed when PII is processed; 'close collaboration' is no value a rule can refuse"
    work_item: "WI-481"
  - id: "REQ-SP800-53R5-0074"
    citation: {"ref": "SP800-53R5", "page": 41, "anchor": "The trustworthiness of systems, system components, and system services is an important"}
    kind: "should"
    locator: "2.5"
    context: "TRUSTWORTHINESS AND ASSURANCE"
    statement: "The trustworthiness of systems, system components, and system services is an important part of the risk management strategies developed by organizations.30 Trustworthiness, in this context, means worthy of being trusted to fulfill whatever requirements may be needed for a component, subsystem, system, network, application, mission, business function, enterprise, or other entity.31 Trustworthiness requirements can include attributes of reliability, dependability, performance, resilience, safety, security, privacy, and survivability under a range of potential adversity in the form of disruptions, hazards, threats, and privacy risks. Effective measures of trustworthiness are meaningful only to the extent that the requirements are complete, well-defined, and can be accurately assessed."
    status: "not-a-requirement"
    reason: "Defines trustworthiness and lists attributes 'can include'. 'whatever requirements may be needed' sits inside the definition, addressed to no one."
  - id: "REQ-SP800-53R5-0075"
    citation: {"ref": "SP800-53R5", "page": 41, "anchor": "Two fundamental concepts that affect the trustworthiness of systems are functionality and"}
    kind: "indicative"
    locator: "2.5"
    context: "TRUSTWORTHINESS AND ASSURANCE"
    statement: "Two fundamental concepts that affect the trustworthiness of systems are functionality and assurance. Functionality is defined in terms of the security and privacy features, functions, mechanisms, services, procedures, and architectures implemented within organizational systems and programs and the environments in which those systems and programs operate. Assurance is the measure of confidence that the system functionality is implemented correctly, operating as intended, and producing the desired outcome with respect to meeting the security and privacy requirements for the system—thus possessing the capability to accurately mediate and enforce established security and privacy policies."
    status: "not-a-requirement"
    reason: "Defines functionality and assurance, the two concepts behind trustworthiness."
  - id: "REQ-SP800-53R5-0076"
    citation: {"ref": "SP800-53R5", "page": 41, "anchor": "In general, the task of providing meaningful assurance that a system is"}
    kind: "should"
    locator: "2.5"
    context: "TRUSTWORTHINESS AND ASSURANCE"
    statement: "In general, the task of providing meaningful assurance that a system is likely to do what is expected of it can be enhanced by techniques that simplify or narrow the analysis by, for example, increasing the discipline applied to the system architecture, software design, specifications, code style, and configuration management. Security and privacy controls address functionality and assurance. Certain controls focus primarily on functionality while other controls focus primarily on assurance. Some controls can support functionality and assurance."
    status: "not-a-requirement"
    reason: "Says meaningful assurance 'can be enhanced' by narrowing the analysis, and that controls address functionality or assurance. Description with no actor."
  - id: "REQ-SP800-53R5-0077"
    citation: {"ref": "SP800-53R5", "page": 42, "anchor": "Organizations can select assurance-related controls to define system development activities, generate evidence"}
    kind: "indicative"
    locator: "2.5"
    context: "TRUSTWORTHINESS AND ASSURANCE"
    statement: "Organizations can select assurance-related controls to define system development activities, generate evidence about the functionality and behavior of the system, and trace the evidence to the system elements that provide such functionality or exhibit such behavior. The evidence is used to obtain a degree of confidence that the system satisfies the stated security and privacy requirements while supporting the organization’s mission and business functions. Assurance-related controls are identified in the control summary tables in Appendix C."
    status: "not-a-requirement"
    reason: "Advisory: 'Organizations can select assurance-related controls', a permission, then what the evidence is used for and where Appendix C lists those controls."
  - id: "REQ-SP800-53R5-0078"
    citation: {"ref": "SP800-53R5", "page": 42, "anchor": "During control selection and implementation, it is important for organizations to consider"}
    kind: "modal"
    locator: "2.5"
    context: "EVIDENCE OF CONTROL IMPLEMENTATION"
    statement: "During control selection and implementation, it is important for organizations to consider the evidence (e.g., artifacts, documentation) that will be needed to support current and future control assessments. Such assessments help determine whether the controls are implemented correctly, operating as intended, and satisfying security and privacy policies—thus, providing essential information for senior leaders to make informed risk-based decisions."
    status: "candidate"
    reason: "I-1 and S-4 ask for the evidence kept, used at A-3; that organizations consider the evidence needed is guidance no run record can break"
    work_item: "WI-481"
  - id: "REQ-SP800-53R5-0079"
    citation: {"ref": "SP800-53R5", "page": 32, "anchor": "Organizational risk assessments are used, in part, to inform the security and"}
    kind: "modal"
    locator: "1.3"
    context: "ORGANIZATIONAL RESPONSIBILITIES"
    statement: "Organizational risk assessments are used, in part, to inform the security and privacy control selection process. The selection process results in an agreed-upon set of security and privacy controls addressing specific mission or business needs consistent with organizational risk tolerance.21 The process preserves, to the greatest extent possible, the agility and flexibility that organizations need to address an increasingly sophisticated and hostile threat space, mission and business requirements, rapidly changing technologies, complex supply chains, and many types of operational environments."
    status: "candidate"
    reason: "S-2 takes ART-RA as an input and S-6 approves the agreed set; 'are used, in part, to inform' describes the selection, which no run record can break"
    work_item: "WI-481"
  - id: "REQ-SP800-53R5-0080"
    citation: {"ref": "SP800-53R5", "page": 30, "anchor": "Managing security and privacy risks is a complex, multifaceted undertaking that requires:"}
    kind: "modal"
    locator: "1.3"
    context: "ORGANIZATIONAL RESPONSIBILITIES"
    statement: "Managing security and privacy risks is a complex, multifaceted undertaking that requires:"
    status: "not-a-requirement"
    reason: "Lead-in to six bullets: 'a complex, multifaceted undertaking that requires:'. The 'requires' has no object of its own, and each bullet has its own home, so it binds through 0022, 0023 and 0025 to 0028, which stay live."
  - id: "REQ-SP800-53R5-0081"
    citation: {"ref": "SP800-53R5", "page": 32, "anchor": "Authorizing officials or their designated representatives, by accepting the security and privacy"}
    kind: "promoted"
    locator: "1.6"
    context: ""
    statement: "Authorizing officials or their designated representatives, by accepting the security and privacy plans, agree to the security and privacy controls proposed to meet the security and privacy requirements for organizations and systems."
    status: "partial"
    reason: "S-6 records the AO's or AODR's approval of the plans (ssp-records approvals); the privacy plan's SAOP approval is WI-02's."
    evidence: [{"kind": "prose", "target": "playbooks/S/S-6.md", "asserts": "S-6 has the authorizing official accept the security and privacy plans", "claim": "presence"}]
    work_item: "WI-141"
    promoted: {"reason": "Footnote 21 states what the AO's or designated representative's acceptance of the plans does: it agrees the proposed controls. Task S-6's approval carries this meaning."}
  - id: "REQ-SP800-53R5-0082"
    citation: {"ref": "SP800-53R5", "page": 43, "anchor": "This catalog of security and privacy controls provides protective measures for systems,"}
    kind: "indicative"
    locator: "THE CONTROLS"
    context: "SECURITY AND PRIVACY CONTROLS AND CONTROL ENHANCEMENTS"
    statement: "This catalog of security and privacy controls provides protective measures for systems, organizations, and individuals.32 The controls are designed to facilitate risk management and compliance with applicable federal laws, executive orders, directives, regulations, policies, and standards. With few exceptions, the security and privacy controls in the catalog are policy-, technology-, and sector-neutral, meaning that the controls focus on the fundamental measures necessary to protect information and the privacy of individuals across the information life cycle. While the security and privacy controls are largely policy-, technology-, and sector-neutral, that does not imply that the controls are policy-, technology-, and sector-unaware. Understanding policies, technologies, and sectors is necessary so that the controls are relevant when they are implemented. Employing a policy-, technology-, and sector-neutral control catalog has many benefits. It encourages organizations to:"
    status: "not-a-requirement"
    reason: "Chapter 3 opening: what the catalog provides and why it is neutral. Description; 'It encourages organizations' leads in benefits, not duties."
  - id: "REQ-SP800-53R5-0083"
    citation: {"ref": "SP800-53R5", "page": 43, "anchor": "Focus on the security and privacy functions and capabilities required for mission"}
    kind: "lettered"
    locator: "THE CONTROLS.•"
    context: "SECURITY AND PRIVACY CONTROLS AND CONTROL ENHANCEMENTS It encourages organizations to:"
    statement: "• Focus on the security and privacy functions and capabilities required for mission and business success and the protection of information and the privacy of individuals, irrespective of the technologies that are employed in organizational systems;"
    status: "not-a-requirement"
    reason: "Benefit under lead-in 0082: a neutral catalog encourages this focus. No one is bound."
  - id: "REQ-SP800-53R5-0084"
    citation: {"ref": "SP800-53R5", "page": 43, "anchor": "Analyze each security and privacy control for its applicability to specific technologies,"}
    kind: "lettered"
    locator: "THE CONTROLS.•"
    context: "SECURITY AND PRIVACY CONTROLS AND CONTROL ENHANCEMENTS It encourages organizations to:"
    statement: "• Analyze each security and privacy control for its applicability to specific technologies, environments of operation, mission and business functions, and communities of interest; and"
    status: "not-a-requirement"
    reason: "Benefit under lead-in 0082: a neutral catalog encourages analysis of applicability. S-2 tailoring holds the act itself."
  - id: "REQ-SP800-53R5-0085"
    citation: {"ref": "SP800-53R5", "page": 43, "anchor": "Specify security and privacy policies as part of the tailoring process for"}
    kind: "lettered"
    locator: "THE CONTROLS.•"
    context: "SECURITY AND PRIVACY CONTROLS AND CONTROL ENHANCEMENTS It encourages organizations to:"
    statement: "• Specify security and privacy policies as part of the tailoring process for controls that have variable parameters."
    status: "not-a-requirement"
    reason: "Benefit under lead-in 0082: a neutral catalog encourages specifying policies at tailoring. S-2 holds the act itself."
  - id: "REQ-SP800-53R5-0086"
    citation: {"ref": "SP800-53R5", "page": 43, "anchor": "In the few cases where specific technologies are referenced in controls, organizations"}
    kind: "modal"
    locator: "THE CONTROLS"
    context: "SECURITY AND PRIVACY CONTROLS AND CONTROL ENHANCEMENTS It encourages organizations to:"
    statement: "In the few cases where specific technologies are referenced in controls, organizations are cautioned that the need to manage security and privacy risks may go beyond the requirements in a single control associated with a technology. The additional needed protection measures are obtained from the other controls in the catalog. Federal Information Processing Standards, Special Publications, and Interagency/Internal Reports provide guidance on selecting security and privacy controls that reduce risk for specific technologies and sector-specific applications, including smart grid, cloud, healthcare, mobile, industrial control systems, and Internet of Things (IoT) devices.33 NIST publications are cited as references as applicable to specific controls in Sections 3.1 through 3.20."
    status: "not-a-requirement"
    reason: "'organizations are cautioned that the need to manage security and privacy risks may go beyond the requirements in a single control'. An advisory caution and a pointer to NIST publications."
  - id: "REQ-SP800-53R5-0087"
    citation: {"ref": "SP800-53R5", "page": 43, "anchor": "Security and privacy controls in the catalog are expected to change over"}
    kind: "indicative"
    locator: "THE CONTROLS"
    context: "SECURITY AND PRIVACY CONTROLS AND CONTROL ENHANCEMENTS"
    statement: "Security and privacy controls in the catalog are expected to change over time as controls are withdrawn, revised, and added. To maintain stability in security and privacy plans, controls are not renumbered each time a control is withdrawn. Rather, notations of the controls that have been withdrawn are maintained in the control catalog for historical purposes. Controls may be withdrawn for a variety of reasons, including when the function or capability provided by the control has been incorporated into another control, the control is redundant to an existing control, or the control is deemed to be no longer necessary or effective."
    status: "not-a-requirement"
    reason: "How the catalog changes: controls 'are expected to change over time', and they are withdrawn and not renumbered. That 'expected to' is NIST's forecast and binds no reader."
  - id: "REQ-SP800-53R5-0088"
    citation: {"ref": "SP800-53R5", "page": 44, "anchor": "New controls are developed on a regular basis using threat and vulnerability"}
    kind: "modal"
    locator: "THE CONTROLS"
    context: "SECURITY AND PRIVACY CONTROLS AND CONTROL ENHANCEMENTS"
    statement: "New controls are developed on a regular basis using threat and vulnerability information and information on the tactics, techniques, and procedures used by adversaries. In addition, new controls are developed based on a better understanding of how to mitigate information security risks to systems and organizations and risks to the privacy of individuals arising from information processing. Finally, new controls are developed based on new or changing requirements in laws, executive orders, regulations, policies, standards, or guidelines. Proposed modifications to the controls are carefully analyzed during each revision cycle, considering the need for stability of controls and the need to be responsive to changing technologies, threats, vulnerabilities, types of attack, and processing methods. The objective is to adjust the level of information security and privacy over time to meet the needs of organizations and individuals."
    status: "not-a-requirement"
    reason: "How new controls are developed, 'to meet the needs of organizations'; 'need to' states NIST's reason for revising the catalog and binds no reader."
