rejected:
  - {"page": 6, "locator": "Note", "reason": "lead-in", "text": "Title III of the E-Government Act (Public Law 107-347), titled the Federal Information Security Management Act (FISMA), tasked the National Institute of Standards and Technology (NIST) to develop:"}
  - {"page": 6, "locator": "Note", "reason": "no-marker", "text": "In response to the second of these tasks, this guideline has been developed to assist Federal government agencies to categorize information and information systems. The guideline’s objective is to facilitate provision of appropriate levels of information security according to a range of levels of impact or consequences that might result from the unauthorized disclosure, modification, or loss of availability of the information or information system. This guideline assumes that the user is familiar with Standards for Security Categorization of Federal Information and Information Systems (FIPS 199). The guideline and its appendices:"}
  - {"page": 6, "locator": "Note", "reason": "no-marker", "text": "The provisional security impact level assignments contained in appendices C and D are only the first step in impact assignment and subsequent risk assessment processes. The impact assignments are not intended to be used by auditors as a definitive checklist for information types and impact assignments."}
  - {"page": 7, "locator": "Note", "reason": "no-marker", "text": "The basis employed in this guideline for the identification of information types is the Office of Management and Budget’s Federal Enterprise Architecture (FEA) Program Management Office (PMO) October 2007 publication, The Consolidated Reference Model Document Version 2.3."}
