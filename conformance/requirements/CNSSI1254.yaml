    kind: "lettered"
    locator: "REFERENCES.b"
    context: "RECIPROCITY SCENARIOS"
    statement: "b. A system is authorized and subsequently deployed into receiving sites authorized by a separate organization. In this scenario, the deploying organization’s security assessment documentation and supporting artifacts are made available to the receiving site organization. If the receiving organization determines there is insufficient information in the documentation or inadequate security measures in place for establishing an acceptable level of risk, the receiving organization may negotiate with the deploying organization for additional security-related information and/or additional security-related measures. The additional security-related information or security measures may be provided by the deploying organization, the system developer, the receiving organization, some other external third party, or a combination of the above. Once the receiving organization’s AO believes adequate security measures are in place and the level of risk is acceptable, the AO may issue a separate authorization for this instance of the system."
    status: "candidate"
    work_item: "WI-314"
