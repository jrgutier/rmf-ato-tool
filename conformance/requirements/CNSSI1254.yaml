    locator: "REFERENCES.d"
    context: "RECIPROCITY SCENARIOS"
    statement: "d. An organization plans to use an IT service under contract from a commercial entity authorized (or provisionally authorized) by another internal or external organization (e.g., a commercial cloud service provider authorized by the Federal Risk and Authorization Management Program Joint Authorization Board). In this scenario, the organization leverages an existing authorization and maximizes reuse of the existing documentation to support a new authorization. If the organization determines there are inadequate security measures in place for establishing an acceptable level of risk, the organization may negotiate with the IT service provider for additional security measures and the associated security-related information. Upon assessment and approval of all newly included security-related information and the documentation of any potentially applicable security measures in the contract agreement with the IT service provider, the organization AO may issue an authorization."
    status: "candidate"
    work_item: "WI-302"
