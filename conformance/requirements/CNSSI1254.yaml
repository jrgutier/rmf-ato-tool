    locator: "REFERENCES.b"
    context: "RECIPROCITY"
    statement: "b. Deploying3 systems with authorizations are intended to be accepted into receiving organizations without adversely affecting the authorizations of either the deployed system or the receiving system or site. Configuration differences introduced by using the system in a new or different environment may require additional testing. ISOs and Program Managers (PM) of deploying systems must coordinate system security requirements with receiving organizations or their representatives early and throughout system development."
