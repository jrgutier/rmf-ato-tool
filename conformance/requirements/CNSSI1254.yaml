    statement: "7. There may be artifacts or information gathered during systems engineering processes that could inform the content of the RMF core documents. While the RMF artifacts are beneficial for providing a comprehensive security authorization package, the focus of the information should be on mission and providing that information necessary to enable decision makers to make risk-informed decisions based upon that information. This information should include operational context, architecture, data flow, interfaces, hardware, software, services, and any known risks associated with the system."
