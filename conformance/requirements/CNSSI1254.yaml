    kind: "lettered"
    locator: "REFERENCES.d"
    context: "RECIPROCITY"
    statement: "d. The AO for a receiving system does not issue a new/additional ATO for the deployed system. However, the receiving organization updates their hosting system ATO to include any additional or modified security controls associated with hosting the deploying system. Depending on risk assessment factors of the receiving organization, the changes caused by the deployed system may change the authorization decision of the hosting system."
    status: "candidate"
    work_item: "WI-315"
  - id: "REQ-CNSSI1254-0118"
    citation: {"ref": "CNSSI1254", "page": 24, "anchor": "Organizations have the right to refuse participating in reciprocity with another organization,"}
    kind: "lettered"
    locator: "REFERENCES.e"
    context: "RECIPROCITY"
    statement: "e. Organizations have the right to refuse participating in reciprocity with another organization, if the system's RMF core documentation is not considered complete enough to provide an informed understanding of potential or existing risks, or there would be excessive risk to the system or site, as determined by the system or site AO. Such decisions to refuse participation in reciprocity should be documented by the refusing AO, and provided, upon request, to the deploying organization’s ISO or PM, AO, and organization Senior Information Security Officer (SISO), and to the refusing organization’s Component SISO. Disputes should be resolved at the lowest possible level. Disputes that cannot be resolved will be raised to the next appropriate level."
    status: "candidate"
    work_item: "WI-319"
