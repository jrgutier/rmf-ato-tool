  - id: "REQ-CNSSI1254-0005"
    citation: {"ref": "CNSSI1254", "page": 4, "anchor": "This Instruction provides guidance for security authorization documentation and data elements within"}
    kind: "lettered"
    locator: "5"
    context: "SECTION III - SCOPE"
    statement: "5. This Instruction provides guidance for security authorization documentation and data elements within RMF core documents to facilitate reciprocity across the national security community. The requirements of this Instruction apply to all United States Government departments, agencies, and their contractors, consultants, and licensees who own, procure, use, operate, or maintain NSS as defined by the Federal Information Security Modernization Act (FISMA) of 2014. Specific requirements within this Instruction also apply to all RMF security assessment plan materials as described in NIST SP 800-53A. These requirements apply irrespective of form or generation process. While the scope of this Instruction applies primarily to systems, the RMF documentation, data elements, and reciprocity processes may be applied to other system components (e.g., hardware, software), as indicated in Annex D of this Instruction. Organizations must, however, agree on which RMF core documents and which data elements are required."
    status: "candidate"
    work_item: "WI-317"
