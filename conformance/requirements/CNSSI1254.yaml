    kind: "lettered"
    locator: "REFERENCES.c"
    context: "RECIPROCITY"
    statement: "c. An authorization decision for a system cannot be made without completing the required assessments and analysis, as recorded in the security authorization package (e.g., in the SAR or RAR). Deploying organizations must provide the complete security authorization package (to include supporting artifacts) to receiving organizations."
