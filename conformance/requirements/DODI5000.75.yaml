    context: "Table 5. Considerations for Decision Criteria, Continued"
    statement: "Acquisition ATP | • • • • • • • • • • • • Alternatives leverage market research on existing or emerging COTS and GOTS products and services. Potential business system solutions reflect traceability to functional requirements and decomposition. Potential business system solutions include trade space to minimize customization. Potentially expensive or high risk functional requirements are identified with recommended alternative approaches. Potential business system solutions address technical and lifecycle support requirements. Solution evaluation criteria include: economic analysis; satisfaction of functional requirements and information assets; satisfaction of technical requirements and lifecycle support requirements; and overall risk. Solution evaluation criteria include (if needed): delivery schedule; evaluation of trade space for functional requirements; and enterprise impacts. Technical management strategy identifies lifecycle methodology for development and delivery of the business system, to include capability support. Consistency with DoD Information Enterprise policies and architecture. Cybersecurity strategy consistent with DoD policies, standards and architectures, including interoperability requirements. Auditability compliance is reviewed and confirmed, if necessary and appropriate Certification under Section 2222 Title 10, U.S.C."
    status: "not-a-requirement"
