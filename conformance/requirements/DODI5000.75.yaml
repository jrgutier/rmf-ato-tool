    statement: "Governance for business capabilities is not a one-size-fits-all model and must be adaptive, transparent, and inclusive of key stakeholders to enable rapid decision making on key matters such as requirements, cost, schedule, performance, and risk. Simplified and effective governance driven by clear outcomes throughout the capability life cycle is encouraged, as is delegating governance decisions to the lowest practical levels."
    status: "deferred"
    reason: "'Governance for business capabilities ... must be adaptive, transparent, and inclusive': program governance over requirements, cost and schedule, outside the run's RMF governance."
  - id: "REQ-DODI5000.75-0081"
