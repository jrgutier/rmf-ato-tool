    locator: "APPENDIX 4A: SUPPORTING INFORMATION"
    context: "Table 5. Considerations for Decision Criteria"
    statement: "Functional Requirements ATP | • High-level business processes include performance measures and supporting activities and tasks with inputs and outputs. • Business processes focus on work and not supporting systems or IT. • Clear understanding of the process and functional changes needed to achieve future business processes. • Key processes identified for improvement documented with changes in process models. • Business processes reflect knowledge of industry state of the art. • Business process actions identified, prioritized and included in the capability implementation plan. • ROM cost estimate for all business changes to achieve future business processes. • Affordability targets for business system with compelling business case for committing organizational resources for work planned up to next decision point. • Acquisition strategy outlines planned decision points and decision authorities. • Consistency with DoD Information Enterprise policies and architecture. • High-level understanding of capability support requirements. • Initial cybersecurity strategy consistent with DoD policies, standards, and architectures."
    status: "not-a-requirement"
