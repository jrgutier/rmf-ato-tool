    kind: "modal"
    locator: "4.1.d"
    context: "OVERVIEW"
    statement: "Change management proactively prepares the functional community for upcoming changes resulting from the delivery of a business capability, reduces risk, and increases user adoption. Change management tasks span the lifecycle of the product’s delivery and include the development and delivery of training materials and ongoing capability improvements addressed in the capability support phase. The functional lead and program manager are jointly responsible for change management."
    status: "deferred"
    reason: "'The functional lead and program manager are jointly responsible for change management': user adoption and training materials, no RMF artifact."
