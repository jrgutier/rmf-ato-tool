  - id: "REQ-DODCIO-RECIPROCITY-0067"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 13, "anchor": "The main objective of the AO Committee is to provide a mechanism"}
    kind: "modal"
    locator: "4.3"
    context: "COMMUNITY – CONSORTIUM OF AOS"
    statement: "The main objective of the AO Committee is to provide a mechanism for all stakeholders with authorization equity to have insight to the risk posture of the system, to participate in the ongoing assessments and to have awareness of the Continuous Monitoring (CONMON) and priorities established by the system/capability AO, which allow the identification and adjudication of any reciprocity challenges early as part of the continuous assessment and authorization process of the system/capability. The AO Committee provides the forum and structure to allow all authorization stakeholders the ability to participate in, understand, and trust the risk assessment of the system AO and the ability to correlate that to their risk tolerance, and their environment, achieving reciprocity as an outcome. The committee of AOs would outline an interconnection service agreement (ISA); defining the relationships; roles and responsibilities, steps to address gaps between authorization boundaries and/or enterprise services, PPSM coordination, CSSP identification, incident response, and agreement review requirements to address later changes in technology and authorization statuses."
    status: "covered"
    evidence: [{"kind": "rule", "target": "RCP-006", "fixture": "tests/fixtures/negative/RCP-006.isa.yaml", "expect": "the interconnection service agreement does not define", "asserts": "The interconnection service agreement defines relationships, roles and responsibilities, PPSM coordination, CSSP identification, incident response and agreement review", "claim": "constraint", "holds_when": "ART-SD is produced or seeded and reciprocity.yaml records the relationship", "sentence": "The committee of AOs would outline an interconnection service agreement (ISA); defining the relationships; roles and responsibilities, steps to address gaps between authorization boundaries and/or enterprise services, PPSM coordination, CSSP identification, incident response, and agreement review requirements to address later changes in technology and authorization statuses."}]
    work_item: "WI-317"
