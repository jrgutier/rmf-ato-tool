  - id: "REQ-DODCIO-RECIPROCITY-0150"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 20, "anchor": "Within the Department, secure configuration guides take various forms, such as STIGs"}
    kind: "modal"
    locator: "6"
    context: "SECURITY CONFIGURATION GUIDES & SECURE CONFIGURATIONS"
    statement: "Within the Department, secure configuration guides take various forms, such as STIGs and Security Requirement Guides (SRGs). These guides offer detailed step-by-step instructions for securing specific technologies, platforms, and environments, ranging from operating systems and applications to cloud services. By following these guides, Components establish a consistent baseline security posture, reducing the attack surface and potential vulnerabilities that adversaries could exploit. These guides facilitate reciprocity by providing standardized and approved security configurations. When a system adheres to the recommended settings outlined in these guides, it becomes easier for other Components to trust the security of that system, accelerating the authorization and deployment process. This not only streamlines operations but also enhances the overall security posture of the DoD by maintaining a consistent level of security across the enterprise. While the SRGs define the high-level requirements for various technology families and organizations, STIGs are the detailed guidelines for specific products. STIGs provide product-specific information for validating, attaining, and continuously maintaining compliance with requirements defined in the SRG for that product’s technology area. The security requirements contained within the SRGs and STIGs, in general, are applicable to and required by all DoD-administered systems, all systems connected to DoD networks, and all systems operated and/or administrated on behalf of the DoD. This requirement remains in force for all mission owners building systems in a cloud service. In the case of cloud service, where CSP systems must comply with configuration guidance consistent with the National Institute of Standards and Technology Special Publication (NIST SP) 800-53 security control “CM-6 Configuration Settings” by using STIGs/SRGs. Secure configuration guides, such as the Cloud Computing SRG, play an essential role in ensuring that cloud deployments align with DoD cloud security requirements."
    status: "partial"
    reason: "Its first two marked sentences give the rationale for following STIGs and SRGs (a consistent baseline posture, easier trust between Components); they assert an effect, not a duty a run can break, and nothing tests them"
    evidence: [{"kind": "rule", "target": "STIG-001", "asserts": "The security requirements within SRGs and STIGs are applicable to and required by all DoD-administered systems: every item has a STIG/SRG benchmark", "claim": "constraint", "fixture": "tests/fixtures/negative/STIG-001.benchmark.yaml", "expect": "has no STIG/SRG benchmark and no not_applicable rationale", "holds_when": "the summary is in play once I-1 is in scope", "sentence": "The security requirements contained within the SRGs and STIGs, in general, are applicable to and required by all DoD-administered systems, all systems connected to DoD networks, and all systems operated and/or administrated on behalf of the DoD."}, {"kind": "rule", "target": "CLOUD-001", "asserts": "CSP systems comply with configuration guidance by using STIGs or SRGs", "claim": "constraint", "fixture": "tests/fixtures/negative/CLOUD-001.stig.yaml", "expect": "CSP systems comply with configuration guidance by using STIGs or SRGs", "holds_when": "the record is in play once service-agreements.yaml names the cloud and S-4 is in scope", "sentence": "In the case of cloud service, where CSP systems must comply with configuration guidance consistent with the National Institute of Standards and Technology Special Publication (NIST SP) 800-53 security control “CM-6 Configuration Settings” by using STIGs/SRGs."}]
    work_item: "WI-302"
  - id: "REQ-DODCIO-RECIPROCITY-0151"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 21, "anchor": "As the Department increasingly leverages cloud technologies, these guides offer a roadmap"}
