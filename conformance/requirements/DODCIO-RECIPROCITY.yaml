  - id: "REQ-DODCIO-RECIPROCITY-0012"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 6, "anchor": "Reciprocity is designed to expedite authorization through the re-use of assessments and"}
    kind: "modal"
    locator: "3.1"
    context: "BENEFITS OF LEVERAGING RECIPROCITY"
    statement: "Reciprocity is designed to expedite authorization through the re-use of assessments and artifacts, which leads to cost reduction. Executed appropriately, reciprocity reduces redundant testing, assessment and documentation, and the associated costs in time and resources. To support reciprocity, DoD Components share security authorization packages with affected information owners and interconnected system owners. The re-use of artifacts allows AOs to accept assessments done on systems they intend to deploy rather than repeat the assessments. Acceptance of relevant artifacts from similar assessments results in fewer costly assessments, allowing systems to be authorized more quickly and efficiently. In some cases, an organization may want to deploy a capability developed by another organization. It can leverage the existing authorization package if both organizations have similar mission requirements and plan to deploy the same system components with similar dataflows and network architectures. In these cases, the Receiving organization becomes the system owner and, while not needing to re-authorize the system, it must issue an authorization to use (ATU). This ATU includes a statement by the Receiving AO granting approval for a Granting system to connect to the hosting/receiving system where the systems are linked through inheritance in the RMF Inventory Tool (e.g., eMASS, Xacta). It also provides a copy of implementing documentation to the Granting AO and notifies and provides guidance to subordinate site(s) that the system is authorized to operate and/or connect only in the authorized configuration. Overall, this re-use can result in significant resource savings."
