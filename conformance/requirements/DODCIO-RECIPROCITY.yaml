  - id: "REQ-DODCIO-RECIPROCITY-0157"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 22, "anchor": "The Deputy Secretary of Defense (DSD) issued a memorandum in March 2024"}
    kind: "modal"
    locator: "9"
    context: "DOD CIO ROLE IN RESOLVING RECIPROCITY CONFLICTS"
    statement: "The Deputy Secretary of Defense (DSD) issued a memorandum in March 2024 (reference i), emphasizing the importance of a culture of collaboration in cybersecurity testing and reciprocity in order to accelerate delivery of innovative capabilities while maintaining our cybersecurity standards. The DSD expects testing re-use and reciprocity to be implemented except when the cybersecurity risk is proven to be too great. In a collaborative cybersecurity reciprocity culture, AOs trust one another and are inclined to granting reciprocity, thereby accepting the risk determination to deploy a capability made by another AO unless there are compelling operational and procedural reasons that prevent the risk acceptance (i.e., to refuse reciprocity). Therefore, the Receiving AO should make every attempt to accept the risk determination made by the Granting AO. However, before making the decision, Receiving AOs must thoroughly review the security authorization package provided by the Granting AO, focusing on content and not the organization or format. The content should clearly demonstrate the security posture, risk assessment, and rationale for the risk determination. Receiving AOs have the right to refuse participating in reciprocity with another organization due to insufficient content demonstrating an informed understanding of the security posture, risk assessment of the system, and the rationale for the risk determination as defined on the RMF KS, or due to excessive risk to the enclave or site, as determined by the site AO. However, the Receiving AO must document and report this refusal to the Granting organization’s AO within 10 business days. If a refusal does occur, both organizations will continue to work, and re-work, the ATO package to reach an agreement, if at all possible. When AOs cannot reach an agreement to leverage re-use and reciprocity, both parties must use the following resolution process to gain assistance in resolving the impasse:"
    status: "partial"
    reason: "left for the user: the first and third sentences ask the Receiving AO to try to accept and the Granting content to be clear, which no record can fail; the fifth, to keep re-working the package 'if at all possible', is not held."
