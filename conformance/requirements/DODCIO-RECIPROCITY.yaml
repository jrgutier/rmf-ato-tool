  - id: "REQ-DODCIO-RECIPROCITY-0004"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 4, "anchor": "Impact Level 4 (IL4) accommodates nonpublic, unclassified data where the unauthorized disclosure"}
    kind: "lettered"
    locator: "1.1.•"
    context: "RMF ROLE IN CYBERSECURITY"
    statement: "• Impact Level 4 (IL4) accommodates nonpublic, unclassified data where the unauthorized disclosure of information could be expected to have a serious adverse effect on organizational operations, organizational assets, or individuals. This encompasses CUI and/or other mission data, including that used in direct support of military or contingency operations. CUI is information the federal government creates or possesses that a law, regulation, or government-wide policy requires, or specifically permits, an agency to handle by means of safeguarding or dissemination controls. Impact Level 4 CSOs may support a U.S. government community or a DOD-only community (i.e., the CSO is DOD Private). Commercial Impact Level 4 CSP/CSO customers include all U.S. government customers (federal, state, local, and tribal) and commercial customers that support them. In some cases, an Impact Level 4 PA may be granted to CSOs that support other commercial entities but not the public."
    status: "not-a-requirement"
    reason: "Definition of Impact Level 4. 'could be expected to' is the harm test that defines the level, and 'requires' sits inside the definition of CUI, reporting what law requires of an agency; neither binds a reader. The duty to set a mission's impact level is in REQ-0002."
