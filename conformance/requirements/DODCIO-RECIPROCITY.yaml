rejected:
  - {"page": 3, "locator": "1", "reason": "no-marker", "text": "Cybersecurity is a paramount concern that underpins the nation's ability to safeguard its critical assets, information, and operations in an increasingly interconnected digital landscape. The Department recognizes that malicious cyber activities pose significant threats to national security, economic stability, and public safety. As technology evolves and adversaries become more sophisticated, ensuring the confidentiality, integrity, and availability of sensitive data and systems has become an imperative mission."}
  - {"page": 3, "locator": "1.1", "reason": "footer", "text": "1"}
  - {"page": 4, "locator": "1.1.•", "reason": "footer", "text": "2"}
  - {"page": 5, "locator": "3", "reason": "no-marker", "text": "As defined in the Committee on National Security Systems Instruction (CNSSI) 4009, cybersecurity reciprocity (hereinafter referred to as “reciprocity”) is the “agreement among participating organizations to accept each other’s security assessments, to reuse system resources, and/or to accept each other’s assessed security posture to share information”. During the reciprocity process, Authorizing Officials (AOs) make system authorization decisions by reviewing the body of evidence (BoE). The BoE is the complete set of RMF documentation on the testing, implementation, and assessment of security controls, consisting of the RMF core documents and RMF data elements as defined in Annex C of CNSSI 1254. According to CNSSI 1254, the RMF core documents are the:"}
  - {"page": 5, "locator": "3.5", "reason": "footer", "text": "3"}
  - {"page": 6, "locator": "3.5", "reason": "no-marker", "text": "In essence, reciprocity emphasizes the importance of maintaining a strong security posture while maximizing efficiency through the re-use of the BoE. Thus, reciprocity demands a discerning approach that safeguards the integrity of its systems, while leveraging the insights and efforts of trusted partners to enhance its cybersecurity resilience."}
  - {"page": 6, "locator": "3.1", "reason": "footer", "text": "4"}
  - {"page": 7, "locator": "3.2", "reason": "no-marker", "text": "Failing to leverage reciprocity to the greatest extent possible can lead to redundant and resource-intensive efforts. Without recognizing the assessments conducted by other entities, the organization might be compelled to undertake its own comprehensive evaluations of systems and networks, even when similar assessments have already been performed by trusted partners. This results in a wasteful allocation of time, manpower, and financial resources, hindering the organization’s ability to efficiently manage and enhance its cybersecurity posture."}
  - {"page": 7, "locator": "3.2", "reason": "no-marker", "text": "Not leveraging reciprocity hampers resource optimization and hinders collaborative efforts. Embracing reciprocity promotes efficiency, interagency cooperation, and information sharing, thereby contributing to a stronger and more robust cybersecurity posture that aligns with the evolving threat landscape."}
  - {"page": 7, "locator": "4", "reason": "no-marker", "text": "The following use cases do not represent all possible reciprocity circumstances. The cases in sections 4.1 through 4.5 demonstrate how reciprocity is leveraged across the Department in some of the most common applications."}
  - {"page": 7, "locator": "4.1", "reason": "footer", "text": "5"}
  - {"page": 8, "locator": "4.2.b.(2)", "reason": "footer", "text": "6"}
  - {"page": 9, "locator": "4.2.g", "reason": "footer", "text": "7"}
  - {"page": 10, "locator": "4.2.i", "reason": "short", "text": "4.2.2 ISRMC Activities"}
  - {"page": 10, "locator": "4.2.d", "reason": "no-marker", "text": "4.2.3 Receiving Organization Activities"}
  - {"page": 10, "locator": "4.2.a", "reason": "footer", "text": "8"}
  - {"page": 11, "locator": "4.2.f", "reason": "footer", "text": "9"}
  - {"page": 12, "locator": "4.3", "reason": "no-marker", "text": "To address the challenge of reciprocity in complex authorization environments such as many of the DoD capabilities (e.g., Weapon Systems, Enterprise Systems, Clouds, DevSecOps, Coalition environments, Cross service environments, etc.), where there are multiple stakeholders and AOs involved, an AO Consortium (hereinafter referred to as an “AO Committee”) method was established as a tool to streamline the assessment and authorization process while maintaining a high level of security assurance."}
  - {"page": 12, "locator": "4.3", "reason": "footer", "text": "10"}
  - {"page": 13, "locator": "4.3", "reason": "lead-in", "text": "The following are the outcomes of utilizing an AO Committee to leverage reciprocity:"}
  - {"page": 13, "locator": "4.3", "reason": "short", "text": "Outcome 1"}
  - {"page": 13, "locator": "4.3.o", "reason": "lead-in", "text": "o This leads to:"}
  - {"page": 13, "locator": "4.3.•", "reason": "footer", "text": "11"}
  - {"page": 14, "locator": "4.3.▪", "reason": "lead-in", "text": "▪ This integration and collaboration leads to:"}
  - {"page": 14, "locator": "4.3", "reason": "no-marker", "text": "Overall, the Department's use of reciprocity within an AO Committee enhances efficiency, reduces redundancy, and promotes collaboration among various Components while maintaining a consistent and robust security posture across the entire system."}
  - {"page": 14, "locator": "4.4.•", "reason": "footer", "text": "12"}
  - {"page": 15, "locator": "4.4.o", "reason": "footer", "text": "13"}
  - {"page": 16, "locator": "4.4.o", "reason": "footer", "text": "14"}
  - {"page": 17, "locator": "4.4", "reason": "no-marker", "text": "Ultimately, successful execution of reciprocity in a one-to-one scenario (re-use of artifacts) hinges on collaboration, transparency, and a mutual commitment to cybersecurity best practices. Both the Granting and Receiving organizations play vital roles in upholding the integrity of the artifacts and ensuring that the security posture of the systems involved remains robust and aligned with the Department's cybersecurity objectives."}
  - {"page": 17, "locator": "4.5", "reason": "no-marker", "text": "Both DoDI 8510.01 and Intelligence Community Directive (ICD) 503 emphasize the context of reciprocity for assessment only and acknowledge the needed testing for configuration changes that arise from the movement of capabilities."}
  - {"page": 17, "locator": "4.5", "reason": "lead-in", "text": "DoDI 8510.01, the RMF KS, and ICD 503 align to assert the following regarding reciprocity:"}
  - {"page": 17, "locator": "4.5.c", "reason": "footer", "text": "15"}
  - {"page": 18, "locator": "4.5.ii", "reason": "no-marker", "text": "(e.g., Intelligence A (INT-A), INT-B, INT-C, Cross Domain Transfer Cross Domain, Cross Domain Access, Privacy, etc.)"}
  - {"page": 18, "locator": "4.5.ii", "reason": "no-marker", "text": "4.5.1 Body of Evidence Sharing IC and DoD agencies utilize one of only a few major RMF inventory tool suites to manage their RMF documentation (e.g., eMASS, Xacta). These tools grant each agency the ability to customize their workflows, essential elements of information, and policy mappings captured within its RMF implementation."}
  - {"page": 18, "locator": "4.5.ii.•", "reason": "footer", "text": "16"}
  - {"page": 19, "locator": "5", "reason": "no-marker", "text": "To maintain the narrowest scope, we identified that with reciprocity, there are two types of AOs"}
  - {"page": 19, "locator": "5.•", "reason": "footer", "text": "17"}
  - {"page": 20, "locator": "6", "reason": "footer", "text": "18"}
  - {"page": 21, "locator": "6.7", "reason": "footer", "text": "19"}
