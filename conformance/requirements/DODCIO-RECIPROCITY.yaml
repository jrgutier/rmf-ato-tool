  - id: "REQ-DODCIO-RECIPROCITY-0010"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 5, "anchor": "Authorization Decision Document DoD CIO issued a memorandum in October 2016 (reference"}
    kind: "lettered"
    locator: "3.5"
    context: "DEFINITION OF RECIPROCITY According to CNSSI 1254, the RMF core documents are the:"
    statement: "5. Authorization Decision Document DoD CIO issued a memorandum in October 2016 (reference g), reiterating the Department’s Cybersecurity Reciprocity policy, as established in DoDI 8510.01, and as implemented by the cybersecurity reciprocity related content pages on the RMF Knowledge Service (KS) (rmfks.osd.mil/rmf/PolicyandGovernance/Reciprocity/Pages/default.aspx). The memorandum emphasized that reciprocity is the default for assessment and authorization of a system already deployed in the Department and Components will maximize the use of previous assessment results and authorizations of common information technology systems and software by fellow Department Components in their risk determination and authorization process. Additionally, DoD CIO issued a memorandum in March 2023 (reference j), supporting the reissuance of DoDI 8510.01, which emphasized Components should leverage reciprocity to the greatest extent possible by utilizing a robust BoE. To improve the use of reciprocity, CIO has emphasized in policy the “re-use” of security testing evidence as the foundation for reciprocity, eliminating and invalidating the practice to issue an authorization decision memo without examining the body of evidence. DoDI 8510.01 states, “The DoD Information Enterprise will use cybersecurity reciprocity to reduce redundant testing, assessing, documenting, and the associated costs in time and resources.” By focusing on “re-use”, CIO ensures data is provided to Components to enable risk-based decision making, while eliminating duplication of effort. Reciprocity is not a passive acceptance of security assessments, certifications, or authorizations from other entities without careful consideration, and comprehensive review of the context, risk factors, sensitivity of the data, and relevance to the specific systems or networks within its purview. Instead, reciprocity involves a thoughtful, risk-based assessment process and a careful examination of the BoE to determine their applicability and suitability within a specific security landscape."
    status: "partial"
    reason: "The use of previous results is held by RECIP-004 (core documents reused or the reason given) and the body of evidence by RCP-007; the first and last sentences recount the October 2016 memorandum and quote DoDI 8510.01, history a run does not act on."
