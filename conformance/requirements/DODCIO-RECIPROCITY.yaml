    locator: "3.1"
    context: "BENEFITS OF LEVERAGING RECIPROCITY"
    statement: "4 dataflows and network architectures. In these cases, the Receiving organization becomes the system owner and, while not needing to re-authorize the system, it must issue an authorization to use (ATU). This ATU includes a statement by the Receiving AO granting approval for a Granting system to connect to the hosting/receiving system where the systems are linked through inheritance in the RMF Inventory Tool (e.g., eMASS, Xacta). It also provides a copy of implementing documentation to the Granting AO and notifies and provides guidance to subordinate site(s) that the system is authorized to operate and/or connect only in the authorized configuration. Overall, this re-use can result in significant resource savings."
    status: "candidate"
    work_item: "WI-01"
    removed: true
  - id: "REQ-DODCIO-RECIPROCITY-0014"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 7, "anchor": "Moreover, the lack of reciprocity undermines interagency collaboration and information sharing. In"}
    kind: "should"
    locator: "3.2"
    context: "RISKS OF FAILING TO LEVERAGE RECIPROCITY"
    statement: "Moreover, the lack of reciprocity undermines interagency collaboration and information sharing. In an era characterized by the rapid evolution of cyber threats, the ability to quickly share cybersecurity insights and findings across different government agencies and organizations is critical. Reciprocity fosters a culture of cooperation and trust, enabling the Department to benefit from the expertise and perspectives of other entities, thereby enhancing its ability to detect, prevent, and respond to emerging threats effectively."
    status: "not-a-requirement"
    reason: "Background in section 3.2 on the risks of failing to leverage reciprocity. 'is critical' rates the importance of an ability, with no actor named, so it binds no one; the sharing duties are in REQ-0024 and REQ-0126."
