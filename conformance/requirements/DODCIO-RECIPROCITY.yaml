  - id: "REQ-DODCIO-RECIPROCITY-0138"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 19, "anchor": "‘Granting’ or ‘Receiving’, as outlined in the “Reciprocity MOA MOU” template (available"}
    kind: "lettered"
    locator: "5.–"
    context: "ROLE OF VARIOUS TYPES OF AOS IN RECIPROCITY"
    statement: "– ‘Granting’ or ‘Receiving’, as outlined in the “Reciprocity MOA MOU” template (available on the related reciprocity pages on the RMF KS) which provides the guidelines to be applied as the basis for practicing reciprocity, in accordance with Department of Defense Instruction (DoDI) 8510.01, Risk Management Framework for DoD Systems, 19 July 2022. The default option is for Components to use each system/application in its native environment. This use case will be referred to as “co-use” and will only require authorization by the Granting organization. Granting organization are responsible for establishing notification processes (e.g., cybersecurity incidents, PII breaches, etc.) for co-use systems, applications, and cloud services. When an authorized, operational system and/or application in one environment is designated for install and use in another environment, cybersecurity reciprocity will be the default method for assessment and authorization by the Receiving organization. Prior to initiating testing or a risk assessment for a system to be hosted in the Receiving organization’s environment, the Receiving AO is responsible for determining whether the system has been authorized by another AO. If a current authorization exists, the Receiving AO and SCA will proceed with reciprocity based on RMF documentation required by DoDI 8510.01. When the specific documents required by DoDI 8510.01 are not available, the Receiving AO must consider the body of evidence available from the Program Office or system owner, to include, but not limited to the following information:"
    status: "partial"
    reason: "Held: the agreement under the MOA/MOU template (RCP-006), the review of a current authorization before the decision (RECIP-001) and the body of evidence when documents are missing (RCP-007). Unheld: co-use requiring only the Granting authorization, the Granting organization's co-use notification processes (RCP-001 holds them only as presence), reciprocity as the default method, and the Receiving AO determining an existing authorization before testing begins, which no record dates."
    evidence: [{"kind": "rule", "target": "RCP-006", "fixture": "tests/fixtures/negative/RCP-006.yaml", "expect": "no documented agreement with the other organization is executed", "asserts": "Granting and Receiving organizations practice reciprocity on an executed agreement under the Reciprocity MOA MOU template", "claim": "constraint", "sentence": "– ‘Granting’ or ‘Receiving’, as outlined in the “Reciprocity MOA MOU” template (available on the related reciprocity pages on the RMF KS) which provides the guidelines to be applied as the basis for practicing reciprocity, in accordance with Department of Defense Instruction (DoDI) 8510.01, Risk Management Framework for DoD Systems, 19 July 2022.", "holds_when": "ART-SD is produced or seeded and reciprocity.yaml records the relationship"}, {"kind": "rule", "target": "RECIP-001", "fixture": "tests/fixtures/negative/RECIP-001.late.yaml", "expect": "the provider's authorization package is reviewed on", "asserts": "With a current authorization the Receiving AO proceeds with reciprocity on the RMF documentation, reviewed before the decision", "claim": "constraint", "sentence": "If a current authorization exists, the Receiving AO and SCA will proceed with reciprocity based on RMF documentation required by DoDI 8510.01.", "holds_when": "ART-SD is produced or seeded"}, {"kind": "rule", "target": "RCP-007", "fixture": "tests/fixtures/negative/RCP-007.yaml", "expect": "the body of evidence considered leaves out", "asserts": "Without the documents DoDI 8510.01 requires, the Receiving AO considers the body of evidence: an item left out fails", "claim": "constraint", "sentence": "When the specific documents required by DoDI 8510.01 are not available, the Receiving AO must consider the body of evidence available from the Program Office or system owner, to include, but not limited to the following information:", "holds_when": "ART-SD is produced or seeded and reciprocity.yaml records the relationship"}]
    work_item: "WI-29"
