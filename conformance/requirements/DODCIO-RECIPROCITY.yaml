  - id: "REQ-DODCIO-RECIPROCITY-0154"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 22, "anchor": "Reciprocity users can search for systems with reciprocity enabled using the “Search"}
    kind: "modal"
    locator: "6.7"
    context: "SECURITY CONFIGURATION GUIDES & SECURE CONFIGURATIONS"
    statement: "Reciprocity users can search for systems with reciprocity enabled using the “Search Reciprocity Systems” hyperlink on the eMASS homepage. After entering search criteria and searching for systems, eMASS will display the results and list all available systems and their associated organizations. (Systems will not appear in search results if they are decommissioned, have a DATO authorization status, or have opted-out of the eMASS reciprocity capability.) Once a system is selected, users will have view-only access to system information, security control assessments, POA&M items, artifacts, and system-level reports. This feature is designed to allow users to find similar systems and utilize their existing RMF assessments more easily. For more detailed information on eMASS capabilities, please refer to the eMASS Functionality guide (https://rmfks.osd.mil/rmf/HelpandResources/References/Reference%20Library/eMASS_Functio nality_Guide.pdf )."
    status: "not-a-requirement"
    reason: "Describes the eMASS search feature, now cited p. 22. 'eMASS will display the results', 'Systems will not appear' and 'users will have view-only access' say what the product does, so the will binds no one."
