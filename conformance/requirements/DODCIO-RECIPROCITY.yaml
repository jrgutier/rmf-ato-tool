  - id: "REQ-DODCIO-RECIPROCITY-0001"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 3, "anchor": "The DoD Risk Management Framework (RMF) plays a crucial role in our"}
    kind: "modal"
    locator: "1.1"
    context: "RMF ROLE IN CYBERSECURITY"
    statement: "The DoD Risk Management Framework (RMF) plays a crucial role in our cybersecurity strategy by providing a comprehensive framework for identifying, assessing, and mitigating cyber risks across the entire spectrum of DoD operations. RMF enables a consistent approach to cybersecurity by establishing a set of processes and guidelines for managing risks associated with applications, systems, and networks which can be tailored based on system/network needs. By adhering to RMF principles, the Department sets the standards and guidelines for Components to categorize assets, implement appropriate security controls, evaluate vulnerabilities, authorize these assets, and continuously monitor and respond to emerging threats. The significance of RMF lies not only in its ability to bolster the resilience of the Department’s digital infrastructure but also in its capacity to promote a proactive and adaptive cybersecurity culture. The framework fosters collaboration among various stakeholders, (e.g., system developers, administrators, and security professionals) ensuring that cybersecurity considerations are integrated from the inception of a system throughout its lifecycle, facilitating the “re-use” of capabilities proven secure within the DoD. As the threat landscape evolves, RMF allows the DoD to make informed risk-based decisions and allocate resources effectively, ultimately enabling the DoD to maintain a robust and effective cybersecurity posture in the face of evolving challenges. The Federal Risk and Authorization Management Program (FedRAMP) is another way the Department maintains cognizance of its cybersecurity posture. FedRAMP is a government-wide program that provides a standardized approach to security assessment, authorization, and continuous monitoring that cloud service providers (CSPs) must follow to gain authorization to work with federal agencies. This is especially important as the Department continues to adopt cloud technologies to modernize its digital infrastructure and operations as it emphasizes security and protection of federal information and helps accelerate the adoption of secure cloud solutions."
    status: "not-a-requirement"
    reason: "Describes what the RMF and FedRAMP do for the Department. Its one must, in 'that cloud service providers (CSPs) must follow', sits in a clause saying how FedRAMP works, so it binds no one here."
  - id: "REQ-DODCIO-RECIPROCITY-0002"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 3, "anchor": "The DoD can leverage FedRAMP or independently initiate a DoD Provisional Authorization"}
    kind: "modal"
    locator: "1.1"
    context: "RMF ROLE IN CYBERSECURITY"
    statement: "The DoD can leverage FedRAMP or independently initiate a DoD Provisional Authorization for cloud service offerings (CSOs) that DoD must use. Mission Owners (MOs) must understand the type of data, the authorized impact level, and the conditions outlined in the Provisional authorization when choosing an authorized CSO. Determination of the appropriate Impact Level for a specific mission and mission data will be the responsibility of the mission AO."
