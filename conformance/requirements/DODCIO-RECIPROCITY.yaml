  - id: "REQ-DODCIO-RECIPROCITY-0133"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 18, "anchor": "The IC released the Extensible Markup Language (XML) Data Encoding Specification for"}
    kind: "modal"
    locator: "4.5.ii"
    context: "DOD AND INTELLIGENCE COMMUNITY DoDI 8510.01, the RMF KS, and ICD 503 align to assert the following regarding reciprocity:"
    statement: "The IC released the Extensible Markup Language (XML) Data Encoding Specification for Body of Evidence (BOE.XML) as a standard for the way the BoE is stored within RMF inventory tools. This specification has been closely aligned with CNSSI 1254 and associated policies to facilitate this exchange and is intended to provide the data fields that are necessary to capture and convey the relevant information that would be used to facilitate the acceptance and reciprocity of established systems and their security authorizations. When sharing a BOE, each IC and DoD AO and Chief Information Security Officer (CISO) understands the technological complexity, cybersecurity strengths and weaknesses, and mission critical portions of their IT enterprise. Each AO must decide the right balance of cybersecurity risk against the need to execute critical mission at any point in time. As such, there are several overall cybersecurity risk items that may vary amongst agencies and must be considered before a decision on authorization for a reciprocal capability is rendered. To facilitate the exchange of BoE for reciprocity, the DoD and IC worked together to establish the following initiatives:"
    status: "partial"
    reason: "The overall risk items considered before the decision are held by RECIP-001 (the review of the provider package considers its risk factors); the first sentence, the AO's balance of risk against mission at any point in time, is a judgment no record can fail."
