  - id: "REQ-DODCIO-RECIPROCITY-0003"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 4, "anchor": "Impact Level 2 (IL2) accommodates publicly releasable data or nonpublic unclassified data"}
    kind: "lettered"
    locator: "1.1.•"
    context: "RMF ROLE IN CYBERSECURITY"
    statement: "• Impact Level 2 (IL2) accommodates publicly releasable data or nonpublic unclassified data where the unauthorized disclosure of information could be expected to have a limited adverse effect on organizational operations, organizational assets, or individuals. This includes all data cleared for public release as well as some low confidentiality unclassified information not designated as Controlled Unclassified Information (CUI) or military/contingency operations mission data, but the information may require some minimal level of access control (e.g., user ID and password). This Impact Level accommodates non-CUI information categorizations based on Committee on National Security Systems Instruction (CNSSI)1253 at moderate Confidentiality, Integrity, and Availability (C-I-A). For noncontrolled unclassified information, Impact Level 2 CSP/CSO customers include whomever the CSP chooses to market the CSO to, which may include government customers, commercial customers, and the public within the same Impact Level 2 cloud environment. Access to CSO at this impact level is via the internet. DoD has reciprocity with FedRAMP for use of CSOs on the FedRAMP Marketplace for all DoD mission systems that process IL2 data."
