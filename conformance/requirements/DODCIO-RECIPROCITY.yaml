  - id: "REQ-DODCIO-RECIPROCITY-0153"
    citation: {"ref": "DODCIO-RECIPROCITY", "page": 21, "anchor": "Certain capabilities exist within eMASS to support reciprocity activities across Federal Organizations."}
    kind: "modal"
    locator: "6.7"
    context: "SECURITY CONFIGURATION GUIDES & SECURE CONFIGURATIONS"
    statement: "Certain capabilities exist within eMASS to support reciprocity activities across Federal Organizations. Among these capabilities is the eMASS “Reciprocity” user role, which grants a set number of reciprocity users per eMASS instance—to be appointed by an Organization-defined Enterprise role (e.g., AO, CISO, CIO)— access to the eMASS reciprocity search function, allowing them to find reciprocity systems more easily. Reciprocity users can utilize this function to search across eMASS for the re-use and acceptance of systems that have an existing RMF assessment and authorization by another Organization. The eMASS Reciprocity Job Aid (https://rmfks.osd.mil/rmf/HelpandResources/References/Reference%20Library/eMASS_Recipro city_Job_Aid.pdf) is intended to assist a Reciprocity user in searching for and viewing System security assessments located in any eMASS instance. Accordingly, the “Interagency Partners” capability is intended to provide better support for these cases of collaboration or information sharing efforts. Organizations, via their eMASS System Administrators and Organization System Administrator, can identify and grant the Interagency Partner (IP) role to their users as appropriate. The Interagency Partner role appears as an “Additional” role that can be granted to a user’s account. The eMASS Interagency Partner Job Aid (https://rmfks.osd.mil/rmf/HelpandResources/References/Reference%20Library/eMASS_Interage ncyPartner_Job_Aid.pdf) is intended to assist an Interagency Partner user in searching for and viewing System security assessments located in external eMASS instances. By default, all new records are listed as reciprocity systems when registering. Users must list a reciprocity exemption justification if the option is deselected. Systems can also be designated as a reciprocity system at any time through the “System Information” page. Systems that are enabled for reciprocity will be visible to certain users across the various eMASS instances."
    status: "partial"
    reason: "left for the user: the last sentence describes what eMASS shows. The exemption justification is held as presence only (RCP-008); the search, Interagency Partner and designation sentences are permissions."
