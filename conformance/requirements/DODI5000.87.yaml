  - id: "REQ-DODI5000.87-0002"
    citation: {"ref": "DODI5000.87", "page": 3, "anchor": "The overarching management principles that govern the defense acquisition system (DAS) are"}
    kind: "lettered"
    locator: "1.2.a"
    context: "POLICY"
    statement: "a. The overarching management principles that govern the defense acquisition system (DAS) are described in DoD Directive 5000.01 and DoD Instruction (DoDI) 5000.02. The objective of the DAS is to implement the national defense strategy, through the development of a more lethal force based on U.S. technological innovation and a culture of performance that yields a decisive and sustained U.S. military advantage. To achieve that objective, DoD will employ an adaptive acquisition framework (AAF) comprised of multiple acquisition pathways. The AAF supports the DAS with the objective of delivering effective, resilient, supportable, and affordable solutions to the end user while enabling execution at the speed of relevance."
    status: "not-a-requirement"
    reason: "Background on the DAS: 'DoD will employ an adaptive acquisition framework' uses will to describe how the Department organizes acquisition, with no addressee and no act, so it binds no one. The rest points to DoDD 5000.01 and states an objective."
  - id: "REQ-DODI5000.87-0003"
    citation: {"ref": "DODI5000.87", "page": 3, "anchor": "The software acquisition pathway is for the timely acquisition of custom software"}
    kind: "lettered"
    locator: "1.2.b"
    context: "POLICY"
    statement: "b. The software acquisition pathway is for the timely acquisition of custom software capabilities developed for the DoD. Software programs that meet the definition of a covered Defense Business System (DBS) should use the DBS pathway in accordance with DoDI 5000.75 but may elect to incorporate this pathway for custom developed software."
    status: "candidate"
    work_item: "WI-34"
