  - id: "REQ-DODI5000.87-0006"
    citation: {"ref": "DODI5000.87", "page": 3, "anchor": "Programs using the software acquisition pathway will demonstrate the viability and effectiveness"}
    kind: "lettered"
    locator: "1.2.e"
    context: "POLICY"
    statement: "e. Programs using the software acquisition pathway will demonstrate the viability and effectiveness of capabilities for operational use not later than 1 year after the date on which funds are first obligated to develop the new software capability. New capabilities will be delivered to operations at least annually to iteratively meet requirements, but more frequent updates and deliveries are encouraged where practical. For programs using the embedded software path, this annual update applies after initial operational acceptance of the system in which the software is embedded and should be aligned with the associated system’s schedule. Before the operational acceptance of the system in which the software is embedded, software deliveries will be delivered to an operationally representative environment at least annually."
    status: "deferred"
    reason: "Governs delivery cadence: programs 'will demonstrate the viability and effectiveness of capabilities for operational use not later than 1 year' after first obligation, then deliver at least annually. A schedule tied to funds obligated, not an authorization input; no RMF run tests it."
  - id: "REQ-DODI5000.87-0007"
    citation: {"ref": "DODI5000.87", "page": 4, "anchor": "Programs will require government and contractor software teams to use modern iterative"}
    kind: "lettered"
    locator: "1.2.f"
    context: "POLICY"
    statement: "f. Programs will require government and contractor software teams to use modern iterative software development methodologies (e.g., agile or lean), modern tools and techniques (e.g., development, security, and operations (DevSecOps)), and human-centered design processes to iteratively deliver software to meet the users’ priority needs. These modern approaches will also instrument software such that critical monitoring functions related to the health, security, and operational effectiveness of the software can be automated to the maximum extent practicable."
    status: "candidate"
    work_item: "WI-293"
