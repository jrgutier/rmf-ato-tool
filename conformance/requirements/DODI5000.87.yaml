    statement: "In accordance with DoDI 5010.44, each program will develop and regularly update an IP strategy based on the unique characteristics of the program. The IP strategy will identify and describe the management of delivery and associated license rights for all software and related materials necessary to meet operational, cybersecurity, and supportability requirements. The IP strategy must support and be consistent with all other government strategies for design, development, test and evaluation, operation, modernization, and long-term supportability of the software, protection of the software supply chain, and must be implemented via appropriate requirements in the contracts."
    status: "deferred"
    reason: "Governs IP: 'each program will develop and regularly update an IP strategy' on delivery and license rights. Off the touchpoint list; 'cybersecurity' and 'protection of the software supply chain' are what the strategy must be consistent with, not what a run reads."
