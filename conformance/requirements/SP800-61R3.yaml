  - id: "REQ-SP800-61R3-0030"
    citation: {"ref": "SP800-61R3", "page": 13, "anchor": "The bottom level reflects that the preparation activities of Govern, Identify, and"}
    kind: "should"
    locator: "2.1"
    context: "Incident Response Life Cycle Model"
    statement: "The bottom level reflects that the preparation activities of Govern, Identify, and Protect are not part of the incident response itself. Rather, they are much broader cybersecurity risk management activities that also support incident response. Incident response is shown in the top level of the figure: Detect, Respond, and Recover. Additionally, the need for continuous improvement is indicated as the middle level with the Improvement Category (ID.IM) within the Identify Function and the dashed green lines. Lessons learned from performing all activities in all Functions are fed into Improvement, and those lessons are analyzed, prioritized, and used to inform all of the Functions. This reflects that organizations can learn new lessons at all times (e.g., detecting the presence of a new threat and characterizing its behavior) and communicate those lessons to the appropriate personnel so that the organization’s incident response and other cybersecurity risk management policies, processes, and practices can be adjusted as needed."
    status: "not-a-requirement"
    reason: "Caption-like text reading Fig. 2 level by level. It explains the picture; 'can learn' and 'can be adjusted' describe, and the improvement outcomes sit at ID.IM-01 to ID.IM-04 (0151 to 0155)."
