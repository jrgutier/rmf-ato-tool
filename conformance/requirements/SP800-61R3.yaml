    context: "Incident Response Policies, Processes, and Procedures"
    statement: "Some recommendations, considerations, and notes use terms that are not defined in this publication (e.g., “data breach”). Organizations that adopt the Community Profile should define these terms in the context of their own environments, use cases, and applicable laws and regulations. Readers may also choose to consult NIST’s glossary, which contains an aggregation of terms and definitions from numerous NIST standards, guidelines, and other publications."
