    locator: "3.1"
    context: "Table 2. CSF 2.0 Community Profile part 1: Preparation and Lessons Learned"
    statement: "ID.RA-06 | Risk responses are chosen, prioritized, planned, tracked, and communicated | High | N1: Risk responses are needed to prevent future incidents from occurring and existing incidents from reoccurring. R1: The organization’s policies, processes, and procedures should provide guidance (e.g., criteria) for making decisions regarding appropriate risk responses in various situations. N2: The four types of risk responses are 1) Accept (accept the risk as is), 2) Mitigate (reduce the risk by eliminating the vulnerabilities and/or deploying additional security controls to reduce vulnerability exploitation), 3) Transfer (reduce the risk by sharing some of the consequences with another party), and 4) Avoid (ensure that the risk does not occur by eliminating the attack surface). N3: See [IR8286] for more information on risk responses. N4: See the notes for ID.RA."
    status: "partial"
    reason: "Risk responses are prioritized by rule; the guidance for choosing them is prose"
