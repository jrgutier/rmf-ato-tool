    kind: "table"
    locator: "3.1"
    context: "Table 2. CSF 2.0 Community Profile part 1: Preparation and Lessons Learned"
    statement: "ID.IM-03 | Improvements are identified from the execution of operational processes, procedures, and activities | High | N1: The execution of operational processes, procedures, and activities includes all incident response and recovery efforts. N2: Improvements that affect incident response can be made to the incident response program itself (e.g., plan, policy, processes, procedures) or to other aspects of the organization’s cybersecurity risk management activities (e.g., identifying TTPs that are not currently being blocked by safeguards or flagged by detection technologies). N3: Improvements are often identified when creating follow-up reports for incidents or holding “lessons learned” meetings when an incident’s recovery efforts are concluding, especially if the incident was major. This provides an opportunity to review what happened, what actions were taken, and how effective those actions were, as well as hear from all"
