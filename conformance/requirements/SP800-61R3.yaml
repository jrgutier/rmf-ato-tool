    citation: {"ref": "SP800-61R3", "page": 43, "anchor": "RC.CO-04 | Public updates on incident recovery are shared using approved methods"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.CO-04 | Public updates on incident recovery are shared using approved methods and messaging | High | R1: Follow the organization’s breach notification procedures for recovering from a data breach incident. R2: Explain the steps being taken to recover from the incident and to prevent a recurrence."
    status: "candidate"
    work_item: "WI-246"
  - id: "REQ-SP800-61R3-0246"
    citation: {"ref": "SP800-61R3", "page": 12, "anchor": "At that time, incidents were relatively rare, the scope of most incidents"}
    kind: "indicative"
    locator: "2.1"
    context: "Incident Response Life Cycle Model"
    statement: "At that time, incidents were relatively rare, the scope of most incidents was narrow and well-defined, and incident response and recovery was usually completed within a day or two. Under those conditions, it was realistic to treat incident response as a separate set of activities performed by a separate team of personnel and to depict all incident response activities as part of a circular life cycle. Formal post-incident activities would identify needed improvements and feed them into the preparation stage, thus starting the cycle again. Incident response activities were typically intermittent rather than continuous."
    status: "candidate"
    removed: true
  - id: "REQ-SP800-61R3-0247"
