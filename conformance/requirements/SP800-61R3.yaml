    kind: "lettered"
    locator: "2.2.o"
    context: "Incident Response Roles and Responsibilities"
    statement: "o Available when needed (e.g., from a parent organization, a cybersecurity services provider, a business partner, or a law enforcement agency)."
    status: "not-a-requirement"
