    locator: "3.1"
    context: "Table 2. CSF 2.0 Community Profile part 1: Preparation and Lessons Learned"
    statement: "ID.RA-02 | Cyber threat intelligence is received from information sharing forums and sources | High | N1: Cyber threat intelligence (CTI) is threat information that has been aggregated, transformed, analyzed, interpreted, or enriched to provide the necessary context for decision-making processes. Organizations can receive CTI from automated CTI feeds, information sharing forums, and other sources. N2: CTI is useful for incident response and recovery in several ways, including obtaining information on new threats, improving the accuracy of cybersecurity technologies with incident detection or response capabilities, and understanding the tactics, techniques, and procedures (TTPs) used by attackers. TTPs describe the behavior of an actor. Information on threats and their TTPs is widely available through repositories and knowledge bases. N3: [SP800-150] provides guidelines on consuming, using, and storing CTIs, as well as establishing CTI relationships. N4: See the notes for ID.RA."
    status: "candidate"
