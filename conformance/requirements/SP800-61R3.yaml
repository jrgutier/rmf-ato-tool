  - id: "REQ-SP800-61R3-0197"
    citation: {"ref": "SP800-61R3", "page": 32, "anchor": "DE.CM-09 | Computing hardware and software, runtime environments, and their data are"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "DE.CM-09 | Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events | High | R1: Monitor email, web, file sharing, collaboration services, and other common attack vectors to detect malware, phishing, data leaks, exfiltration, and other adverse events. R2: Monitor authentication attempts to identify attacks against credentials and unauthorized credential use. R3: Monitor software and hardware configurations for deviations from security baselines. R4: Monitor hardware and software, including cybersecurity protection mechanisms, for signs of tampering, failure, or compromise. R5: Monitor endpoints for cyber health issues (e.g., missing patches, malware infections, or unauthorized software), and redirect endpoints with issues to a remediation environment before access is authorized."
    status: "candidate"
    work_item: "WI-182"
  - id: "REQ-SP800-61R3-0198"
    citation: {"ref": "SP800-61R3", "page": 33, "anchor": "DE.AE (Adverse Event Analysis) | Anomalies, indicators of compromise, and other potentially"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "DE.AE (Adverse Event Analysis) | Anomalies, indicators of compromise, and other potentially adverse events are analyzed to characterize the events and detect cybersecurity incidents | High | N1: Adverse event analysis involves studying the data on potentially adverse events collected by continuous monitoring to find possible attacks and compromises and declaring when an incident has occurred so as to initiate incident response activities. R1: The volume of potentially adverse events to be analyzed is generally quite high, so organizations should rely on technical solutions that filter large event datasets down to a subset that is suitable for human viewing and analysis. N2: The fidelity of events varies based on many factors. Anomalies may have benign or malicious foundations. Some incidents are relatively easy to find amid the noise, while others require deep, specialized technical knowledge and experience. N3: CTI can be invaluable in detecting malicious activity early, reducing its impact, and shortening recovery time. Signs of an incident may be more obvious later in the attack life cycle, but the incident’s impact and scope may be much larger. R2: Organizations should strive to find incidents earlier in the attack life cycle and take a proactive approach to incident detection and response."
    status: "candidate"
  - id: "REQ-SP800-61R3-0199"
    citation: {"ref": "SP800-61R3", "page": 33, "anchor": "DE.AE-02 | Potentially adverse events are analyzed to better understand associated activities"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "DE.AE-02 | Potentially adverse events are analyzed to better understand associated activities | High | R1: Use tools (e.g., security information and event management [SIEM]; security orchestration, automation, and response [SOAR]) to continuously monitor log events for known malicious and suspicious activity and to generate reports on their findings. R2: Utilize up-to-date CTI in log analysis tools to improve detection accuracy and characterize threat actors, their methods, and indicators of compromise. R3: Regularly conduct manual reviews of log events for technologies that cannot be sufficiently monitored through automation."
    status: "candidate"
    work_item: "WI-181"
  - id: "REQ-SP800-61R3-0200"
    citation: {"ref": "SP800-61R3", "page": 33, "anchor": "DE.AE-03 | Information is correlated from multiple sources | High | R1:"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "DE.AE-03 | Information is correlated from multiple sources | High | R1: Constantly transfer the log data generated by other sources to a relatively small number of log servers. R2: Use event correlation technology (e.g., SIEM, SOAR) to gather pieces of related data captured by multiple sources. R3: Utilize CTI to help correlate events among log sources."
    status: "candidate"
    work_item: "WI-181"
