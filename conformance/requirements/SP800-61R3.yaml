  - id: "REQ-SP800-61R3-0209"
    citation: {"ref": "SP800-61R3", "page": 34, "anchor": "RS.MA (Incident Management) | Responses to detected cybersecurity incidents are managed |"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MA (Incident Management) | Responses to detected cybersecurity incidents are managed | High | N1: Incident management involves overseeing responses to all incidents and shifting priorities and resources as needed. Evaluating the overall risk from an incident and applying the appropriate prioritization are perhaps the most critical decision points in the incident response process. R1: Because of resource limitations, incidents should not be handled on a first-come, first-served basis. R2: Incident triage, prioritization, escalation, and elevation and decisions regarding when to initiate recovery processes should all be based on a set of risk evaluation factors. This set can range"
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0210"
    citation: {"ref": "SP800-61R3", "page": 35, "anchor": "from simple to incredibly complex, depending on the needs and maturity of"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "from simple to incredibly complex, depending on the needs and maturity of an organization. N2: Examples of possible risk evaluation factors include asset criticality, functional impact of the incident, data impact of the incident, stage of observed activity, threat actor characterization, and recoverability. R3: The incident response status should be tracked for each incident along with pertinent information, such as an incident summary, indicators of compromise related to the incident, the status and expected time frame for each assigned action, and next steps to be taken."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0211"
    citation: {"ref": "SP800-61R3", "page": 35, "anchor": "RS.MA-01 | The incident response plan is executed in coordination with relevant"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MA-01 | The incident response plan is executed in coordination with relevant third parties once an incident is declared | High | R1: Detection technologies should automatically report incidents that they have confirmed. C1: Consider designating an incident lead for each incident. R2: If appropriate, contact the organization’s incident response service provider to request assistance. R3: Initiate execution of other cybersecurity plans as needed (e.g., business continuity and disaster recovery plans) to support incident response."
    status: "candidate"
  - id: "REQ-SP800-61R3-0212"
    citation: {"ref": "SP800-61R3", "page": 35, "anchor": "RS.MA-02 | Incident reports are triaged and validated | High | R1:"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MA-02 | Incident reports are triaged and validated | High | R1: Perform a preliminary review of a new incident report to verify that a cybersecurity incident has occurred, then estimate the severity of the incident and the level of urgency needed to respond to it. R2: Have mechanisms in place for third parties to report possible incidents that involve the organization. Reports should be carefully monitored and taken seriously. For example, the organization might be contacted by a party claiming that its systems are being attacked by a system at the organization. External users may report other indicators, such as an unavailable service. Other incident response teams may also report incidents to the organization."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0213"
    citation: {"ref": "SP800-61R3", "page": 35, "anchor": "RS.MA-03 | Incidents are categorized and prioritized | High | R1: Perform"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MA-03 | Incidents are categorized and prioritized | High | R1: Perform a more detailed review of incidents to help categorize them by incident type (e.g., data breach, ransomware, account takeover, denial of service)."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0214"
    citation: {"ref": "SP800-61R3", "page": 36, "anchor": "R2: Prioritize how quickly incident response should be performed for each incident"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "R2: Prioritize how quickly incident response should be performed for each incident based on its scope, likely impact, time- critical nature, and resource availability. R3: Select incident response strategies for active incidents by balancing the need to quickly recover from an incident with the need to observe the attacker or conduct a more thorough investigation. N1: Every response strategy decision has trade-offs. For example, a strategy that supports observing the attacker’s behavior or conducting a more thorough investigation may be at odds with the need to quickly return to normal operations."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0215"
    citation: {"ref": "SP800-61R3", "page": 36, "anchor": "RS.MA-04 | Incidents are escalated or elevated as needed | High |"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MA-04 | Incidents are escalated or elevated as needed | High | N1: Escalation generally refers to increasing resources or time frames, while elevation usually indicates involving a higher level of management in the response efforts. R1: Track and validate the status of all ongoing incidents so that incidents in need of more response resources or a change in response strategy can be identified and the necessary changes initiated rapidly."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0216"
    citation: {"ref": "SP800-61R3", "page": 36, "anchor": "RS.MA-05 | The criteria for initiating incident recovery are applied | High"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MA-05 | The criteria for initiating incident recovery are applied | High | R1: Apply incident recovery criteria to known and assumed characteristics of the incident to determine when an incident’s recovery processes should be initiated. R2: Take the possible operational disruption of incident recovery activities into account to determine when recovery should be initiated."
    status: "candidate"
    work_item: "WI-244"
  - id: "REQ-SP800-61R3-0217"
    citation: {"ref": "SP800-61R3", "page": 36, "anchor": "RS.AN (Incident Analysis) | Investigations are conducted to ensure effective response and"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.AN (Incident Analysis) | Investigations are conducted to ensure effective response and support forensics and recovery activities | High | N1: The Incident Analysis Category focuses on investigating, determining, and documenting what has happened during an incident, as well as how and why it happened."
    status: "not-a-requirement"
    reason: "Category row RS.AN, no R item: defines the group and N1 explains it; rows 0218 to 0222 carry the outcomes."
  - id: "REQ-SP800-61R3-0218"
    citation: {"ref": "SP800-61R3", "page": 36, "anchor": "RS.AN-03 | Analysis is performed to establish what has taken place during"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.AN-03 | Analysis is performed to establish what has taken place during an incident and the root cause of the incident | High | R1: Determine the sequence of events that have occurred during the incident and which assets and resources were involved in each of those events. R2: Attempt to determine what vulnerabilities, threats, and threat actors were directly or indirectly involved in the incident. R3: Analyze the incident to find the underlying or systemic root causes. R4: Check any deployed cyber deception technology for additional information on attacker behavior."
    status: "candidate"
    work_item: "WI-113"
  - id: "REQ-SP800-61R3-0219"
    citation: {"ref": "SP800-61R3", "page": 37, "anchor": "N1: This information may also be helpful for identifying weaknesses in cybersecurity"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "N1: This information may also be helpful for identifying weaknesses in cybersecurity risk management that should be addressed to prevent similar incidents from occurring in the future."
    status: "not-a-requirement"
    reason: "Note N1 of RS.AN-03, cut from 0218: 'should be addressed' sits in a remark that the information may be helpful, so the note binds no one; ir-4 c holds acting on lessons."
  - id: "REQ-SP800-61R3-0220"
    citation: {"ref": "SP800-61R3", "page": 37, "anchor": "RS.AN-06 | Actions performed during an investigation are recorded, and the records’"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.AN-06 | Actions performed during an investigation are recorded, and the records’ integrity and provenance are preserved | High | N1: Facts discovered and actions taken during incident response tasks can be recorded by many means, including a paper logbook, audio/video recordings, or automatic session monitoring and logging, as permitted by the organization’s incident response plan and policy. R1: Safeguard the confidentiality and integrity of incident response records, and ensure that only authorized personnel have access. N2: Incident response records can contain sensitive information, such as data on exploited vulnerabilities, recent data breaches, and users who may have performed inappropriate actions. The incident lead is often responsible for ensuring that incident response records are properly safeguarded."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0221"
    citation: {"ref": "SP800-61R3", "page": 37, "anchor": "RS.AN-07 | Incident data and metadata are collected, and their integrity and"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.AN-07 | Incident data and metadata are collected, and their integrity and provenance are preserved | High | N1: Many incident responses involve the collection of incident data and metadata. Formal evidence gathering and handling using chain-of-custody procedures might not be performed for every incident that occurs (e.g., most malware incidents will not result in prosecution). However, collected incident data is still considered evidence, which is defined as “grounds for belief or disbelief; data on which to base proof or to establish truth or falsehood” [SP800-160v1]. R1: Collect and retain evidence from an incident in accordance with the organization’s evidence preservation procedures and data retention policies, and consider factors such as the possibility of prosecution, and the cost of retaining the data and the hardware and software needed to access the data in the future."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0222"
    citation: {"ref": "SP800-61R3", "page": 37, "anchor": "RS.AN-08 | An incident’s magnitude is estimated and validated | High |"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.AN-08 | An incident’s magnitude is estimated and validated | High | N1: Determining the incident’s magnitude is often one of the most challenging aspects of incident response. R1: Look for indicators of compromise, evidence of persistence, and other signs of an incident on both the assets known to be targeted and other potential targets."
    status: "candidate"
  - id: "REQ-SP800-61R3-0223"
    citation: {"ref": "SP800-61R3", "page": 38, "anchor": "Skipping this activity or performing it in a superficial way may cause"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "Skipping this activity or performing it in a superficial way may cause underestimation of the incident’s magnitude, thus allowing the incident to continue indefinitely on other targets without the organization’s knowledge or monitoring."
    status: "not-a-requirement"
    reason: "Tail of RS.AN-08's R1, cut from 0222: a warning of what skipping it 'may cause'. Rationale, and the duty is live at 0222."
  - id: "REQ-SP800-61R3-0224"
    citation: {"ref": "SP800-61R3", "page": 38, "anchor": "RS.CO (Incident Response Reporting and Communication) | Response activities are coordinated with"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.CO (Incident Response Reporting and Communication) | Response activities are coordinated with internal and external stakeholders, as required by laws, regulations, or policies | High | N1: Incident response reporting and communication activities tend to fall into four categories. Incident coordination involves communicating current and planned incident response activities for a particular incident among the internal and external parties with incident response roles and responsibilities. Incident notification involves formally informing affected customers, employees, partners, regulators, or others about a data breach or other incident. Public communication involves communicating to the public about the status of a particular incident, such as responding to media inquiries. Incident information sharing involves sharing cybersecurity threat information with others, usually voluntarily, based on activity observed within the organization’s technology assets. R1: Organizations should have mechanisms in place in advance to coordinate with affected parties about incidents when needed."
    status: "candidate"
    work_item: "WI-246"
  - id: "REQ-SP800-61R3-0225"
    citation: {"ref": "SP800-61R3", "page": 38, "anchor": "RS.CO-02 | Internal and external stakeholders are notified of incidents | High"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.CO-02 | Internal and external stakeholders are notified of incidents | High | R1: When an incident is analyzed and prioritized, the incident response team should coordinate with the appropriate individuals inside and outside of the organization so that all who need to be involved will play their roles. R2: Follow established procedures concerning incident coordination that include what must be reported to whom and at what times (e.g., initial notification, regular status updates). R3: Perform notifications in compliance with the current incident notification-related laws and regulations that pertain to the organization’s sectors, geographic locations, customer locations, and any other characteristics that apply to the organization. Incident notification is an evolving topic, and new laws and regulations are being established frequently."
    status: "candidate"
    work_item: "WI-246"
  - id: "REQ-SP800-61R3-0226"
    citation: {"ref": "SP800-61R3", "page": 39, "anchor": "R4: Notify affected third parties of data breaches and other cybersecurity incidents"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "R4: Notify affected third parties of data breaches and other cybersecurity incidents in accordance with regulatory, legal, and contractual requirements. R5: Notify law enforcement agencies and regulatory bodies of incidents based on criteria in the incident response plan and management approval. Designated individuals should contact these parties in a manner consistent with the requirements of the law and the organization’s policies and procedures."
    status: "candidate"
    work_item: "WI-245"
  - id: "REQ-SP800-61R3-0227"
    citation: {"ref": "SP800-61R3", "page": 39, "anchor": "RS.CO-03 | Information is shared with designated internal and external stakeholders |"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.CO-03 | Information is shared with designated internal and external stakeholders | High | N1: Voluntary incident information sharing is often mutually beneficial because the same threats and attacks simultaneously affect multiple organizations. An example is sharing information about observed TTPs with a sector-specific Information Sharing and Analysis Center (ISAC). N2: Sharing defensive tactics between organizations can enhance overall situational awareness and increase the resiliency of all. There is a cost to threat actors to develop or purchase exploits and to deploy them. The effective identification and dissemination of detection techniques lowers the attackers’ return on investment and increases their costs. N3: Incident handlers might coordinate their efforts with colleagues at partner organizations to share tactical, technical information on mitigating an attack that spans those organizations. The organizations participating in this type of relationship are usually peers without authority over each other. In addition to choosing to share information, they may also pool resources to solve common problems. R1: Securely share information with stakeholders consistent with the organization’s response plans and information sharing agreements, including contracts with suppliers. R2: Regularly update senior leadership on the status of major incidents. R3: Notify human resources when malicious insider activity has occurred. R4: Establish and follow media communications procedures for incident response that comply with the"
    status: "candidate"
    work_item: "WI-246"
  - id: "REQ-SP800-61R3-0228"
    citation: {"ref": "SP800-61R3", "page": 40, "anchor": "organization’s policies on media interaction and information disclosure."}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "organization’s policies on media interaction and information disclosure."
    status: "not-a-requirement"
    reason: "Fragment of RS.CO-03, the end of R4. Live piece is 0227."
  - id: "REQ-SP800-61R3-0229"
    citation: {"ref": "SP800-61R3", "page": 40, "anchor": "RS.MI (Incident Mitigation) | Activities are performed to prevent expansion of an"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MI (Incident Mitigation) | Activities are performed to prevent expansion of an event and mitigate its effects | High | N1: Manually selecting containment and eradication actions may be easier and faster if the organization has criteria and procedures in place. Criteria could take the incident type into account (e.g., a cloud-based services compromise or a user endpoint ransomware infection) and use some of the risk evaluation factors in RS.MA. Another factor to consider is the duration of the containment measure (e.g., an emergency workaround that must be removed within hours, a temporary workaround to be removed within two weeks, or a permanent solution). The eradication measure’s duration could be similarly evaluated. R1: In some instances, organizations redirect an attacker to a sandbox so that they can monitor the attacker’s activity, usually to gather additional evidence. This delays containment and eradication activities. The incident response team should first discuss the feasibility of this strategy with the legal department before executing it. The intentional delay can be dangerous because an attacker could escalate unauthorized access or compromise other systems."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0230"
    citation: {"ref": "SP800-61R3", "page": 40, "anchor": "RS.MI-01 | Incidents are contained | High | N1: Containment refers to"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MI-01 | Incidents are contained | High | N1: Containment refers to preventing the expansion of an incident. Containment can prevent additional damage and avoid overwhelming the organization’s resources. Most incidents require some form of containment. C1: Consider configuring cybersecurity technologies (e.g., antivirus software) and the cybersecurity features of other technologies (e.g., operating systems, network infrastructure devices) to automatically perform some containment actions, like quarantining malware, transferring a compromised endpoint to an isolated remediation network, or halting the execution of an infected container. C2: Consider authorizing third parties (e.g., the organization’s internet service providers and cloud service providers) to automatically act to contain certain types"
    status: "candidate"
  - id: "REQ-SP800-61R3-0231"
    citation: {"ref": "SP800-61R3", "page": 41, "anchor": "of incidents (e.g., large-scale DDoS attacks) on behalf of the organization. R1:"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "of incidents (e.g., large-scale DDoS attacks) on behalf of the organization. R1: Allow incident handlers to manually select and perform containment actions instead of or in addition to automated containment measures."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0232"
    citation: {"ref": "SP800-61R3", "page": 41, "anchor": "RS.MI-02 | Incidents are eradicated | High | N1: Eradication refers to"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RS.MI-02 | Incidents are eradicated | High | N1: Eradication refers to mitigating an incident’s effects. After containment, eradication may be necessary to eliminate persistence mechanisms and entry points, such as deleting malware, disabling breached user accounts, and identifying and mitigating all exploited vulnerabilities. R1: Identify all affected hosts and services within the organization so that all flaws and weaknesses can be remediated. C1: Consider configuring cybersecurity technologies and the cybersecurity features of other technologies (e.g., operating systems, network infrastructure devices) to automatically perform some eradication actions. C2: Consider authorizing third parties (e.g., the organization’s internet service providers and cloud service providers) to automatically act to eradicate certain types of incidents on behalf of the organization. R2: Allow incident handlers to manually select and perform eradication actions instead of or in addition to automated eradication measures."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0233"
    citation: {"ref": "SP800-61R3", "page": 41, "anchor": "RC (Recover) | Assets and operations affected by a cybersecurity incident are"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC (Recover) | Assets and operations affected by a cybersecurity incident are restored | High | N1: During incident recovery, personnel restore systems to normal operations, confirm that the systems are functioning normally, and (if applicable) remediate vulnerabilities to prevent similar incidents. N2: Recovery operations include restoring systems from clean backups, rebuilding systems, replacing compromised files with clean versions, installing patches, changing passwords, and tightening security controls. In intrusions where the threat actor is highly sophisticated and the full scope of their tactics is not revealed, it may be necessary to go as far as replacing the hardware (e.g., bare metal) of all of the compromised systems. N3: For more information on incident recovery, see [SP800-184]."
    status: "not-a-requirement"
    reason: "Function row RC, no R item: repeats the definition of Recover as 0029, and N1 to N3 explain recovery; rows 0235 to 0240 carry the outcomes."
  - id: "REQ-SP800-61R3-0234"
    citation: {"ref": "SP800-61R3", "page": 42, "anchor": "RC.RP (Incident Recovery Plan Execution) | Restoration activities are performed to ensure"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.RP (Incident Recovery Plan Execution) | Restoration activities are performed to ensure operational availability of systems and services affected by cybersecurity incidents | High | N1: Executing the incident recovery plan involves selecting, prioritizing, and performing recovery actions in a secure manner; verifying the integrity of recovered assets; declaring the end of incident recovery; and completing incident documentation. N2: For more information on incident recovery plans and plan execution, see [SP800-184]."
    status: "not-a-requirement"
    reason: "Category row RC.RP, no R item: defines the group and N1 and N2 explain it; rows 0235 to 0240 carry the outcomes."
  - id: "REQ-SP800-61R3-0235"
    citation: {"ref": "SP800-61R3", "page": 42, "anchor": "RC.RP-01 | The recovery portion of the incident response plan is executed"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.RP-01 | The recovery portion of the incident response plan is executed once initiated from the incident response process | High | R1: Begin recovery procedures during or after incident response processes. R2: Inform all individuals with recovery responsibilities about the plans for recovery and the authorizations required to implement each aspect of the plans."
    status: "candidate"
    work_item: "WI-244"
  - id: "REQ-SP800-61R3-0236"
    citation: {"ref": "SP800-61R3", "page": 42, "anchor": "RC.RP-02 | Recovery actions are selected, scoped, prioritized, and performed | High"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.RP-02 | Recovery actions are selected, scoped, prioritized, and performed | High | R1: Recovery actions should take timeliness, precision, and reliability (e.g., restoring only the affected files versus restoring all files) into account. R2: Select recovery actions based on the criteria defined in the incident response plan and available resources. R3: Change planned recovery actions based on a reassessment of organizational needs and resources."
    status: "candidate"
    work_item: "WI-244"
  - id: "REQ-SP800-61R3-0237"
    citation: {"ref": "SP800-61R3", "page": 42, "anchor": "RC.RP-03 | The integrity of backups and"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.RP-03 | The integrity of backups and other restoration assets is verified before using them for restoration | High | R1: Check restoration assets for indicators of compromise, file corruption, and other integrity issues before use."
    status: "candidate"
    work_item: "WI-244"
  - id: "REQ-SP800-61R3-0238"
    citation: {"ref": "SP800-61R3", "page": 42, "anchor": "RC.RP-04 | Critical mission functions and cybersecurity risk management are considered to"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.RP-04 | Critical mission functions and cybersecurity risk management are considered to establish post-incident operational norms | High | R1: Validate that essential services are restored in the appropriate order. R2: Work with system owners to confirm the successful restoration of systems and the return to normal operations. R3: Monitor the performance of restored systems to verify the adequacy of the restoration."
    status: "candidate"
    work_item: "WI-244"
  - id: "REQ-SP800-61R3-0239"
    citation: {"ref": "SP800-61R3", "page": 42, "anchor": "RC.RP-05 | The integrity of restored assets is verified, systems and services"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.RP-05 | The integrity of restored assets is verified, systems and services are restored, and normal operating status is confirmed | High | R1: Check restored assets for indicators of compromise, and remediate the root causes of the incident before production use. R2: Verify the correctness and adequacy of the restoration actions taken before putting a restored system online."
    status: "candidate"
    work_item: "WI-244"
  - id: "REQ-SP800-61R3-0240"
    citation: {"ref": "SP800-61R3", "page": 42, "anchor": "RC.RP-06 | The end of incident recovery is declared based on criteria,"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.RP-06 | The end of incident recovery is declared based on criteria, and incident-related documentation is completed | High | R1: Prepare an after-action report that documents the incident itself, the response and recovery actions taken, and lessons learned."
    status: "candidate"
    work_item: "WI-244"
