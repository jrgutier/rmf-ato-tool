  - id: "REQ-SP800-61R3-0035"
    citation: {"ref": "SP800-61R3", "page": 14, "anchor": "Organizations should use the incident response life cycle framework or model that suits them best. The model in this document is based on CSF 2.0 to take advantage of the wealth of resources available for CSF 2.0 and aid organizations that are already using the CSF. The appropriate"}
    kind: "indicative"
    locator: "2.1"
    context: "Table 1. Previous incident response life cycle model’s phases and corresponding CSF 2.0 Functions"
    statement: "Organizations should use the incident response life cycle framework or model that suits them best. The model in this document is based on CSF 2.0 to take advantage of the wealth of resources available for CSF 2.0 and aid organizations that are already using the CSF. The appropriate incident response life cycle framework or model for an organization depends on many factors; for example, larger and more technology-dependent organizations are likely to benefit more from using a framework or model emphasizing continuous improvement than other organizations would. Regardless of the incident response life cycle framework or model used, every organization should take incident response into consideration throughout their cybersecurity risk management activities."
    status: "candidate"
  - id: "REQ-SP800-61R3-0036"
    citation: {"ref": "SP800-61R3", "page": 14, "anchor": "In the past, incident response activities were performed almost exclusively by incident"}
    kind: "modal"
    locator: "2.2"
    context: "Incident Response Roles and Responsibilities"
    statement: "In the past, incident response activities were performed almost exclusively by incident handlers from the organization’s own incident response team. Today, while incident handlers are still critically important, most organizations increasingly recognize that the success of their incident response efforts depend on the participation of many internal and external parties who hold a wide variety of roles and responsibilities and may be spread around the world. Roles and responsibilities will differ for each organization and may also differ within an organization based on the nature of a particular incident."
    status: "not-a-requirement"
    reason: "History of who performs incident response. 'responsibilities' and 'will differ' describe that roles vary between organizations, so nothing here binds anyone."
  - id: "REQ-SP800-61R3-0037"
    citation: {"ref": "SP800-61R3", "page": 15, "anchor": "Leadership. The organization’s leadership team oversees incident response, allocates funding, and may"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Leadership. The organization’s leadership team oversees incident response, allocates funding, and may have decision-making authority on high-impact response actions, such as shutting down or rebuilding critical services."
    status: "not-a-requirement"
    reason: "Example under 'Examples of incident response roles and responsibilities include the following:'. Leadership's part is described, the list is no minimum set, and 'may have' authority is a possibility."
  - id: "REQ-SP800-61R3-0038"
    citation: {"ref": "SP800-61R3", "page": 15, "anchor": "Incident handlers. Incident handlers verify that an incident has occurred, collect and"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Incident handlers. Incident handlers verify that an incident has occurred, collect and analyze data and evidence, prioritize incident response activities, and act appropriately to limit damage, find root causes, and restore operations. Incident handlers also often provide input to others on mitigating cybersecurity issues and improving resiliency. An organization’s incident handlers might be:"
    status: "not-a-requirement"
    reason: "Example under the same list: describes what incident handlers do and where they might sit. The handling itself is outcome RS and ir-4."
