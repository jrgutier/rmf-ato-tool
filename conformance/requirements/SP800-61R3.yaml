    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "DE.AE-06 | Information on adverse events is provided to authorized staff and tools | High | R1: Generate alerts and provide them to cybersecurity and incident response tools and staff (e.g., the SOC and incident responders). R2: Make log analysis findings accessible to incident responders and other authorized personnel at all times. R3: Consider automatically creating and assigning tickets in the organization’s ticketing system when certain types of alerts occur."
