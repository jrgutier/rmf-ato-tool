  - id: "REQ-SP800-61R3-0023"
    citation: {"ref": "SP800-61R3", "page": 12, "anchor": "However, the current state of incident response has greatly changed since then."}
    kind: "indicative"
    locator: "2.1"
    context: "Incident Response Life Cycle Model"
    statement: "However, the current state of incident response has greatly changed since then. Today, incidents occur frequently and cause far more damage. Recovering from them often takes weeks or months due to their breadth, complexity, and dynamic nature. Incident response is now considered a critical part of cybersecurity risk management that should be integrated across organizational operations. The lessons learned during incident response should often be shared as soon as they are identified, not delayed until after recovery concludes. Continuous improvement is increasingly necessary for all facets of cybersecurity risk management in order to keep up with modern threats."
    status: "candidate"
