  - id: "REQ-SP800-61R3-0058"
    citation: {"ref": "SP800-61R3", "page": 17, "anchor": "Processes and procedures should be based on the incident response policy and"}
    kind: "should"
    locator: "2.3"
    context: "Incident Response Policies, Processes, and Procedures While a policy is highly individualized to the organization, most incident response policies include the same key elements:"
    statement: "Processes and procedures should be based on the incident response policy and plan. Documented procedures should explain how technical processes and other operating procedures should be performed. Procedures can be tested or exercised periodically to verify their accuracy and can be used to help train new personnel. While it is impossible to have detailed procedures for every possible situation, organizations should consider documenting procedures for responding to the most common types of incidents and threats. Organizations should also develop and maintain procedures for particularly important processes that may be urgently needed during emergency situations, such as redeploying the organization’s primary authentication platform."
    status: "candidate"
    work_item: "WI-243"
  - id: "REQ-SP800-61R3-0059"
    citation: {"ref": "SP800-61R3", "page": 17, "anchor": "Many organizations choose to create playbooks as part of documenting their procedures."}
    kind: "indicative"
    locator: "2.3"
    context: "Incident Response Policies, Processes, and Procedures"
    statement: "Many organizations choose to create playbooks as part of documenting their procedures. Playbooks provide actionable steps or tasks for people to perform during various scenarios or situations. Formatting procedures within a playbook instead of another format can improve their usability. See the Cybersecurity and Infrastructure Security Agency (CISA) Cybersecurity Incident & Vulnerability Response Playbooks [CISA-PB] for incident response playbook examples."
    status: "not-a-requirement"
    reason: "Advisory text: 'Many organizations choose to create playbooks'. An option with a pointer to CISA examples, no minimum set."
