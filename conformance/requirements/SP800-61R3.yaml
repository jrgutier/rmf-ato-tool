  - id: "REQ-SP800-61R3-0244"
    citation: {"ref": "SP800-61R3", "page": 43, "anchor": "RC.CO-03 | Recovery activities and progress in restoring operational capabilities are communicated"}
    kind: "table"
    locator: "3.2"
    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "RC.CO-03 | Recovery activities and progress in restoring operational capabilities are communicated to designated internal and external stakeholders | High | R1: Securely share recovery information, including restoration progress, consistent with response plans and information sharing agreements. R2: Regularly update senior leadership on recovery status and restoration progress for major incidents. R3: Follow the rules and protocols defined in contracts for incident information sharing between the organization and its suppliers. R4: Coordinate crisis communication between the organization and its critical suppliers."
