rejected:
  - {"page": 10, "locator": "Executive Summary.1", "reason": "label-only", "text": "1. Introduction"}
  - {"page": 10, "locator": "Executive Summary.1", "reason": "no-marker", "text": "Within this document, an event is any observable occurrence that involves computing assets, including physical and virtual platforms, networks, services, and cloud environments. Examples of events are user login attempts, the installation of software updates, and an application responding to a transaction request. Many events focus on security or have security implications. Adverse events are any events associated with a negative consequence regardless of cause, including natural disasters, power failures, or cybersecurity attacks. This guide addresses only adverse cybersecurity events. Additional analysis is often needed to determine whether adverse cybersecurity events indicate that a cybersecurity incident has occurred."}
  - {"page": 10, "locator": "Executive Summary.1", "reason": "no-marker", "text": "A cybersecurity incident (or simply incident) is"}
  - {"page": 10, "locator": "Executive Summary.1", "reason": "no-marker", "text": "...an occurrence that actually or imminently jeopardizes, without lawful authority, the integrity, confidentiality, or availability of information or an information system; or constitutes a violation or imminent threat of violation of law, security policies, security procedures, or acceptable use policies. [FISMA2014]"}
  - {"page": 10, "locator": "Executive Summary.1", "reason": "not-a-statement", "text": "Examples of incidents include an attacker:"}
  - {"page": 10, "locator": "Executive Summary.1", "reason": "no-marker", "text": "Because of the damage that cybersecurity incidents can inflict on organizations and their customers, business partners, and others, it is vital to respond quickly and effectively when an incident occurs. Effective implementation of incident response processes enables systematic responses to and recovery from incidents by analyzing information and taking appropriate action. This reduces cybersecurity and enterprise risks by minimizing data loss or theft, the disruption of services, and the overall impact of incidents. Lessons learned from incident response activities and root cause analysis help improve cybersecurity risk management and governance efforts and ensure that the organization is better prepared to identify its current technology assets and cybersecurity risks, protect its assets, and detect, respond to, and recover from future incidents."}
  - {"page": 11, "locator": "1.1", "reason": "no-marker", "text": "The scope of this publication differs significantly from previous versions. Because the details of how to perform incident response activities change so often and vary so much across technologies, environments, and organizations, it is no longer feasible to capture and maintain that information in a single static publication. Instead, this version focuses on improving cybersecurity risk management for all of the NIST Cybersecurity Framework (CSF) 2.0 Functions [CSF2.0] to better support an organization’s incident response capabilities."}
  - {"page": 11, "locator": "1.1", "reason": "no-marker", "text": "This publication supersedes SP 800-61r2 (Revision 2), Computer Security Incident Handling Guide [SP800-61r2]."}
  - {"page": 11, "locator": "1.2", "reason": "lead-in", "text": "The remainder of this document is organized into the following sections and appendices:"}
  - {"page": 12, "locator": "2.1", "reason": "not-a-statement", "text": "Fig. 1 depicts the incident response life cycle model illustrated in the previous version of this publication [SP800-61r2]."}
  - {"page": 12, "locator": "2.1", "reason": "not-a-statement", "text": "Fig. 1. Previous incident response life cycle model"}
  - {"page": 12, "locator": "2.1", "reason": "no-marker", "text": "At that time, incidents were relatively rare, the scope of most incidents was narrow and well-defined, and incident response and recovery was usually completed within a day or two. Under those conditions, it was realistic to treat incident response as a separate set of activities performed by a separate team of personnel and to depict all incident response activities as part of a circular life cycle. Formal post-incident activities would identify needed improvements and feed them into the preparation stage, thus starting the cycle again. Incident response activities were typically intermittent rather than continuous."}
  - {"page": 13, "locator": "2.1", "reason": "not-a-statement", "text": "Fig. 2 shows a high-level incident response life cycle model based on the six CSF 2.0 Functions, which organize cybersecurity outcomes at their highest level:"}
  - {"page": 13, "locator": "2.1", "reason": "no-marker", "text": "All six Functions have vital roles in incident response. Govern, Identify, and Protect help organizations prevent some incidents, prepare to handle incidents that do occur, reduce the impact of those incidents, and improve incident response and cybersecurity risk management practices based on lessons learned. Detect, Respond, and Recover help organizations discover, manage, prioritize, contain, eradicate, and recover from cybersecurity incidents, as well as perform incident reporting, notification, and other incident-related communications."}
  - {"page": 13, "locator": "2.1", "reason": "not-a-statement", "text": "Fig. 2. Incident response life cycle model based on CSF 2.0 Functions"}
  - {"page": 14, "locator": "2.1", "reason": "not-a-statement", "text": "Table 1 maps the previous SP 800-61 incident response life cycle model’s phases to the corresponding CSF 2.0 Functions used in this document."}
  - {"page": 15, "locator": "2.2", "reason": "not-a-statement", "text": "Examples of incident response roles and responsibilities include the following:"}
  - {"page": 18, "locator": "2.3.3", "reason": "no-marker", "text": "This section defines NIST’s CSF 2.0 Community Profile for cyber incident risk management. It uses the CSF Core as the basis for highlighting and prioritizing cybersecurity outcomes that are important for incident response, makes recommendations, and provides other supporting information for certain CSF outcomes within the context of incident response [CSWP32]. The Community Profile is split into two tables: Table 2 covers Preparation (Govern, Identify, and Protect) and Lessons Learned (Identify-Improvement), while Table 3 covers Incident Response (Detect, Respond, and Recover)."}
  - {"page": 18, "locator": "2.3.3", "reason": "no-marker", "text": "Each CSF 2.0 Function, Category, and Subcategory has its own row in one of the two tables. Each row’s relative priority within the context of incident response is indicated by one of the following:"}
  - {"page": 18, "locator": "2.3.3", "reason": "no-marker", "text": "The last column may contain one or more items that recommend what to do or describe additional considerations or supporting information for some rows. Each item in that column has an ID starting with one of the following:"}
  - {"page": 18, "locator": "2.3.3", "reason": "no-marker", "text": "An R, C, or N designation and its number can be appended to the row’s CSF ID to create an identifier that is unique within the Community Profile (e.g., “GV.OC-03.R1” is recommendation 1 for CSF Subcategory GV.OC-03)."}
  - {"page": 19, "locator": "2.3.3", "reason": "no-marker", "text": "The Community Profile is intended for use by most organizations, regardless of sector, size, or other factors. Additional versions of this Community Profile could be developed for narrower audiences, such as federal agencies, small businesses, or educational institutions. For more information on CSF 2.0 Community Profiles, see the Framework Resource Center."}
  - {"page": 19, "locator": "3.1", "reason": "not-a-statement", "text": "Table 2 contains the first part of the Community Profile: Preparation and Lessons Learned, which both support the Incident Response part of the Community Profile defined in Table 3."}
  - {"page": 19, "locator": "3.1", "reason": "no-marker", "text": "Note: Most of the CSF elements in this part of the Profile are not specific to executing incident response activities, so they have lower priorities with respect to incident response and do not contain recommendations or considerations. This does not imply that they are unnecessary for organizations to achieve, but rather that they are outside of the direct scope of responding to incidents."}
  - {"page": 31, "locator": "3.2", "reason": "not-a-statement", "text": "Table 3 contains the second part of the Community Profile: Incident Response."}
  - {"page": 31, "locator": "3.2", "reason": "no-marker", "text": "Note: All of the CSF elements in this part of the Profile are specific to responding to incidents, so they have higher priorities with respect to incident response than those in the first part. Accordingly, all CSF elements in this part have recommendations or considerations."}
