    kind: "modal"
    locator: "Executive Summary"
    context: "All six NIST Cybersecurity Framework (CSF) 2.0 Functions play vital roles in incident response:"
    statement: "Many individuals, teams, and third parties hold a wide variety of roles and responsibilities across all of the Functions that support an organization’s incident response. Organizations have no direct control over the tactics and techniques used by their adversaries, nor are they certain about the timing of a future incident other than knowing that another incident is inevitable. However, organizations can use an incident response life cycle framework or model that best suits them to develop strong cybersecurity risk management practices that reduce their risks to acceptable levels."
    status: "not-a-requirement"
    reason: "Background. 'responsibilities' are only something many parties hold, and 'can use' a model is a permission, so it binds no one; the duty to use a model is live at 0035."
  - id: "REQ-SP800-61R3-0005"
    citation: {"ref": "SP800-61R3", "page": 9, "anchor": "This publication uses the CSF 2.0 Functions, Categories, and Subcategories to organize"}
    kind: "indicative"
    locator: "Executive Summary"
    context: ""
    statement: "This publication uses the CSF 2.0 Functions, Categories, and Subcategories to organize its recommendations, considerations, and other information regarding incident response as a CSF 2.0 Community Profile. Doing so provides a common taxonomy that is already widely used for communicating about incident response and cybersecurity risk management and governance. This also enables organizations to access a range of online resources mapped to each Function, Category, and Subcategory through the NIST Cybersecurity and Privacy Reference Tool (CPRT). These resources include mappings to other incident response and cybersecurity risk management standards and guidance, as well as sources of implementation guidance that organizations can choose to utilize as needed."
    status: "not-a-requirement"
    reason: "Explains why the publication is laid out as a CSF 2.0 Community Profile and what CPRT offers. Description of the document; 'can choose' is a permission."
  - id: "REQ-SP800-61R3-0006"
    citation: {"ref": "SP800-61R3", "page": 9, "anchor": "Organizations should use the incident response life cycle framework or model that suits them best. The model in this document is based on CSF 2.0 to take advantage of the wealth of resources available for CSF 2.0 and aid organizations that are already using the CSF. Regardless of"}
