  - id: "REQ-SP800-61R3-0155"
    citation: {"ref": "SP800-61R3", "page": 28, "anchor": "ID.IM-04 | Incident response plans and other cybersecurity plans that affect operations"}
    kind: "table"
    locator: "3.1"
    context: "Table 2. CSF 2.0 Community Profile part 1: Preparation and Lessons Learned"
    statement: "ID.IM-04 | Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved | High | N1: Several types of cybersecurity plans are relevant to incident response, including 1) incident response plans, which provide the roadmap for implementing the incident response capability; 2) vulnerability management plans, which help identify and assess all types of vulnerabilities and prioritize, test, and implement risk responses; and 3) business continuity plans. R1: Synchronize business continuity plans with incident response plans since incidents can undermine business resilience. R2: Review and update all cybersecurity plans periodically or when a need for significant improvements is identified. R3: Base each cybersecurity plan on the organization’s unique requirements, mission, size, structure, and functions. R4: Each cybersecurity plan should identify the resources and management support needed to carry it out successfully. N2: Business continuity planning professionals who are made aware of cybersecurity incidents and their impacts can fine-tune business impact assessments, risk assessments, and continuity of operations plans. Further, because business continuity planners have extensive expertise in minimizing operational disruption during severe circumstances, they may be valuable in planning responses to specific incident types, such as denial-of- service (DoS) conditions."
    status: "candidate"
    work_item: "WI-07"
