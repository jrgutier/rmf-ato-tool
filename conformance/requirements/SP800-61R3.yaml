    context: "Table 3. CSF 2.0 Community Profile part 2: Incident Response"
    statement: "DE.AE-07 | Cyber threat intelligence and other contextual information are integrated into the analysis | High | R1: Integrate up-to-date CTI and other contextual information (e.g., asset inventories) into adverse event analysis to improve detection accuracy and characterize threat actors, their methods, and indicators of compromise. R2: Rapidly acquire and analyze vulnerability disclosures for the organization’s technologies from suppliers, vendors, and third-party security advisories. N1: See [SP800-150] for guidelines on consuming, using, and storing CTIs, as well as establishing CTI relationships."
    status: "candidate"
