  - id: "REQ-SP800-61R3-0042"
    citation: {"ref": "SP800-61R3", "page": 15, "anchor": "Many organizations may use more than one of these approaches, such as"}
    kind: "modal"
    locator: "2.2"
    context: "Incident Response Roles and Responsibilities"
    statement: "Many organizations may use more than one of these approaches, such as internally performing basic incident response and engaging third-party resources for assistance with certain incidents. Larger organizations may have multiple incident response teams, with each team responsible for a particular logical or physical segment of the organization. When this model is employed, the teams should be part of a single coordinated entity (e.g., a federation) to ensure that incident response processes, procedures, and training are consistent across the organization and that information is shared among teams."
    status: "candidate"
  - id: "REQ-SP800-61R3-0043"
    citation: {"ref": "SP800-61R3", "page": 15, "anchor": "Technology professionals. Cybersecurity, privacy, system, network, cloud, and other technology architects, engineers,"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Technology professionals. Cybersecurity, privacy, system, network, cloud, and other technology architects, engineers, and administrators, as well as software developers, may be involved in incident response and recovery efforts."
    status: "not-a-requirement"
    reason: "Example under the same list: technology professionals 'may be involved' in response. A possibility, no duty."
  - id: "REQ-SP800-61R3-0044"
    citation: {"ref": "SP800-61R3", "page": 15, "anchor": "Legal. Legal experts can review incident response plans, policies, and procedures to"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Legal. Legal experts can review incident response plans, policies, and procedures to ensure compliance with applicable laws and regulations, including the right to privacy. Legal experts can also review contracts with technology suppliers and other third parties when there are incident response implications. In addition, incident responders can seek guidance from their organization’s legal department if a particular incident may have legal ramifications, such as the prosecution of a suspect, lawsuits, or situations that require a memorandum of understanding (MOU) or other binding agreement."
    status: "not-a-requirement"
    reason: "Example under the same list: legal experts 'can review' plans and contracts, a possibility. 'require' only describes situations that require an MOU, which binds no one; the one legal step that is a recommendation is at 0229."
  - id: "REQ-SP800-61R3-0045"
    citation: {"ref": "SP800-61R3", "page": 15, "anchor": "Public affairs and media relations. Depending on the nature and impact of"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Public affairs and media relations. Depending on the nature and impact of an incident, it may be necessary to inform the media and, by extension, the public. Sometimes, the media learns of incidents through alternate sources (i.e., not through public affairs personnel). Having a media engagement strategy in place can greatly aid in this situation."
    status: "not-a-requirement"
    reason: "Example under the same list: it 'may be necessary' to inform the media, and a strategy 'can greatly aid'. Advice; the media procedure is the recommendation at 0227."
  - id: "REQ-SP800-61R3-0046"
    citation: {"ref": "SP800-61R3", "page": 16, "anchor": "Human resources. Certain human resources practices should consider cybersecurity risk management, including"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Human resources. Certain human resources practices should consider cybersecurity risk management, including pre-employment screening and employee onboarding, offboarding, and position changes. Human resources may also be involved if an employee is suspected of intentionally causing an incident."
    status: "candidate"
  - id: "REQ-SP800-61R3-0047"
    citation: {"ref": "SP800-61R3", "page": 16, "anchor": "Physical security and facilities management. Some computer security incidents occur through physical"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Physical security and facilities management. Some computer security incidents occur through physical security breaches or involve coordinated logical and physical attacks. The incident response team may also need access to facilities during incident handling (e.g., to access a compromised workstation in a locked office)."
    status: "not-a-requirement"
    reason: "Example under the same list: some incidents involve physical breaches and the team 'may also need access' to facilities. Description, no duty."
  - id: "REQ-SP800-61R3-0048"
    citation: {"ref": "SP800-61R3", "page": 16, "anchor": "Asset owners. Asset owners (e.g., system owners, data owners, and business process"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Incident Response Roles and Responsibilities"
    statement: "• Asset owners. Asset owners (e.g., system owners, data owners, and business process owners) may have valuable insights on response and recovery priorities for their affected assets. They also need to be kept up to date on the status of response and recovery efforts."
    status: "candidate"
    work_item: "WI-246"
  - id: "REQ-SP800-61R3-0049"
    citation: {"ref": "SP800-61R3", "page": 16, "anchor": "Third parties may be under contract with an organization to help perform"}
    kind: "modal"
    locator: "2.2"
    context: "Incident Response Roles and Responsibilities"
    statement: "Third parties may be under contract with an organization to help perform incident response activities. Some third parties may fill a primary role (e.g., an MSSP performing incident detection, response, and recovery activities), while other parties (e.g., cloud service providers [CSPs] and internet service providers [ISPs]) may be involved in certain incident response activities for particular types of incidents. This is a shared responsibility model in which the organization transfers some of its responsibilities to a provider. These responsibilities should be clearly defined in a contract, and the incident response team should be aware of the division of responsibilities, including information flows, coordination, and authority to act on behalf of the organization. This also includes restrictions on what the service provider can do, such as sharing sanitized incident information with other customers or making and implementing operational decisions (e.g., immediately deactivating certain services to contain an incident)."
    status: "candidate"
    work_item: "WI-242"
  - id: "REQ-SP800-61R3-0050"
    citation: {"ref": "SP800-61R3", "page": 16, "anchor": "A service provider may detect malicious activity sooner than individual organizations would"}
    kind: "should"
    locator: "2.2"
    context: "Incident Response Roles and Responsibilities"
    statement: "A service provider may detect malicious activity sooner than individual organizations would because it can correlate events across its customers. In some situations, a service provider might be able to use knowledge of an incident with one customer to proactively prevent similar incidents with its other customers. Service providers often have privileged access to organizational systems and may also have access to sensitive organizational data. Accordingly, the risk of malicious insiders or the service provider being compromised should be considered and addressed. Non-disclosure agreements (NDAs) and contracting clauses are options for deterring the unauthorized disclosure of sensitive data."
    status: "candidate"
    work_item: "WI-199"
  - id: "REQ-SP800-61R3-0051"
