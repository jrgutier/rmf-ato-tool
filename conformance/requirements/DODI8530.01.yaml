    statement: "1. PURPOSE. In accordance with the authority in DoD Directive (DoDD) 5144.02 (Reference (a)), this instruction:"
    status: "not-a-requirement"
    reason: "Lead-in to the purpose clause. 'In accordance with the authority in DoDD 5144.02' only names the authority for issuing the instruction, so it binds no one; what follows are the purposes."
  - id: "REQ-DODI8530.01-0002"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Reissues DoDD O-8530.1 (Reference (b)) as a DoD Instruction (DoDI) and incorporates"}
    kind: "lettered"
    locator: "References: See Enclosure 1.a"
    context: ""
    statement: "a. Reissues DoDD O-8530.1 (Reference (b)) as a DoD Instruction (DoDI) and incorporates and cancels DoDI O-8530.2 (Reference (c)) to establish policy and assign responsibilities to protect the Department of Defense information network (DODIN) against unauthorized activity, vulnerabilities, or threats."
    status: "not-a-requirement"
    reason: "Purpose: the instruction reissues DoDD O-8530.1. 'Assign responsibilities' announces that Enclosure 2 does so and binds no one here; the responsibilities are the entries of that enclosure."
  - id: "REQ-DODI8530.01-0003"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Supports the Joint Information Environment (JIE) concepts as outlined in JIE Operations"}
    kind: "lettered"
    locator: "References: See Enclosure 1.b"
    context: ""
    statement: "b. Supports the Joint Information Environment (JIE) concepts as outlined in JIE Operations Concept of Operations (CONOPS) (Reference (d))."
    status: "not-a-requirement"
    reason: "Purpose: says the instruction supports the JIE concepts in the JIE Operations CONOPS. Background, no action on anyone."
  - id: "REQ-DODI8530.01-0004"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Supports the formation of Cyber Mission Forces (CMF), development of the Cyber"}
    kind: "lettered"
    locator: "References: See Enclosure 1.c"
    context: ""
    statement: "c. Supports the formation of Cyber Mission Forces (CMF), development of the Cyber Force Concept of Operations and Employment, evolution of cyber command and control, cyberspace operations doctrine in Joint Publication 3-12 (Reference (e)), and evolving cyber threats."
    status: "not-a-requirement"
    reason: "Purpose: says the instruction supports forming the Cyber Mission Forces and cyber doctrine. Background to why it was issued."
  - id: "REQ-DODI8530.01-0005"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Supports the Risk Management Framework (RMF) requirements to monitor security controls continuously,"}
    kind: "lettered"
    locator: "References: See Enclosure 1.d"
    context: ""
    statement: "d. Supports the Risk Management Framework (RMF) requirements to monitor security controls continuously, determine the security impact of changes to the DODIN and operational environment, and conduct remediation actions as described in DoDI 8510.01 (Reference (f)."
    status: "not-a-requirement"
    reason: "Purpose: says the instruction supports the RMF requirements of DoDI 8510.01. The monitoring and remediation duties it names live in 8510.01 and in Enclosure 3 here, so this line only points at them."
  - id: "REQ-DODI8530.01-0006"
