  - id: "REQ-DODI8530.01-0024"
    citation: {"ref": "DODI8530.01", "page": 3, "anchor": "DoD IT will be aligned to DoD network operations and security centers"}
    kind: "lettered"
    locator: "References: See Enclosure 1.d"
    context: ""
    statement: "d. DoD IT will be aligned to DoD network operations and security centers (NOSCs). The NOSC and supporting cybersecurity service provider(s) will provide any required cybersecurity services to aligned systems."
