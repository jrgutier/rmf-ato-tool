    statement: "c. These activities enable DoD Components to implement active or passive actions and measures to mitigate or counter vulnerabilities and threats to the DODIN. By effectively uniting the skills and capabilities of assigned cybersecurity personnel, supporting service providers and CMF will enable DoD to protect the DODIN."
    status: "candidate"
  - id: "REQ-DODI8530.01-0219"
    citation: {"ref": "DODI8530.01", "page": 27, "anchor": "VULNERABILITY ASSESSMENT AND ANALYSIS ACTIVITIES. Vulnerability assessment and analysis are vital proactive"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c.2"
    context: ""
    statement: "2. VULNERABILITY ASSESSMENT AND ANALYSIS ACTIVITIES. Vulnerability assessment and analysis are vital proactive activities to determine the adequacy of cybersecurity measures for DODIN assets. Vulnerability assessment and analysis apply a variety of techniques (e.g., network discovery, network and host vulnerability scanning, penetration testing) to identify vulnerabilities and to assess whether DODIN assets conform to recommended security policies and configurations. The DoD Vulnerability Assessment and Analysis activities:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0220"
    citation: {"ref": "DODI8530.01", "page": 27, "anchor": "Provide the capability to determine systematically the current adequacy of cybersecurity measures"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: ""
    statement: "a. Provide the capability to determine systematically the current adequacy of cybersecurity measures for the DoD Component portion of the DODIN; identify deficiencies; provide data from which to predict the effectiveness of proposed cybersecurity measures; and confirm the adequacy of such measures after implementation. Guidance on information security testing and assessment can be found in NIST SP 800-115 (Reference (bq))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0221"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "Employ organic and external capabilities to conduct vulnerability assessments, intrusion assessments, insider"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: ""
    statement: "b. Employ organic and external capabilities to conduct vulnerability assessments, intrusion assessments, insider threat assessments, penetration testing, cyber red team operation assessments, or inspections to evaluate the ability of or compliance with DoD Component organization defense plans, DODIN operations’ activities, and cybersecurity service provider ability to provide required supporting cybersecurity services."
    status: "candidate"
  - id: "REQ-DODI8530.01-0222"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "Perform network and host vulnerability scanning to verify vulnerability remediation, identify open"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: ""
    statement: "c. Perform network and host vulnerability scanning to verify vulnerability remediation, identify open ports, vulnerable software, and misconfigured services on a network, and identifies specific host operating system and application misconfigurations and vulnerabilities in accordance with Reference (bp) and CJCSM 6510.02 (Reference (br))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0223"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "Provide the CDRUSSTRATCOM visibility and insight into the cybersecurity status of their"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: ""
    statement: "d. Provide the CDRUSSTRATCOM visibility and insight into the cybersecurity status of their respective portion of the DODIN to assess risk to the DODIN through reports, findings, and analyses resulting from vulnerability assessments, intrusion assessments, evaluations, inspections, exercises, DoD Cyber Red Team operations, or lessons learned from military operations."
    status: "candidate"
  - id: "REQ-DODI8530.01-0224"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "Validate that DoD Component cyber red teams employed externally to the DoD"}
    kind: "lettered"
    locator: "ENCLOSURE 3.e"
    context: ""
    statement: "e. Validate that DoD Component cyber red teams employed externally to the DoD Component’s portion of the DODIN are authorized to conduct those operations in accordance with Reference (al)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0225"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "Inform the CDRUSSTRATCOM and the DIRNSA/CHCSS of ongoing DoD Component cyber red"}
    kind: "lettered"
    locator: "ENCLOSURE 3.f"
    context: ""
    statement: "f. Inform the CDRUSSTRATCOM and the DIRNSA/CHCSS of ongoing DoD Component cyber red team operations. If a DoD Component has multiple authorized cyber red teams, a single office or organization must be designated as the point of contact for maintaining visibility of all the DoD Component cyber red team operations and coordinating activities with USSTRATCOM and the DIRNSA/CHCSS."
    status: "candidate"
  - id: "REQ-DODI8530.01-0226"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "VULNERABILITY MANAGEMENT PROGRAM. Vulnerability management requires preemptive actions by DoD organizations to"}
    kind: "lettered"
    locator: "ENCLOSURE 3.f.3"
    context: ""
    statement: "3. VULNERABILITY MANAGEMENT PROGRAM. Vulnerability management requires preemptive actions by DoD organizations to identify and prevent the exploitation of DODIN vulnerabilities. Vulnerability management is used by DoD organization to identify, categorize, remediate, and mitigate vulnerabilities in DODIN assets. The primary objective of vulnerability management is to detect and remediate vulnerabilities in a pre-emptive approach based on threat and mission operations. Vulnerabilities will either be mitigated or accepted based on risk management (e.g., threat impact is low; correction would affect mission operations). The DoD Vulnerability Management Program:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0227"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "Requires a system inventory including hardware equipment, operating systems, and software applications"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: ""
    statement: "a. Requires a system inventory including hardware equipment, operating systems, and software applications and applies DoD required and organization-accepted standard security configurations to improve the effectiveness and reduce the time and resources required to conduct DODIN operations and DoD Component or CDRUSSTRATCOM DCO internal defensive measures."
    status: "candidate"
  - id: "REQ-DODI8530.01-0228"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "Provides the capability to receive threat, vulnerability, and attack notifications; and take"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: ""
    statement: "b. Provides the capability to receive threat, vulnerability, and attack notifications; and take directed corrective actions to mitigate potential vulnerabilities or threats to the DoD Component’s portion of the DODIN in accordance with Reference (br), and as described in NIST SP 800-40, Revision 3 (Reference (bs))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0229"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Establishes a vulnerability management process and procedures that provide positive control to"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: ""
    statement: "c. Establishes a vulnerability management process and procedures that provide positive control to implement actions on the DoD Component-owned or operated portion of the DODIN in accordance with CDRUSSTRATCOM orders or other directives issued through the CDRUSCYBERCOM, such as a TASKORD or vulnerability management alert for patching or configuration changes."
    status: "candidate"
  - id: "REQ-DODI8530.01-0230"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Verifies DoD Component organizations and individuals take directed actions, maintain POA&Ms and"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: ""
    statement: "d. Verifies DoD Component organizations and individuals take directed actions, maintain POA&Ms and provide compliance status through the relevant DoD Component reporting chain to CDRUSCYBERCOM in accordance with Reference (br) and DoD Component head and CDRUSCYBERCOM guidance."
    status: "candidate"
  - id: "REQ-DODI8530.01-0231"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "MALWARE PROTECTION PROCESS. Malware protection that is properly implemented and maintained helps"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.4"
    context: ""
    statement: "4. MALWARE PROTECTION PROCESS. Malware protection that is properly implemented and maintained helps prevent damaging attack by countering unauthorized changes made to software and hardware by malicious code that could otherwise leak information or disable capabilities. Malware protection helps an organization protect against and respond to software or firmware intended to perform an unauthorized process that will have an adverse impact on the confidentiality, integrity, or availability of a system. The DoD malware protection process:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0232"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Provides the capability to prevent malware incidents such as from malicious code,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: ""
    statement: "a. Provides the capability to prevent malware incidents such as from malicious code, malicious logic, or malicious applets; detects and analyzes malware; contains the spread of malware and prevents further damage; eradicates the malware from infected hosts; employs mitigating actions to prevent reinfection; and restores functionality and removes temporary containment measures as described in NIST SP 800-83, Revision 1 (Reference (bt))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0233"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Employs malware detection mechanisms at DODIN entry and exit points (e.g., firewalls,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: ""
    statement: "b. Employs malware detection mechanisms at DODIN entry and exit points (e.g., firewalls, email servers, Web servers, proxy servers, remote access servers) and at endpoint devices (e.g., workstations, servers, mobile computing devices) on the network to detect and remove malicious code transported by electronic mail, electronic mail attachments, Web accesses, removable media or other means, or inserted through the exploitation of DODIN vulnerabilities."
    status: "candidate"
  - id: "REQ-DODI8530.01-0234"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Configures malware detection mechanisms to perform periodic scans of the DODIN in"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: ""
    statement: "c. Configures malware detection mechanisms to perform periodic scans of the DODIN in accordance with current DoD and DoD Component guidance."
    status: "candidate"
  - id: "REQ-DODI8530.01-0235"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Incorporates malware incident prevention and handling into awareness training."}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: ""
    statement: "d. Incorporates malware incident prevention and handling into awareness training."
    status: "candidate"
  - id: "REQ-DODI8530.01-0236"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "ISCM. ISCM provides constant observation and analysis of the operational states of"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.5"
    context: ""
    statement: "5. ISCM. ISCM provides constant observation and analysis of the operational states of systems to provide decision support regarding situational awareness and deviations from expectations. Overall ISCM furnishes ongoing observation, assessment, analysis, and diagnosis of an organization’s cybersecurity posture, cyber hygiene, and cybersecurity operational readiness. The DoD ISCM:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0237"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "Establishes the capability to capture, correlate, analyze, and provide continuous visibility into"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: ""
    statement: "a. Establishes the capability to capture, correlate, analyze, and provide continuous visibility into DoD assets; and the security status of DoD Components represented by the security domains monitored; assesses the compliance, effectiveness, and changed state of security controls protecting the DoD Component-owned or -operated portion of the DODIN; and maintains ongoing awareness of information security, threats, and vulnerabilities to support organizational risk management decisions. Guidance on ISCM can be found in NIST SP 800-137 (Reference (bu)), NIST SP 800-37 (Reference (bv)), and NIST SP 800-39 (Reference (bw))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0238"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "Supports DODIN operations by providing ongoing awareness of threats and security status"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: ""
    statement: "b. Supports DODIN operations by providing ongoing awareness of threats and security status of traffic, fault, performance, bandwidth, route, and associated network management areas. ISCM also supports monitoring of employee use of the DODIN to detect anomalous activity in accordance with Reference (x)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0239"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "Supports DODIN operations and DCO internal defensive measures by providing ongoing awareness"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: ""
    statement: "c. Supports DODIN operations and DCO internal defensive measures by providing ongoing awareness and security status of reportable cyber events and incidents. This capability supports timely informed and actionable cyber incident handling decisions in accordance with CJCSM 6510.01B (Reference (bx))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0240"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "Supports the RMF by providing ongoing awareness and security status of the"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: ""
    statement: "d. Supports the RMF by providing ongoing awareness and security status of the posture of an organization’s information and systems. This capability supports timely informed and actionable risk decisions and continued RMF decisions in accordance with Reference (f)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0241"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "Synchronizes requirements through the DoD Information Security Continuous Monitoring Working Group (ISCMWG)."}
    kind: "lettered"
    locator: "ENCLOSURE 3.e"
    context: ""
    statement: "e. Synchronizes requirements through the DoD Information Security Continuous Monitoring Working Group (ISCMWG). The DoD ISCMWG is the assigned governance body for ISCM collaboration, cooperation, and coordination; the principal venue by which DoD synchronizes policy, strategy, and requirements for ISCM implementation across DoD national security systems (NSSs) and non-NSSs."
    status: "candidate"
  - id: "REQ-DODI8530.01-0242"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "CYBER INCIDENT HANDLING PROGRAM. DoD cyber incident handling program protects, monitors, analyzes,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.e.6"
    context: ""
    statement: "6. CYBER INCIDENT HANDLING PROGRAM. DoD cyber incident handling program protects, monitors, analyzes, and detects unauthorized or anomalous activity on the DODIN. Information such as classified data spills, unauthorized access, and outages are collected and distributed through a joint incident management system. The DoD Cyber Incident Handling Program:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0243"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "Provides the capability to analyze and respond to events or cyber incidents"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: ""
    statement: "a. Provides the capability to analyze and respond to events or cyber incidents to mitigate any adverse operational or technical impact on the DoD Component-owned or -operated portion of the DODIN in accordance with Reference (bx), Committee on National Security Systems Instruction (CNSSI) No. 1010 (Reference (by)), and as described in NIST SP 800-61 (Reference (bz)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0244"
    citation: {"ref": "DODI8530.01", "page": 30, "anchor": "Ensures the acquisition and preservation of copies of digital media, logs, and"}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: ""
    statement: "b. Ensures the acquisition and preservation of copies of digital media, logs, and investigative and technical data associated with cyber intrusion incidents, investigations, and operations required for tactical analysis, strategic analysis, or law enforcement investigations in accordance with Reference (bz)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0245"
    citation: {"ref": "DODI8530.01", "page": 31, "anchor": "Requires DoD Components to report all incidents that appear to be violations"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: ""
    statement: "c. Requires DoD Components to report all incidents that appear to be violations of federal law to DoD Component defense criminal investigative organizations; law enforcement organizations; and the IG DoD. Incidents involving cleared defense contractors will be reported to DSS as described in Reference (k) and DoDD 5240.06 (Reference (ca))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0246"
    citation: {"ref": "DODI8530.01", "page": 31, "anchor": "Requires DoD Components to develop, implement, and enforce procedures to prevent, handle,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d"
    context: ""
    statement: "d. Requires DoD Components to develop, implement, and enforce procedures to prevent, handle, isolate, contain and mitigate incidents involving the unauthorized disclosure of classified and CUI in accordance with References (bd), (be), (bf), and (bx); CNSSP No. 18 (Reference (cb)); and CNSSI No. 1001 (Reference (cc))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0247"
    citation: {"ref": "DODI8530.01", "page": 31, "anchor": "DODIN UAM FOR DoD INSIDER THREAT PROGRAM. DODIN user monitoring capability and"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.7"
    context: ""
    statement: "7. DODIN UAM FOR DoD INSIDER THREAT PROGRAM. DODIN user monitoring capability and system auditing capability will support UAM to detect, deter, and mitigate insider threats. The UAM information compiled from these sources, integrated with information from various other sources (e.g., human resources, law enforcement, and counterintelligence) supports analysis and response to counter insider threats on the DODIN. The DoD Insider Threat Program’s UAM:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0248"
    citation: {"ref": "DODI8530.01", "page": 31, "anchor": "Requires a user monitoring capability and auditing capability to identify and evaluate"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: ""
    statement: "a. Requires a user monitoring capability and auditing capability to identify and evaluate anomalous activity by DODIN users for the DoD Insider Threat Program in accordance with Reference (x). The development and implementation of these capabilities supports UAM and requires coordination between the USD(I), USD(P), USD(P&R), USD(AT&L), and DoD CIO."
    status: "candidate"
  - id: "REQ-DODI8530.01-0249"
    citation: {"ref": "DODI8530.01", "page": 31, "anchor": "Implements minimum standards for UAM in accordance with References (x) and (y)."}
    kind: "lettered"
    locator: "ENCLOSURE 3.b"
    context: ""
    statement: "b. Implements minimum standards for UAM in accordance with References (x) and (y). This includes procedures to maintain audit data and preserve audit data chain of custody."
    status: "candidate"
  - id: "REQ-DODI8530.01-0250"
    citation: {"ref": "DODI8530.01", "page": 31, "anchor": "Establishes procedures for responding to anomalous user activity on the DODIN, including"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c"
    context: ""
    statement: "c. Establishes procedures for responding to anomalous user activity on the DODIN, including procedures to mitigate potential damage to data on the DODIN and to contact applicable DoD Component investigative authority when necessary in accordance with References (x) and (bx) and DoDD 5240.26 (Reference (cd))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0251"
    citation: {"ref": "DODI8530.01", "page": 31, "anchor": "WARNING INTELLIGENCE AND AS&W. Warning intelligence activities are intended to detect and"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c.8"
    context: ""
    statement: "8. WARNING INTELLIGENCE AND AS&W. Warning intelligence activities are intended to detect and report time-sensitive intelligence information on foreign developments that forewarn of hostile actions or intentions against U.S. partners or interests as described in JP 2-0 (Reference (ce)). AS&W can provide detection and reporting of time-sensitive information on developments that could involve a threat to the enterprise system or provide the enterprise a warning that an attack is happening. This would include the detection, correlation, identification, and characterization of intentional unauthorized activity with notification to decision makers so that an appropriate response can be developed. Warning intelligence and AS&W information:"
    status: "candidate"
