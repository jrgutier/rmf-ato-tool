    statement: "c. Defense contractors are responsible for ensuring their employees perform under the terms of the contract and applicable directives, laws, and regulations, and must maintain employee discipline. The contracting officer, or designee, is the liaison with the defense contractor for directing or controlling contractor performance in accordance with the contract. Outside of the assertion of criminal jurisdiction for misconduct, the contractor is responsible for disciplining contractor personnel. Criminal jurisdiction within the United States could be asserted by Federal, State, or local authorities. For defense contract personnel integrated into contingency operations outside the United States, see Reference (bk)."
