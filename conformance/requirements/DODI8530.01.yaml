  - id: "REQ-DODI8530.01-0226"
    citation: {"ref": "DODI8530.01", "page": 28, "anchor": "VULNERABILITY MANAGEMENT PROGRAM. Vulnerability management requires preemptive actions by DoD organizations to"}
    kind: "lettered"
    locator: "ENCLOSURE 3.f.3"
    context: ""
    statement: "3. VULNERABILITY MANAGEMENT PROGRAM. Vulnerability management requires preemptive actions by DoD organizations to identify and prevent the exploitation of DODIN vulnerabilities. Vulnerability management is used by DoD organization to identify, categorize, remediate, and mitigate vulnerabilities in DODIN assets. The primary objective of vulnerability management is to detect and remediate vulnerabilities in a pre-emptive approach based on threat and mission operations. Vulnerabilities will either be mitigated or accepted based on risk management (e.g., threat impact is low; correction would affect mission operations). The DoD Vulnerability Management Program:"
    status: "candidate"
