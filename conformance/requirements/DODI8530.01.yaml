  - id: "REQ-DODI8530.01-0041"
    citation: {"ref": "DODI8530.01", "page": 12, "anchor": "DoD CHIEF INFORMATION OFFICER (DoD CIO). In accordance with Reference (a), the"}
    kind: "lettered"
    locator: "ENCLOSURE 2.1"
    context: "RESPONSIBILITIES"
    statement: "1. DoD CHIEF INFORMATION OFFICER (DoD CIO). In accordance with Reference (a), the DoD CIO:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0042"
    citation: {"ref": "DODI8530.01", "page": 12, "anchor": "Establishes DoD policy and provides guidance and oversight for integrating cybersecurity activities"}
    kind: "lettered"
    locator: "ENCLOSURE 2.a"
    context: "RESPONSIBILITIES"
    statement: "a. Establishes DoD policy and provides guidance and oversight for integrating cybersecurity activities to support DODIN operations and DCO internal defensive measures and to strengthen accountability through the cyberspace operations chain of command to protect the DODIN in coordination with the Under Secretary of Defense for Policy (USD(P)), the Principal Cyber Advisor (PCA), the Under Secretary of Defense for Intelligence (USD(I)), the CJCS, the Director, National Security Agency/Chief, Central Security Service (DIRNSA/CHCSS), and the Commander, U. S. Strategic Command (CDRUSSTRATCOM)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0043"
    citation: {"ref": "DODI8530.01", "page": 12, "anchor": "Provides strategic management, guidance, and direction to DoD Component efforts to plan,"}
    kind: "lettered"
    locator: "ENCLOSURE 2.b"
    context: "RESPONSIBILITIES"
    statement: "b. Provides strategic management, guidance, and direction to DoD Component efforts to plan, program, budget, develop, and implement the capability to protect the DODIN in coordination with the USD(P) based on the DoD Enterprise Architecture in accordance with DoDD 8000.01 (Reference (s)) and the evolving JIE architecture."
    status: "candidate"
  - id: "REQ-DODI8530.01-0044"
    citation: {"ref": "DODI8530.01", "page": 12, "anchor": "Ensures capabilities are developed and incorporated into the DoD Architectural Framework (Reference"}
    kind: "lettered"
    locator: "ENCLOSURE 2.c"
    context: "RESPONSIBILITIES"
    statement: "c. Ensures capabilities are developed and incorporated into the DoD Architectural Framework (Reference (t)) in accordance with DoDI 8330.01 (Reference (v)) to protect the DODIN."
    status: "candidate"
  - id: "REQ-DODI8530.01-0045"
    citation: {"ref": "DODI8530.01", "page": 12, "anchor": "Oversees the development and implementation of DoD cybersecurity architectures and capabilities to"}
    kind: "lettered"
    locator: "ENCLOSURE 2.d"
    context: "RESPONSIBILITIES"
    statement: "d. Oversees the development and implementation of DoD cybersecurity architectures and capabilities to protect the DODIN, in coordination with CDRUSSTRATCOM."
    status: "candidate"
  - id: "REQ-DODI8530.01-0046"
    citation: {"ref": "DODI8530.01", "page": 12, "anchor": "Oversees the DoD Component cybersecurity service provider authorization process and DoD Component"}
    kind: "lettered"
    locator: "ENCLOSURE 2.e"
    context: "RESPONSIBILITIES"
