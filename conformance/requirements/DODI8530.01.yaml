    context: ""
    statement: "a. Requires a system inventory including hardware equipment, operating systems, and software applications and applies DoD required and organization-accepted standard security configurations to improve the effectiveness and reduce the time and resources required to conduct DODIN operations and DoD Component or CDRUSSTRATCOM DCO internal defensive measures."
    status: "candidate"
