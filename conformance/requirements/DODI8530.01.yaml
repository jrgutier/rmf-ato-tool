requirements:
  - id: "REQ-DODI8530.01-0001"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "PURPOSE. In accordance with the authority in DoD Directive (DoDD) 5144.02 (Reference"}
    kind: "lettered"
    locator: "References: See Enclosure 1.1"
    context: ""
    statement: "1. PURPOSE. In accordance with the authority in DoD Directive (DoDD) 5144.02 (Reference (a)), this instruction:"
    status: "candidate"
  - id: "REQ-DODI8530.01-0002"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Reissues DoDD O-8530.1 (Reference (b)) as a DoD Instruction (DoDI) and incorporates"}
    kind: "lettered"
    locator: "References: See Enclosure 1.a"
    context: ""
    statement: "a. Reissues DoDD O-8530.1 (Reference (b)) as a DoD Instruction (DoDI) and incorporates and cancels DoDI O-8530.2 (Reference (c)) to establish policy and assign responsibilities to protect the Department of Defense information network (DODIN) against unauthorized activity, vulnerabilities, or threats."
    status: "candidate"
  - id: "REQ-DODI8530.01-0003"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Supports the Joint Information Environment (JIE) concepts as outlined in JIE Operations"}
    kind: "lettered"
    locator: "References: See Enclosure 1.b"
    context: ""
    statement: "b. Supports the Joint Information Environment (JIE) concepts as outlined in JIE Operations Concept of Operations (CONOPS) (Reference (d))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0004"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Supports the formation of Cyber Mission Forces (CMF), development of the Cyber"}
    kind: "lettered"
    locator: "References: See Enclosure 1.c"
    context: ""
    statement: "c. Supports the formation of Cyber Mission Forces (CMF), development of the Cyber Force Concept of Operations and Employment, evolution of cyber command and control, cyberspace operations doctrine in Joint Publication 3-12 (Reference (e)), and evolving cyber threats."
    status: "candidate"
  - id: "REQ-DODI8530.01-0005"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Supports the Risk Management Framework (RMF) requirements to monitor security controls continuously,"}
    kind: "lettered"
    locator: "References: See Enclosure 1.d"
    context: ""
    statement: "d. Supports the Risk Management Framework (RMF) requirements to monitor security controls continuously, determine the security impact of changes to the DODIN and operational environment, and conduct remediation actions as described in DoDI 8510.01 (Reference (f)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0006"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Cancels Assistant Secretary of Defense for Command, Control, Communications, and Intelligence Memorandum"}
    kind: "lettered"
    locator: "References: See Enclosure 1.e"
    context: ""
    statement: "e. Cancels Assistant Secretary of Defense for Command, Control, Communications, and Intelligence Memorandum (Reference (g))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0007"
    citation: {"ref": "DODI8530.01", "page": 1, "anchor": "Applies to OSD, the Military Departments, the Office of the Chairman of"}
    kind: "lettered"
    locator: "References: See Enclosure 1.a"
    context: ""
    statement: "a. Applies to OSD, the Military Departments, the Office of the Chairman of the Joint Chiefs of Staff (CJCS) and the Joint Staff, the Combatant Commands, the Office of the Inspector General of the Department of Defense (IG DoD), the Defense Agencies, the DoD Field Activities, and all other organizational entities within the DoD (referred to collectively in this instruction as the “DoD Components”)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0008"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "The United States Coast Guard (USCG). The USCG will adhere to DoD"}
    kind: "lettered"
    locator: "References: See Enclosure 1.b"
    context: ""
    statement: "b. The United States Coast Guard (USCG). The USCG will adhere to DoD cybersecurity requirements, standards, and policies in this instruction in accordance with the direction in Paragraphs 4a, b, c, and d of the Memorandum of Agreement Between the Department of Defense and the Department of Homeland Security (Reference (cn))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0009"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "Applies to the DODIN. The DODIN includes DoD information technology (IT) (e.g.,"}
    kind: "lettered"
    locator: "References: See Enclosure 1.c"
    context: ""
    statement: "c. Applies to the DODIN. The DODIN includes DoD information technology (IT) (e.g., DoD-owned or DoD-controlled information systems (ISs), platform information technology (PIT) systems, IT products and services) as defined in DoDI 8500.01 (Reference (h)) and control systems and industrial control systems (ICSs) as defined in National Institute (NIST) Special Publication (SP) 800-82 (Reference (i)) that are owned or operated by or on behalf of DoD Components."
    status: "candidate"
  - id: "REQ-DODI8530.01-0010"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "Applies to commercial cloud computing services that are subject to the DoD"}
    kind: "lettered"
    locator: "References: See Enclosure 1.d"
    context: ""
    statement: "d. Applies to commercial cloud computing services that are subject to the DoD Cloud Computing Security Requirements Guide (Reference (j)), developed by Director, Defense Information Systems Agency (DISA)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0011"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "Applies to cleared defense contractors who operate pursuant to DoD 5220.22-M (Reference"}
    kind: "lettered"
    locator: "References: See Enclosure 1.e"
    context: ""
    statement: "e. Applies to cleared defense contractors who operate pursuant to DoD 5220.22-M (Reference (k)) and the National Industrial Security Program (NISP) in accordance with DoDI 5220.22 (Reference (l)), to the extent that its requirements are made applicable through incorporation into contracts."
    status: "candidate"
  - id: "REQ-DODI8530.01-0012"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "Applies to mission partner systems connected to the DODIN in accordance with,"}
    kind: "lettered"
    locator: "References: See Enclosure 1.f"
    context: ""
    statement: "f. Applies to mission partner systems connected to the DODIN in accordance with, and to the extent set forth in, a contract, memorandum of agreement (MOA), support agreement, or international agreement, subject to and consistent with DoDI 4000.19 (Reference (m) and DoDD 5530.03 (Reference (n))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0013"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "Does not alter or supersede the existing authorities and policies of the"}
    kind: "lettered"
    locator: "References: See Enclosure 1.g"
    context: ""
    statement: "g. Does not alter or supersede the existing authorities and policies of the Director of National Intelligence regarding the protection of sensitive compartmented information (SCI) as directed by Executive Order 12333 (Reference (o)) and other laws and regulations."
    status: "candidate"
  - id: "REQ-DODI8530.01-0014"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "DoD protects (i.e., secures and defends) the DODIN and DoD information using"}
    kind: "lettered"
    locator: "References: See Enclosure 1.a"
    context: ""
    statement: "a. DoD protects (i.e., secures and defends) the DODIN and DoD information using key security principles, such as isolation; containment; redundancy; layers of defense; least privilege; situational awareness; and physical or logical segmentation of networks, services, and applications to allow mission owners and operators, from the tactical to the DoD level, to have confidence in the confidentiality, integrity, and availability of the DODIN and DoD information to make decisions."
    status: "candidate"
  - id: "REQ-DODI8530.01-0015"
    citation: {"ref": "DODI8530.01", "page": 2, "anchor": "DoD integrates technical and non-technical capabilities to implement DoD information network operations"}
    kind: "lettered"
    locator: "References: See Enclosure 1.b"
    context: ""
    statement: "b. DoD integrates technical and non-technical capabilities to implement DoD information network operations (DODIN operations) and defensive cyberspace operations (DCO) internal defensive measures directed by global, regional, and DoD Component authorities to protect the DODIN consistent with References (e), (f), and (h)."
    status: "candidate"
  - id: "REQ-DODI8530.01-0016"
    citation: {"ref": "DODI8530.01", "page": 3, "anchor": "DoD integrates and employs a number of cybersecurity activities to support DODIN"}
    kind: "lettered"
    locator: "References: See Enclosure 1.c"
    context: ""
    statement: "c. DoD integrates and employs a number of cybersecurity activities to support DODIN operations and DCO internal defensive measures in response to vulnerabilities and threats as described in Reference (e). These activities include:"
    status: "candidate"
