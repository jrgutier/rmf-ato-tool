  - id: "REQ-DODI8530.01-0219"
    citation: {"ref": "DODI8530.01", "page": 27, "anchor": "VULNERABILITY ASSESSMENT AND ANALYSIS ACTIVITIES. Vulnerability assessment and analysis are vital proactive"}
    kind: "lettered"
    locator: "ENCLOSURE 3.c.2"
    context: ""
    statement: "2. VULNERABILITY ASSESSMENT AND ANALYSIS ACTIVITIES. Vulnerability assessment and analysis are vital proactive activities to determine the adequacy of cybersecurity measures for DODIN assets. Vulnerability assessment and analysis apply a variety of techniques (e.g., network discovery, network and host vulnerability scanning, penetration testing) to identify vulnerabilities and to assess whether DODIN assets conform to recommended security policies and configurations. The DoD Vulnerability Assessment and Analysis activities:"
    status: "not-a-requirement"
    reason: "Section heading, description of vulnerability assessment techniques, and a lead-in stopping at the colon. 'Recommended' qualifies the security policies that assets are compared to; it recommends nothing to anyone, so it binds no one."
  - id: "REQ-DODI8530.01-0220"
