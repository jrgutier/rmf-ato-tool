  - id: "REQ-DODI8530.01-0231"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "MALWARE PROTECTION PROCESS. Malware protection that is properly implemented and maintained helps"}
    kind: "lettered"
    locator: "ENCLOSURE 3.d.4"
    context: ""
    statement: "4. MALWARE PROTECTION PROCESS. Malware protection that is properly implemented and maintained helps prevent damaging attack by countering unauthorized changes made to software and hardware by malicious code that could otherwise leak information or disable capabilities. Malware protection helps an organization protect against and respond to software or firmware intended to perform an unauthorized process that will have an adverse impact on the confidentiality, integrity, or availability of a system. The DoD malware protection process:"
    status: "not-a-requirement"
    reason: "Section heading, description of what malware protection does, and a lead-in stopping at the colon. Its 'will have an adverse impact' describes what malware does, so 'will' binds no one."
  - id: "REQ-DODI8530.01-0232"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Provides the capability to prevent malware incidents such as from malicious code,"}
    kind: "lettered"
    locator: "ENCLOSURE 3.a"
    context: ""
    statement: "a. Provides the capability to prevent malware incidents such as from malicious code, malicious logic, or malicious applets; detects and analyzes malware; contains the spread of malware and prevents further damage; eradicates the malware from infected hosts; employs mitigating actions to prevent reinfection; and restores functionality and removes temporary containment measures as described in NIST SP 800-83, Revision 1 (Reference (bt))."
    status: "candidate"
  - id: "REQ-DODI8530.01-0233"
    citation: {"ref": "DODI8530.01", "page": 29, "anchor": "Employs malware detection mechanisms at DODIN entry and exit points (e.g., firewalls,"}
