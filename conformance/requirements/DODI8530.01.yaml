    kind: "lettered"
    locator: "References: See Enclosure 1.e"
    context: ""
    statement: "e. DoD designated cybersecurity service providers will be authorized to provide cybersecurity services in accordance with DoD O-8530.01-M (Reference (p)). When cybersecurity services are provided, both the cybersecurity service provider and the system owner security responsibilities will be clearly documented."
    status: "candidate"
  - id: "REQ-DODI8530.01-0026"
