    statement: "f. Validates in coordination with Director, DISA, cybersecurity standards established by Federal mission partner organizations connected to the DODIN comply with equivalent cybersecurity requirements and to those standards described in Committee on National Security Systems Policy (CNSSP) No. 26 Reference (w)."
    status: "candidate"
