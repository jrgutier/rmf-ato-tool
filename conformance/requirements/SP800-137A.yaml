  - id: "REQ-SP800-137A-0308"
    citation: {"ref": "SP800-137A", "page": 54, "anchor": "Organizations are not expected to employ all assessment methods and objects contained"}
    kind: "should"
    locator: "3.3.1"
    context: "Assessment Element Information Fields Activities are the monitoring-related actions associated with a system that involve people, such as:"
    statement: "Organizations are not expected to employ all assessment methods and objects contained within the assessment procedures; rather, organizations have the flexibility to choose methods and objects, and to determine the level of effort needed and the assurance required for an assessment (i.e., which assessment methods and assessment objects are deemed to be the most useful in obtaining the desired results)."
    status: "candidate"
  - id: "REQ-SP800-137A-0309"
    citation: {"ref": "SP800-137A", "page": 55, "anchor": "Each assessment element in the Assessment Element [Catalog] applicable to the ISCM"}
    kind: "indicative"
    locator: "3.3.2"
    context: "Use of Assessment Elements"
    statement: "Each assessment element in the Assessment Element [Catalog] applicable to the ISCM program assessment is acted upon (executed) by the assessor. The primary object in the assessment element is the assessment procedure, as defined in the previous section. The assessment objective is a re-statement of the assessment element, and the assessor makes a judgment of the degree to which a particular aspect of the ISCM program satisfies the element."
    status: "candidate"
  - id: "REQ-SP800-137A-0310"
    citation: {"ref": "SP800-137A", "page": 55, "anchor": "Each determination statement contained within an assessment objective of the assessment element"}
    kind: "modal"
    locator: "3.3.2"
    context: "Use of Assessment Elements"
    statement: "Each determination statement contained within an assessment objective of the assessment element (as shown in Table 6) produces, for example, one of the following judgments for the two-value judgment set (described in Section 2.2.6): Satisfied or Other than Satisfied. A finding of Satisfied indicates that for the portion of the ISCM program being assessed, the assessment information obtained (i.e., evidence collected) indicates that the assessment objective for that assessment element has been met and produces an acceptable result. For a finding of Other than Satisfied, the assessment provides for annotated reasons that explain the judgment (i.e., what portions of an assessment element prevent a Satisfied judgment). The reasons inform the organization of shortfalls in the ISCM program that may need to be addressed. A finding of Other than Satisfied may also indicate that the assessor was unable to obtain sufficient information to make the determination called for in the determination statement."
    status: "candidate"
  - id: "REQ-SP800-137A-0311"
    citation: {"ref": "SP800-137A", "page": 55, "anchor": "For assessment findings that are Other than Satisfied, organizations may choose to"}
    kind: "modal"
    locator: "3.3.2"
    context: "Use of Assessment Elements"
    statement: "For assessment findings that are Other than Satisfied, organizations may choose to define subcategories of findings that indicate the severity or criticality of the weaknesses or deficiencies discovered and the potential adverse effects on organizations. Defining such subcategories can help to establish priorities for needed risk mitigation actions. Regardless of whether the organization defines subcategories, assessment results include sufficient information about shortfalls to indicate what further actions are required to completely satisfy the determination statement."
    status: "candidate"
