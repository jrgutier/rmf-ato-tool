    reason: "Property 11, 'Evaluating from a strategic and programmatic perspective'; a trait of the method."
  - id: "REQ-SP800-137A-0125"
    citation: {"ref": "SP800-137A", "page": 29, "anchor": "Including sufficient clarity and guidance that the assessment is repeatable (i.e., a"}
    kind: "lettered"
    locator: "2.2.6.12"
    context: "Properties of the ISCM Program Assessment Properties of the ISCM program assessment include:"
    statement: "12. Including sufficient clarity and guidance that the assessment is repeatable (i.e., a follow-up assessment by a different assessment team results in the same outcome)"
    status: "not-a-requirement"
    reason: "Property 12, 'Including sufficient clarity and guidance that the assessment is repeatable'; a trait of the method."
  - id: "REQ-SP800-137A-0126"
    citation: {"ref": "SP800-137A", "page": 29, "anchor": "Control effectiveness assessment is addressed in [SP800-53A]."}
    kind: "indicative"
    locator: "2.2.7"
    context: "Assessing the ISCM Program through the Evaluation Criteria"
    statement: "Control effectiveness assessment is addressed in [SP800-53A]."
    status: "not-a-requirement"
    reason: "Footnote 13: 'Control effectiveness assessment is addressed in [SP800-53A]'; a pointer."
  - id: "REQ-SP800-137A-0127"
    citation: {"ref": "SP800-137A", "page": 30, "anchor": "For the set of assessment elements applicable to the scope of an"}
    kind: "indicative"
    locator: "2.2.7"
    context: "Assessing the ISCM Program through the Evaluation Criteria"
    statement: "For the set of assessment elements applicable to the scope of an ISCM program assessment, all elements are judged. Section 2.3.2 explains scoping of the ISCM program assessment."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: 'For the set of assessment elements applicable to the scope ... all elements are judged'. Checked PER-SCA and M-2: M-2 assesses the controls due in a cycle, and no element set is scoped in a run."
  - id: "REQ-SP800-137A-0128"
    citation: {"ref": "SP800-137A", "page": 30, "anchor": "Judgment values vary depending on the level of granularity of evaluation that"}
    kind: "should"
    locator: "2.2.7.1"
    context: "Judgment Values"
    statement: "Judgment values vary depending on the level of granularity of evaluation that the organization needs and that the assessor can achieve. While specific judgment values for an assessment are not prescribed in this guidance, the default judgment value set consistent with NIST guidance is the two-value set, Satisfied or Other than Satisfied or, equivalently, True/False.14"
    status: "not-a-requirement"
    reason: "'Judgment values vary' and 'specific judgment values ... are not prescribed'; it says no value set is imposed and names the default."
  - id: "REQ-SP800-137A-0129"
    citation: {"ref": "SP800-137A", "page": 30, "anchor": "For the default set of judgments, each determination statement within an assessment"}
    kind: "indicative"
    locator: "2.2.7.1"
    context: "Judgment Values"
    statement: "For the default set of judgments, each determination statement within an assessment procedure (described in Section 3.3) produces one of the following judgments: Satisfied or Other than Satisfied. The assessment provides for annotations or notes that explain any Other than Satisfied judgment (i.e., what portions of an assessment element prevent a Satisfied judgment). For example, an annotation can document partially completed ISCM aspects so that an organization can track what has been completed and what is lacking. Note that the companion document [Catalog] is established based on the default, two-value set of judgments."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: 'each determination statement ... produces one of the following judgments' and 'The assessment provides for annotations'. Checked PER-SCA: A-3 and M-2 record control determinations, which section 1.4 puts outside this assessment, and no task judges an ISCM program."
  - id: "REQ-SP800-137A-0130"
    citation: {"ref": "SP800-137A", "page": 30, "anchor": "Organizations may also choose to employ a more granular approach to findings"}
    kind: "should"
    locator: "2.2.7.1"
    context: "Judgment Values"
    statement: "Organizations may also choose to employ a more granular approach to findings by introducing a Partially Satisfied category for assessments. Finer-grain annotations can be employed with the two-value judgments to give more precise reasons for Other Than Satisfied judgments (See Section (see Section 3.3.2 for more detail). Annotations may include a discussion of conditions or situations that do not yield straightforward judgments. Annotations may be assisted by a tool or may be manually recorded during the assessment."
    status: "not-a-requirement"
    reason: "'Organizations may also choose to employ a more granular approach'; 'Annotations may include' and 'may be assisted'. All options."
  - id: "REQ-SP800-137A-0131"
    citation: {"ref": "SP800-137A", "page": 30, "anchor": "Mostly/Completely True Somewhat True Neither True Nor False Mostly False Completely False"}
    kind: "indicative"
    locator: "2.2.7.1"
    context: "Judgment Values An example of more granular judgment values is:"
    statement: "Mostly/Completely True Somewhat True Neither True Nor False Mostly False Completely False"
    status: "not-a-requirement"
    reason: "Fragment: the five example judgment values after 'An example of more granular judgment values is:'."
  - id: "REQ-SP800-137A-0132"
    citation: {"ref": "SP800-137A", "page": 30, "anchor": "In this example, all of the judgments are annotatable, even Mostly/Completely True"}
    kind: "modal"
    locator: "2.2.7.1"
    context: "Judgment Values"
    statement: "In this example, all of the judgments are annotatable, even Mostly/Completely True where the evidence shows the element is mostly but not completely true. The organization may use the annotated reasons for the two-value set or a finer granularity set of judgment values to: (i) identify shortfalls, (ii) indicate what further actions are required to completely satisfy the determination statement, and (iii) help prioritize potential responses. It is expected that the set of annotations are used to develop the set of recommendations in the assessment results report."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: 'It is expected that the set of annotations are used to develop the set of recommendations'. Checked PER-SCA: ART-SAR recommendations come from control findings, not from program-element annotations, so nothing in a run holds this."
  - id: "REQ-SP800-137A-0133"
    citation: {"ref": "SP800-137A", "page": 31, "anchor": "Section 3.3 explains assessment elements, which contain guidance on how to arrive"}
    kind: "modal"
    locator: "2.2.7.2"
    context: "Making Judgments"
    statement: "Section 3.3 explains assessment elements, which contain guidance on how to arrive at a judgment. The ISCM program assessment element contains the assessment element text (i.e., the assessment criteria) and a set of attributes, two of which are the assessment procedure and the discussion used in making judgments. The assessment procedure attribute consists of one or more assessment objectives derived from the assessment element text and potential assessment methods and objects. The discussion attribute provides supplemental guidance relevant to the assessment element and may provide additional details about special situations or dependencies that the assessor may need to consider (see Section 3.3)."
    status: "not-a-requirement"
    reason: "Explains the parts of an element; 'that the assessor may need to consider' says the discussion may flag something, so need to puts no duty on the assessor and binds no one."
  - id: "REQ-SP800-137A-0134"
    citation: {"ref": "SP800-137A", "page": 31, "anchor": "Once the evidence15 is obtained or interviews are conducted with the identified"}
    kind: "indicative"
    locator: "2.2.7.2"
    context: "Making Judgments"
    statement: "Once the evidence15 is obtained or interviews are conducted with the identified potential stakeholders, the assessor makes a judgment about whether the ISCM program meets a given assessment element. The assessor selects one of the possible judgment values defined for the assessment element as the judgment. The two-value judgment set indicates whether the assessment is Satisfied while the multi-valued, finer grained value set indicates how well the assessment element is met (e.g., somewhat true, mostly false)."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: 'the assessor makes a judgment' and 'selects one of the possible judgment values'. Checked PER-SCA and M-2: both judge controls, not the program."
  - id: "REQ-SP800-137A-0135"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "The Not Applicable (N/A) judgment is not defined for the ISCM program"}
    kind: "indicative"
    locator: "2.2.7.3"
    context: "N/A Judgments"
    statement: "The Not Applicable (N/A) judgment is not defined for the ISCM program assessment in this publication. It is important to ensure that each assessment element is applicable to the entire organization to the maximum extent. This means that the N/A judgment is not implemented as a judgment value even when some ISCM program assessment functions or aspects are not implemented in the ISCM program (e.g., external service providers are not used), but there are assessment elements to evaluate external service in the assessment."
    status: "not-applicable"
    reason: "Binds the method's user: 'the N/A judgment is not implemented as a judgment value'. Checked PER-SCA and the sar-results schema: its result values govern controls, and no run field holds a program-level judgment set."
  - id: "REQ-SP800-137A-0136"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "Every assessment element is judged."}
    kind: "lettered"
    locator: "2.2.7.3.•"
    context: "N/A Judgments Since all assessment elements are addressed and not tailored out of an assessment, the following considerations are relevant to the ISCM program assessment:"
    statement: "• Every assessment element is judged."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: 'Every assessment element is judged'. Checked PER-SCA and PER-CISO: no task receives the element set, so a run has no place to judge one."
  - id: "REQ-SP800-137A-0137"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "If the subject of an assessment element, such as the use of"}
    kind: "lettered"
    locator: "2.2.7.3.•"
    context: "N/A Judgments Since all assessment elements are addressed and not tailored out of an assessment, the following considerations are relevant to the ISCM program assessment:"
    statement: "• If the subject of an assessment element, such as the use of external service providers, is not applicable to the organization, the organization-wide ISCM strategy specifies that the subject or aspect is not applicable to the organization."
    status: "candidate"
  - id: "REQ-SP800-137A-0138"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "Regardless of the organizational decision about the subject, the subject is considered"}
    kind: "lettered"
    locator: "2.2.7.3.•"
    context: "N/A Judgments Since all assessment elements are addressed and not tailored out of an assessment, the following considerations are relevant to the ISCM program assessment:"
    statement: "• Regardless of the organizational decision about the subject, the subject is considered and evaluated throughout the ISCM program assessment."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: 'the subject is considered and evaluated throughout the ISCM program assessment'. Checked PER-CISO and P-7: P-7 writes the strategy and does not evaluate it, so nothing holds this."
  - id: "REQ-SP800-137A-0139"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "The decision not to implement a particular ISCM aspect means that there"}
    kind: "lettered"
    locator: "2.2.7.3.•"
    context: "N/A Judgments Since all assessment elements are addressed and not tailored out of an assessment, the following considerations are relevant to the ISCM program assessment:"
    statement: "• The decision not to implement a particular ISCM aspect means that there is no evidence expected to the contrary, which is verified by the assessor."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: absence of evidence 'is verified by the assessor'. Checked PER-SCA: its verification in A-3 and M-2 is of controls, not of an organization's decision not to implement an ISCM aspect."
  - id: "REQ-SP800-137A-0140"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "If an ISCM program assessment element is not applicable to the organization"}
    kind: "indicative"
    locator: "2.2.7.3"
    context: "N/A Judgments Since all assessment elements are addressed and not tailored out of an assessment, the following considerations are relevant to the ISCM program assessment:"
    statement: "If an ISCM program assessment element is not applicable to the organization or system, it is first addressed in the applicable strategy, and all elements related to that particular subject are judged to be Satisfied. If the strategy does not address the subject, all elements related to that subject are judged to be Other than Satisfied."
    status: "candidate"
  - id: "REQ-SP800-137A-0141"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "Depending on the size and complexity of the organization, ISCM program assessment"}
    kind: "should"
    locator: "2.2.8"
    context: "Assessing the ISCM Program within One Organizational Level"
    statement: "Depending on the size and complexity of the organization, ISCM program assessment information may be collected from multiple parts of the organization (e.g., multiple missions/business processes and/or systems), analyzed, and aggregated into a single judgment for a single organizational risk management level. Multiple assessors can produce multiple assessments that are limited in scope to a part of the organization (e.g., a single mission/business process, a single system)."
    status: "not-a-requirement"
    reason: "'information may be collected from multiple parts' and 'Multiple assessors can produce multiple assessments'; both describe options that depend on size."
  - id: "REQ-SP800-137A-0142"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "For multiple ISCM program assessments at the same risk management level (i.e.,"}
    kind: "indicative"
    locator: "2.2.8"
    context: "Assessing the ISCM Program within One Organizational Level"
    statement: "For multiple ISCM program assessments at the same risk management level (i.e., by multiple assessors), the organization or assessors decide how to combine multiple judgments for the same assessment element. Multiple judgments for the same assessment element can occur, for example, if the assessors meet separately with each mission/business process. It is also a result of using a distributed self-assessment, as described in Section 2.3.1. There can be significant differences in assessment results across one risk management level. Examples of methods for combining judgments within one organizational risk management level are:"
    status: "not-applicable"
    reason: "Binds the organization or the assessors: 'the organization or assessors decide how to combine multiple judgments'. Checked PER-CISO and P-7: combining is internal to the assessment, and a run consumes only the report (REQ-SP800-137A-0358)."
  - id: "REQ-SP800-137A-0143"
    citation: {"ref": "SP800-137A", "page": 32, "anchor": "Worst case. The worst judgment (the low water mark) is used as"}
    kind: "lettered"
    locator: "2.2.8.•"
    context: "Assessing the ISCM Program within One Organizational Level Examples of methods for combining judgments within one organizational risk management level are:"
    statement: "• Worst case. The worst judgment (the low water mark) is used as the resulting judgment for the level."
    status: "not-a-requirement"
    reason: "Example method after 'Examples of methods for combining judgments': 'Worst case'."
  - id: "REQ-SP800-137A-0144"
    citation: {"ref": "SP800-137A", "page": 33, "anchor": "Majority judgment. The most common judgment is used as the resulting judgment"}
    kind: "lettered"
    locator: "2.2.8.•"
    context: "Assessing the ISCM Program within One Organizational Level Examples of methods for combining judgments within one organizational risk management level are:"
    statement: "• Majority judgment. The most common judgment is used as the resulting judgment for the level. If there is a tie for the most common judgment, a predetermined rule is used to determine the resulting judgment (e.g., the worst of the tied judgments)."
    status: "not-a-requirement"
    reason: "Example method from the same list: 'Majority judgment', with a tie rule that belongs to the example."
  - id: "REQ-SP800-137A-0145"
    citation: {"ref": "SP800-137A", "page": 33, "anchor": "Assessor determined. The assessor considers all factors and makes an experience-based judgment."}
    kind: "lettered"
    locator: "2.2.8.•"
    context: "Assessing the ISCM Program within One Organizational Level Examples of methods for combining judgments within one organizational risk management level are:"
    statement: "• Assessor determined. The assessor considers all factors and makes an experience-based judgment."
    status: "not-a-requirement"
    reason: "Example method from the same list: 'Assessor determined'."
  - id: "REQ-SP800-137A-0146"
    citation: {"ref": "SP800-137A", "page": 33, "anchor": "[SP800-137] describes how the three risk management levels work together to address"}
    kind: "indicative"
    locator: "2.2.9"
    context: "Assessing the ISCM Program across Multiple Risk Management Levels"
    statement: "[SP800-137] describes how the three risk management levels work together to address various aspects of ISCM. The concepts there may apply to one or two levels (usually adjacent levels) or to all three levels, depending on the organizational structure and how the organization-wide and system-level ISCM strategies are applied. As a result, each assessment element is evaluated across one or more levels. For example, one element may be evaluated for Level 1 only, while another is evaluated for Levels 1 and 2. For each element, multiple evaluations are combined into a corresponding single judgment regardless of how many levels are being evaluated."
    status: "not-applicable"
    reason: "Binds the ISCM program assessor: 'multiple evaluations are combined into a corresponding single judgment'. Checked PER-SCA and PER-RE: no task aggregates judgments across risk management levels, and a run sees only the outcome."
  - id: "REQ-SP800-137A-0147"
    citation: {"ref": "SP800-137A", "page": 33, "anchor": "When judgments from two or more levels are combined to get the"}
    kind: "indicative"
    locator: "2.2.9"
    context: "Assessing the ISCM Program across Multiple Risk Management Levels"
    statement: "When judgments from two or more levels are combined to get the resultant judgment, a method, rule, or algorithm is needed to ensure that judgments are combined consistently. This publication does not prescribe a means to combine judgments. Each organization defines a combining mechanism that meets its needs."
    status: "not-applicable"
    reason: "Binds the organization: 'Each organization defines a combining mechanism'. Checked PER-CISO and P-7: the mechanism serves only the assessment's scoring of levels, and neither the P-7 section nor a run decision reads it."
  - id: "REQ-SP800-137A-0148"
    citation: {"ref": "SP800-137A", "page": 33, "anchor": "One or more assessments are conducted for each of the levels involved."}
    kind: "indicative"
    locator: "2.2.9"
    context: "Assessing the ISCM Program across Multiple Risk Management Levels"
    statement: "One or more assessments are conducted for each of the levels involved. Results are combined into a single judgment for each level as described in Section 2.2.8. Results for each of the levels are then reconciled into a single judgment according to organization-defined rules. As an example of a method of combining levels, the following sample rules, based on one of the decision matrices shown in the three figures below, are used:"
    status: "not-applicable"
    reason: "Binds the assessor: 'Results are combined into a single judgment for each level' and 'reconciled ... according to organization-defined rules'. Checked PER-SCA: no run role reconciles levels; the rest of the entry opens the example rules."
  - id: "REQ-SP800-137A-0149"
    citation: {"ref": "SP800-137A", "page": 33, "anchor": "Rule 1. If the assessment element is applicable to only one level,"}
    kind: "indicative"
    locator: "2.2.9"
    context: "Assessing the ISCM Program across Multiple Risk Management Levels As an example of a method of combining levels, the following sample rules, based on one of the decision matrices shown in the three fi"
    statement: "Rule 1. If the assessment element is applicable to only one level, that level’s judgment is the final judgment for the element."
    status: "not-a-requirement"
    reason: "Sample Rule 1 of 'the following sample rules': an example combining rule, and 0153 says no such rule is needed."
  - id: "REQ-SP800-137A-0150"
    citation: {"ref": "SP800-137A", "page": 33, "anchor": "Rule 2. If the assessment element is applicable to exactly two levels,"}
