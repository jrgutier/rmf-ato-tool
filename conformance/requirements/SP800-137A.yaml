rejected:
  - {"page": 6, "locator": "Executive Summary", "reason": "no-marker", "text": "Organizations need a way to determine and evaluate if an established ISCM program is effectively managing the organization’s security posture commensurate with risk. This publication describes one approach to developing an ISCM program assessment based on evaluation criteria derived from multiple sources, (including NIST Special Publications (SP) 800-137, Information Security Continuous Monitoring (ISCM) for Federal Information Systems and Organizations, SP 800-37, Risk Management Framework for Information Systems and Organizations: A Life Cycle Approach for Security and Privacy, SP 800-39, Managing Information Security Risk: Organization, Mission and Information System View, and Office of Management and Budget (OMB) Circulars and Memoranda). An ISCM program assessment developed under guidance in this publication evaluates the ISCM program itself (i.e., the structure and governance of the ISCM program),not the results of the ISCM program or the continuous monitoring technologies used. An effective ISCM program assessment provides consistent results regardless of the entity conducting the assessment. This publication does not prescribe the assessment of individual controls nor the examination of control assessment results as part of the ISCM program assessment."}
  - {"page": 6, "locator": "Executive Summary", "reason": "no-marker", "text": "Creating or adopting and using an ISCM program assessment can help reduce overall risk to organizations by identifying gaps in an ISCM program, in the implementation of an ISCM program, or in the operational use of ISCM results. In addition, an ISCM program assessment can indicate the level of readiness for system-level ongoing authorization."}
  - {"page": 7, "locator": "Executive Summary", "reason": "lead-in", "text": "This publication:"}
