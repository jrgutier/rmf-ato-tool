    statement: "• Operation of the ISCM program;"
    status: "not-a-requirement"
    reason: "Fragment 'Operation of the ISCM program' of the same lead-in; a topic only."
  - id: "REQ-SP800-137A-0042"
    citation: {"ref": "SP800-137A", "page": 17, "anchor": "Analysis of data collected and reporting of results;"}
    kind: "lettered"
    locator: "2 The Fundamentals.•"
    context: "This section explains the fundamentals of the ISCM program assessment, a management process that provides a view into the adequacy and effectiveness of the:"
    statement: "• Analysis of data collected and reporting of results;"
    status: "not-a-requirement"
    reason: "Fragment 'Analysis of data collected and reporting of results' of the same lead-in; a topic only."
  - id: "REQ-SP800-137A-0043"
    citation: {"ref": "SP800-137A", "page": 17, "anchor": "Response to ISCM results; and"}
    kind: "lettered"
    locator: "2 The Fundamentals.•"
    context: "This section explains the fundamentals of the ISCM program assessment, a management process that provides a view into the adequacy and effectiveness of the:"
    statement: "• Response to ISCM results; and"
    status: "not-a-requirement"
