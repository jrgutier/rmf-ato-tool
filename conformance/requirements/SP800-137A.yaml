    reason: "'the organization or assessor may tailor the approach'; a pointer to section 3.5 and an option."
  - id: "REQ-SP800-137A-0205"
    citation: {"ref": "SP800-137A", "page": 41, "anchor": "and implemented within the organization and not on evaluating the individual, lower-level"}
    kind: "table"
    locator: "3.1"
    context: "Overview of the ISCM Program Assessment Process"
    statement: "and implemented within the organization and not on evaluating the individual, lower-level components of an ISCM capability, such as individual common, hybrid, and system-specific controls. The ISCM program assessment verifies the existence of the subject of the assessment element (e.g., to verify that specified procedures for performing certain actions at specified frequencies are followed). The ISCM program assessment does not evaluate individual automated, manual, or operational functions of the ISCM capability."
    status: "not-a-requirement"
    reason: "Boxed scope note: 'is focused directly on evaluating the ISCM program' and 'does not evaluate individual automated, manual, or operational functions'; repeats the scope in 0202."
