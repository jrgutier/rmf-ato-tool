  - id: "REQ-SP800-137A-0317"
    citation: {"ref": "SP800-137A", "page": 56, "anchor": "1-002 | There is an ISCM program derived from the organization-wide ISCM"}
    kind: "table"
    locator: "3.3.2"
    context: "Use of Assessment Elements"
    statement: "1-002 | There is an ISCM program derived from the organization-wide ISCM strategy. | Level 1 | NIST SP 800- 137 | ASSESSMENT OBJECTIVE Determine if there is an ISCM program derived from the organization-wide ISCM strategy. POTENTIAL ASSESSMENT METHODS AND OBJECTS Examine: Organization-wide ISCM strategy, ISCM policy and procedure documentation, ISCM design documents, ISCM concept of operations (CONOPS) Interview: Level 1: SAISO, ISCM point of contact (POC) | The ISCM program is comprised of the ISCM policies and procedures derived from the organization-wide ISCM strategy and includes the ISCM documents that guide ISCM implementation (e.g., ISCM technical architecture and ISCM CONOPS). | Level 1 is responsible for defining the ISCM program. | The Define Step has no parent element | N | ISCM Program Management | 03.01- 002"
    status: "candidate"
  - id: "REQ-SP800-137A-0318"
    citation: {"ref": "SP800-137A", "page": 57, "anchor": "Steps 1 through 4 explain how the information fields of the example"}
    kind: "table"
    locator: "3.3.2"
    context: "Use of Assessment Elements"
    statement: "Steps 1 through 4 explain how the information fields of the example assessment element in Table 6 are used to arrive at a judgement about the example assessment element. 1. For the Assessment Element with Identifier 1-002: There is an ISCM program derived from the organization-wide ISCM strategy. Use the POTENTIAL ASSESSMENT METHODS on the OBJECTS as follows: a. Examine: Organization-wide ISCM strategy, ISCM policy and procedures documentation, ISCM design documents, ISCM CONOPs b. Interview: SAISO, ISCM POC To obtain evidence to make a judgement about the ISCM ASSESSMENT OBJECTIVE below: Determine if there is an ISCM program derived from the organization-wide ISCM strategy. 2. Use information relative to Process Step DEFINE and Level 1 from the Examine list and Interview list as may be needed to determine whether the ISCM ASSESSMENT OBJECTIVE is met. 3. Use DISCUSSION: “The ISCM program is comprised of the ISCM policies and procedures derived from the organization-wide ISCM strategy and includes the ISCM documents that guide ISCM implementation (e.g., ISCM technical architecture and ISCM CONOPS)” to clarify the wording or intent of the ASSESSMENT ELEMENT. 4. Make a judgement about how well the assessment element is met (e.g., Satisfied or Other than Satisfied). Enter the judgement into the assessment tool or results repository. Annotate reasons for an Other than Satisfied judgement."
    status: "candidate"
  - id: "REQ-SP800-137A-0319"
    citation: {"ref": "SP800-137A", "page": 57, "anchor": "Each assessment element is applied in a similar manner for each element"}
    kind: "modal"
    locator: "3.3.2"
    context: "Use of Assessment Elements"
    statement: "Each assessment element is applied in a similar manner for each element in the [Catalog] and for each applicable organizational level. Results (judgments) for each assessment element are combined across multiple organizational levels when the element applies to more than one level, as described in Section 2.2.9. The assessment elements offered with this publication in the [Catalog] generally do not inform the assessor of how to make the actual judgment (e.g., Satisfied or Other than Satisfied) since criteria for satisfying an ISCM program assessment element may vary among systems, missions, and organizations. The assessment procedures lead the assessor to the judgment decision point in accordance with the assessment objective after applying the assessment methods to the suggested objects (the evidence). The assessment methodology defined here verifies the subject or topic of the assessment element (e.g., strategies, policies, procedures, the actions of following procedures, and ISCM reports) as specified in the assessment element text. Execution of each assessment element every time the ISCM program assessment is conducted in the manner explained in Figure 8 helps ensure the repeatability of the ISCM program assessment process.[Catalog]"
    status: "candidate"
  - id: "REQ-SP800-137A-0320"
    citation: {"ref": "SP800-137A", "page": 58, "anchor": "While the assessment [Catalog] includes the minimum set of ISCM program assessment"}
    kind: "should"
    locator: "3.4"
    context: "Limits on ISCM Program Assessment Elements"
    statement: "While the assessment [Catalog] includes the minimum set of ISCM program assessment elements, the organization—in conjunction with the assessor—may add assessment elements, or if the ISCM program assessment is limited by the number of ISCM process steps (as described in Section 2.3.2), assessment elements may be deleted or bypassed for a particular ISCM program assessment engagement. Section 3.5 explains how to tailor the ISCM program assessment process."
    status: "candidate"
  - id: "REQ-SP800-137A-0321"
    citation: {"ref": "SP800-137A", "page": 58, "anchor": "The ISCM program assessment does not repeat or augment control assessments (conducted"}
    kind: "modal"
    locator: "3.4"
    context: "Limits on ISCM Program Assessment Elements"
    statement: "The ISCM program assessment does not repeat or augment control assessments (conducted in accordance with [SP800-53A]) but verifies that the control assessments are conducted according to each assessment element’s conditions (e.g., at specified frequencies)."
    status: "candidate"
  - id: "REQ-SP800-137A-0322"
    citation: {"ref": "SP800-137A", "page": 58, "anchor": "Tailoring is a cooperative process between the assessor and the evaluated organization"}
    kind: "indicative"
    locator: "3.5"
    context: "Tailoring the ISCM Program Assessment Process"
    statement: "Tailoring is a cooperative process between the assessor and the evaluated organization that is undertaken to meet the organization’s needs. The steps of the assessment process (as described in Section 3.2) and the assessment itself may be tailored. Tailoring helps adapt the assessment to unique organizational situations, such as a limited (incremental) assessment for an immature ISCM program. Tailoring also helps facilitate adoption of the assessment across the entire organization where the sub-organizations may vary in degree of implementation or risk environment. Assessment elements and assessment procedures are flexible enough to be tailored to meet the organization’s needs."
    status: "candidate"
  - id: "REQ-SP800-137A-0323"
    citation: {"ref": "SP800-137A", "page": 58, "anchor": "Tailoring the ISCM program assessment may be needed based on an organization’s"}
    kind: "indicative"
    locator: "3.5"
    context: "Tailoring the ISCM Program Assessment Process"
    statement: "Tailoring the ISCM program assessment may be needed based on an organization’s specific implementation of the ISCM program. For example, the assessment for federal agencies is tailored in a way that helps determine whether organizational ISCM programs meet the federal ISCM requirements from the authoritative sources. ISCM program assessment tailoring is coordinated with the assessment organization to ensure that the ISCM program assessment still verifies the required aspects of ISCM. All tailoring decisions are documented in the ISCM Program Assessment Plan."
    status: "candidate"
  - id: "REQ-SP800-137A-0324"
    citation: {"ref": "SP800-137A", "page": 58, "anchor": "The scope of the assessment is determined by the organization’s leadership. Assessment"}
    kind: "indicative"
    locator: "3.5"
    context: "Tailoring the ISCM Program Assessment Process"
    statement: "The scope of the assessment is determined by the organization’s leadership. Assessment elements are tailored out of the catalog for a narrower scope (e.g., if the assessment is limited or incremental by the number of ISCM process steps), as described in Sections 2.3.2 and 3.4). The assessment scope may also be limited to specific risk management levels (e.g., for a Level 1-only [organizational] scope or a Level 3-only [system-level] scope)."
    status: "candidate"
  - id: "REQ-SP800-137A-0325"
    citation: {"ref": "SP800-137A", "page": 59, "anchor": "Tailoring the Assessment Elements. Tailoring could result in modifications to fields/attributes for"}
    kind: "should"
    locator: "3.5"
    context: "Tailoring the ISCM Program Assessment Process"
    statement: "Tailoring the Assessment Elements. Tailoring could result in modifications to fields/attributes for the assessment elements. Assessment elements may be reworded to incorporate concepts created by new technologies or techniques. The assessment element set may be tailored by creating additional elements or modified by rewording, as described in Section 2.2.7."
    status: "candidate"
  - id: "REQ-SP800-137A-0326"
    citation: {"ref": "SP800-137A", "page": 59, "anchor": "The ISCM program assessment process may be intense and short-lived, or it"}
    kind: "imperative"
    locator: "3.6"
    context: "Conclusion of the ISCM Program Assessment"
    statement: "The ISCM program assessment process may be intense and short-lived, or it may continue at a lower level of effort. Organizational personnel may meet with the assessment team after conclusion of the assessment. Follow-on collaboration may also involve meetings with the organizational staff and assessment team."
    status: "candidate"
  - id: "REQ-SP800-137A-0327"
    citation: {"ref": "SP800-137A", "page": 59, "anchor": "Post-assessment engagement. The ISCM program assessment may be repeated at predetermined intervals,"}
    kind: "indicative"
    locator: "3.6"
    context: "Conclusion of the ISCM Program Assessment"
    statement: "Post-assessment engagement. The ISCM program assessment may be repeated at predetermined intervals, such as when certain milestones occur in the development of the organization’s ISCM program or when response actions from a previous assessment are completed to verify closure of the action. A follow-on assessment may be expanded in scope as the organization’s ISCM program gains maturity."
    status: "candidate"
  - id: "REQ-SP800-137A-0328"
    citation: {"ref": "SP800-137A", "page": 17, "anchor": "When applied to ISCM programs, “robustness” refers to an ISCM capability that"}
    kind: "indicative"
    locator: "2.1"
    context: "ISCM Management"
    statement: "When applied to ISCM programs, “robustness” refers to an ISCM capability that is sufficiently accurate, complete, timely, and reliable to provide security status information to organization decision makers to enable them to make risk-based decisions."
    status: "not-a-requirement"
    reason: "Footnote 7 defining 'robustness'; a definition."
  - id: "REQ-SP800-137A-0329"
    citation: {"ref": "SP800-137A", "page": 24, "anchor": "ISCM-relevant statements extracted from the sources but that originally spanned more than"}
    kind: "indicative"
    locator: "2.2.1"
    context: "ISCM Program Assessment Criteria The following are examples of assessment elements:"
    statement: "ISCM-relevant statements extracted from the sources but that originally spanned more than one ISCM step are expressed as separate assessment elements—one (unique) element for each applicable process step. The assessment elements were also developed from other ISCM functionality and principles, such as those suggested by developer, operator, and assessor experience and federal guidance."
    status: "candidate"
    removed: true
