  - id: "REQ-SP800-137A-0111"
    citation: {"ref": "SP800-137A", "page": 27, "anchor": "ISCM program assessment elements may be linked together to provide traceability from"}
    kind: "should"
    locator: "2.2.5"
    context: "Traceability of ISCM Program Assessment Elements (Chains)"
    statement: "ISCM program assessment elements may be linked together to provide traceability from one element to one or more other elements related to the Parent attribute and based on a particular aspect of the ISCM program (e.g., security status monitoring or ISCM metrics). Assessment elements linked together to provide traceability are called a chain. Chains show the parent/child relationship of elements spanning two or more ISCM process steps."
    status: "not-a-requirement"
    reason: "'elements may be linked together' and 'are called a chain' define chains; no actor is bound."
  - id: "REQ-SP800-137A-0112"
    citation: {"ref": "SP800-137A", "page": 27, "anchor": "Assessors may find it beneficial to trace paths through assessment elements by"}
    kind: "should"
    locator: "2.2.5"
    context: "Traceability of ISCM Program Assessment Elements (Chains)"
    statement: "Assessors may find it beneficial to trace paths through assessment elements by chains as they examine or interview assessment objects at the three organizational risk management levels. For example, one type of artifact or one set of interview questions covering a chain of assessment elements focuses on a narrow subject area (e.g., ISCM strategies) to help assessors make judgments more efficiently."
    status: "not-a-requirement"
    reason: "'Assessors may find it beneficial to trace paths' is a tip to the assessor."
  - id: "REQ-SP800-137A-0113"
    citation: {"ref": "SP800-137A", "page": 28, "anchor": "In following the first chain (i.e., 1-032, 2-016, and 3-019), the first"}
    kind: "indicative"
    locator: "2.2.5"
    context: "Traceability of ISCM Program Assessment Elements (Chains)"
    statement: "In following the first chain (i.e., 1-032, 2-016, and 3-019), the first block is linked to the second, and the second block is linked to the third. An assessor may request artifacts that address the completeness of data collected, as specified in each assessment element of the chain as applicable. The artifacts may then be used to make judgments about all three assessment elements. In following the second chain, the sub-chain (2-017 and 3-020) has the same parent as the first chain (1-032) but is linked based on the timeliness of the data collected, and an assessor may request artifacts that address the timeliness of data collected. As with the first chain, the artifacts may then be used to make judgments about all three assessment elements in the chain, and similarly for the third chain. The assessor may request a demonstration of automated functionality or artifacts documenting automation. For the fourth chain, the assessor may request artifacts illustrating how data is used to evaluate the ISCM program."
    status: "not-a-requirement"
    reason: "Walks through the Figure 2 example; 'An assessor may request artifacts' is an option illustrated on that example."
