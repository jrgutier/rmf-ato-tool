  - id: "REQ-SP800-137A-0177"
    citation: {"ref": "SP800-137A", "page": 36, "anchor": "If scoring is performed, ISCM program assessment results include the scoring results"}
    kind: "indicative"
    locator: "2.2.12"
    context: "Reporting of Assessment Results"
    statement: "If scoring is performed, ISCM program assessment results include the scoring results for each assessment element combined into a single score for the organization or for the part of the organization being assessed. Reports may be broken out by overall organization, individual organizational parts, organizational level, or specific assessment element attributes, such as the source of the assessment element, various aspects or categories (e.g., strategy, metrics, governance, criticality of findings), individual scores by assessment element, or other grouping meaningful to the organization."
