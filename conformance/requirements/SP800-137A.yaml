  - id: "REQ-SP800-137A-0095"
    citation: {"ref": "SP800-137A", "page": 25, "anchor": "The [Catalog] provided with this publication is an extensive set of ISCM"}
    kind: "indicative"
    locator: "2.2.1"
    context: "ISCM Program Assessment Criteria"
    statement: "The [Catalog] provided with this publication is an extensive set of ISCM program assessment elements and is considered to be the minimum set of elements needed for a comprehensive ISCM program assessment. However, an assessment may be limited by the number of ISCM process steps or by the risk management level. Assessment elements that apply to any excluded ISCM process steps are not included in the set of assessment elements presented to the assessor."
    status: "not-a-requirement"
    reason: "'The [Catalog] ... is considered to be the minimum set' and 'an assessment may be limited'; describes the catalog and an option on scope, and the catalog is not in this document."
