  - {"page": 12, "locator": "1 Introduction", "reason": "no-marker", "text": "Under the Federal Information Modernization Act of 2014 (FISMA) [FISMA2014] and Office of Management and Budget (OMB) Circulars and Memoranda,2 federal agencies are directed to implement a program to continuously monitor organizational information security status. A comprehensive continuous monitoring program serves as a risk management and decision support tool used at each level of an organization. Strategies and business objectives at the organizational level direct activities needed at the mission and business levels as well as system level functions and technologies implemented in support of continuous monitoring."}
  - {"page": 12, "locator": "1 Introduction", "reason": "no-marker", "text": "NIST Special Publication (SP) 800-137, Information Security Continuous Monitoring (ISCM) for Federal Information Systems and Organizations [SP800-137], defines information security continuous monitoring (ISCM) as maintaining ongoing awareness of information security, vulnerabilities, and threats to support organizational risk management decisions. An ISCM program defines, establishes, implements, and operates the various aspects of ISCM to provide the organization with the information necessary to make risk-based decisions regarding security status at all three organizational risk management levels."}
  - {"page": 12, "locator": "1 Introduction", "reason": "lead-in", "text": "To effectively address increasing security challenges, the ISCM program:"}
  - {"page": 12, "locator": "1 Introduction", "reason": "no-marker", "text": "Security status monitoring is the monitoring of organizationally defined metrics that measure the organizational security posture."}
  - {"page": 13, "locator": "1.1", "reason": "no-marker", "text": "For more information about CISA, see: https://www.cisa.gov."}
  - {"page": 13, "locator": "1.1", "reason": "no-marker", "text": "For more information about the NCCoE, see: https://nccoe.nist.gov."}
  - {"page": 14, "locator": "1.2", "reason": "lead-in", "text": "This publication:"}
  - {"page": 14, "locator": "1.2", "reason": "lead-in", "text": "In addition, the guidance presented in this publication can be used to produce an ISCM program assessment to:"}
  - {"page": 14, "locator": "1.3", "reason": "lead-in", "text": "This publication serves individuals associated with the continuous monitoring of information security posture and organizational risk management, including:"}
  - {"page": 15, "locator": "1.4", "reason": "not-normative", "text": "This publication addresses the entire ISCM program assessment process and is used to evaluate the establishment and operation of ISCM programs across organizations. The assessment of individual controls and the examination of control assessment results is outside of the scope of the ISCM program assessment."}
  - {"page": 15, "locator": "1.5", "reason": "no-marker", "text": "It is assumed that the reader is familiar with the ISCM concepts described in [SP800-137] and has a working-level understanding of the NIST Risk Management Framework (RMF) as defined and amended in [SP800-37]. It is also assumed that the reader is familiar with risk management processes across the organization and organizational levels as defined and amended in NIST SP 800-39 [SP800-39], Managing Information Security Risk: Organization, Mission, and Information System View."}
  - {"page": 15, "locator": "1.6", "reason": "lead-in", "text": "The remainder of this NIST Special Publication is organized as follows:"}
  - {"page": 17, "locator": "2 The Fundamentals", "reason": "lead-in", "text": "This section explains the fundamentals of the ISCM program assessment, a management process that provides a view into the adequacy and effectiveness of the:"}
  - {"page": 17, "locator": "2 The Fundamentals", "reason": "no-marker", "text": "The fundamentals presented in this section are integrated into an assessment process in Section 3."}
  - {"page": 17, "locator": "2.1", "reason": "no-marker", "text": "[SP800-39] identifies the organizational risk management levels: organization level (level 1); mission/business process level (level 2); and system level (level 3)."}
  - {"page": 18, "locator": "2.1", "reason": "no-marker", "text": "An adequately developed ISCM program identifies the specific activities at each level of the organization that enable an organization-wide ISCM function. To effectively support the overall ISCM effort, ISCM activities are consistently developed, deployed, and sustained with explicit mapping to the ISCM strategic objectives and risk management strategy for the entire organization."}
  - {"page": 18, "locator": "2.1", "reason": "no-marker", "text": "The following subsections summarize important ISCM concepts and introduce how the ISCM program assessment relates to each concept. For additional information on developing and implementing ISCM, see [SP800-137]."}
  - {"page": 18, "locator": "2.1.1", "reason": "no-marker", "text": "ISCM goals include detection of anomalies and changes in the organization’s environments of operation and systems, visibility into assets, awareness of vulnerabilities and threats, knowledge of security control effectiveness, and security posture. To meet ISCM goals, tools, technologies, and manual and automated methods are implemented within the context of an ISCM architecture designed to deliver the required information in the appropriate context, at the right level of detail, and at the right frequencies. The key outcome of the ISCM program is to enable the collection, integration, analysis, and presentation of security-related information from all systems and their environments of operation across the organization to inform risk-based decision making.9"}
  - {"page": 18, "locator": "2.1.2", "reason": "no-marker", "text": "NIST SP 800-137 organizes the ISCM process into six steps, as depicted in Figure 1 and explained below. It is important to note that any effort or process intended to support ongoing monitoring of information security across an organization begins with the development of a comprehensive ISCM strategy that encompasses technologies, processes, procedures, operating environments, and people."}
  - {"page": 19, "locator": "2.1.2", "reason": "short", "text": "Continuous Monitoring"}
  - {"page": 19, "locator": "2.1.2", "reason": "no-marker", "text": "▪Maps to risk tolerance ▪Adapts to ongoing needs ▪Actively involves management"}
  - {"page": 19, "locator": "2.1.2", "reason": "not-a-statement", "text": "Figure 1 – ISCM Process"}
  - {"page": 19, "locator": "2.1.2", "reason": "lead-in", "text": "The six ISCM steps are referred to as “process steps” in this publication and are:"}
  - {"page": 21, "locator": "2.1.5", "reason": "no-marker", "text": "ISCM governance is a conceptual organizing and planning structure for managing risk. It is linked to one or more senior officials or staff, such as the RE(f) or other accountable senior official (e.g., senior accountable official for risk management, senior agency information security officer [SAISO], senior agency official for privacy, and chief information officer [CIO]). The part of information security governance structure that addresses ISCM is aligned with other governance structures to ensure compatibility with established management practices within the organization and to increase overall effectiveness."}
  - {"page": 22, "locator": "2.1.7", "reason": "no-marker", "text": "The ISCM program assessment verifies that ISCM information is available for making OA decisions. The ISCM program assessment verifies that:"}
  - {"page": 22, "locator": "2.1.7", "reason": "no-marker", "text": "For more information on metrics development in general, see [SP800-55], Performance Measurement Guide for Information Security."}
  - {"page": 23, "locator": "2.2", "reason": "no-marker", "text": "An ISCM program assessment provides organizational leadership with information on the effectiveness and completeness of the organization’s ISCM program. ISCM program assessment results include an indication of how well the assessed organization (e.g., entire organization, mission/business process, or system) meets the evaluation criteria. Assessment results give indications of ISCM program adequacy and consistency. Results may also include recommendations for ISCM program design, implementation, operation, and governance that may need improvement."}
  - {"page": 23, "locator": "2.2", "reason": "no-marker", "text": "The ISCM program assessment process is an information-gathering and evidence-analyzing activity. The information gathered and evidence examined can be used by an organization to:"}
  - {"page": 24, "locator": "2.2", "reason": "no-marker", "text": "The foundation of the ISCM program assessment is a set of assessment elements and their usage for making judgments about the ISCM program by the ISCM program assessor. An ISCM program assessment determines whether or how well the ISCM capability meets the requirements and objectives of ISCM as specified by the assessment elements."}
  - {"page": 24, "locator": "2.2.1", "reason": "no-marker", "text": "The ISCM program assessment defines the evaluation criteria applied to each aspect of the ISCM program being assessed (e.g., security status monitoring policy and procedures, common control assessment policy, configuration management procedures, security status reporting). The evaluation criteria defined by this publication establish the assessment element as the central component. ISCM program assessment elements are statements about various attributes of the ISCM program that are evaluated by the assessor. Each ISCM program assessment element is grounded in one of the six ISCM process steps summarized in Section 2.1.2. The complete set of ISCM program assessment elements is presented in the [Catalog] along with the attributes of each element. The following are examples of assessment elements:"}
  - {"page": 24, "locator": "2.2.1", "reason": "no-marker", "text": "ISCM-relevant statements extracted from the sources but that originally spanned more than one ISCM step are expressed as separate assessment elements—one (unique) element for each applicable process step. The assessment elements were also developed from other ISCM functionality and principles, such as those suggested by developer, operator, and assessor experience and federal guidance."}
  - {"page": 25, "locator": "2.2.1", "reason": "no-marker", "text": "Some assessment elements of the ISCM program assessment are partially outside of the scope of the ISCM program. Such elements evaluate the use of information from the RMF process (e.g., current risk levels, risk tolerance level, threat and vulnerability information) while other elements evaluate the ISCM program’s capability to send security-related information (e.g., security status reports, security metrics) to inform the organization’s implementation of the RMF. A few assessment elements may overlap with certain [SP800-53] controls, but the ISCM program assessment does not consider or re-evaluate the effectiveness of individual controls."}
  - {"page": 25, "locator": "2.2.1", "reason": "no-marker", "text": "The assessment elements can also be used as requirements for an ISCM program under development. The elements can be used to guide the ISCM program design in terms of functionality and policies and procedures needed. The elements can also be used to evaluate an ISCM plan or design, such as ISCM technical architecture, operational procedures, and ISCM strategies."}
  - {"page": 25, "locator": "2.2.2", "reason": "lead-in", "text": "The sources of ISCM program assessment elements are:"}
  - {"page": 26, "locator": "2.2.2", "reason": "no-marker", "text": "The sources are fully attributed in Appendix C and referenced in the Source Attribute column in the [Catalog]. Note that there may be multiple sources from which an assessment element was derived for an ISCM program assessment element."}
  - {"page": 26, "locator": "2.2.3", "reason": "no-marker", "text": "Each ISCM program assessment element has associated guidance in the form of the discussion attribute that provides supplemental guidance to assist in judgments about the assessment element and to clarify possible ambiguities in assessment element wording, potential assessment objects, what to look for with respect to specific objects, and sources of additional information. The discussion attribute and associated guidance is described in Section 3.3."}
  - {"page": 27, "locator": "2.2.4", "reason": "no-marker", "text": "The ISCM Program Assessment Element Catalog [Catalog] is an information base in tabular form of all assessment elements defined for the ISCM program assessment. The rows in the Catalog contain the assessment elements with their attributes."}
  - {"page": 27, "locator": "2.2.5", "reason": "not-a-statement", "text": "Figure 2 shows four examples of chains of similar assessment elements, each originating from the Define Step (element 1-032). The character string in the upper left corner of each element provides unique identification of an individual assessment element (with the first numeric character being the ISCM process step)."}
  - {"page": 28, "locator": "2.2.5", "reason": "not-a-statement", "text": "Figure 2 – Example of Chains"}
  - {"page": 28, "locator": "2.2.5", "reason": "no-marker", "text": "In the example of four chains in Figure 2, one chain—consisting of assessment elements 1-032, 2-016, and 3-019—links together assessment elements involving the completeness of ISCM-relevant data to be collected. The second chain—consisting of assessment elements 1-032, 2- 017, and 3-020—links together assessment elements involving the timeliness of ISCM-relevant data. The third chain, consisting of 1-032 and 3-041, deals with automating this data. The fourth chain, consisting of 1-032 and 6-013, involves using this data in the review and update of the ISCM program."}
  - {"page": 29, "locator": "2.2.5", "reason": "no-marker", "text": "Diagrams of the traceability chains are contained in the [Catalog]. These diagrams are arranged by ISCM aspect, such as chains addressing ISCM strategy management, metrics, and control assessment rigor. Assessing elements by aspect (subject), as represented by chains, can yield useful information, particularly when the assessment is scored according to that ISCM aspect or when deficiencies are to be identified in that aspect of ISCM, such as ISCM-relevant metrics."}
  - {"page": 29, "locator": "2.2.6", "reason": "no-marker", "text": "The ISCM program assessment accommodates all aspects of the ISCM program and is grounded in the principles of [SP800-137]. Properties of the ISCM program assessment include:"}
  - {"page": 29, "locator": "2.2.7", "reason": "no-marker", "text": "The ISCM program assessment includes a framework for making judgments, which are responses made by the assessor to the assessment elements. This section outlines the types of judgments and the ways judgments can be made."}
  - {"page": 30, "locator": "2.2.7", "reason": "no-marker", "text": "An aspect of the ISCM program (e.g., ISCM strategy or ISCM outputs/reports) is evaluated against a set of assessment elements, which may be a chain of elements as explained in Section 2.2.5. For each element considered, a judgment results from the assessor’s response in choosing from a set of predefined judgment values, examples of which are presented below."}
  - {"page": 30, "locator": "2.2.7.1", "reason": "lead-in", "text": "An example of more granular judgment values is:"}
  - {"page": 30, "locator": "2.2.7.1", "reason": "no-marker", "text": "The two-value judgment set of Satisfied and Other than Satisfied is aligned with the assessment results used in [SP800-53A]."}
  - {"page": 31, "locator": "2.2.7.2", "reason": "not-a-statement", "text": "Figure 3 shows the process for making judgments for an assessment element using the available information."}
  - {"page": 31, "locator": "2.2.7.2", "reason": "not-a-statement", "text": "Figure 3 – Process for Making Judgments"}
  - {"page": 31, "locator": "2.2.7.2", "reason": "not-a-statement", "text": "Examples of evidence relevant to each assessment element are listed in the [Catalog] as potential assessment objects associated with the Examine Potential Assessment Methods."}
  - {"page": 33, "locator": "2.2.9.b", "reason": "not-a-statement", "text": "Table 1 shows an example decision matrix that an assessment may use for combining two levels of judgments using Rules 2 or 3 above. In this example, the approach for combining two levels with different values is to apply the worst-case method, which results in an Other than Satisfied judgment in three of the four cases."}
  - {"page": 33, "locator": "2.2.9.b", "reason": "no-marker", "text": "Based on judgments obtained for one or both levels assessed."}
  - {"page": 34, "locator": "2.2.9.b", "reason": "not-a-statement", "text": "Table 1 – Combining Judgments from Two Levels (Unbiased) 17"}
  - {"page": 34, "locator": "2.2.9.b", "reason": "fragment", "text": "(Unbiased)"}
  - {"page": 34, "locator": "2.2.9.b", "reason": "not-a-statement", "text": "Table 2 presents an alternative matrix for combining two levels that gives priority to the higher level, which has a broader view of the actual business of the organization. Rules 2 and 3 remain the same using the matrix of Table 2; however, the outcome of applying any of the rules is different from the outcome of the Table 1 matrix."}
  - {"page": 34, "locator": "2.2.9.b", "reason": "not-a-statement", "text": "Table 2 – Combining Judgments from Two Levels (Higher level bias)"}
  - {"page": 34, "locator": "2.2.9.b", "reason": "fragment", "text": "Satisfied | Satisfied"}
  - {"page": 34, "locator": "2.2.9.b", "reason": "fragment", "text": "Satisfied | Other-than-Satisfied"}
  - {"page": 34, "locator": "2.2.9.b", "reason": "fragment", "text": "Other-than-Satisfied | Satisfied"}
  - {"page": 34, "locator": "2.2.9.b", "reason": "fragment", "text": "Other-than-Satisfied | Other-than-Satisfied"}
  - {"page": 34, "locator": "2.2.9.b", "reason": "not-a-statement", "text": "Table 3 presents another alternative matrix for combining two levels that gives priority to the lower level, which may be closer to what is actually occurring in the organization. Rules 2 and 3 remain the same with the matrix of Table 3. However, the outcome of applying any of the rules is different from the matrices of Tables 1 and 2."}
  - {"page": 34, "locator": "2.2.9.b", "reason": "no-marker", "text": "The words higher and lower refer to the positions within the risk management hierarchy, as described in [SP800-39]. The highest level is Level 1, and the lowest level is Level 3."}
  - {"page": 35, "locator": "2.2.9.b", "reason": "not-a-statement", "text": "Table 3 – Combining Judgments from Two Levels (Lower level bias)"}
  - {"page": 35, "locator": "2.2.10", "reason": "no-marker", "text": "Using the default binary judgment values, each assessment element is assigned one of two possible scores as shown in Table 4."}
  - {"page": 35, "locator": "2.2.10", "reason": "not-a-statement", "text": "Table 4 – Example of Default Judgment Value Scoring"}
  - {"page": 35, "locator": "2.2.10", "reason": "fragment", "text": "1 | Satisfied"}
  - {"page": 35, "locator": "2.2.10", "reason": "no-marker", "text": "As with any type of numeric scoring, the result can be expressed as a percentage by dividing the score by the best possible score."}
  - {"page": 36, "locator": "2.2.11", "reason": "no-marker", "text": "Over the lifetime of an assessment, the designation of critical assessment elements may change to reflect new national cybersecurity priorities, goals, and issues. In addition, critical assessment elements may vary from one organization to another, depending on factors such as the organization’s risk tolerance."}
  - {"page": 36, "locator": "2.2.12", "reason": "no-marker", "text": "Assessment results include recommendations based on the data collected and analyzed. Some recommendations are formed automatically from judgment results with potential assistance from an assessment tool, while others are made by a manual decision process by the assessors. Organizations or third-party assessors optionally add their own recommendations based on their considerations of the assessment element judgments."}
  - {"page": 37, "locator": "2.3", "reason": "no-marker", "text": "The overarching goal of the ISCM program assessment is to provide organizations with recommendations to improve the ISCM program and thereby manage and reduce organizational risk. There are different ways to characterize the ISCM program assessment process, including type of assessment and type of assessors, depth and duration of the assessment, and expected results of the assessment."}
  - {"page": 37, "locator": "2.3.1", "reason": "no-marker", "text": "There are two types of ISCM program assessment engagements: third-party assessments and self-assessments."}
  - {"page": 38, "locator": "2.3.2", "reason": "no-marker", "text": "The extent of the ISCM program assessment is flexible in terms of which process steps it addresses. The assessment can stop at any step or logical stopping point or can evaluate a portion of an organization rather than the entire organization. The ISCM program assessment has the following characteristics that define the ISCM program assessment scope:"}
  - {"page": 38, "locator": "2.3.3", "reason": "no-marker", "text": "The expected outcome of the ISCM program assessment is the improvement of the security posture of the organization and risk reduction. To this end, the ISCM program assessment produces actionable recommendations to improve the ISCM program, such as in the areas of ISCM program design, implementation, operation, and governance. The primary output of the ISCM program assessment is a report of findings to the organization, which includes the following, as applicable:"}
  - {"page": 39, "locator": "2.3.3", "reason": "no-marker", "text": "In addition, a separate report on the engagement may be made for the assessment organization by the evaluated organization’s staff with the objective of improving the ISCM program assessment process."}
  - {"page": 40, "locator": "3 The Process", "reason": "no-marker", "text": "This section describes the component parts of an assessment and the overall ISCM program assessment process. The ISCM program assessment process defines how to evaluate the organizational ISCM capability, including: (i) the activities carried out by organizations and assessment bodies to prepare for ISCM program assessments, (ii) the development of the ISCM program assessment plan, (iii) the conduct of ISCM program assessments and the analysis and reporting of assessment results, and (iv) post-assessment report analysis and follow-on activities."}
  - {"page": 40, "locator": "3.1", "reason": "not-normative", "text": "While an assessment relies on a manual process implemented by assessors, it leverages input from automated ISCM processes as evidence to be used in making judgments. For example, ISCM-produced reports may be supplied to the assessor by an organizational dashboard or security information and event management (SIEM) component; the assessor then uses the ISCM-produced reports to make judgments against one or more specific assessment elements. The assessor (or a tool, if available) then collects and aggregates judgment results from assessment participants at all applicable levels to produce an organization-wide judgment, which is the basis for the assessment findings."}
  - {"page": 43, "locator": "3.1.1", "reason": "not-a-statement", "text": "Figure 4 – ISCM Program Assessment Process"}
  - {"page": 44, "locator": "3.2.1", "reason": "no-marker", "text": "The Plan Step of the ISCM program assessment defines the assessment process and formalizes the conduct of a program assessment as illustrated in Figure 5."}
  - {"page": 44, "locator": "3.2.1", "reason": "not-a-statement", "text": "Figure 5 – ISCM Program Assessment Process (Plan)"}
  - {"page": 45, "locator": "3.2.1", "reason": "lead-in", "text": "To achieve a comprehensive ISCM program assessment, assessment leaders ensure that all areas of ISCM to be considered are evaluated by knowledgeable staff, as follows:"}
  - {"page": 46, "locator": "3.2.1", "reason": "lead-in", "text": "The assessment team begins preparing by:"}
  - {"page": 47, "locator": "3.2.2", "reason": "not-a-statement", "text": "Figure 6 – ISCM Program Assessment Process (Conduct)"}
  - {"page": 47, "locator": "3.2.2", "reason": "lead-in", "text": "The goal of the Conduct Step is to understand how well the organization’s ISCM program:"}
  - {"page": 48, "locator": "3.2.2", "reason": "no-marker", "text": "Basic spreadsheet, presentation, and word processing technologies are available and useful to maintain and present the body of assessment elements and raw data from the assessment to assessors and organization leadership. There may be commercially available tools that are oriented toward system and organization program assessments based on specific assessment criteria that can be used to support an assessment; however, this publication does not endorse any commercial information technology products, applications, or systems."}
  - {"page": 48, "locator": "3.2.2.1.•", "reason": "lead-in", "text": "• Documents:"}
  - {"page": 49, "locator": "3.2.2.1.•", "reason": "lead-in", "text": "• ISCM-produced security related information from:"}
  - {"page": 49, "locator": "3.2.2.1", "reason": "no-marker", "text": "CISO, RE(f) staff, AOs, mission and business area management, common control providers, system owners, and ISSOs"}
  - {"page": 49, "locator": "3.2.2.1.•", "reason": "lead-in", "text": "• Human insight obtained from interviews with:"}
  - {"page": 49, "locator": "3.2.2.1.o", "reason": "label-only", "text": "o Organizational leadership"}
  - {"page": 49, "locator": "3.2.2.1.o", "reason": "label-only", "text": "o System administrators"}
  - {"page": 49, "locator": "3.2.2.1.o", "reason": "label-only", "text": "o Authorizing officials"}
  - {"page": 49, "locator": "3.2.2.2", "reason": "no-marker", "text": "Collected information is manually analyzed by the assessment staff, and findings are entered into the repository or assessment tool being utilized, which may be capable of creating graphs and charts. Information analysis leads to judgments about the degree to which the ISCM program meets each relevant assessment element."}
  - {"page": 49, "locator": "3.2.2.2", "reason": "not-normative", "text": "Judgments are made at each organizational level to determine the ISCM program’s adequacy for a given assessment element at that level. If there are multiple judgments made at one level by individuals or groups working in parallel, the judgments are aggregated into a single judgment for that level by the assessor, as described in Sections 2.2.8 and 2.2.9. For example, an assessor may aggregate judgments made at the system level into a single judgment encompassing all judgments about all systems assessed for a particular assessment element."}
  - {"page": 50, "locator": "3.2.2.2", "reason": "no-marker", "text": "Mission/business process ISCM program assessments can be conducted or supported by mission/business owners, common controls providers, security control assessors, and CISO staff security specialists. The organization-wide ISCM program assessment can be conducted or supported by staff of the organization’s CIO, SAISO/CISO, and RE(f)."}
  - {"page": 50, "locator": "3.2.2.2", "reason": "no-marker", "text": "Once there is a single judgment about an assessment element from each applicable organizational level, the judgments are combined as necessary into a single judgment for a given element. When all elements have a single judgment, the Conduct Step concludes."}
  - {"page": 50, "locator": "3.2.3", "reason": "no-marker", "text": "The Report Step (Figure 7) is the last step of the engagement process that includes participation by the assessors. The Report Step of the ISCM program assessment defines the output-oriented part of the ISCM program assessment."}
  - {"page": 51, "locator": "3.2.3", "reason": "not-a-statement", "text": "Figure 7 – ISCM Program Assessment Process (Report)"}
  - {"page": 52, "locator": "3.3", "reason": "no-marker", "text": "When an ISCM program assessment element is added or modified for a specific assessment of the organization, the corresponding assessment procedure information is created or modified. Other attributes, such as discussion, are also added or modified. Section 3.5 explains how to tailor the ISCM program assessment process, including the assessment elements."}
  - {"page": 52, "locator": "3.3", "reason": "no-marker", "text": "The ISCM program assessment elements promote repeatability of the ISCM program assessment process and offer the necessary flexibility to customize assessments based on scope, organizational structure, policies and procedures, operational considerations, system and network architecture, and tolerance for risk."}
  - {"page": 52, "locator": "3.3.1", "reason": "no-marker", "text": "The information fields of the assessment element, including contextual information or attributes21 of the assessment element, are defined below."}
  - {"page": 52, "locator": "3.3.1", "reason": "no-marker", "text": "In the [Catalog], attributes are the cells of each row of the (catalog) table."}
  - {"page": 53, "locator": "3.3.1", "reason": "no-marker", "text": "Assessment Objective. Each assessment objective includes a determination statement related to the assessment element text. The determination statement (i.e., “Determine if...”) refers to the content of the assessment element text and determines whether or how well the evaluated aspect of the ISCM program meets the underlying ISCM principle or requirement specified in the applicable source for that element. The application of an assessment procedure to an aspect of the ISCM program under evaluation produces an assessment finding, which reflects whether or how well the assessment element is met."}
  - {"page": 53, "locator": "3.3.1", "reason": "no-marker", "text": "[SP800-53A] discusses assurance in the assessment process."}
  - {"page": 54, "locator": "3.3.1", "reason": "lead-in", "text": "Mechanism outputs are reports or notifications from specific hardware, software, or firmware monitoring functions or safeguards employed within a system or operating environment, such as:"}
  - {"page": 54, "locator": "3.3.1", "reason": "lead-in", "text": "Activities are the monitoring-related actions associated with a system that involve people, such as:"}
  - {"page": 54, "locator": "3.3.1", "reason": "not-a-statement", "text": "Table 5 shows the format of the assessment element and its attributes, as defined in the Assessment Element Catalog [Catalog]."}
  - {"page": 55, "locator": "3.3.1", "reason": "not-a-statement", "text": "Table 6 shows an example of an assessment element from the [Catalog]."}
  - {"page": 57, "locator": "3.3.2", "reason": "not-a-statement", "text": "Figure 8 illustrates the use of the assessment element using the example element presented in Table 6."}
  - {"page": 57, "locator": "3.3.2", "reason": "not-a-statement", "text": "Figure 8 – Use of Example Assessment Item Information"}
  - {"page": 58, "locator": "3.5", "reason": "not-normative", "text": "Tailoring the ISCM Program Assessment Scope. At the start of the tailoring activity, decisions about the scope of the ISCM program assessment are made, such as which systems and system components (e.g., user endpoints, servers, networking components) are to be assessed with respect to the ISCM program implementation to provide credible assessment evidence. Tailoring the ISCM program assessment scope involves understanding the organization’s ISCM requirements and constraints and modifying the assessment elements where necessary. For example, tailoring may be based on organizational structure (e.g., number and size of sub-organizations) or ISCM maturity, such as disparity in ISCM maturity among mission/business processes)."}
  - {"page": 59, "locator": "3.5", "reason": "no-marker", "text": "If the ISCM program assessment is assisted by a tool, the tailoring of individual assessment elements may be problematic if the tool is not designed for modification of the assessment elements and their attributes."}
  - {"page": 59, "locator": "3.6", "reason": "no-marker", "text": "The ISCM program assessment may provide the organization with recommendations to improve the ISCM program, including areas of ISCM program design, implementation, operation, and governance. At the conclusion of an assessment, the assessors present a draft report, and after discussion with organization leadership, a final report that resolves any differences of opinion between the assessors and the organization is presented to the organization. See Sections 2.2.12 and 3.2.3 for more information on reporting ISCM program assessment results."}
