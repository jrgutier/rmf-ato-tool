  - id: "REQ-SP800-137A-0044"
    citation: {"ref": "SP800-137A", "page": 17, "anchor": "ISCM process improvement."}
    kind: "lettered"
    locator: "2 The Fundamentals.•"
    context: "This section explains the fundamentals of the ISCM program assessment, a management process that provides a view into the adequacy and effectiveness of the:"
    statement: "• ISCM process improvement."
    status: "not-a-requirement"
    reason: "Fragment 'ISCM process improvement' of the same lead-in; a topic only."
  - id: "REQ-SP800-137A-0045"
    citation: {"ref": "SP800-137A", "page": 17, "anchor": "The development process of the ISCM program assessment does not seek to"}
    kind: "should"
    locator: "2 The Fundamentals"
    context: ""
    statement: "The development process of the ISCM program assessment does not seek to evaluate the organization, its missions/business processes, and systems for every ISCM concept presented in [SP800-137]. Rather, the ISCM program assessment determines if the concepts, along with ISCM requirements levied on federal organizations by FISMA and OMB, are sufficiently addressed to permit a determination of ISCM program robustness.7 It should be noted that each organization or assessor developing an ISCM program assessment from the guidance in this publication is likely to produce different assessment criteria depending on what is important to the organization or assessor."
    status: "not-a-requirement"
    reason: "'It should be noted that each organization ... is likely to produce different assessment criteria' is a reader's note, so should here asks no one to act; the rest says what the assessment does not seek."
  - id: "REQ-SP800-137A-0046"
    citation: {"ref": "SP800-137A", "page": 17, "anchor": "ISCM is an organization-wide responsibility first, then a system-level responsibility [SP800-37], which"}
    kind: "modal"
    locator: "2.1"
    context: "ISCM Management"
    statement: "ISCM is an organization-wide responsibility first, then a system-level responsibility [SP800-37], which includes mission and business processes as well. Organization-wide continuous monitoring efforts begin with organizational leadership defining a comprehensive, organization-wide ISCM strategy that directly supports decision making within the risk executive function (RE(f)) and includes consistently managed metrics linked to each organizational risk management level.8 Only when an ISCM strategy is defined and adopted at the organizational level and intrinsically linked to the RE(f) can the ISCM program be established with the appropriate breadth and depth to provide all levels of the organization with clearly defined responsibilities. The organizational level strategy is supported by system-level ISCM strategies and, optionally, mission/business process ISCM strategies."
    status: "candidate"
  - id: "REQ-SP800-137A-0047"
    citation: {"ref": "SP800-137A", "page": 18, "anchor": "ISCM encompasses all of the people, policies, processes, technologies, and standards that"}
    kind: "indicative"
    locator: "2.1"
    context: "ISCM Management"
    statement: "ISCM encompasses all of the people, policies, processes, technologies, and standards that are used to perform the continuous monitoring function. ISCM is an enabling process that supports or provides organizational sustainment in the face of cybersecurity threats and risks."
    status: "not-a-requirement"
    reason: "'ISCM encompasses all of the people, policies, processes' defines what ISCM is."
  - id: "REQ-SP800-137A-0048"
    citation: {"ref": "SP800-137A", "page": 18, "anchor": "An effective ISCM program identifies manual and automated monitoring processes in the"}
    kind: "indicative"
    locator: "2.1.1"
    context: "ISCM Background"
    statement: "An effective ISCM program identifies manual and automated monitoring processes in the organization-wide ISCM strategy, integrates the processes and associated outputs, and incorporates results into a view of situational awareness. Where manual processes are used, the processes are verified so that they are repeatable and enable a consistent implementation. Automated processes, including the use of automated support tools, can make continuous monitoring more consistent, efficient, accurate, and cost-effective."
    status: "candidate"
  - id: "REQ-SP800-137A-0049"
    citation: {"ref": "SP800-137A", "page": 18, "anchor": "An effective ISCM program facilitates ongoing authorization and reauthorization decisions for systems"}
    kind: "indicative"
    locator: "2.1.1"
    context: "ISCM Background"
    statement: "An effective ISCM program facilitates ongoing authorization and reauthorization decisions for systems [SP800-37], as discussed in Section 2.1.7. Security-related information collected during continuous monitoring is used to make updates to the authorization package and supporting artifacts for each applicable system. Updated artifacts provide evidence that the baseline controls continue to safeguard the system as originally planned."
    status: "candidate"
  - id: "REQ-SP800-137A-0050"
    citation: {"ref": "SP800-137A", "page": 18, "anchor": "For federal agencies, a uniform approach to ISCM across the Federal Government"}
    kind: "indicative"
    locator: "2.1.2"
    context: "ISCM Process Steps"
    statement: "For federal agencies, a uniform approach to ISCM across the Federal Government allows OMB and DHS to assess the security posture of the Federal Government as a whole. The same rationale applies to nonfederal organizations."
    status: "not-a-requirement"
    reason: "Footnote 9: 'a uniform approach ... allows OMB and DHS to assess the security posture'; a rationale, naming no duty."
  - id: "REQ-SP800-137A-0051"
    citation: {"ref": "SP800-137A", "page": 19, "anchor": "Define ISCM Strategy (Define) – Define the organization-wide and system-level ISCM strategies,"}
    kind: "lettered"
    locator: "2.1.2.1"
    context: "ISCM Process Steps The six ISCM steps are referred to as “process steps” in this publication and are:"
    statement: "1. Define ISCM Strategy (Define) – Define the organization-wide and system-level ISCM strategies, based on organizational risk tolerance, that maintain clear visibility into assets, awareness of vulnerabilities, up-to-date threat information, and mission/business impacts. A system-level ISCM strategy consistent with the organization-wide ISCM strategy is defined for each system within the organization. A mission/business process area may also define an ISCM strategy that is consistent with the organization-wide strategy and applies to the systems supporting the mission/business process area."
    status: "candidate"
  - id: "REQ-SP800-137A-0052"
    citation: {"ref": "SP800-137A", "page": 19, "anchor": "Establish ISCM Program (Establish) – Establish an ISCM program, determining metrics, status"}
    kind: "lettered"
    locator: "2.1.2.2"
    context: "ISCM Process Steps The six ISCM steps are referred to as “process steps” in this publication and are:"
    statement: "2. Establish ISCM Program (Establish) – Establish an ISCM program, determining metrics, status monitoring frequencies, control assessment frequencies, and an ISCM technical architecture."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137A-0053"
    citation: {"ref": "SP800-137A", "page": 19, "anchor": "Implement ISCM Program (Implement) – Implement the ISCM program and collect the"}
    kind: "lettered"
    locator: "2.1.2.3"
    context: "ISCM Process Steps The six ISCM steps are referred to as “process steps” in this publication and are:"
    statement: "3. Implement ISCM Program (Implement) – Implement the ISCM program and collect the security-related information required for metrics, assessments, and reporting. Automate collection, analysis, and reporting of data where possible."
    status: "candidate"
  - id: "REQ-SP800-137A-0054"
    citation: {"ref": "SP800-137A", "page": 19, "anchor": "Analyze ISCM Data and Report Findings (Analyze/Report) – Analyze the data collected,"}
    kind: "lettered"
    locator: "2.1.2.4"
    context: "ISCM Process Steps The six ISCM steps are referred to as “process steps” in this publication and are:"
    statement: "4. Analyze ISCM Data and Report Findings (Analyze/Report) – Analyze the data collected, report findings, and determine the appropriate response. It may be necessary to collect additional information to clarify or supplement existing monitoring data."
    status: "candidate"
  - id: "REQ-SP800-137A-0055"
    citation: {"ref": "SP800-137A", "page": 19, "anchor": "Respond to ISCM Findings (Respond) – Respond to findings with technical, management,"}
    kind: "lettered"
    locator: "2.1.2.5"
    context: "ISCM Process Steps The six ISCM steps are referred to as “process steps” in this publication and are:"
    statement: "5. Respond to ISCM Findings (Respond) – Respond to findings with technical, management, and operational risk-mitigating activities, or accept, transfer/share, or avoid/reject the risk."
    status: "candidate"
  - id: "REQ-SP800-137A-0056"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "Review and Update ISCM Program and Strategy (Review/Update) – Review and update"}
    kind: "lettered"
    locator: "2.1.2.6"
    context: "ISCM Process Steps The six ISCM steps are referred to as “process steps” in this publication and are:"
    statement: "6. Review and Update ISCM Program and Strategy (Review/Update) – Review and update the monitoring program, adjust the ISCM strategy at the applicable level, and mature measurement capabilities to increase visibility into assets and awareness of vulnerabilities, further enable data-driven control of the security of an organization’s information infrastructure, and increase organizational resilience."
    status: "candidate"
  - id: "REQ-SP800-137A-0057"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "The organization-wide, system-level, and optional mission/business process ISCM strategies are defined in"}
    kind: "indicative"
    locator: "2.1.2.6"
    context: "ISCM Process Steps The six ISCM steps are referred to as “process steps” in this publication and are:"
    statement: "The organization-wide, system-level, and optional mission/business process ISCM strategies are defined in the ISCM Define step. The organization-wide and optional mission/business process ISCM strategies are addressed in the RMF Prepare step for Level 1 and Level 2, and the system-level ISCM strategy is addressed in the RMF Select step for Level 3 (see [SP800-37]).10"
    status: "candidate"
  - id: "REQ-SP800-137A-0058"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "Level 1 (organization level) addresses risk across the entire organization and informs"}
    kind: "lettered"
    locator: "2.1.3.•"
    context: "Organization-Wide Risk Management Levels ISCM applies to all three organizational risk management levels11 defined in [SP800-39]:"
    statement: "• Level 1 (organization level) addresses risk across the entire organization and informs Levels 2 and 3 of risk context and risk decisions made at Level 1."
    status: "not-a-requirement"
    reason: "Defines Level 1: 'addresses risk across the entire organization'. A definition from SP 800-39."
  - id: "REQ-SP800-137A-0059"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "Level 2 (mission or business process level) addresses risk from a mission/business"}
    kind: "lettered"
    locator: "2.1.3.•"
    context: "Organization-Wide Risk Management Levels ISCM applies to all three organizational risk management levels11 defined in [SP800-39]:"
    statement: "• Level 2 (mission or business process level) addresses risk from a mission/business process perspective and is informed by risk context, risk decisions, and risk activities at Level 1."
    status: "not-a-requirement"
    reason: "Defines Level 2: 'addresses risk from a mission/business process perspective'."
  - id: "REQ-SP800-137A-0060"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "Level 3 (system level) is the system-oriented level within the organization. Level"}
    kind: "lettered"
    locator: "2.1.3.•"
    context: "Organization-Wide Risk Management Levels ISCM applies to all three organizational risk management levels11 defined in [SP800-39]:"
    statement: "• Level 3 (system level) is the system-oriented level within the organization. Level 3 focuses on system activity and is guided by the risk context, decisions, and activities at Level 1 and Level 2."
    status: "not-a-requirement"
    reason: "Defines Level 3: 'is the system-oriented level within the organization'."
  - id: "REQ-SP800-137A-0061"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "The RMF, defined by [SP800-37], is a disciplined and structured process that"}
    kind: "indicative"
    locator: "2.1.4"
    context: "NIST Risk Management Framework and ISCM"
    statement: "The RMF, defined by [SP800-37], is a disciplined and structured process that integrates information security and risk management activities into the system development life cycle for organizations and systems. Implementation of the ISCM program may rely on artifacts and processes implemented as part of the RMF and also provides input to the RMF steps to understand and manage risk. The assessment approach and assessment elements address any potential overlap and/or relationships."
    status: "not-a-requirement"
    reason: "'The RMF ... is a disciplined and structured process' and 'may rely on artifacts'; describes the relationship of ISCM to the RMF."
  - id: "REQ-SP800-137A-0062"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "The term “Level” is adapted from NIST [SP800-39]. Level 1 addresses risk"}
    kind: "modal"
    locator: "2.1.4"
    context: "NIST Risk Management Framework and ISCM"
    statement: "The term “Level” is adapted from NIST [SP800-39]. Level 1 addresses risk from an organizational perspective by establishing and implementing governance structures that are consistent with the strategic goals and objectives of organizations and the requirements defined by federal laws, directives, policies, regulations, standards, and missions/business functions. In this publication, Level 1 pertains to the personnel responsible for the overall risk strategy, policies, and procedures of the entire organization. Level 2 addresses risk from a mission/business process perspective by designing, developing, and implementing mission/business processes that support the missions/business functions defined at Level 1. In this publication, Level 2 pertains to the personnel responsible for the mission or business process ISCM strategy, policies, and procedures of a sub-organization related to a specific mission or business process (but not the entire organization). The risk management activities at Level 3 reflect the organization’s risk management strategy and any risk related to the cost, schedule, and performance requirements for individual systems supporting the mission/business functions of organizations. In this publication, Level 3 pertains to the personnel responsible for implementing ISCM for specific systems."
    status: "not-a-requirement"
    reason: "Footnotes 10 and 11 defining the levels: 'personnel responsible for the overall risk strategy' says who a level pertains to, so responsible for assigns nothing and binds no one."
  - id: "REQ-SP800-137A-0063"
    citation: {"ref": "SP800-137A", "page": 20, "anchor": "NIST SP 800-37 Revision 2 renames tiers to levels. In a forthcoming"}
    kind: "modal"
    locator: "2.1.4"
    context: "NIST Risk Management Framework and ISCM"
    statement: "NIST SP 800-37 Revision 2 renames tiers to levels. In a forthcoming update to NIST SP 800-39, the term tiers will also be updated to levels."
    status: "not-a-requirement"
    reason: "Footnote on terminology: 'the term tiers will also be updated to levels' predicts an edit to SP 800-39; will here is a forecast and binds no one."
  - id: "REQ-SP800-137A-0064"
    citation: {"ref": "SP800-137A", "page": 21, "anchor": "The RMF Monitor step describes continuous monitoring, which is a critical part"}
    kind: "modal"
    locator: "2.1.4"
    context: "NIST Risk Management Framework and ISCM"
    statement: "The RMF Monitor step describes continuous monitoring, which is a critical part of the risk management process. Organizational continuous monitoring requirements can be met through implementation of ISCM, and ISCM can provide results that used in the identification of and risk response. In addition, an organization’s overall security architecture and accompanying security program are monitored through ISCM to ensure that organization-wide operations remain within an acceptable level of risk, despite any changes that occur. Timely, relevant, and accurate security-related information is vital, particularly when resources are limited and organizations must prioritize their efforts."
    status: "not-a-requirement"
    reason: "Describes the Monitor step and why information matters; 'organizations must prioritize their efforts' is a circumstance of limited resources, so must imposes no duty and binds no one."
  - id: "REQ-SP800-137A-0065"
    citation: {"ref": "SP800-137A", "page": 21, "anchor": "At Level 3, the RMF Monitor step and ISCM activities are closely"}
    kind: "indicative"
    locator: "2.1.4"
    context: "NIST Risk Management Framework and ISCM"
    statement: "At Level 3, the RMF Monitor step and ISCM activities are closely aligned. The assessment methods relevant for implemented controls are the same, whether the assessments are performed solely in support of system authorization (the RMF Authorize step) or in support of a broader, more comprehensive continuous monitoring effort. System-level officials and staff conduct assessments and monitoring, analyzing results on an ongoing basis. The information obtained is leveraged at the organization, mission/business processes, and system levels to support risk management."
    status: "candidate"
  - id: "REQ-SP800-137A-0066"
    citation: {"ref": "SP800-137A", "page": 21, "anchor": "Although frequency requirements may differ, each organizational level receives the benefit of"}
    kind: "indicative"
    locator: "2.1.4"
    context: "NIST Risk Management Framework and ISCM"
    statement: "Although frequency requirements may differ, each organizational level receives the benefit of security-related information that is current and applicable to affected processes. RMF Monitor activities that are performed within the context of the ISCM program and support system risk determination on an ongoing basis are foundational for ongoing authorization (OA). When the ISCM program is found to be adequate for determining risk across all (or part) of the organization, ISCM supports OA across all (or part) of the organization. The ISCM program assessment verifies that applicable ISCM results, which may include relevant metrics, are made available to the OA process to make decisions about system authorization. OA is discussed in Section 2.1.7."
    status: "candidate"
  - id: "REQ-SP800-137A-0067"
    citation: {"ref": "SP800-137A", "page": 21, "anchor": "ISCM governance is part of overall organizational governance, which provides oversight to"}
    kind: "modal"
    locator: "2.1.5"
    context: "Governance and ISCM"
    statement: "ISCM governance is part of overall organizational governance, which provides oversight to organizations by specifying authorities, responsibilities, accountability, and governing processes and procedures that facilitate implementation, enforcement, and continuous improvement of the ISCM governing processes. Governance, including ISCM governance, establishes lines of accountability throughout the organization at all risk-management levels."
    status: "not-a-requirement"
    reason: "Describes governance in general: 'specifying authorities, responsibilities, accountability' and 'establishes lines of accountability' say what governance is, so neither word binds anyone. The checkable duty is the promoted REQ-SP800-137A-0354."
  - id: "REQ-SP800-137A-0068"
    citation: {"ref": "SP800-137A", "page": 22, "anchor": "Where the organization has decentralized governance (e.g., because of divergent mission or"}
    kind: "indicative"
    locator: "2.1.5"
    context: "Governance and ISCM"
    statement: "Where the organization has decentralized governance (e.g., because of divergent mission or business needs or operating environments), mission/business process areas (Level 2)—while remaining consistent with the organization-wide ISCM strategy—may establish their own ISCM policies and processes, in whole or in part, particularly as they relate to risk management and information security decisions. With the decentralized governance model, it is important that the different levels of the organization share ISCM information as it relates to risk management decisions."
    status: "not-a-requirement"
    reason: "'mission/business process areas ... may establish their own ISCM policies' is an option for decentralized organizations, and 'it is important that' levels share is advice restated as a duty by REQ-SP800-137A-0353."
  - id: "REQ-SP800-137A-0069"
    citation: {"ref": "SP800-137A", "page": 22, "anchor": "Metrics determined through ISCM provide important information about the security posture across"}
    kind: "indicative"
    locator: "2.1.6"
    context: "ISCM Metrics"
    statement: "Metrics determined through ISCM provide important information about the security posture across the organization and relative to individual systems and inform the risk management process. See [SP800-137] for more information on ISCM metrics.12"
    status: "not-a-requirement"
    reason: "'Metrics determined through ISCM provide important information'; says why metrics matter and points to SP 800-137."
  - id: "REQ-SP800-137A-0070"
    citation: {"ref": "SP800-137A", "page": 22, "anchor": "The ISCM program assessment accommodates organization-defined metrics. The ISCM program assessment verifies"}
    kind: "indicative"
    locator: "2.1.6"
    context: "ISCM Metrics"
    statement: "The ISCM program assessment accommodates organization-defined metrics. The ISCM program assessment verifies that the ISCM program addresses the specification, development, maintenance, and sustainment of metrics. The ISCM program assessment also verifies that the organization: (i) specifies frequencies of collecting metrics data; (ii) determines metrics from data at Levels 1, 2, and 3; and (iii) applies the metrics as needed to make risk-based decisions. In addition, the ISCM program assessment verifies that ISCM metrics are reported to designated officials at each level who review the relevant metrics."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137A-0071"
    citation: {"ref": "SP800-137A", "page": 22, "anchor": "ISCM benefits the organization by facilitating OA, which streamlines the system authorization"}
    kind: "modal"
    locator: "2.1.7"
    context: "Ongoing Authorization"
    statement: "ISCM benefits the organization by facilitating OA, which streamlines the system authorization process and supports a more automated ability to make near real-time risk-based decisions on whether to continue system authorization. OA is defined as the subsequent (follow-on) risk determinations and risk acceptance decisions taken at agreed-upon and documented frequencies in accordance with the organization’s mission/business requirements and organizational risk tolerance. OA is fundamentally related to the ongoing understanding and acceptance of security risk and is dependent on a robust ISCM program."
    status: "not-a-requirement"
    reason: "'OA is defined as the subsequent ... risk determinations' is a definition; in accordance with sits inside it, so it binds no one. M-6 and WI-06 carry the duty."
  - id: "REQ-SP800-137A-0072"
    citation: {"ref": "SP800-137A", "page": 22, "anchor": "Organizations make OA decisions for systems by leveraging security-related information gathered through"}
    kind: "indicative"
    locator: "2.1.7"
    context: "Ongoing Authorization"
    statement: "Organizations make OA decisions for systems by leveraging security-related information gathered through the ISCM capability. A robust ISCM program defines, establishes, and implements a continuous process by which manual, automated, and procedural tools can be used to manage and govern the risks of operating authorized systems."
    status: "candidate"
  - id: "REQ-SP800-137A-0073"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "There is an organization-wide process for OA. The OA process addresses how"}
    kind: "lettered"
    locator: "2.1.7.•"
    context: "Ongoing Authorization"
    statement: "• There is an organization-wide process for OA. The OA process addresses how systems transition into OA status as well as the conditions necessary for a system to remain in OA status."
    status: "candidate"
  - id: "REQ-SP800-137A-0074"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "Control assessments (in accordance with NIST SP 800-53A) are conducted at a"}
    kind: "lettered"
    locator: "2.1.7.•"
    context: "Ongoing Authorization"
    statement: "• Control assessments (in accordance with NIST SP 800-53A) are conducted at a documented frequency sufficient to support OA."
    status: "candidate"
  - id: "REQ-SP800-137A-0075"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "The metrics provided by the ISCM program are considered sufficiently stable and"}
    kind: "lettered"
    locator: "2.1.7.•"
    context: "Ongoing Authorization"
    statement: "• The metrics provided by the ISCM program are considered sufficiently stable and robust for informing OA decisions."
    status: "candidate"
    work_item: "WI-15"
  - id: "REQ-SP800-137A-0076"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "The ISCM program monitors the security status of systems and the environments"}
    kind: "lettered"
    locator: "2.1.7.•"
    context: "Ongoing Authorization"
    statement: "• The ISCM program monitors the security status of systems and the environments in which those systems operate on an ongoing basis with a frequency sufficient to make ongoing, risk-based decisions on whether to continue to operate the systems within the organization."
    status: "candidate"
  - id: "REQ-SP800-137A-0077"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "ISCM results are reported to appropriate officials who make ongoing authorization decisions."}
    kind: "lettered"
    locator: "2.1.7.•"
    context: "Ongoing Authorization"
    statement: "• ISCM results are reported to appropriate officials who make ongoing authorization decisions."
    status: "candidate"
  - id: "REQ-SP800-137A-0078"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "Identify specific opportunities for improvement in the organization’s ISCM program, including the"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Foundation of ISCM Program Assessments The information gathered and evidence examined can be used by an organization to:"
    statement: "• Identify specific opportunities for improvement in the organization’s ISCM program, including the ISCM strategies;"
    status: "not-a-requirement"
    reason: "Item of 'the information gathered ... can be used by an organization to:'. 'Identify specific opportunities for improvement' is one possible use, not a duty."
  - id: "REQ-SP800-137A-0079"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "Identify the level of understanding within the organization’s leadership or staff of"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Foundation of ISCM Program Assessments The information gathered and evidence examined can be used by an organization to:"
    statement: "• Identify the level of understanding within the organization’s leadership or staff of what the ISCM program is and where it fits in the risk management process;"
    status: "not-a-requirement"
    reason: "Item of the same 'can be used' list; 'Identify the level of understanding within the organization's leadership' is a possible use."
  - id: "REQ-SP800-137A-0080"
    citation: {"ref": "SP800-137A", "page": 23, "anchor": "Identify the level of understanding of how the ISCM program applies to"}
    kind: "lettered"
    locator: "2.2.•"
    context: "Foundation of ISCM Program Assessments The information gathered and evidence examined can be used by an organization to:"
    statement: "• Identify the level of understanding of how the ISCM program applies to each organizational level and how ISCM functionality is integrated across the entire organization;"
    status: "not-a-requirement"
    reason: "Item of the same 'can be used' list; 'Identify the level of understanding of how the ISCM program applies to each organizational level' is a possible use."
