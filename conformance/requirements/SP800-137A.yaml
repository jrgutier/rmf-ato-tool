  - id: "REQ-SP800-137A-0276"
    citation: {"ref": "SP800-137A", "page": 49, "anchor": "As the ISCM program assessment engagement progresses, the assessors review artifacts, interview"}
    kind: "indicative"
    locator: "3.2.2.2"
    context: "Evidence Analysis"
    statement: "As the ISCM program assessment engagement progresses, the assessors review artifacts, interview staff, and analyze the information gathered. Each day may end with a short discussion with the appropriate organization contacts to clarify and confirm any findings, ask any further questions, and confirm activities for the following day."
