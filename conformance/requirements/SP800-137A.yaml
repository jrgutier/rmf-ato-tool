    context: "ISCM Program Assessment Process Steps There are three steps in the ISCM program assessment process:"
    statement: "Each ISCM program assessment engagement is tailored based on the needs of the organization and the applicable assessment elements. The ISCM program assessment may be a self-assessment or a third-party assessment, as explained in Section 2.3.1. Figure 4 illustrates the activities within each of the three major engagement steps of the ISCM program assessment."
