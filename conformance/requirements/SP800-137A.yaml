  - id: "REQ-SP800-137A-0168"
    citation: {"ref": "SP800-137A", "page": 35, "anchor": "An assessment element score can optionally be multiplied by a weighting factor,"}
    kind: "should"
    locator: "2.2.10"
    context: "Scoring"
    statement: "An assessment element score can optionally be multiplied by a weighting factor, which is a numerical value that results in a higher score for that assessment element. Different weights can be assigned to different assessment elements based on the criticality of a given element to an organization. In other words, an organization may create a scheme of weight assignments (i.e., multiple weight factors for multiple priorities of differing importance). Section 2.2.11 explains factors that may affect the criticality of an assessment element."
    status: "not-a-requirement"
    reason: "'can optionally be multiplied by a weighting factor' and 'an organization may create a scheme'; options on an optional score."
