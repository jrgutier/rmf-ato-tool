  - id: "REQ-SP800-137A-0201"
    citation: {"ref": "SP800-137A", "page": 40, "anchor": "A successful ISCM program assessment requires consideration of the needs of all"}
    kind: "modal"
    locator: "3.1"
    context: "Overview of the ISCM Program Assessment Process"
    statement: "A successful ISCM program assessment requires consideration of the needs of all parties with a vested interest in the organization’s ISCM capability, including system owners, authorizing officials, chief information officers, chief information security officers, senior agency officials for privacy/chief privacy officers, chief executive officers/heads of agencies, security and privacy staff, Inspectors General or other auditing bodies, the RE(f), and the senior accountable official for risk management. Establishing an appropriate set of expectations before, during, and after an assessment is paramount to achieving an acceptable outcome—that is, producing information necessary to help the organization’s leadership make an informed decision about whether the ISCM program is adequate to meet the organization’s needs. The decision may impact authorization decisions to place systems into operation or continue operation (ongoing authorization). Figure 7 shows the overall process, and details are described in subsequent sections."
    status: "candidate"
  - id: "REQ-SP800-137A-0202"
    citation: {"ref": "SP800-137A", "page": 40, "anchor": "The ISCM program assessment developed under guidance of this publication evaluates the"}
    kind: "modal"
    locator: "3.1"
    context: "Overview of the ISCM Program Assessment Process"
    statement: "The ISCM program assessment developed under guidance of this publication evaluates the ISCM program itself, not the results of the operational ISCM program. The ISCM program assessment does not have the objectives of: (i) retesting security control effectiveness or operational procedures, (ii) evaluating ISCM implementations, or (iii) validating specific outputs of the ISCM program. The ISCM program assessment does not generally review results of individual control assessments but rather verifies that control assessments are performed in accordance with the ISCM strategy at the organization-specified frequencies for all parts of the organization under assessment."
    status: "not-a-requirement"
    reason: "States the scope of the assessment: 'evaluates the ISCM program itself, not the results' and 'does not have the objectives of'. 'in accordance with the ISCM strategy' only names what is checked and binds no one; that duty is REQ-SP800-137A-0074."
  - id: "REQ-SP800-137A-0203"
    citation: {"ref": "SP800-137A", "page": 40, "anchor": "Repeatability of the ISCM program assessment process is a desirable property to"}
    kind: "should"
    locator: "3.1"
    context: "Overview of the ISCM Program Assessment Process"
    statement: "Repeatability of the ISCM program assessment process is a desirable property to help ensure consistency in results. The guidance in this publication, through the use of the ISCM program assessment elements described in Section 3.3, helps to ensure repeatability in conducting assessments by providing assessor guidance on potential assessment objects to examine, what to look for during the examination, the assessment objective for evaluating each individual assessment element, and the personnel roles to interview. In addition, the discussion attribute of the each ISCM assessment element provides guidance on how to make judgments about assessment elements and may specify the valid judgment values that the assessor can select."
    status: "not-a-requirement"
    reason: "'Repeatability ... is a desirable property' and the discussion attribute 'may specify the valid judgment values'; says what the publication does to help, with no one bound."
