  - id: "REQ-SP800-137A-0277"
    citation: {"ref": "SP800-137A", "page": 50, "anchor": "System-level ISCM program assessments can be conducted by or supported by system"}
    kind: "indicative"
    locator: "3.2.2.2"
    context: "Evidence Analysis"
    statement: "System-level ISCM program assessments can be conducted by or supported by system developers, system integrators, security control assessors, system auditors, system owners, the security staffs of organizations, and AOs and AO staff. The ISCM program assessors bring together available information about each system under review. If necessary, assessors conduct enhanced, system-level assessments by modifying assessment procedures and methods within the assessment element to collect additional or unique information about systems with respect to the ISCM program."
    status: "not-applicable"
    reason: "Binds assessors: 'assessors bring together available information about each system' and 'conduct enhanced, system-level assessments'. Run roles (SCA, PM, AO) are named as possible helpers with 'can', but no run task holds a system-level ISCM program assessment."
  - id: "REQ-SP800-137A-0278"
    citation: {"ref": "SP800-137A", "page": 51, "anchor": "During the Report Step of an engagement, assessors create a draft report"}
    kind: "indicative"
    locator: "3.2.3"
    context: "Report Step"
    statement: "During the Report Step of an engagement, assessors create a draft report of the assessment findings. ISCM program assessment conclusions are manually made by the assessors based on the analyzed information. Assessors make recommendations for improving ISCM programs based on the conclusions from the ISCM program assessment, as may be documented in the annotations for assessment judgments that are not Satisfied (or True). The assessment process produces qualitative results and recommendations to assist the organization in focusing subsequent efforts to improve the ISCM program. The organization is given a draft report of findings and recommendations. The draft report is reviewed by organizational leadership, including the executive sponsor, to correct any errors and to clarify misunderstandings or ambiguities. Based on feedback from the organization, the assessor produces an updated, final report. The ISCM program assessment report is described in Section 2.2.12."
    status: "candidate"
  - id: "REQ-SP800-137A-0279"
    citation: {"ref": "SP800-137A", "page": 51, "anchor": "The organization is accountable for responding to ISCM program assessment findings. The"}
    kind: "modal"
    locator: "3.2.3.1"
    context: "Post Assessment Response (Follow-on Actions)"
    statement: "The organization is accountable for responding to ISCM program assessment findings. The organization analyzes the findings in the ISCM program assessment final report, determines the appropriate responses, prioritizes response actions in accordance with organizational risk tolerance, and assigns the role(s) responsible for executing response actions and a time frame for completion. Planned response actions may be documented in system-, mission/business process-, or organization-level plans of action and milestones or in an organization-defined format. ISCM program-related documents (e.g., ISCM strategies, policies, etc.) are also updated to reflect any changes resulting from findings and organizational response to findings. Organizations may also validate completed response actions by having the related ISCM program assessment element(s) reassessed."
    status: "candidate"
  - id: "REQ-SP800-137A-0280"
    citation: {"ref": "SP800-137A", "page": 52, "anchor": "The ISCM program assessment element defines the evaluation criteria applied to each"}
    kind: "indicative"
    locator: "3.3"
    context: "ISCM Program Assessment Elements"
    statement: "The ISCM program assessment element defines the evaluation criteria applied to each aspect of the ISCM program being assessed. In order to determine if an ISCM program assessment element is Satisfied, assessors use the associated assessment procedure to obtain and review evidence. The assessment procedures apply to the same organizational levels as the assessment elements."
    status: "candidate"
  - id: "REQ-SP800-137A-0281"
    citation: {"ref": "SP800-137A", "page": 52, "anchor": "Identifier. A string that uniquely identifies the assessment element and indicates the"}
    kind: "lettered"
    locator: "3.3.1.•"
    context: "Assessment Element Information Fields"
    statement: "• Identifier. A string that uniquely identifies the assessment element and indicates the ISCM step number (see Section 2.1.2) and a sequence number."
    status: "candidate"
  - id: "REQ-SP800-137A-0282"
    citation: {"ref": "SP800-137A", "page": 52, "anchor": "Assessment Element Text. Defines the evaluation criteria applied to an aspect of"}
    kind: "lettered"
    locator: "3.3.1.•"
    context: "Assessment Element Information Fields"
    statement: "• Assessment Element Text. Defines the evaluation criteria applied to an aspect of the ISCM program being assessed. The text of the assessment element is a statement with which the assessor determines whether, or how well, the objective has been met."
    status: "candidate"
  - id: "REQ-SP800-137A-0283"
    citation: {"ref": "SP800-137A", "page": 52, "anchor": "Level. The applicable organizational risk management level(s) defined in [SP800-39]. See Section"}
    kind: "lettered"
    locator: "3.3.1.•"
    context: "Assessment Element Information Fields"
    statement: "• Level. The applicable organizational risk management level(s) defined in [SP800-39]. See Section 2.1.3 for more information about applying the ISCM assessment element to organizational risk management levels)."
    status: "candidate"
  - id: "REQ-SP800-137A-0284"
    citation: {"ref": "SP800-137A", "page": 52, "anchor": "Source. Authoritative publications or practices from which the ISCM program assessment elements"}
    kind: "lettered"
    locator: "3.3.1.•"
    context: "Assessment Element Information Fields"
    statement: "• Source. Authoritative publications or practices from which the ISCM program assessment elements are derived."
    status: "candidate"
  - id: "REQ-SP800-137A-0285"
    citation: {"ref": "SP800-137A", "page": 52, "anchor": "Assessment Procedure. The assessment procedure is a multi-part attribute that specifies a"}
    kind: "lettered"
    locator: "3.3.1.•"
    context: "Assessment Element Information Fields"
    statement: "• Assessment Procedure. The assessment procedure is a multi-part attribute that specifies a set of actions to be carried out on evidence gathered by the assessor to determine if an assessment objective has been met. Each assessment procedure consists of (i) an assessment objective, (ii) a set of potential assessment methods, and (iii) assessment objects that are used to conduct the ISCM program assessment as follows:"
    status: "candidate"
  - id: "REQ-SP800-137A-0286"
    citation: {"ref": "SP800-137A", "page": 53, "anchor": "Potential Assessment Methods and Objects. The assessment procedure contains a specification of"}
    kind: "indicative"
    locator: "3.3.1"
    context: "Assessment Element Information Fields"
    statement: "Potential Assessment Methods and Objects. The assessment procedure contains a specification of the suggested assessment methods and the objects to which the methods are applied. The assessment method defines the nature and extent of the assessor’s actions. The potential assessment methods relevant to ISCM program assessment are:"
    status: "candidate"
  - id: "REQ-SP800-137A-0287"
    citation: {"ref": "SP800-137A", "page": 53, "anchor": "Examine: The process of reviewing, inspecting, observing, studying, or analyzing one or"}
