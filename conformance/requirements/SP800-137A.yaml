  - id: "REQ-SP800-137A-0087"
    citation: {"ref": "SP800-137A", "page": 24, "anchor": "The ISCM program assessment leverages the control assessment process performed on common"}
    kind: "should"
    locator: "2.2"
    context: "Foundation of ISCM Program Assessments"
    statement: "The ISCM program assessment leverages the control assessment process performed on common controls, hybrid controls, and system-specific controls. The organization is evaluated on whether it has implemented the control assessment process. This publication does not prescribe the assessment of individual controls nor the examination of control assessment results as part of the ISCM program assessment. Organizations may incorporate additional assessment elements to evaluate the assessment of individual controls or the control assessment process, if desired, as part of the ISCM program assessment tailoring process. The rest of this section explains the components of the ISCM program assessment."
    status: "not-a-requirement"
    reason: "Scope of the assessment: 'This publication does not prescribe the assessment of individual controls', and 'Organizations may incorporate additional assessment elements' is an option; 'leverages' describes the method."
