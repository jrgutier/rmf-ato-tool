    status: "not-a-requirement"
    reason: "Footnote 18 on an optional catalog column: 'Organizations are encouraged to review the Criticality designation' in accordance with organizational risk; encouraged, and the column serves only optional scoring, so it binds no one."
  - id: "REQ-SP800-137A-0179"
