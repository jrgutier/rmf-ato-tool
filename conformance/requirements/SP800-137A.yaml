  - id: "REQ-SP800-137A-0012"
    citation: {"ref": "SP800-137A", "page": 12, "anchor": "This publication, NIST SP 800-137A, provides guidance on how an organization can"}
    kind: "indicative"
    locator: "1 Introduction"
    context: "To effectively address increasing security challenges, the ISCM program:"
    statement: "This publication, NIST SP 800-137A, provides guidance on how an organization can assess ISCM program completeness and effectiveness, and detect deficiencies in its ISCM program. The goal of the ISCM program assessment is to provide a means for evaluating organizational ISCM program elements, including the review of ISCM strategies, policies, procedures, implementation planning, ISCM metrics, analytical processes, specific results presentation and reporting, risk response, and the ISCM improvement process. The approach used throughout this publication is based on the concepts and principles of [SP800-137] and the ISCM requirements mandated for federal organizations."
    status: "not-a-requirement"
    reason: "'This publication ... provides guidance' and the goal of the assessment; a description of the document and its basis."
  - id: "REQ-SP800-137A-0013"
    citation: {"ref": "SP800-137A", "page": 12, "anchor": "The term assessment is used in two ways in this publication. Assessment"}
    kind: "indicative"
    locator: "1 Introduction"
    context: ""
    statement: "The term assessment is used in two ways in this publication. Assessment may refer to the completed action of ISCM program evaluation or to the vehicle that is reused for each evaluation (e.g., a template or blank worksheet). The context in which the term is used conveys the applicable meaning."
    status: "not-a-requirement"
    reason: "Says the term assessment 'is used in two ways'; a note on terminology."
  - id: "REQ-SP800-137A-0014"
    citation: {"ref": "SP800-137A", "page": 12, "anchor": "OMB Circular A-130 (2016) [OMB A-130] and OMB Memorandum M-11-33 [OMB M-11-33]"}
    kind: "modal"
    locator: "1 Introduction"
    context: ""
    statement: "OMB Circular A-130 (2016) [OMB A-130] and OMB Memorandum M-11-33 [OMB M-11-33] are the primary directives. OMB M-11-33 requires that the ISCM program be periodically reviewed to ensure that continuous monitoring is adequate for supporting risk-based decisions. OMB Circular A-130 reiterates and formalizes the Memoranda requirements."
    status: "candidate"
  - id: "REQ-SP800-137A-0015"
    citation: {"ref": "SP800-137A", "page": 13, "anchor": "Organizations face the continual challenge of providing timely and complete security information"}
    kind: "modal"
    locator: "1.1"
    context: "Background"
    statement: "Organizations face the continual challenge of providing timely and complete security information with which to make risk-based management decisions, which is the objective of the ISCM program. An effective ISCM program produces timely, security-related information that is accurate and complete for presentation to decision makers at multiple levels of the organization. At the organizational level, it may not be well understood how, where, or why the ISCM program fits into the organization-wide risk management strategy. It is crucial for the organization’s leadership to understand how business needs and capabilities drive the ISCM program. In many cases, capabilities needed for organizational continuous monitoring may already exist within the organization. However, without a comprehensive strategy to formally codify monitoring capabilities as enabling ISCM functions, a true ISCM program does not exist."
    status: "not-a-requirement"
    reason: "Background on why programs fall short: 'it may not be well understood' is an observation, so may not forbids nothing here and binds no one; 'it is crucial' for leadership to understand names no act."
  - id: "REQ-SP800-137A-0016"
    citation: {"ref": "SP800-137A", "page": 13, "anchor": "Organizations need a method for evaluating what has been planned, developed, or"}
    kind: "indicative"
    locator: "1.1"
    context: "Background"
    statement: "Organizations need a method for evaluating what has been planned, developed, or acquired to implement ISCM, particularly if the ISCM program is developed internally. This helps determine whether the organization’s ISCM program is adequate and if the investment is providing value."
    status: "not-a-requirement"
    reason: "'Organizations need a method for evaluating' motivates the document; the duty to develop and use the assessment is stated in REQ-SP800-137A-0017."
  - id: "REQ-SP800-137A-0017"
    citation: {"ref": "SP800-137A", "page": 13, "anchor": "To determine the effectiveness of an organization’s ISCM program, the organization develops"}
    kind: "indicative"
    locator: "1.1"
    context: "Background"
    statement: "To determine the effectiveness of an organization’s ISCM program, the organization develops and uses a formal assessment for evaluation that provides organizational leadership with information about how well the ISCM program meets its intended objectives. An ISCM program assessment may be comprised of evaluation criteria, judgments, and scores about specific aspects of ISCM capabilities as well as conclusions based on an analysis of the collected data. An ISCM program assessment may also provide recommendations to the organization based on assessment results."
    status: "candidate"
  - id: "REQ-SP800-137A-0018"
    citation: {"ref": "SP800-137A", "page": 13, "anchor": "conjunction with the National Cybersecurity Center of Excellence (NCCoE)5 at NIST, CISA"}
    kind: "table"
    locator: "1.1"
    context: "Background"
    statement: "conjunction with the National Cybersecurity Center of Excellence (NCCoE)5 at NIST, CISA initiated development of an ISCM program assessment process based primarily on [SP800- 137], published by the NIST Computer Security Division (CSD). The assessment process, which is presented in more detail in the forthcoming NIST Interagency or Internal Report (NISTIR) 8212 [NISTIR8212], was developed for use by CISA and federal agencies. The ISCM program assessment process can be tailored for use by federal agencies, commercial organizations, and non-federal governmental organizations. Using [NISTIR8212] as a guide, an organization may choose to adopt the same approach to evaluating ISCM plans and solutions to supplement the guidance in NIST SP 800-137A."
    status: "not-a-requirement"
    reason: "Boxed history of the CISA and NCCoE work and of NISTIR 8212; 'an organization may choose to adopt' the approach is an option."
