  - id: "REQ-SP800-137A-0165"
    citation: {"ref": "SP800-137A", "page": 35, "anchor": "Within an assessment, a score indicates how well the ISCM capability meets"}
    kind: "should"
    locator: "2.2.10"
    context: "Scoring"
    statement: "Within an assessment, a score indicates how well the ISCM capability meets its objectives and reflects risk to the organization. Judgments made using the assessment elements may be assigned a score, which is a numerical value representing the judgment that can then be used to calculate assessment results. Scores are assigned to each judgment value, and the resultant score for the organization is computed using the scores of each assessment element. In other words, the assessment score is the sum of all of the element judgment scores."
    status: "not-a-requirement"
    reason: "Describes scoring: 'may be assigned a score', and 0166 says 'Scoring is optional', so the rest of the paragraph binds only someone who opts in."
  - id: "REQ-SP800-137A-0166"
    citation: {"ref": "SP800-137A", "page": 35, "anchor": "The scores may facilitate informed decision-making by organizational leadership regarding the ISCM"}
    kind: "should"
    locator: "2.2.10"
    context: "Scoring"
    statement: "The scores may facilitate informed decision-making by organizational leadership regarding the ISCM program and where organizational resources can best be applied to improve the program to reduce risk. Scoring is optional and may be used with the binary and multi-gradation judgment types discussed in Section 2.2.7. Scoring may also be used to aggregate ISCM program assessment scores from across the organization into a single, summary score for the entire organization."
    status: "not-a-requirement"
    reason: "'The scores may facilitate' and 'Scoring is optional'; says so outright."
  - id: "REQ-SP800-137A-0167"
    citation: {"ref": "SP800-137A", "page": 35, "anchor": "0 | Other than Satisfied"}
    kind: "table"
