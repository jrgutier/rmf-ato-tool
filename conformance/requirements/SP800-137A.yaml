  - id: "REQ-SP800-137A-0001"
    citation: {"ref": "SP800-137A", "page": 6, "anchor": "To effectively manage cybersecurity risks, organizations require ongoing awareness of their information"}
    kind: "modal"
    locator: "Executive Summary"
    context: ""
    statement: "To effectively manage cybersecurity risks, organizations require ongoing awareness of their information security posture, vulnerabilities, and threats.1 To achieve this awareness and better manage risks, organizations implement Information Security Continuous Monitoring (ISCM) capabilities under the direction of an ISCM program. An ISCM program defines, establishes, implements, and operates the various aspects of ISCM to provide the organization with the information necessary to make risk-based decisions regarding security status at all organizational risk management levels (organization level, mission and business process level, and system level)."
    status: "not-a-requirement"
    reason: "Executive summary background: 'organizations require ongoing awareness' states a need for awareness, so require binds no one here. The implementing duty is the promoted REQ-SP800-137A-0351 in chapter 1."
  - id: "REQ-SP800-137A-0002"
    citation: {"ref": "SP800-137A", "page": 6, "anchor": "The overarching goal of the ISCM program assessment is to provide organizations"}
    kind: "should"
    locator: "Executive Summary"
    context: ""
    statement: "The overarching goal of the ISCM program assessment is to provide organizations with recommendations to improve the ISCM program and thereby manage and reduce organizational risk. An ISCM program assessment provides a means for evaluating an organization’s ISCM strategies, policies, procedures, implementations, operational procedures, analytical processes, specific reporting, results presentation, risk assessment and risk scoring, risk response, and the ISCM program improvement process. An ISCM program assessment may be developed by an organization to evaluate its own ISCM program or by an independent assessment organization."
    status: "not-a-requirement"
    reason: "States the goal of an assessment and what it provides; 'may be developed by an organization' is an option, not a duty on anyone."
  - id: "REQ-SP800-137A-0003"
    citation: {"ref": "SP800-137A", "page": 6, "anchor": "NIST SP 800-137, Information Security Continuous Monitoring (ISCM) for Federal Information Systems"}
    kind: "indicative"
    locator: "Executive Summary"
    context: ""
    statement: "NIST SP 800-137, Information Security Continuous Monitoring (ISCM) for Federal Information Systems and Organizations, defines ISCM as “maintaining ongoing awareness of information security, vulnerabilities, and threats to support organizational risk management decisions” [SP800-137, p. B-6]."
    status: "not-a-requirement"
    reason: "Footnote 1 quoting the SP 800-137 definition of ISCM; a definition with no actor."
