  - id: "REQ-SP800-137A-0032"
    citation: {"ref": "SP800-137A", "page": 15, "anchor": "There are many ways to evaluate an organizational program or system against"}
    kind: "should"
    locator: "1.4"
    context: "Scope"
    statement: "There are many ways to evaluate an organizational program or system against a set of criteria. This publication specifies one approach for developing assessments for doing so based on evaluation criteria derived from multiple sources. The ISCM program assessment evaluates the structure and governance of the ISCM program and does not evaluate the continuous monitoring technologies or implementations themselves. An assessment developed under the guidance provided herein is technology-neutral, flexible, and scalable to be easily adopted by any organization and applied to any type of security monitoring technology. Organizations are encouraged to use the approach specified in this publication as a starting point to develop an assessment to better meet specific organizational needs."
    status: "not-a-requirement"
    reason: "Scope text: 'this publication specifies one approach' and 'Organizations are encouraged to use the approach ... as a starting point'; encouraged offers a starting point and binds no one."
