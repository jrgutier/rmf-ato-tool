requirements:
  - id: "REQ-SP800-53B-0001"
    citation: {"ref": "SP800-53B", "page": 15, "anchor": "ecurity controls are the safeguards or countermeasures selected and implemented within an"}
    kind: "modal"
    locator: "INTRODUCTION"
    context: "THE NEED FOR SECURITY AND PRIVACY CONTROL BASELINES"
    statement: "ecurity controls are the safeguards or countermeasures selected and implemented within an information system1 or an organization to protect the confidentiality, integrity, and availability of the system and its information and to manage information security risk. Privacy controls are the administrative, technical, and physical safeguards employed within a system or an organization to ensure compliance with applicable privacy requirements and to manage privacy risks.2 Security and privacy controls are selected and implemented to satisfy the security and privacy requirements levied on an information system and/or organization. The requirements are derived from applicable laws, executive orders, directives, regulations, policies, standards, and mission needs to ensure the confidentiality, integrity, and availability of information processed, stored, or transmitted and to manage risks to individual privacy. The selection, design, and effective implementation of controls are important tasks that have significant implications for the operations and assets of organizations as well as the welfare of individuals and the Nation."
    status: "candidate"
  - id: "REQ-SP800-53B-0002"
    citation: {"ref": "SP800-53B", "page": 15, "anchor": "NIST Special Publication (SP) 800-37 [SP 800-37] defines two approaches for the"}
    kind: "indicative"
    locator: "INTRODUCTION"
    context: "THE NEED FOR SECURITY AND PRIVACY CONTROL BASELINES"
    statement: "NIST Special Publication (SP) 800-37 [SP 800-37] defines two approaches for the selection of security and privacy controls: a baseline control selection approach and an organization-generated control selection approach. The baseline control selection approach uses control baselines, which are predefined sets of controls specifically assembled to meet the protection needs of a group, organization, or community of interest. The control baselines serve as a starting point for the protection of individuals’ privacy, information, and information systems. The organization-generated control selection approach is not addressed in this publication."
    status: "candidate"
  - id: "REQ-SP800-53B-0003"
    citation: {"ref": "SP800-53B", "page": 15, "anchor": "This publication establishes security and privacy control baselines for federal information systems"}
    kind: "modal"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "This publication establishes security and privacy control baselines for federal information systems and organizations and provides tailoring guidance for those baselines. The control baselines can be implemented by any organization that processes, stores, or transmits information (e.g., federal, state, local, and tribal governments, as well as private sector organizations). Implementation of a minimum set of controls selected from NIST SP 800-53, Revision 5 [SP 800-53] is mandatory to protect federal information and information systems3 in accordance with the Office of Management and Budget (OMB) Circular A-130 [OMB A-130] and the provisions of the Federal Information Security Modernization Act4 [FISMA]. Whereas use of the privacy control baseline is not mandated by law or [OMB A-130], SP 800-53B—along with other supporting NIST publications—is designed to help organizations identify the security and privacy controls needed to manage risk and to satisfy the security and privacy requirements in FISMA, the Privacy Act of 1974 [PRIVACT], selected OMB policies (e.g., [OMB A-130]), and designated Federal Information Processing Standards (FIPS), among others."
    status: "candidate"
  - id: "REQ-SP800-53B-0004"
    citation: {"ref": "SP800-53B", "page": 15, "anchor": "Information systems that have been designated as national security systems (as defined"}
    kind: "indicative"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "Information systems that have been designated as national security systems (as defined in 44 U.S.C., Section 3542) are not subject to the requirements in [FISMA]. However, the controls established in this publication may be selected for national security systems as otherwise required (e.g., the Privacy Act of 1974) or with the approval of federal officials exercising policy authority over such systems. CNSS Policy No. 22 [CNSSP 22] and CNSS Instruction No. 1253 [CNSSI 1253] provide guidance for national security systems. DoD Instruction 8510.01 [DODI 8510.01] provides guidance for the Department of Defense."
    status: "candidate"
  - id: "REQ-SP800-53B-0005"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "This publication satisfies security and privacy requirements by applying assumptions that inform"}
    kind: "indicative"
    locator: "1.1"
    context: "PURPOSE AND APPLICABILITY"
    statement: "This publication satisfies security and privacy requirements by applying assumptions that inform the development of the security and privacy control baselines, as described in Section 2.3. The baselines serve as a starting point to meet the protection needs of organizations. The controls in the baselines are tailored following the process described in Section 2.4 to further facilitate the management of security and privacy risk specific to the organization. The tailoring process can be guided and informed by many factors, including organizational mission and business needs, stakeholder protection needs, and assessments of risk. The combination of control baseline selection and control tailoring processes can help organizations satisfy their stated security and privacy requirements."
    status: "candidate"
  - id: "REQ-SP800-53B-0006"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "Individuals with system, information security, privacy, or risk management and oversight responsibilities,"}
    kind: "lettered"
    locator: "1.2.•"
    context: "TARGET AUDIENCE This publication is intended to serve a diverse audience, including:"
    statement: "• Individuals with system, information security, privacy, or risk management and oversight responsibilities, including authorizing officials, chief information officers, senior agency information security officers, and senior agency officials for privacy"
    status: "candidate"
  - id: "REQ-SP800-53B-0007"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "Individuals with system development responsibilities, including mission owners, program managers, system engineers,"}
    kind: "lettered"
    locator: "1.2.•"
    context: "TARGET AUDIENCE This publication is intended to serve a diverse audience, including:"
    statement: "• Individuals with system development responsibilities, including mission owners, program managers, system engineers, system security engineers, privacy engineers, hardware and software developers, system integrators, and acquisition or procurement officials"
    status: "candidate"
  - id: "REQ-SP800-53B-0008"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "Individuals with logistical or disposition-related responsibilities, including program managers, procurement officials, system"}
    kind: "lettered"
    locator: "1.2.•"
    context: "TARGET AUDIENCE This publication is intended to serve a diverse audience, including:"
    statement: "• Individuals with logistical or disposition-related responsibilities, including program managers, procurement officials, system integrators, and property managers"
    status: "candidate"
  - id: "REQ-SP800-53B-0009"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "Individuals with security and privacy implementation and operations responsibilities, including mission or"}
    kind: "lettered"
    locator: "1.2.•"
    context: "TARGET AUDIENCE This publication is intended to serve a diverse audience, including:"
    statement: "• Individuals with security and privacy implementation and operations responsibilities, including mission or business owners, system owners, information owners or stewards, system administrators, and system security or privacy officers"
    status: "candidate"
  - id: "REQ-SP800-53B-0010"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "Individuals with security and privacy assessment and monitoring responsibilities, including auditors, Inspectors"}
    kind: "lettered"
    locator: "1.2.•"
    context: "TARGET AUDIENCE This publication is intended to serve a diverse audience, including:"
    statement: "• Individuals with security and privacy assessment and monitoring responsibilities, including auditors, Inspectors General, system evaluators, control assessors, independent verifiers and validators, and analysts"
    status: "candidate"
  - id: "REQ-SP800-53B-0011"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "Commercial entities, including industry partners, who produce component products and systems and"}
    kind: "lettered"
    locator: "1.2.•"
    context: "TARGET AUDIENCE This publication is intended to serve a diverse audience, including:"
    statement: "• Commercial entities, including industry partners, who produce component products and systems and develop security and privacy technologies"
    status: "candidate"
  - id: "REQ-SP800-53B-0012"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "Organizations have the responsibility to choose a control selection approach in accordance"}
    kind: "modal"
    locator: "1.3"
    context: "ORGANIZATIONAL RESPONSIBILITIES"
    statement: "Organizations have the responsibility to choose a control selection approach in accordance with [SP 800-37].5 If the baseline control selection approach is chosen, organizations select a security control baseline and privacy control baseline as described in Chapter Three. Once the control baseline is selected, organizations apply the tailoring guidance provided in Chapter Two to help ensure that the resulting controls are necessary and sufficient to manage security risk6 and privacy risk.7"
    status: "candidate"
  - id: "REQ-SP800-53B-0013"
    citation: {"ref": "SP800-53B", "page": 16, "anchor": "In the baseline control selection approach and organization-generated control selection approach, organizations"}
    kind: "indicative"
    locator: "1.3"
    context: "ORGANIZATIONAL RESPONSIBILITIES"
    statement: "In the baseline control selection approach and organization-generated control selection approach, organizations develop a well-defined set of security and privacy requirements using a life cycle-based systems engineering process, as described in the Risk Management Framework (RMF) Prepare—System Level step, Task P-15, Requirements Definition. The requirements definition process generates a set of requirements that can be used to guide and inform the selection of controls to satisfy the requirements."
    status: "candidate"
  - id: "REQ-SP800-53B-0014"
    citation: {"ref": "SP800-53B", "page": 17, "anchor": "This publication establishes security and privacy control baselines derived from the controls"}
    kind: "modal"
    locator: "1.4"
    context: "RELATIONSHIP TO OTHER PUBLICATIONS"
    statement: "This publication establishes security and privacy control baselines derived from the controls in [SP 800-53]. The control baselines in this publication are in accordance with requirements for federal information and information systems included in [OMB A-130],8 Federal Information Processing Standard 199 [FIPS 199], and Federal Information Processing Standard 200 [FIPS 200]. [SP 800-37] provides guidance on control selection approaches."
    status: "candidate"
  - id: "REQ-SP800-53B-0015"
    citation: {"ref": "SP800-53B", "page": 17, "anchor": "The security and privacy controls specified in the baselines represent the state-of-the-practice"}
    kind: "indicative"
    locator: "1.5"
    context: "REVISIONS AND EXTENSIONS"
    statement: "The security and privacy controls specified in the baselines represent the state-of-the-practice protection measures for individuals, information systems, and organizations. The controls comprising the baselines are periodically reviewed and revised to reflect the experience gained from using the controls; new or revised laws, executive orders, directives, regulations, policies, and standards; changing security and privacy requirements; emerging threats, vulnerabilities, attacks, and information processing methods; and the availability of new technologies. Thus, the security and privacy controls specified in the baselines are also expected to change over time as controls are withdrawn, revised, and added. In addition to the need for change, the need for stability is addressed by requiring that proposed changes to the baseline undergo a rigorous and transparent public review process to obtain public and private sector feedback and to build a consensus for baseline changes. The public review process provides a stable, flexible, and technically sound set of security and privacy control baselines."
    status: "candidate"
  - id: "REQ-SP800-53B-0016"
    citation: {"ref": "SP800-53B", "page": 17, "anchor": "Chapter Two describes the fundamental concepts associated with control baselines, selecting the"}
    kind: "lettered"
    locator: "1.6.•"
    context: "PUBLICATION ORGANIZATION The remainder of this special publication is organized as follows:"
    statement: "• Chapter Two describes the fundamental concepts associated with control baselines, selecting the appropriate baseline, baseline assumptions, tailoring baselines, overlays, and capabilities."
    status: "candidate"
  - id: "REQ-SP800-53B-0017"
    citation: {"ref": "SP800-53B", "page": 17, "anchor": "Chapter Three provides a set of tables organized by control family that"}
    kind: "lettered"
    locator: "1.6.•"
    context: "PUBLICATION ORGANIZATION The remainder of this special publication is organized as follows:"
    statement: "• Chapter Three provides a set of tables organized by control family that contain the controls that comprise the low-impact, moderate-impact, and high-impact security control baselines as well as the privacy control baseline."
    status: "candidate"
  - id: "REQ-SP800-53B-0018"
    citation: {"ref": "SP800-53B", "page": 17, "anchor": "A list of informative References9 is provided after Chapter Three."}
    kind: "lettered"
    locator: "1.6.•"
    context: "PUBLICATION ORGANIZATION The remainder of this special publication is organized as follows:"
    statement: "• A list of informative References9 is provided after Chapter Three."
    status: "candidate"
  - id: "REQ-SP800-53B-0019"
    citation: {"ref": "SP800-53B", "page": 18, "anchor": "Security and privacy control baselines are predefined sets of controls specifically assembled"}
    kind: "indicative"
    locator: "1.6"
    context: "SECURITY AND PRIVACY CONTROL BASELINES"
    statement: "Security and privacy control baselines are predefined sets of controls specifically assembled to address the protection needs of groups, organizations, or communities of interest. The control baselines serve as a starting point for the protection of individuals’ privacy, information, and information systems and can be tailored (i.e., customized)—appropriately taking into account organizational missions and business functions, specific and credible threat information, the environment in which the organization operates, and individuals’ privacy interests."
    status: "candidate"
  - id: "REQ-SP800-53B-0020"
    citation: {"ref": "SP800-53B", "page": 19, "anchor": "his chapter presents the fundamental concepts associated with security and privacy control"}
    kind: "indicative"
    locator: "THE FUNDAMENTALS"
    context: "CONTROL BASELINES, TAILORING, OVERLAYS, AND CAPABILITIES"
    statement: "his chapter presents the fundamental concepts associated with security and privacy control baselines, including the purpose of control baselines, how control baselines are selected, assumptions associated with control baselines, how the tailoring process is used to customize controls and baselines, the purpose of overlays and how they are used to address the security and privacy needs of communities of interest, and how the concept of capabilities can facilitate the grouping of mutually reinforcing controls."
    status: "candidate"
  - id: "REQ-SP800-53B-0021"
    citation: {"ref": "SP800-53B", "page": 19, "anchor": "A significant challenge for organizations is selecting a set of security and"}
    kind: "modal"
    locator: "2.1"
    context: "CONTROL BASELINES"
    statement: "A significant challenge for organizations is selecting a set of security and privacy controls that can protect their mission and business functions and provide the capability to manage security and privacy risk. The selected controls, if correctly implemented and determined to be effective, meet security and privacy requirements defined by applicable laws, executive orders, policies, regulations, and directives. There is no single set of controls that addresses all security and privacy concerns in every situation. However, choosing the most appropriate controls for a specific situation or system to adequately respond to risk requires a fundamental understanding of the organization’s mission and business priorities, the mission and business functions that the systems will support, and the environments in which the systems will operate. It also requires close collaboration with key organizational stakeholders. With that understanding, organizations can demonstrate how to efficiently and cost-effectively assure the confidentiality, integrity, and availability of organizational information and systems, as well as the privacy of individuals in the context of supporting the organization’s mission and business functions."
    status: "candidate"
  - id: "REQ-SP800-53B-0022"
    citation: {"ref": "SP800-53B", "page": 19, "anchor": "The concept of a control baseline is introduced to assist organizations in"}
    kind: "indicative"
    locator: "2.1"
    context: "CONTROL BASELINES"
    statement: "The concept of a control baseline is introduced to assist organizations in selecting a set of controls for their systems that is commensurate with security and privacy risk. A control baseline is a collection of controls from [SP 800-53] assembled to address the protection needs of a group, organization, or community of interest.10 It provides a generalized set of controls that represents a starting point for the subsequent tailoring activities that are applied to the baseline to produce a targeted or customized security and privacy solution for the entity that the baseline is intended to serve. Control baselines are tailored based on a variety of factors, including threat information, mission or business requirements, types of systems, sector-specific requirements, specific technologies, operating environments, organizational assumptions and constraints, individuals’ privacy interests, laws, executive orders, regulations, policies, directives, standards, or industry best practices. Tailoring activities are described in greater detail in Section 2.4."
    status: "candidate"
  - id: "REQ-SP800-53B-0023"
    citation: {"ref": "SP800-53B", "page": 19, "anchor": "The U.S. Government—in accordance with the requirements set forth in [FISMA], [OMB"}
    kind: "modal"
    locator: "2.1"
    context: "CONTROL BASELINES"
    statement: "The U.S. Government—in accordance with the requirements set forth in [FISMA], [OMB A-130], and Federal Information Processing Standards—has established federally mandated security control baselines. The control baselines for non-national security systems are listed in Chapter Three."
    status: "candidate"
  - id: "REQ-SP800-53B-0024"
    citation: {"ref": "SP800-53B", "page": 20, "anchor": "Information security programs are responsible for protecting information and information systems from"}
    kind: "modal"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "Information security programs are responsible for protecting information and information systems from unauthorized access, use, disclosure, disruption, modification, or destruction (i.e., unauthorized system activity or behavior) in order to provide confidentiality, integrity, and availability. Privacy programs are responsible for managing the risks to individuals associated with the creation, collection, use, processing, dissemination, storage, maintenance, disclosure, or disposal (collectively referred to as “processing”) of personally identifiable information (PII) and for ensuring compliance with applicable privacy requirements.11 When a system processes PII, the information security and privacy programs have a shared responsibility to manage the impacts to individuals that arise from security risks and collaborate to determine the security categorization and the selection and tailoring of controls from the security control baselines."
    status: "candidate"
    work_item: "WI-17"
  - id: "REQ-SP800-53B-0025"
    citation: {"ref": "SP800-53B", "page": 20, "anchor": "In preparation for selecting and tailoring the appropriate security control baselines for"}
    kind: "modal"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "In preparation for selecting and tailoring the appropriate security control baselines for organizational systems and their respective environments of operation, organizations first determine the criticality and sensitivity of the information to be processed, stored, or transmitted by those systems. The process of determining information criticality and sensitivity is known as security categorization and is described in [FIPS 199].12 The results of security categorization help guide and inform the selection of security control baselines to protect systems and information. The control baselines selected for systems are commensurate with the potential adverse impact on organizational operations, organizational assets, individuals, other organizations, or the Nation if there is a loss of confidentiality, integrity, or availability. [FIPS 199] requires organizations to categorize systems as low-impact, moderate-impact, or high-impact for the stated security objectives of confidentiality, integrity, and availability.13"
    status: "candidate"
  - id: "REQ-SP800-53B-0026"
    citation: {"ref": "SP800-53B", "page": 20, "anchor": "Since the potential impact values for confidentiality, integrity, and availability may not"}
    kind: "modal"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "Since the potential impact values for confidentiality, integrity, and availability may not always be the same for a particular system, the high water mark concept (introduced in [FIPS 199]) is used in [FIPS 200] to determine the impact level of the system. The impact level of the system, in turn, is used for the express purpose of selecting the applicable security control baseline from one of the three baselines identified in Chapter Three.14 Thus, a low-impact system is defined as a system in which all three of the security objectives are low. A moderate-impact system is a system in which at least one of the security objectives is moderate and no security objective is high. Finally, a high-impact system is a system in which at least one security objective is high."
    status: "candidate"
  - id: "REQ-SP800-53B-0027"
    citation: {"ref": "SP800-53B", "page": 20, "anchor": "Privacy programs may also choose to consider the risks to individuals that"}
    kind: "modal"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "Privacy programs may also choose to consider the risks to individuals that may arise from their interactions with information systems where the processing of PII may be less impactful than the effect that the system has on individuals’ behavior or activities. Such effects would constitute risks to individual autonomy, and organizations may need to take steps to manage those risks in addition to information security and privacy risks."
    status: "candidate"
  - id: "REQ-SP800-53B-0028"
    citation: {"ref": "SP800-53B", "page": 20, "anchor": "The high water mark concept is employed because there are significant dependencies"}
    kind: "indicative"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "The high water mark concept is employed because there are significant dependencies among the security objectives of confidentiality, integrity, and availability. In most cases, a compromise in one security objective ultimately affects the other security objectives as well. Accordingly, security controls are not categorized by security objective. Rather, the security controls are grouped into baselines to provide a general protection capability for classes of systems based on impact level."
    status: "candidate"
  - id: "REQ-SP800-53B-0029"
    citation: {"ref": "SP800-53B", "page": 21, "anchor": "Once the impact level of the system is determined, organizations select the"}
    kind: "indicative"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "Once the impact level of the system is determined, organizations select the appropriate security control baseline.15 The selection of the security control baseline is based on the [FIPS 200] impact level of the system as determined by the security categorization process described above. The organization selects one of three security control baselines from Chapter Three corresponding to the low-impact, moderate-impact, or high-impact categorization of the system. Note that not all controls or control enhancements identified in [SP 800-53] are assigned to control baselines as indicated in the tables in Chapter Three. The controls and control enhancements that are assigned to baselines are indicated by an “x” in the low, moderate, or high columns in Tables 3-1 through 3-20. The use of the term control baseline is intentional. The controls and control enhancements in the baselines are a starting point from which controls or enhancements may be removed, added, or specialized based on the tailoring guidance in Section 2.4.16"
    status: "candidate"
  - id: "REQ-SP800-53B-0030"
    citation: {"ref": "SP800-53B", "page": 21, "anchor": "In addition to the three security control baselines, Chapter Three provides an"}
    kind: "modal"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "In addition to the three security control baselines, Chapter Three provides an initial privacy control baseline for federal agencies to address privacy requirements and manage privacy risks that arise from the processing of PII based on privacy program responsibilities under [OMB A- 130].17 The controls and control enhancements that are assigned to the privacy baseline are indicated by an “x.”18 Not all controls or control enhancements that address privacy risk are assigned to the privacy control baseline. This approach provides a starting point from which controls or control enhancements may be removed, added, or specialized based on the tailoring guidance in Section 2.4.19"
    status: "candidate"
  - id: "REQ-SP800-53B-0031"
    citation: {"ref": "SP800-53B", "page": 21, "anchor": "Organizations conduct privacy risk assessments that consider the nature of the PII"}
    kind: "indicative"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "Organizations conduct privacy risk assessments that consider the nature of the PII processing and its impact on individuals to guide the tailoring of the privacy control baseline for their programs and systems. Privacy risk assessments include evaluating the applicability of legal and policy requirements for their programs. For example, organizations may remove controls or control enhancements related to legal or policy requirements that are not applicable to them unless they determine that, based on a privacy risk assessment, the controls or control enhancements would be helpful in mitigating identified privacy risks. In addition, organizations may add unassigned controls or control enhancements to mitigate privacy risks specific to their information systems as determined by their privacy risk assessments."
    status: "candidate"
  - id: "REQ-SP800-53B-0032"
    citation: {"ref": "SP800-53B", "page": 21, "anchor": "The general control baseline selection process may be augmented or further detailed"}
    kind: "should"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "The general control baseline selection process may be augmented or further detailed by additional sector-specific guidance, such as for a community with common risk management objectives or an industry sub-sector, as described in Appendix C, Overlays."
    status: "candidate"
  - id: "REQ-SP800-53B-0033"
    citation: {"ref": "SP800-53B", "page": 21, "anchor": "Federal agencies should not assume that the implementation of the privacy control"}
    kind: "modal"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "Federal agencies should not assume that the implementation of the privacy control baseline means that they have met all of their obligations under [OMB A-130]. Agencies may need to take additional, separate steps to fully comply with OMB privacy requirements."
    status: "candidate"
  - id: "REQ-SP800-53B-0034"
    citation: {"ref": "SP800-53B", "page": 21, "anchor": "Privacy control enhancements in Tables 3-1 through 3-20 in Chapter Three cannot"}
    kind: "modal"
    locator: "2.2"
    context: "SELECTING CONTROL BASELINES"
    statement: "Privacy control enhancements in Tables 3-1 through 3-20 in Chapter Three cannot be selected and implemented without the selection and implementation of the associated base control. Such actions may require collaboration with security programs in cases where the security program has responsibility for the base control. Organizations ensure that the responsibility for the selection and implementation of controls is clearly defined between the information security and privacy programs."
    status: "candidate"
  - id: "REQ-SP800-53B-0035"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "The control baselines in Chapter Three address the protection needs of a"}
    kind: "indicative"
    locator: "2.3"
    context: "CONTROL BASELINE ASSUMPTIONS"
    statement: "The control baselines in Chapter Three address the protection needs of a diverse set of constituencies, including individual users and organizations. Thus, certain working assumptions generally underlie the control baselines in Chapter Three. These assumptions, made when determining the baselines in Chapter Three, consider the environments in which organizational information systems operate, including legislative, regulatory, or policy obligations; the nature of organizational operations; the specific functionality employed within the systems; the types of threats confronting organizations, mission and business processes, and systems; individuals’ privacy interests; and the types of information processed, stored, or transmitted by systems.20"
    status: "candidate"
  - id: "REQ-SP800-53B-0036"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Information in organizational systems is relatively persistent.21"}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Specific assumptions that underlie the control baselines in Chapter Three include:"
    statement: "• Information in organizational systems is relatively persistent.21"
    status: "candidate"
  - id: "REQ-SP800-53B-0037"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Organizational systems are multi-user (either serially or concurrently) in operation."}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Specific assumptions that underlie the control baselines in Chapter Three include:"
    statement: "• Organizational systems are multi-user (either serially or concurrently) in operation."
    status: "candidate"
  - id: "REQ-SP800-53B-0038"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Some information in organizational systems is not shareable with other users who"}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Specific assumptions that underlie the control baselines in Chapter Three include:"
    statement: "• Some information in organizational systems is not shareable with other users who have authorized access to the same systems."
    status: "candidate"
  - id: "REQ-SP800-53B-0039"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Organizational systems exist in networked environments and are general purpose in nature."}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Specific assumptions that underlie the control baselines in Chapter Three include:"
    statement: "• Organizational systems exist in networked environments and are general purpose in nature."
    status: "candidate"
  - id: "REQ-SP800-53B-0040"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Organizations have the necessary structure, resources, and infrastructure to implement the controls.22"}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Specific assumptions that underlie the control baselines in Chapter Three include:"
    statement: "• Organizations have the necessary structure, resources, and infrastructure to implement the controls.22"
    status: "candidate"
  - id: "REQ-SP800-53B-0041"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "If any of the above assumptions are not valid, then some of"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL BASELINE ASSUMPTIONS Specific assumptions that underlie the control baselines in Chapter Three include:"
    statement: "If any of the above assumptions are not valid, then some of the security controls allocated to the control baselines in Chapter Three may not be applicable—a situation that can be addressed by applying the tailoring guidance in Section 2.4 and the results of organization- and system-level risk assessments. Additional assumptions that are not addressed in the baselines include:"
    status: "candidate"
  - id: "REQ-SP800-53B-0042"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Insider threats exist within organizations."}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Additional assumptions that are not addressed in the baselines include:"
    statement: "• Insider threats exist within organizations."
    status: "candidate"
  - id: "REQ-SP800-53B-0043"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Classified information is processed, stored, or transmitted by organizational systems.23"}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Additional assumptions that are not addressed in the baselines include:"
    statement: "• Classified information is processed, stored, or transmitted by organizational systems.23"
    status: "candidate"
  - id: "REQ-SP800-53B-0044"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Advanced persistent threats (APTs) exist within organizations."}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Additional assumptions that are not addressed in the baselines include:"
    statement: "• Advanced persistent threats (APTs) exist within organizations."
    status: "candidate"
  - id: "REQ-SP800-53B-0045"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Information requires specialized protection based on legislation, directives, regulations, or policies."}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Additional assumptions that are not addressed in the baselines include:"
    statement: "• Information requires specialized protection based on legislation, directives, regulations, or policies."
    status: "candidate"
  - id: "REQ-SP800-53B-0046"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "Organizational systems communicate with other systems across different security domains."}
    kind: "lettered"
    locator: "2.3.•"
    context: "CONTROL BASELINE ASSUMPTIONS Additional assumptions that are not addressed in the baselines include:"
    statement: "• Organizational systems communicate with other systems across different security domains."
    status: "candidate"
  - id: "REQ-SP800-53B-0047"
    citation: {"ref": "SP800-53B", "page": 22, "anchor": "In general, federal departments and agencies satisfy this assumption. However, the assumption"}
    kind: "modal"
    locator: "2.3"
    context: "CONTROL BASELINE ASSUMPTIONS"
    statement: "In general, federal departments and agencies satisfy this assumption. However, the assumption can become an issue for nonfederal entities, such as municipalities, first responders, and small businesses. Such entities may not be large enough or sufficiently resourced to have elements dedicated to providing the range of security or privacy capabilities that are assumed by the baselines. Organizations consider such factors in their risk-based decisions."
    status: "candidate"
  - id: "REQ-SP800-53B-0048"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "After selecting an appropriate control baseline, organizations initiate a tailoring process to"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "After selecting an appropriate control baseline, organizations initiate a tailoring process to align the controls more closely with the specific security and privacy requirements identified by the organization. The tailoring process is part of an organization-wide risk management process that includes framing, assessing, responding to, and monitoring information security and privacy risks. Tailoring decisions are dependent on organizational or system-specific factors. While tailoring decisions are focused on security and privacy considerations, the decisions are typically aligned with other risk-related issues that organizations must routinely address. Risk-related issues such as cost, schedule, and performance are considered in the determination of which controls to employ and how to implement controls in organizational systems and environments of operation.24 The tailoring process can include but is not limited to the following activities:25"
    status: "candidate"
  - id: "REQ-SP800-53B-0049"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Identifying and designating common controls"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES"
    statement: "• Identifying and designating common controls"
    status: "candidate"
  - id: "REQ-SP800-53B-0050"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Applying scoping considerations"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES"
    statement: "• Applying scoping considerations"
    status: "candidate"
  - id: "REQ-SP800-53B-0051"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Selecting compensating controls"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES"
    statement: "• Selecting compensating controls"
    status: "candidate"
  - id: "REQ-SP800-53B-0052"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Assigning values to organization-defined control parameters via explicit assignment and selection operations"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES"
    statement: "• Assigning values to organization-defined control parameters via explicit assignment and selection operations"
    status: "candidate"
  - id: "REQ-SP800-53B-0053"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Supplementing baselines with additional controls and control enhancements"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES"
    statement: "• Supplementing baselines with additional controls and control enhancements"
    status: "candidate"
  - id: "REQ-SP800-53B-0054"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Providing specification information for control implementation"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES"
    statement: "• Providing specification information for control implementation"
    status: "candidate"
  - id: "REQ-SP800-53B-0055"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Organizations use risk management guidance to facilitate risk-based decision making regarding the"}
    kind: "indicative"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Organizations use risk management guidance to facilitate risk-based decision making regarding the applicability of the controls in the baselines. Ultimately, organizations employ the tailoring process to achieve cost-effective solutions that support organizational mission and business needs and provide security and privacy protections commensurate with risk. Organizations have the flexibility to tailor at the organization level for systems in support of a line of business or a mission or business process, at the individual system level, or by using a combination of the two.26 However, organizations do not arbitrarily remove security and privacy controls from baselines. Tailoring decisions are expected to be defensible based on mission and business needs, a sound rationale, and explicit risk-based determinations.27"
    status: "candidate"
  - id: "REQ-SP800-53B-0056"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Tailoring decisions, including the risk-based justification for the decisions, are documented in"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Tailoring decisions, including the risk-based justification for the decisions, are documented in the system security and privacy plans for organizational systems.28 Every control from the selected control baseline is accounted for by the organization. If certain controls are tailored out, the rationale is recorded in the system security and privacy plans and subsequently approved by the responsible officials within the organization as part of the approval process for the plans. Documenting risk management decisions during the baseline tailoring process is imperative for organizational officials to have the necessary information to make credible, risk-based decisions regarding security and privacy and to do so in a manner that fully supports transparency, traceability, and accountability."
    status: "candidate"
  - id: "REQ-SP800-53B-0057"
    citation: {"ref": "SP800-53B", "page": 23, "anchor": "Tailoring decisions can be based on the timing and applicability of selected"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Tailoring decisions can be based on the timing and applicability of selected controls under certain conditions. That is, security and privacy controls may not apply in every situation, or the parameter values for assignment operations may change under certain circumstances. Federal agencies conduct baseline tailoring activities in accordance with OMB policy. In certain situations, OMB may prohibit agencies from tailoring specific security or privacy controls."
    status: "candidate"
  - id: "REQ-SP800-53B-0058"
    citation: {"ref": "SP800-53B", "page": 24, "anchor": "Common controls are controls that may be inherited by one or more"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Common controls are controls that may be inherited by one or more organizational systems. If a system inherits a common control provided by another entity (internal or external), there is no need to implement the control within that system. Organizational decisions on which controls are designated as common controls may affect the responsibilities of individual system owners with regard to the implementation of the controls in a baseline.29 Common control providers ensure that current implementation information and assessment results are available to facilitate decision making by system owners and authorizing officials. System owners and authorizing officials determine if the common controls available for inheritance actually provide protection commensurate with risk for inheriting systems.30"
    status: "candidate"
  - id: "REQ-SP800-53B-0059"
    citation: {"ref": "SP800-53B", "page": 24, "anchor": "Common control designation and control implementation can affect organizations’ resource expenditures. That"}
    kind: "should"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Common control designation and control implementation can affect organizations’ resource expenditures. That is, in general, the greater the number of common controls implemented, the greater the potential cost savings since the protective measures are amortized over many systems. Additionally, the deployment of controls as common controls often provides a more standardized, stable, scalable, and secure implementation across the organization as opposed to the same control implemented separately on multiple individual systems."
    status: "candidate"
  - id: "REQ-SP800-53B-0060"
    citation: {"ref": "SP800-53B", "page": 24, "anchor": "Scoping considerations, when applied in conjunction with risk management guidance, provide organizations"}
    kind: "indicative"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Scoping considerations, when applied in conjunction with risk management guidance, provide organizations with a more granular foundation on which to make risk-based decisions.31 The application of these scoping considerations can eliminate unnecessary controls from the initial control baselines and ensure that organizations select only those controls that are needed to provide a level of protection that is commensurate with risk. Organizations may apply the scoping considerations described below as needed to assist with making risk-based decisions regarding control selection and specification."
    status: "candidate"
  - id: "REQ-SP800-53B-0061"
    citation: {"ref": "SP800-53B", "page": 24, "anchor": "Control Implementation, Applicability, and Placement Considerations"}
    kind: "lettered"
    locator: "2.4.-"
    context: "TAILORING CONTROL BASELINES"
    statement: "- Control Implementation, Applicability, and Placement Considerations"
    status: "candidate"
  - id: "REQ-SP800-53B-0062"
    citation: {"ref": "SP800-53B", "page": 24, "anchor": "The growing complexity of systems requires careful analysis in the implementation of"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "The growing complexity of systems requires careful analysis in the implementation of security and privacy controls. Controls in the initial baselines may not be applicable to every component in the system. Controls are applicable only to system components that provide or support the security or privacy functions or capabilities addressed by the controls.32 Organizations make explicit risk-based decisions about where to apply or allocate specific controls in organizational systems to achieve the needed security or privacy function or capability and to satisfy security and privacy requirements."
    status: "candidate"
  - id: "REQ-SP800-53B-0063"
    citation: {"ref": "SP800-53B", "page": 24, "anchor": "Organizations may also leverage the use of hybrid controls. Hybrid controls are"}
    kind: "indicative"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Organizations may also leverage the use of hybrid controls. Hybrid controls are partially implemented by one or more common control providers and partially implemented by the system."
    status: "candidate"
  - id: "REQ-SP800-53B-0064"
    citation: {"ref": "SP800-53B", "page": 25, "anchor": "Certain controls in the control baselines assume the existence of operational or"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Certain controls in the control baselines assume the existence of operational or environmental factors. Where operational or environmental factors are absent or significantly diverge from the baseline assumptions described in Section 2.3, it is justifiable to tailor the baseline. Common operational and environmental factors include mobile devices and operations; single-user systems and operations; data connectivity and bandwidth; air-gapped systems; systems that have very limited or sporadic bandwidth, such as tactical systems that support warfighter or law enforcement missions; cyber-physical systems, sensors, and Internet of Things (IoT) devices; limited functionality systems, such as facsimile machines, printers, and digital cameras; systems that process, store, or transmit non-persistent information or that use virtualization techniques to establish non-persistent instantiations of operating systems and applications; and systems that require public access."
    status: "candidate"
  - id: "REQ-SP800-53B-0065"
    citation: {"ref": "SP800-53B", "page": 25, "anchor": "Controls that refer to specific technologies—such as wireless, cryptography, or public key"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Controls that refer to specific technologies—such as wireless, cryptography, or public key infrastructure—are applicable only if those technologies are implemented or required for use within organizational systems. Controls that can be effectively supported by automated mechanisms do not require the development of such mechanisms if the mechanisms do not already exist or are not readily available in commercial or government off-the-shelf products. If automated mechanisms are not available, cost-effective, or technically feasible, compensating controls implemented through non-automated mechanisms or procedures can be implemented to satisfy specified controls or control enhancements."
    status: "candidate"
  - id: "REQ-SP800-53B-0066"
    citation: {"ref": "SP800-53B", "page": 25, "anchor": "Certain controls may not be appropriate if implementing those controls has the"}
    kind: "modal"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Certain controls may not be appropriate if implementing those controls has the potential to degrade, debilitate, or interfere with organizational mission or business functions, including endangering or harming individuals. However, decisions on the appropriateness of control implementation always consider legislative, regulatory, and policy requirements."
    status: "candidate"
  - id: "REQ-SP800-53B-0067"
    citation: {"ref": "SP800-53B", "page": 25, "anchor": "Controls that support only one or two of the security objectives (i.e.,"}
    kind: "should"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "Controls that support only one or two of the security objectives (i.e., confidentiality, integrity, or availability) may be downgraded to the corresponding control in a lower baseline (or modified or eliminated if not defined in a lower baseline) only if the downgrading action reflects the [FIPS 199] security category for the supported security objectives before considering the [FIPS 200] impact level (i.e., high water mark),"
    status: "candidate"
  - id: "REQ-SP800-53B-0068"
    citation: {"ref": "SP800-53B", "page": 25, "anchor": "For example, if a system is categorized as moderate-impact using the high"}
    kind: "indicative"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES"
    statement: "For example, if a system is categorized as moderate-impact using the high water mark concept because confidentiality and/or integrity are moderate but availability is low, there are several controls that only support the availability security objective and that could potentially be downgraded to the low baseline controls. In this scenario, it may be appropriate to refrain from implementing CP-2(1) because the control enhancement only supports availability and is selected in the moderate baseline but not in the low baseline. The following security controls and control enhancements are candidates for downgrading for each of the security categories:"
    status: "candidate"
  - id: "REQ-SP800-53B-0069"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Support Only Confidentiality: AC-21, MA-3(3), MP-3, MP-4, MP-5, MP-6(1), MP-6(2), PE-4, PE-5,"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES The following security controls and control enhancements are candidates for downgrading for each of the security categories:"
    statement: "• Support Only Confidentiality: AC-21, MA-3(3), MP-3, MP-4, MP-5, MP-6(1), MP-6(2), PE-4, PE-5, SC-4"
    status: "candidate"
  - id: "REQ-SP800-53B-0070"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Support Only Integrity: CM-5, CM-5(1), CM-5(3), SI-7, SI-7(1), SI-7(5), SI-10"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES The following security controls and control enhancements are candidates for downgrading for each of the security categories:"
    statement: "• Support Only Integrity: CM-5, CM-5(1), CM-5(3), SI-7, SI-7(1), SI-7(5), SI-10"
    status: "candidate"
  - id: "REQ-SP800-53B-0071"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Support Only Availability: CP-2(1), CP-2(2), CP-2(3), CP-2(5), CP-2(8), CP-3(1), CP-4(1), CP- 4(2),"}
    kind: "lettered"
    locator: "2.4.•"
    context: "TAILORING CONTROL BASELINES The following security controls and control enhancements are candidates for downgrading for each of the security categories:"
    statement: "• Support Only Availability: CP-2(1), CP-2(2), CP-2(3), CP-2(5), CP-2(8), CP-3(1), CP-4(1), CP- 4(2), CP-6, CP-6(1), CP-6(2), CP-6(3), CP-7, CP-7(1), CP-7(2), CP-7(3), CP-7(4), CP-7(6), CP-8, CP-8(1), CP-8(2), CP-8(3), CP-8(4), CP-8(5), CP-9(2), CP-9(3), CP-9(5), CP-9(6), CP-10(2), CP- 10(4), CP-11, MA-6, PE-9, PE-10, PE-11, PE-11(1), PE-13(1), PE-13(2), PE-15(1)"
    status: "candidate"
  - id: "REQ-SP800-53B-0072"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Although controls that are used to meet legislative, regulatory, or policy requirements"}
    kind: "indicative"
    locator: "2.4"
    context: "TAILORING CONTROL BASELINES The following security controls and control enhancements are candidates for downgrading for each of the security categories:"
    statement: "Although controls that are used to meet legislative, regulatory, or policy requirements are not to be tailored out of control baselines, some legislative, regulatory, or policy requirements may only apply in specified circumstances. It is justifiable to tailor the baseline when these circumstances are not applicable to an organization or certain systems."
    status: "candidate"
  - id: "REQ-SP800-53B-0073"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Compensating controls are used by organizations in lieu of specific controls in"}
    kind: "indicative"
    locator: "Selecting Compensating Controls"
    context: ""
    statement: "Compensating controls are used by organizations in lieu of specific controls in control baselines. The use of compensating controls is appropriate when controls are tailored out of the control baseline by necessity, but the protection provided by the controls is still needed to reduce risk to an acceptable level. Compensating controls are often chosen when implementing a baseline control is technically infeasible, not cost effective, or the control implementation negatively affects organizational mission or business functions.33 For technology-based scoping considerations, compensating controls may be temporary and used only until the system is updated. Compensating controls are intended to provide equivalent or comparable protection34 for systems, organizations, and individuals.35 Compensating controls are selected after applying the scoping considerations in the tailoring process. To use compensating controls, organizations:"
    status: "candidate"
  - id: "REQ-SP800-53B-0074"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Select compensating controls from the control catalog in [SP 800-53]."}
    kind: "lettered"
    locator: "Selecting Compensating Controls.•"
    context: "To use compensating controls, organizations:"
    statement: "• Select compensating controls from the control catalog in [SP 800-53]."
    status: "candidate"
  - id: "REQ-SP800-53B-0075"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Provide a rationale for how compensating controls satisfy security or privacy requirements"}
    kind: "lettered"
    locator: "Selecting Compensating Controls.•"
    context: "To use compensating controls, organizations:"
    statement: "• Provide a rationale for how compensating controls satisfy security or privacy requirements and why the baseline controls could not be implemented."
    status: "candidate"
  - id: "REQ-SP800-53B-0076"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Adopt suitable compensating controls from other sources if appropriate compensating controls are"}
    kind: "lettered"
    locator: "Selecting Compensating Controls.•"
    context: "To use compensating controls, organizations:"
    statement: "• Adopt suitable compensating controls from other sources if appropriate compensating controls are not available in [SP 800-53].36"
    status: "candidate"
  - id: "REQ-SP800-53B-0077"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Assess and accept the security and privacy risks associated with implementing compensating"}
    kind: "lettered"
    locator: "Selecting Compensating Controls.•"
    context: "To use compensating controls, organizations:"
    statement: "• Assess and accept the security and privacy risks associated with implementing compensating controls."
    status: "candidate"
  - id: "REQ-SP800-53B-0078"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "For example, additional physical security controls may be implemented in lieu of"}
    kind: "should"
    locator: "Selecting Compensating Controls"
    context: "To use compensating controls, organizations:"
    statement: "For example, additional physical security controls may be implemented in lieu of a device lock in certain real-time mission or business applications. In a small organization, more frequent auditing, targeted role-based training, or stronger personnel screening may be implemented in lieu of separation of duties. Well-defined procedures, targeted role-based training, and more frequent auditing may be implemented in lieu of automated mechanisms."
    status: "candidate"
  - id: "REQ-SP800-53B-0079"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Compensating controls are not used to avoid the need to comply with"}
    kind: "modal"
    locator: "Selecting Compensating Controls"
    context: ""
    statement: "Compensating controls are not used to avoid the need to comply with requirements. Rather, the use of such controls provides alternative and suitable security and privacy protections to facilitate risk management."
    status: "candidate"
  - id: "REQ-SP800-53B-0080"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "More than one compensating control may be required to provide the equivalent"}
    kind: "modal"
    locator: "Selecting Compensating Controls"
    context: ""
    statement: "More than one compensating control may be required to provide the equivalent protection for a control that has been tailored out from a control baseline."
    status: "candidate"
  - id: "REQ-SP800-53B-0081"
    citation: {"ref": "SP800-53B", "page": 26, "anchor": "Organizations make every attempt to select compensating controls from the consolidated control"}
    kind: "indicative"
    locator: "Selecting Compensating Controls"
    context: ""
    statement: "Organizations make every attempt to select compensating controls from the consolidated control catalog in [SP 800-53]. Organization-defined compensating controls are employed only when organizations determine that the control catalog does not contain suitable compensating controls."
    status: "candidate"
  - id: "REQ-SP800-53B-0082"
    citation: {"ref": "SP800-53B", "page": 27, "anchor": "Controls and control enhancements containing embedded parameters (i.e., assignment and selection operations)"}
    kind: "indicative"
    locator: "Assigning Control Parameter Values"
    context: ""
    statement: "Controls and control enhancements containing embedded parameters (i.e., assignment and selection operations) give organizations the flexibility to specify values for certain portions of controls and control enhancements to support specific organizational requirements. After the application of scoping considerations and the selection of compensating controls, organizations review the controls and control enhancements for assignment or selection operations and determine the appropriate organization-defined values for the identified parameters. The parameter values may be driven by mission or business requirements, or the values may be prescribed by laws, executive orders, directives, regulations, policies, standards, guidelines, or industry best practices."
    status: "candidate"
  - id: "REQ-SP800-53B-0083"
    citation: {"ref": "SP800-53B", "page": 27, "anchor": "Once organizations specify the parameter values for the controls and control enhancements,"}
    kind: "indicative"
    locator: "Assigning Control Parameter Values"
    context: ""
    statement: "Once organizations specify the parameter values for the controls and control enhancements, the specified assignment and selection values become a permanent part of the control and control enhancement. As such, they are documented in security and privacy program plans or system security and privacy plans, as appropriate. Organizations can specify the parameter values before selecting compensating controls since the parameter specification completes the control definitions and may affect the need for compensating controls. There can be significant benefits to collaborating on the development of parameter values for controls. For organizations that work together on a frequent basis or regularly conduct exchanges of information, it may be useful to develop a mutually agreeable set of control parameter values."
    status: "candidate"
  - id: "REQ-SP800-53B-0084"
    citation: {"ref": "SP800-53B", "page": 27, "anchor": "In certain situations, additional controls or control enhancements beyond the controls and"}
    kind: "modal"
    locator: "Supplementing Control Baselines"
    context: ""
    statement: "In certain situations, additional controls or control enhancements beyond the controls and enhancements contained in the control baselines in Chapter Three may be required to address specific threats to organizations, mission and business processes, and systems; to address specific types of PII processing and associated privacy risks; and to satisfy the requirements of laws, executive orders, directives, policies, regulations, standards, and guidelines. Organizational assessments of risk provide information for determining the necessity and sufficiency of the controls and control enhancements in the control baselines. Organizations are encouraged to make maximum use of the control catalog in [SP 800-53] to supplement control baselines with additional controls or control enhancements."
    status: "candidate"
  - id: "REQ-SP800-53B-0085"
    citation: {"ref": "SP800-53B", "page": 27, "anchor": "Since controls and control enhancements are statements of security or privacy functions"}
    kind: "modal"
    locator: "Supplementing Control Baselines"
    context: ""
    statement: "Since controls and control enhancements are statements of security or privacy functions or capabilities that are conveyed at higher levels of abstraction, the controls may lack sufficient information for implementation. Therefore, additional details may be necessary to fully define the intent of a given control for implementation purposes and to ensure that the security and privacy requirements related to that control are satisfied. For example, additional information may be provided as part of the process of moving from control to specification requirements and may involve refinement of implementation details, refinement of scope, or iteration to apply the same control differently to different scopes. The need to provide control specification information occurs routinely when controls are employed in a systems engineering process as part of requirements engineering. Organizations ensure that if existing control information is not sufficient to define the intended implementation details for the control, such information is provided to system owners and common control providers. Organizations have the flexibility to determine whether control specification information is included as part of the control statement or in a separate control addendum section. When providing additional detail, organizations are cautioned not to change the intent of the base control or modify the original language in the control. Implementation information is documented in the system security and privacy plans."
    status: "candidate"
  - id: "REQ-SP800-53B-0086"
    citation: {"ref": "SP800-53B", "page": 28, "anchor": "Organizations consider defining a set of capabilities as a precursor to the"}
    kind: "indicative"
    locator: "2.5"
    context: "CAPABILITIES"
    statement: "Organizations consider defining a set of capabilities as a precursor to the control selection process. The concept of capability recognizes that satisfying security or privacy requirements seldom derives from a single control but rather from a set of mutually reinforcing controls. For example, organizations may wish to define a capability for secure remote authentication. This capability can be achieved by the selection and implementation of a set of controls from [SP 800-53], such as IA-2 (1), IA-2 (2), IA-2 (8), IA-2 (9), and SC-8 (1). Moreover, capabilities can address a variety of areas that can include technical means, physical means, procedural means, or any combination thereof. In addition to the above capability for secure remote access, organizations may also need security capabilities that address physical means, such as tamper detection on a cryptographic module or anomaly detection/analysis on an orbiting spacecraft."
    status: "candidate"
  - id: "REQ-SP800-53B-0087"
    citation: {"ref": "SP800-53B", "page": 28, "anchor": "Traditionally, assessments have been conducted on a control-by-control basis, producing results that"}
    kind: "modal"
    locator: "2.5"
    context: "CAPABILITIES"
    statement: "Traditionally, assessments have been conducted on a control-by-control basis, producing results that are characterized as pass (i.e., control satisfied) or fail (i.e., control not satisfied). However, the failure of a single control, or in some cases, multiple controls may not affect the overall capability needed by an organization. Moreover, employing the broader construct of a capability allows an organization to assess the severity of the vulnerabilities in its systems and determine if the failure of a particular control or the decision not to deploy a control affects the capability needed for mission and business protection. It also facilitates conducting root cause analyses to determine if the failure of one control can be traced to the failure of other controls based on the established control relationships. Ultimately, authorization decisions (i.e., risk acceptance decisions) are made based on the degree to which the desired capabilities have been effectively achieved and are meeting the security and privacy requirements defined by an organization. These risk-based decisions are directly related to the organizational risk tolerance that is defined as part of an organization’s risk management strategy."
    status: "candidate"
  - id: "REQ-SP800-53B-0088"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "n certain situations, it may be beneficial for organizations to apply the"}
    kind: "should"
    locator: "OVERLAYS"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES"
    statement: "n certain situations, it may be beneficial for organizations to apply the tailoring guidance to develop a set of controls for particular communities of interest or to address specialized requirements, technologies implemented, or unique missions or environments of operation. An organization may decide to establish a set of controls for specific applications or use cases, such as cloud-based services that could be applied to organizations procuring or implementing such services; industrial control systems generating or transmitting electric power or controlling environmental systems within facilities; systems processing, storing, or transmitting classified information; or systems controlling the safety of transportation systems. In these examples, overlays can be developed for each particular sector, technology area, unique circumstance, or environment and promulgated to large communities of interest—thus achieving standardized security and privacy capabilities, consistent control implementation, and cost-effective security and privacy solutions."
    status: "candidate"
  - id: "REQ-SP800-53B-0089"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "To address the need for specialized sets of controls for communities of"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES"
    statement: "To address the need for specialized sets of controls for communities of interest, systems, and organizations, the concept of overlay is introduced. An overlay may be a fully specified set of controls, control enhancements, and other supporting information (e.g., parameter values) that is derived from the application of tailoring guidance to control baselines38 39 or it may be derived independently of control baselines.40 Overlays are developed to apply to multiple systems within a community of interest and complement and further refine control baselines by:"
    status: "candidate"
  - id: "REQ-SP800-53B-0090"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "Providing an opportunity for the community of interest to add, modify, or"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Overlays are developed to apply to multiple systems within a community of interest and complement and further refine control baselines by:"
    statement: "• Providing an opportunity for the community of interest to add, modify, or eliminate controls"
    status: "candidate"
  - id: "REQ-SP800-53B-0091"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "Providing control applicability and interpretations for specific technologies, computing paradigms, environments of"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Overlays are developed to apply to multiple systems within a community of interest and complement and further refine control baselines by:"
    statement: "• Providing control applicability and interpretations for specific technologies, computing paradigms, environments of operation, types of systems, types of missions/operations, operating modes, industry sectors, and statutory/regulatory requirements"
    status: "candidate"
  - id: "REQ-SP800-53B-0092"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "Establishing parameter values for assignment and selection operations in controls and control"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Overlays are developed to apply to multiple systems within a community of interest and complement and further refine control baselines by:"
    statement: "• Establishing parameter values for assignment and selection operations in controls and control enhancements that are agreeable to communities of interest"
    status: "candidate"
  - id: "REQ-SP800-53B-0093"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "Organizations use the overlay concept when there is divergence from the basic"}
    kind: "modal"
    locator: "OVERLAYS"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Overlays are developed to apply to multiple systems within a community of interest and complement and further refine control baselines by:"
    statement: "Organizations use the overlay concept when there is divergence from the basic assumptions used to create the initial control baselines or when specific controls are needed to protect a particular technology or address a particular threat. Overlays may require tailoring as described in Chapter Three to help ensure that control implementations accurately reflect security and privacy requirements for each system, system component, and operational environment to which the overlay is applied. The overlay concept is applicable to groups of like technologies, systems, or communities of interest (i.e., the overlay concept is not appropriate for an individual system since the tailoring process is used to adapt control baselines for individual systems)."
    status: "candidate"
  - id: "REQ-SP800-53B-0094"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "[SP 800-82] provides an example of an overlay that includes a fully"}
    kind: "should"
    locator: "OVERLAYS"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES"
    statement: "[SP 800-82] provides an example of an overlay that includes a fully specified set of controls for industrial control systems. Alternatively, overlays can include a specific set of relevant controls that address a particular community need and complement control baselines."
    status: "candidate"
  - id: "REQ-SP800-53B-0095"
    citation: {"ref": "SP800-53B", "page": 81, "anchor": "Control baselines can include the federal baselines in Chapter Three; baselines developed"}
    kind: "should"
    locator: "OVERLAYS"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES"
    statement: "Control baselines can include the federal baselines in Chapter Three; baselines developed by state, local, or tribal governments; or baselines developed by private sector organizations (e.g., manufacturers, consortia, trade associations, industry, and critical infrastructure sectors)."
    status: "candidate"
  - id: "REQ-SP800-53B-0096"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "The full range of tailoring activities can be employed by organizations to"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES"
    statement: "The full range of tailoring activities can be employed by organizations to provide a structured approach for developing overlays that support the areas described above. Overlays provide an opportunity to build consensus across communities of interest and develop security and privacy plans for systems and organizations that have broad-based support for specific circumstances, situations, or conditions. Categories of overlays that may be useful include:"
    status: "candidate"
  - id: "REQ-SP800-53B-0097"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Communities of interest, industry sectors, coalitions, or partnerships, such as healthcare, law"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Categories of overlays that may be useful include:"
    statement: "• Communities of interest, industry sectors, coalitions, or partnerships, such as healthcare, law enforcement, intelligence, finance, manufacturing, transportation, energy, and allied collaboration or sharing"
    status: "candidate"
  - id: "REQ-SP800-53B-0098"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Information technologies and computing paradigms, such as virtualized systems, cloud, mobile, smart"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Categories of overlays that may be useful include:"
    statement: "• Information technologies and computing paradigms, such as virtualized systems, cloud, mobile, smart grid, and cross-domain solutions"
    status: "candidate"
  - id: "REQ-SP800-53B-0099"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Environments of operation, such as space, tactical, or sea"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Categories of overlays that may be useful include:"
    statement: "• Environments of operation, such as space, tactical, or sea"
    status: "candidate"
  - id: "REQ-SP800-53B-0100"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Types of systems and operating modes, such as industrial or process control"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Categories of overlays that may be useful include:"
    statement: "• Types of systems and operating modes, such as industrial or process control systems, weapons systems, single-user systems, stand-alone systems, and IoT devices and sensors"
    status: "candidate"
  - id: "REQ-SP800-53B-0101"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Types of missions or operations, such as counterterrorism, first responders, research, development,"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Categories of overlays that may be useful include:"
    statement: "• Types of missions or operations, such as counterterrorism, first responders, research, development, test, and evaluation"
    status: "candidate"
  - id: "REQ-SP800-53B-0102"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Types of threats, such as advanced persistent threats or insider threats"}
    kind: "lettered"
    locator: "OVERLAYS.•"
