  - {"page": 15, "locator": "INTRODUCTION", "reason": "short", "text": "S"}
  - {"page": 15, "locator": "1.1", "reason": "no-marker", "text": "An information system is a discrete set of information resources organized for the collection, processing, maintenance, use, sharing, dissemination, or disposition of information."}
  - {"page": 15, "locator": "1.1", "reason": "no-marker", "text": "[OMB A-130] defines security controls and privacy controls."}
  - {"page": 15, "locator": "1.1", "reason": "no-marker", "text": "A federal information system is an information system used or operated by an agency, a contractor of an agency, or another organization on behalf of an agency."}
  - {"page": 16, "locator": "1.2", "reason": "lead-in", "text": "This publication is intended to serve a diverse audience, including:"}
  - {"page": 17, "locator": "1.6", "reason": "lead-in", "text": "The remainder of this special publication is organized as follows:"}
  - {"page": 17, "locator": "1.6.•", "reason": "lead-in", "text": "• Supporting appendices include:"}
  - {"page": 17, "locator": "1.6", "reason": "no-marker", "text": "[SP 800-30] provides guidance on the risk assessment process."}
  - {"page": 17, "locator": "1.6", "reason": "no-marker", "text": "[IR 8062] introduces privacy risk assessment concepts."}
  - {"page": 17, "locator": "1.6", "reason": "no-marker", "text": "[OMB A-130] establishes policy for the planning, budgeting, governance, acquisition, and management of federal information, personnel, equipment, funds, IT resources, and supporting infrastructure and services."}
  - {"page": 17, "locator": "1.6", "reason": "no-marker", "text": "Unless otherwise stated, all references to NIST publications refer to the most recent version of those publications."}
  - {"page": 18, "locator": "1.6.-", "reason": "label-only", "text": "- Appendix B: Acronyms"}
  - {"page": 18, "locator": "1.6.-", "reason": "label-only", "text": "- Appendix C: Overlay Guidance"}
  - {"page": 19, "locator": "THE FUNDAMENTALS", "reason": "short", "text": "T"}
  - {"page": 20, "locator": "2.2", "reason": "short", "text": "Security Control Baselines"}
  - {"page": 20, "locator": "2.2", "reason": "no-marker", "text": "[CNSSI 1253] provides security categorization and control selection guidance for national security systems."}
  - {"page": 20, "locator": "2.2", "reason": "no-marker", "text": "NIST SP 800-60 (Volumes 1 and 2) [SP 800-60-1] [SP 800-60-2] provides guidance for the assignment of security categories to information systems. [SP 800-37] provides guidance for the specific tasks of the Risk Management Framework (RMF) Categorize step."}
  - {"page": 21, "locator": "2.2", "reason": "short", "text": "Privacy Control Baseline"}
  - {"page": 21, "locator": "2.2", "reason": "no-marker", "text": "Specialization refers to the modification of controls or control enhancements (including organization-defined parameters), or supplemental guidance to allow an organization to further refine the control baseline to address specific requirements, technologies, mission or business functions, or environments of operation. To address the need for specialized sets of controls for communities of interest, systems, and organizations, the overlay concept is introduced. For more information on overlays, see Appendix C."}
  - {"page": 21, "locator": "2.2", "reason": "short", "text": "See footnote 16."}
  - {"page": 22, "locator": "2.3", "reason": "no-marker", "text": "Articulating the underlying assumptions is a key element in the Risk Framing step of the risk management process described in [SP 800-39] and reinforced in the Prepare step in [SP 800-37]. Specific assumptions that underlie the control baselines in Chapter Three include:"}
  - {"page": 22, "locator": "2.3", "reason": "no-marker", "text": "If any of these assumptions apply, then additional controls from [SP 800-53] are likely needed to ensure adequate protection—a situation that can also be effectively addressed by applying the tailoring guidance in Section 2.4 (specifically, security control supplementation) and the results of organization- and system-level assessments of risk."}
  - {"page": 22, "locator": "2.3", "reason": "no-marker", "text": "The control baselines consider the nature of threats to the extent feasible given the dynamic nature of threats."}
  - {"page": 22, "locator": "2.3", "reason": "no-marker", "text": "Persistent data/information refers to data/information with utility for a relatively long duration (e.g., days, weeks)."}
  - {"page": 22, "locator": "2.3", "reason": "no-marker", "text": "See NIST SP 800-59 [SP 800-59] and CNSS Instruction 1253 [CNSSI 1253]."}
  - {"page": 23, "locator": "2.4", "reason": "no-marker", "text": "It is inappropriate for organizations to tailor out security or privacy controls that pertain to applicable federal legislative, regulatory, or policy requirements."}
  - {"page": 23, "locator": "2.4", "reason": "no-marker", "text": "See Section 2.2, Privacy Control Baseline, for additional guidance on tailoring privacy controls."}
  - {"page": 23, "locator": "2.4", "reason": "no-marker", "text": "See [SP 800-37], Task P-4, Organizationally-Tailored Control Baselines and Cybersecurity Framework Profiles (Optional), for additional guidance on tailoring control baselines for organization-wide use. See [SP 800-37], Task S-2, Control Tailoring, for additional guidance on tailoring control baselines for systems and environments of operation."}
  - {"page": 23, "locator": "2.4", "reason": "no-marker", "text": "[SP 800-18] provides guidance on developing system security plans. Guidance on developing privacy and supply chain risk management plans is forthcoming."}
  - {"page": 24, "locator": "2.4", "reason": "no-marker", "text": "Identifying and Designating Common Controls"}
  - {"page": 24, "locator": "2.4", "reason": "short", "text": "Applying Scoping Considerations"}
  - {"page": 24, "locator": "2.4", "reason": "no-marker", "text": "See the Organizational Prepare Step, Task P-5, Common Control Identification, in [SP 800-37] for more information about organizational decisions on designating common controls. See Section 2.3 in [SP 800-53] for more information about common controls as a control implementation approach."}
  - {"page": 24, "locator": "2.4", "reason": "no-marker", "text": "The scoping considerations listed in this section are examples and not intended to limit organizations in rendering risk-based decisions based on other organization-defined considerations with appropriate justification or rationale."}
  - {"page": 24, "locator": "2.4", "reason": "not-normative", "text": "For example, auditing controls are typically applied to components of a system that provide auditing capabilities and are not necessarily applied to every user-level component within the organization."}
  - {"page": 25, "locator": "2.4.-", "reason": "label-only", "text": "- Operational and Environmental Considerations"}
  - {"page": 25, "locator": "2.4.-", "reason": "label-only", "text": "- Technology Considerations"}
  - {"page": 25, "locator": "2.4.-", "reason": "label-only", "text": "- Mission and Business Considerations"}
  - {"page": 25, "locator": "2.4.-", "reason": "label-only", "text": "- Security Objective Considerations"}
  - {"page": 25, "locator": "2.4", "reason": "no-marker", "text": "is supported by an organizational assessment of risk, and does not adversely affect the level of protection for the security-relevant information within the system."}
  - {"page": 27, "locator": "Supplementing Control Baselines", "reason": "no-marker", "text": "Providing Additional Specification Information for Control Implementation"}
  - {"page": 28, "locator": "2.5", "reason": "not-normative", "text": "As the number of controls in [SP 800-53] grows in response to an increasingly sophisticated threat space, it is important for organizations to have the ability to describe key capabilities needed to protect organizational missions and business functions, and to subsequently select controls that—if properly designed, developed, and implemented—produce such capabilities. The use of capabilities simplifies how the protection problem is viewed conceptually. Using the construct of a capability provides a method of grouping controls that are employed for a common purpose or to achieve a common objective. For example, the grouping of controls is an important consideration when assessing controls for effectiveness.37"}
  - {"page": 28, "locator": "2.5", "reason": "no-marker", "text": "NIST Interagency Report 8011, Vol. 1 [IR 8011 v1], describes grouping controls by purpose to facilitate automated control assessments."}
