    statement: "• Types of threats, such as advanced persistent threats or insider threats"
    status: "candidate"
  - id: "REQ-SP800-53B-0103"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Statutory or regulatory requirements, such as the Foreign Intelligence Surveillance Act, Health"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Categories of overlays that may be useful include:"
    statement: "• Statutory or regulatory requirements, such as the Foreign Intelligence Surveillance Act, Health Insurance Portability and Accountability Act, FISMA, and Privacy Act"
    status: "candidate"
  - id: "REQ-SP800-53B-0104"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Overlays provide uniformity and efficiency of control selection by presenting tailoring options"}
    kind: "modal"
    locator: "OVERLAYS"
    context: "ADDITIONAL CUSTOMIZATION OPTIONS FOR CONTROL BASELINES Categories of overlays that may be useful include:"
    statement: "Overlays provide uniformity and efficiency of control selection by presenting tailoring options developed by security and privacy experts and other subject matter experts to system owners responsible for implementing and maintaining such systems. There are many options that can be used to construct overlays, depending on the specificity desired by the overlay developers. Some overlays may be very specific with respect to the hardware, firmware, and software that form the key components of the targeted system types and the environments in which the systems operate. Other overlays may be more abstract in order to be applicable to a larger class of systems that may be deployed in different operational environments."
    status: "candidate"
  - id: "REQ-SP800-53B-0105"
    citation: {"ref": "SP800-53B", "page": 82, "anchor": "Overlays can be published independently in a variety of venues and publications,"}
    kind: "should"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Overlays can be published independently in a variety of venues and publications, including OMB policies, CNSS Instructions, NIST Special Publications, industry standards, and sector-specific guidance. The Security Control Overlay Repository (SCOR) provides stakeholders with a platform for voluntarily sharing security control overlays. To learn more about the repository, including instructions on how to submit an overlay, and to obtain a list of published overlays, see [SCOR]."
    status: "candidate"
  - id: "REQ-SP800-53B-0106"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "Organizations may use the following outline when developing overlays.41 The outline is"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations may use the following outline when developing overlays.41 The outline is provided as an example only. Organizations may use any format based on specific organizational needs and the type of overlay being developed. The level of detail included in the overlay is at the discretion of the organization or community of interest initiating the overlay but should be of sufficient breadth and depth to provide an appropriate justification and rationale for the overlay, including any risk-based decisions made during the overlay development process. The example overlay outline includes the following sections:"
    status: "candidate"
  - id: "REQ-SP800-53B-0107"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "Overlay control specifications"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "PUBLICATION OF OVERLAYS The example overlay outline includes the following sections:"
    statement: "• Overlay control specifications"
    status: "candidate"
  - id: "REQ-SP800-53B-0108"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "Terms and definitions"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "PUBLICATION OF OVERLAYS The example overlay outline includes the following sections:"
    statement: "• Terms and definitions"
    status: "candidate"
  - id: "REQ-SP800-53B-0109"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "Additional information or instructions"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "PUBLICATION OF OVERLAYS The example overlay outline includes the following sections:"
    statement: "• Additional information or instructions"
    status: "candidate"
  - id: "REQ-SP800-53B-0110"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "Organizations identify the overlay by providing a unique name for the overlay,"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations identify the overlay by providing a unique name for the overlay, a version number and date, the version of [SP 800-53] used to create the overlay, other documentation used to create the overlay, author or authoring group and point of contact, and type of organizational approval received. Organizations define how long the overlay is to be in effect and any events that may trigger an update to the overlay other than changes to [SP 800-53] or organization-specific guidance. If there are no unique events that can trigger an update for the overlay, the identification section provides that notation."
    status: "candidate"
  - id: "REQ-SP800-53B-0111"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "A description of the physical environment where the systems, system components, or"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "PUBLICATION OF OVERLAYS Organizations describe the characteristics that define the intended use of the overlay in order to help potential users select the most appropriate overlay for their mission or"
    statement: "• A description of the physical environment where the systems, system components, or technologies targeted by the overlay will be used or operate (e.g., inside a guarded building within the continental United States, in an unmanned space vehicle, while traveling for business to a foreign country that is known for attempting to gain access to sensitive or classified information, or in a mobile vehicle that is in close proximity to hostile entities)"
    status: "candidate"
  - id: "REQ-SP800-53B-0112"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "The type(s) of information that will be processed, stored, or transmitted by"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "PUBLICATION OF OVERLAYS Organizations describe the characteristics that define the intended use of the overlay in order to help potential users select the most appropriate overlay for their mission or"
    statement: "• The type(s) of information that will be processed, stored, or transmitted by the systems, system components, or technologies targeted by the overlay (e.g., personal identity and authentication information; financial management information; facilities, fleet, and equipment management information; defense and national security information; system development information)"
    status: "candidate"
  - id: "REQ-SP800-53B-0113"
    citation: {"ref": "SP800-53B", "page": 83, "anchor": "While organizations are encouraged to use the overlay concept, the development of"}
    kind: "should"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS Organizations describe the characteristics that define the intended use of the overlay in order to help potential users select the most appropriate overlay for their mission or"
    statement: "While organizations are encouraged to use the overlay concept, the development of widely divergent overlays on the same topic may prove to be counterproductive. The overlay concept is most effective when communities of interest work together to create consensus-based overlays that are not duplicative."
    status: "candidate"
  - id: "REQ-SP800-53B-0114"
    citation: {"ref": "SP800-53B", "page": 84, "anchor": "The functionality within the targeted systems, system components, or technologies or the"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "PUBLICATION OF OVERLAYS"
    statement: "• The functionality within the targeted systems, system components, or technologies or the types of systems (e.g., stand-alone systems, industrial or process control systems, or cross-domain systems)"
    status: "candidate"
  - id: "REQ-SP800-53B-0115"
    citation: {"ref": "SP800-53B", "page": 84, "anchor": "Other characteristics related to the overlay that are intended to protect organizational"}
    kind: "lettered"
    locator: "OVERLAYS.•"
    context: "PUBLICATION OF OVERLAYS"
    statement: "• Other characteristics related to the overlay that are intended to protect organizational mission or business functions, systems, information, or individuals from a specific set of threats that may not be addressed by the assumptions described in Section 2.3."
    status: "candidate"
  - id: "REQ-SP800-53B-0116"
    citation: {"ref": "SP800-53B", "page": 84, "anchor": "Organizations provide criteria to help users of the overlay in determining whether"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations provide criteria to help users of the overlay in determining whether the overlay applies to a particular system, system component, technology, or environment of operation. Typical formats may include a list of questions or a decision tree based on the description of the characteristics of the overlay target (including associated applications) and its environment of operation at the level of specificity appropriate to the overlay."
    status: "candidate"
  - id: "REQ-SP800-53B-0117"
    citation: {"ref": "SP800-53B", "page": 84, "anchor": "Organizations provide a brief summary of the characteristics of the overlay. The"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations provide a brief summary of the characteristics of the overlay. The summary may include the controls and control enhancements that are affected by the overlay; an indication of which controls and control enhancements are selected or not selected based on the specific characteristics and assumptions in the overlay, the tailoring guidance provided in Section 2.4, or any organization-specific guidance; the selected controls and control enhancements, including parameter values; and references to applicable laws, executive orders, directives, instructions, regulations, policies, or standards."
    status: "candidate"
  - id: "REQ-SP800-53B-0118"
    citation: {"ref": "SP800-53B", "page": 84, "anchor": "Organizations provide a comprehensive expression of the controls and control enhancements in"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations provide a comprehensive expression of the controls and control enhancements in the overlay as part of the tailoring process. This may include the justification for selecting or not selecting a specific control or control enhancement; modifications to the control discussion section that address the characteristics of the overlay and the environments in which the overlay is intended to be used; unique parameter values for control selection or assignment operations; specific statutory or regulatory requirements (above and beyond FISMA) that are met by a control or control enhancement; recommendations for compensating controls, as appropriate; and guidance that extends the capability of the control or control enhancement by specifying additional functionality, altering the strength of mechanism, or adding or limiting implementation options."
    status: "candidate"
  - id: "REQ-SP800-53B-0119"
    citation: {"ref": "SP800-53B", "page": 84, "anchor": "Organizations provide information to system owners and authorizing officials to consider during"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations provide information to system owners and authorizing officials to consider during the tailoring process when determining the set of controls and control enhancements applicable to their specific systems, system components, or technologies. This is especially important for overlays that are used in an environment of operation different from the one assumed by the control baselines in Chapter Three. In addition, organizations can provide guidance on the use of multiple overlays applied to a control baseline and address any potential conflicts that may arise between the controls in the baselines and overlay specifications."
    status: "candidate"
  - id: "REQ-SP800-53B-0120"
    citation: {"ref": "SP800-53B", "page": 85, "anchor": "Organizations provide any terms and associated definitions that are unique and relevant"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations provide any terms and associated definitions that are unique and relevant to the overlay. If there are no unique terms or definitions for the overlay, that is stated in this section."
    status: "candidate"
  - id: "REQ-SP800-53B-0121"
    citation: {"ref": "SP800-53B", "page": 85, "anchor": "Organizations provide any additional information or instructions relevant to the overlay not"}
    kind: "indicative"
    locator: "OVERLAYS"
    context: "PUBLICATION OF OVERLAYS"
    statement: "Organizations provide any additional information or instructions relevant to the overlay not covered in the previous sections."
    status: "candidate"
