# Reviewed exceptions to the evidence fan-out cap (FW-REQ-003): a target that proves more
# than rmf_tool.conformance.rules.FAN_OUT_CAP requirements, with its limit and the reason.
schema_version: 1
fan_out_exceptions: []
# Documents more than rmf_tool.conformance.rules.TRIAGE_DOC_SHARE of whose real requirements are
# retired (noise marked not-a-requirement does not count),
# however the statuses were set (FW-REQ-004): one record per document, approved by the user.
retirements:
  - ref: DODI8530.01
    reason: "Enclosure 2 assigns duties to OSD offices, agencies and commands that produce nothing a run consumes. Fable's audit of batch 1 confirmed this on merit (17 of 18 sampled); approved under the decision of 2026-11-01, listed for reversal at p13."
    approved_by: user
  - ref: SP800-137A
    reason: "The ISCM program assessment's internal procedure: only what a run uses is modelled (decision of 2026-11-01). Fable's audit of batch 1 confirmed this on merit; listed for reversal at p13."
    approved_by: user
  - ref: DODI5000.81
    reason: "Urgent Capability Acquisition process: acquisition is modelled at its RMF touchpoints only (ADR-0005, decisions of 2026-11-01), so duties no RMF run consumes or produces are deferred. 81 of the 82 retired requirements are those deferrals."
    approved_by: user
# Documents more than rmf_tool.conformance.rules.NOISE_DOC_SHARE of whose live entries are marked
# not-a-requirement (FW-REQ-004): one record per document, approved by the user.
noise:
  - ref: SP800-137A
    reason: "Expository NIST text: extraction takes every bullet and table cell. Fable's audit of batch 1 confirmed this on merit: 207 of 217 noise entries hold no duty word. Listed for reversal at p13."
    approved_by: user
  - ref: SP800-53AR5
    reason: "Expository NIST text with figure rows taken as entries. Fable's audit of batch 1 confirmed this on merit (10 of 10 sampled). Listed for reversal at p13."
    approved_by: user
