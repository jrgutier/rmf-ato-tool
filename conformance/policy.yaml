    reason: "Section 2 assigns VEP and VDP staffing and oversight to OSD, NSA, DC3, CJCS and USCYBERCOM, internal procedure of bodies whose output the run uses. Fable's audit of batch 2 confirmed this on merit (14 of 15 sampled). Listed for reversal at p13."
