# Chapter 3 phrases (casefolded) mapped to framework entities. `entities`: the task must hold all
# of them. `any_of`: one is enough, for a phrase that itself says "or". `omit`: no entity, with the
# rationale. Inputs are read from a task's inputs and consults, outputs from outputs, primary roles
# from raci R and A, supporting roles from any raci letter (FW-TASK-002).
# `planned` names entity IDs a work item will add. They may appear below until the entity exists;
# then FW-TASK-002 requires dropping them from planned.
