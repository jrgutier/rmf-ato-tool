      - {pages: [42, 102], note: "Chapter 3: task statements, discussion and the outcome tables; the task fields are the pin"}
      - {pages: [133, 144], note: "Appendix D: roles and responsibilities"}
      - {pages: [158, 183], note: "Appendices F to H: authorization, boundaries, summary"}
    excluded:
      - {pages: [1, 19], reason: "Front matter: cover, authority, abstract, acknowledgements, executive summary, table of contents."}
      - {pages: [103, 132], reason: "Appendix A references, B glossary, C acronyms."}
      - {pages: [145, 157], reason: "Appendix E restates the Chapter 3 tasks, responsibilities and supporting roles in tables; the pin holds that structure."}
