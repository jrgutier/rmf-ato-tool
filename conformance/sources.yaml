# How each reference enters the requirements register (`rmf conformance extract`). Every PDF
# and web reference in references/index.yaml has one entry; FW-REQ-001 checks both directions.
# Modes:
#   statement  lettered and bulleted items, table rows, and requirement sentences (modal,
#              should, indicative, imperative; see rmf_tool.conformance.extract.classify)
#   pin        SP 800-37r2: Chapter 3 task fields through conformance/nist-tasks.yaml, and
#              statement scopes for everything else, Chapter 3 discussion included
#   catalog    a mechanical ID set compared on every re-extraction, plus statement scopes for
#              the prose chapters
#   excluded   nothing to extract (a web page with no local copy); basis says why
# Every page of an imported document is in exactly one scope or one exclusion, each with its
# reason (FW-REQ-001). A scope that yields fewer than one entry per four pages fails FW-REQ-005
# unless it says why it is `sparse`. A document that is not status: ok in the index is
# unassessed, has no requirements file, and declares its scopes at import.
schema_version: 1
documents:
  # --- NIST: the process and its catalogs ------------------------------------------------
  - ref: SP800-37R2
    mode: pin
    basis: The 47 task blocks are structured data (the pin); their discussion paragraphs, chapters 1 and 2 and the appendices are prose with role-indicative requirements.
    scopes:
      - {pages: [20, 41], note: "Chapters 1 and 2, including 2.8 SCRM"}
      - {pages: [42, 102], note: "Chapter 3: task statements, discussion and the outcome tables; the task fields are the pin"}
      - {pages: [133, 144], note: "Appendix D: roles and responsibilities"}
      - {pages: [158, 183], note: "Appendices F to H: authorization, boundaries, summary"}
    excluded:
      - {pages: [1, 19], reason: "Front matter: cover, authority, abstract, acknowledgements, executive summary, table of contents."}
      - {pages: [103, 132], reason: "Appendix A references, B glossary, C acronyms."}
      - {pages: [145, 157], reason: "Appendix E restates the Chapter 3 tasks, responsibilities and supporting roles in tables; the pin holds that structure."}
