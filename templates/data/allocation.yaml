# runs/<run-id>/artifacts/data/allocation.yaml: generated by `rmf schema template`;
# replace every <<FILL>>; `rmf schema show` lists the optional fields.
allocations:
  - control_id: '<<FILL: control_id, matching ^[a-z]{2}-\d{1,2}(?:\.\d{1,2})?$>>'
    type: system-specific  # or: hybrid, common, program-management
    components:
      - '<<FILL: System elements the control is allocated to, matching ^(CMP-[A-Z0-9-]+|this-system)$>>'
    sources:
      - '<<FILL: sources, matching ^(INT-\d{3}\.A\d+|ASM-(?:[A-Z]+-)?\d{3}|product/[^\s#]+(?:#[A-Za-z0-9_.-]+)?|ART-[A-Z]+(?:-[A-Z]+)*)$>>'
