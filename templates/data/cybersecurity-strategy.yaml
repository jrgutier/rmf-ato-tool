# Template: artifacts/data/cybersecurity-strategy.yaml (P-14; schema cybersecurity-strategy).
# CSSTRAT-001 to CSSTRAT-003 judge it; playbooks/P/P-14.md says how to fill it from the CSS.
program:
  # acat: II  # ID | IB | IC | II | III | none; only when the run holds no protection.yaml
  bcat: none  # I | II | III for a defense business system (PW-DBS); none otherwise
  mission: other  # mission-critical | mission-essential | other
  # decision_points: [{id: DP-DBS-SOLUTION, date: "2026-01-01"}]  # only without protection.yaml
  contract_awards: []  # {id, date, authorized_at?}: awards are protection.yaml's when it exists; authorized_at names the milestone decision that authorized one
strategy:
  id: CSS-001
  version: "1.0"
  date: "2026-01-15"  # on or before the first authorization decision
  prepared_by: PER-ISSM  # the program staff member the PM delegated to
  documented_in: [ppp-appendix, acquisition-strategy]  # ppp-appendix | acquisition-strategy | stand-alone (stand-alone without a PPP)
  based_on: [cssr-requirements, threats, derived-requirements, performance-specifications, operational-use]
  threat_information:  # at least one from the Intelligence Community
    - {id: TA-001, from: intelligence-community, date: "2026-01-10"}
  activities:  # at least one per phase of the pathway (framework/pathways.yaml phases)
    - {id: CSA-1, activity: Categorize the system and select the baseline, phase: PH-MSA, status: planned}  # planned | in-progress | complete
  rmf:
    incorporated: true
    ato_informed_by: How the cybersecurity testing informs the ATO decision.
  contested_environment: How the system operates in a cyber-contested environment.
  rmf_integration: How the RMF runs inside the program office's acquisition and engineering processes.
  # recurring_assessments: [supply-chain, development-environment, processes-and-tools, continuous-automated-testing]  # PW-SWP
# acquisition_strategy: {id: AS-001, includes_css: true, approval: {authority: DA, date: "2026-01-20"}}  # PW-SWP
approvals: []  # {authority: DoD-CIO | Component-CIO, version, date, before: decision point or award}
reviews: []  # {id, date, by: [PER-PM], before?, prompted_by: [decision-point | contract-award | threat-assessment | continuous-monitoring | change], coordinated_with?, ao_validation?: {by, date}, no_validation_reason?}
sources: [ASM-001]
