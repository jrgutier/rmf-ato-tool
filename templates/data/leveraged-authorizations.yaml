# Template: artifacts/data/leveraged-authorizations.yaml (C-1; schema
# leveraged-authorizations). One record per separately authorized provider whose controls the
# system inherits; write `leveraged_authorizations: []` when there are none. SYSD-005 judges
# the service and its agreement.
leveraged_authorizations:
  - id: LA-01
    title: "<<FILL: authorization name>>"
    provider: PRV-01  # <<FILL: the provider's PRV-## ID from org-context.yaml providers>>
    date_authorized: "2026-01-01"  # the provider's decision date
    decision: AD-ATO  # AD-ATO | AD-ATOC | ...
    arrangement: organizational-system  # common-control-provider | organizational-system | external-service
    authorization_termination_date: "2029-01-01"
    ao_aware: {official: PER-AO, date: "2026-01-02"}  # an organizational system (MLEV-001)
    service:
      kind: internal  # internal (provided within DoD): an SLA | external: an interagency agreement, statement of work or contract
      agreement:
        instrument: sla  # sla | interagency-agreement | statement-of-work | contract
        reference: "<<FILL: agreement identifier>>"
        enterprise: true  # a DoD enterprise-level agreement, used when possible
        security_requirements: true  # it incorporates the DoDI 8500.01 security control requirements
    sources: [INT-001.A1]
    package_review:  # not for a common control provider; before the decision that relies on it (RECIP-001)
      date: "2026-01-10"
      factors:  # time-elapsed | environment | impact-level | risk-tolerance | other
        - {factor: time-elapsed, finding: "<<FILL: what the review found>>"}
      integration:  # every boundary component naming this record as its leveraged_authorization
        - {component: CMP-EXAMPLE, risk: "<<FILL: the risk of integrating it with the system>>"}
      overlays: []  # every overlay of the categorization: {overlay, consideration}
    additional_controls: []  # controls added to reduce risk: in the baseline and implemented (RECIP-002)
    # granting_support: {ended: "2027-01-01", continued: true, authorization: AUTH-002}  # RECIP-003:
    #   once the Granting organization stops supporting it, continued use needs a full authorization
