# runs/<run-id>/artifacts/data/conmon.yaml: generated by `rmf schema template`;
# replace every <<FILL>>; `rmf schema show` lists the optional fields.
frequencies:
  - family: '<<FILL: family, matching ^[a-z]{2}$>>'
    frequency: continuous  # or: daily, weekly, monthly, quarterly, semi-annually, annually, event-driven
    method: '<<FILL: method>>'
    responsible: '<<FILL: responsible, matching ^PER-[A-Z0-9]+$>>'
ongoing_authorization:
  time_trigger_days: '<<FILL: time_trigger_days>>'
  event_triggers:
    - '<<FILL: event_triggers>>'
reporting:
  recipients:
    - '<<FILL: recipients, matching ^PER-[A-Z0-9]+$>>'
  frequency: continuous  # or: monthly, quarterly, annually
sources:
  - '<<FILL: sources, matching ^(INT-\d{3}\.A\d+|ASM-(?:[A-Z]+-)?\d{3}|product/[^\s#]+(?:#[A-Za-z0-9_.-]+)?|ART-[A-Z]+(?:-[A-Z]+)*)$>>'
