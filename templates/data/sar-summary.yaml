# Template: artifacts/data/sar-summary.yaml (A-3; schema sar-summary). Written whole (INV-8).
# What the SAR states about the assessment as a whole (CNSSI 1254 Annex C, SP 800-53A
# Appendix D); PENT-002 and SAREL-001 read it. Replace every <<FILL: ...>> and example value.
# A synthetic run names no real or invented person: use role titles as names ("SCA team
# lead (role title)"), contact@example.mil and 000-000-0000 for contacts.
# penetration_test: when the planned test supplements a reused earlier one, name it in
# `supplements: RR-###` and keep its exploits in `reused_exploited` with their state.
assessment_type: authorization  # developmental-test-and-evaluation | independent-verification-and-validation | authorization | reauthorization | audit | ongoing-monitoring | post-remediation
environment:
  description: "<<FILL: the environment where the most recent testing took place>>"
  site_location: "<<FILL: site location>>"
  security: "<<FILL: security system of the site>>"
  supporting_equipment: ["<<FILL: emulator, sniffer, analyzer, traffic generator or simulator used>>"]
  external_interfaces: ["<<FILL: external interface active during the test event>>"]
  personnel:
    - {name: "<<FILL: name>>", organization: "<<FILL: organization>>", role: "<<FILL: role in the assessment event>>"}
assumptions: ["<<FILL: assumption the SCA applied>>"]
limitations: ["<<FILL: limitation or constraint, such as inherited controls or the test environment>>"]
issues: []  # issues associated with the assumptions and limitations
sca:
  name: "<<FILL: SCA name>>"
  organization: "<<FILL: SCA organization>>"
  role: "<<FILL: role or title>>"
  email: "<<FILL: email>>"
  phone: "<<FILL: phone>>"
sites:
  - {site: "<<FILL: site assessed>>", dates: ["2026-01-01"]}
