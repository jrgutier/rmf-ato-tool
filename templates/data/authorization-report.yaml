# Template: artifacts/data/authorization-report.yaml (R-5; schema authorization-report). What
# happens to the decision and package after R-4; AUTHRPT-001 judges it (playbooks/R/R-5.md).
decision_ref: AUTH-001  # the ledger record reported
receipt:
  received_by: PER-PM  # PER-PM for a system, PER-CCP for common controls
  received: "2026-01-02"  # on or after the decision
  terms_acknowledged: true
retention:
  retained_by: PER-PM
  policy: "<<FILL: the record retention policy>>"
  retain_until: "2030-01-01"  # not before the termination date
available_to: [PER-PM, PER-ISSM]  # every official in the record's conveyed_to, and others
operational_awareness:  # DoDI 8510.01 4.4.a(9), (10)
  informed: [PER-OPCDR]  # verified to have the cyber risk information on the system
  affected_requirements:  # [] when no risk affects an operational requirement
    - risk: RSK-001  # a risk of artifacts/data/rar.yaml
      requirement: "<<FILL: the operational requirement the risk affects>>"
      coordinated_with: [PER-OPCDR, PER-PM]  # the commanders and PER-PM or PER-MDA
      sources: [ART-AODM]
  sources: [ART-AODM]
marking: CUI  # CUI | CONFIDENTIAL | SECRET | TOP SECRET
terms_verification:
  verified_by: PER-AO
  frequency_days: 90
assessment_records:  # kept for the audit trail, reuse and repeatability
  - artifacts/data/sap.yaml
  - artifacts/sar/results/ac.yaml
sources: [ART-AODM]
