# Template: artifacts/data/boundary.yaml (P-11, updated by C-1; schema boundary).
# Replace every <<FILL: ...>> and example value (playbooks/P/P-11.md). Every diagram's file
# exists in the run, and the diagrams together show what SP 800-18r2 lists for what the run
# records (SUBS-002). Never list a this-system component; the CLI adds it.
authorization_boundary:
  description: "<<FILL: what is inside, what is outside, and where the edge is>>"
  diagrams:
    - path: product/boundary-diagram.png
      caption: "<<FILL: what the diagram shows>>"
      shows: [components, internal-boundaries, third-party-services, physical-protections, isolated-components]
  sources: [INT-001.A1]
network_architecture:
  description: "<<FILL: networks, interfaces and permitted traffic>>"
  diagrams:
    - path: product/network-diagram.png
      caption: "<<FILL: what the diagram shows>>"
      shows: [components, external-connections, routing-controls, data-stores]
  sources: [INT-001.A1]
data_flow:
  description: "<<FILL: each flow across or inside the boundary and its protection>>"
  diagrams:
    - path: product/data-flow-diagram.png
      caption: "<<FILL: what the diagram shows>>"
      shows: [data-types, data-direction, external-flows]
  sources: [INT-001.A1]
# A complex system adds (SUBS-001):
# subsystems: [{id: SUB-EXAMPLE, title, components: [CMP-EXAMPLE], c, i, a, status}]
# subsystem_interfaces: [{between: [SUB-A, SUB-B], connected: true, flows, controls: [sc-7]}]
components:
  - id: CMP-EXAMPLE
    title: "<<FILL: component name>>"
    type: software  # hardware | software | service | interconnection | system | policy | physical | process-procedure | plan | guidance | standard | validation
    description: "<<FILL: what the component does>>"
    status: under-development  # operational | under-development | under-major-modification | disposition | other
    sources: [INT-001.A1]
  - id: CMP-EXTERNAL-EXAMPLE
    title: "<<FILL: external system or service>>"
    type: service
    description: "<<FILL: what it provides to the system and how it is authorized>>"
    status: operational
    external: true
    # leveraged_authorization: LA-01  # set by C-1 when a leveraged authorization covers it
    sources: [INT-001.A1]
# P-16 adds the DODIN position and the external connections (CONN-001 to CONN-004).
dodin:
  position: inside  # inside | outside (outside needs the waiver below)
  # waiver: {reviewed_by: DOD-CIO, reviewed: "2025-01-10", granted: "2025-02-01", reference: "<<FILL: waiver reference>>"}
  sources: [INT-001.A1]
connections:  # one per external interconnection, system or service; a peer reached through the
  # enclave's own DISN attachment is network: other, and the attachment is the disn connection
  - id: CONN-01
    component: CMP-EXTERNAL-EXAMPLE
    network: disn       # disn | mission-partner | other
    cross_domain: false
    detail:
      ports_protocols: "<<FILL: ports, protocols and services>>"
      data: "<<FILL: information exchanged and its sensitivity>>"
      direction: bidirectional  # inbound | outbound | bidirectional
    # cross_domain_solution:  # when cross_domain is true
    #   provider: disa-enterprise  # disa-enterprise | other
    #   component: CMP-CDS         # the CD service, an external component when DISA provides it
    #   considered: [disa-enterprise]
    #   rationale: "<<FILL: why it meets the cross-domain requirement>>"
    # mission_partner:  # when network is mission-partner
    #   partner: "<<FILL: non-DoD mission partner>>"
    #   sponsor: "<<FILL: sponsoring DoD Component>>"
    #   interconnection: dmz  # dmz | point-to-point
    #   dmz: "<<FILL: FED DMZ, REL DMZ or another>>"
    #   requirement_approved_by: [sponsor, DOD-CIO]
    #   fulfillment: in-progress  # in-progress | complete
    #   partner_package: sponsor  # sponsor | partner-assisted
    agreement: {instrument: isa, status: signed, reference: '<<FILL: agreement reference>>', date: '2026-01-01'}  # interim or draft is a weakness to carry
    approvals:  # DISA for the DISN; DOD-CIO and DISA for a mission partner; ISRMC or DSAWG for cross-domain or mission partner
      - {authority: DISA, status: requested, date: "2025-01-15", reference: "<<FILL: request reference>>", sources: [INT-001.A1]}
    sources: [INT-001.A1]
hosting:  # P-16: where the system is hosted and why (HOST-001)
  environment: decc  # decc | existing-enclave | cloud | program-facility | other
  decc: {status: hosted, reason: "<<FILL: why a DECC, or why it is operationally infeasible>>"}  # hosted | infeasible | cloud (cloud first, DoDI 5000.82)
  enclave_application: {status: not-possible, reason: "<<FILL: why it cannot be an application in an existing authorized enclave>>"}  # possible | not-possible; a major application under development or modification records not-possible
  cloud: {assessment: can-be-cloud-hosted, reason: "<<FILL: the cloud hosting assessment>>"}  # cloud-hosted | can-be-cloud-hosted | cannot-be-cloud-hosted
  enterprise_services: {considered: ["<<FILL: enterprise service or approved cloud environment>>"], outcome: "<<FILL: what was reused and why>>"}
  sources: [INT-001.A1]
