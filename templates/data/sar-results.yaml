# Template: artifacts/sar/results/<fam>.yaml (A-3; schema sar-results). One file per family,
# written whole; one determination per scoped control (playbooks/A/A-3.md).
family: ac
determinations:
  - control_id: ac-2
    result: other-than-satisfied  # satisfied | other-than-satisfied | not-evaluated | not-applicable
    methods: [examine, interview]  # examine | interview | test
    depth: focused  # the depth and coverage applied, not below the plan's (RIGR-002)
    coverage: focused
    summary: "<<FILL: the evidence examined, heard or tested and what it showed>>"
    finding_refs: [FND-001]  # required for other-than-satisfied
    statements:  # every determination statement of the control, from rmf catalog show
      - {id: "AC-02j.", result: other-than-satisfied}
    reused: []  # RR-### of sap.yaml this determination rests on
    sources: [INT-001.A1]
findings:
  - id: FND-001  # numbered across the whole run
    control_id: ac-2
    title: "<<FILL: one-line weakness>>"
    description: "<<FILL: what the control requires, what was observed, the evidence>>"
    status: open  # open | closed | risk-accepted
    severity: moderate  # very-low | low | moderate | high | very-high
    recommendation: "<<FILL: recommended remediation>>"
    affected_statements: ["AC-02j."]  # the parts of the control the finding affects
    state_difference: "<<FILL: how the actual state differs from the expected state>>"
    potential_compromise: [confidentiality]  # confidentiality | integrity | availability | privacy
    # triage (A-5): {action: poam, decided_by: PER-PM, significance: moderate, risk_basis: [ART-RA], rationale: ...}
    sources: [INT-001.A1]
