# Template: artifacts/data/cloud.yaml (S-4 once service-agreements.yaml names the cloud;
# M-2 adds events and deliverables; schema cloud). Written whole (INV-8). One checklist
# row per DTM 24-001 Table 1 activity and offering; performer.entity is cssp, dcrt,
# dow-entity, commercial, not-applicable (BCP rows at IL2 only) or none with a gap the AO
# accepts. nss_policies applies to a national security system. Delete the events,
# deliverables or uam you do not yet have only if no checklist row needs them.
# Who usually performs a Table 1 activity: under IaaS the tenant (dow-entity, the mission
# owner's program) runs the operating system, network security and logging inside the
# account; under PaaS the provider runs the platform and the tenant its workloads and
# configuration; under SaaS the provider runs nearly all. Only cssp, dcrt and the DoW-only
# keys constrain the performer. external_assessments is needed once a DCRT, DCAT, pentest or
# intrusion row has a performer; uam.legal_review and ao_decision only when user activity
# monitoring goes to a commercial performer; events (an assessment already held, even of a
# pre-production account on the same offering) and dcrt_reports are optional.
# service_model takes a list when the system uses the offering under several models.
