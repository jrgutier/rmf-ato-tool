# Template: artifacts/data/sap.yaml (A-2; schema sap). Reviewed controls and methods are
# derived by rmf build from baseline.json and the catalog (playbooks/A/A-2.md).
scope:
  include: baseline
  excluded_controls: []  # {control_id, rationale} only with the AODR's agreement
assessment_subjects:
  - type: component  # component | inventory-item | location | party | user
    include: all
team:
  - persona: PER-SCA
    role: "<<FILL: role on the assessment team>>"
    independent: true
    qualification: {basis: "<<FILL: what qualifies this assessor>>", verified_by: PER-CISO, verified: "2026-01-01"}
    # contract: {owner_involved: false, owner_can_influence: false}  # for contracted assessors
selection:  # Task A-1: the AO or AODR selects the team for the type of control assessment
  selected_by: PER-AO
  date: "2026-01-01"  # not after schedule.start
  assessment_type: security  # security | privacy | security-and-privacy (covers privacy when the system processes PII)
  expertise: "<<FILL: the skills and technical expertise the selection required>>"
assessor_independence:
  required: independent  # self-assessment | internal | independent
  determined_by: PER-AO
  rationale: "<<FILL: why this degree>>"
  basis: [ART-CAT, ART-RA]  # the categorization and the risk the degree rests on
  sufficiency: {determined_by: PER-AO, sufficient: true, date: "2026-01-01", rationale: "<<FILL: why the degree gives confidence in the results>>"}
  consulted: [PER-CIO, PER-PRIV, PER-CISO]  # whom the AO consulted on independence (INDEP-001)
  achieved_by: assessor  # assessor | independent-review (then `review: {by: [PER-...], situation: "..."}` names the independent team of experts that reviews the results)
objectives: "<<FILL: the objective of the control assessment>>"
level_of_effort: "<<FILL: the expected level of effort>>"
approval: {reviewed_by: PER-SCA, approved_by: PER-AO, date: "2026-01-01"}  # on or before schedule.start
preparation:  # SP 800-53A section 3.1, all dated on or before schedule.start
  informed_by: PER-PM  # the system owner
  officials_notified:
    - {persona: PER-AO, date: "2026-01-01"}
  resources: {allocated_by: PER-PM, allocated: "2026-01-01", description: "<<FILL: resources allocated>>"}
  access:  # one each: system, environment, documentation, records, artifacts, test-results
    - {to: system, provided_by: PER-PM, provided: "2026-01-01"}
  documentation_provided: [ART-SSP]
  elements:
    - {responsible_for: "<<FILL: what this element develops, documents or updates>>", persona: PER-ISSM}
  channels:
    - {among: [PER-AO, PER-ISSM], means: "<<FILL: how they stay in touch>>"}
  points_of_contact:
    - {persona: PER-ISSM, for: "<<FILL: what they arrange>>"}
  ambiguity_mechanism: {between: [PER-SCA, PER-ISSM], means: "<<FILL: how ambiguities are settled>>"}
  understanding: {summary: "<<FILL: the organization's operations and how the system supports them>>", sources: [ART-ORG-CONTEXT]}
rigor:  # what the rigor and scope of the assessment rest on (RIGR-001; SP 800-53A 1.1, 2.4, appendix C)
  categorization: ART-CAT
  # privacy_risk_assessment: ART-RA  # required when the system processes PII
  plans: [ART-SSP]  # the approved plans whose controls are assessed
  assurance_requirements:  # what the organization intends to meet; each procedure names one
    - id: AR-001
      requirement: "<<FILL: the assurance the organization intends to meet>>"
      specified_by: PER-AO  # a persona of the organization outside the team (PER-AO or PER-AODR)
      depth: focused  # the least depth and coverage meeting it: basic | focused | comprehensive
      coverage: focused
  direction:  # the organization's direction on the type, number and specific objects to assess
    by: PER-AO  # outside the team
    conferred_with: [PER-SCA]  # assessors conferred with
    factors: ["<<FILL: e.g. available resources, importance of the assessment>>"]
procedures:  # every scoped control in a record, each method once per control; several controls consolidate
  - id: PRC-001
    controls: [ac-2]
    methods: [examine, interview, test]
    objects: [specifications, mechanisms, activities, individuals]
    depth: focused  # basic | focused | comprehensive
    coverage: focused
    rationale: "<<FILL: why these methods and objects>>"
    risk_results: [ART-RA]
    adaptation: none  # none | system-specific | platform-specific | organization-specific
    sequence: 1
    assurance_requirement: AR-001
    sampling:  # one record per method: the types sampled (personas for interview) with a number each
      - {method: examine, types: [{type: specifications, number: 2}, {type: mechanisms, number: 2}, {type: activities, number: 2}], specific: [ART-SSP], selection: random-and-targeted, bias_control: "<<FILL: how bias is avoided>>"}
      - {method: interview, types: [{type: PER-ISSM, number: 1}], specific: ["<<FILL: the individuals deemed important>>"], selection: targeted, bias_control: "<<FILL: how bias is avoided>>"}
      - {method: test, types: [{type: mechanisms, number: 2}, {type: activities, number: 1}], specific: ["<<FILL: component ids>>"], selection: random-and-targeted, bias_control: "<<FILL>>", extent: [{measure: test cases, count: 10}]}  # extent: mechanism tests only; specific: focused or comprehensive coverage
optimization: {reviewed_by: PER-SCA, tailoring_guidance: "<<FILL: the organization's tailoring guidance, or that it gives none>>", notes: "<<FILL: how procedures were sequenced and consolidated>>"}
additional_procedures: []  # e.g. {id: APR-001, requirement: "Section 508 conformance of the web UI", statements: ["..."], methods: [test], objects: [mechanisms], rationale: "..."}, for anything outside SP 800-53
# RIGR-003: focused or comprehensive coverage needs `specific` objects on each sampling
# record, not only on comprehensive ones; each sampling record's `types` equal the
# procedure's objects for that method (personas for interview).
reuse_policy: {max_age_days: 365, source: ART-ORG-CONTEXT}  # or the CISO's or AO's answer stating it (INT-###.A#)
reused_results: []  # playbooks/A/A-2.md lists the fields; a result of lower independence than required needs corroboration: {by: PER-SCA, how: witnessed | reperformed, extent}
# assessed_environment: {kind: representative, representativeness: "<<FILL: why pre-production stands for production>>", confirmation_procedure: PRC-001}  # when evidence comes from a twin of the authorized instance
external_providers: []  # one for each external boundary component and leveraged authorization; a connected system whose controls are not inherited is relationship: interconnection
# privacy:  # a system processing PII (PASM-001)
#   assessors: [PER-PRIV]
#   controls: [pt-2, pt-3]
#   methodology: {identified_by: PER-PRIV, methods: [examine, interview], metrics: "<<FILL: what shows the privacy controls effective>>"}
#   sources: [INT-001.A1]
schedule:
  start: "2026-01-01"
  end: "2026-01-31"
  events:
    - date: "2026-01-01"
      description: "<<FILL: event>>"
      kind: kickoff  # kickoff | dt-e | ot-e | scan | interview | out-brief | penetration-test | other
      live: false  # true on a live network or with operational data: needs an IATT first (AODM-006)
# penetration_test:  # ca-8 selected, a cATO, or the organization adds one (PENT-001)
#   scope:
#     environment: ["<<FILL: facilities, users, organizational groups subject to testing>>"]
#     attack_surface: ["<<FILL: servers, applications, networks, awareness posture>>"]
#     threat_sources: ["<<FILL: attacker profile to simulate>>"]
#     objectives: ["<<FILL: objective of the simulated attacker>>"]
#     level_of_effort: "<<FILL: time and resources, given cost and time available>>"
#     rules_of_engagement: "<<FILL: rules of engagement>>"
#   components: [CMP-EXAMPLE]
#   assessor: {party: third-party, qualified: true}
#   guidance: NIST SP 800-115
#   # a cATO in the ledger: environments: [development, operational], option: cora  # cora | red-blue-team | other (with exception_to_policy)
rules_of_engagement: "<<FILL: what assessors may do, on which systems, when, and who is notified>>"
sources: [INT-001.A1]
