# Template: artifacts/data/rar.yaml (R-2; schema rar). Every open finding appears in a risk;
# level comes from SP 800-30 Table I-2 (playbooks/R/R-2.md).
risks:
  - id: RSK-001
    title: "<<FILL: risk title>>"
    description: "<<FILL: threat, weakness and effect>>"
    likelihood: moderate  # very-low | low | moderate | high | very-high
    impact: moderate
    level: moderate
    priority: 1  # unique; a higher level never follows a lower one (ASMT-012)
    finding_refs: [FND-001]
    poam_refs: [POAM-001]
    response: mitigate  # accept | mitigate | avoid | share | transfer
    courses_of_action:  # R-3, M-3: one selected, matching `response`; a lone course needs
      # `adequacy: adequate`, and an inadequate one is refined or gains alternatives (RAR-003)
      - id: COA-01
        response: mitigate
        description: "<<FILL: the course of action>>"
        effectiveness: "<<FILL: expected effectiveness>>"
        feasibility: "<<FILL: anticipated feasibility>>"
        cost: "<<FILL: cost across the period it is followed>>"
        mission_impact: "<<FILL: effect on the mission>>"
        privacy_impact: "<<FILL: effect on privacy and civil liberties>>"
        selected: true
        rationale: "<<FILL: the trade-off>>"
      - id: COA-02
        response: accept
        description: "<<FILL: the alternative>>"
        effectiveness: "<<FILL: expected effectiveness>>"
        feasibility: "<<FILL: anticipated feasibility>>"
        cost: "<<FILL: cost across the period it is followed>>"
        mission_impact: "<<FILL: effect on the mission>>"
        privacy_impact: "<<FILL: effect on privacy and civil liberties>>"
        selected: false
        rationale: "<<FILL: why it was rejected>>"
    selected_response:  # R-3, M-3
      responsible: PER-PM
      effectiveness_criteria: "<<FILL: indicators and thresholds>>"
      dependencies: []
      timeline: "2026-12-31"
      monitoring_plan: "<<FILL: how effectiveness is monitored>>"
      triggers: ["<<FILL: what returns the risk to evaluation>>"]
      interim_measures: "<<FILL: measures until the response is in place>>"
      informed: [PER-AO]
    sources: [INT-001.A1]
overall_risk: moderate
determination:  # R-2 (RAR-002)
  by: PER-AODR  # PER-AO or PER-AODR
  date: "2026-01-01"
  collaborated_with: [PER-CISO]  # add PER-PRIV for a system processing PII
  technical_advisor: PER-ISSM
  rests_on: [ART-RA]
  # risk_executive_input: "<<FILL: only what the risk executive (function) provided>>"
  sources: [INT-001.A1]
sources: [ART-SAR, ART-POAM]
