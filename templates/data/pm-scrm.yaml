# Template: artifacts/data/pm-scrm.yaml (P-14; schema pm-scrm). PMSCRM-001 and PMSCRM-002 judge it;
# playbooks/P/P-14.md says how to fill it from DoDI 5000.90 3.4.
started: "2026-01-01"  # before the first contract award
risk_tolerance:
  level: high  # high | moderate | low | very-low (DoDI 5000.90 Table 1)
  procurement: simplified  # simplified (high) | structured (moderate) | engineered (low) | assured (very-low)
  basis: Why this level fits the importance of the system purchased.
actions: [foci-caution, approved-products-lists, industry-standards, balance-risk-mission]  # every Table 1 action of the level and the levels above
not_taken: []  # {action, reason}
market_research:
  - {vendor: Vendor name, date: "2026-01-01", findings: OEM or authorized reseller; past intrusions; CMMC level.}
illumination:
  maintained: false
  considered: What was weighed in deciding whether to illuminate the supply chain.
tac_requests: []  # {id, subjects, to: DIA-SCRM-TAC | other-CI, date}
reports: []  # {id, request, rating: critical | high | medium | low, flagged, mitigation?}
mission_critical: []  # {item: PPP critical item, measure: assured-supplier | scrm-countermeasure, detail}
unvalidated_products: []  # {item: inventory item, reason: not-available | not-cost-effective, detail}
threat_information: []  # {id, kind: all-source | other, date}
mitigations: []  # {id, kind: acquisition | engineering, measure, informed_by: [threat_information ids]}
sources: [ASM-001]
