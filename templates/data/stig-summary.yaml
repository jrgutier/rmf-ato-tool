# runs/<run-id>/artifacts/data/stig-summary.yaml: generated by `rmf schema template`;
# replace every <<FILL>>; `rmf schema show` lists the optional fields.
benchmarks:
  - id: '<<FILL: id, matching ^BM-\d{2,3}$>>'
    title: '<<FILL: title>>'
    version: '<<FILL: version>>'
    applies_to:
      - '<<FILL: applies_to, matching ^INV-\d{3}$>>'
not_applicable:
  - inventory_item: '<<FILL: inventory_item, matching ^INV-\d{3}$>>'
    rationale: '<<FILL: rationale>>'
findings:
  - id: '<<FILL: id, matching ^STG-\d{3}$>>'
    benchmark: '<<FILL: benchmark, matching ^BM-\d{2,3}$>>'
    rule_id: '<<FILL: rule_id, matching ^S?V-\d+>>'
    category: CAT I  # or: CAT II, CAT III
    inventory_item: '<<FILL: inventory_item, matching ^INV-\d{3}$>>'
    title: '<<FILL: title>>'
    status: open  # or: not-a-finding, not-applicable, not-reviewed, exception
