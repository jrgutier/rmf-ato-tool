# Template: artifacts/poam/items.yaml (A-6; schema poam-items). One item per weakness; every
# field below is required by POAM-FLD-001 (playbooks/A/A-6.md).
items:
  - id: POAM-001
    finding_ref: FND-001  # FND-###, STG-### or EXF-###
    control_id: ac-2
    weakness: "<<FILL: one-line weakness>>"
    description: "<<FILL: what is wrong and its effect>>"
    source_of_weakness: sar  # sar | stig | conmon | inspection | audit | other
    recommended_completion: after-authorization  # before-authorization | after-authorization
    severity: moderate  # very-low | low | moderate | high | very-high
    residual_risk: moderate
    risk_level: moderate  # the RAR level once a risk links this item
    criticality: moderate
    mitigation_approach: "<<FILL: the proposed risk mitigation approach>>"
    priority: 1  # unique; a higher risk goes first
    identified: {event: security-control-assessment, reviewing_organization: "<<FILL: who reviewed>>", date: "2026-01-15"}
    status: planned  # planned | ongoing | delayed | completed | risk-accepted
    point_of_contact: PER-PM
    resources_required: "<<FILL: people, money or release needed>>"
    scheduled_completion: "2026-12-31"
    milestones:
      - description: "<<FILL: milestone>>"
        due: "2026-12-01"
    milestone_changes: []  # {milestone, new_date, reason}; the original dates never change
    comments: "<<FILL: related STIG findings or notes; must be used if the item is delayed>>"
    sources: [ART-SAR, INT-001.A1]
ao_review:  # the AO reviews the POA&M to agree the remediation actions (MPOA-001)
  by: PER-AO
  reviewed: "2026-01-01"
  agreed: true
