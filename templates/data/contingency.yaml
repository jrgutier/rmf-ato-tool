# Template: artifacts/data/contingency.yaml (S-4; schema contingency). Written whole (INV-8). The
# schema names every value; optional fields it lists are left out here.
policy:
  statement: '<<FILL: Contingency planning policy statement, with its objectives, framework and responsibilities>>'
  senior_management: '<<FILL: Senior management support for the contingency program and policy>>'
  impact_levels: '<<FILL: FIPS 199 impact levels and contingency controls the policy reflects>>'
  activation_criteria:
  - '<<FILL: activation criteria>>'
  backup:
    frequency: '<<FILL: Minimum backup frequency>>'
    scope: '<<FILL: Backup scope, incremental, differential or full>>'
    storage: '<<FILL: Location, file naming, media rotation and offsite transport of backed-up data>>'
scope:
  plan_type: iscp
  related_plans:
  - plan: '<<FILL: plan>>'
    kind: '<<FILL: kind>>'
    version: '<<FILL: version>>'
    location: '<<FILL: location>>'
    poc: '<<FILL: poc>>'
bia:
  processes:
  - id: '<<FILL: id>>'
    name: '<<FILL: name>>'
    mtd_hours: 1
    rto_hours: 1
    rpo_hours: 1
    reprocessing_hours: 1
    priority: 1
    essential_function: none
  resources:
  - resource: '<<FILL: resource>>'
    kind: facility
    supports: '<<FILL: supports>>'
    depends_on: '<<FILL: depends on>>'
  impact_categories:
  - category: '<<FILL: category>>'
    scale: '<<FILL: scale>>'
  objectives:
    availability: '<<FILL: Impact on availability, the basis of the BIA>>'
    integrity: '<<FILL: Impact on integrity>>'
    confidentiality: '<<FILL: Impact on confidentiality>>'
  pocs:
  - poc: '<<FILL: poc>>'
    relation: internal
  cost_balance: '<<FILL: Optimum recovery point balancing the cost of inoperability against the cost of
    recovery>>'
  associated_priorities: '<<FILL: Impacts and priorities of associated systems, LANs, WANs and telecommunications
    the BIA gives>>'
  continuity_input: '<<FILL: Telecommunications and FCD-2 continuity inputs to the system BIA>>'
preventive:
  power: '<<FILL: Power protection: UPS, generator and fuel>>'
  standardization: '<<FILL: Standardized hardware, software and peripherals and off-the-shelf compatibility>>'
  telecommunications_diagrams: '<<FILL: Physical and logical telecommunications diagrams kept up to date>>'
  single_points_of_failure: '<<FILL: Single points of failure and the redundant cables, routers and devices
    that answer them>>'
  remote_access: '<<FILL: Remote access as a contingency capability, with bandwidth and security controls>>'
  wan: '<<FILL: WAN contingency solutions, communications links and provider redundancy>>'
  design: '<<FILL: Technical measures designed in: redundancy, robustness, power and data mirroring>>'
  failover: '<<FILL: Failover mode and redundancy of critical components>>'
strategy:
  fit: '<<FILL: How the methods and strategies answer the disruption impacts and allowable downtimes of
    the BIA>>'
  availability_fit: '<<FILL: How the strategy matches the FIPS 199 availability impact level and system
    life cycle>>'
  risk_basis: '<<FILL: Risk-informed decisions behind the resilience methods>>'
  alternatives:
  - name: '<<FILL: name>>'
    cost: '<<FILL: cost>>'
    max_downtime_hours: 1
    security: '<<FILL: security>>'
    priority: '<<FILL: priority>>'
    chosen: false
  high_availability: '<<FILL: High availability: whether it is used, why the system warrants it, and its
    extension to an alternate location>>'
  equipment:
  - item: '<<FILL: item>>'
    model_or_version: '<<FILL: model or version>>'
    specifications: '<<FILL: specifications>>'
    quantity: 1
  budget: '<<FILL: Cost of each option weighed against the budget, with the cost-benefit analysis>>'
  data_protection: '<<FILL: Encryption of stored and backup data and the key management that keeps it
    readable>>'
  dynamic_allocation:
    mechanism: '<<FILL: Mechanism that reallocates information resources>>'
    proved_by: '<<FILL: Exercise that proved the allocation>>'
sites:
  offsite_store:
    selection: '<<FILL: Offsite storage facility selection against geography, accessibility, security,
      environment and cost>>'
    security: '<<FILL: Security capabilities of the shipping method, storage facility and personnel>>'
  alternate_site:
    type: cold
    selection: '<<FILL: Alternate site choice against core requirements, the BIA, downtime and FIPS 199
      level>>'
    location: '<<FILL: Geographic hazard, transport time and mode to the site>>'
    control_compatibility: '<<FILL: Security, management, operational and technical controls compatible
      with the prospective site>>'
  agreements:
  - kind: commercial-contract
    party: '<<FILL: party>>'
    terms: '<<FILL: terms>>'
    legal_review: '<<FILL: legal review>>'
    partner_testing: '<<FILL: partner testing>>'
  vendor_agreements: '<<FILL: Vendor SLAs: response time and priority for replacement equipment>>'
backup:
  solution: '<<FILL: Backup solution chosen on device compatibility, storage volume, software and medium>>'
  system_software: '<<FILL: System software, drivers, licenses and image loads stored at an alternate
    location>>'
  client_data: '<<FILL: Critical user data on central servers, automated client backup and guidance on
    saving data>>'
  stand_alone: '<<FILL: Backup of stand-alone systems and the storage of their media at an alternate site>>'
  multi_server: '<<FILL: Centralized storage and a dedicated backup network in a multi-server environment>>'
teams:
  activation_authority:
    role: '<<FILL: Designated authority that activates the plan>>'
    successor: '<<FILL: Successor to the activating authority>>'
  leadership:
    director: '<<FILL: ISCP Director with overall management responsibility>>'
    coordinator: '<<FILL: ISCP Coordinator overseeing recovery and reconstitution>>'
    owner_poc: '<<FILL: System owner or business unit point of contact>>'
    technical_poc: '<<FILL: Technical recovery point of contact>>'
  teams:
  - name: '<<FILL: name>>'
    leader: '<<FILL: leader>>'
    alternate_leader: '<<FILL: alternate leader>>'
    members: '<<FILL: members>>'
    skills: '<<FILL: skills>>'
  vendors:
  - name: '<<FILL: name>>'
    contact: '<<FILL: contact>>'
    contract: '<<FILL: contract>>'
    response: '<<FILL: response>>'
    vetting: '<<FILL: vetting>>'
activation:
  notification:
    with_notice: '<<FILL: Notification procedures with prior notice of an outage>>'
    without_notice: '<<FILL: Notification procedures with no notice, in and out of business hours>>'
    method: '<<FILL: Who starts notification, the sequence and the method, and its limits such as email>>'
    unreachable: '<<FILL: What is done when a person cannot be contacted, with primary and alternate contact
      methods>>'
    external_pocs: '<<FILL: External organizations and interconnected system partners notified, each with
      a POC>>'
    content: '<<FILL: Type of information relayed to those notified>>'
  outage_assessment:
    team: '<<FILL: Outage Assessment Team, first notified>>'
    areas: '<<FILL: Minimum areas: cause, potential for further damage, affected area, infrastructure,
      equipment, items to replace, time to restore>>'
    follow_up: '<<FILL: How the assessment result updates notification and the planned response>>'
recovery:
  format: '<<FILL: Stepwise, sequential, checklist procedures that assume no step>>'
  tailoring: '<<FILL: How the plan balances detail with flexibility for this system>>'
  sequence: '<<FILL: Recovery sequence tied to BIA priorities and the MTD>>'
  actions_by_team: '<<FILL: Procedures assigned to each recovery team>>'
  escalation: '<<FILL: Events, thresholds and triggers that escalate, and the notices that follow>>'
  shipment: '<<FILL: Shipment of backup media, hardware, plans and software to an alternate site>>'
  supporting_systems: '<<FILL: Contact and procedures of a system this one relies on for recovery>>'
  alternate_processing: '<<FILL: Alternate manual or technical processing procedures>>'
  activation_summary: '<<FILL: Who may activate the plan and the recovery activities this strategy sets>>'
reconstitution:
  data_validation: '<<FILL: Validation data testing>>'
  functionality_validation: '<<FILL: Validation functionality testing>>'
  test_plan: '<<FILL: System validation test plan run before the system returns to users>>'
  cleanup: '<<FILL: Cleanup of temporary recovery locations, supplies, manuals and media>>'
  full_backup: '<<FILL: Full system backup after recovery>>'
  offsite_return: '<<FILL: Return of retrieved media to offsite data storage>>'
  return_to_normal: '<<FILL: Declaration of return to normal, and the significant change determination
    with the concurrence of the Authorizing Official>>'
  event_documentation: '<<FILL: Recovery events documented with actions, problems and lessons learned>>'
  after_action: '<<FILL: After Action Report responsibilities>>'
training:
  covers: '<<FILL: What training covers: roles, skills and plan elements>>'
  frequency_days: 1
  new_personnel: '<<FILL: Training of personnel newly appointed to ISCP roles>>'
testing:
  backup_media: '<<FILL: Regular testing of backup media, at the alternate site where applicable>>'
  readiness: '<<FILL: First TT&E event in Implementation/Assessment and how the plan stays ready>>'
  triggers: '<<FILL: What triggers a TT&E event: period, organizational or system change, new guidance>>'
  improvement: '<<FILL: How results update and improve the plan>>'
exercises:
- id: '<<FILL: id>>'
  type: tabletop
  frequency_days: 1
  objectives: '<<FILL: objectives>>'
  success_criteria: '<<FILL: success criteria>>'
  scope: '<<FILL: scope>>'
  scenario: '<<FILL: scenario>>'
  logistics: '<<FILL: logistics>>'
  participants: '<<FILL: participants>>'
  schedule: '<<FILL: schedule>>'
  conditions:
  - benign
  tests:
  - '<<FILL: tests>>'
  loss: none
maintenance:
  review: '<<FILL: Review frequency, significant change triggers and the minimum review elements>>'
  copies: '<<FILL: Marking and distribution of the plan, record of copies, a copy at the alternate site
    and vital records stored with it>>'
  record_of_changes:
  - page: '<<FILL: page>>'
    comment: '<<FILL: comment>>'
    date: '2026-01-01'
  coordination: '<<FILL: Coordination on change with internal and external points of contact, and version
    control>>'
  supporting_information: '<<FILL: Supporting information checked for currency>>'
  change_response: '<<FILL: BIA updated on a significant change, and upkeep through disposal>>'
  approval: '<<FILL: Signed approval affirming the plan is complete and tested, and who keeps it maintained>>'
appendices:
  personnel_contacts: '<<FILL: Personnel contact list with an office and a non-office number>>'
  diagrams: '<<FILL: System, input and output diagrams or the SSP section they come from>>'
  inventory: '<<FILL: Hardware and software inventory the plan restores>>'
  interconnections: '<<FILL: Interconnections table: type of connection, information transferred and contact
    person>>'
  constraints: '<<FILL: Additional constraints and associated plans>>'
