# runs/<run-id>/artifacts/data/capabilities.yaml: generated by `rmf schema template`;
# replace every <<FILL>>; `rmf schema show` lists the optional fields.
capabilities:
  - id: '<<FILL: id, matching ^CAP-\d{2,3}$>>'
    name: '<<FILL: name>>'
    controls:
      - '<<FILL: The mapping of every individual control that supports the capability, matching ^[a-z]{2}-\d{1,2}(?:\.\d{1,2})?$>>'
    sources:
      - '<<FILL: sources, matching ^(INT-\d{3}\.A\d+|ASM-(?:[A-Z]+-)?\d{3}|product/[^\s#]+(?:#[A-Za-z0-9_.-]+)?|ART-[A-Z]+(?:-[A-Z]+)*)$>>'
