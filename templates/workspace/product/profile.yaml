# Proposed values only (schema framework/schema/product-profile.schema.json). RMF tasks
# confirm them in interviews and write the accepted values to the run's facts.yaml; nothing
# reads this file as a fact. Replace every value below with your program's proposal.
name: {{ slug }}
acronym: {{ slug | upper | replace("_", "-") | truncate(16, True, "") }}
description: >-
  One paragraph: what the system does, for whom, and where it operates.
pathway: PW-MCA          # an ID from framework/pathways.yaml
current_phase: PH-MSA    # an ID from framework/phases.yaml
proposed_categorization: {c: moderate, i: moderate, a: low}
proposed_overlays: []    # CNSSI 1253 overlay reference IDs, if any apply
pii: false
nss: true                # national security system: CNSSI 1253 applies
common_control_providers: []
fictional: false
