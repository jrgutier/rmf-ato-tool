# Acquisition life-cycle phases of the major capability acquisition pathway, the framework's
# spine (meta.spine_pathway), as defined in DoDI 5000.85 section 3.
phases:
  - id: PH-MSA
    name: Materiel Solution Analysis
    short: MSA
    order: 1
    purpose: >-
      Analyze materiel solutions to the validated capability need and select a preferred
      solution; start the RMF early, at system inception, so security requirements shape the
      solution rather than follow it. The system-level Prepare tasks and the Categorize step
      run here, so the approved categorization, the system risk assessment and the initial
      security and privacy requirements can inform the Milestone A acquisition strategy,
      program protection and test strategy.
    entry_milestone: MS-MDD
    exit_milestone: MS-A
    entry_criteria:
      - Materiel Development Decision made on a validated capability need.
      - A validated requirements document (ICD or equivalent) and the AoA study plan are
        available to the program (EXT-CAPDOC).
      - Organization-level Prepare outputs (P-1 to P-7) are in place or under way, so the
        system tasks can use the risk management strategy, common controls and organizational
        monitoring strategy.
    exit_criteria:
      - Preferred materiel solution selected and Milestone A approved.
      - RMF roles assigned, system-level Prepare tasks under way and the categorization approved
        (C-3) to inform the technology development strategy.
      - The system risk assessment (P-14) and the security and privacy requirements (P-15) are
        available to the cybersecurity strategy in the program protection plan.
      - The system is registered (P-18) and described (C-1).
    citations:
      - {ref: DODI8510.01, page: 20, anchor: "RMF activities must be initiated as early as possible in the DoD acquisition process"}
      - {ref: DODI5000.85, page: 11, anchor: "3.6. MSA PHASE."}
      - {ref: DODI5000.85, page: 12, anchor: "A proposed acquisition strategy, including intellectual property (IP), program protection", note: "Milestone A considers program protection and the test strategy."}
      - {ref: DODI5000.90, page: 10, anchor: "PMs must deploy cybersecurity risk analyses and controls mapping early in the system development"}
      - {ref: DODI5000.89, page: 15, anchor: "Develop a cybersecurity strategy as part of the program protection plan"}
      - {ref: SP800-37R2, page: 181, anchor: "Risk management activities begin early in the SDLC and continue throughout the life cycle", note: "Initiation in the SP 800-37r2 SDLC."}
  - id: PH-TMRR
    name: Technology Maturation and Risk Reduction
    short: TMRR
    order: 2
    purpose: >-
      Reduce technology, engineering, integration and life-cycle cost risk and mature the
      requirements; select and tailor controls and document the planned implementations before
      the preliminary design is fixed. Program security and program protection requirements are
      evaluated in this phase, and the allocated security requirements go into the development
      RFP.
    entry_milestone: MS-A
    exit_milestone: MS-B
    entry_criteria:
      - Milestone A approved.
      - Security categorization approved (C-3), so control selection (S-1) can start.
    exit_criteria:
      - Preliminary design reviewed (RV-PDR) with security controls allocated to the design.
      - Security plan and continuous monitoring strategy approved (S-6) to support Milestone B.
      - Security and privacy requirements allocated (P-17) and carried into the development RFP
        (MS-DRFPRD).
      - The TEMP identifies the cybersecurity test events and data that the RMF assessments
        will reuse.
    citations:
      - {ref: DODI8510.01, page: 20, anchor: "Requirements, development, procurement, and T&E processes must apply the RMF"}
      - {ref: DODI5000.85, page: 13, anchor: "3.8. TMRR PHASE."}
      - {ref: DODI5000.85, page: 13, anchor: "Program security and program protection requirements will be evaluated"}
      - {ref: DODI5000.85, page: 14, anchor: "that program security has been accommodated"}
      - {ref: DODI5000.89, page: 16, anchor: "Use the cybersecurity strategy as a source document to develop the TEMP"}
      - {ref: DODI8510.01, page: 10, anchor: "Ensure acquisition programs develop evaluation metrics for DT&E and OT&E, and continuous monitoring"}
  - id: PH-EMD
    name: Engineering and Manufacturing Development
    short: EMD
    order: 3
    purpose: >-
      Develop, build and test the system; implement the controls, assess them through
      developer, developmental and operational test events, and reach an authorization decision
      before production and fielding. EMD verifies that all requirements, including those for
      security, have been met.
    entry_milestone: MS-B
    exit_milestone: MS-C
    entry_criteria:
      - Milestone B approved; approved security plan in place.
      - Controls allocated to system elements (S-3), so the detailed design (RV-CDR) can build
        them in.
    exit_criteria:
      - Controls implemented and assessed; POA&M established.
      - Authorization decision (AD-ATO or AD-ATOC) supports Milestone C; any testing on live
        networks was covered by an AD-IATT.
      - Cybersecurity developmental test results (cooperative vulnerability identification and
        adversarial testing) have been given to the AO to inform the authorization decision.
      - Before the ATO, the PM has reviewed a threat assessment of the system issued by the
        Intelligence Community within the previous 12 months.
    citations:
      - {ref: DODI8510.01, page: 4, anchor: "The RMF process will inform acquisition processes for all DoD systems"}
      - {ref: DODI5000.85, page: 15, anchor: "3.11. EMD PHASE."}
      - {ref: DODI5000.85, page: 15, anchor: "including those for security, have been met"}
      - {ref: DODI5000.85, page: 16, anchor: "program security remains uncompromised"}
      - {ref: DODI5000.89, page: 16, anchor: "Plan to conduct contractor and government integrated tailored cooperative vulnerability identification"}
      - {ref: DODI8510.01, page: 10, anchor: "Provide cybersecurity developmental, operational, and sustainment test and evaluation"}
      - {ref: DODI5000.90, page: 11, anchor: "Before a program receives an ATO, the PM will review the program's most recent threat assessment"}
  - id: PH-PD
    name: Production and Deployment
    short: P&D
    order: 4
    purpose: >-
      Produce and field the system; operational test and evaluation confirms security in the
      intended environment, and the system operates only under a current authorization. The
      Monitor step starts with the first fielded units.
    entry_milestone: MS-C
    exit_milestone: MS-FRP
    entry_criteria:
      - Milestone C approved with a valid authorization for the systems being fielded.
    exit_criteria:
      - Full-rate production or full deployment decision made; initial operational capability
        reached under a current ATO.
      - Operational cybersecurity assessments (CVPA and adversarial assessment) completed, and
        the mission-critical vulnerabilities they found eliminated before fielding.
      - Continuous monitoring (M-1 to M-5) is running for the fielded configuration.
    citations:
      - {ref: DODI8510.01, page: 10, anchor: "Operate only authorized DoD systems with a current authorization to operate"}
      - {ref: DODI5000.85, page: 17, anchor: "3.13. P&D PHASE."}
      - {ref: DODI5000.89, page: 16, anchor: "cooperative vulnerability and penetration assessment (CVPA) and an adversarial assessment"}
      - {ref: DODI5000.89, page: 17, anchor: "each of which should then be eliminated before fielding the system"}
      - {ref: DODI5000.85, page: 17, anchor: "informed by consideration of any new validated threat environments"}
  - id: PH-OS
    name: Operations and Support
    short: O&S
    order: 5
    purpose: >-
      Sustain the fielded system; monitor controls continuously, manage changes, keep the
      authorization current (or under ongoing authorization) and dispose of the system securely.
      Systems whose monitoring is near real time may move to a continuous authorization
      (AD-CATO).
    entry_milestone: MS-IOC
    exit_milestone: null
    entry_criteria:
      - First system(s) fielded, under a current authorization.
      - The continuous monitoring strategy (S-5) is approved and the monitoring roles are staffed.
    exit_criteria:
      - System removed from operation with its disposal strategy executed (M-7).
    citations:
      - {ref: DODI8510.01, page: 7, anchor: "coordinating tradeoff decisions during sustainment of systems"}
      - {ref: DODI5000.85, page: 18, anchor: "The O&S phase begins upon fielding of the first system"}
      - {ref: DODI5000.85, page: 18, anchor: "3.15. OPERATIONS AND SUPPORT (O&S) PHASE."}
      - {ref: DODI5000.85, page: 18, anchor: "sustains the system over its life cycle, including disposal"}
      - {ref: DODI5000.90, page: 11, anchor: "update their ATO at least every 3 years depending on risk"}
      - {ref: DODI5000.90, page: 14, anchor: "continually assess and mitigate the program's cybersecurity risk by monitoring"}
