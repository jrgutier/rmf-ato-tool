# Acquisition life-cycle phases of the major capability acquisition pathway, the framework's
# spine (meta.spine_pathway), as defined in DoDI 5000.85 section 3.
phases:
  - id: PH-MSA
    name: Materiel Solution Analysis
    short: MSA
    order: 1
    purpose: >-
      Analyze materiel solutions to the validated capability need and select a preferred
      solution; start the RMF early, at system inception, so security requirements shape the
      solution rather than follow it.
    entry_milestone: MS-MDD
    exit_milestone: MS-A
    entry_criteria:
      - Materiel Development Decision made on a validated capability need.
    exit_criteria:
      - Preferred materiel solution selected and Milestone A approved.
      - RMF roles assigned, system-level Prepare tasks under way and the categorization approved
        (C-3) to inform the technology development strategy.
    citations:
      - {ref: DODI8510.01, page: 20, anchor: "RMF activities must be initiated as early as possible in the DoD acquisition process"}
      - {ref: DODI5000.85, page: 11, anchor: "3.6. MSA PHASE."}
  - id: PH-TMRR
    name: Technology Maturation and Risk Reduction
    short: TMRR
    order: 2
    purpose: >-
      Reduce technology, engineering, integration and life-cycle cost risk and mature the
      requirements; select and tailor controls and document the planned implementations before
      the preliminary design is fixed.
    entry_milestone: MS-A
    exit_milestone: MS-B
    entry_criteria:
      - Milestone A approved.
    exit_criteria:
      - Preliminary design reviewed (RV-PDR) with security controls allocated to the design.
      - Security plan and continuous monitoring strategy approved (S-6) to support Milestone B.
    citations:
      - {ref: DODI8510.01, page: 20, anchor: "Requirements, development, procurement, and T&E processes must apply the RMF"}
      - {ref: DODI5000.85, page: 13, anchor: "3.8. TMRR PHASE."}
  - id: PH-EMD
    name: Engineering and Manufacturing Development
    short: EMD
    order: 3
    purpose: >-
      Develop, build and test the system; implement the controls, assess them through
      developer, developmental and operational test events, and reach an authorization decision
      before production and fielding.
    entry_milestone: MS-B
    exit_milestone: MS-C
    entry_criteria:
      - Milestone B approved; approved security plan in place.
    exit_criteria:
      - Controls implemented and assessed; POA&M established.
      - Authorization decision (AD-ATO or AD-ATOC) supports Milestone C; any testing on live
        networks was covered by an AD-IATT.
    citations:
      - {ref: DODI8510.01, page: 4, anchor: "The RMF process will inform acquisition processes for all DoD systems"}
      - {ref: DODI5000.85, page: 15, anchor: "3.11. EMD PHASE."}
  - id: PH-PD
    name: Production and Deployment
    short: P&D
    order: 4
    purpose: >-
      Produce and field the system; operational test and evaluation confirms security in the
      intended environment, and the system operates only under a current authorization.
    entry_milestone: MS-C
    exit_milestone: MS-FRP
    entry_criteria:
      - Milestone C approved with a valid authorization for the systems being fielded.
    exit_criteria:
      - Full-rate production or full deployment decision made; initial operational capability
        reached under a current ATO.
    citations:
      - {ref: DODI8510.01, page: 10, anchor: "Operate only authorized DoD systems with a current authorization to operate"}
      - {ref: DODI5000.85, page: 17, anchor: "3.13. P&D PHASE."}
  - id: PH-OS
    name: Operations and Support
    short: O&S
    order: 5
    purpose: >-
      Sustain the fielded system; monitor controls continuously, manage changes, keep the
      authorization current (or under ongoing authorization) and dispose of the system securely.
    entry_milestone: MS-IOC
    exit_milestone: null
    entry_criteria:
      - First system(s) fielded, under a current authorization.
    exit_criteria:
      - System removed from operation with its disposal strategy executed (M-7).
    citations:
      - {ref: DODI8510.01, page: 7, anchor: "coordinating tradeoff decisions during sustainment of systems"}
      - {ref: DODI5000.85, page: 18, anchor: "The O&S phase begins upon fielding of the first system"}
      - {ref: DODI5000.85, page: 18, anchor: "3.15. OPERATIONS AND SUPPORT (O&S) PHASE."}
