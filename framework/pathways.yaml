# Adaptive Acquisition Framework pathways (DoDI 5000.02). The RMF applies regardless of the
# pathway (DoDI 8510.01 3.1.c); PW-MCA is the spine whose phases this framework uses.
# `phases` lists the spine phases a pathway's activities roughly correspond to.
pathways:
  - id: PW-MCA
    name: Major Capability Acquisition
    short: MCA
    instruction: DoDI 5000.85
    phases: [PH-MSA, PH-TMRR, PH-EMD, PH-PD, PH-OS]
    description: >-
      Milestone-based acquisition of major systems through MSA, TMRR, EMD, P&D and O&S; the
      framework's phases, milestones and reviews follow this pathway.
    rmf_notes:
      - Tasks are aligned to its milestones and technical reviews as recorded on each task.
      - Prepare and Categorize run in MSA and are complete by Milestone A and the SRR; Select is
        complete by the PDR and Milestone B; Implement runs through EMD and the CDR; assessment
        planning is done by the TRR and the assessments use DT&E events; the authorization
        decision precedes Milestone C and IOC (an AD-IATT covers earlier testing on live
        networks); Monitor runs through O&S.
      - DoDI 5000.90 describes the PM's cybersecurity activities using this pathway, and the
        same concepts apply to the other pathways.
    citations:
      - {ref: DODI8510.01, page: 13, anchor: "regardless of acquisition pathway"}
      - {ref: DODI5000.02, page: 13, anchor: "c. Major Capability Acquisition."}
      - {ref: DODI8510.01, page: 20, anchor: "DoDI 5000.90 establishes policy for the acquisition PM"}
      - {ref: DODI5000.90, page: 13, anchor: "While this figure depicts the Major Capability Acquisition pathway, the concepts apply to all pathways"}
  - id: PW-SWP
    name: Software Acquisition
    short: SWP
    instruction: DoDI 5000.87
    phases: [PH-MSA, PH-TMRR, PH-EMD, PH-PD, PH-OS]
    description: >-
      Rapid, iterative delivery of software capability through a planning phase and an
      execution phase with frequent releases.
    rmf_notes:
      - Run the Prepare, Categorize and Select steps in the planning phase; implement, assess
        and authorize per release. DoDI 5000.90 limits cATO (AD-CATO) to the software and
        defense business system pathways, for products with robust automated monitoring.
      - The execution phase maximizes automated testing and security accreditation, so CI/CD
        pipeline results can feed control assessments (A-3) and ongoing assessments (M-2). The
        ATO alone is not enough to assess cybersecurity; cybersecurity T&E still applies.
      - A DevSecOps platform and its software factories need their own authorization; the AO's
        analysis covers the people, processes and tools used to build the software.
    decision_points:
      - id: DP-SWP-PATHWAY
        name: Decision to use the software acquisition pathway
        kind: decision-point
        authority: Decision authority (DA)
        purpose: >-
          The DA documents the decision and rationale for the program to use the pathway in an
          acquisition decision memorandum.
        citations:
          - {ref: DODI5000.87, page: 9, anchor: "The DA will document the decision and rationale for a program to use the software"}
      - id: DP-SWP-EXECUTION
        name: Entry into the execution phase
        kind: milestone
        authority: Decision authority (DA)
        purpose: >-
          The DA validates that the strategies, analysis and resources are in place to move from
          planning to execution; the approved CNS, user agreement, acquisition strategy, test
          strategy and cost estimate are required to enter.
        citations:
          - {ref: DODI5000.87, page: 10, anchor: "The approved artifacts required to enter the execution phase include the CNS"}
      - id: DP-SWP-MVCR
        name: Minimum viable capability release deployed
        kind: event
        authorization_gate: true
        authority: Program manager and sponsor
        purpose: >-
          The MVCR is deployed to an operational environment, within one year after funds are
          first obligated for an applications program.
        citations:
          - {ref: DODI5000.87, page: 16, anchor: "The MVCR for applications programs must be deployed to an operational environment"}
    citations:
      - {ref: DODI8510.01, page: 13, anchor: "regardless of acquisition pathway"}
      - {ref: DODI5000.02, page: 14, anchor: "d. Software Acquisition."}
      - {ref: DODI5000.87, page: 9, anchor: "3.2. PLANNING PHASE."}
      - {ref: DODI5000.90, page: 13, anchor: "a cATO may only be appropriate for programs in the Software and Defense Business System pathways"}
      - {ref: DODI5000.87, page: 16, anchor: "Programs will maximize use of automated software testing and security accreditation"}
      - {ref: DODI5000.89, page: 25, anchor: "which is a necessary but not sufficient mechanism to assess cybersecurity"}
      - {ref: DODCIO-DEVSECOPS, section: "3.3.1.2"}
      - {ref: DODCIO-DEVSECOPS, section: "3.1.4"}
  - id: PW-MTA
    name: Middle Tier of Acquisition
    short: MTA
    instruction: DoDI 5000.80
    phases: [PH-EMD, PH-PD]
    description: >-
      Rapid prototyping and rapid fielding outside the milestone process, within about five
      years.
    rmf_notes:
      - Compress Prepare through Select into prototype planning; an AD-IATT usually covers
        operational prototype demonstrations, and rapid fielding needs an ATO.
    citations:
      - {ref: DODI8510.01, page: 13, anchor: "regardless of acquisition pathway"}
      - {ref: DODI5000.02, page: 13, anchor: "b. MTA."}
      - {ref: DODI5000.80, page: 11, anchor: "3.1. RAPID PROTOTYPING."}
      - {ref: DODI5000.80, page: 11, anchor: "3.2. RAPID FIELDING."}
  - id: PW-UCA
    name: Urgent Capability Acquisition
    short: UCA
    instruction: DoDI 5000.81
    phases: [PH-EMD, PH-PD, PH-OS]
    description: Fielding of capabilities that fulfil urgent operational needs, in months rather than years.
    rmf_notes:
      - Systems without an ATO must still begin the RMF; use reciprocity and inherited
        controls to shorten assessment.
      - The PM, with the concurrence of the AO and the decision authority, can tailor the RMF
        process to reach an ATO commensurate with the program's cyber risk.
    decision_points:
      - id: DP-UCA-DEVELOPMENT
        name: Development milestone
        kind: milestone
        authority: Milestone decision authority (MDA)
        purpose: >-
          The MDA approves entry into development on the acquisition strategy and program
          baseline, including the assessment approach and the intermediate decision points.
        citations:
          - {ref: DODI5000.81, page: 14, anchor: "Entry into development is approved by the MDA"}
      - id: DP-UCA-PRODUCTION
        name: Production and deployment milestone
        kind: milestone
        authorization_gate: true
        authority: Milestone decision authority (MDA)
        purpose: >-
          The MDA approves entry into production and deployment, determines which deficiencies
          must be resolved and which risks can be accepted, and documents the production
          decision in an ADM.
        citations:
          - {ref: DODI5000.81, page: 15, anchor: "Entry into P&D is approved by the MDA"}
          - {ref: DODI5000.81, page: 16, anchor: "documents the production decision in an ADM"}
    citations:
      - {ref: DODI8510.01, page: 12, anchor: "Systems without an ATO must begin the RMF"}
      - {ref: DODI5000.02, page: 12, anchor: "a. Urgent Capability Acquisition."}
      - {ref: DODI5000.90, page: 12, anchor: "The PM, with concurrence from the AO and DA, can tailor the RMF process"}
  - id: PW-DBS
    name: Defense Business Systems
    short: DBS
    instruction: DoDI 5000.75
    phases: [PH-MSA, PH-TMRR, PH-EMD, PH-PD, PH-OS]
    description: Acquisition of business systems through capability need identification, solution analysis, functional requirements, acquisition and testing, deployment and capability support.
    rmf_notes:
      - Map the RMF steps to the business capability acquisition cycle phases; privacy tasks
        are usually significant because business systems often process PII. AD-CATO is
        available to this pathway (DoDI 5000.90).
      - Operational cybersecurity testing for business systems adds cyber economic threat
        analysis, cyber economic scenario testing and financial transaction analysis; plan the
        assessment (A-2) to reuse those results.
    decision_points:
      - id: DP-DBS-SOLUTION
        name: Solution Analysis ATP
        kind: decision-point
        authority: CMO decision authority
        purpose: >-
          Approves the capability requirements and the work of the solution analysis phase.
        citations:
          - {ref: DODI5000.75, page: 17, anchor: "(2) Solution Analysis ATP."}
      - id: DP-DBS-FUNCTIONAL
        name: Functional Requirements ATP
        kind: decision-point
        authority: CMO (requirements validation) and MDA (materiel solution)
        purpose: >-
          Validates the functional requirements and selects the materiel solution; later
          decision points are set in the capability implementation plan.
        citations:
          - {ref: DODI5000.75, page: 17, anchor: "(2) Functional Requirements ATP."}
      - id: DP-DBS-ACQUISITION
        name: Acquisition ATP
        kind: milestone
        authority: Milestone decision authority (MDA)
        purpose: >-
          Approves the acquisition approach and the release of the solicitation.
        citations:
          - {ref: DODI5000.75, page: 19, anchor: "(2) Acquisition ATP."}
      - id: DP-DBS-LIMITED
        name: Limited Deployment ATP
        kind: milestone
        authorization_gate: true
        authority: Milestone decision authority (MDA)
        purpose: >-
          Approves deployment of a release to limited portions of the user community after its
          testing.
        citations:
          - {ref: DODI5000.75, page: 20, anchor: "(2) Limited Deployment ATP(s)."}
      - id: DP-DBS-FULL
        name: Full Deployment ATP
        kind: milestone
        authorization_gate: true
        authority: Milestone decision authority (MDA)
        purpose: >-
          Approves deployment to the whole user community after limited deployment and
          operational testing.
        citations:
          - {ref: DODI5000.75, page: 20, anchor: "(3) Full Deployment ATP."}
      - id: DP-DBS-SUPPORT
        name: Capability Support ATP
        kind: decision-point
        authority: Functional sponsor
        purpose: >-
          The functional sponsor accepts full deployment and approves the transition to
          capability support.
        citations:
          - {ref: DODI5000.75, page: 20, anchor: "(4) Capability Support ATP."}
    citations:
      - {ref: DODI8510.01, page: 13, anchor: "regardless of acquisition pathway"}
      - {ref: DODI5000.02, page: 15, anchor: "e. Defense Business Systems (DBS) Acquisition."}
      - {ref: DODI5000.90, page: 13, anchor: "a cATO may only be appropriate for programs in the Software and Defense Business System pathways"}
      - {ref: DODI5000.89, page: 16, anchor: "add cyber economic threat analysis, cyber economic scenario testing, and financial transaction analysis"}
  - id: PW-AOS
    name: Acquisition of Services
    short: AoS
    instruction: DoDI 5000.74
    phases: [PH-PD, PH-OS]
    description: Acquisition of services from the private sector, including IT and cloud services.
    rmf_notes:
      - Services do not receive an ATO themselves when they are below the system level; they
        complete the Assess Only process, and contracts carry the cybersecurity requirements.
    decision_points:
      - id: DP-AOS-REQUIREMENTS
        name: Services requirements approval
        kind: decision-point
        authority: Services Requirements Review Board chair
        purpose: >-
          The SRRB chair approves the services requirement before financial or contracting
          actions start.
        citations:
          - {ref: DODI5000.74, page: 18, anchor: "Requirements approval should be obtained from the assigned SRRB chair"}
      - id: DP-AOS-EXECUTION
        name: Execution of the acquisition strategy or a contract option
        kind: decision-point
        authority: Decision authority
        purpose: >-
          Requirements are validated again before the approved acquisition strategy or a
          contract option is executed.
        citations:
          - {ref: DODI5000.74, page: 18, anchor: "Validate requirements before execution of approved acquisition strategy"}
    citations:
      - {ref: DODI8510.01, page: 13, anchor: "do not require an ATO"}
      - {ref: DODI5000.02, page: 16, anchor: "f. Defense Acquisition of Services."}
      - {ref: DODI8510.01, page: 10, anchor: "Require that contracts and other agreements include specific requirements"}
