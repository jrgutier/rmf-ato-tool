# Milestones, decision points and life-cycle events of the major capability acquisition
# pathway. `phase` is the phase the event closes or occurs in; `order` is the global sequence.
milestones:
  - id: MS-MDD
    name: Materiel Development Decision
    short: MDD
    kind: decision-point
    phase: PH-MSA
    order: 1
    decision_authority: PER-MDA
    purpose: >-
      Enter the acquisition process on a validated capability need; the point at which RMF
      activities should begin (system inception). The organization-level Prepare tasks
      (P-1 to P-7) should already be in place so that system-level Prepare starts with the
      program; a program that starts the RMF late must still complete it.
    citations:
      - {ref: DODI8510.01, page: 12, anchor: "The program initiates or updates RMF activities during system inception"}
      - {ref: DODI5000.85, page: 11, anchor: "The MDD is the mandatory entry point into the major capability acquisition process"}
      - {ref: DODI8510.01, page: 12, anchor: "Failure to initiate the RMF at system or program inception"}
  - id: MS-A
    name: Milestone A
    short: MS A
    kind: milestone
    phase: PH-MSA
    order: 2
    decision_authority: PER-MDA
    purpose: >-
      Approve entry into technology maturation; the approved security categorization informs
      the program's cybersecurity strategy. Milestone A also approves the acquisition strategy,
      including program protection, and considers the test strategy, so the system-level
      Prepare outputs (system risk assessment, security and privacy requirements) and the
      Categorize step should be complete.
    citations:
      - {ref: DODI8510.01, page: 8, anchor: "before program initiation for new systems and all acquisition milestones"}
      - {ref: DODI5000.85, page: 12, anchor: "Milestone A approves program entry into the technology maturation and risk"}
      - {ref: DODI5000.85, page: 12, anchor: "A proposed acquisition strategy, including intellectual property (IP), program protection"}
      - {ref: DODI5000.89, page: 15, anchor: "Develop a cybersecurity strategy as part of the program protection plan"}
  - id: MS-CDDV
    name: Capability Development Document validation
    short: CDD validation
    kind: event
    phase: PH-TMRR
    order: 3
    decision_authority: null
    purpose: >-
      During TMRR the requirements validation authority validates the CDD, or the equivalent
      requirements document that replaced it once JCIDS was disestablished, before the
      Development RFP release decision point (ACQLC-002).
    citations:
      - {ref: DODI5000.85, page: 14, anchor: "During the TMRR phase, the requirements validation authority will validate the CDD"}
      - {ref: DODI5000.02, page: 6, anchor: "Updates the issuance to reflect the disestablishment of the Joint Capabilities Integration"}
  - id: MS-DRFPRD
    name: Development RFP Release Decision Point
    short: Dev RFP RD
    kind: decision-point
    phase: PH-TMRR
    order: 4
    decision_authority: PER-MDA
    purpose: >-
      Release the development request for proposal; allocated security requirements and
      contract cybersecurity requirements must be in the solicitation. The decision confirms
      that program security has been accommodated, so the requirements allocation (P-17) and
      the selected and tailored baseline (S-1, S-2) should shape the solicitation.
    citations:
      - {ref: DODI8510.01, page: 10, anchor: "Require that contracts and other agreements include specific requirements"}
      - {ref: DODI5000.85, page: 14, anchor: "3.9. DEVELOPMENT RFP RELEASE DECISION POINT."}
      - {ref: DODI5000.85, page: 14, anchor: "that program security has been accommodated"}
  - id: MS-B
    name: Milestone B
    short: MS B
    kind: milestone
    phase: PH-TMRR
    order: 5
    decision_authority: PER-MDA
    purpose: >-
      Approve entry into engineering and manufacturing development (program initiation for most
      programs); the security plan should be approved by this point. The review requires a
      demonstration that security risk, among the other risk sources, has been adequately
      mitigated, which the approved security plan and continuous monitoring strategy (S-6)
      support.
    citations:
      - {ref: DODI8510.01, page: 8, anchor: "before program initiation for new systems and all acquisition milestones"}
      - {ref: DODI5000.85, page: 15, anchor: "The Milestone B decision authorizes a program to enter into the EMD phase"}
      - {ref: DODI5000.85, page: 15, anchor: "Risk sources include, but are not limited to, technology, threat projections, security"}
  - id: MS-C
    name: Milestone C
    short: MS C
    kind: milestone
    phase: PH-EMD
    order: 6
    decision_authority: PER-MDA
    purpose: >-
      Approve entry into production and deployment; fielded systems need a valid authorization
      before they begin operations. The authorization decision (R-4) should be issued by this
      point, informed by developmental cybersecurity test results and a threat assessment no
      older than 12 months.
    citations:
      - {ref: DODI8510.01, page: 13, anchor: "must receive and maintain a valid authorization before beginning operations"}
      - {ref: DODI5000.85, page: 16, anchor: "Milestone C is the point at which a program is reviewed for entrance into the P&D phase"}
      - {ref: DODI5000.89, page: 16, anchor: "describe how key program decisions, including the authority to operate decision, will be informed by cybersecurity testing"}
      - {ref: DODI5000.90, page: 11, anchor: "Before a program receives an ATO, the PM will review the program's most recent threat assessment"}
  - id: MS-FRP
    name: Full-Rate Production or Full Deployment Decision
    short: FRP/FD
    kind: decision-point
    phase: PH-PD
    order: 7
    decision_authority: PER-MDA
    purpose: >-
      Approve full-rate production or full deployment after operational test and evaluation,
      including its cybersecurity results. The operational cybersecurity assessments (CVPA and
      adversarial assessment) and any new validated threat environment inform the decision.
    citations:
      - {ref: DODI8510.01, page: 10, anchor: "Ensure acquisition programs submit cybersecurity T&E results to the appropriate AO"}
      - {ref: DODI5000.85, page: 17, anchor: "3.14. FRP DECISION OR FD DECISION."}
      - {ref: DODI5000.85, page: 17, anchor: "informed by consideration of any new validated threat environments"}
      - {ref: DODI5000.89, page: 16, anchor: "cooperative vulnerability and penetration assessment (CVPA) and an adversarial assessment"}
  - id: MS-FIELD
    name: First fielding
    short: First fielding
    kind: event
    phase: PH-PD
    order: 8
    decision_authority: null
    purpose: >-
      The first system or systems are fielded, under a current authorization. The O&S phase
      begins here, which may precede IOC; production and deployment continue alongside
      (ACQLC-003).
    citations:
      - {ref: DODI5000.85, page: 18, anchor: "The O&S phase begins upon fielding of the first system"}
      - {ref: DODI8510.01, page: 10, anchor: "Operate only authorized DoD systems with a current authorization to operate"}
  - id: MS-IOC
    name: Initial Operational Capability
    short: IOC
    kind: event
    phase: PH-PD
    order: 9
    decision_authority: null
    purpose: >-
      Initial operational capability is declared once units are fielded (MS-FIELD, which may
      precede it) and operated by the user; operation requires a current ATO.
      Mission-critical cybersecurity vulnerabilities found in testing should be eliminated
      before fielding, and continuous monitoring starts for the fielded configuration.
    citations:
      - {ref: DODI8510.01, page: 10, anchor: "Operate only authorized DoD systems with a current authorization to operate"}
      - {ref: DODI5000.85, page: 17, anchor: "will declare initial operational capability (IOC)"}
      - {ref: DODI5000.89, page: 17, anchor: "each of which should then be eliminated before fielding the system"}
  - id: MS-FOC
    name: Full Operational Capability
    short: FOC
    kind: event
    phase: PH-OS
    order: 10
    decision_authority: null
    purpose: >-
      The system is fully fielded and sustained; security posture is maintained through
      continuous monitoring and ongoing authorization. Without ongoing authorization, IT and
      PIT systems update their ATO at least every three years, depending on risk.
    citations:
      - {ref: DODI8510.01, page: 9, anchor: "Implement continuous monitoring activities in accordance with"}
      - {ref: DODI5000.85, page: 5, anchor: "FOC: Full Operational Capability"}
      - {ref: DODI5000.90, page: 11, anchor: "update their ATO at least every 3 years depending on risk"}
      - {ref: SP800-37R2, page: 167, anchor: "ONGOING AUTHORIZATION"}
