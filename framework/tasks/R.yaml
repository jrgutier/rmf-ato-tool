# RMF Authorize tasks (SP 800-37r2 section 3.6). Only the AO makes the authorization
# decision (R-4); the AODR may carry out R-2, R-3 and R-5 (DoDI 8510.01 Table 6).
tasks:
  - id: R-1
    name: Authorization Package
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [RV-PRR], decisions: []}
    purpose: >-
      Assemble the authorization package (security plan, assessment report, POA&M, supporting
      evidence) for the AO.
    raci: {R: [PER-PM, PER-CCP, PER-PRIV, PER-ISSM], A: PER-PM, C: [PER-SCA, PER-CISO], I: [PER-AO, PER-AODR], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SSP, ART-SAR, ART-POAM, ART-SAP, EXT-PPP, ART-PIA]
    outputs: [ART-PKG, ART-DIAS]
    writes_facts: []
    depends_on: [A-6]
    feeds_back_to: []
    min_interviews: 0
    entry_criteria:
      - Security plan, assessment report and POA&M complete (A-6).
    exit_criteria:
      - An authorization package is developed for submission to the AO (DoDI 8510.01 Table 6
        outcome).
      - package/manifest.yaml generated by rmf package lists every core artifact (PKG-001), and
        each core document carries the Annex C data elements mapped to it (PKG-003).
      - ART-DIAS states the assurance levels chosen with the ia family at S-4 (DIAS-001).
      - artifacts/data/package-summary.yaml (template templates/data/package-summary.yaml) holds
        the package executive summary, a consolidated view of its security and, for a system
        processing PII, privacy information, with the risk management issues it highlights, and
        the submission of the package by the system owner or common control provider to the AO
        or AODR before the decision (XSUM-001).
      - For a system processing PII, PER-PRIV reviews the authorization package for compliance
        with privacy requirements and for privacy risk before the AO decides, recorded as the
        decision's privacy_coordination dated on or before it (AODM-010); an approved PIA goes
        into the package before the decision (PRIV-003).
      - The package carries the PPP approval recorded in protection.yaml, and that approval was
        made by the authority the program's ACAT, decision authority and pathway call for
        (PPROT-001).
      - Each Receiving organization in reciprocity.yaml has the package, a current POA&M, the body
        of evidence, the deployment instructions and, before its first site, the installation and
        configuration requirements with every STIG, and visibility of the package; the package is
        shared with the information owners and every interconnected system (RCP-001).
    citations:
      - {ref: SP800-37R2, section: "TASK R-1", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-1 Authorization Package"}
      - {ref: DODI8510.01, page: 19, anchor: "The security authorization documentation package is made up of"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: SP800-18R2, section: "4.6"}
      - {ref: DODI8510.01, page: 19, anchor: "The security authorization documentation package is the minimum information necessary"}
      - {ref: SP800-18R2, page: 39, anchor: "The DIAS is not required to be included in the system plan"}
      - {ref: CNSSI1254, page: 4, anchor: "A standard set of documents and associated data elements are required for"}
    enforces: [REQ-SP800-37R2-0736]
    playbook: playbooks/R/R-1.md
  - id: R-2
    name: Risk Analysis and Determination
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [], decisions: []}
    purpose: >-
      Analyze the risk from operating the system, using current threat information, and render
      the AO's risk determination against the organizational risk tolerance.
    raci: {R: [PER-AODR], A: PER-AO, C: [PER-RE, PER-CISO, PER-PRIV, PER-SCA, PER-ISSM], I: [PER-PM], when: {PER-PRIV: processes-pii}}
    inputs: [ART-PKG, ART-RA, ART-ORG-CONTEXT, EXT-THREAT]
    outputs: [ART-RAR, ART-RA]
    writes_facts: []
    depends_on: [R-1]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Authorization package generated (R-1).
      - The PM has reviewed an Intelligence Community threat assessment of the system issued
        within the previous 12 months.
    exit_criteria:
      - A risk determination by the AO that reflects the risk management strategy, including
        risk tolerance, is rendered (DoDI 8510.01 Table 6 outcome).
      - rar.yaml links each risk to its findings and POA&M items (RAR-001) and states the
        overall risk; ART-RA updated.
      - The AO or AODR finalizes the determination in collaboration with the SAISO, and the SAOP
        for a system processing PII, on the risk assessments and the ISSM's technical advice,
        and any risk executive input is recorded (RAR-002).
    citations:
      - {ref: SP800-37R2, section: "TASK R-2", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-2 Risk Analysis and Determination"}
      - {ref: SP800-30R1, section: "APPENDIX I"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI5000.90, page: 11, anchor: "Before a program receives an ATO, the PM will review the program's most recent threat assessment"}
      - {ref: DODI8510.01, page: 28, anchor: "Incorporate the best cyber intelligence or commercial cyber threat information available"}
      - {ref: SP800-37R2, page: 90, anchor: "The authorizing official or designated representative, in collaboration with the senior agency"}
    playbook: playbooks/R/R-2.md
  - id: R-3
    name: Risk Response
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [], decisions: []}
    purpose: >-
      Identify and implement the preferred course of action (accept, avoid, mitigate, share or
      transfer) for each determined risk.
    raci: {R: [PER-AODR, PER-PM], A: PER-AO, C: [PER-RE, PER-CISO, PER-PRIV, PER-CCP, PER-IO, PER-ISSE, PER-ISSM], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-RAR, ART-POAM, ART-PKG, ART-ORG-CONTEXT, EXT-ADM, ART-RA]
    outputs: [ART-POAM, ART-RAR]
    writes_facts: []
    depends_on: [R-2]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk determination rendered (R-2).
    exit_criteria:
      - Courses of action are selected and their responses communicated as the
        organization's risk response strategy in ART-ORG-CONTEXT (org-context.yaml
        risk_response) directs.
      - Risk responses for determined risks are provided (DoDI 8510.01 Table 6 outcome).
      - Every risk in rar.yaml has a response; mitigations are reflected in the POA&M.
      - Each risk weighs courses of action, or one evaluated as adequate, selects one that matches
        its response and states who is responsible, the effectiveness criteria, dependencies, timeline, monitoring
        plan and triggers, interim measures and who is told (RAR-003).
      - Where risks are not fully mitigated, the operators are told the potential impacts.
      - On urgent capability acquisition the MDA's determination of which deficiencies must be
        resolved and which risks can be accepted before production or deployment is read from
        EXT-ADM; it does not accept security risk, which only the AO does, and a mission-critical
        cybersecurity vulnerability is still eliminated before fielding.
      - Each supply chain risk outside tolerance has an R-3 response in scrm.yaml with two or
        more alternatives and their acceptable level, and a decision among them taken at the
        level its reach calls for (SCRM-013).
    citations:
      - {ref: SP800-37R2, section: "TASK R-3", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-3 Risk Response"}
      - {ref: SP800-39, section: "3.3"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 28, anchor: "When risks are not fully mitigated, AOs inform operators of potential impacts"}
    playbook: playbooks/R/R-3.md
  - id: R-4
    name: Authorization Decision
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C, MS-IOC], reviews: [], decisions: [AD-ATO, AD-ATOC, AD-DATO, AD-ATU, AD-DATU, AD-CCA, AD-DCCA]}
    purpose: >-
      The AO determines whether the risk is acceptable and issues the authorization decision,
      which cannot be delegated and must precede Milestone C and fielding.
    raci: {R: [PER-AO], A: PER-AO, C: [PER-RE, PER-CIO, PER-CISO, PER-PRIV, PER-AODR], I: [PER-PM, PER-ISSM, PER-MDA, PER-UR], when: {PER-PRIV: processes-pii}}
    inputs: [ART-RAR, ART-PKG, ART-POAM, EXT-ADM]
    outputs: [ART-AODM, ART-AUTHREC]
    writes_facts: []
    depends_on: [R-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk responses identified (R-3).
    exit_criteria:
      - The authorization for the system or the common controls is approved or denied (DoDI
        8510.01 Table 6 outcome).
      - authorizations.yaml restates `system_status` with the new record (SSPR-001).
      - authorizations.yaml gains a record naming an AD-* decision with its termination date and
        conditions as required, resting on the RAR (AODM-001, AODM-002); at High or Very High
        risk the Component CIO's position is recorded first (AODM-003), and an ATO records the
        threat assessment the PM reviewed (AODM-004).
      - For a risk level of Very High or High, the Component CIO has documented concurrence or
        non-concurrence before the ATO is issued.
      - The decision confirms that the system meets cyberspace operational commander
        requirements.
      - The AO consulted the risk executive before deciding, and the record carries its input, or
        says the input was not relevant (AODM-010). The Enterprise deployment rests on an ISRMC
        approval (ENT-001), and issues went to their forum (AODM-011).
    citations:
      - {ref: SP800-37R2, section: "TASK R-4", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-4 Authorization Decision"}
      - {ref: DODI8510.01, page: 28, anchor: "Do not delegate authorization decisions"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 26, anchor: "before ATOs are issued for DoD Component systems with a level risk of"}
      - {ref: DODI8510.01, page: 28, anchor: "Verify the system meets cyberspace operational commander requirements"}
      - {ref: DODI5000.90, page: 12, anchor: "the ATO is issued by an AO based on the technical findings of a security controls assessor"}
      - {ref: SP800-37R2, page: 92, anchor: "The authorizing official consults with the Senior Accountable Official for Risk Management"}
      - {ref: DODCIO-RECIPROCITY, page: 10, anchor: "Brief the ISRMC for approval or disapproval of the Enterprise system no"}
      - {ref: DODI8510.01, page: 23, anchor: "Is the community forum for reviewing and resolving authorization issues related to"}
    playbook: playbooks/R/R-4.md
  - id: R-5
    name: Authorization Reporting
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [], decisions: []}
    purpose: >-
      Report the authorization decision and significant deficiencies to organizational officials
      and update the registry.
    raci: {R: [PER-AODR], A: PER-AO, C: [PER-PM, PER-CCP, PER-IO, PER-ISSM, PER-CISO, PER-PRIV], I: [PER-CIO, PER-MDA], when: {PER-PRIV: processes-pii}}
    inputs: [ART-AODM, ART-AUTHREC, ART-PKG]
    outputs: [ART-AUTHRPT]
    writes_facts: []
    depends_on: [R-4]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Authorization decision issued (R-4).
    exit_criteria:
      - Authorization decisions, significant vulnerabilities and risks are reported to
        organizational officials (DoDI 8510.01 Table 6 outcome).
      - ART-AUTHRPT records the decision, significant risks and the registry annotation.
      - authorization-report.yaml records that the system owner or common control provider
        received and retains the decision and package, how the package is marked and how long it
        is retained, who can read it, and that the AO verifies the terms (AUTHRPT-001).
    citations:
      - {ref: SP800-37R2, section: "TASK R-5", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-5 Authorization Reporting"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 26, anchor: "Maintains visibility of assessment and authorization status"}
    playbook: playbooks/R/R-5.md
