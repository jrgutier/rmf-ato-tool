# RMF Authorize tasks (SP 800-37r2 section 3.6). Only the AO makes the authorization
# decision (R-4); the AODR may carry out R-2, R-3 and R-5 (DoDI 8510.01 Table 6).
tasks:
  - id: R-1
    name: Authorization Package
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [RV-PRR], decisions: []}
    purpose: >-
      Assemble the authorization package (security plan, assessment report, POA&M, supporting
      evidence) for the AO.
    raci: {R: [PER-PM, PER-CCP, PER-PRIV, PER-ISSM], A: PER-PM, C: [PER-SCA, PER-CISO], I: [PER-AO, PER-AODR]}
    inputs: [ART-SSP, ART-SAR, ART-POAM, ART-SAP]
    outputs: [ART-PKG]
    writes_facts: []
    depends_on: [A-6]
    feeds_back_to: []
    min_interviews: 0
    entry_criteria:
      - Security plan, assessment report and POA&M complete (A-6).
    exit_criteria:
      - An authorization package is developed for submission to the AO (DoDI 8510.01 Table 6
        outcome).
      - package/manifest.yaml generated by rmf package lists every core artifact (PKG-001).
    citations:
      - {ref: SP800-37R2, section: "TASK R-1", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-1 Authorization Package"}
      - {ref: DODI8510.01, page: 19, anchor: "The security authorization documentation package is made up of"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: SP800-18R2, section: "4.6"}
      - {ref: DODI8510.01, page: 19, anchor: "The security authorization documentation package is the minimum information necessary"}
    playbook: playbooks/R/R-1.md
  - id: R-2
    name: Risk Analysis and Determination
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [], decisions: []}
    purpose: >-
      Analyze the risk from operating the system, using current threat information, and render
      the AO's risk determination against the organizational risk tolerance.
    raci: {R: [PER-AODR], A: PER-AO, C: [PER-RE, PER-CISO, PER-PRIV, PER-SCA], I: [PER-PM]}
    inputs: [ART-PKG, ART-RA, ART-ORG-CONTEXT, EXT-THREAT]
    outputs: [ART-RAR, ART-RA]
    writes_facts: []
    depends_on: [R-1]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Authorization package generated (R-1).
      - The PM has reviewed an Intelligence Community threat assessment of the system issued
        within the previous 12 months.
    exit_criteria:
      - A risk determination by the AO that reflects the risk management strategy, including
        risk tolerance, is rendered (DoDI 8510.01 Table 6 outcome).
      - rar.yaml links each risk to its findings and POA&M items (RAR-001) and states the
        overall risk; ART-RA updated.
    citations:
      - {ref: SP800-37R2, section: "TASK R-2", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-2 Risk Analysis and Determination"}
      - {ref: SP800-30R1, section: "APPENDIX I"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI5000.90, page: 11, anchor: "Before a program receives an ATO, the PM will review the program's most recent threat assessment"}
      - {ref: DODI8510.01, page: 28, anchor: "Incorporate the best cyber intelligence or commercial cyber threat information available"}
    playbook: playbooks/R/R-2.md
  - id: R-3
    name: Risk Response
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [], decisions: []}
    purpose: >-
      Identify and implement the preferred course of action (accept, avoid, mitigate, share or
      transfer) for each determined risk.
    raci: {R: [PER-AODR, PER-PM], A: PER-AO, C: [PER-RE, PER-CISO, PER-PRIV, PER-CCP, PER-IO, PER-ISSE, PER-ISSM], I: []}
    inputs: [ART-RAR, ART-POAM, ART-PKG]
    outputs: [ART-POAM, ART-RAR]
    writes_facts: []
    depends_on: [R-2]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk determination rendered (R-2).
    exit_criteria:
      - Risk responses for determined risks are provided (DoDI 8510.01 Table 6 outcome).
      - Every risk in rar.yaml has a response; mitigations are reflected in the POA&M.
      - Where risks are not fully mitigated, the operators are told the potential impacts.
    citations:
      - {ref: SP800-37R2, section: "TASK R-3", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-3 Risk Response"}
      - {ref: SP800-39, section: "3.3"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 28, anchor: "When risks are not fully mitigated, AOs inform operators of potential impacts"}
    playbook: playbooks/R/R-3.md
  - id: R-4
    name: Authorization Decision
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C, MS-IOC], reviews: [], decisions: [AD-ATO, AD-ATOC, AD-DATO, AD-ATU, AD-DATU, AD-CCA, AD-DCCA]}
    purpose: >-
      The AO determines whether the risk is acceptable and issues the authorization decision,
      which cannot be delegated and must precede Milestone C and fielding.
    raci: {R: [PER-AO], A: PER-AO, C: [PER-RE, PER-CIO, PER-CISO, PER-PRIV, PER-AODR], I: [PER-PM, PER-ISSM, PER-MDA, PER-UR]}
    inputs: [ART-RAR, ART-PKG, ART-POAM]
    outputs: [ART-AODM, ART-AUTHREC]
    writes_facts: []
    depends_on: [R-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk responses identified (R-3).
    exit_criteria:
      - The authorization for the system or the common controls is approved or denied (DoDI
        8510.01 Table 6 outcome).
      - authorizations.yaml gains a record naming an AD-* decision with its termination date and
        conditions as required, resting on the RAR (AODM-001, AODM-002); at High or Very High
        risk the Component CIO's position is recorded first (AODM-003), and an ATO records the
        threat assessment the PM reviewed (AODM-004).
      - For a risk level of Very High or High, the Component CIO has documented concurrence or
        non-concurrence before the ATO is issued.
      - The decision confirms that the system meets cyberspace operational commander
        requirements.
    citations:
      - {ref: SP800-37R2, section: "TASK R-4", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-4 Authorization Decision"}
      - {ref: DODI8510.01, page: 28, anchor: "Do not delegate authorization decisions"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 26, anchor: "before ATOs are issued for DoD Component systems with a level risk of"}
      - {ref: DODI8510.01, page: 28, anchor: "Verify the system meets cyberspace operational commander requirements"}
      - {ref: DODI5000.90, page: 12, anchor: "the ATO is issued by an AO based on the technical findings of a security controls assessor"}
    playbook: playbooks/R/R-4.md
  - id: R-5
    name: Authorization Reporting
    step: R
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD, PH-PD]
    aligned_with: {milestones: [MS-C], reviews: [], decisions: []}
    purpose: >-
      Report the authorization decision and significant deficiencies to organizational officials
      and update the registry.
    raci: {R: [PER-AODR], A: PER-AO, C: [PER-PM, PER-CCP, PER-IO, PER-ISSM, PER-CISO, PER-PRIV], I: [PER-CIO, PER-MDA]}
    inputs: [ART-AODM]
    outputs: [ART-AUTHRPT]
    writes_facts: []
    depends_on: [R-4]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Authorization decision issued (R-4).
    exit_criteria:
      - Authorization decisions, significant vulnerabilities and risks are reported to
        organizational officials (DoDI 8510.01 Table 6 outcome).
      - ART-AUTHRPT records the decision, significant risks and the registry annotation.
    citations:
      - {ref: SP800-37R2, section: "TASK R-5", note: "SDLC phase: New – Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 18, anchor: "Task R-5 Authorization Reporting"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 26, anchor: "Maintains visibility of assessment and authorization status"}
    playbook: playbooks/R/R-5.md
