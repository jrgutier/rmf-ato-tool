# RMF Select tasks (SP 800-37r2 section 3.3). The security plan, CM plan, contingency plan
# and IR plan are first written at S-4 and approved by the AO at S-6, ahead of Milestone B.
tasks:
  - id: S-1
    name: Control Selection
    step: S
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-TMRR]
    aligned_with: {milestones: [], reviews: [RV-SFR], decisions: []}
    purpose: >-
      Select the NSS control baseline in CNSSI 1253 Appendix D that matches the approved C/I/A
      categorization, plus the NSS privacy baseline, as the starting point for tailoring.
    raci: {R: [PER-PM, PER-CCP, PER-ISSM], A: PER-PM, C: [PER-AO, PER-IO, PER-ISSE, PER-PRIV, PER-ISSO], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-CAT, ART-BIA, ART-ORG-CONTEXT, ART-REQ, EXT-BASELINES, EXT-CNSSI1253-OVERLAYS, EXT-CATALOG, ART-INV, ART-RA, EXT-ORG-POLICY]
    inputs_since: {ART-BIA: 0.2.0, ART-INV: 0.2.0, ART-RA: 0.2.0, EXT-ORG-POLICY: 0.2.0}
    outputs: [ART-BASELINE]
    writes_facts: [baseline_id]
    depends_on: [C-3, P-5]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - facts.categorization.approved is true (C-3).
      - Common controls published (P-5).
    exit_criteria:
      - Control baselines necessary to protect the system commensurate with risk are selected
        (DoDI 8510.01 Table 3 outcome).
      - facts.baseline_id set_by S-1 and baseline.json regenerated by rmf baseline resolve.
      - Capabilities the organization defined ahead of selection are mapped in capabilities.yaml
        to the catalog controls that support them (TLR-008); a mapped control the baseline
        does not select is a gap for S-2 to weigh (TLR-011, warning).
      - No control enhancement is selected without its base control (TLR-007).
    citations:
      - {ref: SP800-37R2, section: "TASK S-1", note: "SDLC phase: New – Development/Acquisition; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 15, anchor: "Task S-1 Control Selection"}
      - {ref: CNSSI1253, section: "3.2.1"}
      - {ref: SP800-53B, section: "2.2"}
      - {ref: SP800-37R2, section: "TABLE 4: SELECT TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 9, anchor: "Categorize systems and select controls in accordance with CNSSI 1253"}
    playbook: playbooks/S/S-1.md
  - id: S-2
    name: Control Tailoring
    step: S
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-TMRR]
    aligned_with: {milestones: [], reviews: [RV-SFR], decisions: []}
    purpose: >-
      Tailor the selected controls into the tailored control baseline by applying overlays,
      designating common controls, scoping, compensating, assigning DoD parameter values and
      supplementing.
    raci: {R: [PER-PM, PER-CCP, PER-ISSM], A: PER-PM, C: [PER-AO, PER-IO, PER-ISSE, PER-PRIV, PER-ISSO], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-BASELINE, ART-RA, ART-BIA, EXT-CNSSI1253-OVERLAYS, ART-INV, ART-ORG-CONTEXT, ART-REQ, EXT-ORG-POLICY]
    inputs_since: {ART-BIA: 0.2.0, ART-INV: 0.2.0, ART-ORG-CONTEXT: 0.2.0, ART-REQ: 0.2.0, EXT-ORG-POLICY: 0.2.0}
    outputs: [ART-BASELINE]
    writes_facts: []
    depends_on: [S-1]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Baseline selected (S-1).
      - The system risk assessment (ART-RA) is available to inform tailoring.
    exit_criteria:
      - Controls are tailored, producing tailored control baselines (DoDI 8510.01 Table 3
        outcome).
      - tailoring.yaml records every tailoring action with its rationale; parameter values
        assigned.
      - Controls are removed only on risk-based determinations, never because they are hard to
        implement.
      - Any conflict between overlays is resolved by the AO and the SAOP (or their designees).
      - Every assumption under the baselines and the applied overlays is tested; one that fails
        revisits the selection, and one the baselines do not address that holds names the
        controls, selected or added, or the overlay that addresses it (TLR-003).
      - The need for additional assurance-related controls is determined (TLR-004), and each
        applied overlay's conditions are answered (TLR-005).
      - Every remove action rests on a basis and, for a downgrade, its three conditions; every
        remove and compensating action is tested against law, regulation, policy and OMB policy
        (TLR-002); every compensating control carries its source, reason and the risk
        acceptance of the AO or its designated representative (TLR-001); specification information names selected controls (TLR-006).
      - Each selected control with a Privacy Implementation Considerations checkmark (CNSSI 1253
        Appendix D, or Table 1 of an applied overlay) has a tailoring.yaml
        privacy_implementation record of the coordination with the SAOP or designee, before it
        is implemented, addressing each implication of its checkmark (PIC-001).
      - The C-SCRM control decisions (selected, tailored or removed, with cost and the AO's
        acceptance of a removal) are recorded in scrm-plan.yaml controls at S-4 (SCRM-010).
    citations:
      - {ref: SP800-37R2, section: "TASK S-2", note: "SDLC phase: New – Development/Acquisition; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 15, anchor: "Task S-2 Control Tailoring"}
      - {ref: CNSSI1253, section: "3.2.2"}
      - {ref: SP800-53B, section: "2.4"}
      - {ref: SP800-37R2, section: "TABLE 4: SELECT TASKS AND OUTCOMES"}
      - {ref: CNSSI1253, page: 15, anchor: "Controls should be removed only because of risk-based determinations"}
      - {ref: CNSSI1253, page: 15, anchor: "the AO (or designee) and SAOP (or designee), in coordination with the information owner/steward"}
      - {ref: DODI8510.01, page: 9, anchor: "Require use of the DoD-specific assignment values, overlays, implementation guidance"}
    playbook: playbooks/S/S-2.md
  - id: S-3
    name: Control Allocation
    step: S
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-TMRR]
    aligned_with: {milestones: [], reviews: [RV-PDR], decisions: []}
    purpose: >-
      Designate controls as system-specific, hybrid or common and allocate them to system
      elements, so the preliminary design (RV-PDR) shows where each control lives.
    raci: {R: [PER-ISSE, PER-ISSM, PER-PRIV, PER-ISSO], A: PER-PM, C: [PER-CIO, PER-AO, PER-SPONSOR, PER-CISO, PER-CCP], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-BASELINE, ART-BND, ART-ORG-CONTEXT, ART-REQ, ART-CAT, ART-INV, ART-RA, ART-SD, EXT-ORG-POLICY, EXT-PRODUCT]
    inputs_since: {ART-CAT: 0.2.0, ART-INV: 0.2.0, ART-RA: 0.2.0, ART-SD: 0.2.0, EXT-ORG-POLICY: 0.2.0, EXT-PRODUCT: 0.2.0}
    outputs: [ART-BASELINE]
    writes_facts: []
    depends_on: [S-2, P-17]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Tailored baseline (S-2) and requirements allocation (P-17) available.
    exit_criteria:
      - Controls are designated as system-specific, hybrid or common, and allocated to the
        specific system elements (machine, physical or human) (DoDI 8510.01 Table 3 outcome).
      - allocation.yaml gives every tailored-baseline control a type and the components that
        implement it.
      - Every requirement of ART-REQ is satisfied by a control that names it (TLR-009).
      - The system owner and the AO determine, for each common control provider, that its
        controls protect the system commensurate with risk (TLR-010).
      - The ISSO, a primary role (DoDI 8510.01 Table 3), gives an S-3 interview (WFQ-002).
    citations:
      - {ref: SP800-37R2, section: "TASK S-3", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 16, anchor: "Task S-3 Control Allocation"}
      - {ref: SP800-37R2, section: "TABLE 4: SELECT TASKS AND OUTCOMES"}
      - {ref: DODI5000.88, page: 16, anchor: "guide system security engineering activities, which includes software assurance"}
    playbook: playbooks/S/S-3.md
  - id: S-4
    name: Documentation of Planned Control Implementations
    step: S
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-TMRR, PH-EMD]
    aligned_with: {milestones: [MS-B], reviews: [RV-PDR], decisions: []}
    purpose: >-
      Document the planned control implementations in the security plan and write the CM,
      contingency and incident response plans.
    raci: {R: [PER-ISSM, PER-CCP, PER-ISSE], A: PER-PM, C: [PER-AO, PER-IO, PER-PRIV, PER-ISSO, PER-DEV, PER-CSSP, PER-CCB], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-BASELINE, ART-SD, ART-BND, ART-INV, ART-BIA, EXT-CATALOG, ART-CAT, ART-ORG-CONTEXT, ART-RA, ART-REQ, EXT-ORG-POLICY]
    inputs_since: {ART-BIA: 0.2.0, ART-CAT: 0.2.0, ART-ORG-CONTEXT: 0.2.0, ART-RA: 0.2.0, ART-REQ: 0.2.0, EXT-ORG-POLICY: 0.2.0}
    outputs: [ART-SSP, ART-CMP, ART-CP, ART-IRP, ART-SVCA]
    writes_facts: []
    depends_on: [S-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Controls allocated to components (S-3); baseline.json current.
    exit_criteria:
      - Controls and associated tailoring actions are documented in security and privacy plans
        or equivalent documents (DoDI 8510.01 Table 3 outcome).
      - ssp/controls holds one statement per tailored-baseline control (SSP-COV-001,
        SSP-DUP-001).
      - ART-CMP, ART-CP and ART-IRP written.
      - ART-CP rests on a business impact analysis, and ART-CMP names the configuration control
        board and the baseline configuration process.
      - A CSO-hosted system has artifacts/data/cloud.yaml with its offerings and their FedRAMP or DoD
        provisional authorization, the mission impact level, the DTM 24-001 activity tracking
        checklist, contract clauses, the CSSP's part and the incident response split
        (CLOUD-001 to CLOUD-010).
      - For a system processing PII, ART-SSP holds the privacy plan with the security plan
        (ssp-records.yaml privacy_plan, whether the plans are consolidated or separate; PRIV-008).
      - The statement of each baseline control the catalog marks as contributing to assurance
        (`rmf catalog show --fields assurance`) says how its assurance requirements are
        addressed, and they are satisfied once it is in place (SSE-003; FIPS 200 Section 4).
      - artifacts/data/software.yaml records, for covered software, the CI/CD pipeline and build
        with signed provenance, AI used in development, the SBOM and other machine-readable
        evidence, integrated test and evaluation and the software program (SWA-001; DoWI
        8430.01).
      - artifacts/data/scrm-plan.yaml holds the system C-SCRM plan of SP 800-18r2, the C-SCRM
        control decisions, critical suppliers in contingency and incident planning, supplier
        monitoring after award, training content and the supply chain reporting M-5 follows
        (SCRM-009 to SCRM-012, SCRM-014).
    citations:
      - {ref: SP800-37R2, section: "TASK S-4", note: "SDLC phase: New – Development/Acquisition; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 16, anchor: "Task S-4 Documentation of Planned Control Implementations"}
      - {ref: SP800-18R2, section: "4.3.2"}
      - {ref: SP800-37R2, section: "TABLE 4: SELECT TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 29, anchor: "Develop, maintain, and track the security plan for assigned systems"}
      - {ref: SP800-128, section: "3.1.2"}
      - {ref: SP800-34R1, section: "3.2"}
      - {ref: SP800-61R3, section: "2.1"}
    playbook: playbooks/S/S-4.md
  - id: S-5
    name: Continuous Monitoring Strategy—System
    step: S
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-TMRR, PH-EMD]
    aligned_with: {milestones: [MS-B], reviews: [RV-PDR], decisions: []}
    purpose: >-
      Develop the system-level continuous monitoring strategy, consistent with the
      organizational strategy, with monitoring metrics and frequencies set at the start of
      development.
    raci: {R: [PER-PM, PER-CCP, PER-ISSM], A: PER-PM, C: [PER-RE, PER-CIO, PER-CISO, PER-PRIV, PER-AO, PER-IO, PER-ISSE, PER-CSSP, PER-ISSO], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-ORG-CONTEXT, ART-SSP, ART-RA, EXT-THREAT, EXT-ORG-POLICY]
    inputs_since: {EXT-ORG-POLICY: 0.2.0}
    outputs: [ART-CONMON]
    writes_facts: []
    depends_on: [S-4, P-7]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Security plan drafted (S-4); organizational monitoring strategy available (P-7).
    exit_criteria:
      - Every family's monitoring frequency is at least the organizational minimum in
        ART-ORG-CONTEXT, and conmon.yaml minimum_review records the system owner's review
        of those minimums (OCTX-009).
      - A continuous monitoring strategy for the system that reflects the organizational risk
        management strategy is developed (DoDI 8510.01 Table 3 outcome).
      - conmon.yaml gives every baseline family a frequency and sets the ongoing-authorization
        triggers (CONMON-001).
      - On the software pathway (PW-SWP), conmon.yaml states the risk-based lifecycle management
        approach, what it addresses, what the program backlogs capture, and when a
        vulnerability fix is released out of the release cycle (SWLC-001).
      - conmon.yaml states the criteria behind each frequency, established by the system owner
        or common control provider with other officials, or cites ART-ORG-CONTEXT for a family
        organizational_frequencies lists as set by the organizational strategy (ISCM-003).
      - Each automated tool names the baseline controls it assesses by the test method, with
        its frequency (continuous where it carries a continuously monitored control), analysis,
        reporting, selection criteria, upkeep and strategy; a desired-state tool defines an
        automated actual state, a data-based comparable desired state and its defect method; a
        continuously monitored control no tool covers gets a manual frequency (ISCM-002).
      - conmon.yaml states the data architecture, compliance, effectiveness and change
        monitoring, event criteria with thresholds and what each triggers, a periodic boundary
        review, threat monitoring of threat actors, protective techniques and the deployed
        environment (EXT-THREAT), metrics and the tasks using them, activities delegated to
        external partners and how the risk assessment is kept current (ISCM-001, ISCM-005,
        ISCM-006); posture reports reach the AO (ISCM-005).
      - Each conmon.yaml metric states the objective it serves, the baseline controls it reads, its baseline and threshold,
        and a review procedure by officials it is reported to (METR-001, METR-002).
      - conmon.yaml has room for the AO's or AODR's approval of the strategy and the minimum
        frequency of each control; it can come with the plan approval at S-6 (ISCM-004 holds S-6).
      - Where AD-CATO is a goal, automated monitoring is as near real time as feasible and
        manual controls have defined timelines.
      - For a system processing PII, conmon.yaml privacy is the privacy continuous monitoring
        strategy, with the SAOP's guidance, each privacy control of the baseline with its assessment
        frequency, and the SAOP consulted on each control added to it (PRIV-006).
      - conmon.yaml vulnerability_management lays the five steps of the DoD vulnerability
        management process across the system, the records that support it, how vulnerabilities
        are identified, the analysis tools from development to retirement, monthly
        authenticated and non-authenticated scans, the patch sources and the reach of
        automated patching, and the central log repository (VULN-007).
      - The supplier monitoring of scrm-plan.yaml is integrated into the continuous monitoring
        strategy.
      - With a Receiving organization, reciprocity.yaml names a JFHQ-DODIN accredited CSSP
        maintaining every service the DoD CIO reciprocity playbook names, and each implemented
        directed action as a patch provided in time and communicated to every Receiving organization
        (RCP-003).
    citations:
      - {ref: SP800-37R2, section: "TASK S-5", note: "SDLC phase: New – Development/Acquisition; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 16, anchor: "Task S-5 Continuous Monitoring Strategy – System"}
      - {ref: SP800-137, section: "3.1.2"}
      - {ref: SP800-37R2, section: "TABLE 4: SELECT TASKS AND OUTCOMES"}
      - {ref: SP800-137, section: "3.2.2"}
      - {ref: DODI8510.01, page: 10, anchor: "Ensure acquisition programs develop evaluation metrics for DT&E and OT&E, and continuous monitoring"}
      - {ref: DODCIO-CATO, page: 1, anchor: "RMF requires a CONMON strategy for each system"}
      - {ref: DODI8531.01, page: 20, anchor: "Conduct monthly non-authenticated and authenticated vulnerability scans"}
    playbook: playbooks/S/S-5.md
  - id: S-6
    name: Plan Review and Approval
    step: S
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-TMRR]
    aligned_with: {milestones: [MS-B], reviews: [], decisions: []}
    purpose: >-
      Have the AO (or AODR) review and approve the security plan and monitoring strategy before
      Milestone B.
    raci: {R: [PER-AODR, PER-PRIV], A: PER-AO, C: [PER-RE, PER-CIO, PER-MDA, PER-CISO], I: [PER-PM, PER-ISSM], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SSP, ART-CONMON, ART-RA, ART-ORG-CONTEXT]
    inputs_since: {ART-ORG-CONTEXT: 0.2.0}
    outputs: [ART-SSP]
    writes_facts: []
    depends_on: [S-4, S-5]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Security plan and continuous monitoring strategy complete (S-4, S-5).
    exit_criteria:
      - Security and privacy plans reflecting the controls needed to protect the system and its
        environment commensurate with risk are reviewed and approved by the AO (DoDI 8510.01
        Table 3 outcome).
      - ART-SSP records the AO's approval (or the changes required before approval), and `approvals` in ssp-records.yaml holds each approver's full name, system role, title, signature and date, with the concurrences.
      - conmon.yaml records the AO's or AODR's approval of the monitoring strategy, if S-5 did
        not, with conmon.yaml rewritten whole (ISCM-004).
      - For a system processing PII, the senior agency official for privacy (PER-PRIV) has
        reviewed and approved the privacy plan before it went to the AO or AODR, recorded in
        ssp-records.yaml privacy_plan.approvals (PRIV-012).
    citations:
      - {ref: SP800-37R2, section: "TASK S-6", note: "SDLC phase: New – Development/Acquisition; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 16, anchor: "Task S-6 Plan Review and Approval"}
      - {ref: SP800-18R2, section: "4.3.3"}
      - {ref: SP800-37R2, section: "TABLE 4: SELECT TASKS AND OUTCOMES"}
      - {ref: DODI5000.85, page: 15, anchor: "Risk sources include, but are not limited to, technology, threat projections, security"}
    playbook: playbooks/S/S-6.md
