# RMF Prepare tasks (SP 800-37r2 section 3.1). P-1..P-7 are organization-level and share the
# org-context playbook; P-8..P-18 are system-level. RACI maps the 800-37r2 primary roles to
# R and its supporting roles to C/I through personas.yaml nist_roles; the PM (system owner)
# is accountable for system-level tasks unless the AO owns the outcome.
tasks:
  - id: P-1
    name: Risk Management Roles
    step: P
    level: organization
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-MDD], reviews: [], decisions: []}
    purpose: >-
      Identify and assign the individuals who fill the security and privacy risk management
      roles, free of conflicts of interest, before system-level RMF work starts with the
      program.
    raci: {R: [PER-CIO, PER-PRIV], A: PER-CIO, C: [PER-AO, PER-RE, PER-CISO], I: [PER-PM]}
    inputs: [EXT-ORG-POLICY]
    outputs: [ART-ORG-CONTEXT]
    writes_facts: []
    depends_on: []
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Component policies and organizational charts are available (EXT-ORG-POLICY).
      - The appointing authority for each RMF role is known (DoDI 8510.01 Table 8).
    exit_criteria:
      - Individuals are identified and assigned key roles for executing the RMF (DoDI 8510.01
        Table 1 outcome).
      - ART-ORG-CONTEXT records the RMF role assignments, with no AO also acting as system owner
        or common control provider for what it authorizes.
      - Each AO is government personnel with expertise in the technology being authorized and
        has completed AO or RMF training.
    citations:
      - {ref: SP800-37R2, section: "TASK P-1"}
      - {ref: DODI8510.01, page: 13, anchor: "Task P-1 Risk Management Roles"}
      - {ref: DODI8510.01, page: 30, anchor: "Appointment of RMF Roles"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
      - {ref: DODI8510.01, page: 9, anchor: "Only be government personnel"}
      - {ref: DODI8510.01, page: 26, anchor: "Verifies an SO and/or PM is appointed in writing"}
    playbook: playbooks/P/P-org-context.md#task-p-1
  - id: P-2
    name: Risk Management Strategy
    step: P
    level: organization
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-MDD], reviews: [], decisions: []}
    purpose: >-
      Establish the organization's risk management strategy, including how it frames, assesses,
      responds to and monitors risk and the risk tolerance that the Component CIO communicates
      to programs.
    raci: {R: [PER-CIO, PER-RE], A: PER-CIO, C: [PER-CISO, PER-PRIV], I: [PER-AO]}
    inputs: [EXT-ORG-POLICY, ART-ORG-CONTEXT]
    outputs: [ART-ORG-CONTEXT]
    writes_facts: []
    depends_on: [P-1]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - RMF roles assigned (P-1).
      - Component Prepare-step guidance and DoD-level risk guidance are available
        (EXT-ORG-POLICY).
    exit_criteria:
      - A risk management strategy for the organization that includes a determination and
        expression of organizational risk tolerance is established (DoDI 8510.01 Table 1
        outcome).
      - ART-ORG-CONTEXT states the risk management strategy and the organizational risk
        tolerance.
      - ART-ORG-CONTEXT records the Component CIO's process for designated approval authorities
        to make certification determinations and issue an IATT or ATO expeditiously for a
        capability fielded under urgent capability acquisition.
    citations:
      - {ref: SP800-37R2, section: "TASK P-2"}
      - {ref: DODI8510.01, page: 13, anchor: "Task P-2 Risk Management Strategy"}
      - {ref: SP800-39, section: "2.3.3"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
      - {ref: DODI8510.01, page: 26, anchor: "Communicate organizational risk tolerance"}
      - {ref: SP800-39, section: "3.1"}
    playbook: playbooks/P/P-org-context.md#task-p-2
  - id: P-3
    name: Risk Assessment—Organization
    step: P
    level: organization
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA, PH-OS]
    aligned_with: {milestones: [MS-MDD], reviews: [], decisions: []}
    purpose: >-
      Assess organization-wide security and privacy risk, including supply chain risk, using
      current cyber threat information, and keep the results current: in operations, review
      threat, vulnerability, technology and mission changes against the organizational risk
      posture.
    raci: {R: [PER-RE, PER-CISO, PER-PRIV], A: PER-RE, C: [PER-CIO, PER-SPONSOR, PER-AO], I: []}
    inputs: [ART-ORG-CONTEXT, EXT-THREAT]
    outputs: [ART-ORG-CONTEXT]
    writes_facts: []
    depends_on: [P-2]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk management strategy established (P-2).
      - Threat information is available (EXT-THREAT).
    exit_criteria:
      - An organization-wide risk assessment is completed, or an existing risk assessment is
        updated (DoDI 8510.01 Table 1 outcome).
      - ART-ORG-CONTEXT summarizes the organization-level risk assessment results.
      - Once the system operates, org-context.yaml posture_reviews records each review of
        threat, vulnerability, technology and mission changes against the organizational risk
        posture, and the sections it updated (OCTX-011).
    citations:
      - {ref: SP800-37R2, section: "TASK P-3"}
      - {ref: DODI8510.01, page: 13, anchor: "Task P-3 Risk Assessment – Organization"}
      - {ref: SP800-30R1, section: "2.4"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
      - {ref: SP800-30R1, section: "3.4"}
    playbook: playbooks/P/P-org-context.md#task-p-3
  - id: P-4
    name: Organizationally-Tailored Control Baselines and CSF Profiles
    step: P
    level: organization
    optional: true
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-MDD], reviews: [], decisions: []}
    purpose: >-
      Establish and publish organizationally-tailored control baselines and/or CSF profiles
      (optional); in DoD they build on the CNSSI 1253 baselines, overlays and DoD assignment
      values.
    raci: {R: [PER-SPONSOR, PER-RE], A: PER-RE, C: [PER-CIO, PER-AO, PER-CISO, PER-PRIV], I: []}
    inputs: [ART-ORG-CONTEXT, EXT-BASELINES, EXT-CNSSI1253-OVERLAYS]
    outputs: [ART-ORG-CONTEXT]
    writes_facts: []
    depends_on: [P-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Organization-level risk assessment available (P-3).
      - The CNSSI 1253 baselines and overlays are available (EXT-BASELINES,
        EXT-CNSSI1253-OVERLAYS).
    exit_criteria:
      - Organizationally-tailored control baselines and/or CSF profiles are established and made
        available (DoDI 8510.01 Table 1 outcome).
      - ART-ORG-CONTEXT lists the approved or directed tailored baselines and overlays, or
        records that none apply.
    citations:
      - {ref: SP800-37R2, section: "TASK P-4"}
      - {ref: DODI8510.01, page: 13, anchor: "Task P-4 Organizationally – Tailored Control Baselines"}
      - {ref: SP800-53B, section: "OVERLAYS"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
      - {ref: CNSSI1253, section: "2.5"}
      - {ref: DODI8510.01, page: 9, anchor: "Require use of the DoD-specific assignment values, overlays, implementation guidance"}
    playbook: playbooks/P/P-org-context.md#task-p-4
  - id: P-5
    name: Common Control Identification
    step: P
    level: organization
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-MDD], reviews: [], decisions: []}
    purpose: >-
      Identify, document and publish the common controls available for inheritance and their
      providers, so programs can plan inheritance before they allocate requirements (P-17) and
      controls (S-3).
    raci: {R: [PER-CISO, PER-PRIV], A: PER-CISO, C: [PER-SPONSOR, PER-RE, PER-CIO, PER-AO, PER-CCP, PER-PM], I: []}
    inputs: [ART-ORG-CONTEXT, EXT-ORG-POLICY]
    outputs: [ART-ORG-CONTEXT]
    writes_facts: []
    depends_on: [P-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Organization-level risk assessment available (P-3).
    exit_criteria:
      - Common controls that are available for inheritance by organizational systems are
        identified, documented, and published (DoDI 8510.01 Table 1 outcome).
      - ART-ORG-CONTEXT lists the common control providers and the controls each offers for
        inheritance.
    citations:
      - {ref: SP800-37R2, section: "TASK P-5"}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-5 Common Control Identification"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
      - {ref: CNSSI1253, page: 15, anchor: "Identify and designate common controls, and the common control provider(s)"}
    playbook: playbooks/P/P-org-context.md#task-p-5
  - id: P-6
    name: Impact-Level Prioritization
    step: P
    level: organization
    optional: true
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-MDD], reviews: [], decisions: []}
    purpose: >-
      Prioritize organizational systems that share an impact level into low-, moderate- and
      high-impact sub-categories (optional), to guide where resources go first.
    raci: {R: [PER-RE], A: PER-RE, C: [PER-CISO, PER-PRIV, PER-SPONSOR, PER-PM, PER-CIO, PER-AO], I: []}
    inputs: [ART-ORG-CONTEXT]
    outputs: [ART-ORG-CONTEXT]
    writes_facts: []
    depends_on: [P-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Organization-level risk assessment available (P-3).
      - The organization's systems have already been categorized; prioritization applies the
        high-water mark first.
    exit_criteria:
      - A prioritization of organizational systems with the same impact level is conducted (DoDI
        8510.01 Table 1 outcome).
      - ART-ORG-CONTEXT records the impact sub-category prioritization, or that the organization
        does not use one.
    citations:
      - {ref: SP800-37R2, section: "TASK P-6"}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-6 Impact – Level Prioritization"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
    playbook: playbooks/P/P-org-context.md#task-p-6
  - id: P-7
    name: Continuous Monitoring Strategy—Organization
    step: P
    level: organization
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-MDD], reviews: [], decisions: []}
    purpose: >-
      Develop and implement the organization-wide strategy for continuously monitoring control
      effectiveness, which every system strategy (S-5) must follow.
    raci: {R: [PER-RE], A: PER-RE, C: [PER-CIO, PER-CISO, PER-PRIV, PER-SPONSOR, PER-PM, PER-AO], I: [PER-CSSP]}
    inputs: [ART-ORG-CONTEXT]
    outputs: [ART-ORG-CONTEXT]
    writes_facts: []
    depends_on: [P-2, P-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk management strategy and organization-level risk assessment available (P-2, P-3).
    exit_criteria:
      - An organization-wide strategy for monitoring control effectiveness is developed and
        implemented (DoDI 8510.01 Table 1 outcome).
      - ART-ORG-CONTEXT summarizes the organizational continuous monitoring strategy that system
        strategies (S-5) must follow.
    citations:
      - {ref: SP800-37R2, section: "TASK P-7"}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-7 Continuous Monitoring Strategy – Organization"}
      - {ref: SP800-137, section: "3.1.1"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
      - {ref: DODI8510.01, page: 9, anchor: "Implement continuous monitoring activities in accordance with"}
    playbook: playbooks/P/P-org-context.md#task-p-7
  - id: P-8
    name: Mission or Business Focus
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-A], reviews: [], decisions: []}
    purpose: >-
      Identify the missions, business functions and mission/business processes the system will
      support, so that categorization and requirements trace to mission impact.
    raci: {R: [PER-SPONSOR], A: PER-PM, C: [PER-AO, PER-IO, PER-UR, PER-CIO, PER-CISO, PER-PRIV], I: [PER-ISSM]}
    inputs: [ART-ORG-CONTEXT, EXT-CAPDOC, EXT-PRODUCT]
    outputs: []
    writes_facts: []
    depends_on: [P-2]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - A capability need is documented (EXT-CAPDOC) and the organizational context is
        available.
      - The program has entered its pathway at its first decision point - the Materiel
        Development Decision on major capability acquisition; receipt of a validated UON, an
        approved critical warfighter issue statement or an RAA determination on urgent capability
        acquisition; an approved CNS on the software pathway; the validated services requirement on
        an acquisition of services.
    exit_criteria:
      - Missions, business functions and mission/business processes that the system is intended
        to support are identified (DoDI 8510.01 Table 1 outcome).
      - Interviews record the supported missions and mission/business processes, citable by P-9,
        P-10 and C-1.
    citations:
      - {ref: SP800-37R2, section: "TASK P-8", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-8 Mission or Business Focus"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: DODI8510.01, page: 10, anchor: "Maps systems to dependent missions"}
    playbook: playbooks/P/P-8.md
  - id: P-9
    name: System Stakeholders
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-A], reviews: [], decisions: []}
    purpose: >-
      Identify the stakeholders with an interest in the system across its life cycle, including
      every information owner and the user representative.
    raci: {R: [PER-PM, PER-SPONSOR], A: PER-PM, C: [PER-CIO, PER-AO, PER-IO, PER-CISO, PER-PRIV, PER-MDA], I: [PER-ISSM]}
    inputs: [EXT-PRODUCT, EXT-CAPDOC, EXT-ORG-POLICY]
    outputs: [ART-STAKE]
    writes_facts: []
    depends_on: [P-8]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Mission focus identified (P-8).
    exit_criteria:
      - The stakeholders having an interest in the system are identified (DoDI 8510.01 Table 1
        outcome).
      - ART-STAKE lists the stakeholders and the persona that represents each in interviews.
      - Every information owner is identified, because each sets the impact level for its own
        information types (CNSSI 1253).
      - ART-STAKE records each stakeholder's security concerns, loss concerns and trust
        expectations, which P-15 turns into protection needs.
    citations:
      - {ref: SP800-37R2, section: "TASK P-9", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-9 System Stakeholders"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: CNSSI1253, page: 13, anchor: "All information owners must be identified to provide inputs to this activity"}
      - {ref: DODI8510.01, page: 30, anchor: "URs represent the operational and functional requirements of the user community"}
    playbook: playbooks/P/P-9.md
  - id: P-10
    name: Asset Identification
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-A], reviews: [], decisions: []}
    purpose: >-
      Identify and prioritize the assets that require protection, as the system hardware and
      software inventory, including the components that perform mission-critical functions.
    raci: {R: [PER-PM, PER-ISSM], A: PER-PM, C: [PER-AO, PER-SPONSOR, PER-IO, PER-CISO, PER-PRIV, PER-DEV], I: []}
    inputs: [ART-STAKE, EXT-PRODUCT]
    outputs: [ART-INV]
    writes_facts: []
    depends_on: [P-9]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - ART-STAKE names who can describe the assets.
    exit_criteria:
      - Stakeholder assets are identified and prioritized (DoDI 8510.01 Table 1 outcome).
      - ART-INV and inventory.yaml list every hardware and software item with its component, and
        the assets are prioritized.
    citations:
      - {ref: SP800-37R2, section: "TASK P-10", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-10 Asset Identification"}
      - {ref: SP800-128, section: "2.3.4"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: DODI5000.90, page: 16, anchor: "Use assured suppliers or appropriate SCRM countermeasures for system elements", note: "Mission-critical elements need assured suppliers or SCRM countermeasures."}
    playbook: playbooks/P/P-10.md
  - id: P-11
    name: Authorization Boundary
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-A], reviews: [], decisions: []}
    purpose: >-
      Determine the authorization boundary of the system, its network architecture and data
      flows; the AO is accountable for the boundary.
    raci: {R: [PER-PM, PER-ISSM], A: PER-AO, C: [PER-CIO, PER-SPONSOR, PER-CISO, PER-PRIV, PER-LSE, PER-ISSE], I: []}
    inputs: [ART-INV, ART-STAKE, EXT-PRODUCT]
    outputs: [ART-BND]
    writes_facts: [boundary_id]
    depends_on: [P-10]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - ART-INV identifies the assets to be protected.
    exit_criteria:
      - The authorization boundary (that is, the system) is determined (DoDI 8510.01 Table 1
        outcome).
      - ART-BND and boundary.yaml describe the boundary, network architecture, data flows and
        components; facts.boundary_id set_by P-11.
    citations:
      - {ref: SP800-37R2, section: "TASK P-11", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-11 Authorization Boundary"}
      - {ref: SP800-37R2, section: "APPENDIX G"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: SP800-37R2, section: "2.5"}
    playbook: playbooks/P/P-11.md
  - id: P-12
    name: Information Types
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-A], reviews: [], decisions: []}
    purpose: >-
      Identify the types of information the system processes, stores and transmits, including
      whether it processes PII.
    raci: {R: [PER-PM, PER-IO], A: PER-PM, C: [PER-ISSM, PER-PRIV], I: []}
    inputs: [ART-INV, EXT-PRODUCT]
    outputs: [ART-INFOTYPES]
    writes_facts: []
    depends_on: [P-10]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - ART-INV identifies the assets and the data they hold.
    exit_criteria:
      - The types of information processed, stored and transmitted by the system are identified
        (DoDI 8510.01 Table 1 outcome).
      - ART-INFOTYPES and infotypes.yaml list each information type with its SP 800-60
        identifier and provisional impact levels.
      - The determination of whether the system processes PII is recorded for approval by the
        SAOP or designee.
    citations:
      - {ref: SP800-37R2, section: "TASK P-12", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-12 Information Types"}
      - {ref: SP800-60V1R1, section: "4.1"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: CNSSI1253, section: "3.1.1"}
    playbook: playbooks/P/P-12.md
  - id: P-13
    name: Information Life Cycle
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA]
    aligned_with: {milestones: [MS-A], reviews: [], decisions: []}
    purpose: >-
      Identify and understand every stage of the information life cycle (creation or collection,
      processing, dissemination, use, storage and disposition) for each information type.
    raci: {R: [PER-PRIV, PER-PM, PER-IO], A: PER-PM, C: [PER-CIO, PER-SPONSOR, PER-ISSE, PER-LSE], I: []}
    inputs: [ART-INFOTYPES, ART-BND, EXT-PRODUCT]
    outputs: [ART-INFOTYPES]
    writes_facts: []
    depends_on: [P-11, P-12]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Information types (P-12) and the boundary and data flows (P-11) are documented.
    exit_criteria:
      - All stages of the information life cycle are identified and understood for each
        information type processed, stored or transmitted by the system (DoDI 8510.01 Table 1
        outcome).
      - infotypes.yaml records the life-cycle stages and components for every information type.
    citations:
      - {ref: SP800-37R2, section: "TASK P-13", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-13 Information Life Cycle"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
    playbook: playbooks/P/P-13.md
  - id: P-14
    name: Risk Assessment—System
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA, PH-TMRR]
    aligned_with: {milestones: [MS-A], reviews: [RV-SRR], decisions: []}
    purpose: >-
      Conduct a system-level (mission-based cyber) risk assessment using Intelligence Community
      threat information, and keep its results current through the life cycle.
    raci: {R: [PER-PM, PER-ISSM, PER-PRIV], A: PER-PM, C: [PER-RE, PER-AO, PER-SPONSOR, PER-IO, PER-SCA], I: []}
    inputs: [ART-ORG-CONTEXT, ART-INV, ART-INFOTYPES, ART-BND, EXT-THREAT, EXT-PPP, EXT-STPP, EXT-ITRA, EXT-SEP]
    outputs: [ART-RA]
    writes_facts: []
    depends_on: [P-3, P-13]
    feeds_back_to: [P-3]
    min_interviews: 1
    entry_criteria:
      - Assets, boundary and information life cycle documented (P-10, P-11, P-13); threat
        information available.
    exit_criteria:
      - A system-level risk assessment is completed or an existing risk assessment is updated
        (DoDI 8510.01 Table 1 outcome).
      - ART-RA records threats, vulnerabilities, likelihood, impact and the resulting risks.
      - artifacts/data/ra.yaml states the purpose, scope, assumptions, constraints, dated
        information sources, risk model, analytic approach and risk tolerance, rates each threat
        source, threat event, vulnerability and predisposing condition, and holds the risk of
        each connection, external provider and supplier, the priority order and to whom the
        results are communicated (SRA-001 to SRA-003).
      - ART-RA identifies the system elements and interfaces that need specific attention in
        test events, for the cybersecurity strategy and the TEMP.
      - protection.yaml records the PPP the run read with its approval at each decision point
        passed, its critical items with their threats, vulnerabilities and countermeasures,
        exportability, anti-tamper, updates and transition (PPROT-001, PPROT-002); the TAPPs,
        horizontal protection guidance and S&T protection plan read (PPROT-003); and the
        security technical risks from the SEP and ITRAs with the reviews that assess them
        (PPROT-005).
