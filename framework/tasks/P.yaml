  - id: P-14
    name: Risk Assessment—System
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA, PH-TMRR]
    aligned_with: {milestones: [MS-A], reviews: [RV-SRR], decisions: []}
    purpose: >-
      Conduct a system-level (mission-based cyber) risk assessment using Intelligence Community
      threat information, and keep its results current through the life cycle. P-14 runs before
      C-2, which reads ART-RA, so its supplier risks are a first pass: SP 800-161r1 prioritizes
      the supplier risk assessment once the impact level is defined, and C-3 feeds back to P-14
      once the categorization is approved.
    raci: {R: [PER-PM, PER-ISSM, PER-PRIV, PER-ISSO], A: PER-PM, C: [PER-RE, PER-AO, PER-SPONSOR, PER-IO, PER-SCA], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-ORG-CONTEXT, ART-BIA, ART-INV, ART-INFOTYPES, ART-BND, EXT-THREAT, EXT-PPP, EXT-CSS, EXT-STPP, EXT-ITRA, EXT-SEP, ART-STAKE, EXT-PRODUCT]
    inputs_since: {ART-BIA: 0.2.0, ART-STAKE: 0.2.0, EXT-PRODUCT: 0.2.0}
    outputs: [ART-RA, ART-PIA]
    writes_facts: []
    depends_on: [P-3, P-13]
    feeds_back_to: [P-3]
    min_interviews: 1
    entry_criteria:
      - Assets, boundary and information life cycle documented (P-10, P-11, P-13); threat
        information available.
    exit_criteria:
      - A system-level risk assessment is completed or an existing risk assessment is updated
        (DoDI 8510.01 Table 1 outcome).
      - ART-RA records threats, vulnerabilities, likelihood, impact and the resulting risks.
      - artifacts/data/ra.yaml states the purpose, scope, assumptions, constraints, dated
        information sources, risk model, analytic approach and risk tolerance, rates each threat
        source, threat event, vulnerability and predisposing condition, and holds the risk of
        each connection, external provider and supplier, the priority order and to whom the
        results are communicated (SRA-001 to SRA-003).
      - ra.yaml is dated, lists the team with contact information, the rationale of each
        risk-related decision and any tailoring of its robustness with how far the results can be
        relied on, communicated to the AO or AODR; a subsequent assessment states what prompted it
        and the previous report; the risk model uses every SP 800-30 risk factor (RARC-001).
      - ART-RA identifies the system elements and interfaces that need specific attention in
        test events, for the cybersecurity strategy and the TEMP.
      - For a system processing PII, artifacts/data/ra.yaml `privacy` assesses the nature of the
        processing and its impact on individuals and evaluates each legal and policy privacy
        requirement, OMB A-130 among them, with what the privacy baseline leaves unmet
        (PRIV-007); where P-12 found a PIA required, artifacts/data/pia.yaml holds it on DD
        Form 2930 (2930A when adapted), coordinated through the ISSM, the privacy representative
        and the records office, reviewed by PER-CISO and PER-PRIV and approved by PER-CIO or the
        reviewing official (PRIV-002, PRIV-003).
      - ra.yaml components records each third-party and open-source software component with the
        six risk factors of DoWI 8430.01 3.5.i.(2), the further governance, community and
        license review of a non-trivial open-source component, and any independent third-party
        validation of a commercial product (SWA-002); ra.yaml ai_capabilities records each
        AI-enabled capability's use case risk, benchmarks, verification before deployment,
        monitoring and bias handling (DoWI 8430.01 3.6.e).
      - protection.yaml records the PPP the run read with its approval at each decision point
        passed, its critical items with their threats, vulnerabilities and countermeasures,
        exportability, anti-tamper, updates and transition (PPROT-001, PPROT-002); the TAPPs,
        horizontal protection guidance and S&T protection plan read (PPROT-003); and the
        security technical risks from the SEP and ITRAs with the reviews that assess them
        (PPROT-005).
      - protection.yaml program.decision_points records the CDD validation (MS-CDDV) during
        TMRR before the Development RFP release (ACQLC-002) and first fielding (MS-FIELD), where
        O&S begins, by IOC (ACQLC-003); a program that combines pathways defines each
        transition point, entry point, information requirement and approved transition approach
        in program.transitions (ACQLC-001).
      - cybersecurity-strategy.yaml records the CSS with its content, the approvals DoDI 5000.82
        Table 2 calls for by ACAT or BCAT (on the software pathway the DA's approval of the
        acquisition strategy holding it), and its reviews before each milestone decision and
        contract award (CSSTRAT-001 to CSSTRAT-003); scrm.yaml pm_actions records the PM's SCRM actions
        of DoDI 5000.90 3.4 (market research, illumination, the Table 1 due diligence of the risk
        tolerance level, DIA SCRM TAC requests and flagged reports, the assured supplier or
        countermeasure of each mission-critical item and validated products) (PMSCRM-001,
        PMSCRM-002).
      - ra.yaml system_risk designates the system's risk consistent with the most severe threat
        to any individual component or subcomponent, no lower than the highest risk ra.yaml
        rates against one, for requirements, acquisition and T&E (DoDI 8510.01 3.3.a(3),
        THREAT-001); the ISSO, a primary role, gives a P-14 interview (WFQ-002).
      - artifacts/data/scrm.yaml records the criticality analysis and TSN practices, a supplier
        for every inventory item tied to its ra.yaml supply chain record, the threat analysis,
        and an assessment of every critical supplier covering each Table 28 factor, with its
        SCRSS level, escalation and FASC sharing (SCRM-001 to SCRM-006).
    citations:
      - {ref: SP800-161R1, page: 61, anchor: "Establish and begin using supplier risk-assessment processes on a prioritized basis"}
      - {ref: SP800-37R2, section: "TASK P-14", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-14 Mission-Based Cyber Risk Assessment"}
      - {ref: SP800-30R1, section: "3.2"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: DODI5000.89, page: 16, anchor: "Conduct a mission-based cyber risk assessment (such as a cyber table top)"}
      - {ref: DODI5000.90, page: 11, anchor: "PMs must use cyber threat information produced by the Intelligence Community"}
      - {ref: SP800-53B, page: 21, anchor: "Organizations conduct privacy risk assessments that consider the nature of the PII"}
      - {ref: DODI5400.16, page: 9, anchor: "The PIA will be prepared using DD Form 2930, “Privacy Impact Assessment"}
    playbook: playbooks/P/P-14.md
  - id: P-15
    name: Requirements Definition
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA, PH-TMRR]
    aligned_with: {milestones: [MS-A], reviews: [RV-SRR], decisions: []}
    purpose: >-
      Define and prioritize the security and privacy requirements for the system and its
      environment, including cyber survivability, so they enter the requirements baseline before
      the SRR.
    raci: {R: [PER-SPONSOR, PER-PM, PER-IO, PER-PRIV], A: PER-PM, C: [PER-AO, PER-ISSM, PER-CISO, PER-MDA, PER-ISSE, PER-LSE, PER-UR, PER-ISSO], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-RA, ART-BIA, ART-INFOTYPES, ART-STAKE, EXT-CAPDOC, EXT-ORG-POLICY, EXT-PPP, EXT-STPP, ART-INV, ART-ORG-CONTEXT, EXT-PRODUCT, EXT-THREAT]
    inputs_since: {ART-BIA: 0.2.0, ART-INV: 0.2.0, ART-ORG-CONTEXT: 0.2.0, EXT-PRODUCT: 0.2.0, EXT-THREAT: 0.2.0}
    outputs: [ART-REQ]
    writes_facts: []
    depends_on: [P-14]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - System risk assessment available (P-14).
    exit_criteria:
      - Security and privacy requirements are defined and prioritized (DoDI 8510.01 Table 1
        outcome).
      - ART-REQ lists prioritized security and privacy requirements traced to their sources.
      - requirements.yaml records each stakeholder protection need with its success criteria,
        priority and rationale; a requirement traces to it and its stakeholder agrees the
        requirements address it (REQS-003). A change to the requirements reassesses the needs.
      - Each requirement traces to a protection need, a design policy statement or the
        requirement it is derived from, and carries a verification method, a performance or
        assurance measure and its relative criticality (REQS-001).
      - Every DoD design policy statement REQS-002 lists is addressed; one that applies is
        carried by a requirement, and only a conditional one may be marked not applicable.
      - The security-relevant constraints on the solution are recorded with their origin.
      - For a system of records, requirements.yaml privacy_act carries each Privacy Act rule no
        control states by a requirement, and each legal and policy privacy requirement ra.yaml
        finds applicable is carried by a requirement (PRIV-007).
      - requirements.yaml derivation records how the lead systems engineer derived the security
        and exportability requirements (DoDI 5000.83 3.3.c.(1)) - informed by the capability
        requirements document, CONOPS, operational mode summary and mission profiles, by methods
        that together address design, implementation, interfaces and access points - and the
        key performance parameters and attributes that establish survivability, sustainment and
        security measures; each security requirement is included in the system performance
        specification or the product support needs (SSE-001).
      - requirements.yaml engineering records the system security engineering practices for
        cybersecurity, cyber resilience and cyber survivability in design, test, manufacture and
        sustainment, for program protection and, with PII, for privacy, the SP 800-160v1r1
        Appendix E principles they apply, and the level of assurance with its basis and the
        requirements that carry it (SSE-002).
      - protection-requirements.yaml names the PPP, TAPPs, S&T protection plans and horizontal
        protection guidance read, records whether the capability document holds the protection
        content the CJCS puts in JCIDS capability requirements, raises each gap to the sponsor,
        and traces the protection requirements it derives (PPROT-004).
      - The capability document is of a kind the program's pathway uses, and a JCIDS document
        carries its validation date, on or before JCIDS was disestablished (ACQLC-004).
      - Each Receiving organization that joined before the system's release has its
        requirements in reciprocity.yaml gathered and coordinated before release, and each control
        it asks for is assessed (RCP-002).
    citations:
      - {ref: SP800-37R2, section: "TASK P-15", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-15 Requirements Definition"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: DODI5000.90, page: 10, anchor: "Represented within the system survivability key performance parameters"}
      - {ref: DODI8510.01, page: 20, anchor: "Requirements, development, procurement, and T&E processes must apply the RMF"}
    enforces: [REQ-SP800-37R2-0733]
    playbook: playbooks/P/P-15.md
  - id: P-16
    name: Enterprise Architecture
    step: P
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-MSA, PH-TMRR]
    aligned_with: {milestones: [], reviews: [RV-SRR], decisions: []}
    purpose: >-
      Determine the placement of the system within the enterprise, security and privacy
      architecture.
    raci: {R: [PER-LSE, PER-ISSE, PER-SPONSOR, PER-PRIV], A: PER-PM, C: [PER-CIO, PER-AO, PER-CISO, PER-IO], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-REQ, ART-BND, ART-INV, EXT-NSA-ASSESSMENT, ART-ORG-CONTEXT, ART-RA, EXT-PRODUCT]
    inputs_since: {ART-ORG-CONTEXT: 0.2.0, ART-RA: 0.2.0, EXT-PRODUCT: 0.2.0}
    outputs: [ART-BND]
    writes_facts: []
    depends_on: [P-15]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Security and privacy requirements defined (P-15).
    exit_criteria:
      - The placement of the system within the enterprise architecture is determined (DoDI
        8510.01 Table 1 outcome).
      - ART-BND records the system's place in the enterprise architecture, interconnections and
        any shared or cloud services.
      - boundary.yaml records each external connection with its detail and the approvals it
        needs, any cross-domain solution and mission partner terms, and whether the system is
        on the DODIN or outside it under a waiver (CONN-001 to CONN-004).
      - boundary.yaml records where the system is hosted and why, a new major application in a
        Defense Enterprise Computing Center unless operationally infeasible, why it is not an
        application in an existing authorized enclave, and the cloud hosting assessment of a new
        or modernized system (HOST-001).
      - nss-assessments.yaml records, for a National Security System, NSA's assessment with the
        cognizant AO of its cybersecurity requirements and security architecture before each
        milestone passed, and for a space NSS the coordination of its architecture, the check of
        pre-existing components and the compliance reports to the AO and NSA (PPROT-006).
    citations:
      - {ref: SP800-37R2, section: "TASK P-16", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-16 Enterprise Architecture"}
      - {ref: SP800-39, section: "2.4.2"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: SP800-37R2, page: 183, anchor: "THE IMPORTANCE OF ARCHITECTURE AND ENGINEERING"}
      - {ref: DODI8500.01, page: 38, anchor: "When operationally feasible all new major applications will be hosted"}
    playbook: playbooks/P/P-16.md
  - id: P-17
    name: Requirements Allocation
    step: P
    level: system
    optional: false
    primary_phase: PH-TMRR
    phases: [PH-TMRR]
    aligned_with: {milestones: [MS-DRFPRD], reviews: [RV-SFR], decisions: []}
    purpose: >-
      Allocate the security and privacy requirements to the system, its elements and its
      environment of operation, including common control providers, so the development RFP
      carries them.
    raci: {R: [PER-ISSE, PER-ISSM, PER-PRIV, PER-ISSO], A: PER-PM, C: [PER-CIO, PER-AO, PER-SPONSOR, PER-CISO, PER-CCP], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-REQ, ART-ORG-CONTEXT, ART-INV, ART-RA, EXT-ORG-POLICY]
    inputs_since: {ART-RA: 0.2.0, EXT-ORG-POLICY: 0.2.0}
    outputs: [ART-REQ]
    writes_facts: []
    depends_on: [P-5, P-16]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Requirements defined and the enterprise architecture placement known (P-15, P-16);
        common controls published (P-5).
    exit_criteria:
      - Security and privacy requirements are allocated to the system and to the environment in
        which the system operates (DoDI 8510.01 Table 1 outcome).
      - ART-REQ allocates every requirement to the system, a system element, the environment or
        a common control provider.
      - The cybersecurity requirements that contracts must carry are identified for the
        development RFP.
      - For a cloud service offering, those requirements include the contract clauses DTM 24-001
        lists (accreditation boundary and licensing, CSSP incident notification, threat-
        representative testing, CSP data for CSSP DCO, corrective action processes, access for
        inspection teams, report delivery); S-4 records them on the contract (CLOUD-004).
      - requirements.yaml allocates each requirement to a boundary component, the environment, a
        common control provider or the contract (REQS-001), and records the cyberspace work
        roles contractors perform with their qualification terms (REQS-004).
      - Each solicitation in protection-requirements.yaml carries the PPP countermeasures, the
        cyber resilient engineering requirements and the software and hardware assurance
        remediation strategies, and the mitigations of each reassessment reach the solicitations
        and contracts (PPROT-004).
      - The ISSO, a primary role (DoDI 8510.01 Table 1), gives a P-17 interview (WFQ-002).
      - artifacts/data/scrm-acquisition.yaml lists the C-SCRM requirements the contract carries,
        each allocated to the contract in requirements.yaml, every contract term of SP 800-161,
        revalidation, and a selection record per supplier screened against every prohibited
        supplier list (SCRM-007, SCRM-008, SCRM-015).
    citations:
      - {ref: SP800-37R2, section: "TASK P-17", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-17 Requirements Allocation"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: DODI8510.01, page: 10, anchor: "Require that contracts and other agreements include specific requirements"}
      - {ref: DODI5000.85, page: 14, anchor: "that program security has been accommodated"}
    playbook: playbooks/P/P-17.md
  - id: P-18
    name: System Registration
    step: P
    level: system
    optional: false
    primary_phase: PH-MSA
    phases: [PH-MSA, PH-TMRR]
    aligned_with: {milestones: [MS-A], reviews: [], decisions: []}
    purpose: >-
      Register the system in the DoD Component registry for management, accountability and
      oversight, so the Component CIO and CISO can track its authorization status.
    raci: {R: [PER-PM, PER-ISSM], A: PER-PM, C: [PER-ISSO, PER-SPONSOR], I: [PER-CISO, PER-CIO]}
    inputs: [ART-BND, EXT-REGISTRY, EXT-ORG-POLICY, EXT-PRODUCT]
    inputs_since: {EXT-ORG-POLICY: 0.2.0, EXT-PRODUCT: 0.2.0}
    outputs: [ART-REG]
    writes_facts: []
    depends_on: [P-11]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Authorization boundary determined (P-11).
    exit_criteria:
      - The system is registered for purposes of management, accountability, coordination and
        oversight (DoDI 8510.01 Table 1 outcome).
      - ART-REG records the registry entry for the system, in registration.yaml with ART-REG.
      - An Enterprise system registers the ports, protocols and services of every boundary
        connection in the DoD PPSM Registry (registration.yaml ppsm, PPSM-001).
      - registration.yaml registry records where the system is reported (reported_in, eMASS or
        ERS) and the Component's tool; an alternate tool records how its system data is imported
        into ERS (ers_import, UPD-001).
      - registration.yaml lists every deployment site of reciprocity.yaml, an update after each
        received system accepted, and an exemption justification when reciprocity listing is
        deselected (RCP-008).
    citations:
      - {ref: SP800-37R2, section: "TASK P-18", note: "SDLC phase: New – Initiation (concept/requirements definition); Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 14, anchor: "Task P-18 System Registration"}
      - {ref: DODCIO-RECIPROCITY, page: 9, anchor: "Register the Enterprise system in the DoD Ports, Protocols, and Services Management"}
      - {ref: DODI8510.01, page: 29, anchor: "Register the system in the DoD Component registry"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
      - {ref: DODI8510.01, page: 26, anchor: "Maintains visibility of assessment and authorization status"}
    enforces: [REQ-DODI5000.82-0075, REQ-DOWI8430.01-0232, REQ-DODCIO-CATO-EVAL-0073]
    playbook: playbooks/P/P-18.md
