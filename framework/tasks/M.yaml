# RMF Monitor tasks (SP 800-37r2 section 3.7), from fielding through disposal. feeds_back_to
# marks where monitoring results re-enter earlier tasks; it never orders tasks.
tasks:
  - id: M-1
    name: System and Environment Changes
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [MS-IOC], reviews: [RV-PCA], decisions: []}
    purpose: Monitor the system and its environment for changes that affect the security and privacy posture.
    raci: {R: [PER-PM, PER-CCP, PER-CISO, PER-PRIV, PER-ISSO], A: PER-PM, C: [PER-RE, PER-AODR, PER-IO, PER-ISSM, PER-CCB], I: [PER-AO]}
    inputs: [ART-CONMON, ART-CMP, ART-SSP, ART-INV, EXT-CHANGE-REQUESTS]
    outputs: [ART-CHG, ART-INV, ART-CMP]
    writes_facts: []
    depends_on: [R-4]
    feeds_back_to: [P-11, C-1]
    min_interviews: 1
    entry_criteria:
      - The system operates under an authorization (R-4).
    exit_criteria:
      - ART-CHG records each change with its security impact analysis and disposition; inventory and CM plan updated.
    citations:
      - {ref: SP800-37R2, section: "TASK M-1"}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-1 System and Environment Changes"}
      - {ref: SP800-128, section: "3.3.3"}
    playbook: playbooks/M/M-1.md
  - id: M-2
    name: Ongoing Assessments
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: Assess implemented and inherited controls on the frequencies of the continuous monitoring strategy.
    raci: {R: [PER-SCA], A: PER-SCA, C: [PER-AODR, PER-PM, PER-CCP, PER-IO, PER-ISSM, PER-ISSO, PER-PRIV, PER-CISO, PER-CSSP], I: [PER-AO]}
    inputs: [ART-CONMON, ART-SSP, ART-SAP, ART-SAR, ART-POAM, EXT-MONITORING]
    outputs: [ART-SAR, ART-CONMON]
    writes_facts: []
    depends_on: [M-1, S-5]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Monitoring data collected per the continuous monitoring strategy.
    exit_criteria:
      - sar/results updated with the ongoing assessment results; conmon.yaml adjusted where frequencies changed.
    citations:
      - {ref: SP800-37R2, section: "TASK M-2"}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-2 Ongoing Assessments"}
      - {ref: SP800-137, section: "3.4"}
    playbook: playbooks/M/M-2.md
  - id: M-3
    name: Ongoing Risk Response
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: Respond to risk from ongoing monitoring, risk assessments and outstanding POA&M items.
    raci: {R: [PER-PM, PER-CCP, PER-ISSM], A: PER-AO, C: [PER-RE, PER-PRIV, PER-AODR, PER-IO, PER-ISSE, PER-CSSP], I: []}
    inputs: [ART-SAR, ART-RA, ART-POAM]
    outputs: [ART-RA, ART-POAM]
    writes_facts: []
    depends_on: [M-2]
    feeds_back_to: [A-5]
    min_interviews: 1
    entry_criteria:
      - Ongoing assessment results available (M-2).
    exit_criteria:
      - Each new or changed risk has a mitigation or an AO risk-acceptance decision; ART-RA and the POA&M updated.
    citations:
      - {ref: SP800-37R2, section: "TASK M-3"}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-3 Ongoing Risk Response"}
    playbook: playbooks/M/M-3.md
  - id: M-4
    name: Authorization Updates
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: Update the security plan, assessment report, risk assessment and POA&M from continuous monitoring results.
    raci: {R: [PER-PM, PER-CCP, PER-ISSM], A: PER-PM, C: [PER-IO, PER-ISSO, PER-PRIV, PER-CISO], I: [PER-AO]}
    inputs: [ART-SAR, ART-POAM, ART-SSP, ART-RA]
    outputs: [ART-SSP, ART-SAR, ART-POAM, ART-RA]
    writes_facts: []
    depends_on: [M-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk responses decided (M-3).
    exit_criteria:
      - Authorization package artifacts reflect the current state of the system.
    citations:
      - {ref: SP800-37R2, section: "TASK M-4"}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-4 Authorization Package Updates"}
    playbook: playbooks/M/M-4.md
  - id: M-5
    name: Security and Privacy Reporting
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: Report the security and privacy posture to the AO and senior leaders as the monitoring strategy requires.
    raci: {R: [PER-PM, PER-CCP, PER-CISO, PER-PRIV, PER-ISSM], A: PER-PM, C: [PER-ISSO, PER-CSSP], I: [PER-AO, PER-CIO]}
    inputs: [ART-SAR, ART-POAM, ART-CONMON, ART-RA]
    outputs: [ART-SECRPT]
    writes_facts: []
    depends_on: [M-4]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Authorization artifacts current (M-4).
    exit_criteria:
      - ART-SECRPT reports posture, open POA&M items and trends to the recipients in conmon.yaml.
    citations:
      - {ref: SP800-37R2, section: "TASK M-5"}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-5 Security and Privacy Reporting"}
      - {ref: SP800-137, section: "3.4.3"}
    playbook: playbooks/M/M-5.md
  - id: M-6
    name: Ongoing Authorization
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [MS-FOC], reviews: [], decisions: [AD-CATO]}
    purpose: The AO reviews the posture on an ongoing basis to determine whether the risk remains acceptable.
    raci: {R: [PER-AO], A: PER-AO, C: [PER-RE, PER-CIO, PER-CISO, PER-PRIV, PER-AODR], I: [PER-PM, PER-ISSM]}
    inputs: [ART-SECRPT, ART-POAM, ART-RA, ART-ORG-CONTEXT, ART-SSP]
    outputs: [ART-AODM]
    writes_facts: []
    depends_on: [M-5]
    feeds_back_to: [R-2]
    min_interviews: 1
    entry_criteria:
      - Posture reports available (M-5); the monitoring strategy sets the ongoing-authorization triggers.
    exit_criteria:
      - decision.yaml records the ongoing authorization determination (continue, AD-CATO, or denial).
    citations:
      - {ref: SP800-37R2, section: "TASK M-6"}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-6 Ongoing Authorization"}
      - {ref: SP800-137, section: "2.2"}
    playbook: playbooks/M/M-6.md
  - id: M-7
    name: System Disposal
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: Implement the disposal strategy and execute the required actions when the system is removed from operation.
    raci: {R: [PER-PM, PER-ISSM], A: PER-PM, C: [PER-AODR, PER-IO, PER-ISSO, PER-PRIV, PER-RE], I: [PER-AO]}
    inputs: [ART-SSP, ART-INV, ART-RA]
    outputs: [ART-DISP]
    writes_facts: []
    depends_on: [M-6]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - A decision to remove the system from operation.
    exit_criteria:
      - ART-DISP records the disposal strategy, media sanitization and registry and inventory updates.
    citations:
      - {ref: SP800-37R2, section: "TASK M-7"}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-7 System Disposal"}
    playbook: playbooks/M/M-7.md
