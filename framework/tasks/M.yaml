# RMF Monitor tasks (SP 800-37r2 section 3.7), from fielding through disposal. feeds_back_to
# marks where monitoring results re-enter earlier tasks; it never orders tasks.
tasks:
  - id: M-1
    name: System and Environment Changes
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [MS-IOC], reviews: [RV-PCA], decisions: []}
    purpose: >-
      Monitor the system and its environment for changes that affect the security and privacy
      posture, analyzing the security impact of each change.
    raci: {R: [PER-PM, PER-CCP, PER-CISO, PER-PRIV, PER-ISSO], A: PER-PM, C: [PER-RE, PER-AODR, PER-IO, PER-ISSM, PER-CCB], I: [PER-AO], when: {PER-PRIV: processes-pii}}
    inputs: [ART-CONMON, ART-CMP, ART-SSP, ART-INV, ART-SD, ART-POAM, ART-RAR, EXT-CHANGE-REQUESTS, EXT-THREAT, ART-ORG-CONTEXT, ART-SAR, EXT-MONITORING, EXT-ORG-POLICY, EXT-PRODUCT]
    inputs_since: {ART-ORG-CONTEXT: 0.2.0, ART-SAR: 0.2.0, EXT-MONITORING: 0.2.0, EXT-ORG-POLICY: 0.2.0, EXT-PRODUCT: 0.2.0}
    outputs: [ART-CHG, ART-INV, ART-CMP, ART-POAM, ART-SAR, ART-SSP, ART-CP]
    outputs_since: {ART-POAM: 0.2.0, ART-SAR: 0.2.0, ART-SSP: 0.2.0, ART-CP: 0.2.0}
    writes_facts: []
    depends_on: [R-4]
    feeds_back_to: [P-11, C-1]
    min_interviews: 1
    entry_criteria:
      - The system operates under an authorization (R-4).
    exit_criteria:
      - The system and environment of operation are monitored in accordance with the continuous
        monitoring strategy (DoDI 8510.01 Table 7 outcome).
      - ART-CHG records each change with its security impact analysis and disposition; inventory
        and CM plan updated.
      - changes.yaml carries each change through control, test, decision, notice, verification and
        close-out, or marks it exempt or pre-approved (MCHG-001).
      - Monitoring looks for unauthorized changes as well as requested ones, each with its root
        cause and the POA&M item or risk that responds at M-3 (MCHG-002).
      - A lawful LE/CI deployment is accommodated and coordinated with the AO through change
        control (MCHG-003).
      - The AO decision on each hosted or interconnected system is enforced (MCON-001).
      - A significant system modification re-enters the RMF at the affected task (feeds back to
        P-11 and C-1).
      - For a system processing PII, each change states whether it creates new privacy risk
        (privacy_impact), and each that does is followed by a PIA review in pia.yaml updates
        (PRIV-005).
      - An implemented change of significant security impact has a system plan change in
        plan-reviews.yaml that references it (change_ref, UPD-002).
    citations:
      - {ref: SP800-37R2, section: "TASK M-1", note: "SDLC phase: New – Operations/Maintenance; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-1 System and Environment Changes"}
      - {ref: SP800-128, section: "3.3.3"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
      - {ref: SP800-128, section: "2.3.9"}
      - {ref: DODI8510.01, page: 12, anchor: "and for any significant system modifications"}
      - {ref: SP800-128, section: "3.3.2"}
      - {ref: SP800-128, section: "3.4.1"}
      - {ref: DODI8500.01, page: 33, anchor: "accommodate all applicable legitimate and lawful deployment of LE/CI tools"}
      - {ref: DODI8510.01, page: 29, anchor: "Enforce AO authorization decisions for hosted or interconnected systems"}
    enforces: [REQ-SP800-34R1-0221]
    playbook: playbooks/M/M-1.md
  - id: M-2
    name: Ongoing Assessments
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: >-
      Assess implemented and inherited controls on the frequencies of the continuous monitoring
      strategy, with reviews of the system at least annually.
    raci: {R: [PER-SCA], A: PER-SCA, C: [PER-AODR, PER-PM, PER-CCP, PER-IO, PER-ISSM, PER-ISSO, PER-PRIV, PER-CISO, PER-CSSP], I: [PER-AO], when: {PER-PRIV: processes-pii}}
    inputs: [ART-CONMON, ART-SSP, ART-SAP, ART-SAR, ART-POAM, ART-SVCA, EXT-MONITORING, ART-ORG-CONTEXT, ART-RA, EXT-TEST-RESULTS]
    inputs_since: {ART-ORG-CONTEXT: 0.2.0, ART-RA: 0.2.0, EXT-TEST-RESULTS: 0.2.0}
    outputs: [ART-SAR, ART-CONMON, ART-SVCA, ART-SAP]
    outputs_since: {ART-SAP: 0.2.0}
    writes_facts: []
    depends_on: [M-1, S-5]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Monitoring data collected per the continuous monitoring strategy.
    exit_criteria:
      - Ongoing testing and assessments of control effectiveness are conducted in accordance
        with the continuous monitoring strategy (DoDI 8510.01 Table 7 outcome).
      - sar/results updated with the ongoing assessment results; conmon.yaml adjusted where
        frequencies changed.
      - conmon.yaml records the security measurement results of the cycle, each against its
        measure's acceptable parameters, with the measurement users informed (MMEAS-001).
    citations:
      - {ref: SP800-37R2, section: "TASK M-2", note: "SDLC phase: New – Operations/Maintenance; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-2 Ongoing Assessments"}
      - {ref: SP800-137, section: "3.4"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 29, anchor: "Oversee periodic reviews, testing, and assessment of assigned systems, conducted at least annually"}
      - {ref: DODCIO-DEVSECOPS, section: "3.2.5"}
      - {ref: SP800-160V1R1, page: 177, anchor: "Security-relevant information needs are identified"}
    enforces: [REQ-SP800-137-0073]
    playbook: playbooks/M/M-2.md
  - id: M-3
    name: Ongoing Risk Response
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: >-
      Respond to risk from ongoing monitoring, risk assessments, emerging threats and
      outstanding POA&M items.
    raci: {R: [PER-PM, PER-CCP, PER-ISSM], A: PER-AO, C: [PER-RE, PER-PRIV, PER-AODR, PER-IO, PER-ISSE, PER-CSSP], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SAR, ART-RA, ART-POAM, ART-RAR, ART-CHG, ART-ORG-CONTEXT, EXT-INSPECTIONS, EXT-THREAT, EXT-DIRECTIVES, EXT-VDP, ART-SSP]
    inputs_since: {ART-SSP: 0.2.0}
    outputs: [ART-RA, ART-POAM, ART-RAR, ART-SAR]
    outputs_since: {ART-SAR: 0.2.0}
    writes_facts: []
    depends_on: [M-2]
    feeds_back_to: [A-5]
    min_interviews: 1
    entry_criteria:
      - Ongoing assessment results available (M-2), or a new or previously unaddressed threat
        has emerged and the PM has started a risk assessment.
    exit_criteria:
      - Courses of action are selected and their responses communicated as the
        organization's risk response strategy in ART-ORG-CONTEXT (org-context.yaml
        risk_response) directs.
      - The output of continuous monitoring activities is analyzed and responded to
        appropriately (DoDI 8510.01 Table 7 outcome).
      - Each new or changed risk has a mitigation or an AO risk-acceptance decision; ART-RA and
        the POA&M updated.
      - Each new or changed risk in rar.yaml weighs courses of action, or one evaluated as
        adequate, and records the selected response (RAR-003).
      - Where M-2 found a risk response ineffective, ART-RA records why, and the response goes
        back to the part of R-3 the failure points to, its implementation for a compliance
        failure, the whole response, and the risk assessment if needed, for an effectiveness
        failure.
      - POA&M items and risk responses keep their prioritized order, original dates and honest
        status; a slipped milestone is recorded as a change (ASMT-010, ASMT-011, ASMT-012).
      - Decisions to withhold or delay vulnerability remediation are coordinated with the
        requirements sponsor, the AO and the Component cyberspace operations forces.
      - Each readiness inspection or outside evaluation finding is in external_findings of
        poam/items.yaml, carried by a POA&M item or an accepted risk (MPOA-001).
      - The root cause of each unauthorized change in ART-CHG is answered here (MCHG-002).
      - Each order, directive, IAVM alert or bulletin received (EXT-DIRECTIVES) is in
        directed_actions of poam/items.yaml with who implements it and its response,
        implemented, tracked in a POA&M item or withheld after coordination, and its compliance
        status reported up the Component reporting chain to CDRUSCYBERCOM (VULN-001, VULN-002);
        for a cloud service, the CSSP's notice of an order or CPCON change is how it arrives, and
        the mission owner, with the CSSP, prioritizes its requirements and passes them to the
        CSP.
      - Each VDP report received (EXT-VDP) is validated, and a valid one is rated, planned in a
        POA&M item with source_of_weakness vdp, kept before the system owner and the AO, and
        reported within VRMN (VULN-003).
      - Each vulnerability M-3 analyzes, and every one a validated VDP report names, has an
        analysis record in vulnerabilities of poam/items.yaml, reported on discovery and rated on CVSS 3.1 with its expected loss of
        confidentiality, integrity and availability (VULN-004); its fix is chosen case by case
        and tracked, and verified by successive scans once completed (VULN-005); one not
        publicly known is submitted to USCYBERCOM for the VEP (VULN-006).
    citations:
      - {ref: SP800-37R2, section: "TASK M-3", note: "SDLC phase: New – Operations/Maintenance; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-3 Ongoing Risk Response"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
      - {ref: SP800-137, section: "3.5"}
      - {ref: DODI5000.90, page: 11, anchor: "the PM will initiate a risk assessment to identify the risk to the platform"}
      - {ref: DODI8510.01, page: 7, anchor: "decisions to withhold or delay vulnerability remediation"}
      - {ref: DODI8530.01, page: 36, anchor: "verify POA&Ms to correct deficiencies or weaknesses"}
      - {ref: DODI8530.01, page: 29, anchor: "Verifies DoD Component organizations and individuals take directed actions, maintain POA&Ms"}
      - {ref: DODI8531.01, page: 19, anchor: "Determine, on a case-by-case basis, which remediation or mitigation method is most beneficial"}
      - {ref: DODI8531.01, page: 16, anchor: "During the VDP coordination process, the DoD Components will:"}
    playbook: playbooks/M/M-3.md
  - id: M-4
    name: Authorization Updates
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: >-
      Update the security plan, assessment report, risk assessment and POA&M from continuous
      monitoring results.
    raci: {R: [PER-PM, PER-CCP, PER-ISSM], A: PER-PM, C: [PER-IO, PER-ISSO, PER-PRIV, PER-CISO], I: [PER-AO], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SAR, ART-POAM, ART-SSP, ART-RA, ART-CHG, ART-CONMON, ART-ORG-CONTEXT]
    inputs_since: {ART-ORG-CONTEXT: 0.2.0}
    outputs: [ART-SSP, ART-SAR, ART-POAM, ART-RA, ART-IRP]
    outputs_since: {ART-IRP: 0.2.0}
    writes_facts: []
    depends_on: [M-3]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Risk responses decided (M-3).
    exit_criteria:
      - Risk management documents are updated based on continuous monitoring activities (DoDI
        8510.01 Table 7 outcome).
      - Authorization package artifacts reflect the current state of the system.
      - A POA&M item on a vulnerability in NSA-approved cryptography is listed in `cryptography.vulnerabilities` of ssp-records.yaml with its referral to NSA and the VEP (CRYP-003).
      - plan-reviews.yaml logs the review of the system plan on the organization-defined schedule
        and each update, approved and tracked by change management (MPLAN-001).
      - ART-RA is updated as conmon.yaml risk_assessment says (its frequency and triggers),
        what was updated is recorded, and the results reach its communicated_to officials.
      - plan-reviews.yaml changes logs the M-4 update of the plans from the continuous
        monitoring results, covering the privacy plan for a system processing PII (PRIV-010).
    citations:
      - {ref: SP800-37R2, section: "TASK M-4", note: "SDLC phase: New – Operations/Maintenance; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-4 Authorization Package Updates"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
      - {ref: SP800-18R2, section: "4.7"}
      - {ref: DODI5000.90, page: 13, anchor: "Each iteration should conclude with the AO validating the PM's cybersecurity strategy and updated POA&M"}
      - {ref: SP800-18R2, section: "3.1"}
    enforces: [REQ-SP800-61R3-0155]
    playbook: playbooks/M/M-4.md
  - id: M-5
    name: Security and Privacy Reporting
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: >-
      Report the security and privacy posture to the AO and senior leaders as the monitoring
      strategy requires.
    raci: {R: [PER-PM, PER-CCP, PER-CISO, PER-PRIV, PER-ISSM], A: PER-PM, C: [PER-ISSO, PER-CSSP, PER-RE], I: [PER-AO, PER-CIO], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SAR, ART-POAM, ART-CONMON, ART-RA, ART-CHG, ART-SD, ART-ORG-CONTEXT, ART-SSP]
    inputs_since: {ART-ORG-CONTEXT: 0.2.0, ART-SSP: 0.2.0}
    outputs: [ART-SECRPT]
    writes_facts: []
    depends_on: [M-4]
    feeds_back_to: [P-7]
    min_interviews: 1
    entry_criteria:
      - Authorization artifacts current (M-4).
    exit_criteria:
      - A process is in place to report the security, privacy and supply chain risk management
        posture to the AO and other senior leaders and executives (DoDI 8510.01 Table 7
        outcome).
      - ART-SECRPT reports posture, open POA&M items and trends to the recipients in
        conmon.yaml.
      - posture-reports.yaml carries each report's marking and deliveries, and the status the
        system's GENSER or SE designation sends to DoD bodies (MRPT-001).
      - POA&M updates and vulnerability coordination are owed as required, to each body
        conmon.yaml names in reporting.dodin.required_by with who required them.
      - The risk executive (function) and the CISO review the status reports at the organization
        tier, and that review feeds P-7 (MRPT-002).
      - For a system processing PII, ART-SECRPT names the Component privacy report path (the
        PCLO through the SCOP to the Chief, DPCLTD, the semiannual and FISMA privacy inputs) and
        any system of records with PII that cannot be appropriately protected.
      - The compliance status of each directed action and the VRMN reports of each VDP report
        in poam/items.yaml reach the bodies that oversee them (VULN-002, VULN-003).
    citations:
      - {ref: SP800-37R2, section: "TASK M-5", note: "SDLC phase: New – Operations/Maintenance; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-5 Security and Privacy Reporting"}
      - {ref: SP800-137, section: "3.4.3"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 30, anchor: "Maintain and report systems assessment and authorization status"}
      - {ref: DODCIO-CATO, page: 1, anchor: "all security controls will need to be fed into a system level dashboard view"}
      - {ref: DODI8530.01, page: 4, anchor: "Data on the cybersecurity status of the DODIN and connected mission partner systems"}
      - {ref: DODI8530.01, page: 36, anchor: "POA&Ms and subsequent updates will be provided to"}
      - {ref: SP800-137, section: "3.4.2"}
    playbook: playbooks/M/M-5.md
  - id: M-6
    name: Ongoing Authorization
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-PD, PH-OS]
    aligned_with: {milestones: [MS-FOC], reviews: [], decisions: [AD-CATO, AD-CONT, AD-RCATO, AD-RESC, AD-DATO, AD-DATU, AD-DCCA]}
    purpose: >-
      The AO reviews the posture on an ongoing basis to determine whether the risk remains
      acceptable and, where monitoring is near real time, may seek a cATO through the Component
      CISO.
    raci: {R: [PER-AO], A: PER-AO, C: [PER-RE, PER-CIO, PER-CISO, PER-PRIV, PER-AODR], I: [PER-PM, PER-ISSM], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SECRPT, ART-POAM, ART-RA, ART-ORG-CONTEXT, ART-SSP, EXT-ISCM-ASSESSMENT]
    outputs: [ART-AODM, ART-AUTHREC, ART-RAR]
    outputs_since: {ART-RAR: 0.2.0}
    writes_facts: [acquisition]
    depends_on: [M-5]
    feeds_back_to: [R-2]
    min_interviews: 1
    entry_criteria:
      - Posture reports available (M-5); the monitoring strategy sets the ongoing-authorization
        triggers.
      - For AD-CATO, an ATO is in place and the system shows robust continuous monitoring of its
        RMF controls, active cyber defense and use of an approved DevSecOps reference design.
    exit_criteria:
      - Before the first continued authorization, ART-ORG-CONTEXT records the
        organization-wide ongoing authorization process with both transition conditions
        and an ISCM program in place (OCTX-010).
      - The AO conducts ongoing authorization using the results of continuous monitoring and
        communicates changes in risk determination and acceptance decisions (DoDI 8510.01 Table
        7 outcome).
      - authorizations.yaml restates `system_status` with the new record (SSPR-001).
      - authorizations.yaml gains a record of the determination (AD-CONT, AD-CATO, AD-RCATO,
        AD-RESC or a denial) naming the authorization it rests on, which stays in the ledger
        (AODM-005); a cATO also meets AODM-007.
      - A change of AO is an `ao-change` record whose ao_transfer states what the new official
        reviewed, finds and does about it (AOCHG-001).
      - An ISCM program assessment report the determination reads is in iscm_assessments of the
        ledger (MISCM-001).
    citations:
      - {ref: SP800-37R2, section: "TASK M-6", note: "SDLC phase: New – Operations/Maintenance; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-6 Ongoing Authorization"}
      - {ref: SP800-137, section: "2.2"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
      - {ref: SP800-37R2, page: 167, anchor: "ONGOING AUTHORIZATION"}
      - {ref: SP800-37R2, page: 171, anchor: "REAUTHORIZATION"}
      - {ref: DODCIO-CATO, page: 1, anchor: "the Authorizing Official (AO) must be able to demonstrate three main"}
      - {ref: DODCIO-CATO, page: 2, anchor: "the AO will notify the component CISO of the intention to move that system to a cATO"}
      - {ref: DODI5000.90, page: 13, anchor: "While the AO may authorize a continuous ATO (cATO)"}
      - {ref: SP800-37R2, page: 172, anchor: "When there is a change in authorizing officials"}
      - {ref: SP800-137A, section: "3.1"}
    playbook: playbooks/M/M-6.md
  - id: M-7
    name: System Disposal
    step: M
    level: system
    optional: false
    primary_phase: PH-OS
    phases: [PH-OS]
    aligned_with: {milestones: [], reviews: [], decisions: []}
    purpose: >-
      Implement the disposal strategy and execute the required actions when the system is
      removed from operation.
    raci: {R: [PER-PM, PER-ISSM], A: PER-PM, C: [PER-AODR, PER-IO, PER-ISSO, PER-PRIV, PER-RE], I: [PER-AO], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SSP, ART-INV, ART-RA, ART-ORG-CONTEXT]
    inputs_since: {ART-ORG-CONTEXT: 0.2.0}
    outputs: [ART-DISP, ART-INV, ART-SSP]
    outputs_since: {ART-INV: 0.2.0, ART-SSP: 0.2.0}
    writes_facts: []
    depends_on: [M-6]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - A decision to remove the system from operation.
    exit_criteria:
      - A system disposal strategy is developed and implemented, as needed (DoDI 8510.01 Table 7
        outcome).
      - ART-DISP records the disposal strategy, media sanitization and registry and inventory
        updates.
      - The inventory of information systems shows the removal; ART-INV and ART-SSP list M-7 in
        touched_by, and registration.yaml updates holds the disposal update by M-7 (UPD-001).
    citations:
      - {ref: SP800-37R2, section: "TASK M-7", note: "SDLC phase: New – Not Applicable; Existing – Disposal."}
      - {ref: DODI8510.01, page: 19, anchor: "Task M-7 System Disposal"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
      - {ref: DODI5000.85, page: 18, anchor: "sustains the system over its life cycle, including disposal"}
    enforces: [REQ-SP800-37R2-0457]
    playbook: playbooks/M/M-7.md
