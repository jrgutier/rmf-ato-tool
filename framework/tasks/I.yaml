# RMF Implement tasks (SP 800-37r2 section 3.4), carried out in EMD as the design is built.
tasks:
  - id: I-1
    name: Control Implementation
    step: I
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD]
    aligned_with: {milestones: [], reviews: [RV-CDR], decisions: []}
    purpose: >-
      Implement the controls in the approved security plan through systems security engineering,
      applying STIG/SRG secure configurations, and design them into the product baseline by the
      CDR.
    raci: {R: [PER-PM, PER-CCP, PER-DEV, PER-ISSE], A: PER-PM, C: [PER-IO, PER-PRIV, PER-ISSM, PER-ISSO, PER-LSE], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SSP, ART-BIA, EXT-STIG, EXT-PRODUCT, ART-INV, ART-ORG-CONTEXT, ART-RA, ART-REQ, EXT-ORG-POLICY]
    inputs_since: {ART-BIA: 0.2.0, ART-INV: 0.2.0, ART-ORG-CONTEXT: 0.2.0, ART-RA: 0.2.0, ART-REQ: 0.2.0, EXT-ORG-POLICY: 0.2.0}
    outputs: [ART-STIG]
    writes_facts: []
    depends_on: [S-6]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Security plan approved (S-6).
      - Detailed design is under way in EMD, with a system security engineer integrated into the
        systems engineering process.
    exit_criteria:
      - Controls specified in the security and privacy plans are implemented using systems
        security and privacy engineering methodologies (DoDI 8510.01 Table 4 outcome).
      - stig-summary.yaml maps every software and OS inventory item to a STIG/SRG or a
        not-applicable rationale (STIG-001).
    citations:
      - {ref: SP800-37R2, section: "TASK I-1", note: "SDLC phase: New – Development/Acquisition, Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 16, anchor: "Task I-1 Control Implementation"}
      - {ref: SP800-37R2, section: "TABLE 5: IMPLEMENT TASKS AND OUTCOMES"}
      - {ref: DODI8510.01, page: 29, anchor: "Verify each program acquiring a system has an assigned system security engineer"}
      - {ref: DODI5000.88, page: 16, anchor: "guide system security engineering activities, which includes software assurance"}
      - {ref: SP800-128, section: "3.2.2"}
      - {ref: DODCIO-DEVSECOPS, section: "3.1.1", note: "For software built in a DevSecOps software factory."}
    playbook: playbooks/I/I-1.md
  - id: I-2
    name: Update Control Implementation Information
    step: I
    level: system
    optional: false
    primary_phase: PH-EMD
    phases: [PH-EMD]
    aligned_with: {milestones: [], reviews: [RV-TRR], decisions: []}
    purpose: >-
      Update the security plan and related artifacts to the as-implemented state, with the
      configuration baseline, before test readiness.
    raci: {R: [PER-ISSM, PER-CCP, PER-DEV], A: PER-PM, C: [PER-IO, PER-ISSE, PER-PRIV, PER-ISSO, PER-LSE], I: [], when: {PER-PRIV: processes-pii}}
    inputs: [ART-SSP, ART-STIG, EXT-PRODUCT]
    outputs: [ART-SSP, ART-SD, ART-INV, ART-CMP, ART-CP, ART-IRP]
    writes_facts: []
    depends_on: [I-1]
    feeds_back_to: []
    min_interviews: 1
    entry_criteria:
      - Controls implemented (I-1).
    exit_criteria:
      - Changes to the planned implementation of controls are documented, and the security and
        privacy plans are updated from what was learned during implementation (DoDI 8510.01
        Table 4 outcome).
      - Every SSP statement describes the as-implemented control in enough detail for assessors;
        inventory and plans reflect the built system.
      - A security-relevant constraint that implementation or integration raises on the
        requirements is reported to PER-ISSE for the next revisit of P-15, which records it in
        requirements.yaml with its origin.
      - plan-reviews.yaml changes logs the I-2 update of the plans with the as-implemented
        details, covering the privacy plan for a system processing PII (PRIV-010).
      - Each received system accepted in reciprocity.yaml has the Receiving AO's authorization to
        use on an acceptable risk, its copy to the Granting AO, notice to subordinate sites, this
        system's authorization documentation updated through the change log, the installation
        implemented and the inherited controls provided (RCP-005).
    citations:
      - {ref: SP800-37R2, section: "TASK I-2", note: "SDLC phase: New – Development/Acquisition, Implementation/Assessment; Existing – Operations/Maintenance."}
      - {ref: DODI8510.01, page: 16, anchor: "Task I-2 Update Control Implementation Information"}
      - {ref: SP800-128, section: "2.3.7"}
      - {ref: SP800-37R2, section: "TABLE 5: IMPLEMENT TASKS AND OUTCOMES"}
      - {ref: SP800-18R2, section: "4.4"}
    playbook: playbooks/I/I-2.md
