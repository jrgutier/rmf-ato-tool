    generated: false
    data:
      - {path: artifacts/data/rar.yaml, schema: rar}
    oscal: ["assessment-results#results.risks"]
    template: templates/artifacts/ART-RAR.md
    citations:
      - {ref: SP800-30R1, section: "APPENDIX K"}
      - {ref: SP800-37R2, section: "TASK R-2"}
  - id: ART-PKG
    name: Authorization package manifest
    description: Generated manifest of the authorization package contents (security plan, assessment report, POA&Ms and supporting artifacts).
    producer: R-1
    package: supporting
    generated: true
    data:
      - {path: package/manifest.yaml, schema: null}
    oscal: []
    template: null
    citations:
      - {ref: DODI8510.01, page: 19, anchor: "The security authorization documentation package is made up of"}
      - {ref: SP800-37R2, section: "TASK R-1"}
  - id: ART-AODM
