# Inputs no framework task produces (FW-IO-001 accepts them anywhere): the product material
# a fork supplies, organizational guidance, reference content and operational data.
external_inputs:
  - id: EXT-PRODUCT
    name: Product material
    description: >-
      System design and requirements documentation, concept of operations, architecture,
      data flows, interfaces and hardware/software lists supplied in product/ (proposed values
      in product/profile.yaml).
    kind: product
    citations:
      - {ref: SP800-37R2, section: "TASK C-1"}
  - id: EXT-CAPDOC
    name: Capability requirements documents
    description: >-
      The document that states and validates the capability need for the pathway: on major
      capability acquisition the CDD or the equivalent requirements document (JCIDS documents
      validated before JCIDS was disestablished on August 20, 2025, the requirements document
      that replaced them after; ACQLC-004); a validated JUON, JEON or DoD Component UON, a critical warfighter
      issue statement approved by the Warfighter SIG, or a SecDef or DepSecDef RAA determination
      document on urgent capability acquisition; the capability needs statement and user agreement
      on the software pathway; business requirements on defense business systems; and the
      services requirement validated by the SRRB for an acquisition of services. P-15 records in
      protection-requirements.yaml whether it holds the SCRM, export control, anti-tamper,
      counterintelligence and security support, and threat content the CJCS puts in JCIDS
      capability requirements (PPROT-004), and the information requirements of the milestone or
      decision point it supports.
    kind: product
    citations:
      - {ref: DODI8510.01, page: 29, anchor: "capabilities development document"}
      - {ref: DODI5000.02, page: 6, anchor: "Updates the issuance to reflect the disestablishment of the Joint Capabilities Integration"}
      - {ref: DODI5000.83, page: 9, anchor: "SCRM, export control, and AT requirements"}
      - {ref: DODI5000.81, page: 11, anchor: "Pre-development begins upon receipt of either a validated UON"}
      - {ref: DODI5000.87, page: 9, anchor: "The planning phase will be guided by a draft CNS"}
      - {ref: DODI5000.74, page: 17, anchor: "An SRRB process will be used to review, validate, prioritize"}
  - id: EXT-ORG-POLICY
    name: Organizational policy and Prepare-step guidance
    description: >-
      DoD and Component security and privacy policies and procedures, organizational charts,
      and the Component Prepare-step guidance published on the RMF Knowledge Service.
    kind: organization
    citations:
      - {ref: DODI8510.01, page: 9, anchor: "Develop and maintain Component level guidance required by the"}
  - id: EXT-THREAT
    name: Threat information
    description: >-
      Current cyber threat information and threat and risk reports (for example from NSA/CSS
      and USCYBERCOM) used in risk assessments and authorization decisions: Intelligence
      Community products such as DIA cyber threat assessments and the Defense Intelligence
      Threat Library cyber threat modules, the USD(I&S) cyber threat assessment capability,
      threat intelligence on third party providers and environments, and the USCYBERCOM and
      NSA/CSS cyber operational risk tolerances. ART-RA records which product, its date and
      the credentialed professionals consulted.
    kind: operational
    citations:
      - {ref: DODI8510.01, page: 8, anchor: "Delivers threat and risk reports to support authorization decisions"}
      - {ref: SP800-30R1, section: "APPENDIX D"}
      - {ref: DODI5000.90, page: 11, anchor: "PMs will consult with intelligence and security credentialed professionals"}
      - {ref: DODI8510.01, page: 11, anchor: "Coordinates with the Director, National Security Agency/Chief, Central Security Service to make"}
  - id: EXT-REGISTRY
    name: Component system registry
    description: The DoD Component registry in which programs register their systems.
    kind: organization
    citations:
      - {ref: DODI8510.01, page: 29, anchor: "Register the system in the DoD Component registry"}
  - id: EXT-BASELINES
    name: Control baselines
    description: >-
      CNSSI 1253 security control baselines for national security systems and the SP 800-53B
      baselines (OSCAL profiles in references/oscal/profiles).
    kind: reference
    citations:
      - {ref: SP800-53B, section: "2.2"}
      - {ref: DODI8510.01, page: 9, anchor: "Categorize systems and select controls in accordance with CNSSI 1253"}
      - {ref: CNSSI1253, section: "Appendix D NSS Control Baselines and Supporting"}
  - id: EXT-CNSSI1253-OVERLAYS
    name: CNSSI 1253 overlays
    description: >-
      Published overlays (CNSSI 1253 Appendix E/F attachments, for example the Privacy and
      Space Platform overlays) that tailor baselines for specific environments, information
      types or technologies.
    kind: reference
    citations:
      - {ref: SP800-53B, section: "OVERLAYS"}
      - {ref: CNSSI1253, section: "2.5"}
      - {ref: CNSSI1253, section: "Appendix E Overlays"}
      - {ref: CNSSI1253F-ATT6-PRIVACY, section: "1"}
      - {ref: CNSSI1253F-ATT2-SPACE, section: "1"}
      - {ref: CNSSI1253E-ATT5-CLASSIFIED, section: "1"}
      - {ref: CNSSI1253E-ATT1-TEMPLATE, section: "1"}
  - id: EXT-CATALOG
    name: SP 800-53 Rev. 5 control catalog
    description: >-
      The OSCAL 800-53r5 catalog (references/oscal/catalog), the source of control text, parameters and
      assessment objectives.
    kind: reference
    citations:
      - {ref: SP800-53R5, section: "INTRODUCTION"}
  - id: EXT-ASSESSMENT-PROCEDURES
    name: SP 800-53A assessment procedures
    description: >-
      SP 800-53A Rev. 5 assessment objects, methods and objectives, with the DoD-specific
      assessment procedures on the RMF Knowledge Service.
    kind: reference
    citations:
      - {ref: SP800-53AR5, section: "2.4"}
      - {ref: DODI8510.01, page: 9, anchor: "Require use of the DoD-specific assignment values, overlays"}
  - id: EXT-STIG
    name: DISA STIGs and SRGs, and other secure configuration guidance
    description: >-
      Security technical implementation guides and security requirements guides that define
      secure configurations for products in the inventory, and where none applies NSA/CSS
      security implementation and mitigation guidance, DoD security configuration guides,
      NIST checklists and mitigation guidelines, or vendor hardening guidance. An exception
      is documented and approved by the responsible AO (SCFG-001).
    kind: reference
    citations:
      - {ref: DODI8510.01, page: 6, anchor: "security requirements guides, and security technical implementation guides"}
  - id: EXT-TEST-RESULTS
    name: Developmental and operational test results
    description: >-
      Results of developer, engineering, developmental (DT&E) and operational (OT&E) test
      events, including cybersecurity test events, reused as assessment evidence: cooperative
      vulnerability identification, cybersecurity DT&E, the cooperative vulnerability and
      penetration assessment (CVPA), the adversarial assessment (AA), the cyber economic
      vulnerability analysis, the evaluation of defensive cyberspace operations, and independent
      threat-representative penetration and exploitation testing. Each event in
      test-strategy.yaml records who conducted it, the configuration of the test asset, the test
      conditions and whether they were operationally representative (TSTRAT-003).
    kind: operational
    citations:
      - {ref: DODI8510.01, page: 10, anchor: "Provide cybersecurity developmental, operational, and sustainment test and evaluation"}
      - {ref: DODI5000.89, page: 16, anchor: "cybersecurity cooperative vulnerability and penetration assessment"}
      - {ref: DODI5000.89, page: 10, anchor: "The T&W WIPT documents the configuration of the test asset"}
      - {ref: DODI8500.01, page: 33, anchor: "Penetration and Exploitation Testing"}
  - id: EXT-SOFTWARE-EVIDENCE
    name: Machine-readable software evidence
    description: >-
      SBOMs, build provenance and attestations, security scan and other assurance results, and
      the record of AI models used, produced by the software factory or pipeline and read as
      input to control assessment and authorization (artifacts/data/software.yaml evidence).
    kind: operational
    citations:
      - {ref: DOWI8430.01, page: 21, anchor: "Evidence demonstrating conformance with Paragraph 3.5. will be required input to risk"}
  - id: EXT-MONITORING
    name: Continuous monitoring data
    description: >-
      Output of automated and manual monitoring (vulnerability scans, configuration
      compliance, event and incident data) collected under the monitoring strategy.
    kind: operational
    path: monitoring
    citations:
      - {ref: SP800-137, section: "3.3"}
  - id: EXT-CHANGE-REQUESTS
    name: Configuration change requests
    description: Proposed changes to the system and its environment, submitted to configuration control.
    kind: operational
    citations:
      - {ref: SP800-128, section: "3.3.2"}
  - id: EXT-INSPECTIONS
    name: Readiness inspection and outside evaluation findings
    description: >-
      Findings on the system from readiness inspections, joint compliance inspections, penetration
      assessments, audits and evaluations by the DoD Component or outside bodies such as
      CDRUSSTRATCOM, DISA, DIRNSA or DIA.
    kind: operational
    citations:
      - {ref: DODI8530.01, page: 36, anchor: "leveraging findings from readiness inspections"}
      - {ref: SP800-37R2, section: "TASK A-6"}
  - id: EXT-DIRECTIVES
    name: Directed actions
    description: >-
      Orders and directives a system receives through its aligned NOSC, its CSSP or its DoD
      Component headquarters: operation, fragmentary, tasking and execute orders, IAVM
      vulnerability management alerts and bulletins, and CPCON changes, issued under the
      directive authority of CDRUSSTRATCOM through CDRUSCYBERCOM and JFHQ-DODIN or by the DoD
      Component. M-3 records each in directed_actions of poam/items.yaml.
    kind: operational
    citations:
      - {ref: DODI8530.01, page: 21, anchor: "Implement directed actions in accordance with CDRUSSTRATCOM orders or other directives"}
      - {ref: DODI8531.01, page: 12, anchor: "Distributes or produces orders and directives to DoD Components to mitigate or prevent the"}
  - id: EXT-VDP
    name: Vulnerability disclosure reports
    description: >-
      Reports from the DoD Vulnerability Disclosure Program that DC3 delivers to the system owner
      through JFHQ-DODIN, with actions USCYBERCOM directs within VRMN. M-3 records each in
      vdp_reports of poam/items.yaml.
    kind: operational
    citations:
      - {ref: DODI8531.01, page: 11, anchor: "Coordinates with JFHQ-DODIN to ensure the delivery of reports to the system"}
      - {ref: DODI8531.01, page: 12, anchor: "Receives VDP reports from DC3 and directs actions to mitigate and remediate vulnerabilities"}
  - id: EXT-ISCM-ASSESSMENT
    name: ISCM program assessment report
    description: >-
      The final report of an SP 800-137A assessment of the organization's ISCM program, which may
      bear on the decision to continue operation under ongoing authorization.
    kind: organization
    citations:
      - {ref: SP800-137A, section: "2.2.12"}
      - {ref: SP800-137A, section: "3.1"}
  - id: EXT-ADM
    name: Acquisition decisions and determinations
    description: >-
      Acquisition decision memoranda and the decision authority's determinations at each
      milestone or decision point of the pathway (framework/milestones.yaml for major capability
      acquisition, `decision_points` in framework/pathways.yaml for the others), including the
      urgent capability MDA's determination of which deficiencies must be resolved and which risks
      can be accepted before production or deployment, which R-3 reads.
    kind: organization
    citations:
      - {ref: DODI5000.81, page: 16, anchor: "documents the production decision in an ADM"}
      - {ref: DODI5000.81, page: 15, anchor: "determine which deficiencies must be resolved"}
  - id: EXT-PPP
    name: Program protection plan
    description: >-
      The program protection plan prepared by the lead systems engineer and approved by the
      USD(R&E) where the DAE is the milestone decision authority, or by the Component acquisition
      executive or a designee for ACAT IB to III, urgent, middle tier and software programs, with
      the cybersecurity strategy as an appendix. P-14 records in protection.yaml its approval,
      its critical items, their threats, vulnerabilities and countermeasures, exportability,
      anti-tamper, its updates and its transition (PPROT-001, PPROT-002); P-15 and P-17 carry
      its countermeasures into requirements and solicitations (PPROT-004).
    kind: product
    citations:
      - {ref: DODI5000.83, page: 21, anchor: "Lead systems engineers will prepare a PPP"}
      - {ref: DODI5000.83, page: 22, anchor: "For all programs where the DAE is the milestone decision authority"}
  - id: EXT-CSS
    name: Cybersecurity strategy
    description: >-
      The program's cybersecurity strategy (CSS): plans for, and implementation status of, its
      cybersecurity activities across the life cycle, an appendix to the PPP where the program
      has one and a stand-alone document otherwise. DoDI 5000.82 Table 2 sets who approves it by
      ACAT or BCAT; on the software pathway the DA approves the acquisition strategy that holds
      it. P-14 records it with its approvals and reviews in cybersecurity-strategy.yaml
      (CSSTRAT-001 to CSSTRAT-003).
    kind: product
    citations:
      - {ref: DODI5000.82, page: 14, anchor: "All acquisitions containing IT, including NSS, will have a CSS"}
      - {ref: DODI5000.82, page: 15, anchor: "Appropriate review of the CSS will take place as identified in Table 2."}
      - {ref: DODI5000.87, page: 11, anchor: "The DA will approve the acquisition strategy to include process and documentation"}
  - id: EXT-STPP
    name: Technology and S&T protection guidance
    description: >-
      Technology area protection plans (TAPPs) for each S&T modernization priority area, DoD
      horizontal protection guidance, and the S&T protection plan of a technology that
      transitions from S&T into the program. P-14 records the ones it read in protection.yaml
      and the S&T protection plan in st-protection.yaml (PPROT-003); P-15 names them in
      protection-requirements.yaml.
    kind: organization
    citations:
      - {ref: DODI5000.83, page: 20, anchor: "A TAPP will be established for each S&T modernization"}
      - {ref: DODI5000.83, page: 21, anchor: "S&T managers will prepare protection plans"}
  - id: EXT-ITRA
    name: Independent technical risk assessments
    description: >-
      Independent technical risk assessments of the system design and interfaces for
      adversarial risk, program protection and cyber vulnerabilities, with who conducted and
      approved them; their results inform the technical risks P-14 records (PPROT-005).
    kind: organization
    citations:
      - {ref: DODI5000.83, page: 22, anchor: "independent technical risk assessments"}
  - id: EXT-SEP
    name: Systems engineering plan
    description: >-
      The systems engineering plan, where the lead systems engineer documents the program's
      major technical risks, issues, opportunities and mitigations; P-14 carries the security
      ones into the technical risks of protection.yaml (PPROT-005).
    kind: product
    citations:
      - {ref: DODI5000.88, page: 15, anchor: "document them in the SEP"}
  - id: EXT-NSA-ASSESSMENT
    name: NSA assessment of a National Security System
    description: >-
      The assessment of the cybersecurity requirements and information system security
      architecture of a National Security System, made by NSA with the cognizant AO before program
      initiation and each acquisition milestone, and for a space NSS the coordination of its
      architecture with the AO and NSA. P-16 records them in nss-assessments.yaml (PPROT-006).
    kind: organization
    citations:
      - {ref: DODI8510.01, page: 8, anchor: "assesses cybersecurity requirements and information system security"}
      - {ref: CNSSP12, page: 10, anchor: "Coordinating system security architectures for applicable systems"}
  - id: EXT-TEST-STRATEGY
    name: Test and evaluation master plan or test strategy
    description: >-
      The TEMP, or the test strategy or abbreviated test plan the pathway calls for, with its
      approvals: the DOT&E for OT&E and LFT&E of a program on T&E oversight, the USD(R&E) for the
      DT&E plan of an ACAT ID program, DoD Component approval otherwise. A-2 records in
      test-strategy.yaml its events, schedule, cybersecurity test objectives and approvals
      (TSTRAT-001, TSTRAT-002).
    kind: product
    citations:
      - {ref: DODI5000.89, page: 11, anchor: "The DOT&E is the approval authority for the respective"}
