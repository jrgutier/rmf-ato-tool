# Systems engineering technical reviews and audits. DoDI 5000.88 paragraph 3.5.a(2) requires
# SRR or SFR, PDR, CDR, SVR/FCA, PRR and PCA (or equivalents) unless waived through the SEP;
# test readiness reviews come from DoDI 5000.89 paragraph 5.3. rmf_focus is the RMF evidence
# each review should see.
reviews:
  - id: RV-SRR
    name: System Requirements Review
    short: SRR
    phase: PH-TMRR
    order: 1
    purpose: >-
      Confirm that the system requirements are complete, testable and traceable to the
      capability need (DoDI 5000.88 requires an SRR or an SFR).
    rmf_focus: >-
      Security and privacy requirements defined (P-15) and traceable; categorization approved
      (C-3) so that the control baseline can be selected. The system risk assessment (P-14)
      explains the requirements, and the system's place in the enterprise architecture (P-16)
      is known.
    citations:
      - {ref: DODI5000.88, page: 16, anchor: "System requirements review or system functional review"}
      - {ref: DODI8510.01, page: 20, anchor: "Requirements, development, procurement, and T&E processes must apply the RMF"}
  - id: RV-SFR
    name: System Functional Review
    short: SFR
    phase: PH-TMRR
    order: 2
    purpose: >-
      Confirm that the functional baseline satisfies the system requirements (DoDI 5000.88
      requires an SRR or an SFR).
    rmf_focus: >-
      Requirements allocated to the system and its environment (P-17); control baseline
      selected and tailored (S-1, S-2), with overlays applied and every tailoring decision
      justified.
    citations:
      - {ref: DODI5000.88, page: 16, anchor: "System requirements review or system functional review"}
      - {ref: CNSSI1253, section: "3.2.2"}
  - id: RV-PDR
    name: Preliminary Design Review
    short: PDR
    phase: PH-TMRR
    order: 3
    purpose: >-
      Confirm that the preliminary design and allocated baseline satisfy the functional
      baseline; conducted before Milestone B.
    rmf_focus: >-
      Controls allocated to system elements (S-3); planned control implementations documented
      in the security plan (S-4) and the continuous monitoring strategy drafted (S-5), so the
      security plan can be approved (S-6) before Milestone B.
    citations:
      - {ref: DODI5000.88, page: 16, anchor: "Preliminary design review (PDR)"}
      - {ref: DODI5000.85, page: 13, anchor: "a preliminary design review (PDR) will be conducted prior to Milestone B"}
      - {ref: DODI5000.88, page: 16, anchor: "Systems engineering technical reviews provide a venue to establish the technical baselines"}
  - id: RV-CDR
    name: Critical Design Review
    short: CDR
    phase: PH-EMD
    order: 4
    purpose: Confirm that the detailed design is complete and ready for fabrication, coding and integration.
    rmf_focus: >-
      Control implementation designed into the product baseline (I-1); security plan
      reflects the as-designed implementation, and the STIG/SRG configurations for each
      component are chosen.
    citations:
      - {ref: DODI5000.88, page: 16, anchor: "(c) CDR."}
      - {ref: DODI5000.85, page: 15, anchor: "A critical design review assesses design maturity"}
  - id: RV-TRR
    name: Test Readiness Review
    short: TRR
    phase: PH-EMD
    order: 5
    purpose: Confirm readiness for each developmental test event identified in the TEMP.
    rmf_focus: >-
      Controls implemented and the as-implemented plan updated (I-2); assessor selected and
      the assessment plan approved (A-1, A-2), with the test events that support the
      assessment identified; an AD-IATT is in place before testing on live networks or with
      live data.
    citations:
      - {ref: DODI5000.89, page: 28, anchor: "The PM will conduct test readiness reviews for those events identified in the"}
      - {ref: DODI5000.89, page: 17, anchor: "periodic integrated government cybersecurity test events before beginning operational testing or initial production"}
  - id: RV-SVR
    name: System Verification Review / Functional Configuration Audit
    short: SVR/FCA
    phase: PH-EMD
    order: 6
    purpose: Confirm that the system as built meets the functional baseline, using test results.
    rmf_focus: >-
      Control assessments complete (A-3), assessment report delivered (A-4) and initial
      remediation done (A-5). Results from cooperative vulnerability identification and
      adversarial developmental testing are in the assessment report.
    citations:
      - {ref: DODI5000.88, page: 16, anchor: "System verification review or functional configuration audit"}
      - {ref: DODI5000.89, page: 16, anchor: "Plan to conduct contractor and government integrated tailored cooperative vulnerability identification"}
  - id: RV-PRR
    name: Production Readiness Review
    short: PRR
    phase: PH-EMD
    order: 7
    purpose: Confirm that the design is ready for production and the production processes are mature.
    rmf_focus: >-
      POA&M established (A-6) and the authorization package assembled (R-1) so that the
      authorization decision supports Milestone C; the threat assessment the PM reviews
      before the ATO is no more than 12 months old.
    citations:
      - {ref: DODI5000.88, page: 16, anchor: "Production readiness review"}
      - {ref: DODI5000.90, page: 11, anchor: "Before a program receives an ATO, the PM will review the program's most recent threat assessment"}
  - id: RV-PCA
    name: Physical Configuration Audit
    short: PCA
    phase: PH-PD
    order: 8
    purpose: Confirm that the production configuration matches the documented product baseline.
    rmf_focus: >-
      Fielded configuration matches the authorized baseline in the security plan and the
      inventory; deviations go through change control (M-1) with a security impact analysis.
    citations:
      - {ref: DODI5000.88, page: 16, anchor: "Physical configuration audit"}
      - {ref: SP800-128, section: "2.3.7"}
      - {ref: SP800-128, section: "2.3.9"}
