# Hand corrections for framework/baselines/cnssi-1253.yaml (read by
# `uv run python -m rmf_tool.cnssi1253`). Add an entry only when a table row cannot be read
# from the PDF geometry or disagrees with references/text/CNSSI1253.md, after checking the
# PDF page by eye. Each entry names the row as printed and the page, gives a reason, and sets
# the corrected cells:
#   - {page: 26, table_id: AC-2(7), reason: "...", privacy: ".", c: "+++", i: "+++", a: "..."}
# c/i/a are three cells (low, moderate, high) of X, +, - ("--" in the table) or . (blank);
# withdrawn: true marks a withdrawn row. text_differs: true accepts the PDF reading of a row
# whose text extraction is wrong without changing any cell. An entry that changes nothing
# fails the generator.
overrides: []
