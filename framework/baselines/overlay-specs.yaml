      - control: ac-18
        heading: "AC-18, Wireless Access"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 13, anchor: "AC-18, Wireless Access"}
        statements:
          - {kind: justification, disposition: select, text: "Regardless of whether the organization intends to use wireless access for the system of interest, this control must be selected to ensure the organization defines the limitations on wireless access. Many information technology products are developed to have wireless capabilities. If those wireless capabilities are enabled, either inadvertently or intentionally, there is a risk of unauthorized access to, and exfiltration of, classified information. Selecting these controls does not imply intent to allow wireless access, but instead serves to ensure the organization takes conscious actions to either allow and to establish appropriate restrictions on its use or disallow its use. EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use, or potential for use, of wireless technologies presents unique challenges for protecting classified information; the AC-18 base control and its selected enhancements are needed to address these challenges."}
        references: "EO 13526, Sec 4.1, para. (f); (g). EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
