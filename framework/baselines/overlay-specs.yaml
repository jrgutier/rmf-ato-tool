      - control: pm-12
        heading: "PM-12, INSIDER THREAT PROGRAM"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 66, anchor: "PM-12, INSIDER THREAT PROGRAM"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "The privacy risks inherent with monitoring user activity and merging sensitive PII from myriad data resources within an organization, such as human resource and user activity, require the active participation, review, and concurrence of the SAOP, or designee."}
          - {kind: extension, text: "When defining the requirements for and designing an organization's insider threat program, the insider threat team must engage and obtain concurrence of the organization's Privacy Officer prior to implementation and on a continuing basis. For existing insider threat programs, conduct a review of the program with the organization’s Privacy Officer to ensure the program meets applicable privacy requirements."}
        references: "5 U.S.C. §552a(e)(5), (9), (10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503; OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "FISA", "EO 12333", "ICD 107", "ICD 121", "ICD 503", "OMB Circular A-130", "OMB M-17-12"]
