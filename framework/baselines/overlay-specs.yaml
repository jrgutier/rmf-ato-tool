      - control: ps-1
        heading: "PS-1, (PERSONNEL SECURITY) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 67, anchor: "PS-1, (PERSONNEL SECURITY) POLICY AND PROCEDURES – Included in the"}
        in_privacy_baseline: true
      - control: ps-2
        heading: "PS-2, POSITION RISK DESIGNATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 67, anchor: "PS-2, POSITION RISK DESIGNATION"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Position risk designations, should be commensurate with the risks associated with the privacy risk level for different levels of access to PII."}
          - {kind: guidance, text: "The level of access to PII required by the job position is a factor in determining the specific screening criteria for working in the position."}
        references: "5 CFR § 1400.101(b); 5 C.F.R. § 731.106; OMB Circular A-130"
        authorities: ["5 CFR", "OMB Circular A-130"]
      - control: ps-3
        heading: "PS-3, PERSONNEL SCREENING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 68, anchor: "PS-3, PERSONNEL SCREENING"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Screening individuals who are provided access to PII reduces privacy risk of unauthorized access to PII and misuse or abuse of PII."}
          - {kind: guidance, text: "Screen individuals who work with PII prior to providing access to the PII, and re-screen as determined by the organization."}
        references: "5 CFR § 1400.201; 5 C.F.R. § 731.106; OMB Circular A-130"
        authorities: ["5 CFR", "OMB Circular A-130"]
      - control: ps-4
        heading: "PS-4, PERSONNEL TERMINATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 68, anchor: "PS-4, PERSONNEL TERMINATION"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Terminating access to PII upon termination of personnel employment reduces privacy risk of unauthorized access to PII and misuse or abuse of PII."}
        references: "5 U.S.C. § 552a(b)(1); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: ps-5
        heading: "PS-5, PERSONNEL TRANSFER"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 68, anchor: "PS-5, PERSONNEL TRANSFER"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "When personnel are reassigned or transferred, their access to PII must be reviewed to determine whether and how their access permissions should change. Ensuring current permissions to access PII reduces privacy risk of unauthorized access to PII and misuse or abuse of PII."}
        references: "5 U.S.C. § 552a(b)(1) and (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: ps-6
        heading: "PS-6, ACCESS AGREEMENTS – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 68, anchor: "PS-6, ACCESS AGREEMENTS – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ps-7
        heading: "PS-7, EXTERNAL PERSONNEL SECURITY"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 68, anchor: "PS-7, EXTERNAL PERSONNEL SECURITY"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Ensures that external providers (i.e., organizations other than the organization operating or acquiring the system) that will have access to PII are held accountable in the same way the organizational personnel are. Obligation to protect PII remains even when a third party is hired to perform the processing activities."}
        references: "5 U.S.C. § 552a(m); FAR Parts 24.1, 39.105, and 52.224-1&2; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: ps-8
        heading: "PS-8, PERSONNEL SANCTIONS – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 69, anchor: "PS-8, PERSONNEL SANCTIONS – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ps-9
        heading: "PS-9, POSITION DESCRIPTIONS – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 69, anchor: "PS-9, POSITION DESCRIPTIONS – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: pt-1
        heading: "PT-1, (PII PROCESSING AND TRANSPARENCY) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 69, anchor: "PT-1, (PII PROCESSING AND TRANSPARENCY) POLICY AND PROCEDURES –"}
        in_privacy_baseline: true
      - control: pt-2
        heading: "PT-2, AUTHORITY TO PROCESS PERSONALLY IDENTIFIABLE INFORMATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 69, anchor: "PT-2, AUTHORITY TO PROCESS PERSONALLY IDENTIFIABLE INFORMATION"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Ensures proper authority permitting the system to process PII. Additional measures, including design choices, ensure the information system collecting, using, maintaining, or disseminating PII complies with those authorities permitting the processing."}
          - {kind: guidance, text: "Ensure PII processed by the information system is related to, and compatible with, the purpose and scope of the authority described in the information system documentation. When applicable, privacy documentation may include a SORN or PIA."}
        references: "5 U.S.C. §552a; Pub. L. No. 107-347, §208"
        authorities: ["5 U.S.C. 552a", "Pub. L. 107-347"]
      - control: pt-2.1
        heading: "PT-2(1), Authority to Process Personally Identifiable Information | Data Tagging"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 69, anchor: "PT-2(1), Authority to Process Personally Identifiable Information | Data Tagging"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Data tagging supports tracking and enforcement of structured or unstructured authorized PII processing. PII data that meets the definition of a “record” as defined by the Federal Records Act or the Privacy Act, and is removed or repurposed from an information system covered by a SORN (e.g., an HR database) and extracted or ingested into another format (e.g., an Excel spreadsheet), must still meet purpose and use requirements of the associated notice, i.e., data that is extracted from a SOR must still meet the requirements of the SORN."}
        references: "5 U.S.C. §552a(b), (e)(4); 44 U.S.C. §2201; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "44 U.S.C. 2201", "OMB Circular A-130"]
      - control: pt-2.2
        heading: "PT-2(2), Authority to Process Personally Identifiable Information | Automation*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 69, anchor: "PT-2(2), Authority to Process Personally Identifiable Information | Automation*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Deploying automatic mechanisms provides additional privacy enhancing protections by preventing PII from being processed when processing is not authorized, or in a manner that is not authorized, or by automatically identifying when such unauthorized processing occurs."}
        references: "The Privacy Act of 1974, 5 U.S.C. §552a(e)(1), (10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; EO 12333, Section 2.3; OMB M-17-12; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "EO 12333", "OMB M-17-12", "OMB Circular A-130"]
      - control: pt-3
        heading: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 70, anchor: "PT-3, PERSONALLY IDENTIFIABLE INFORMATION PROCESSING PURPOSES"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Ensures authorized purpose(s) to process PII. Additional measures, including, but not limited to, design choices and auditing, ensure the information system collecting, using, maintaining, or disseminating PII complies with those authorized purposes."}
          - {kind: guidance, text: "Ensure the PII processed by the information system adheres to the specific purpose(s) described in the information system documentation, including privacy documentation. When applicable, privacy documentation may include a SORN or PIA."}
        references: "5 U.S.C. §552a(e)(3)(A)-(B); Pub. L. No. 107-347, §208(b)(2)(B)(ii) and (c)(1)(B)"
        authorities: ["5 U.S.C. 552a", "Pub. L. 107-347"]
      - control: pt-3.1
        heading: "PT-3(1), Personally Identifiable Information Processing Purposes | Data Tagging"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 70, anchor: "PT-3(1), Personally Identifiable Information Processing Purposes | Data Tagging"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Data tagging supports tracking and enforcement of processing structured or unstructured PII for the purpose for which it was collected, obtained, or accessed. Consistent with the Privacy Act and the Purpose Specification Principle and Use Limitation Principle of the Fair Information Practice Principles (FIPPs), sharing of PII should be compatible with this purpose. Consistent with the Privacy Act routine use exception and the FIPPs’ Transparency Principle, any subsequent sharing that is not compatible may not be done until the agency notifies the individual, obtains consent, and updates or publishes relevant documents, e.g., when applicable and appropriate publish an updated SORN to cover the additional incompatible sharing and obtain consent from the affected individuals."}
        references: "5 U.S.C. §552a(e); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: pt-3.2
        heading: "PT-3(2), Personally Identifiable Information Processing Purposes | Automation*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 70, anchor: "PT-3(2), Personally Identifiable Information Processing Purposes | Automation*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Using automated mechanisms to track the purposes for processing PII provides additional privacy enhancing capabilities by automatically verifying that PII is used only in a manner compatible with the purpose for which it was collected, and in accordance with applicable privacy notices, policies, and compliance documents."}
        references: "5 U.S.C. §552a(b), (e)(4), (e)(6), (e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; EO 12333, Section 2.3; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "EO 12333", "OMB Circular A-130"]
      - control: pt-4
        heading: "PT-4, CONSENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 70, anchor: "PT-4, CONSENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Consistent with the Individual Participation FIPP, organizations should involve the individual in the process of using PII and, to the extent practicable, seek individual consent prior to processing PII. For systems of records protected by the Privacy Act, written consent is required before records are disclosed by any means of communication to any person or agency unless there is a Privacy Act exception."}
          - {kind: guidance, text: "Obtain consent when collecting or processing PII. Opt-in is the preferred method to obtain consent. The SAOP, or designee, can provide information on what is required for a particular system. For systems of records protected by the Privacy Act, written consent is required before records are disclosed by any means of communication to any person or agency unless there is a Privacy Act exception."}
        references: "5 U.S.C. §552a(b), (e)(3)-(4), OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: pt-5
        heading: "PT-5, PRIVACY NOTICE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 71, anchor: "PT-5, PRIVACY NOTICE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Consistent with the Purpose Specification and Use Limitation and Transparency FIPPs, organizations should provide appropriate notice of the privacy practices and specific purpose for which PII is collected. Organizations should also limit processing of PII to purposes explained in the notice and compatible with the purpose for which the PII was collected, or that is otherwise legally authorized."}
          - {kind: guidance, text: "Provide privacy notices when required. For Privacy Act systems of record, Privacy Act Statement is required unless appropriately claimed statutory exemptions are in place. For many mission related national security systems, this will be the case. The SAOP, or designee, can provide information on what is required for a particular system. Consistent with FIPPs’ Transparency Principle, a privacy notice should be provided which describes the privacy practices associated with that PII, including, but not limited to, the way the PII is protected, how it is used, and whether it is shared."}
        references: "5 U.S.C. §552a(e); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: pt-5.1
        heading: "PT-5(1), Privacy Notice | Just-In-Time Notice"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 71, anchor: "PT-5(1), Privacy Notice | Just-In-Time Notice"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Just-in-time privacy notices provide individuals with information about how their PII will be processed at the time when they are best able to assess their privacy risk based on current circumstances. Just-in-time privacy notices ensure that individuals have accurate and timely information, enabling them to provide informed consent to the processing of their PII."}
          - {kind: guidance, text: "Provide Just-In-Time Notice when asking individuals to supply information to be maintained in a Privacy Act system of record unless appropriate statutory exemptions are in place. For many mission related national security systems, this will be the case. The SAOP, or designee, can provide information on what is required for a particular system."}
        references: "5 U.S.C. §552a (e)(2), (e)(3); EO 12333, Section 2.3; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 12333", "OMB Circular A-130"]
      - control: pt-5.2
        heading: "PT-5(2), Privacy Notice | Privacy Act Statements"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 72, anchor: "PT-5(2), Privacy Notice | Privacy Act Statements"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Consistent with the Purpose Specification and Use Limitation and Transparency FIPPs, organizations should provide notice of the specific purpose for which PII is collected. For Privacy Act systems of record, this notice is provided through a Privacy Act Statement. For Privacy Act systems of records, unless a Privacy Act exception is in place, agencies must inform each individual whom it asks to supply information, on the form which it uses to collect the information or on a separate form that can be retained by the individual regarding the agency's collection and maintained of the information."}
          - {kind: guidance, text: "Provide a Privacy Act Statement when asking individuals to supply information to be maintained in a Privacy Act system of record unless appropriate statutory exemptions are in place. For many mission-related national security systems, this will be the case. The SAOP, or designee, can provide information on what is required for a particular system."}
        references: "5 U.S.C. §552a(e)(3)"
        authorities: ["5 U.S.C. 552a"]
      - control: pt-6
        heading: "PT-6, SYSTEM OF RECORD NOTICE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 72, anchor: "PT-6, SYSTEM OF RECORD NOTICE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Privacy Act systems of record must be covered by a SORN which provides notice to the public about the existence and character of records that federal agencies maintain about individuals protected by the Act. Once a SORN is published in the Federal Register, Federal agencies must operate within the scope of the SORN. Federal agencies must publish an update before collecting, processing, or disseminating PII in any way that is not addressed within the SORN."}
          - {kind: guidance, text: "Ensure the Privacy Act system of records is covered by an appropriate SORN. The SAOP, or designee, can assist in writing and publishing the SORN and any required exemptions."}
        references: "5 U.S.C. §552a(e)(4)"
        authorities: ["5 U.S.C. 552a"]
      - control: pt-6.1
        heading: "PT-6(1), System of Records Notice | Routine Uses"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 72, anchor: "PT-6(1), System of Records Notice | Routine Uses"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Statutory requirements prohibit disclosing records protected by the Privacy Act without written consent from the individual unless the disclosure is permitted by a published statutory exception, including the “routine use” disclosure exception. Privacy Act records cannot be disclosed until and unless a SORN containing the routine use(s) has been published in the Federal Register. A revised SORN containing any new or revised routine uses must be published first before disclosing the records to different recipients or for a different purpose."}
          - {kind: guidance, text: "Records protected by the Privacy Act may be disclosed pursuant to the routine use disclosure exception only if the applicable SORN includes an appropriate routine use. That is, with respect to the disclosure of a record, “the use of [a] [personally identifiable] record for a purpose which is compatible with the purpose for which it was collected.” Consult the SAOP, or designee, before disclosing or sharing records protected by the Privacy Act."}
        references: "5 U.S.C. §552a(a)(7), (b)(3)"
        authorities: ["5 U.S.C. 552a"]
      - control: pt-6.2
        heading: "PT-6(2), System of Records Notice | Exemption Rules"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 73, anchor: "PT-6(2), System of Records Notice | Exemption Rules"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Privacy Act systems of records may be exempted from select statutory requirements when an exemption is applicable to the system and the exemption has been published in the Federal Register in the system’s SORN."}
          - {kind: guidance, text: "Records protected by the Privacy Act must have a published exemption rule to notify the public about which statutory provisions do not apply to that particular system of records. Consult the SAOP, or designee, to ensure the system of records is covered by an appropriate exemption rule."}
        references: "5 U.S.C. §552a(j), (k)"
        authorities: ["5 U.S.C. 552a"]
      - control: pt-7
        heading: "PT-7, SPECIFIC CATEGORIES OF PERSONALLY IDENTIFIABLE INFORMATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 73, anchor: "PT-7, SPECIFIC CATEGORIES OF PERSONALLY IDENTIFIABLE INFORMATION"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Systems processing PII that are a Privacy Act system of records have a variety of potentially applicable statutory requirements, such as a SORN or Privacy Act Statement. The system must be evaluated to determine whether it falls under the statute."}
          - {kind: guidance, text: "Apply the statutory requirements of the Privacy Act to systems containing PII retrieved by the name of the individual or by some identifying number, symbol, or other identifying particular assigned to the individual. Consult the SAOP, or designee, to ensure the system has met the applicable requirements."}
          - {kind: parameter, text: "Apply the statutory requirements of the Privacy Act for specific categories of personally identifiable information."}
        references: "5 U.S.C. §552a"
        authorities: ["5 U.S.C. 552a"]
      - control: pt-7.1
        heading: "PT-7(1), Specific Categories of Personally Identifiable Information | Social Security Numbers"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 73, anchor: "PT-7(1), Specific Categories of Personally Identifiable Information | Social Security"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "SSNs may not be used as identifier unless specifically approved by the SAOP, or designee."}
          - {kind: guidance, text: "SSNs present increased risk to individuals and organizations if they are misused, abused, or lost. Refrain from using SSN as an identifier in any form, including, but not limited to masked, partially masked, truncated, encrypted, and or disguised as SSNs unless specifically approved by the SAOP, or designee. Consult the SAOP, or designee, for approval when applicable."}
        references: "5 U.S.C. §552a(e)(9)-(10); 32 CFR Part 157; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "32 CFR", "OMB M-17-12"]
      - control: pt-7.2
        heading: "PT-7(2), Specific Categories of Personally Identifiable Information | First Amendment Information"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 74, anchor: "PT-7(2), Specific Categories of Personally Identifiable Information | First Amendment"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Processing PII about how an individual exercises rights guaranteed by the First Amendment presents privacy and civil liberties concerns and is generally prohibited by the Privacy Act."}
          - {kind: guidance, text: "PII describing how an individual exercises rights guaranteed by the First Amendment may not be processed unless it meets statutory requirements and is addressed in a way that minimally impacts civil liberties. Consult the SAOP, or designee, before processing this PII."}
        references: "5 U.S.C. §552a(e)(7)"
        authorities: ["5 U.S.C. 552a"]
      - control: pt-8
        heading: "PT-8, COMPUTER MATCHING REQUIREMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 74, anchor: "PT-8, COMPUTER MATCHING REQUIREMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "PII maintained in a system of records may not be disclosed to a recipient agency or non-Federal agency for use in a computer matching program without a written agreement that meets statutory requirements."}
          - {kind: guidance, text: "Any personally identifiable records contained in a system of records may only be disclosed to a recipient agency or non-federal agency for use in a computer matching program pursuant to a Computer Matching Agreement (CMA) between the source agency and the recipient agency or non-federal agency. For many mission related national security systems, the CMA is not applicable. The SAOP, or designee, can provide information on what is required for a particular system. Consult the SAOP, or designee, before disclosing and or sharing this PII with another entity."}
        references: "5 U.S.C. §552a(o)"
        authorities: ["5 U.S.C. 552a"]
      - control: ra-1
        heading: "RA-1, RISK ASSESSMENT POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 74, anchor: "RA-1, RISK ASSESSMENT POLICY AND PROCEDURES – Included in the Privacy"}
        in_privacy_baseline: true
      - control: ra-2
        heading: "RA-2, SECURITY CATEGORIZATION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 74, anchor: "RA-2, SECURITY CATEGORIZATION – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ra-3
        heading: "RA-3, RISK ASSESSMENT – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 75, anchor: "RA-3, RISK ASSESSMENT – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ra-7
        heading: "RA-7, RISK RESPONSE – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 75, anchor: "RA-7, RISK RESPONSE – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ra-8
        heading: "RA-8, PRIVACY IMPACT ASSESSMENTS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 75, anchor: "RA-8, PRIVACY IMPACT ASSESSMENTS"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "E-Government Act does not require – nor does it prohibit – conducting a PIA for NSS. Privacy Impact Assessments are structured qualitative and quantitative reviews of how information is processed by the system and potential impacts to individuals and organizations for the output of systems that process PII, including potential harms from expected outcomes as well as loss of control or mishandling of the PII. The PIA process benefits the organization and individuals whose PII is in the system by facilitating the identification, evaluation, and management of privacy risks and potential problematic data actions for the PII in that system. A PIA is not a time-restricted activity limited to a particular milestone but a living document that must be updated whenever changes to the information technology, changes to the agency’s practices, or other factors alter the privacy risks associated with the use of such information technology."}
          - {kind: guidance, text: "Conduct PIAs or comparable privacy risk assessment commensurate with the privacy risk of the PII in the system. Review and update the PIA as necessary when making system changes that impact the PII. Limit access to PIAs for NSS to appropriately cleared individuals with a need to know the information."}
        references: "E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB M-03-22; OMB Circular A-130"
        authorities: ["E-Government Act of 2002", "Pub. L. 107-347", "OMB M-03-22", "OMB Circular A-130"]
      - control: sa-1
        heading: "SA-1, (SYSTEM AND SERVICES ACQUISITION) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 75, anchor: "SA-1, (SYSTEM AND SERVICES ACQUISITION) POLICY AND PROCEDURES –"}
        in_privacy_baseline: true
      - control: sa-2
        heading: "SA-2, ALLOCATION OF RESOURCES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 75, anchor: "SA-2, ALLOCATION OF RESOURCES"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Resources must be considered for the protection of privacy and confidentiality when budgeting for an information system. As part of the capital planning and investment control process, the organization must determine, document, and allocate resources required to protect the privacy and confidentiality of PII in the information system."}
        references: "E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130"
        authorities: ["E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130"]
      - control: sa-3
        heading: "SA-3, SYSTEM DEVELOPMENT LIFECYCLE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 75, anchor: "SA-3, SYSTEM DEVELOPMENT LIFECYCLE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Managing a system through a defined lifecycle process helps to ensure that privacy controls are appropriately considered from initial system conception and requirements development, to verification of implemented requirements, and through decommissioning."}
          - {kind: guidance, text: "To ensure that privacy and security controls are appropriately considered during each phase of the system development life cycle, the SAOP, or designee, should clearly understand and participate in the requirements to protect PII in the system."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: sa-3.2
        heading: "SA-3(2), System Development Life Cycle | Use of Live or Operational Data"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 76, anchor: "SA-3(2), System Development Life Cycle | Use of Live or Operational Data"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Operational data may only be used in Privacy Act systems after the SORN has been published. If the system is not designed to process PII, but includes ACCT PII, there must be a published SORN that covers the ACCT PII. Document that the required SORN has been completed."}
        references: "5 U.S.C. §552a(e)(11)"
        authorities: ["5 U.S.C. 552a"]
      - control: sa-4
        heading: "SA-4, ACQUISITION PROCESS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 76, anchor: "SA-4, ACQUISITION PROCESS"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Contracts for systems, components, or services must meet the privacy requirements of the Federal government. It is much easier, cheaper, and more effective to build privacy into a system during the acquisition phase of the life cycle than it is to bolt it on after the system has already been acquired."}
          - {kind: guidance, text: "When acquiring information systems, components, or services used to process PII, ensure the following, in consultation with the privacy office, are included in the acquisition contract: a. List of controls from the Privacy Overlays necessary to ensure protection of PII and, if appropriate, enforce applicable privacy requirements. b. Privacy functional requirements, i.e., functional requirements specific to privacy. c. FAR Clauses per FAR Part 24 and Part 39.105, and any other organization specific privacy clause."}
        references: "5 U.S.C. §552a (e)(10) and (m); E-Government Act of 2002 (I; Pub. L. No. 107-347) §208; FISMA (Pub. L. No. 107-347); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "FISMA", "FAR", "OMB Circular A-130"]
      - control: sa-4.11
        heading: "SA-4(11), Acquisition Process | System of Records"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 76, anchor: "SA-4(11), Acquisition Process | System of Records"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Contracts for systems, components, or services that may include systems of records must incorporate requirements of the Privacy Act. It is much easier, cheaper, and more effective to build privacy protections into a system during the acquisition or development phase of the life cycle than it is to retrofit it afterwards."}
        references: "5 U.S.C. §552a (e)(10), (m); FAR Part 24 and 39.105"
        authorities: ["5 U.S.C. 552a", "FAR"]
      - control: sa-4.12
        heading: "SA-4(12), Acquisition Process | Data Ownership"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 77, anchor: "SA-4(12), Acquisition Process | Data Ownership"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "An organization’s PII that is stored, operated, or maintained on contractors’ systems has an increased privacy risk while it is out of the direct control of the organization. One way to mitigate this risk is to incorporate privacy protections into the contract to protect the PII and to require the complete removal and return of the PII to the organization at the end of the contract."}
        references: "5 U.S.C. §552a(m), (e)(10); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: sa-8
        heading: "SA-8, SECURITY AND PRIVACY ENGINEERING PRINCIPLES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 77, anchor: "SA-8, SECURITY AND PRIVACY ENGINEERING PRINCIPLES"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Considering the privacy requirements of a system during the design phase of the life cycle ensures the most cost effective and efficient implementation of controls. It is much easier, cheaper, and more effective to build privacy protections into a system during the acquisition or development phase of the life cycle than it is to retrofit it afterwards."}
        references: "E-Government Act of 2002 (Pub. L. 107-347) § 208; OMB Circular A-130; OMB M-05-08; OMB M-03-22; NISTIR-8062"
        authorities: ["E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130", "OMB M-05-08", "OMB M-03-22"]
        guidance_references: ["NISTIR 8062"]
      - control: sa-8.1
        heading: "SA-8(1), Security and Privacy Engineering Principles | Clear Abstractions*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 77, anchor: "SA-8(1), Security and Privacy Engineering Principles | Clear Abstractions*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "The clarity provided by simple, well-defined interfaces and functions is necessary for systems that are complex or present a sufficiently high privacy risk."}
      - control: sa-8.12
        heading: "SA-8(12), Security and Privacy Engineering Principles | Hierarchical Protection*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 77, anchor: "SA-8(12), Security and Privacy Engineering Principles | Hierarchical Protection*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Supports resource management for systems with PII by permitting presumption of protection through components that are equally or more trustworthy than the system with PII."}
      - control: sa-8.14
        heading: "SA-8(14), Security and Privacy Engineering Principles | Least Privilege"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 77, anchor: "SA-8(14), Security and Privacy Engineering Principles | Least Privilege"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Users should only have access to the PII necessary to accomplish the legitimate purpose for why it was collected. This protects the PII by implementing the FIPP of purpose specification and use limitation."}
        references: "5 U.S.C. §552a(e)(10); EO 14208, NSM-8; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 14208", "NSM-8", "OMB Circular A-130"]
      - control: sa-8.15
        heading: "SA-8(15), Security and Privacy Engineering Principles | Predicate Permission*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 78, anchor: "SA-8(15), Security and Privacy Engineering Principles | Predicate Permission*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Users should only have access to the PII necessary to accomplish the legitimate purpose for why it was collected. Predicate permission decreases the risk of misuse or inadvertent access to high risk PII."}
      - control: sa-8.16
        heading: "SA-8(16), Security and Privacy Engineering Principles | Self-Reliant Trustworthiness*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 78, anchor: "SA-8(16), Security and Privacy Engineering Principles | Self-Reliant Trustworthiness*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Decreasing the system’s reliance on other systems decreases the risk of loss, misuse, or inadvertent access to high risk PII."}
      - control: sa-8.17
        heading: "SA-8(17), Security and Privacy Engineering Principles | Secure Distributed Composition*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 78, anchor: "SA-8(17), Security and Privacy Engineering Principles | Secure Distributed Composition*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Ensuring the system protects PII at least as well as the distributed components decreases the risk of loss, misuse, or inadvertent access to high risk PII."}
      - control: sa-8.18
        heading: "SA-8(18), Security and Privacy Engineering Principles | Trusted Communications* Channels"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 78, anchor: "SA-8(18), Security and Privacy Engineering Principles | Trusted Communications*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Trusted communication channels protects PII in transit as well as at rest. Decreases the risk of loss, misuse, or inadvertent access to PII."}
      - control: sa-8.19
        heading: "SA-8(19), Security and Privacy Engineering Principles | Continuous Protection"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 78, anchor: "SA-8(19), Security and Privacy Engineering Principles | Continuous Protection"}
        statements:
          - {kind: justification, disposition: select, sets: [HIGH], text: "PII that presents a high privacy risk must be protected at all times from loss, misuse, or inadvertent access."}
        references: "5 U.S.C. §552a(e)(10); EO 14208, NSM-8; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 14208", "NSM-8", "OMB Circular A-130"]
      - control: sa-8.20
        heading: "SA-8(20), Security and Privacy Engineering Principles | Secure Metadata Management*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 78, anchor: "SA-8(20), Security and Privacy Engineering Principles | Secure Metadata Management*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Ensures greater awareness by identifying information as PII and where it is located. This is particularly helpful when assessing the effects or harm from a privacy breach."}
      - control: sa-8.22
        heading: "SA-8(22), Security and Privacy Engineering Principles | Accountability and Traceability"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 78, anchor: "SA-8(22), Security and Privacy Engineering Principles | Accountability and Traceability"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Supports ability to associate an individual user with their activity in a system with PII and, in turn, hold them accountable for any unauthorized access, misuse, or abuse of PII. Accountability and traceability also support the FIPPs of purpose specification and use limitation by providing visibility into how a user actually processes PII, which can be confirmed against the users’ permissions."}
        references: "5 U.S.C. §552a(e)(10); EO 14208, NSM-8; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 14208", "NSM-8", "OMB Circular A-130"]
      - control: sa-8.28
        heading: "SA-8(28), Security and Privacy Engineering Principles | Acceptable Security"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 79, anchor: "SA-8(28), Security and Privacy Engineering Principles | Acceptable Security"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Organizations’ handling of PII should be commensurate with the expectations of the users whose PII is in the system. This implements the FIPPs of minimization, quality and integrity, and purpose specification and use limitation."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: sa-8.33
        heading: "SA-8(33), Security and Privacy Engineering Principles | Minimization – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 79, anchor: "SA-8(33), Security and Privacy Engineering Principles | Minimization – Included in the"}
        in_privacy_baseline: true
      - control: sa-9
        heading: "SA-9, EXTERNAL INFORMATION SYSTEM SERVICES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 79, anchor: "SA-9, EXTERNAL INFORMATION SYSTEM SERVICES – Included in the Privacy"}
        in_privacy_baseline: true
      - control: sa-9.1
        heading: "SA-9(1), External System Services | Risk Assessments and Organizational Approvals"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 79, anchor: "SA-9(1), External System Services | Risk Assessments and Organizational Approvals"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Contracts for systems, components, or services must meet the privacy requirements of the Federal government. It is much easier, less expensive, and more effective to build privacy into a system during the acquisition phase of the life cycle than it is to bolt it on after the system has already been acquired."}
        references: "5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: sa-9.2
        heading: "SA-9(2), External System Services | Identification of Functions, Ports, Protocols, and Services"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 79, anchor: "SA-9(2), External System Services | Identification of Functions, Ports, Protocols, and"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Contracts for systems, components, or services must meet the privacy requirements of the Federal government. It is much easier, cheaper, and more effective to build privacy into a system during the acquisition phase of the life cycle than it is to bolt it on after the system has already been acquired."}
        references: "5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: sa-9.5
        heading: "SA-9(5), External System Services | Processing, Storage, and Service Location"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 79, anchor: "SA-9(5), External System Services | Processing, Storage, and Service Location"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Organizations may have different capabilities to protect PII in different locations. When selecting a service provider, the location for storage, maintenance, or processing must be considered."}
        references: "5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: sa-9.6
        heading: "SA-9(6), External System Services | Organization-Controlled Cryptographic Keys"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 80, anchor: "SA-9(6), External System Services | Organization-Controlled Cryptographic Keys"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Protects PII by reducing risk that unauthorized individuals are able to access the system."}
        references: "5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: sa-9.7
        heading: "SA-9(7), External System Services | Organization-Controlled Integrity Checking"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 80, anchor: "SA-9(7), External System Services | Organization-Controlled Integrity Checking"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Protects PII by supporting visibility into access and use of PII, which reduces risk of unauthorized access or use of the PII."}
        references: "5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: sa-9.8
        heading: "SA-9(8), External System Services | Processing and Storage Location - U.S. Jurisdiction"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 80, anchor: "SA-9(8), External System Services | Processing and Storage Location - U.S. Jurisdiction"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Other countries have different requirements for the protection of PII of either their own citizens or for transfer of PII across national borders. When selecting a service provider, the location for storage, maintenance, or processing of PII must be restricted to the legal jurisdictional boundary of the United States."}
        references: "5 U.S.C. §552a(m); FAR Part 24 and 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: sa-10
        heading: "SA-10, DEVELOPER CONFIGURATION MANAGEMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 80, anchor: "SA-10, DEVELOPER CONFIGURATION MANAGEMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Protects PII by ensuring integrity of the data while making configuration changes."}
        references: "5 U.S.C. §552a"
        authorities: ["5 U.S.C. 552a"]
      - control: sa-10.7
        heading: "SA-10(7), Developer Configuration Management | Security and Privacy Representatives"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 80, anchor: "SA-10(7), Developer Configuration Management | Security and Privacy Representatives"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "It is easier, cheaper, and more effective to build privacy into a system during development than to retrofit privacy protections into an existing system. Including privacy subject matter experts in configuration management discussions will better integrate privacy protections into systems that process PII."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: sa-11
        heading: "SA-11, DEVELOPER TESTING AND EVALUATION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 80, anchor: "SA-11, DEVELOPER TESTING AND EVALUATION – Included in the Privacy Control"}
        in_privacy_baseline: true
      - control: sa-11.2
        heading: "SA-11(2), Developer Testing and Evaluation | Threat Modeling and Vulnerability Analyses*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 80, anchor: "SA-11(2), Developer Testing and Evaluation | Threat Modeling and Vulnerability"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Testing is a key method to ensure privacy controls are implemented. Including privacy controls in the security assessment plan ensures they are tested."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: sa-11.5
        heading: "SA-11(5), Developer Testing and Evaluation | Penetration Testing"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 81, anchor: "SA-11(5), Developer Testing and Evaluation | Penetration Testing"}
        statements:
          - {kind: justification, disposition: select, sets: [HIGH], text: "This control is required to implement penetration testing identified in CA-8. For High privacy risk level systems, the penetration testing requirements of CA-8, as specified above in this overlay, shall be applied."}
        references: "5 U.S.C. §552a(b) and (e)(10); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: sa-15
        heading: "SA-15, DEVELOPMENT PROCESS, STANDARDS, AND TOOLS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 81, anchor: "SA-15, DEVELOPMENT PROCESS, STANDARDS, AND TOOLS"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "It is easier, cheaper, and more effective to build privacy into a system during development than to retrofit privacy protections into an existing system. Including privacy subject matter experts in the development process will better integrate privacy protections into systems that process PII."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: sa-15.12
        heading: "SA-15(12), Development Process, Standards, and Tools | Minimize Personally Identifiable Information"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 81, anchor: "SA-15(12), Development Process, Standards, and Tools | Minimize Personally Identifiable"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Using synthetic data not only minimizes privacy risk in the test environment, a system of records notice (SORN) is not needed if the test system is limited to using only synthetic PII. If using real data, a SORN must be published before a federal agency can establish or revise a system of records, regardless of whether the system is in a test environment."}
        references: "5 U.S.C. §552a(e)(4); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: sa-17
        heading: "SA-17, DEVELOPER SECURITY AND PRIVACY ARCHITECTURE AND DESIGN"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 81, anchor: "SA-17, DEVELOPER SECURITY AND PRIVACY ARCHITECTURE AND DESIGN"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "The privacy architecture and design identifies controls necessary to meet both security and privacy requirements. The SAOP, or designee, is the best resource for identifying privacy requirements."}
        references: "FISMA (Pub. L. No. 107-347) Title III; 5 U.S.C. §552a(e)(10); OMB M-05-08"
        authorities: ["FISMA", "Pub. L. 107-347", "5 U.S.C. 552a", "OMB M-05-08"]
      - control: sa-21
        heading: "SA-21, DEVELOPER SCREENING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 81, anchor: "SA-21, DEVELOPER SCREENING"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Access to PII requires both a valid need to know as documented by an access authorization request, and requires a background investigation (or appropriate screening) to ensure the individual being provided access is suitable. These access authorization requirements extend to developers of systems containing PII."}
          - {kind: parameter, text: "Require that the developer of systems containing PII: a. Has appropriate access authorizations as determined by contracting officer and contracting officer representative, in consultation with the organization's privacy office; and b. Satisfies the following additional personnel screening criteria: organization defined personnel screening criteria commensurate with increasing level of risk and responsibility for access to, or use of, different levels of PII."}
        references: "5 C.F.R. §731.106; FAR Part 24 and 39.105"
        authorities: ["5 CFR", "FAR"]
      - control: sc-1
        heading: "SC-1, (SYSTEM AND COMMUNICATIONS PROTECTION) - Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 82, anchor: "SC-1, (SYSTEM AND COMMUNICATIONS PROTECTION) - Included in the Privacy"}
        in_privacy_baseline: true
      - control: sc-7
        heading: "SC-7, BOUNDARY PROTECTION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 82, anchor: "SC-7, BOUNDARY PROTECTION"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Boundary Protection is critical to the protection of PII in transit. Implementation of this control requires monitoring both at controlled interfaces and at the secure boundary, a boundary that may include and exceed the established authorization boundary. Implementation of this control may also include managed interfaces such as gateways, routers, firewalls, guards, etc. implemented within a security architecture. Requiring this control for all PII overlays ensures the protection of the most sensitive PII."}
        references: "EO 14208, NSM-8; OMB Circular A-130"
        authorities: ["EO 14208", "NSM-8", "OMB Circular A-130"]
      - control: sc-7.8
        heading: "SC-7(8), Boundary Protection | Route Traffic to Authenticated Proxy Servers"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 82, anchor: "SC-7(8), Boundary Protection | Route Traffic to Authenticated Proxy Servers"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Requires implementation of an authenticated proxy server to protect PII at managed interfaces. This layer of security further enhances other security measures such as encryption and access control for a multilayered security solution that will increase the security profile of PII."}
        references: "NSM-8; OMB Circular A-130"
        authorities: ["NSM-8", "OMB Circular A-130"]
      - control: sc-7.10
        heading: "SC-7(10), Boundary Protection | Prevent Exfiltration"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 82, anchor: "SC-7(10), Boundary Protection | Prevent Exfiltration"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "PII must be protected from both intentional and unintentional exfiltration. This control requires the secure implementation of boundary protection(s). Secure solutions such as guards allow for both protection and monitoring of data traversing the system boundary."}
        references: "NSM-8; OMB Circular A-130"
        authorities: ["NSM-8", "OMB Circular A-130"]
      - control: sc-7.24
        heading: "SC-7(24), Boundary Protection | Personally Identifiable Information"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 83, anchor: "SC-7(24), Boundary Protection | Personally Identifiable Information"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "PII must be processed only in accordance with established privacy requirements. Exceptions to processing rules must be reviewed at regular intervals and removed when no longer supported."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: sc-8
        heading: "SC-8, TRANSMISSION CONFIDENTIALITY AND INTEGRITY"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 83, anchor: "SC-8, TRANSMISSION CONFIDENTIALITY AND INTEGRITY"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "The confidentiality and integrity of PII must be assured in transit to provide adequate protection due to the sensitivity of PII. Protecting the confidentiality and integrity of information can be accomplished by physical or logical means."}
          - {kind: parameter, text: "Protect the confidentiality and integrity of transmitted information."}
        references: "5 U.S.C. §552a(e)(5), (10); E-Government Act of 2002 (I; Pub. L. No. 107-347), Title III; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130"]
      - control: sc-12
        heading: "SC-12, CRYPTOGRAPHIC KEY ESTABLISHMENT AND MANAGEMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 83, anchor: "SC-12, CRYPTOGRAPHIC KEY ESTABLISHMENT AND MANAGEMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "CNSSP No. 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Use of cryptography is required to protect PII. Cryptographic key establishment and management must be performed such that even the loss of keys will not permit unauthorized access to PII. Per NSM-8 and NMM-2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit."}
          - {kind: guidance, text: "NSM-8 and NMM-2023-01 require all organizations use NSA-approved, public-standards-based cryptographic protocols to ensure widespread cryptographic interoperability among NSS. If mission-unique requirements preclude the use of public standards-based cryptographic protocols, NSA-approved mission unique protocols may be used."}
          - {kind: parameter, text: "Establish and manage cryptographic keys when cryptography is employed within the system in accordance with the following key management requirements: centralized management of key generation, distribution, storage, access, and destruction in accordance with NIST SP 800-55 and NIST SP 800-57."}
        references: "5 U.S.C. §552a(b), (e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), Title III; NSM-8 Sec 1.b.iv; OMB Circular A-130; CNSSP No. 15"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "NSM-8", "OMB Circular A-130", "CNSSP No. 15"]
      - control: sc-13
        heading: "SC-13, CRYPTOGRAPHIC PROTECTION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 84, anchor: "SC-13, CRYPTOGRAPHIC PROTECTION"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "NSA-approved and FIPS-validated cryptographic modules are the government standard for encryption. Cryptography is a secure solution implemented to protect sensitive and classified information and is a best practice to secure PII."}
          - {kind: guidance, text: "An agency shall not authorize new systems to operate that do not use approved encryption algorithms and implementations, absent an exception authorized by the head of an agency pursuant to Section 3 of the NSM-8."}
          - {kind: parameter, text: "b. Implement the following types of cryptography required for each specified cryptographic use: either FIPS-validated or NSA-approved cryptography to ensure the confidentiality and integrity of PII in transit or at rest."}
        references: "EO 14028 Section 3.d; NSM-8 Section 3; OMB Circular A-130; OMB M-17-12"
        authorities: ["EO 14028", "NSM-8", "OMB Circular A-130", "OMB M-17-12"]
      - control: sc-16
        heading: "SC-16, TRANSMISSION OF SECURITY AND PRIVACY ATTRIBUTES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 84, anchor: "SC-16, TRANSMISSION OF SECURITY AND PRIVACY ATTRIBUTES"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Implementation of attributes to PII protects the integrity and confidentiality of the information and supports attribute-based access control (ABAC). ABAC limits user access to information according to defined access policies, which helps ensure the security and confidentiality of the PII processed by the systems."}
        references: "OMB Circular A-130; NIST SP 800-122"
        authorities: ["OMB Circular A-130"]
        guidance_references: ["NIST SP 800-122"]
      - control: sc-16.1
        heading: "SC-16(1), Transmission of Security and Privacy Attributes | Integrity Verification"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 84, anchor: "SC-16(1), Transmission of Security and Privacy Attributes | Integrity Verification"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Verifying the security and privacy attributes of transmitted information helps to ensure data was not compromised in transit or subject to unauthorized access. This verification helps ensure the integrity of the data."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: sc-16.2
        heading: "SC-16(2), Transmission of Security and Privacy Attributes | Anti-Spoofing Mechanisms*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 84, anchor: "SC-16(2), Transmission of Security and Privacy Attributes | Anti-Spoofing Mechanisms*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "While not required for privacy, if this control is implemented for security it can enhance the protection of PII by implementing anti-spoofing mechanisms to ensure the integrity and confidentiality of system data that includes PII."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: sc-28
        heading: "SC-28, PROTECTION OF INFORMATION AT REST"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 85, anchor: "SC-28, PROTECTION OF INFORMATION AT REST"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8 and NMM-2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit for all NSS."}
          - {kind: parameter, text: "Protect the confidentiality and integrity of the following information at rest: PII."}
        references: "5 U.S.C. §552a(b) and (e)(10); EO 14028 Section 3.d; NSM-8 Section 1.b.iii-iv; OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "EO 14028", "NSM-8", "OMB Circular A-130", "OMB M-17-12"]
      - control: sc-28.1
        heading: "SC-28(1), Protection of Information at Rest | Cryptographic Protection"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 85, anchor: "SC-28(1), Protection of Information at Rest | Cryptographic Protection"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8 and NMM-2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit for all National Security Systems."}
          - {kind: parameter, text: "Implement cryptographic mechanisms to prevent unauthorized disclosure and modification of the following information at rest on all system components or media processing or storing PII."}
        references: "5 U.S.C. §552a(b), (e)(10); EO 14028 Section 3.d; NSM-8, Sec 1.b.iii; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 14028", "NSM-8", "OMB Circular A-130"]
      - control: sc-28.3
        heading: "SC-28(3), Protection of Information at Rest | Cryptographic Keys"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 85, anchor: "SC-28(3), Protection of Information at Rest | Cryptographic Keys"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8 and NMM-2023-01, organizations are required to implement encryption for data-at-rest and data-in-transit for all NSS."}
        references: "5 U.S.C. §552a(b) and (e)(10); EO 14028 Section 3.d; NSM-8, Section 1.b.iii; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 14028", "NSM-8", "OMB Circular A-130"]
      - control: si-1
        heading: "SI-1, SYSTEM AND INFORMATION INTEGRITY POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 85, anchor: "SI-1, SYSTEM AND INFORMATION INTEGRITY POLICY AND PROCEDURES –"}
        in_privacy_baseline: true
      - control: si-4
        heading: "SI-4, SYSTEM MONITORING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 85, anchor: "SI-4, SYSTEM MONITORING"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "System monitoring is necessary for organizations to determine when security and privacy events occur and to determine when those events require further investigation to discern whether an incident or breach has occurred. It must be done in a way that protects the privacy of individuals and the data captured during monitoring."}
          - {kind: guidance, text: "System monitoring tools may capture PII of all types transacted during the monitoring period. Notice to users who are monitored should be provided prior to system use. Controls sufficient to protect the type of PII collected must be in place for the technology performing the monitoring, e.g., encryption of monitoring data that may contain PII. When conducting system monitoring on internal or external systems which may collect PII, the organization should coordinate with the organization’s counsel and cognizant privacy official."}
        references: "5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "NSM-8", "OMB Circular A-130", "OMB M-17-12"]
      - control: si-7
        heading: "SI-7, SOFTWARE, FIRMWARE, AND INFORMATION INTEGRITY"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 86, anchor: "SI-7, SOFTWARE, FIRMWARE, AND INFORMATION INTEGRITY"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Detection of unauthorized changes to PII and systems that process PII is fundamental to ensuring data quality and integrity as required by the Privacy Act and the FIPPs."}
          - {kind: parameter, text: "a. Employ integrity verification tools to detect unauthorized changes to the following software, firmware, and information: PII, metadata that contains privacy attributes associated with information;"}
        references: "5 U.S.C. §552a(e)(5); OMB M-04-04; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB M-04-04", "OMB Circular A-130"]
      - control: si-7.6
        heading: "SI-7(6), Software, Firmware, and Information Integrity | Cryptographic Protection*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 86, anchor: "SI-7(6), Software, Firmware, and Information Integrity | Cryptographic Protection*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Detection of unauthorized changes to PII and systems containing PII is fundamental to ensuring data integrity."}
          - {kind: guidance, text: "Use FIPS-validated or NSA-approved to detect unauthorized changes to software, firmware, and information. NSA-approved or FIPS-validated cryptographic modules are the government standard for integrity verification. When PII requires integrity verification the organization must comply with these standards."}
        references: "5 U.S.C. §552a (10); OMB M-17-12; OMB M-04-04; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB M-17-12", "OMB M-04-04", "OMB Circular A-130"]
      - control: si-10
        heading: "SI-10, INFORMATION INPUT VALIDATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 86, anchor: "SI-10, INFORMATION INPUT VALIDATION"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Information input validation serves two important purposes for protecting PII: 1) when PII is entered, validation techniques support data quality measures (e.g., ensuring the PII entered is the expected type and format of data), and 2) it provides the capability to limit or exclude PII from being entered into a field (e.g., recognizing a restricted format, such as an SSN)."}
          - {kind: parameter, text: "Check the validity of the following information inputs: PII"}
        references: "5 U.S.C. §552a(e)(5), (e)(6), and (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: si-11
        heading: "SI-11, ERROR HANDLING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 87, anchor: "SI-11, ERROR HANDLING"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Error messages can provide useful insights into issues when operating a system. However, they can introduce privacy risk and practitioners must take care when constructing these messages to ensure the content and delivery of error messages do not inadvertently introduce privacy risk."}
          - {kind: guidance, text: "An error in a system may reveal PII. For example, if there is an error posting a form that contains PII and the system includes the PII entered in the form when it writes to the error log, it will be visible to whoever has access permissions to the error log. Therefore, error handling must be considered in the design of the system and access to errors containing PII should be provided only to those individuals with a need for that information in the performance of their duties."}
          - {kind: parameter, text: "b. Reveal error messages only to authorized individuals with a need to know in the performance of their official duties"}
        references: "5 U.S.C. §552a(e)(5) and (10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: si-12
        heading: "SI-12, INFORMATION HANDLING AND RETENTION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 87, anchor: "SI-12, INFORMATION HANDLING AND RETENTION – Included in the Privacy"}
        in_privacy_baseline: true
      - control: si-12.1
        heading: "SI-12(1), Information Management and Retention | Limit Personally Identifiable Information Elements"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 87, anchor: "SI-12(1), Information Management and Retention | Limit Personally Identifiable"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Any data processing activities that include PII inherently introduce privacy risk that must be managed. The nature of privacy risk can vary at each stage of the information life cycle (e.g., risk may be lower when PII is initially collected and then increased when it is combined with other information during later processing). Organizations must adhere to the Minimization FIPP throughout each stage of the information lifecycle when processing PII to help limit privacy risk and the potential for breaches."}
        references: "5 U.S.C. §552a(e)(1), (4), (5); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: si-12.2
        heading: "SI-12(2), Information Management and Retention | Minimize Personally Identifiable Information in Testing, Training, and Research"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 87, anchor: "SI-12(2), Information Management and Retention | Minimize Personally Identifiable"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "The controls that protect live, operational, or production environments are not always employed in development, testing, training, or research environments, which can leave PII at a heightened risk for accidental loss, theft, or compromise. Therefore, the organization should take measures to reduce that risk."}
          - {kind: guidance, text: "When PII is of a sufficiently sensitive nature, to the greatest extent possible, PII should not be used when testing or developing an information system. Systems of records as defined by the Privacy Act cannot use real PII during system development, testing, training, or research until the SORN has been published or updated."}
        references: "5 U.S.C. §552a(e)(11); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: si-12.3
        heading: "SI-12(3), Information Management and Retention | Information Disposal"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 88, anchor: "SI-12(3), Information Management and Retention | Information Disposal"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Both the Privacy Act and the Federal Records Act require records to be processed and disposed of in accordance with a published Records Schedule. Disposal and destruction of PII must be done securely so that it may not be reconstructed. In addition to this requirement, properly disposing of or destroying PII when no longer needed reduces the risk of compromise or misuse."}
          - {kind: guidance, text: "Organizations are only permitted to keep PII in accordance with applicable retention schedules. Coordinate with the cognizant privacy and records officials when establishing retention and disposition requirements for PII."}
          - {kind: parameter, text: "Use the following techniques to dispose of, destroy, or erase information following the retention period: NSA-approved or FIPS-validated techniques or methods."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-18
        heading: "SI-18, PERSONALLY IDENTIFIABLE INFORMATION QUALITY OPERATIONS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 88, anchor: "SI-18, PERSONALLY IDENTIFIABLE INFORMATION QUALITY OPERATIONS"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "PII should be accurate, relevant, timely, and complete to assure fairness to the individual. This is especially important when a record is used to decide a right, benefit, or privilege for an individual or when information is shared beyond a program or system for processing by others. Organizations should ensure the quality of all of their PII, even if it is not covered by the Privacy Act."}
          - {kind: guidance, text: "When PII is of a sufficiently sensitive nature (e.g., when it is used to adjudicate an employee's clearance), organizations should incorporate mechanisms into systems and develop corresponding procedures for how frequently, and by what method, the information is to be confirmed accurate, relevant, timely, and complete. Frequency of confirmation should be commensurate with risks to the individual and the business processes that the information supports. There may be statutory exemptions for national security systems. The SAOP, or designee, can provide information on what is required for a particular system."}
        references: "5 U.S.C. §552a(e)(1), (5); EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 12333", "OMB Circular A-130"]
      - control: si-18.1
        heading: "SI-18(1), Personally Identifiable Information Quality Operations | Automation Support"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 89, anchor: "SI-18(1), Personally Identifiable Information Quality Operations | Automation Support"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Automating the enforcement of data quality management requirements can strengthen the implementation of SI-18 when done in a way that does not perpetuate or create new privacy risk."}
          - {kind: guidance, text: "Certain NSS may have a published exemption for this requirement. The SAOP, or designee, can provide information on what is required for a particular system."}
        references: "5 U.S.C. §552a(e)(1), (5), (j), and (k)"
        authorities: ["5 U.S.C. 552a"]
      - control: si-18.2
        heading: "SI-18(2), Personally Identifiable Information Quality Operations | Data Tags*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 89, anchor: "SI-18(2), Personally Identifiable Information Quality Operations | Data Tags*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Employing data tags for PII can support the use of automation tools to correct or delete relevant PII."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-18.3
        heading: "SI-18(3), Personally Identifiable Information Quality Operations | Collection"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 89, anchor: "SI-18(3), Personally Identifiable Information Quality Operations | Collection"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Collecting PII directly from the individual to which it pertains can increase the likelihood that the information is accurate or can be used to validate information collected from other sources."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-18.4
        heading: "SI-18(4), Personally Identifiable Information Quality Operations | Individual Requests"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 89, anchor: "SI-18(4), Personally Identifiable Information Quality Operations | Individual Requests"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Supports redress and data integrity requirements for PII by providing a process for individuals to request correction of, or amendment to, their PII maintained by an organization. Agencies maintaining systems of records as defined by the Privacy Act must have a process in place to permit individuals to request amendment of a record pertaining to the individuals, subject to a published exemption. The process, when required, must comply with the Privacy Act requirements including but not limited to the ability to seek an administrative appeal, and the circumstances in which an individual can prepare a statement of disagreement."}
          - {kind: guidance, text: "Organizations maintaining a system of records as defined by the Privacy Act must provide a process to ensure that individuals can request amendments of, or correction to their records. Certain NSS may have a published exemption for this requirement. The SAOP, or designee, can provide information on what is required for a particular system."}
        references: "5 U.S.C. §552a(c)(4), (d), and (h); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: si-18.5
        heading: "SI-18(5), Personally Identifiable Information Quality Operations | Notice of Correction or Deletion"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 90, anchor: "SI-18(5), Personally Identifiable Information Quality Operations | Notice of Correction or"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Informing authorized recipients of PII that the information has been corrected or deleted is critical to supporting data quality efforts when information is shared with other programs, processes, systems, or organizations. This notice provides the information practitioners need to make decisions about how to incorporate changes to PII in their data processing environment. Additionally, confirming to individuals or their designated representatives that a requested correction or deletion has been made fosters trust in the organization by demonstrating responsiveness to redress requests."}
          - {kind: guidance, text: "Organizations maintaining a system of records as defined by the Privacy Act must provide notice of correction or deletion to individuals who request such actions. Certain NSS may have a published exemption for this requirement. The SAOP, or designee, can provide information on what is required for a particular system."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19
        heading: "SI-19, DE-IDENTIFICATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 90, anchor: "SI-19, DE-IDENTIFICATION"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "De-identification, when appropriate, directly supports the concept of minimization by removing the association between identifying data and the data subject. Due to its utility in reducing privacy risk to individuals and related risk to organizations, de-identification techniques should be employed as the default approach when practicable."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.1
        heading: "SI-19(1), De-Identification | Collection*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 90, anchor: "SI-19(1), De-Identification | Collection*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Most effective de-identification measure is to not collect the information in the first place."}
          - {kind: guidance, text: "Particularly useful when sharing records between organizations and systems. Agencies should design sharing interfaces to exclude the data elements that are not required to meet mission or business purposes."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.2
        heading: "SI-19(2), De-Identification | Archiving*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 91, anchor: "SI-19(2), De-Identification | Archiving*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Most effective means to protect PII is to only archive what will be used after it is archived. This best practice supports records retention requirements and Minimization FIPP."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.3
        heading: "SI-19(3), De-Identification | Release*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 91, anchor: "SI-19(3), De-Identification | Release*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "This best practice supports the FIPPs of Minimization as well as Purpose Specification and Use Limitation"}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.4
        heading: "SI-19(4), De-Identification | Removal, Masking, Encryption, Hashing, or Replacement of Direct Identifiers*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 91, anchor: "SI-19(4), De-Identification | Removal, Masking, Encryption, Hashing, or Replacement of"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "One of several techniques for implementing de-identification."}
          - {kind: guidance, text: "Useful in situations with lower privacy risk or when resources do not permit more robust techniques. Generally easy and inexpensive to implement. Some methods are more robust than others (see 800-53 discussion for examples of methods). Utility of the data may vary."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.5
        heading: "SI-19(5), De-Identification | Statistical Disclosure Control*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 91, anchor: "SI-19(5), De-Identification | Statistical Disclosure Control*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Results of statistical analysis can make connections to identifiable individuals less obvious."}
          - {kind: guidance, text: "Often not appropriate in small datasets because distinguishing characteristics can lead to easier re-identification or other inferences about individuals in the dataset."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.6
        heading: "SI-19(6), De-Identification | Differential Privacy*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 91, anchor: "SI-19(6), De-Identification | Differential Privacy*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "One of several techniques for implementing de-identification."}
          - {kind: guidance, text: "Differential Privacy is more robust than other methods of de-identification and useful in situations with higher privacy risk, but the system may lose some utility of the data. Various degrees of differential privacy (e.g., k-anonymity, t-closeness). Requires a special set of skills to implement correctly and is not a silver bullet."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.7
        heading: "SI-19(7), De-Identification | Validated Algorithms and Software*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 92, anchor: "SI-19(7), De-Identification | Validated Algorithms and Software*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "One of several techniques for implementing de-identification."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-19.8
        heading: "SI-19(8), De-Identification | Motivated Intruder*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 92, anchor: "SI-19(8), De-Identification | Motivated Intruder*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Provide useful insights regarding how successfully de-identification techniques have been deployed and the residual risks that may necessitate additional controls for protecting the data."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-20
        heading: "SI-20, TAINTING*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 92, anchor: "SI-20, TAINTING*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Can help organizations identify when a data set has been compromised and a potential privacy breach has occurred."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: si-21
        heading: "SI-21, INFORMATION REFRESH*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 92, anchor: "SI-21, INFORMATION REFRESH*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Supports the FIPPs of Quality and Integrity and Minimization."}
          - {kind: guidance, text: "Factor in the system’s records control schedules when applicable. Refreshing information implements several FIPPs. For example, refreshing the information and generating it on demand implements the Quality and Integrity FIPPs. Deleting information when it is no longer needed implements the Minimization FIPP."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: sr-1
        heading: "SR-1, (SUPPLY CHAIN RISK MANAGEMENT) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 92, anchor: "SR-1, (SUPPLY CHAIN RISK MANAGEMENT) POLICY AND PROCEDURES –"}
        in_privacy_baseline: true
      - control: sr-4
        heading: "SR-4, PROVENANCE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 92, anchor: "SR-4, PROVENANCE"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Requires maintaining an understanding of how PII moves and changes throughout data processing activities, which may identify or reveal privacy relevant changes to the system. As data is shared between agencies, it is important to ensure shared understanding of who is responsible for the data."}
          - {kind: parameter, text: "Document, monitor, and maintain valid provenance of the following systems, system components, and associated data: PII"}
        references: "5 U.S.C. §552a(e)(1), (5)"
        authorities: ["5 U.S.C. 552a"]
