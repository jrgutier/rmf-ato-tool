          - {kind: justification, disposition: select, text: "CNSSD No. 504 requires the review of all privileged users and ensures they have the appropriate clearances, roles, and scope to perform their duties and make changes as needed."}
        references: "EO 13526, Sec 4.1, para. (a); CNSSD No. 504."
        authorities: ["EO 13526", "CNSSD No. 504"]
      - control: ac-11
        heading: "AC-11, Device Lock"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 12, anchor: "AC-11, Device Lock"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish uniform procedures to ensure systems that store, process, or transmit classified information prevent access by unauthorized persons. Requiring a device lock after a specified period of inactivity helps to prevent unauthorized users from physically using an authorized user's session as a means to gain unauthorized access to classified information."}
          - {kind: parameter, text: "a. Prevent further access to the system by initiating a device lock after a period not to exceed 15 minutes of inactivity, requiring the user to initiate a device lock before leaving the system unattended;"}
        references: "EO 13526, Sec 4.1, para. (f).; EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: ac-11.1
        heading: "AC-11(1), Device Lock | Pattern-Hiding Displays"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 12, anchor: "AC-11(1), Device Lock | Pattern-Hiding Displays"}
        statements:
          - {kind: justification, disposition: select, text: "Requiring the system to conceal the information previously visible on the display after device lock helps to prevent unauthorized users from viewing an authorized user's display as a means to gain unauthorized access to classified information."}
        references: "EO 13526, Sec 4.1, para. (f).; EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: ac-16
        heading: "AC-16, Security and Privacy Attributes"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 12, anchor: "AC-16, Security and Privacy Attributes"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 defines classification levels and requires organizations to label classified information to reflect its classification. Labeling refers to internal labels that the software can read, such as fields attached to information that might be used in a CDS or multilevel system, or for message routing."}
          - {kind: guidance, text: "For classification and control labeling, the organization determines the permitted attributes and permitted values consistent with the policies applicable to the organization and based on the classification level and related security characteristics of the information stored, processed, or transmitted by the system. (For marking guidance, see MP-3.)"}
        references: "EO 13526, Sec 1.2, para. (a), Sec 1.6, para. (a), and Sec 2.1, para. (a-b)."
        authorities: ["EO 13526"]
