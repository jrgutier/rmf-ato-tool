      - control: pl-8
        heading: "PL-8, SECURITY AND PRIVACY ARCHITECTURES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 65, anchor: "PL-8, SECURITY AND PRIVACY ARCHITECTURES"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "The security and privacy architectures identify security and privacy controls necessary to support privacy requirements. The SAOP or Chief Privacy Officer (CPO) are the best resource for identifying privacy requirements and privacy controls."}
        references: "5 U.S.C. 552a(e)(10); E-Government Act of 2002 (Pub. L. 107-347) § 208; OMB M-03-22"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB M-03-22"]
      - control: pl-8.1
        heading: "PL-8(1), Security and Privacy Architectures | Defense In Depth"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 65, anchor: "PL-8(1), Security and Privacy Architectures | Defense In Depth"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Requiring multiple controls inhibits and deters adversaries from achieving unauthorized access to PII. The security and privacy architectures identify security and privacy controls necessary to support a defense-in-depth approach. The SAOP or Chief Privacy Officer (CPO) are the best resource for identifying privacy requirements and privacy controls."}
        references: "5 U.S.C. 552a(e)(10); E-Government Act of 2002 (Pub. L. 107-347) § 208; OMB M-03-22"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB M-03-22"]
