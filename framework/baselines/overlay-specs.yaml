      - control: ac-3.2
        heading: "AC-3(2), Access Enforcement | Dual Authorization"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 10, anchor: "AC-3(2), Access Enforcement | Dual Authorization"}
        statements:
          - {kind: justification, disposition: select, text: "CNSSD No. 504 requires the implementation of two-person controls (review and concurrence of a second person) for operations when protection is necessary to prevent significant disruptions and reduce the risk related to insider threats."}
        references: "EO 13587, Sec 6.1.; CNSSD No. 504."
        authorities: ["EO 13587", "CNSSD No. 504"]
      - control: ac-3.4
        heading: "AC-3(4), Access Enforcement | Discretionary Access Controls"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 11, anchor: "AC-3(4), Access Enforcement | Discretionary Access Controls"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Discretionary access controls provide a means to reduce the opportunities cleared individuals may have to gain access to information for which they do not have a need-to-know."}
        references: "EO 13526, Sec 4.1, para. (a)."
        authorities: ["EO 13526"]
      - control: ac-5
        heading: "AC-5, Separation of Duties"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 11, anchor: "AC-5, Separation of Duties"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. CNSSD No. 504 requires the implementation of the separation of duties. Separation of duties provides a means to safeguard the information by reducing the opportunities individuals may have to gain access to information."}
          - {kind: guidance, text: "Organizations should separate roles for network or database administration from other sensitive function, such as cryptographic key management, hardware management, removable media data transfer, system security management, or access to particularly sensitive information."}
        references: "EO 13587, Sec 6.1; CNSSD No. 504."
        authorities: ["EO 13587", "CNSSD No. 504"]
      - control: ac-6
        heading: "AC-6, Least Privilege"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 11, anchor: "AC-6, Least Privilege"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Implementing least privilege provides a means to reduce the opportunities individuals may have to gain access to information for which they do not have a need-to-know. CNSSD No. 504 requires the implementation of least privilege."}
