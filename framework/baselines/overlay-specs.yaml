        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 20, anchor: "AU-14, Session Audit"}
        statements:
          - {kind: justification, disposition: select, text: "The White House Memorandum, National Insider Threat Policy and Minimum Standards for Executive Branch Insider Threat Programs, requires the capability to capture audit information to detect and mitigate insider threat and requires agencies to monitor and audit user activity on classified networks. This control directly supports the capture of user activities during sessions. Having the capability to generate audit records containing this content is considered a best practice for safeguarding classified information against insider threat."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "White House Memorandum, National Insider Threat Policy, Tab 1, Sec B.2(1) and Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504."
        authorities: ["National Insider Threat Policy", "Minimum Standards for Executive Branch Insider Threat Programs", "CNSSD No. 504"]
      - control: au-16
        heading: "AU-16, Cross-Organizational Audit Logging"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 20, anchor: "AU-16, Cross-Organizational Audit Logging"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure. Coordinating audit information across organizations supports the detection of insider threat activities."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13587, Sec 2.1(b) and Sec 5.2; White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504."
        authorities: ["EO 13587", "Minimum Standards for Executive Branch Insider Threat Programs", "CNSSD No. 504"]
      - control: au-16.1
        heading: "AU-16(1), Cross-Organizational Audit Logging | Identity Preservation"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 20, anchor: "AU-16(1), Cross-Organizational Audit Logging | Identity Preservation"}
        statements:
          - {kind: justification, disposition: select, text: "Preserving the identities of individuals in cross-organization audit trails facilitates the detection of insider threats on all classified networks."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13587, Sec 2.1(b) and Sec 5.2; White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504."
        authorities: ["EO 13587", "Minimum Standards for Executive Branch Insider Threat Programs", "CNSSD No. 504"]
      - control: au-16.2
        heading: "AU-16(2), Cross-Organizational Audit Logging | Sharing of Audit Information"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 21, anchor: "AU-16(2), Cross-Organizational Audit Logging | Sharing of Audit"}
        statements:
          - {kind: justification, disposition: select, text: "Providing cross-organizational audit information is required to facilitate the detection and mitigation of insider threats on all classified networks."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
          - {kind: parameter, text: "Provide cross-organizational audit information to the organization’s insider threat program at a minimum based on [Assignment: organization-defined cross-organizational sharing agreements]."}
        references: "EO 13587, Sec 2.1(b) and Sec 5.2; White House Memorandum, Minimum Standards for Executive Branch Insider Threat Programs, Tab 2, Sec H.1; CNSSD No. 504."
        authorities: ["EO 13587", "Minimum Standards for Executive Branch Insider Threat Programs", "CNSSD No. 504"]
      - control: ca-3
        heading: "CA-3, Information Exchange"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 21, anchor: "CA-3, Information Exchange"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to ensure classified information disseminated outside the executive branch is protected in a manner equivalent to that provided within the executive branch. An Interconnection Security Agreement (ISA) is the appropriate means to convey the expectations for the associated security requirements."}
          - {kind: guidance, text: "For interconnections of systems processing classified information that serve to disseminate classified information outside the executive branch, the organization ensures the protection of the information in a manner equivalent to that provided within the executive branch using an ISA. The organization prohibits the interconnection between classified and unclassified NSS unless using approved technologies (e.g., CDS) (see CDS Overlay for further guidance)."}
          - {kind: parameter, text: "a. Approve and manage the exchange of information between the system and other systems using interconnection security agreements; c. Review and update the agreements at least annually or as changes to the systems or connections change."}
        references: "EO 13526, Sec 4.1, para. (e)."
        authorities: ["EO 13526"]
      - control: cm-3.6
        heading: "CM-3(6), Configuration Change Control | Cryptography Management"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 21, anchor: "CM-3(6), Configuration Change Control | Cryptography Management"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Cryptographic mechanisms are required (per the justification in this overlay for SC-8(1)) to protect the confidentiality of transmitted classified information. Configuration management of the cryptographic mechanisms employed helps to ensure that the required protections remain in effect. Organizations must ensure that cryptographic mechanisms used to provide safeguarding of classified information from unauthorized access or modification are under configuration management."}
        references: "EO 13526, Sec 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: cm-5.5
        heading: "CM-5(5), Access Restrictions for Change | Privilege Limitation for Production and Operation"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 22, anchor: "CM-5(5), Access Restrictions for Change | Privilege Limitation for Production"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Limiting privileges to change system components reduces the opportunities for insiders to grant access to classified information by unauthorized personnel."}
          - {kind: parameter, text: "(b) Review and reevaluate privileges at least quarterly."}
        references: "EO 13526, Sec 4.1, para. (g)."
        authorities: ["EO 13526"]
      - control: ia-2
        heading: "IA-2, Identification and Authentication (Organizational Users)"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 22, anchor: "IA-2, Identification and Authentication (Organizational Users)"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Uniquely identifying and authenticating users limits access to authorized users and is a foundational component of detecting potentially malicious insiders."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13587, Sec 2.1 (b) and Sec 5.2 (a)."
        authorities: ["EO 13587"]
      - control: ia-2.1
        heading: "IA-2(1), Identification and Authentication (Organizational Users) | Multi-Factor Authentication to Privileged Accounts"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 22, anchor: "IA-2(1), Identification and Authentication (Organizational Users) | Multi-"}
        statements:
          - {kind: justification, disposition: select, text: "Per NSM-8, agencies shall implement multifactor authentication and encryption for NSS data-at-rest and data-in-transit. CNSSD No. 504 Annex C requires that agencies implement standardized access control methodologies, specifically multifactor authentication for users with privileged roles."}
        references: "NSM-8 Sec 1(b)(iii); CNSSD No. 504."
        authorities: ["NSM-8", "CNSSD No. 504"]
      - control: ia-2.2
        heading: "IA-2(2), Identification and Authentication (Organizational Users) | Multi-Factor Authentication to Non-Privileged Accounts"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 23, anchor: "IA-2(2), Identification and Authentication (Organizational Users) | Multi-"}
        statements:
          - {kind: justification, disposition: select, text: "Per NSM-8, agencies shall implement multifactor authentication and encryption for NSS data-at-rest and data-in-transit. CNSSD No. 504 Annex A requires that agencies implement standardized access control methodologies, specifically multifactor authentication."}
        references: "NSM-8 Sec 1(b)(iii); CNSSD No. 504."
        authorities: ["NSM-8", "CNSSD No. 504"]
      - control: ia-5.6
        heading: "IA-5(6), Authentication Management | Protection of Authenticators"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 23, anchor: "IA-5(6), Authentication Management | Protection of Authenticators"}
        statements:
          - {kind: justification, disposition: select, text: "CNSSP No. 25 requires NSA review and approval of PKI cryptographic components, to include tokens used for accessing Secret-level networks."}
          - {kind: guidance, text: "In general, authenticators must be protected commensurate with the highest security classification of information on the system. Organizations should refer to the authoritative guidance to ensure compliance and understand how to appropriately protect authenticators. For hardware smart card-based tokens that users could use on Secret Internet Protocol Router Network (SIPRNet) workstations and still be carried by the user into unclassified spaces, NSA developed criteria that smart cards are required to meet to allow access to Secret data but be considered unclassified when not in use."}
        references: "CNSSP No. 25."
        authorities: ["CNSSP No. 25"]
      - control: ir-6
        heading: "IR-6, Incident Reporting"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 23, anchor: "IR-6, Incident Reporting"}
        statements:
          - {kind: justification, disposition: select, text: "NSM-8 directs the reporting of known or suspected compromise or unauthorized access to NSS (including classified systems) to the National Manager."}
          - {kind: parameter, text: "a. Require personnel to report suspected incidents to the organizational incident response capability within 2 hours; and b. Report incident information to the National Manager through the appropriate Federal Cyber Center or other designated central department point of contact (e.g., DoD CERT, IC CERT)."}
        references: "NSM-8, Sec 2(b)."
        authorities: ["NSM-8"]
      - control: ir-9
        heading: "IR-9, Information Spillage Response"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 23, anchor: "IR-9, Information Spillage Response"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons."}
          - {kind: guidance, text: "CNSSP No. 18 and CNSSI No. 1001 provide guidance on additional actions that should be take when responding to classified information spills and should be followed when taking corrective action."}
          - {kind: parameter, text: "a. Assigning, at a minimum, information owner, the Information Assurance Manager (IAM)/Information System Security Manager (ISSM), the Activity Security Manager, and the responsible Incident Response Center (IRC) with responsibility for responding to information spills c. Alerting the information owner, the IAM/ISSM, the Activity Security Manager, and the responsible IRC of the information spill using a method of communication not associated with the spill"}
        references: "EO 13526, Sec 4.1, para. (g).; CNSSP No. 18; CNSSI No. 1001."
        authorities: ["EO 13526", "CNSSP No. 18", "CNSSI No. 1001"]
      - control: ir-9.2
        heading: "IR-9(2), Information Spillage Response | Training"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 24, anchor: "IR-9(2), Information Spillage Response | Training"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons."}
        references: "EO 13526, Sec 4.1, para. (g); CNSSI No. 1001."
        authorities: ["EO 13526", "CNSSI No. 1001"]
      - control: ir-9.4
        heading: "IR-9(4), Information Spillage Response | Exposure to Unauthorized Personnel"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 24, anchor: "IR-9(4), Information Spillage Response | Exposure to Unauthorized Personnel"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. When classified information is spilled, organizations must execute procedures to minimize access to that information by unauthorized persons."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13526, Sec 4.1, para. (g); CNSSI No. 1001."
        authorities: ["EO 13526", "CNSSI No. 1001"]
      - control: ma-3.3
        heading: "MA-3(3), Maintenance Tools | Prevent Unauthorized Removal"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 24, anchor: "MA-3(3), Maintenance Tools | Prevent Unauthorized Removal"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 prohibits the removal of classified information from official premises without proper authorization. Maintenance tools may contain classified information and their unauthorized removal from the premises may result in the loss of classified information; therefore, the removal of maintenance tools must be appropriately conducted."}
        references: "EO 13526, Sec. 4.1, para. (d)."
        authorities: ["EO 13526"]
      - control: ma-5.1
        heading: "MA-5(1), Maintenance Personnel | Individuals Without Appropriate Access"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 25, anchor: "MA-5(1), Maintenance Personnel | Individuals Without Appropriate Access"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. The use of maintenance personnel that lack required clearances or are not U.S. citizens presents challenges for protecting classified information; MA-5(1) is needed to address these challenges."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13526, Sec 4.1, para. (g)."
        authorities: ["EO 13526"]
      - control: mp-1
        heading: "MP-1, (Media Protection) Policy and Procedures"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 25, anchor: "MP-1, (Media Protection) Policy and Procedures"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that classified information may not be removed from official premises without proper authorization. Organizations that process classified information must include appropriate content in their media protection policy and procedures."}
          - {kind: guidance, text: "The organization includes in media protection policy and/or procedures: (i) how authorizations for removing classified information from official premises are determined and documented; (ii) the appropriate means for controlling, protecting and monitoring removal of classified information from official premises; (iii) the appropriate means for transporting classified non-digital media, and classified and unclassified digital media, outside of the organization's controlled areas; and (iv) procedures for identifying areas as controlled vs. uncontrolled."}
        references: "EO 13526, Sec. 4.1, para. (d); CNSSD No. 504."
        authorities: ["EO 13526", "CNSSD No. 504"]
      - control: mp-2
        heading: "MP-2, Media Access"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 25, anchor: "MP-2, Media Access"}
        statements:
          - {kind: justification, disposition: select, text: "Media devices are resources that can be used to exfiltrate classified information and access to the devices should be limited to authorized personnel. EO 13526 states that classified information may not be removed from official premises without proper authorization. EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure."}
        references: "EO 13526, Sec 4.1, para. (d); EO 13587, Sec 5.2 and 6.1."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-3
        heading: "MP-3, Media Marking"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 26, anchor: "MP-3, Media Marking"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to mark classified information to reflect its classification. Marking refers to human readable labels, such as labels on thumb drives. (For labeling guidance, see AC-16.)"}
        references: "EO 13526, Sec 1.6, para. (a) and Sec 2.1, para. (a) and (b); CNSSP No. 26."
        authorities: ["EO 13526", "CNSSP No. 26"]
      - control: mp-4
        heading: "MP-4, Media Storage"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 26, anchor: "MP-4, Media Storage"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Physically controlling and securely storing media is necessary to protect the classified information contained within the media."}
          - {kind: parameter, text: "a. Physically control and securely store digital and non-digital media containing classified information within an area and/or container approved for processing and storing media based on the classification of the information contained within the media;"}
        references: "EO 13526, Sec 4.1, para. (g); CNSSP No. 26."
        authorities: ["EO 13526", "CNSSP No. 26"]
      - control: mp-5
        heading: "MP-5, Media Transport"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 26, anchor: "MP-5, Media Transport"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that classified information may not be removed from official premises without proper authorization and that it must be stored under conditions that provide adequate protection and prevent access by unauthorized persons. Protection of classified information during transport, which includes maintaining accountability, documenting transport activities, and employing cryptographic measures, is essential to satisfy these requirements."}
          - {kind: parameter, text: "a. Protect and control digital and non-digital media containing classified information during transport outside controlled areas using double-wrapping in opaque enclosures and transport only by personnel with a security clearance for the classification of the media being transported;"}
        references: "EO 13526, Sec. 4.1, para. (d) and (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-5.3
        heading: "MP-5(3), Media Transport | Custodians"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 26, anchor: "MP-5(3), Media Transport | Custodians"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that classified information may not be removed from official premises without proper authorization and that it must be stored under conditions that provide adequate protection and prevent access by unauthorized persons. Protection of classified information during transport, which includes maintaining accountability, documenting transport activities, and employing cryptographic measures, is essential to satisfy these requirements."}
          - {kind: guidance, text: "The organization employs an identified custodian during transport of classified system media outside of controlled areas."}
        references: "EO 13526, Sec 4.1, para. (d), (e), (f), and (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-6
        heading: "MP-6, Media Sanitization"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 27, anchor: "MP-6, Media Sanitization"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement."}
          - {kind: parameter, text: "a. Sanitize all classified media prior to disposal, release out of organizational control, or release for reuse using approved sanitization techniques and procedures in accordance with applicable federal and organizational standards and policies;"}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-6.1
        heading: "MP-6(1), Media Sanitization | Review, Approve, Track, Document, and Verify"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 27, anchor: "MP-6(1), Media Sanitization | Review, Approve, Track, Document, and Verify"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-6.2
        heading: "MP-6(2), Media Sanitization | Equipment Testing"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 27, anchor: "MP-6(2), Media Sanitization | Equipment Testing"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-6.3
        heading: "MP-6(3), Media Sanitization | Nondestructive Techniques"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 27, anchor: "MP-6(3), Media Sanitization | Nondestructive Techniques"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-7
        heading: "MP-7, Media Use"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 28, anchor: "MP-7, Media Use"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Removable media provides a means for personnel to move classified data from official premises without proper authorization, and then in turn provide the classified information to unauthorized personnel. Restricting the use of removable media on systems that store, process or transmit classified information decreases the opportunities for unauthorized disclosure of classified information."}
        references: "EO 13526, Sec. 4.1, para. (d); EO 13587, Sec 2.1(b) and Sec 5.2."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-8
        heading: "MP-8, Media Downgrading"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 28, anchor: "MP-8, Media Downgrading"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed."}
          - {kind: guidance, text: "An alternative to downgrading is to replicate the unclassified or lower classified information to media that is designated for the classification level."}
        references: "EO 13526, Sec. 4.1, para. (g); EO 13587, Sec 5.2, para (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-8.1
        heading: "MP-8(1), Media Downgrading | Documentation of Process"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 28, anchor: "MP-8(1), Media Downgrading | Documentation of Process"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-8.2
        heading: "MP-8(2), Media Downgrading | Equipment Testing"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 28, anchor: "MP-8(2), Media Downgrading | Equipment Testing"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed."}
          - {kind: guidance, text: "Testing of sanitization equipment and procedures should be conducted by qualified and authorized entities."}
          - {kind: parameter, text: "Test downgrading equipment and procedures at least annually to ensure that downgrading actions being achieved."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: mp-8.4
        heading: "MP-8(4), Media Downgrading | Classified Information"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 29, anchor: "MP-8(4), Media Downgrading | Classified Information"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Classified information must be removed from media so that the classified information cannot be retrieved or reconstructed."}
          - {kind: guidance, text: "Downgrading of classified information requires use of approved sanitization tools, techniques, and procedures to ensure only confirmed unclassified information is moved from a classified system to unclassified media."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: pe-2.3
        heading: "PE-2(3), Physical Access Authorizations | Restrict Unescorted Access"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 29, anchor: "PE-2(3), Physical Access Authorizations | Restrict Unescorted Access"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Restricting unescorted access is necessary to protect the classified information contained within the facility."}
          - {kind: guidance, text: "Organizations manage their facilities and provide adequate protections to ensure personnel do not have unescorted access to areas operating at classification levels higher than the clearance they have been granted. The organization may provide additional guidance to address their mission needs for areas within facilities or systems with components operating at different classification levels."}
          - {kind: parameter, text: "Restrict unescorted access to the facility where the system resides to personnel with security clearances for all information contained within the system."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: pe-3.2
        heading: "PE-3(2), Physical Access Control | Facility and Systems"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 29, anchor: "PE-3(2), Physical Access Control | Facility and Systems"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that information may not be removed from official premises without proper authorization. Conducting security checks at random or a pre-defined frequency helps mitigate the risk of unauthorized removal of classified materials."}
          - {kind: guidance, text: "The organization monitors for unauthorized exfiltration of classified information."}
        references: "EO 13526, Sec. 4.1, para. (d)."
        authorities: ["EO 13526"]
      - control: pe-3.3
        heading: "PE-3(3), Physical Access Control | Continuous Guards"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 30, anchor: "PE-3(3), Physical Access Control | Continuous Guards"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Employing guards or alarms at each access point helps mitigate the risk of authorized removal of classified material."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: pe-4
        heading: "PE-4, Access Control for Transmission"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 30, anchor: "PE-4, Access Control for Transmission"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Physically controlling the access to distribution and transmission lines helps mitigate the risk of unauthorized access to classified information."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: pe-19
        heading: "PE-19, Information Leakage"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 30, anchor: "PE-19, Information Leakage"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. Information leakage through electromagnetic signals must be protected against to ensure the confidentiality of the classified information."}
        references: "EO 13526, Sec. 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: pe-19.1
        heading: "PE-19(1), Information Leakage | National Emissions Policies and Procedures"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 30, anchor: "PE-19(1), Information Leakage | National Emissions Policies and Procedures"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. Information leakage through electromagnetic signals must be protected against to ensure the confidentiality of the classified information."}
        references: "EO 13526, Sec. 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: pe-22
        heading: "PE-22, Component Marking"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 30, anchor: "PE-22, Component Marking"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Marking hardware components to indicate the classification level of information permitted to be processed, stored, or transmitted by the hardware component(s) is an organizational procedure that serves to remind users that classified information of the specified level exists within the system. Users should, as a result, be more aware and ready to guard against access to hardware components by uncleared personnel passing through the facility."}
          - {kind: parameter, text: "Mark all system hardware components in facilities containing systems that process, store, or transmit classified information indicating the impact level or classification level of the information permitted to be processed, stored, or transmitted by the hardware component."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: pm-12
        heading: "PM-12, Insider Threat Program"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 31, anchor: "PM-12, Insider Threat Program"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, or other unauthorized disclosure."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13587, Sec. 2.1(b) and Sec 5.2; CNSSD No. 504."
        authorities: ["EO 13587", "CNSSD No. 504"]
      - control: ps-3.1
        heading: "PS-3(1), Personnel Screening | Classified Information"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 31, anchor: "PS-3(1), Personnel Screening | Classified Information"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that all personnel that have access to classified information must be cleared through a determination of eligibility, NDA, and have the appropriate need to know for the information."}
          - {kind: guidance, text: "The agency head or agency head's designee must make a favorable determination that the person is eligible for access for information at classification levels up to and including the level specified in the clearance."}
        references: "EO 13526, Sec. 4.1, para. (a) and (b); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: ps-4
        heading: "PS-4, Personnel Termination"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 31, anchor: "PS-4, Personnel Termination"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need to know. After an individual ceases to be employed by the organization, they no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
          - {kind: parameter, text: "Upon termination of individual employment: a. Disable system access within a time period as soon as possible but not to exceed 5 working days if termination is voluntary; if termination is involuntary, within same day as termination. c. Conduct exit interviews that include a discussion of: (i) prohibitions against the removal of classified information from the organization's control and (ii) the direction that information be declassified in order to remove it from the organization's control.12"}
        references: "EO 13526, Sec. 4.1, para. (c)."
        authorities: ["EO 13526"]
      - control: ps-4.1
        heading: "PS-4(1), Personnel Termination | Post-Employment Requirements"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 32, anchor: "PS-4(1), Personnel Termination | Post-Employment Requirements"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need to know. After an individual ceases to be employed by the organization, they no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information."}
        references: "EO 13526, Sec. 4.1, para. (c)."
        authorities: ["EO 13526"]
      - control: ps-6.2
        heading: "PS-6(2), Access Agreements | Classified Information Requiring Special Protection"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 32, anchor: "PS-6(2), Access Agreements | Classified Information Requiring Special"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that all personnel that have access to classified information must be cleared through a determination of eligibility, NDA, and have the appropriate need-to-know for the information."}
        references: "EO 13526, Sec. 4.1, para. (a)."
        authorities: ["EO 13526"]
      - control: ps-6.3
        heading: "PS-6(3), Access Agreements | Post-Employment Requirements"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 32, anchor: "PS-6(3), Access Agreements | Post-Employment Requirements"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. After an individual ceases to be employed by the organization, they may no longer have a need to access classified information and may not remove any classified information from an agency pursuant to the EO. Employees need to be reminded of these and other organizational requirements as part of the termination process to protect the confidentiality of classified information."}
        references: "EO 13526, Sec 4.1, para. (a) and (c)."
        authorities: ["EO 13526"]
      - control: ps-9
        heading: "PS-9, Position Descriptions"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 33, anchor: "PS-9, Position Descriptions"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know."}
          - {kind: guidance, text: "Organizations should ensure that individual organizational roles and position descriptions clearly document and provide understanding regarding security or privacy responsibilities associated with the roles, as well as the role-based security and privacy training requirements for the roles. This should include roles and training for roles that require appropriate clearances and need-to-know."}
        references: "EO 13526, Sec 4.1 para (a); EO 13764, Sec 1 para (a)."
        authorities: ["EO 13526", "EO 13764"]
      - control: ra-3.2
        heading: "RA-3(2), Risk Assessment | Use of All-Source Intelligence"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 33, anchor: "RA-3(2), Risk Assessment | Use of All-Source Intelligence"}
        statements:
          - {kind: justification, disposition: select, text: "Organizations need to identify protections commensurate with an information’s classification when developing agreements to share all-source intelligence information or resulting decisions with other organizations to assist in the analysis of risk."}
        references: "EO 13526, Sec. 4.1, para. (f) and (g)."
        authorities: ["EO 13526"]
      - control: ra-5
        heading: "RA-5, Vulnerability Monitoring and Scanning"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 33, anchor: "RA-5, Vulnerability Monitoring and Scanning"}
        statements:
          - {kind: justification, disposition: select, text: "Classified information may be more appealing to adversaries, who would want to take advantage of any vulnerabilities of a system that has classified information on it. Organizations with classified information on their systems should ensure vulnerability monitoring and scanning is implemented for its system components, ensuring that the potential sources of vulnerabilities—such as infrastructure components (e.g., switches, routers, firewalls, sensors), networked printers, scanners, and copiers— are not overlooked. This will allow organizations to ensure that any new vulnerabilities to systems that process, store, or transmit classified information are identified, mitigated, and reported as quickly as possible."}
        references: "EO 13526, Sec. 4.1, para. (f) and (g)."
        authorities: ["EO 13526"]
      - control: ra-6
        heading: "RA-6, Technical Surveillance Countermeasures Survey"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 33, anchor: "RA-6, Technical Surveillance Countermeasures Survey"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate clearance and need-to-know. Many information technology products are vulnerable to inadvertent, or intentional, surveillance actions and need to be countered to prevent information leakage to unauthorized personnel. This control serves to ensure the organization takes conscious actions to minimize the technical surveillance risk and protect the confidentiality of classified information."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13526, Sec 4.1, para. (a), (f), and (g)."
        authorities: ["EO 13526"]
      - control: ra-10
        heading: "RA-10, Threat Hunting"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 34, anchor: "RA-10, Threat Hunting"}
        statements:
          - {kind: justification, disposition: select, text: "NSM-8 invokes EO 14028, which, in Section 7(b) requires deployment of an Endpoint Detection and Response (EDR) initiative to support proactive detection of cybersecurity incidents within Federal Government infrastructure, active cyber hunting, containment and remediation, and incident response."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "NSM-8, Sec 1(e)."
        authorities: ["NSM-8"]
      - control: sa-3.2
        heading: "SA-3(2), System Development Life Cycle | Use of Live or Operational Data"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 34, anchor: "SA-3(2), System Development Life Cycle | Use of Live or Operational Data"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. When used in test environments, live data must be protected to preserve authorized restrictions on information access. The use of live data in a test environment does not change its classification."}
          - {kind: guidance, text: "Classified information can only be used in test and simulation environments that are at least at the same classification level as the data."}
        references: "EO 13526, Sec 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: sa-4.6
        heading: "SA-4(6), Acquisition Process | Use of Information Assurance Products"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 34, anchor: "SA-4(6), Acquisition Process | Use of Information Assurance Products"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. The use of an NSA-approved cryptographic solution (e.g., Commercial Solutions for Classified program) protects the transmission of classified information when the network transmitting the information is at a lower classification level."}
        references: "EO 13526, Sec. 4.1, para. (f) and (g); CNSSP No. 11."
        authorities: ["EO 13526", "CNSSP No. 11"]
      - control: sc-2
        heading: "SC-2, Separation of System and User Functionality"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 34, anchor: "SC-2, Separation of System and User Functionality"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Application partitioning provides a means to reduce the opportunities individuals may have to gain access to information for which they do not have a need-to-know."}
        references: "EO 13526, Sec 4.1, para. (a)."
        authorities: ["EO 13526"]
      - control: sc-3
        heading: "SC-3, Security Function Isolation"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 35, anchor: "SC-3, Security Function Isolation"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires that classified information be accessible only to those with the appropriate need-to-know. Security function isolation provides a means to reduce the opportunities cleared individuals may have to gain access to information for which they do not have a need-to-know."}
        references: "EO 13526, Sec 4.1, para. (a)."
        authorities: ["EO 13526"]
      - control: sc-7.26
        heading: "SC-7(26), Boundary Protection | Classified National Security System Connections"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 35, anchor: "SC-7(26), Boundary Protection | Classified National Security System"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to provide adequate protection of classified information while stored, processed, or when transmitted and to prevent access by unauthorized persons to classified information. Organizations may not have control over external networks; therefore, the interconnection of a system to an external network presents unique challenges for protecting classified information. An appropriate boundary protection device is needed to address these challenges. For interconnections of NSS operating at different classification levels, refer to the CDS Overlay."}
          - {kind: parameter, text: "Prohibit the direct connection of a classified national security system to an external network without the use of an appropriate boundary protection device."}
        references: "EO 13526, Sec 4.1, para. (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: sc-8
        heading: "SC-8, Transmission Confidentiality and Integrity"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 35, anchor: "SC-8, Transmission Confidentiality and Integrity"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while in transmission to ensure the integrity of the information and provide adequate protection from unauthorized access. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
          - {kind: parameter, text: "Protect the confidentiality and integrity of transmitted information."}
        references: "EO 13526, Sec 4.1, para. (a), (f) and (g); EO 13587, Sec 5.2, para. (a); NSM-8, Sec 1(b)(iii)."
        authorities: ["EO 13526", "EO 13587", "NSM-8"]
      - control: sc-8.1
        heading: "SC-8(1), Transmission Confidentiality and Integrity | Cryptographic Protection"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 35, anchor: "SC-8(1), Transmission Confidentiality and Integrity | Cryptographic"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while it is in transmission to ensure the integrity of the information and provide adequate protection from unauthorized access. Classified information in transmission must be protected via cryptography as required by CNSSP No. 15. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
          - {kind: parameter, text: "Implement cryptographic mechanisms to prevent unauthorized disclosure of classified information and detect changes to information during transmission."}
        references: "EO 13526, Sec 4.1, para. (a), (f) and (g); EO 13587, Sec 5.2, para. (a); NSM-8 Sec 1(b)(iii); CNSSP No. 15; NSM-8, Sec 1(b)(iii)."
        authorities: ["EO 13526", "EO 13587", "NSM-8", "CNSSP No. 15"]
      - control: sc-8.3
        heading: "SC-8(3), Transmission Confidentiality and Integrity | Cryptographic Protection for Message Externals"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 36, anchor: "SC-8(3), Transmission Confidentiality and Integrity | Cryptographic"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while it is in transmission to ensure the integrity of the information and provide adequate protection from unauthorized access. Classified information in transmission must be protected via cryptography as required by CNSSP No. 15. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
        references: "EO 13526, Sec 4.1, para. (a), (f) and (g); EO 13587, Sec 5.2, para. (a); CNSSP No. 15; NSM-8, Sec 1(b)(iii)."
        authorities: ["EO 13526", "EO 13587", "CNSSP No. 15", "NSM-8"]
      - control: sc-8.4
        heading: "SC-8(4), Transmission Confidentiality and Integrity | Conceal or Randomize Communications"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 36, anchor: "SC-8(4), Transmission Confidentiality and Integrity | Conceal or Randomize"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while it is in transmission to ensure the integrity of the information and provide adequate protection from unauthorized access. Classified information in transmission must be protected via cryptography as required by CNSSP No. 15."}
        references: "EO 13526, Sec 4.1, para. (a), (f) and (g); EO 13587, Sec 5.2, para. (a); CNSSP No. 15."
        authorities: ["EO 13526", "EO 13587", "CNSSP No. 15"]
      - control: sc-12
        heading: "SC-12, Cryptographic Key Establishment and Management"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 36, anchor: "SC-12, Cryptographic Key Establishment and Management"}
        statements:
          - {kind: justification, disposition: select, text: "CNSSP No. 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
          - {kind: guidance, text: "NSM-8 requires all organizations use NSA-approved, public-standards-based cryptographic protocols to ensure widespread cryptographic interoperability among NSS. If mission-unique requirements preclude the use of public standards-based cryptographic protocols, NSA-approved mission unique protocols may be used. This control has been identified as having privacy implementation considerations (see Table 1)."}
          - {kind: parameter, text: "Establish and manage cryptographic keys when cryptography is employed within the system in accordance with the following key management requirements: for classified NSS, employ NSA-approved cryptographic guidance addressing processes/requirements for key generation, distribution, storage, access, and destruction."}
        references: "NSM-8 Sec 1 (b) (iv); CNSSP No. 15."
        authorities: ["NSM-8", "CNSSP No. 15"]
      - control: sc-12.2
        heading: "SC-12(2), Cryptographic Key Establishment and Management | Symmetric Keys"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 37, anchor: "SC-12(2), Cryptographic Key Establishment and Management | Symmetric"}
        statements:
          - {kind: justification, disposition: select, text: "CNSSP No. 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
          - {kind: parameter, text: "Produce, control, and distribute symmetric cryptographic keys using NSA-approved key management technology and processes."}
        references: "NSM-8 Sec 1 (b) (iv); CNSSP No. 15."
        authorities: ["NSM-8", "CNSSP No. 15"]
      - control: sc-12.3
        heading: "SC-12(3), Cryptographic Key Establishment and Management | Asymmetric Keys"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 37, anchor: "SC-12(3), Cryptographic Key Establishment and Management | Asymmetric"}
        statements:
          - {kind: justification, disposition: select, text: "CNSSP 15 requires the use of NSA-approved cryptography to protect NSS and the information that resides in the system. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
          - {kind: guidance, text: "CNSSP No. 25 requires that NSS operating at the Secret level obtain PKI support from the NSS-PKI."}
          - {kind: parameter, text: "Produce, control, and distribute asymmetric cryptographic keys using NSA-approved key management technology and processes."}
        references: "NSM-8 Sec 1 (b) (iv); CNSSP No. 15; CNSSP No. 25."
        authorities: ["NSM-8", "CNSSP No. 15", "CNSSP No. 25"]
      - control: sc-13
        heading: "SC-13, Cryptographic Protection"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 37, anchor: "SC-13, Cryptographic Protection"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while stored, processed, or when transmitted. This applies to the use of an NSA-approved solution to protect classified information transmitted when the network transmitting the information is at a lower classification level."}
          - {kind: parameter, text: "b. Implement the following types of cryptography required for each specified cryptographic use: NSA-approved cryptography for protecting classified information from access by personnel who lack the necessary security clearance."}
        references: "EO 13526, Sec. 4.1, para. (f) and (g); CNSSP No. 15."
        authorities: ["EO 13526", "CNSSP No. 15"]
      - control: sc-15.3
        heading: "SC-15(3), Collaborative Computing Devices and Applications | Disabling and Removal in Secure Work Areas"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 38, anchor: "SC-15(3), Collaborative Computing Devices and Applications | Disabling and"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while in use and when transmitted to provide adequate protection and prevent access by unauthorized persons. Use of collaborative computing devices in unauthorized locations represents an unacceptable risk of disclosure of classified information to unauthorized persons."}
          - {kind: guidance, text: "Collaborative devices have an aspect of trust associated with their use (e.g., it is hard to verify how many people are listening through one connection). In secure work areas, it is necessary to verify that all personnel have valid authorizations to access classified information and to disable or remove collaborative devices that are at a lower classification level than the secure work area. Disabling lower classification collaborative devices is necessary to prevent unauthorized access to classified information (e.g., through eavesdropping)."}
        references: "EO 13526, Sec 4.1, para. (a) and (f)."
        authorities: ["EO 13526"]
      - control: sc-28
        heading: "SC-28, Protection of Information at Rest"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 38, anchor: "SC-28, Protection of Information at Rest"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while stored to prevent access by unauthorized persons and to ensure the integrity of the information. Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
          - {kind: guidance, text: "The organization, in accordance with law, Executive Orders, and policy, determines the protection needs for the confidentiality of the information, including who has access to the information and the appropriate means for its protection."}
          - {kind: parameter, text: "Protect the confidentiality and integrity of the following information at rest: classified information at rest."}
        references: "EO 13526, Sec 4.1, para. (f); EO 13587, Sec 5.2, para. (a); NSM-8 Sec 1 (b) (iii)."
        authorities: ["EO 13526", "EO 13587", "NSM-8"]
      - control: sc-28.1
        heading: "SC-28(1), Protection of Information at Rest | Cryptographic Protection"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 38, anchor: "SC-28(1), Protection of Information at Rest | Cryptographic Protection"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 directs the safeguarding of classified information while stored to prevent access by unauthorized persons and to ensure the integrity of the information. Cryptography provides protections for the confidentiality and integrity of information in storage. Per NSM-8, organizations are required to implement encryption for data-at-rest and data-in-transit."}
        references: "EO 13526, Sec 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a); NSM-8 Sec 1(b)(iii)."
        authorities: ["EO 13526", "EO 13587", "NSM-8"]
      - control: sc-41
        heading: "SC-41, Port and I/O Device Access"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 39, anchor: "SC-41, Port and I/O Device Access"}
        statements:
          - {kind: justification, disposition: select, text: "CNSSD No. 504 requires the implementation of trusted network connection restrictions to prevent malicious users from exploiting known vulnerabilities of hard-linking to areas outside of their authorized access, Injecting code, and covering their activities. This control supports holistic endpoint security requirements."}
        references: "EO 13526, Sec 4.1, para. (f) and (g); CNSSD No. 504."
        authorities: ["EO 13526", "CNSSD No. 504"]
      - control: sc-42
        heading: "SC-42, Sensor Capability and Data"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 39, anchor: "SC-42, Sensor Capability and Data"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Prohibiting the remote activation of devices with sensor capabilities in all areas where classified information is stored, processed, transmitted, or discussed is considered a best practice for safeguarding classified information."}
          - {kind: guidance, text: "The organization may define exceptions to allow remote activation of sensor capabilities such as secure VTC, provided that the sensor capabilities are designed, configured, and operated securely. Organizations may designate some areas acceptable for temporary storage, processing, transmission, or discussion of classified information; however, during the periods when classified information is not being stored, processed, transmitted or discussed, the organization may allow remote activation of devices with sensor capabilities in those areas. This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13526, Sec 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a)."
        authorities: ["EO 13526", "EO 13587"]
      - control: si-4.14
        heading: "SI-4(14), System Monitoring | Wireless Intrusion Detection"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 39, anchor: "SI-4(14), System Monitoring | Wireless Intrusion Detection"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13587 requires the establishment of an insider threat program for deterring, detecting, and mitigating insider threats, including the safeguarding of classified information from exploitation, compromise, and other unauthorized disclosure. Monitoring wireless networks for unauthorized use is necessary to protect classified information as it identifies unsanctioned connections and potential information leaks."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13526, Sec 4.1, para. (f) and (g); EO 13587, Sec 5.2, para. (a); CNSSP No. 17."
        authorities: ["EO 13526", "EO 13587", "CNSSP No. 17"]
      - control: si-4.19
        heading: "SI-4(19), System Monitoring | Risk for Individuals"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 40, anchor: "SI-4(19), System Monitoring | Risk for Individuals"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Monitoring people that may pose greater risk or are in a probationary period is pertinent to verifying that these people continue to be qualified to access classified information."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13526, Sec 4.1, para. (a) and (b)."
        authorities: ["EO 13526"]
      - control: si-4.21
        heading: "SI-4(21), System Monitoring | Probationary Periods"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 40, anchor: "SI-4(21), System Monitoring | Probationary Periods"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 requires organizations to establish procedures and controls to prevent access by unauthorized persons to classified information. Monitoring people that may pose greater risk or are in a probationary period is pertinent to verifying that these people continue to be qualified to access classified information."}
          - {kind: guidance, text: "This control has been identified as having privacy implementation considerations (see Table 1)."}
        references: "EO 13526, Sec 4.1, para. (a) and (b)."
        authorities: ["EO 13526"]
      - control: sr-3
        heading: "SR-3, Supply Chain Controls and Processes"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 40, anchor: "SR-3, Supply Chain Controls and Processes"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13873 requires the USG to protect against supply chain risks from foreign adversaries, reducing the probability of adversaries successfully identifying and targeting the supply chain, and limiting harm that can be done by unauthorized persons to classified information."}
        references: "EO 13873 Sec. 1.a.; EO 14032; CNSSD No. 505."
        authorities: ["EO 13873", "EO 14032", "CNSSD No. 505"]
      - control: sr-3.2
        heading: "SR-3(2), Supply Chain Controls and Processes | Limitation of Harm"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 40, anchor: "SR-3(2), Supply Chain Controls and Processes | Limitation of Harm"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13873 requires the USG to protect against supply chain risks from foreign adversaries, reducing the probability of adversaries successfully identifying and targeting the supply chain, and limiting harm that can be done by unauthorized persons to classified information."}
        references: "EO 13873 Sec. 1.a.; CNSSD No. 505."
        authorities: ["EO 13873", "CNSSD No. 505"]
      - control: sr-4
        heading: "SR-4, Provenance"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 41, anchor: "SR-4, Provenance"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13873 requires the USG to protect against supply chain risks from foreign adversaries, reducing the probability of adversaries successfully identifying and targeting the supply chain, and limiting harm that can be done by unauthorized persons to classified information."}
        references: "EO 13873 Sec. 1.a.; EO 14032; CNSSD No. 505."
        authorities: ["EO 13873", "EO 14032", "CNSSD No. 505"]
      - control: sr-7
        heading: "SR-7, Supply Chain Operations Security"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 41, anchor: "SR-7, Supply Chain Operations Security"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13873 requires continual assessment of threats to the United States from information and communications technology or services designed, developed, manufactured, or supplied by persons owned by, controlled by, or subject to the jurisdiction or direction of a foreign adversary. Operational Security (OPSEC) controls support organizational ability to conduct such assessment as part of protecting their supply chains and preventing unauthorized persons access to classified information."}
        references: "EO 13873 Sec. 5; CNSSD No. 505."
        authorities: ["EO 13873", "CNSSD No. 505"]
      - control: sr-12
        heading: "SR-12, Component Disposal"
        citation: {ref: CNSSI1253E-ATT5-CLASSIFIED, page: 41, anchor: "SR-12, Component Disposal"}
        statements:
          - {kind: justification, disposition: select, text: "EO 13526 states that all classified information must be destroyed under conditions that provide adequate protection and prevent access by unauthorized personnel. Sanitization and the verification of destruction of all types of media, physical and digital, helps to meet this requirement. Proper disposal is required to prevent unauthorized reuse."}
          - {kind: parameter, text: "Dispose of all digital and non-digital system media containing classified information using the following techniques and methods: approved methods in accordance with the classification of the information processed."}
        references: "EO 13526, Sec 4.1, para. (g); CNSSD No. 505."
        authorities: ["EO 13526", "CNSSD No. 505"]
  - overlay: CNSSI1253F-ATT6-PRIVACY
    specs:
      - control: ac-1
        heading: "AC-1, (ACCESS CONTROL) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 28, anchor: "AC-1, (ACCESS CONTROL) POLICY AND PROCEDURES – Included in the Privacy"}
        in_privacy_baseline: true
      - control: ac-2
        heading: "AC-2, ACCOUNT MANAGEMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 28, anchor: "AC-2, ACCOUNT MANAGEMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Account management is a critical function for developing and implementing an access control framework that is appropriate for the information contained in systems and applications. When implemented effectively, the access control framework provides the necessary constructs for controlling access to PII, limiting disclosure of records about individuals to only those system and application users that have a need for the information to perform their job functions. Organizations should provide access only to the minimum amount of PII necessary for users to perform their duties."}
          - {kind: guidance, text: "Use of temporary accounts is prohibited for accessing PII as these accounts have increased risk and little or no accountability."}
          - {kind: parameter, sets: [ACCT, LOW, MODERATE], text: "f. Create, enable, modify, disable, and remove accounts in accordance with the requirement for each user to complete annual privacy training, or otherwise the account would be disabled. h. Notify account managers and [Assignment: organization-defined personnel or roles] within: 1. 24 hours when accounts are no longer required; 2. 24 hours when users are terminated or transferred; and 3. 24 hours when system usage or need-to-know changes for an individual; i. Authorize access to the system based on: 1. A valid access authorization; 2. Intended system usage; and 3. Demonstrated appropriate need for access to specific PII in the performance of the user's duties and in compliance with the Privacy Act and other applicable authorities—only the minimum amount of PII necessary for users to perform their duties will be granted by the organization; j. Review accounts for compliance with account management requirements at least annually."}
          - {kind: parameter, sets: [HIGH], text: "f. Create, enable, modify, disable, and remove accounts in accordance with the requirement for each user to complete annual privacy training, or otherwise the account would be disabled. h. Notify account managers and [Assignment: organization-defined personnel or roles] within: 1. 24 hours when accounts are no longer required; 2. 24 hours when users are terminated or transferred; and 3. 24 hours when system usage or need-to-know changes for an individual; i. Authorize access to the system based on: 1. A valid access authorization; 2. Intended system usage; and 3. Demonstrated appropriate need for access to specific PII in the performance of the user's duties and in compliance with the Privacy Act and other applicable authorities—only the minimum amount of PII necessary for users to perform their duties will be granted by the organization; j. Review accounts for compliance with account management requirements at least quarterly for privileged accounts, at least annually for general user’s accounts."}
        references: "5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333, OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130", "OMB M-17-12"]
      - control: ac-2.1
        heading: "AC-2(1), Account Management | Automated System Account Management"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 29, anchor: "AC-2(1), Account Management | Automated System Account Management"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Automated mechanisms provide stronger assurance than manual approaches to protecting PII, ensuring access to PII is limited to individuals who are permitted access and have a need to know the information."}
        references: "5 U.S.C. §552a(e)(10); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-2.2
        heading: "AC-2(2), Account Management | Automated Temporary and Emergency Account Management"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 30, anchor: "AC-2(2), Account Management | Automated Temporary and Emergency Account"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Automated mechanisms protect privacy by providing stronger assurance than manual approaches that access to the PII is appropriately managed. Temporary and emergency accounts may allow access to PII that differs from on-going access requirements. Automating the process of removing or disabling temporary and emergency accounts helps ensure that access controls return to normal within a reasonable and intended timeframe."}
        references: "5 U.S.C. §552a(e)(10); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-2.3
        heading: "AC-2(3), Account Management | Disable Accounts"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 30, anchor: "AC-2(3), Account Management | Disable Accounts"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Protects privacy and implements the FIPPs of minimization and security, and supports Purpose Specification and Use Limitation, by ensuring access to the PII is limited to those individuals who are permitted and have a need to know the information."}
        references: "5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-2.4
        heading: "AC-2(4), Account Management | Automated Audit Actions"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 30, anchor: "AC-2(4), Account Management | Automated Audit Actions"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Automated mechanisms better protect privacy by providing stronger assurance than manual approaches that access to the PII is appropriately managed."}
        references: "5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-2.5
        heading: "AC-2(5), Account Management | Inactivity Logout"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 30, anchor: "AC-2(5), Account Management | Inactivity Logout"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Protects privacy by ensuring access to the PII is appropriately managed."}
        references: "5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-2.6
        heading: "AC-2(6), Account Management | Dynamic Privilege Management*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 30, anchor: "AC-2(6), Account Management | Dynamic Privilege Management*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Protects privacy by integrating granular access criteria for PII (e.g., confirming training or mission requirements are met) in real-time as the system runs."}
        references: "FISA; EO 12333"
        authorities: ["FISA", "EO 12333"]
      - control: ac-2.7
        heading: "AC-2(7), Account Management | Privileged User Accounts"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 30, anchor: "AC-2(7), Account Management | Privileged User Accounts"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Protects privacy by ensuring access to the PII is limited to those individuals who are permitted and have a need to know the information. Privileged users play a critical role in implementing access controls that protect PII. They also support program and system owners with understanding the access control options that are available in their environment."}
        references: "5 U.S.C. §552a (e)(9)-(10); FISA; EO 12333"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333"]
      - control: ac-2.8
        heading: "AC-2(8), Account Management | Dynamic Account Management"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 31, anchor: "AC-2(8), Account Management | Dynamic Account Management"}
        statements:
          - {kind: justification, disposition: not-select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Systems that process PII must not select this control without first coordinating with the SAOP or designee. Access to PII may not be granted to entities who are previously unknown, but rather only to officers and employees who have a need for the information in performance of their duties. Dynamic account creation is an automated process that may not support independent verification of a need for access to PII."}
        references: "5 U.S.C. §552a(b)(1); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-2.9
        heading: "AC-2(9), Account Management | Restrictions on Use of Shared and Group Accounts"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 31, anchor: "AC-2(9), Account Management | Restrictions on Use of Shared and Group Accounts"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Shared and group accounts are permitted for systems that process PII only with explicit approval by the SAOP, or designee."}
          - {kind: parameter, text: "Only permit the use of shared and group accounts that meet explicit approval by the SAOP or designee."}
        references: "5 U.S.C. §552a(b)(1), (e)(10), FISA; EO 12333, OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-2.12
        heading: "AC-2(12), Account Management | Account Monitoring for Atypical Usage"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 31, anchor: "AC-2(12), Account Management | Account Monitoring for Atypical Usage"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Atypical use of systems with PII may be an indicator of a privacy incident or breach."}
          - {kind: guidance, text: "Atypical use that involves PII should be reported to the SAOP, or designee, for further evaluation."}
        references: "5 USC 552a(e)(10), OMB M-17-12, OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB M-17-12", "OMB Circular A-130"]
      - control: ac-2.13
        heading: "AC-2(13), Account Management | Disable Accounts for High-Risk Individuals"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 31, anchor: "AC-2(13), Account Management | Disable Accounts for High-Risk Individuals"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Disabling accounts for high-risk individuals is a minimum requirement to be included in the organization’s rules of behavior as a consequence for abusing access privileges to access PII, including information protected under the Privacy Act of 1974."}
        references: "5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333"]
      - control: ac-3
        heading: "AC-3, ACCESS ENFORCEMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 32, anchor: "AC-3, ACCESS ENFORCEMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Organizations shall control access to PII through access enforcement mechanisms. Well-designed, automated access controls (e.g., mandatory access control (MAC), discretionary access control (DAC), role-based access control (RBAC), or attribute-based access control (ABAC)) limit user access to information according to defined access policies, which helps ensure the security and confidentiality of the PII processed by the system."}
          - {kind: guidance, text: "For example, implement role-based access controls and configure access controls so that each user can access only the pieces of information necessary for the user’s role or only permit users to access PII through an application that restricts their access to the PII the users require, instead of allowing users direct access to a database or files containing PII."}
        references: "5 U.S.C. §552a(b), (e)(9)-(10); EO 14028 Sec 3(a), Sec 4(a-b), e(i)(C), (g)"
        authorities: ["5 U.S.C. 552a", "EO 14028"]
      - control: ac-3.9
        heading: "AC-3(9) Access Enforcement | Controlled Release"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 32, anchor: "AC-3(9) Access Enforcement | Controlled Release"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "PII released outside a system boundary may be at increased risk of unauthorized access and use. Release includes both formal, documented processes and informal activities, such as providing a spreadsheet to an external entity that was created using data extracted from a system."}
          - {kind: parameter, sets: [MODERATE, HIGH], text: "Release information outside of the system only if: (a) The receiving organization or system provides privacy and security controls commensurate with the privacy risk level of the PII being received; and (b) Controls PT-3 and AC-21 are used to validate the appropriateness of the information designated for release."}
        references: "5 U.S.C. §552a(a)(7), (b), (c), (e)(3)(c), (e)(10)(o); FISA; EO 12333; Privacy and Civil Liberties Implementation Guide for the Information Sharing Environment, Version 1.0, www.ise.gov"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333"]
        guidance_references: ["Privacy and Civil Liberties Implementation Guide for the ISE"]
      - control: ac-3.10
        heading: "AC-3(10), Access Enforcement | Audited Override of Access Control Mechanisms*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 32, anchor: "AC-3(10), Access Enforcement | Audited Override of Access Control Mechanisms*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Overrides of Access Control Mechanisms create a situation where users are permitted access to systems during emergency situations who under normal circumstances would not have system access or privileges. This open access creates the potential for the individual to have access to PII. Auditing access control overrides provides a way of identifying and addressing privacy issues that may occur as a result of the override."}
        references: "5 U.S.C. §552a(b), (e)(9)-(10); NIST SP 800-122"
        authorities: ["5 U.S.C. 552a"]
        guidance_references: ["NIST SP 800-122"]
      - control: ac-3.11
        heading: "AC-3(11), Access Enforcement | Restrict Access to Specific Information Types*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 33, anchor: "AC-3(11), Access Enforcement | Restrict Access to Specific Information Types*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Protects privacy by providing granular access to specific, limited information."}
        references: "5 U.S.C. §552a(b) and (e)(9)-(10); NIST SP 800-162"
        authorities: ["5 U.S.C. 552a"]
        guidance_references: ["NIST SP 800-162"]
      - control: ac-3.13
        heading: "AC-3(13), Access Enforcement | Attribute-Based Access Control*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 33, anchor: "AC-3(13), Access Enforcement | Attribute-Based Access Control*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Provides increased controls to further enforce access requirements for PII to ensure access is limited to those individuals who are permitted and have a need to know the information."}
        references: "FISA, EO 12333"
        authorities: ["FISA", "EO 12333"]
      - control: ac-3.14
        heading: "AC-3(14), Access Enforcement | Individual Access"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 33, anchor: "AC-3(14), Access Enforcement | Individual Access"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "The Individual Participation Fair Information Practice Principle (FIPP) requires organizations to provide mechanisms for individuals to gain access to their PII when appropriate. The Privacy Act of 1974, as amended, requires organizations to provide mechanisms for individuals to gain access to their PII when that PII meets the definition of a “record.” Some systems may be exempted from this requirement when statutory requirements are met. Access is also an important aspect of supporting correction of PII and redress against alleged violations and misuse of their PII."}
          - {kind: guidance, text: "Provide for public access to records, including PII not included in a Privacy Act System of Records, where required or appropriate. While the language of this control is specific to the Privacy Act's requirements for access, FIPPs encourage organizations to use available authorities to provide access when the Privacy Act does not apply. For example, some organizations use the Freedom of Information Act as another tool to provide access to PII for an affected individual. Also select for Privacy Act System of Records that do not have exemptions."}
        references: "5 U.S.C. §552a(c)(3), (c)(4), (d), and (h); FISA; EO 12333; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB Circular A-130"]
      - control: ac-4
        heading: "AC-4, INFORMATION FLOW ENFORCEMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 33, anchor: "AC-4, INFORMATION FLOW ENFORCEMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "The information flow enforcement controls provide a technical means of implementing disclosure requirements by minimizing information shared between networks, devices, and individuals within systems and between interconnected systems. This control can also limit information transfers between organizations based on data structures and content."}
        references: "5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB M-06-19", "OMB M-17-12"]
      - control: ac-4.1
        heading: "AC-4(1), Information Flow Enforcement | Object Security and Privacy Attributes*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 34, anchor: "AC-4(1), Information Flow Enforcement | Object Security and Privacy Attributes*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Enhances privacy protection by requiring PII to be tagged for identification and protects information in transit with flow enforcement preventing the PII from being moved to a system not authorized to host PII. For example, a record containing PII may be flagged with an attribute that indicates sharing the PII is not permitted. A system can then be configured to take actions such as excluding the record when sharing a group of records from the system."}
        references: "5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB M-06-19", "OMB M-17-12"]
      - control: ac-4.2
        heading: "AC-4(2), Information Flow Enforcement | Processing Domains*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 34, anchor: "AC-4(2), Information Flow Enforcement | Processing Domains*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Processing domains can support privacy risk management by providing a location that uses more restrictive privacy controls beyond those that may be required for other processing environments. This can help organizations meet their objectives while more efficiently using their resources (e.g., controls may be less expensive to employ in a smaller, restricted domain than across the entire network)."}
        references: "5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB M-06-19", "OMB M-17-12"]
      - control: ac-4.8
        heading: "AC-4(8), Information Flow Enforcement | Security and Privacy Policy Filters*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 34, anchor: "AC-4(8), Information Flow Enforcement | Security and Privacy Policy Filters*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Security and privacy policy filtering technology, such as data loss prevention (DLP), can provide a form of continuous monitoring for compliance with privacy laws and regulations. Implementation of this control reduces the potential for unauthorized transfer of PII."}
          - {kind: parameter, text: "(a) Enforce information flow control using best available security and/or privacy policy filters, or like technology to filter on selected PII values as a basis for flow control decisions for prevention of unauthorized transfer of PII across system boundaries or domains;"}
        references: "5 U.S.C. §552a(b); OMB M-06-19; OMB M-17-12; NIST SP 800-37"
        authorities: ["5 U.S.C. 552a", "OMB M-06-19", "OMB M-17-12"]
        guidance_references: ["NIST SP 800-37"]
      - control: ac-4.15
        heading: "AC-4(15), Information Flow Enforcement | Detection of Unsanctioned Information*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 34, anchor: "AC-4(15), Information Flow Enforcement | Detection of Unsanctioned Information*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "To provide the ability for an organization to monitor and prevent transfer of PII across different security domains, a system needs to have mechanisms to automatically detect, and where appropriate, prohibit the unauthorized transfer of PII across different security domains. Typical implementations of such controls will detect particular data types or metadata tagging and take action to prevent the transfer of the information beyond the ended boundaries."}
          - {kind: guidance, text: "The organization provides the capability for the organization to centrally monitor for and detect unauthorized transfer of such PII across different security domains. Some technologies that would facilitate this include data-loss prevention, data-rights management, and key-word detection to prevent the unauthorized export of information from a network or to render such information unusable in the event of the unauthorized export of such information between security domains."}
        references: "5 U.S.C. §552a(c), (e)(10), FISA, EO 12333"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333"]
      - control: ac-4.17
        heading: "AC-4(17), Information Flow Enforcement | Domain Authentication*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 35, anchor: "AC-4(17), Information Flow Enforcement | Domain Authentication*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "The ability to identify source and destination points for PII flow within systems is necessary for attribution and compliance with need to know requirements."}
          - {kind: guidance, text: "Implement a higher level of granularity for identification and authentication based on sensitivity of the PII. This is not to determine permissibility of the transfer but to enable an audit capability."}
          - {kind: parameter, text: "Uniquely identify and authenticate source and destination points by the applicable organization, system, application, or individual for information transfer."}
        references: "5 U.S.C. §552a(c) and (e)(10); FISA, 12333; NIST SP 800-46"
        authorities: ["5 U.S.C. 552a", "FISA"]
        guidance_references: ["NIST SP 800-46"]
      - control: ac-5
        heading: "AC-5, SEPARATION OF DUTIES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 35, anchor: "AC-5, SEPARATION OF DUTIES"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Separation of duties aligns privileges with appropriate roles with the idea that duties are split between roles in such a way as to reduce the risk of malevolent or inappropriate behaviors based on access. Implementing this control helps reduce the risk of inappropriate access to PII (e.g., separating employees that perform security investigations from mission and business functions)."}
          - {kind: guidance, text: "Separation of duties is implemented by designating a selected set of administrators the capability to set user permissions to PII information, while those administrators do not themselves have access to the PII. The principle of separation of duties is significant for developers as well as for operational system administrators."}
        references: "5 U.S.C. §552a(e)(9)-(e)(10)"
        authorities: ["5 U.S.C. 552a"]
      - control: ac-6
        heading: "AC-6, LEAST PRIVILEGE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 35, anchor: "AC-6, LEAST PRIVILEGE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Limit access to PII to designated individuals with a need-to-know in performance of their job duties."}
          - {kind: guidance, text: "Enforce the most restrictive set of rights/privileges or access needed by users (or processes acting on behalf of users) for the performance of specified tasks — increasing the level of restriction as privacy risk level rises. The organization ensures that users who must access records containing PII only have access to the minimum amount of PII, along with only those privileges (e.g., read, write, execute) necessary to perform their assigned tasks."}
        references: "5 U.S.C. §552a(b); NIST SP 800-122; CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "CNSSD No. 504"]
        guidance_references: ["NIST SP 800-122"]
      - control: ac-6.1
        heading: "AC-6(1), Least Privilege | Authorize Access to Security Functions"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 36, anchor: "AC-6(1), Least Privilege | Authorize Access to Security Functions"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Limit access to security functions to authorized personnel to reduce the number of users able to perform certain security functions, such as configuring access permissions, setting audit logs, performing system management functions. Examples of authorized personnel include security administrators, system and network administrators, system security officers, system maintenance personnel, system programmers, and other privileged users. These types of security functions can provide a level of access to PII, and capabilities to manipulate it, in ways that other user roles typically could not."}
          - {kind: guidance, text: "Identify the security relevant functions that require authorized access for all systems that contain Moderate or High PII."}
        references: "5 U.S.C. §552a(b)(1); NIST SP 800-205; CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "CNSSD No. 504"]
        guidance_references: ["NIST SP 800-205"]
      - control: ac-6.2
        heading: "AC-6(2), Least Privilege | Non-Privileged Access for Non-Security Functions"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 36, anchor: "AC-6(2), Least Privilege | Non-Privileged Access for Non-Security Functions"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "System users with elevated privileges use non-privileged accounts when performing non-security functions. Requiring system users to use their non-privileged accounts when working with PII for purposes other than security functions limits inadvertent access to or disclosure of PII and protects the integrity of PII."}
          - {kind: guidance, text: "Any access involving PII that is non-administrative in nature should require the user to use their non-privileged accounts to perform that function."}
        references: "5 U.S.C. §552a(b); EO 14028 Sec 4(i); CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "EO 14028", "CNSSD No. 504"]
      - control: ac-6.3
        heading: "AC-6(3), Least Privilege | Network Access to Privileged Commands*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 36, anchor: "AC-6(3), Least Privilege | Network Access to Privileged Commands*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Limiting access and documenting the justification for this operational need provides an added layer of privacy protection by further reducing and clarifying the individuals who have access to the PII. By restricting access to specific commands, it limits inadvertent access to or disclosure of PII and protects the integrity of PII."}
        references: "5 U.S.C. §552a(b); EO 14028 Sec 4(i); CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "EO 14028", "CNSSD No. 504"]
      - control: ac-6.5
        heading: "AC-6(5), Least Privilege | Privileged Accounts"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 37, anchor: "AC-6(5), Least Privilege | Privileged Accounts"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "This control limits who is authorized to have administrative accounts, such as those who can perform security functions to include configuring access permissions, setting audit log collection events and performing system management functions. These types of system and network management personnel typically have a level of access that is capable of circumventing other access controls. Limiting access to these accounts further protects PII by limiting the number of individuals that have the “keys to the kingdom” on a network or system."}
        references: "5 U.S.C. §552a(b)(1); FISA; EO 12333; EO 14028 Sec 4(i)(k); CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "EO 14028", "CNSSD No. 504"]
      - control: ac-6.7
        heading: "AC-6(7), Least Privilege | Review of User Privileges"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 37, anchor: "AC-6(7), Least Privilege | Review of User Privileges"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Review of user privileges is necessary in order to ensure privileges are revoked for those who no longer require access to PII. Implementation of this control reduces the risk of unauthorized access to PII by users who no longer need access to perform their job functions."}
          - {kind: parameter, sets: [ACCT, LOW, MODERATE], text: "(a) Review at least annually the privileges assigned to individuals with access to low or moderate PII or ACCT PII to validate the need for such privileges;"}
          - {kind: parameter, sets: [HIGH], text: "(a) Review at least quarterly the privileges assigned to individuals with access to privileged accounts and at least annually the privileges assigned to individuals with access to high PII to validate the need for such privileges;"}
        references: "5 U.S.C. §552a(b),(e)(9)-(10); FISA; EO12333; OMB M-17-12; CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB M-17-12", "CNSSD No. 504"]
      - control: ac-6.8
        heading: "AC-6(8), Least Privilege | Privilege Levels for Code Execution"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 37, anchor: "AC-6(8), Least Privilege | Privilege Levels for Code Execution"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Ensure system software does not allow users to obtain elevated privileges (and potentially access to PII beyond what the individual requires in performance of their job duties)."}
          - {kind: guidance, text: "Enforce the most restrictive set of rights/privileges or access needed by users (or processes acting on behalf of users) for the performance of specified tasks — increasing the level of restriction as privacy risk level rises. Users who must access records containing PII should only have access to the minimum amount of PII and privileges (e.g., read, write, execute) necessary to perform their assigned tasks."}
        references: "5 U.S.C. §552a(b); OMB Circular A-130; CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130", "CNSSD No. 504"]
      - control: ac-6.9
        heading: "AC-6(9), Least Privilege | Log Use of Privileged Functions"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 38, anchor: "AC-6(9), Least Privilege | Log Use of Privileged Functions"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Privileged functions have elevated permissions to access, and grant access, to PII. Accountability requires the ability to detect, trace, and audit a privileged function whenever it is executed."}
        references: "5 U.S.C. §552a(b); FISA; EO 12333; EO 14028 Sec 4(e)(i)(B); OMB Circular A-130; CNSSD No. 504"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "EO 14028", "OMB Circular A-130", "CNSSD No. 504"]
      - control: ac-6.10
        heading: "AC-6(10), Least Privilege | Prohibit Non-Privileged Users from Executing Privileged Functions"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 38, anchor: "AC-6(10), Least Privilege | Prohibit Non-Privileged Users from Executing Privileged"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Non-privileged users may not have the same level of trust as privileged users. Privileged functions have access beyond that of the typical user, and as such may have greater ability to access PII. Individual accountability requires the ability to trace (audit) the actions of the user who initiated them."}
        references: "OMB Circular A-130; CNSSD No. 504"
        authorities: ["OMB Circular A-130", "CNSSD No. 504"]
      - control: ac-8
        heading: "AC-8, SYSTEM USE NOTIFICATION – Included in Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 38, anchor: "AC-8, SYSTEM USE NOTIFICATION – Included in Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ac-11
        heading: "AC-11, DEVICE LOCK"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 38, anchor: "AC-11, DEVICE LOCK"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Protect PII from unauthorized access when system users are away from their workstation. Session lock for remote and mobile devices is neither technically nor financially burdensome. Based on risk, many agencies have adopted 15-minute session locks by policy as a best practice. Period of inactivity shall be no more than 30 minutes before session lock occurs for remote and mobile devices and requires user re-authentication."}
          - {kind: parameter, text: "a. Prevent further access to the system by initiating a device lock after a period not to exceed 30 minutes of inactivity, requiring the user to initiate a device lock before leaving the system unattended;"}
        references: "5 U.S.C. §552a(e)(10); OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB M-17-12"]
      - control: ac-16
        heading: "AC-16, SECURITY AND PRIVACY ATTRIBUTES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 38, anchor: "AC-16, SECURITY AND PRIVACY ATTRIBUTES"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Implementation of this control provides a technical means to enforce security and privacy policies, e.g., access controls and encryption. Meta-data that supports privacy attributes is required to properly determine whether access to PII should be granted."}
          - {kind: guidance, text: "Use privacy attributes including, as a minimum, completion of privacy training and clear identification of data structures containing (or planned to contain) PII to enable cross system functionality and reciprocity through consistent privacy attribute interpretation. This control supports privacy protections by assigning privacy attributes that characterize information, devices, or processes (i.e., an “object”) as containing PII or associate an organization’s mandatory security/privacy training requirement with a user of a system containing PII (i.e., a “subject”). Security and privacy attributes are meta-data about either a subject or an object. Other attributes may exist for other requirements beyond privacy. If an organization creates privacy attributes they should be cognizant of the risk associated with including PII in that meta-data."}
          - {kind: parameter, text: "a. Provide the means to associate a privacy attribute to demonstrate the user (subject) has completed privacy training in the last year with a privacy attribute of “Contains PII” having a value of “yes” or “no” for data structures that are known or plan to contain PII for information in storage, in process, and/or in transmission;"}
        references: "5 U.S.C. §552a(b), (e)(9)-(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: ac-16.3
        heading: "AC-16(3), Security and Privacy Attributes | Maintenance of Attribute Associations by System"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 39, anchor: "AC-16(3), Security and Privacy Attributes | Maintenance of Attribute Associations by"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Maintaining the association and integrity of security attributes to subjects and objects can be used as the basis of automated policy actions, such as intrusion detection and keyword detection tools."}
          - {kind: parameter, text: "Maintain the association and integrity of the user attribute of “Annual PII Training” for individuals with access to PII to the information attribute of “Contains PII” to applicable information."}
        references: "5 U.S.C. §552a(b) and (e)(9)-(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: ac-17
        heading: "AC-17, REMOTE ACCESS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 39, anchor: "AC-17, REMOTE ACCESS"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Limiting access to PII from remote networks and/or restricting activities that can be conducted with PII remotely reduces the risk of intentional and unintentional disclosures of PII that may not exist on an internal network."}
          - {kind: guidance, text: "Allow remote access to PII only with two-factor authentication where one of the factors is provided by a device separate from the computer gaining access."}
        references: "5 U.S.C. §552a(e)(10); OMB M-17-12; NIST SP 800-46"
        authorities: ["5 U.S.C. 552a", "OMB M-17-12"]
        guidance_references: ["NIST SP 800-46"]
      - control: ac-17.1
        heading: "AC-17(1), Remote Access | Monitoring and Control"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 40, anchor: "AC-17(1), Remote Access | Monitoring and Control"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Auditing remote access ensures unauthorized connections to systems containing PII can be detected across all system platforms (e.g., servers, mobile devices, workstations)."}
          - {kind: guidance, text: "Audit all remote access to, and actions on, resources containing PII."}
        references: "5 U.S.C. §552a(e)(10); OMB M-17-12; NIST SP 800-46"
        authorities: ["5 U.S.C. 552a", "OMB M-17-12"]
        guidance_references: ["NIST SP 800-46"]
      - control: ac-17.2
        heading: "AC-17(2), Remote Access | Protection of Confidentiality and Integrity Using Encryption"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 40, anchor: "AC-17(2), Remote Access | Protection of Confidentiality and Integrity Using Encryption"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Encrypting remote sessions protects the confidentiality and integrity of PII."}
        references: "5 U.S.C. §552a(e)(10); OMB M-17-12; NIST SP 800-46"
        authorities: ["5 U.S.C. 552a", "OMB M-17-12"]
        guidance_references: ["NIST SP 800-46"]
      - control: ac-18.1
        heading: "AC-18(1), Wireless Access | Authentication and Encryption"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 40, anchor: "AC-18(1), Wireless Access | Authentication and Encryption"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Authentication is necessary to know who accesses the PII. Communications over wireless networks, unless properly secured, have greater risk of interception than hard-wired networks. Implementing encryption of wireless network communications containing PII renders any intercepted data unreadable."}
          - {kind: guidance, text: "If wireless networks permit access to organization systems containing PII, then encryption of content and authentication of users or devices is required. Organizations should ensure that all wireless local area network (WLAN) components use Federal Information Processing Standards (FIPS)-validated cryptographic algorithms to protect the confidentiality and integrity of WLAN communications and NSA-approved cryptographic algorithms to protect the confidentiality and integrity of classified WLAN communications."}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130; NIST SP 800-97, NIST SP 800-153"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
        guidance_references: ["NIST SP 800-97", "NIST SP 800-153"]
      - control: ac-19
        heading: "AC-19, ACCESS CONTROL FOR MOBILE DEVICES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 40, anchor: "AC-19, ACCESS CONTROL FOR MOBILE DEVICES"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Limiting access to PII from mobile devices reduces the risk of intentional and unintentional disclosures of PII that may not exist on an internal network."}
          - {kind: guidance, text: "Encrypt information on all mobile devices that contains low, moderate, and high PII."}
        references: "OMB Circular A-130; OMB M-17-12"
        authorities: ["OMB Circular A-130", "OMB M-17-12"]
      - control: ac-19.5
        heading: "AC-19(5), Access Control for Mobile Devices | Full Device or Container-Based Encryption"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 41, anchor: "AC-19(5), Access Control for Mobile Devices | Full Device or Container-Based Encryption"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Mobile devices are more likely to be lost or stolen and as a result PII is more vulnerable. Encryption reduces this vulnerability."}
          - {kind: guidance, text: "Encrypt information on all mobile devices that contains low, moderate, and high PII."}
          - {kind: parameter, text: "Employ full-device encryption or container encryption to protect the confidentiality and integrity of information on any type of mobile device permitted by the organization to access PII."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: ac-20
        heading: "AC-20, USE OF EXTERNAL SYSTEMS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 41, anchor: "AC-20, USE OF EXTERNAL SYSTEMS"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Access to PII from external systems (including, but not limited to, personally owned systems/devices) increases risk of loss of the data. Reinforce by a binding agreement to terms and conditions of the organization’s privacy requirements to ensure awareness and accountability of both parties. Privacy requirements shall be addressed in agreements that cover relationships in which external systems are used to access, process, store, or transmit and manage PII. Access to PII from external systems (including, but not limited to, personally owned systems/devices) is limited to those organizations and individuals with a binding agreement to terms and conditions of privacy requirements which protect the PII."}
          - {kind: guidance, text: "Such agreements may include memoranda of understanding (MOUs), terms of service, or contracts."}
        references: "5 U.S.C. §552a(e)(10); FAR Part 24, 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: ac-20.1
        heading: "AC-20(1), Use of External Systems | Limits on Authorized Use"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 41, anchor: "AC-20(1), Use of External Systems | Limits on Authorized Use"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Access to PII from external systems increases risk of loss of the data. An external system which processes, stores, or transmits PII needs to have its security and privacy controls verified to meet the organization's security control requirements for systems processing PII."}
        references: "5 U.S.C. §552a(e)(10); FAR Part 24, 39.105; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "OMB Circular A-130"]
      - control: ac-20.3
        heading: "AC-20(3), Use of External Systems | Non-Organizationally Owned Systems — Restricted Use"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 42, anchor: "AC-20(3), Use of External Systems | Non-Organizationally Owned Systems — Restricted"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "This control is needed to implement protections for PII contained on any device not owned by the organization, including personal mobile devices, commonly referred to as “bring your own device” (BYOD). Mobile devices are more vulnerable to loss or theft than other types of computing media (e.g., desktops and servers) due to their portability and widespread use inside and outside of government facilities. PII stored on mobile devices is more vulnerable as a result. At a minimum, controls must include implementation of either full-device or virtual container encryption to reduce the vulnerability of PII contained on mobile devices. Prior to being provided access to PII on remote devices, device users must acknowledge through a binding agreement their responsibilities to safeguard the PII accessible from the device and that they are aware of and agree to the organization’s capabilities to manage the organization’s PII on the device, including confiscation, in consultation with the organization’s counsel, if necessary to remove the PII."}
          - {kind: guidance, text: "The organization should include in its mobile strategy a method to ensure both the device’s access to PII can be revoked and the device’s PII contents can be remotely removed."}
          - {kind: parameter, text: "Restrict the use of non-organizationally owned systems or system components to process organizational information using PII."}
        references: "5 U.S.C. §552a(e)(10); OMB M-17-12; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB M-17-12", "OMB Circular A-130"]
      - control: ac-21
        heading: "AC-21, INFORMATION SHARING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 42, anchor: "AC-21, INFORMATION SHARING"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "PII protected by the Privacy Act may not be disclosed without first providing notice to the individuals about whom the information will be disclosed and for what purpose. When PII is shared it is necessary to ensure the PII is being shared in accordance with statutory and regulatory requirements, including any restrictions on how the PII may be shared and the receiving partner’s security requirements. Sharing PII with third parties introduces new risks to the individual which, as applicable, requires organizations to establish formal agreements with the third party and ensure the sharing is compatible with the purposes described in notice to, and consent from, the individual. Consideration of privacy risks for sharing PII apply regardless of the method used or whether the information remains stored in the system of records. For example, data removed from a system covered by a System of Records Notice (SORN) (e.g., an HR database) and shared in another format (e.g., an Excel spreadsheet) must still meet purpose and use requirements of the associated notice. PII not in a system of records that is shared with a third party still must meet the Purpose Specification and, relatedly, Use Limitation FIPPs. In particular, organizations should provide notice of the specific purpose for which PII is collected and should only process PII for a purpose that is explained in the notice and is compatible with the purpose for which the PII was collected, or that is otherwise legally authorized."}
          - {kind: guidance, text: "This control addresses the sharing of information in a general sense (i.e., disclosure). It is not “information sharing” as defined by the Information Sharing Environment (ISE) Privacy Guidelines. All sharing partners, processes, and systems must comply with applicable SORN, Privacy Impact Assessment (PIA), or other forms of notice or public statements. Consistent with the Purpose Specification and Use Limitation FIPPs, sharing of PII must be compatible with the purpose for which it was collected. Consistent with the Transparency FIPP, any subsequent sharing that is not compatible or pursuant to a statutory exemption may not be done until additional notice is provided to the individual, their consent is obtained, and relevant documents are updated or published, e.g., when applicable and appropriate publish an updated SORN to cover the additional incompatible sharing and obtain consent from the affected individuals."}
        references: "5 U.S.C. §552a(b) and (e)(10)"
        authorities: ["5 U.S.C. 552a"]
      - control: ac-22
        heading: "AC-22, PUBLICLY ACCESSIBLE CONTENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 43, anchor: "AC-22, PUBLICLY ACCESSIBLE CONTENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "PII may only be disclosed through appropriate channels. PII that is maintained in a system of records or not approved for release under the Freedom of Information Act (FOIA) is nonpublic information. When agencies consider sharing or posting PII, they must do so in a way that fully protects individual privacy. This control implements procedures to protect information, including PII, from being improperly posted publicly."}
          - {kind: guidance, text: "PII that is nonpublic information shall not be posted onto a publicly accessible system."}
        references: "5 U.S.C. §552a(b)(6), (c)-(d), FISA; EO 12333; OMB M-11-02"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "OMB M-11-02"]
      - control: ac-23
        heading: "AC-23, DATA MINING PROTECTION*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 43, anchor: "AC-23, DATA MINING PROTECTION*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Data mining increases privacy risk because the correlations or patterns discovered through the analytical process may result in unanticipated revelations or reveal information that has greater potential for harm to the individual than the data that initially went into the analytics. Data mining programs should be thoughtfully implemented with limited access to the PII and data mining results to ensure the analytics remain within the FIPPS of purpose specification and use limitation, as well as transparency."}
        references: "5 U.S.C. §552a(e), NIST IR 8062"
        authorities: ["5 U.S.C. 552a"]
      - control: at-1
        heading: "AT-1, AWARENESS AND TRAINING | POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 43, anchor: "AT-1, AWARENESS AND TRAINING | POLICY AND PROCEDURES – Included in the"}
        in_privacy_baseline: true
      - control: at-2
        heading: "AT-2, LITERACY TRAINING AND AWARENESS – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 44, anchor: "AT-2, LITERACY TRAINING AND AWARENESS – Included in the Privacy Control"}
        in_privacy_baseline: true
      - control: at-2.1
        heading: "AT-2(1), Literacy Training and Awareness | Practical Exercises*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 44, anchor: "AT-2(1), Literacy Training and Awareness | Practical Exercises*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Practical exercises are a great way to gauge the organization’s understanding of PII and privacy requirements."}
        references: "5 U.S.C. §552a(e)(9), (10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: at-2.2
        heading: "AT-2(2), Literacy Training and Awareness | Insider Threat"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 44, anchor: "AT-2(2), Literacy Training and Awareness | Insider Threat"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Training the workforce to recognize indicators of insider threat reduces the likelihood of loss of data, including PII. Insider threat programs often are implemented at the organizational level for all systems processing PII. Insider threat programs can be implemented as system-specific if the system processes highly sensitive PII."}
        references: "5 U.S.C. §552a(e)(5), (9), (10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; FISA Sections 101(h); 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503; OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "FISA", "EO 12333", "ICD 107", "ICD 121", "ICD 503", "OMB Circular A-130", "OMB M-17-12"]
      - control: at-2.3
        heading: "AT-2(3), Literacy Training and Awareness | Social Engineering and Mining"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 44, anchor: "AT-2(3), Literacy Training and Awareness | Social Engineering and Mining"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Training the workforce, including through practical exercises, to recognize attempts at social engineering and social mining helps to protect the organization’s data, including PII. Providing examples of actual instances of social engineering and social mining are especially effective training materials."}
        references: "5 U.S.C. §552a(e)(9), (10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: at-2.4
        heading: "AT-2(4), Literacy Training and Awareness | Suspicious Communications and Anomalous System Behavior"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 44, anchor: "AT-2(4), Literacy Training and Awareness | Suspicious Communications and Anomalous"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Training the workforce to recognize suspicious communications and anomalous behavior in organizational systems reduces the likelihood of loss of data, including PII. Insider threat programs often are implemented at the organizational level for all systems processing PII. Insider threat programs can be implemented as system-specific if the system processes highly sensitive PII."}
        references: "5 U.S.C. §552a(e)(9), (10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: at-2.5
        heading: "AT-2(5), Literacy Training and Awareness | Advanced Persistent Threat"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 44, anchor: "AT-2(5), Literacy Training and Awareness | Advanced Persistent Threat"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Training the workforce to recognize advanced persistent threats reduces the likelihood of loss of data, including PII. Insider threat programs often are implemented at the organizational level for all systems processing PII. Insider threat programs can be implemented as system-specific if the system processes highly sensitive PII."}
        references: "5 U.S.C. §552a(e)(9), (10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: at-3
        heading: "AT-3, ROLE-BASED SECURITY TRAINING – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AT-3, ROLE-BASED SECURITY TRAINING – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: at-3.5
        heading: "AT-3(5), Role-Based Training | Processing Personally Identifiable Information – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AT-3(5), Role-Based Training | Processing Personally Identifiable Information – Included"}
        in_privacy_baseline: true
      - control: at-4
        heading: "AT-4, Training Records – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AT-4, Training Records – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: at-6
        heading: "AT-6, Training Feedback – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AT-6, Training Feedback – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: au-1
        heading: "AU-1, AUDIT AND ACCOUNTABILITY | POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AU-1, AUDIT AND ACCOUNTABILITY | POLICY AND PROCEDURES – Included in"}
        in_privacy_baseline: true
      - control: au-2
        heading: "AU-2, AUDIT LOGGING – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AU-2, AUDIT LOGGING – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: au-3
        heading: "AU-3, CONTENT OF AUDIT RECORDS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AU-3, CONTENT OF AUDIT RECORDS"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Audit records must contain detailed information to serve various purposes, including to identify whether PII was misused or abused, to enforce criminal or civil penalties under the Privacy Act, and to meet reporting requirements for potential PII incidents and breaches."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "EO 12333", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-3.1
        heading: "AU-3(1), Content of Audit Records | Additional Audit Information"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AU-3(1), Content of Audit Records | Additional Audit Information"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Systems with increased privacy risk require more detailed information in audit records to ensure appropriate levels of accountability for accessing and processing of PII and, in cases of PII incidents or breaches, to identify countermeasures to mitigate potential privacy harms."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "EO 12333", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-3.3
        heading: "AU-3(3), Content of Audit Records | Limit Personally Identifiable Information Elements – In the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 45, anchor: "AU-3(3), Content of Audit Records | Limit Personally Identifiable Information Elements –"}
        in_privacy_baseline: true
      - control: au-4
        heading: "AU-4, AUDIT STORAGE CAPACITY"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 46, anchor: "AU-4, AUDIT STORAGE CAPACITY"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Adequate storage capacity for audit logs reduces the likelihood of the logs exceeding available storage space and potentially losing log information or reducing auditing capability. Audit information could be necessary, for example, to identify whether PII was misused or abused, to enforce criminal or civil penalties under the Privacy Act, to meet reporting requirements for potential PII incidents and breaches, etc. Providing adequate storage capacity allows for preserving complete audit information for these purposes."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "EO 12333", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-4.1
        heading: "AU-4(1), Audit Log Storage Capacity | Transfer to Alternate Storage"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 46, anchor: "AU-4(1), Audit Log Storage Capacity | Transfer to Alternate Storage"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "An alternate storage location for audit logs reduces the likelihood of the logs being lost due to lack of storage capacity. It also ensures that a compromise of the system does not also result in a compromise of its audit logs, which would impact the ability to conduct PII incident response activities or investigations."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); EO 12333, 1.6(b)-(c); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "EO 12333", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-5
        heading: "AU-5, RESPONSE TO AUDIT LOGGING PROCESS FAILURES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 46, anchor: "AU-5, RESPONSE TO AUDIT LOGGING PROCESS FAILURES"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Appropriate officials must be notified of audit logging failures in a timely manner in order to take actions to prevent or limit the loss of information necessary to identify whether PII is abused or misused."}
        references: "5 U.S.C. §552a(e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-6
        heading: "AU-6, AUDIT RECORD REVIEW, ANALYSIS, AND REPORTING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 46, anchor: "AU-6, AUDIT RECORD REVIEW, ANALYSIS, AND REPORTING"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Review and analysis of privacy logs are important for proactively identifying indications of inappropriate or unusual activity that may signify PII misuse or abuse, particularly for systems with a higher privacy risk."}
          - {kind: guidance, text: "Inappropriate or unusual activity must be reported to privacy offices or other officials so that appropriate responses or actions can be taken to prevent or mitigate privacy harms. Adjustments to the review, analysis, or reporting of audit information may be required to ensure that individuals are held accountable for any abuse or misuse of PII."}
        references: "5 U.S.C. §552a(g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-6.3
        heading: "AU-6(3), Audit Record Review, Analysis, and Reporting | Correlate Audit Record Repositories"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 47, anchor: "AU-6(3), Audit Record Review, Analysis, and Reporting | Correlate Audit Record"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Correlating and analyzing privacy audit logs across different log repositories and systems better enables potential identification of PII misuse or abuse across the organization and ensures greater accountability of individuals who use higher privacy risk systems."}
        references: "5 U.S.C. §552a(g), (i); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-7
        heading: "AU-7, AUDIT REDUCTION AND REPORT GENERATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 47, anchor: "AU-7, AUDIT REDUCTION AND REPORT GENERATION"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "On-demand, accurate, and customizable audit report generation that does not alter potential forensic evidence is necessary to support privacy incident or breach reporting requirements and after-the-fact investigations within required timelines."}
        references: "5 U.S.C. §552a(g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-7.1
        heading: "AU-7(1), Audit Record Reduction and Report Generation | Automatic Processing"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 47, anchor: "AU-7(1), Audit Record Reduction and Report Generation | Automatic Processing"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "The ability to analyze audit records quickly and easily facilitates timely identification and reporting of potential privacy incidents or breaches and allows for quicker identification and enactment of countermeasures to mitigate potential privacy harms."}
        references: "5 U.S.C. §552a(g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-9
        heading: "AU-9, PROTECTION OF AUDIT INFORMATION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 47, anchor: "AU-9, PROTECTION OF AUDIT INFORMATION – Included in the Privacy Control"}
        in_privacy_baseline: true
      - control: au-9.3
        heading: "AU-9(3), Protection of Audit Information | Cryptographic Protection"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 47, anchor: "AU-9(3), Protection of Audit Information | Cryptographic Protection"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Using cryptographic mechanisms protects integrity and the confidentiality of the information in the audit logs, including information related to potential privacy incidents and breaches. Audit information may be necessary to enforce criminal or civil penalties under the Privacy Act. In addition to cryptographic mechanisms to protect integrity, the confidentiality of PII in the audit logs themselves may require the use of encryption."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130", "OMB M-17-12"]
      - control: au-9.4
        heading: "AU-9(4), Protection of Audit Information | Access by Subset of Privileged Users"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-9(4), Protection of Audit Information | Access by Subset of Privileged Users"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Minimizing the number of individuals with access to the audit logs facilitates audit log integrity by reducing the opportunity for individuals to inhibit audit activities or modify audit records. It also limits the disclosure of PII within the logs to those who have a mission requirement and need to know."}
        references: "5 U.S.C. §552a(b), (e)(1); OMB Circular A-130; OMB M-07-16"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130", "OMB M-07-16"]
      - control: au-9.6
        heading: "AU-9(6), Protection of Audit Information | Read-Only Access*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-9(6), Protection of Audit Information | Read-Only Access*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Read only access protects the integrity of audit logs by minimizing the ability of individuals to inhibit audit activities or modify audit records."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: au-10
        heading: "AU-10, NON-REPUDIATION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-10, NON-REPUDIATION – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: au-10.1
        heading: "AU-10(1), Non-Repudiation | Association of Identities*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-10(1), Non-Repudiation | Association of Identities*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Non-repudiation allows for increased accountability and accuracy of information in system history and logs and facilitates investigations into potential PII incidents and breaches. Binding identities to PII is a good approach for building non-repudiation capabilities in a system."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: au-11
        heading: "AU-11, AUDIT RECORD RETENTION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-11, AUDIT RECORD RETENTION – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: au-11.1
        heading: "AU-11(1), Audit Record Retention | Long-Term Retrieval Capability"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-11(1), Audit Record Retention | Long-Term Retrieval Capability"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Systems with a higher privacy risk require longer term retrieval of audit records to ensure that abuse or misuse of PII with capability to cause more significant privacy harms or that may involve civil or criminal penalties can be identified and investigated."}
        references: "5 U.S.C. §552a(g), (i); EO 12333, 1.6(b)-(c); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "EO 12333", "OMB Circular A-130"]
      - control: au-12
        heading: "AU-12, AUDIT GENERATION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-12, AUDIT GENERATION – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: au-12.3
        heading: "AU-12(3), Audit Record Generation | Changes by Authorized Individuals"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 48, anchor: "AU-12(3), Audit Record Generation | Changes by Authorized Individuals"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Changes to the audit of information systems containing PII must be limited to a subset of authorized system administrators to ensure integrity of audit logs. This control requires organizations to define the individuals or roles that would be able to make changes to audit generation requirements. Such changes to logging may be necessary to support investigations into potential abuse or misuse of PII, PII incidents or breaches, or other inappropriate activities that may result in privacy harms."}
          - {kind: parameter, text: "Provide and implement the capability for a limited subset of authorized system administrators to change the logging to be performed on any system that contains PII based on a change in risk based on law enforcement, intelligence, or other credible sources of information or a security incident within [Assignment: organization-defined time thresholds]."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "EO 12333", "OMB Circular A-130"]
      - control: au-14
        heading: "AU-14, SESSION AUDIT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 49, anchor: "AU-14, SESSION AUDIT"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Session audit capabilities enhance the ability to conduct investigations into potential abuse or misuse of PII, PII incidents or breaches, or other inappropriate activities that may result in privacy harms. This capability is critical to higher privacy risk systems due to the increased chance of substantial harm to individuals."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "EO 12333", "OMB Circular A-130"]
      - control: au-14.3
        heading: "AU-14(3), Session Audit | Remote Viewing and Listening"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 49, anchor: "AU-14(3), Session Audit | Remote Viewing and Listening"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Remote session audit capabilities further enhance the ability to conduct investigations into potential abuse or misuse of PII, PII incidents or breaches, or other inappropriate activities that may result in privacy harms. This capability is critical to higher privacy risk systems due to the increased chance of substantial harm to individuals."}
        references: "5 U.S.C. §552a(e)(10), (g), (i); E-Government Act of 2002 (Pub. L. No. 107-347), §208; 44 USC 3544(b)(7); EO 12333, 1.6(b)-(c); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "44 U.S.C. 3544", "EO 12333", "OMB Circular A-130"]
      - control: ca-1
        heading: "CA-1, SECURITY ASSESSMENT AND AUTHORIZATION POLICIES AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 49, anchor: "CA-1, SECURITY ASSESSMENT AND AUTHORIZATION POLICIES AND"}
        in_privacy_baseline: true
      - control: ca-2
        heading: "CA-2, SECURITY ASSESSMENTS – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 49, anchor: "CA-2, SECURITY ASSESSMENTS – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ca-3
        heading: "CA-3, INFORMATION EXCHANGE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 49, anchor: "CA-3, INFORMATION EXCHANGE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Boundary protection devices protect systems containing PII from unauthorized access by individuals outside the organization. Agreements document whether and under what circumstances PII can be shared between systems in different authorization boundaries (e.g., an interface between systems owned by different agencies) over a dedicated or “always on” connection. Agreements communicate that PII will be exchanged via the connection and define the security parameters required to protect it. Agreements also provide a record of agreed upon terms and a document against which controls can be enforced and audited. Organizational policy dictates whether agreements are required for internal connections within an organization."}
        references: "5 U.S.C. §552a(e)(5), (e)(10)"
        authorities: ["5 U.S.C. 552a"]
      - control: ca-3.6
        heading: "CA-3(6), Information Exchange | Transfer Authorizations"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 50, anchor: "CA-3(6), Information Exchange | Transfer Authorizations"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Ensures that the information is shared only with those authorized to receive it."}
        references: "5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333"]
      - control: ca-3.7
        heading: "CA-3(7), Information Exchange | Transitive Information Exchanges*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 50, anchor: "CA-3(7), Information Exchange | Transitive Information Exchanges*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Reduces unintended access, which may be necessary for some high-risk systems."}
        references: "5 U.S.C. §552a(e)(9)-(10); FISA; EO 12333"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333"]
      - control: ca-5
        heading: "CA-5, PLAN OF ACTION AND MILESTONES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 50, anchor: "CA-5, PLAN OF ACTION AND MILESTONES – Included in the Privacy Control"}
        in_privacy_baseline: true
      - control: ca-6
        heading: "CA-6, SECURITY AUTHORIZATION – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 50, anchor: "CA-6, SECURITY AUTHORIZATION – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ca-7
        heading: "CA-7, CONTINUOUS MONITORING – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 50, anchor: "CA-7, CONTINUOUS MONITORING – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ca-7.4
        heading: "CA-7(4), Continuous Monitoring | Risk Monitoring – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 50, anchor: "CA-7(4), Continuous Monitoring | Risk Monitoring – Included in the Privacy Control"}
        in_privacy_baseline: true
      - control: ca-8
        heading: "CA-8, PENETRATION TESTING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 50, anchor: "CA-8, PENETRATION TESTING"}
        statements:
          - {kind: justification, disposition: select, sets: [HIGH], text: "Reduces the likelihood of unintended access by unauthorized individuals by proactively identifying and addressing system vulnerabilities."}
          - {kind: parameter, text: "Conduct penetration testing prior to system authorization and periodically thereafter when a significant change to the system occurs on systems containing PII at the High PII confidentiality impact level."}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: ca-9
        heading: "CA-9, INTERNAL SYSTEM CONNECTIONS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 51, anchor: "CA-9, INTERNAL SYSTEM CONNECTIONS"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Privacy requirements such as sharing and disclosure apply to internal systems and their connections as well as to external connections."}
          - {kind: guidance, text: "Include privacy requirements in the Information Connection Document (or equivalent such as an Interconnection Security Agreement or an Authority to Connect package), specifically addressing the collection authority, compatibility of purpose for use, and need for recipient of information to achieve specific business purpose. Documentation must also address responsibilities of the receiving system for protecting PII."}
          - {kind: parameter, text: "b. Authorize internal connections of systems containing PII to the system;"}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: ca-9.1
        heading: "CA-9(1), Internal System Connections | Compliance Checks*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 51, anchor: "CA-9(1), Internal System Connections | Compliance Checks*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "For high-risk systems, this can reduce unintended access."}
          - {kind: guidance, text: "Security compliance checks may include an assessment prior to initial connection of specific components (e.g., printers) based on sensitivity of PII processed by that component. Any change to the components’ security posture would require a re-verification of the configuration settings."}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: cm-1
        heading: "CM-1, CONFIGURATION MANAGEMENT - POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 51, anchor: "CM-1, CONFIGURATION MANAGEMENT - POLICY AND PROCEDURES – Included"}
        in_privacy_baseline: true
      - control: cm-2
        heading: "CM-2, BASELINE CONFIGURATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 51, anchor: "CM-2, BASELINE CONFIGURATION"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Baseline configurations of systems reflect the current enterprise architecture and enable the identification of configuration changes that might impact privacy risks."}
          - {kind: parameter, text: "b. Review and update the baseline configuration of the system: 2. When required due to changes impacting necessary administrative, technical, and physical safeguards addressed in the published PIA and/or SORN; and"}
        references: "5 U.S.C. §552a(e); E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130; OMB M-03-22"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130", "OMB M-03-22"]
      - control: cm-3
        heading: "CM-3, CONFIGURATION CHANGE CONTROL"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 52, anchor: "CM-3, CONFIGURATION CHANGE CONTROL"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Proposed configuration-controlled changes to the system require explicit consideration for privacy impact when configuration changes have the potential to impact safeguards addressed in the published PIA and/or SORN."}
          - {kind: parameter, text: "g. Coordinate and provide oversight for configuration change control activities through [Assignment: organization-defined configuration change control element] that convenes [Selection (one or more): [Assignment: organization-defined frequency]; when changes impacting necessary administrative, technical, and physical safeguards addressed in the published PIA and/or SORN."}
        references: "5 U.S.C. §552a(e); Appendix I; E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130; OMB M-03-22"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130", "OMB M-03-22"]
      - control: cm-3.1
        heading: "CM-3(1), Configuration Change Control | Automated Documentation, Notification, and Prohibition of Changes"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 52, anchor: "CM-3(1), Configuration Change Control | Automated Documentation, Notification, and"}
        statements:
          - {kind: justification, disposition: select, sets: [HIGH], text: "Changes to the configuration may impact privacy risk."}
          - {kind: parameter, text: "(1)(b) Notify the SAOP or designee of proposed changes to the system and request change approval; (f) Notify the SAOP or designee when approved changes to the system are completed."}
        references: "5 U.S.C. §552a(e); E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130; OMB M-03-22"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130", "OMB M-03-22"]
      - control: cm-3.4
        heading: "CM-3(4), Configuration Change Control | Security and Privacy Representatives"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 52, anchor: "CM-3(4), Configuration Change Control | Security and Privacy Representatives"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Change control elements must ensure change considerations impacting systems with PII include personnel with appropriate privacy expertise."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: cm-3.6
        heading: "CM-3(6), Configuration Change Control | Cryptography Management"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 52, anchor: "CM-3(6), Configuration Change Control | Cryptography Management"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "If encryption is used to protect PII, there must be a management process in place to ensure future access to such information."}
        references: "5 U.S.C. §552a(e)(5), (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: cm-4
        heading: "CM-4, IMPACT ANALYSES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 53, anchor: "CM-4, IMPACT ANALYSES – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: cm-4.1
        heading: "CM-4(1), Impact Analyses | Separate Test Environments"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 53, anchor: "CM-4(1), Impact Analyses | Separate Test Environments"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Test processing PII prior to going live reduces the impact of possible misuse or abuse."}
          - {kind: guidance, text: "If PII is processed in the test environment, then the same controls required for systems containing PII must be applied to the test environment. Synthetic or simulated PII information should be used to the maximum extent practicable when testing system functionality. A Privacy Act system of records must use synthetic data, even in test environments, until the SORN has met statutory requirements."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: cm-4.2
        heading: "CM-4(2), Impact Analyses | Verification of Controls"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 53, anchor: "CM-4(2), Impact Analyses | Verification of Controls"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "If a system change is made, verification of Privacy Overlays security control functions is required to ensure continued compliance with privacy-related statutes and regulations."}
        references: "5 U.S.C. §552a(e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130; OMB M-03-22"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130", "OMB M-03-22"]
      - control: cm-13
        heading: "CM-13, DATA ACTION MAPPING*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 53, anchor: "CM-13, DATA ACTION MAPPING*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Mapping PII helps to understand where the data are located, going, and how they are processed."}
        references: "5 U.S.C. §552a(e)(10); E-Government Act of 2002 (Pub. L. No. 107-347), §208; OMB Circular A-130; OMB M-03-22"
        authorities: ["5 U.S.C. 552a", "E-Government Act of 2002", "Pub. L. 107-347", "OMB Circular A-130", "OMB M-03-22"]
      - control: cp-1
        heading: "CP-1, CONTINGENCY PLANNING POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 53, anchor: "CP-1, CONTINGENCY PLANNING POLICY AND PROCEDURES – Included in the"}
        in_privacy_baseline: true
      - control: cp-2
        heading: "CP-2, CONTINGENCY PLAN"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 53, anchor: "CP-2, CONTINGENCY PLAN"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Contingency plans must take applicable privacy requirements into account so that executing contingency measures does not result in avoidable privacy incidents and breaches or compliance issues with intelligence related policies and procedures designed to protect privacy."}
        references: "5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305(a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 121", "ICD 503", "OMB Circular A-130"]
      - control: cp-6
        heading: "CP-6, ALTERNATE STORAGE SITE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 54, anchor: "CP-6, ALTERNATE STORAGE SITE"}
        statements:
          - {kind: guidance, sets: [MODERATE, HIGH], text: "When an alternate processing site is used, alternate storage sites must meet privacy requirements so that alternative storage sites do not inadvertently result in avoidable privacy incidents and breaches."}
        references: "5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305(a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 121", "ICD 503"]
      - control: cp-6.1
        heading: "CP-6(1), Alternate Storage Site | Separation from Primary Site"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 54, anchor: "CP-6(1), Alternate Storage Site | Separation from Primary Site"}
        statements:
          - {kind: guidance, sets: [MODERATE, HIGH], text: "When an alternate processing site is used, alternate storage sites must meet privacy requirements so that alternative storage sites do not inadvertently result in avoidable privacy incidents and breaches."}
        references: "5 U.S.C. §552a(e)(10); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "ICD 107", "ICD 503"]
      - control: cp-6.3
        heading: "CP-6(3), Alternate Storage Site | Accessibility"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 54, anchor: "CP-6(3), Alternate Storage Site | Accessibility"}
        statements:
          - {kind: guidance, sets: [MODERATE, HIGH], text: "Individuals with access to PII at the alternate storage site must meet the same requirements for individuals with access to PII for the primary site."}
        references: "5 U.S.C. §552a(e)(10); FISA Sections 101(h),106, 305(a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 503"]
      - control: cp-7
        heading: "CP-7, ALTERNATE STORAGE PROCESSING SITE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 54, anchor: "CP-7, ALTERNATE STORAGE PROCESSING SITE"}
        statements:
          - {kind: guidance, sets: [MODERATE, HIGH], text: "When using an alternate processing site, implement administrative, physical and technical controls to protect PII commensurate with the identified privacy risks."}
        references: "5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305(a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 503"]
      - control: cp-7.1
        heading: "CP-7(1), Alternate Processing Site | Separation From Primary Site"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 54, anchor: "CP-7(1), Alternate Processing Site | Separation From Primary Site"}
        statements:
          - {kind: guidance, sets: [MODERATE, HIGH], text: "When using an alternate processing site, implement administrative, physical and technical controls to protect PII commensurate with the identified privacy risks."}
        references: "5 U.S.C. §552a(e)(10); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "ICD 107", "ICD 503"]
      - control: cp-9
        heading: "CP-9, INFORMATION SYSTEM BACKUP"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 55, anchor: "CP-9, INFORMATION SYSTEM BACKUP"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Backup copies of information must be protected with the same level of security as the information maintained on the original system. Applicable controls necessary to achieve this and to protect confidentiality include encryption of the backup. Backing up information helps maintain the integrity of the data, which is a requirement under the Privacy Act. Use the encryption methodology specified in SC-13 to encrypt Low, Moderate, and High information in backups at the storage location."}
        references: "5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 503", "OMB Circular A-130"]
      - control: cp-9.8
        heading: "CP-9(8), System Backup | Cryptographic Protection"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 55, anchor: "CP-9(8), System Backup | Cryptographic Protection"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "PII with a higher privacy risk requires increased protections."}
        references: "5 U.S.C. §552a(e)(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 503"]
      - control: cp-10
        heading: "CP-10, INFORMATION SYSTEM RECOVERY AND RECONSTITUTION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 55, anchor: "CP-10, INFORMATION SYSTEM RECOVERY AND RECONSTITUTION"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Information system recovery and reconstitution is an important step to restoring PII to an accurate state for decision making following execution of a contingency plan."}
        references: "5 U.S.C. §552a(e)(5) and (e)(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 503"]
      - control: ia-1
        heading: "IA-1, (IDENTIFICATION AND AUTHENTICATION) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 55, anchor: "IA-1, (IDENTIFICATION AND AUTHENTICATION) POLICY AND PROCEDURES –"}
        in_privacy_baseline: true
      - control: ia-2
        heading: "IA-2, IDENTIFICATION AND AUTHENTICATION (ORGANIZATIONAL USERS)"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 55, anchor: "IA-2, IDENTIFICATION AND AUTHENTICATION (ORGANIZATIONAL USERS)"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Implementing this control ensures unique identification and authentication of an individual’s account, preventing anonymous access to PII and providing appropriate access for organizational users who have a need for the PII in the performance of the users’ official duties."}
        references: "5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "NSM-8", "OMB Circular A-130"]
      - control: ia-2.1
        heading: "IA-2(1), Identification and Authentication (Organizational Users) | Multifactor Authentication to Privileged Accounts"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 55, anchor: "IA-2(1), Identification and Authentication (Organizational Users) | Multifactor"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "System owners are required to know who is accessing data and who is receiving the data. Users of privileged accounts are trusted with access to perform system control, monitoring, administration functions, or security-relevant functions that ordinary users are not authorized to perform. Thus, users with access to privileged accounts should undergo more than one means of verification to log onto the system. This can be addressed with two factor authentication."}
        references: "5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "NSM-8", "OMB Circular A-130"]
      - control: ia-2.5
        heading: "IA-2(5), Identification and Authentication (Organizational Users) | Individual Authentication With Group Authentication"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 56, anchor: "IA-2(5), Identification and Authentication (Organizational Users) | Individual"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Shared accounts inhibit the ability to trace and hold individuals accountable for their access and use of PII. Shared accounts must be individually authenticated to ensure PII processed by the information system is safeguarded."}
        references: "5 U.S.C. §552a(b), (e)(10); NSM-8; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "NSM-8", "OMB Circular A-130"]
      - control: ia-2.6
        heading: "IA-2(6), Identification and Authentication (Organizational Users) | Access to Accounts – Separate Device"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 56, anchor: "IA-2(6), Identification and Authentication (Organizational Users) | Access to Accounts –"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Requiring multi-factor authentication to privileged accounts provides added assurance that a privileged user, who likely has elevated privileges with access to PII, has proven their identity during the authentication process. During multi-factor authentication, implementing one of the factors on a separate device reduces the likelihood of compromise and provides heightened assurance of identity during the authentication process."}
          - {kind: guidance, text: "Two-factor authentication should require one factor separate from the computer itself. A separate device would include a Common Access Card (CAC). This control is required when the network access is remote (from outside the organization-controlled networks)."}
        references: "5 U.S.C. §552a(e)(10); NSM-8; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "NSM-8", "OMB M-17-12"]
      - control: ia-4
        heading: "IA-4, IDENTIFIER MANAGEMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 56, anchor: "IA-4, IDENTIFIER MANAGEMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Identifiers are unique and should not be shared or reused. Processes and procedures must be used to manage user identifiers in order to prevent inappropriate access to an information system holding PII."}
          - {kind: guidance, text: "Receiving authorization to assign an individual, group, role, or device identifier; selecting and assigning an identifier to an individual, group, role or device; preventing the reuse of identifiers for a defined time period; and disabling the identifier after a defined time period of inactivity are some of the best practices for safeguarding PII within an organization or system. Social Security Numbers (SSNs) and parts of SSNs should not be used as identifiers for individuals. SSNs create the potential for unauthorized disclosure of the SSN. In addition, system identifiers are not protected with the same level of security as are database elements or passwords and use of an SSN may allow linkage to other PII for that individual. Use of an individual’s SSN as an identifier may create notice requirements under the Privacy Act."}
        references: "5 U.S.C. §552a (note §§7(a)(1)), (b), (e)(10) and (j); 44 U.S.C. §3518(c)(1); NSM-8"
        authorities: ["5 U.S.C. 552a", "44 U.S.C. 3518", "NSM-8"]
      - control: ia-5
        heading: "IA-5, AUTHENTICATOR MANAGEMENT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 57, anchor: "IA-5, AUTHENTICATOR MANAGEMENT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "User authentication is a means to control who has access to an information system holding PII. Adequate security to ensure confidentiality for an information system containing PII is achieved through the management of the authenticators permitting access to that system."}
          - {kind: guidance, text: "Authenticator management includes verifying the identity of the user, group, service or device when the authenticator (password) is initially distributed; establishing the content of the authenticator; periodically changing passwords or other identifiers (e.g., certification and signatures) ensuring the strength of authenticators; requiring users to protect their authenticators; changing default authenticators. This reinforces identity validation and adherence to administrative security policies as well as enforces a time-based restriction on access, all of which bound access to PII in some way, limiting exposure in the event a user account is compromised."}
        references: "5 U.S.C. §552a(b) and (e)(10); FISMA (P.L. No. 107-347, Title III) § 3547; NSM-8; OMB M-17-12; OMB M-06-16"
        authorities: ["5 U.S.C. 552a", "FISMA", "Pub. L. 107-347", "NSM-8", "OMB M-17-12", "OMB M-06-16"]
      - control: ia-7
        heading: "IA-7, CRYPTOGRAPHIC MODULE AUTHENTICATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 57, anchor: "IA-7, CRYPTOGRAPHIC MODULE AUTHENTICATION"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "PII requires encryption in certain circumstances, including requirements for authentication to cryptographic modules."}
          - {kind: guidance, text: "Organizations must either use cryptographic modules which satisfy FIPS 140-322, including requirements for authentication, or NSA-certified hardware-based encryption modules. Use of unapproved cryptographic modules potentially allows unauthorized access to the cryptographic module or underlying, encrypted PII."}
        references: "5 U.S.C. §552a(e)(10); NSM-8; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "NSM-8", "OMB M-17-12"]
      - control: ia-8
        heading: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL USERS)"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IA-8, IDENTIFICATION AND AUTHENTICATION (NON-ORGANIZATIONAL"}
        statements:
          - {kind: justification, disposition: select, sets: [LOW, MODERATE, HIGH], text: "Authentication of non-organizational users accessing information systems is required to protect PII and privacy. This control requires information systems to uniquely identify and authenticate system users that are not part of the organization, as well as processes that act on behalf of another organization. This means no one is provided anonymous access to PII and supports managing each user’s appropriate access to PII."}
        references: "5 U.S.C. §552a(b), (e)(10); FISMA (P.L. 107-347, Title III); NSM-8; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FISMA", "Pub. L. 107-347", "NSM-8", "OMB Circular A-130"]
      - control: ia-12
        heading: "IA-12, IDENTITY PROOFING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IA-12, IDENTITY PROOFING"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Collecting, validating, and verifying a user’s identity information to establish their credentials to gain access to a system processing PII helps protect PII against harm by limiting access to PII to those individuals who are permitted and have a need to know the information in the performance of the users’ official duties."}
        references: "5 U.S.C. §552a(e)(10); NSM-8"
        authorities: ["5 U.S.C. 552a", "NSM-8"]
      - control: ir-1
        heading: "IR-1, INCIDENT RESPONSE POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IR-1, INCIDENT RESPONSE POLICY AND PROCEDURES – Included in the Privacy"}
        in_privacy_baseline: true
      - control: ir-2
        heading: "IR-2, INCIDENT RESPONSE TRAINING – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IR-2, INCIDENT RESPONSE TRAINING – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-2.1
        heading: "IR-2(1), Incident Response Training | Simulated Events"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IR-2(1), Incident Response Training | Simulated Events"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Simulated incident response training provides an opportunity for stakeholders to practice their roles, responsibilities, response plans, and actions to help ensure a more effective response in the event of a crisis, such as a breach of PII. Using simulated events training to gain practical experience managing incident response reduces likelihood of misuse or abuse of PII, which reduces privacy risk. This control can be addressed at the organizational or system level."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: ir-2.3
        heading: "IR-2(3), Incident Response Training | Breach – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IR-2(3), Incident Response Training | Breach – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-3
        heading: "IR-3, INCIDENT RESPONSE TESTING – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IR-3, INCIDENT RESPONSE TESTING – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-4
        heading: "IR-4, INCIDENT HANDLING – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 58, anchor: "IR-4, INCIDENT HANDLING – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-4.4
        heading: "IR-4(4), Incident Handling | Information Correlation"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "IR-4(4), Incident Handling | Information Correlation"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Certain threats, such as cyber-attacks involving breaches of PII, may only be seen after looking at information from various sources. Correlating incident information and incident responses that involve PII can provide an organization-wide perspective on incident awareness and response. This control can be addressed at the organizational or system level."}
        references: "OMB Circular A-130"
        authorities: ["OMB Circular A-130"]
      - control: ir-4.7
        heading: "IR-4(7), Incident Handling | Insider Threats — Intra-Organization Coordination – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "IR-4(7), Incident Handling | Insider Threats — Intra-Organization Coordination –"}
        in_privacy_baseline: true
      - control: ir-5
        heading: "IR-5, INCIDENT MONITORING - Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "IR-5, INCIDENT MONITORING - Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-6
        heading: "IR-6, INCIDENT REPORTING - Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "IR-6, INCIDENT REPORTING - Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-7
        heading: "IR-7, INCIDENT RESPONSE ASSISTANCE - Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "IR-7, INCIDENT RESPONSE ASSISTANCE - Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-8
        heading: "IR-8, INCIDENT RESPONSE PLAN - Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "IR-8, INCIDENT RESPONSE PLAN - Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ir-8.1
        heading: "IR-8(1), Incident Response Plan | Breaches - Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "IR-8(1), Incident Response Plan | Breaches - Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: ma-1
        heading: "MA-1, (MAINTENANCE) POLICY AND PROCEDURES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "MA-1, (MAINTENANCE) POLICY AND PROCEDURES"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Privacy considerations should be included in system maintenance policy and procedures especially when the system contains information subject to the Privacy Act."}
          - {kind: guidance, text: "This can be satisfied through an enterprise policy for systems that maintain PII. System maintenance policy and procedures must ensure that contractors operating a system of records by or on behalf of an agency to accomplish an agency function are contractually bound to be covered by the Privacy Act."}
        references: "5 U.S.C. §552a(b), (e)(9)-(10), and (m); FAR Parts 24.104, 39.105, and 52.224-1&2; ICD 107; ICD 503; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "FAR", "ICD 107", "ICD 503", "OMB Circular A-130"]
      - control: ma-2
        heading: "MA-2, CONTROLLED MAINTENANCE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 59, anchor: "MA-2, CONTROLLED MAINTENANCE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Sanitize equipment of any PII to ensure the information is not inadvertently put at risk."}
          - {kind: parameter, text: "Sanitize equipment to remove the following information from associated media prior to removal from organizational facilities for off-site maintenance, repair, or replacement: PII;"}
        references: "OMB M-17-12; NARA GRS"
        authorities: ["OMB M-17-12"]
        guidance_references: ["NARA GRS"]
      - control: ma-3.4
        heading: "MA-3(4), MAINTENANCE TOOLS: RESTRICTED TOOL USE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 60, anchor: "MA-3(4), MAINTENANCE TOOLS: RESTRICTED TOOL USE"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Maintenance tools that may access PII on a system may only be used by technical personnel who need to know the PII related to their official functions and have completed appropriate training as outlined in the AT controls."}
          - {kind: guidance, text: "Ensure maintenance tools can only be leveraged by the authorized providers to ensure that training requirements and access controls are followed."}
        references: "5 U.S.C. §552a(b), (e)(9)-(10); FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6); Section 1.6(d); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 503"]
      - control: ma-3.5
        heading: "MA-3(5), MAINTENANCE TOOLS: EXECUTION WITH PRIVILEGE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 60, anchor: "MA-3(5), MAINTENANCE TOOLS: EXECUTION WITH PRIVILEGE"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Maintenance tools that execute with increased system privilege can result in unauthorized access to PII that would otherwise be inaccessible. Individuals with increased system privilege must have a need to know the PII in the system and have taken appropriate privacy training."}
        references: "5 U.S.C. §552a(b), (e)(9)-(10), 12333, FISA Sections 101(h); 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503"
        authorities: ["5 U.S.C. 552a", "FISA", "EO 12333", "ICD 107", "ICD 503"]
      - control: ma-4.6
        heading: "MA-4(6), Nonlocal Maintenance | Cryptographic Protection"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 60, anchor: "MA-4(6), Nonlocal Maintenance | Cryptographic Protection"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Encrypting the communications channel when maintenance is performed remotely protects user credentials, PII, and other data as it travels “across the wire.”"}
        references: "FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 503; OMB M-17-12, OMB Circular A-130"
        authorities: ["FISA", "EO 12333", "ICD 107", "ICD 503", "OMB M-17-12", "OMB Circular A-130"]
      - control: ma-5
        heading: "MA-5, MAINTENANCE PERSONNEL"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 60, anchor: "MA-5, MAINTENANCE PERSONNEL"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Ensures maintenance personnel and others with physical access to a system are properly authorized and/or supervised by someone who is authorized to access the system, which protects PII and other information from unauthorized use and disclosure."}
          - {kind: guidance, text: "If maintenance personnel are contractors operating a system of records by or on behalf of an agency to accomplish an agency function, then the organization must ensure that the contractors are contractually bound to implement the Privacy Act."}
        references: "5 U.S.C. §552a(b), (e)(9)-(10), and (m); FAR Part 24.104, 39.105, and 52.224-1"
        authorities: ["5 U.S.C. 552a", "FAR"]
      - control: mp-1
        heading: "MP-1, MEDIA PROTECTION POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 61, anchor: "MP-1, MEDIA PROTECTION POLICY AND PROCEDURES – Included in the Privacy"}
        in_privacy_baseline: true
      - control: mp-2
        heading: "MP-2, MEDIA ACCESS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 61, anchor: "MP-2, MEDIA ACCESS"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Restricting access to digital and non-digital media, including mobile devices with storage capabilities, protects PII from unauthorized use and disclosure."}
          - {kind: guidance, text: "Conduct a risk assessment to determine what PII, if any, can be stored on certain media types and who is authorized to do so."}
          - {kind: parameter, text: "Restrict access to any digital or non-digital media containing PII to authorized individuals with a valid need to know."}
        references: "E-Government Act of 2002 (Pub. L. No. 107-347) § 208; ICD 121; OMB M-17-12"
        authorities: ["E-Government Act of 2002", "Pub. L. 107-347", "ICD 121", "OMB M-17-12"]
      - control: mp-3
        heading: "MP-3, MEDIA MARKING"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 61, anchor: "MP-3, MEDIA MARKING"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "To enable individuals to appropriately protect media containing PII, that media (or its container) must be marked to specify the contents, applicable protections (i.e., distribution limitations, handling caveats, and applicable security markings), or both, for the information therein."}
          - {kind: guidance, text: "Media containing PII, or the container for the media if labeling the media is not practicable, shall be marked appropriately."}
        references: "5 U.S.C. §552a(e)(10); ICD 107; ICD 121; ICD 503; OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "ICD 107", "ICD 121", "ICD 503", "OMB Circular A-130"]
      - control: mp-4
        heading: "MP-4, MEDIA STORAGE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 61, anchor: "MP-4, MEDIA STORAGE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Controlling the storage of media containing PII protects the media from theft and promotes accountability."}
          - {kind: parameter, text: "a. Physically control and securely store removable media that contains PII within any securable area or in a locked container; and"}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: mp-5
        heading: "MP-5, MEDIA TRANSPORT"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 61, anchor: "MP-5, MEDIA TRANSPORT"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Protecting and controlling media containing PII, commensurate with the sensitivity of the PII contained on the media, during transport outside of controlled areas promotes accountability and limits situations that make the media vulnerable to unauthorized use and disclosure through loss, theft, or other mishandling."}
          - {kind: parameter, text: "a. Protect and control digital media that contains PII during transport outside of controlled areas using NSA-approved or FIPS-validated encryption;"}
        references: "ICD 107; ICD 121; ICD 503; OMB M-17-12; OMB Circular A-130"
        authorities: ["ICD 107", "ICD 121", "ICD 503", "OMB M-17-12", "OMB Circular A-130"]
      - control: mp-6
        heading: "MP-6, MEDIA SANITIZATION"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 62, anchor: "MP-6, MEDIA SANITIZATION"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Properly sanitizing media that contains PII prior to disposal or release protects PII from unauthorized use and disclosure and facilitates compliance with retention schedules. All PII must be removed to prevent privacy breaches."}
          - {kind: parameter, text: "a. Sanitize digital media that contains PII prior to disposal, release out of organizational control, or release for reuse using NSA-approved or FIPS-validated media sanitization techniques or procedures; and"}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130", "OMB M-17-12"]
      - control: mp-6.1
        heading: "MP-6(1), Media Sanitization | Review, Approve, Track, Document, and Verify*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 62, anchor: "MP-6(1), Media Sanitization | Review, Approve, Track, Document, and Verify*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "Tracking, documenting, and verifying media sanitization and disposal actions for media that contains PII reduces the risk of unauthorized disclosure of PII and increases accountability."}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130; OMB M-17-12"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130", "OMB M-17-12"]
      - control: mp-6.2
        heading: "MP-6(2), Media Sanitization | Equipment Testing*"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 62, anchor: "MP-6(2), Media Sanitization | Equipment Testing*"}
        statements:
          - {kind: justification, disposition: recommend, sets: [ENHANCING], text: "As an additional layer of protection, testing sanitization equipment and procedures helps to ensure that the intended sanitization is achieved. This may be appropriate when disposing of media that had particularly sensitive PII or which if released would seriously harm national security."}
        references: "FISA Sections 101(h), 106, 305 (a), 402(h)(1); EO 12333 Section 1.5 (b)(6), Section 1.6(d); ICD 107; ICD 121; ICD 503"
        authorities: ["FISA", "EO 12333", "ICD 107", "ICD 121", "ICD 503"]
      - control: mp-6.8
        heading: "MP-6(8), Media Sanitization | Purging or Wiping of Information"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 62, anchor: "MP-6(8), Media Sanitization | Purging or Wiping of Information"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Permits the organization to specify remote memory and data wipe when the smart device is reported lost or stolen, and/or implementing a limited number of unsuccessful login attempts before the smart device wipes its memory and clears its contents."}
          - {kind: guidance, text: "Consider use of this control for mobile devices such as iPads or other smart device. If using personal smart devices (for example, BYOD), the organization must evaluate methods to ensure this control is enforced or that compensating controls are in place. Consider including contractual clauses to be able to delete the information from cloud systems."}
        references: "5 U.S.C. §552a(b) and (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: mp-7
        heading: "MP-7, MEDIA USE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 63, anchor: "MP-7, MEDIA USE"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Personally owned mobile devices and other personal media exist outside the boundaries of organization-owned systems, which limits the ability of organizations to control how PII is handled. Therefore, controlling what may be placed on a personally owned mobile device reduces organizational risk. Systems that process any PII must not have unidentifiable systems attached."}
          - {kind: parameter, text: "a. Restrict the use of portable storage and mobile devices on information systems and networks containing PII, without using device ownership, media sanitization and encryption controls;"}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: pe-1
        heading: "PE-1, (PHYSICAL AND ENVIRONMENTAL PROTECTION) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 63, anchor: "PE-1, (PHYSICAL AND ENVIRONMENTAL PROTECTION) POLICY AND"}
        in_privacy_baseline: true
      - control: pe-2
        heading: "PE-2, PHYSICAL ACCESS AUTHORIZATIONS – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 63, anchor: "PE-2, PHYSICAL ACCESS AUTHORIZATIONS – Included in the Privacy Control"}
        in_privacy_baseline: true
      - control: pe-3
        heading: "PE-3, PHYSICAL ACCESS CONTROL"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 63, anchor: "PE-3, PHYSICAL ACCESS CONTROL"}
        statements:
          - {kind: justification, disposition: select, sets: [ACCT, LOW, MODERATE, HIGH], text: "Physical access controls that limit access to a facility commensurate with the level of sensitivity of the PII processed in a facility is required to protect the PII from unauthorized access, use, and disclosure."}
        references: "5 U.S.C. §552a(b), (e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: pe-5
        heading: "PE-5, ACCESS CONTROL FOR OUTPUT DEVICES"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 63, anchor: "PE-5, ACCESS CONTROL FOR OUTPUT DEVICES"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "Controlling physical access to output devices such as monitors, printers, and audio devices protects PII from unauthorized access."}
          - {kind: guidance, text: "Access controls applied to output devices should be commensurate with the privacy risk level. For example, human resource information should be sent only to printers located in secured locations rather than in widely accessible areas within the facility."}
        references: "5 U.S.C. §552a(e)(10); OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: pe-8
        heading: "PE-8, VISITOR ACCESS RECORDS – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 64, anchor: "PE-8, VISITOR ACCESS RECORDS – Included in the Privacy Control Baseline"}
        in_privacy_baseline: true
      - control: pe-8.3
        heading: "PE-8(3), Visitor Access Records | Limit Personally Identifiable Information Elements – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 64, anchor: "PE-8(3), Visitor Access Records | Limit Personally Identifiable Information Elements –"}
        in_privacy_baseline: true
      - control: pe-17
        heading: "PE-17, ALTERNATE WORK SITE"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 64, anchor: "PE-17, ALTERNATE WORK SITE"}
        statements:
          - {kind: justification, disposition: select, sets: [MODERATE, HIGH], text: "PII collected, stored, and processed at an alternate worksite is subject to the same laws, regulations, and policies as PII handled at the primary organizational facility.”"}
          - {kind: guidance, text: "Implement adequate security and privacy controls commensurate with the risk to PII at the alternate work site."}
        references: "FISMA (Pub. L. No. 107-347) Title III; OMB M-11-27"
        authorities: ["FISMA", "Pub. L. 107-347", "OMB M-11-27"]
      - control: pe-18
        heading: "PE-18, LOCATION OF INFORMATION SYSTEM COMPONENTS"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 64, anchor: "PE-18, LOCATION OF INFORMATION SYSTEM COMPONENTS"}
        statements:
          - {kind: justification, disposition: select, sets: [HIGH], text: "This control is required to limit intentional and unintentional disclosures of PII."}
          - {kind: guidance, text: "Locate system components that either store or display PII and place components in a manner to decrease the risk of unauthorized disclosure. One example is ensuring placement of monitors to prevent unauthorized viewing of the displayed information. Another example is ensuring servers and disk arrays containing PII are located in a secured space."}
        references: "5 U.S.C. §552a(e)(10), OMB Circular A-130"
        authorities: ["5 U.S.C. 552a", "OMB Circular A-130"]
      - control: pl-1
        heading: "PL-1, (PLANNING) POLICY AND PROCEDURES – Included in the Privacy Control Baseline"
        citation: {ref: CNSSI1253F-ATT6-PRIVACY, page: 64, anchor: "PL-1, (PLANNING) POLICY AND PROCEDURES – Included in the Privacy Control"}
        in_privacy_baseline: true
      - control: pl-2
        heading: "PL-2, SYSTEM SECURITY AND PRIVACY PLANS – Included in the Privacy Control Baseline"
