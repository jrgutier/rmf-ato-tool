# policy_controls: controls a policy requires of every system an overlay applies to; each maps
# a CNSSP 12 duty to the Space Platform Overlay controls whose guidance carries it (overlay
# pages in the comment). S-2 may not tailor them out (SPCOV-002).
policy_controls:
  - id: PC-SPC-1
    overlay: CNSSI1253F-ATT2-SPACE
    authority: CNSSP 12
    text: Space NSS are designed to adapt to evolving cybersecurity threats and operate through related attacks.
    controls: [cp-12, si-13, si-17]  # Safe Mode p. 30, Predictable Failure Prevention p. 64, Fail-Safe Procedures p. 66
    citation: {ref: CNSSP12, page: 6, anchor: "designed to adapt to evolving cybersecurity threats and operate through"}
  - id: PC-SPC-2
    overlay: CNSSI1253F-ATT2-SPACE
    authority: CNSSP 12
    text: Space NSS implement cyber defense services, including on-board intrusion detection and intrusion prevention systems.
    controls: [si-4.7, si-4.13]  # on-orbit IDS response p. 62
    citation: {ref: CNSSP12, page: 8, anchor: "Space NSS and services must implement cyber defense services, including on-board"}
  - id: PC-SPC-3
    overlay: CNSSI1253F-ATT2-SPACE
    authority: CNSSP 12
    text: Space NSS implement a secure boot process using a hardware root of trust that restores the vehicle to a known trusted state.
    controls: [sc-51, si-7.6, si-7.12]  # secure boot and root of trust p. 61, rollback to a known-good image p. 64
    citation: {ref: CNSSP12, page: 8, anchor: "Space NSS and services must implement a secure boot process using a"}
  - id: PC-SPC-4
    overlay: CNSSI1253F-ATT2-SPACE
    authority: CNSSP 12
    text: Space NSS implement a process to securely develop and deploy software and firmware patches and updates.
    controls: [si-2, sa-10, si-7.12]  # integrity of an update before it runs on the vehicle p. 64
    citation: {ref: CNSSP12, page: 8, anchor: "Space NSS and services must implement a process to securely develop and"}
  - id: PC-SPC-5
    overlay: CNSSI1253F-ATT2-SPACE
    authority: CNSSP 12
    text: Space NSS implement TRANSEC measures in accordance with CNSSP 3 and a System TRANSEC Plan approved by the cognizant AO.
    controls: [sc-8.3, sc-8.4, sc-40]  # "The AO should consult the System TRANSEC Plan" p. 56, p. 59
    citation: {ref: CNSSP12, page: 8, anchor: "Space NSS and services must implement TRANSEC measures in accordance with"}
# dod_policy_controls: controls that carry a duty DoDI 8500.01 places on every DoD IS and PIT
# system (subject: system), or on its ISSO, privileged users and authorized users (subject:
# users, the ISSO, privileged user and authorized user sections, pages 49 to 51). Each record
# maps one paragraph to the CNSSI 1253 controls, all selected at every level, whose statements
# carry it; a user's behavioral duty rests on pl-4 (rules of behavior) plus any control the
# sentence names. S-2 may not tailor them out, the SSP may not record them not-applicable, and
# a compensating control stands for one only with the AO's or AODR's approval (DPOL-001,
# DPOL-002). A stand-alone system with no DODIN connection may tailor its control set with the
# AO's approval (pages 38 and 39), recorded as approved_by on the remove action. Inheriting a
# common control is no removal.
dod_policy_controls:
  - id: PC-DOD-1
