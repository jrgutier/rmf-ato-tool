# framework/baselines/tailoring-inputs.yaml: what Task S-2 tests the system against before it
# tailors. Hand-authored (not generated). Schema: framework/schema/tailoring-inputs.schema.json.
#
# assumptions: the assumptions under the baselines and overlays. A run records in
# artifacts/data/tailoring.yaml whether each one holds for the system (TLR-003). `when`
# says what an answer obliges:
#   holds-false: the assumption is one the baselines rest on; a system where it does not
#     hold revisits the selection (scoping, compensating, supplementing or an overlay).
#   holds-true: the assumption is one the baselines do not address; a system where it holds
#     supplements the baseline or applies an overlay.
# An assumption with `overlay` applies only to a run that applies that overlay. `controls`
# lists what the overlay tailors out on the assumption (Space Platform Overlay Table 1); where
# the assumption does not hold, S-2 revisits each of them.
#
# overlay_conditions: conditions an overlay names under which a control must be selected
# (TLR-005). A run applying the overlay answers each; a condition that applies selects
# every control it lists.
assumptions:
