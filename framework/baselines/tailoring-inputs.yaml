# control_floors: controls that carry a duty of a source other than DoDI 8500.01, one record
# per duty, each read against its page. mapping says how: the source names the controls
# (named), they alone meet the duty (sole), or the source names none and several could meet
# it (proxy; an entry resting on a proxy record stays partial). S-2 may not tailor them out,
# the SSP may not record them not-applicable, and a compensating control stands for one only
# with its risk accepted by the AO or AODR (CFLR-001 NIST, CFLR-002 DoDI 8530.01, CFLR-003 DoD
# acquisition, cATO and vulnerability management). The permitted cases are DPOL's: a
# stand-alone system with no DODIN connection removes one with the AO's or AODR's approval
# (DoDI 8500.01 pp. 38 and 39 governs every DoD IS), and inheriting a control is no removal.
# FIPS 200 allows the SP 800-53 tailoring guidance (p. 10), of which a compensating control
# is the case that still meets the minimum requirement; it allows no waiver (p. 5).
# Every control here is selected by CNSSI 1253 at every level (or in the privacy column).
