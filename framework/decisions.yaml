# Authorization decision types. Only the AO decides; the decision cannot be delegated
# (DoDI 8510.01 4.4.a(5)). DoDI 8510.01 names IATT, ATO, ATO with conditions and denial of
# ATO; cATO comes from the DoD CIO cATO memo and DoDI 5000.90. The authorization to use, common
# control authorization and the denial of each come from SP 800-37r2 Appendix F. `effect` says
# what a record of the type does to the ledger (rmf_tool.run.authorization.in_force).
decisions:
  - id: AD-IATT
    name: Interim Authorization to Test
    short: IATT
    description: >-
      A time-limited authorization to test the system in an operational environment or with
      live data before all controls are in place, limited to the time needed to complete the
      testing objectives and usually with operating restrictions (for example a minimum number
      of users, restricted hours, increased audit logging and monitoring, or only the functions
      that need live testing). In this framework it must be in place before the developmental
      and operational test events that run on live networks or with live data (A-3 entry), and
      it does not authorize operational use.
    decided_by: PER-AO
    # Issued with SAP approval (A-2), before the live-network test events of A-3 (lead
    # decision, fan-out review of p3b alignment note c).
    decided_in: [A-2]
    phases: [PH-EMD]
    atd_required: true
    conditions_required: false
    effect: test
    applies_to: [system]
    requires: []
    atd_forbidden: false
    citations:
      - {ref: DODI8510.01, page: 18, anchor: "interim authorization to test, ATO, ATO with conditions"}
      - {ref: SP800-37R2, page: 162, anchor: "limited to the time needed to complete the testing objectives"}
      - {ref: SP800-37R2, page: 162, anchor: "restricting the system functionality to include only the functions that require live testing"}
  - id: AD-ATO
    name: Authorization to Operate
    short: ATO
    description: >-
      The risk of operating the system is acceptable; the system may operate for a specified
      period under the terms and conditions the AO sets, until the authorization termination
      date. The AO may shorten the termination date, downgrade or revoke the authorization at
      any time if risk conditions warrant. DoD IT and PIT systems update their ATO at least
      every three years depending on risk, and before the ATO the PM reviews an Intelligence
      Community threat assessment issued within the previous 12 months. Fielded systems need
      it before Milestone C and initial operational capability.
    decided_by: PER-AO
    decided_in: [R-4]
    phases: [PH-EMD, PH-PD, PH-OS]
    atd_required: true
    conditions_required: false
    effect: authorize
    applies_to: [system]
    requires: [threat_assessment]
    atd_forbidden: false
    max_term_days: 1096
    enforces:
      - REQ-DODI5000.90-0080
      - REQ-DODI5000.90-0081
      - REQ-DODI8500.01-0409
      - REQ-DODI8510.01-0222
      - REQ-SP800-18R1-0001
      - REQ-SP800-18R2-0332
      - REQ-SP800-37R2-0409
      - REQ-SP800-37R2-0629
    citations:
      - {ref: SP800-37R2, section: "Authorization to Operate"}
      - {ref: DODI8510.01, page: 18, anchor: "interim authorization to test, ATO, ATO with conditions"}
      - {ref: DODI8510.01, page: 28, anchor: "An AO may downgrade or revoke an authorization decision at any time"}
      - {ref: DODI5000.90, page: 11, anchor: "update their ATO at least every 3 years depending on risk"}
      - {ref: DODI5000.90, page: 11, anchor: "Before a program receives an ATO, the PM will review the program's most recent threat assessment"}
      - {ref: DODI8510.01, page: 13, anchor: "must receive and maintain a valid authorization before beginning operations"}
  - id: AD-ATOC
    name: Authorization to Operate with Conditions
    short: ATO w/ conditions
    description: >-
      An ATO whose acceptance of risk depends on specific conditions (for example remediation
      of named weaknesses by set dates, or operating restrictions) that the AO records and
      tracks. Each condition ties to POA&M items, whose execution the AO monitors; a missed
      condition date is a candidate event-driven trigger for AO review.
    decided_by: PER-AO
    decided_in: [R-4]
    phases: [PH-EMD, PH-PD, PH-OS]
    atd_required: true
    conditions_required: true
    effect: authorize
    applies_to: [system]
    requires: [threat_assessment]
    atd_forbidden: false
    max_term_days: 1096
    citations:
      - {ref: DODI8510.01, page: 18, anchor: "interim authorization to test, ATO, ATO with conditions"}
      - {ref: SP800-37R2, page: 93, anchor: "authorization termination date"}
      - {ref: DODI8510.01, page: 27, anchor: "Monitor and track the overall execution of system-level POA&Ms"}
      - {ref: SP800-37R2, page: 170, anchor: "event-driven triggers necessitate an immediate review"}
  - id: AD-DATO
    name: Denial of Authorization to Operate
    short: DATO
    description: >-
      The risk is unacceptable; the system is not authorized to operate, or must stop
      operating if it already does. An AO may also downgrade an existing authorization to a
      denial when monitoring shows the risk is no longer acceptable (R-4 or M-6).
    decided_by: PER-AO
    decided_in: [R-4, M-6]
    phases: [PH-EMD, PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: deny
    applies_to: [system]
    requires: []
    atd_forbidden: true
    enforces:
      - REQ-SP800-37R2-0454
      - REQ-SP800-37R2-0594
    citations:
      - {ref: SP800-37R2, section: "Denial of Authorization"}
      - {ref: DODI8510.01, page: 18, anchor: "and denial ATO"}
      - {ref: DODI8510.01, page: 28, anchor: "An AO may downgrade or revoke an authorization decision at any time"}
  - id: AD-CATO
    name: Continuous Authorization to Operate
    short: cATO
    description: >-
      Continuous authorization: with an ATO in place, the AO and Component CISO present the
      evidence (robust continuous monitoring of RMF controls, active cyber defense, an
      approved DevSecOps reference design) to the DoD CISO, whose approval removes the
      expiration date for as long as the real-time risk posture is maintained. It modifies
      re-authorization; it does not replace the underlying ATO, and it can be revoked (for poor
      posture, a change in risk tolerance or an incident) without losing the ATO. A secure
      software supply chain with an SBOM is part of the evidence. DoDI 5000.90 limits it to
      products with robust automated monitoring, currently in the software and defense business
      system pathways.
    decided_by: PER-AO
    decided_in: [M-6]
    phases: [PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: continuous
    applies_to: [system]
    requires: [underlying, review, dod_ciso_approval, component_ciso_notification]
    atd_forbidden: true
    allowed_pathways: [PW-SWP, PW-DBS]
    excluded_product_kinds: [software-enabled-hardware]
    enforces:
      - REQ-DODCIO-CATO-0010
      - REQ-DODCIO-CATO-0011
      - REQ-DODCIO-DEVSECOPS-0027
      - REQ-DODCIO-DEVSECOPS-0072
      - REQ-DODI5000.90-0101
    citations:
      - {ref: SP800-37R2, section: "TASK M-6"}
      - {ref: SP800-137, section: "2.2"}
      - {ref: DODCIO-CATO, page: 1, anchor: "the Authorizing Official (AO) must be able to demonstrate three main"}
      - {ref: DODCIO-CATO, page: 3, anchor: "DoD CISO approved cATOs do not have an expiration date"}
      - {ref: DODI5000.90, page: 13, anchor: "While the AO may authorize a continuous ATO (cATO)"}
      - {ref: DODCIO-CATO, page: 2, anchor: "the AO will notify the component CISO of the intention to move that system to a cATO"}
      - {ref: DODCIO-CATO, page: 3, anchor: "The cATO determination does not affect the underlying system ATO"}
      - {ref: DODCIO-CATO, page: 3, anchor: "A system can temporarily lose its cATO privilege without any loss of existing ATO"}
      - {ref: DODCIO-DEVSECOPS, page: 28, anchor: "cATO includes the need for a Secure Software Supply Chain (SSSC) and requires a Software Bill of Materials (SBOM)"}
  - id: AD-ATU
    name: Authorization to Use
    short: ATU
    description: >-
      A customer organization accepts the information in an existing authorization package
      produced by a provider organization, a form of reciprocity for shared or cloud systems,
      services and applications. It is issued in lieu of an ATO and requires a completed ATO by
      the provider. It carries the same risk responsibility and needs no termination date,
      remaining in effect while the customer accepts the risk.
    decided_by: PER-AO
    decided_in: [R-4]
    phases: [PH-EMD, PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: authorize
    applies_to: [system]
    requires: [provider]
    atd_forbidden: false
    enforces:
      - REQ-DODCIO-RECIPROCITY-0012
      - REQ-DODCIO-RECIPROCITY-0058
      - REQ-SP800-18R2-0338
      - REQ-SP800-37R2-0574
      - REQ-SP800-37R2-0580
      - REQ-SP800-37R2-0581
      - REQ-SP800-37R2-0588
      - REQ-SP800-37R2-0593
      - REQ-SP800-37R2-0607
    citations:
      - {ref: SP800-37R2, page: 163, anchor: "An authorization to use is employed when an organization"}
      - {ref: SP800-37R2, page: 164, anchor: "The authorization to use does not require a termination date"}
      - {ref: SP800-37R2, page: 165, anchor: "An ATU requires a completed ATO"}
      - {ref: SP800-37R2, page: 167, anchor: "An authorization to use is issued by an authorizing official from a customer organization in lieu of an authorization to operate"}
  - id: AD-DATU
    name: Denial of Authorization to Use
    short: DATU
    description: >-
      The customer organization finds the risk of using the provider's system or service
      unacceptable, so the system, service or application is not authorized for use.
    decided_by: PER-AO
    decided_in: [R-4, M-6]
    phases: [PH-EMD, PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: deny
    applies_to: [system]
    requires: [provider]
    atd_forbidden: true
    citations:
      - {ref: SP800-37R2, page: 165, anchor: "denial of authorization"}
  - id: AD-CCA
    name: Common Control Authorization
    short: CCA
    description: >-
      The risk of providing common controls for inheritance is acceptable. Common controls are
      authorized by a designated AO before they are made available for inheritance, for a
      specific period with a termination date set as a condition of the initial authorization.
      Controls implemented in a system need no separate authorization.
    decided_by: PER-AO
    decided_in: [R-4]
    phases: [PH-EMD, PH-PD, PH-OS]
    atd_required: true
    conditions_required: false
    effect: authorize
    applies_to: [common-controls]
    requires: []
    atd_forbidden: false
    enforces:
      - REQ-SP800-18R2-0339
      - REQ-SP800-18R2-0429
      - REQ-SP800-37R2-0203
      - REQ-SP800-37R2-0577
    citations:
      - {ref: SP800-37R2, page: 51, anchor: "Common controls are authorized by designated authorizing officials"}
      - {ref: SP800-37R2, page: 162, anchor: "A common control authorization is similar to an authorization to operate"}
      - {ref: SP800-37R2, page: 162, anchor: "Common controls are authorized for a specific time period"}
  - id: AD-DCCA
    name: Denial of Common Control Authorization
    short: DCCA
    description: >-
      The risk of providing the common controls is unacceptable, so they are not authorized and
      may not be offered for inheritance.
    decided_by: PER-AO
    decided_in: [R-4, M-6]
    phases: [PH-EMD, PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: deny
    applies_to: [common-controls]
    requires: []
    atd_forbidden: true
    enforces:
      - REQ-SP800-18R2-0340
    citations:
      - {ref: SP800-37R2, page: 92, anchor: "not authorized"}
  - id: AD-CONT
    name: Continued Authorization
    short: Continue
    description: >-
      Under ongoing authorization the AO reviews security and privacy information on an agreed
      frequency and on events, determines the risk stays acceptable, and continues the
      authorization. The first such record marks the transition to ongoing authorization: it
      is a new authorization decision, frees the authorization from its termination date, and
      records that the AO accepts the ongoing process. It rests on an initial authorization
      from a complete review.
    decided_by: PER-AO
    decided_in: [M-6]
    phases: [PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: continue
    applies_to: [system, common-controls]
    requires: [underlying, review, ongoing_acknowledgment]
    atd_forbidden: true
    enforces:
      - REQ-SP800-137-0110
      - REQ-SP800-37R2-0415
      - REQ-SP800-37R2-0417
      - REQ-SP800-37R2-0455
      - REQ-SP800-37R2-0578
      - REQ-SP800-37R2-0609
      - REQ-SP800-37R2-0610
      - REQ-SP800-37R2-0620
      - REQ-SP800-37R2-0622
      - REQ-SP800-37R2-0625
      - REQ-SP800-37R2-0629
      - REQ-SP800-37R2-0635
    citations:
      - {ref: SP800-37R2, page: 93, anchor: "Organizations may eliminate the authorization termination date"}
      - {ref: SP800-37R2, page: 168, anchor: "The transition to ongoing authorization is documented by the authorizing official by issuing a new authorization decision"}
      - {ref: SP800-37R2, page: 169, anchor: "time-driven authorization triggers refer to the frequency"}
      - {ref: SP800-37R2, page: 170, anchor: "event-driven triggers necessitate an immediate review"}
  - id: AD-RCATO
    name: Revocation of Continuous Authorization
    short: cATO revoked
    description: >-
      The AO or DoD CISO withdraws a cATO for poor posture, a change in risk tolerance or an
      incident. The system loses the cATO privilege, and its termination date with it, without
      losing the underlying ATO.
    decided_by: PER-AO
    decided_in: [M-6]
    phases: [PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: revoke-continuous
    applies_to: [system]
    requires: [underlying, revocation_reason]
    atd_forbidden: true
    citations:
      - {ref: DODCIO-CATO, page: 3, anchor: "A system can temporarily lose its cATO privilege without any loss of existing ATO"}
  - id: AD-RESC
    name: Rescission of Authorization
    short: Rescinded
    description: >-
      The AO revokes an authorization in force at any time because the risk is no longer
      acceptable. The system or common controls stop being authorized from that date, and the
      record of the earlier decision stays in the ledger.
    decided_by: PER-AO
    decided_in: [M-6]
    phases: [PH-PD, PH-OS]
    atd_required: false
    conditions_required: false
    effect: rescind
    applies_to: [system, common-controls]
    requires: [underlying, revocation_reason]
    atd_forbidden: true
    enforces:
      - REQ-DODI8510.01-0223
      - REQ-SP800-37R2-0594
    citations:
      - {ref: DODI8510.01, page: 28, anchor: "An AO may downgrade or revoke an authorization decision at any time"}
