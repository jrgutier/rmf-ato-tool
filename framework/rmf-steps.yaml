# RMF steps (SP 800-37r2 chapter 3; DoDI 8510.01 paragraph 3.2). IDs are the task prefixes.
steps:
  - id: P
    name: Prepare
    order: 1
    purpose: >-
      Set the organizational and system context and priorities for security and privacy risk
      management before the system is categorized. Organization-level tasks (P-1 to P-7)
      precede the program; system-level tasks (P-8 to P-18) run in MSA and early TMRR, most
      of them before Milestone A and the SRR, with requirements allocation (P-17) finished by
      the SFR.
    citations:
      - {ref: SP800-37R2, section: "3.1"}
      - {ref: DODI8510.01, page: 13, anchor: "Prepare to execute the RMF from an organizational and system-level perspective"}
      - {ref: SP800-37R2, section: "TABLE 1: PREPARE TASKS AND OUTCOMES—ORGANIZATION LEVEL"}
      - {ref: SP800-37R2, section: "TABLE 2: PREPARE TASKS AND OUTCOMES—SYSTEM LEVEL"}
  - id: C
    name: Categorize
    order: 2
    purpose: >-
      Describe the system and categorize it in accordance with CNSSI 1253 from the impact of a
      loss of confidentiality, integrity and availability. The AO-approved categorization is
      due by Milestone A.
    citations:
      - {ref: SP800-37R2, section: "3.2"}
      - {ref: DODI8510.01, section: "b. Categorize"}
      - {ref: SP800-37R2, section: "TABLE 3: CATEGORIZE TASKS AND OUTCOMES"}
  - id: S
    name: Select
    order: 3
    purpose: >-
      Select and tailor the initial control set, allocate controls, and document the planned
      implementations and the monitoring strategy in plans the AO approves. Select runs in
      TMRR and is complete by the PDR and Milestone B.
    citations:
      - {ref: SP800-37R2, section: "3.3"}
      - {ref: DODI8510.01, page: 15, anchor: "Choose an initial set of system controls"}
      - {ref: SP800-37R2, section: "TABLE 4: SELECT TASKS AND OUTCOMES"}
  - id: I
    name: Implement
    order: 4
    purpose: >-
      Implement the controls in the plans and record how they are employed in the system and
      its operating environment. Implement runs through EMD, designed in by the CDR and
      updated to the as-built state before test readiness.
    citations:
      - {ref: SP800-37R2, section: "3.4"}
      - {ref: DODI8510.01, page: 16, anchor: "Implement the controls and describe how the controls are employed"}
      - {ref: SP800-37R2, section: "TABLE 5: IMPLEMENT TASKS AND OUTCOMES"}
  - id: A
    name: Assess
    order: 5
    purpose: >-
      Assess whether controls are implemented correctly, operating as intended and producing the
      desired outcome, using developmental and operational test events where possible. The
      assessment plan is approved before the TRR so DT&E events can supply assessment evidence.
    citations:
      - {ref: SP800-37R2, section: "3.5"}
      - {ref: DODI8510.01, page: 17, anchor: "Assess the controls to determine whether they are being correctly implemented"}
      - {ref: SP800-37R2, section: "TABLE 6: ASSESS TASKS AND OUTCOMES"}
  - id: R
    name: Authorize
    order: 6
    purpose: >-
      Decide whether the risk to operations, assets, individuals, other organizations and the
      Nation is acceptable and cyberspace operational commanders' requirements are met. The
      decision precedes Milestone C and fielding; an AD-IATT covers earlier testing on live
      networks.
    citations:
      - {ref: SP800-37R2, section: "3.6"}
      - {ref: DODI8510.01, page: 18, anchor: "Authorize the system based on a determination of whether the risk"}
      - {ref: SP800-37R2, section: "TABLE 7: AUTHORIZE TASKS AND OUTCOMES"}
  - id: M
    name: Monitor
    order: 7
    purpose: >-
      Monitor the system and its controls on an ongoing basis, track changes, respond to risk and
      report the security and privacy posture. Monitor starts with fielding and runs through
      O&S to disposal.
    citations:
      - {ref: SP800-37R2, section: "3.7"}
      - {ref: DODI8510.01, page: 19, anchor: "Monitor the system and associated controls on an ongoing basis"}
      - {ref: SP800-37R2, section: "TABLE 8: MONITOR TASKS AND OUTCOMES"}
